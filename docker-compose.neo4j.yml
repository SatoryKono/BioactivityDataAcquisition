name: bioetl-neo4j

services:
  neo4j:
    image: neo4j:5.15-community
    container_name: bioetl-neo4j
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      NEO4J_USERNAME: ${NEO4J_USERNAME:?NEO4J_USERNAME is required}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?NEO4J_PASSWORD is required}
      NEO4J_AUTH: ${NEO4J_USERNAME:?NEO4J_USERNAME is required}/${NEO4J_PASSWORD:?NEO4J_PASSWORD is required}
      NEO4J_ACCEPT_LICENSE_AGREEMENT: "yes"
      # Heap memory configuration (initial and max)
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 2g
      # Page cache for graph data
      NEO4J_server_memory_pagecache_size: 1g
      # JVM GC tuning
      NEO4J_server_jvm_additional: "-XX:+UseG1GC -XX:G1HeapRegionSize=16m"
    restart: unless-stopped
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "cypher-shell -u \"$${NEO4J_USERNAME}\" -p \"$${NEO4J_PASSWORD}\" 'RETURN 1' > /dev/null 2>&1",
        ]
      interval: 30s
      timeout: 20s
      retries: 10
      start_period: 180s
    networks:
      - warp-network

volumes:
  neo4j_data:
  neo4j_logs:

networks:
  warp-network:
    external: true
    name: warp-network
