services:
  neo4j:
    image: neo4j:5.13-community
    container_name: bioetl-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      # Standard Neo4j 5.13 auth setup
      NEO4J_AUTH: neo4j/bioetl_secure_password
      NEO4J_ACCEPT_LICENSE_AGREEMENT: "yes"
      # Keep the footprint modest, but leave enough headroom for deterministic sync/audit.
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 128m
    # Ephemeral - no volumes (data lost on restart, MCP uses file fallback)
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:7474"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s
    restart: no
    mem_limit: 2g
    cpus: "1.0"
