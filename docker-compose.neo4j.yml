name: bioetl-neo4j

services:
  neo4j:
    image: neo4j:5.15-community@sha256:d9e2fb1ba398536e50d22ebc3d5d585baa086c1c0cf8e5b96bdc9e11e87e002a
    container_name: bioetl-neo4j
    # Image already uses tini as ENTRYPOINT; do not add compose `init: true`
    # (double-init caused restart loops with "Neo4j is already running (pid:7)").
    entrypoint:
      - /bin/bash
      - -eu
      - -c
      - |
        # Clear stale PID after unclean Docker Desktop / WSL restarts.
        rm -f "$${NEO4J_HOME:-/var/lib/neo4j}/run/neo4j.pid" \
              "$${NEO4J_HOME:-/var/lib/neo4j}/run/"*.pid 2>/dev/null || true
        # Drop leftover store_lock only when no live process holds the DB.
        if [[ ! -f /var/run/neo4j.pid ]]; then
          rm -f /data/databases/store_lock 2>/dev/null || true
        fi
        exec /startup/docker-entrypoint.sh neo4j
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      BIOETL_NEO4J_USERNAME: ${NEO4J_USERNAME:?NEO4J_USERNAME is required}
      BIOETL_NEO4J_PASSWORD: ${NEO4J_PASSWORD:?NEO4J_PASSWORD is required}
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?NEO4J_PASSWORD is required}
      NEO4J_ACCEPT_LICENSE_AGREEMENT: "yes"
      # Sized for co-tenancy with main+monitoring on typical Desktop hosts.
      # Previous 2g heap + 1g pagecache + 4g limit caused multi-minute STW
      # pauses and restart loops under memory pressure.
      # Keep JVM well under container mem_limit so the Linux VM is not OOM-killed.
      NEO4J_server_memory_heap_initial__size: 192m
      NEO4J_server_memory_heap_max__size: 384m
      NEO4J_server_memory_pagecache_size: 96m
      NEO4J_server_jvm_additional: "-XX:+UseG1GC -XX:G1HeapRegionSize=8m -XX:+ExitOnOutOfMemoryError"
    restart: unless-stopped
    mem_limit: 768m
    mem_reservation: 384m
    cpus: 1.0
    pids_limit: 384
    # Image already ships tini as ENTRYPOINT; compose init would double-init.
    init: false
    stop_grace_period: 90s
    logging: {driver: local, options: {max-size: "20m", max-file: "5"}}
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      # Full path required: healthcheck shell runs as root without neo4j PATH.
      test:
        [
          "CMD-SHELL",
          "/var/lib/neo4j/bin/cypher-shell -u \"$${BIOETL_NEO4J_USERNAME}\" -p \"$${BIOETL_NEO4J_PASSWORD}\" 'RETURN 1' > /dev/null 2>&1",
        ]
      interval: 30s
      timeout: 20s
      retries: 10
      start_period: 180s
    networks:
      - runtime

volumes:
  neo4j_data:
  neo4j_logs:

networks:
  runtime:
    external: true
    name: bioetl-runtime
