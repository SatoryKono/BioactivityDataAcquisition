# Neo4j for MCP Memory - Production Ready
# Data is ephemeral (no volumes) - MCP uses file fallback for persistence

services:
  neo4j:
    image: neo4j:5.13-community
    container_name: bioetl-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      # DO NOT use NEO4J_AUTH env var - causes restart conflicts
      # Instead, use default credentials and change via API if needed
      NEO4J_INITIAL_PASSWORD: bioetl_secure_password
      NEO4J_ACCEPT_LICENSE_AGREEMENT: "yes"
      # Minimal memory (stable on Windows Docker)
      NEO4J_server_memory_heap_initial__size: 128m
      NEO4J_server_memory_heap_max__size: 256m
      NEO4J_server_memory_pagecache_size: 64m
      # Do NOT reinitialize password on restart
      NEO4J_dbms_security_auth__provider: native
    # Ephemeral - no volumes (data lost on restart, file fallback catches important data)
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:7474"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s
    restart: no
    mem_limit: 1g
    cpus: "1.0"
