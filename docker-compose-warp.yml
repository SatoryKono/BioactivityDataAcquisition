version: '3.8'

services:
  warp:
    image: cloudflare/warp:latest
    container_name: cloudflare-warp
    privileged: true
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
      - NET_RAW
    environment:
      - WARP_ENABLE_BIND_MOUNT_SECRETS=true
    volumes:
      - warp_data:/var/lib/cloudflare-warp
    networks:
      - warp_network
    restart: unless-stopped

  # Example application routing through WARP
  app:
    image: curlimages/curl:latest
    container_name: app-with-warp
    depends_on:
      - warp
    network_mode: "container:cloudflare-warp"
    environment:
      - HTTP_PROXY=http://127.0.0.1:40000
      - HTTPS_PROXY=http://127.0.0.1:40000
    entrypoint: /bin/sh -c "while true; do sleep 1000; done"
    restart: unless-stopped

  # Optional: proxy to expose WARP tunnel
  tinyproxy:
    image: tinyproxy:latest
    container_name: warp-proxy
    depends_on:
      - warp
    volumes:
      - ./tinyproxy.conf:/etc/tinyproxy/tinyproxy.conf:ro
    ports:
      - "8888:8888"
    networks:
      - warp_network
    restart: unless-stopped

volumes:
  warp_data:

networks:
  warp_network:
    driver: bridge
