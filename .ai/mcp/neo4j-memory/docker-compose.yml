version: '3.8'

services:
  neo4j:
    image: neo4j:${NEO4J_VERSION:-5.15-community}
    container_name: bioetl-neo4j
    restart: unless-stopped
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - neo4j-data:/var/lib/neo4j/data
      - neo4j-logs:/var/lib/neo4j/logs
      - neo4j-import:/var/lib/neo4j/import
    environment:
      # Memory Configuration
      NEO4J_server_memory_heap_initial__size: ${NEO4J_HEAP_INITIAL:-512m}
      NEO4J_server_memory_heap_max__size: ${NEO4J_HEAP_MAX:-2g}
      NEO4J_server_memory_pagecache_size: ${NEO4J_PAGECACHE:-1g}
      NEO4J_dbms_memory_transaction_max__size: ${NEO4J_TX_MAX_SIZE:-2g}
      
      # Authentication
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/bioetl_secure_password}
      
      # Server Configuration
      NEO4J_dbms_default__database: ${NEO4J_DEFAULT_DB:-neo4j}
      NEO4J_server_bolt_listen__address: 0.0.0.0:7687
      NEO4J_server_http_listen__address: 0.0.0.0:7474
      
      # Performance Tuning
      NEO4J_dbms_memory_transaction_global__max__size: ${NEO4J_GLOBAL_TX_MAX:-20g}
      NEO4J_dbms_transaction_log_rotation_retention__policy: ${NEO4J_LOG_ROTATION:-7d}
      NEO4J_server_jvm_additional: ${NEO4J_JVM_OPTS:--XX:+UseG1GC -XX:G1HeapRegionSize=16m}
      
      # Additional Settings
      NEO4J_ACCEPT_LICENSE_AGREEMENT: "yes"
    networks:
      - bioetl-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:7474/browser/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  neo4j-mcp:
    build:
      context: .
      dockerfile: .ai/mcp/neo4j-memory/Dockerfile
    container_name: bioetl-neo4j-mcp
    restart: unless-stopped
    ports:
      - "${NEO4J_MCP_SERVER_PORT:-8000}:8000"
    environment:
      # Neo4j connection
      NEO4J_URL: ${NEO4J_URL:-bolt://neo4j:7687}
      NEO4J_USERNAME: ${NEO4J_USERNAME:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-bioetl_secure_password}
      NEO4J_DATABASE: ${NEO4J_DATABASE:-neo4j}
      
      # MCP Server settings
      NEO4J_TRANSPORT: ${NEO4J_TRANSPORT:-stdio}
      NEO4J_MCP_SERVER_HOST: ${NEO4J_MCP_SERVER_HOST:-0.0.0.0}
      NEO4J_MCP_SERVER_PORT: ${NEO4J_MCP_SERVER_PORT:-8000}
      
      # Logging
      PYTHONUNBUFFERED: "1"
    depends_on:
      neo4j:
        condition: service_healthy
    networks:
      - bioetl-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  bioetl-network:
    driver: bridge

volumes:
  neo4j-data:
  neo4j-logs:
  neo4j-import:
