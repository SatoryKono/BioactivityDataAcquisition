# Portable project-scoped Codex settings for trusted repository sessions.
# Authentication, model selection, providers, and user MCP credentials remain
# user-scoped and MUST NOT be committed here.
#
# `max_threads` is the portable project default. Keep it at three unless a
# versioned compatibility check and a concurrency benchmark prove a change is
# safe; user model, auth, provider, and MCP configuration stay user-local.

[agents]
max_threads = 3
