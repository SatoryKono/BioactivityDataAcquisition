# Portable project-scoped Codex settings for trusted repository sessions.
# Authentication, model selection, providers, and user MCP credentials remain
# user-scoped and MUST NOT be committed here.
#
# Codex CLI 0.118 accepts the legacy alias `max_threads` under [agents].
# The newer key `max_concurrent_threads_per_session` is documented but rejected
# by 0.118 with: expected struct AgentRoleToml in `agents`.

[agents]
max_threads = 3
