problem:
  id: "ARCH-003"
  category: "ARCH"
  title: "Missing 'dataset' field in Logging"
  description: |
    `RULES.md` §3.2.1 specifies `dataset` as a SHOULD field in the log schema, but `UnifiedLogger` does not implement it, preventing standardization of dataset-level observability.

  validation:
    commit_hash: "HEAD"
    validated_at: "2025-12-30"

    code_evidence:
      commands_executed:
        - command: "grep 'dataset' unified_logger.py"
          output: "None"
      files_examined:
        - path: "src/bioetl/infrastructure/observability/unified_logger.py"
          finding: "Missing argument"
      code_verdict: "CONFIRMED"

    doc_evidence:
      rules_md:
        section: "§3.2.1"
        states: "dataset | SHOULD"
        code_matches: false
      doc_verdict: "CONFIRMED"

    test_evidence:
      test_verdict: "CONFIRMED"

    triangulation:
      code_weight: 40
      doc_weight: 30
      test_weight: 30
      total_confirmed: "100%"
      final_verdict: "VALID"
      confidence: "HIGH"

  impact:
    severity: "Low"
    affected_components:
      - "Observability"
    risk_if_unfixed: |
      Inconsistent logging context for dataset-specific operations.

  assessment:
    complexity: 2
    effort_days: 0.5
    priority: "P2"
    dependencies: []

  resolution:
    approach: |
      Update `UnifiedLogger` to accept `dataset` in `log` method and bind it if present.
    steps:
      - step: "Modify UnifiedLogger.log"
        verification: "Test logs contain dataset"
    breaking_changes: false
    migration_required: false
    tests_to_add:
      - "tests/unit/infrastructure/observability/test_unified_logger.py"
