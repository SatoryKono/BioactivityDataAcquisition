services:
  prometheus:
    image: prom/prometheus:latest
    container_name: bioetl-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./grafana/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./grafana/prometheus-rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-admin-api'
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - monitoring
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  pushgateway:
    image: prom/pushgateway:latest
    container_name: bioetl-pushgateway
    ports:
      - "9091:9091"
    networks:
      - monitoring
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9091/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  quarantine-explorer:
    build:
      context: .
      dockerfile: Dockerfile.bioetl
    container_name: bioetl-quarantine-explorer
    command: ["quarantine", "serve", "--host", "0.0.0.0", "--port", "8081"]
    ports:
      - "8081:8081"
    environment:
      - BIOETL_PROMETHEUS_URL=http://prometheus:9090
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health/live', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      monitoring:
        aliases:
          - quarantine-explorer
    restart: unless-stopped

  loki:
    image: grafana/loki:3.7.0
    container_name: bioetl-loki
    profiles: ["tracing"]
    ports:
      - "3100:3100"
    command:
      - "-config.file=/etc/loki/config.yml"
    volumes:
      - ./grafana/loki-config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    networks:
      - monitoring
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.6.8
    container_name: bioetl-promtail
    profiles: ["tracing"]
    command:
      - "-config.file=/etc/promtail/config.yml"
    volumes:
      - ./grafana/promtail-config.yml:/etc/promtail/config.yml:ro
      - ./logs:/workspace-logs:ro
      - ./reports/logs:/workspace-report-logs:ro
    depends_on:
      - loki
    networks:
      - monitoring
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.10.3
    container_name: bioetl-tempo
    profiles: ["tracing"]
    user: "0"
    ports:
      - "3200:3200"
      - "4317:4317"
    command:
      - "-config.file=/etc/tempo/config.yml"
    volumes:
      - ./grafana/tempo.yml:/etc/tempo/config.yml:ro
      - tempo-data:/tmp/tempo
    networks:
      - monitoring
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.0.0
    container_name: bioetl-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_METRICS_ENABLED=true
      # Grafana 12+ startup plugin installer flag.
      - GF_PLUGINS_PREINSTALL=yesoreyeram-infinity-datasource
      # Backward compatibility with older Grafana container startup scripts.
      - GF_INSTALL_PLUGINS=yesoreyeram-infinity-datasource
      - GF_LOG_LEVEL=info
      - GF_SERVER_ROOT_URL=http://localhost:3000
      - GF_SERVER_SERVE_FROM_SUB_PATH=false
      - GF_RENDERING_SERVER_URL=http://renderer:8081/render
      - GF_RENDERING_CALLBACK_URL=http://grafana:3000/
      - GF_RENDERING_RENDERER_TOKEN=${GF_RENDERING_RENDERER_TOKEN:-bioetl-local-renderer-token}
      - BIOETL_ENABLE_TRACING_DATASOURCES=${BIOETL_ENABLE_TRACING_DATASOURCES:-auto}
      - BIOETL_QUARANTINE_EXPLORER_URL=${BIOETL_QUARANTINE_EXPLORER_URL:-http://quarantine-explorer:8081}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning/datasources-core:/etc/bioetl-grafana/datasources-core:ro
      - ./grafana/provisioning/datasources-tracing:/etc/bioetl-grafana/datasources-tracing:ro
      - ./grafana/scripts/bootstrap-datasources.sh:/usr/local/bin/bioetl-bootstrap-grafana.sh:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/bioetl-bootstrap-grafana.sh"]
    depends_on:
      prometheus:
        condition: service_healthy
      pushgateway:
        condition: service_healthy
      renderer:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - monitoring
    restart: unless-stopped

  renderer:
    image: grafana/grafana-image-renderer:latest
    container_name: bioetl-grafana-renderer
    shm_size: "1gb"
    environment:
      - ENABLE_METRICS=true
      - HTTP_HOST=0.0.0.0
      - AUTH_TOKEN=${GF_RENDERING_RENDERER_TOKEN:-bioetl-local-renderer-token}
      - BROWSER_FLAGS=--no-sandbox,--disable-dev-shm-usage
      - GOMEMLIMIT=${GRAFANA_IMAGE_RENDERER_GOMEMLIMIT:-1GiB}
    networks:
      - monitoring
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
  loki-data:
  tempo-data:

networks:
  monitoring:
    external: true
    name: bioetl-monitoring
