name: bioetl-monitoring

services:
  prometheus:
    image: prom/prometheus:v3.13.1@sha256:3c42b892cf723fa54d2f262c37a0e1f80aa8c8ddb1da7b9b0df9455a35a7f893
    container_name: bioetl-prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./grafana/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./grafana/prometheus-rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-admin-api'
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 15s
      retries: 10
      start_period: 60s
    networks:
      - monitoring
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    mem_limit: 10g
    mem_reservation: 512m
    cpus: 8.0
    pids_limit: 2560
    init: true
    stop_grace_period: 120s
    logging: {driver: json-file, options: {max-size: "200m", max-file: "10"}}

  pushgateway:
    image: prom/pushgateway:v1.11.3@sha256:74fa117cef2d7e383112d25139ff1c2d2e309c35389a9e0554a47136a1482e48
    container_name: bioetl-pushgateway
    ports:
      - "127.0.0.1:9091:9091"
    networks:
      - monitoring
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9091/-/healthy"]
      interval: 30s
      timeout: 15s
      retries: 10
      start_period: 60s
    mem_limit: 2560m
    mem_reservation: 128m
    cpus: 5.0
    pids_limit: 1280
    init: true
    stop_grace_period: 120s
    logging: {driver: json-file, options: {max-size: "100m", max-file: "10"}}

  loki:
    image: grafana/loki:3.7.0@sha256:c316b7c7589a5eeca843b6926c7446149d18300b79ac8538dc4ae063bc478da2
    profiles: ["tracing"]
    ports:
      - "127.0.0.1:3100:3100"
    command:
      - "-config.file=/etc/loki/config.yml"
    volumes:
      - ./grafana/loki-config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    networks:
      - monitoring
    restart: unless-stopped
    healthcheck:
      test:
        - "CMD-SHELL"
        - "wget --quiet --tries=1 --timeout=2 -O /dev/null http://localhost:3100/ready"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s
    mem_limit: 768m
    mem_reservation: 384m
    cpus: 7.5
    pids_limit: 2560
    init: true
    stop_grace_period: 120s
    logging: {driver: local, options: {max-size: "100m", max-file: "10"}}

  promtail:
    image: grafana/promtail:3.6.8@sha256:6cfa64ec432b24a912d640e2edb940eeae2666f61861a66c121d763dd7241381
    profiles: ["tracing"]
    command:
      - "-config.file=/etc/promtail/config.yml"
    volumes:
      - ./grafana/promtail-config.yml:/etc/promtail/config.yml:ro
      - ./logs:/workspace-logs:ro
      - ./reports/logs:/workspace-report-logs:ro
    depends_on:
      loki:
        condition: service_healthy
    networks:
      - monitoring
    restart: unless-stopped
    healthcheck:
      disable: true
    mem_limit: 2560m
    mem_reservation: 128m
    cpus: 5.0
    pids_limit: 1280
    init: true
    stop_grace_period: 120s
    logging: {driver: local, options: {max-size: "100m", max-file: "10"}}

  tempo:
    image: grafana/tempo:2.10.3@sha256:cac9de2ac9f6da8efca5b64b690a7cb8c786a0c49cac7b4517dd1b0089a6c703
    profiles: ["tracing"]
    user: "0"
    ports:
      - "127.0.0.1:3200:3200"
      - "127.0.0.1:4317:4317"
    command:
      - "-config.file=/etc/tempo/config.yml"
    volumes:
      - ./grafana/tempo.yml:/etc/tempo/config.yml:ro
      - tempo-data:/tmp/tempo
    networks:
      - monitoring
    restart: unless-stopped
    healthcheck:
      disable: true
    mem_limit: 7680m
    mem_reservation: 384m
    cpus: 7.5
    pids_limit: 2560
    init: true
    stop_grace_period: 120s
    logging: {driver: local, options: {max-size: "100m", max-file: "10"}}

  grafana:
    image: grafana/grafana:12.0.0@sha256:263cbefd5d9b179893c47c415daab4da5c1f3d6770154741eca4f45c81119884
    container_name: bioetl-grafana
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_METRICS_ENABLED=true
      - GF_PLUGINS_PREINSTALL=yesoreyeram-infinity-datasource
      - GF_LOG_LEVEL=info
      - GF_SERVER_ROOT_URL=http://localhost:3000
      - GF_SERVER_SERVE_FROM_SUB_PATH=false
      - GF_RENDERING_SERVER_URL=http://renderer:8081/render
      - GF_RENDERING_CALLBACK_URL=http://grafana:3000/
      - GF_RENDERING_RENDERER_TOKEN=${GF_RENDERING_RENDERER_TOKEN:?GF_RENDERING_RENDERER_TOKEN is required}
      - BIOETL_ENABLE_TRACING_DATASOURCES=${BIOETL_ENABLE_TRACING_DATASOURCES:-auto}
      - BIOETL_QUARANTINE_EXPLORER_URL=${BIOETL_QUARANTINE_EXPLORER_URL:-http://quarantine-explorer:8081}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning/datasources-core:/etc/bioetl-grafana/datasources-core:ro
      - ./grafana/provisioning/datasources-tracing:/etc/bioetl-grafana/datasources-tracing:ro
      - ./grafana/scripts/bootstrap-datasources.sh:/usr/local/bin/bioetl-bootstrap-grafana.sh:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/bioetl-bootstrap-grafana.sh"]
    depends_on:
      prometheus:
        condition: service_healthy
      pushgateway:
        condition: service_healthy
      renderer:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 15s
      retries: 10
      start_period: 120s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - monitoring
    restart: unless-stopped
    mem_limit: 7680m
    mem_reservation: 384m
    cpus: 8.0
    pids_limit: 2560
    init: true
    stop_grace_period: 120s
    logging: {driver: local, options: {max-size: "200m", max-file: "10"}}

  renderer:
    image: grafana/grafana-image-renderer@sha256:c0c920e6974b0d30ae25313051344afcd2054362529968ebd9545a4b2bc8119b
    shm_size: "4gb"
    environment:
      - ENABLE_METRICS=true
      - HTTP_HOST=0.0.0.0
      - AUTH_TOKEN=${GF_RENDERING_RENDERER_TOKEN:?GF_RENDERING_RENDERER_TOKEN is required}
      - BROWSER_FLAGS=--no-sandbox,--disable-dev-shm-usage
      - BROWSER_READINESS_TIMEOUT=${GRAFANA_IMAGE_RENDERER_READINESS_TIMEOUT:-180s}
      - GOMEMLIMIT=${GRAFANA_IMAGE_RENDERER_GOMEMLIMIT:-10GiB}
    networks:
      - monitoring
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "grafana-image-renderer", "healthcheck"]
      interval: 30s
      timeout: 15s
      retries: 10
      start_period: 180s
    mem_limit: 15360m
    mem_reservation: 768m
    cpus: 8.0
    pids_limit: 5120
    init: true
    stop_grace_period: 120s
    logging: {driver: local, options: {max-size: "200m", max-file: "10"}}

volumes:
  prometheus-data:
  grafana-data:
  loki-data:
  tempo-data:

networks:
  monitoring:
    external: true
    name: bioetl-monitoring
