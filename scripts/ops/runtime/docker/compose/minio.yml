name: bioetl-minio

services:
  minio:
    image: minio/minio:latest@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER before starting scripts/ops/runtime/docker/compose/minio.yml}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD before starting scripts/ops/runtime/docker/compose/minio.yml}
      MINIO_REGION_NAME: us-east-1
      MINIO_PROMETHEUS_AUTH_TYPE: public
    command: minio server /minio-data --console-address ":9001"
    volumes:
      - minio-data:/minio-data
    networks:
      - monitoring
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:9000/minio/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    mem_limit: 1g
    mem_reservation: 512m
    cpus: 1.0
    pids_limit: 256
    init: true
    stop_grace_period: 30s
    logging: {driver: local, options: {max-size: "20m", max-file: "5"}}

volumes:
  minio-data:

networks:
  monitoring:
    external: true
    name: bioetl-monitoring
