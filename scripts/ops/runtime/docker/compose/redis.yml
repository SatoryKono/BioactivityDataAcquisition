name: bioetl-redis

services:
  redis:
    image: redis:7.2-alpine@sha256:dfa18828cbc07b3ae6a95ec7343f6c214fdee2d836197b4be8e9904420762cd8
    ports:
      - "127.0.0.1:6379:6379"
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?Set REDIS_PASSWORD before starting scripts/ops/runtime/docker/compose/redis.yml}
    volumes:
      - redis-data:/data
    networks:
      - monitoring
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?Set REDIS_PASSWORD before starting scripts/ops/runtime/docker/compose/redis.yml}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 0.50
    pids_limit: 128
    init: true
    stop_grace_period: 30s
    logging: {driver: local, options: {max-size: "10m", max-file: "3"}}
    environment:
      - REDIS_REPLICATION_DISKLESS_SYNC=no
      - REDIS_TCP_KEEPALIVE=300
      - REDIS_TIMEOUT=0

  redis-exporter:
    image: oliver006/redis_exporter:latest@sha256:2e9795be900db073e9475fdb9c5124db309b07a3e4e75a1770705cb03be1a1c8
    ports:
      - "127.0.0.1:9121:9121"
    environment:
      - REDIS_ADDR=redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD before starting scripts/ops/runtime/docker/compose/redis.yml}@redis:6379
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - monitoring
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9121/metrics"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 15s
    mem_limit: 128m
    mem_reservation: 64m
    cpus: 0.25
    pids_limit: 64
    init: true
    stop_grace_period: 15s
    logging: {driver: local, options: {max-size: "10m", max-file: "3"}}

volumes:
  redis-data:

networks:
  monitoring:
    external: true
    name: bioetl-monitoring
