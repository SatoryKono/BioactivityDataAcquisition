services:
  quarantine-explorer-audit:
    profiles: ["audit"]
    build:
      context: .
      dockerfile: Dockerfile.bioetl
    container_name: bioetl-quarantine-explorer-audit
    command:
      - "quarantine"
      - "serve"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8081"
      - "--data-root"
      - "${BIOETL_AUDIT_DATA_ROOT:?Pass an explicit absolute data root}"
    ports:
      - "127.0.0.1:18081:8081"
    environment:
      - BIOETL_PROMETHEUS_URL=http://prometheus:9090
    volumes:
      - "${BIOETL_AUDIT_DATA_ROOT:?Pass an explicit absolute data root}:${BIOETL_AUDIT_DATA_ROOT:?Pass an explicit absolute data root}:ro"
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/ops/control-plane/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - monitoring
    restart: unless-stopped
    mem_limit: 1536m
    mem_reservation: 768m
    cpus: 2.0
    pids_limit: 512
    init: true
    stop_grace_period: 30s
    logging: {driver: local, options: {max-size: "20m", max-file: "5"}}

  loki:
    profiles: ["tracing", "audit"]

  promtail-audit:
    image: grafana/promtail:3.6.8@sha256:6cfa64ec432b24a912d640e2edb940eeae2666f61861a66c121d763dd7241381
    container_name: bioetl-promtail-audit
    profiles: ["audit"]
    command:
      - "-config.file=/etc/promtail/config.yml"
    volumes:
      - ./grafana/promtail-config.yml:/etc/promtail/config.yml:ro
      - "${BIOETL_AUDIT_LOG_ROOT:?Pass an explicit absolute log root}:/audit-logs:ro"
      - "${BIOETL_AUDIT_PROBE_LOG_ROOT:?Pass an explicit absolute probe log root}:/audit-probe:ro"
    ports:
      - "127.0.0.1:19080:9080"
    depends_on:
      loki:
        condition: service_healthy
    networks:
      - monitoring
    restart: unless-stopped
    healthcheck:
      disable: true
    mem_limit: 256m
    mem_reservation: 128m
    cpus: 0.50
    pids_limit: 128
    init: true
    stop_grace_period: 20s
    logging: {driver: local, options: {max-size: "10m", max-file: "3"}}

  grafana:
    environment:
      - BIOETL_QUARANTINE_EXPLORER_URL=http://quarantine-explorer-audit:8081
    depends_on:
      quarantine-explorer-audit:
        condition: service_healthy
