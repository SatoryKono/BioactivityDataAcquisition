services:
  mistral-ollama:
    image: ollama/ollama:latest
    container_name: mistral-ollama
    restart: unless-stopped
    ports:
      - "${MISTRALL_PORT:-11434}:11434"
    environment:
      - OLLAMA_KEEP_ALIVE=24h
    volumes:
      - ollama-data:/root/.ollama
    entrypoint: ["ollama", "serve"]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  ollama-data:
    driver: local
