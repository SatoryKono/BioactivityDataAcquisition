# Example Cloudflare Tunnel Configuration for BioETL
# Copy this file to config.yml and customize for your needs

# Replace with your actual Tunnel ID from: cloudflared tunnel create bioetl-local
tunnel: YOUR_TUNNEL_ID_HERE

# Path to credentials file (auto-generated by cloudflared)
credentials-file: C:\Users\YOUR_USERNAME\.cloudflared\YOUR_TUNNEL_ID.json

ingress:
  # Example configurations for common BioETL services
  # Uncomment and customize as needed
  
  # Grafana Dashboard
  # - hostname: grafana.yourdomain.com
  #   service: http://localhost:3000
  #   originRequest:
  #     noTLSVerify: true
  
  # Prometheus Metrics
  # - hostname: prometheus.yourdomain.com
  #   service: http://localhost:9090
  #   originRequest:
  #     noTLSVerify: true
  
  # Local BioETL API/Interface
  # - hostname: bioetl.yourdomain.com
  #   service: http://localhost:8000
  #   originRequest:
  #     noTLSVerify: true
  
  # Jupyter Notebook (if used)
  # - hostname: jupyter.yourdomain.com
  #   service: http://localhost:8888
  #   originRequest:
  #     noTLSVerify: true
  
  # Additional local services
  # - hostname: service.yourdomain.com
  #   service: http://localhost:PORT
  #   originRequest:
  #     noTLSVerify: true
  
  # Fallback for all other requests (must be last)
  - service: http_status:404