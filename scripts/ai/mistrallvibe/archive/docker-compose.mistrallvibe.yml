services:
  mistral-vibe:
    image: ghcr.io/open-webui/open-webui:latest
    container_name: mistral-vibe
    restart: unless-stopped
    ports:
      - "${VIBE_PORT:-8080}:8080"
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    volumes:
      - vibe-data:/app/backend/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  vibe-data:
    driver: local
