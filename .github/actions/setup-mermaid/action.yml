name: Setup Mermaid CLI
description: >
  Composite action that sets up Node.js, installs Mermaid CLI, Puppeteer
  Chrome headless shell, and creates the Puppeteer config. Replaces duplicated
  Mermaid setup steps across diagram workflows.

inputs:
  mermaid-version:
    description: Mermaid CLI version to install
    required: false
    default: "10.6.1"
  install-librsvg:
    description: Install librsvg2-bin and svgo for SVG optimization
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
      with:
        node-version: "20"

    - name: Install Mermaid CLI
      shell: bash
      env:
        MERMAID_VERSION: ${{ inputs.mermaid-version }}
        INSTALL_LIBRSVG: ${{ inputs.install-librsvg }}
      run: |
        set -euo pipefail
        # Install into a local prefix with a generated lockfile (Sonar S8543/S6505).
        TOOL_DIR="${RUNNER_TEMP}/mermaid-cli"
        mkdir -p "${TOOL_DIR}"
        cd "${TOOL_DIR}"
        npm init -y >/dev/null
        npm install --ignore-scripts --no-fund --no-audit \
          "@mermaid-js/mermaid-cli@${MERMAID_VERSION}"
        # `--ignore-scripts` deliberately suppresses lifecycle hooks. Run the
        # pinned CLI's own Puppeteer installer explicitly, then fail closed if
        # its exact browser revision is unavailable.
        node node_modules/puppeteer/install.js
        PUPPETEER_EXECUTABLE="$(
          node -e 'process.stdout.write(require("puppeteer").executablePath())'
        )"
        test -x "${PUPPETEER_EXECUTABLE}"
        if [ "$INSTALL_LIBRSVG" = "true" ]; then
          npm install --ignore-scripts --no-fund --no-audit svgo@3.3.2
          sudo apt-get update -qq && sudo apt-get install -y -qq librsvg2-bin
        fi
        echo "${TOOL_DIR}/node_modules/.bin" >> "$GITHUB_PATH"

    - name: Create Puppeteer config
      shell: bash
      run: |
        cat > /tmp/puppeteer-config.json << 'EOF'
        {
          "args": ["--no-sandbox", "--disable-setuid-sandbox", "--disable-dev-shm-usage", "--disable-gpu"]
        }
        EOF
