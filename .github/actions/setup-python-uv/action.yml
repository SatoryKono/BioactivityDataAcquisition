name: Setup Python + uv
description: >
  Composite action that sets up Python, installs uv, caches dependencies,
  and installs project packages. Replaces duplicated setup steps across workflows.

inputs:
  python-version:
    description: Python version to install
    required: false
    default: "3.12"
  uv-extras:
    description: "Space-separated uv extras to install (e.g. 'dev tracing performance')"
    required: false
    default: "dev tracing"
  enable-pytest-cache:
    description: Enable pytest/hypothesis cache restoration
    required: false
    default: "false"
  pytest-cache-prefix:
    description: Cache key prefix for pytest cache (to differentiate cache scopes)
    required: false
    default: "pytest"
  pytest-cache-fingerprint:
    description: Optional precomputed fingerprint for pytest/hypothesis cache invalidation scope
    required: false
    default: ""
  uv-sync-args:
    description: "Additional args for uv sync (e.g. '--frozen'). Default: '--frozen'"
    required: false
    default: "--frozen"

runs:
  using: composite
  steps:
    - name: Set up Python ${{ inputs.python-version }}
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@v7

    - name: Cache uv and virtualenv
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: |
          ~/.cache/uv
          .venv
        key: uv-${{ runner.os }}-py${{ inputs.python-version }}-${{ hashFiles('uv.lock') }}
        restore-keys: |
          uv-${{ runner.os }}-py${{ inputs.python-version }}-

    - name: Pin UV_PYTHON for subsequent steps
      shell: bash
      env:
        INPUT_PYTHON_VERSION: ${{ inputs.python-version }}
      run: |
        case "$INPUT_PYTHON_VERSION" in
          ''|*[!0-9.]*)
            echo "Invalid python-version input: $INPUT_PYTHON_VERSION" >&2
            exit 1
            ;;
        esac
        printf 'UV_PYTHON=%s\n' "$INPUT_PYTHON_VERSION" >> "$GITHUB_ENV"

    - name: Install dependencies
      shell: bash
      env:
        EXTRAS: ${{ inputs.uv-extras }}
        SYNC_ARGS: ${{ inputs.uv-sync-args }}
      run: |
        CMD="uv sync ${SYNC_ARGS}"
        for extra in $EXTRAS; do
          CMD="${CMD} --extra ${extra}"
        done
        echo "Running: ${CMD}"
        ${CMD}

    - name: Cache pytest and hypothesis
      if: inputs.enable-pytest-cache == 'true'
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: |
          .pytest_cache
          .hypothesis
        key: ${{ inputs.pytest-cache-prefix }}-${{ runner.os }}-py${{ inputs.python-version }}-${{ inputs.pytest-cache-fingerprint != '' && inputs.pytest-cache-fingerprint || hashFiles('tests/**/*.py') }}
        restore-keys: |
          ${{ inputs.pytest-cache-prefix }}-${{ runner.os }}-py${{ inputs.python-version }}-
