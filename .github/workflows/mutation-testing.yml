name: Mutation Testing
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'src/bioetl/domain/**'
      - 'src/bioetl/application/**'
      - 'tests/**'
      - '.github/workflows/mutation-testing.yml'
  pull_request:
    paths:
      - 'src/bioetl/domain/**'
      - 'src/bioetl/application/**'
      - 'tests/**'
      - '.github/workflows/mutation-testing.yml'
  schedule:
    # Run weekly on Sundays at 00:00 UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  mutation-testing:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target:
          - id: domain
            paths_to_mutate: src/bioetl/domain/
            tests_dir: tests/
            threshold: "70.0"
          - id: application-control-plane
            paths_to_mutate: src/bioetl/application/services/control_plane/
            tests_dir: tests/unit/application/services/control_plane/
            threshold: "60.0"
          - id: application-export-manifests
            paths_to_mutate: src/bioetl/application/services/export_manifests.py
            tests_dir: tests/unit/application/services/
            threshold: "60.0"
          - id: application-workflow-runner
            paths_to_mutate: src/bioetl/application/services/workflow_runner_service.py
            tests_dir: tests/unit/application/services/
            threshold: "60.0"

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Python + uv
        uses: ./.github/actions/setup-python-uv
        with:
          uv-extras: "dev"

      - name: Cache mutmut
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v4
        with:
          path: .mutmut-cache
          key: ${{ runner.os }}-mutmut-${{ hashFiles('src/bioetl/domain/**', 'src/bioetl/application/**') }}
          restore-keys: |
            ${{ runner.os }}-mutmut-

      - name: Run mutation testing
        run: |
          echo "Running mutation testing for ${{ matrix.target.id }}..."
          mutmut run \
            --paths-to-mutate="${{ matrix.target.paths_to_mutate }}" \
            --tests-dir="${{ matrix.target.tests_dir }}"

      - name: Generate mutation report
        if: always()
        run: |
          mkdir -p "reports/${{ matrix.target.id }}"
          mutmut results > "reports/${{ matrix.target.id }}/mutmut_results.txt"
          mutmut html
          if [ -d "html" ]; then
            mv html "reports/${{ matrix.target.id }}/mutmut_html"
          fi

      - name: Check mutation score threshold
        env:
          MUTATION_TARGET: ${{ matrix.target.id }}
          MUTATION_SCORE_THRESHOLD: ${{ matrix.target.threshold }}
        run: |
          python - <<'PY'
          import os
          import subprocess
          import sys
          import re

          result = subprocess.run(
              ["mutmut", "results"],
              capture_output=True,
              text=True
          )
          output = result.stdout + result.stderr

          target = os.environ["MUTATION_TARGET"]
          if result.returncode != 0:
              print(f"mutmut results failed for {target}; treating this as a broken gate.")
              print(output)
              sys.exit(result.returncode)

          # Parse mutation score
          # Example output: "Killed: 45, Survived: 5, ..."
          killed_match = re.search(r'Killed[:\s]+(\d+)', output, re.IGNORECASE)
          survived_match = re.search(r'Survived[:\s]+(\d+)', output, re.IGNORECASE)
          timeout_match = re.search(r'Timeout[:\s]+(\d+)', output, re.IGNORECASE)

          if not (killed_match and survived_match and timeout_match):
              print(f"Could not parse mutmut results for {target}; treating this as a broken gate.")
              print(output)
              sys.exit(1)

          killed = int(killed_match.group(1)) if killed_match else 0
          survived = int(survived_match.group(1)) if survived_match else 0
          timeout = int(timeout_match.group(1)) if timeout_match else 0

          total = killed + survived + timeout
          if total == 0:
              print("Mutation workflow produced zero mutants; treating this as a broken gate.")
              sys.exit(1)

          score = (killed + timeout) / total * 100
          print(f"Mutation Score: {score:.1f}%")
          print(f"  Killed: {killed}")
          print(f"  Survived: {survived}")
          print(f"  Timeout: {timeout}")
          print(f"  Total: {total}")

          THRESHOLD = float(os.environ["MUTATION_SCORE_THRESHOLD"])
          if score < THRESHOLD:
              print(f"\n⚠️  Mutation score {score:.1f}% is below threshold {THRESHOLD}%")
              print("Consider improving test coverage for the surviving mutants")
              sys.exit(1)
          else:
              print(f"\n✅ Mutation score {score:.1f}% meets threshold {THRESHOLD}%")
          PY

      - name: Upload mutation reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        if: always()
        with:
          name: mutation-reports-${{ matrix.target.id }}
          path: reports/
          if-no-files-found: warn
          retention-days: 14
