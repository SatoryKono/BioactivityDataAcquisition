name: Release
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  release:
    types: [published]
  # Allow manual triggers for testing the build process
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (build only, no publish)"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

jobs:
  build:
    name: Build Distribution
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v5
        with:
          python-version: "3.13"

      - name: Check version consistency
        run: python -m scripts.engineering.repo check-versions

      - name: Setup uv for governed documentation checks
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7

      - name: Require clean, current passport projection
        run: |
          uv run --frozen --no-build python -m scripts.docs passports check \
            --require-clean-source

      - name: Install build dependencies
        run: |
          python -m pip install --only-binary=:all: --upgrade "pip==25.0.1"
          python -m pip install --only-binary=:all: "build==1.2.2.post1" "twine==6.1.0"

      - name: Clean previous builds
        run: rm -rf ./dist/ ./build/ ./*.egg-info

      - name: Build distribution packages
        run: python -m build

      - name: Verify distribution with twine
        run: twine check dist/*

      - name: List distribution artifacts
        run: |
          echo "Built artifacts:"
          ls -la dist/

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 30

  test-install:
    name: Test Installation
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.13"]

    steps:
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download distribution artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v4
        with:
          name: dist
          path: dist/

      - name: Install from wheel
        run: |
          set -euo pipefail
          python -m pip install --only-binary=:all: --upgrade "pip==25.0.1"
          # Local artifact only: pinned name==version from wheel filename, no PyPI.
          shopt -s nullglob
          wheels=(dist/*.whl)
          if [[ ${#wheels[@]} -ne 1 ]]; then
            echo "Expected exactly one wheel under dist/, found ${#wheels[@]}" >&2
            ls -la dist/ >&2 || true
            exit 1
          fi
          wheel_base="$(basename "${wheels[0]}")"
          # Wheel naming: {name}-{version}-*.whl (PEP 427) → pin name==version.
          read -r pkg_name pkg_version <<EOF
          $(python -c "import re,sys; m=re.match(r'^([A-Za-z0-9_]+)-([0-9][^/-]+(?:\\.[0-9a-zA-Z]+)*)-', sys.argv[1]); assert m, sys.argv[1]; print(m.group(1), m.group(2))" "${wheel_base}")
          EOF
          python -m pip install \
            --only-binary=:all: \
            --no-deps \
            --no-index \
            --find-links=dist \
            "${pkg_name}==${pkg_version}"

      - name: Verify installation
        run: |
          python -c "import bioetl; print(f'bioetl version: {bioetl.__version__ if hasattr(bioetl, \"__version__\") else \"unknown\"}')"
          bioetl --help

      - name: Verify CLI entrypoint
        run: |
          # Check that bioetl CLI is properly installed
          which bioetl
          bioetl --version || echo "Version command not implemented"

  publish-testpypi:
    name: Publish to TestPyPI
    needs: [build, test-install]
    runs-on: ubuntu-latest
    # Only publish on release events or manual non-dry-run
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'false')
    environment:
      name: testpypi
      url: https://test.pypi.org/p/bioetl
    permissions:
      id-token: write # Required for OIDC trusted publishing

    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v4
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  publish-pypi:
    name: Publish to PyPI
    needs: [build, test-install, publish-testpypi]
    runs-on: ubuntu-latest
    # Only publish on release events
    if: github.event_name == 'release'
    environment:
      name: pypi
      url: https://pypi.org/p/bioetl
    permissions:
      id-token: write # Required for OIDC trusted publishing

    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1

  create-github-release-assets:
    name: Upload Release Assets
    needs: [build, publish-pypi]
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    permissions:
      contents: write # Required to upload release assets

    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v4
        with:
          name: dist
          path: dist/

      - name: Upload release assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
