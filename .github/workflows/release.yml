name: Release
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Deploy/publish path: do not cancel mid-flight OIDC publish or asset upload.
  cancel-in-progress: false

permissions:
  contents: read

on:
  release:
    types: [published]
  # Allow manual triggers for testing the build process
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (build only, no publish)"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

jobs:
  build:
    name: Build Distribution
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Setup Python + uv
        uses: ./.github/actions/setup-python-uv
        with:
          python-version: "3.13"
          uv-extras: "dev"

      - name: Check version consistency
        run: python -m scripts.engineering.repo check-versions

      - name: Require clean, current passport projection
        run: |
          uv run --frozen --no-build python -m scripts.docs passports check \
            --require-clean-source

      - name: Clean previous builds
        run: rm -rf ./dist/ ./build/ ./*.egg-info

      - name: Build distribution packages
        run: uv run --frozen --no-build python -m build

      - name: Verify distribution with twine
        run: uv run --frozen --no-build twine check dist/*

      - name: List distribution artifacts
        run: |
          echo "Built artifacts:"
          ls -la dist/

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Generate dist SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: dist
          format: spdx-json
          output-file: bioetl-dist.spdx.json
          artifact-name: bioetl-dist-sbom
          upload-artifact: true
          upload-artifact-retention: 30
          upload-release-assets: false

  test-install:
    name: Test Installation
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.13"]

    steps:
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.11.26"

      - name: Download distribution artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v4
        with:
          name: dist
          path: dist/

      - name: Install from wheel
        run: |
          set -euo pipefail
          # Local artifact only: pinned name==version from wheel filename, no PyPI.
          shopt -s nullglob
          wheels=(dist/*.whl)
          if [[ ${#wheels[@]} -ne 1 ]]; then
            echo "Expected exactly one wheel under dist/, found ${#wheels[@]}" >&2
            ls -la dist/ >&2 || true
            exit 1
          fi
          wheel_base="$(basename "${wheels[0]}")"
          # Wheel naming: {name}-{version}-*.whl (PEP 427) → pin name==version.
          read -r pkg_name pkg_version <<EOF
          $(python -c "import re,sys; m=re.match(r'^([A-Za-z0-9_]+)-([0-9][^/-]+(?:\\.[0-9a-zA-Z]+)*)-', sys.argv[1]); assert m, sys.argv[1]; print(m.group(1), m.group(2))" "${wheel_base}")
          EOF
          wheel_hash="$(sha256sum "${wheels[0]}" | awk '{print $1}')"
          printf '%s==%s --hash=sha256:%s\n' "${pkg_name}" "${pkg_version}" "${wheel_hash}" \
            > "${RUNNER_TEMP}/local-wheel-req.txt"
          python -c "import subprocess,sys; subprocess.check_call(['uv','pip','install','--system','--require-hashes','--only-binary=:all:','--no-deps','--no-index','--find-links=dist','-r',sys.argv[1]])" \
            "${RUNNER_TEMP}/local-wheel-req.txt"

      - name: Verify installation
        run: |
          python -c "import bioetl; print(f'bioetl version: {bioetl.__version__ if hasattr(bioetl, \"__version__\") else \"unknown\"}')"
          bioetl --help

      - name: Verify CLI entrypoint
        run: |
          # Check that bioetl CLI is properly installed
          which bioetl
          bioetl --version || echo "Version command not implemented"

  security-gate:
    name: Same-SHA security scans
    uses: ./.github/workflows/security.yml

  release-tests:
    name: Same-SHA release tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Setup Python + uv
        uses: ./.github/actions/setup-python-uv
        with:
          python-version: "3.13"
          uv-extras: "dev"

      - name: Smoke tests
        run: uv run --frozen --no-build pytest tests/smoke/ -m "not memory" -q --tb=line

      - name: Architecture supply-chain gates
        run: >
          uv run --frozen --no-build pytest -q --tb=line
          tests/architecture/test_github_actions_runtime_policy.py
          tests/architecture/test_docker_runtime_contracts.py

  publish-testpypi:
    name: Publish to TestPyPI
    needs: [build, test-install, security-gate, release-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Only publish on release events or manual non-dry-run
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'false')
    environment:
      name: testpypi
      url: https://test.pypi.org/p/bioetl
    permissions:
      id-token: write # Required for OIDC trusted publishing

    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v4
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  publish-pypi:
    name: Publish to PyPI
    needs: [build, test-install, publish-testpypi, security-gate, release-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Only publish on release events
    if: github.event_name == 'release'
    environment:
      name: pypi
      url: https://pypi.org/p/bioetl
    permissions:
      id-token: write # Required for OIDC trusted publishing

    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

  create-github-release-assets:
    name: Upload Release Assets
    needs: [build, publish-pypi]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'release'
    permissions:
      contents: write # Required to upload release assets

    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v4
        with:
          name: dist
          path: dist/

      - name: Download dist SBOM
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: bioetl-dist-sbom
          path: sbom/

      - name: Upload release assets
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
            sbom/**
