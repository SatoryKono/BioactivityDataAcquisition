name: Weekly VACUUM
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

on:
  # Run every Sunday at 02:00 UTC
  schedule:
    - cron: '0 2 * * 0'
  # Allow manual triggering
  workflow_dispatch:
    inputs:
      retention_days:
        description: 'Minimum age of files to remove (days)'
        required: false
        default: '7'
      dry_run:
        description: 'Run in dry-run mode (preview only)'
        required: false
        type: boolean
        default: false
      layer:
        description: 'Which layer to vacuum'
        required: false
        type: choice
        options:
          - all
          - silver
          - gold
        default: 'all'

jobs:
  vacuum:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Python + uv
        uses: ./.github/actions/setup-python-uv
        with:
          uv-extras: ""
          uv-sync-args: "--frozen"

      - name: Run VACUUM on all Delta tables
        env:
          RETENTION_DAYS: ${{ github.event.inputs.retention_days || '7' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          LAYER: ${{ github.event.inputs.layer || 'all' }}
        run: |
          DRY_RUN_FLAG=""
          if [[ "$DRY_RUN" == "true" ]]; then
            DRY_RUN_FLAG="--dry-run"
          fi

          echo "Running VACUUM with:"
          echo "  Retention: ${RETENTION_DAYS} days"
          echo "  Dry run: ${DRY_RUN}"
          echo "  Layer: ${LAYER}"
          echo ""

          uv run bioetl maintenance vacuum-all \
            --retention-days "${RETENTION_DAYS}" \
            --layer "${LAYER}" \
            ${DRY_RUN_FLAG}

      - name: Summary
        if: always()
        env:
          RETENTION_DAYS: ${{ github.event.inputs.retention_days || '7' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          LAYER: ${{ github.event.inputs.layer || 'all' }}
        run: |
          echo "## VACUUM Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Retention period**: ${RETENTION_DAYS} days (168 hours)" >> $GITHUB_STEP_SUMMARY
          echo "- **Dry run**: ${DRY_RUN}" >> $GITHUB_STEP_SUMMARY
          echo "- **Layer**: ${LAYER}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "VACUUM removes files older than the retention period that are no longer referenced by the Delta log." >> $GITHUB_STEP_SUMMARY
