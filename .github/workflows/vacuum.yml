name: Weekly VACUUM

on:
  # Run every Sunday at 02:00 UTC
  schedule:
    - cron: '0 2 * * 0'
  # Allow manual triggering
  workflow_dispatch:
    inputs:
      retention_days:
        description: 'Minimum age of files to remove (days)'
        required: false
        default: '7'
      dry_run:
        description: 'Run in dry-run mode (preview only)'
        required: false
        type: boolean
        default: false
      layer:
        description: 'Which layer to vacuum'
        required: false
        type: choice
        options:
          - all
          - silver
          - gold
        default: 'all'

jobs:
  vacuum:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v1

      - name: Install dependencies
        run: |
          uv sync

      - name: Run VACUUM on all Delta tables
        run: |
          RETENTION_DAYS="${{ github.event.inputs.retention_days || '7' }}"
          DRY_RUN_FLAG=""
          if [[ "${{ github.event.inputs.dry_run }}" == "true" ]]; then
            DRY_RUN_FLAG="--dry-run"
          fi
          LAYER="${{ github.event.inputs.layer || 'all' }}"

          echo "Running VACUUM with:"
          echo "  Retention: ${RETENTION_DAYS} days"
          echo "  Dry run: ${{ github.event.inputs.dry_run || 'false' }}"
          echo "  Layer: ${LAYER}"
          echo ""

          uv run bioetl maintenance vacuum-all \
            --retention-days "${RETENTION_DAYS}" \
            --layer "${LAYER}" \
            ${DRY_RUN_FLAG}

      - name: Summary
        if: always()
        run: |
          echo "## VACUUM Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Retention period**: ${{ github.event.inputs.retention_days || '7' }} days (168 hours)" >> $GITHUB_STEP_SUMMARY
          echo "- **Dry run**: ${{ github.event.inputs.dry_run || 'false' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Layer**: ${{ github.event.inputs.layer || 'all' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "VACUUM removes files older than the retention period that are no longer referenced by the Delta log." >> $GITHUB_STEP_SUMMARY
