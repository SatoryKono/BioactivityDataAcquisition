name: Temporary canonical test governance refresh

on:
  push:
    branches:
      - fix/prevent-root-test-captures-20260831

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: fix/prevent-root-test-captures-20260831
          fetch-depth: 0
      - name: Setup Python + uv
        uses: ./.github/actions/setup-python-uv
        with:
          python-version: "3.12"
          uv-extras: dev
          enable-pytest-cache: "false"
      - name: Refresh canonical test governance artifacts
        shell: bash
        run: |
          uv run --frozen --no-build python -m scripts.engineering.qa.report_test_governance_audit \
            --json-out reports/quality/test-governance-current.json \
            --fixture-duplication-out reports/quality/test-fixture-asset-duplication.json
      - name: Commit generated artifacts
        shell: bash
        run: |
          git add -- reports/quality/test-governance-current.json reports/quality/test-fixture-asset-duplication.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(governance): refresh test governance artifacts"
          git push origin HEAD:fix/prevent-root-test-captures-20260831
