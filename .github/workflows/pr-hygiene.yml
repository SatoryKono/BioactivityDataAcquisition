name: PR Hygiene

on:
  schedule:
    - cron: "30 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  report-noise-pr-hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const POLICY_PATH = '.github/PULL_REQUEST_HYGIENE.md';
            const STALE_LABEL = 'stale';
            const AUTO_CLOSE_INACTIVE_DAYS = 21;
            const CANDIDATE_MARKERS = [
              /report-only/i,
              /bot-generated/i,
              /generated report/i,
              /generated artifact/i,
            ];

            const cutoffMs = AUTO_CLOSE_INACTIVE_DAYS * 24 * 60 * 60 * 1000;
            const now = Date.now();
            const { owner, repo } = context.repo;
            let closedCount = 0;

            const pulls = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: 'open',
              per_page: 100,
            });

            for (const pr of pulls) {
              const labels = pr.labels
                .map((label) => typeof label === 'string' ? label : label.name)
                .filter(Boolean);
              const isStale = labels.includes(STALE_LABEL);
              const inactiveMs = now - Date.parse(pr.updated_at);
              const candidateText = `${pr.title}\n${pr.body || ''}`;
              const hasMarker = CANDIDATE_MARKERS.some((pattern) => pattern.test(candidateText));
              const isBot = pr.user?.type === 'Bot';

              if (!pr.draft || !isStale || inactiveMs < cutoffMs) {
                continue;
              }
              if (!hasMarker && !isBot) {
                continue;
              }

              const policyUrl = `${context.serverUrl}/${owner}/${repo}/blob/${context.sha}/${POLICY_PATH}`;
              const body = [
                `Closing under the [PR hygiene policy](${policyUrl}).`,
                '',
                'This draft PR is already stale and matches the deterministic',
                'report-only/bot-generated hygiene rule.',
                '',
                'Long-lived governance and debt work should stay tracked in issues,',
                'while this PR thread remains preserved for traceability.',
              ].join('\n');

              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pr.number,
                body,
              });
              await github.rest.pulls.update({
                owner,
                repo,
                pull_number: pr.number,
                state: 'closed',
              });
              closedCount += 1;
            }

            core.summary
              .addHeading('PR hygiene')
              .addRaw(`Closed stale report-noise draft PRs: ${closedCount}\n`)
              .write();
