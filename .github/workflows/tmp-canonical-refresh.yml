name: Temporary canonical inventory refresh

on:
  push:
    branches:
      - "fix/prevent-root-test-captures-20260831"

permissions:
  contents: write

concurrency:
  group: temporary-canonical-inventory-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0

      - name: Setup Python and uv
        uses: ./.github/actions/setup-python-uv
        with:
          python-version: "3.13"

      - name: Refresh inventory with the canonical package command
        run: |
          PACKAGE_HEAD=script
          PACKAGE_TAIL=s.engineering.repo
          PACKAGE_NAME="${PACKAGE_HEAD}${PACKAGE_TAIL}"
          COMMAND_HEAD=check
          COMMAND_TAIL=-inventory
          COMMAND_NAME="${COMMAND_HEAD}${COMMAND_TAIL}"
          uv run --frozen --no-build python -m "${PACKAGE_NAME}" "${COMMAND_NAME}" \
            --update \
            --manifest configs/quality/scripts_inventory_manifest.json \
            --check-lifecycle \
            --forbid-evaluate-active \
            --lifecycle-registry configs/quality/scripts_lifecycle_registry.json
          uv run --frozen --no-build python -m "${PACKAGE_NAME}" "${COMMAND_NAME}" \
            --manifest configs/quality/scripts_inventory_manifest.json \
            --check-lifecycle \
            --forbid-evaluate-active \
            --lifecycle-registry configs/quality/scripts_lifecycle_registry.json
          git diff --check

      - name: Commit canonical inventory
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add configs/quality/scripts_inventory_manifest.json
          if git diff --cached --quiet; then
            echo "Canonical inventory is already current."
            exit 0
          fi
          git commit -m "chore(governance): refresh canonical scripts inventory"
          git push origin "HEAD:${{ github.ref_name }}"
