name: Docs & Diagrams

on:
  push:
    branches: [ "main" ]
    paths:
      - 'docs/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'docs/**'

jobs:
  validate-mermaid:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Mermaid CLI
        run: npm install -g @mermaid-js/mermaid-cli

      - name: Validate Mermaid diagrams
        run: |
          shopt -s globstar nullglob
          for file in docs/**/*.mermaid; do
            echo "Validating $file..."
            mmdc -i "$file" -o /dev/null || exit 1
          done
          echo "All Mermaid diagrams validated successfully"

  render-diagrams:
    needs: validate-mermaid
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Mermaid CLI
        run: npm install -g @mermaid-js/mermaid-cli

      - name: Render Mermaid diagrams to SVG
        run: |
          mkdir -p rendered-diagrams
          shopt -s nullglob
          for dir in docs/02-architecture/diagrams docs/architecture/diagrams; do
            if [ -d "$dir" ]; then
              for file in "$dir"/*.mermaid; do
                [ -f "$file" ] && mmdc -i "$file" -o "rendered-diagrams/$(basename "$file" .mermaid).svg"
              done
            fi
          done

      - name: Upload rendered diagrams
        uses: actions/upload-artifact@v3
        with:
          name: rendered-diagrams
          path: rendered-diagrams
