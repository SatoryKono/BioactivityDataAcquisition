name: Docs & Diagrams

on:
  push:
    branches: [ "main" ]
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'

jobs:
  validate-mermaid:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Mermaid CLI
        run: npm install -g @mermaid-js/mermaid-cli@10.6.1

      - name: Create Puppeteer config
        run: |
          cat > /tmp/puppeteer-config.json << 'EOF'
          {
            "args": ["--no-sandbox", "--disable-setuid-sandbox", "--disable-dev-shm-usage", "--disable-gpu"]
          }
          EOF

      - name: Validate Mermaid diagrams
        run: |
          shopt -s globstar nullglob
          mkdir -p /tmp/mermaid-validation
          failed=0
          for file in docs/**/*.mermaid; do
            echo "Validating $file..."
            outfile="/tmp/mermaid-validation/$(basename "$file" .mermaid).svg"
            if ! mmdc -i "$file" -o "$outfile" -p /tmp/puppeteer-config.json 2>&1; then
              echo "::error file=$file::Mermaid validation failed for $file"
              failed=1
            fi
          done
          rm -rf /tmp/mermaid-validation
          if [ $failed -eq 1 ]; then
            echo "::error::One or more Mermaid diagrams failed validation"
            exit 1
          fi
          echo "All Mermaid diagrams validated successfully"

  render-diagrams:
    needs: validate-mermaid
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Mermaid CLI
        run: npm install -g @mermaid-js/mermaid-cli@10.6.1

      - name: Create Puppeteer config
        run: |
          cat > /tmp/puppeteer-config.json << 'EOF'
          {
            "args": ["--no-sandbox", "--disable-setuid-sandbox", "--disable-dev-shm-usage", "--disable-gpu"]
          }
          EOF

      - name: Render Mermaid diagrams to SVG
        run: |
          mkdir -p rendered-diagrams
          shopt -s nullglob
          for dir in docs/02-architecture/diagrams docs/architecture/diagrams; do
            if [ -d "$dir" ]; then
              for file in "$dir"/*.mermaid; do
                [ -f "$file" ] && mmdc -i "$file" -o "rendered-diagrams/$(basename "$file" .mermaid).svg" -p /tmp/puppeteer-config.json
              done
            fi
          done

      - name: Upload rendered diagrams
        uses: actions/upload-artifact@v4
        with:
          name: rendered-diagrams
          path: rendered-diagrams
