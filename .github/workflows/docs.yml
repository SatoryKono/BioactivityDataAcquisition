name: Docs & Diagrams

on:
  push:
    branches: [ "main" ]
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'

jobs:
  validate-mermaid:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Mermaid CLI
        run: npm install -g @mermaid-js/mermaid-cli@10.6.1

      - name: Create Puppeteer config
        run: |
          cat > /tmp/puppeteer-config.json << 'EOF'
          {
            "args": ["--no-sandbox", "--disable-setuid-sandbox", "--disable-dev-shm-usage", "--disable-gpu"]
          }
          EOF

      - name: Validate Mermaid diagrams (.mermaid + .mmd)
        run: |
          shopt -s globstar nullglob
          mkdir -p /tmp/mermaid-validation
          failed=0
          count=0

          # Validate both .mermaid and .mmd files
          for file in docs/**/*.mermaid docs/**/*.mmd; do
            [ -f "$file" ] || continue
            count=$((count + 1))
            echo "Validating $file..."
            base="$(basename "${file%.*}")"
            outfile="/tmp/mermaid-validation/${base}.svg"
            if ! mmdc -i "$file" -o "$outfile" \
                 -c docs/03-diagrams/theme/mermaid-config.json \
                 -p /tmp/puppeteer-config.json 2>&1; then
              echo "::error file=$file::Mermaid validation failed for $file"
              failed=1
            fi
          done

          rm -rf /tmp/mermaid-validation

          if [ $failed -eq 1 ]; then
            echo "::error::One or more Mermaid diagrams failed validation"
            exit 1
          fi
          echo "All $count Mermaid diagrams validated successfully"

  render-diagrams:
    needs: validate-mermaid
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Mermaid CLI + librsvg
        run: |
          npm install -g @mermaid-js/mermaid-cli@10.6.1
          sudo apt-get update -qq && sudo apt-get install -y -qq librsvg2-bin

      - name: Create Puppeteer config
        run: |
          cat > /tmp/puppeteer-config.json << 'EOF'
          {
            "args": ["--no-sandbox", "--disable-setuid-sandbox", "--disable-dev-shm-usage", "--disable-gpu"]
          }
          EOF

      - name: Render diagrams with unified script
        run: |
          bash docs/03-diagrams/render.sh \
            --puppeteer /tmp/puppeteer-config.json

      - name: Upload SVG artifacts
        uses: actions/upload-artifact@v4
        with:
          name: diagrams-svg
          path: |
            docs/02-architecture/diagrams/svg/
            docs/03-diagrams/architecture/svg/
            docs/03-diagrams/class-diagrams/svg/

      - name: Upload PNG artifacts
        uses: actions/upload-artifact@v4
        with:
          name: diagrams-png
          path: |
            docs/02-architecture/diagrams/png/
            docs/03-diagrams/architecture/png/
            docs/03-diagrams/class-diagrams/png/
