name: SonarCloud
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sonarcloud:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ secrets.SONAR_TOKEN != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python + uv
        uses: ./.github/actions/setup-python-uv
        with:
          uv-extras: "dev"

      - name: Enforce Sonar baseline ratchet
        env:
          SONARQUBE_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          python3 scripts/ai/check_sonar_issues.py \
            --token-env-var SONARQUBE_TOKEN \
            --strict-live \
            --max-quarantine-entries 184

      - name: Validate canonical Sonar config
        run: |
          test -f sonar-project.properties
          grep -q '^sonar.sources=src/bioetl$' sonar-project.properties

      - name: Run SonarCloud scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
