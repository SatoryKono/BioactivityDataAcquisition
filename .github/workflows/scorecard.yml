name: OpenSSF Scorecard

permissions:
  contents: read

on:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: scorecard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    if: >-
      github.event_name != 'pull_request_target' &&
      (startsWith(github.event_name, 'pull_request') ||
       github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Baseline is informational: do not block PR merge. No pull_request trigger.
    permissions:
      contents: read
      security-events: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        id: scorecard
        uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload Scorecard SARIF artifact
        if: ${{ !cancelled() && steps.scorecard.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 30

      - name: Upload to code-scanning
        if: ${{ !cancelled() && steps.scorecard.outcome == 'success' }}
        uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          sarif_file: results.sarif
