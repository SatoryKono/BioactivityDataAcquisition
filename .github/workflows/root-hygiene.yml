name: Root Hygiene
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  root-hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install required dependencies
        run: pip install pyyaml pytest

      - name: Validate repository root allowlist
        run: python scripts/engineering/repo/audit_root_cleanliness.py --strict-untracked

      - name: Validate root-hygiene review registry
        run: python scripts/engineering/repo/check_root_hygiene_review_registry.py

      - name: Run root hygiene unit tests
        run: >
          python -m pytest
          tests/unit/scripts/repo/test_audit_root_cleanliness.py
          tests/unit/scripts/repo/test_check_root_hygiene_review_registry.py
          tests/architecture/test_root_hygiene_workflow.py
          tests/architecture/test_root_hygiene_review_registry.py
          -q
