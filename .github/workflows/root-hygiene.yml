name: Root Hygiene
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.ai/**'
      - '.claude/**'
      - '.github/workflows/**'
      - 'LICENSE'
  push:
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.ai/**'
      - '.claude/**'
      - '.github/workflows/**'
      - 'LICENSE'

jobs:
  root-hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate repository root allowlist
        run: python scripts/repo/audit_root_cleanliness.py

