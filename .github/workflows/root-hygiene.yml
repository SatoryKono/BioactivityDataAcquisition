name: Root Hygiene

on:
  pull_request:
  push:

jobs:
  root-hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate repository root allowlist
        run: python scripts/audit_root_cleanliness.py
