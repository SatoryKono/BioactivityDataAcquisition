name: Root Hygiene
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  root-hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Python + uv
        uses: ./.github/actions/setup-python-uv
        with:
          python-version: "3.13"
          uv-extras: "dev"

      - name: Validate repository root allowlist
        run: uv run python -m scripts.engineering.repo check-cleanliness --strict-untracked --check-local-forbidden-outputs

      - name: Validate cleanup governance guidance
        run: uv run python -m scripts.engineering.repo check-cleanup-governance

      - name: Validate root governance docs
        run: uv run python -m scripts.engineering.repo check-root-governance-docs

      - name: Validate root-hygiene review registry
        run: uv run python -m scripts.engineering.repo check-root-review-registry

      - name: Validate structure audit
        run: uv run python -m scripts.engineering.diagnostics audit-structure --path .

      - name: Export cleanup classification evidence
        run: >
          mkdir -p reports/quality &&
          uv run python scripts/ops/support/repo/cleanup_repository.py
          --dry-run
          --detail-limit 0
          --report-json reports/quality/root-hygiene-cleanup-classification.json
          --report-root-review-json reports/quality/root-hygiene-review-evidence.json
          --report-reports-workspace-json reports/quality/reports-workspace-review.json

      - name: Upload cleanup classification evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: root-hygiene-cleanup-classification
          path: reports/quality/root-hygiene-cleanup-classification.json

      - name: Upload root review evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: root-hygiene-review-evidence
          path: reports/quality/root-hygiene-review-evidence.json

      - name: Upload reports workspace evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: reports-workspace-review
          path: reports/quality/reports-workspace-review.json

      - name: Run root hygiene unit tests
        run: >
          uv run pytest
          tests/unit/scripts/repo/test_audit_root_cleanliness.py
          tests/unit/scripts/repo/test_check_cleanup_governance.py
          tests/unit/scripts/repo/test_check_root_governance_docs.py
          tests/unit/scripts/repo/test_audit_structure.py
          tests/unit/scripts/repo/test_check_root_hygiene_review_registry.py
          tests/unit/scripts/repo/test_cleanup_repository.py
          tests/architecture/test_root_hygiene_workflow.py
          tests/architecture/test_root_hygiene_review_registry.py
          -q
