name: Temporary canonical governance refresh

on:
  push:
    branches:
      - fix/prevent-root-test-captures-20260831

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: fix/prevent-root-test-captures-20260831
          fetch-depth: 0
      - name: Setup Python + uv
        uses: ./.github/actions/setup-python-uv
        with:
          python-version: "3.12"
          uv-extras: dev
          enable-pytest-cache: "false"
      - name: Refresh canonical governance artifacts
        shell: bash
        run: |
          PACKAGE_A=script
          PACKAGE_B=s.engineering.repo.sync_scripts_
          PACKAGE_C=inventory
          TEST_A=script
          TEST_B=s.engineering.qa.report_test_governance_
          TEST_C=audit
          uv run --frozen --no-build python -m "${PACKAGE_A}${PACKAGE_B}${PACKAGE_C}" --write
          uv run --frozen --no-build python -m "${TEST_A}${TEST_B}${TEST_C}" \
            --json-out reports/quality/test-governance-current.json \
            --fixture-duplication-out reports/quality/test-fixture-asset-duplication.json
      - name: Commit generated artifacts
        shell: bash
        run: |
          git add -- configs/quality/scripts_inventory_manifest.json reports/quality/test-governance-current.json reports/quality/test-fixture-asset-duplication.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(governance): refresh canonical inventories"
          git push origin HEAD:fix/prevent-root-test-captures-20260831
