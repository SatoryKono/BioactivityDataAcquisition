name: Cross-Reference Validation (Weekly Full)
# Full mode: validates all link types including external URLs.
# Runs weekly; does not block merge. Creates an issue for broken external links.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  schedule:
    # Every Monday at 05:00 UTC
    - cron: "0 5 * * 1"
  workflow_dispatch:

jobs:
  validate-cross-refs-full:
    name: Validate cross-references (full — all link types)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python + uv
        uses: ./.github/actions/setup-python-uv
        with:
          uv-extras: "docs"

      - name: Validate all links (full mode)
        id: validate
        run: |
          uv run python scripts/validate_cross_references.py \
            --full \
            --docstrings \
            --markdown-out reports/cross-ref/weekly-report.md \
            --json-out reports/cross-ref/weekly-report.json \
            || echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-ref-weekly-report
          path: |
            reports/cross-ref/weekly-report.md
            reports/cross-ref/weekly-report.json
          retention-days: 30

      - name: Publish report summary
        if: always()
        run: |
          if [ -f reports/cross-ref/weekly-report.md ]; then
            cat reports/cross-ref/weekly-report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Create GitHub Issue for broken links
        if: steps.validate.outputs.exit_code != '' && steps.validate.outputs.exit_code != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const reportPath = 'reports/cross-ref/weekly-report.md';
            let body = '## Weekly Cross-Reference Validation — Broken Links Found\n\n';
            if (fs.existsSync(reportPath)) {
              body += fs.readFileSync(reportPath, 'utf8').slice(0, 60000);
            } else {
              body += 'Report not generated.';
            }
            body += '\n\n---\n_Auto-generated by [Cross-Reference Validation (Weekly Full)](' +
              `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})_`;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[docs] Broken links detected — ${new Date().toISOString().slice(0,10)}`,
              body: body,
              labels: ['documentation', 'broken-links'],
            });
