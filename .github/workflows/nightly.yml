name: Nightly

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  clock:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      dow: ${{ steps.clock.outputs.dow }}
      dom: ${{ steps.clock.outputs.dom }}
      month: ${{ steps.clock.outputs.month }}
    steps:
      - name: Read UTC calendar
        id: clock
        run: |
          set -euo pipefail
          echo "dow=$(LC_ALL=C date -u +%a)" >> "$GITHUB_OUTPUT"
          echo "dom=$(LC_ALL=C date -u +%d)" >> "$GITHUB_OUTPUT"
          echo "month=$(LC_ALL=C date -u +%m)" >> "$GITHUB_OUTPUT"

  tests:
    uses: ./.github/workflows/tests.yml
    permissions:
      contents: read

  e2e:
    uses: ./.github/workflows/e2e-matrix-health.yml
    permissions:
      contents: read

  security:
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read

  duplication:
    uses: ./.github/workflows/duplication-complexity.yml
    permissions:
      contents: read

  import-linter:
    uses: ./.github/workflows/import-linter.yml
    permissions:
      contents: read

  zizmor:
    uses: ./.github/workflows/zizmor.yml
    permissions:
      contents: read
      security-events: write

  codeql:
    needs: clock
    if: needs.clock.outputs.dow == 'Mon'
    uses: ./.github/workflows/codeql.yml
    permissions:
      contents: read
      security-events: write

  scorecard:
    needs: clock
    if: needs.clock.outputs.dow == 'Mon'
    uses: ./.github/workflows/scorecard.yml
    permissions:
      contents: read
      security-events: write
      id-token: write

  branch-hygiene:
    needs: clock
    if: needs.clock.outputs.dow == 'Mon'
    uses: ./.github/workflows/branch-hygiene.yml
    permissions:
      contents: read
      pull-requests: read

  github-settings:
    needs: clock
    if: >-
      ${{
        needs.clock.outputs.dom == '01' &&
        (needs.clock.outputs.month == '01' || needs.clock.outputs.month == '04' ||
         needs.clock.outputs.month == '07' || needs.clock.outputs.month == '10')
      }}
    uses: ./.github/workflows/github-settings-quarterly-review.yml
    permissions:
      actions: read
      contents: read
      deployments: read
      security-events: read

  mutation:
    needs: clock
    if: needs.clock.outputs.dow == 'Sun'
    uses: ./.github/workflows/mutation-testing.yml
    permissions:
      contents: read
