name: Nightly

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  clock:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      dow: ${{ steps.clock.outputs.dow }}
      dom: ${{ steps.clock.outputs.dom }}
      month: ${{ steps.clock.outputs.month }}
    steps:
      - name: Read UTC calendar
        id: clock
        run: |
          set -euo pipefail
          echo "dow=$(LC_ALL=C date -u +%a)" >> "$GITHUB_OUTPUT"
          echo "dom=$(LC_ALL=C date -u +%d)" >> "$GITHUB_OUTPUT"
          echo "month=$(LC_ALL=C date -u +%m)" >> "$GITHUB_OUTPUT"

  tests:
    uses: ./.github/workflows/tests.yml
    with:
      generated-artifacts: true
    permissions:
      contents: read

  e2e:
    uses: ./.github/workflows/e2e-matrix-health.yml
    permissions:
      contents: read

  security:
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read

  duplication:
    uses: ./.github/workflows/duplication-complexity.yml
    permissions:
      contents: read

  import-linter:
    uses: ./.github/workflows/import-linter.yml
    permissions:
      contents: read

  zizmor:
    uses: ./.github/workflows/zizmor.yml
    permissions:
      contents: read
      security-events: write

  codeql:
    needs: clock
    if: needs.clock.outputs.dow == 'Mon'
    uses: ./.github/workflows/codeql.yml
    permissions:
      contents: read
      security-events: write

  scorecard:
    needs: clock
    if: needs.clock.outputs.dow == 'Mon'
    uses: ./.github/workflows/scorecard.yml
    permissions:
      contents: read
      security-events: write
      id-token: write

  branch-hygiene:
    needs: clock
    if: needs.clock.outputs.dow == 'Mon'
    uses: ./.github/workflows/branch-hygiene.yml
    permissions:
      contents: read
      pull-requests: read

  github-settings:
    needs: clock
    if: >-
      ${{
        needs.clock.outputs.dom == '01' &&
        (needs.clock.outputs.month == '01' || needs.clock.outputs.month == '04' ||
         needs.clock.outputs.month == '07' || needs.clock.outputs.month == '10')
      }}
    uses: ./.github/workflows/github-settings-quarterly-review.yml
    permissions:
      actions: read
      contents: read
      deployments: read
      security-events: read

  mutation:
    needs: clock
    if: needs.clock.outputs.dow == 'Sun'
    uses: ./.github/workflows/mutation-testing.yml
    permissions:
      contents: read

  generated-artifact-daily:
    name: Generated artifact assertions (daily)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: Checkout complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Setup Python + uv
        uses: ./.github/actions/setup-python-uv
        with:
          python-version: "3.12"
      - name: Run every generated-artifact assertion including slow tests serially
        id: daily
        run: >-
          uv run --frozen --no-build python -m scripts.engineering.ci.generated_artifact_checks
          daily --report reports/quality/generated-artifact-daily-selection.json
      - name: Run standalone generated-artifact validators
        id: validators
        if: ${{ !cancelled() }}
        run: >-
          uv run --frozen --no-build python -m scripts.engineering.ci.generated_artifact_checks
          validators --report reports/quality/generated-artifact-daily-validators.json
      - name: Partition producer outcome before upload
        id: partition
        if: always() && !cancelled()
        run: >-
          uv run --frozen --no-build python -m scripts.engineering.ci
          nightly-shadow partition
          --daily-outcome "${{ steps.daily.outcome }}"
          --validators-outcome "${{ steps.validators.outcome }}"
          --output reports/quality/generated-artifact-daily-partition.json
      - name: Upload success evidence
        if: "always() && !cancelled() && steps.partition.outputs.bucket == 'success'"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: generated-artifact-daily-success
          path: reports/quality/generated-artifact-daily-*.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload non-success diagnostics
        if: "always() && !cancelled() && (steps.partition.outputs.bucket == 'diagnostics' || steps.partition.outcome != 'success')"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: generated-artifact-daily-diagnostics
          path: reports/quality/generated-artifact-daily-*.json
          if-no-files-found: error
          retention-days: 90
      - name: Upload cancellation diagnostics best effort
        if: cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: generated-artifact-daily-cancelled
          path: reports/quality/generated-artifact-daily-*.json
          if-no-files-found: warn
          retention-days: 90
