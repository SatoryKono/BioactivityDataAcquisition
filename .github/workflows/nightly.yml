# Diagnostic branch only. Never merge this replacement into main or a PR branch.
name: Neo4j audit resource diagnosis
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: existing
            initial: 192m
            heap: 384m
            pagecache: 96m
            limit: 768m
          - label: additional-headroom
            initial: 256m
            heap: 768m
            pagecache: 192m
            limit: 1536m
    env:
      NEO4J_USERNAME: neo4j
      # Same CI-only placeholder as tests.yml; no machine-local env file.
      NEO4J_PASSWORD: ci-neo4j-live-audit
    steps:
      - name: Checkout diagnostic source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup Python + uv
        uses: ./.github/actions/setup-python-uv
        with:
          python-version: '3.12'
      - name: Cache Neo4j image
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: /tmp/neo4j-community.tar
          key: neo4j-5.15-community-d9e2fb1ba398536e50d22ebc3d5d585baa086c1c0cf8e5b96bdc9e11e87e002a
      - name: Load pinned image
        run: |
          set -euo pipefail
          image='neo4j:5.15-community@sha256:d9e2fb1ba398536e50d22ebc3d5d585baa086c1c0cf8e5b96bdc9e11e87e002a'
          if [[ -f /tmp/neo4j-community.tar ]]; then
            docker load -i /tmp/neo4j-community.tar
          else
            docker pull "$image"
          fi
      - name: Start the controlled configuration
        env:
          DIAG_INITIAL: ${{ matrix.initial }}
          DIAG_HEAP: ${{ matrix.heap }}
          DIAG_PAGECACHE: ${{ matrix.pagecache }}
          DIAG_LIMIT: ${{ matrix.limit }}
        run: |
          set -euo pipefail
          mkdir -p reports/neo4j-diagnostic
          cat > reports/neo4j-diagnostic/override.yml <<YAML
          services:
            neo4j:
              environment:
                NEO4J_server_memory_heap_initial__size: ${DIAG_INITIAL}
                NEO4J_server_memory_heap_max__size: ${DIAG_HEAP}
                NEO4J_server_memory_pagecache_size: ${DIAG_PAGECACHE}
              mem_limit: ${DIAG_LIMIT}
          YAML
          docker network create bioetl-runtime >/dev/null 2>&1 || true
          docker compose -f docker-compose.neo4j.yml -f .github/compose/neo4j-ci-overlay.yml -f reports/neo4j-diagnostic/override.yml up -d --wait --wait-timeout 120 neo4j
      - name: Run the unchanged live audit and sample the container
        run: |
          set -euo pipefail
          (
            while true; do
              date -u +%FT%TZ
              docker inspect --format '{{json .State}} restarts={{.RestartCount}}' bioetl-neo4j || true
              docker stats --no-stream --format '{{.MemUsage}} {{.CPUPerc}}' bioetl-neo4j || true
              sleep 5
            done
          ) > reports/neo4j-diagnostic/states.log 2>&1 &
          sampler_pid=$!
          set +e
          uv run --frozen --no-build python -m scripts.engineering.ci neo4j-memory-live --batch-size 50 > reports/neo4j-diagnostic/audit.log 2>&1
          audit_status=$?
          set -e
          kill "$sampler_pid" 2>/dev/null || true
          wait "$sampler_pid" 2>/dev/null || true
          docker logs --tail 160 bioetl-neo4j > reports/neo4j-diagnostic/server.log 2>&1 || true
          docker inspect --format '{{json .State}} restarts={{.RestartCount}}' bioetl-neo4j >> reports/neo4j-diagnostic/states.log || true
          tail -n 30 reports/neo4j-diagnostic/audit.log
          exit "$audit_status"
      - name: Preserve diagnostic evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: neo4j-diagnostic-${{ matrix.label }}
          path: reports/neo4j-diagnostic/
          if-no-files-found: error
          retention-days: 7
      - name: Stop the diagnostic container
        if: always()
        run: docker compose -f docker-compose.neo4j.yml down -v neo4j
