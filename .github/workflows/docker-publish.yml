name: Docker GHCR Publish

# Privileged publish path. This file must not check out a caller SHA or any
# other ref: the scanned image arrives as an artifact from Main Integrity.
# workflow_run stays here so docker.yml is not analyzed as a privileged
# checkout of an input SHA.

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      source-sha:
        description: "Commit SHA of the already scanned image"
        type: string
        required: true
      artifact-run-id:
        description: "Run id that uploaded the scanned image"
        type: string
        required: true
    outputs:
      image-digest:
        description: "Published GHCR image digest"
        value: ${{ jobs.docker-push.outputs.digest }}

jobs:
  docker-publish-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    outputs:
      current: ${{ steps.head.outputs.current }}
    steps:
      - name: Compare source SHA to main HEAD
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ inputs.source-sha }}
        run: |
          set -euo pipefail
          if [[ ! "${SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::source-sha must be a 40-character lowercase hex SHA"
            exit 1
          fi
          current_sha="$(gh api "/repos/${REPOSITORY}/branches/main" --jq '.commit.sha')"
          echo "source_sha=${SOURCE_SHA}"
          echo "current_main_sha=${current_sha}"
          if [ "${current_sha}" != "${SOURCE_SHA}" ]; then
            echo "::notice::Not requesting ghcr-publish: ${SOURCE_SHA} is no longer main HEAD (${current_sha})."
            echo "current=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "current=true" >> "$GITHUB_OUTPUT"

  docker-push:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - docker-publish-gate
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    if: needs.docker-publish-gate.result == 'success' && needs.docker-publish-gate.outputs.current == 'true'
    environment: ghcr-publish
    env:
      TESTED_SHA: ${{ inputs.source-sha }}
    # One queue for every main publish. Pending runs stay queued.
    # cancel-in-progress stays false. The push step repeats the main HEAD
    # check immediately before docker push.
    concurrency:
      group: docker-ghcr-push-main
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      actions: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Guard publish target is current main HEAD
        id: head-guard
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ inputs.source-sha }}
        run: |
          set -euo pipefail
          if [[ ! "${SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::source-sha must be a 40-character lowercase hex SHA"
            exit 1
          fi
          current_sha="$(gh api "/repos/${REPOSITORY}/branches/main" --jq '.commit.sha')"
          echo "source_sha=${SOURCE_SHA}"
          echo "current_main_sha=${current_sha}"
          if [ "${current_sha}" != "${SOURCE_SHA}" ]; then
            echo "::notice::Skipping GHCR publish: ${SOURCE_SHA} is no longer main HEAD (${current_sha})."
            echo "stale=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "stale=false" >> "$GITHUB_OUTPUT"

      - name: Download exact scanned image from the integrity run
        if: steps.head-guard.outputs.stale != 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bioetl-scanned-image-${{ inputs.source-sha }}
          path: scanned-image
          run-id: ${{ inputs.artifact-run-id }}
          github-token: ${{ github.token }}

      - name: Load exact scanned image
        if: steps.head-guard.outputs.stale != 'true'
        env:
          IMAGE_REF: bioetl:${{ inputs.source-sha }}
        run: |
          set -euo pipefail
          zstd -d -c scanned-image/bioetl-scanned-image.tar.zst | docker load
          expected_id="$(cat scanned-image/bioetl-image-id.txt)"
          actual_id="$(docker image inspect "${IMAGE_REF}" --format '{{.Id}}')"
          test "${actual_id}" = "${expected_id}"

      - name: Login to GitHub Container Registry
        if: steps.head-guard.outputs.stale != 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR rejects mixed-case owner segments (e.g. SatoryKono).
      - name: Compute lowercase GHCR image base
        if: steps.head-guard.outputs.stale != 'true'
        id: ghcr
        env:
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          owner="$(echo "${REPO_OWNER}" | tr '[:upper:]' '[:lower:]')"
          echo "image_base=ghcr.io/${owner}/bioactivitydataacquisition" >> "$GITHUB_OUTPUT"

      - name: Tag and push exact scanned image to GHCR
        if: steps.head-guard.outputs.stale != 'true'
        id: publish
        env:
          IMAGE_REF: bioetl:${{ inputs.source-sha }}
          IMAGE_BASE: ${{ steps.ghcr.outputs.image_base }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ inputs.source-sha }}
        run: |
          set -euo pipefail
          current_sha="$(gh api "/repos/${REPOSITORY}/branches/main" --jq '.commit.sha')"
          echo "source_sha=${SOURCE_SHA}"
          echo "current_main_sha=${current_sha}"
          if [ "${current_sha}" != "${SOURCE_SHA}" ]; then
            echo "::notice::Skipping GHCR publish: ${SOURCE_SHA} is no longer main HEAD (${current_sha})."
            echo "stale=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          expected_id="$(cat scanned-image/bioetl-image-id.txt)"
          sha_ref="${IMAGE_BASE}:${TESTED_SHA}"
          branch_ref="${IMAGE_BASE}:${GITHUB_REF_NAME}"
          docker tag "${IMAGE_REF}" "${sha_ref}"
          docker tag "${IMAGE_REF}" "${branch_ref}"
          docker push "${sha_ref}"
          docker push "${branch_ref}"
          remote_config="$(docker manifest inspect "${sha_ref}" | jq -r '.config.digest')"
          test "${remote_config}" = "${expected_id}"
          digest="$(docker buildx imagetools inspect "${sha_ref}" --format '{{.Manifest.Digest}}')"
          [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Generate GHCR image SBOM
        if: steps.head-guard.outputs.stale != 'true' && steps.publish.outputs.stale != 'true'
        uses: anchore/sbom-action@dfcb83b97731532d72be422cbc51ee64adb6fd56 # v0.24.4
        with:
          image: ${{ steps.ghcr.outputs.image_base }}:${{ inputs.source-sha }}
          format: spdx-json
          output-file: bioetl-ghcr.spdx.json
          artifact-name: bioetl-ghcr-sbom
          upload-artifact: true
          upload-artifact-retention: 30
          upload-release-assets: false

      - name: Attest GHCR image provenance
        if: steps.head-guard.outputs.stale != 'true' && steps.publish.outputs.stale != 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.ghcr.outputs.image_base }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true
