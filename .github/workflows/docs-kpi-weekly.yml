name: Docs KPI Weekly
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  schedule:
    - cron: "30 4 * * 1"
  workflow_dispatch:

jobs:
  docs-kpi:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install docs dependencies
        run: uv sync --frozen --extra docs

      - name: Generate docs KPI report
        run: |
          uv run python scripts/report_docs_kpi.py \
            --kpi-target-not-in-nav 120 \
            --hard-limit-not-in-nav 135 \
            --max-orphans 0 \
            --target-deadline 2026-06-30 \
            --json-out reports/docs-kpi/docs-kpi-weekly.json \
            --markdown-out reports/docs-kpi/docs-kpi-weekly.md \
            --summary-out "$GITHUB_STEP_SUMMARY" \
            --fail-on-breach

      - name: Upload docs KPI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: docs-kpi-weekly
          path: |
            reports/docs-kpi/docs-kpi-weekly.json
            reports/docs-kpi/docs-kpi-weekly.md

