name: Docs KPI Weekly
# Optional-but-scheduled weekly KPI lane (DOCS-PIPE-003, #11858; supersedes the
# stale KEEP-DISABLED note #10263): the schedule below is live and enforced by
# tests/architecture/test_docs_kpi_workflow.py. Do not change KPI thresholds
# to justify a re-enable debate — the lane runs as scheduled.

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:

jobs:
  docs-kpi:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python + uv
        uses: ./.github/actions/setup-python-uv
        with:
          uv-extras: "docs"

      - name: Check docs runtime-mirror and freshness drift
        run: uv run --frozen --no-build python -m scripts.docs check-drift --runtime-mirrors --freshness

      - name: Generate docs KPI report
        run: |
          uv run --frozen --no-build python -m scripts.docs check-kpi \
            --kpi-target-not-in-nav 120 \
            --hard-limit-not-in-nav 135 \
            --max-orphans 0 \
            --target-deadline 2026-12-31 \
            --json-out reports/docs-kpi/docs-kpi-weekly.json \
            --markdown-out reports/docs-kpi/docs-kpi-weekly.md \
            --summary-out "$GITHUB_STEP_SUMMARY" \
            --fail-on-breach

      - name: Upload docs KPI artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-kpi-weekly
          path: |
            reports/docs-kpi/docs-kpi-weekly.json
            reports/docs-kpi/docs-kpi-weekly.md
          retention-days: 30
