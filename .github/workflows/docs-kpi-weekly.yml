name: Docs KPI Weekly

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  schedule:
    - cron: "30 4 * * 1"
  workflow_dispatch:

jobs:
  docs-kpi:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Python + uv
        uses: ./.github/actions/setup-python-uv
        with:
          uv-extras: "docs"

      - name: Generate docs KPI report
        run: |
          uv run --frozen --no-build python -m scripts.docs check-kpi \
            --kpi-target-not-in-nav 120 \
            --hard-limit-not-in-nav 135 \
            --max-orphans 0 \
            --target-deadline 2026-12-31 \
            --json-out reports/docs-kpi/docs-kpi-weekly.json \
            --markdown-out reports/docs-kpi/docs-kpi-weekly.md \
            --summary-out "$GITHUB_STEP_SUMMARY" \
            --fail-on-breach

      - name: Upload docs KPI artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: docs-kpi-weekly
          path: |
            reports/docs-kpi/docs-kpi-weekly.json
            reports/docs-kpi/docs-kpi-weekly.md
          retention-days: 30
