name: Memory Retention Policy

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "src/memory/episodic/**"
      - "src/memory/policy/retention.yaml"
      - "src/memory/tooling/prune.py"
      - ".github/workflows/memory-retention.yml"

permissions:
  contents: read

concurrency:
  group: memory-retention-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-retention-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          enable-cache: true

      - name: Check episodic retention policy
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: src
        run: uv run --frozen python -m memory.tooling.prune --check --json
