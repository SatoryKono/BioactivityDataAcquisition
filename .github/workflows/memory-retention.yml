name: Memory Retention Policy

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "src/memory/episodic/**"
      - "src/memory/policy/retention.yaml"
      - "src/memory/tooling/prune.py"
      - ".github/workflows/memory-retention.yml"

permissions:
  contents: read

concurrency:
  group: memory-retention-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-retention-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Python + uv
        uses: ./.github/actions/setup-python-uv
        with:
          python-version: "3.13"

      - name: Check episodic retention policy
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: src
        run: uv run --frozen --no-build python -m memory.tooling.prune --check --json
