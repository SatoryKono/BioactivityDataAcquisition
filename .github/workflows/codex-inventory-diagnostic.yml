name: Codex Inventory Diagnostic

on:
  push:
    branches:
      - fix/main-ci-20260902

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Generate canonical scripts inventory for the clean tree
        shell: bash
        run: |
          rm .github/workflows/codex-inventory-diagnostic.yml
          python -m scripts.engineering.repo sync-inventory
          python - <<'PY'
          import base64
          import hashlib
          from pathlib import Path
          data = Path("configs/quality/scripts_inventory_manifest.json").read_bytes()
          print("INVENTORY_SHA256=" + hashlib.sha256(data).hexdigest())
          encoded = base64.b64encode(data).decode("ascii")
          print("INVENTORY_BASE64_BEGIN")
          for offset in range(0, len(encoded), 12000):
              print(encoded[offset:offset + 12000])
          print("INVENTORY_BASE64_END")
          PY
