name: Labeler
# KEEP-DISABLED (#10263): do not re-enable until live GitHub labels match
# `.github/labeler.yml` and `docs/00-project/governance/github-label-taxonomy.md`.
# `pull_request_target` remains a dangerous trigger.

# History: pull_request_target was removed in #11234, so the workflow is
# workflow_dispatch-only and the zizmor dangerous-triggers exception was dropped in #12071.
on:
  # pull_request_target removed (#11234). Dangerous trigger must stay off.
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  label:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ false }}
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          configuration-path: .github/labeler.yml
