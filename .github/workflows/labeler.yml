name: Labeler

# pull_request_target is required so fork PRs can receive labels.
# This job does not checkout untrusted PR HEAD and does not expose
# secrets beyond GITHUB_TOKEN with pull-requests: write.
# Documented zizmor exception: .github/zizmor.yml (dangerous-triggers).
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  label:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/labeler@8558fd74291d67161a8a78ce36a881fa63b766a9 # v5
        with:
          configuration-path: .github/labeler.yml
