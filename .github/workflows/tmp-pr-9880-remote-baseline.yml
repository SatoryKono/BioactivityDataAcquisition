name: Temporary PR 9880 remote-main baseline refresh

on:
  push:
    branches:
      - fix/generate-9880-remote-baseline-20260831

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout helper branch
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: fix/generate-9880-remote-baseline-20260831
          fetch-depth: 1
      - name: Setup Python + uv
        uses: ./.github/actions/setup-python-uv
        with:
          python-version: "3.12"
          uv-extras: dev
          enable-pytest-cache: "false"
      - name: Refresh and verify remote-main debt evidence
        shell: bash
        run: |
          git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main
          uv run --frozen --no-build python -m scripts.engineering.qa report-architecture-debt-remote-main-baseline --update
          uv run --frozen --no-build python -m scripts.engineering.qa report-debt-governance-gates --update
          uv run --frozen --no-build python -m scripts.engineering.qa report-architecture-debt-remote-main-baseline --check
          uv run --frozen --no-build python -m scripts.engineering.qa report-debt-governance-gates --check
      - name: Commit generated evidence
        shell: bash
        run: |
          git add -u
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(governance): refresh remote-main debt evidence"
          git push origin HEAD:fix/generate-9880-remote-baseline-20260831
