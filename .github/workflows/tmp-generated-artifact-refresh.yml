name: Temporary read-only canonical evidence generator

on:
  push:
    branches:
      - "codex/fix-main-ci-20260902"

permissions:
  contents: read

jobs:
  generate-exact-head-evidence:
    if: github.repository == 'SatoryKono/BioactivityDataAcquisition'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Verify exact read-only scope
        env:
          EXPECTED_REF: refs/heads/codex/fix-main-ci-20260902
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = "SatoryKono/BioactivityDataAcquisition"
          test "${GITHUB_REF}" = "${EXPECTED_REF}"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Setup Python + uv
        uses: ./.github/actions/setup-python-uv
        with:
          python-version: "3.12"
          uv-extras: "dev"

      - name: Regenerate canonical evidence in runner workspace
        run: |
          set -euo pipefail
          uv run --frozen --no-build python -m scripts.engineering.qa \
            report-contract-coverage-matrix
          uv run --frozen --no-build python -m \
            scripts.engineering.qa.report_test_governance_audit \
            --json-out reports/quality/test-governance-current.json

      - name: Validate generated evidence and repaired contracts
        run: |
          set -euo pipefail
          uv run --frozen --no-build python -m scripts.engineering.qa \
            report-contract-coverage-matrix --check
          uv run --frozen --no-build pytest \
            tests/architecture/test_ci_heavy_lane_rebalance.py \
            tests/architecture/test_contract_coverage_matrix_drift.py \
            tests/architecture/test_test_governance_audit.py::test_test_governance_artifacts_match_live_collector \
            tests/unit/scripts/ops/observability/test_action_target_routes.py \
            -q --tb=short

      - name: Export exactly three generated files
        run: |
          uv run --frozen --no-build python - <<'PY'
          import base64
          from pathlib import Path

          paths = (
              Path("reports/quality/contract-coverage-matrix.json"),
              Path("reports/quality/contract-coverage-matrix.md"),
              Path("reports/quality/test-governance-current.json"),
          )
          for path in paths:
              encoded = base64.b64encode(path.read_bytes()).decode("ascii")
              print(f"BEGIN_ARTIFACT_B64::{path.as_posix()}")
              for start in range(0, len(encoded), 4096):
                  print(f"ARTIFACT_B64::{encoded[start:start + 4096]}")
              print(f"END_ARTIFACT_B64::{path.as_posix()}")
          PY
