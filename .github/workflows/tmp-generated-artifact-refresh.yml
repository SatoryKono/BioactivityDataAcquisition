name: Temporary canonical passport refresh

on:
  push:
    branches:
      - codex/fix-main-ci-20260902

permissions:
  contents: read

concurrency:
  group: temporary-canonical-passport-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: Generate and export canonical documentation artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact pushed SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Verify immutable source identity
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = "SatoryKono/BioactivityDataAcquisition"
          test "${GITHUB_REF_NAME}" = "codex/fix-main-ci-20260902"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Setup Python and uv
        uses: ./.github/actions/setup-python-uv
        with:
          python-version: "3.13"
          uv-extras: "dev"

      - name: Generate canonical passport projections and cleanup inventory
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/tmp-generated-artifact-refresh.yml
          GITHUB_EVENT_NAME=workflow_dispatch uv run --frozen --no-build             python -m scripts.docs passports generate --require-clean-source
          uv run --frozen --no-build             python -m scripts.docs generate-cleanup-inventory --update

      - name: Validate generated documentation
        shell: bash
        run: |
          set -euo pipefail
          GITHUB_EVENT_NAME=workflow_dispatch uv run --frozen --no-build             python -m scripts.docs passports check --require-clean-source
          uv run --frozen --no-build             python -m scripts.docs generate-cleanup-inventory --check
          uv run --frozen --no-build             python -m scripts.docs check-links --workflow-inventory
          uv run --frozen --no-build pytest             tests/architecture/test_passport_documentation_projections.py             tests/unit/scripts/docs/passports/test_passport_projector.py             -q --tb=short

      - name: Enforce generated-file allowlist and export contents
        shell: bash
        run: |
          set -euo pipefail
          uv run --frozen --no-build python - <<'PY'
          from __future__ import annotations

          import base64
          from pathlib import Path
          import subprocess
          import sys

          def lines(*args: str) -> list[str]:
              result = subprocess.run(
                  args,
                  check=True,
                  stdout=subprocess.PIPE,
                  text=True,
                  encoding="utf-8",
              )
              return [line for line in result.stdout.splitlines() if line]

          changed = set(lines("git", "diff", "--name-only", "--diff-filter=ACMRTUXBD"))
          changed.update(lines("git", "ls-files", "--others", "--exclude-standard"))
          paths = sorted(changed)

          workflow_path = ".github/workflows/tmp-generated-artifact-refresh.yml"
          inventory_paths = {
              "docs/reports/generated/documentation-cleanup-inventory.json",
              "docs/reports/generated/documentation-cleanup-inventory.md",
          }
          passport_paths = {
              path for path in paths if path.startswith("docs/04-reference/passports/")
          }
          allowed = passport_paths | inventory_paths | {workflow_path}
          unexpected = sorted(set(paths) - allowed)
          changed_inventory_paths = set(paths) & inventory_paths\n          missing_required = sorted({workflow_path} - set(paths))

          if unexpected:
              print("Unexpected generated paths:", file=sys.stderr)
              print("\n".join(unexpected), file=sys.stderr)
              raise SystemExit(1)
          if missing_required:
              print("Required generated paths did not change:", file=sys.stderr)
              print("\n".join(missing_required), file=sys.stderr)
              raise SystemExit(1)
          if len(passport_paths) != 86:
              print(
                  f"Expected exactly 86 changed passport files, got {len(passport_paths)}",
                  file=sys.stderr,
              )
              print("\n".join(sorted(passport_paths)), file=sys.stderr)
              raise SystemExit(1)
          if len(paths) != 89:
              raise SystemExit(f"Expected 89 allowlisted paths, got {len(paths)}")

          print(f"GENERATED_PATH_COUNT::{len(paths)}")
          print(f"PASSPORT_PATH_COUNT::{len(passport_paths)}")\n          print(f"INVENTORY_PATH_COUNT::{len(changed_inventory_paths)}")
          for path_text in paths:
              path = Path(path_text)
              if not path.exists():
                  print(f"DELETE_ARTIFACT::{path_text}")
                  continue
              encoded = base64.b64encode(path.read_bytes()).decode("ascii")
              print(f"BEGIN_ARTIFACT_B64::{path_text}")
              for offset in range(0, len(encoded), 4096):
                  print(f"ARTIFACT_B64::{encoded[offset:offset + 4096]}")
              print(f"END_ARTIFACT_B64::{path_text}")
          PY
