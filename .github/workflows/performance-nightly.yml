name: Performance Nightly

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  performance-regression-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Cache uv and virtualenv
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
            .venv
          key: uv-${{ runner.os }}-py311-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-py311-

      - name: Install dependencies
        run: uv sync --frozen --extra dev --extra tracing --extra performance

      - name: Run all performance benchmarks
        run: |
          mkdir -p reports/performance
          uv run pytest tests/performance/ \
            -m "benchmark and performance" \
            -p no:xdist \
            -v --tb=short \
            --perf-obs-out reports/performance/hotspot-observations.jsonl \
            --junitxml=reports/performance/hotspot-budgets.xml

      - name: Build hotspot degradation report
        if: always()
        run: |
          mkdir -p reports/performance
          if [ -f reports/performance/hotspot-observations.jsonl ]; then
            uv run python scripts/generate_hotspot_degradation_report.py \
              --observations reports/performance/hotspot-observations.jsonl \
              --budgets tests/performance/hotspot_budgets.json \
              --window-size 5 \
              --json-out reports/performance/hotspot-degradation.json \
              --markdown-out reports/performance/hotspot-degradation.md
          else
            echo "No hotspot observations found; skipping report."
          fi

      - name: Publish degradation summary
        if: always()
        run: |
          if [ -f reports/performance/hotspot-degradation.md ]; then
            cat reports/performance/hotspot-degradation.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Gate on degradation report
        if: always()
        run: |
          if [ -f reports/performance/hotspot-degradation.json ]; then
            failed=$(python3 -c "
          import json, sys
          data = json.load(open('reports/performance/hotspot-degradation.json'))
          failed = data.get('summary', {}).get('failed', 0)
          print(failed)
          sys.exit(1 if failed > 0 else 0)
          ")
            echo "Benchmarks over budget: $failed"
          fi

      - name: Upload performance artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-nightly-${{ github.run_number }}
          path: |
            reports/performance/hotspot-budgets.xml
            reports/performance/hotspot-observations.jsonl
            reports/performance/hotspot-degradation.json
            reports/performance/hotspot-degradation.md
          if-no-files-found: warn
          retention-days: 90
