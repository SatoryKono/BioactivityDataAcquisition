name: E2E Matrix Health

permissions:
  contents: read

concurrency:
  # Push/PR on the same ref still cancel each other. Schedule and manual
  # nightly must not be cancelled by the main merge train.
  group: ${{ github.workflow }}-${{ github.event_name == 'schedule' && 'schedule' || github.event_name == 'workflow_dispatch' && format('dispatch-{0}', github.run_id) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

# Workflow-level token is read-only; jobs may only narrow this further.

on:
  push:
    branches: [main, master, develop]
    paths-ignore:
      - "docs/**"
      - "*.md"
      - ".ai/**"
      - "LICENSE"
  pull_request:
    branches: [main, master, develop]
    paths-ignore:
      - "docs/**"
      - "*.md"
      - ".ai/**"
      - "LICENSE"
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:
    inputs:
      run_live:
        description: "Run nightly live-check job"
        required: false
        default: "false"

jobs:
  matrix-smoke-blocking:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BIOETL_TEST_MODE: "true"
      BIOETL_PIPELINE__HEALTH_CHECK_MODE: "probe"
    permissions: { contents: read }
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          # Critical playback cassettes are a bounded non-LFS set.
          lfs: false

      - name: Setup Python + uv
        uses: ./.github/actions/setup-python-uv

      - name: Run matrix smoke in cassette playback mode (3x rerun)
        run: |
          mkdir -p reports/e2e
          for run in 1 2 3; do
            set +e
            VCR_RECORD_MODE=none uv run --frozen --no-build pytest \
              tests/e2e/test_pipeline_matrix_e2e.py \
              -k "test_pipeline_matrix_smoke" \
              --record-mode=none \
              -q --tb=short \
              --junitxml="reports/e2e/matrix-smoke-run${run}.xml"
            echo $? > "reports/e2e/pytest_exit_code_run${run}.txt"
            set -e
          done

      # e2e_smoke SSOT path (configs/quality/test_matrix.yaml): chembl_activity
      # representative entity cycle. Cassette set is non-LFS (#8612).
      - name: Run chembl activity e2e_smoke (cassette playback)
        run: |
          mkdir -p reports/e2e
          VCR_RECORD_MODE=none uv run --frozen --no-build pytest \
            tests/e2e/test_chembl_activity_e2e.py \
            -m "e2e_smoke and not benchmark and not memory" \
            --record-mode=none \
            -q --tb=short \
            --junitxml=reports/e2e/chembl_activity_smoke.xml

      - name: Enforce matrix smoke skip-rate SLO (run3)
        run: |
          # Expected total must match the active smoke matrix (not raw
          # configs/entities/*.yaml count), which includes deferred exclusions.
          EXPECTED_TOTAL="$(
            uv run --frozen --no-build python -c \
              "from tests.e2e.test_pipeline_matrix_e2e import ACTIVE_PIPELINE_CASES; print(len(ACTIVE_PIPELINE_CASES))"
          )"
          MAX_SKIPS="$(
            uv run --frozen --no-build python -c \
              "print(int(${EXPECTED_TOTAL} * 0.15))"
          )"
          uv run --frozen --no-build python scripts/engineering/ci/check_e2e_matrix_skip_rate.py \
            --junit reports/e2e/matrix-smoke-run3.xml \
            --expected-total "${EXPECTED_TOTAL}" \
            --max-skips "${MAX_SKIPS}" \
            --max-skip-rate 0.15 \
            --markdown-out reports/e2e/matrix-smoke-summary.md

      - name: Enforce rerun stability gate (3x)
        run: |
          uv run --frozen --no-build python scripts/engineering/ci/check_e2e_rerun_stability.py \
            --junit-glob "reports/e2e/matrix-smoke-run*.xml" \
            --required-runs 3 \
            --max-recurrent-infra-flaky 0 \
            --max-recurrent-code-regression 0 \
            --markdown-out reports/e2e/matrix-rerun-stability.md

      - name: Fail closed on pytest non-zero exit
        run: |
          fail=0
          for run in 1 2 3; do
            rc="$(cat "reports/e2e/pytest_exit_code_run${run}.txt")"
            if [ "$rc" != "0" ]; then
              echo "pytest matrix smoke run ${run} exited ${rc}"
              fail=1
            fi
          done
          if [ "$fail" != "0" ]; then
            exit 1
          fi

      - name: Upload E2E matrix health artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        if: ${{ always() && !cancelled() }}
        with:
          name: e2e-matrix-health-blocking
          path: |
            reports/e2e/matrix-smoke-run1.xml
            reports/e2e/matrix-smoke-run2.xml
            reports/e2e/matrix-smoke-run3.xml
            reports/e2e/chembl_activity_smoke.xml
            reports/e2e/matrix-smoke-summary.md
            reports/e2e/matrix-rerun-stability.md
            reports/e2e/pytest_exit_code_run1.txt
            reports/e2e/pytest_exit_code_run2.txt
            reports/e2e/pytest_exit_code_run3.txt
          if-no-files-found: warn
          retention-days: 14

  matrix-smoke-nightly-live:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.run_live == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BIOETL_TEST_MODE: "false"
      BIOETL_PIPELINE__HEALTH_CHECK_MODE: "strict"
    permissions: { contents: read }
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Setup Python + uv
        uses: ./.github/actions/setup-python-uv

      - name: Enforce strict health-check policy
        run: |
          mode="${BIOETL_PIPELINE__HEALTH_CHECK_MODE:-}"
          if [ "$mode" != "strict" ]; then
            echo "Strict job requires BIOETL_PIPELINE__HEALTH_CHECK_MODE=strict, got '$mode'"
            exit 1
          fi

          test_mode="$(printf '%s' "${BIOETL_TEST_MODE:-}" | tr '[:upper:]' '[:lower:]')"
          if [ "$test_mode" = "true" ] || [ "$test_mode" = "1" ] || [ "$test_mode" = "yes" ]; then
            echo "Strict job forbids probe/test-mode fallback (BIOETL_TEST_MODE=$test_mode)"
            exit 1
          fi

      - name: Run matrix smoke live-check (nightly)
        run: |
          mkdir -p reports/e2e
          set +e
          VCR_RECORD_MODE=new_episodes uv run --frozen --no-build pytest \
            tests/e2e/test_pipeline_matrix_e2e.py \
            -k "test_pipeline_matrix_smoke" \
            -m "e2e_smoke and not benchmark and not memory" \
            --vcr-record=new_episodes \
            -q --tb=short \
            --junitxml=reports/e2e/matrix-smoke-live.xml
          echo $? > reports/e2e/pytest_exit_code_live.txt
          set -e
          rc="$(cat reports/e2e/pytest_exit_code_live.txt)"
          if [ "$rc" != "0" ]; then
            echo "nightly pytest exited ${rc}"
            exit "$rc"
          fi

      - name: Build nightly health summary
        run: |
          EXPECTED_TOTAL="$(
            uv run --frozen --no-build python -c \
              "from tests.e2e.test_pipeline_matrix_e2e import ACTIVE_PIPELINE_CASES; print(len(ACTIVE_PIPELINE_CASES))"
          )"
          MAX_SKIPS="$(
            uv run --frozen --no-build python -c \
              "print(int(${EXPECTED_TOTAL} * 0.15))"
          )"
          uv run --frozen --no-build python scripts/engineering/ci/check_e2e_matrix_skip_rate.py \
            --junit reports/e2e/matrix-smoke-live.xml \
            --expected-total "${EXPECTED_TOTAL}" \
            --max-skips "${MAX_SKIPS}" \
            --max-skip-rate 0.15 \
            --markdown-out reports/e2e/matrix-smoke-live-summary.md

      - name: Upload E2E nightly artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        if: ${{ always() && !cancelled() }}
        with:
          name: e2e-matrix-health-nightly-live-${{ github.sha }}
          path: |
            reports/e2e/matrix-smoke-live.xml
            reports/e2e/matrix-smoke-live-summary.md
            reports/e2e/pytest_exit_code_live.txt
          if-no-files-found: warn
          retention-days: 14
  e2e-nightly-full-replay:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      BIOETL_TEST_MODE: "true"
      BIOETL_PIPELINE__HEALTH_CHECK_MODE: "probe"
    permissions: { contents: read }
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          lfs: false

      - name: Fetch Git LFS objects for E2E
        run: |
          set -euo pipefail
          if ! git lfs pull; then
            echo "::error::Git LFS pull failed for e2e-nightly-full"
            exit 1
          fi

      - name: Setup Python + uv
        uses: ./.github/actions/setup-python-uv
        with:
          python-version: "3.12"

      - name: Run full E2E replay (e2e and not e2e_smoke)
        run: |
          mkdir -p reports/e2e
          VCR_RECORD_MODE=none uv run --frozen --no-build pytest tests/e2e \
            -m "e2e and not e2e_smoke and not benchmark and not memory" \
            --record-mode=none \
            -p no:xdist \
            -q --tb=short \
            --junitxml=reports/e2e/e2e-nightly-full.xml

      - name: Upload full E2E replay artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        if: ${{ always() && !cancelled() }}
        with:
          name: e2e-nightly-full-replay-${{ github.sha }}
          path: reports/e2e/e2e-nightly-full.xml
          if-no-files-found: error
          retention-days: 14

  prompt-tests-nightly:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: { contents: read }
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Setup Python + uv
        uses: ./.github/actions/setup-python-uv
        with:
          python-version: "3.12"

      - name: Run prompt contract tests
        run: |
          mkdir -p reports/e2e
          uv run --frozen --no-build pytest tests/prompts/ \
            -m "not benchmark and not memory" \
            -p no:xdist \
            -q --tb=short \
            --junitxml=reports/e2e/prompt-tests-nightly.xml

      - name: Upload prompt test artifacts
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: prompt-tests-nightly-${{ github.sha }}
          path: reports/e2e/prompt-tests-nightly.xml
          if-no-files-found: error
          retention-days: 14
  e2e-nightly-complete:
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    needs:
      - matrix-smoke-blocking
      - matrix-smoke-nightly-live
      - e2e-nightly-full-replay
      - prompt-tests-nightly
    steps:
      - name: Validate E2E nightly results (fail-closed)
        env:
          RUN_LIVE: ${{ github.event.inputs.run_live }}
        run: |
          set -euo pipefail
          echo "Event: ${{ github.event_name }}"
          echo "matrix-smoke-blocking: ${{ needs.matrix-smoke-blocking.result }}"
          echo "matrix-smoke-nightly-live: ${{ needs.matrix-smoke-nightly-live.result }}"
          echo "e2e-nightly-full-replay: ${{ needs.e2e-nightly-full-replay.result }}"
          echo "prompt-tests-nightly: ${{ needs.prompt-tests-nightly.result }}"
          # Fail if any executed job failed/cancelled
          for result in "${{ needs.matrix-smoke-blocking.result }}" "${{ needs.matrix-smoke-nightly-live.result }}" "${{ needs.e2e-nightly-full-replay.result }}" "${{ needs.prompt-tests-nightly.result }}"; do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              echo "::error::E2E job failed: $result"
              exit 1
            fi
          done
          # On PR, blocking must be success
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            if [ "${{ needs.matrix-smoke-blocking.result }}" != "success" ]; then
              echo "::error::PR requires matrix-smoke-blocking success"
              exit 1
            fi
          fi
          # On schedule, nightly jobs must be success
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "${{ needs.matrix-smoke-nightly-live.result }}" != "success" ] || [ "${{ needs.e2e-nightly-full-replay.result }}" != "success" ] || [ "${{ needs.prompt-tests-nightly.result }}" != "success" ]; then
              echo "::error::Schedule requires nightly jobs success"
              exit 1
            fi
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ needs.matrix-smoke-blocking.result }}" != "success" ] || [ "${{ needs.e2e-nightly-full-replay.result }}" != "success" ] || [ "${{ needs.prompt-tests-nightly.result }}" != "success" ]; then
              echo "::error::Manual nightly requires blocking smoke, full replay, and prompt tests success"
              exit 1
            fi
            if [ "$RUN_LIVE" = "true" ] && [ "${{ needs.matrix-smoke-nightly-live.result }}" != "success" ]; then
              echo "::error::Manual live request requires the live sublane to succeed"
              exit 1
            fi
            if [ "$RUN_LIVE" != "true" ] && [ "${{ needs.matrix-smoke-nightly-live.result }}" != "skipped" ]; then
              echo "::error::Replay-only manual run must skip the live sublane"
              exit 1
            fi
          fi
          echo "e2e-nightly-complete=success"
