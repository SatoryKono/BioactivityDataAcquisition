name: consolidation-gates

# Evidence-only owner for canonical manifest hashes. Blocking quality, test, and
# architecture selectors are owned by their dedicated workflows.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  canonical-manifest-hashes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Produce canonical manifest hashes
        run: |
          mkdir -p reports/gates/artifacts
          find tests -type f | sort | xargs sha256sum > reports/gates/artifacts/tests.sha256
          find src -type f | sort | xargs sha256sum > reports/gates/artifacts/src.sha256

      - name: Upload canonical manifest hashes
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: canonical-manifest-hashes
          path: reports/gates/artifacts
          if-no-files-found: error
          retention-days: 14
