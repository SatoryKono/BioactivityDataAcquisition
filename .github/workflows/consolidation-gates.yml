name: consolidation-gates

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - "consolidation/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BIOETL_TEST_MODE: "true"
  BIOETL_PIPELINE__HEALTH_CHECK_MODE: "probe"

jobs:
  quality-and-architecture:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Python + uv
        uses: ./.github/actions/setup-python-uv
        with:
          uv-extras: "dev tracing"
          uv-sync-args: "--frozen --all-extras --dev"

      - name: Ruff check
        run: uv run --frozen  ruff check .

      - name: Ruff format check
        run: uv run --frozen  ruff format --check .

      - name: Mypy
        run: uv run --frozen  mypy src tests

      - name: Architecture gate tests
        run: |
          mkdir -p reports/gates/architecture
          uv run --frozen  pytest tests/architecture/test_ci_test_strategy.py -q --junitxml=reports/gates/architecture/test_ci_test_strategy.xml
          uv run --frozen  pytest tests/architecture/test_config_golden_master.py -q --junitxml=reports/gates/architecture/test_config_golden_master.xml
          uv run --frozen  pytest tests/architecture/test_gold_schema_contracts.py -q --junitxml=reports/gates/architecture/test_gold_schema_contracts.xml
          uv run --frozen  pytest tests/architecture/test_medallion_invariants.py -q --junitxml=reports/gates/architecture/test_medallion_invariants.xml
          uv run --frozen  pytest tests/architecture/test_explicit_gold_scd2_policy.py -q --junitxml=reports/gates/architecture/test_explicit_gold_scd2_policy.xml
          uv run --frozen  pytest tests/architecture/test_no_random_in_writers.py -q --junitxml=reports/gates/architecture/test_no_random_in_writers.xml
          uv run --frozen  pytest tests/architecture/test_no_datetime_now_in_infrastructure.py -q --junitxml=reports/gates/architecture/test_no_datetime_now_in_infrastructure.xml
          uv run --frozen  pytest tests/architecture/test_no_structlog_in_application_interfaces.py -q --junitxml=reports/gates/architecture/test_no_structlog_in_application_interfaces.xml
          uv run --frozen  pytest tests/architecture/test_lock_safety_guard.py -q --junitxml=reports/gates/architecture/test_lock_safety_guard.xml
          uv run --frozen  pytest tests/architecture/test_metadata_output_contract.py -q --junitxml=reports/gates/architecture/test_metadata_output_contract.xml
          uv run --frozen  pytest tests/architecture/test_provider_regression_matrix.py -q --junitxml=reports/gates/architecture/test_provider_regression_matrix.xml

      - name: Contract and smoke
        run: |
          mkdir -p reports/gates/contract
          uv run --frozen  pytest tests/contract -q --junitxml=reports/gates/contract/tests_contract.xml
          uv run --frozen  pytest tests/smoke -q --junitxml=reports/gates/contract/tests_smoke.xml

      - name: Determinism and replay suite
        run: |
          mkdir -p reports/gates/integration
          uv run --frozen  pytest tests/integration/composite_resume -q --junitxml=reports/gates/integration/composite_resume.xml
          uv run --frozen  pytest tests/integration/determinism -q --junitxml=reports/gates/integration/determinism.xml
          uv run --frozen  pytest tests/integration/idempotency -q --junitxml=reports/gates/integration/idempotency.xml

      - name: Snapshot tests
        run: |
          mkdir -p reports/gates/snapshots
          uv run --frozen  pytest tests/snapshots -q --junitxml=reports/gates/snapshots/tests_snapshots.xml

      - name: Produce canonical manifest hashes
        run: |
          mkdir -p reports/gates/artifacts
          find tests -type f | sort | xargs sha256sum > reports/gates/artifacts/tests.sha256
          find src -type f | sort | xargs sha256sum > reports/gates/artifacts/src.sha256

      - name: Upload gate artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: consolidation-gates
          path: reports/gates
          if-no-files-found: error
          retention-days: 14
