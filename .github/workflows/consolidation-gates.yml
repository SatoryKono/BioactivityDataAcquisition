name: consolidation-gates

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - "consolidation/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BIOETL_TEST_MODE: "true"
  BIOETL_PIPELINE__HEALTH_CHECK_MODE: "probe"

jobs:
  quality-and-architecture:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Setup Python + uv
        uses: ./.github/actions/setup-python-uv
        with:
          # setup-python-uv always appends --extra for each uv-extras token.
          # Do not also pass --all-extras (uv rejects the combination).
          uv-extras: "dev tracing"
          uv-sync-args: "--frozen --dev"

      - name: Contract matrix diff diagnostic
        run: |
          uv run --frozen --no-build python -m scripts.engineering.qa report-contract-coverage-matrix \
            --json-out "${RUNNER_TEMP}/contract-coverage-matrix.json" \
            --md-out "${RUNNER_TEMP}/contract-coverage-matrix.md"
          diff -u reports/quality/contract-coverage-matrix.json "${RUNNER_TEMP}/contract-coverage-matrix.json" || true
          exit 1

      - name: Ruff format check
        run: uv run --frozen --no-build ruff format --check .

      - name: Mypy
        run: >-
          uv run --frozen --no-build mypy
          --config-file pyproject.toml
          --strict
          --no-incremental
          src/bioetl

      - name: Architecture gate tests
        run: |
          mkdir -p reports/gates/architecture
          uv run --frozen --no-build pytest tests/architecture/test_ci_test_strategy.py -q --junitxml=reports/gates/architecture/test_ci_test_strategy.xml
          uv run --frozen --no-build pytest tests/architecture/test_config_golden_master.py -q --junitxml=reports/gates/architecture/test_config_golden_master.xml
          uv run --frozen --no-build pytest tests/architecture/test_gold_schema_contracts.py -q --junitxml=reports/gates/architecture/test_gold_schema_contracts.xml
          uv run --frozen --no-build pytest tests/architecture/test_medallion_invariants.py -q --junitxml=reports/gates/architecture/test_medallion_invariants.xml
          uv run --frozen --no-build pytest tests/architecture/test_explicit_gold_scd2_policy.py -q --junitxml=reports/gates/architecture/test_explicit_gold_scd2_policy.xml
          uv run --frozen --no-build pytest tests/architecture/test_no_random_in_writers.py -q --junitxml=reports/gates/architecture/test_no_random_in_writers.xml
          uv run --frozen --no-build pytest tests/architecture/test_no_datetime_now_in_infrastructure.py -q --junitxml=reports/gates/architecture/test_no_datetime_now_in_infrastructure.xml
          uv run --frozen --no-build pytest tests/architecture/test_no_structlog_in_application_interfaces.py -q --junitxml=reports/gates/architecture/test_no_structlog_in_application_interfaces.xml
          uv run --frozen --no-build pytest tests/architecture/test_lock_safety_guard.py -q --junitxml=reports/gates/architecture/test_lock_safety_guard.xml
          uv run --frozen --no-build pytest tests/architecture/test_metadata_output_contract.py -q --junitxml=reports/gates/architecture/test_metadata_output_contract.xml
          uv run --frozen --no-build pytest tests/architecture/test_provider_regression_matrix.py -q --junitxml=reports/gates/architecture/test_provider_regression_matrix.xml

      - name: Contract and smoke
        run: |
          mkdir -p reports/gates/contract
          uv run --frozen --no-build pytest tests/contract -q --junitxml=reports/gates/contract/tests_contract.xml
          uv run --frozen --no-build pytest tests/smoke -q --junitxml=reports/gates/contract/tests_smoke.xml

      - name: Determinism and replay suite
        run: |
          mkdir -p reports/gates/integration
          uv run --frozen --no-build pytest tests/integration/composite_resume -q --junitxml=reports/gates/integration/composite_resume.xml
          uv run --frozen --no-build pytest tests/integration/determinism -q --junitxml=reports/gates/integration/determinism.xml
          uv run --frozen --no-build pytest tests/integration/idempotency -q --junitxml=reports/gates/integration/idempotency.xml

      - name: Snapshot tests
        run: |
          mkdir -p reports/gates/snapshots
          uv run --frozen --no-build pytest tests/unit/infrastructure/schemas/test_composite_config_invariants_source_of_truth.py -q --junitxml=reports/gates/snapshots/tests_snapshots.xml

      - name: Produce canonical manifest hashes
        run: |
          mkdir -p reports/gates/artifacts
          find tests -type f | sort | xargs sha256sum > reports/gates/artifacts/tests.sha256
          find src -type f | sort | xargs sha256sum > reports/gates/artifacts/src.sha256

      - name: Upload gate artifacts
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: consolidation-gates
          path: reports/gates
          if-no-files-found: error
          retention-days: 14
