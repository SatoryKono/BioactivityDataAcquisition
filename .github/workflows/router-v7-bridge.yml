name: Router 7 bridge candidate

permissions:
  contents: read

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bridge-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: grafana/tooling/router-v7-bridge
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Verify committed private bridge archive
        run: node verify-packed-bridge.mjs
      - name: Test bridge behavior and security boundaries
        run: npm test
      - name: Test host probe observes committed navigation
        run: node --test runtime-probe/module.test.mjs
      - name: Test image identity and artifact parity guard
        run: node --test verify-host-image.test.mjs
      - name: Test trusted rootfs timestamp normalization
        working-directory: grafana/tooling/router-v7-bridge
        run: |
          PYTHONPATH=../../.. /usr/bin/python3 ../../../tests/unit/scripts/ops/test_router_rootfs.py
          PYTHONPATH=../../.. /usr/bin/python3 ../../../tests/unit/scripts/ops/test_router_managed_image.py
      - name: Check exported TypeScript API
        run: npm run typecheck
      - name: Build browser candidate
        run: npm run build
      - name: Audit candidate dependencies
        run: npm audit --audit-level=moderate

  plugin-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        plugin: [bioetl-scenes-app, bioetl-selectorshell-panel]
    defaults:
      run:
        working-directory: grafana/plugins/${{ matrix.plugin }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
      - name: Install locked plugin dependencies
        run: npm ci --ignore-scripts
      - name: Audit plugin dependencies
        run: npm audit --audit-level=moderate
      - name: Check plugin types
        run: npm run typecheck
      - name: Lint plugin sources
        run: npm run lint
      - name: Test plugin behavior
        run: npm run test:ci
      - name: Build plugin
        run: npm run build
      - name: Verify built bundle against shipped host manifest
        env:
          BIOETL_PLUGIN: ${{ matrix.plugin }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["GITHUB_WORKSPACE"])
          plugin = os.environ["BIOETL_PLUGIN"]
          assert plugin in ("bioetl-scenes-app", "bioetl-selectorshell-panel"), plugin
          manifest = json.loads((root / "grafana/tooling/router-v7-bridge/host-image.json").read_text())
          for filename in ("module.js", "plugin.json"):
              relative = f"grafana/plugins/{plugin}/dist/{filename}"
              bundle = root / relative
              assert bundle.is_file(), f"Missing built artifact: {relative}"
              expected = manifest["artifact_sha256"][relative]
              actual = hashlib.sha256(bundle.read_bytes()).hexdigest()
              assert actual == expected, f"Artifact SHA-256 mismatch: {relative}: {actual} != {expected}"
              print(f"Verified {relative}: {actual}")
          metadata = json.loads((root / f"grafana/plugins/{plugin}/dist/plugin.json").read_text())
          assert metadata["info"]["updated"] == manifest["plugin_release_date"]
          PY
      - name: Transfer verified plugin output
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: host-plugin-${{ matrix.plugin }}
          path: grafana/plugins/${{ matrix.plugin }}/dist/
          if-no-files-found: error
          retention-days: 7

  host-build:
    needs: plugin-tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      GOMAXPROCS: "2"
      NODE_ENV: production
      NO_SOURCEMAP: "0"
    steps:
      - name: Checkout migration candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout inspected Grafana source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: grafana/grafana
          ref: 6193dc03311b631b9727b560d24369e683dc396e # v13.2.3
          path: reports/qa/router-v7-grafana-host
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
      - name: Download verified Scenes output
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: host-plugin-bioetl-scenes-app
          path: reports/qa/router-v7-image-context/bioetl-scenes-app
      - name: Download verified SelectorShell output
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: host-plugin-bioetl-selectorshell-panel
          path: reports/qa/router-v7-image-context/bioetl-selectorshell-panel
      - name: Apply migration to pristine upstream source
        working-directory: reports/qa/router-v7-grafana-host
        run: |
          git -c core.autocrlf=false apply --check "$GITHUB_WORKSPACE/grafana/tooling/router-v7-bridge/grafana-v13.2.3.patch"
          git -c core.autocrlf=false apply "$GITHUB_WORKSPACE/grafana/tooling/router-v7-bridge/grafana-v13.2.3.patch"
          git -c core.autocrlf=false apply --check "$GITHUB_WORKSPACE/grafana/tooling/router-v7-bridge/grafana-canvas-query-error.patch"
          git -c core.autocrlf=false apply "$GITHUB_WORKSPACE/grafana/tooling/router-v7-bridge/grafana-canvas-query-error.patch"
          git -c core.autocrlf=false apply --check "$GITHUB_WORKSPACE/grafana/tooling/router-v7-bridge/grafana-router-jest-esm.patch"
          git -c core.autocrlf=false apply "$GITHUB_WORKSPACE/grafana/tooling/router-v7-bridge/grafana-router-jest-esm.patch"
          cmp packages/bioetl-router-v7-bridge/index.mjs "$GITHUB_WORKSPACE/grafana/tooling/router-v7-bridge/index.mjs"
          cmp packages/bioetl-router-v7-bridge/index.d.ts "$GITHUB_WORKSPACE/grafana/tooling/router-v7-bridge/index.d.ts"
      - name: Verify host exposes the probe ReactDOM client dependency
        working-directory: reports/qa/router-v7-grafana-host
        run: |
          grep -F "'react-dom/client': () => import('react-dom/client')" public/app/features/plugins/loader/sharedDependencies.ts
      - name: Install immutable upstream dependency graph
        working-directory: reports/qa/router-v7-grafana-host
        run: node .yarn/releases/yarn-4.17.1.cjs install --immutable --mode=skip-build
      - name: Test Canvas query failure and recovery
        working-directory: reports/qa/router-v7-grafana-host
        env:
          NODE_ENV: test
        run: node node_modules/jest/bin/jest.js public/app/plugins/panel/canvas/CanvasPanel.integration.test.tsx --runInBand --watch=false --testNamePattern="query error"
      - name: Build production frontend and Swagger with bounded workers
        working-directory: reports/qa/router-v7-grafana-host
        run: |
          cat > scripts/webpack/webpack.router-security.mjs <<'EOF'
          import original from './webpack.prod.ts';
          export default (env = {}) => {
            const configs = original(env);
            configs.parallelism = 1;
            for (const config of configs) {
              config.parallelism = 2;
              for (const plugin of config.optimization?.minimizer ?? []) {
                if (plugin.constructor.name === 'CssMinimizerPlugin') plugin.options.parallel = 1;
              }
            }
            return configs;
          };
          EOF
          node node_modules/webpack-cli/bin/cli.js --config scripts/webpack/webpack.router-security.mjs
      - name: Build complete host image from verified outputs
        run: |
          cp -a reports/qa/router-v7-grafana-host/public/build reports/qa/router-v7-image-context/host-build
          docker buildx build --platform linux/amd64 --load --provenance=false \
            --metadata-file reports/qa/router-v7-image-build.json \
            -f grafana/tooling/router-v7-bridge/Dockerfile.host \
            -t bioetl-router-host:acceptance reports/qa/router-v7-image-context
      - name: Verify built image against declared delivery image
        run: |
          image=$(node -p "require('./grafana/tooling/router-v7-bridge/host-image.json').image")
          docker pull "$image"
          node grafana/tooling/router-v7-bridge/verify-host-image.mjs \
            bioetl-router-host:acceptance
      - name: Preserve image build and parity receipts
        if: ${{ !cancelled() && always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: router-v7-host-image-receipts
          path: |
            reports/qa/router-v7-image-build.json
            reports/qa/router-v7-image-parity.json
          if-no-files-found: warn
          retention-days: 7
