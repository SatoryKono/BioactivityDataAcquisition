name: Router 7 bridge candidate

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      qualification_target:
        description: Verify declared delivery, or qualify separately published candidate images
        type: choice
        options: [declared_delivery, candidate, produce_candidate]
        default: declared_delivery
      candidate_host_image:
        description: Candidate only; owned immutable host registry digest
        type: string
        default: ''
      candidate_managed_image:
        description: Candidate only; owned immutable managed registry digest
        type: string
        default: ''

      producer_source_sha:
        description: Producer only; full agreed source SHA expected on the dispatched PR ref
        type: string
        default: ''

env:
  BIOETL_PRODUCER_SOURCE_SHA: ${{ inputs.producer_source_sha }}
  BIOETL_QUALIFICATION_TARGET: ${{ inputs.qualification_target || 'declared_delivery' }}
  BIOETL_CANDIDATE_HOST_IMAGE: ${{ inputs.candidate_host_image }}
  BIOETL_CANDIDATE_MANAGED_IMAGE: ${{ inputs.candidate_managed_image }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bridge-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: grafana/tooling/router-v7-bridge
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
      - name: Validate qualification inputs before build
        working-directory: .
        run: python3 -m scripts.ops verify-router-managed-image --candidate-stage inputs
      - name: Validate producer ref binding
        if: ${{ inputs.qualification_target == 'produce_candidate' }}
        working-directory: .
        run: |
          python3 - <<'PY'
          import os
          from scripts.ops.observability.grafana.router_candidate import source_binding
          expected=os.environ['BIOETL_PRODUCER_SOURCE_SHA']
          assert os.environ['GITHUB_SHA']==expected, 'Dispatched ref differs from agreed source'
          source_binding(expected)
          PY
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Verify committed private bridge archive
        run: node verify-packed-bridge.mjs
      - name: Test bridge behavior and security boundaries
        run: npm test
      - name: Test host probe observes committed navigation
        run: node --test runtime-probe/module.test.mjs
      - name: Test image identity and artifact parity guard
        run: node --test verify-host-image.test.mjs
      - name: Test trusted rootfs timestamp normalization
        working-directory: grafana/tooling/router-v7-bridge
        run: |
          PYTHONPATH=../../.. /usr/bin/python3 ../../../tests/unit/scripts/ops/test_router_rootfs.py
          PYTHONPATH=../../.. /usr/bin/python3 ../../../tests/unit/scripts/ops/test_router_managed_image.py
          PYTHONPATH=../../.. /usr/bin/python3 ../../../tests/unit/scripts/ops/test_router_candidate.py
      - name: Check exported TypeScript API
        run: npm run typecheck
      - name: Build browser candidate
        run: npm run build
      - name: Audit candidate dependencies
        run: npm audit --audit-level=moderate

  plugin-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        plugin: [bioetl-scenes-app, bioetl-selectorshell-panel]
    defaults:
      run:
        working-directory: grafana/plugins/${{ matrix.plugin }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate qualification inputs before plugin build
        working-directory: .
        run: python3 -m scripts.ops verify-router-managed-image --candidate-stage inputs
      - name: Validate producer ref binding
        if: ${{ inputs.qualification_target == 'produce_candidate' }}
        working-directory: .
        run: |
          python3 - <<'PY'
          import os
          from scripts.ops.observability.grafana.router_candidate import source_binding
          expected=os.environ['BIOETL_PRODUCER_SOURCE_SHA']
          assert os.environ['GITHUB_SHA']==expected, 'Dispatched ref differs from agreed source'
          source_binding(expected)
          PY
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
      - name: Install locked plugin dependencies
        run: npm ci --ignore-scripts
      - name: Audit plugin dependencies
        run: npm audit --audit-level=moderate
      - name: Check plugin types
        run: npm run typecheck
      - name: Lint plugin sources
        run: npm run lint
      - name: Test plugin behavior
        run: npm run test:ci
      - name: Build plugin
        env:
          BIOETL_PLUGIN: ${{ matrix.plugin }}
        run: |
          # Runtime sourcemaps contain hashes derived from the compiler root.
          docker run --rm \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/work" \
            --workdir "/work/grafana/plugins/$BIOETL_PLUGIN" \
            node@sha256:e7add2a490bb17d97b485b8641bd88455fff7839ade0f5eba493c3508124d413 \
            npm run build
      - name: Verify built bundle against shipped host manifest
        if: ${{ inputs.qualification_target != 'candidate' && inputs.qualification_target != 'produce_candidate' }}
        env:
          BIOETL_PLUGIN: ${{ matrix.plugin }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["GITHUB_WORKSPACE"])
          plugin = os.environ["BIOETL_PLUGIN"]
          assert plugin in ("bioetl-scenes-app", "bioetl-selectorshell-panel"), plugin
          manifest = json.loads((root / "grafana/tooling/router-v7-bridge/host-image.json").read_text())
          prefix = f"grafana/plugins/{plugin}/dist/"
          expected_files = {
              path.removeprefix(prefix): digest
              for path, digest in manifest["artifact_sha256"].items()
              if path.startswith(prefix)
          }
          directory = root / prefix
          actual_files = {}
          for path in directory.rglob('*'):
              assert not path.is_symlink(), f"Unexpected plugin symlink: {path}"
              if path.is_file():
                  actual_files[path.relative_to(directory).as_posix()] = hashlib.sha256(path.read_bytes()).hexdigest()
          assert actual_files.keys() == expected_files.keys(), 'Complete plugin file set differs'
          mismatches = [path for path in actual_files if actual_files[path] != expected_files[path]]
          assert not mismatches, f"Complete plugin hashes differ, including maps: {mismatches}"
          for filename in ("module.js", "plugin.json"):
              relative = f"grafana/plugins/{plugin}/dist/{filename}"
              bundle = root / relative
              assert bundle.is_file(), f"Missing built artifact: {relative}"
              expected = manifest["artifact_sha256"][relative]
              actual = hashlib.sha256(bundle.read_bytes()).hexdigest()
              assert actual == expected, f"Artifact SHA-256 mismatch: {relative}: {actual} != {expected}"
              print(f"Verified {relative}: {actual}")
          metadata = json.loads((root / f"grafana/plugins/{plugin}/dist/plugin.json").read_text())
          assert metadata["info"]["updated"] == manifest["plugin_release_date"]
          PY
      - name: Validate complete original candidate plugin output
        if: ${{ inputs.qualification_target == 'candidate' || inputs.qualification_target == 'produce_candidate' }}
        working-directory: .
        env:
          BIOETL_PLUGIN: ${{ matrix.plugin }}
        run: python3 -m scripts.ops verify-router-managed-image --candidate-stage plugin
      - name: Transfer verified plugin output
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: host-plugin-${{ matrix.plugin }}
          path: grafana/plugins/${{ matrix.plugin }}/dist/
          if-no-files-found: error
          retention-days: 7

  host-build:
    needs: plugin-tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      GOMAXPROCS: "2"
      NODE_ENV: production
      NO_SOURCEMAP: "0"
    steps:
      - name: Checkout migration candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate qualification inputs before host build
        run: python3 -m scripts.ops verify-router-managed-image --candidate-stage inputs
      - name: Validate producer ref binding
        if: ${{ inputs.qualification_target == 'produce_candidate' }}
        working-directory: .
        run: |
          python3 - <<'PY'
          import os
          from scripts.ops.observability.grafana.router_candidate import source_binding
          expected=os.environ['BIOETL_PRODUCER_SOURCE_SHA']
          assert os.environ['GITHUB_SHA']==expected, 'Dispatched ref differs from agreed source'
          source_binding(expected)
          PY
      - name: Qualify the classic image store for config-digest evidence
        run: |
          # Containerd image IDs name a manifest/index, not the config blob.
          # Preserve the original producer's config-ID contract on this runner.
          sudo python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('/etc/docker/daemon.json')
          settings = json.loads(path.read_text()) if path.exists() else {}
          settings.setdefault('features', {})['containerd-snapshotter'] = False
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(settings, indent=2) + '\n')
          PY
          sudo systemctl restart docker
          python3 - <<'PY'
          import json
          import subprocess

          driver = subprocess.check_output(
              ['docker', 'info', '--format', '{{.Driver}}'], text=True,
          ).strip()
          status = json.loads(subprocess.check_output(
              ['docker', 'info', '--format', '{{json .DriverStatus}}'], text=True,
          ))
          assert driver == 'overlay2', 'Expected the qualified classic image store'
          assert not any(
              key == 'driver-type' and value == 'io.containerd.snapshotter.v1'
              for key, value in status
          ), 'Containerd image IDs cannot attest config digests'
          print(json.dumps({'driver': driver, 'driver_status': status}))
          PY
      - name: Checkout inspected Grafana source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: grafana/grafana
          ref: 6193dc03311b631b9727b560d24369e683dc396e # v13.2.3
          path: reports/qa/router-v7-grafana-host
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
      - name: Download verified Scenes output
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: host-plugin-bioetl-scenes-app
          path: reports/qa/router-v7-image-context/bioetl-scenes-app
      - name: Download verified SelectorShell output
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: host-plugin-bioetl-selectorshell-panel
          path: reports/qa/router-v7-image-context/bioetl-selectorshell-panel
      - name: Apply migration to pristine upstream source
        working-directory: reports/qa/router-v7-grafana-host
        run: |
          git -c core.autocrlf=false apply --check "$GITHUB_WORKSPACE/grafana/tooling/router-v7-bridge/grafana-v13.2.3.patch"
          git -c core.autocrlf=false apply "$GITHUB_WORKSPACE/grafana/tooling/router-v7-bridge/grafana-v13.2.3.patch"
          git -c core.autocrlf=false apply --check "$GITHUB_WORKSPACE/grafana/tooling/router-v7-bridge/grafana-canvas-query-error.patch"
          git -c core.autocrlf=false apply "$GITHUB_WORKSPACE/grafana/tooling/router-v7-bridge/grafana-canvas-query-error.patch"
          git -c core.autocrlf=false apply --check "$GITHUB_WORKSPACE/grafana/tooling/router-v7-bridge/grafana-router-jest-esm.patch"
          git -c core.autocrlf=false apply "$GITHUB_WORKSPACE/grafana/tooling/router-v7-bridge/grafana-router-jest-esm.patch"
          git -c core.autocrlf=false apply --check "$GITHUB_WORKSPACE/grafana/tooling/router-v7-bridge/grafana-alert-instance-link.patch"
          git -c core.autocrlf=false apply "$GITHUB_WORKSPACE/grafana/tooling/router-v7-bridge/grafana-alert-instance-link.patch"
          cmp packages/bioetl-router-v7-bridge/index.mjs "$GITHUB_WORKSPACE/grafana/tooling/router-v7-bridge/index.mjs"
          cmp packages/bioetl-router-v7-bridge/index.d.ts "$GITHUB_WORKSPACE/grafana/tooling/router-v7-bridge/index.d.ts"
      - name: Verify host exposes the probe ReactDOM client dependency
        working-directory: reports/qa/router-v7-grafana-host
        run: |
          grep -F "'react-dom/client': () => import('react-dom/client')" public/app/features/plugins/loader/sharedDependencies.ts
      - name: Install immutable upstream dependency graph
        working-directory: reports/qa/router-v7-grafana-host
        run: node .yarn/releases/yarn-4.17.1.cjs install --immutable --mode=skip-build
      - name: Test Canvas query failure and recovery
        working-directory: reports/qa/router-v7-grafana-host
        env:
          NODE_ENV: test
        run: node node_modules/jest/bin/jest.js public/app/plugins/panel/canvas/CanvasPanel.integration.test.tsx --runInBand --watch=false --testNamePattern="query error"
      - name: Test alert instance navigation with return context
        working-directory: reports/qa/router-v7-grafana-host
        env:
          NODE_ENV: test
        run: node node_modules/jest/bin/jest.js public/app/features/alerting/unified/rule-list/components/AlertRuleListItem.instances.test.tsx --runInBand --watch=false
      - name: Build production frontend and Swagger with bounded workers
        working-directory: reports/qa/router-v7-grafana-host
        run: |
          cat > scripts/webpack/webpack.router-security.mjs <<'EOF'
          import original from './webpack.prod.ts';
          export default (env = {}) => {
            const configs = original(env);
            configs.parallelism = 1;
            for (const config of configs) {
              config.parallelism = 2;
              for (const plugin of config.optimization?.minimizer ?? []) {
                if (plugin.constructor.name === 'CssMinimizerPlugin') plugin.options.parallel = 1;
              }
            }
            return configs;
          };
          EOF
          node node_modules/webpack-cli/bin/cli.js --config scripts/webpack/webpack.router-security.mjs
      - name: Build complete host image from verified outputs
        run: |
          cp -a reports/qa/router-v7-grafana-host/public/build reports/qa/router-v7-image-context/host-build
          docker buildx build --platform linux/amd64 --load --provenance=false \
            --metadata-file reports/qa/router-v7-image-build.json \
            -f grafana/tooling/router-v7-bridge/Dockerfile.host \
            -t bioetl-router-host:acceptance reports/qa/router-v7-image-context
      - name: Verify built image against declared delivery image
        if: ${{ inputs.qualification_target != 'candidate' && inputs.qualification_target != 'produce_candidate' }}
        id: host_parity
        run: |
          image=$(node -p "require('./grafana/tooling/router-v7-bridge/host-image.json').image")
          docker pull "$image"
          base_image=$(node -p "require('./grafana/tooling/router-v7-bridge/host-image.json').base_image")
          docker pull "$base_image"
          node grafana/tooling/router-v7-bridge/verify-host-image.mjs \
            bioetl-router-host:acceptance
      - name: Verify complete candidate host parity
        if: ${{ inputs.qualification_target == 'candidate' }}
        run: |
          python3 -m scripts.ops verify-router-managed-image --candidate-stage inputs
          base_image=$(node -p "require('./grafana/tooling/router-v7-bridge/host-image.json').base_image")
          docker pull "$base_image"
          docker pull "$BIOETL_CANDIDATE_HOST_IMAGE"
          python3 -m scripts.ops verify-router-managed-image --candidate-stage host
      - name: Preserve complete rootfs differences when parity fails
        if: ${{ !cancelled() && failure() && steps.host_parity.outcome == 'failure' }}
        run: |
          /usr/bin/python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          from scripts.ops.observability.grafana import router_managed_image as native

          owner = Path('grafana/tooling/router-v7-bridge')
          manifest = json.loads((owner / 'host-image.json').read_text())
          def config_id(reference):
              return subprocess.check_output(
                  [native.docker_path(), 'image', 'inspect', '--format', '{{.Id}}', '--', reference],
                  text=True,
              ).strip()
          references = {
              'built': config_id('bioetl-router-host:acceptance'),
              'declared': manifest['image'],
              'base': config_id(manifest['base_image']),
          }
          snapshots = {}
          for name, reference in references.items():
              records = native.records(reference)
              snapshots[name] = records
              payload = {
                  'status': 'FAIL_DIAGNOSTIC_ONLY',
                  'source_commit': os.environ['GITHUB_SHA'],
                  'image': reference,
                  'inspection': native.inspect(reference),
                  'rootfs_sha256': hashlib.sha256(json.dumps(records, sort_keys=True, separators=(',', ':')).encode()).hexdigest(),
                  'records': records,
              }
              Path(f'reports/qa/router-v7-rootfs-{name}.json').write_text(json.dumps(payload, sort_keys=True))
          actual, expected = snapshots['built'], snapshots['declared']
          differences = {
              path: {'built': actual.get(path), 'declared': expected.get(path)}
              for path in sorted(actual.keys() | expected.keys())
              if actual.get(path) != expected.get(path)
          }
          Path('reports/qa/router-v7-rootfs-differences.json').write_text(json.dumps(differences, indent=2))
          print('FAIL diagnostics only: rootfs paths differing:', len(differences))
          PY
      - name: Build and verify managed image from the qualified parent
        if: ${{ inputs.qualification_target != 'produce_candidate' }}
        run: |
          mkdir -p reports/qa/router-v7-managed-context
          if [ "$BIOETL_QUALIFICATION_TARGET" = candidate ]; then
            python3 -m scripts.ops verify-router-managed-image --candidate-stage recipe
          else
            cp grafana/tooling/router-v7-bridge/Dockerfile.managed reports/qa/router-v7-managed-context/Dockerfile
          fi
          docker buildx build --platform linux/amd64 --load --provenance=false \
            --metadata-file reports/qa/router-v7-managed-image-build.json \
            -t bioetl-router-managed:acceptance reports/qa/router-v7-managed-context
          if [ "$BIOETL_QUALIFICATION_TARGET" = candidate ]; then
            docker pull "$BIOETL_CANDIDATE_MANAGED_IMAGE"
            python3 -m scripts.ops verify-router-managed-image --candidate-stage managed
            exit 0
          fi
          image=$(node -p "require('./grafana/tooling/router-v7-bridge/managed-image.json').image")
          docker pull "$image"
          for plugin in bioetl-scenes-app bioetl-selectorshell-panel; do
            mkdir -p "grafana/plugins/$plugin/dist"
            cp -a "reports/qa/router-v7-image-context/$plugin/." "grafana/plugins/$plugin/dist/"
          done
          built=$(docker image inspect --format '{{.Id}}' bioetl-router-managed:acceptance)
          /usr/bin/python3 - <<'PY'
          import json
          import re
          import subprocess
          from pathlib import Path
          from scripts.ops.observability.grafana.trusted_docker import docker_path
          from scripts.ops.observability.refresh_router_host_provenance import build_matches_config

          # Verify either exporter schema against the inspected build without rewriting it.
          for stem, tag in (
              ('router-v7-image-build', 'bioetl-router-host:acceptance'),
              ('router-v7-managed-image-build', 'bioetl-router-managed:acceptance'),
          ):
              path = Path('reports/qa') / (stem + '.json')
              metadata = json.loads(path.read_text())
              config = subprocess.check_output(
                  [docker_path(), 'image', 'inspect', '--format', '{{.Id}}', '--', tag],
                  text=True,
              ).strip()
              assert re.fullmatch(r'sha256:[0-9a-f]{64}', config), 'Invalid built config ID'
              assert build_matches_config(metadata, config), 'Conflicting build config ID'
          PY
          /usr/bin/python3 -m scripts.ops verify-router-managed-image "$built"
      - name: Preserve image build and parity receipts
        if: ${{ !cancelled() && always() && inputs.qualification_target != 'produce_candidate' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: router-v7-host-image-receipts
          path: |
            reports/qa/router-v7-image-build.json
            reports/qa/router-v7-image-parity.json
            reports/qa/router-v7-managed-image-build.json
            reports/qa/router-v7-managed-image-parity.json
            reports/qa/router-v7-rootfs-*.json
          if-no-files-found: warn
          retention-days: 7

      - name: Generate scratch managed recipe from the freshly built local host
        if: ${{ inputs.qualification_target == 'produce_candidate' }}
        working-directory: .
        run: |
          cp grafana/tooling/router-v7-bridge/Dockerfile.host reports/qa/router-v7-image-context/Dockerfile.host
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          from scripts.ops.observability.grafana.router_candidate import write_output
          owner=Path('grafana/tooling/router-v7-bridge')
          meta=json.loads((owner/'managed-image.json').read_text())
          raw=(owner/'Dockerfile.managed').read_bytes().replace(b'\r\n',b'\n')
          assert hashlib.sha256(raw).hexdigest()==meta['dockerfile_sha256'], 'Unreviewed managed recipe'
          parent=('FROM '+meta['parent_image']+'\n').encode()
          assert raw.splitlines().count(parent.rstrip(b'\n'))==1 and parent in raw, 'Ambiguous parent'
          write_output('router-v7-managed-context/Dockerfile',raw.replace(parent,b'FROM bioetl-router-host:acceptance\n',1))
          PY

      - name: Produce managed image without publishing or touching delivery pins
        if: ${{ inputs.qualification_target == 'produce_candidate' }}
        working-directory: .
        run: |
          test "$(docker buildx inspect default | awk '$1 == "Driver:" {print $2}')" = docker
          docker buildx build --builder default --platform linux/amd64 --load --provenance=false   --metadata-file reports/qa/router-v7-managed-image-build.json   -f reports/qa/router-v7-managed-context/Dockerfile   -t bioetl-router-managed:acceptance reports/qa/router-v7-managed-context

      - name: Export immutable build products as explicitly unqualified evidence
        if: ${{ inputs.qualification_target == 'produce_candidate' }}
        working-directory: .
        run: |
          python3 - <<'PY'
          import hashlib,json,os,re,subprocess,tarfile
          from pathlib import Path
          from scripts.ops.observability.grafana.trusted_docker import docker_path
          from scripts.ops.observability.grafana.router_candidate import source_binding, write_output
          from scripts.ops.observability.refresh_router_host_provenance import build_matches_config
          root=Path.cwd()
          source=os.environ['BIOETL_PRODUCER_SOURCE_SHA'];assert re.fullmatch(r'[0-9a-f]{40}',source), 'Invalid source SHA'
          assert os.environ['GITHUB_SHA']==source, 'Dispatched source differs from agreed SHA'
          before=source_binding(source);out=root/'reports/qa/router-v7-unqualified-products'
          out.mkdir(exist_ok=False);assert out.resolve()==out
          images={};metadata={}
          for kind in ('host','managed'):
              name='router-v7-'+('image' if kind=='host' else 'managed-image')+'-build.json'
              raw=(root/'reports/qa'/name).read_bytes();build=json.loads(raw)
              ident=subprocess.check_output([docker_path(),'image','inspect','--format','{{.Id}}','--','bioetl-router-'+kind+':acceptance'],text=True).strip()
              assert build_matches_config(build,ident), 'Foreign local image'
              images[kind]=ident;metadata[kind]=hashlib.sha256(raw).hexdigest();(out/name).write_bytes(raw)
          assert images['host']!=images['managed'], 'Host and managed builds must differ'
          recipe=root/'reports/qa/router-v7-managed-context/Dockerfile'
          assert recipe.is_file() and recipe.resolve()==recipe and recipe.stat().st_nlink==1, 'Unsafe managed recipe'
          (out/'Dockerfile.managed').write_bytes(recipe.read_bytes())
          with (out/'images.docker.tar').open('xb') as stream:
              subprocess.run([docker_path(),'image','save','--',images['host'],images['managed']],stdout=stream,check=True)
          context=root/'reports/qa/router-v7-image-context'
          assert context.is_dir() and context.resolve()==context, 'Redirected build context'
          assert any((context/'host-build').glob('*.js')), 'Missing frontend build'
          for plugin in ('bioetl-scenes-app','bioetl-selectorshell-panel'):
              for required in ('module.js','module.js.map','plugin.json'):
                  p=context/plugin/required
                  assert p.is_file() and p.stat().st_size>0, 'Incomplete original plugin output'
          with tarfile.open(out/'source-built-context.tar.gz','w:gz') as archive:
              for name in ('Dockerfile.host','host-build','bioetl-scenes-app','bioetl-selectorshell-panel'):
                  p=context/name
                  for entry in [p,*p.rglob('*')] if p.is_dir() else [p]:
                      assert not entry.is_symlink() and entry.resolve()==entry and (entry.is_dir() or entry.is_file()), 'Unsafe context entry'
                      assert not entry.is_file() or entry.stat().st_nlink==1, 'Hardlinked context entry'
                  archive.add(p,arcname=name)
          assert source_binding(source)==before, 'Source binding changed during export'
          hashes={}
          for p in out.iterdir():
              assert p.is_file() and not p.is_symlink() and p.stat().st_size>0, 'Incomplete build product'
              with p.open('rb') as stream:hashes[p.name]=hashlib.file_digest(stream,'sha256').hexdigest()
          packages={}
          for plugin in ('bioetl-scenes-app','bioetl-selectorshell-panel'):
              for filename in ('package.json','package-lock.json'):
                  p=root/'grafana/plugins'/plugin/filename
                  assert p.is_file() and not p.is_symlink(), 'Missing build package input'
                  packages[p.relative_to(root).as_posix()]=hashlib.sha256(p.read_bytes()).hexdigest()
          receipt={'state':'BUILT_UNQUALIFIED','source_sha':source,'source_input_tree_sha256':before,'package_input_sha256':packages,'workflow_definition_sha':os.environ['GITHUB_SHA'],'run_id':os.environ['GITHUB_RUN_ID'],'run_attempt':os.environ['GITHUB_RUN_ATTEMPT'],'local_config_ids':images,'published_registry_digests':None,'build_metadata_sha256':metadata,'artifact_sha256':hashes,'ci_image_parity_claimed':False,'runtime_acceptance_claimed':False}
          write_output('router-v7-unqualified-products/build-products.json',(json.dumps(receipt,indent=2)+'\n').encode())
          PY

      - name: Preserve original unqualified build products
        if: ${{ inputs.qualification_target == 'produce_candidate' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: router-v7-unqualified-build-products
          path: reports/qa/router-v7-unqualified-products/
          if-no-files-found: error
          retention-days: 7
