name: ChemblBaseline Smoke

on:
  push:
    branches: [main, master, develop]
    paths:
      - ".github/workflows/chembl-baseline-smoke.yml"
      - ".github/actions/setup-python-uv/**"
      - "configs/workflows/chembl_baseline.yaml"
      - "docs/03-guides/workflows.md"
      - "docs/05-operations/runbooks/workflow-control-plane.md"
      - "src/bioetl/application/services/control_plane/workflow/**"
      - "src/bioetl/application/services/workflow_runner_service.py"
      - "src/bioetl/application/services/workflow_transform_service.py"
      - "src/bioetl/application/workflow/transforms/**"
      - "src/bioetl/domain/ports/workflow_foreign_key_reconciliation.py"
      - "src/bioetl/infrastructure/storage/workflow_foreign_key_reconciliation.py"
      - "src/bioetl/interfaces/cli/commands/_workflow_support.py"
      - "src/bioetl/interfaces/cli/commands/workflow.py"
      - "tests/architecture/test_chembl_baseline_smoke_workflow.py"
      - "tests/integration/workflow/test_workflow_foreign_key_reconciliation.py"
      - "tests/unit/application/services/control_plane/test_workflow_execution_service.py"
      - "tests/unit/application/services/test_workflow_runner_service.py"
      - "tests/unit/application/services/test_workflow_transform_service.py"
      - "tests/unit/application/workflow/test_reconcile_foreign_keys.py"
      - "tests/unit/infrastructure/config/test_workflow_config_api.py"
      - "tests/unit/interfaces/cli/test_workflow_cli.py"
  pull_request:
    branches: [main, master, develop]
    paths:
      - ".github/workflows/chembl-baseline-smoke.yml"
      - ".github/actions/setup-python-uv/**"
      - "configs/workflows/chembl_baseline.yaml"
      - "docs/03-guides/workflows.md"
      - "docs/05-operations/runbooks/workflow-control-plane.md"
      - "src/bioetl/application/services/control_plane/workflow/**"
      - "src/bioetl/application/services/workflow_runner_service.py"
      - "src/bioetl/application/services/workflow_transform_service.py"
      - "src/bioetl/application/workflow/transforms/**"
      - "src/bioetl/domain/ports/workflow_foreign_key_reconciliation.py"
      - "src/bioetl/infrastructure/storage/workflow_foreign_key_reconciliation.py"
      - "src/bioetl/interfaces/cli/commands/_workflow_support.py"
      - "src/bioetl/interfaces/cli/commands/workflow.py"
      - "tests/architecture/test_chembl_baseline_smoke_workflow.py"
      - "tests/integration/workflow/test_workflow_foreign_key_reconciliation.py"
      - "tests/unit/application/services/control_plane/test_workflow_execution_service.py"
      - "tests/unit/application/services/test_workflow_runner_service.py"
      - "tests/unit/application/services/test_workflow_transform_service.py"
      - "tests/unit/application/workflow/test_reconcile_foreign_keys.py"
      - "tests/unit/infrastructure/config/test_workflow_config_api.py"
      - "tests/unit/interfaces/cli/test_workflow_cli.py"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"
  BIOETL_TEST_MODE: "true"

jobs:
  baseline-cli-runner-smoke:
    name: Baseline CLI + runner smoke (py${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Python + uv
        uses: ./.github/actions/setup-python-uv
        with:
          python-version: ${{ matrix.python-version }}
          enable-pytest-cache: "true"
          pytest-cache-prefix: "pytest-chembl-baseline-smoke"
          pytest-cache-fingerprint: ${{ hashFiles('configs/workflows/chembl_baseline.yaml', 'src/bioetl/application/services/control_plane/workflow/**/*.py', 'src/bioetl/application/services/workflow_runner_service.py', 'src/bioetl/application/services/workflow_transform_service.py', 'src/bioetl/application/workflow/transforms/**/*.py', 'src/bioetl/domain/ports/workflow_foreign_key_reconciliation.py', 'src/bioetl/infrastructure/storage/workflow_foreign_key_reconciliation.py', 'src/bioetl/interfaces/cli/commands/_workflow_support.py', 'src/bioetl/interfaces/cli/commands/workflow.py', 'tests/unit/application/services/control_plane/test_workflow_execution_service.py', 'tests/unit/application/services/test_workflow_runner_service.py', 'tests/unit/application/services/test_workflow_transform_service.py', 'tests/unit/application/workflow/test_reconcile_foreign_keys.py', 'tests/unit/infrastructure/config/test_workflow_config_api.py', 'tests/unit/interfaces/cli/test_workflow_cli.py', 'pyproject.toml') }}

      - name: Run ChemblBaseline CLI + runner smoke
        run: |
          mkdir -p reports/junit
          uv run --frozen  pytest \
            tests/unit/infrastructure/config/test_workflow_config_api.py \
            tests/unit/application/services/test_workflow_runner_service.py \
            tests/unit/application/services/test_workflow_transform_service.py \
            tests/unit/application/workflow/test_reconcile_foreign_keys.py \
            tests/unit/application/services/control_plane/test_workflow_execution_service.py \
            tests/unit/interfaces/cli/test_workflow_cli.py \
            -q --tb=short \
            --junitxml=reports/junit/chembl-baseline-cli-runner-${{ matrix.python-version }}.xml

      - name: Upload ChemblBaseline CLI + runner artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: chembl-baseline-cli-runner-${{ matrix.python-version }}
          path: reports/junit/chembl-baseline-cli-runner-${{ matrix.python-version }}.xml
          if-no-files-found: error
          retention-days: 14

      - name: Publish ChemblBaseline CLI + runner summary
        if: always()
        run: |
          {
            echo "## ChemblBaseline CLI + runner smoke (py${{ matrix.python-version }})"
            echo "- Workflow: \`.github/workflows/chembl-baseline-smoke.yml\`"
            echo "- Output: \`reports/junit/chembl-baseline-cli-runner-${{ matrix.python-version }}.xml\`"
            echo "- Scope: config topology, workflow dry-run forwarding, CLI resume/repair selectors"
          } >> "$GITHUB_STEP_SUMMARY"

  baseline-reconciliation-smoke:
    name: Baseline reconciliation smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Python + uv
        uses: ./.github/actions/setup-python-uv
        with:
          python-version: "3.12"

      - name: Run ChemblBaseline reconciliation integration smoke
        run: |
          mkdir -p reports/junit
          uv run --frozen  pytest \
            tests/integration/workflow/test_workflow_foreign_key_reconciliation.py \
            -q --tb=short \
            --junitxml=reports/junit/chembl-baseline-reconciliation.xml

      - name: Upload ChemblBaseline reconciliation artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: chembl-baseline-reconciliation
          path: reports/junit/chembl-baseline-reconciliation.xml
          if-no-files-found: error
          retention-days: 14

      - name: Publish ChemblBaseline reconciliation summary
        if: always()
        run: |
          {
            echo "## ChemblBaseline reconciliation smoke"
            echo "- Output: \`reports/junit/chembl-baseline-reconciliation.xml\`"
            echo "- Scope: destructive transform preview/no-op semantics for workflow dry-run"
          } >> "$GITHUB_STEP_SUMMARY"

  baseline-architecture-smoke:
    name: Baseline config + architecture smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Python + uv
        uses: ./.github/actions/setup-python-uv
        with:
          python-version: "3.12"

      - name: Validate ChemblBaseline config and workflow architecture
        run: |
          mkdir -p reports/junit
          uv run --frozen  python -m scripts.schema validate-configs
          uv run --frozen  pytest \
            tests/architecture/test_chembl_baseline_smoke_workflow.py \
            tests/architecture/test_github_actions_runtime_policy.py \
            -q --tb=short \
            --junitxml=reports/junit/chembl-baseline-architecture.xml

      - name: Upload ChemblBaseline architecture artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: chembl-baseline-architecture
          path: reports/junit/chembl-baseline-architecture.xml
          if-no-files-found: error
          retention-days: 14

      - name: Publish ChemblBaseline architecture summary
        if: always()
        run: |
          {
            echo "## ChemblBaseline config + architecture smoke"
            echo "- Output: \`reports/junit/chembl-baseline-architecture.xml\`"
            echo "- Scope: fixed runner image, pinned actions, Python matrix, workflow config validation"
          } >> "$GITHUB_STEP_SUMMARY"
