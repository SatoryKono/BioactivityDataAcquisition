name: Codex Baseline Diagnostic

on:
  push:
    branches:
      - fix/main-ci-20260902

permissions:
  contents: read

jobs:
  remote-main-markdown:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0

      - name: Compare canonical remote-main Markdown
        run: |
          git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main
          python - <<'PY'
          import base64
          import hashlib
          from pathlib import Path
          from scripts.engineering.qa.report_architecture_debt_remote_main_baseline import build_payload, render_markdown

          payload = build_payload()
          expected = render_markdown(payload)
          actual = Path("reports/quality/architecture-debt-remote-main-baseline.md").read_text(encoding="utf-8")
          print("REMOTE_MAIN_SHA=" + str(payload["remote_main_sha"]))
          print("BASELINE_FINGERPRINT=" + str(payload["baseline_artifact_fingerprint"]))
          print("EXPECTED_SHA=" + hashlib.sha256(expected.encode("utf-8")).hexdigest())
          print("ACTUAL_SHA=" + hashlib.sha256(actual.encode("utf-8")).hexdigest())
          print("MARKDOWN_EQUAL=" + str(expected == actual))
          print("EXPECTED_MD_BASE64=" + base64.b64encode(expected.encode("utf-8")).decode("ascii"))
          PY
