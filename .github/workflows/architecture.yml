name: Architecture Metrics

permissions:
  contents: read

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.ai/**'
      - '.claude/**'
      - '.github/workflows/**'
      - 'LICENSE'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.ai/**'
      - '.claude/**'
      - '.github/workflows/**'
      - 'LICENSE'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Use CI hypothesis profile for faster property-based tests
  HYPOTHESIS_PROFILE: ci
  PYTHONDONTWRITEBYTECODE: 1
  PYTHONUNBUFFERED: 1

jobs:
  architecture-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Cache pytest and hypothesis
        uses: actions/cache@v4
        with:
          path: |
            .pytest_cache
            .hypothesis
          key: arch-metrics-${{ runner.os }}-${{ hashFiles('tests/**/*.py') }}
          restore-keys: |
            arch-metrics-${{ runner.os }}-

      - name: Install dependencies (frozen lock)
        run: uv sync --frozen --extra dev --extra tracing --extra performance

      - name: Cyclomatic Complexity Check
        run: |
          # Cyclomatic complexity (fail on C or worse)
          uv run radon cc src/bioetl --min C --show-closures

      - name: Run Tests with Coverage
        run: |
          # Run tests with coverage threshold (parallel for speed)
          # Exclude e2e and benchmark tests (benchmark tests require manual run)
          uv run pytest tests/ -m "not e2e and not benchmark and not serial" \
            --ignore=tests/e2e --ignore=tests/contract \
            -n auto --dist loadscope --max-worker-restart=0 \
            --cov=src/bioetl \
            --cov-report=term-missing \
            --cov-fail-under=85
