name: Architecture Metrics

on:
    workflow_dispatch:
        inputs:
            source_sha:
                description: Exact BioETL candidate commit to build
                required: true
                type: string

permissions:
    contents: read

jobs:
    selectorshell-adaptive-rebuild:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        defaults:
            run:
                working-directory: grafana/plugins/bioetl-selectorshell-panel
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ inputs.source_sha }}
                  persist-credentials: false
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
              with:
                  node-version: "24"
                  package-manager-cache: false
            - name: Restore supported TypeScript and ESLint ranges
              run: |
                  npm pkg set 'devDependencies.typescript=>=6.0.3 <6.1' 'devDependencies.eslint=^9.39.5'
                  npm install --package-lock-only --ignore-scripts --no-audit --no-fund
            - name: Install locked packages
              run: npm ci --ignore-scripts --no-audit --no-fund
            - name: Run selector tests
              run: npm run test:ci
            - name: Check TypeScript
              run: npm run typecheck
            - name: Version the rebuilt adaptive bundle
              run: |
                  python3 - <<'PY'
                  from pathlib import Path
                  path = Path("webpack.adaptive.config.ts")
                  text = path.read_text()
                  assert text.count("replace: '1.1.9'") == 1
                  text = text.replace("replace: '1.1.9'", "replace: '1.1.10'")
                  assert text.count("2026-11-15") == 2
                  path.write_text(text.replace("2026-11-15", "2026-11-28"))
                  PY
            - name: Rebuild the adaptive bundle
              run: npm exec -- webpack -c ./webpack.adaptive.config.ts --env production
            - name: Record exact changed outputs
              run: |
                  python3 - <<'PY'
                  import base64
                  import hashlib
                  import pathlib
                  import subprocess
                  root = pathlib.Path(subprocess.check_output(["git", "rev-parse", "--show-toplevel"], text=True).strip())
                  out = pathlib.Path("dist-adaptive")
                  changed_inputs = [pathlib.Path("package.json"), pathlib.Path("package-lock.json"), pathlib.Path("webpack.adaptive.config.ts")]
                  for path in sorted([*out.rglob("*"), *changed_inputs]):
                      if not path.is_file():
                          continue
                      relative = path.resolve().relative_to(root).as_posix()
                      data = path.read_bytes()
                      original = subprocess.run(["git", "show", f"HEAD:{relative}"], cwd=root, capture_output=True, check=False)
                      if original.returncode or original.stdout != data:
                          print(f"ADAPTIVE_SHA256 {relative} {hashlib.sha256(data).hexdigest()}", flush=True)
                          encoded = base64.b64encode(data).decode()
                          for pos in range(0, len(encoded), 7000):
                              print(f"ADAPTIVE_BYTES {relative} {encoded[pos:pos + 7000]}", flush=True)
                  PY
