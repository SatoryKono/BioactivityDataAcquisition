name: Architecture Metrics

permissions:
    contents: read

on:
    push:
        branches: [ main ]
        paths-ignore:
            - 'docs/**'
            - '*.md'
            - '.ai/**'
            - '.claude/**'
            - '.github/workflows/**'
            - 'LICENSE'
    pull_request:
        branches: [ main ]
        paths-ignore:
            - 'docs/**'
            - '*.md'
            - '.ai/**'
            - '.claude/**'
            - '.github/workflows/**'
            - 'LICENSE'
    schedule:
        -   cron: "20 2 * * *"
    workflow_dispatch:
        inputs:
            run_heavy:
                description: "Run heavy architecture and resilience nightly profile"
                required: false
                default: false
                type: boolean

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    # Use CI hypothesis profile for faster property-based tests
    HYPOTHESIS_PROFILE: ci
    PYTHONDONTWRITEBYTECODE: 1
    PYTHONUNBUFFERED: 1

jobs:
    architecture-fast-baseline:
        if: >
            github.event_name == 'push' ||
            github.event_name == 'pull_request' ||
            (github.event_name == 'workflow_dispatch' && github.event.inputs.run_heavy != 'true')
    runs-on: ubuntu-latest
        timeout-minutes: 10
    steps:
        -   uses: actions/checkout@v4
        -   name: Set up Python
            uses: actions/setup-python@v5
            with:
                python-version: '3.11'

        -   name: Install uv
            uses: astral-sh/setup-uv@v7

        -   name: Cache pytest and hypothesis
            uses: actions/cache@v4
            with:
                path: |
                    .pytest_cache
                    .hypothesis
                key: arch-metrics-${{ runner.os }}-${{ hashFiles('tests/**/*.py') }}
                restore-keys: |
                    arch-metrics-${{ runner.os }}-

        -   name: Install dependencies (frozen lock)
            run: uv sync --frozen --extra dev --extra tracing

        -   name: Run fast architecture baseline
            run: |
                uv run pytest tests/architecture/ \
                  -m "not slow and not serial" \
                  -q --tb=short

        -   name: Infrastructure layer architecture check
            run: uv run python src/tools/scripts/check_architecture.py

        -   name: Check architecture dependency docs drift
            run: uv run python scripts/generate_architecture_dependency_map.py --check

    architecture-heavy-nightly:
        if: >
            github.event_name == 'schedule' ||
            (github.event_name == 'workflow_dispatch' && github.event.inputs.run_heavy == 'true')
        runs-on: ubuntu-latest
        timeout-minutes: 25
        steps:
            -   uses: actions/checkout@v4
            -   name: Set up Python
                uses: actions/setup-python@v5
                with:
                    python-version: '3.11'

            -   name: Install uv
                uses: astral-sh/setup-uv@v7

            -   name: Cache pytest and hypothesis
                uses: actions/cache@v4
                with:
                    path: |
                        .pytest_cache
                        .hypothesis
                    key: arch-metrics-nightly-${{ runner.os }}-${{ hashFiles('tests/**/*.py') }}
                    restore-keys: |
                        arch-metrics-nightly-${{ runner.os }}-

            -   name: Install dependencies (frozen lock)
        run: uv sync --frozen --extra dev --extra tracing --extra performance

            -   name: Cyclomatic complexity check
                run: uv run radon cc src/bioetl --min C --show-closures

            -   name: Run heavy scan with coverage
        run: |
            uv run pytest tests/ -m "not e2e and not benchmark and not serial" \
              --ignore=tests/e2e --ignore=tests/contract \
              -n auto --dist loadscope --max-worker-restart=0 \
              --cov=src/bioetl \
              --cov-report=term-missing \
              --cov-fail-under=85

    windows-atomic-write-stress-nightly:
        if: >
            github.event_name == 'schedule' ||
            (github.event_name == 'workflow_dispatch' && github.event.inputs.run_heavy == 'true')
        runs-on: windows-latest
        timeout-minutes: 15
        steps:
            -   uses: actions/checkout@v4
            -   name: Set up Python
                uses: actions/setup-python@v5
                with:
                    python-version: '3.11'

            -   name: Install uv
                uses: astral-sh/setup-uv@v7

            -   name: Install dependencies (frozen lock)
                run: uv sync --frozen --extra dev --extra tracing

            -   name: Run Windows atomic lock stress tests
                run: |
                    uv run pytest tests/unit/infrastructure/storage/test_atomic.py \
                      -k "windows_lock_stress" \
                      -m "slow and serial" \
                      -q --tb=short
