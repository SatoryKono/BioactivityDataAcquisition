name: Architecture Metrics

on:
    workflow_dispatch:
        inputs:
            source_sha:
                description: Exact BioETL candidate commit to verify
                required: true
                type: string

permissions:
    contents: read

jobs:
    windows-delta-compatibility:
        runs-on: windows-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ inputs.source_sha }}
                  persist-credentials: false
            - name: Setup Python + uv
              uses: ./.github/actions/setup-python-uv
            - name: Verify locked Delta Lake version
              run: uv run --frozen --no-build python -c "import deltalake; assert deltalake.__version__ == '1.7.0'; print(deltalake.__version__)"
            - name: Verify Delta active files and physical schema on Windows
              run: uv run --frozen --no-build pytest tests/unit/infrastructure/storage/delta/test_table_ops.py tests/integration/infrastructure/storage/test_issue_12475_physical_parity.py tests/integration/infrastructure/storage/test_issue_12474_parity_control.py -n 0 -q --tb=short -k "windows_read or physical_parity or parity_control"
