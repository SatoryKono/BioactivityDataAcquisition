name: Architecture Metrics
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact IUPHAR PR head SHA
        required: true
        type: string
permissions:
  contents: read

jobs:
  generated:
    name: IUPHAR ${{ matrix.kind }} regeneration
    strategy:
      fail-fast: false
      matrix:
        kind: [docs, inventory]
    runs-on: ubuntu-latest
    timeout-minutes: 19
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify pinned checkout
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: ./.github/actions/setup-python-uv
        with:
          python-version: "3.13"
      - name: Rebuild and check docs
        if: matrix.kind == 'docs'
        run: |
          uv run --frozen --no-build python -m scripts.docs passports generate
          uv run --frozen --no-build python -m scripts.docs passports check
          uv run --frozen --no-build python -m scripts.engineering.qa.generate_architecture_dependency_map --update
          uv run --frozen --no-build python -m scripts.engineering.qa.generate_architecture_dependency_map --check
          uv run --frozen --no-build pytest -q tests/architecture/test_config_validation_surface.py tests/unit/composition/test_target_classification_admission.py tests/unit/composition/test_target_classification_runtime.py
      - name: Requalify and check external resource inventory
        if: matrix.kind == 'inventory'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git fetch --no-tags origin refs/pull/13451/head:refs/remotes/origin/qualification/pr13451
          test "$(git rev-parse refs/remotes/origin/qualification/pr13451)" = 4e97fd4a30d9ada7509941520fd411b1e1b40e7f
          git merge-base --is-ancestor a7a95a7ba378a5dadbe77c1279da61da93bd5687 refs/remotes/origin/qualification/pr13451
          test "$(git rev-parse '5045d0543e53d29b4db73134a326577f47e90b3c^{tree}')" = "$(git rev-parse 'refs/remotes/origin/qualification/pr13451^{tree}')"
          review=configs/quality/external_resource_inventory_pr13485_iuphar_review.json
          uv run --frozen --no-build python -m scripts.engineering.qa requalify-external-resource-inventory --review "$review" --update
          uv run --frozen --no-build python -m scripts.engineering.qa requalify-external-resource-inventory --review "$review" --check
          uv run --frozen --no-build python -m scripts.engineering.qa check-external-resource-inventory --check
      - name: Record generated changes
        run: |
          git diff --check
          git status --short
          git diff --numstat
          mkdir -p "$RUNNER_TEMP/iuphar-generated"
          git diff --binary --full-index HEAD > "$RUNNER_TEMP/iuphar-generated/generated.patch"
          git rev-parse HEAD > "$RUNNER_TEMP/iuphar-generated/source.txt"
          sha256sum "$RUNNER_TEMP/iuphar-generated/generated.patch"
          gzip -n -6 -c "$RUNNER_TEMP/iuphar-generated/generated.patch" | base64 -w 4096 | sed 's/^/IUPHAR_B64 /'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: iuphar-generated-${{ matrix.kind }}
          path: ${{ runner.temp }}/iuphar-generated/
          if-no-files-found: error
          retention-days: 7
