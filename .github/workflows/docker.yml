name: Docker Build & Compose Validation

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      cache-write:
        description: "Permit writing to the max cache (trusted contexts only)"
        type: boolean
        required: false
        default: false
  # Direct push is off. main-integrity.yml calls this workflow on main.
  # Checkout is github.sha only: a caller input must not select the tree
  # that can write the default-branch cache. GHCR publish is
  # docker-publish.yml, which has no checkout. Pull requests use
  # pr-required.yml docker-lane. Manual runs validate the lane only.
  workflow_dispatch:
concurrency:
  # Publish-only workflow_run calls must not cancel another integrity
  # run's publication before the current-HEAD gate can reject a stale SHA.
  # Keep main pushes isolated too if that direct trigger is restored.
  group: ${{ github.workflow }}-${{ (github.event_name == 'workflow_run' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && github.run_id || github.ref }}
  cancel-in-progress: "${{ github.event_name != 'workflow_run' && (github.event_name != 'push' || github.ref != 'refs/heads/main') }}"

jobs:
  docker-runtime-contracts:
    # Static + repo-backed unit contracts for optional Docker lane (RF-008).
    # Host-disruptive recovery/fault-injection/soak remain opt-in/manual.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python + uv
        uses: ./.github/actions/setup-python-uv
        with:
          python-version: "3.12"
          uv-extras: "dev"
          enable-pytest-cache: "true"
          pytest-cache-prefix: "docker-runtime-contracts"
          pytest-cache-fingerprint: ${{ hashFiles('tests/architecture/test_docker_runtime_contracts.py', 'tests/unit/repo_backed/scripts/ops/docker/**', 'tests/unit/repo_backed/scripts/engineering/qa/test_run_docker_stability_campaign.py', 'scripts/ops/runtime/docker/**', 'scripts/engineering/qa/docker_stability_campaign/**', 'configs/quality/docker_runtime_contracts.yaml') }}

      - name: Run Docker runtime static and unit contracts
        run: |
          uv run --frozen --no-build pytest -q --tb=line \
            tests/architecture/test_docker_runtime_contracts.py \
            tests/unit/repo_backed/scripts/ops/docker/test_runtime_manager.py \
            tests/unit/repo_backed/scripts/ops/docker/test_runtime_manager_recovery_networks.py \
            tests/unit/repo_backed/scripts/ops/docker/test_docker_runtime_probe.py \
            tests/unit/repo_backed/scripts/engineering/qa/test_run_docker_stability_campaign.py

  docker-lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    strategy:
      matrix:
        dockerfile:
          - Dockerfile.bioetl
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Run Hadolint (Dockerfile linting)
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: ${{ matrix.dockerfile }}
          # Repo policy keeps distro security package revisions moving.
          config: .hadolint.yaml

  docker-compose-validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate docker-compose.yml syntax
        env:
          # Placeholder only for `compose config` interpolation; not a real secret.
          NEO4J_PASSWORD: ci-compose-validation-placeholder
        run: docker compose config > /dev/null

      - name: Validate docker-compose.monitoring.yml syntax
        env:
          NEO4J_PASSWORD: ci-compose-validation-placeholder
          # Static interpolation only; the validation job does not start Grafana.
          GF_SECURITY_ADMIN_PASSWORD: ci-compose-validation-placeholder
          GF_RENDERING_RENDERER_TOKEN: ci-compose-validation-placeholder
        run: docker compose -f docker-compose.monitoring.yml config > /dev/null

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    env:
      TRIVY_CACHE_DIR: .trivycache
      TESTED_SHA: ${{ github.sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build Docker image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.bioetl
          push: false
          load: true
          tags: "bioetl:${{ github.sha }}"
          cache-from: type=gha
          # Caller github.event_name is preserved (push, schedule,
          # workflow_dispatch), not rewritten to workflow_call. cache-write
          # is required but not sufficient: the ref must be main or nightly
          # and the repository must not be a fork. Checkout is github.sha,
          # so the saved layers match that commit. The reachable caller is
          # main-integrity. Keep the predicate inside `condition && 'mode' || ''`
          # so a true arm yields the cache mode instead of boolean true.
          cache-to: ${{ (inputs.cache-write == true && github.event.repository.fork == false && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/nightly')) && 'type=gha,mode=max' || '' }}

      - name: Prepare security reports directory
        run: mkdir -p reports/security

      - name: Capture Docker build action metadata
        env:
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
          BUILD_IMAGE_ID: ${{ steps.build.outputs.imageid }}
          IMAGE_REF: bioetl:${{ github.sha }}
        # The build metadata output embeds full provenance (git history with
        # commit messages) and can exceed the runner exec env limit (E2BIG:
        # "Argument list too long") when passed as an env var. Ship it through
        # a heredoc into a temp file instead; the run script itself is written
        # to disk by the runner, so size is not an issue there.
        run: |
          metadata_file="$(mktemp)"
          cat > "${metadata_file}" <<'DOCKER_BUILD_METADATA_HEREDOC_EOF'
          ${{ steps.build.outputs.metadata }}
          DOCKER_BUILD_METADATA_HEREDOC_EOF
          python3 - "${metadata_file}" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          metadata_raw = Path(sys.argv[1]).read_text(encoding="utf-8").strip() or "{}"
          try:
              metadata = json.loads(metadata_raw)
          except json.JSONDecodeError as exc:
              raise SystemExit(f"invalid build metadata JSON: {exc}") from exc

          payload = {
              "schema_version": "docker-build-action-metadata-v1",
              "source_sha": os.environ["TESTED_SHA"],
              "run_id": os.environ.get("GITHUB_RUN_ID", ""),
              "run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT", ""),
              "image_ref": os.environ["IMAGE_REF"],
              "image_id": os.environ.get("BUILD_IMAGE_ID", ""),
              "digest": os.environ.get("BUILD_DIGEST", ""),
              "metadata": metadata,
              "cache": {
                  "from": "type=gha",
                  "to_policy": "trusted main/nightly only: type=gha,mode=max",
              },
          }
          if not payload["image_id"]:
              raise SystemExit("docker build action did not emit imageid")
          Path("reports/security/docker-build-metadata.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Capture image and runtime provenance
        env:
          IMAGE_REF: bioetl:${{ github.sha }}
        run: |
          set -euo pipefail
          {
            echo "source_sha=${TESTED_SHA}"
            echo "wolfi_base_image=chainguard/wolfi-base@sha256:360896efb0753a5701c48f860e17130c205eae5a264797aa3e7ea126ee2923a7"
            echo "runtime_python=python-3.13=3.13.18_git20261030-r0"
            echo "builder_uv=uv=0.11.26-r0"
            echo "setuptools_build_constraint=setuptools==83.0.0"
            docker image inspect "${IMAGE_REF}" --format 'image_id={{.Id}} repo_digests={{json .RepoDigests}}'
            docker run --rm --entrypoint python "${IMAGE_REF}" --version
            docker run --rm --entrypoint python "${IMAGE_REF}" -c 'import grp, importlib.util, os, pwd, shutil, stat, sys, tempfile; assert sys.version_info[:3] == (3, 13, 18); assert (os.getuid(), os.getgid()) == (999, 999); assert pwd.getpwuid(999).pw_name == "bioetl"; assert pwd.getpwuid(999).pw_shell == "/sbin/nologin"; assert grp.getgrgid(999).gr_name == "bioetl"; assert importlib.util.find_spec("pip") is None; assert stat.S_IMODE(os.stat("/tmp").st_mode) == 0o700; assert (os.stat("/tmp").st_uid, os.stat("/tmp").st_gid) == (999, 999); assert (os.stat("/app/configs").st_uid, os.stat("/app/configs").st_gid) == (0, 0); assert not os.access("/app/configs", os.W_OK); forbidden_paths = ("/bin/sh", "/bin/ash", "/bin/bash", "/bin/busybox", "/usr/bin/sh", "/usr/bin/ash", "/usr/bin/bash", "/usr/bin/busybox", "/sbin/apk", "/usr/bin/apk"); assert not any(os.path.lexists(path) for path in forbidden_paths); assert all(shutil.which(name) is None for name in ("sh", "ash", "bash", "busybox", "apk", "pip", "pip3", "pip3.13")); handle = tempfile.NamedTemporaryFile(dir="/tmp", delete=True); handle.close(); marker = "/app/logs/.runtime-security-probe"; open(marker, "wb").close(); os.unlink(marker); print("python=3.13.18 uid=999 gid=999 identity=bioetl shell=absent apk=absent pip=absent tmp=00700 tmp_owner=999:999 configs=root-readonly logs=writable")'
          } > reports/security/bioetl-image-provenance.txt 2>&1
          docker image inspect "${IMAGE_REF}" --format '{{.Id}}' \
            > reports/security/bioetl-image-id.txt
          docker run --rm --entrypoint python "${IMAGE_REF}" -c 'from importlib.metadata import distributions; print("\n".join(sorted("{}=={}".format(d.metadata["Name"], d.version) for d in distributions())))' \
            > reports/security/bioetl-pip-freeze.txt

      - name: Prove default image health contract
        env:
          IMAGE_REF: bioetl:${{ github.sha }}
        run: |
          set -euo pipefail
          container_id="$(docker run --detach --rm "${IMAGE_REF}")"
          cleanup() {
            docker rm --force "${container_id}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          health_status="starting"
          for _ in $(seq 1 60); do
            health_status="$(docker inspect "${container_id}" --format '{{.State.Health.Status}}')"
            if [ "${health_status}" = "healthy" ]; then
              break
            fi
            if [ "$(docker inspect "${container_id}" --format '{{.State.Running}}')" != "true" ]; then
              docker logs "${container_id}"
              exit 1
            fi
            sleep 2
          done
          test "${health_status}" = "healthy"
          docker exec "${container_id}" python -c 'import urllib.request; response = urllib.request.urlopen("http://127.0.0.1:8000/health/live", timeout=3); assert response.status == 200; response.read(); print("health_live=ok docker_health=healthy")'
          cleanup
          trap - EXIT

      # aquasecurity/trivy-action always resolves nested aquasecurity/setup-trivy
      # at job prepare time, even with skip-setup-trivy. That nested action is
      # not on the org allowlist (only aquasecurity/trivy-action@* is).
      - name: Install pinned Trivy CLI
        uses: ./.github/actions/install-trivy

      - name: Run full Trivy JSON evidence scan
        env:
          IMAGE_REF: bioetl:${{ github.sha }}
        run: |
          set -euo pipefail
          trivy image \
            --db-repository ghcr.io/aquasecurity/trivy-db:2 \
            --db-repository mirror.gcr.io/aquasec/trivy-db:2 \
            --format json \
            --output reports/security/trivy-results.json \
            --severity CRITICAL,HIGH,MEDIUM,UNKNOWN \
            --exit-code 0 \
            "${IMAGE_REF}"
          test -s reports/security/trivy-results.json

      - name: Convert canonical Trivy JSON evidence
        run: |
          set -euo pipefail
          trivy convert --format sarif --output reports/security/trivy-results.sarif reports/security/trivy-results.json
          test -s reports/security/trivy-results.sarif

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        if: always() && !cancelled()
        with:
          sarif_file: "reports/security/trivy-results.sarif"
          # Existing main configurations scan this same complete image.
          # Explicit categories keep comparisons stable across reusable callers.
          category: ".github/workflows/docker.yml:docker-build"
          wait-for-processing: true

      - name: Upload Trivy results for main-integrity comparison
        uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        if: always() && !cancelled()
        with:
          sarif_file: "reports/security/trivy-results.sarif"
          category: ".github/workflows/main-integrity.yml:docker-build"
          wait-for-processing: true

      - name: Upload Trivy results for PR coordinator comparison
        uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        if: always() && !cancelled()
        with:
          sarif_file: "reports/security/trivy-results.sarif"
          category: ".github/workflows/pr-required.yml:docker-build"
          wait-for-processing: true

      - name: Generate SBOM for the scanned local image
        uses: anchore/sbom-action@dfcb83b97731532d72be422cbc51ee64adb6fd56 # v0.24.4
        with:
          image: "bioetl:${{ github.sha }}"
          format: spdx-json
          output-file: reports/security/bioetl.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Capture Trivy and GitHub alert metadata
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          trivy version --format json > reports/security/trivy-version.json
          gh api --paginate --slurp \
            "/repos/${REPOSITORY}/code-scanning/alerts?state=open&tool_name=Trivy&per_page=100" \
            > reports/security/github-trivy-alerts.json

      - name: Export deterministic Trivy baseline CSV
        run: |
          python3 -c "from pathlib import Path; from scripts.engineering.qa.docker_stability_campaign.trivy_baseline import export_trivy_baseline_csv; count = export_trivy_baseline_csv(trivy_json=Path('reports/security/trivy-results.json'), github_alerts_json=Path('reports/security/github-trivy-alerts.json'), output=Path('reports/security/trivy-alerts.csv')); print(f'rows={count}')"

      - name: Run Trivy on pinned Wolfi runtime base image
        run: |
          set -euo pipefail
          trivy image \
            --db-repository ghcr.io/aquasecurity/trivy-db:2 \
            --db-repository mirror.gcr.io/aquasec/trivy-db:2 \
            --format json \
            --output reports/security/trivy-base-results.json \
            --severity CRITICAL,HIGH,MEDIUM,UNKNOWN \
            --exit-code 0 \
            "chainguard/wolfi-base@sha256:360896efb0753a5701c48f860e17130c205eae5a264797aa3e7ea126ee2923a7"
          test -s reports/security/trivy-base-results.json

      - name: Generate Trivy fixability audit
        run: |
          python3 -m scripts.engineering.qa.docker_stability_campaign.trivy_baseline \
            --trivy-json reports/security/trivy-results.json \
            --output reports/security/trivy-fixability-audit.json

      - name: Validate complete security baseline
        id: validate-baseline
        if: always() && !cancelled()
        run: |
          set -euo pipefail
          required=(
            reports/security/bioetl-image-id.txt
            reports/security/bioetl-image-provenance.txt
            reports/security/bioetl-pip-freeze.txt
            reports/security/bioetl.spdx.json
            reports/security/docker-build-metadata.json
            reports/security/github-trivy-alerts.json
            reports/security/trivy-alerts.csv
            reports/security/trivy-base-results.json
            reports/security/trivy-fixability-audit.json
            reports/security/trivy-results.json
            reports/security/trivy-results.sarif
            reports/security/trivy-version.json
          )
          for evidence in "${required[@]}"; do
            test -s "${evidence}"
          done
          sha256sum "${required[@]}" > reports/security/baseline.sha256

      - name: Upload reproducible security baseline
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && !cancelled() && steps.validate-baseline.outcome == 'success'
        with:
          name: bioetl-security-baseline-${{ github.sha }}
          path: |
            reports/security/bioetl-image-id.txt
            reports/security/bioetl-image-provenance.txt
            reports/security/bioetl-pip-freeze.txt
            reports/security/bioetl.spdx.json
            reports/security/docker-build-metadata.json
            reports/security/github-trivy-alerts.json
            reports/security/trivy-alerts.csv
            reports/security/trivy-base-results.json
            reports/security/trivy-fixability-audit.json
            reports/security/trivy-results.json
            reports/security/trivy-results.sarif
            reports/security/trivy-version.json
            reports/security/baseline.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Enforce canonical Trivy Critical High Medium zero policy
        run: |
          python3 -m scripts.engineering.qa.docker_stability_campaign.trivy_baseline \
            --trivy-json reports/security/trivy-results.json \
            --output reports/security/trivy-fixability-audit.json \
            --fail-on-blocking

      - name: Export exact scanned image for publication
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_call')
        env:
          IMAGE_REF: bioetl:${{ github.sha }}
        run: docker save "${IMAGE_REF}" | zstd -T0 -10 -o reports/security/bioetl-scanned-image.tar.zst

      - name: Transfer exact scanned image to publish job
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_call')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bioetl-scanned-image-${{ github.sha }}
          path: |
            reports/security/bioetl-scanned-image.tar.zst
            reports/security/bioetl-image-id.txt
          if-no-files-found: error
          retention-days: 1

  docker-complete:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - docker-runtime-contracts
      - docker-lint
      - docker-compose-validate
      - docker-build
    if: always()
    permissions:
      contents: read
    steps:
      - name: Aggregate Docker checks (fail-closed)
        env:
          DOCKER_RUNTIME_CONTRACTS_RESULT: ${{ needs.docker-runtime-contracts.result }}
          DOCKER_LINT_RESULT: ${{ needs.docker-lint.result }}
          DOCKER_COMPOSE_VALIDATE_RESULT: ${{ needs.docker-compose-validate.result }}
          DOCKER_BUILD_RESULT: ${{ needs.docker-build.result }}
        run: |
          set -euo pipefail
          failures=0
          for result in \
            "docker-runtime-contracts=${DOCKER_RUNTIME_CONTRACTS_RESULT}" \
            "docker-lint=${DOCKER_LINT_RESULT}" \
            "docker-compose-validate=${DOCKER_COMPOSE_VALIDATE_RESULT}" \
            "docker-build=${DOCKER_BUILD_RESULT}"; do
            echo "${result}"
            case "${result}" in
              *=success) ;;
              *) echo "::error::${result}"; failures=1 ;;
            esac
          done
          test "${failures}" -eq 0
