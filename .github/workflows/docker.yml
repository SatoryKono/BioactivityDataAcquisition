name: Docker Build & Compose Validation

permissions:
  contents: read

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - 'Dockerfile.bioetl'
      - 'docker-compose*.yml'
      - 'scripts/ops/runtime/docker/**'
      - 'scripts/engineering/qa/docker_stability_campaign/**'
      - 'scripts/engineering/qa/run_docker_stability_campaign.py'
      - 'configs/quality/docker_runtime_contracts.yaml'
      - 'tests/architecture/test_docker_runtime_contracts.py'
      - 'tests/unit/repo_backed/scripts/ops/docker/**'
      - 'tests/unit/repo_backed/scripts/engineering/qa/test_run_docker_stability_campaign.py'
      - '.dockerignore'
      - '.github/workflows/docker.yml'
      - '.github/actions/setup-python-uv/**'
  pull_request:
    branches: [ main, master, develop ]
    paths:
      - 'Dockerfile.bioetl'
      - 'docker-compose*.yml'
      - 'scripts/ops/runtime/docker/**'
      - 'scripts/engineering/qa/docker_stability_campaign/**'
      - 'scripts/engineering/qa/run_docker_stability_campaign.py'
      - 'configs/quality/docker_runtime_contracts.yaml'
      - 'tests/architecture/test_docker_runtime_contracts.py'
      - 'tests/unit/repo_backed/scripts/ops/docker/**'
      - 'tests/unit/repo_backed/scripts/engineering/qa/test_run_docker_stability_campaign.py'
      - '.dockerignore'
      - '.github/workflows/docker.yml'
      - '.github/actions/setup-python-uv/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-runtime-contracts:
    # Static + repo-backed unit contracts for optional Docker lane (RF-008).
    # Host-disruptive recovery/fault-injection/soak remain opt-in/manual.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Set up Python + uv
        uses: ./.github/actions/setup-python-uv
        with:
          python-version: "3.12"
          uv-extras: "dev"
          enable-pytest-cache: "true"
          pytest-cache-prefix: "docker-runtime-contracts"
          pytest-cache-fingerprint: ${{ hashFiles('tests/architecture/test_docker_runtime_contracts.py', 'tests/unit/repo_backed/scripts/ops/docker/**', 'tests/unit/repo_backed/scripts/engineering/qa/test_run_docker_stability_campaign.py', 'scripts/ops/runtime/docker/**', 'scripts/engineering/qa/docker_stability_campaign/**', 'configs/quality/docker_runtime_contracts.yaml') }}

      - name: Run Docker runtime static and unit contracts
        run: |
          uv run --frozen  pytest -q --tb=line \
            tests/architecture/test_docker_runtime_contracts.py \
            tests/unit/repo_backed/scripts/ops/docker/test_runtime_manager.py \
            tests/unit/repo_backed/scripts/ops/docker/test_docker_runtime_probe.py \
            tests/unit/repo_backed/scripts/engineering/qa/test_run_docker_stability_campaign.py

  docker-lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dockerfile:
          - Dockerfile.bioetl
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Run Hadolint (Dockerfile linting)
        uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5 # v3.3.0
        with:
          dockerfile: ${{ matrix.dockerfile }}

  docker-compose-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4

      - name: Validate docker-compose.yml syntax
        env:
          # Placeholder only for `compose config` interpolation; not a real secret.
          NEO4J_PASSWORD: ci-compose-validation-placeholder
        run: docker compose config > /dev/null

      - name: Validate docker-compose.monitoring.yml syntax
        env:
          NEO4J_PASSWORD: ci-compose-validation-placeholder
        run: docker compose -f docker-compose.monitoring.yml config > /dev/null

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: docker-lint
    permissions:
      contents: read
      security-events: write
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4

      - name: Build Docker image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: Dockerfile.bioetl
          push: false
          load: true
          tags: "bioetl:${{ github.sha }}"
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Prepare security reports directory
        run: mkdir -p reports/security

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: "bioetl:${{ github.sha }}"
          format: 'sarif'
          output: 'reports/security/trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@8dca8a82e2fa1a2c8908956f711300f9c4a4f4f6 # v2
        if: always()
        with:
          sarif_file: 'reports/security/trivy-results.sarif'

      - name: Run Trivy on debian:bookworm-slim base image
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: 'debian:bookworm-slim'
          format: 'table'
          severity: 'CRITICAL,HIGH'

  docker-push:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: docker-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image to GHCR
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: Dockerfile.bioetl
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
