name: Main Integrity

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # CI-MAP-8 / #12583: tip must reach terminal. A shared ref-wide group discards
  # the queued tip when a newer push arrives even with cancel-in-progress: false
  # (docs/00-project/governance/05-github-policy.md). Scope by SHA on every run;
  # keep cancel-in-progress disabled for main so an in-flight tip is not aborted.
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python + uv
        uses: ./.github/actions/setup-python-uv
        with:
          python-version: "3.12"
          uv-extras: "dev"

      - name: Validate repository root allowlist
        run: uv run --frozen --no-build python -m scripts.engineering.repo check-cleanliness --strict-untracked --check-local-forbidden-outputs

      - name: Block compiled Python artifacts
        run: |
          set -euo pipefail
          found="$(git ls-files -- ':(glob)**/*.pyc' ':(glob)**/__pycache__/**' | head -n 1 || true)"
          if [[ -n "$found" ]]; then
            echo "::error::compiled artifact found: $found"
            exit 1
          fi

      - name: Run root cleanliness unit test
        run: uv run --frozen --no-build pytest tests/unit/scripts/repo/test_audit_root_cleanliness.py -q --tb=line

  docker:
    needs: integrity
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/docker.yml
    with:
      cache-write: true
      caller-sha: ${{ github.sha }}
      # Conclusion ends at docker-complete. GHCR publish is main-ghcr-publish.yml.
      publish: false
    permissions:
      contents: read
      actions: read
      packages: write
      security-events: write
      id-token: write
      attestations: write
