name: Security

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  bandit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install bandit
        run: pip install bandit
      - name: Run bandit
        run: bandit -r src -c pyproject.toml
