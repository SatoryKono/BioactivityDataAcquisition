name: Security Scans

permissions:
  contents: read

on:
  workflow_call:
  push:
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.ai/**'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.ai/**'
      - 'LICENSE'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v5
        with:
          python-version: "3.13"
      - name: Install detect-secrets
        run: "pip install --only-binary=:all: detect-secrets==1.5.0 pytest==9.1.1 pytest-asyncio==1.4.0"
      - name: Run detect-secrets baseline check
        run: pytest tests/architecture/test_antipatterns.py::test_no_hardcoded_secrets -q --noconftest -o "addopts=" -o "filterwarnings=" -o "timeout=0"

  pip-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Python + uv
        uses: ./.github/actions/setup-python-uv
        with:
          uv-extras: "dev"

      - name: Run pip-audit
        run: |
          UV_CACHE_DIR=/tmp/.uv-cache uv export --no-hashes --no-emit-project --extra dev > /tmp/pip-audit-requirements.txt
          UV_CACHE_DIR=/tmp/.uv-cache uv run --frozen --no-build pip-audit --strict --ignore-vuln CVE-2026-3219 -r /tmp/pip-audit-requirements.txt --cache-dir /tmp/.pip-audit-cache

  bandit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Python + uv
        uses: ./.github/actions/setup-python-uv
        with:
          uv-extras: "dev"

      - name: Run Bandit
        run: uv run --frozen --no-build bandit -c pyproject.toml -r src/bioetl
