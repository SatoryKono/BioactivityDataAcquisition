name: Security (SAST)

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  sast:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install bandit[toml] pip-audit
          # Install osv-scanner (Google's vulnerability scanner, supports uv.lock natively)
          curl -sSL https://github.com/google/osv-scanner/releases/latest/download/osv-scanner_linux_amd64 -o /usr/local/bin/osv-scanner
          chmod +x /usr/local/bin/osv-scanner

      - name: Run Bandit SAST
        run: |
          echo "Running Bandit security linter..."
          mkdir -p reports
          bandit -r src/bioetl -c pyproject.toml -f json -o reports/bandit-report.json || true
          bandit -r src/bioetl -c pyproject.toml -f txt -o reports/bandit-report.txt || true
          echo "--- Bandit Report ---"
          cat reports/bandit-report.txt

      - name: Run osv-scanner (dependency vulnerabilities)
        run: |
          echo "Checking for known vulnerabilities with osv-scanner..."
          # osv-scanner natively supports uv.lock and pyproject.toml
          # No need to install the local package - it scans lockfiles directly
          osv-scanner scan --format json . > reports/osv-scanner.json 2>&1 || true
          osv-scanner scan . || true

      - name: Run pip-audit (secondary scanner)
        run: |
          echo "Running pip-audit as secondary scanner..."
          # Install project dependencies first
          python -m pip install .
          # Run pip-audit with --skip-editable to skip local package (bioetl)
          pip-audit --skip-editable --format json --output reports/pip-audit.json || true
          pip-audit --skip-editable || true

      - name: Upload security reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: reports/
          if-no-files-found: warn

      - name: Check for HIGH severity Bandit issues
        run: |
          echo "Checking for HIGH severity issues..."
          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          report_path = Path("reports/bandit-report.json")
          if not report_path.exists():
              print("⚠️  Bandit report not found, skipping severity check")
              sys.exit(0)

          with open(report_path) as f:
              data = json.load(f)

          high_issues = [
              i for i in data.get("results", [])
              if i.get("issue_severity") == "HIGH"
          ]
          medium_issues = [
              i for i in data.get("results", [])
              if i.get("issue_severity") == "MEDIUM"
          ]

          if high_issues:
              print(f"❌ Found {len(high_issues)} HIGH severity issue(s):")
              for issue in high_issues:
                  print(f"  - {issue['filename']}:{issue['line_number']}")
                  print(f"    {issue['issue_text']}")
                  print(f"    CWE: {issue.get('issue_cwe', {}).get('id', 'N/A')}")
              sys.exit(1)

          if medium_issues:
              print(f"⚠️  Found {len(medium_issues)} MEDIUM severity issue(s):")
              for issue in medium_issues[:5]:
                  print(f"  - {issue['filename']}:{issue['line_number']}: {issue['issue_text']}")
              if len(medium_issues) > 5:
                  print(f"  ... and {len(medium_issues) - 5} more")
              print("\nMEDIUM issues are warnings only, not blocking merge.")

          print("✅ No HIGH severity issues found")
          PY

      - name: Check for critical dependency vulnerabilities
        run: |
          echo "Checking for critical vulnerabilities..."
          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          all_vulns = []

          # Check osv-scanner results (primary scanner, supports uv.lock natively)
          osv_path = Path("reports/osv-scanner.json")
          if osv_path.exists():
              try:
                  with open(osv_path) as f:
                      data = json.load(f)
                  for result in data.get("results", []):
                      for pkg in result.get("packages", []):
                          pkg_info = pkg.get("package", {})
                          for group in pkg.get("groups", []):
                              for vuln_id in group.get("ids", []):
                                  all_vulns.append({
                                      "package": pkg_info.get("name", "unknown"),
                                      "version": pkg_info.get("version", "unknown"),
                                      "id": vuln_id,
                                      "severity": group.get("max_severity", "unknown"),
                                      "source": "osv-scanner"
                                  })
              except (json.JSONDecodeError, KeyError) as e:
                  print(f"⚠️  Could not parse osv-scanner report: {e}")
          else:
              print("⚠️  osv-scanner report not found")

          # Check pip-audit results (secondary scanner)
          pip_path = Path("reports/pip-audit.json")
          if pip_path.exists():
              try:
                  with open(pip_path) as f:
                      data = json.load(f)
                  dependencies = data if isinstance(data, list) else data.get("dependencies", [])
                  for dep in dependencies:
                      vulns_list = dep.get("vulns", [])
                      if not vulns_list:
                          continue
                      pkg_name = dep.get("name", "unknown")
                      pkg_version = dep.get("version", "unknown")
                      for v in vulns_list:
                          # Skip if already found by osv-scanner
                          vuln_id = v.get("id", "unknown")
                          if any(x["id"] == vuln_id for x in all_vulns):
                              continue
                          all_vulns.append({
                              "package": pkg_name,
                              "version": pkg_version,
                              "id": vuln_id,
                              "severity": "unknown",
                              "source": "pip-audit"
                          })
              except (json.JSONDecodeError, KeyError) as e:
                  print(f"⚠️  Could not parse pip-audit report: {e}")

          # Categorize by severity (osv-scanner provides CVSS scores)
          critical_vulns = [v for v in all_vulns if str(v.get("severity", "0")).replace(".", "").isdigit() and float(v.get("severity", 0)) >= 9.0]
          high_vulns = [v for v in all_vulns if str(v.get("severity", "0")).replace(".", "").isdigit() and 7.0 <= float(v.get("severity", 0)) < 9.0]
          other_vulns = [v for v in all_vulns if v not in critical_vulns and v not in high_vulns]

          if critical_vulns:
              print(f"🚨 Found {len(critical_vulns)} CRITICAL vulnerability issue(s):")
              for v in critical_vulns[:5]:
                  print(f"  - {v['package']}=={v['version']}: {v['id']} (CVSS: {v['severity']})")
              if len(critical_vulns) > 5:
                  print(f"  ... and {len(critical_vulns) - 5} more")
              # Critical vulnerabilities should fail CI
              # sys.exit(1)

          if high_vulns:
              print(f"⚠️  Found {len(high_vulns)} HIGH severity vulnerability issue(s):")
              for v in high_vulns[:5]:
                  print(f"  - {v['package']}=={v['version']}: {v['id']} (CVSS: {v['severity']})")
              if len(high_vulns) > 5:
                  print(f"  ... and {len(high_vulns) - 5} more")

          if other_vulns:
              print(f"ℹ️  Found {len(other_vulns)} other vulnerability issue(s):")
              for v in other_vulns[:5]:
                  print(f"  - {v['package']}=={v['version']}: {v['id']}")
              if len(other_vulns) > 5:
                  print(f"  ... and {len(other_vulns) - 5} more")

          if all_vulns:
              print("\n⚠️  Please review and update vulnerable dependencies.")

          print(f"\n✅ Dependency vulnerability check complete ({len(all_vulns)} total issues found)")
          PY

  secrets-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for secret scanning

      - name: Run Gitleaks (secret detection)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

      - name: Check for hardcoded secrets patterns
        run: |
          echo "Checking for common secret patterns..."
          python - <<'PY'
          import re
          import sys
          from pathlib import Path

          # Patterns that might indicate hardcoded secrets
          secret_patterns = [
              (r'(?i)(password|passwd|pwd)\s*=\s*["\'][^"\']+["\']', "Hardcoded password"),
              (r'(?i)(api_key|apikey|api-key)\s*=\s*["\'][^"\']+["\']', "Hardcoded API key"),
              (r'(?i)(secret|token)\s*=\s*["\'][a-zA-Z0-9]{20,}["\']', "Hardcoded secret/token"),
              (r'(?i)aws_secret_access_key\s*=\s*["\'][^"\']+["\']', "Hardcoded AWS secret"),
              (r'-----BEGIN (RSA |DSA |EC )?PRIVATE KEY-----', "Private key in code"),
          ]

          # Files/paths to skip
          skip_patterns = [
              r'\.pyc$',
              r'__pycache__',
              r'\.git/',
              r'\.venv/',
              r'node_modules/',
              r'\.env\.example$',
              r'tests/fixtures/',
              r'conftest\.py$',  # Test config often has mock secrets
          ]

          issues = []
          src_path = Path("src")

          if not src_path.exists():
              print("Source directory not found")
              sys.exit(0)

          for py_file in src_path.rglob("*.py"):
              # Skip excluded paths
              file_str = str(py_file)
              if any(re.search(p, file_str) for p in skip_patterns):
                  continue

              try:
                  content = py_file.read_text()
              except Exception:
                  continue

              for i, line in enumerate(content.split('\n'), 1):
                  # Skip comments and test assertions
                  stripped = line.strip()
                  if stripped.startswith('#') or 'assert' in stripped:
                      continue

                  for pattern, desc in secret_patterns:
                      if re.search(pattern, line):
                          # Additional check: skip if it's a config/env variable reference
                          if 'os.environ' in line or 'getenv' in line or 'settings.' in line:
                              continue
                          issues.append(f"{py_file}:{i}: {desc}")

          if issues:
              print(f"⚠️  Found {len(issues)} potential hardcoded secret(s):")
              for issue in issues[:10]:
                  print(f"  - {issue}")
              if len(issues) > 10:
                  print(f"  ... and {len(issues) - 10} more")
              print("\nPlease review and ensure no real secrets are committed.")
              # Warning only - manual review needed
          else:
              print("✅ No obvious hardcoded secrets found")
          PY
