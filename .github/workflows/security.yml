name: Security Scans

permissions:
  contents: read

on:
  workflow_call:
  push:
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.ai/**'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.ai/**'
      - 'LICENSE'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - name: Setup Python + uv
        uses: ./.github/actions/setup-python-uv
        with:
          python-version: "3.13"
          uv-extras: "dev"
      - name: Run detect-secrets baseline check
        run: uv run --frozen --no-build pytest tests/architecture/test_antipatterns.py::test_no_hardcoded_secrets -q --noconftest -o "addopts=" -o "filterwarnings=" -o "timeout=0"

  pip-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Setup Python + uv
        uses: ./.github/actions/setup-python-uv
        with:
          uv-extras: "dev"

      - name: Run pip-audit
        run: |
          # Residual OSV #9853 (expiry 2026-11-30): pip==26.1.2 in uv.lock.
          # CVE-2026-3219 / PYSEC-2026-3721 — pip archive-parsing (dev extra).
          # CI/dev only; not in the Wolfi/scratch runtime image.
          # Do not add osv-scanner.toml and do not dismiss Scorecard
          # Vulnerabilities (OpenSSF check #1294).
          UV_CACHE_DIR=/tmp/.uv-cache uv export --no-hashes --no-emit-project --extra dev > /tmp/pip-audit-requirements.txt
          UV_CACHE_DIR=/tmp/.uv-cache uv run --frozen --no-build pip-audit --strict \
            --ignore-vuln CVE-2026-3219 \
            --ignore-vuln PYSEC-2026-3721 \
            -r /tmp/pip-audit-requirements.txt --cache-dir /tmp/.pip-audit-cache

  bandit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Setup Python + uv
        uses: ./.github/actions/setup-python-uv
        with:
          uv-extras: "dev"

      - name: Run Bandit
        run: uv run --frozen --no-build bandit -c pyproject.toml -r src/bioetl

  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_SUMMARY: "false"

  osv-scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run OSV-Scanner
        id: osv-scan
        continue-on-error: true
        uses: google/osv-scanner-action/osv-scanner-action@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
        with:
          scan-args: |-
            --lockfile=uv.lock
            --format=json
            --output-file=osv-results.json

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Fail on HIGH/CRITICAL OSV findings
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m scripts.engineering.repo.check_github_actions_runtime_policy --osv-json osv-results.json
