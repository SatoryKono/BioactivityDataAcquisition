name: "[DEPRECATED] Reusable CI setup"
# DEPRECATED: Use .github/actions/setup-python-uv composite action instead.
# This workflow_call approach runs in a separate runner, making it unsuitable
# for setup steps. Kept for backward compatibility; will be removed in a future PR.

on:
  workflow_call:
    inputs:
      python-version:
        required: false
        default: "3.11"
        type: string
      uv-extras:
        description: "Space-separated uv extras to install (e.g. 'dev tracing performance')"
        required: false
        default: "dev tracing"
        type: string
      enable-pytest-cache:
        description: "Enable pytest/hypothesis cache restoration"
        required: false
        default: false
        type: boolean
      pytest-cache-prefix:
        description: "Cache key prefix for pytest cache (to differentiate cache scopes)"
        required: false
        default: "pytest"
        type: string

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      python-version: ${{ inputs.python-version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Cache uv and virtualenv
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
            .venv
          key: uv-${{ runner.os }}-py${{ inputs.python-version }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-py${{ inputs.python-version }}-

      - name: Cache pytest and hypothesis
        if: ${{ inputs.enable-pytest-cache }}
        uses: actions/cache@v4
        with:
          path: |
            .pytest_cache
            .hypothesis
          key: ${{ inputs.pytest-cache-prefix }}-${{ runner.os }}-py${{ inputs.python-version }}-${{ hashFiles('tests/**/*.py') }}
          restore-keys: |
            ${{ inputs.pytest-cache-prefix }}-${{ runner.os }}-py${{ inputs.python-version }}-
