name: "[DEPRECATED] Reusable CI setup"
# DEPRECATED: Use .github/actions/setup-python-uv composite action instead.
# This workflow_call approach runs in a separate runner, making it unsuitable
# for setup steps. Kept for backward compatibility; will be removed in a future PR.

on:
  workflow_call:
    inputs:
      python-version:
        required: false
        default: "3.13"
        type: string

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      python-version: ${{ inputs.python-version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Cache uv and virtualenv
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v4
        with:
          path: |
            ~/.cache/uv
            .venv
          key: uv-${{ runner.os }}-py${{ inputs.python-version }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-py${{ inputs.python-version }}-

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.11.26"
