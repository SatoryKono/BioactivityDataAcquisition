name: "[DEPRECATED] Reusable CI setup"
# DEPRECATED: Use .github/actions/setup-python-uv composite action instead.
# This workflow_call approach runs in a separate runner, making it unsuitable
# for setup steps. Kept for backward compatibility; will be removed in a future PR.

on:
  workflow_call:
    inputs:
      python-version:
        required: false
        default: "3.11"
        type: string

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      python-version: ${{ inputs.python-version }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Cache uv and virtualenv
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/uv
            .venv
          key: uv-${{ runner.os }}-py${{ inputs.python-version }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-py${{ inputs.python-version }}-

      - name: Install uv
        uses: astral-sh/setup-uv@162b8acf397cb069dec09a3f5a9847cf71cfa46a # v7
