name: Project Automation (Cursor Commands)

on:
    push:
        branches: [ main, master, develop ]
    pull_request:
        types: [ opened, synchronize, reopened ]

jobs:
    validate-and-test:
        name: Run Cursor Commands
        runs-on: ubuntu-latest

        steps:
            -   name: Checkout code
                uses: actions/checkout@v4

            -   name: Set up Python 3.11
                uses: actions/setup-python@v5
                with:
                    python-version: "3.11"
                    cache: "pip"

            -   name: Install dependencies
                run: |
                    python -m pip install --upgrade pip
                    python -m pip install -e .[dev]

            # /run-tests command
            -   name: Run Tests (Coverage)
                run: |
                    pytest tests -m "not e2e" --ignore=tests/e2e --ignore=tests/contract \
                      --cov=src --cov-report=term-missing --cov-fail-under=85

            # /render-diagrams command
            -   name: Render Diagrams & Check Consistency
                run: |
                    python scripts/render_diagrams.py
                    # Fail if diagrams were modified by the script (meaning they were out of sync)
                    if [[ -n $(git status --porcelain docs/) ]]; then
                      echo "Error: Diagrams are out of sync. Please run 'python scripts/render_diagrams.py' locally and commit the changes."
                      git diff
                      exit 1
                    fi

            # Architecture checks (implied by project rules)
            -   name: Architecture Linting
                run: |
                    lint-imports --config .importlinter
