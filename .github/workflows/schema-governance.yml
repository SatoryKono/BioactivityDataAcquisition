name: Schema Governance

on:
  push:
    branches: [main, master]
    paths:
      - 'src/bioetl/domain/contracts/**'
      - 'src/bioetl/domain/entities/**'
      - 'src/bioetl/infrastructure/schemas/**'
      - 'src/tools/scripts/generate_contracts.py'
      - 'scripts/generate_schema_artifacts.py'
      - 'src/tools/verify_schema_parity.py'
      - 'src/tools/generate_json_field_typing_inventory.py'
      - 'docs/03-data-model/json-field-typing-inventory.md'
      - '.github/workflows/schema-governance.yml'
  pull_request:
    paths:
      - 'src/bioetl/domain/contracts/**'
      - 'src/bioetl/domain/entities/**'
      - 'src/bioetl/infrastructure/schemas/**'
      - 'src/tools/scripts/generate_contracts.py'
      - 'scripts/generate_schema_artifacts.py'
      - 'src/tools/verify_schema_parity.py'
      - 'src/tools/generate_json_field_typing_inventory.py'
      - 'docs/03-data-model/json-field-typing-inventory.md'
      - '.github/workflows/schema-governance.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  PYTHONDONTWRITEBYTECODE: 1
  PYTHONUNBUFFERED: 1

jobs:
  generated-artifacts:
    name: Generated Artifacts Gate (blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Verify generated schema artifacts are up-to-date
        run: uv run python scripts/generate_schema_artifacts.py --check

  contracts-export:
    name: Contracts Export (blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Verify contract schema imports
        run: |
          uv run python -c "
          from bioetl.domain.contracts.gold import (
              ChEMBLActivityGoldSchema,
              ChEMBLAssayGoldSchema,
              ChEMBLMoleculeGoldSchema,
              ChEMBLTargetGoldSchema,
              PubChemCompoundGoldSchema,
              PubMedPublicationGoldSchema,
              UniProtProteinGoldSchema,
          )
          print('All gold schema contracts imported successfully')
          "

  schema-parity:
    name: Schema Parity + PK Coverage (blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Verify schema parity (Domain → Silver → Gold)
        run: uv run python src/tools/verify_schema_parity.py --mode blocking

      - name: Rebuild JSON field typing inventory
        run: uv run python src/tools/generate_json_field_typing_inventory.py

      - name: Ensure JSON field typing inventory is up-to-date
        run: git diff --exit-code docs/03-data-model/json-field-typing-inventory.md

  schema-governance-status:
    name: Schema Governance Status
    runs-on: ubuntu-latest
    needs: [generated-artifacts, contracts-export, schema-parity]
    if: always()

    steps:
      - name: Check governance results
        run: |
          if [[ "${{ needs.contracts-export.result }}" == "failure" ]]; then
            echo "::error::Contracts export failed — schema imports are broken"
            exit 1
          fi
          if [[ "${{ needs.generated-artifacts.result }}" == "failure" ]]; then
            echo "::error::Generated schema artifacts are stale"
            exit 1
          fi
          if [[ "${{ needs.schema-parity.result }}" == "failure" ]]; then
            echo "::warning::Schema parity check reported mismatches (non-blocking)"
          fi
          echo "::notice::Schema governance checks completed"
