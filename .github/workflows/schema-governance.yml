name: Schema Governance

on:
  push:
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.ai/**'
      - '.github/workflows/**'
      - 'LICENSE'
    branches: [main, master]
    paths:
      - 'src/bioetl/domain/schemas/**'
      - 'src/bioetl/domain/contracts/**'
      - 'src/bioetl/domain/entities/**'
      - 'src/bioetl/infrastructure/schemas/**'
      - 'tests/contract/silver_schemas/**'
      - 'scripts/schema/generate_contracts.py'
      - 'scripts/schema/generate_schema_artifacts.py'
      - 'src/tools/verify_schema_parity.py'
      - 'src/tools/generate_json_field_typing_inventory.py'
      - 'docs/03-guides/silver-schema-testing-guide.md'
      - 'docs/03-data-model/json-field-typing-inventory.md'
      - '.github/workflows/schema-governance.yml'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.ai/**'
      - '.github/workflows/**'
      - 'LICENSE'
    paths:
      - 'src/bioetl/domain/schemas/**'
      - 'src/bioetl/domain/contracts/**'
      - 'src/bioetl/domain/entities/**'
      - 'src/bioetl/infrastructure/schemas/**'
      - 'tests/contract/silver_schemas/**'
      - 'scripts/schema/generate_contracts.py'
      - 'scripts/schema/generate_schema_artifacts.py'
      - 'src/tools/verify_schema_parity.py'
      - 'src/tools/generate_json_field_typing_inventory.py'
      - 'docs/03-guides/silver-schema-testing-guide.md'
      - 'docs/03-data-model/json-field-typing-inventory.md'
      - '.github/workflows/schema-governance.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  PYTHONDONTWRITEBYTECODE: 1
  PYTHONUNBUFFERED: 1

jobs:
  generated-artifacts:
    name: Generated Artifacts Gate (blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Python + uv
        uses: ./.github/actions/setup-python-uv
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          uv-extras: "dev"

      - name: Verify generated schema artifacts are up-to-date
        run: uv run python -m scripts.schema generate-artifacts --check

  contracts-export:
    name: Contracts Export (blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Python + uv
        uses: ./.github/actions/setup-python-uv
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          uv-extras: "dev"

      - name: Verify contract schema imports
        run: |
          uv run python -c "
          from bioetl.domain.contracts.gold import (
              ChEMBLActivityGoldSchema,
              ChEMBLAssayGoldSchema,
              ChEMBLMoleculeGoldSchema,
              ChEMBLTargetGoldSchema,
              PubChemCompoundGoldSchema,
              PubMedPublicationGoldSchema,
              UniProtProteinGoldSchema,
          )
          print('All gold schema contracts imported successfully')
          "

  schema-parity:
    name: Schema Parity + PK Coverage (blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Python + uv
        uses: ./.github/actions/setup-python-uv
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          uv-extras: "dev"

      - name: Verify schema parity (Domain → Silver → Gold)
        run: uv run python src/tools/verify_schema_parity.py --mode blocking

      - name: Rebuild JSON field typing inventory
        run: uv run python src/tools/generate_json_field_typing_inventory.py

      - name: Ensure JSON field typing inventory is up-to-date
        run: git diff --exit-code docs/03-data-model/json-field-typing-inventory.md

  silver-schema-drift:
    name: Silver Schema Drift Gate (selected pipelines)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Python + uv
        uses: ./.github/actions/setup-python-uv
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          uv-extras: "tests"

      - name: Run representative Silver schema drift checks
        run: |
          mkdir -p reports/schema-governance
          uv run pytest \
            tests/contract/silver_schemas/test_selected_pipeline_schema_drift.py \
            -m contracts \
            -q --tb=short --maxfail=1 \
            --junitxml=reports/schema-governance/silver-schema-drift.xml

      - name: Upload Silver schema drift telemetry
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: silver-schema-drift-results
          path: reports/schema-governance/silver-schema-drift.xml
          if-no-files-found: warn
          retention-days: 14

  schema-governance-status:
    name: Schema Governance Status
    runs-on: ubuntu-latest
    needs: [generated-artifacts, contracts-export, schema-parity, silver-schema-drift]
    if: always()
    timeout-minutes: 2

    steps:
      - name: Check governance results
        run: |
          if [[ "${{ needs.contracts-export.result }}" == "failure" ]]; then
            echo "::error::Contracts export failed — schema imports are broken"
            exit 1
          fi
          if [[ "${{ needs.generated-artifacts.result }}" == "failure" ]]; then
            echo "::error::Generated schema artifacts are stale"
            exit 1
          fi
          if [[ "${{ needs.schema-parity.result }}" == "failure" ]]; then
            echo "::error::Schema parity check reported blocking mismatches"
            exit 1
          fi
          if [[ "${{ needs.silver-schema-drift.result }}" == "failure" ]]; then
            echo "::error::Representative Silver schema drift gate failed"
            exit 1
          fi
          echo "::notice::Schema governance checks completed"
