name: PR 13435 full test evidence
on:
  push:
    branches: ["verify/pr-13435-a30dcb2d"]
concurrency:
  group: verify-pr-13435-full-tests
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        target: [test, test-fast]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 6b0452d871a18371f5f2230fe963d0490c961192
          persist-credentials: false
          fetch-depth: 0
      - name: Fetch pinned external resource inventory evidence
        run: |
          git fetch --no-tags origin 1a459aa85f2fe16b3fbfc66df5473ac1dd421d9e
          test "$(git rev-parse '1a459aa85f2fe16b3fbfc66df5473ac1dd421d9e^{tree}')" = 858d1852085bd90c3aae6bceb782d8ddcda26302
      - uses: ./.github/actions/setup-python-uv
        with:
          uv-extras: dev tracing performance
      - name: Run requested Makefile target
        env:
          TARGET: ${{ matrix.target }}
        run: make "$TARGET"
