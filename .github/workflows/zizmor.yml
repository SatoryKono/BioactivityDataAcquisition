name: zizmor

permissions:
  contents: read

on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: zizmor-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@1b4550e929643b8b26a62303c6bd64814271a4f1 # v0.9.2
        with:
          inputs: |
            .github/workflows
            .github/actions
          min-severity: high
          min-confidence: high
          version: "1.29.0"
          config: .github/zizmor.yml
          advanced-security: "true"
