name: Validate vendored Mermaid assets
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
    pull_request:
      paths:
        - 'assets/javascripts/mermaid*'
        - 'assets/stylesheets/mermaid*'
        - '.github/workflows/validate-vendored-mermaid-assets.yml'
    push:
      branches: [ main ]
      paths:
        - 'assets/javascripts/mermaid*'
        - 'assets/stylesheets/mermaid*'
        - '.github/workflows/validate-vendored-mermaid-assets.yml'

jobs:
    check-mermaid:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            -   name: Checkout repository
                uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

            -   name: Run mermaid check (warn, don't fail)
                run: |
                    set -e
                    files=("assets/javascripts/mermaid.min.js" "assets/javascripts/mermaid.esm.min.mjs" "assets/stylesheets/mermaid.css")
                    missing=0
                    for f in "${files[@]}"; do
                      if [ ! -f "$f" ]; then
                        echo "MISSING: $f"
                        missing=1
                      fi
                    done
                    if [ $missing -eq 1 ]; then
                      echo "::warning ::Mermaid vendored assets missing; builds will fall back to CDN at runtime. To vendor locally: run 'make vendor-mermaid' and include the files in your PR."
                    else
                      echo "Mermaid vendored assets present."
                    fi
