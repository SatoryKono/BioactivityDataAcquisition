name: Validate vendored Mermaid assets
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
    pull_request:
      paths:
        - 'docs/assets/javascripts/mermaid-init.js'
        - 'docs/assets/stylesheets/mermaid-responsive.css'
        - 'mkdocs.yml'
        - '.github/workflows/validate-vendored-mermaid-assets.yml'
    push:
      branches: [ main ]
      paths:
        - 'docs/assets/javascripts/mermaid-init.js'
        - 'docs/assets/stylesheets/mermaid-responsive.css'
        - 'mkdocs.yml'
        - '.github/workflows/validate-vendored-mermaid-assets.yml'

jobs:
    check-mermaid:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            -   name: Checkout repository
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                with:
                  persist-credentials: false

            -   name: Fail if mkdocs mermaid assets are missing
                run: |
                    set -euo pipefail
                    files=(
                      "docs/assets/javascripts/mermaid-init.js"
                      "docs/assets/stylesheets/mermaid-responsive.css"
                    )
                    for f in "${files[@]}"; do
                      if [ ! -f "$f" ]; then
                        echo "MISSING: $f"
                        exit 1
                      fi
                      rel="${f#docs/}"
                      if ! grep -F -q "$rel" mkdocs.yml; then
                        echo "mkdocs.yml does not reference $rel"
                        exit 1
                      fi
                    done
                    echo "MkDocs mermaid assets present."
