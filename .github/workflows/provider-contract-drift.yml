name: Provider Contract Drift

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.13"
  VCR_RECORD_MODE: "none"

jobs:
  replay-gate:
    name: Replay Drift Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python + uv
        uses: ./.github/actions/setup-python-uv
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          uv-extras: "tests"

      - name: Run replay contract suites
        run: |
          uv run --frozen --no-build python -m pytest \
            tests/contract/test_provider_contract_drift_helper.py \
            tests/contract/test_provider_contract_snapshot_registry.py \
            tests/contract/test_provider_contract_replay_registry.py \
            tests/contract/test_provider_contract_drift_replay.py \
            tests/unit/application/services/test_export_manifests.py \
            -q --tb=short

      - name: Run xwalk and generated normalization artifact drift gates
        run: |
          uv run --frozen --no-build python -m scripts.engineering.qa check-xwalk-missing-backlog
          uv run --frozen --no-build python -m scripts.docs generate-pipeline-normalization-matrix --check

      - name: Generate provider drift artifact
        run: |
          uv run --frozen --no-build python -m scripts.engineering.qa report-provider-contract-drift \
            --output reports/quality/provider-contract-drift-report.json \
            --fail-on breaking

      - name: Upload provider drift artifact
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: provider-contract-drift-report
          path: reports/quality/provider-contract-drift-report.json
          retention-days: 30

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
