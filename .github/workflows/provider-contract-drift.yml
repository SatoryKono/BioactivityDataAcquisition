name: Provider Contract Drift

on:
  pull_request:
    paths:
      - ".github/workflows/provider-contract-drift.yml"
      - "configs/quality/test_matrix.yaml"
      - "docs/04-reference/pipelines/**"
      - "docs/reports/generated/pipeline_normalization_field_matrix/**"
      - "docs/03-guides/testing.md"
      - "src/bioetl/application/services/export_manifests.py"
      - "scripts/engineering/qa/__main__.py"
      - "scripts/engineering/qa/README.md"
      - "scripts/engineering/qa/report_provider_contract_drift.py"
      - "scripts/docs/matrix/generate_pipeline_normalization_matrix.py"
      - "tests/contract/**"
      - "tests/unit/application/services/test_export_manifests.py"
      - "tests/unit/scripts/test_generate_pipeline_normalization_field_matrix.py"
      - "tests/fixtures/contracts/**"
      - "tests/fixtures/vcr/**"
  push:
    branches: [main, develop]
    paths:
      - ".github/workflows/provider-contract-drift.yml"
      - "configs/quality/test_matrix.yaml"
      - "docs/04-reference/pipelines/**"
      - "docs/reports/generated/pipeline_normalization_field_matrix/**"
      - "docs/03-guides/testing.md"
      - "src/bioetl/application/services/export_manifests.py"
      - "scripts/engineering/qa/__main__.py"
      - "scripts/engineering/qa/README.md"
      - "scripts/engineering/qa/report_provider_contract_drift.py"
      - "scripts/docs/matrix/generate_pipeline_normalization_matrix.py"
      - "tests/contract/**"
      - "tests/unit/application/services/test_export_manifests.py"
      - "tests/unit/scripts/test_generate_pipeline_normalization_field_matrix.py"
      - "tests/fixtures/contracts/**"
      - "tests/fixtures/vcr/**"
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"

jobs:
  replay-gate:
    name: Replay Drift Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Python + uv
        uses: ./.github/actions/setup-python-uv
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          uv-extras: "tests"
          uv-sync-args: ""

      - name: Run replay contract suites
        run: |
          uv run python -m pytest \
            tests/contract/test_provider_contract_drift_helper.py \
            tests/contract/test_provider_contract_snapshot_registry.py \
            tests/contract/test_provider_contract_replay_registry.py \
            tests/contract/test_provider_contract_drift_replay.py \
            tests/unit/application/services/test_export_manifests.py \
            -q --tb=short

      - name: Run xwalk and generated normalization artifact drift gates
        run: |
          uv run python -m scripts.engineering.qa check-xwalk-missing-backlog
          uv run python -m scripts.docs generate-pipeline-normalization-matrix --check

      - name: Generate provider drift artifact
        run: |
          uv run python -m scripts.engineering.qa report-provider-contract-drift \
            --output reports/quality/provider-contract-drift-report.json \
            --fail-on breaking

      - name: Upload provider drift artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provider-contract-drift-report
          path: reports/quality/provider-contract-drift-report.json
          retention-days: 30
