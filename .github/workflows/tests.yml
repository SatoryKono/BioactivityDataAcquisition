name: Tests

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v1

      - name: Install dependencies
        run: |
          uv sync --extra dev --extra tracing --extra performance

      - name: Validate orjson installation
        run: |
          uv run python - <<'PY'
          import orjson
          print(orjson.__version__)
          PY

      - name: Run Unit Tests (parallel)
        run: |
          # Run unit tests in parallel for speed (61% faster)
          uv run pytest tests/unit/ -v -n auto --dist loadscope --cov=src/bioetl --cov-report=term

      - name: Run Architecture Tests (parallel)
        run: |
          # Architecture tests are stateless, safe for parallel
          uv run pytest tests/architecture/ tests/security/ tests/test_*.py -v -n auto --dist loadscope --cov=src/bioetl --cov-append --cov-report=term

      - name: Run Integration Tests (serial)
        run: |
          # Integration tests use VCR and shared state, run serially
          uv run pytest tests/integration/ -v --cov=src/bioetl --cov-append --cov-report=term --cov-fail-under=85
