# Note: Previously had a duplicate in project-automation.yml (removed)
name: Tests

on:
    push:
        branches: [ main, master, develop ]
        paths-ignore:
            - 'docs/**'
            - '*.md'
            - '.ai/**'
            - '.claude/**'
            - 'LICENSE'
    pull_request:
        branches: [ main, master, develop ]
        paths-ignore:
            - 'docs/**'
            - '*.md'
            - '.ai/**'
            - '.claude/**'
            - 'LICENSE'

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    # Use CI hypothesis profile for faster property-based tests (10 examples instead of 50)
    HYPOTHESIS_PROFILE: ci
    # Optimize Python for CI
    PYTHONDONTWRITEBYTECODE: 1
    PYTHONUNBUFFERED: 1
    # Quality exemptions: expiry is always blocking for merge safety.
    QUALITY_EXEMPTIONS_GATE_MODE: block
    # Growth uses staged warn->block rollout from debt_scorecard.yaml sections.
    QUALITY_EXEMPTIONS_GROWTH_MODE: auto
    # Temporary exception windows are budget-only and timeboxed.
    QUALITY_EXEMPTIONS_TEMP_WINDOW_MODE: budget-only
    QUALITY_EXEMPTIONS_MAX_GRACE_WINDOW_DAYS: 45
    QUALITY_EXEMPTIONS_REGISTRY: configs/quality/architecture_metric_exemptions.yaml
    QUALITY_EXEMPTIONS_SCORECARD: configs/quality/debt_scorecard.yaml

jobs:
    # Minimal dependency smoke: keep test lanes unblocked by unrelated governance checks
    smoke-check:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            contents: read

        steps:
            -   name: Checkout code
                uses: actions/checkout@v6

            -   name: Set up Python 3.11
                uses: actions/setup-python@v5
                with:
                    python-version: "3.11"

            -   name: Validate VCR cassette placement
                run: python scripts/engineering/qa/vcr/check_root_vcr_cassettes.py

            -   name: Validate VCR filename policy
                run: python scripts/engineering/qa/vcr/check_vcr_filename_policy.py

            -   name: Validate full VCR metadata inventory
                run: uv run python scripts/ops/migrations/active/backfill_vcr_metadata_sidecars.py --check

            -   name: Validate VCR metadata stale-age policy
                run: python scripts/engineering/qa/vcr/check_vcr_metadata_age.py --max-age-days 90

            -   name: Validate VCR metadata catalog
                run: uv run python -m scripts.engineering.qa report-vcr-metadata --check

            -   name: Validate version consistency
                run: python scripts/engineering/repo/check_version_consistency.py

            -   name: Install uv + cache + dependencies
                uses: ./.github/actions/setup-python-uv
                with:
                    python-version: "3.11"

            -   name: Smoke check (dependencies + core imports)
                run: |
                    uv run pytest tests/smoke/ -v --tb=short

    control-plane-e2e:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        needs: smoke-check
        permissions:
            contents: read
        env:
            BIOETL_TEST_MODE: "true"
            BIOETL_PIPELINE__HEALTH_CHECK_MODE: "probe"

        steps:
            -   name: Checkout code
                uses: actions/checkout@v6

            -   name: Setup Python + uv
                uses: ./.github/actions/setup-python-uv
                with:
                    python-version: "3.11"

            -   name: Run control-plane completeness smoke
                run: |
                    mkdir -p reports/e2e
                    VCR_RECORD_MODE=none uv run pytest \
                      tests/e2e/test_pubchem_compound_e2e.py::test_pubchem_compound_full_cycle \
                      --vcr-record=none \
                      -q --tb=short \
                      --junitxml=reports/e2e/control-plane-completeness.xml

            -   name: Upload control-plane completeness artifacts
                uses: actions/upload-artifact@v4
                if: always()
                with:
                    name: control-plane-completeness
                    path: reports/e2e/control-plane-completeness.xml
                    if-no-files-found: warn
                    retention-days: 14

    governance-preflight:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read

        steps:
            -   name: Checkout code
                uses: actions/checkout@v6

            -   name: Setup Python + uv
                uses: ./.github/actions/setup-python-uv
                with:
                    python-version: "3.11"

            -   name: Validate quality exemptions registry (owner/reason/expiry metadata)
                run: |
                    uv run python scripts/engineering/qa/check_quality_exemptions.py \
                      --registry "${QUALITY_EXEMPTIONS_REGISTRY}" \
                      --scorecard "${QUALITY_EXEMPTIONS_SCORECARD}" \
                      --mode "${QUALITY_EXEMPTIONS_GATE_MODE}" \
                      --growth-mode "${QUALITY_EXEMPTIONS_GROWTH_MODE}" \
                      --trend-report on \
                      --temp-window-mode "${QUALITY_EXEMPTIONS_TEMP_WINDOW_MODE}" \
                      --max-grace-window-days "${QUALITY_EXEMPTIONS_MAX_GRACE_WINDOW_DAYS}"

            -   name: Validate scripts inventory + lifecycle governance
                run: |
                    uv run python scripts/engineering/repo/check_scripts_inventory.py \
                      --check \
                      --manifest configs/quality/scripts_inventory_manifest.json \
                      --check-lifecycle \
                      --forbid-evaluate-active \
                      --lifecycle-registry configs/quality/scripts_lifecycle_registry.json

            -   name: Validate scripts catalog governance policy
                run: uv run python scripts/engineering/repo/check_scripts_catalog.py --catalog scripts/engineering/repo/catalog.yaml

            -   name: Validate deterministic Neo4j memory ontology invariants
                run: uv run python -m scripts.engineering.ci neo4j-memory

            -   name: Validate hotspot-family baseline artifacts
                run: uv run python -m scripts.engineering.qa report-family-baseline --active-only --check

            -   name: Pre-merge naming/package consistency gate
                run: uv run python scripts/engineering/qa/check_naming_package_consistency.py --check

            -   name: DQ consistency validation (fail-fast)
                run: uv run python scripts/engineering/qa/validate_dq_consistency.py

            -   name: "Quality ratchet (fail-fast: domain)"
                run: |
                    uv run pytest \
                      tests/architecture/test_code_metrics.py::TestFileSizeLimits::test_domain_files_under_limit \
                      tests/architecture/test_code_metrics.py::TestFunctionComplexity::test_domain_complexity \
                      -q --tb=short

            -   name: "Quality ratchet (fail-fast: application)"
                run: |
                    uv run pytest \
                      tests/architecture/test_code_metrics.py::TestFileSizeLimits::test_application_files_under_limit \
                      tests/architecture/test_code_metrics.py::TestFunctionComplexity::test_application_complexity \
                      -q --tb=short

            -   name: "Quality ratchet (fail-fast: infrastructure)"
                run: |
                    uv run pytest \
                      tests/architecture/test_code_metrics.py::TestFileSizeLimits::test_infrastructure_files_under_limit \
                      tests/architecture/test_code_metrics.py::TestFunctionComplexity::test_infrastructure_complexity \
                      -q --tb=short

    neo4j-memory-live-audit:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        needs: governance-preflight
        permissions:
            contents: read

        steps:
            -   name: Checkout code
                uses: actions/checkout@v6

            -   name: Setup Python + uv
                uses: ./.github/actions/setup-python-uv
                with:
                    python-version: "3.11"

            -   name: Start local Neo4j for live audit
                run: docker compose up -d neo4j

            -   name: Wait for Neo4j HTTP health
                run: |
                    for attempt in $(seq 1 90); do
                      if curl -fsS http://localhost:7474/browser/ >/dev/null; then
                        exit 0
                      fi
                      sleep 2
                    done
                    echo "Neo4j HTTP endpoint did not become ready in time" >&2
                    exit 1

            -   name: Apply sync and validate live Neo4j audit
                run: uv run python -m scripts.engineering.ci neo4j-memory-live

            -   name: Stop local Neo4j
                if: always()
                run: docker compose down -v neo4j

    config-schema-preflight:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read

        steps:
            -   name: Checkout code
                uses: actions/checkout@v6

            -   name: Setup Python + uv
                uses: ./.github/actions/setup-python-uv
                with:
                    python-version: "3.11"

            -   name: Validate pipeline configs + schema links (blocking)
                run: uv run python scripts/schema/validate_pipeline_configs.py

            -   name: Validate config invariants (blocking)
                run: uv run python scripts/schema/check_config_invariants.py

            -   name: Validate silver required_fields coverage (blocking)
                run: uv run python -m scripts.schema check-required-fields --verbose

            -   name: Validate effective_optional_v1 resolution (blocking)
                run: uv run python -m scripts.schema audit-optionality --check

            -   name: Check matrix structural contract export freshness (blocking)
                run: uv run python -m scripts.docs export-matrix-structural-contract --check

            -   name: Check matrix structural workbook sync freshness (blocking)
                run: |
                    workbook="docs/reports/chembl_pipeline_silver_matrices_v12.xlsx"
                    if [ ! -f "$workbook" ]; then
                      echo "Skipping matrix structural workbook sync check: $workbook is not present in repository checkout."
                      exit 0
                    fi
                    uv run python -m scripts.docs sync-matrix-structural-policy --check --input "$workbook" --output "$workbook"

            -   name: Check generated config schemas are up to date
                run: uv run python scripts/schema/generate_pipeline_schema.py --check

            -   name: Check architecture dependency docs drift
                run: uv run python scripts/engineering/qa/generate_architecture_dependency_map.py --check

            -   name: Check docs drift (forbidden patterns)
                run: uv run python scripts/engineering/qa/check_docs_drift.py

            -   name: Validate docker-compose.yml syntax
                run: docker compose config > /dev/null

            -   name: Validate docker-compose.monitoring.yml syntax
                run: docker compose -f docker-compose.monitoring.yml config > /dev/null

    track-d-gates:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        needs: smoke-check
        permissions:
            contents: read
        env:
            BIOETL_TEST_MODE: "true"
            BIOETL_PIPELINE__HEALTH_CHECK_MODE: "probe"
            BIOETL_TEST_RELAXED_DQ: "1"

        steps:
            -   name: Checkout code
                uses: actions/checkout@v6

            -   name: Setup Python + uv
                uses: ./.github/actions/setup-python-uv
                with:
                    python-version: "3.11"

            -   name: Run Track D fail-fast gate (fixtures + compatibility + linkage)
                run: |
                    mkdir -p reports/test-telemetry
                    uv run pytest \
                      tests/architecture/test_config_ci_invariants.py::TestBronzeFixtureCoverage::test_bronze_fixture_coverage \
                      tests/integration/ci/test_config_stability.py::TestCheckpointResumeCompatibilityPolicy \
                      tests/integration/ci/test_track_d_fixture_control_plane_linkage.py \
                      -q --tb=short --maxfail=1 \
                      --junitxml=reports/test-telemetry/junit-track-d.xml

            -   name: Upload Track D telemetry
                if: always()
                uses: actions/upload-artifact@v4
                with:
                    name: test-telemetry-track-d
                    path: reports/test-telemetry/junit-track-d.xml
                    if-no-files-found: warn
                    retention-days: 14

    dq-consistency-gate:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        needs: governance-preflight
        permissions:
            contents: read

        steps:
            -   name: Checkout code
                uses: actions/checkout@v6

            -   name: Setup Python + uv
                uses: ./.github/actions/setup-python-uv
                with:
                    python-version: "3.11"

            -   name: Run DQ consistency validation
                run: uv run python scripts/engineering/qa/validate_dq_consistency.py

    quality-metrics-gate:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        needs: governance-preflight
        permissions:
            contents: read

        steps:
            -   name: Checkout code
                uses: actions/checkout@v6

            -   name: Setup Python + uv
                uses: ./.github/actions/setup-python-uv

            -   name: Compute quality metrics and enforce integral score gate
                run: |
                    make qa-debt \
                      QUALITY_EXEMPTIONS_REGISTRY="${QUALITY_EXEMPTIONS_REGISTRY}" \
                      QUALITY_EXEMPTIONS_SCORECARD="${QUALITY_EXEMPTIONS_SCORECARD}" \
                      QUALITY_REPORT_OUTPUT="reports/quality/ci-quality-metrics.json" \
                      QUALITY_SUMMARY_OUT="$GITHUB_STEP_SUMMARY"

            -   name: Upload quality metrics artifact
                if: always()
                uses: actions/upload-artifact@v4
                with:
                    name: ci-quality-metrics
                    path: reports/quality/ci-quality-metrics.json

    # Fast tests run first for quick feedback
    test-fast:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        needs: smoke-check  # Only minimal dependency smoke should gate fast tests
        permissions:
            contents: read

        steps:
            -   name: Checkout code
                uses: actions/checkout@v6

            -   name: Setup Python + uv
                uses: ./.github/actions/setup-python-uv
                with:
                    enable-pytest-cache: "true"
                    pytest-cache-prefix: "pytest-fast"
                    pytest-cache-fingerprint: ${{ hashFiles('tests/unit/**/*.py', 'tests/architecture/**/*.py', 'tests/conftest.py', 'pyproject.toml') }}

            -   name: Run Fast Unit Tests (no slow markers)
                run: |
                    mkdir -p reports/test-telemetry
                    # Quick feedback: run unit tests without slow markers
                    # Uses HYPOTHESIS_PROFILE=fast for minimal property-based examples
                    HYPOTHESIS_PROFILE=fast \
                    uv run pytest tests/unit/ tests/architecture/ \
                      -m "not slow and not serial and not memory" \
                      -n auto --dist loadscope --max-worker-restart=0 \
                      -q --tb=short \
                      --junitxml=reports/test-telemetry/junit-fast.xml

            -   name: Upload fast test telemetry
                if: always()
                uses: actions/upload-artifact@v4
                with:
                    name: test-telemetry-fast
                    path: reports/test-telemetry/junit-fast.xml
                    if-no-files-found: warn
                    retention-days: 7

    # Full test matrix runs in parallel for comprehensive coverage
    test-matrix:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        needs: smoke-check  # Allow matrix to start after minimal dependency smoke only
        permissions:
            contents: read
        strategy:
            fail-fast: false
            matrix:
                python-version: [ "3.11", "3.12" ]
                test-group:
                    -   name: unit-domain
                        path: tests/unit/domain/
                        cache_glob: tests/unit/domain/**/*.py
                    -   name: unit-application
                        path: tests/unit/application/
                        cache_glob: tests/unit/application/**/*.py
                    -   name: unit-infrastructure
                        path: tests/unit/infrastructure/
                        cache_glob: tests/unit/infrastructure/**/*.py
                    -   name: unit-other
                        path: tests/unit/ --ignore=tests/unit/domain/ --ignore=tests/unit/application/ --ignore=tests/unit/infrastructure/
                        cache_glob: tests/unit/**/*.py
                    -   name: integration
                        path: tests/integration/
                        cache_glob: tests/integration/**/*.py
                    -   name: security
                        path: tests/security/
                        cache_glob: tests/security/**/*.py

        steps:
            -   name: Checkout code
                uses: actions/checkout@v6

            -   name: Setup Python + uv
                uses: ./.github/actions/setup-python-uv
                with:
                    python-version: ${{ matrix.python-version }}
                    enable-pytest-cache: "true"
                    pytest-cache-prefix: "pytest-${{ matrix.python-version }}-${{ matrix.test-group.name }}"
                    pytest-cache-fingerprint: ${{ hashFiles(matrix.test-group.cache_glob, 'tests/conftest.py', 'pyproject.toml') }}

            -   name: Run Tests (${{ matrix.test-group.name }} on Python ${{ matrix.python-version }})
                run: |
                    mkdir -p reports/coverage
                    mkdir -p reports/test-telemetry
                    if [ "${{ matrix.python-version }}" = "3.11" ]; then
                      COVERAGE_FILE=reports/coverage/.coverage.${{ matrix.test-group.name }} \
                      uv run pytest ${{ matrix.test-group.path }} \
                        -m "not serial and not memory" \
                        -n auto --dist loadscope --max-worker-restart=0 \
                        -q --tb=short \
                        --junitxml=reports/test-telemetry/junit.${{ matrix.test-group.name }}.xml \
                        --cov=src/bioetl --cov-report=
                    else
                      uv run pytest ${{ matrix.test-group.path }} \
                        -m "not serial and not memory" \
                        -n auto --dist loadscope --max-worker-restart=0 \
                        -q --tb=short
                    fi

            -   name: Upload coverage shard (${{ matrix.test-group.name }} on Python 3.11)
                if: always() && matrix.python-version == '3.11'
                uses: actions/upload-artifact@v4
                with:
                    name: coverage-data-${{ matrix.test-group.name }}
                    path: reports/coverage/.coverage.${{ matrix.test-group.name }}
                    if-no-files-found: error
                    retention-days: 7

            -   name: Upload test telemetry (${{ matrix.test-group.name }} on Python 3.11)
                if: always() && matrix.python-version == '3.11'
                uses: actions/upload-artifact@v4
                with:
                    name: test-telemetry-${{ matrix.test-group.name }}
                    path: reports/test-telemetry/junit.${{ matrix.test-group.name }}.xml
                    if-no-files-found: warn
                    retention-days: 7

    memory-tests:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        needs: smoke-check
        permissions:
            contents: read

        steps:
            -   name: Checkout code
                uses: actions/checkout@v6

            -   name: Setup Python + uv
                uses: ./.github/actions/setup-python-uv
                with:
                    enable-pytest-cache: "true"
                    pytest-cache-prefix: "pytest-memory"
                    pytest-cache-fingerprint: ${{ hashFiles('tests/unit/scripts/ops/test_neo4j_memory*.py', 'tests/conftest.py', 'pyproject.toml') }}

            -   name: Run dedicated Neo4j memory test lane
                run: |
                    mkdir -p reports/test-telemetry
                    uv run pytest tests/unit/scripts/ops/ \
                      -m "memory" \
                      -q --tb=short \
                      --junitxml=reports/test-telemetry/junit-memory.xml

            -   name: Upload memory test telemetry
                if: always()
                uses: actions/upload-artifact@v4
                with:
                    name: test-telemetry-memory
                    path: reports/test-telemetry/junit-memory.xml
                    if-no-files-found: warn
                    retention-days: 7

    performance-budgets:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        needs: smoke-check
        permissions:
            contents: read

        steps:
            -   name: Checkout code
                uses: actions/checkout@v6

            -   name: Setup Python + uv
                uses: ./.github/actions/setup-python-uv
                with:
                    uv-extras: "dev tracing performance"

            -   name: Run performance budget gates (hotspots)
                run: |
                    mkdir -p reports/performance
                    uv run pytest tests/performance/test_hotspot_budgets.py \
                      -m "benchmark and performance" \
                      -p no:xdist \
                      -q --tb=short \
                      --perf-obs-out reports/performance/hotspot-observations.jsonl \
                      --junitxml=reports/performance/hotspot-budgets.xml

            -   name: Build hotspot degradation report
                if: always()
                run: |
                    mkdir -p reports/performance
                    if [ -f reports/performance/hotspot-observations.jsonl ]; then
                      uv run python scripts/engineering/qa/generate_hotspot_degradation_report.py \
                        --observations reports/performance/hotspot-observations.jsonl \
                        --budgets tests/performance/hotspot_budgets.json \
                        --window-size 5 \
                        --json-out reports/performance/hotspot-degradation.json \
                        --markdown-out reports/performance/hotspot-degradation.md
                    else
                      echo "No hotspot observations file found; skipping degradation report generation."
                    fi

            -   name: Publish hotspot degradation summary
                if: always()
                run: |
                    if [ -f reports/performance/hotspot-degradation.md ]; then
                      cat reports/performance/hotspot-degradation.md >> "$GITHUB_STEP_SUMMARY"
                    fi

            -   name: Gate on degradation report
                if: always()
                run: |
                    if [ -f reports/performance/hotspot-degradation.json ]; then
                      python3 -c "
                    import json, sys
                    data = json.load(open('reports/performance/hotspot-degradation.json'))
                    failed = data.get('summary', {}).get('failed', 0)
                    if failed > 0:
                        print(f'FAIL: {failed} benchmark(s) over budget')
                        sys.exit(1)
                    print('PASS: all benchmarks within budget')
                    "
                    fi

            -   name: Upload performance budget report
                uses: actions/upload-artifact@v4
                if: always()
                with:
                    name: performance-hotspot-budgets
                    path: |
                        reports/performance/hotspot-budgets.xml
                        reports/performance/hotspot-observations.jsonl
                        reports/performance/hotspot-degradation.json
                        reports/performance/hotspot-degradation.md
                        tests/performance/hotspot_budgets.json
                    if-no-files-found: warn
                    retention-days: 30

    # Final coverage verification (combine shard coverage + serial-only pass)
    coverage-verify:
        runs-on: ubuntu-latest
        needs:
            - smoke-check
            - test-fast
            - test-matrix
        timeout-minutes: 20
        permissions:
            contents: read

        steps:
            -   name: Checkout code
                uses: actions/checkout@v6

            -   name: Setup Python + uv
                uses: ./.github/actions/setup-python-uv
                with:
                    enable-pytest-cache: "true"
                    pytest-cache-prefix: "pytest-coverage"
                    pytest-cache-fingerprint: ${{ hashFiles('tests/**/*.py', 'tests/conftest.py', 'pyproject.toml') }}

            -   name: Download coverage shards
                uses: actions/download-artifact@v4
                with:
                    pattern: coverage-data-*
                    path: reports/coverage
                    merge-multiple: true

            -   name: Run serial-only tests with resilient pytest runner
                run: |
                    mkdir -p reports/coverage
                    # Canonical serial subset: -m "serial and not e2e and not benchmark"
                    COVERAGE_FILE=reports/coverage/.coverage.serial uv run python \
                      scripts/engineering/ci/run_pytest_resilient.py \
                      --target tests/ \
                      --reports-dir reports/pytest/coverage-verify \
                      --parallel-marker "serial and not e2e and not benchmark and not memory" \
                      --parallel-addopts "-q --tb=short -p no:xdist --ignore=tests/e2e --ignore=tests/contract --cov=src/bioetl --cov-report=" \
                      --skip-serial-pass

            -   name: Combine coverage shards and enforce threshold
                run: |
                    uv run python -m coverage combine reports/coverage --keep
                    uv run python -m coverage report --show-missing --fail-under=85
                    uv run python -m coverage xml -o reports/coverage/coverage.xml

            -   name: Upload Coverage Report
                uses: actions/upload-artifact@v4
                if: always()
                with:
                    name: coverage-report
                    path: reports/coverage/coverage.xml
                    retention-days: 30

    duration-telemetry:
        if: always()
        runs-on: ubuntu-latest
        needs:
            - track-d-gates
            - test-fast
            - test-matrix
            - memory-tests
        timeout-minutes: 10

        steps:
            -   name: Checkout code
                uses: actions/checkout@v6

            -   name: Setup Python + uv
                uses: ./.github/actions/setup-python-uv
                with:
                    python-version: "3.11"

            -   name: Download JUnit telemetry shards
                uses: actions/download-artifact@v4
                continue-on-error: true
                with:
                    pattern: test-telemetry-*
                    path: reports/test-telemetry/raw
                    merge-multiple: true

            -   name: Build test-health summaries
                shell: bash
                run: |
                    mkdir -p reports/quality/test-runs
                    mkdir -p reports/test-telemetry/raw
                    shopt -s nullglob

                    unit_junit=()
                    if [ -f reports/test-telemetry/raw/junit-fast.xml ]; then
                      unit_junit+=(reports/test-telemetry/raw/junit-fast.xml)
                    fi
                    for junit_path in reports/test-telemetry/raw/junit.unit-*.xml; do
                      unit_junit+=("$junit_path")
                    done
                    if [ "${#unit_junit[@]}" -gt 0 ]; then
                      junit_args=()
                      for junit_path in "${unit_junit[@]}"; do
                        junit_args+=(--junit "$junit_path")
                      done
                      uv run python -m scripts.engineering.qa summarize-junit \
                        --suite unit-fast \
                        --run-id "unit-fast-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
                        --reports-dir reports/quality/test-runs \
                        --command "tests.yml unit-fast shards" \
                        "${junit_args[@]}"
                    fi

                    if [ -f reports/test-telemetry/raw/junit.integration.xml ]; then
                      uv run python -m scripts.engineering.qa summarize-junit \
                        --suite integration-replay \
                        --run-id "integration-replay-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
                        --reports-dir reports/quality/test-runs \
                        --junit reports/test-telemetry/raw/junit.integration.xml \
                        --command "tests.yml integration shard"
                    fi

                    if [ -f reports/test-telemetry/raw/junit.security.xml ]; then
                      uv run python -m scripts.engineering.qa summarize-junit \
                        --suite security \
                        --run-id "security-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
                        --reports-dir reports/quality/test-runs \
                        --junit reports/test-telemetry/raw/junit.security.xml \
                        --command "tests.yml security shard"
                    fi

                    if [ -f reports/test-telemetry/raw/junit-memory.xml ]; then
                      uv run python -m scripts.engineering.qa summarize-junit \
                        --suite memory \
                        --run-id "memory-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
                        --reports-dir reports/quality/test-runs \
                        --junit reports/test-telemetry/raw/junit-memory.xml \
                        --command "tests.yml memory lane"
                    fi

                    if [ -f reports/test-telemetry/raw/junit-track-d.xml ]; then
                      uv run python -m scripts.engineering.qa summarize-junit \
                        --suite track-d \
                        --run-id "track-d-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
                        --reports-dir reports/quality/test-runs \
                        --junit reports/test-telemetry/raw/junit-track-d.xml \
                        --command "tests.yml track-d gates"
                    fi

                    uv run python -m scripts.engineering.qa test-health \
                      --reports-dir reports/quality/test-runs \
                      --last 100 \
                      --markdown-out reports/quality/test-runs/rollup.md \
                      --github-step-summary

            -   name: Build slow-test duration summary
                shell: bash
                run: |
                    mkdir -p reports/test-telemetry
                    python - <<'PY'
                    from __future__ import annotations

                    import json
                    import os
                    import xml.etree.ElementTree as ET
                    from pathlib import Path

                    raw_dir = Path("reports/test-telemetry/raw")
                    rows: list[dict[str, object]] = []
                    for junit_path in sorted(raw_dir.rglob("*.xml")):
                        root = ET.parse(junit_path).getroot()
                        for testcase in root.iter("testcase"):
                            case_name = testcase.attrib.get("name", "")
                            class_name = testcase.attrib.get("classname", "")
                            duration = float(testcase.attrib.get("time", "0") or 0.0)
                            if duration <= 0:
                                continue
                            full_name = (
                                f"{class_name}::{case_name}" if class_name else case_name
                            )
                            rows.append(
                                {
                                    "source": junit_path.name,
                                    "test": full_name,
                                    "duration_s": round(duration, 3),
                                }
                            )

                    rows.sort(key=lambda row: row["duration_s"], reverse=True)
                    top_rows = rows[:25]

                    md_path = Path("reports/test-telemetry/slowest-tests.md")
                    json_path = Path("reports/test-telemetry/slowest-tests.json")

                    lines = [
                        "# Slowest Tests",
                        "",
                        f"Collected test cases: `{len(rows)}`",
                        "",
                    ]
                    if top_rows:
                        lines.extend(
                            [
                                "| Rank | Duration (s) | Test | Source |",
                                "|---:|---:|---|---|",
                            ]
                        )
                        for idx, row in enumerate(top_rows, start=1):
                            lines.append(
                                f"| {idx} | {row['duration_s']:.3f} | `{row['test']}` | `{row['source']}` |"
                            )
                    else:
                        lines.append("No JUnit test-case durations were collected.")

                    markdown = "\n".join(lines) + "\n"
                    md_path.write_text(markdown, encoding="utf-8")
                    json_path.write_text(
                        json.dumps(
                            {"total_cases": len(rows), "top_slowest": top_rows},
                            indent=2,
                        )
                        + "\n",
                        encoding="utf-8",
                    )

                    summary_path = os.getenv("GITHUB_STEP_SUMMARY")
                    if summary_path:
                        with Path(summary_path).open("a", encoding="utf-8") as handle:
                            handle.write(markdown)
                    PY

            -   name: Upload slow-test telemetry
                if: always()
                uses: actions/upload-artifact@v4
                with:
                    name: test-duration-telemetry
                    path: |
                        reports/test-telemetry/slowest-tests.md
                        reports/test-telemetry/slowest-tests.json
                    if-no-files-found: warn
                    retention-days: 14

            -   name: Upload test-health telemetry
                if: always()
                uses: actions/upload-artifact@v4
                with:
                    name: test-health-telemetry
                    path: reports/quality/test-runs/
                    if-no-files-found: warn
                    retention-days: 14
