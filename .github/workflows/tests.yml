name: Tests

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

env:
  # Use CI hypothesis profile for faster property-based tests (10 examples instead of 50)
  HYPOTHESIS_PROFILE: ci
  # Optimize Python for CI
  PYTHONDONTWRITEBYTECODE: 1
  PYTHONUNBUFFERED: 1

jobs:
  # Fast tests run first for quick feedback
  test-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v1

      - name: Cache pytest and hypothesis
        uses: actions/cache@v4
        with:
          path: |
            .pytest_cache
            .hypothesis
          key: pytest-fast-${{ runner.os }}-${{ hashFiles('tests/**/*.py') }}
          restore-keys: |
            pytest-fast-${{ runner.os }}-

      - name: Install dependencies
        run: uv sync --extra dev --extra tracing --extra performance

      - name: Run Fast Unit Tests (no slow markers)
        run: |
          # Quick feedback: run unit tests without slow markers
          # Uses HYPOTHESIS_PROFILE=fast for minimal property-based examples
          HYPOTHESIS_PROFILE=fast uv run pytest tests/unit/ tests/architecture/ \
            -m "not slow" \
            -n auto --dist loadscope \
            -q --tb=short

  # Full test matrix runs in parallel for comprehensive coverage
  test-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test-fast  # Only run full tests if fast tests pass
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        test-group:
          - name: unit-domain
            path: tests/unit/domain/
          - name: unit-application
            path: tests/unit/application/
          - name: unit-infrastructure
            path: tests/unit/infrastructure/
          - name: unit-other
            path: tests/unit/ --ignore=tests/unit/domain/ --ignore=tests/unit/application/ --ignore=tests/unit/infrastructure/
          - name: integration
            path: tests/integration/
          - name: architecture
            path: tests/architecture/

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v1

      - name: Cache pytest and hypothesis
        uses: actions/cache@v4
        with:
          path: |
            .pytest_cache
            .hypothesis
          key: pytest-${{ matrix.python-version }}-${{ matrix.test-group.name }}-${{ runner.os }}-${{ hashFiles('tests/**/*.py') }}
          restore-keys: |
            pytest-${{ matrix.python-version }}-${{ matrix.test-group.name }}-${{ runner.os }}-

      - name: Install dependencies
        run: uv sync --extra dev --extra tracing --extra performance

      - name: Run Tests (${{ matrix.test-group.name }} on Python ${{ matrix.python-version }})
        run: |
          uv run pytest ${{ matrix.test-group.path }} \
            -n auto --dist loadscope \
            --cov=src/bioetl \
            --cov-report=xml:coverage-${{ matrix.test-group.name }}-py${{ matrix.python-version }}.xml \
            -q --tb=short

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ matrix.test-group.name }}-py${{ matrix.python-version }}
          path: coverage-${{ matrix.test-group.name }}-py${{ matrix.python-version }}.xml
          retention-days: 7

  # Final coverage verification (runs full test suite with threshold)
  coverage-verify:
    runs-on: ubuntu-latest
    needs: test-matrix
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v1

      - name: Cache pytest and hypothesis
        uses: actions/cache@v4
        with:
          path: |
            .pytest_cache
            .hypothesis
          key: pytest-coverage-${{ runner.os }}-${{ hashFiles('tests/**/*.py') }}
          restore-keys: |
            pytest-coverage-${{ runner.os }}-

      - name: Install dependencies
        run: uv sync --extra dev --extra tracing --extra performance

      - name: Run Full Tests with Coverage Threshold
        run: |
          # Final coverage verification: 85% threshold (RULES.md §4.2)
          uv run pytest tests/ -m "not e2e" \
            --ignore=tests/e2e --ignore=tests/contract \
            -n auto --dist loadscope \
            --cov=src/bioetl \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=85

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 30
