name: Semantic Pipeline Governance

on:
  push:
    branches: [main, develop]
    paths:
      - "configs/base/**"
      - "configs/composites/**"
      - "configs/entities/**"
      - "configs/field_registry/**"
      - "configs/quality/**"
      - "docs/04-reference/contracts/**"
      - "reports/semantic_pipeline_audit/**"
      - "scripts/docs/matrix/generate_pipeline_normalization_matrix.py"
      - "scripts/engineering/qa/check_generic_field_ownership.py"
      - "scripts/engineering/qa/check_ontology_unit_semantics.py"
      - "scripts/engineering/qa/check_semantic_anchor_parity.py"
      - "scripts/engineering/qa/check_semantic_governance_policy.py"
      - "scripts/engineering/qa/check_semantic_pair_matrix_budget.py"
      - "scripts/engineering/qa/check_semantic_registry_drift.py"
      - "scripts/engineering/qa/generate_semantic_pipeline_audit.py"
      - "src/bioetl/domain/contracts/**"
      - "src/bioetl/domain/mapping/**"
      - "src/bioetl/domain/normalization/**"
      - "src/bioetl/domain/registry/**"
      - "src/bioetl/domain/schemas/**"
      - "src/bioetl/domain/validation/**"
      - "tests/integration/config/test_semantic_*.py"
      - ".github/workflows/semantic-governance.yml"
  pull_request:
    paths:
      - "configs/base/**"
      - "configs/composites/**"
      - "configs/entities/**"
      - "configs/field_registry/**"
      - "configs/quality/**"
      - "docs/04-reference/contracts/**"
      - "reports/semantic_pipeline_audit/**"
      - "scripts/docs/matrix/generate_pipeline_normalization_matrix.py"
      - "scripts/engineering/qa/check_generic_field_ownership.py"
      - "scripts/engineering/qa/check_ontology_unit_semantics.py"
      - "scripts/engineering/qa/check_semantic_anchor_parity.py"
      - "scripts/engineering/qa/check_semantic_governance_policy.py"
      - "scripts/engineering/qa/check_semantic_pair_matrix_budget.py"
      - "scripts/engineering/qa/check_semantic_registry_drift.py"
      - "scripts/engineering/qa/generate_semantic_pipeline_audit.py"
      - "src/bioetl/domain/contracts/**"
      - "src/bioetl/domain/mapping/**"
      - "src/bioetl/domain/normalization/**"
      - "src/bioetl/domain/registry/**"
      - "src/bioetl/domain/schemas/**"
      - "src/bioetl/domain/validation/**"
      - "tests/integration/config/test_semantic_*.py"
      - ".github/workflows/semantic-governance.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"
  PYTHONDONTWRITEBYTECODE: 1
  PYTHONUNBUFFERED: 1

jobs:
  semantic-governance:
    name: Semantic Audit Gates
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Setup Python + uv
        uses: ./.github/actions/setup-python-uv
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          uv-extras: "dev"

      - name: Verify semantic audit generated artifacts
        run: uv run --frozen --no-build python -m scripts.engineering.qa report-semantic-pipeline-audit --check

      - name: Verify semantic pair-matrix budget
        run: uv run --frozen --no-build python -m scripts.engineering.qa check-semantic-pair-budget --check --json

      - name: Verify semantic registry drift
        run: uv run --frozen --no-build python -m scripts.engineering.qa check-semantic-registry-drift --check --json

      - name: Verify semantic governance policy
        run: uv run --frozen --no-build python -m scripts.engineering.qa check-semantic-governance-policy --check --json

      - name: Verify semantic anchor parity
        run: uv run --frozen --no-build python -m scripts.engineering.qa check-semantic-anchor-parity --check --json

      - name: Verify generic field ownership
        run: uv run --frozen --no-build python -m scripts.engineering.qa check-generic-field-ownership --check --json

      - name: Verify ontology/unit semantic separation
        run: uv run --frozen --no-build python -m scripts.engineering.qa check-ontology-unit-semantics --check --json

      - name: Run semantic governance regression tests
        run: |
          uv run --frozen --no-build pytest -p no:benchmark --noconftest \
            tests/integration/config/test_semantic_field_unification_contract.py \
            tests/integration/config/test_semantic_governance_policy.py \
            tests/integration/config/test_semantic_pair_matrix_budget.py \
            tests/integration/config/test_semantic_anchor_parity.py \
            -q --tb=short
