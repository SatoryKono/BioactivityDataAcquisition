name: CodeRabbit

# PR reviews are handled by the CodeRabbit GitHub App (no API key in PR context).
# This workflow runs the CLI only on trusted events (push to protected default
# branches and manual dispatch) so CODERABBIT_API_KEY is never exposed to
# untrusted pull_request code.
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coderabbit-${{ github.sha }}
  cancel-in-progress: true

jobs:
  cli-review:
    name: CodeRabbit CLI
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install CodeRabbit CLI
        env:
          # Pins: configs/quality/github_actions_remote_artifacts.yaml (#9156).
          CODERABBIT_CLI_VERSION: "0.7.5"
          CODERABBIT_CLI_SHA256: "0b47cb4de75188c0184f290d8d6818a793a9528e8f79cf660c6a65f225b045c1"
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/coderabbit-linux-x64.zip"
          url="https://cli.coderabbit.ai/releases/${CODERABBIT_CLI_VERSION}/coderabbit-linux-x64.zip"
          curl -fsSL --proto '=https' --tlsv1.2 "$url" -o "${archive}"
          echo "${CODERABBIT_CLI_SHA256}  ${archive}" | sha256sum -c -
          extract_dir="${RUNNER_TEMP}/coderabbit-cli"
          mkdir -p "${extract_dir}"
          unzip -q "${archive}" -d "${extract_dir}"
          install_dir="${HOME}/.local/bin"
          mkdir -p "${install_dir}"
          install -m 0755 "${extract_dir}/coderabbit" "${install_dir}/coderabbit"
          echo "${install_dir}" >> "${GITHUB_PATH}"
          PATH="${install_dir}:${PATH}" command -v coderabbit >/dev/null
          PATH="${install_dir}:${PATH}" coderabbit --version
          rm -f "${archive}"

      - name: Run CodeRabbit CLI review
        env:
          CODERABBIT_API_KEY: ${{ secrets.CODERABBIT_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${CODERABBIT_API_KEY:-}" ]; then
            echo "::warning::CODERABBIT_API_KEY is not set. Skipping CLI review."
            echo "Add repository secret CODERABBIT_API_KEY (CodeRabbit Agentic API key)."
            echo "Owner/admin step for ARCH-CR-08 / #6870; do not commit secrets."
            echo "Until set, rely on the CodeRabbit GitHub App for PR reviews only."
            exit 0
          fi

          coderabbit auth login --api-key "$CODERABBIT_API_KEY"

          if [ "${{ github.event_name }}" = "push" ]; then
            BEFORE="${{ github.event.before }}"
            ZERO="0000000000000000000000000000000000000000"
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "$ZERO" ]; then
              coderabbit review --base=main --plain
            else
              coderabbit review --base-commit="$BEFORE" --plain
            fi
          else
            # workflow_dispatch: compare current HEAD against main
            coderabbit review --base=main --plain
          fi
