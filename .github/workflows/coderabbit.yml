name: CodeRabbit

# PR reviews are handled by the CodeRabbit GitHub App (no API key in PR context).
# This workflow runs the CLI only on trusted events (push to protected default
# branches and manual dispatch) so CODERABBIT_API_KEY is never exposed to
# untrusted pull_request code.
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coderabbit-${{ github.sha }}
  cancel-in-progress: true

jobs:
  cli-review:
    name: CodeRabbit CLI
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install CodeRabbit CLI
        run: |
          set -euo pipefail
          # Download installer to a local path, verify content markers, then execute.
          # Avoids curl|sh and keeps an inspectable artifact for audit (Sonar S8482).
          install_script="${RUNNER_TEMP}/coderabbit-install.sh"
          curl -fsSL --proto '=https' --tlsv1.2 \
            "https://cli.coderabbit.ai/install.sh" \
            -o "${install_script}"
          # Fail closed on unexpected installer payload.
          if ! grep -Eq 'coderabbit|CodeRabbit' "${install_script}"; then
            echo "::error::Unexpected CodeRabbit install script content"
            exit 1
          fi
          if sed '/^[[:space:]]*#/d' "${install_script}" \
            | grep -Eqi 'curl .*\|\s*(ba)?sh|wget .*\|\s*(ba)?sh'; then
            echo "::error::Install script nests a remote pipe-to-shell; refusing"
            exit 1
          fi
          # Execute only after local persistence + content checks.
          bash "${install_script}"
          command -v coderabbit >/dev/null
          rm -f "${install_script}"

      - name: Run CodeRabbit CLI review
        env:
          CODERABBIT_API_KEY: ${{ secrets.CODERABBIT_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${CODERABBIT_API_KEY:-}" ]; then
            echo "::warning::CODERABBIT_API_KEY is not set. Skipping CLI review."
            echo "Add repository secret CODERABBIT_API_KEY (CodeRabbit Agentic API key)."
            echo "Owner/admin step for ARCH-CR-08 / #6870; do not commit secrets."
            echo "Until set, rely on the CodeRabbit GitHub App for PR reviews only."
            exit 0
          fi

          coderabbit auth login --api-key "$CODERABBIT_API_KEY"

          if [ "${{ github.event_name }}" = "push" ]; then
            BEFORE="${{ github.event.before }}"
            ZERO="0000000000000000000000000000000000000000"
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "$ZERO" ]; then
              coderabbit review --base=main --plain
            else
              coderabbit review --base-commit="$BEFORE" --plain
            fi
          else
            # workflow_dispatch: compare current HEAD against main
            coderabbit review --base=main --plain
          fi
