name: Commit Lint

on:
  pull_request:
    branches: [main, master]

jobs:
  commit-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@v5
        with:
          configFile: commitlint.config.js
          helpURL: https://www.conventionalcommits.org/
