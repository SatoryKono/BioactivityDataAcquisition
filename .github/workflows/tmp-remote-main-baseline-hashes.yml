name: Temporary remote-main baseline hashes

on:
  push:
    branches:
      - fix/main-post-merge-baseline-20260903

permissions:
  contents: read

jobs:
  hashes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Compare public baseline hashes only
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 https://github.com/SatoryKono/BioactivityDataAcquisition.git main:refs/remotes/origin/main
          echo "before"
          sha256sum reports/quality/architecture-debt-remote-main-baseline.json reports/quality/architecture-debt-remote-main-baseline.md
          python scripts/engineering/qa/report_architecture_debt_remote_main_baseline.py --update
          echo "after"
          sha256sum reports/quality/architecture-debt-remote-main-baseline.json reports/quality/architecture-debt-remote-main-baseline.md
          git status --short -- reports/quality/architecture-debt-remote-main-baseline.json reports/quality/architecture-debt-remote-main-baseline.md
