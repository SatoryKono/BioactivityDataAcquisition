name: Temporary read-only final governance for PR 9880

on:
  push:
    branches:
      - ci/run-sync-9880-generator-20260831

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout actual PR merge ref read-only
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: refs/pull/9880/merge
          fetch-depth: 1
          persist-credentials: false
      - name: Setup Python + uv
        uses: ./.github/actions/setup-python-uv
        with:
          python-version: "3.12"
          uv-extras: dev
          enable-pytest-cache: "false"
      - name: Regenerate final prospective governance payloads
        shell: bash
        run: |
          uv run --frozen --no-build python -m scripts.engineering.qa refresh-governance-artifacts
          git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main
          uv run --frozen --no-build python -m scripts.engineering.qa report-architecture-debt-remote-main-baseline --update
          uv run --frozen --no-build python -m scripts.engineering.qa report-debt-governance-gates --update
          uv run --frozen --no-build python -m scripts.engineering.qa report-architecture-debt-remote-main-baseline --check
          uv run --frozen --no-build python -m scripts.engineering.qa report-debt-governance-gates --check
          changed="$(git diff --name-only)"
          for path in ${changed}; do
            case "${path}" in
              reports/quality/architecture-debt-remote-main-baseline.json|reports/quality/architecture-debt-remote-main-baseline.md|reports/quality/debt-governance-gates.json|reports/quality/debt-governance-gates.md) ;;
              *) echo "Unexpected prospective path: ${path}" >&2; exit 1 ;;
            esac
          done
          for spec in \
            "BASELINE_JSON:reports/quality/architecture-debt-remote-main-baseline.json" \
            "BASELINE_MD:reports/quality/architecture-debt-remote-main-baseline.md" \
            "GATES_JSON:reports/quality/debt-governance-gates.json" \
            "GATES_MD:reports/quality/debt-governance-gates.md"; do
            label="${spec%%:*}"
            file="${spec#*:}"
            echo "${label}_B64_BEGIN"
            base64 -w0 "${file}"
            echo
            echo "${label}_B64_END"
          done
