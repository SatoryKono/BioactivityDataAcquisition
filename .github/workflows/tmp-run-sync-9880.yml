name: Temporary second-pass debt gates for PR 9880

on:
  push:
    branches:
      - ci/run-sync-9880-generator-20260831

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout committed synchronized content
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: fix/sync-9880-main-v2-20260831
          fetch-depth: 1
      - name: Setup Python + uv
        uses: ./.github/actions/setup-python-uv
        with:
          python-version: "3.12"
          uv-extras: dev
          enable-pytest-cache: "false"
      - name: Refresh and verify debt gates after artifact commit
        shell: bash
        run: |
          git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main
          uv run --frozen --no-build python -m scripts.engineering.qa report-architecture-debt-remote-main-baseline --update
          uv run --frozen --no-build python -m scripts.engineering.qa report-debt-governance-gates --update
          uv run --frozen --no-build python -m scripts.engineering.qa report-architecture-debt-remote-main-baseline --check
          uv run --frozen --no-build python -m scripts.engineering.qa report-debt-governance-gates --check
      - name: Commit second-pass gates
        shell: bash
        run: |
          changed="$(git diff --name-only)"
          for path in ${changed}; do
            case "${path}" in
              reports/quality/architecture-debt-remote-main-baseline.json|reports/quality/architecture-debt-remote-main-baseline.md|reports/quality/debt-governance-gates.json|reports/quality/debt-governance-gates.md) ;;
              *) echo "Unexpected generated path: ${path}" >&2; exit 1 ;;
            esac
          done
          git add -u
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(governance): finalize synchronized debt gates"
          git push origin HEAD:fix/sync-9880-main-v2-20260831
