name: Temporary read-only prospective gates for PR 9880

on:
  push:
    branches:
      - ci/run-sync-9880-generator-20260831

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout actual PR merge ref read-only
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: refs/pull/9880/merge
          fetch-depth: 1
          persist-credentials: false
      - name: Setup Python + uv
        uses: ./.github/actions/setup-python-uv
        with:
          python-version: "3.12"
          uv-extras: dev
          enable-pytest-cache: "false"
      - name: Regenerate and emit prospective gate payloads
        shell: bash
        run: |
          uv run --frozen --no-build python -m scripts.engineering.qa refresh-governance-artifacts
          changed="$(git diff --name-only)"
          for path in ${changed}; do
            case "${path}" in
              reports/quality/debt-governance-gates.json|reports/quality/debt-governance-gates.md) ;;
              *) echo "Unexpected prospective path: ${path}" >&2; exit 1 ;;
            esac
          done
          echo "JSON_B64_BEGIN"
          base64 -w0 reports/quality/debt-governance-gates.json
          echo
          echo "JSON_B64_END"
          echo "MD_B64_BEGIN"
          base64 -w0 reports/quality/debt-governance-gates.md
          echo
          echo "MD_B64_END"
