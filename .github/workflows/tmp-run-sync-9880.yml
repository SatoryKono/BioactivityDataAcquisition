name: Temporary read-only governance payloads for PR 9888

on:
  push:
    branches:
      - ci/run-sync-9880-generator-20260831

permissions:
  contents: read
  actions: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head read-only
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: 10693061ec5fe1264683a61e83a3a4da45da1950
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Python and uv
        uses: ./.github/actions/setup-python-uv
        with:
          python-version: "3.12"
          uv-extras: dev
          enable-pytest-cache: "false"

      - name: Generate and validate canonical governance payloads
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main
          uv run --frozen --no-build python -m scripts.engineering.qa refresh-governance-artifacts
          uv run --frozen --no-build python -m scripts.engineering.qa refresh-governance-artifacts --check
          git diff --check
          git diff --exit-code --             .             ':(exclude)reports/quality/architecture-debt-remote-main-baseline.json'             ':(exclude)reports/quality/architecture-debt-remote-main-baseline.md'             ':(exclude)reports/quality/debt-governance-gates.json'             ':(exclude)reports/quality/debt-governance-gates.md'             ':(exclude)reports/quality/test-governance-current.json'

      - name: Download SHA-bound coverage candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          destination="$RUNNER_TEMP/coverage-report"
          mkdir -p "$destination"
          gh run download 33386934878 -n coverage-report -D "$destination"
          candidate="$(find "$destination" -type f -name 'module-coverage-inventory.candidate.json' -print -quit)"
          test -n "$candidate"
          cp "$candidate" reports/quality/module-coverage-inventory.json
          git diff --check
          git diff --exit-code --             .             ':(exclude)reports/quality/module-coverage-inventory.json'             ':(exclude)reports/quality/architecture-debt-remote-main-baseline.json'             ':(exclude)reports/quality/architecture-debt-remote-main-baseline.md'             ':(exclude)reports/quality/debt-governance-gates.json'             ':(exclude)reports/quality/debt-governance-gates.md'             ':(exclude)reports/quality/test-governance-current.json'

      - name: Upload explicit approved payload whitelist
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr-9888-approved-payloads
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
          path: |
            reports/quality/module-coverage-inventory.json
            reports/quality/architecture-debt-remote-main-baseline.json
            reports/quality/architecture-debt-remote-main-baseline.md
            reports/quality/debt-governance-gates.json
            reports/quality/debt-governance-gates.md
            reports/quality/test-governance-current.json

      - name: Emit exact approved payloads
        shell: bash
        run: |
          set -euo pipefail
          paths=(
            reports/quality/module-coverage-inventory.json
            reports/quality/architecture-debt-remote-main-baseline.json
            reports/quality/architecture-debt-remote-main-baseline.md
            reports/quality/debt-governance-gates.json
            reports/quality/debt-governance-gates.md
            reports/quality/test-governance-current.json
          )
          for path in "${paths[@]}"; do
            echo "__PAYLOAD_BEGIN__:${path}"
            base64 "${path}"
            echo
            echo "__PAYLOAD_END__:${path}"
          done
