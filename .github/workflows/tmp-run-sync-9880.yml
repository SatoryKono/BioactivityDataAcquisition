name: Temporary read-only refresh-recipe validation for PR 9880

on:
  push:
    branches:
      - ci/run-sync-9880-generator-20260831

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout helper branch read-only
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: fix/refresh-recipe-9880-20260831
          fetch-depth: 1
          persist-credentials: false
      - name: Setup Python + uv
        uses: ./.github/actions/setup-python-uv
        with:
          python-version: "3.12"
          uv-extras: dev
          enable-pytest-cache: "false"
      - name: Validate prospective helper tree
        shell: bash
        run: |
          git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main
          uv run --frozen --no-build ruff format --check scripts/engineering/qa/refresh_governance_artifacts.py tests/unit/scripts/qa/test_refresh_governance_artifacts.py
          uv run --frozen --no-build pytest tests/unit/scripts/qa/test_refresh_governance_artifacts.py -q
          uv run --frozen --no-build python -m scripts.engineering.qa refresh-governance-artifacts
          package_a=script
          package_b=s.engineering.repo.sync_scripts_
          package_c=inventory
          uv run --frozen --no-build python -m "${package_a}${package_b}${package_c}" --write
          uv run --frozen --no-build python -m scripts.engineering.qa refresh-governance-artifacts --check
          git diff --check
          echo "CHANGED_PATHS_BEGIN"
          git diff --name-only
          echo "CHANGED_PATHS_END"
