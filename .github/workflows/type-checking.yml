name: Type Checking (Strict)
permissions:
  contents: read
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  workflow_call:
    inputs:
      save_cache:
        description: "Whether to save mypy cache (trusted callers only)"
        type: boolean
        required: false
        default: false
  push:
    branches:
      - main
  workflow_dispatch:

jobs:

  type-check:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python + uv
        uses: ./.github/actions/setup-python-uv

      - name: Restore mypy cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .mypy_cache
          key: ${{ runner.os }}-${{ runner.arch }}-python-${{ env.pythonLocation }}-mypy-${{ hashFiles('pyproject.toml', 'uv.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-python-${{ env.pythonLocation }}-mypy-${{ hashFiles('pyproject.toml', 'uv.lock') }}-

      - name: Run mypy (strict mode, full gate)
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -o pipefail
          mkdir -p reports

          echo "Running full mypy strict gate on src/bioetl + src/memory..."
          echo "Event: $EVENT_NAME" | tee reports/mypy_strict.log

          set +e
          timeout --signal=TERM --kill-after=30s 30m \
            uv run --frozen --no-build mypy --config-file pyproject.toml --strict --incremental src/bioetl src/memory \
            2>&1 | tee -a reports/mypy_strict.log
          status=${PIPESTATUS[0]}
          set -e

          echo "$status" > reports/mypy_strict.exit_code

          if [ "$status" -eq 124 ]; then
            echo "mypy strict gate timed out after 30 minutes" | tee -a reports/mypy_strict.log
            exit 1
          fi

          exit "$status"


      - name: Save mypy cache
        if: ${{ always() && (inputs.save_cache == true || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .mypy_cache
          key: ${{ runner.os }}-${{ runner.arch }}-python-${{ env.pythonLocation }}-mypy-${{ hashFiles('pyproject.toml', 'uv.lock') }}-${{ github.sha }}

      - name: Verify Domain Type Policy
        run: |
          echo "Checking domain type policy (NewType, Protocol, Any)..."
          uv run --frozen --no-build python -m scripts.engineering.qa.check_architecture domain-type-policy

      - name: Upload type checking reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ failure() && !cancelled() }}
        with:
          name: type-checking-reports
          path: |
            reports/mypy_strict.log
            reports/mypy_strict.exit_code
          if-no-files-found: warn
          retention-days: 3
