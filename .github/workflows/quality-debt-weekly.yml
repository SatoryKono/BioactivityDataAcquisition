﻿name: Quality Debt Weekly
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  schedule:
    - cron: "45 4 * * 1"
  workflow_dispatch:

env:
  QUALITY_EXEMPTIONS_REGISTRY: configs/quality/architecture_metric_exemptions.yaml
  QUALITY_EXEMPTIONS_SCORECARD: configs/quality/debt_scorecard.yaml

jobs:
  quality-debt-weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python + uv
        uses: ./.github/actions/setup-python-uv
        with:
          uv-extras: "dev"

      - name: Generate weekly debt report
        run: |
          uv run python scripts/engineering/ci/report_quality_debt_weekly.py \
            --registry "${QUALITY_EXEMPTIONS_REGISTRY}" \
            --scorecard "${QUALITY_EXEMPTIONS_SCORECARD}" \
            --json-out reports/quality/debt-weekly.json \
            --markdown-out reports/quality/debt-weekly.md \
            --summary-out "$GITHUB_STEP_SUMMARY"

      - name: Run config gap analysis
        run: |
          uv run python scripts/schema/config_gap_analysis.py

      - name: Upload weekly debt artifacts
        uses: actions/upload-artifact@v4
        with:
          name: quality-debt-weekly
          path: |
            reports/quality/debt-weekly.json
            reports/quality/debt-weekly.md
          retention-days: 30
