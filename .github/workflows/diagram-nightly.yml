name: Diagram Nightly Regression
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  schedule:
    - cron: '20 2 * * *'
  workflow_dispatch:

jobs:
  nightly-phase2:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Mermaid CLI + librsvg + svgo
        run: |
          npm install -g @mermaid-js/mermaid-cli@10.6.1 svgo
          sudo apt-get update -qq && sudo apt-get install -y -qq librsvg2-bin

      - name: Install Chrome headless shell for Puppeteer
        run: npx -y puppeteer browsers install chrome-headless-shell

      - name: Create Puppeteer config
        run: |
          cat > /tmp/puppeteer-config.json << 'EOF'
          {
            "args": ["--no-sandbox", "--disable-setuid-sandbox", "--disable-dev-shm-usage", "--disable-gpu"]
          }
          EOF

      - name: Render diagrams
        run: |
          bash docs/02-architecture/mmd-diagrams/render.sh \
            --puppeteer /tmp/puppeteer-config.json

      - name: Validate rendered artifacts (DIAG-T010..T012)
        run: |
          python3 scripts/diagrams/check_diagram_artifacts.py \
            --manifest docs/02-architecture/mmd-diagrams/visual-smoke-manifest.txt

      - name: Validate SVG text visibility (DIAG-T014..T015)
        run: |
          python3 scripts/diagrams/check_svg_text_visibility.py \
            --manifest docs/02-architecture/mmd-diagrams/visual-smoke-manifest.txt

      - name: Visual smoke baseline drift (DIAG-T026)
        run: |
          python3 scripts/diagrams/check_diagram_visual_smoke.py \
            --manifest docs/02-architecture/mmd-diagrams/visual-smoke-manifest.txt

      - name: Run PR quality-gates baseline (DIAG-T018..T023)
        run: |
          mkdir -p reports/diagrams
          python3 scripts/diagrams/check_diagram_quality_gates.py \
            --manifest docs/02-architecture/mmd-diagrams/quality-gate-manifest.txt \
            --json-out reports/diagrams/diagram-quality-report-nightly.json \
            --markdown-out reports/diagrams/diagram-quality-report-nightly.md

      - name: Diagram policy lint report for nightly budget checks
        run: |
          python3 scripts/diagrams/lint_diagrams.py docs/02-architecture/mmd-diagrams --json \
            > reports/diagrams/diagram-lint-report-nightly.json || true

      - name: Run Phase 2 nightly suite (DIAG-T024..T029)
        run: |
          python3 scripts/diagrams/run_diagram_nightly_suite.py \
            --source-manifest docs/02-architecture/mmd-diagrams/quality-gate-manifest.txt \
            --render-manifest docs/02-architecture/mmd-diagrams/visual-smoke-manifest.txt \
            --puppeteer /tmp/puppeteer-config.json \
            --json-out reports/diagrams/diagram-nightly-phase2.json \
            --markdown-out reports/diagrams/diagram-nightly-phase2.md

      - name: Diagram quality budget enforcement (nightly)
        run: |
          python3 scripts/diagrams/enforce_diagram_quality_budget.py \
            --mode nightly \
            --quality-report reports/diagrams/diagram-quality-report-nightly.json \
            --lint-report reports/diagrams/diagram-lint-report-nightly.json \
            --nightly-report reports/diagrams/diagram-nightly-phase2.json \
            --max-hard-failures 0 \
            --max-diag-t022 0 \
            --max-diag-t023 0 \
            --max-lint-errors 0 \
            --max-nightly-errors 0 \
            --max-nightly-warnings 0 \
            --json-out reports/diagrams/diagram-quality-budget-nightly.json \
            --markdown-out reports/diagrams/diagram-quality-budget-nightly.md

      - name: Upload nightly reports
        uses: actions/upload-artifact@v4
        with:
          name: diagrams-nightly-reports
          path: |
            reports/diagrams/diagram-quality-report-nightly.json
            reports/diagrams/diagram-quality-report-nightly.md
            reports/diagrams/diagram-lint-report-nightly.json
            reports/diagrams/diagram-nightly-phase2.json
            reports/diagrams/diagram-nightly-phase2.md
            reports/diagrams/diagram-quality-budget-nightly.json
            reports/diagrams/diagram-quality-budget-nightly.md

      - name: Publish nightly summary
        if: always()
        run: |
          if [ -f reports/diagrams/diagram-nightly-phase2.md ]; then
            cat reports/diagrams/diagram-nightly-phase2.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Nightly phase2 report was not generated." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f reports/diagrams/diagram-quality-budget-nightly.md ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            cat reports/diagrams/diagram-quality-budget-nightly.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Nightly diagram quality budget report was not generated." >> "$GITHUB_STEP_SUMMARY"
          fi

  mermaid-minor-canary:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - mermaid_version: '10.6.1'
            label: stable
            allow_failure: false
          - mermaid_version: '11.4.0'
            label: canary
            allow_failure: true
    continue-on-error: ${{ matrix.allow_failure }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Mermaid CLI version
        run: |
          npm install -g @mermaid-js/mermaid-cli@${{ matrix.mermaid_version }}

      - name: Install Chrome headless shell for Puppeteer
        run: npx -y puppeteer browsers install chrome-headless-shell

      - name: Create Puppeteer config
        run: |
          cat > /tmp/puppeteer-config.json << 'EOF'
          {
            "args": ["--no-sandbox", "--disable-setuid-sandbox", "--disable-dev-shm-usage", "--disable-gpu"]
          }
          EOF

      - name: Validate Mermaid syntax
        run: |
          bash scripts/diagrams/validate_mermaid_syntax.sh \
            --puppeteer /tmp/puppeteer-config.json

      - name: Canary render of reference source pool (DIAG-T030)
        run: |
          mkdir -p /tmp/diagram-canary/svg
          manifest="docs/02-architecture/mmd-diagrams/quality-gate-manifest.txt"
          while IFS= read -r src; do
            [ -z "$src" ] && continue
            case "$src" in
              \#*) continue ;;
            esac
            stem="$(basename "${src%.*}")"
            out="/tmp/diagram-canary/svg/${stem}-${{ matrix.label }}.svg"
            mmdc -i "$src" -o "$out" \
              -c docs/02-architecture/mmd-diagrams/theme/mermaid-config.json \
              --cssFile docs/02-architecture/mmd-diagrams/theme/custom.css \
              -p /tmp/puppeteer-config.json
          done < "$manifest"

      - name: Validate canary SVG text visibility
        run: |
          manifest_tmp="/tmp/diagram-canary-manifest.txt"
          find /tmp/diagram-canary/svg -type f -name '*.svg' | sort > "$manifest_tmp"
          python3 scripts/diagrams/check_svg_text_visibility.py --manifest "$manifest_tmp"

      - name: Upload canary report artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagrams-canary-${{ matrix.label }}
          path: |
            /tmp/diagram-canary/svg/*.svg

      - name: Publish canary summary
        if: always()
        run: |
          {
            echo "## Mermaid Canary: ${{ matrix.label }} (${{ matrix.mermaid_version }})"
            echo "- Workflow status: ${{ job.status }}"
            echo "- `mmdc --version`: $(mmdc --version || echo 'unavailable')"
          } >> "$GITHUB_STEP_SUMMARY"

