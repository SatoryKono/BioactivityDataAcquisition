name: Diagram Nightly Regression
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  schedule:
    - cron: '20 2 * * *'
  workflow_dispatch:

jobs:
  nightly-phase2:
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5
        with:
          python-version: '3.13'

      - name: Setup Mermaid CLI
        uses: ./.github/actions/setup-mermaid
        with:
          install-librsvg: "true"

      - name: Render diagrams
        env:
          REQUIRE_SVGO: "1"
        run: |
          bash docs/02-architecture/diagrams/tooling/render.sh \
            --puppeteer /tmp/puppeteer-config.json

      - name: Validate rendered artifacts (DIAG-T010..T012)
        run: |
          python3 scripts/diagrams/check/check_diagram_artifacts.py \
            --manifest docs/02-architecture/diagrams/manifests/png-compatibility.txt \
            --require-png

      - name: Validate SVG text visibility (DIAG-T014..T015)
        run: |
          python3 scripts/diagrams/check/check_svg_text_visibility.py \
            --manifest docs/02-architecture/diagrams/manifests/visual-smoke.txt

      - name: Visual smoke baseline drift (DIAG-T026)
        run: |
          mkdir -p reports/diagrams
          python3 scripts/diagrams/check/check_diagram_visual_smoke.py \
            --manifest docs/02-architecture/diagrams/manifests/visual-smoke.txt \
            --json-out reports/diagrams/diagram-visual-smoke-nightly.json

      - name: Visual smoke extended tier drift
        run: |
          python3 scripts/diagrams/check/check_diagram_visual_smoke.py \
            --manifest docs/02-architecture/diagrams/manifests/visual-smoke-extended.txt \
            --json-out reports/diagrams/diagram-visual-smoke-extended-nightly.json

      - name: Visual smoke broad tier drift
        continue-on-error: true
        run: |
          python3 scripts/diagrams/check/check_diagram_visual_smoke.py \
            --manifest docs/02-architecture/diagrams/manifests/visual-smoke-broad.txt \
            --json-out reports/diagrams/diagram-visual-smoke-broad-nightly.json

      - name: Run PR quality-gates baseline (DIAG-T018..T023)
        run: |
          mkdir -p reports/diagrams
          python3 scripts/diagrams/check/check_diagram_quality_gates.py \
            --manifest docs/02-architecture/diagrams/manifests/quality-gates.txt \
            --json-out reports/diagrams/diagram-quality-report-nightly.json \
            --markdown-out reports/diagrams/diagram-quality-report-nightly.md

      - name: Diagram policy lint report for nightly budget checks
        run: |
          python3 scripts/diagrams/lint/lint_diagrams.py docs/02-architecture/diagrams --json \
            > reports/diagrams/diagram-lint-report-nightly.json || true

      - name: Maintain stale diagram alert issue
        if: ${{ always() && github.event_name == 'schedule' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ALERT_TITLE: "[DIAGRAM-FRESHNESS] Refresh diagrams older than 150 days"
        run: |
          report="reports/diagrams/diagram-lint-report-nightly.json"
          if [ ! -s "$report" ]; then
            echo "::error::Diagram lint report is missing; freshness alert cannot be evaluated."
            exit 1
          fi

          stale_errors="$(python3 -c 'import json,sys; payload=json.load(open(sys.argv[1], encoding="utf-8")); print(sum(item.get("rule") == "STALE-001" for item in payload.get("issues", [])))' "$report")"
          existing="$(gh issue list --state open --search "${ALERT_TITLE} in:title" --limit 100 --json number,title | python3 -c 'import json,os,sys; title=os.environ["ALERT_TITLE"]; print(next((str(item["number"]) for item in json.load(sys.stdin) if item.get("title") == title), ""))')"

          if [ "$stale_errors" -eq 0 ]; then
            if [ -n "$existing" ]; then
              gh issue close "$existing" --comment "Scheduled diagram freshness check is healthy: no diagrams exceed the 150-day error threshold."
            fi
            exit 0
          fi

          python3 -c 'import json,sys; payload=json.load(open(sys.argv[1], encoding="utf-8")); rows=[item for item in payload.get("issues", []) if item.get("rule") == "STALE-001"]; print("Scheduled diagram freshness monitoring found " + str(len(rows)) + " source(s) beyond the 150-day error threshold.\n\nRun: `python -m scripts.diagrams lint --json`\n\n| Diagram | Finding |\n| --- | --- |\n" + "\n".join("| `" + row["file"] + "` | " + row["message"].replace("|", "\\|") + " |" for row in rows) + "\n\nThis issue is maintained idempotently by `diagram-nightly.yml`.")' "$report" > /tmp/stale-diagram-alert.md

          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body-file /tmp/stale-diagram-alert.md
          else
            gh issue create --title "$ALERT_TITLE" --label documentation --body-file /tmp/stale-diagram-alert.md
          fi

          echo "::error::$stale_errors diagram source(s) exceed the 150-day freshness threshold."
          exit 1

      - name: Run Phase 2 nightly suite (DIAG-T024..T029)
        run: |
          python3 scripts/diagrams/run_diagram_nightly_suite.py \
            --source-manifest docs/02-architecture/diagrams/manifests/quality-gates.txt \
            --render-manifest docs/02-architecture/diagrams/manifests/visual-smoke.txt \
            --puppeteer /tmp/puppeteer-config.json \
            --json-out reports/diagrams/diagram-nightly-phase2.json \
            --markdown-out reports/diagrams/diagram-nightly-phase2.md

      - name: Diagram quality budget enforcement (nightly)
        run: |
          python3 scripts/diagrams/lint/enforce_diagram_quality_budget.py \
            --mode nightly \
            --quality-report reports/diagrams/diagram-quality-report-nightly.json \
            --lint-report reports/diagrams/diagram-lint-report-nightly.json \
            --nightly-report reports/diagrams/diagram-nightly-phase2.json \
            --max-hard-failures 0 \
            --max-diag-t022 0 \
            --max-diag-t023 0 \
            --max-lint-errors 0 \
            --max-nightly-errors 0 \
            --max-nightly-warnings 0 \
            --json-out reports/diagrams/diagram-quality-budget-nightly.json \
            --markdown-out reports/diagrams/diagram-quality-budget-nightly.md

      - name: Upload nightly reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: diagrams-nightly-reports
          path: |
            reports/diagrams/diagram-quality-report-nightly.json
            reports/diagrams/diagram-quality-report-nightly.md
            reports/diagrams/diagram-visual-smoke-nightly.json
            reports/diagrams/diagram-visual-smoke-extended-nightly.json
            reports/diagrams/diagram-visual-smoke-broad-nightly.json
            reports/diagrams/diagram-lint-report-nightly.json
            reports/diagrams/diagram-nightly-phase2.json
            reports/diagrams/diagram-nightly-phase2.md
            reports/diagrams/diagram-quality-budget-nightly.json
            reports/diagrams/diagram-quality-budget-nightly.md
          retention-days: 14

      - name: Publish nightly summary
        if: ${{ always() && !cancelled() }}
        run: |
          if [ -f reports/diagrams/diagram-nightly-phase2.md ]; then
            cat reports/diagrams/diagram-nightly-phase2.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Nightly phase2 report was not generated." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f reports/diagrams/diagram-quality-budget-nightly.md ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            cat reports/diagrams/diagram-quality-budget-nightly.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Nightly diagram quality budget report was not generated." >> "$GITHUB_STEP_SUMMARY"
          fi

  mermaid-minor-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 11.x canary stays deferred until setup-mermaid has a lockfile-backed
        # pin. Unpinned npm installs are refused (Sonar S8543).
        include:
          - mermaid_version: '10.6.1'
            label: stable
            allow_failure: false
    continue-on-error: ${{ matrix.allow_failure }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5
        with:
          python-version: '3.13'

      - name: Setup Mermaid CLI
        uses: ./.github/actions/setup-mermaid
        with:
          mermaid-version: ${{ matrix.mermaid_version }}

      - name: Validate Mermaid syntax
        env:
          MMDC_ALLOW_VERSION_DRIFT: ${{ matrix.label == 'canary' && '1' || '0' }}
        run: |
          bash scripts/diagrams/validate_mermaid_syntax.sh \
            --puppeteer /tmp/puppeteer-config.json

      - name: Canary render of reference source pool (DIAG-T030)
        run: |
          mkdir -p reports/diagrams/canary/svg
          manifest="docs/02-architecture/diagrams/manifests/quality-gates.txt"
          while IFS= read -r src; do
            [ -z "$src" ] && continue
            case "$src" in
              \#*) continue ;;
            esac
            stem="$(basename "${src%.*}")"
            out="reports/diagrams/canary/svg/${stem}-${{ matrix.label }}.svg"
            mmdc -i "$src" -o "$out" \
              -c docs/02-architecture/diagrams/theme/mermaid-config.json \
              --cssFile docs/02-architecture/diagrams/theme/custom.css \
              -p /tmp/puppeteer-config.json
          done < "$manifest"

      - name: Validate canary SVG text visibility
        run: |
          manifest_tmp="reports/diagrams/canary/manifest-${{ matrix.label }}.txt"
          find reports/diagrams/canary/svg -type f -name '*.svg' | sort > "$manifest_tmp"
          python3 scripts/diagrams/check/check_svg_text_visibility.py --manifest "$manifest_tmp"

      - name: Upload canary report artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: diagrams-canary-${{ matrix.label }}
          path: |
            reports/diagrams/canary/svg/*.svg
          retention-days: 7

      - name: Publish canary summary
        if: always()
        run: |
          {
            echo "## Mermaid Canary: ${{ matrix.label }} (${{ matrix.mermaid_version }})"
            echo "- Workflow status: ${{ job.status }}"
            echo "- `mmdc --version`: $(mmdc --version || echo 'unavailable')"
          } >> "$GITHUB_STEP_SUMMARY"
