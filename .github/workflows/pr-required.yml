name: PR Gate Complete
# Repo-side #9975 coordinator. GitHub rulesets are deliberately out of scope.
# Each pull request has one owner invocation per gate and one fail-closed result.

on:
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  classify-changes:
    name: Classify changes (decision matrix)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      head_sha: ${{ steps.decide.outputs.head_sha }}
      config_version: ${{ steps.decide.outputs.config_version }}
      decision_matrix: ${{ steps.decide.outputs.decision_matrix }}
      lint-arch: ${{ steps.decide.outputs['lint-arch'] }}
      lint-arch-reason: ${{ steps.decide.outputs['lint-arch-reason'] }}
      tests: ${{ steps.decide.outputs['tests'] }}
      tests-reason: ${{ steps.decide.outputs['tests-reason'] }}
      type-checking: ${{ steps.decide.outputs['type-checking'] }}
      type-checking-reason: ${{ steps.decide.outputs['type-checking-reason'] }}
      security: ${{ steps.decide.outputs['security'] }}
      security-reason: ${{ steps.decide.outputs['security-reason'] }}
      codeql: ${{ steps.decide.outputs['codeql'] }}
      codeql-reason: ${{ steps.decide.outputs['codeql-reason'] }}
      docker: ${{ steps.decide.outputs['docker'] }}
      docker-reason: ${{ steps.decide.outputs['docker-reason'] }}
      duplication: ${{ steps.decide.outputs['duplication'] }}
      duplication-reason: ${{ steps.decide.outputs['duplication-reason'] }}
      root-hygiene: ${{ steps.decide.outputs['root-hygiene'] }}
      root-hygiene-reason: ${{ steps.decide.outputs['root-hygiene-reason'] }}
      generated-artifacts: ${{ steps.decide.outputs['generated-artifacts'] }}
      generated-artifacts-reason: ${{ steps.decide.outputs['generated-artifacts-reason'] }}
      compiled-artifacts: ${{ steps.decide.outputs['compiled-artifacts'] }}
      compiled-artifacts-reason: ${{ steps.decide.outputs['compiled-artifacts-reason'] }}
      commit-governance: ${{ steps.decide.outputs['commit-governance'] }}
      commit-governance-reason: ${{ steps.decide.outputs['commit-governance-reason'] }}
      docs-governance: ${{ steps.decide.outputs['docs-governance'] }}
      docs-governance-reason: ${{ steps.decide.outputs['docs-governance-reason'] }}
    steps:
      - name: Checkout exact event head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python + uv
        uses: ./.github/actions/setup-python-uv
        with:
          python-version: "3.12"
          uv-extras: "dev"

      - name: Decide required / not_applicable per gate
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
          BEFORE_SHA: ${{ github.event.before || github.event.pull_request.base.sha || github.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          uv run --frozen --no-build python -m scripts.engineering.ci pr-gate classify \
            --catalog configs/quality/github_required_checks.yaml \
            --event-name "${EVENT_NAME}" \
            --base-sha "${BASE_SHA}" \
            --before-sha "${BEFORE_SHA}" \
            --head-sha "${HEAD_SHA}" \
            --artifact reports/quality/pr-gate-decisions.json

      - name: Upload decision matrix
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: pr-gate-decisions-${{ github.event.pull_request.head.sha || github.sha }}
          path: reports/quality/pr-gate-decisions.json
          if-no-files-found: error
          retention-days: 7

  lint-arch:
    needs: classify-changes
    if: ${{ needs['classify-changes'].outputs['lint-arch'] == 'required' }}
    uses: ./.github/workflows/import-linter.yml
    permissions:
      contents: read

  tests:
    needs: classify-changes
    if: ${{ needs['classify-changes'].outputs['tests'] == 'required' }}
    uses: ./.github/workflows/tests.yml
    permissions:
      contents: read

  type-checking:
    needs: classify-changes
    if: ${{ needs['classify-changes'].outputs['type-checking'] == 'required' }}
    uses: ./.github/workflows/type-checking.yml
    permissions:
      contents: read

  security:
    needs: classify-changes
    if: ${{ needs['classify-changes'].outputs['security'] == 'required' }}
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read

  codeql:
    needs: classify-changes
    if: ${{ needs['classify-changes'].outputs['codeql'] == 'required' }}
    uses: ./.github/workflows/codeql.yml
    permissions:
      contents: read
      security-events: write

  docker:
    needs: classify-changes
    if: ${{ needs['classify-changes'].outputs['docker'] == 'required' }}
    uses: ./.github/workflows/docker.yml
    # The reusable workflow declares a main-push-only GHCR job. The PR path
    # never schedules it, and every executable PR job narrows its own token.
    permissions:
      contents: read
      packages: write
      security-events: write

  docker-not-applicable:
    needs: classify-changes
    if: ${{ needs['classify-changes'].outputs['docker'] == 'not_applicable' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    outputs:
      head_sha: ${{ steps.na.outputs.head_sha }}
      reason: ${{ steps.na.outputs.reason }}
    steps:
      - name: Materialize docker N/A decision
        id: na
        env:
          HEAD_SHA: ${{ needs['classify-changes'].outputs.head_sha }}
          REASON: ${{ needs['classify-changes'].outputs['docker-reason'] }}
        run: |
          set -euo pipefail
          test -n "${HEAD_SHA}"
          test -n "${REASON}"
          echo "head_sha=${HEAD_SHA}" >> "${GITHUB_OUTPUT}"
          echo "reason=${REASON}" >> "${GITHUB_OUTPUT}"
          echo "docker=not_applicable reason=${REASON} head_sha=${HEAD_SHA}"

  duplication:
    needs: classify-changes
    if: ${{ needs['classify-changes'].outputs['duplication'] == 'required' }}
    uses: ./.github/workflows/duplication-complexity.yml
    permissions:
      contents: read

  root-hygiene:
    needs: classify-changes
    if: ${{ needs['classify-changes'].outputs['root-hygiene'] == 'required' }}
    uses: ./.github/workflows/root-hygiene.yml
    permissions:
      contents: read

  generated-artifacts:
    needs: classify-changes
    if: ${{ needs['classify-changes'].outputs['generated-artifacts'] == 'required' }}
    uses: ./.github/workflows/schema-governance.yml
    permissions:
      contents: read

  generated-artifacts-not-applicable:
    needs: classify-changes
    if: ${{ needs['classify-changes'].outputs['generated-artifacts'] == 'not_applicable' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    outputs:
      head_sha: ${{ steps.na.outputs.head_sha }}
      reason: ${{ steps.na.outputs.reason }}
    steps:
      - name: Materialize generated-artifacts N/A decision
        id: na
        env:
          HEAD_SHA: ${{ needs['classify-changes'].outputs.head_sha }}
          REASON: ${{ needs['classify-changes'].outputs['generated-artifacts-reason'] }}
        run: |
          set -euo pipefail
          test -n "${HEAD_SHA}"
          test -n "${REASON}"
          echo "head_sha=${HEAD_SHA}" >> "${GITHUB_OUTPUT}"
          echo "reason=${REASON}" >> "${GITHUB_OUTPUT}"
          echo "generated-artifacts=not_applicable reason=${REASON} head_sha=${HEAD_SHA}"

  compiled-artifacts:
    needs: classify-changes
    if: ${{ needs['classify-changes'].outputs['compiled-artifacts'] == 'required' }}
    uses: ./.github/workflows/compiled-artifacts-block.yml
    permissions:
      contents: read

  commit-governance:
    needs: classify-changes
    if: ${{ needs['classify-changes'].outputs['commit-governance'] == 'required' }}
    uses: ./.github/workflows/commit-lint.yml
    permissions:
      contents: read

  commit-governance-not-applicable:
    needs: classify-changes
    if: ${{ needs['classify-changes'].outputs['commit-governance'] == 'not_applicable' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    outputs:
      head_sha: ${{ steps.na.outputs.head_sha }}
      reason: ${{ steps.na.outputs.reason }}
    steps:
      - name: Materialize commit-governance N/A decision
        id: na
        env:
          HEAD_SHA: ${{ needs['classify-changes'].outputs.head_sha }}
          REASON: ${{ needs['classify-changes'].outputs['commit-governance-reason'] }}
        run: |
          set -euo pipefail
          test -n "${HEAD_SHA}"
          test -n "${REASON}"
          echo "head_sha=${HEAD_SHA}" >> "${GITHUB_OUTPUT}"
          echo "reason=${REASON}" >> "${GITHUB_OUTPUT}"
          echo "commit-governance=not_applicable reason=${REASON} head_sha=${HEAD_SHA}"

  docs-governance:
    needs: classify-changes
    if: ${{ needs['classify-changes'].outputs['docs-governance'] == 'required' }}
    uses: ./.github/workflows/docs.yml
    permissions:
      contents: read

  docs-governance-not-applicable:
    needs: classify-changes
    if: ${{ needs['classify-changes'].outputs['docs-governance'] == 'not_applicable' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    outputs:
      head_sha: ${{ steps.na.outputs.head_sha }}
      reason: ${{ steps.na.outputs.reason }}
    steps:
      - name: Materialize docs-governance N/A decision
        id: na
        env:
          HEAD_SHA: ${{ needs['classify-changes'].outputs.head_sha }}
          REASON: ${{ needs['classify-changes'].outputs['docs-governance-reason'] }}
        run: |
          set -euo pipefail
          test -n "${HEAD_SHA}"
          test -n "${REASON}"
          echo "head_sha=${HEAD_SHA}" >> "${GITHUB_OUTPUT}"
          echo "reason=${REASON}" >> "${GITHUB_OUTPUT}"
          echo "docs-governance=not_applicable reason=${REASON} head_sha=${HEAD_SHA}"

  pr-gate-complete:
    name: pr-gate-complete
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ always() }}
    needs:
      - classify-changes
      - lint-arch
      - tests
      - type-checking
      - security
      - codeql
      - docker
      - docker-not-applicable
      - duplication
      - root-hygiene
      - generated-artifacts
      - generated-artifacts-not-applicable
      - compiled-artifacts
      - commit-governance
      - commit-governance-not-applicable
      - docs-governance
      - docs-governance-not-applicable
    permissions:
      contents: read
    steps:
      - name: Checkout exact event head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python + uv
        uses: ./.github/actions/setup-python-uv
        with:
          python-version: "3.12"
          uv-extras: "dev"

      - name: Validate aggregator (fail-closed)
        env:
          DECISION_MATRIX: "${{ needs['classify-changes'].outputs.decision_matrix }}"
          AGGREGATE_RESULTS: >-
            {
            "lint-arch": {"required": "${{ needs['lint-arch'].result }}", "not_applicable": "skipped"},
            "tests": {"required": "${{ needs['tests'].result }}", "not_applicable": "skipped"},
            "type-checking": {"required": "${{ needs['type-checking'].result }}", "not_applicable": "skipped"},
            "security": {"required": "${{ needs['security'].result }}", "not_applicable": "skipped"},
            "codeql": {"required": "${{ needs['codeql'].result }}", "not_applicable": "skipped"},
            "docker": {"required": "${{ needs['docker'].result }}", "not_applicable": "${{ needs['docker-not-applicable'].result }}", "na_head_sha": "${{ needs['docker-not-applicable'].outputs.head_sha }}", "na_reason": "${{ needs['docker-not-applicable'].outputs.reason }}"},
            "duplication": {"required": "${{ needs['duplication'].result }}", "not_applicable": "skipped"},
            "root-hygiene": {"required": "${{ needs['root-hygiene'].result }}", "not_applicable": "skipped"},
            "generated-artifacts": {"required": "${{ needs['generated-artifacts'].result }}", "not_applicable": "${{ needs['generated-artifacts-not-applicable'].result }}", "na_head_sha": "${{ needs['generated-artifacts-not-applicable'].outputs.head_sha }}", "na_reason": "${{ needs['generated-artifacts-not-applicable'].outputs.reason }}"},
            "compiled-artifacts": {"required": "${{ needs['compiled-artifacts'].result }}", "not_applicable": "skipped"},
            "commit-governance": {"required": "${{ needs['commit-governance'].result }}", "not_applicable": "${{ needs['commit-governance-not-applicable'].result }}", "na_head_sha": "${{ needs['commit-governance-not-applicable'].outputs.head_sha }}", "na_reason": "${{ needs['commit-governance-not-applicable'].outputs.reason }}"},
            "docs-governance": {"required": "${{ needs['docs-governance'].result }}", "not_applicable": "${{ needs['docs-governance-not-applicable'].result }}", "na_head_sha": "${{ needs['docs-governance-not-applicable'].outputs.head_sha }}", "na_reason": "${{ needs['docs-governance-not-applicable'].outputs.reason }}"}
            }
          EXPECTED_HEAD_SHA: ${{ needs['classify-changes'].outputs.head_sha }}
          OBSERVED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          test "${{ needs['classify-changes'].result }}" = "success"
          uv run --frozen --no-build python -m scripts.engineering.ci pr-gate aggregate \
            --catalog configs/quality/github_required_checks.yaml \
            --decision-matrix-env DECISION_MATRIX \
            --results-env AGGREGATE_RESULTS \
            --expected-head-sha "${EXPECTED_HEAD_SHA}" \
            --observed-head-sha "${OBSERVED_HEAD_SHA}" \
            --run-url "${RUN_URL}"
# codex-artifact-apply-start
  # Explicitly authorized one-shot artifact application. The committed result removes this block.
  apply-passport-artifact:
    name: Apply validated passport evidence (one-shot)
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'reopened' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/action-target-test-marker-10006' &&
      github.actor == 'SatoryKono'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout exact authorized head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify exact repository, branch, and staging delta
        env:
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SOURCE_HEAD_SHA: 1962e2071ad440a4e60b454edb777a46537eb66a
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = "SatoryKono/BioactivityDataAcquisition"
          test "${GITHUB_HEAD_REF}" = "fix/action-target-test-marker-10006"
          test "$(git rev-parse HEAD)" = "${EVENT_HEAD_SHA}"
          git merge-base --is-ancestor "${SOURCE_HEAD_SHA}" "${EVENT_HEAD_SHA}"
          changed="$(git diff --name-only "${SOURCE_HEAD_SHA}" "${EVENT_HEAD_SHA}")"
          test "${changed}" = ".github/workflows/pr-required.yml"
          echo "EVENT_HEAD_SHA=${EVENT_HEAD_SHA}" >> "${GITHUB_ENV}"

      - name: Setup Python + uv
        uses: ./.github/actions/setup-python-uv
        with:
          python-version: "3.12"
          uv-extras: "dev"

      - name: Download exact validated artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: "9857026079"
          ARTIFACT_NAME: passport-refresh-1962e2071ad440a4e60b454edb777a46537eb66a
          ARTIFACT_DIGEST: sha256:b0c6c6442052ddbda3bda07109895771efe9a955942d2cae30516f42b6485353
          SOURCE_RUN_ID: "33656344299"
          BUNDLE_ROOT: ${{ runner.temp }}/passport-refresh-bundle
        run: |
          set -euo pipefail
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}" --jq .digest)" = "${ARTIFACT_DIGEST}"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}" --jq .expired)" = "false"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}" --jq .workflow_run.id)" = "${SOURCE_RUN_ID}"
          mkdir -p "${BUNDLE_ROOT}"
          gh run download "${SOURCE_RUN_ID}" --repo "${GITHUB_REPOSITORY}" --name "${ARTIFACT_NAME}" --dir "${BUNDLE_ROOT}"
          test -f "${BUNDLE_ROOT}/manifest.json"

      - name: Verify manifest and apply allowlisted files
        env:
          BUNDLE_ROOT: ${{ runner.temp }}/passport-refresh-bundle
        run: |
          set -euo pipefail
          export BUNDLE_ROOT
          uv run --frozen --no-build python - <<'PY'
          import hashlib
          import json
          import os
          import shutil
          from pathlib import Path, PurePosixPath

          source_head = "1962e2071ad440a4e60b454edb777a46537eb66a"
          bundle = Path(os.environ["BUNDLE_ROOT"])
          repository = Path.cwd().resolve()
          manifest = json.loads((bundle / "manifest.json").read_text(encoding="utf-8"))
          if manifest.get("source_head_sha") != source_head:
              raise SystemExit("artifact source_head_sha mismatch")
          if manifest.get("deleted") != []:
              raise SystemExit("artifact contains deletions")

          exact = {
              ".github/workflows/pr-required.yml",
              "configs/quality/scripts_inventory_manifest.json",
              "docs/reports/generated/documentation-cleanup-inventory.json",
              "docs/reports/generated/documentation-cleanup-inventory.md",
              "reports/quality/test-governance-current.json",
          }
          prefix = "docs/04-reference/passports/"
          records = manifest.get("files")
          if not isinstance(records, list) or not records:
              raise SystemExit("artifact has no files")

          seen = set()
          for record in records:
              relative = record.get("path")
              if not isinstance(relative, str):
                  raise SystemExit("invalid artifact path")
              posix = PurePosixPath(relative)
              if posix.is_absolute() or ".." in posix.parts:
                  raise SystemExit(f"unsafe artifact path: {relative}")
              if relative not in exact and not relative.startswith(prefix):
                  raise SystemExit(f"path outside allowlist: {relative}")
              if relative in seen:
                  raise SystemExit(f"duplicate artifact path: {relative}")
              seen.add(relative)

              source = bundle / "files" / Path(*posix.parts)
              payload = source.read_bytes()
              if len(payload) != record.get("size"):
                  raise SystemExit(f"size mismatch: {relative}")
              if hashlib.sha256(payload).hexdigest() != record.get("sha256"):
                  raise SystemExit(f"sha256 mismatch: {relative}")

              target = (repository / Path(*posix.parts)).resolve()
              if not target.is_relative_to(repository):
                  raise SystemExit(f"path escaped repository: {relative}")
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(source, target)

          if ".github/workflows/pr-required.yml" not in seen:
              raise SystemExit("final coordinator missing from artifact")
          coordinator = Path(".github/workflows/pr-required.yml").read_text(encoding="utf-8")
          if "codex-artifact-apply-start" in coordinator or "codex-readonly-passport-refresh-start" in coordinator:
              raise SystemExit("temporary workflow block survived artifact application")
          print(f"Verified and applied {len(seen)} files")
          PY

      - name: Validate applied canonical projections
        run: |
          set -euo pipefail
          GITHUB_EVENT_NAME=workflow_dispatch uv run --frozen --no-build python -m scripts.docs passports check --require-clean-source
          uv run --frozen --no-build python -m scripts.docs generate-cleanup-inventory --check
          uv run --frozen --no-build python -m scripts.engineering.repo check-inventory --manifest configs/quality/scripts_inventory_manifest.json --check-lifecycle --lifecycle-registry configs/quality/scripts_lifecycle_registry.json
          uv run --frozen --no-build python -m scripts.engineering.qa.report_test_governance_audit --check
          uv run --frozen --no-build pytest tests/architecture/test_ci_heavy_lane_rebalance.py tests/architecture/test_scripts_inventory_manifest.py tests/architecture/test_scripts_lifecycle_registry.py tests/architecture/test_passport_documentation_projections.py tests/unit/scripts/docs/passports/test_passport_projector.py tests/unit/scripts/ops/observability/test_action_target_routes.py -q --tb=short
          git diff --check

      - name: Verify exact final diff
        env:
          BUNDLE_ROOT: ${{ runner.temp }}/passport-refresh-bundle
        run: |
          set -euo pipefail
          export BUNDLE_ROOT
          uv run --frozen --no-build python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          manifest = json.loads(
              (Path(os.environ["BUNDLE_ROOT"]) / "manifest.json").read_text(encoding="utf-8")
          )
          expected = {record["path"] for record in manifest["files"]}
          changed = {
              value
              for value in subprocess.check_output(
                  ["git", "diff", "--name-only", "-z"]
              ).decode("utf-8").split("\0")
              if value
          }
          untracked = {
              value
              for value in subprocess.check_output(
                  ["git", "ls-files", "--others", "--exclude-standard", "-z"]
              ).decode("utf-8").split("\0")
              if value
          }
          if changed != expected:
              raise SystemExit(
                  f"final diff mismatch: missing={sorted(expected - changed)} "
                  f"unexpected={sorted(changed - expected)}"
              )
          if untracked:
              raise SystemExit(f"unexpected untracked files: {sorted(untracked)}")
          print(f"Final diff is exactly {len(expected)} allowlisted files")
          PY

      - name: Commit and push exact allowlisted result
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE_ROOT: ${{ runner.temp }}/passport-refresh-bundle
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            .github/workflows/pr-required.yml \
            configs/quality/scripts_inventory_manifest.json \
            docs/04-reference/passports \
            docs/reports/generated/documentation-cleanup-inventory.json \
            docs/reports/generated/documentation-cleanup-inventory.md \
            reports/quality/test-governance-current.json
          git diff --cached --check
          export BUNDLE_ROOT
          uv run --frozen --no-build python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          manifest = json.loads(
              (Path(os.environ["BUNDLE_ROOT"]) / "manifest.json").read_text(encoding="utf-8")
          )
          expected = {record["path"] for record in manifest["files"]}
          staged = {
              value
              for value in subprocess.check_output(
                  ["git", "diff", "--cached", "--name-only", "-z"]
              ).decode("utf-8").split("\0")
              if value
          }
          if staged != expected:
              raise SystemExit(
                  f"staged diff mismatch: missing={sorted(expected - staged)} "
                  f"unexpected={sorted(staged - expected)}"
              )
          PY
          git fetch origin fix/action-target-test-marker-10006
          test "$(git rev-parse origin/fix/action-target-test-marker-10006)" = "${EVENT_HEAD_SHA}"
          git commit -m "chore(ci): apply validated passport projections"
          test "$(git rev-parse HEAD^)" = "${EVENT_HEAD_SHA}"
          gh auth setup-git
          git push origin HEAD:fix/action-target-test-marker-10006
          echo "FINAL_HEAD_SHA=$(git rev-parse HEAD)" >> "${GITHUB_STEP_SUMMARY}"
  # codex-artifact-apply-end
