name: PR Gate Complete
# Repo-side #9975 coordinator. GitHub rulesets are deliberately out of scope.
# Each pull request has one owner invocation per gate and one fail-closed result.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  classify-changes:
    name: Classify changes (decision matrix)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      head_sha: ${{ steps.decide.outputs.head_sha }}
      config_version: ${{ steps.decide.outputs.config_version }}
      decision_matrix: ${{ steps.decide.outputs.decision_matrix }}
      lint-arch: ${{ steps.decide.outputs['lint-arch'] }}
      lint-arch-reason: ${{ steps.decide.outputs['lint-arch-reason'] }}
      tests: ${{ steps.decide.outputs['tests'] }}
      tests-reason: ${{ steps.decide.outputs['tests-reason'] }}
      type-checking: ${{ steps.decide.outputs['type-checking'] }}
      type-checking-reason: ${{ steps.decide.outputs['type-checking-reason'] }}
      security: ${{ steps.decide.outputs['security'] }}
      security-reason: ${{ steps.decide.outputs['security-reason'] }}
      codeql: ${{ steps.decide.outputs['codeql'] }}
      codeql-reason: ${{ steps.decide.outputs['codeql-reason'] }}
      docker: ${{ steps.decide.outputs['docker'] }}
      docker-reason: ${{ steps.decide.outputs['docker-reason'] }}
      duplication: ${{ steps.decide.outputs['duplication'] }}
      duplication-reason: ${{ steps.decide.outputs['duplication-reason'] }}
      root-hygiene: ${{ steps.decide.outputs['root-hygiene'] }}
      root-hygiene-reason: ${{ steps.decide.outputs['root-hygiene-reason'] }}
      generated-artifacts: ${{ steps.decide.outputs['generated-artifacts'] }}
      generated-artifacts-reason: ${{ steps.decide.outputs['generated-artifacts-reason'] }}
      compiled-artifacts: ${{ steps.decide.outputs['compiled-artifacts'] }}
      compiled-artifacts-reason: ${{ steps.decide.outputs['compiled-artifacts-reason'] }}
      commit-governance: ${{ steps.decide.outputs['commit-governance'] }}
      commit-governance-reason: ${{ steps.decide.outputs['commit-governance-reason'] }}
      docs-governance: ${{ steps.decide.outputs['docs-governance'] }}
      docs-governance-reason: ${{ steps.decide.outputs['docs-governance-reason'] }}
    steps:
      - name: Checkout exact event head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python + uv
        uses: ./.github/actions/setup-python-uv
        with:
          python-version: "3.12"
          uv-extras: "dev"

      - name: Decide required / not_applicable per gate
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          BEFORE_SHA: ${{ github.event.before || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          uv run --frozen --no-build python -m scripts.engineering.ci.pr_gate classify \
            --catalog configs/quality/github_required_checks.yaml \
            --event-name "${EVENT_NAME}" \
            --base-sha "${BASE_SHA}" \
            --before-sha "${BEFORE_SHA}" \
            --head-sha "${HEAD_SHA}" \
            --artifact reports/quality/pr-gate-decisions.json

      - name: Upload decision matrix
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: pr-gate-decisions-${{ github.event.pull_request.head.sha || github.sha }}
          path: reports/quality/pr-gate-decisions.json
          if-no-files-found: error
          retention-days: 7

  lint-arch:
    needs: classify-changes
    if: ${{ needs['classify-changes'].outputs['lint-arch'] == 'required' }}
    uses: ./.github/workflows/import-linter.yml
    permissions:
      contents: read

  tests:
    needs: classify-changes
    if: ${{ needs['classify-changes'].outputs['tests'] == 'required' }}
    uses: ./.github/workflows/tests.yml
    permissions:
      contents: read

  type-checking:
    needs: classify-changes
    if: ${{ needs['classify-changes'].outputs['type-checking'] == 'required' }}
    uses: ./.github/workflows/type-checking.yml
    permissions:
      contents: read

  security:
    needs: classify-changes
    if: ${{ needs['classify-changes'].outputs['security'] == 'required' }}
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read

  codeql:
    needs: classify-changes
    if: ${{ needs['classify-changes'].outputs['codeql'] == 'required' }}
    uses: ./.github/workflows/codeql.yml
    permissions:
      contents: read
      security-events: write

  docker:
    needs: classify-changes
    if: ${{ needs['classify-changes'].outputs['docker'] == 'required' }}
    uses: ./.github/workflows/docker.yml
    # The reusable workflow declares a main-push-only GHCR job. The PR path
    # never schedules it, and every executable PR job narrows its own token.
    permissions:
      contents: read
      packages: write
      security-events: write

  docker-not-applicable:
    needs: classify-changes
    if: ${{ needs['classify-changes'].outputs['docker'] == 'not_applicable' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    outputs:
      head_sha: ${{ steps.na.outputs.head_sha }}
      reason: ${{ steps.na.outputs.reason }}
    steps:
      - name: Materialize docker N/A decision
        id: na
        env:
          HEAD_SHA: ${{ needs['classify-changes'].outputs.head_sha }}
          REASON: ${{ needs['classify-changes'].outputs['docker-reason'] }}
        run: |
          set -euo pipefail
          test -n "${HEAD_SHA}"
          test -n "${REASON}"
          echo "head_sha=${HEAD_SHA}" >> "${GITHUB_OUTPUT}"
          echo "reason=${REASON}" >> "${GITHUB_OUTPUT}"
          echo "docker=not_applicable reason=${REASON} head_sha=${HEAD_SHA}"

  duplication:
    needs: classify-changes
    if: ${{ needs['classify-changes'].outputs['duplication'] == 'required' }}
    uses: ./.github/workflows/duplication-complexity.yml
    permissions:
      contents: read

  root-hygiene:
    needs: classify-changes
    if: ${{ needs['classify-changes'].outputs['root-hygiene'] == 'required' }}
    uses: ./.github/workflows/root-hygiene.yml
    permissions:
      contents: read

  generated-artifacts:
    needs: classify-changes
    if: ${{ needs['classify-changes'].outputs['generated-artifacts'] == 'required' }}
    uses: ./.github/workflows/schema-governance.yml
    permissions:
      contents: read

  generated-artifacts-not-applicable:
    needs: classify-changes
    if: ${{ needs['classify-changes'].outputs['generated-artifacts'] == 'not_applicable' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    outputs:
      head_sha: ${{ steps.na.outputs.head_sha }}
      reason: ${{ steps.na.outputs.reason }}
    steps:
      - name: Materialize generated-artifacts N/A decision
        id: na
        env:
          HEAD_SHA: ${{ needs['classify-changes'].outputs.head_sha }}
          REASON: ${{ needs['classify-changes'].outputs['generated-artifacts-reason'] }}
        run: |
          set -euo pipefail
          test -n "${HEAD_SHA}"
          test -n "${REASON}"
          echo "head_sha=${HEAD_SHA}" >> "${GITHUB_OUTPUT}"
          echo "reason=${REASON}" >> "${GITHUB_OUTPUT}"
          echo "generated-artifacts=not_applicable reason=${REASON} head_sha=${HEAD_SHA}"

  compiled-artifacts:
    needs: classify-changes
    if: ${{ needs['classify-changes'].outputs['compiled-artifacts'] == 'required' }}
    uses: ./.github/workflows/compiled-artifacts-block.yml
    permissions:
      contents: read

  commit-governance:
    needs: classify-changes
    if: ${{ needs['classify-changes'].outputs['commit-governance'] == 'required' }}
    uses: ./.github/workflows/commit-lint.yml
    permissions:
      contents: read

  commit-governance-not-applicable:
    needs: classify-changes
    if: ${{ needs['classify-changes'].outputs['commit-governance'] == 'not_applicable' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    outputs:
      head_sha: ${{ steps.na.outputs.head_sha }}
      reason: ${{ steps.na.outputs.reason }}
    steps:
      - name: Materialize commit-governance N/A decision
        id: na
        env:
          HEAD_SHA: ${{ needs['classify-changes'].outputs.head_sha }}
          REASON: ${{ needs['classify-changes'].outputs['commit-governance-reason'] }}
        run: |
          set -euo pipefail
          test -n "${HEAD_SHA}"
          test -n "${REASON}"
          echo "head_sha=${HEAD_SHA}" >> "${GITHUB_OUTPUT}"
          echo "reason=${REASON}" >> "${GITHUB_OUTPUT}"
          echo "commit-governance=not_applicable reason=${REASON} head_sha=${HEAD_SHA}"

  docs-governance:
    needs: classify-changes
    if: ${{ needs['classify-changes'].outputs['docs-governance'] == 'required' }}
    uses: ./.github/workflows/docs.yml
    permissions:
      contents: read

  docs-governance-not-applicable:
    needs: classify-changes
    if: ${{ needs['classify-changes'].outputs['docs-governance'] == 'not_applicable' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    outputs:
      head_sha: ${{ steps.na.outputs.head_sha }}
      reason: ${{ steps.na.outputs.reason }}
    steps:
      - name: Materialize docs-governance N/A decision
        id: na
        env:
          HEAD_SHA: ${{ needs['classify-changes'].outputs.head_sha }}
          REASON: ${{ needs['classify-changes'].outputs['docs-governance-reason'] }}
        run: |
          set -euo pipefail
          test -n "${HEAD_SHA}"
          test -n "${REASON}"
          echo "head_sha=${HEAD_SHA}" >> "${GITHUB_OUTPUT}"
          echo "reason=${REASON}" >> "${GITHUB_OUTPUT}"
          echo "docs-governance=not_applicable reason=${REASON} head_sha=${HEAD_SHA}"

  pr-gate-complete:
    name: pr-gate-complete
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ always() }}
    needs:
      - classify-changes
      - lint-arch
      - tests
      - type-checking
      - security
      - codeql
      - docker
      - docker-not-applicable
      - duplication
      - root-hygiene
      - generated-artifacts
      - generated-artifacts-not-applicable
      - compiled-artifacts
      - commit-governance
      - commit-governance-not-applicable
      - docs-governance
      - docs-governance-not-applicable
    permissions:
      contents: read
    steps:
      - name: Checkout exact event head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python + uv
        uses: ./.github/actions/setup-python-uv
        with:
          python-version: "3.12"
          uv-extras: "dev"

      - name: Validate aggregator (fail-closed)
        env:
          DECISION_MATRIX: "${{ needs['classify-changes'].outputs.decision_matrix }}"
          AGGREGATE_RESULTS: >-
            {
            "lint-arch": {"required": "${{ needs['lint-arch'].result }}", "not_applicable": "skipped"},
            "tests": {"required": "${{ needs['tests'].result }}", "not_applicable": "skipped"},
            "type-checking": {"required": "${{ needs['type-checking'].result }}", "not_applicable": "skipped"},
            "security": {"required": "${{ needs['security'].result }}", "not_applicable": "skipped"},
            "codeql": {"required": "${{ needs['codeql'].result }}", "not_applicable": "skipped"},
            "docker": {"required": "${{ needs['docker'].result }}", "not_applicable": "${{ needs['docker-not-applicable'].result }}", "na_head_sha": "${{ needs['docker-not-applicable'].outputs.head_sha }}", "na_reason": "${{ needs['docker-not-applicable'].outputs.reason }}"},
            "duplication": {"required": "${{ needs['duplication'].result }}", "not_applicable": "skipped"},
            "root-hygiene": {"required": "${{ needs['root-hygiene'].result }}", "not_applicable": "skipped"},
            "generated-artifacts": {"required": "${{ needs['generated-artifacts'].result }}", "not_applicable": "${{ needs['generated-artifacts-not-applicable'].result }}", "na_head_sha": "${{ needs['generated-artifacts-not-applicable'].outputs.head_sha }}", "na_reason": "${{ needs['generated-artifacts-not-applicable'].outputs.reason }}"},
            "compiled-artifacts": {"required": "${{ needs['compiled-artifacts'].result }}", "not_applicable": "skipped"},
            "commit-governance": {"required": "${{ needs['commit-governance'].result }}", "not_applicable": "${{ needs['commit-governance-not-applicable'].result }}", "na_head_sha": "${{ needs['commit-governance-not-applicable'].outputs.head_sha }}", "na_reason": "${{ needs['commit-governance-not-applicable'].outputs.reason }}"},
            "docs-governance": {"required": "${{ needs['docs-governance'].result }}", "not_applicable": "${{ needs['docs-governance-not-applicable'].result }}", "na_head_sha": "${{ needs['docs-governance-not-applicable'].outputs.head_sha }}", "na_reason": "${{ needs['docs-governance-not-applicable'].outputs.reason }}"}
            }
          EXPECTED_HEAD_SHA: ${{ needs['classify-changes'].outputs.head_sha }}
          OBSERVED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          test "${{ needs['classify-changes'].result }}" = "success"
          uv run --frozen --no-build python -m scripts.engineering.ci.pr_gate aggregate \
            --catalog configs/quality/github_required_checks.yaml \
            --decision-matrix-env DECISION_MATRIX \
            --results-env AGGREGATE_RESULTS \
            --expected-head-sha "${EXPECTED_HEAD_SHA}" \
            --observed-head-sha "${OBSERVED_HEAD_SHA}" \
            --run-url "${RUN_URL}"

  # codex-temp-refresh-start
  refresh-canonical-evidence:
    name: Refresh canonical #9975 evidence (temporary)
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/pr-gate-complete-9975-v2' &&
      github.actor == 'SatoryKono'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: fix/pr-gate-complete-9975-v2

      - name: Verify exact same-repository branch
        env:
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = "SatoryKono/BioactivityDataAcquisition"
          test "${GITHUB_HEAD_REF}" = "fix/pr-gate-complete-9975-v2"
          test "$(git rev-parse HEAD)" = "${EVENT_HEAD_SHA}"

      - name: Setup Python + uv
        uses: ./.github/actions/setup-python-uv
        with:
          python-version: "3.12"
          uv-extras: "dev"

      - name: Setup Mermaid renderer
        uses: ./.github/actions/setup-mermaid
        with:
          install-librsvg: "true"

      - name: Download exact SHA-bound coverage candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v4
        with:
          name: coverage-report
          path: ${{ runner.temp }}/coverage-report
          run-id: 33629196368
          github-token: ${{ github.token }}

      - name: Format touched Python files
        run: |
          uv run --frozen --no-build ruff format \
            scripts/engineering/ci/pr_gate.py \
            tests/architecture/test_docker_runtime_contracts.py \
            tests/architecture/test_docs_governance_workflow.py \
            tests/architecture/test_e2e_health_mode_policy.py \
            tests/architecture/test_github_actions_runtime_policy.py \
            tests/architecture/test_pr_gate_complete.py \
            tests/architecture/test_pytest_sharded_inventory.py \
            tests/architecture/test_test_matrix_lane_policy.py \
            tests/unit/repo_backed/scripts/engineering/ci/test_pr_gate.py \
            tests/unit/repo_backed/scripts/test_report_observability_metric_inventory.py \
            tests/unit/scripts/engineering/qa/docker_stability_campaign/test_trivy_fixability_gate.py

      - name: Refresh canonical dataflows and renders
        env:
          REQUIRE_SVGO: "1"
        run: |
          uv run --frozen --no-build python -m scripts.diagrams generate-dataflows \
            --pipeline chembl_activity
          bash docs/02-architecture/diagrams/tooling/render.sh \
            --dir docs/02-architecture/diagrams/architecture \
            --filter '*chembl-pipeline-activity*' \
            --puppeteer /tmp/puppeteer-config.json

      - name: Install exact coverage evidence and synchronize closeout
        env:
          COVERAGE_ROOT: ${{ runner.temp }}/coverage-report
          EXPECTED_SOURCE_SHA256: f1a1bc88b94cccf0522df217c196fc97def99f68003c2dcb0465d5686a1343b3
        run: |
          set -euo pipefail
          candidate="$(find "${COVERAGE_ROOT}" -type f -name module-coverage-inventory.candidate.json -print -quit)"
          test -n "${candidate}"
          export COVERAGE_CANDIDATE="${candidate}"
          uv run --frozen --no-build python - <<'PY'
          import json
          import os
          import shutil
          from pathlib import Path

          candidate = Path(os.environ["COVERAGE_CANDIDATE"])
          inventory_payload = json.loads(candidate.read_text(encoding="utf-8"))
          expected = os.environ["EXPECTED_SOURCE_SHA256"]
          actual = inventory_payload.get("source_tree_sha256")
          if actual != expected:
              raise SystemExit(
                  f"coverage candidate source SHA mismatch: {actual!r} != {expected!r}"
              )
          shutil.copyfile(
              candidate,
              Path("reports/quality/module-coverage-inventory.json"),
          )

          closeout_path = Path("reports/quality/low-coverage-targeted-tests-6045.json")
          closeout = json.loads(closeout_path.read_text(encoding="utf-8"))
          closeout["module_coverage_inventory_source_tree_sha256"] = expected
          closeout_path.write_text(
              json.dumps(closeout, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Remove temporary job before canonical inventory generation
        run: |
          sed -i '/^  # codex-temp-refresh-start$/,/^  # codex-temp-refresh-end$/d' \
            .github/workflows/pr-required.yml
          ! grep -q 'codex-temp-refresh' .github/workflows/pr-required.yml

      - name: Refresh canonical inventories
        run: |
          uv run --frozen --no-build python -m scripts.docs \
            generate-cleanup-inventory --update
          uv run --frozen --no-build python -m scripts.engineering.repo \
            sync-inventory
          uv run --frozen --no-build python -m scripts.engineering.qa.report_test_governance_audit
          uv run --frozen --no-build python -m scripts.engineering.qa \
            report-artifact-duplication-audit \
            --json-out reports/quality/config-contract-registry-artifact-duplication.json

      - name: Verify generated change allowlist
        run: |
          set -euo pipefail
          unexpected="$(
            git status --porcelain=v1 | sed -E 's/^...//' | while IFS= read -r path; do
              case "$path" in
                .github/workflows/pr-required.yml|\
                configs/quality/scripts_inventory_manifest.json|\
                docs/reports/generated/documentation-cleanup-inventory.json|\
                docs/reports/generated/documentation-cleanup-inventory.md|\
                reports/quality/config-contract-registry-artifact-duplication.json|\
                reports/quality/low-coverage-targeted-tests-6045.json|\
                reports/quality/module-coverage-inventory.json|\
                reports/quality/test-governance-current.json|\
                tests/architecture/test_docker_runtime_contracts.py|\
                tests/architecture/test_docs_governance_workflow.py|\
                tests/architecture/test_e2e_health_mode_policy.py|\
                tests/architecture/test_github_actions_runtime_policy.py|\
                tests/architecture/test_pr_gate_complete.py|\
                tests/architecture/test_pytest_sharded_inventory.py|\
                tests/architecture/test_test_matrix_lane_policy.py|\
                tests/unit/repo_backed/scripts/engineering/ci/test_pr_gate.py|\
                tests/unit/repo_backed/scripts/test_report_observability_metric_inventory.py|\
                tests/unit/scripts/engineering/qa/docker_stability_campaign/test_trivy_fixability_gate.py|\
                docs/02-architecture/diagrams/architecture/49-chembl-pipeline-activity-dataflow.mmd|\
                docs/02-architecture/diagrams/architecture/50-chembl-pipeline-activity-filter-criteria.mmd|\
                docs/02-architecture/diagrams/architecture/51a-chembl-pipeline-activity-silver-fields-1.mmd|\
                docs/02-architecture/diagrams/architecture/51b-chembl-pipeline-activity-silver-fields-2.mmd|\
                docs/02-architecture/diagrams/architecture/52a-chembl-pipeline-activity-gold-fields-1.mmd|\
                docs/02-architecture/diagrams/architecture/52b-chembl-pipeline-activity-gold-fields-2.mmd|\
                docs/02-architecture/diagrams/architecture/svg/49-chembl-pipeline-activity-dataflow.svg|\
                docs/02-architecture/diagrams/architecture/svg/50-chembl-pipeline-activity-filter-criteria.svg|\
                docs/02-architecture/diagrams/architecture/svg/51a-chembl-pipeline-activity-silver-fields-1.svg|\
                docs/02-architecture/diagrams/architecture/svg/51b-chembl-pipeline-activity-silver-fields-2.svg|\
                docs/02-architecture/diagrams/architecture/svg/52a-chembl-pipeline-activity-gold-fields-1.svg|\
                docs/02-architecture/diagrams/architecture/svg/52b-chembl-pipeline-activity-gold-fields-2.svg|\
                docs/02-architecture/diagrams/architecture/svg/INDEX.md|\
                docs/02-architecture/diagrams/descriptions/architecture/49-chembl-pipeline-activity-dataflow.md|\
                docs/02-architecture/diagrams/descriptions/architecture/50-chembl-pipeline-activity-filter-criteria.md|\
                docs/02-architecture/diagrams/descriptions/architecture/51a-chembl-pipeline-activity-silver-fields-1.md|\
                docs/02-architecture/diagrams/descriptions/architecture/51b-chembl-pipeline-activity-silver-fields-2.md|\
                docs/02-architecture/diagrams/descriptions/architecture/52a-chembl-pipeline-activity-gold-fields-1.md|\
                docs/02-architecture/diagrams/descriptions/architecture/52b-chembl-pipeline-activity-gold-fields-2.md|\
                docs/02-architecture/generated/pipeline-dataflows/chembl_activity/pipeline-dataflow-ir.json|\
                docs/02-architecture/generated/pipeline-dataflows/chembl_activity/pipeline-passport.md)
                  ;;
                *)
                  printf '%s\n' "$path"
                  ;;
              esac
            done
          )"
          if [[ -n "$unexpected" ]]; then
            printf 'Unexpected generated paths:\n%s\n' "$unexpected" >&2
            exit 1
          fi

      - name: Commit and push canonical refresh
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            .github/workflows/pr-required.yml \
            configs/quality/scripts_inventory_manifest.json \
            docs/02-architecture/diagrams/architecture \
            docs/02-architecture/diagrams/descriptions/architecture \
            docs/02-architecture/generated/pipeline-dataflows/chembl_activity \
            docs/reports/generated/documentation-cleanup-inventory.json \
            docs/reports/generated/documentation-cleanup-inventory.md \
            reports/quality/config-contract-registry-artifact-duplication.json \
            reports/quality/low-coverage-targeted-tests-6045.json \
            reports/quality/module-coverage-inventory.json \
            reports/quality/test-governance-current.json \
            tests/architecture/test_docker_runtime_contracts.py \
            tests/architecture/test_docs_governance_workflow.py \
            tests/architecture/test_e2e_health_mode_policy.py \
            tests/architecture/test_github_actions_runtime_policy.py \
            tests/architecture/test_pr_gate_complete.py \
            tests/architecture/test_pytest_sharded_inventory.py \
            tests/architecture/test_test_matrix_lane_policy.py \
            tests/unit/repo_backed/scripts/engineering/ci/test_pr_gate.py \
            tests/unit/repo_backed/scripts/test_report_observability_metric_inventory.py \
            tests/unit/scripts/engineering/qa/docker_stability_campaign/test_trivy_fixability_gate.py
          git diff --cached --check
          if git diff --cached --quiet; then
