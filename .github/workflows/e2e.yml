name: E2E Tests

on:
  schedule:
    # Nightly run at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    # Allow manual trigger
  push:
    branches:
      - main
    paths:
      - 'tests/e2e/**'
      - 'docker-compose.test.yml'
      - '.github/workflows/e2e.yml'

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[dev]"

      - name: Start Docker services
        run: |
          docker compose -f docker-compose.test.yml up -d
          echo "Waiting for services to be healthy..."
          sleep 10

      - name: Wait for MinIO
        run: |
          timeout 60 bash -c 'until curl -f http://localhost:9000/minio/health/live; do echo "Waiting for MinIO..."; sleep 2; done'
        continue-on-error: false

      - name: Wait for Redis
        run: |
          timeout 60 bash -c 'until docker exec $(docker ps -qf "name=redis") redis-cli ping; do echo "Waiting for Redis..."; sleep 2; done'
        continue-on-error: false

      - name: Run E2E tests
        run: |
          pytest tests/e2e/ -v -m e2e --tb=short --maxfail=3 --durations=10
        env:
          BIOETL_ENV: dev
          BIOETL_TEST_MODE: "true"
          BIOETL_S3_ENDPOINT: http://localhost:9000
          BIOETL_S3_ACCESS_KEY: minioadmin
          BIOETL_S3_SECRET_KEY: minioadmin
          BIOETL_REDIS_URL: redis://localhost:16379

      - name: Show Docker logs on failure
        if: failure()
        run: |
          echo "=== MinIO logs ==="
          docker compose -f docker-compose.test.yml logs minio
          echo "=== Redis logs ==="
          docker compose -f docker-compose.test.yml logs redis

      - name: Collect test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: |
            htmlcov/
            .pytest_cache/
            tests/e2e/**/*.log
          retention-days: 7

      - name: Teardown Docker services
        if: always()
        run: |
          docker compose -f docker-compose.test.yml down -v

      - name: Notify on failure
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'E2E Tests Failed (Nightly)',
              body: `E2E tests failed in nightly run. [View workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              labels: ['bug', 'e2e', 'nightly-failure']
            })
