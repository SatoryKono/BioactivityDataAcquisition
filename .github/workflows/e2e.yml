name: E2E Tests

on:
  schedule:
    - cron: '0 2 * * *'  # Nightly at 2 AM UTC
  workflow_dispatch:      # Manual trigger

jobs:
  e2e-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v1

      - name: Install dependencies
        run: |
          uv sync --extra dev --extra tracing

      - name: Start Docker Services
        run: |
          docker compose -f docker-compose.test.yml up -d
          docker ps

          # Wait for MinIO
          timeout 30s bash -c 'until curl -s http://localhost:9000/minio/health/live; do sleep 1; done'

          # Wait for Redis
          # (Simple check if port is open)
          timeout 30s bash -c 'until echo > /dev/tcp/localhost/6379; do sleep 1; done'

      - name: Run E2E Tests
        env:
          BIOETL_ENV: staging
        run: |
          uv run pytest tests/e2e/ -v -m e2e

      - name: Stop Docker Services
        if: always()
        run: docker compose -f docker-compose.test.yml down
