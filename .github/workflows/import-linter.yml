name: Lint and Architecture Gates

on:
    workflow_call:
    push:
        branches:
            - main
            - master
            - develop
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: lint-architecture-${{ github.event.pull_request.number || github.sha }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    lint:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        permissions:
            contents: read

        steps:
            -   name: Checkout
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
                with:
                    fetch-depth: 0

            -   name: Setup Python + uv
                uses: ./.github/actions/setup-python-uv

            -   name: Ruff (strict staged profile - domain)
                run: uv run --frozen --no-build ruff check src/bioetl/domain --output-format=github

            -   name: Ruff (strict staged profile - application)
                run: uv run --frozen --no-build ruff check src/bioetl/application --output-format=github

            -   name: Ruff (strict staged profile - infrastructure)
                run: uv run --frozen --no-build ruff check src/bioetl/infrastructure --output-format=github

            -   name: Ruff format (strict full gate - src + tests)
                run: uv run --frozen --no-build ruff format --check src tests

            -   name: Ruff isort (strict full gate - src + tests)
                run: uv run --frozen --no-build ruff check --select I src tests --output-format=github

            -   name: Ruff (strict full gate - src + tests)
                run: uv run --frozen --no-build ruff check src tests --output-format=github

            -   name: Detect changed Python files
                id: changed-python
                shell: bash
                env:
                    EVENT_NAME: ${{ github.event_name }}
                    BASE_REF: ${{ github.base_ref }}
                    EVENT_BEFORE: ${{ github.event.before }}
                    GITHUB_SHA: ${{ github.sha }}
                run: |
                    set -euo pipefail

                    # Persist the change list on disk only. Never put thousands of
                    # paths into GITHUB_OUTPUT / job env — that triggers Linux
                    # ARG_MAX ("Argument list too long") when the next step starts.
                    list_file="${RUNNER_TEMP}/ruff-changed-python.txt"
                    : > "$list_file"

                    if [[ "$EVENT_NAME" == "pull_request" ]]; then
                      git fetch --no-tags --depth=1 origin "$BASE_REF"
                      diff_range="origin/$BASE_REF...HEAD"
                    else
                      before="$EVENT_BEFORE"
                      if [[ -n "$before" && "$before" != "0000000000000000000000000000000000000000" ]]; then
                        diff_range="${before}...$GITHUB_SHA"
                      else
                        diff_range="HEAD^...HEAD"
                      fi
                    fi

                    file_count=0
                    while IFS= read -r file; do
                      [[ -z "$file" ]] && continue
                      [[ -f "$file" ]] || continue
                      printf '%s\n' "$file" >> "$list_file"
                      file_count=$((file_count + 1))
                    done < <(git diff --name-only --diff-filter=ACMR "$diff_range" -- "*.py")

                    echo "list_file=${list_file}" >> "$GITHUB_OUTPUT"
                    echo "file_count=${file_count}" >> "$GITHUB_OUTPUT"
                    if [[ "$file_count" -eq 0 ]]; then
                      echo "has_changes=false" >> "$GITHUB_OUTPUT"
                    else
                      echo "has_changes=true" >> "$GITHUB_OUTPUT"
                    fi
                    echo "Changed Python files detected: ${file_count}"

            -   name: Ruff (autoformat changed Python files)
                if: steps.changed-python.outputs.has_changes == 'true'
                shell: bash
                env:
                    LIST_FILE: ${{ steps.changed-python.outputs.list_file }}
                    FILE_COUNT: ${{ steps.changed-python.outputs.file_count }}
                run: |
                    set -euo pipefail

                    list_file="${LIST_FILE}"
                    file_count="${FILE_COUNT}"
                    if [[ ! -f "$list_file" ]]; then
                      echo "::error::Missing changed-python list file: ${list_file}"
                      exit 1
                    fi

                    echo "Changed Python files for format gate: ${file_count}"

                    # Large restore merges / full-tree diffs: avoid per-path argv.
                    if [[ "$file_count" -gt 400 ]]; then
                      echo "Large change set (${file_count}); using directory-level ruff format --check."
                      uv run --frozen --no-build ruff format --check src tests
                      exit 0
                    fi

                    # Batch paths via xargs to stay under ARG_MAX.
                    xargs -a "$list_file" -d '\n' -n 100 \
                      uv run --frozen --no-build ruff format

                    if ! xargs -a "$list_file" -d '\n' -n 100 git diff --quiet --; then
                      echo "::error::Ruff autoformat changed Python files. Run 'ruff format' locally and commit."
                      xargs -a "$list_file" -d '\n' -n 100 git --no-pager diff --
                      exit 1
                    fi

    c901-governance:
        name: C901 Governance (blocking)
        runs-on: ubuntu-latest
        timeout-minutes: 15
        permissions:
            contents: read

        steps:
            -   name: Checkout
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

            -   name: Setup Python + uv
                uses: ./.github/actions/setup-python-uv

            -   name: Ruff C901 snapshot (src/bioetl)
                run: uv run --frozen --no-build ruff check src/bioetl --select C901 --output-format github --exit-zero

            -   name: Enforce C901 baseline policy (new violations forbidden)
                env:
                    C901_GOVERNANCE_MODE: ${{ vars.C901_GOVERNANCE_MODE }}
                run: |
                    mode="${C901_GOVERNANCE_MODE:-block}"
                    echo "C901 governance mode: ${mode}"
                    uv run --frozen --no-build python -m scripts.engineering.qa check-c901 \
                      --target src/bioetl \
                      --baseline-file scripts/engineering/baselines/c901_baseline.json \
                      --mode "${mode}"

    import-contracts:
        name: Import contracts
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read

        steps:
            -   name: Checkout
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

            -   name: Setup Python + uv
                uses: ./.github/actions/setup-python-uv

            -   name: Run import-linter architecture contracts
                run: uv run --frozen --no-build lint-imports --config .importlinter

    arch-tests:
        name: Architecture (${{ matrix.shard }})
        runs-on: ubuntu-latest
        timeout-minutes: 30
        permissions:
            contents: read
        strategy:
            fail-fast: false
            matrix:
                include:
                    - shard: S7-crosscutting-architecture-a
                      requires_lfs: false
                    - shard: S7-crosscutting-architecture-a3
                      requires_lfs: false
                    - shard: S7-crosscutting-architecture-b
                      requires_lfs: false
                    - shard: S7-crosscutting-architecture-c
                      requires_lfs: false
                    - shard: S7-crosscutting-architecture-d
                      requires_lfs: true
                    - shard: S7-crosscutting-architecture-guardrails-a
                      requires_lfs: false
                    - shard: S7-crosscutting-architecture-guardrails-b
                      requires_lfs: false
        env:
            BIOETL_PYTEST_SHARDED_TEST_HEALTH: '0'
            BIOETL_REQUIRE_TEST_CAPABILITIES: "1"

        steps:
            -   name: Checkout
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
                with:
                    # Full history required for telemetry/audit ancestor and commit-existence gates.
                    fetch-depth: 0

            -   name: Fetch Git LFS objects for architecture governance
                if: ${{ matrix.requires_lfs }}
                run: |
                    set -euo pipefail
                    # Test-governance source identity includes VCR fixture payloads.
                    # Fail closed instead of hashing unresolved LFS pointer files.
                    if ! git lfs pull; then
                      echo "::error::Git LFS pull failed for arch-tests. Required governance fixtures are unavailable. Increase the GitHub LFS data pack and re-run."
                      exit 1
                    fi
                    if git lfs ls-files -n | head -n 1 | grep -q .; then
                      sample="$(git lfs ls-files -n | head -n 1)"
                      if [ -f "$sample" ] && head -n 1 "$sample" | grep -q 'git-lfs.github.com/spec/v1'; then
                        echo "::error::Git LFS objects remain pointer files for arch-tests. Materialize LFS objects and re-run."
                        exit 1
                      fi
                    fi

            -   name: Setup Python + uv
                uses: ./.github/actions/setup-python-uv

            -   name: Run canonical architecture shard
                shell: bash
                run: |
                    bash scripts/engineering/dev/run_pytest_sharded.sh \
                      --shard "${{ matrix.shard }}" \
                      --stream \
                      --skip-preflight \
                      --junit-dir "reports/quality/test-runs/junit/architecture/${{ matrix.shard }}" \
                      -- \
                      --no-cov \
                      -m "not slow and not benchmark and not memory"

            -   name: Fail closed on empty collection or architecture skips
                if: ${{ always() && !cancelled() }}
                env:
                    JUNIT_DIR: reports/quality/test-runs/junit/architecture/${{ matrix.shard }}
                run: >
                    uv run --frozen --no-build python -m scripts.engineering.ci
                    architecture-junit-skips --junit-dir "${JUNIT_DIR}"

            -   name: Upload architecture JUnit artifact
                if: ${{ always() && !cancelled() }}
                uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
                with:
                    name: architecture-junit-${{ matrix.shard }}-${{ github.sha }}
                    path: reports/quality/test-runs/junit/architecture/${{ matrix.shard }}/*.xml
                    if-no-files-found: error
                    retention-days: 14

    arch-tests-slow:
        name: Architecture (slow)
        runs-on: ubuntu-latest
        timeout-minutes: 30
        permissions:
            contents: read
        env:
            BIOETL_PYTEST_SHARDED_TEST_HEALTH: "0"
            BIOETL_REQUIRE_TEST_CAPABILITIES: "1"
        steps:
            -   name: Checkout
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
                with:
                    fetch-depth: 0

            -   name: Setup Python + uv
                uses: ./.github/actions/setup-python-uv

            -   name: Run slow architecture nodes
                shell: bash
                run: |
                    mkdir -p reports/quality/test-runs/junit/architecture/slow
                    uv run --frozen --no-build python -m pytest tests/architecture \
                      --timeout=300 \
                      --no-cov \
                      -m "slow and not benchmark and not memory" \
                      --junitxml=reports/quality/test-runs/junit/architecture/slow/junit.xml

            -   name: Fail closed on empty collection or architecture skips
                if: ${{ always() && !cancelled() }}
                env:
                    JUNIT_DIR: reports/quality/test-runs/junit/architecture/slow
                run: >
                    uv run --frozen --no-build python -m scripts.engineering.ci
                    architecture-junit-skips --junit-dir "${JUNIT_DIR}"

            -   name: Upload slow architecture JUnit artifact
                if: ${{ always() && !cancelled() }}
                uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
                with:
                    name: architecture-junit-slow-${{ github.sha }}
                    path: reports/quality/test-runs/junit/architecture/slow/*.xml
                    if-no-files-found: error
                    retention-days: 14

    checks-complete:
        needs:
            - lint
            - c901-governance
            - import-contracts
            - arch-tests
            - arch-tests-slow
        runs-on: ubuntu-latest
        timeout-minutes: 5
        if: ${{ always() }}
        permissions:
            contents: read
        steps:
            -   name: Final status
                env:
                    LINT_RESULT: ${{ needs.lint.result }}
                    C901_RESULT: ${{ needs['c901-governance'].result }}
                    IMPORT_CONTRACTS_RESULT: ${{ needs['import-contracts'].result }}
                    ARCH_RESULT: ${{ needs['arch-tests'].result }}
                    ARCH_SLOW_RESULT: ${{ needs['arch-tests-slow'].result }}
                run: |
                    if [[ "$LINT_RESULT" != "success" || \
                          "$C901_RESULT" != "success" || \
                          "$IMPORT_CONTRACTS_RESULT" != "success" || \
                          "$ARCH_RESULT" != "success" || \
                          "$ARCH_SLOW_RESULT" != "success" ]]; then
                      echo "One or more checks failed"
                      exit 1
                    fi
                    echo "All checks completed successfully."
