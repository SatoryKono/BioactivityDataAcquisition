name: Lint, Type Check, and Tests

permissions:
    contents: read

on:
    push:
        branches:
            - main
            - master
        paths-ignore:
            - 'docs/**'
            - '*.md'
            - '.ai/**'
            - '.claude/**'
            - '.github/workflows/**'
            - 'LICENSE'
    pull_request:
        paths-ignore:
            - 'docs/**'
            - '*.md'
            - '.ai/**'
            - '.claude/**'
            - '.github/workflows/**'
            - 'LICENSE'

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    lint:
        runs-on: ubuntu-latest

        steps:
            -   name: Checkout
                uses: actions/checkout@v4
                with:
                    fetch-depth: 0

            -   name: Set up Python
                uses: actions/setup-python@v5
                with:
                    python-version: "3.11"

            -   name: Install uv
                uses: astral-sh/setup-uv@v7

            -   name: Cache uv and virtualenv
                uses: actions/cache@v4
                with:
                    path: |
                        ~/.cache/uv
                        .venv
                    key: uv-${{ runner.os }}-py311-${{ hashFiles('uv.lock') }}
                    restore-keys: |
                        uv-${{ runner.os }}-py311-

            -   name: Install dependencies (frozen lock)
                run: uv sync --frozen --extra dev --extra tracing

            -   name: Ruff (strict staged profile - domain)
                run: uv run ruff check src/bioetl/domain --output-format=github

            -   name: Ruff (strict staged profile - application)
                run: uv run ruff check src/bioetl/application --output-format=github

            -   name: Ruff (strict staged profile - infrastructure)
                run: uv run ruff check src/bioetl/infrastructure --output-format=github

            -   name: Ruff format (strict full gate - src + tests)
                run: uv run ruff format --check src tests

            -   name: Ruff isort (strict full gate - src + tests)
                run: uv run ruff check --select I src tests --output-format=github

            -   name: Ruff (strict full gate - src + tests)
                run: uv run ruff check src tests --output-format=github

            -   name: Detect changed Python files
                id: changed-python
                shell: bash
                run: |
                    set -euo pipefail

                    if [[ "${{ github.event_name }}" == "pull_request" ]]; then
                      git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
                      diff_range="origin/${{ github.base_ref }}...HEAD"
                    else
                      before="${{ github.event.before }}"
                      if [[ -n "$before" && "$before" != "0000000000000000000000000000000000000000" ]]; then
                        diff_range="${before}...${{ github.sha }}"
                      else
                        diff_range="HEAD^...HEAD"
                      fi
                    fi

                    mapfile -t changed_py < <(git diff --name-only --diff-filter=ACMR "$diff_range" -- "*.py")

                    if [[ ${#changed_py[@]} -eq 0 ]]; then
                      echo "has_changes=false" >> "$GITHUB_OUTPUT"
                      exit 0
                    fi

                    {
                      echo "has_changes=true"
                      echo "files<<EOF"
                      printf "%s\n" "${changed_py[@]}"
                      echo "EOF"
                    } >> "$GITHUB_OUTPUT"

            -   name: Ruff (autoformat changed Python files)
                if: steps.changed-python.outputs.has_changes == 'true'
                shell: bash
                run: |
                    set -euo pipefail

                    changed_py=()
                    while IFS= read -r file; do
                      [[ -n "$file" ]] && changed_py+=("$file")
                    done <<< "${{ steps.changed-python.outputs.files }}"

                    uv run ruff format "${changed_py[@]}"

                    if ! git diff --quiet -- "${changed_py[@]}"; then
                      echo "::error::Ruff autoformat changed Python files. Run 'ruff format' locally and commit."
                      git --no-pager diff -- "${changed_py[@]}"
                      exit 1
                    fi

            -   name: Mypy (strict-ish)
                run: |
                    uv run mypy --config-file pyproject.toml src/bioetl

    c901-governance:
        name: C901 Governance (blocking)
        runs-on: ubuntu-latest

        steps:
            -   name: Checkout
                uses: actions/checkout@v4

            -   name: Set up Python
                uses: actions/setup-python@v5
                with:
                    python-version: "3.11"

            -   name: Install uv
                uses: astral-sh/setup-uv@v7

            -   name: Cache uv and virtualenv
                uses: actions/cache@v4
                with:
                    path: |
                        ~/.cache/uv
                        .venv
                    key: uv-${{ runner.os }}-py311-${{ hashFiles('uv.lock') }}
                    restore-keys: |
                        uv-${{ runner.os }}-py311-

            -   name: Install dependencies (frozen lock)
                run: uv sync --frozen --extra dev --extra tracing

            -   name: Ruff C901 snapshot (src/bioetl)
                run: uv run ruff check src/bioetl --select C901 --output-format github --exit-zero

            -   name: Enforce C901 baseline policy (new violations forbidden)
                env:
                    C901_GOVERNANCE_MODE: ${{ vars.C901_GOVERNANCE_MODE }}
                run: |
                    mode="${C901_GOVERNANCE_MODE:-block}"
                    echo "C901 governance mode: ${mode}"
                    uv run python scripts/check_c901_baseline.py \
                      --target src/bioetl \
                      --baseline-file scripts/baselines/c901_baseline.json \
                      --mode "${mode}"

    arch-tests:
        runs-on: ubuntu-latest

        steps:
            -   name: Checkout
                uses: actions/checkout@v4

            -   name: Set up Python
                uses: actions/setup-python@v5
                with:
                    python-version: "3.11"

            -   name: Install uv
                uses: astral-sh/setup-uv@v7

            -   name: Cache uv and virtualenv
                uses: actions/cache@v4
                with:
                    path: |
                        ~/.cache/uv
                        .venv
                    key: uv-${{ runner.os }}-py311-${{ hashFiles('uv.lock') }}
                    restore-keys: |
                        uv-${{ runner.os }}-py311-

            -   name: Install dependencies (frozen lock)
                run: uv sync --frozen --extra dev --extra tracing

            -   name: Architecture tests (all)
                run: uv run pytest tests/architecture/ -v --tb=short

            -   name: Import Linter contract
                run: uv run lint-imports --config .importlinter

            -   name: Application layer dependency graph
                run: uv run python src/tools/scripts/check_application_deps.py

            -   name: Infrastructure layer architecture check
                run: uv run python src/tools/scripts/check_architecture.py

    unit-tests:
        needs: lint
        runs-on: ubuntu-latest

        steps:
            -   name: Checkout
                uses: actions/checkout@v4

            -   name: Set up Python
                uses: actions/setup-python@v5
                with:
                    python-version: "3.11"

            -   name: Install uv
                uses: astral-sh/setup-uv@v7

            -   name: Cache uv and virtualenv
                uses: actions/cache@v4
                with:
                    path: |
                        ~/.cache/uv
                        .venv
                    key: uv-${{ runner.os }}-py311-${{ hashFiles('uv.lock') }}
                    restore-keys: |
                        uv-${{ runner.os }}-py311-

            -   name: Restore pytest cache
                uses: actions/cache@v4
                with:
                    path: .pytest_cache
                    key: ${{ runner.os }}-pytest-unit-${{ hashFiles('pyproject.toml') }}

            -   name: Install dependencies (frozen lock)
                run: uv sync --frozen --extra dev --extra tracing

            -   name: Unit tests with coverage
                run: |
                    uv run pytest tests --ignore=tests/integration --ignore=tests/architecture \
                      --ignore=tests/e2e --ignore=tests/contract \
                      --cov=src/bioetl --cov-report=xml:coverage-unit.xml --cov-report=term-missing

            -   name: Enforce coverage thresholds
                run: |
                    uv run python - <<'PY'
                    import sys
                    import xml.etree.ElementTree as ET

                    tree = ET.parse("coverage-unit.xml")
                    root = tree.getroot()

                    def overall_percent() -> float:
                      try:
                        covered = int(root.attrib["lines-covered"])
                        valid = int(root.attrib["lines-valid"])
                        return 100 * covered / valid if valid else 100.0
                      except KeyError:
                        return float(root.attrib.get("line-rate", 0)) * 100

                    def percent_for_prefix(prefixes: tuple[str, ...]) -> float:
                      covered = total = 0
                      for cls in root.iterfind(".//class"):
                        filename = cls.attrib.get("filename", "")
                        if not filename or not filename.startswith(prefixes):
                          continue
                        for line in cls.iterfind(".//line"):
                          total += 1
                          if int(line.attrib.get("hits", "0")) > 0:
                            covered += 1
                      if total == 0:
                        return 100.0
                      return 100 * covered / total

                    overall = overall_percent()
                    domain_app = percent_for_prefix(("bioetl/application", "bioetl/domain"))

                    print(f"Overall coverage: {overall:.2f}%")
                    print(f"Domain/Application coverage: {domain_app:.2f}%")

                    errors = []
                    if overall < 85:
                      errors.append(f"Overall coverage below 85%: {overall:.2f}%")
                    if domain_app < 90:
                      errors.append(
                        f"Domain/Application coverage below 90%: {domain_app:.2f}%"
                      )

                    if errors:
                      for error in errors:
                        print(error)
                      sys.exit(1)
                    PY

    integration-tests:
        needs: lint
        runs-on: ubuntu-latest

        steps:
            -   name: Checkout
                uses: actions/checkout@v4

            -   name: Set up Python
                uses: actions/setup-python@v5
                with:
                    python-version: "3.11"

            -   name: Install uv
                uses: astral-sh/setup-uv@v7

            -   name: Cache uv and virtualenv
                uses: actions/cache@v4
                with:
                    path: |
                        ~/.cache/uv
                        .venv
                    key: uv-${{ runner.os }}-py311-${{ hashFiles('uv.lock') }}
                    restore-keys: |
                        uv-${{ runner.os }}-py311-

            -   name: Restore pytest cache
                uses: actions/cache@v4
                with:
                    path: .pytest_cache
                    key: ${{ runner.os }}-pytest-integration-${{ hashFiles('pyproject.toml') }}

            -   name: Install dependencies (frozen lock)
                run: uv sync --frozen --extra dev --extra tracing

            -   name: Integration tests
                run: |
                    uv run pytest tests/integration -v --tb=short

    checks-complete:
        needs:
            - lint
            - c901-governance
            - unit-tests
            - integration-tests
            - arch-tests
        runs-on: ubuntu-latest
        if: ${{ always() }}
        steps:
            -   name: Final status
                run: |
                    if [[ "${{ needs.lint.result }}" != "success" || "${{ needs['c901-governance'].result }}" != "success" || "${{ needs.unit-tests.result }}" != "success" || "${{ needs['integration-tests'].result }}" != "success" || "${{ needs['arch-tests'].result }}" != "success" ]]; then
                      echo "One or more checks failed"
                      exit 1
                    fi
                    echo "All checks completed successfully."
