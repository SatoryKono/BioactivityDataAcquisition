name: Lint and Architecture Gates

on:
    push:
        branches:
            - main
            - master
            - develop
    pull_request:
    workflow_dispatch:

permissions:
  contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    lint:
        runs-on: ubuntu-latest
        permissions:
            contents: read

        steps:
            -   name: Checkout
                uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
                with:
                    fetch-depth: 0

            -   name: Setup Python + uv
                uses: ./.github/actions/setup-python-uv

            -   name: Ruff (strict staged profile - domain)
                run: uv run --frozen  ruff check src/bioetl/domain --output-format=github

            -   name: Ruff (strict staged profile - application)
                run: uv run --frozen  ruff check src/bioetl/application --output-format=github

            -   name: Ruff (strict staged profile - infrastructure)
                run: uv run --frozen  ruff check src/bioetl/infrastructure --output-format=github

            -   name: Ruff format (strict full gate - src + tests)
                run: uv run --frozen  ruff format --check src tests

            -   name: Ruff isort (strict full gate - src + tests)
                run: uv run --frozen  ruff check --select I src tests --output-format=github

            -   name: Ruff (strict full gate - src + tests)
                run: uv run --frozen  ruff check src tests --output-format=github

            -   name: Detect changed Python files
                id: changed-python
                shell: bash
                env:
                    EVENT_NAME: ${{ github.event_name }}
                    BASE_REF: ${{ github.base_ref }}
                    EVENT_BEFORE: ${{ github.event.before }}
                    GITHUB_SHA: ${{ github.sha }}
                run: |
                    set -euo pipefail

                    if [[ "$EVENT_NAME" == "pull_request" ]]; then
                      git fetch --no-tags --depth=1 origin "$BASE_REF"
                      diff_range="origin/$BASE_REF...HEAD"
                    else
                      before="$EVENT_BEFORE"
                      if [[ -n "$before" && "$before" != "0000000000000000000000000000000000000000" ]]; then
                        diff_range="${before}...$GITHUB_SHA"
                      else
                        diff_range="HEAD^...HEAD"
                      fi
                    fi

                    mapfile -t changed_py < <(git diff --name-only --diff-filter=ACMR "$diff_range" -- "*.py")

                    if [[ ${#changed_py[@]} -eq 0 ]]; then
                      echo "has_changes=false" >> "$GITHUB_OUTPUT"
                      exit 0
                    fi

                    {
                      echo "has_changes=true"
                      echo "files<<EOF"
                      printf "%s\n" "${changed_py[@]}"
                      echo "EOF"
                    } >> "$GITHUB_OUTPUT"

            -   name: Ruff (autoformat changed Python files)
                if: steps.changed-python.outputs.has_changes == 'true'
                shell: bash
                env:
                    CHANGED_FILES: ${{ steps.changed-python.outputs.files }}
                run: |
                    set -euo pipefail

                    changed_py=()
                    while IFS= read -r file; do
                      [[ -n "$file" ]] && changed_py+=("$file")
                    done <<< "$CHANGED_FILES"

                    uv run --frozen  ruff format "${changed_py[@]}"

                    if ! git diff --quiet -- "${changed_py[@]}"; then
                      echo "::error::Ruff autoformat changed Python files. Run 'ruff format' locally and commit."
                      git --no-pager diff -- "${changed_py[@]}"
                      exit 1
                    fi

    c901-governance:
        name: C901 Governance (blocking)
        runs-on: ubuntu-latest
        permissions:
            contents: read

        steps:
            -   name: Checkout
                uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

            -   name: Setup Python + uv
                uses: ./.github/actions/setup-python-uv

            -   name: Ruff C901 snapshot (src/bioetl)
                run: uv run --frozen  ruff check src/bioetl --select C901 --output-format github --exit-zero

            -   name: Enforce C901 baseline policy (new violations forbidden)
                env:
                    C901_GOVERNANCE_MODE: ${{ vars.C901_GOVERNANCE_MODE }}
                run: |
                    mode="${C901_GOVERNANCE_MODE:-block}"
                    echo "C901 governance mode: ${mode}"
                    uv run --frozen  python -m scripts.engineering.qa check-c901 \
                      --target src/bioetl \
                      --baseline-file scripts/engineering/baselines/c901_baseline.json \
                      --mode "${mode}"

    arch-tests:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        env:
            BIOETL_REQUIRE_TEST_CAPABILITIES: "1"

        steps:
            -   name: Checkout
                uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

            -   name: Setup Python + uv
                uses: ./.github/actions/setup-python-uv

            -   name: Run import-linter architecture contracts
                run: uv run --frozen  lint-imports --config .importlinter

            -   name: Run canonical full architecture gate
                run: uv run --frozen  pytest tests/architecture/ -m "not slow and not benchmark and not memory"

    checks-complete:
        needs:
            - lint
            - c901-governance
            - arch-tests
        runs-on: ubuntu-latest
        if: ${{ always() }}
        steps:
            -   name: Final status
                env:
                    LINT_RESULT: ${{ needs.lint.result }}
                    C901_RESULT: ${{ needs['c901-governance'].result }}
                    ARCH_RESULT: ${{ needs['arch-tests'].result }}
                run: |
                    if [[ "$LINT_RESULT" != "success" || \
                          "$C901_RESULT" != "success" || \
                          "$ARCH_RESULT" != "success" ]]; then
                      echo "One or more checks failed"
                      exit 1
                    fi
                    echo "All checks completed successfully."
