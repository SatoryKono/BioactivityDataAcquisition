name: Codex CI Diagnostic

on:
  push:
    branches:
      - fix/main-ci-20260902

permissions:
  contents: read

jobs:
  hashes-and-targeted-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout with LFS evidence
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          lfs: true

      - name: Setup Python + uv
        uses: ./.github/actions/setup-python-uv
        with:
          python-version: "3.12"

      - name: Print canonical hashes
        run: |
          echo "TECH_DEBT_EVIDENCE_SHA=$(uv run --frozen --no-build python -m scripts.engineering.qa.technical_debt_audit_registry --print-evidence-hash)"
          uv run --frozen --no-build python -c "from scripts.engineering.qa.report_test_governance_audit import collect_test_governance_report; print('TEST_GOVERNANCE_SHA=' + collect_test_governance_report()['source_tree_sha256'])"
          uv run --frozen --no-build python -c "from scripts.engineering.ci.update_test_telemetry_baseline import compute_test_telemetry_source_tree_sha256; print('TEST_TELEMETRY_SHA=' + compute_test_telemetry_source_tree_sha256())"

      - name: Validate scanner test isolation
        run: |
          uv run --frozen --no-build pytest tests/unit/repo_backed/scripts/test_report_observability_metric_inventory.py::test_iter_text_files_prefers_git_discovery_before_path_stat tests/unit/repo_backed/scripts/test_report_observability_metric_inventory.py::test_iter_text_files_with_git_ls_files_filters_text_suffixes -p no:xdist -q --tb=short
