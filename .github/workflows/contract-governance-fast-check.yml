# Fast Check - Contract Governance
# Runs quick validation checks for contract identity and registry consistency

name: Contract Governance Fast Check

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'configs/base/contract_registry.yaml'
      - 'configs/contracts/**'
      - 'src/bioetl/domain/**/*contract*'
      - 'scripts/engineering/ci/validate_contract_*.py'
      - 'scripts/engineering/ci/validate_registry_dq_refs.py'
      - 'scripts/engineering/ci/validate_schema_classifier_gate.py'
      - '.github/workflows/contract-governance-*.yml'
  pull_request:
    paths:
      - 'configs/base/contract_registry.yaml'
      - 'configs/contracts/**'
      - 'src/bioetl/domain/**/*contract*'
      - 'scripts/engineering/ci/validate_contract_*.py'
      - 'scripts/engineering/ci/validate_registry_dq_refs.py'
      - 'scripts/engineering/ci/validate_schema_classifier_gate.py'
      - '.github/workflows/contract-governance-*.yml'

env:
  PYTHON_VERSION: "3.11"
  UV_VERSION: "0.1.0"

jobs:
  fast-check:
    name: Fast Check - Contract Identity & Registry
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4.9.1
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@162b8acf397cb069dec09a3f5a9847cf71cfa46a # v1
        with:
          version: ${{ env.UV_VERSION }}

      - name: Install dependencies
        run: |
          uv pip install -e ".[dev]"

      - name: Run contract identity checks
        id: identity-check
        run: |
          echo "::group::Contract Identity Validation"
          set +e
          uv run python scripts/engineering/ci/validate_contract_identity.py
          IDENTITY_EXIT_CODE=$?
          set -e
          echo "::endgroup::"

          if [ $IDENTITY_EXIT_CODE -eq 0 ]; then
            echo "contract_identity_verdict=passed" >> $GITHUB_OUTPUT
          else
            echo "contract_identity_verdict=failed" >> $GITHUB_OUTPUT
          fi

      - name: Run registry consistency checks
        id: registry-check
        run: |
          echo "::group::Registry Consistency Validation"
          set +e
          uv run python scripts/engineering/ci/validate_contract_registry.py
          REGISTRY_EXIT_CODE=$?
          set -e
          echo "::endgroup::"

          if [ $REGISTRY_EXIT_CODE -eq 0 ]; then
            echo "registry_consistency_verdict=passed" >> $GITHUB_OUTPUT
          else
            echo "registry_consistency_verdict=failed" >> $GITHUB_OUTPUT
          fi

      - name: Run schema classifier governance gate
        id: classifier-check
        run: |
          echo "::group::Schema Classifier Governance"
          BASE_SHA="${{ github.event.pull_request.base.sha || github.event.before }}"
          HEAD_SHA="${{ github.sha }}"
          set +e
          if [ -n "$BASE_SHA" ]; then
            uv run python scripts/engineering/ci/validate_schema_classifier_gate.py --base-sha "$BASE_SHA" --head-sha "$HEAD_SHA"
          else
            uv run python scripts/engineering/ci/validate_schema_classifier_gate.py --head-sha "$HEAD_SHA"
          fi
          CLASSIFIER_EXIT_CODE=$?
          set -e
          echo "::endgroup::"

          if [ $CLASSIFIER_EXIT_CODE -eq 0 ]; then
            echo "classifier_verdict=passed" >> $GITHUB_OUTPUT
          else
            echo "classifier_verdict=failed" >> $GITHUB_OUTPUT
          fi

      - name: Run registry↔DQ ref consistency checks
        id: registry-dq-check
        run: |
          echo "::group::Registry DQ Reference Validation"
          set +e
          uv run python scripts/engineering/ci/validate_registry_dq_refs.py
          REGISTRY_DQ_EXIT_CODE=$?
          set -e
          echo "::endgroup::"

          if [ $REGISTRY_DQ_EXIT_CODE -eq 0 ]; then
            echo "registry_dq_verdict=passed" >> $GITHUB_OUTPUT
          else
            echo "registry_dq_verdict=failed" >> $GITHUB_OUTPUT
          fi

      - name: Determine enforcement stage
        id: enforcement
        run: |
          # Count failures
          FAILED_CHECKS=0

          if [ "${{ steps.identity-check.outputs.contract_identity_verdict }}" = "failed" ]; then
            FAILED_CHECKS=$((FAILED_CHECKS + 1))
          fi

          if [ "${{ steps.registry-check.outputs.registry_consistency_verdict }}" = "failed" ]; then
            FAILED_CHECKS=$((FAILED_CHECKS + 1))
          fi

          if [ "${{ steps.classifier-check.outputs.classifier_verdict }}" = "failed" ]; then
            FAILED_CHECKS=$((FAILED_CHECKS + 1))
          fi

          if [ "${{ steps.registry-dq-check.outputs.registry_dq_verdict }}" = "failed" ]; then
            FAILED_CHECKS=$((FAILED_CHECKS + 1))
          fi

          echo "failed_checks=$FAILED_CHECKS" >> $GITHUB_OUTPUT

          # Hard-gate policy: any failed governance check blocks the workflow.
          if [ "$FAILED_CHECKS" -ge 1 ]; then
            STAGE="hard_fail"
            MESSAGE="Contract governance checks failed"
          else
            STAGE="pass"
            MESSAGE="All contract governance checks passed"
          fi

          echo "enforcement_stage=$STAGE" >> $GITHUB_OUTPUT
          echo "enforcement_message=$MESSAGE" >> $GITHUB_OUTPUT

      - name: Report results
        run: |
          echo "::notice title=Contract Governance Fast Check::${{ steps.enforcement.outputs.enforcement_message }}"
          echo "Contract Identity: ${{ steps.identity-check.outputs.contract_identity_verdict }}"
          echo "Registry Consistency: ${{ steps.registry-check.outputs.registry_consistency_verdict }}"
          echo "Schema Classifier Gate: ${{ steps.classifier-check.outputs.classifier_verdict }}"
          echo "Registry↔DQ Refs: ${{ steps.registry-dq-check.outputs.registry_dq_verdict }}"
          echo "Failed Checks: ${{ steps.enforcement.outputs.failed_checks }}"

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-governance-diagnostics
          path: |
            contract-identity-diagnostics.json
            contract-registry-diagnostics.json
            contract-schema-classifier-diagnostics.json
            contract-registry-dq-diagnostics.json
          retention-days: 30

      - name: Add to CI summary
        run: |
          cat << 'EOF' >> $GITHUB_STEP_SUMMARY
          ## Contract Governance Fast Check

          **Stage**: ${{ steps.enforcement.outputs.enforcement_stage }}

          ### Results
          - **Contract Identity**: ${{ steps.identity-check.outputs.contract_identity_verdict }}
          - **Registry Consistency**: ${{ steps.registry-check.outputs.registry_consistency_verdict }}
          - **Schema Classifier Gate**: ${{ steps.classifier-check.outputs.classifier_verdict }}
          - **Registry↔DQ Refs**: ${{ steps.registry-dq-check.outputs.registry_dq_verdict }}
          - **Failed Checks**: ${{ steps.enforcement.outputs.failed_checks }}

          **Message**: ${{ steps.enforcement.outputs.enforcement_message }}

          ### Artifacts
          - [Contract Governance Diagnostics](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
          EOF

      - name: Fail on hard failures
        if: steps.enforcement.outputs.enforcement_stage == 'hard_fail'
        run: |
          echo "::error::Hard fail threshold exceeded"
          exit 1
