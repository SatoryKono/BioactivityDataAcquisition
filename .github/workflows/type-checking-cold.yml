name: Type Checking (Strict Cold Control)

on:
  schedule:
    - cron: '0 2 * * 0'  # Weekly on Sunday at 2 AM
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  type-check-cold:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python + uv
        uses: ./.github/actions/setup-python-uv

      - name: Run mypy (strict mode, cold control)
        env:
          EVENT_NAME: "scheduled_cold_control"
        run: |
          set -o pipefail
          mkdir -p reports
          rm -rf .mypy_cache

          echo "Running full mypy strict gate on src/bioetl + src/memory... (COLD CONTROL)"
          echo "Event: $EVENT_NAME" | tee reports/mypy_strict.log

          set +e
          timeout --signal=TERM --kill-after=30s 30m \
            uv run --frozen --no-build mypy --config-file pyproject.toml --strict --no-incremental src/bioetl src/memory \
            2>&1 | tee -a reports/mypy_strict.log
          status=${PIPESTATUS[0]}
          set -e

          echo "$status" > reports/mypy_strict.exit_code

          if [ "$status" -eq 124 ]; then
            echo "mypy strict gate timed out after 30 minutes" | tee -a reports/mypy_strict.log
            exit 1
          fi

          exit "$status"

      - name: Verify Domain Type Policy
        run: |
          echo "Checking domain type policy (NewType, Protocol, Any)..."
          uv run --frozen --no-build python -m scripts.engineering.qa.check_domain_type_policy

      - name: Upload type checking reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ failure() && !cancelled() }}
        with:
          name: type-checking-reports
          path: |
            reports/mypy_strict.log
            reports/mypy_strict.exit_code
          if-no-files-found: warn
          retention-days: 3
