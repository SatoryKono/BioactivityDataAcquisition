name: Stage 0 phase profile
# Measurement-only workflow. No required-check context, selection or threshold changes.
# The product checkout is immutable and distinct from the instrumentation revision.
on:
  push:
    branches: [chore/stage0-ci-evidence-10417314508596451873]
    paths: [.github/workflows/stage0-phase-profile.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: stage0-phase-profile-${{ github.ref }}
  cancel-in-progress: false
jobs:
  profile:
    name: Stage 0 profile (${{ matrix.lane }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        lane: [fast-domain, fast-application, fast-infrastructure, fast-other, repo-tooling, repo-ops, repo-product, tooling-passport, tooling-debt, tooling-other]
    env:
      BIOETL_ARTIFACT_TEST_SELECTION: ci
      HYPOTHESIS_PROFILE: ci
      STAGE0_LANE: ${{ matrix.lane }}
      STAGE0_INSTRUMENTATION_SHA: ${{ github.sha }}
      STAGE0_RUN_ID: ${{ github.run_id }}
      STAGE0_RUN_ATTEMPT: ${{ github.run_attempt }}
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 36325dd83d1c6c0e600c2e46420620bade3221c5
          fetch-depth: 1
          persist-credentials: false
      - name: Set up historical Python and dependencies
        uses: SatoryKono/BioactivityDataAcquisition/.github/actions/setup-python-uv@36325dd83d1c6c0e600c2e46420620bade3221c5
        with:
          python-version: '3.12.15'
          dependency-profile: legacy
          uv-extras: 'dev tracing'
      - name: Measure original serial lane with passive plugin
        shell: bash
        run: |
          set -euo pipefail
          instrumentation="$(mktemp -d "$RUNNER_TEMP/stage0-phases-XXXXXXXX")"
          export STAGE0_INSTRUMENTATION_DIR="$instrumentation"
          cat > "$instrumentation/stage0_phase_plugin.py" <<'PY'
          """Passive pytest phase telemetry; no collection or result mutation."""
          from __future__ import annotations
          import json
          import os
          from pathlib import Path
          from time import perf_counter_ns
          import pytest
          _clock = perf_counter_ns
          _started = _clock()
          _collection_ns = 0
          _reports: list[dict[str, object]] = []
          _selected: list[str] = []
          _deselected: list[str] = []
          _fixtures: list[dict[str, object]] = []
          @pytest.hookimpl(hookwrapper=True)
          def pytest_collection(session: pytest.Session):
              global _collection_ns
              started = _clock()
              try:
                  yield
              finally:
                  _collection_ns += _clock() - started
          def pytest_collection_finish(session: pytest.Session) -> None:
              _selected.extend(item.nodeid for item in session.items)
          def pytest_deselected(items: list[pytest.Item]) -> None:
              _deselected.extend(item.nodeid for item in items)
          @pytest.hookimpl(hookwrapper=True)
          def pytest_fixture_setup(fixturedef, request):
              started = _clock()
              try:
                  yield
              finally:
                  _fixtures.append({'name': fixturedef.argname, 'scope': fixturedef.scope,
                                    'baseid': fixturedef.baseid, 'nodeid': request.node.nodeid,
                                    'duration_s': (_clock()-started)/1_000_000_000})
          def pytest_runtest_logreport(report: pytest.TestReport) -> None:
              _reports.append({'nodeid': report.nodeid, 'when': report.when,
                               'outcome': report.outcome, 'duration_s': report.duration})
          @pytest.hookimpl(trylast=True)
          def pytest_sessionfinish(session: pytest.Session, exitstatus: int) -> None:
              out = Path(os.environ['STAGE0_PHASE_OUTPUT'])
              out.parent.mkdir(parents=True, exist_ok=True)
              if out.exists():
                  raise RuntimeError('Refusing to overwrite phase evidence')
              data = {'pytest_version': pytest.__version__, 'exitstatus': int(exitstatus),
                      'collection_s': _collection_ns/1_000_000_000,
                      'plugin_lifetime_s': (_clock()-_started)/1_000_000_000,
                      'selected_nodeids': _selected, 'deselected_nodeids': _deselected,
                      'reports': _reports, 'fixture_setup_calls': _fixtures,
                      'phase_seconds': {phase: sum(float(row['duration_s']) for row in _reports
                                                  if row['when']==phase)
                                        for phase in ('setup','call','teardown')},
                      'scope_note': 'Setup/teardown include pytest hooks and fixtures. Fixture setup calls overlap setup-phase totals; do not add them together.'}
              out.write_text(json.dumps(data, ensure_ascii=False, indent=2), encoding='utf-8')
          PY
          python - <<'PY'
          import hashlib
          import json
          import os
          import shlex
          import subprocess
          import sys
          import time
          from datetime import datetime, timezone
          from pathlib import Path
          lane = os.environ['STAGE0_LANE']
          source = '36325dd83d1c6c0e600c2e46420620bade3221c5'
          actual = subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip()
          if actual != source:
              raise SystemExit('Unexpected source checkout')
          roots = {
              'fast-domain': ['tests/unit/domain/'],
              'fast-application': ['tests/unit/application/'],
              'fast-infrastructure': ['tests/unit/infrastructure/'],
              'fast-other': ['tests/unit/', '--ignore=tests/unit/domain/', '--ignore=tests/unit/application/', '--ignore=tests/unit/infrastructure/', '--ignore=tests/unit/scripts/', '--ignore=tests/unit/repo_backed/'],
              'repo-tooling': ['tests/unit/repo_backed/scripts/', 'tests/unit/repo_backed/tools/', '--ignore=tests/unit/repo_backed/scripts/ops/'],
              'repo-ops': ['tests/unit/repo_backed/scripts/ops/'],
              'repo-product': ['tests/unit/repo_backed/application/', 'tests/unit/repo_backed/composition/', 'tests/unit/repo_backed/contracts/', 'tests/unit/repo_backed/coverage_gap/', 'tests/unit/repo_backed/domain/', 'tests/unit/repo_backed/infrastructure/', 'tests/unit/repo_backed/interfaces/'],
              'tooling-passport': ['tests/unit/scripts/docs/passports/'],
              'tooling-debt': ['tests/unit/scripts/qa/test_report_debt_governance_gates.py'],
              'tooling-other': ['tests/unit/scripts/', '--ignore=tests/unit/scripts/docs/passports/', '--ignore=tests/unit/scripts/qa/test_report_debt_governance_gates.py'],
          }
          marker = 'not slow and not benchmark and not memory'
          if lane.startswith('fast-'):
              marker = 'not fs_contract and not repo_backed and not subprocess_backed and ' + marker
          elif lane.startswith('repo-'):
              marker = 'repo_backed and ' + marker
          out = Path('reports/stage0-phases') / lane
          out.mkdir(parents=True, exist_ok=False)
          env = os.environ.copy()
          env['HYPOTHESIS_PROFILE'] = 'fast' if lane.startswith('fast-') else 'ci'
          env['STAGE0_PHASE_OUTPUT'] = str((out/'phases.json').resolve())
          env['PYTHONPATH'] = os.environ['STAGE0_INSTRUMENTATION_DIR'] + os.pathsep + env.get('PYTHONPATH','')
          command = ['uv','run','--frozen','--no-build','pytest',*roots[lane],'-m',marker,
                     '-p','no:xdist','-p','stage0_phase_plugin','-q','--tb=short',
                     '--junitxml='+str(out/'junit.xml')]
          if not lane.startswith('fast-'):
              command += ['--cov=src/bioetl','--cov-report=']
          started = datetime.now(timezone.utc).isoformat()
          tick = time.perf_counter()
          with (out/'stdout.log').open('w',encoding='utf-8') as stdout, (out/'stderr.log').open('w',encoding='utf-8') as stderr:
              result = subprocess.run(command,env=env,stdout=stdout,stderr=stderr,check=False)
          report = {'source_sha':actual, 'instrumentation_sha':os.environ['STAGE0_INSTRUMENTATION_SHA'],
                    'run_id':os.environ['STAGE0_RUN_ID'], 'run_attempt':os.environ['STAGE0_RUN_ATTEMPT'],
                    'lane':lane, 'command':command, 'command_display':shlex.join(command),
                    'started_at':started, 'ended_at':datetime.now(timezone.utc).isoformat(),
                    'elapsed_s':time.perf_counter()-tick, 'returncode':result.returncode,
                    'hypothesis_profile':env['HYPOTHESIS_PROFILE'], 'coverage_expected':not lane.startswith('fast-'),
                    'input_sha256':{p:hashlib.sha256(Path(p).read_bytes()).hexdigest()
                                    for p in ['uv.lock','pyproject.toml','configs/quality/test_matrix.yaml']}}
          for path in [out/'phases.json',out/'junit.xml',out/'stdout.log',out/'stderr.log']:
              report.setdefault('outputs',[]).append({'path':str(path), 'present':path.is_file(),
                  'sha256':hashlib.sha256(path.read_bytes()).hexdigest() if path.is_file() else None})
          (out/'execution.json').write_text(json.dumps(report,indent=2),encoding='utf-8')
          print(json.dumps({'lane':lane,'returncode':result.returncode,'elapsed_s':report['elapsed_s']}))
          missing = not (out/'phases.json').is_file() or not (out/'junit.xml').is_file()
          coverage_missing = not lane.startswith('fast-') and (not Path('.coverage').is_file() or Path('.coverage').stat().st_size==0)
          raise SystemExit(result.returncode if result.returncode else (1 if missing or coverage_missing else 0))
          PY
      - name: Preserve phase evidence including failed tests
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: stage0-phases-${{ matrix.lane }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/stage0-phases/${{ matrix.lane }}/
          if-no-files-found: error
          retention-days: 7
