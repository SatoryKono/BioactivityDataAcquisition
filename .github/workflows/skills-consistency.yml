name: Skills Consistency

permissions:
  contents: read

on:
  push:
    branches: [ main ]
    paths:
      - ".codex/skills/**"
      - "docs/00-project/ai/skills/local/**"
      - "docs/00-project/ai/skills/global/**"
      - "docs/00-project/ai/skills/README.md"
      - "docs/00-project/ai/skills/SKILLS-CATALOG.md"
      - "scripts/check_skills_mirror.sh"
      - "scripts/check_ai_skills_layout.sh"
      - ".github/workflows/skills-consistency.yml"
  pull_request:
    branches: [ main ]
    paths:
      - ".codex/skills/**"
      - "docs/00-project/ai/skills/local/**"
      - "docs/00-project/ai/skills/global/**"
      - "docs/00-project/ai/skills/README.md"
      - "docs/00-project/ai/skills/SKILLS-CATALOG.md"
      - "scripts/check_skills_mirror.sh"
      - "scripts/check_ai_skills_layout.sh"
      - ".github/workflows/skills-consistency.yml"

jobs:
  verify-local-skills-mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify docs/00-project/ai/skills/local mirror
        run: bash scripts/check_skills_mirror.sh --check

      - name: Verify ai/skills canonical layout
        run: bash scripts/check_ai_skills_layout.sh
