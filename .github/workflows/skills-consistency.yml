name: Skills Consistency
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

on:
  push:
    paths:
      - "AGENTS.md"
      - ".codex/**"
      - ".junie/**"
      - ".devin/**"
      - ".opencode/**"
      - ".mcp.json"
      - "scripts/ai/**"
      - "scripts/ops/runtime/mcp/**"
      - "scripts/ops/support/load_repo_env.sh"
      - "scripts/ops/support/skills/**"
      - "scripts/engineering/common/**"
      - "src/memory/**"
      - "docs/00-project/ai/**"
      - ".github/workflows/skills-consistency.yml"
      - "tests/architecture/test_codex_native_runtime.py"
      - "tests/architecture/test_junie_runtime_ci_contract.py"
      - "tests/architecture/test_mcp_token_configuration.py"
      - "tests/unit/repo_backed/scripts/ai/**"
      - "tests/unit/scripts/test_setup_copilot_codex_mcp.py"
  pull_request:
    paths:
      - "AGENTS.md"
      - ".codex/**"
      - ".junie/**"
      - ".devin/**"
      - ".opencode/**"
      - ".mcp.json"
      - "scripts/ai/**"
      - "scripts/ops/runtime/mcp/**"
      - "scripts/ops/support/load_repo_env.sh"
      - "scripts/ops/support/skills/**"
      - "scripts/engineering/common/**"
      - "src/memory/**"
      - "docs/00-project/ai/**"
      - ".github/workflows/skills-consistency.yml"
      - "tests/architecture/test_codex_native_runtime.py"
      - "tests/architecture/test_junie_runtime_ci_contract.py"
      - "tests/architecture/test_mcp_token_configuration.py"
      - "tests/unit/repo_backed/scripts/ai/**"
      - "tests/unit/scripts/test_setup_copilot_codex_mcp.py"
  workflow_dispatch:
    inputs:
      closeout_task_id:
        description: "Public task identity for source-bound closeout receipts"
        required: false
        default: ""
        type: string
      approve_runtime_sync:
        description: "Approve one-way Codex to Junie/Devin skill synchronization"
        required: true
        default: false
        type: boolean

jobs:
  verify-public-fetch-linux:
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up isolated Fetch Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install canonical uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.11.26"

      - name: Install pinned Linux Fetch and preserve runtime identity
        shell: bash
        env:
          HOME: ${{ runner.temp }}/public-fetch-contract-home
        run: |
          set -euo pipefail
          bash scripts/ai/mcp/setup_public_fetch.sh
          fingerprint="$(sha256sum scripts/ai/mcp/support/public-fetch-requirements.txt)"
          fingerprint="${fingerprint%% *}"
          runtime="$HOME/.local/share/bioetl/public-fetch-v1/$fingerprint/bin/python"
          "$runtime" -I -S -B scripts/ai/mcp/support/public_fetch_runtime.py \
            --emit-profile "$RUNNER_TEMP/public-fetch-profile.json"
          "$runtime" -I -S -B -c 'import json,sys,platform; print(json.dumps({"python":sys.version,"platform":platform.system()}))' \
            > "$RUNNER_TEMP/public-fetch-runtime.json"
          sha256sum scripts/ai/mcp/support/public-fetch-requirements.txt \
            scripts/ai/mcp/support/public_fetch_stdio.py \
            scripts/ai/mcp/support/public_fetch_transport.py \
            scripts/ai/mcp/support/public_fetch_runtime.py \
            scripts/ai/mcp/support/public-fetch-runtime-profiles.json \
            tests/unit/repo_backed/scripts/ai/mcp/test_public_fetch.py \
            > "$RUNNER_TEMP/public-fetch-inputs.sha256"

      - name: Exercise isolated Linux transport and SDK without live destinations
        shell: bash
        env:
          HOME: ${{ runner.temp }}/public-fetch-contract-home
        run: |
          set -euo pipefail
          fingerprint="$(sha256sum scripts/ai/mcp/support/public-fetch-requirements.txt)"
          fingerprint="${fingerprint%% *}"
          runtime="$HOME/.local/share/bioetl/public-fetch-v1/$fingerprint/bin/python"
          "$runtime" -I -S -B tests/unit/repo_backed/scripts/ai/mcp/test_public_fetch.py \
            2>&1 | tee "$RUNNER_TEMP/public-fetch-probes.log"

      - name: Preserve Linux Fetch qualification originals
        if: always() && !cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: public-fetch-linux-qualification-${{ matrix.runner }}
          path: |
            ${{ runner.temp }}/public-fetch-probes.log
            ${{ runner.temp }}/public-fetch-runtime.json
            ${{ runner.temp }}/public-fetch-inputs.sha256
            ${{ runner.temp }}/public-fetch-profile.json
          retention-days: 7

  verify-native-codex-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Prepare explicit manual closeout environment
        if: github.event_name == 'workflow_dispatch' && !inputs.approve_runtime_sync
        uses: ./.github/actions/setup-python-uv
        with:
          python-version: "3.12"

      - name: Verify static native discovery and MCP matrices
        run: python3 scripts/ai/codex/doctor.py static --no-write

      - name: Verify catalog-driven MCP wrapper pairs
        run: python3 -m scripts.ai.mcp wrappers check

      - name: Capture source-bound runtime closeout
        if: github.event_name == 'workflow_dispatch' && !inputs.approve_runtime_sync
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
          PROOF_CLOSEOUT_TASK_ID: ${{ inputs.closeout_task_id }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          run_id="ai-runtime-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          task_id="${PROOF_CLOSEOUT_TASK_ID:-ai-runtime-${GITHUB_RUN_ID}}"
          if [[ ! "$task_id" =~ ^[A-Za-z0-9][A-Za-z0-9_.-]{0,95}$ ]]; then
            echo "Invalid public closeout task identity" >&2
            exit 64
          fi
          run_dir="reports/quality/proof-or-stop/${run_id}"
          mkdir -p "$run_dir"
          proof=(uv run --frozen --no-build --no-sync python -m scripts.engineering.qa proof-or-stop)
          common=(--run-id "$run_id" --task-id "$task_id" --claim done --ci-run-id "$GITHUB_RUN_ID")
          "${proof[@]}" plan "${common[@]}"
          capture() {
            local receipt_id="$1" producer="$2" kind="$3"
            shift 3
            local started start_ns duration rc=0 state=pass
            local -a argv=()
            started="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            start_ns="$(date +%s%N)"
            if uv run --frozen --no-build --no-sync "$@" >"$run_dir/$receipt_id.log" 2>&1; then
              rc=0
            else
              rc=$?
              state=fail
            fi
            duration=$(( ($(date +%s%N) - start_ns) / 1000000 ))
            for arg in "$@"; do argv+=("--argv=$arg"); done
            "${proof[@]}" receipt "${common[@]}" --trust-tier ci \
              --receipt-id "$receipt_id" --producer "$producer" --evidence-kind "$kind" \
              --command "$*" "${argv[@]}" --started-at "$started" --duration-ms "$duration" \
              --status "$state" --exit-code "$rc" --output-artifact "$run_dir/$receipt_id.log"
          }
          capture tests test_health tests python -m pytest \
            tests/architecture/test_codex_native_runtime.py \
            tests/architecture/test_runtime_agent_docs_drift.py \
            tests/architecture/test_junie_runtime_ci_contract.py \
            tests/architecture/test_dev_setup_copilot_codex_mcp_consolidation.py \
            tests/architecture/test_runtime_orchestration_surfaces.py \
            tests/unit/scripts/engineering/ci/test_pr_lane_results.py::test_shadow_compare_routes_devin_permission_configuration \
            tests/unit/scripts/engineering/ci/test_pr_lane_results.py::test_shadow_compare_routes_guardrail_checker_contract \
            tests/unit/scripts/test_hook_inventory.py tests/unit/scripts/test_mcp_routes.py \
            tests/unit/scripts/test_parallel_precommit.py \
            tests/unit/scripts/test_coalesced_precommit.py \
            tests/unit/scripts/test_partitioned_diff.py \
            tests/unit/scripts/test_owned_guard_execution.py \
            tests/unit/scripts/test_readonly_message.py \
            tests/unit/scripts/test_offline_precommit.py \
            tests/unit/scripts/test_hook_installation.py \
            tests/unit/scripts/repo/test_hook_receipts.py \
            tests/unit/scripts/repo/test_check_no_partial_tree.py \
            tests/unit/scripts/repo/test_process_deadline.py \
            -q --no-cov \
            --junitxml="$run_dir/tests.xml"
          capture governance pretest_guardrails governance bash scripts/engineering/dev/pretest_guardrails.sh \
            --mode check --scope light --skip-cleanup --skip-memory --skip-architecture \
            --report-json "$run_dir/governance.json"
          capture docs docs_runtime_checks docs_runtime python -m scripts.docs check-links
          capture debt debt_governance_gates debt python -m scripts.engineering.qa \
            report-debt-governance-gates --source-only --check --changed-from-ref origin/main
          "${proof[@]}" assemble "${common[@]}" --trust-tier ci --actor github-actions --runtime github-actions \
            --receipt "$run_dir/receipts/tests.json" --receipt "$run_dir/receipts/governance.json" \
            --receipt "$run_dir/receipts/docs.json" --receipt "$run_dir/receipts/debt.json"
          "${proof[@]}" verify --bundle "$run_dir/bundle.json"

      - name: Upload explicit manual closeout evidence
        if: always() && !cancelled() && github.event_name == 'workflow_dispatch' && !inputs.approve_runtime_sync
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ai-runtime-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/quality/proof-or-stop/ai-runtime-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
          retention-days: 3

  detect-runtime-skill-drift:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate runtime skill drift report
        run: >-
          python -m scripts.ai.sync.runtime_skills
          --mode check
          --report reports/ai/runtime-skill-drift.json

      - name: Upload drift report
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-skill-drift
          path: reports/ai/runtime-skill-drift.json
          retention-days: 3

  approved-runtime-skill-sync:
    if: github.event_name == 'workflow_dispatch' && inputs.approve_runtime_sync
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run approved one-way runtime skill sync
        run: >-
          python -m scripts.ai.sync.runtime_skills
          --mode sync
          --approved
          --report reports/ai/runtime-skill-sync.json

      - name: Capture owner-reviewed sync patch
        run: git diff --binary > runtime-skill-sync.patch

      - name: Upload sync report and patch
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-skill-sync
          path: |
            reports/ai/runtime-skill-sync.json
            runtime-skill-sync.patch
          retention-days: 3

  verify-codex-junie-runtime-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify Codex–Junie runtime parity
        run: bash scripts/ai/junie/check_junie_mirror.sh --check

  verify-local-skills-mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify docs mirror and Codex-Devin parity
        run: bash scripts/ops/support/skills/check_skills_mirror.sh --check

      - name: Verify ai/skills canonical layout
        run: bash scripts/ops/support/skills/check_ai_skills_layout.sh
