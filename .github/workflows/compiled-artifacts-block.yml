name: Block Compiled Python Artifacts

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.ai/**'
      - '.github/workflows/**'
      - 'LICENSE'
  push:
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.ai/**'
      - '.github/workflows/**'
      - 'LICENSE'

jobs:
  no-pyc-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Python + uv
        uses: ./.github/actions/setup-python-uv
        with:
          python-version: "3.13"
          uv-extras: "dev"

      - name: Fail if *.pyc or __pycache__ exists
        run: |
          set -e
          FOUND=$(find . -type d \( -name .venv -o -name .git \) -prune -o \( -name "*.pyc" -o -name "__pycache__" \) -print | head -n 1 || true)
          if [ -n "$FOUND" ]; then
            echo "Found compiled artifacts: $FOUND"
            exit 1
          fi
          echo "No compiled artifacts found"

      - name: Validate root-level allowlist
        run: uv run --frozen --no-build python -m scripts.engineering.repo check-cleanliness
