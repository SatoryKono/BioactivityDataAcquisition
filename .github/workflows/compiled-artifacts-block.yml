name: Block Compiled Python Artifacts
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.ai/**'
      - '.claude/**'
      - '.github/workflows/**'
      - 'LICENSE'
  push:
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.ai/**'
      - '.claude/**'
      - '.github/workflows/**'
      - 'LICENSE'

jobs:
  no-pyc-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fail if *.pyc or __pycache__ exists
        run: |
          set -e
          FOUND=$(find . \( -name "*.pyc" -o -name "__pycache__" \) -print | head -n 1 || true)
          if [ -n "$FOUND" ]; then
            echo "Found compiled artifacts: $FOUND"
            exit 1
          fi
          echo "No compiled artifacts found"

      - name: Validate root-level allowlist
        run: python scripts/engineering/repo/audit_root_cleanliness.py
