name: Memory freshness

on:
  pull_request:
    paths:
      - "src/memory/**"
      - "docs/00-project/ai/memory/**"
      - ".github/workflows/memory-freshness.yml"
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
      - name: Check repository memory freshness
        id: freshness
        run: uv run python -m memory.tooling.check_freshness --json
      - name: Create or update curated-memory review issue
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="[AI-MEM][P2] Review stale curated memory"
          existing="$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')"
          body="$(uv run python -m memory.tooling.review_curated --json || true)"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Scheduled freshness gate still fails.\n\n\`\`\`json\n${body}\n\`\`\`"
          else
            gh issue create --title "$title" --body "Scheduled freshness gate found stale curated memory.\n\n\`\`\`json\n${body}\n\`\`\`"
          fi
      - name: Test freshness contracts
        run: uv run pytest tests/unit/memory/test_check_freshness.py -q
