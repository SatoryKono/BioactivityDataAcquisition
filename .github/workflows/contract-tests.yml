name: Monthly Contract Tests
# KEEP-DISABLED (#11190): Actions billing will not return. Do not re-enable.
# Live API contract runs stay local. workflow_dispatch is not a substitute.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Runs monthly to verify API contracts haven't changed
# Also allows manual triggering for ad-hoc verification

on:
  # schedule removed (#11190). A monthly cron would spend minutes if the
  # workflow were enabled again.
  workflow_dispatch:
    inputs:
      providers:
        description: 'Providers to test (comma-separated, or "all")'
        required: false
        default: 'all'
        type: string
      skip_slow:
        description: 'Skip slow/rate-limited tests'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.13"
  # Contract tests require network access
  BIOETL_LIVE_API_TESTS: "true"
  BIOETL_NETWORK_TESTS: "true"

jobs:
  contract-tests:
    name: Live API Contract Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write

    # Only run on main repository, not forks
    if: github.repository == 'SatoryKono/BioactivityDataAcquisition'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          persist-credentials: false

      - name: Setup Python + uv
        uses: ./.github/actions/setup-python-uv
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          uv-extras: "tests"

      - name: Run Contract Tests
        id: contract_tests
        continue-on-error: true
        env:
          PROVIDERS: ${{ github.event.inputs.providers || 'all' }}
          SKIP_SLOW: ${{ github.event.inputs.skip_slow || 'false' }}
          # API keys from secrets (optional - tests should work without them but with rate limits)
          BIOETL_CHEMBL_API_KEY: ${{ secrets.CHEMBL_API_KEY }}
          BIOETL_PUBMED_API_KEY: ${{ secrets.PUBMED_API_KEY }}
          BIOETL_UNIPROT_API_KEY: ${{ secrets.UNIPROT_API_KEY }}
        run: |
          # Build pytest arguments
          # -k is one argv element (#11191).
          args=(tests/contract/ -v --tb=short --network)

          if [ "$PROVIDERS" != "all" ]; then
            k_expr="${PROVIDERS//,/ or }"
            args+=(-k "$k_expr")
          fi

          if [ "$SKIP_SLOW" = "true" ]; then
            args+=(-m "not slow")
          fi

          # Preserve pytest's exact exit code while allowing diagnostics and
          # failure notification to run before the job fails closed.
          mkdir -p reports/junit
          set +e
          uv run --frozen --no-build pytest "${args[@]}" --junit-xml=reports/junit/contract-results.xml
          pytest_rc=$?
          set -e
          echo "pytest_rc=$pytest_rc" >> "$GITHUB_OUTPUT"
          exit "$pytest_rc"

      - name: Upload Test Results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() && !cancelled() }}
        with:
          name: contract-test-results
          path: reports/junit/contract-results.xml
          retention-days: 30

      - name: Create Issue on Failure
        if: always() && steps.contract_tests.outcome == 'failure'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const today = new Date().toISOString().split('T')[0];
            const title = `Contract Test Failure - ${today}`;

            // Check if issue already exists
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'contract-failure'
            });

            const existingIssue = issues.data.find(i => i.title.includes('Contract Test Failure'));

            if (!existingIssue) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: `## Contract Test Failure

            The monthly contract tests have detected API changes or failures.

            **Run:** ${context.runId}
            **Workflow:** ${context.workflow}
            **Date:** ${today}

            ### Action Required

            1. Review the [workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})
            2. Identify which provider APIs have changed
            3. Update adapters and/or provider contract snapshots as needed
            4. Re-run tests to verify fix
            5. Follow the testing runbook in \`docs/03-guides/testing.md\`

            ### Common Causes

            - API endpoint URL changes
            - Response schema modifications
            - New required fields
            - Authentication changes
            - Rate limiting updates

            See \`docs/03-guides/testing.md\` for the contract test runbook and policy guidance.`,
                labels: ['contract-failure', 'api-change', 'automated']
              });
            }

      - name: Enforce Contract Test Result
        if: always() && steps.contract_tests.outcome == 'failure'
        env:
          PYTEST_RC: ${{ steps.contract_tests.outputs.pytest_rc }}
        run: |
          case "$PYTEST_RC" in
            ''|*[!0-9]*) exit 1 ;;
            *) exit "$PYTEST_RC" ;;
          esac

  notify-success:
    name: Notify on Success
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: contract-tests
    if: needs.contract-tests.result == 'success'
    permissions:
      contents: read

    steps:
      - name: Log Success
        run: |
          echo "::notice::Monthly contract tests passed successfully"
          echo "All provider API contracts verified on $(date -u +%Y-%m-%d)"
