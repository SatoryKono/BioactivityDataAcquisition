name: Codex temporary coverage inventory diff

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  coverage-inventory-diff:
    if: github.event.pull_request.number == 10021 && github.event.pull_request.head.ref == 'fix/main-ci-after-10018-20260903'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Download SHA-bound coverage inventory candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 33720135986 --repo "${{ github.repository }}" --name coverage-report --dir "${{ runner.temp }}/coverage-report"

      - name: Report compact semantic diff
        env:
          CANDIDATE_ROOT: ${{ runner.temp }}/coverage-report
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          baseline = json.loads(Path("reports/quality/module-coverage-inventory.json").read_text(encoding="utf-8"))
          candidates = list(Path(os.environ["CANDIDATE_ROOT"]).rglob("module-coverage-inventory.candidate.json"))
          if len(candidates) != 1:
              raise SystemExit(f"expected one candidate, found {len(candidates)}")
          candidate = json.loads(candidates[0].read_text(encoding="utf-8"))
          changes = []

          def visit(old, new, path="$"):
              if path == "$.coverage_xml_sha256":
                  return
              if type(old) is not type(new):
                  changes.append({"path": path, "old": old, "new": new})
              elif isinstance(old, dict):
                  for key in sorted(set(old) | set(new)):
                      child = f"{path}.{key}"
                      if key not in old:
                          changes.append({"path": child, "old": "<missing>", "new": new[key]})
                      elif key not in new:
                          changes.append({"path": child, "old": old[key], "new": "<missing>"})
                      else:
                          visit(old[key], new[key], child)
              elif isinstance(old, list):
                  if len(old) != len(new):
                      changes.append({"path": f"{path}.length", "old": len(old), "new": len(new)})
                  for index, (old_item, new_item) in enumerate(zip(old, new, strict=False)):
                      visit(old_item, new_item, f"{path}[{index}]")
              elif old != new:
                  changes.append({"path": path, "old": old, "new": new})

          visit(baseline, candidate)
          print(json.dumps({"change_count": len(changes), "changes": changes}, ensure_ascii=False, indent=2))
          PY
