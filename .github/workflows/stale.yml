name: Stale
# KEEP-DISABLED (#10263): 14/7 PR stale/close contradicts
# `.github/PULL_REQUEST_HYGIENE.md` (21 days, draft + report-noise only).
# Do not re-enable until days/exemptions match that policy. Do not weaken
# stale to close non-draft engineering PRs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  # schedule removed (#11234). Cron must not spend minutes while billing is off.
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ false }}
    steps:
      - uses: actions/stale@1e223db275d687790206a7acac4d1a11bd6fe629 # v10.4.0
        with:
          stale-pr-message: >
            This PR has been inactive for 14 days and is now marked as stale.
            It will be automatically closed in 7 days unless there is new activity.
          close-pr-message: "Closed due to inactivity. Feel free to reopen if still relevant."
          stale-issue-message: >
            This issue has been inactive for 30 days and is now marked as stale.
            It will be automatically closed in 14 days unless there is new activity.
          close-issue-message: "Closed due to inactivity. Feel free to reopen if still relevant."
          days-before-pr-stale: 14
          days-before-pr-close: 7
          days-before-issue-stale: 30
          days-before-issue-close: 14
          stale-pr-label: "stale"
          stale-issue-label: "stale"
          exempt-pr-labels: "pinned,work-in-progress"
          exempt-issue-labels: "pinned,work-in-progress"
