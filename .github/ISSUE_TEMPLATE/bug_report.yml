name: Bug Report
description: Report a bug in BioETL
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened?
      placeholder: Describe the bug...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we reproduce this?
      placeholder: |
        1. Run `bioetl run --pipeline ...`
        2. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened?
    validations:
      required: true

  - type: dropdown
    id: layer
    attributes:
      label: Affected layer
      options:
        - Domain
        - Application
        - Infrastructure
        - Composition
        - Interfaces / CLI
        - Config / Pipeline
        - Unknown
    validations:
      required: true

  - type: dropdown
    id: provider
    attributes:
      label: Provider (if applicable)
      options:
        - ChEMBL
        - PubChem
        - UniProt
        - PubMed
        - CrossRef
        - OpenAlex
        - Semantic Scholar
        - Composite
        - N/A

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste any error output or logs
      render: shell
