name: Retention-Sensitive Cleanup Proposal
description: Propose bounded cleanup for replay, fixture, report, archive, or data surfaces
labels: ["cleanup", "guardrails"]
body:
  - type: markdown
    attributes:
      value: |
        Use this template before proposing cleanup under `data/**`, `data/output/control/**`, `data/output/checkpoints/**`, `tests/fixtures/**`, `tests/fixtures/vcr/**`, `reports/**`, `docs/reports/**`, or `docs/99-archive/**`.

        Required procedure: [Retention-Sensitive Cleanup Runbook](../../docs/05-operations/runbooks/retention-sensitive-cleanup.md).

  - type: dropdown
    id: surface
    attributes:
      label: Cleanup surface
      description: Select the primary surface touched by this proposal.
      options:
        - data/**
        - data/output/control/**
        - data/output/checkpoints/**
        - data/output/bronze/**
        - tests/fixtures/**
        - tests/fixtures/vcr/**
        - reports/**
        - docs/reports/**
        - docs/99-archive/**
        - Other retention-sensitive path
    validations:
      required: true

  - type: textarea
    id: candidate_inventory
    attributes:
      label: Candidate inventory
      description: Paste the exact candidate paths from dry-run/inventory commands.
      render: text
      placeholder: |
        git status --short
        git ls-files <target-path>
        find <target-path> -maxdepth 3 -type f | sort
    validations:
      required: true

  - type: textarea
    id: classification_table
    attributes:
      label: Classification table
      description: Classify every candidate as SAFE, REVIEW_REQUIRED, or BLOCKED with the owning surface and retention reason.
      render: markdown
      placeholder: |
        | Path | Tracked/local | Surface | Classification | Retention reason | Proposed action |
        | --- | --- | --- | --- | --- | --- |
    validations:
      required: true

  - type: textarea
    id: dry_run_evidence
    attributes:
      label: Dry-run evidence
      description: Paste or link deterministic dry-run output.
      render: shell
      placeholder: |
        python -m scripts.ops.support.repo.cleanup_repository --dry-run --report-json reports/quality/root-hygiene-cleanup-classification.json
        bioetl maintenance control-plane-lifecycle --retention-days 90
    validations:
      required: true

  - type: textarea
    id: reviewed_apply_list
    attributes:
      label: Reviewed apply/delete list
      description: Exact paths proposed for deletion or archival after review. Use N/A if this is classification-only.
      render: text
    validations:
      required: true

  - type: textarea
    id: verification
    attributes:
      label: Verification output
      description: Commands that prove replay/test/docs/root hygiene remain valid after the proposed cleanup.
      render: shell
      placeholder: |
        python scripts/engineering/repo/audit_root_cleanliness.py --strict-untracked
        python -m scripts.engineering.diagnostics audit-structure --path .
    validations:
      required: true

  - type: textarea
    id: rollback
    attributes:
      label: Rollback or restore path
      description: Explain how each deleted/archived item can be restored.
    validations:
      required: true

  - type: checkboxes
    id: safety_checks
    attributes:
      label: Safety checks
      options:
        - label: No broad deletion command is proposed.
          required: true
        - label: No retained manifest, ledger, effective-config artifact, lineage fragment, checkpoint, or referenced Bronze snapshot is deleted without lifecycle evidence.
          required: true
        - label: No governed fixture or VCR cassette is deleted without owner review and targeted test verification.
          required: true
        - label: Curated evidence in `docs/reports/**` and history in `docs/99-archive/**` are preserved unless duplicate/corrupt with proof.
          required: true
