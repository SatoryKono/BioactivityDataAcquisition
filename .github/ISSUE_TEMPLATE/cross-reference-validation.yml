body:
  - type: markdown
    attributes:
      value: |
        ## Summary

        Реализовать автоматическую проверку, что все ссылки в документации проекта работают: внутренние ссылки между документами, ссылки на файлы кода, якоря внутри страниц, и внешние URL. Битые ссылки — одна из главных причин фрустрации при навигации по документации и один из самых распространённых видов «технического долга документации».

        ## Типы ссылок для проверки

        | Тип | Пример | Проверка |
        |-----|--------|----------|
        | **Internal document links** | `[see ADR-005](../adr/005-etl-strategy.md)` | Файл существует? Путь корректен относительно текущего файла? |
        | **Anchor links** | `[error handling](#error-handling-strategy)` | Заголовок с таким якорем существует в целевом документе? |
        | **Code references** | `[DiseaseTransformer](../../src/bioetl/transformers/disease.py)` | Файл существует? Если ссылка на строку (`#L42`) — строка в допустимом диапазоне? |
        | **Image references** | `![diagram](./images/architecture.png)` | Файл изображения существует? |
        | **External URLs** | `[ChEMBL API](https://www.ebi.ac.uk/chembl/api/data/)` | URL отвечает 200? (только weekly, с кэшированием) |
        | **Cross-format references** | Ссылки из docstrings в коде на markdown-документы и наоборот | Двусторонняя проверка |

        ## Инструмент

        Custom Python-скрипт `scripts/validate_cross_references.py`, построенный на:

        - **markdown-it-py** или **mistune** — парсинг markdown, извлечение ссылок
        - **pathlib** — проверка существования файлов
        - **httpx** — проверка внешних URL (async для параллелизма)
        - **ast** — извлечение ссылок из Python docstrings

        ## Алгоритм

        1. Сканирование всех `.md` файлов в `docs/` и README-файлов в корне
        2. Извлечение всех ссылок с контекстом (файл-источник, строка, текст ссылки)
        3. Классификация ссылок по типу
        4. Проверка каждой ссылки:
           - **Internal**: resolve relative path, check `os.path.exists()`
           - **Anchor**: parse target document, extract headings, normalize to slug, compare
           - **Code**: check file exists, optionally check line number range
           - **Image**: check file exists, optionally check file is valid image
           - **External**: HEAD request with timeout, retry, cache
        5. Формирование отчёта

        ## Формат отчёта

        ```
        ## Cross-Reference Validation Report

        ### Broken Links (5 found)
        | Source | Line | Link | Type | Error |
        |--------|------|------|------|-------|
        | docs/adr/005.md | 23 | ../api/old-api.md | internal | File not found |
        | docs/guide/setup.md | 45 | #instalation | anchor | Heading not found (did you mean #installation?) |
        | README.md | 12 | https://old-domain.com/api | external | 404 Not Found |

        ### Warnings (2 found)
        | Source | Line | Link | Warning |
        |--------|------|------|---------|
        | docs/api/extractors.md | 67 | ../../src/bioetl/extract.py#L150 | Line 150 exceeds file length (file has 120 lines) |
        | docs/guide/deploy.md | 30 | https://example.com/slow | Timeout (5s), may be temporarily down |
        ```

        ## Fuzzy Matching

        Для broken anchor links скрипт предлагает исправления. Если ссылка `#instalation` не найдена, но есть `#installation` — предлагает fix. Используется `difflib.get_close_matches()`.

        ## Auto-fix Mode

        Флаг `--fix` для автоматического исправления простых проблем:
        - Обновление путей при переименовании файлов (на основе git history)
        - Исправление anchor typos (если fuzzy match confidence > 90%)
        - Удаление ссылок на удалённые файлы (с маркером `[BROKEN]`)

        ## CI-интеграция

        | Режим | Триггер | Scope | Время | Блокирует merge? |
        |-------|---------|-------|-------|-------------------|
        | **Fast** | Каждый PR | Только internal links и anchors | < 30с | Да |
        | **Full** | Weekly cron | Все типы включая external URLs | 2-5 мин | Нет (создаёт Issue) |

        Fast-режим блокирует merge при broken internal links. Full-режим создаёт Issue для broken external links (не блокирует, т.к. внешние сайты могут временно не работать).

        ## Pre-commit Hook

        Опциональный pre-commit hook для локальной проверки ссылок в изменённых файлах. Быстрый (проверяет только diff), даёт немедленную обратную связь автору.

        ## Acceptance Criteria

        - [ ] Скрипт `scripts/validate_cross_references.py` реализован и покрыт тестами
        - [ ] Поддержаны все 6 типов ссылок
        - [ ] Fuzzy matching для anchor typos работает
        - [ ] `--fix` mode исправляет простые проблемы
        - [ ] CI workflow для fast-режима (PR)
        - [ ] CI workflow для full-режима (weekly cron)
        - [ ] Pre-commit hook конфигурация
        - [ ] Документация по использованию
        - [ ] Coverage ≥ 85%
