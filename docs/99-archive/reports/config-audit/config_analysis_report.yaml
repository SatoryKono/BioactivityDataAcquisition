    column_schema_reference:
      issue: "Two different keys used for column schema files"
      column_groups_file:
        count: 14
        used_by: "Most ChEMBL configs, pubchem, uniprot"
      data_schema_file:
        count: 6
        used_by: "Publication-related configs"
      resolution: "Both work - data_schema_file preferred for new configs"
      severity: LOW

    version_variations:
