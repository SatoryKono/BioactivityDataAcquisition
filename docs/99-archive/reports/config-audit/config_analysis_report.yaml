        - "No explicit sink paths"
        - "No explicit dq_config_file"
        - "Has column_groups_file reference at top"
      verdict: VALID_PER_ADR-029

    explicit_full:
      description: "All paths explicitly defined despite convention support"
      count: 14
      example_files:
        - configs/pipelines/chembl/molecule.yaml
        - configs/pipelines/chembl/target.yaml
        - configs/pipelines/pubchem/compound.yaml
      characteristics:
        - "Explicit source_file"
        - "Explicit dq_config_file"
        - "Explicit sink.*.path for all layers"
        - "Explicit sink.silver.primary_key"
      verdict: VALID_BUT_REDUNDANT

    mixed_explicit:
      description: "Partial explicit config"
      count: 2
      files:
        - configs/pipelines/pubmed/publication.yaml
        - configs/pipelines/uniprot/idmapping.yaml
      characteristics:
        - "Has explicit sink.*.path"
        - "No explicit primary_key/sort_by (uses convention)"
      verdict: VALID_HYBRID

