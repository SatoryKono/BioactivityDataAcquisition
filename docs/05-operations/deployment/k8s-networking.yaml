# UNSUPPORTED EXPERIMENT — NOT A BIOETL DEPLOYMENT PROFILE.
# ADR-010 supports Local-Only, single-instance execution only. This manifest is
# retained as research material; it is not release-qualified or covered by
# BioETL incident procedures. Do not apply it as an installation/bootstrap step.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bioetl-ingress
  namespace: default
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"  # Requires cert-manager setup
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx  # Use your ingress controller
  tls:
  - hosts:
    - bioetl.example.com
    - grafana.example.com
    secretName: bioetl-tls

  rules:
  - host: bioetl.example.com
    http:
      paths:
      - path: /metrics
        pathType: Prefix
        backend:
          service:
            name: bioetl
            port:
              number: 8000

  - host: grafana.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: grafana
            port:
              number: 3000
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: bioetl-pdb
  namespace: default
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: bioetl
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: bioetl-hpa
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: bioetl
  minReplicas: 1
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 15
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15
      - type: Pods
        value: 2
        periodSeconds: 15
      selectPolicy: Max
---
apiVersion: v1
kind: NetworkPolicy
metadata:
  name: bioetl-network-policy
  namespace: default
spec:
  podSelector:
    matchLabels:
      app: bioetl
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: prometheus
    ports:
    - protocol: TCP
      port: 8000
  - from:
    - podSelector:
        matchLabels:
          app: ingress-controller
    ports:
    - protocol: TCP
      port: 8000
  egress:
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 53  # DNS
    - protocol: UDP
      port: 53
  - to:
    - podSelector: {}
    ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 80
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: bioetl-quota
  namespace: default
spec:
  hard:
    requests.cpu: "4"
    requests.memory: "8Gi"
    limits.cpu: "8"
    limits.memory: "16Gi"
    pods: "10"
    persistentvolumeclaims: "5"
