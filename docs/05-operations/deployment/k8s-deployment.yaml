apiVersion: apps/v1
kind: Deployment
metadata:
  name: bioetl
  namespace: default
  labels:
    app: bioetl
    version: "REPLACE_IMAGE_TAG"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bioetl
  template:
    metadata:
      labels:
        app: bioetl
        version: "REPLACE_IMAGE_TAG"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: bioetl
      securityContext:
        runAsNonRoot: false  # BioETL may need elevated privileges for data processing
        fsGroup: 1000
      containers:
      - name: bioetl
        # Replace image with a fully qualified image reference before apply.
        # Example: myregistry.example.com/org/bioetl:1.2.3
        image: bioetl:REPLACE_IMAGE_TAG  # Update registry and tag before apply
        imagePullPolicy: IfNotPresent
        # Optional: uncomment and set an ImagePullSecret if using a private registry
        # imagePullSecrets:
        # - name: my-registry-credentials
        ports:
        - name: metrics
          containerPort: 8000
          protocol: TCP
        envFrom:
        - configMapRef:
            name: bioetl-config
        - secretRef:
            name: bioetl-secrets
            optional: true
        env:
        - name: BIOETL_DATA_DIR
          value: /data
        - name: BIOETL_LOG_FILE
          value: /logs/bioetl.log
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
            ephemeral-storage: 2Gi
          limits:
            cpu: 2000m
            memory: 4Gi
            ephemeral-storage: 8Gi
        # Health probes target the /metrics endpoint. Ensure this endpoint is
        # safe for probes (idempotent and low latency) to avoid false failures.
        livenessProbe:
          httpGet:
            path: /metrics
            port: metrics
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /metrics
            port: metrics
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        volumeMounts:
        - name: data
          mountPath: /data
        - name: logs
          mountPath: /logs
        - name: config
          mountPath: /etc/bioetl
          readOnly: true
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: bioetl-data
      - name: logs
        emptyDir: {}
      - name: config
        configMap:
          name: bioetl-config
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: bioetl
  namespace: default
  labels:
    app: bioetl
spec:
  type: ClusterIP
  selector:
    app: bioetl
  ports:
  - name: metrics
    port: 8000
    targetPort: metrics
    protocol: TCP
  sessionAffinity: None
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bioetl-data
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi  # Adjust based on your data volume needs
  # Uncomment to use a specific storage class provided by your cluster
  # storageClassName: fast-ssd
  # Note: ensure a matching StorageClass exists in the cluster, or leave commented
  # to use the default storage class.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: bioetl-config
  namespace: default
data:
  BIOETL_ENV: "prod"
  BIOETL_PIPELINE__BATCH_SIZE: "100"
  BIOETL_PIPELINE__CHECKPOINT_INTERVAL: "1000"
  BIOETL_PIPELINE__MAX_CONCURRENT_BATCHES: "4"
  BIOETL_PIPELINE__HEARTBEAT_INTERVAL: "20"
  BIOETL_LOG_LEVEL: "INFO"
  BIOETL_LOG_FORMAT: "json"
  BIOETL_METRICS_ENABLED: "true"
  BIOETL_METRICS_PORT: "8000"
  BIOETL_OBSERVABILITY__METRICS_ENABLED: "true"
  BIOETL_OBSERVABILITY__METRICS_SERVER_ENABLED: "true"
  BIOETL_OBSERVABILITY__METRICS_FAIL_FAST: "false"
  BIOETL_OBSERVABILITY__TRACING_ENABLED: "false"
  BIOETL_OBSERVABILITY__DQ_MONITOR_ENABLED: "false"
  BIOETL_DQ_SOFT_THRESHOLD: "0.05"
  BIOETL_DQ_HARD_THRESHOLD: "0.20"
  BIOETL_DQ_BASELINE_DAYS: "30"
  BIOETL_DQ_ANOMALY_WARNING_MULTIPLIER: "2.0"
  BIOETL_DQ_ANOMALY_CRITICAL_MULTIPLIER: "5.0"
  BIOETL_CB_FAILURE_THRESHOLD: "5"
  BIOETL_CB_RECOVERY_TIMEOUT: "300"
  BIOETL_CB_OPEN_ALERT_THRESHOLD: "600"
  BIOETL_RETRY_MAX_ATTEMPTS: "3"
  BIOETL_RETRY_MULTIPLIER: "2.0"
  BIOETL_RETRY_JITTER_MIN: "0.1"
  BIOETL_RETRY_JITTER_MAX: "0.5"
  BIOETL_DELTA_VACUUM_RETENTION: "7"
  BIOETL_DELTA_FORENSIC_RETENTION: "7"
  BIOETL_PARTITION_WARNING_THRESHOLD: "10000"
  BIOETL_PARTITION_HARD_LIMIT: "50000"
  BIOETL_FILES_PER_PARTITION_WARNING: "100"
  BIOETL_QUARANTINE_RETENTION_DAYS: "30"
  BIOETL_QUARANTINE_PAYLOAD_MAX_SIZE: "65536"
---
apiVersion: v1
kind: Secret
metadata:
  name: bioetl-secrets
  namespace: default
type: Opaque
stringData:
  # These should be rotated regularly and stored in a secrets management system
  BIOETL_PII_SALT_CURRENT: "change_me_to_random_64_char_string_abc123xyz789"
  BIOETL_UNIPROT_API_KEY: "your_uniprot_api_key_here"
  BIOETL_OPENALEX_EMAIL: "your_email@example.com"
  BIOETL_SEMANTICSCHOLAR_API_KEY: "your_semantic_scholar_api_key_here"
  BIOETL_PUBMED_API_KEY: "your_ncbi_api_key_here"
  BIOETL_PUBMED_EMAIL: "your_email@example.com"
  BIOETL_CROSSREF_EMAIL: "your_email@example.com"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bioetl
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: bioetl
  namespace: default
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bioetl
  namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: bioetl
subjects:
- kind: ServiceAccount
  name: bioetl
  namespace: default
