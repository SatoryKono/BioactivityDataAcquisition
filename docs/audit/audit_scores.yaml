    security:
      score: 9
      weight: 0.08
      evidence: |
        - grep "api_key\s*=\s*['\"]" → 0 hardcoded secrets
        - grep "PIIHasher|pii_hash" → 21 references
        - Environment variables: BIOETL_* pattern used
        - SecretStr usage: get_secret_value() in registration.py
