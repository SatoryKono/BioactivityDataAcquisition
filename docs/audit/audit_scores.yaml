      issues: []

    observability:
      score: 9
      weight: 0.08
      evidence: |
        - grep "structlog" → 44 references
        - grep "run_id" → 363 references
        - LoggerPort usage → 281 references
        - MetricsPort usage → 207 references
        - TracingPort usage → 120 references
        - OpenTelemetry → 57 references
