      justification: |
        Ruff и mypy --strict проходят без ошибок.
        Нет print() statements в production коде.
        Полная типизация (327 файлов проверены mypy --strict).
      violations: []

    documentation:
      score: 8
      weight: 0.08
      evidence: |
        - RULES.md: 1110 строк
        - refactoring-plan.md: 1206 строк
        - REQUIREMENTS.md: 930 строк
        - ADRs: 22 (все Accepted)
        - CLAUDE.md: comprehensive agent instructions
      justification: |
        Обширная документация: RULES.md v5.8, 22 ADR все Accepted.
        CLAUDE.md с Double Verification Protocol.
        Минус: glossary.md может быть расширен, некоторые inline
        docstrings минимальны.
      violations:
        - id: "DOC-001"
          severity: "Low"
          description: "Glossary может быть более полным"

    security:
      score: 8
      weight: 0.08
      evidence: |
        - grep "api_key\s*=" → только parameter passing, не hardcoded
        - os.environ/getenv → 4 references для конфигурации
        - BIOETL_ prefix convention → используется
        - VCR sanitization → documented in conftest.py
      justification: |
        Secrets через environment variables (BIOETL_ prefix).
        API keys передаются как параметры, не hardcoded.
        VCR кассеты санитизируются.
        Минус: нет автоматического secret scanning в CI.
      violations:
        - id: "SEC-001"
          severity: "Low"
          description: "Отсутствует автоматический secret scanning в CI (gitleaks/trufflehog)"

    observability:
      score: 8
      weight: 0.08
      evidence: |
        - grep "structlog" application/ → 0 (uses LoggerPort)
        - grep "run_id" → 363 references
        - MetricsPort/TracingPort → 224 references
        - OpenTelemetry → 52 references
        - Observability modules: logging, metrics, tracing, prometheus_metrics
      justification: |
        Structured logging через LoggerPort. run_id propagation (363 ref).
        OpenTelemetry интеграция (52 ref). Prometheus metrics.
        NoOp implementations для graceful degradation.
        Минус: аномальные отклонения метрик не алертируются автоматически.
      violations:
        - id: "OBS-001"
          severity: "Low"
          description: "Нет автоматического алертинга на аномалии метрик"

    operational_readiness:
      score: 8
      weight: 0.07
      evidence: |
        - Shutdown handling: 256 references, ShutdownService (286 LOC)
        - MemoryLock: 9 references (per ADR-010 local-only)
        - SIGTERM/SIGINT: proper exit codes (130, 143)
        - ADR-008 Graceful Shutdown: Accepted
        - ADR-010 Local-Only Deployment: Accepted
      justification: |
        Graceful shutdown реализован (ADR-008). MemoryLock достаточен
        для local-only архитектуры (ADR-010). Exit codes стандартизированы.
        Checkpoint management для recovery.
        Минус: нет health check endpoint для orchestrators.
      violations:
        - id: "OPS-001"
          severity: "Low"
          description: "Нет HTTP health check endpoint для внешних orchestrators"

