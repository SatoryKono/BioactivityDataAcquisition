      violations: []

    domain_model_quality:
      score: 9
      weight: 0.12
      evidence: |
        - grep "@frozen\|frozen=True" src/bioetl/domain/ → 88 frozen dataclasses
        - grep "class.*Protocol" src/bioetl/domain/ports/ → 30 Protocol definitions
        - grep "import httpx\|import requests" src/bioetl/domain/ → 0 I/O imports
        - grep "@runtime_checkable" src/bioetl/domain/ports/ → 30 decorators
        - grep "aclose" src/bioetl/domain/ports/ → 7 lifecycle methods
      justification: |
        Domain слой чист от I/O зависимостей. 88 frozen dataclasses обеспечивают
        иммутабельность Value Objects. 30 Protocol определений с @runtime_checkable.
        Все async порты имеют aclose() для lifecycle management.
        Ports facade в __init__.py экспортирует все интерфейсы.
      violations: []

    data_flow_medallion:
      score: 9
      weight: 0.12
      evidence: |
        - grep "delta\|DeltaTable" src/bioetl/infrastructure/storage/ → 54 refs
        - grep "content_hash" src/bioetl/ → 84 references
        - ls configs/pipelines/ → chembl, crossref, pubchem, pubmed, uniprot
        - Bronze/Silver/Gold writers реализованы в infrastructure/storage/
      justification: |
        Medallion архитектура полностью реализована: Bronze (JSONL+zstd),
        Silver (Delta Lake с merge/upsert), Gold (Delta/Parquet).
        Content hash используется для идемпотентности (84 ref).
        5 провайдеров сконфигурированы с YAML.
      violations: []

    error_handling:
      score: 8
      weight: 0.10
      evidence: |
        - grep "CircuitBreaker" src/bioetl/ → 109 references
        - grep "retry\|RetryPolicy" src/bioetl/ → 180 references
        - grep "soft_fail_threshold\|hard_fail_threshold" → DQConfig с 0.05/0.20
        - ADR-007 Circuit Breaker: Accepted
        - ADR-016 Error Handling Strategy: Accepted
      justification: |
        Circuit Breaker реализован (ADR-007). Retry с backoff.
        DQ пороги 5%/20% настроены. Классификация ошибок
        (Critical/Recoverable/DataQuality) документирована.
