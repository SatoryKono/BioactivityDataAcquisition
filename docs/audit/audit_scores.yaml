# BioETL Architectural Audit Scores
# Generated: 2026-01-01
# RULES.md Target: v5.8
# Protocol: Triple Verification (Code + Documentation + Tests)

project_assessment:
  audit_date: "2026-01-01"
  commit_hash: "8d5a1ada40c6fb9431be5eecbd6a6c504c1bdbaa"
  auditor: "Claude Code Audit Agent"
  rules_version: "5.8"

  baseline:
    source_files: 325
    test_files: 328
    architecture_tests: 392
    coverage_percent: 89.95

  scores:
    architecture_compliance:
      score: 9
      weight: 0.15
      evidence: |
        - grep "from bioetl.infrastructure" src/bioetl/domain/ → 0 violations
        - grep "from bioetl.infrastructure" src/bioetl/application/ → 0 violations
        - pytest tests/architecture/ → 392 passed, 1 skipped
        - import-linter contracts enforced in CI
      justification: |
        Perfect layer isolation. No forbidden imports between domain/application
        and infrastructure. Hexagonal architecture properly implemented with
        Ports & Adapters pattern. All architecture tests pass.
      issues: []

    domain_model_quality:
      score: 9
      weight: 0.12
      evidence: |
        - grep "@dataclass.*frozen" src/bioetl/domain/ → 72 frozen dataclasses
        - grep "Protocol" src/bioetl/domain/ports/ → 55 Protocol definitions
        - grep "runtime_checkable" src/bioetl/domain/ports/ → 47 decorators
        - grep "aclose" src/bioetl/domain/ports/ → 7 lifecycle methods
        - grep "import httpx" src/bioetl/domain/ → 0 I/O imports
        - 21 port files in domain/ports/
      justification: |
        Clean domain layer with immutable Value Objects (frozen dataclasses).
        Rich Protocol-based port definitions with proper lifecycle (aclose).
        No I/O dependencies in domain - pure business logic only.
      issues: []

    data_flow_medallion:
      score: 9
      weight: 0.12
      evidence: |
        - grep "delta|DeltaTable" src/bioetl/infrastructure/storage/ → 54 references
        - BronzeWriter, SilverWriter, GoldWriter properly implemented
        - SilverWriteMode, GoldWriteMode enums defined
        - content_hash/sha256 → 84 references
        - 10 pipeline configs across 5 providers
        - ADR-001, ADR-002 document Delta Lake choice
      justification: |
        Complete Medallion architecture (Bronze→Silver→Gold) with Delta Lake.
        ACID transactions via delta-rs. Proper write modes (MERGE, APPEND, SCD2).
        Content hashing for deduplication. Well-documented ADRs.
      issues: []

    error_handling:
      score: 8
      weight: 0.10
      evidence: |
        - grep "CircuitBreaker" → 107 references
        - grep "retry|Retry" → 197 references
        - DQConfig with soft_fail_threshold=0.05, hard_fail_threshold=0.20
        - grep "graceful|shutdown" → 191 references
        - ADR-007 (Circuit Breaker), ADR-008 (Graceful Shutdown)
      justification: |
        Comprehensive error handling with Circuit Breaker pattern (ADR-007).
        Retry logic with exponential backoff. DQ thresholds configured.
        Graceful shutdown implemented (ADR-008). Minor: some edge cases
        in storage layer could have more granular error classification.
      issues:
        - id: "ERR-001"
          severity: "Low"
          description: "Consider adding more granular error classification in storage adapters"

    test_coverage:
      score: 9
      weight: 0.12
      evidence: |
