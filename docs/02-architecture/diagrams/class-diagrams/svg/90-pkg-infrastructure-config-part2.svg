compositionStart,#my-svg .composition{fill:#475569!important;stroke:#475569!important;stroke-width:1;}#my-svg #compositionEnd,#my-svg .composition{fill:#475569!important;stroke:#475569!important;stroke-width:1;}#my-svg #dependencyStart,#my-svg .dependency{fill:#475569!important;stroke:#475569!important;stroke-width:1;}#my-svg #dependencyStart,#my-svg .dependency{fill:#475569!important;stroke:#475569!important;stroke-width:1;}#my-svg #extensionStart,#my-svg .extension{fill:transparent!important;stroke:#475569!important;stroke-width:1;}#my-svg #extensionEnd,#my-svg .extension{fill:transparent!important;stroke:#475569!important;stroke-width:1;}#my-svg #aggregationStart,#my-svg .aggregation{fill:transparent!important;stroke:#475569!important;stroke-width:1;}#my-svg #aggregationEnd,#my-svg .aggregation{fill:transparent!important;stroke:#475569!important;stroke-width:1;}#my-svg #lollipopStart,#my-svg .lollipop{fill:#eff6ff!important;stroke:#475569!important;stroke-width:1;}#my-svg #lollipopEnd,#my-svg .lollipop{fill:#eff6ff!important;stroke:#475569!important;stroke-width:1;}#my-svg .edgeTerminals{font-size:11px;}#my-svg .classTitleText{text-anchor:middle;font-size:18px;fill:#212121;}#my-svg :root{--mermaid-font-family:"trebuchet ms",verdana,arial,sans-serif;}</style><g><defs><marker orient="auto" markerHeight="240" markerWidth="190" refY="7" refX="18" class="marker aggregation classDiagram" id="my-svg_classDiagram-aggregationStart"><path d="M 18,7 L9,13 L1,7 L9,1 Z" /></marker></defs><defs><marker orient="auto" markerHeight="28" markerWidth="20" refY="7" refX="1" class="marker aggregation classDiagram" id="my-svg_classDiagram-aggregationEnd"><path d="M 18,7 L9,13 L1,7 L9,1 Z" /></marker></defs><defs><marker orient="auto" markerHeight="240" markerWidth="190" refY="7" refX="18" class="marker extension classDiagram" id="my-svg_classDiagram-extensionStart"><path d="M 1,7 L18,13 V 1 Z" /></marker></defs><defs><marker orient="auto" markerHeight="28" markerWidth="20" refY="7" refX="1" class="marker extension classDiagram" id="my-svg_classDiagram-extensionEnd"><path d="M 1,1 V 13 L18,7 Z" /></marker></defs><defs><marker orient="auto" markerHeight="240" markerWidth="190" refY="7" refX="18" class="marker composition classDiagram" id="my-svg_classDiagram-compositionStart"><path d="M 18,7 L9,13 L1,7 L9,1 Z" /></marker></defs><defs><marker orient="auto" markerHeight="28" markerWidth="20" refY="7" refX="1" class="marker composition classDiagram" id="my-svg_classDiagram-compositionEnd"><path d="M 18,7 L9,13 L1,7 L9,1 Z" /></marker></defs><defs><marker orient="auto" markerHeight="240" markerWidth="190" refY="7" refX="6" class="marker dependency classDiagram" id="my-svg_classDiagram-dependencyStart"><path d="M 5,7 L9,13 L1,7 L9,1 Z" /></marker></defs><defs><marker orient="auto" markerHeight="28" markerWidth="20" refY="7" refX="13" class="marker dependency classDiagram" id="my-svg_classDiagram-dependencyEnd"><path d="M 18,7 L9,13 L14,7 L9,1 Z" /></marker></defs><defs><marker orient="auto" markerHeight="240" markerWidth="190" refY="7" refX="13" class="marker lollipop classDiagram" id="my-svg_classDiagram-lollipopStart"><circle r="6" cy="7" cx="7" fill="transparent" stroke="black" /></marker></defs><defs><marker orient="auto" markerHeight="240" markerWidth="190" refY="7" refX="1" class="marker lollipop classDiagram" id="my-svg_classDiagram-lollipopEnd"><circle r="6" cy="7" cx="7" fill="transparent" stroke="black" /></marker></defs><g class="root"><g class="clusters" /><g class="edgePaths" /><g class="edgeLabels" /><g class="nodes"><g transform="translate(8, 0)" class="root"><g class="clusters"><g id="publication_type_classification_loader" class="cluster"><rect height="139" width="345.203125" y="8" x="8" style="fill: none; stroke: black" /><g transform="translate(48.859375, 8)" class="cluster-label"><text x="131.742" y="2.1" text-anchor="middle" xml:space="preserve" class="fo-fallback"><tspan x="131.742">publication_type_classificati</tspan><tspan x="131.742" dy="16.8">on_loader</tspan></text></g></g></g><g class="edgePaths" /><g class="edgeLabels" /><g class="nodes"><g transform="translate(180.6015625, 77.5)" id="classId-PublicationTypeClassificationLoader-0" class="node default"><rect height="69" width="295.203125" y="-34.5" x="-147.6015625" class="outer title-state" /><line y2="-1.5" y1="-1.5" x2="147.6015625" x1="-147.6015625" class="divider" /><line y2="14.5" y1="14.5" x2="147.6015625" x1="-147.6015625" class="divider" /><g class="label"><text x="135.602" y="2.1" text-anchor="middle" xml:space="preserve" class="classTitle fo-fallback" transform="translate( -135.6015625, -22.5)"><tspan x="135.602">PublicationTypeClassificationL</tspan><tspan x="135.602" dy="16.8">oader</tspan></text></g></g></g></g><g transform="translate(403.203125, 0)" class="root"><g class="clusters"><g id="semantic_field_registry_loader" class="cluster"><rect height="139" width="292.390625" y="8" x="8" style="fill: none; stroke: black" /><g transform="translate(48.8046875, 8)" class="cluster-label"><text x="105.391" y="2.1" text-anchor="middle" xml:space="preserve" class="fo-fallback"><tspan x="105.391">semantic_field_registry</tspan><tspan x="105.391" dy="16.8">_loader</tspan></text></g></g></g><g class="edgePaths" /><g class="edgeLabels" /><g class="nodes"><g transform="translate(154.1953125, 77.5)" id="classId-SemanticFieldRegistryLoader-1" class="node default"><rect height="69" width="242.390625" y="-34.5" x="-121.1953125" class="outer title-state" /><line y2="-1.5" y1="-1.5" x2="121.1953125" x1="-121.1953125" class="divider" /><line y2="14.5" y1="14.5" x2="121.1953125" x1="-121.1953125" class="divider" /><g class="label"><text x="109.195" y="2.1" text-anchor="middle" xml:space="preserve" class="classTitle fo-fallback" transform="translate( -109.1953125, -22.5)"><tspan x="109.195">SemanticFieldRegistryLoa</tspan><tspan x="109.195" dy="16.8">der</tspan></text></g></g></g></g></g></g></g><style>/*
 * BioETL Diagram Custom Styles
 * Applied on top of mermaid-config.json theme.
 * Passed to mmdc via --cssFile flag.
 */

/* ── Global ─────────────────────────────────────────── */
svg {
    font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
    Oxygen, Ubuntu, sans-serif;
}

/* ── Nodes ──────────────────────────────────────────── */
.node rect,
.node circle,
.node ellipse,
.node polygon,
.node path {
    stroke-width: 1.5px !important;
    rx: 8;
    ry: 8;
    filter: drop-shadow(2px 4px 6px rgba(0, 0, 0, 0.05));
}

/* ── Subgraph / cluster ─────────────────────────────── */
.cluster rect,
.cluster path {
    rx: 10;
    ry: 10;
    fill: #f8fafc;
    stroke: #94a3b8;
    stroke-width: 1.5px;
    stroke-dasharray: none;
    fill-opacity: 1;
    filter: none;
}

.cluster text {
    font-weight: 400;
    font-size: 15px;
}

/* ── Edges / links ──────────────────────────────────── */
.edgePath .path {
    stroke-width: 2.5px;
    stroke-linejoin: round;
    stroke-linecap: round;
}

/* Global rounded joins/caps for link-like paths across diagram types */
.edgePath path,
.flowchart-link,
.relation,
.messageLine0,
.messageLine1,
.transition path {
    stroke-linejoin: round;
    stroke-linecap: round;
}

/* State diagram transitions — match edge stroke for consistent rounding */
.transition path {
    stroke-width: 2.5px;
}

.edgeLabel {
    font-size: 12px;
    line-height: 1.1;
    background-color: #ffffff;
    padding: 1px 3px;
    border-radius: 2px;
}

.edgeLabel span,
.edgeLabel p,
text.fo-fallback {
    fill: #111827 !important;
    color: #111827 !important;
    opacity: 1 !important;
    line-height: 1.1;
    margin: 0;
    padding: 0;
}

/* Force opaque background on edge labels — Mermaid generates
   #id .edgeLabel rect { opacity: .5 } and
   #id .labelBkg { background-color: rgba(255,255,255,.5) }
   with ID-scoped selectors, making labels invisible on white/transparent BG. */
.edgeLabel .labelBkg,
.labelBkg {
    background-color: #ffffff !important;
    opacity: 1 !important;
}

/* SVG rect behind edge label text — override Mermaid's 50% opacity */
.edgeLabel rect {
    opacity: 1 !important;
    fill: #ffffff !important;
}

/* ── Sequence diagram ───────────────────────────────── */
.actor {
    stroke-width: 1.5px;
    rx: 4;
    ry: 4;
}

.messageLine0,
.messageLine1 {
    stroke-width: 1.6px;
}

.messageText {
    font-size: 13px;
}

.activation0 {
    stroke-width: 1px;
}

.note {
    rx: 4;
    ry: 4;
    stroke-width: 1px;
    filter: drop-shadow(1px 1px 2px rgba(0, 0, 0, 0.06));
}

/* ── Class diagram ──────────────────────────────────── */
g.classGroup rect {
    rx: 4;
    ry: 4;
    stroke-width: 1.5px;
    filter: drop-shadow(1px 1px 2px rgba(0, 0, 0, 0.06));
}

g.classGroup text {
    font-size: 14px;
}

g.classGroup line {
    stroke-width: 1px;
}

.relation {
    stroke-width: 2.5px;
}

/*
 * Class diagram — adaptive font sizes (foreignObject / HTML path).
 *
 * Mermaid renders class boxes via foreignObject → HTML, so we target
 * .nodeLabel (the HTML &lt;span&gt;) scoped to each group:
 *
 *   g.label-group      → class name    e.g. "BaseFieldExtractor"
 *   g.annotation-group → stereotype    e.g. "&lt;&lt;interface&gt;&gt;"
 *   g.members-group    → attributes    e.g. "+ field : str"
 *   g.methods-group    → methods       e.g. "+ extract() str"
 */

/* Class name — larger and bold */
g.label-group .nodeLabel {
    font-size: 16px !important;
    font-weight: 700 !important;
    letter-spacing: 0.01em;
}

/* Stereotype annotation — small italic */
g.annotation-group .nodeLabel {
    font-size: 11px !important;
    font-style: italic !important;
    opacity: 0.8;
}

/* Attributes and methods — compact, keep readable */
g.members-group .nodeLabel,
g.methods-group .nodeLabel {
    font-size: 12px !important;
    font-weight: 400 !important;
}

/*
 * CSS-based minimum sizing (P1: replaces &amp;nbsp; padding).
 *
 * SVG &lt;rect&gt; does NOT support min-width/min-height (CSS Box Model).
 * Instead, we target the HTML &lt;div&gt; inside &lt;foreignObject&gt; — Mermaid
 * measures this content during rendering, so CSS min-* dimensions
 * expand the foreignObject → rect is sized accordingly.
 *
 * Requires htmlLabels: true (set in mermaid-config.json).
 *
 * Usage in .mmd classDiagram:
 *   classDef size-sm fill:#eff6ff,stroke:#2563eb
 *   class MySmallClass size-sm
 *
 * The classDef applies fill/stroke to the rect; the CSS below provides
 * the minimum dimension via the HTML label content path.
 */

/* Baseline: all class member groups get consistent min-height */
g.members-group foreignObject,
g.methods-group foreignObject {
    min-height: 40px;
}

/* Size tiers — target the foreignObject HTML content divs */
/* Small: compact protocols, simple value objects */
.node foreignObject &gt; div,
g.classGroup foreignObject &gt; div {
    box-sizing: border-box;
}

/* Flowchart node sizing tiers */
.node.size-sm foreignObject &gt; div { min-height: 80px; min-width: 180px; }
.node.size-md foreignObject &gt; div { min-height: 140px; min-width: 260px; }
.node.size-lg foreignObject &gt; div { min-height: 200px; min-width: 340px; }

/* ── State diagram ──────────────────────────────────── */
g.stateGroup rect {
    rx: 8;
    ry: 8;
}

.statediagram-state rect {
    rx: 8;
    ry: 8;
    stroke-width: 1.5px;
    filter: drop-shadow(1px 2px 3px rgba(0, 0, 0, 0.08));
}

/* ── ER diagram ─────────────────────────────────────── */
.er.entityBox {
    stroke-width: 1.5px;
    rx: 4;
    ry: 4;
    filter: drop-shadow(1px 2px 3px rgba(0, 0, 0, 0.08));
}

/* ── Mindmap ────────────────────────────────────────── */
.mindmap-node rect,
.mindmap-node circle {
    stroke-width: 1.5px;
    filter: drop-shadow(1px 2px 2px rgba(0, 0, 0, 0.1));
}

/* ── Markers / arrowheads ───────────────────────────── */
marker path {
    fill: #475569;
}

/* ── BioETL-specific layer colours ──────────────────── */
/* Use classDef in .mmd files for best results.
   These selectors are fallback targets for
   subgraphs whose id starts with a known prefix. */

[id*="Domain"] &gt; rect,
[id*="Domain"] &gt; path {
    fill: #f5f3ff !important;
    stroke: #7c3aed !important;
}

[id*="Application"] &gt; rect,
[id*="Application"] &gt; path {
    fill: #f0fdf4 !important;
    stroke: #16a34a !important;
}

[id*="Infrastructure"] &gt; rect,
[id*="Infrastructure"] &gt; path {
    fill: #fff1f2 !important;
    stroke: #dc2626 !important;
}

[id*="Composition"] &gt; rect,
[id*="Composition"] &gt; path {
    fill: #fff7ed !important;
    stroke: #f59e0b !important;
}

[id*="Interfaces"] &gt; rect,
[id*="Interfaces"] &gt; path {
    fill: #eff6ff !important;
    stroke: #2563eb !important;
}

[id*="External"] &gt; rect,
[id*="External"] &gt; path {
    fill: #f1f5f9 !important;
    stroke: #64748b !important;
}

/* Medallion colours for data-flow diagrams */
[id*="Bronze"] &gt; rect,
[id*="Bronze"] &gt; path {
    fill: #fff7ed !important;
    stroke: #f59e0b !important;
}

[id*="Silver"] &gt; rect,
[id*="Silver"] &gt; path {
    fill: #f8fafc !important;
    stroke: #475569 !important;
}

[id*="Gold"] &gt; rect,
[id*="Gold"] &gt; path {
    fill: #fefce8 !important;
    stroke: #ca8a04 !important;
}

[id*="Quarantine"] &gt; rect,
[id*="Quarantine"] &gt; path {
    fill: #ffe4e6 !important;
    stroke: #e11d48 !important;
}
</style></svg>