domain: github-actions
id: prompt.audit.project.new2.github-actions
OBJECT: GitHub Actions trust model, permissions, pins, shell safety, caches, and required checks
SCOPE:
  - .github/workflows/
  - .github/actions/
  - .github/dependabot.yml
SSOT:
  - docs/00-project/RULES.md
  - .github/workflows/
  - docs/02-architecture/decisions/
AUDIT_CONTOURS:
  - trust events, pull_request_target, tokens, runners, environments, and fork paths
  - action SHA pinning, local action ownership, and Dependabot coverage
  - workflow catalog, required checks, concurrency, caches/artifacts, and shell fail-closed
  - secret exposure and untrusted code isolation
MANDATORY_EVIDENCE:
  - trust-matrix.csv and action-pin-inventory.csv
  - required-checks.csv mapping catalog to branch protection
  - workflow-validation.json with YAML and schema lint results
VALIDATION:
  - YAML and schema lint plus local action tests
  - catalog and required-check mapping verification
DOMAIN_STOP:
  - privileged untrusted code execution
  - unpinned high-risk third-party action
OUTPUT_EXTRAS:
  - trust-matrix.csv
  - action-pin-inventory.csv
