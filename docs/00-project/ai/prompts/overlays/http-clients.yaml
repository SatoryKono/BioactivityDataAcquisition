domain: http-clients
id: prompt.audit.project.new2.http-clients
OBJECT: HTTP clients, UnifiedHTTPClient, retry/backoff, rate limiting, and pagination
SCOPE:
  - src/bioetl/infrastructure/adapters/
SSOT:
  - docs/00-project/RULES.md
  - docs/02-architecture/decisions/ADR-032.md
  - src/bioetl/infrastructure/adapters/http/client.py
AUDIT_CONTOURS:
  - shared HTTP stack vs provider-specific duplicate inventory
  - timeout, retry/backoff, QPS, User-Agent, circuit breaker, and 4xx/5xx classification
  - pagination completeness, offsets/tokens, and partial failure handling
  - secret policy and direct requests bypass detection
MANDATORY_EVIDENCE:
  - http-stack-inventory.csv and adapter-parity.csv
  - retry-matrix.csv with bounded and classified retry evidence
  - pagination-cases.json proving pages not silently dropped
VALIDATION:
  - unit, contract, and VCR tests with bounded simulated failures
  - pagination completeness and idempotency/correlation checks
DOMAIN_STOP:
  - unbounded retry or missing timeout and User-Agent
  - silent page loss or direct requests bypassing unified client
OUTPUT_EXTRAS:
  - http-stack-inventory.csv
  - retry-matrix.csv
