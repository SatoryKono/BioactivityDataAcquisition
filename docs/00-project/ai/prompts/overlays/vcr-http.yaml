domain: vcr-http
id: prompt.audit.project.new2.vcr-http
OBJECT: VCR cassettes, HTTP fixture sanitization, deterministic replay, and offline isolation
SCOPE:
  - tests/fixtures/vcr/
  - configs/quality/integration_vcr_policy.yaml
SSOT:
  - configs/quality/integration_vcr_policy.yaml
  - docs/00-project/RULES.md
  - docs/00-project/ai/agents/skills/vcr-record/
AUDIT_CONTOURS:
  - cassette tree vs policy parity with orphan/missing meta and owner detection
  - secret header and body redaction without value echo
  - determinism timestamp, unordered JSON, host leakage, and matcher stability
  - offline replay capability and provider compatibility
MANDATORY_EVIDENCE:
  - cassette-inventory.csv and policy-tree-delta.csv
  - sanitization-results.json proving redaction without secret echo
  - replay-hashes.json with two-run hash comparison
VALIDATION:
  - targeted offline replay and two-run hash stability check
  - redacted scan on touched cassettes
DOMAIN_STOP:
  - secret material committed in cassette body or header
  - non-deterministic replay accepted as pass
OUTPUT_EXTRAS:
  - cassette-inventory.csv
  - replay-hashes.json
