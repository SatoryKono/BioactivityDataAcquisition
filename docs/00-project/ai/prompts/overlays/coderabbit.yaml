domain: coderabbit
id: prompt.audit.cycle.coderabbit
OBJECT: CodeRabbit dual-pass project audit with independent PROVEN confirmation and re-review
SCOPE:
  - src/bioetl/
  - docs/
  - configs/
  - tests/
  - grafana/
  - scripts/
  - .github/
SSOT:
  - docs/00-project/RULES.md
  - .coderabbit.yaml
  - docs/02-architecture/decisions/
AUDIT_CONTOURS:
  - leaf scope expansion with file cap and domain matrix coverage
  - CodeRabbit CLI and App review per leaf with log capture
  - agent re-check confirming or rejecting CR claims with independent evidence
  - cross-gate validation import-linter, architecture, debt, and domain gates
MANDATORY_EVIDENCE:
  - scope-matrix.md with file counts per leaf scope
  - coderabbit logs per scope with pipefail capture
  - review-disposition.csv and plan/issues mapping
VALIDATION:
  - fixed scopes re-reviewed via required checks plus CR App pass
  - agent disposition evidence and resolved/regressed/new delta
DOMAIN_STOP:
  - CR required but unavailable without explicit override
  - issue created from CR-only text without independent PROVEN
OUTPUT_EXTRAS:
  - scope-matrix.md
  - review-disposition.csv
