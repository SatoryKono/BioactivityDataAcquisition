domain: diagrams
id: prompt.audit.cycle.diagrams
OBJECT: Version-controlled text-as-code diagrams, renderer reproducibility, and code/ADR alignment
SCOPE:
  - docs/02-architecture/diagrams/
  - scripts/diagrams/
SSOT:
  - docs/00-project/RULES.md
  - docs/02-architecture/decisions/ADR-040.md
  - docs/00-project/DOC-GOV-02.md
AUDIT_CONTOURS:
  - text source existence and VCS tracking for .mmd/.mermaid and embedded Mermaid
  - renderer pinning and lint/budget gates
  - render smoke with pinned tooling and hash comparison
  - node/edge accuracy vs code/ADR/config claims
MANDATORY_EVIDENCE:
  - diagram-inventory.csv classifying type, owner, and source
  - render-hashes.json and render-failures.txt
  - diagram-code-drift.csv mapping claims to live paths
VALIDATION:
  - lint and artifact visual checks on touched set
  - pinned renderer smoke and hash delta per policy
DOMAIN_STOP:
  - secret or internal endpoint published in diagram
  - whole-repo code-level diagram without approval
OUTPUT_EXTRAS:
  - diagram-inventory.csv
  - diagram-code-drift.csv
