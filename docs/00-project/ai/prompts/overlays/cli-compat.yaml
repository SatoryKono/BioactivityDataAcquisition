domain: cli-compat
id: prompt.audit.project.new2.cli-compat
OBJECT: CLI and HTTP public interface compatibility, flags, exit codes, and health endpoints
SCOPE:
  - src/bioetl/interfaces/
  - docs/04-reference/cli.md
SSOT:
  - src/bioetl/interfaces/cli/main.py
  - docs/04-reference/cli.md
  - configs/config_compatibility_registry.yaml
  - docs/00-project/RULES.md
AUDIT_CONTOURS:
  - public command, flag, argument, exit code, and HTTP endpoint inventory vs docs
  - removed/renamed surface detection without migration or version bump
  - compatibility registry sunset and expiry vs live code alignment
  - thin interface delegation to application use cases
MANDATORY_EVIDENCE:
  - public-surface.json and cli-doc-drift.csv
  - exit-code-matrix.csv and migration-gaps.json
  - CLI help and output snapshot evidence
VALIDATION:
  - CLI help/output snapshot tests and HTTP contract tests
  - compatibility alias and shim lifecycle verification
DOMAIN_STOP:
  - silent breaking change without migration/version
  - revived retired shim returned as canonical surface
OUTPUT_EXTRAS:
  - public-surface.json
  - cli-doc-drift.csv
