# P1 #9808 — audit-readonly execution profile
# Fail-closed default library profile (kernel defaults).
# No Issues/PR/mutations, no network, no full suite — read-only audit.
name: audit-readonly
description: fail-closed read-only audit (no Issues/PR/mutations)
MODE: audit
AUDIT_MODE: full
ALLOW_ISSUE_WRITE: false
ALLOW_PUSH: false
ALLOW_MERGE: false
ALLOW_CLOSE: false
ALLOW_NETWORK: false
ALLOW_FULL_SUITE: false
LANGUAGE: ru
N: 10
