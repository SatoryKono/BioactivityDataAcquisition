  prompt: prompt.audit.sequential-run
  inputs:
  - N
  - MODE
  - LANGUAGE
  outputs:
  - run-ledger
  schema: _schema/prompt.schema.json
  deps:
  - prompt.fragment.issue-state-machine-v3
