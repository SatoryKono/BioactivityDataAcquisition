  - ZOOM
  - VIEWPORT
  - SCOPE
  - LANGUAGE
  outputs:
  - findings.json
  schema: _schema/prompt.schema.json
  deps:
  - prompt.fragment.audit-scale
- id: sequential-run
  scenario: Sequential domain audit with issue gates
