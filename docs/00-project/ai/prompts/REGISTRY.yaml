  deps:
  - prompt.fragment.finding-schema
  - prompt.fragment.debt-budget-ban
- id: plan-scoped
  scenario: Scoped implementation plan
  role: py-plan-bot
  prompt: prompt.plan.scoped
  inputs:
  - TASK
  - SCOPE
  - MODE
  - LANGUAGE
  outputs:
  - plan.md
