# BioETL Prompt Library registry
# Epic: #10081 | Schema: _schema/prompt.schema.json
# Operator paste templates only — not runtime SSOT.

version: 2.0.0
root: docs/00-project/ai/prompts
schema: _schema/prompt.schema.json
note: 'Epic #10081: 15 scenarios. Operator paste only — not runtime SSOT.'
scenarios:
- id: session-bootstrap
  scenario: Daily session lock for Grok/Codex
  role: any
  prompt: prompt.session.grok-bootstrap
  inputs:
  - TASK
  - MODE
  - SCOPE
  - WORK_BRANCH
  - LANGUAGE
  outputs:
  - session-lock
  schema: _schema/prompt.schema.json
  deps:
  - prompt.fragment.git-safety
  - prompt.fragment.debt-budget-ban
  - prompt.fragment.env-guardrail
- id: audit-cycle
  scenario: One-cycle evidence audit
  role: py-audit-bot
  prompt: prompt.audit.cycle
  inputs:
  - SCOPE
  - DOMAIN
  - MODE
  - AUDIT_MODE
  - LANGUAGE
  outputs:
  - findings.json
  - report.md
  schema: _schema/prompt.schema.json
  deps:
  - prompt.fragment.cyclic-kernel-v3
  - prompt.fragment.evidence-contract-v3
- id: audit-tech-debt
  scenario: Technical-debt register
