version: 1
scope: project-package-topology
status: active
decisions:
  - id: DEC-PKG-001
    title: Family-level topology governance
    status: accepted
    rationale: >-
      Package-level structural watchlists are maintained at the family level
      (e.g. infrastructure_adapters, infrastructure_storage, composition_bootstrap_runtime)
      rather than at the individual module level to reduce governance overhead
      while preserving meaningful boundary enforcement.
  - id: DEC-PKG-002
    title: Adapter family as primary structural watchlist unit
    status: accepted
    rationale: >-
      Provider live execution, replay governance, and residual environment-limited
      behavior land most directly on adapter families rather than broad infrastructure
      as a whole.
