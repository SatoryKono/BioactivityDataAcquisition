claim: "The UniProt ID mapping creator uses the typed `data_source_creator` seam to encode a hybrid construction contract that combines HTTP mapping, CSV input reading, config-driven database selection, and optional seed IDs, so this path cannot be reduced to generic adapter kwargs without losing semantics."
quote: "id_source_reader=IDMappingCsvReaderAdapter(logger=logger)"
confidence: 0.91
assumptions:
  - "The ID mapping provider is expected to keep local input-path and seed-ID semantics at the creator boundary rather than inside a generic adapter constructor."
  - "The unit tests around overrides/defaults reflect the intended public behavior for resume and composite-seed scenarios."
notes: "This is the clearest non-bibliographic creator in the current provider registry: it mixes HTTP and non-HTTP collaborators under a single explicit `data_source_creator` instead of routing through `custom_creator`."
tags:
