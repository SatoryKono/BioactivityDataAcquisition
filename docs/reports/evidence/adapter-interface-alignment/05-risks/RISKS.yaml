- id: RISK-adapt-compat-facade-drift
  risk: "DataSourceFactory remains a compatibility facade in name only and continues to evolve a separate helper-injection policy."
  linked_decisions:
    - DEC-adapt-canonical-provider-bound-creator
  severity: high
  likelihood: medium
  triggers:
    - "New helper logic is added to DataSourceFactory without equivalent typed seam updates"
    - "Provider creators continue to rely on direct create_adapter semantics"
  mitigations:
    - "Add architecture tests that keep DataSourceFactory as a thin delegation layer"
    - "Track all helper-policy changes in the canonical typed seam first"

- id: RISK-adapt-dual-seam-extension
  risk: "The project continues adding new providers to both custom_creator and data_source_creator patterns without a convergence rule."
  linked_decisions:
    - DEC-adapt-canonical-provider-bound-creator
  severity: high
  likelihood: high
  triggers:
    - "New registrations copy existing dynamic callable patterns"
    - "Provider onboarding docs do not distinguish runtime-facing and internal seams"
  mitigations:
    - "Update registration guidance after the decision is accepted"
    - "Add review checks for new ProviderConfig entries"

- id: RISK-adapt-overfitted-protocol
  risk: "A typed custom_creator protocol is designed too narrowly and blocks legitimate specialized factories."
  linked_decisions:
    - DEC-adapt-typed-custom-creator-protocol
  severity: medium
  likelihood: medium
  triggers:
    - "Specialized creators such as PubChem or future non-HTTP adapters need repeated protocol exceptions"
    - "Protocol fields encode provider-specific details instead of seam-family concepts"
  mitigations:
    - "Design the protocol around composition roles, not provider names"
    - "Keep hybrid runtime-facing creators on data_source_creator rather than forcing them into custom_creator"

- id: RISK-adapt-test-patch-breakage
  risk: "Tests and tooling that monkeypatch dynamic creator seams become brittle when custom_creator is typed and narrowed."
  linked_decisions:
    - DEC-adapt-typed-custom-creator-protocol
  severity: medium
  likelihood: medium
  triggers:
    - "Patch points disappear without replacement seams"
    - "Compatibility tests depend on open-ended kwargs behavior"
  mitigations:
    - "Retain explicit compatibility patch points during migration"
    - "Convert tests toward typed seam fixtures incrementally"

- id: RISK-adapt-helper-bundle-fragmentation
  risk: "Multiple helper bundle types proliferate without a coherent family taxonomy."
  linked_decisions:
    - DEC-adapt-family-helper-bundles
  severity: medium
  likelihood: medium
  triggers:
    - "Every provider introduces a bespoke bundle type"
    - "Bundle names reflect implementation details instead of adapter families"
  mitigations:
    - "Start with a core bundle plus one bibliography-oriented extension"
    - "Require justification for any new bundle family"

- id: RISK-adapt-premature-generalization
  risk: "Bundle abstractions are generalized beyond what the evidence supports and make simple seams harder to use."
  linked_decisions:
    - DEC-adapt-family-helper-bundles
  severity: medium
  likelihood: medium
  triggers:
    - "Simple wrappers like PubChem are forced through unnecessary bundle complexity"
    - "The same bundle is used for semantically different creator families"
  mitigations:
    - "Keep thin wrappers thin"
    - "Treat bibliography-style helper sets as an extension, not a universal requirement"

- id: RISK-adapt-temporary-fix-permanence
  risk: "Temporary local fixes become de facto permanent and stall seam normalization."
  linked_decisions:
    - DEC-adapt-local-fixes-are-stabilization
  severity: high
  likelihood: medium
  triggers:
    - "Stabilization fixes are merged without linking to a target seam or follow-up plan"
    - "Regression fixes keep adding provider-local helper synthesis"
  mitigations:
    - "Require every local fix to name the target contract it converges toward"
    - "Track unresolved local fixes in the normalization backlog"

- id: RISK-adapt-review-inconsistency
  risk: "Different reviewers apply different standards to local seam fixes during the transition period."
  linked_decisions:
    - DEC-adapt-local-fixes-are-stabilization
  severity: medium
  likelihood: high
  triggers:
    - "No written checklist exists for acceptable local fixes"
    - "Review comments focus on provider specifics rather than seam convergence"
  mitigations:
    - "Adopt the seam matrix as the review baseline"
    - "Add a short review checklist to provider/refactor guidance"
