id: EV-layers-composition-is-separate-di-root
pillar: layers-and-boundaries
source:
  type: internal-doc
  ref: "docs/02-architecture/decisions/ADR-005-composition-layer-separation.md:13-20; docs/02-architecture/decisions/ADR-005-composition-layer-separation.md:33-38; README.md:455-466; AGENTS.md:32-37"
  retrieved_at: 2026-03-20
claim: "The repository treats `composition` as a separate top-level dependency-injection root rather than as part of `interfaces`: it is the dedicated wiring layer that assembles concrete implementations and exposes public seams such as bootstrap and execution APIs."
quote: "The Composition Root is not an interface adapter but a dedicated wiring layer responsible for assembling the application's dependency graph."
confidence: 0.97
assumptions:
  - "ADR-005 remains active architectural guidance and has not been superseded by a newer ADR."
  - "The documented public seams in `composition/` still represent the intended assembly boundary for current entrypoints."
notes: "This is the key layer distinction that prevents interface code from silently becoming the object-graph assembly zone."
