- id: DEC-arch-found-interfaces-infrastructure-exception-only
  decision: "Treat direct `interfaces -> infrastructure` coupling as an exception-only carve-out, with application services and composition entrypoints remaining the canonical default."
  status: accepted
  owner: user
  created_at: 2026-03-20
  alternatives:
    - "Keep the broader ADR matrix allowance and rely on reviewer judgment"
    - "Ban all direct `interfaces -> infrastructure` imports with no carve-outs"
  evidence:
    - EV-layers-interfaces-are-driving-adapters
    - EV-layers-composition-is-separate-di-root
    - EV-enforcement-import-matrix-is-docs-as-code
    - EV-enforcement-interface-and-adapter-di-guards-pass
  tradeoffs:
    wins:
      - "Reduces reviewer ambiguity about the expected outer-layer routing path."
      - "Keeps the practical architecture aligned with DI and composition-first guidance."
      - "Preserves room for named operational or compatibility exceptions instead of forcing hidden workarounds."
    loses:
      - "Requires explicit documentation and maintenance of carve-out categories."
      - "May make some thin interface-side operational code feel less direct to implement."
  risks:
    - RISK-arch-found-policy-doc-test-drift
    - RISK-arch-found-overconstrained-outer-adapters
  implications:
    - "ADR and import-matrix wording should distinguish canonical routing from explicitly tolerated exceptions."
    - "Any allowed direct interface-to-infrastructure path should be named, justified, and covered by focused tests."

- id: DEC-arch-found-composition-surface-ladder
  decision: "Adopt a canonical composition surface ladder: entrypoints for external/runtime callers, bootstrap APIs for assembly orchestration, and registries/factories for composition-internal or advanced extension seams."
  status: accepted
  owner: user
  created_at: 2026-03-20
  alternatives:
    - "Keep several composition surfaces marked as equally canonical"
    - "Collapse all composition usage onto one global factory surface"
  evidence:
    - EV-layers-composition-is-separate-di-root
    - EV-patterns-registry-and-factory-assembly-seams
    - EV-patterns-dependency-injection-lives-in-composition
    - EV-enforcement-bootstrap-and-composition-boundaries-pass
  tradeoffs:
    wins:
      - "Makes the public assembly story easier to teach and review."
      - "Protects composition as the one place that knows the full object graph."
      - "Lets advanced extension seams stay available without competing with the default runtime path."
    loses:
      - "Introduces a taxonomy contributors must learn."
      - "May require renaming, documentation updates, or call-site cleanup where surface roles are currently blurred."
  risks:
    - RISK-arch-found-surface-hierarchy-drift
    - RISK-arch-found-surface-bureaucracy
  implications:
    - "Composition-facing docs should label which seam is intended for callers, assemblers, and extenders."
    - "Review guidance should flag new public seams that bypass the ladder without justification."

- id: DEC-arch-found-consolidated-conformance-report
  decision: "Pilot a consolidated architecture conformance report that summarizes layer, pattern, and guardrail signals without replacing the existing focused checks."
  status: provisional
  owner: user
  created_at: 2026-03-20
  alternatives:
    - "Keep architecture evidence distributed across tests, maps, and syntheses only"
    - "Replace the focused architecture checks with one monolithic architecture gate"
  evidence:
    - EV-enforcement-dependency-map-shows-zero-layer-violations
    - EV-enforcement-layer-dependency-suite-passes-baseline
    - EV-enforcement-bootstrap-and-composition-boundaries-pass
    - EV-enforcement-interface-and-adapter-di-guards-pass
    - EV-patterns-hexagonal-ports-and-adapters-is-explicit
  tradeoffs:
    wins:
      - "Gives reviewers and maintainers one fast architecture health snapshot."
      - "Makes the relationship between documented patterns and executable guardrails easier to see."
      - "Helps onboarding by turning several green signals into one readable narrative artifact."
    loses:
      - "Adds another maintained artifact that can become noisy or stale."
      - "Can encourage readers to stop at the summary and miss the focused guardrails underneath."
  risks:
    - RISK-arch-found-report-staleness
    - RISK-arch-found-summary-overconfidence
  implications:
    - "The consolidated report should be generated from current artifacts where possible rather than hand-maintained."
    - "Focused tests and dependency-map artifacts must remain the source of truth even if the summary report is added."
