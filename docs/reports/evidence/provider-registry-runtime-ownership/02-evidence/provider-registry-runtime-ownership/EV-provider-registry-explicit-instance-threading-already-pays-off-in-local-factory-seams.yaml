claim: "Explicit ProviderRegistry instance threading already has a clear payoff in datasource and adjacent factory chains where provider lookup, config resolution, and creator construction are conceptually local."
quote: "Factory helpers now accept \"provider_registry: ProviderRegistry | None\" and pass it through provider lookup and creator resolution paths."
confidence: 0.95
assumptions:
  - "Local ownership is a valid proxy for where explicit instance threading is worth the cost."
notes: "This is positive evidence for explicit ownership as a pattern, but only in seams that already own provider lookup concerns. It does not automatically justify pushing the same ownership into runtime/bootstrap."
