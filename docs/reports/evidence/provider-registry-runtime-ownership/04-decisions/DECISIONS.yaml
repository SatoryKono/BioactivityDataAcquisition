- id: DEC-provider-registry-runtime-stop-at-named-bootstrap-seam
  decision: "Treat the current named runtime bootstrap seam as sufficient for RF-07D and defer explicit runtime ProviderRegistry instance ownership until a new caller-driven evidence case appears."
  status: accepted
  owner: user
  created_at: 2026-03-20
  alternatives:
    - "Start a second runtime migration wave now and thread explicit ProviderRegistry instances through runtime/bootstrap entrypoints"
    - "Revert to class-level runtime bootstrap access and rely on compatibility behavior alone"
  evidence:
    - EV-provider-registry-runtime-bootstrap-now-flows-through-named-seam
    - EV-provider-registry-runtime-tests-now-bind-to-the-named-bootstrap-seam
    - EV-provider-registry-runtime-ratchet-already-prevents-raw-regression
    - EV-provider-registry-explicit-instance-threading-already-pays-off-in-local-factory-seams
    - EV-provider-registry-runtime-callers-do-not-yet-own-provider-instance-lifecycle
    - EV-provider-registry-governance-still-defers-runtime-instance-ownership-decision
  tradeoffs:
    wins:
      - "Closes RF-07D on a stable, explicit seam that is already covered by tests and architecture ratchets."
      - "Avoids adding new runtime plumbing before a natural ProviderRegistry owner exists in bootstrap callers."
      - "Preserves the ability to revisit explicit runtime ownership later if a concrete isolation or testability case appears."
    loses:
      - "Leaves the default registry compatibility layer alive in runtime/bootstrap behavior."
      - "Defers potential future gains from multi-registry runtime ownership until a stronger case appears."
      - "Requires maintainers to remember that datasource/factory patterns do not automatically generalize to runtime orchestration."
  risks:
    - RISK-provider-registry-runtime-hidden-benefit-left-unrealized
    - RISK-provider-registry-runtime-pattern-overgeneralization
  implications:
    - "RF-07D should be considered complete after seam stabilization and ratchet coverage, not after forced runtime instance threading."
    - "A future runtime ownership wave should be reopened only if a caller naturally owns an isolated registry or the current seam proves insufficient."
