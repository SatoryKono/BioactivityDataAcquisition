- id: RISK-legacy-classification-complexity-delays-obvious-cleanups
  created_by: DEC-legacy-use-four-bucket-classification-instead-of-broad-purge
  severity: medium
  likelihood: medium
  description: "Четырёхкорзинная модель делает backlog точнее, но может замедлить даже очевидные cleanup-слоты, если команда будет чрезмерно долго классифицировать каждый seam."
  triggers:
    - "Небольшие measured-only shim-ы неделями остаются без решения из-за ожидания полного global synthesis."
    - "Keyword-level candidates постоянно переводятся в `uncertain` без попытки собрать targeted proof."
  mitigations:
    - "Для narrow helper/shim candidates использовать short evidence loop, а не full repo-wave."
    - "Отдельно помечать low-risk measured-only seams как fast-track candidates."

- id: RISK-legacy-public-facades-harden-into-permanent-overhead
  created_by: DEC-legacy-keep-curated-public-facades-and-package-roots-as-supported-contracts
  severity: medium
  likelihood: medium
  description: "Если curated facades всегда трактовать как untouchable contracts, тонкие compatibility layers могут навсегда закрепиться как overhead и скрыть реальный шанс на future simplification."
  triggers:
    - "Новые public wrappers продолжают добавляться без expiry criteria."
    - "Ни один retained entrypoint не получает periodic review date или migration note."
  mitigations:
    - "Периодически пересматривать retained-entrypoint inventory."
    - "Добавлять review date и exit rationale для новых compatibility surfaces."

- id: RISK-legacy-wave-one-breaks-test-patch-paths-before-migration
  created_by: DEC-legacy-prioritize-measured-only-and-test-retained-shims-for-wave-one-removal
  severity: high
  likelihood: medium
  description: "Даже узкие measured-only seams часто ещё удерживаются tests как import/patch targets; преждевременное удаление сломает compatibility coverage и даст ложное ощущение регрессии runtime."
  triggers:
    - "Удаление helper shim делается до обновления test import paths."
    - "Monkeypatch-based tests продолжают ссылаться на historical module path."
  mitigations:
    - "Перед удалением строить explicit import inventory по tests."
    - "Делать migration tests и code removal в одном change-set."
    - "Оставлять temporary deprecation shim на один промежуточный шаг, если test migration слишком большая."

- id: RISK-legacy-wave-one-misses-hidden-first-party-callers
  created_by: DEC-legacy-prioritize-measured-only-and-test-retained-shims-for-wave-one-removal
  severity: medium
  likelihood: medium
  description: "У узких shims могут оказаться скрытые first-party call sites в scripts/docs/examples, которые не видны по одному runtime scan."
  triggers:
    - "После удаления появляются падения в scripts, templates или operator snippets."
    - "Docs/examples всё ещё рекомендуют old import path."
  mitigations:
    - "Включать в inventory не только `src/` и `tests/`, но и `scripts/`, `docs/`, шаблоны."
    - "Обновлять operator-facing docs в том же PR."

- id: RISK-legacy-migration-bridges-never-get-retired
  created_by: DEC-legacy-keep-migration-bridges-until-adoption-proof-and-explicit-exit-criteria
  severity: high
  likelihood: medium
  description: "Migration bridges легко становятся вечными, если для них не задан owner и measurable exit criterion; в таком режиме проект продолжает тащить старые shapes неопределённо долго."
  triggers:
    - "Bridge-код остаётся без review date и removal milestone."
    - "Нет способа проверить, что старый shape больше не используется."
  mitigations:
    - "Для каждого bridge фиксировать owner, review date и exit criterion."
    - "Использовать config/tests/docs inventory как adoption proof."
    - "После major/minor milestone переснимать targeted evidence pass."

- id: RISK-legacy-program-overlooks-real-fallback-debt
  created_by: DEC-legacy-exclude-active-resilience-fallbacks-from-removal-backlog
  severity: low
  likelihood: medium
  description: "Если слишком жёстко исключить все fallback-helpers из legacy программы, исторические fallback branches могут остаться неоценёнными и продолжать нести скрытый maintenance cost."
  triggers:
    - "Fallback module не меняется функционально, но остаётся без docs/config anchors и без active runtime rationale."
    - "Появляются дублирующие fallback flows с unclear ownership."
  mitigations:
    - "Периодически делать targeted fallback evidence pass."
    - "Требовать явный runtime rationale для каждого нового fallback helper."

- id: RISK-legacy-governance-gates-slow-down-cleanup-program
  created_by: DEC-legacy-require-tests-docs-and-governance-migration-before-removal
  severity: medium
  likelihood: high
  description: "Обязательная синхронная миграция tests/docs/governance повышает качество cleanup, но может заметно замедлить саму программу удаления и сделать её слишком дорогой для мелких seams."
  triggers:
    - "Маленькие removal tasks постоянно откладываются из-за несинхронизированных docs/inventory owners."
    - "Команда избегает cleanup вовсе из-за слишком тяжёлого process overhead."
  mitigations:
    - "Группировать removal work волнами по owner family."
    - "Для low-risk seams готовить шаблонный checklist обновления inventories и docs."
    - "Отделять truly contractual seams от purely test-retained helpers, чтобы не применять одинаково тяжёлый процесс ко всем."
