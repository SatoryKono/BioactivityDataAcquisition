- id: DEC-legacy-use-four-bucket-classification-instead-of-broad-purge
  decision: "Не открывать repo-wide campaign по удалению всего legacy/compatibility code. Управлять backlog через четыре корзины: `retire-now`, `retain-with-window`, `retain-as-contract`, `uncertain/migration-bridge`."
  status: provisional
  owner: codex
  created_at: 2026-03-28
  alternatives:
    - "Запустить широкое удаление всех wrapper/shim/fallback seams по keyword scan"
    - "Вообще не разделять legacy surface на категории и оставить тему ad hoc"
  evidence:
    - EV-governance-curated-registry-separates-zero-transition-debt-from-retained-entrypoints
    - EV-governance-retained-entrypoints-are-review-driven-not-auto-delete
    - EV-config-ci-contract-is-the-normative-ledger-for-active-retired-and-transitional-keys
    - EV-config-rules-make-legacy-field-support-explicitly-time-boxed
    - EV-infrastructure-adapter-fallback-helpers-are-active-resilience-behavior-not-legacy-cleanup-target
  tradeoffs:
    wins:
      - "Снижает риск снести sanctioned public seams вместе с реальным техническим долгом."
      - "Даёт управляемую decision model для разных типов compatibility surface."
      - "Позволяет строить execution backlog по evidence, а не по keywords."
    loses:
      - "Усложняет triage и делает программу удаления более медленной."
      - "Требует отдельной классификации для seam-ов, которые раньше можно было бы назвать просто legacy."
  risks:
    - RISK-legacy-classification-complexity-delays-obvious-cleanups
  implications:
    - "Все будущие removal proposals должны сначала получать bucket classification."
    - "Keyword hits без bucket classification не являются достаточным основанием для удаления."

- id: DEC-legacy-keep-curated-public-facades-and-package-roots-as-supported-contracts
  decision: "Считать curated top-level facades и package-root re-export surfaces поддерживаемыми контрактами и не включать их в первую волну удаления: сюда входят top-level CLI wrappers, composition entrypoints, domain package-root facades и infrastructure config/storage roots."
  status: provisional
  owner: codex
  created_at: 2026-03-28
  alternatives:
    - "Начать cleanup именно с самых тонких public wrappers как с визуально простых целей"
    - "Свести package-root facades к direct internal module imports без отдельной transition policy"
  evidence:
    - EV-cli-top-level-command-wrappers-are-curated-retained-entrypoints
    - EV-cli-package-root-declares-public-commands-surface-as-compatibility-layer
    - EV-composition-entrypoints-is-curated-retained-public-facade
    - EV-domain-filtering-package-root-is-retained-backcompat-facade
    - EV-domain-exceptions-package-root-remains-cross-layer-compat-surface
    - EV-infrastructure-config-package-root-is-curated-retained-config-facade
    - EV-infrastructure-storage-package-root-and-delta-alias-are-test-facing-compat-surface
  tradeoffs:
    wins:
      - "Защищает public import contracts и избегает массового churn в call sites."
      - "Оставляет первую волну удаления узкой и менее рискованной."
      - "Согласуется с curated inventory и historical review posture."
    loses:
      - "Сохраняет заметный объём thin-wrapper code в проекте."
      - "Откладывает упрощение import topology для новых разработчиков."
  risks:
    - RISK-legacy-public-facades-harden-into-permanent-overhead
  implications:
    - "Для этих seams removal возможен только после отдельного contract review и migration plan."
    - "Новые direct internal import paths не должны навязываться вместо sanctioned facades без решения."

- id: DEC-legacy-prioritize-measured-only-and-test-retained-shims-for-wave-one-removal
  decision: "Сформировать первую волну удаления вокруг measured-only и test-retained seams: deprecated composition shims, narrow CLI helper shims после test migration, legacy validation constructors и infrastructure validator aliases."
  status: provisional
  owner: codex
  created_at: 2026-03-28
  alternatives:
    - "Не открывать никакую removal wave до полного внешнего usage inventory"
    - "Сначала трогать public facades, а helper-level shims отложить"
  evidence:
    - EV-composition-deprecated-pipeline-config-and-services-shims-are-measured-only
    - EV-cli-support-shims-are-freeze-guarded-test-facing-seams
    - EV-cli-tests-still-use-public-and-helper-shim-import-paths
    - EV-domain-validation-compat-constructors-are-test-retained-legacy-helpers
    - EV-infrastructure-noop-validator-aliases-are-bounded-retain-with-window-seam
  tradeoffs:
    wins:
      - "Даёт узкий и реалистичный first-wave backlog."
      - "Удаляет seams, где compatibility value уже заметно ниже, чем maintenance cost."
      - "Не конфликтует напрямую с sanctioned public contracts."
    loses:
      - "Требует сначала мигрировать tests и patch paths."
      - "Часть швов всё ещё может иметь скрытых consumers вне repo."
  risks:
    - RISK-legacy-wave-one-breaks-test-patch-paths-before-migration
    - RISK-legacy-wave-one-misses-hidden-first-party-callers
  implications:
    - "Первая волна должна стартовать с import/test inventory для этих narrow candidates."
    - "Каждый removal PR обязан включать migration of tests and compatibility inventories."

- id: DEC-legacy-keep-migration-bridges-until-adoption-proof-and-explicit-exit-criteria
  decision: "Не удалять migration bridges до explicit adoption proof. К этой корзине относятся `filter_batch_size`, selected runtime normalizers, legacy DQ contract fallback и другие old-shape bridges; для них нужно фиксировать exit criteria и целевой removal milestone."
  status: provisional
  owner: codex
  created_at: 2026-03-28
  alternatives:
    - "Удалять migration bridges сразу после появления canonical path"
    - "Оставлять все migration bridges бессрочно как harmless compatibility layer"
  evidence:
    - EV-config-filter-batch-size-is-an-explicit-transitional-alias
    - EV-config-runtime-normalizers-still-bridge-selected-old-shapes
    - EV-infrastructure-dq-contract-loader-keeps-legacy-dq-files-as-migration-bridge
    - EV-infrastructure-source-normalizer-remains-active-legacy-shape-bridge
    - EV-application-shutdown-request-wait-remain-backcompat-test-facing-seam
    - EV-config-rules-make-legacy-field-support-explicitly-time-boxed
  tradeoffs:
    wins:
      - "Избегает premature deletion ещё используемых old-shape paths."
      - "Заставляет превратить vague compatibility retention в time-boxed policy."
      - "Согласуется с RULES и config governance."
    loses:
      - "Часть migration code останется в проекте дольше, чем хотелось бы."
      - "Понадобится дополнительная telemetry/inventory работа для доказательства adoption."
  risks:
    - RISK-legacy-migration-bridges-never-get-retired
  implications:
    - "Для каждого bridge нужен owner, exit criterion и проверка фактического usage."
    - "Removal bridge-кода должен происходить только после обновления docs/config policy."

- id: DEC-legacy-exclude-active-resilience-fallbacks-from-removal-backlog
  decision: "Не включать active adapter resilience fallback helpers в legacy-removal backlog только на основании названия `fallback`; считать их отдельной operational/resilience категорией до появления evidence, что это именно historical compatibility path."
  status: provisional
  owner: codex
  created_at: 2026-03-28
  alternatives:
    - "Считать все fallback helper modules legacy debt по умолчанию"
    - "Вообще не анализировать fallback helper modules в рамках этой программы"
  evidence:
    - EV-infrastructure-adapter-fallback-helpers-are-active-resilience-behavior-not-legacy-cleanup-target
    - EV-infrastructure-source-normalizer-remains-active-legacy-shape-bridge
    - EV-infrastructure-retired-source-pagination-aliases-already-moved-to-rejection-guard
  tradeoffs:
    wins:
      - "Снижает риск удалить живую resilience functionality."
      - "Отделяет compatibility cleanup от runtime reliability engineering."
    loses:
      - "Часть настоящих legacy fallbacks может дольше оставаться вне removal radar."
      - "Потребуется отдельная evidence проверка, если fallback действительно станет кандидатом на retirement."
  risks:
    - RISK-legacy-program-overlooks-real-fallback-debt
  implications:
    - "Новые evidence passes должны явно доказывать historical-only nature fallback branch перед его retirement."
    - "Слово `fallback` в имени модуля не считается классификацией."

- id: DEC-legacy-require-tests-docs-and-governance-migration-before-removal
  decision: "Считать tests/docs/governance anchors обязательным removal gate: ни один compatibility seam не удаляется, пока не мигрированы contract tests, inventory rows, docs references и historical review posture, которые его удерживают."
  status: provisional
  owner: codex
  created_at: 2026-03-28
  alternatives:
    - "Удалять code seam сначала, а tests/docs/governance подтягивать потом"
    - "Считать tests и docs вторичными и не блокирующими кодовое удаление"
  evidence:
    - EV-test-ownership-inventory-makes-facade-tests-part-of-compat-contract
    - EV-governance-retained-entrypoints-are-review-driven-not-auto-delete
    - EV-history-current-cycle-forbids-deprecation-of-retained-adapter-entrypoints
    - EV-cli-tests-still-use-public-and-helper-shim-import-paths
    - EV-infrastructure-metadatawriter-facade-preserves-historical-monkeypatch-contract
    - EV-config-ci-contract-is-the-normative-ledger-for-active-retired-and-transitional-keys
  tradeoffs:
    wins:
      - "Снижает шанс latent regressions после удаления seemingly unused seam."
      - "Делает removal work traceable и audit-friendly."
      - "Принуждает backlog к честной ownership migration."
    loses:
      - "Удаление совместимых швов становится медленнее и бюрократичнее."
      - "Часть низкоценных cleanup-кандидатов может остаться дольше из-за cost of migration."
  risks:
    - RISK-legacy-governance-gates-slow-down-cleanup-program
  implications:
    - "Каждый removal change-set должен включать docs/tests/governance delta, а не только код."
    - "Compatibility inventories и freeze guards нужно обновлять в том же PR, где выполняется retirement."
