- id: DEC-hotspot-overlap-first-wave
  decision: "Use the overlap set (>10 KB and >350 LOC) as the first refactoring-wave shortlist, with dependency-pressure seams used only as escalation signals."
  status: proposed
  owner: codex-draft
  created_at: 2026-03-20
  alternatives:
    - "Start with dependency-pressure seams regardless of hotspot thresholds"
    - "Start with the full >10 KB inventory immediately"
  evidence:
    - EV-dependency-hotspots-17-files-exceed-350-loc
    - EV-dependency-hotspots-loc-tail-is-contained-in-size-tail
    - EV-dependency-hotspots-cross-layer-pressure-centers-on-composite-factories-cli
  tradeoffs:
    wins:
      - "Keeps the first wave bounded"
      - "Targets the densest large-file debt first"
      - "Still leaves room for seam-pressure exceptions"
    loses:
      - "Some sub-threshold but architecturally sensitive files move later"
      - "The shortlist still spans several layers"
  risks:
    - RISK-hotspot-wave-scatter
    - RISK-hotspot-pressure-underweighting
  implications:
    - "The first backlog wave should be overlap-first rather than full-inventory-first"
    - "Dependency-pressure seams should guide exceptions and ordering, not replace the first-wave shortlist"

- id: DEC-hotspot-size-only-phase-two
  decision: "Treat size-only hotspots (>10 KB but <=350 LOC) as phase-two backlog items rather than ignoring them."
  status: proposed
  owner: codex-draft
  created_at: 2026-03-20
  alternatives:
    - "Ignore size-only hotspots and focus only on >350 LOC files"
    - "Merge all size-only hotspots into the first wave"
  evidence:
    - EV-dependency-hotspots-95-files-exceed-10kb
    - EV-dependency-hotspots-largest-size-files-extend-beyond-loc-tail
    - EV-dependency-hotspots-loc-tail-is-contained-in-size-tail
  tradeoffs:
    wins:
      - "Keeps dense but sub-threshold files visible"
      - "Prevents the first wave from becoming too large"
      - "Creates an explicit second-wave inventory"
    loses:
      - "Requires maintaining two hotspot inventories"
      - "Some size-only files remain deferred"
  risks:
    - RISK-hotspot-size-only-neglect
    - RISK-hotspot-threshold-gaming
  implications:
    - "Backlog reporting should distinguish overlap hotspots from size-only hotspots"
    - "Reviewers should not treat below-350 LOC as an automatic clean bill of health"

- id: DEC-hotspot-adapters-first
  decision: "Prioritize src/bioetl/infrastructure/adapters as the first package decomposition target."
  status: proposed
  owner: codex-draft
  created_at: 2026-03-20
  alternatives:
    - "Prioritize CLI/application seams first"
    - "Prioritize storage/config/schema hotspots before adapters"
  evidence:
    - EV-dependency-hotspots-infrastructure-adapters-dominates-overlap-tail
    - EV-dependency-hotspots-17-files-exceed-350-loc
    - EV-dependency-hotspots-95-files-exceed-10kb
  tradeoffs:
    wins:
      - "Attacks the most concentrated hotspot package first"
      - "Creates a package-scoped initial wave"
      - "Removes a large share of overlap-hotspot debt with one family of changes"
    loses:
      - "Leaves CLI/application pressure seams for later"
      - "External-provider behavior makes adapter refactors riskier"
  risks:
    - RISK-hotspot-adapter-regression
    - RISK-hotspot-package-monoculture
  implications:
    - "Wave 1 should center on adapter mixins and batch/error helpers"
    - "Provider-facing verification must stay attached to this wave"

- id: DEC-hotspot-two-track-prioritization
  decision: "Use two parallel prioritization tracks: dense-file hotspots for execution order, dependency-pressure seams as escalation and tie-break rules."
  status: proposed
  owner: codex-draft
  created_at: 2026-03-20
  alternatives:
    - "Collapse hotspot and dependency signals into one numeric score"
    - "Ignore dependency pressure and use file-size thresholds only"
  evidence:
    - EV-dependency-hotspots-module-map-zero-layer-violations
    - EV-dependency-hotspots-cross-layer-pressure-centers-on-composite-factories-cli
    - EV-dependency-hotspots-95-files-exceed-10kb
    - EV-dependency-hotspots-17-files-exceed-350-loc
  tradeoffs:
    wins:
      - "Preserves both structural and file-level signals"
      - "Avoids false precision from under-specified graph scoring"
      - "Makes seam-based exceptions easier to justify"
    loses:
      - "Requires more reviewer judgment"
      - "Is less mechanically simple than one score"
  risks:
    - RISK-hotspot-priority-inconsistency
    - RISK-hotspot-false-precision-return
  implications:
    - "Backlog items should record both hotspot density and dependency-pressure notes"
    - "A unified numeric score should be deferred until per-file graph metrics exist"
