claim: "The enforceable file-size ratchet tracks entries in the `file_size_limits` exemption registry, not the full raw hotspot tail; the project can therefore report 0 file-size exemptions while the source tree still contains 82 files above 10 KB and 10 above 350 LOC."
quote: "test_file_size_exemption_count() compares actual `file_size_limits` registry count to `_resolve_registry_budget(\"file_size_limits\")`"
confidence: 0.95
assumptions:
  - "The raw hotspot inventory and the exemption registry are both intended inputs to governance discussions, even though only one is currently enforced."
  - "The current raw hotspot counts are representative of the working tree used for governance interpretation."
notes: "This distinction matters when reading green-state dashboards: zero file-size exemptions does not mean the broad size tail has been eliminated."
