bioetl_audit_synthesis:
  date: "2025-12-31"
  rules_version: "5.8"
  project_stats:
    python_files: 322
    total_loc: 55311
    test_files: 245
    test_functions: 2989
    architecture_tests: 32

  # ===========================================================================
  # LAYER SCORES
  # ===========================================================================
  layer_scores:
    domain:
      score: 9.85
      max: 10
      status: "EXCELLENT"
      summary: |
        Domain Layer demonstrates exemplary DDD implementation.
        29 Ports with @runtime_checkable Protocol. Zero I/O operations.
        Value Objects use frozen dataclasses. Aggregates implement state machines.
        IdentityService fully implements RULES.md §2.8.1 content hashing.

    application:
      score: 9.5
      max: 10
      status: "EXCELLENT"
      summary: |
        Clean architecture with proper separation of concerns.
        Extensive delegation patterns (7+ services in PipelineRunner).
        CircuitBreaker, DQ thresholds, and health monitoring fully implemented.
        No architectural violations found.

    infrastructure:
      score: 9.6
      max: 10
      status: "EXCELLENT"
      summary: |
        All 28 domain ports properly implemented.
        Medallion architecture correctly implemented (Bronze JSONL, Silver/Gold Delta Lake).
        ADR-010 compliant (MemoryLock, no Redis).
        Observability with structured logging and optional Prometheus metrics.

    interfaces:
      score: 8.4
      max: 10
      status: "GOOD"
      summary: |
        Well-structured CLI (1478 LOC) following thin controller pattern.
        Minor DTO duplication (mostly resolved).
        Deprecated commands identified and documented.
        Import rules compliant per project matrix.

  # ===========================================================================
  # CONSOLIDATED PROBLEMS
  # ===========================================================================
  all_problems:
    critical:  # P0 - Блокеры production
      # No P0 issues found

    high:  # P1 - Требуют внимания в sprint
      - id: "P1-001"
        layer: "composition"
        category: "Контракты/Ports"
        title: "mypy ошибки вызова bootstrap_logger"
        description: |
          runner.py:41,43 - Unexpected keyword argument "settings",
          incompatible type None for run_id
        files:
          - "composition/_bootstrap/runner.py:41,43"
        effort_days: 0.25
        verification: "mypy --strict src/bioetl/composition/"

      - id: "P1-002"
        layer: "composition"
        category: "Контракты/Ports"
        title: "Unused type: ignore comments"
        description: |
          3 unused type: ignore комментария в services_factory.py
        files:
          - "composition/factories/services_factory.py:446-448"
        effort_days: 0.1
        verification: "mypy --warn-unused-ignores"

      - id: "P1-003"
        layer: "application"
        category: "Трассировка"
        title: "Отсутствует executor.py для архитектурных тестов"
        description: |
          TestMandatorySpans требует executor.py с методами execute/process
          для обязательных tracing spans
        files:
          - "Создать: src/bioetl/application/core/executor.py"
          - "tests/architecture/test_tracing_enforcement.py"
        effort_days: 1.0
        verification: "pytest tests/architecture/test_tracing_enforcement.py"

    medium:  # P2 - Планировать на следующий sprint
      - id: "P2-001"
        layer: "interfaces"
        category: "Структура"
        title: "BatchRunResult в неправильном месте"
        description: |
          BatchRunResult (DTO уровня application) определён в CLI-команде run_all.py.
          Содержит бизнес-логику (all_succeeded property).
        files:
          - "interfaces/cli/commands/run_all.py:33-56"
        effort_days: 0.5
        status: "Отложено - не критично"
        verification: "grep -n 'class BatchRunResult' src/bioetl/"

      - id: "P2-002"
        layer: "all"
        category: "Логирование"
        title: "print() вместо структурированного логирования"
        description: |
          39 вхождений print() в src/bioetl.
          Часть в doctests (допустимо), часть в runtime-коде.
        files:
          - "multiple"
        effort_days: 0.5
        verification: "grep -rn 'print(' src/bioetl/ | grep -v test | grep -v docstring"

    low:  # P3 - Backlog
      - id: "P3-001"
        layer: "domain"
        category: "Структура"
        title: "Missing centralized DQ rules directory"
        description: |
          DQ rules распределены по другим компонентам вместо
          выделенной директории domain/rules/.
          Не является нарушением - организационное улучшение.
        files:
          - "domain/config.py (DQConfig)"
        effort_days: 0.5
        status: "OPTIONAL"
        verification: "grep -rn 'DQConfig' src/bioetl/domain/"

      - id: "P3-002"
        layer: "infrastructure"
        category: "Observability"
        title: "Stage enforcement в Logger"
        description: |
          stage параметр не валидируется на уровне типов в StructlogLogger.
          Рекомендуется Literal["extract", "transform", "load"].
        files:
          - "infrastructure/observability/logging.py"
        effort_days: 0.25
        verification: "grep -n 'stage' src/bioetl/infrastructure/observability/logging.py"

      - id: "P3-003"
        layer: "infrastructure"
        category: "Security"
        title: "PII Hashing Utility (опционально)"
        description: |
          Нет dedicated утилиты для хэширования PII полей.
          Не требуется сейчас (default_email - технический идентификатор).
        files:
          - "infrastructure/security/ (создать если понадобится)"
        effort_days: 0.5
        status: "OPTIONAL"

  # ===========================================================================
  # CROSS-LAYER ISSUES
  # ===========================================================================
  cross_layer_issues:
    - id: "CROSS-001"
      title: "Пропущенный executor.py нарушает tracing контракт"
      description: |
        Архитектурный тест test_tracing_enforcement.py в tests/architecture/
        проверяет наличие обязательных tracing spans в executor.py.
        Файл отсутствует, что приводит к падению тестов.
      affected_layers:
        - application  # Здесь должен быть executor.py
        - composition  # Здесь происходит wiring
        - tests        # Здесь проверяется контракт
      root_cause: "application (отсутствует файл)"
      resolution_order:
        - "P1-003: Создать executor.py в application/core/"
        - "Обновить composition для wiring executor"
        - "Тесты пройдут автоматически"

    - id: "CROSS-002"
      title: "mypy strict режим не проходит"
      description: |
        22 ошибки mypy --strict:
        - 17 Pydantic "Class cannot subclass BaseModel" (отсутствие stubs)
        - 3 unused type: ignore
        - 2 ошибки вызова bootstrap_logger
      affected_layers:
        - composition  # bootstrap_logger ошибки
        - domain       # Pydantic модели
      root_cause: "composition (неверные аргументы функции)"
      resolution_order:
        - "P1-001: Исправить вызов bootstrap_logger"
        - "P1-002: Удалить unused ignores"
        - "Pydantic stubs - отложить (низкий приоритет)"

