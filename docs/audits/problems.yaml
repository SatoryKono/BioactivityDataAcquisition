    location:
      file: "docs/02-architecture/decisions/"
      pattern: "ADR-*.md"

    description: |
      22 ADRs exist but Status field format varies:
      - ADR-001: "**Status**: Accepted" (bullet format)
      - ADR-015: "**Status:** Accepted" (bold format)
      - Only 1 explicitly matches "Status:.*Accepted" grep pattern
      This is cosmetic but affects automated status reporting.

    impact:
      severity: "Low"
      affected: ["docs/02-architecture/decisions/"]
      production_risk: "None"

    assessment:
      complexity: 1
      effort_hours: 1
      priority: "P3"

    resolution:
      approach: "Standardize ADR header format with consistent markdown structure"
      breaking_changes: false

    triangulation:
      code_check:
        verdict: "N/A"
      doc_check:
        command: "grep -l 'Status:.*Accepted' docs/02-architecture/decisions/ADR*.md | wc -l"
        result: "1 (but all 22 ADRs have Status sections)"
        verdict: "CONFIRMED"
      test_check:
        verdict: "N/A"

