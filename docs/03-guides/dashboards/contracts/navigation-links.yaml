normative_source:
  scope: link_vars_time_semantics
  authority: single_source_of_truth
  narrative_minimal: 'This YAML is the only normative contract for dashboard link semantics,

    allowed/required/forbidden var-* handoff, and time handoff policy.

    Markdown guides are explanatory mirrors and MUST reference this file

    instead of redefining normative rules.

    Required "top-level" link titles refer to the canonical machine-readable

    navigation bus surface and do not require dashboard root `links[]`

    specifically; shipped dashboards MAY surface the visible bus through panel

    `id=1000` HTML while omitting machine-readable self-links to avoid

    duplicating header-row links next to Grafana variables.

    '
version: 1
required_top_level_links_by_uid:
  bioetl-control-plane-v1:
  - 1. Overview
  - 2. Pipeline Diagnostics
  - 4. Data Quality
  bioetl-overview-v2:
  - 0. Trust
  - 2. Pipeline Diagnostics
  - 4. Data Quality
  bioetl-runtime:
  - 0. Trust
  - 1. Overview
  - 4. Data Quality
  bioetl-dq-v2:
  - 0. Trust
  - 1. Overview
  - 2. Pipeline Diagnostics
  bioetl-provider-health-v2:
  - 0. Trust
  - 1. Overview
  - 2. Pipeline Diagnostics
  - 4. Data Quality
top_level_link_priority_by_uid:
  bioetl-overview-v2:
  - title: 2. Pipeline Diagnostics
    target_uid: bioetl-runtime
    priority: primary
    semantics: scoped_runtime_handoff
  - title: 0. Trust
    target_uid: bioetl-control-plane-v1
    priority: secondary
    semantics: scoped_control_plane_handoff
  - title: 4. Data Quality
    target_uid: bioetl-dq-v2
    priority: contextual
    semantics: scoped_dq_handoff
  bioetl-provider-health-v2:
  - title: 2. Pipeline Diagnostics
    target_uid: bioetl-runtime
    priority: primary
    semantics: runtime_cross_scope_all_defaults
required_link_vars_by_target_uid:
  bioetl-overview-v2:
