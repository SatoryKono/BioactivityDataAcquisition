preserved_identity_handoff:
  selector: run_id
  required_value: "$run_id"
  source_uids:
    - bioetl-control-plane-v1
    - bioetl-dq-v2
    - bioetl-overview-v2
    - bioetl-provider-health-v2
    - bioetl-runtime
    - bioetl-workflow-overview
  target_uids:
    - bioetl-control-plane-v1
    - bioetl-dq-v2
    - bioetl-overview-v2
    - bioetl-provider-health-v2
    - bioetl-runtime
    - bioetl-workflow-overview
  excluded_source_uids:
    - bioetl-silver-reject-explorer
    - bioetl-alerts-slo
  excluded_target_uids: []
  semantics: |
    Preserve exact primary Run ID when both source and target dashboards expose
    the primary control-plane `run_id` selector. The handoff keeps HTTP
    identity/details panels focused on the selected run; Prometheus status and
    current-state panels remain pipeline/run_type scoped. Generic links into
    Silver Reject Explorer do not map primary `run_id` to `quarantine_run_id`;
    exact reject filters are forensic-only selectors and require an explicit
    record/payload drilldown. Links out of the explorer and alert dashboard do
    not preserve primary `run_id` because those dashboards do not own the
    primary identity selector.

