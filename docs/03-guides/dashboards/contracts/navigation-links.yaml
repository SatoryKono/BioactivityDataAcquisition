forbidden_dashboard_link_vars_by_target_uid:
  bioetl-overview-v2:
  - quarantine_run_id
  - payload_hash
  - manifest_id
  - execution_fingerprint
  bioetl-control-plane-v1:
  - quarantine_run_id
  - payload_hash
  - manifest_id
  - execution_fingerprint
  bioetl-runtime:
  - quarantine_run_id
  - payload_hash
  - manifest_id
  - execution_fingerprint
  bioetl-dq-v2:
  - quarantine_run_id
  - payload_hash
  - manifest_id
  - execution_fingerprint
  bioetl-provider-health-v2:
  - quarantine_run_id
  - payload_hash
  - manifest_id
  - execution_fingerprint
preserved_identity_handoff:
  selector: run_id
  required_value: $run_id
  source_uids:
  - bioetl-control-plane-v1
  - bioetl-dq-v2
  - bioetl-overview-v2
  - bioetl-provider-health-v2
  - bioetl-runtime
  target_uids:
  - bioetl-control-plane-v1
  - bioetl-dq-v2
  - bioetl-overview-v2
  - bioetl-provider-health-v2
  - bioetl-runtime
  excluded_source_uids: []
  excluded_target_uids: []
  semantics: Preserve exact primary Run ID when both source and target dashboards expose the primary control-plane
    run_id selector. Alert dashboard does not preserve primary run_id when it does not own the primary
    identity selector. Record-level quarantine forensics use CLI bioetl quarantine inspect (Silver Reject
    Explorer dashboard removed 2026-07-23).
required_discoverable_inbound_paths:
  L1:
    bioetl-runtime:
    - source_uid: bioetl-overview-v2
      source_panel_id: 215
      source_panel_title: First Action
      source_status_row_panel_title_matcher: ^Provenance$
    bioetl-control-plane-v1:
    - source_uid: bioetl-overview-v2
      source_panel_id: 215
      source_panel_title: First Action
      source_status_row_panel_title_matcher: ^Provenance$
    bioetl-provider-health-v2:
