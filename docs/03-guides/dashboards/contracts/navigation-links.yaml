default_time_refresh_policy:
  L0:
    dashboards: [bioetl-overview-v2]
    time_from: now-12h
    refresh: 30s
  L1:
    dashboards: [bioetl-runtime, bioetl-control-plane-v1, bioetl-provider-health-v2, bioetl-dq-v2, bioetl-workflow-overview]
    time_from: now-12h
    refresh: 30s
  Alerts:
    dashboards: [bioetl-alerts-slo]
    time_from: now-24h
    refresh: 30s
  L2:
    dashboards: [bioetl-silver-reject-explorer]
    time_from: now-24h
    refresh: 1m

default_time_refresh_policy_exceptions: {}

time_handoff_requirements:
  dashboard_links:
    required_tokens:
      - ${__url_time_range}
  explore_links:
    required_tokens:
      - from=${__from}
      - to=${__to}


navigation_transition_contract:
  dashboard_levels:
    L0:
      dashboards: [bioetl-overview-v2]
      required_outbound: [bioetl-runtime, bioetl-control-plane-v1, bioetl-provider-health-v2, bioetl-dq-v2, bioetl-workflow-overview, bioetl-alerts-slo]
      required_inbound: []
    L1:
      dashboards: [bioetl-runtime, bioetl-control-plane-v1, bioetl-provider-health-v2, bioetl-dq-v2, bioetl-workflow-overview, bioetl-alerts-slo]
      required_outbound: [bioetl-overview-v2]
      required_inbound: [bioetl-overview-v2]
    L2:
      dashboards: [bioetl-silver-reject-explorer]
      required_outbound: [bioetl-overview-v2, bioetl-dq-v2]
      required_inbound: [bioetl-dq-v2]
  default_semantics_by_route_class:
    global_navigation:
      allowed_default_values: [unknown, All]
