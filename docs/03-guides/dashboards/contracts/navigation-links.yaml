normative_source:
  scope: link_vars_time_semantics
  authority: single_source_of_truth
  narrative_minimal: |
    This YAML is the only normative contract for dashboard link semantics,
    allowed/required/forbidden var-* handoff, and time handoff policy.
    Markdown guides are explanatory mirrors and MUST reference this file
    instead of redefining normative rules.

version: 1
required_top_level_links_by_uid:
  bioetl-overview-v2:
    - 2. Runtime
    - Control Plane v1
    - 3. Provider Health
    - 4. Data Quality
    - 6. Workflow Overview
    - Explore Logs (Loki, tracing profile)
    - Explore Traces (Tempo, tracing profile)
  bioetl-runtime:
    - Back to Overview
    - Control Plane v1
    - 3. Provider Health
    - 4. Data Quality
    - Explore Logs (Loki, tracing profile)
    - Explore Traces (Tempo, tracing profile)
  bioetl-control-plane-v1:
    - Back to Overview
    - 2. Runtime
    - 4. Data Quality
    - Explore Logs (Loki, tracing profile)
    - Explore Traces (Tempo, tracing profile)
  bioetl-provider-health-v2:
    - Back to Overview
    - 2. Runtime (Primary)
    - "2. Runtime (Contextual: provider mapping)"
    - Control Plane v1
    - Explore Logs (Loki, tracing profile)
    - Explore Traces (Tempo, tracing profile)
  bioetl-dq-v2:
    - Back to Overview
    - Control Plane v1
    - 5. Silver Reject Explorer
    - Explore Logs (Loki, tracing profile)
    - Explore Traces (Tempo, tracing profile)
  bioetl-silver-reject-explorer:
    - Back to Overview
    - Back to Data Quality
    - Explore Logs (Loki, tracing profile)
    - Explore Traces (Tempo, tracing profile)
  bioetl-workflow-overview:
    - Back to Overview
    - 2. Runtime
    - Control Plane v1
top_level_link_priority_by_uid:
  bioetl-overview-v2:
    - title: 2. Runtime
      target_uid: bioetl-runtime
      priority: primary
      semantics: scoped_runtime_handoff
    - title: Control Plane v1
      target_uid: bioetl-control-plane-v1
      priority: secondary
      semantics: scoped_control_plane_handoff
    - title: 3. Provider Health
      target_uid: bioetl-provider-health-v2
      priority: contextual
      semantics: provider_health_cross_scope
  bioetl-provider-health-v2:
    - title: 2. Runtime (Primary)
      target_uid: bioetl-runtime
      priority: primary
      semantics: runtime_cross_scope_all_defaults
    - title: "2. Runtime (Contextual: provider mapping)"
      target_uid: bioetl-runtime
      priority: contextual
      semantics: runtime_provider_context_mapping

required_link_vars_by_target_uid:
  bioetl-overview-v2: [pipeline, run_type]
  bioetl-control-plane-v1: [pipeline, run_type]
  bioetl-runtime: [pipeline, run_type]
  bioetl-dq-v2: [pipeline, run_type]
  bioetl-provider-health-v2: []
  bioetl-silver-reject-explorer: [pipeline, run_type]
  bioetl-workflow-overview: []
allowed_dashboard_link_vars:
  bioetl-overview-v2: [pipeline, run_type]
  bioetl-dq-v2: [pipeline, run_type, stage]
  bioetl-runtime: [pipeline, run_type, stage]
  bioetl-provider-health-v2: [provider, adapter]
  bioetl-control-plane-v1: [pipeline, run_type]
  bioetl-workflow-overview: [workflow, status]
  bioetl-silver-reject-explorer: [pipeline, run_type, reason_code, field, run_id, payload_hash]
forbidden_dashboard_link_vars_by_target_uid:
  bioetl-overview-v2: [run_id, payload_hash]
  bioetl-control-plane-v1: [run_id, payload_hash]
  bioetl-runtime: [run_id, payload_hash]
  bioetl-dq-v2: [run_id, payload_hash]
  bioetl-provider-health-v2: [run_id, payload_hash]
  bioetl-workflow-overview: [run_id, payload_hash]
  bioetl-silver-reject-explorer: []

required_discoverable_inbound_paths:
  L1:
    bioetl-runtime:
      - source_uid: bioetl-overview-v2
        source_panel_id: 215
        source_panel_title: Next Action
        source_status_row_panel_title_matcher: "^L0 Overview Scope$"
    bioetl-control-plane-v1:
      - source_uid: bioetl-overview-v2
        source_panel_id: 215
        source_panel_title: Next Action
        source_status_row_panel_title_matcher: "^L0 Overview Scope$"
    bioetl-provider-health-v2:
      - source_uid: bioetl-overview-v2
        source_panel_id: 215
        source_panel_title: Next Action
        source_status_row_panel_title_matcher: "^L0 Overview Scope$"
    bioetl-dq-v2:
      - source_uid: bioetl-overview-v2
        source_panel_id: 215
        source_panel_title: Next Action
        source_status_row_panel_title_matcher: "^L0 Overview Scope$"
    bioetl-workflow-overview:
      - source_uid: bioetl-overview-v2
        source_panel_id: 215
        source_panel_title: Next Action
        source_status_row_panel_title_matcher: "^L0 Overview Scope$"
  L2:
    bioetl-silver-reject-explorer:
      - source_uid: bioetl-dq-v2
        source_panel_id: 121
        source_panel_title: Top Silver Reject Reasons (Pareto)

required_panel_links_by_uid:
  bioetl-overview-v2:
    - panel_id: 208
      target_uid: bioetl-runtime
      link_titles: ["Open Runtime Drilldown", "Open Runtime status"]
    - panel_id: 209
      target_uid: bioetl-dq-v2
      link_titles: ["Open Data Quality Drilldown", "Open Data Quality status"]
    - panel_id: 210
      target_uid: bioetl-control-plane-v1
      link_titles: ["Open Control Plane Drilldown", "Open Control Plane status"]

default_time_refresh_policy:
  L0:
    dashboards: [bioetl-overview-v2]
    time_from: now-12h
    refresh: 30s
  L1:
    dashboards: [bioetl-runtime, bioetl-control-plane-v1, bioetl-provider-health-v2, bioetl-dq-v2, bioetl-workflow-overview]
    time_from: now-12h
    refresh: 30s
  L2:
    dashboards: [bioetl-silver-reject-explorer]
    time_from: now-24h
    refresh: 1m

default_time_refresh_policy_exceptions: {}

time_handoff_requirements:
  dashboard_links:
    required_tokens:
      - ${__url_time_range}
  explore_links:
    required_tokens:
      - from=${__from}
      - to=${__to}


navigation_transition_contract:
  dashboard_levels:
    L0:
      dashboards: [bioetl-overview-v2]
      required_outbound: [bioetl-runtime, bioetl-control-plane-v1, bioetl-provider-health-v2, bioetl-dq-v2, bioetl-workflow-overview]
      required_inbound: []
    L1:
      dashboards: [bioetl-runtime, bioetl-control-plane-v1, bioetl-provider-health-v2, bioetl-dq-v2, bioetl-workflow-overview]
      required_outbound: [bioetl-overview-v2]
      required_inbound: [bioetl-overview-v2]
    L2:
      dashboards: [bioetl-silver-reject-explorer]
      required_outbound: [bioetl-overview-v2, bioetl-dq-v2]
      required_inbound: [bioetl-dq-v2]
  default_semantics_by_route_class:
    global_navigation:
      allowed_default_values: [All]
    scoped_handoff:
      allowed_default_values: []
      inherit_scoped_values: true
  route_class_by_transition:
    bioetl-overview-v2->bioetl-runtime: scoped_handoff
    bioetl-overview-v2->bioetl-control-plane-v1: scoped_handoff
    bioetl-overview-v2->bioetl-provider-health-v2: global_navigation
    bioetl-overview-v2->bioetl-dq-v2: scoped_handoff
    bioetl-overview-v2->bioetl-workflow-overview: global_navigation
    bioetl-runtime->bioetl-overview-v2: scoped_handoff
    bioetl-runtime->bioetl-control-plane-v1: scoped_handoff
    bioetl-runtime->bioetl-provider-health-v2: global_navigation
    bioetl-runtime->bioetl-dq-v2: scoped_handoff
    bioetl-control-plane-v1->bioetl-overview-v2: scoped_handoff
    bioetl-control-plane-v1->bioetl-runtime: scoped_handoff
    bioetl-control-plane-v1->bioetl-dq-v2: scoped_handoff
    bioetl-provider-health-v2->bioetl-overview-v2: global_navigation
    bioetl-provider-health-v2->bioetl-runtime: global_navigation
    bioetl-dq-v2->bioetl-overview-v2: scoped_handoff
    bioetl-dq-v2->bioetl-control-plane-v1: scoped_handoff
    bioetl-dq-v2->bioetl-silver-reject-explorer: scoped_handoff
    bioetl-silver-reject-explorer->bioetl-overview-v2: scoped_handoff
    bioetl-silver-reject-explorer->bioetl-dq-v2: scoped_handoff
    bioetl-workflow-overview->bioetl-overview-v2: global_navigation
    bioetl-workflow-overview->bioetl-runtime: global_navigation
    bioetl-workflow-overview->bioetl-control-plane-v1: global_navigation
  incident_critical_reciprocal_paths:
    - [bioetl-runtime, bioetl-control-plane-v1]
    - [bioetl-control-plane-v1, bioetl-dq-v2]
    - [bioetl-dq-v2, bioetl-silver-reject-explorer]
  first_action_contract:
    bioetl-control-plane-v1:
      panel_id: 9001
      min_cta: 3
      max_cta: 4
    ctas:
      - title: Back to Overview
        expected_target_uid: bioetl-overview-v2
      - title: 2. Runtime
        expected_target_uid: bioetl-runtime
      - title: 4. Data Quality
        expected_target_uid: bioetl-dq-v2
      - title: Explore Logs (Loki, tracing profile)
        expected_target_uid: grafana-lokiexplore-app
  bioetl-provider-health-v2:
    panel_id: 9002
    min_cta: 3
    max_cta: 4
    ctas:
      - title: Back to Overview
        expected_target_uid: bioetl-overview-v2
      - title: 2. Runtime (Primary)
        expected_target_uid: bioetl-runtime
      - title: Control Plane v1
        expected_target_uid: bioetl-control-plane-v1
      - title: Explore Traces (Tempo, tracing profile)
        expected_target_uid: grafana-exploretraces-app
  bioetl-workflow-overview:
    panel_id: 9003
    min_cta: 3
    max_cta: 4
    ctas:
      - title: Back to Overview
        expected_target_uid: bioetl-overview-v2
      - title: 2. Runtime
        expected_target_uid: bioetl-runtime
      - title: Control Plane v1
        expected_target_uid: bioetl-control-plane-v1
  cross_scope_marker_contract:
    required_markers:
      reset_scope: "Reset scope"
      context_mapping: "Context mapping"
    required_titles_by_transition:
      bioetl-provider-health-v2->bioetl-overview-v2: reset_scope
      bioetl-provider-health-v2->bioetl-runtime: reset_scope
      bioetl-provider-health-v2->bioetl-runtime#context: context_mapping
      bioetl-provider-health-v2->bioetl-control-plane-v1: reset_scope
    required_tooltip_tokens:
      reset_scope: ["Reset scope"]
      context_mapping: ["Context mapping"]
  kpi_ownership:
    failed_runs_in_range:
      canonical_uid: bioetl-overview-v2
      mirror_panels:
        - dashboard_uid: bioetl-runtime
          panel_id: 205
    worst_lag_stage:
      canonical_uid: bioetl-overview-v2
      mirror_panels:
        - dashboard_uid: bioetl-runtime
          panel_id: 237
    worst_backlog_stage:
      canonical_uid: bioetl-overview-v2
      mirror_panels:
        - dashboard_uid: bioetl-runtime
          panel_id: 238
