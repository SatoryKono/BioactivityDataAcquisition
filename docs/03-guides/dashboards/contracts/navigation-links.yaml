  - bioetl-overview-v2
  - bioetl-provider-health-v2
  - bioetl-runtime
  - bioetl-incident-v1
  - bioetl-run-explorer-v1
  excluded_source_uids: []
  excluded_target_uids: []
  semantics: Preserve exact primary Run ID when both source and target dashboards
    expose the primary control-plane run_id selector. Alert dashboard does not preserve
    primary run_id when it does not own the primary identity selector. Record-level
    quarantine forensics use CLI bioetl quarantine inspect (Silver Reject Explorer
    dashboard removed 2026-07-23).
