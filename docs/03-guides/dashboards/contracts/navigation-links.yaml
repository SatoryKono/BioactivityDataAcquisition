default_time_refresh_policy:
  L0:
    dashboards: [bioetl-overview-v2]
    time_from: now-12h
    refresh: 30s
  L1:
    dashboards: [bioetl-runtime, bioetl-control-plane-v1, bioetl-provider-health-v2, bioetl-dq-v2, bioetl-workflow-overview]
    time_from: now-12h
    refresh: 30s
  L2:
    dashboards: [bioetl-silver-reject-explorer]
    time_from: now-24h
    refresh: 1m

default_time_refresh_policy_exceptions: {}

time_handoff_requirements:
  dashboard_links:
    required_tokens:
      - ${__url_time_range}
  explore_links:
    required_tokens:
      - from=${__from}
      - to=${__to}


navigation_transition_contract:
  dashboard_levels:
    L0:
      dashboards: [bioetl-overview-v2]
      required_outbound: [bioetl-runtime, bioetl-control-plane-v1, bioetl-provider-health-v2, bioetl-dq-v2, bioetl-workflow-overview]
      required_inbound: []
    L1:
      dashboards: [bioetl-runtime, bioetl-control-plane-v1, bioetl-provider-health-v2, bioetl-dq-v2, bioetl-workflow-overview]
      required_outbound: [bioetl-overview-v2]
      required_inbound: [bioetl-overview-v2]
    L2:
      dashboards: [bioetl-silver-reject-explorer]
      required_outbound: [bioetl-overview-v2, bioetl-dq-v2]
      required_inbound: [bioetl-dq-v2]
  default_semantics_by_route_class:
    global_navigation:
      allowed_default_values: [unknown, All]
    scoped_handoff:
      allowed_default_values: []
      inherit_scoped_values: true
    context_mapping:
      allowed_default_values: [unknown, All]
      inherit_scoped_values: true
  route_class_by_transition:
    bioetl-control-plane-v1->bioetl-overview-v2: scoped_handoff
    bioetl-control-plane-v1->bioetl-runtime: scoped_handoff
    bioetl-control-plane-v1->bioetl-provider-health-v2: context_mapping
    bioetl-control-plane-v1->bioetl-dq-v2: scoped_handoff
    bioetl-control-plane-v1->bioetl-silver-reject-explorer: scoped_handoff
    bioetl-control-plane-v1->bioetl-workflow-overview: global_navigation
    bioetl-overview-v2->bioetl-control-plane-v1: scoped_handoff
    bioetl-overview-v2->bioetl-runtime: scoped_handoff
    bioetl-overview-v2->bioetl-provider-health-v2: context_mapping
    bioetl-overview-v2->bioetl-dq-v2: scoped_handoff
    bioetl-overview-v2->bioetl-silver-reject-explorer: scoped_handoff
    bioetl-overview-v2->bioetl-workflow-overview: global_navigation
    bioetl-runtime->bioetl-control-plane-v1: scoped_handoff
    bioetl-runtime->bioetl-overview-v2: scoped_handoff
    bioetl-runtime->bioetl-provider-health-v2: context_mapping
    bioetl-runtime->bioetl-dq-v2: scoped_handoff
    bioetl-runtime->bioetl-silver-reject-explorer: scoped_handoff
    bioetl-runtime->bioetl-workflow-overview: global_navigation
    bioetl-provider-health-v2->bioetl-control-plane-v1: context_mapping
    bioetl-provider-health-v2->bioetl-overview-v2: context_mapping
    bioetl-provider-health-v2->bioetl-runtime: context_mapping
    bioetl-provider-health-v2->bioetl-dq-v2: context_mapping
    bioetl-provider-health-v2->bioetl-silver-reject-explorer: context_mapping
    bioetl-provider-health-v2->bioetl-workflow-overview: global_navigation
    bioetl-dq-v2->bioetl-control-plane-v1: scoped_handoff
    bioetl-dq-v2->bioetl-overview-v2: scoped_handoff
    bioetl-dq-v2->bioetl-runtime: scoped_handoff
    bioetl-dq-v2->bioetl-provider-health-v2: context_mapping
    bioetl-dq-v2->bioetl-workflow-overview: global_navigation
    bioetl-dq-v2->bioetl-silver-reject-explorer: scoped_handoff
    bioetl-silver-reject-explorer->bioetl-control-plane-v1: scoped_handoff
    bioetl-silver-reject-explorer->bioetl-overview-v2: scoped_handoff
    bioetl-silver-reject-explorer->bioetl-runtime: scoped_handoff
    bioetl-silver-reject-explorer->bioetl-provider-health-v2: context_mapping
    bioetl-silver-reject-explorer->bioetl-dq-v2: scoped_handoff
    bioetl-silver-reject-explorer->bioetl-workflow-overview: global_navigation
    bioetl-workflow-overview->bioetl-control-plane-v1: scoped_handoff
    bioetl-workflow-overview->bioetl-overview-v2: scoped_handoff
    bioetl-workflow-overview->bioetl-runtime: scoped_handoff
    bioetl-workflow-overview->bioetl-provider-health-v2: context_mapping
    bioetl-workflow-overview->bioetl-dq-v2: scoped_handoff
    bioetl-workflow-overview->bioetl-silver-reject-explorer: scoped_handoff
  incident_critical_reciprocal_paths:
    - [bioetl-runtime, bioetl-control-plane-v1]
    - [bioetl-control-plane-v1, bioetl-dq-v2]
    - [bioetl-dq-v2, bioetl-silver-reject-explorer]
  first_action_contract:
    bioetl-runtime:
      panel_id: 9991
      panel_title: First Action
      min_cta: 4
      max_cta: 4
      ctas:
        - title: Review current status
          expected_target_uid: bioetl-runtime
        - title: Review incident summary
          expected_target_uid: bioetl-runtime
        - title: Inspect top blockers
          expected_target_uid: bioetl-runtime
        - title: Inspect active blocker
          expected_target_uid: bioetl-runtime
    bioetl-provider-health-v2:
      panel_id: 9002
      panel_title: First Action
      min_cta: 3
      max_cta: 3
      ctas:
        - title: Review severity matrix
          expected_target_uid: bioetl-provider-health-v2
        - title: Inspect critical providers
          expected_target_uid: bioetl-provider-health-v2
        - title: Inspect provider top causes
          expected_target_uid: bioetl-provider-health-v2
    bioetl-dq-v2:
      panel_id: 9103
      panel_title: "Review: First Action"
      min_cta: 3
      max_cta: 3
      ctas:
        - title: Review current status
          expected_target_uid: bioetl-dq-v2
        - title: Inspect current reasons
          expected_target_uid: bioetl-dq-v2
        - title: Open Silver Reject Explorer
          expected_target_uid: bioetl-silver-reject-explorer
    bioetl-silver-reject-explorer:
      panel_id: 10
      panel_title: "Review: First Action / No-Data Semantics"
      min_cta: 2
      max_cta: 2
      ctas:
        - title: Review total rejects
          expected_target_uid: bioetl-silver-reject-explorer
        - title: Review scoped summary
          expected_target_uid: bioetl-silver-reject-explorer
  cross_scope_marker_contract:
    required_markers:
      reset_scope: "Reset scope"
      context_mapping: "Context mapping"
    required_titles_by_transition:
      bioetl-control-plane-v1->bioetl-provider-health-v2: context_mapping
      bioetl-control-plane-v1->bioetl-workflow-overview: reset_scope
      bioetl-provider-health-v2->bioetl-overview-v2: context_mapping
      bioetl-provider-health-v2->bioetl-runtime: context_mapping
      bioetl-provider-health-v2->bioetl-control-plane-v1: context_mapping
      bioetl-provider-health-v2->bioetl-dq-v2: context_mapping
      bioetl-provider-health-v2->bioetl-workflow-overview: reset_scope
      bioetl-overview-v2->bioetl-provider-health-v2: context_mapping
      bioetl-overview-v2->bioetl-workflow-overview: reset_scope
      bioetl-runtime->bioetl-provider-health-v2: context_mapping
      bioetl-runtime->bioetl-workflow-overview: reset_scope
      bioetl-dq-v2->bioetl-provider-health-v2: context_mapping
      bioetl-dq-v2->bioetl-workflow-overview: reset_scope
      bioetl-provider-health-v2->bioetl-silver-reject-explorer: context_mapping
      bioetl-silver-reject-explorer->bioetl-provider-health-v2: context_mapping
      bioetl-workflow-overview->bioetl-provider-health-v2: context_mapping
  provider_context_mapping_contract:
    source_dashboards:
      bioetl-control-plane-v1:
        provider_value: unknown
        adapter_value: null
      bioetl-overview-v2:
        provider_value: unknown
        adapter_value: unknown
      bioetl-runtime:
        provider_value: unknown
        adapter_value: unknown
      bioetl-dq-v2:
        provider_value: unknown
        adapter_value: unknown
      bioetl-silver-reject-explorer:
        provider_value: unknown
        adapter_value: unknown
      bioetl-silver-reject-explorer->bioetl-workflow-overview: reset_scope
      bioetl-workflow-overview->bioetl-provider-health-v2: context_mapping
    required_tooltip_tokens:
      reset_scope: ["Reset scope"]
      context_mapping: ["Context mapping"]
  kpi_ownership:
    failed_runs_in_range:
      canonical_uid: bioetl-overview-v2
      mirror_panels: []
    worst_lag_stage:
      canonical_uid: bioetl-overview-v2
      mirror_panels: []
    worst_backlog_stage:
      canonical_uid: bioetl-overview-v2
      mirror_panels: []
