# Content contract for the key panels listed in dashboard-inventory.yaml.
# Dashboard JSON remains the shipped presentation source of truth.
schema_version: 1
allowed_roles:
  - verdict
  - confidence
  - next_action
  - navigation
  - selected_range_count
  - selected_range_duration
  - identity_table
  - accounting_table
  - severity_table
  - causes_table
  - freshness
  - forensic_table
  - alert_timeline
allowed_scopes:
  - current
  - selected_run
  - time_range
  - global
allowed_evidence_sources:
  - prometheus
  - ops_http
  - grafana_builtin
allowed_states:
  - OK
  - WARN
  - CRIT
  - UNKNOWN
  - INCOMPLETE
  - ERROR
  - VALID_EMPTY
  - TELEMETRY_ABSENT
  - N/A

dashboards:
  bioetl-control-plane-v1:
    panels:
      "891":
        title: Monitor Replay Safety
        role: verdict
        tier: 1
        scope: current
        evidence_source: prometheus
        state_model: [OK, WARN, CRIT, UNKNOWN, INCOMPLETE, ERROR]
        required_copy: [state_mapping, evidence_scope, no_data, next_action]
        fixture_cases: [ok, warn, crit, telemetry_absent, backend_error]
        render_profiles: [first_window_dark, first_window_light, zoom_200]
      "130":
        title: Track Replay Blockers
        role: selected_range_count
        tier: 3
        scope: time_range
        evidence_source: prometheus
        state_model: [OK, WARN, CRIT, VALID_EMPTY, UNKNOWN, ERROR]
        required_copy: [evidence_scope, no_data, next_action]
        fixture_cases: [populated, valid_empty, telemetry_absent, backend_error]
        render_profiles: [full_dark]
      "9402":
        title: Review Run Summary
        role: identity_table
        tier: 2
        scope: selected_run
        evidence_source: ops_http
        state_model: [VALID_EMPTY, ERROR]
        required_copy: [evidence_scope, no_data]
        required_columns: [parameter, value]
        fixture_cases: [populated, valid_empty, backend_error]
        render_profiles: [full_dark]
      "9403":
        title: Review Processed Records
        role: accounting_table
        tier: 2
        scope: current
        evidence_source: ops_http
        state_model: [VALID_EMPTY, TELEMETRY_ABSENT, ERROR]
        required_copy: [evidence_scope, no_data]
        required_columns: [parameter, value, percentage]
        hidden_columns: [row_status]
        fixture_cases: [populated, valid_empty, telemetry_absent, backend_error]
        render_profiles: [full_dark]
      "9401":
        title: Monitor Replay Readiness
        role: confidence
        tier: 1
        scope: current
        evidence_source: prometheus
        state_model: [OK, WARN, CRIT, UNKNOWN, INCOMPLETE, ERROR]
