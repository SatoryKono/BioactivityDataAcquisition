    selector_variables:
      - workflow
      - pipeline
      - run_id
      - run_type
      - stage

  - uid: bioetl-workflow-overview
    title: "5. Workflow"
    owner: "@bioetl-observability"
    owner_route: docs/05-operations/runbooks/pipeline-failure-critical.md
    family: primary
    navigation_id: 5
    data_sources:
      - Prometheus
      - BioETL Ops HTTP
      - Grafana
    panel_count: 16
    key_panels:
      - id: 2
        title: "Failed Workflow Runs / Range"
        type: stat
        description: "Failed workflow runs in the selected range"
      - id: 5
        title: "Step Outcomes by Kind / Step Status / Range"
