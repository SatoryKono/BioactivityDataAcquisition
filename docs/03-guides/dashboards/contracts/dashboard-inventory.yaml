      - pipeline
      - run_id
      - run_type
      - status
      - step_status
      - step_kind
      - workflow_context
      - pipeline_context
      - pipeline_context_exact
      - run_type_context
      - run_type_context_exact
      - provider_context
      - provider_context_exact

  - uid: bioetl-alerts-slo
    title: "6. Alerts & SLO"
    owner: "@bioetl-observability"
    owner_route: docs/05-operations/runbooks/observability-checklist.md
    family: alert_triage
    navigation_id: 6
    data_sources:
      - Prometheus
      - Grafana
    panel_count: 7
    key_panels:
      - id: 1
        title: "Active Alert Status"
        type: stat
        description: "Fail-closed firing-alert status from the ALERTS metric family"
      - id: 5
        title: "Firing Alert Details"
        type: table
        description: "Firing alerts with an explicit Global/Pipeline/Run scope badge per row"
    selector_variables:
      - workflow
      - pipeline
      - run_type

# Contract metadata
contract_metadata:
  version: "1.1.0"
  last_updated: "2026-07-13"
  source_files:
    - "grafana/dashboards/bioetl-control-plane-v1.json"
    - "grafana/dashboards/bioetl-overview-v2.json"
    - "grafana/dashboards/bioetl-runtime.json"
    - "grafana/dashboards/bioetl-provider-health-v2.json"
    - "grafana/dashboards/bioetl-dq-v2.json"
    - "grafana/dashboards/bioetl-workflow-overview.json"
    - "grafana/dashboards/bioetl-alerts-slo.json"
  governance:
    - All seven shipped dashboards must include navigation panel id=1000
    - Navigation bus 0-6 (Logs/Traces explore links residual; Loki/Tempo stack removed)
    - KPI ownership mirrors must be documented in navigation-links.yaml
    - Selector contracts must match selector-contracts.yaml
    - Quarantine Explorer UI and Silver Reject Explorer dashboard were removed 2026-07-23
