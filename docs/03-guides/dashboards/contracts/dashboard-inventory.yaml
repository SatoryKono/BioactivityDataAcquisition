# Shipped 5-dashboard surface inventory (#6687).
# Source of truth for panel counts is grafana/dashboards/*.json.

dashboards:
  - uid: bioetl-control-plane-v1
    title: 0. Trust
    owner: "@bioetl-observability"
    owner_route: docs/05-operations/runbooks/run-manifest-inspection.md
    family: primary
    navigation_id: 0
    data_sources:
      - Prometheus
      - BioETL Ops HTTP
      - Grafana
    panel_count: 58
    key_panels:
      - id: 891
        title: "Monitor: Replay Safety State"
        type: stat
        description: Current replay safety state for selected pipeline
      - id: 130
        title: "Track: Replay / Resume Blockers in Range"
        type: stat
        description: Replay and resume blockers in selected time range
      - id: 9402
        title: ID
        type: table
        description: Shared shell panel for run/manifest identity
      - id: 9403
        title: Processed Records
        type: table
        description: Shared shell panel for Bronze/Silver/Gold accounting
      - id: 9401
        title: Status
        type: stat
        description:
          Evidence-aware replay/resume verdict; required evidence gaps render
          INCOMPLETE
    selector_variables:
      - workflow
      - pipeline
      - run_id
      - run_type
  - uid: bioetl-overview-v2
    title: 1. Overview
    owner: "@bioetl-observability"
    owner_route: docs/05-operations/runbooks/observability-checklist.md
    family: primary
    navigation_id: 1
    data_sources:
      - Prometheus
      - BioETL Ops HTTP
      - Grafana
    panel_count: 26
    key_panels:
      - id: 214
        title: Status
        type: stat
        description: Current system status summary
      - id: 215
        title: First Action
        type: table
        description: Recommended first action for current state
      - id: 1000
        title: Navigation
        type: text
        description: Theme-safe wrapping navigation bus (0-4 shipped surface)
    selector_variables:
      - workflow
      - pipeline
      - run_id
      - run_type
  - uid: bioetl-runtime
    title: 2. Pipeline Diagnostics
    owner: "@bioetl-observability"
    owner_route: docs/05-operations/runbooks/pipeline-failure-critical.md
    family: primary
    navigation_id: 2
    data_sources:
      - Prometheus
      - BioETL Ops HTTP
      - Grafana
    panel_count: 41
    key_panels:
      - id: 9401
        title: Status
        type: stat
        description: Trust-gated current runtime health status
      - id: 205
        title: Failed Runs
        type: stat
        description: Failed runs in the selected range
      - id: 237
        title: Worst Stage Lag
        type: stat
        description: Worst observed stage lag in the selected range
      - id: 9102
        title: Runtime Telemetry Gap
        type: stat
        description: Scrape/rule trust gate; a gap forces the headline to INCOMPLETE
    selector_variables:
      - workflow
      - pipeline
      - provider_hint
      - run_id
      - run_type
      - stage
  - uid: bioetl-provider-health-v2
    title: 3. Provider Health
    owner: "@bioetl-observability"
    owner_route: docs/05-operations/runbooks/incident-response.md
    family: primary
    navigation_id: 3
    data_sources:
      - Prometheus
      - BioETL Ops HTTP
      - Grafana
    panel_count: 31
    key_panels:
      - id: 9101
        title: Monitor GLOBAL Provider Severity Matrix
        type: table
        description: Provider health severity matrix
      - id: 9103
        title: Inspect Provider Top Causes
        type: table
        description: Top causes of provider failures
    selector_variables:
      - workflow
      - pipeline
      - run_type
      - run_id
      - provider
      - pipeline_context
      - adapter
  - uid: bioetl-dq-v2
    title: 4. Data Quality
    owner: "@bioetl-observability"
    owner_route: docs/05-operations/runbooks/dq-failure-investigation.md
    family: primary
    navigation_id: 4
    data_sources:
      - Prometheus
      - BioETL Ops HTTP
      - Grafana
    panel_count: 37
    key_panels:
      - id: 9401
        title: Status
        type: stat
        description: Current DQ status summary
      - id: 9101
        title: Monitor DQ Threshold State
        type: stat
        description: DQ threshold violation state
      - id: 9102
        title: Inspect DQ Current Reasons
        type: table
        description: Current DQ violation reasons breakdown
      - id: 8
        title: Time Range · Worst Freshness Age (hours; SLA 24/72)
        type: gauge
        description: TIME RANGE freshness age in hours with WARN 24h and CRIT 72h
    selector_variables:
      - workflow
      - pipeline
      - run_id
      - run_type
      - stage
