# Canonical Run Explorer Infinity HTTP targets (V5 R-B).
# Source of truth for panel URL / root_selector / empty-state taxonomy.
# Dashboard JSON stays hand-edited for layout; CI fails if a target drifts.

schema_version: 1
dashboard_uid: bioetl-run-explorer-v1
dashboard_path: grafana/dashboards/bioetl-run-explorer-v1.json

infinity:
  type: json
  source: url
  format: table
  parser: backend
  method: GET

# Shared URL templates. Panels bind to one endpoint; duplicates must share
# the same endpoint_id so identity/accounting/report slices cannot drift apart.
endpoints:
  pipeline_run_reports:
    path: /ops/observability/pipeline-run-reports
    required_query: [pipeline]
    # view=recent merges manifest/ledger launches and report previews, filters
    # Workflow/Run Type, and ranks started_at before a global limit.
    # List items include identity peeks started_at, run_type, workflow_id,
    # workflow_run_id so panel 3010 can bind var-run_type from the row.
    # Recent rows also expose report_url (Grafana Ops proxy, exact row identity),
    # report_format (md/json artifact token, null when absent), and report_label.
    # Open report prefers an existing Markdown file, falling back to JSON.
    # REPORT MISSING links to the exact lookup with explicit 404 feedback.
    # Run ID has Select this run (same dashboard, writes $run_id) plus Report.
  identity_table:
    path: /ops/control-plane/identity-table
    required_query: [pipeline, run_type, run_id]
  processed_records:
    path: /ops/observability/processed-records
    required_query: [pipeline, run_type, run_id]
  pipeline_run_report:
    path: /ops/observability/pipeline-run-report
    required_query: [pipeline, run_id]
  workflow_run_reports:
    path: /ops/observability/workflow-run-reports
    required_query: [workflow]
  selected_run_status:
    path: /ops/observability/selected-run-status
    required_query: [pipeline, run_id, run_type, workflow]

panels:
  - id: 3010
    title: Inspect Recent Runs (last 20)
    endpoint: pipeline_run_reports
    url: /ops/observability/pipeline-run-reports?pipeline=${pipeline:percentencode}&limit=20&run_id=${run_id:percentencode}&view=recent&workflow=${workflow:percentencode}&run_type=${run_type:percentencode}&lookup_run_id=${lookup_run_id:percentencode}
    root_selector: >-
      (
        $text := function($value) {
          $type($value) = "string" ? ($value != "" ? $value : "N/A") : "N/A"
        };
        $passport := function($url, $kind) {
          $type($url) = "string" ?
            ($contains($url, /^https:\/\/github\.com\/SatoryKono\/BioactivityDataAcquisition\/blob\/main\/docs\/04-reference\/passports\/(workflows|pipelines)\/[A-Za-z0-9%._-]+\.md$/)
              and $contains($url, "/passports/" & $kind & "/") ?
                $substringAfter($url, "https://github.com/SatoryKono/BioactivityDataAcquisition/") : "") : ""
        };
        index_state = "valid_empty" and $exists(items) and $count(items) = 0 ?
          [{
            "pipeline": "VALID EMPTY", "pipeline_label": "VALID EMPTY",
            "workflow_id": "N/A", "provider": "N/A", "run_id": "", "run_label": "—",
            "run_type": "", "workflow_scope": "", "started_at": null,
            "duration_display": "N/A", "status": "N/A", "saved_evidence_status": "N/A",
            "data_quality_status": "N/A", "replay_readiness_status": "N/A",
            "report_label": "", "report_url": "", "workflow_passport_url": "",
            "workflow_passport_path": "", "pipeline_passport_url": "", "pipeline_passport_path": ""
          }] :
          items.(
            $provider := $type(provider) = "string" ? provider : "";
            $pipelineValue := $text(pipeline);
            $run := $type(run_id) = "string" ? run_id : "";
            $prefix := $provider & "_";
            $pipelinePath := $passport(pipeline_passport_url, "pipelines");
            $merge([$, {
              "workflow_id": $text(workflow_id),
              "run_label": $run != "" ? ($length($run) > 8 ? $substring($run, 0, 8) & "…" : $run) : "N/A",
              "pipeline_label": $provider != "" ?
                ($substring($pipelineValue, 0, $length($prefix)) = $prefix ?
                  $substring($pipelineValue, $length($prefix)) : $pipelineValue) : $pipelineValue,
              "workflow_passport_path": $passport(workflow_passport_url, "workflows"),
              "pipeline_passport_path": $pipelinePath,
              "pipeline_passport_url": $pipelinePath != "" ?
                "https://github.com/SatoryKono/BioactivityDataAcquisition/" & $pipelinePath : ""
            }])
          )
      )
    no_value_tokens: [N/A]
    copy_tokens: [VALID EMPTY, QUERY ERROR, tree_missing]
