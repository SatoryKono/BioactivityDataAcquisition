normative_source:
  scope: selector_taxonomy_registry_semantics
  authority: single_source_of_truth
  narrative_minimal: |
    This YAML is the only normative contract for Grafana selector taxonomy,
    dashboard-family selector eligibility, shipped selector registry, hidden
    handoff semantics, and future execution-selector design gates.
    Markdown guides are explanatory mirrors and MUST reference this file
    instead of redefining normative selector behavior.

version: 1

selector_taxonomy:
  scope:
    - pipeline
    - workflow
    - provider
    - stage
  state:
    - run_type
    - status
    - step_status
    - step_kind
  execution_future:
    - run_selector_mode
    - started_at
    - run_id
    - manifest_id
    - execution_fingerprint
  context_hidden:
    shipped:
      - workflow_context
      - pipeline_context
      - pipeline_context_exact
      - run_type_context
      - run_type_context_exact
      - provider_context
      - provider_context_exact
      - adapter
    reserved_future:
      - selected_run_id
      - selected_manifest_id
      - selected_started_at
  forensic_only:
    - reason_code
    - field
    - quarantine_run_id
    - payload_hash
    - manifest_id
    - execution_fingerprint

operator_safe_visible_classes:
  - scope
  - state

operator_context_shell:
  status: shipped_context_shell
  visible_selectors:
    - workflow
    - pipeline
    - run_type
    - run_id
  cross_dashboard_handoff_selectors:
    - workflow
    - pipeline
    - run_type
  preserved_identity_handoff_selectors:
    - run_id
  local_identity_selectors:
    - run_id
  semantics: |
    The operator context shell standardizes the top-level context controls
    across primary dashboards. It does not make every selector a first-class
    PromQL filter for every dashboard. `workflow` is context/evidence unless a
    dashboard explicitly documents truthful intersection semantics. `run_id` is
    control-plane identity context: it is loaded from the local run-manifest
    catalog, preserved between primary dashboards that expose the same
    `run_id` selector, and MUST NOT be used as a Prometheus label. Dashboard-to-
    dashboard links pass the shared shell (`workflow`, `pipeline`, `run_type`)
    plus the preserved exact identity (`run_id`) explicitly with target-scoped
    `var-*` parameters; native Grafana variable copying by label or semantic
    meaning is not relied on. Generic links MUST NOT map primary `run_id` to
    Silver `quarantine_run_id`.
  primary_selector_rule: |
    Dashboard families retain their role-specific primary selectors. Provider
    Health remains provider-first; Workflow remains selected-range workflow
    evidence; pipeline-summary dashboards remain pipeline/run_type current-state
    surfaces.

pipeline_universe_contract:
  status: shipped
  canonical_user_facing_metric: bioetl_overview_pipeline_run_type_universe
  canonical_relation: |
    bioetl_overview_pipeline_run_type_universe is an exact recording-rule alias
    of bioetl_runtime_pipeline_run_type_universe. The two metrics MUST expose
    identical (pipeline, run_type) label sets; they are not separate user
    universes.
  shared_selector_uids:
    - bioetl-overview-v2
    - bioetl-runtime
    - bioetl-provider-health-v2
    - bioetl-dq-v2
    - bioetl-workflow-overview
    - bioetl-alerts-slo
  shared_query_metrics:
    bioetl-overview-v2: bioetl_overview_pipeline_run_type_universe
    bioetl-runtime: bioetl_runtime_pipeline_run_type_universe
    bioetl-provider-health-v2: bioetl_overview_pipeline_run_type_universe
    bioetl-dq-v2: bioetl_overview_pipeline_run_type_universe
    bioetl-workflow-overview: bioetl_overview_pipeline_run_type_universe
    bioetl-alerts-slo: bioetl_overview_pipeline_run_type_universe
  role_local_exceptions:
    bioetl-control-plane-v1:
      query_metric: bioetl_control_plane_run_type_universe
      required_relation: provenance_gated_overlap
      allowed_role_local_only_sources:
        - bioetl_control_plane_manifest_writes_total
      allowed_canonical_only_sources:
        - bioetl_pipeline_runs_total
        - bioetl_records_processed_total
      shared_planned_source: bioetl_workflow_pipeline_expected
      unexplained_difference_count_required: 0
      reason: |
        Control Plane lists scopes with manifest evidence or an explicitly
        planned workflow child. A manifest-only in-flight scope can therefore
        appear before canonical data-plane telemetry, while a pipeline with
        only data-plane telemetry is intentionally ineligible for this local
        selector. Every difference MUST be explained by the declared source
        families; unexplained divergence is forbidden.
      out_of_scope_handoff: fail_closed_with_overview_return_path
    bioetl-silver-reject-explorer:
      query_metric: bioetl_records_processed_total
      required_relation: subset_of_canonical_user_facing_metric
      reason: |
        The forensic backend requires one concrete pipeline with processed-row
        evidence. Planned-only and control-plane-only scopes are intentionally
        ineligible until reject data exists.
      out_of_scope_handoff: require_concrete_pipeline_or_show_typed_empty_state
  handoff_rules:
    - Shared-selector links MUST preserve pipeline only when the destination
      accepts the canonical user-facing universe.
    - Links into a role-local exception MUST provide an explicit fail-closed
      empty state or return path; silent blank panels are forbidden.
    - Silver Reject Explorer MUST NOT widen beyond the canonical user-facing
      metric because processed-row evidence is part of that universe.
    - Control Plane role-local-only scopes MUST be backed by manifest-write
      provenance; canonical-only scopes MUST be explainable by data-plane
      telemetry without a manifest artifact.
  closure_evidence:
    required_dashboard_count: 8
    shared_required_chembl_pipeline_count: 15
    shared_required_missing_count: 0
    verify_exact_shared_relation: true
    verify_control_plane_provenance_gated_overlap: true
    verify_explorer_subset_relation: true
    required_unexplained_difference_count: 0
    latest_live_evidence:
      path: reports/observability/grafana/selector-audit-2026-07-20/selector-evidence.json
      schema_version: 1
      issue_number: 6359
      captured_at_utc: "2026-07-20T08:05:54Z"
      expected_verdict: pass
      require_relevant_runtime_paths_clean: true
      require_live_dashboard_count: 8
      require_complete_navigation_links: true

dashboard_families:
  pipeline_summary:
    uids:
      - bioetl-control-plane-v1
      - bioetl-runtime
      - bioetl-dq-v2
    allowed_visible_selectors:
      - workflow
      - pipeline
      - run_type
      - run_id
    optional_visible_selectors:
      - stage
    notes: |
      Pipeline-summary dashboards answer pipeline-scoped operator questions and
      remain Prometheus-first. The shared context shell may expose workflow and
      run_id, but workflow is context/evidence only and run_id is HTTP-backed
      identity context only. They MUST NOT use run_id as a Prometheus label or
      claim exact run selection for current-status PromQL.
      When a single-pipeline workflow hands off into these dashboards, shipped
      PromQL may tolerate legacy `workflow_<pipeline>` emitted series as a
      bounded compatibility alias for the selected entity pipeline scope.
      Control Plane first-screen current-status queries additionally normalize
      a manually selected `workflow_<pipeline>` value back to the entity
      pipeline before reading current-state recording rules. Runtime current-
      triage panels apply the same normalization for current status, blocker,
      error-rate, lag, and active-blocker drilldown queries.
  hybrid_overview:
    uids:
      - bioetl-overview-v2
    allowed_visible_selectors:
      - workflow
      - pipeline
      - run_type
      - run_id
    notes: |
      The canonical Overview dashboard (`bioetl-overview-v2`) uses the frozen
      Overview v3 hybrid layout as its baseline. Hybrid Overview keeps pipeline-
      summary current-status semantics, adds a visible workflow evidence-
      context selector, and exposes run_id from the local control-plane run-
      manifest catalog for identity handoff. Grafana `All` values MAY expand
      the catalog scope, but the dashboard MUST NOT claim one manifest identity
      for aggregate pipeline scope unless an exact `run_id` is selected. It MAY
      resolve selected manifest identity for the `ID` panel, but it MUST NOT
      claim that run_id changes aggregate current-status PromQL semantics.
  provider_first:
    uids:
      - bioetl-provider-health-v2
    allowed_visible_selectors:
      - workflow
      - pipeline
      - run_type
      - run_id
      - provider
    hidden_context_selectors:
      - pipeline_context
    hidden_detail_selectors:
      - adapter
    notes: |
      Provider Health is provider-first. The shared context shell is secondary
      identity/evidence context only. pipeline_context preserves return-path
      context and MUST NOT be treated as a first-class provider business filter.
  workflow_evidence:
    uids:
      - bioetl-workflow-overview
    allowed_visible_selectors:
      - workflow
      - pipeline
      - run_type
      - run_id
      - status
      - step_status
      - step_kind
    hidden_context_selectors:
      - workflow_context
      - pipeline_context
      - pipeline_context_exact
      - run_type_context
      - run_type_context_exact
      - provider_context
      - provider_context_exact
    notes: |
      Workflow Overview is selected-range workflow evidence only. It does not
      use visible pipeline/run_type/run_id selectors as live execution filters,
      but the shared context shell can expose them for local identity/evidence
      context. It preserves hidden single-pipeline handoff context for
      downstream operator dashboards and ships exact-run-aware hidden handoff
      vars so selected `run_id` can narrow downstream links without rewriting
      the visible shell.
      Downstream dashboards remain entity-scoped at the UX layer even when
      some emitted series still require a temporary `workflow_<pipeline>` query
      alias during migration.
  forensic_explorer:
    uids:
      - bioetl-silver-reject-explorer
    allowed_visible_selectors:
      - pipeline
      - run_type
      - reason_code
      - field
      - quarantine_run_id
      - payload_hash
    notes: |
      Silver Reject Explorer is the only shipped forensic explorer. It may
      surface exact reject/run selectors, but those selectors MUST use
      forensic-specific names such as `quarantine_run_id` and MUST NOT leak into
      Prometheus dashboards or generic dashboard-to-dashboard links. The
      backend API parameter can still be `run_id`; the Grafana variable name is
      deliberately not `run_id` to avoid colliding with the Control Plane
      identity shell.
  alert_triage:
    uids:
      - bioetl-alerts-slo
    allowed_visible_selectors:
      - workflow
      - pipeline
      - run_type
    notes: |
      Alerts & SLO is a Prometheus-backed alert-triage surface. It reuses the
      shared workflow/pipeline/run_type context shell for alert evidence only
      and intentionally does not expose `run_id` or forensic selectors.

