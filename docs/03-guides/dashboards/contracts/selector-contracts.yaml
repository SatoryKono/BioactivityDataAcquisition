    - no_prometheus_label_explosion
    - supports_latest_previous_exact_resolution
  minimum_fields:
    - run_id
    - pipeline_name
    - workflow_name
    - run_type
    - started_at
    - manifest_id
    - status
  optional_fields:
    - provider
    - execution_fingerprint
  source_candidates:
    - manifest_index
    - ledger_index
    - local_api
    - lightweight_table_backed_index

