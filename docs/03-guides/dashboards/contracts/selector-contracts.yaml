hidden_handoff_contract:
  allowed_shipped_vars:
    - workflow_context
    - pipeline_context
    - pipeline_context_exact
    - run_type_context
    - run_type_context_exact
    - provider_context
    - provider_context_exact
    - provider_hint
  detail_only_shipped_vars:
    - adapter
  reserved_future_vars:
    - selected_run_id
    - selected_manifest_id
    - selected_started_at
  forbidden_cross_dashboard_forensic_vars:
    - quarantine_run_id
    - payload_hash
    - manifest_id
    - execution_fingerprint
  rules:
    - Hidden vars preserve navigation or detail-only scope and do not
      automatically become visible top-level selectors.
    - Visible selectors MUST NOT be propagated implicitly with blanket
      includeVars semantics.

control_plane_selector_context_contract:
  status: shipped
  endpoint: /ops/control-plane/selector-context
  filter_options_endpoint: /ops/control-plane/filter-options
  local_only: true
  source_priority:
    - run_manifest_catalog
    - run_ledger_terminal_events
  visible_selector_resolution:
    selected_run_id: exact_run_identity_wins
    workflow_pipeline_run_type: latest_terminal_run_for_scope
  fallback_rules:
    - run_id_default_dash_means_no_exact_run_selected
    - terminal_time_uses_run_ledger_event_when_present
    - manifest_created_at_is_fallback_only
    - filter_options_run_id_includes_dash_default
  forbidden:
    - prometheus_run_id_labels
    - blanket_includevars_run_id_handoff
    - run_id_handoff_to_forensic_explorer
    - cyclic_grafana_variable_dependencies
  notes: |
    The shipped control-plane selector resolver provides coherent local selector
    context for the shared dashboard shell and HTTP-backed identity surfaces.
    Native Grafana query variables can consume its option lists, but they cannot
    safely auto-write sibling visible selector values without a custom selector
    shell or plugin. Workflow Overview MAY consume `exact_run_only=1`
    filter-options helpers for hidden handoff vars so exact `run_id` can narrow
    downstream dashboard links without rewriting the visible selector shell.
    The repo also ships an optional local pilot panel plugin at
    `grafana/plugins/bioetl-selectorshell-panel` for same-dashboard visible
    selector synchronization, but shipped dashboard JSON does not depend on
    that unsigned plugin yet.
    Primary-dashboard links preserve selected `run_id` only as HTTP identity
    context. Current-status PromQL remains selected-scope, not exact run-id
    scoped.

run_catalog_future_contract:
  status: design_only_for_execution_filtering
  local_only: true
  required_source_properties:
