# DASH-FIT-004: browser-rounding tolerance only. Not a layout exemption.
panel_containment_tolerance_px: 2

# First-window types that fail closed on internal scroll overflow.
# Must cover every shipped first-window panel type. Adding a new type to
# the first window without listing it here fails the no-scroll gate.
first_window_containment_types:
