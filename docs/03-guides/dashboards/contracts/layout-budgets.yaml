    retire_when: the banner can keep a native title without overflowing at 200%
  - dashboard: bioetl-incident-v1.json
    id: 9400
    owner: "@bioetl-observability"
    rationale: >-
      Native title omitted so Understand Incident Scope body fits DASH-FIT-004.
      Display title stays in bioetlDisplayTitle.
    retire_when: the banner can keep a native title without overflowing at 200%
  - dashboard: bioetl-provider-health-v2.json
    id: 9400
    owner: "@bioetl-observability"
    rationale: >-
      Native title omitted so Understand Evidence Scope body fits DASH-FIT-004.
      Display title stays in bioetlDisplayTitle.
    retire_when: the banner can keep a native title without overflowing at 200%
  - dashboard: bioetl-provider-health-v2.json
    id: 9002
    owner: "@bioetl-observability"
    rationale: >-
      Native title omitted so h=2 Start Provider Triage fits DASH-FIT-004.
