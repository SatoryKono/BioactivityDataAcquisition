version: 1
source: grafana/dashboards/*.json
mode: error
note: >-
  Distinct fold constants for the seven shipped dashboards. Do not unify
  first_window_y with first_load_y_max. first_load_y_max MUST stay equal to
  performance-budgets.yaml:first_screen_y_max.

# Answer band / area-fill / visual fold (DASHBOARD_REQUIREMENTS.md §2).
first_window_y: 18
# A collapsed one-row header may occupy y=17..18; detail data starts at y=18.
# This packs the grid after the measured 17-row answer band without a blank row.

# PromQL/HTTP first-load selection window. Not the visual fold.
first_load_y_max: 28

# DASH-FIT-001 no-scroll ceiling for always-visible root non-row panels.
# Calibrated 2026-08-14 against the repo 1366x768 first-viewport contract
# (grafana README render matrix + Grafana grid GRID_CELL_HEIGHT=30,
# GRID_CELL_VMARGIN=8 => stride 38px). Panel bottom px = 38*(y+h)-8.
# Historical kiosk=tv calibration used ~88px chrome. Grafana 12 accepts
# kiosk=1 (full); tv leaves navigation visible. Full kiosk retains filters:
# two variable rows place the grid at 104px and require bottom <= 17 for
# 1366x768. The DOM fold gate enforces the actual viewport independently
# of this unchanged static ceiling. Equals FIRST_WINDOW_Y by design.
viewport_rows: 18

# Regression cap on always-visible first-window budget panels (current max = 8).
# Count = root non-row panels with y < first_window_y, excluding navigation
# (id 1000 or title Navigate*) and named empty-title text rails below.
# Do not raise this cap. #8980.
first_screen_max_panels: 8

# Empty-title text rails that are not budget panels (next-step / divider).
# Not an exemption from an over-budget layout: they are outside the count set.
first_screen_shell_panels:
  - dashboard: bioetl-overview-v2.json
    id: 99
    owner: "@bioetl-observability"
    rationale: >-
      Native title omitted so h=3 Inspect Scope & Evidence body fits DASH-FIT-004.
      Display title stays in bioetlDisplayTitle.
    retire_when: the banner can keep a native title without overflowing at 200%
  - dashboard: bioetl-run-explorer-v1.json
    id: 1
    owner: "@bioetl-observability"
    rationale: >-
      Native title omitted so h=3 Understand Run Scope body fits DASH-FIT-004.
      Display title stays in bioetlDisplayTitle.
    retire_when: the banner can keep a native title without overflowing at 200%
  - dashboard: bioetl-control-plane-v1.json
    id: 906
    owner: "@bioetl-observability"
    rationale: >-
      First-window next-step rail stays readable at h=3 full width when
      navigation is h=4. Native Grafana header is omitted; copy stays inside
      the HTML body at 16px. Display title stays in bioetlDisplayTitle.
      Trust/Retention tables compact to h=4 so the CTA occupies y=11..13
      and the KPI strip stays y=14 h=3 with no shared grid cells.
    retire_when: the CTA can keep a native title without overflowing at 200%
  - dashboard: bioetl-control-plane-v1.json
    id: 9400
    owner: "@bioetl-observability"
    rationale: >-
      Native title omitted so h=4 Inspect Scope & Evidence body fits DASH-FIT-004.
      Display title stays in bioetlDisplayTitle.
    retire_when: the banner can keep a native title without overflowing at 200%
  - dashboard: bioetl-runtime.json
    id: 9400
    owner: "@bioetl-observability"
    rationale: >-
      Native title omitted so Understand Pipeline Scope body fits DASH-FIT-004.
      Display title stays in bioetlDisplayTitle.
    retire_when: the banner can keep a native title without overflowing at 200%
  - dashboard: bioetl-dq-v2.json
    id: 9400
    owner: "@bioetl-observability"
    rationale: >-
      Native title omitted so Understand Evidence Scope body fits DASH-FIT-004.
