version: 1
source: grafana/dashboards/*.json
mode: error
note: >-
  Distinct fold constants for the seven shipped dashboards. Do not unify
  first_window_y with first_load_y_max. first_load_y_max MUST stay equal to
  performance-budgets.yaml:first_screen_y_max.

# Answer band / area-fill / visual fold (DASHBOARD_REQUIREMENTS.md §2).
first_window_y: 18

# PromQL/HTTP first-load selection window. Not the visual fold.
first_load_y_max: 28

# DASH-FIT-001 no-scroll ceiling for always-visible root non-row panels.
# Calibrated 2026-08-14 against the repo 1366x768 first-viewport contract
# (grafana README render matrix + Grafana grid GRID_CELL_HEIGHT=30,
# GRID_CELL_VMARGIN=8 => stride 38px). Panel bottom px = 38*(y+h)-8.
# kiosk=tv / first-viewport chrome (~88px) => floor((768-88+8)/38)=18.
# kiosk=off with two variable rows is tighter (~15-16) and is a future
# tightening, not this constant. Equals FIRST_WINDOW_Y by design.
viewport_rows: 18

# Regression cap on always-visible first-window budget panels (current max = 8).
# Count = root non-row panels with y < first_window_y, excluding navigation
# (id 1000 or title Navigate*) and named empty-title text rails below.
# Do not raise this cap. #8980.
first_screen_max_panels: 8

# Empty-title text rails that are not budget panels (next-step / divider).
# Not an exemption from an over-budget layout: they are outside the count set.
first_screen_shell_panels:
  - dashboard: bioetl-control-plane-v1.json
    id: 906
    owner: "@bioetl-observability"
    rationale: >-
      Next-step rail; native title omitted so h=2 does not scroll. Instruction
      copy, not a data-bearing or nav panel.
    retire_when: rail is merged into panel 9400 or moved to y >= first_window_y
  - dashboard: bioetl-provider-health-v2.json
    id: 9002
    owner: "@bioetl-observability"
    rationale: >-
      Native title omitted so h=2 Start Provider Triage fits DASH-FIT-004.
      Growing h=3 would push Monitor Telemetry Presence (9104) past VIEWPORT_ROWS.
    retire_when: the CTA can use h=3 without folding 9104 past row 18
  - dashboard: bioetl-dq-v2.json
    id: 9103
    owner: "@bioetl-observability"
    rationale: >-
      Native title omitted so h=3 Start DQ Triage body fits DASH-FIT-004.
      Display title stays in bioetlDisplayTitle.
    retire_when: the CTA can keep a native title without overflowing at 200%
  - dashboard: bioetl-incident-v1.json
    id: 2001
    owner: "@bioetl-observability"
    rationale: >-
      Native title omitted so h=3 Start Incident Triage body fits DASH-FIT-004.
      Display title stays in bioetlDisplayTitle.
    retire_when: the CTA can keep a native title without overflowing at 200%
  - dashboard: bioetl-runtime.json
    id: 9991
    owner: "@bioetl-observability"
    rationale: >-
      Native title omitted so h=3 Start Pipeline Triage body fits DASH-FIT-004.
      Display title stays in bioetlDisplayTitle.
    retire_when: the CTA can keep a native title without overflowing at 200%

min_height:
  root:
    table: 5
    timeseries: 5
    heatmap: 5
    state-timeline: 5
    stat: 3
    gauge: 3
    bargauge: 3
    text: 2
  nested:
    table: 4
    timeseries: 5
    heatmap: 5
    state-timeline: 5
    stat: 3
    gauge: 3
    bargauge: 3
    text: 2

canonical_action_verbs:
  - Monitor
  - Inspect
  - Track
  - Compare
  - Review
  - Investigate

# Empty: DASH-COPY-003 is exclusive. Text/row/shell titles are exempt and
# may still use Navigate/Understand/Start/Assess/Explain/Continue.
pending_action_verbs: []

shell_titles:
  - Status
  - ID
  - Processed Records

banned_title_tokens:
  - panel
  - panel title
  - new panel
  - new dashboard
  - stat
  - graph
  - table
  - text
  - untitled
  - row
  - row title

data_panel_types:
  - stat
  - gauge
  - bargauge
  - table
  - timeseries
  - heatmap
  - state-timeline

# DASH-FIT-004: browser-rounding tolerance only. Not a layout exemption.
panel_containment_tolerance_px: 2

# First-window types that fail closed on internal scroll overflow.
# Must cover every shipped first-window panel type. Adding a new type to
# the first window without listing it here fails the no-scroll gate.
first_window_containment_types:
  - text
  - stat
  - table

# DASH-FIT-005: every first-window table must declare a bounded first-screen
# row cap. bind is how the JSON enforces it (topk / limit / filter).
# DASH-SCOPE #9019 panel-id map (progressive, not delete-first):
# bioetl-provider-health-v2 9102/9103 moved under row 9106
# (Inspect Fleet Non-OK and Causes). First-window reason replacement: 9107.
first_window_summary_tables:
  - dashboard: bioetl-overview-v2.json
    id: 9603
    max_rows: 1
    owner: "@bioetl-observability"
    bind: limit
  - dashboard: bioetl-overview-v2.json
    id: 215
    max_rows: 2
    owner: "@bioetl-observability"
    bind: topk
  - dashboard: bioetl-overview-v2.json
    id: 9002
    max_rows: 2
    owner: "@bioetl-observability"
    bind: topk
  - dashboard: bioetl-runtime.json
    id: 9101
    max_rows: 3
    owner: "@bioetl-observability"
    bind: topk
  - dashboard: bioetl-provider-health-v2.json
    id: 9101
    max_rows: 3
    owner: "@bioetl-observability"
    bind: topk
  - dashboard: bioetl-provider-health-v2.json
    id: 9107
    max_rows: 3
    owner: "@bioetl-observability"
    bind: topk
  - dashboard: bioetl-incident-v1.json
    id: 2010
    max_rows: 5
    owner: "@bioetl-observability"
    bind: topk
  - dashboard: bioetl-run-explorer-v1.json
    id: 3010
    max_rows: 10

    owner: "@bioetl-observability"
    bind: limit
  - dashboard: bioetl-control-plane-v1.json
    id: 9418
    max_rows: 1
    owner: "@bioetl-observability"
    bind: limit
  - dashboard: bioetl-control-plane-v1.json
    id: 9416
    max_rows: 5
    owner: "@bioetl-observability"
    bind: limit

# DASH-DENSITY-002 scalar information density (values / w*h). Only scalar panels
# count; timeseries/table/text/row are excluded (runtime-dependent value counts).
# MUST equal report_dashboard_scalar_density.SCALAR_TYPES (locked by a test).
scalar_density_types:
  - stat
  - gauge
  - bargauge

# UIDs where DASH-DENSITY-002 is ENFORCED. Enrolled 2026-08-14 after compacting
# FAIL-group single-value cards (survey DENS-001..012).
scalar_density_enforced_uids:
  - bioetl-control-plane-v1
  - bioetl-dq-v2
  - bioetl-incident-v1
  - bioetl-overview-v2
  - bioetl-provider-health-v2
  - bioetl-run-explorer-v1
  - bioetl-runtime

answer_panels:
  bioetl-control-plane-v1.json:
    - id: 9401
      title: Monitor Replay Readiness
  bioetl-overview-v2.json:
    - id: 214
      title: Monitor Fleet Health
    - id: 215
      title: Review First Action
  bioetl-runtime.json:
    - id: 9401
      title: Monitor Pipeline Status
  bioetl-provider-health-v2.json:
    - id: 9101
      title: Monitor Fleet Severity
  bioetl-dq-v2.json:
    - id: 9401
      title: Monitor Current DQ Status
  bioetl-incident-v1.json:
    - id: 2010
      title: Inspect Ranked Suspects
  bioetl-run-explorer-v1.json:
    - id: 3010
      title: Inspect Recent Runs (last 10)


trust_gate_panels:
  - dashboard: bioetl-control-plane-v1.json
    id: 9401
  - dashboard: bioetl-runtime.json
    id: 9401

allowlists:
  # Retired with #8900: panel 9104 now ends at row 18 (y=15, h=3).
  straddle: []
  # DASH-FIT-004: first-window internal overflow must not be excepted to
  # preserve a failing layout. Keep empty.
  first_window_overflow: []
  # DASH-ZERO-001 / DASH-STATE-001: first-window background stats may use
  # a documented presence-probe zero (not a healthy-zero fallback).
  synthetic_zero:
    - dashboard: bioetl-provider-health-v2.json
      id: 9104
      owner: "@bioetl-observability"
      rationale: >-
        Monitor Telemetry Presence multiplies health_status by 0 so a live
        series proves scrape presence without encoding OK. Not a healthy zero.
      retire_when: presence is carried by an explicit UNKNOWN/OK mapping without * 0
  # Horizontal scrolling is allowed only for named below-fold explorers.
  horizontal_scroll: []
  min_height:
    - dashboard: bioetl-dq-v2.json
      id: 153
      owner: "@bioetl-observability"
      rationale: >-
        Track Volume-Weighted DQ Score is an intentional ultra-compact
        timeseries (h=4) with the legend hidden.
      retire_when: DQ score trend moves out of the compact evidence strip
  # DASH-DENSITY-002 governed exceptions keyed by (dashboard, row id).
  scalar_density:
    - dashboard: bioetl-provider-health-v2.json
      id: 91
      owner: "@bioetl-observability"
      rationale: >-
        Collapsed Selected Provider Details row (h=1) is a below-fold forensic
        expander, not a first-screen scalar group. Density cannot exceed the
        first-screen floor without adding first-window panels.
      retire_when: selected-provider diagnostics move into first-window scalar cards
    - dashboard: bioetl-provider-health-v2.json
      id: 9404
      owner: "@bioetl-observability"
      rationale: >-
        Collapsed Range & Debug Evidence row (h=1) is below-fold forensic
        evidence, not a first-screen scalar group.
      retire_when: range/debug evidence is represented by first-window scalar cards
