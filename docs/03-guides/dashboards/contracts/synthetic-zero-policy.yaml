version: 1
policy: prefer_absence_over_synthetic_zero
first_screen_no_synthetic_zero:
- dashboard: bioetl-overview-v2
  panels:
  - Status
  - First Action
  - failed/success run increase panels on bioetl_pipeline_runs_total
- dashboard: bioetl-control-plane-v1
  panels:
  - Status
  - Compare Global Audit Write Outcomes
  - Compare Global Audit Query Outcomes
allowed_or_vector_zero:
- dashboard: bioetl-control-plane-v1.json
  id: 5
  owner: '@bioetl-observability'
  rationale: Compare Checkpoint Outcomes uses `or label_replace(vector(0), disposition=no_events)` as
    a documented empty-event placeholder series, not a healthy status.
  retire_when: Grafana can render an explicit no_events series without PromQL vector(0)
contract_symbol: SUMMARY_NO_VECTOR_ZERO_FALLBACK_PANELS
notes:
- Operators must use trust/telemetry_missing signals when data-plane is empty.
- Pushgateway + health scrape topology is documented in grafana/README.md.
