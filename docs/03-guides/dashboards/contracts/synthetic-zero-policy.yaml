# Synthetic-zero PromQL policy for shipped Grafana dashboards (#6730).
# Source of truth for allowed `or vector(0)` fallbacks used by contract tests:
# tests/integration/grafana_contract_specs.py → SUMMARY_ZERO_FALLBACK_EXPECTATIONS
#
# Policy (AUD-OBS-20260727):
# - First-screen Status / run counters SHOULD prefer empty/No data when the
#   source series is absent (Overview failed/success run panels already omit
#   `or vector(0)` on bioetl_pipeline_runs_total).
# - Explicit incomplete encodings (trusted status=3, telemetry_missing) are
#   preferred over synthetic zero for trust gates.
# - Summary failure counters may keep `or vector(0)` when listed below so
#   multi-signal sums remain numeric 0 rather than mixed empty vectors.
# - New panels MUST NOT add unjustified `or vector(0)` without updating this
#   file and grafana_contract_specs.py in the same change.

version: 1
policy: prefer_absence_over_synthetic_zero_except_allowlisted
first_screen_no_synthetic_zero:
  - dashboard: bioetl-overview-v2
    panels:
      - Status
      - First Action
      - failed/success run increase panels on bioetl_pipeline_runs_total
  - dashboard: bioetl-control-plane-v1
    panels:
      - Status
  - dashboard: bioetl-runtime
    panels:
      - Status
      - Failed Runs
allowed_or_vector_zero: SUMMARY_ZERO_FALLBACK_EXPECTATIONS
notes:
  - Operators must use trust/telemetry_missing signals when data-plane is empty.
  - Pushgateway + health scrape topology is documented in grafana/README.md.
