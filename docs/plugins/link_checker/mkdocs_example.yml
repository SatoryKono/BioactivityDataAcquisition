# Troubleshooting:
# ===============
#
# Issue: Plugin not loading
# Solution: Ensure plugin path is correct and dependencies are installed
#
# Issue: Slow link checking
# Solution: Increase timeout or reduce max_workers in plugin config
#
# Issue: False positives
# Solution: Add patterns to ignore_patterns or adjust timeout
#
# Issue: Build fails due to broken links
# Solution: Set fail_on_error: false or fix broken links

# Performance Tips:
# =================
#
# 1. Use ignore_patterns to skip unnecessary checks
# 2. Increase timeout for slow external services
# 3. Run link checking in CI/CD to avoid local delays
# 4. Use fail_on_error: false during development
# 5. Monitor report_dir for performance metrics

# Best Practices:
# ===============
#
# 1. Always check ignore_patterns for local/development URLs
# 2. Set reasonable timeout values (10-15 seconds)
# 3. Use fail_on_error: true in CI/CD for quality gates
# 4. Review link health reports regularly
# 5. Fix broken links promptly to maintain high health score
