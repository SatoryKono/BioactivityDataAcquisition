# MkDocs Configuration with Link Checker Plugin

# Example configuration showing how to integrate the link checker plugin

site_name: BioETL Documentation
site_description: Comprehensive documentation for the BioETL system
site_author: BioETL Team

# Repository information
repo_name: SatoryKono/BioactivityDataAcquisition
repo_url: https://github.com/SatoryKono/BioactivityDataAcquisition

# Theme configuration
theme:
  name: material
  language: en
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/lightbulb
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/lightbulb-outline
        name: Switch to light mode
  features:
    - content.code.annotate
    - content.tabs.link
    - header.autohide
    - navigation.expand
    - navigation.indexes
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - search.highlight
    - search.share
    - search.suggest

# Plugins configuration
plugins:
  # Search plugin
  - search:
      lang: en
      separator: '[\s\-\.]+'
      min_search_length: 3
      prebuild_index: true

  # Link Checker Plugin - Issue #3094
  - link_checker:
      enabled: true              # Enable the link checker plugin
      timeout: 15               # HTTP request timeout in seconds
      max_redirects: 5          # Maximum number of redirects to follow
      ignore_patterns:         # URL patterns to ignore
        - 'localhost'
        - '127.0.0.1'
        - 'staging\.example\.com'
        - '\.local$'
        - '192\.168\.'
        - '10\.'
      report_dir: "reports/links"  # Directory to save reports
      fail_on_error: false      # Set to true to fail build on broken links

# Navigation structure
nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Quick Start: getting-started/quick-start.md
      - Configuration: getting-started/configuration.md
  - Architecture:
      - Overview: architecture/overview.md
      - ADRs: architecture/adrs.md
      - System Context: architecture/system-context.md
  - Reference:
      - CLI: reference/cli.md
      - Contracts: reference/contracts/index.md
      - Pipelines: reference/pipelines/index.md
      - Providers: reference/providers/index.md
  - Development:
      - Adding Providers: development/adding-providers.md
      - Adding Pipelines: development/adding-pipelines.md
      - Testing: development/testing.md
  - Operations:
      - Runbooks: operations/runbooks/index.md
      - Maintenance: operations/maintenance.md
  - About:
      - Changelog: about/changelog.md
      - Contributing: about/contributing.md
      - License: about/license.md

# Extensions
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - meta
  - md_in_html
  - toc:
      permalink: true
      baselevel: 2
      separator: "-"
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.critic
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:materialx.emoji.twemoji
      emoji_generator: !!python/name:materialx.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink:
      repo_url_shorthand: true
      user: SatoryKono
      repo: BioactivityDataAcquisition
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

# Extra CSS/JS
extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

# Link Checker Integration Guide
# ==================================
#
# To use the link checker plugin:
#
# 1. Install the plugin:
#    pip install -e docs/plugins/link_checker
#
# 2. Add to mkdocs.yml (as shown above)
#
# 3. Build documentation:
#    mkdocs build
#
# 4. View reports:
#    - JSON: site/reports/links/link-health.json
#    - HTML: site/reports/links/link-health.html
#    - Badge: site/reports/links/link-badge.svg
#
# Configuration Options:
#
# enabled: Enable/disable the plugin (default: true)
# timeout: HTTP request timeout in seconds (default: 10)
# max_redirects: Maximum redirects to follow (default: 5)
# ignore_patterns: List of URL patterns to ignore
# report_dir: Directory to save reports (default: "reports/links")
# fail_on_error: Fail build if broken links found (default: false)
#
# Example ignore patterns:
# - Local development URLs: localhost, 127.0.0.1
# - Internal network URLs: 192.168.*, 10.*
# - Staging environments: staging.example.com
# - Local domains: .local

