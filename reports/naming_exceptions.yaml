    - field: document_id
      locations: application/composite/key_extractor.py
      reason: ChEMBL API field name used in data extraction
      status: mapped_in_gold_layer

# Terminology Exceptions
terminology_exceptions:
  - term: job
    locations:
      - infrastructure/adapters/uniprot/idmapping_client.py
      - composition/_pipeline_execution.py
    reason: >
      UniProt ID Mapping API uses "job" for async operations.
      Prometheus push gateway uses "job" as a standard label.
    canonical_alternative: run
    status: justified_api_term

  - term: chunk
    locations:
      - application/core/batch_transformer.py:382
      - infrastructure/storage/bronze_writer.py:638
    reason: >
      Internal variable for record slicing within batch processing.
      Standard Python file I/O read buffer idiom.
    canonical_alternative: batch
    status: justified_implementation_detail

  - term: measurement
    locations: domain/ (docstrings and comments only)
    reason: >
      Used in scientific context to describe bioactivity measurements
      (IC50, EC50, Ki, etc.). Not used as class/entity name.
    canonical_alternative: activity
    status: justified_scientific_term

# Value Object Exceptions
value_object_exceptions:
  - class: CompoundId
    location: domain/value_objects/compound_ids.py:31
    reason: >
      Cross-provider compound identifier value object.
      "Compound" is a legitimate chemistry term here,
      not the deprecated PubChem-specific entity name.
    status: not_a_violation

  - class: CompoundSource
    location: domain/value_objects/compound_ids.py:20
    reason: >
      StrEnum for compound identifier sources (chembl/pubchem).
      Accompanies CompoundId value object.
    status: not_a_violation

