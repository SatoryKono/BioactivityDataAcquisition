      location: domain/entities/chembl_structures.py:330
      reason: ChEMBL API-specific derived entity, not a publication
      status: intentionally_unchanged
      reference: ADR-024 §Known Exceptions

    - class: DocumentTerm
      location: domain/entities/chembl_structures.py:51
      reason: ChEMBL API-specific derived entity, not a publication
      status: intentionally_unchanged
      reference: ADR-024 §Known Exceptions

  pipeline_names:
    - name: pubchem_compound
      location: configs/pipelines/pubchem/compound.yaml
      reason: CLI uses provider API terms per glossary.md CLI conventions
      status: intentional
      reference: glossary.md §CLI

    - name: uniprot_protein
      location: configs/pipelines/uniprot/ (referenced in composite configs)
      reason: CLI uses provider API terms per glossary.md CLI conventions
