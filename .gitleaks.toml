# Gitleaks configuration for BioETL
# See: https://github.com/gitleaks/gitleaks#configuration
#
# Enforced in CI by the gitleaks job in .github/workflows/security.yml.
# detect-secrets remains a parallel scanner until Gitleaks is the sole git-secret gate.
# Run locally: gitleaks detect --config .gitleaks.toml --redact

title = "BioETL Gitleaks Configuration"

[extend]
# Use default gitleaks rules as base
useDefault = true

# Global allowlist
[allowlist]
description = "BioETL-specific allowlist"

paths = [
    # Example environment file with placeholder values
    '''^\.env\.example$''',

    # VCR cassettes contain sanitized API responses and biological sequences
    '''tests/fixtures/vcr/''',

    # Test fixtures may contain mock data
    '''tests/fixtures/''',

    # CLI command tests contain mock API key values for testing masking
    '''tests/unit/interfaces/test_cli_commands\.py$''',

    # Logger tests contain mock secrets for testing masking functionality
    '''tests/unit/infrastructure/observability/test_unified_logger\.py$''',

    # Security documentation contains example "bad practice" code
    '''SECURITY\.md$''',

    # Secrets baseline for detect-secrets
    '''\.secrets\.baseline$''',

    # Lock files
    '''uv\.lock$''',
    '''poetry\.lock$''',

    # Generated documentation
    '''docs/_build/''',
    '''site/''',

    # Audit documentation (contains commit hashes, not secrets)
    '''docs/archived/audits/''',

    # Frozen archive evidence relocated from governed reports/ (same files,
    # previously covered by rule-level allowlists at their reports/ paths)
    '''docs/99-archive/''',

    # Data fixtures may contain biological sequences that look like tokens
    '''data/input/''',
]

regexTarget = "match"

regexes = [
    # Example/placeholder patterns
    '''(?i)example[_-]?(api[_-]?)?key''',
    '''(?i)your[_-]?api[_-]?key[_-]?here''',
    '''<your[_-]?.*>''',
    '''xxx+''',
    '''(?i)placeholder''',

    # Test mock values
    '''(?i)test[_-]?secret''',
    '''(?i)mock[_-]?token''',
    '''(?i)fake[_-]?key''',
    '''secret[_-]?api[_-]?key[_-]?\d+''',
    '''test[_-]?value[_-]?for[_-]?masking''',

    # Mock keys used in tests (do not allowlist live `sk-` prefixes)
    '''msk-[a-zA-Z0-9]+''',

    # AWS example access key (from AWS documentation)
    '''AKIAIOSFODNN7EXAMPLE''',

    # Biological sequences that may match AWS token patterns
    # Protein sequences often contain AKIA/ASIA prefixes
    '''AKIA[A-Z]{16,}''',
    '''ASIA[A-Z]{16,}''',
    '''ACCA[A-Z]{16,}''',

    # NCBI tool email (not PII, technical identifier)
    '''default_email.*@.*\.com''',

    # Environment variable references (not actual secrets)
    '''os\.environ\[["'][A-Z_]+["']\]''',

    # getenv calls (not actual secrets)
    '''getenv\(["'][A-Z_]+["']''',

    # Settings object references
    '''settings\.[a-z_]+''',

]

# Stopwords to ignore
stopwords = [
    "example",
    "sample",
    "test",
    "mock",
    "fake",
    "placeholder",
    "your-api-key-here",
]


# Review proposal for #10136. Every exception requires BOTH path and matched value.
# No credential dispositions, commit exemptions, or fingerprint baseline included.
[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Sonar issue IDs in the seven reviewed historical JSON exports"
condition = "AND"
paths = ['''^reports/quality/sonar/(?:live-issues-20260728-(?:manifest|postmerge-full)|live-issues-20260807-full|live-issues-20260819-(?:baseline|current)-full|live-issues-20260820-rf009-full|live-snapshot-20260728-summary)\.json$''']
regexTarget = "match"
regexes = ['''^"?key"[ \t]*:[ \t]*"(?:[A-Za-z0-9_-]{20}|[0-9a-fA-F]{8}(?:-[0-9a-fA-F]{4}){3}-[0-9a-fA-F]{12})"[, \t\r\n]*$''']

[[rules.allowlists]]
description = "Exact public issue IDs in the reviewed 2026-09-24 Sonar export"
condition = "AND"
paths = ['''^reports/quality/sonar/live-issues-20260924-rf009-full\.json$''']
regexTarget = "match"
regexes = ['''^"?key"[ \t]*:[ \t]*"(?:AaC-134a4jtq7QCmJvUR|AaC-rmxc4jtq7QCmIN0U|AaC-rmxc4jtq7QCmIN0V|AaC-rmxc4jtq7QCmIN0W|AaCrOdK-fLUykpRDbtDD|AaCrOdK-fLUykpRDbtDF|AaCrROex6ovrfHki8whE|AaCrROex6ovrfHki8whF|AaCrdW8wuAUYUSCNAYjL|AaCsB1PKJ8AvPpfnR13U|AaCt95lUL4QSNSxNsszN|AaCv32X_anF1EROvwhVe|AaCwhPtflNfxZaDohRq6|AaDC76-_Xjd--IaQqv0Q|AaDDhHynR3Q-DMha0r85|AaDDhHynR3Q-DMha0r86|AaDFMTVgmO2A-5xlOQD_|AaDFMXonmO2A-5xlOQEC|AaDHiFwVGoclI8RylWqF|AaDHiGOLGoclI8RylWqG|AaDI8WniOkIF99j5JvuC|AaDI8WniOkIF99j5JvuD|AaDI8WniOkIF99j5JvuE|AaDIMass3uREZRvhbkcP|AaDIiamXOkIF99j5Fwik|AaDIicbcOkIF99j5Fwim|AaDJZB_CH2p6tZfK9EE3|AaDJZHYkH2p6tZfK9EE4|AaDNjgKv2qw7ls_VSvgK|AaDNvD2L43bC2CNePP29|AaDNvGTv43bC2CNePP2-|AaDONVQedY9fl74aXa9N|AaDONY9NdY9fl74aXa9P|AaDOaiv1qOdIt96h_Y2q|AaDOaiv1qOdIt96h_Y2r|AaDPY1TQOkQ8Qmoqlt7m|AaDPY1TQOkQ8Qmoqlt7n|AaDPqyRlj5nm0vNCEcQ1)"[, \t\r\n]*$''']

[[rules.allowlists]]
description = "ChEMBL species/target text: api inside sapiens is not an API assignment"
condition = "AND"
paths = ['''^data/output/.*\.csv$''']
regexTarget = "match"
regexes = ['''(?i)^s?apiens,(?:5-hydroxytryptamine|d-3-phosphoglycerate|3-hydroxy-3-methylglutaryl-coenzyme|1-acyl-sn-glycerol-3-phosphate)[ \t\r\n]*$''']

[[rules.allowlists]]
description = "Reviewed activity CSV rows: gastrin/cholecystokinin is a target name"
condition = "AND"
paths = ['''^data/output/(?:activity|activity_smoke)/activity\.csv$''']
regexTarget = "match"
regexes = ['''(?i)^s?apiens,gastrin/cholecystokinin[ \t\r\n]*$''']

[[rules.allowlists]]
description = "Exact historical activity staging file: serotonin target text"
condition = "AND"
paths = ['''^data/output/activity/activity\.tmp$''']
regexTarget = "match"
regexes = ['''(?i)^s?apiens,5-hydroxytryptamine[ \t\r\n]*$''']

[[rules.allowlists]]
description = "Named SHA-256 business-key expectations in historical golden tests"
condition = "AND"
paths = ['''^tests/(?:unit/domain/hash_policy/(?:snapshots/chembl_high_risk_hashes\.json|test_chembl_high_risk_hash_golden\.py)|bioetl/domain/transform/golden_examples\.json|(?:document|assay|testitem|target)_chembl_golden\.py)$''']
regexTarget = "match"
regexes = ['''^"?(?:target_component_key_order_[ab]|(?:expected_)?hash_business_key)"[ \t]*:[ \t]*"[0-9a-f]{64}"[, \t\r\n]*$''']

[[rules.allowlists]]
description = "Canonical semantic-pair row identifiers, not generic hex credentials"
condition = "AND"
paths = ['''^configs/field_registry/semantic_pair_matrix_budget\.yaml$''']
regexTarget = "match"
regexes = ['''^row_key: [0-9a-f]{16}[ \t\r\n]*$''']

[[rules.allowlists]]
description = "Public delta merge benchmark names in the reviewed performance observations"
condition = "AND"
paths = ['''^reports/performance/evidence/1117a76a578cc7315cfe62823b8d5d7c6759b2af/run_[12]/N(?:10|50|100)/N(?:10|50|100)-[a-z0-9]{8}/observations\.jsonl$''']
regexTarget = "match"
regexes = ['''^"?benchmark_key"[ \t]*:[ \t]*"delta_sequential_merge_N(?:10|50|100)"[ \t\r\n]*$''']

[[rules.allowlists]]
description = "Parsed knowledge-graph metadata names"
condition = "AND"
paths = ['''^src/bioetl_knowledge_graph_expanded(?:_compact)?\.json$''']
regexTarget = "match"
regexes = ['''^accession","normalized=true"$''']

[[rules.allowlists]]
description = "Audit prose heading, not a credential assignment"
condition = "AND"
paths = ['''^src/memory/episodic/summaries/full-tech-debt-audit-main-2026-06-19\.md$''']
regexTarget = "match"
regexes = ['''^Key findings: compatibility(?:/facade)?[ \t\r\n]*$''']

[[rules.allowlists]]
description = "Exact sequential dummy in the reviewed memory security regression"
condition = "AND"
paths = ['''^tests/unit/memory/test_security\.py$''']
regexTarget = "secret"
regexes = ['''^ghp_abcdefghijklmnopqrstuvwxyz123456$''']

[[rules.allowlists]]
description = "Exact sequential dummy in token-validation tests"
condition = "AND"
paths = ['''^tests/unit/repo_backed/scripts/ai/mcp/test_token_validation_helpers\.py$''']
regexTarget = "secret"
regexes = ['''^ghp_12345678901234567890$''']

[[rules.allowlists]]
description = "Exact numeric mock in request-collector tests and two historical copies"
condition = "AND"
paths = ['''^(?:\.worktrees/(?:bioetl-wave1-3|pr-2438-review)/)?tests/unit/infrastructure/adapters/common/test_api_request_collector\.py$''']
regexTarget = "secret"
regexes = ['''^secret_key_12345$''']

[[rules.allowlists]]
description = "Exact numeric bad-practice example already replaced in current guidance"
condition = "AND"
paths = ['''^docs/03-guides/github-setup-plan\.md$''']
regexTarget = "secret"
regexes = ['''^sk-1234567890$''']

[[rules.allowlists]]
description = "Delta-merge benchmark identifiers in reviewed performance observations"
condition = "AND"
paths = [
    '''^reports/performance/evidence/1117a76a578cc7315cfe62823b8d5d7c6759b2af/run_1/N10/N10-91g9jc6i/observations\.jsonl$''',
    '''^reports/performance/evidence/1117a76a578cc7315cfe62823b8d5d7c6759b2af/run_1/N50/N50-yekoujnh/observations\.jsonl$''',
    '''^reports/performance/evidence/1117a76a578cc7315cfe62823b8d5d7c6759b2af/run_1/N100/N100-usnmxiu3/observations\.jsonl$''',
    '''^reports/performance/evidence/1117a76a578cc7315cfe62823b8d5d7c6759b2af/run_2/N10/N10-n1j0nze5/observations\.jsonl$''',
    '''^reports/performance/evidence/1117a76a578cc7315cfe62823b8d5d7c6759b2af/run_2/N50/N50-9btidy6p/observations\.jsonl$''',
    '''^reports/performance/evidence/1117a76a578cc7315cfe62823b8d5d7c6759b2af/run_2/N100/N100-yevzmbf8/observations\.jsonl$''',
]
regexTarget = "secret"
regexes = ['''^delta_sequential_merge_N(?:100|50|10)$''']

[[rules.allowlists]]
description = "Exact public join-normalization argument expression in one historical regression test"
condition = "AND"
paths = ['''^tests/unit/application/test_issue_10518_application_compwf_b\.py$''']
regexTarget = "secret"
regexes = ['''^normalization_policies=policies$''']

[[rules]]
id = "curl-auth-header"
[[rules.allowlists]]
description = "Literal YOUR_API_KEY/TOKEN placeholders in reviewed curl documentation"
condition = "AND"
paths = ['''^(?:(?:\.worktrees/(?:bioetl-wave1-3|pr-2438-review)/)?docs/(?:05-operations/verification/endpoint-validation-checklist\.md|(?:99-archive/dashboards-legacy|03-guides/dashbords)/BIOETL_DASHBOARD_EXAMPLES\.md)|docs/exports/full-documentation-no-plans-reports-skills\.merged\.md|src/tools/reports/documentation_merged\.md)$''']
regexTarget = "secret"
regexes = ['''^YOUR[_-]API[_-](?:KEY|TOKEN)$''']

[[rules]]
id = "curl-auth-user"
[[rules.allowlists]]
description = "PowerShell environment references, not literal passwords"
condition = "AND"
paths = ['''^docs/05-operations/deployment/neo4j-audit-instance-implementation\.md$''']
regexTarget = "secret"
regexes = ['''^["']?\$\{env:NEO4J_AUDIT_USERNAME\}:\$\{env:NEO4J_AUDIT_PASSWORD\}["']?$''']

[[rules.allowlists]]
description = "Literal ellipsis in abbreviated curl syntax"
condition = "AND"
paths = ['''(?:^|/)MCP_MEMORY_OPERATIONAL\.md$''']
regexTarget = "secret"
regexes = ['''^neo4j:\.\.\.$''']

