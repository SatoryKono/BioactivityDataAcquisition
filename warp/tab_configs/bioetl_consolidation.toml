name = "BioETL Consolidation"
title = "{{title}}"

[[panes]]
id = "root"
type = "terminal"
children = ["repo", "checks"]

[[panes]]
id = "repo"
type = "terminal"
command = "cd {{repo_path}} && rg --files tests/integration/determinism tests/integration/idempotency tests/integration/composite_resume"
is_focused = true

[[panes]]
id = "checks"
type = "terminal"
command = """
cd {{repo_path}} && \
uv sync --frozen --all-extras --dev && \
uv run pytest tests/integration/determinism tests/integration/idempotency tests/integration/composite_resume -q
"""

[params]
repo_path = "/tmp/repo"
title = "BioETL Consolidation"
