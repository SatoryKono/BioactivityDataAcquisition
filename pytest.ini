[pytest]
minversion = 7.0
addopts =
    --verbose
    --tb=short
    --cov=src/bioetl
    --cov-report=term-missing
    --cov-fail-under=85

testpaths = tests
pythonpath = src
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    unit: Unit tests (fast, in-memory)
    integration: Integration tests (I/O, VCR)
    e2e: End-to-end tests
    slow: Slow tests (>1s)
    hypothesis: Property-based tests
    architecture: Architecture compliance tests
    security: Security tests
    smoke: Quick smoke tests
    benchmark: Benchmark tests (excluded by default)
asyncio_mode = auto
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
    ignore:Importing pandas-specific classes:FutureWarning
    ignore:Importing pandas-specific classes.*:FutureWarning
