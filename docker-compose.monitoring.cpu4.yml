# Local host override: Docker Desktop reports only 4 CPUs.
# Use: docker compose -f docker-compose.monitoring.yml -f docker-compose.monitoring.cpu4.yml up -d
services:
  prometheus:
    cpus: 2.0
    mem_limit: 2g
  pushgateway:
    cpus: 0.5
    mem_limit: 512m
  grafana:
    cpus: 1.5
    mem_limit: 2g
  renderer:
    cpus: 1.5
    mem_limit: 3g
    shm_size: "1gb"
