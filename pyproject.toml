[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bioetl"
version = "5.0.0"
description = "BioETL: Bioactivity data acquisition and processing pipeline"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "polars>=1.0",
    "deltalake>=0.18",
    "pyarrow>=15.0",
    "zstandard>=0.22",
    "pandas>=2.0", # Added for pipeline functionality
    # Orchestration & Validation (RULES.md Section 4.1)
    "prefect>=3.0",
    "pandera>=0.20",
    # Infrastructure
    "redis>=5.0",
    "boto3>=1.34",
    # Providers (RULES.md Appendix A)
    "pubchempy>=1.0.4",
    # Metrics
    "prometheus-client>=0.20",
    # CLI
    "click>=8.1",
    # Logging
    "structlog>=24.0",
    "boto3-stubs~=1.42.10",
]

[project.scripts]
bioetl = "bioetl.interfaces.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.23",
    "pytest-xdist>=3.5",
    "hypothesis>=6.100",
    "respx>=0.21",
    "mypy>=1.10",
    "ruff>=0.4",
    # Security tools (RULES.md - SAST)
    "pip-audit>=2.7",
    "bandit[toml]>=1.7",
    "safety>=3.0",
    # VCR.py for API testing (RULES.md Section 4.2)
    "vcrpy>=6.0",
    "pytest-vcr>=1.0",
    # Redis testing
    "fakeredis>=2.21",
    # AWS testing
    "moto[s3]>=5.0",
    # Docker testing
    "pytest-docker>=2.0.0",
    # Code formatting and linting
    "black>=24.0",
    "isort>=5.13",
    "import-linter>=2.0",
    # Architecture testing
    "pytest-archon>=0.0.6",
    # Code complexity analysis (RULES.md)
    "xenon>=0.9",
    "radon>=6.0",
    # Code duplication detection
    "pylint>=3.0",
    # Dead code detection
    "vulture>=2.11",
    # Mutation testing
    "mutmut>=2.5",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocs-mermaid2-plugin>=1.1",
    "pymdown-extensions>=10.8",
    "mkdocstrings[python]>=0.25",
]

[tool.setuptools.packages.find]
where = ["src"]

# ============ PYTEST ============
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "-q",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "unit: Unit tests (fast, no I/O)",
    "integration: Integration tests (may use I/O)",
    "e2e: End-to-end tests (slow, requires Docker)",
    "slow: Slow tests",
    "security: Security tests",
    "vcr: VCR.py recorded HTTP interactions",
]
asyncio_mode = "auto"
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
    # NoOpMetrics warns when metrics are disabled (expected in tests)
    "ignore:NoOpMetrics is being used:UserWarning",
    # Pytest cleanup warnings (sockets/event loops not closed during teardown)
    "ignore::pytest.PytestUnraisableExceptionWarning",
]

# ============ COVERAGE ============
[tool.coverage.run]
source = ["src/bioetl"]
branch = true
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@abstractmethod",
]
fail_under = 80
show_missing = true

# ============ MYPY ============
# Mypy strict mode validates async/await usage:
# - Ensures async def methods are awaited (error: "coroutine never awaited")
# - Validates AsyncIterator return types require "async for"
# - Checks Awaitable[T] type annotations are properly awaited
# Architecture tests in tests/test_architecture.py provide additional validation.
[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
# Additional strict checks
disallow_any_generics = true
disallow_subclassing_any = true
warn_unreachable = true
strict_equality = true
extra_checks = true


[[tool.mypy.overrides]]
module = [
    "deltalake.*",
    "polars.*",
    "prefect.*",
    "pandera.*",
    "redis.*",
    "boto3.*",
    "botocore.*",
    "pubchempy.*",
    "prometheus_client.*",
    "vcr.*",
    "fakeredis.*",
    "structlog.*",
]
ignore_missing_imports = true

# ============ RUFF ============
[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", # pycodestyle errors
    "W", # pycodestyle warnings
    "F", # pyflakes
    "I", # isort
    "B", # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "PTH", # flake8-use-pathlib
    "RUF", # ruff-specific
]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["bioetl"]

# ============ MUTMUT (Mutation Testing) ============
[tool.mutmut]
paths_to_mutate = "src/bioetl/domain/,src/bioetl/application/"
tests_dir = "tests/"
runner = "python -m pytest -x --tb=short"
# Skip infrastructure layer - focus on business logic
dict_synonyms = "Struct, NamedStruct"

# ============ XENON (Complexity Thresholds) ============
# Enforced in CI: xenon --max-absolute B --max-modules B --max-average A
# Factories: xenon --max-absolute B --max-modules A --max-average A
# B = max CC of 10 per function, A = average CC of 5

# ============ BANDIT (Security) ============
[tool.bandit]
exclude_dirs = ["tests", "docs", ".venv", "build", "dist"]
skips = [
    "B101", # assert_used - acceptable in production for invariants
    "B104", # hardcoded_bind_all_interfaces - not applicable for ETL jobs
    "B311", # random - not used for security purposes in data processing
]
# Severity thresholds
# HIGH severity issues block CI merge
# MEDIUM severity issues are warnings only

[tool.bandit.assert_used]
# Allow assert in domain layer for invariants
skips = ["*/domain/*"]
