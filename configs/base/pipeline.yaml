# =============================================================================
# Base Pipeline Configuration — consolidated defaults
# =============================================================================
# Preferred base path for pipeline defaults.

version: "1.2.0"
technical_primary_key: "entity_id"

# Loading strategy (ADR-031). null = default incremental.
loading_strategy: null

source: { }

transform:
    steps: [ ]

# DQ defaults are loaded via DQConfigLoader (base/quality.yaml).
dq_overrides: { }

sink:
    bronze:
        format: jsonl
        save_json: true
        save_metadata: true
        dq_report:
            enabled: true
        flat_structure: true

    silver:
        format: delta
        mode: merge
        idempotency_contract: merge_upsert
        sort_by:
            - entity_id
        on_schema_mismatch: evolve
        save_metadata: true
        dq_report:
            enabled: true
        csv_export:
            enabled: true
            delimiter: ","
            header: true
            encoding: "utf-8"
        flat_structure: true

    gold:
        enabled: true
        format: delta
        mode: scd2
        idempotency_contract: scd2
        sort_by:
            - entity_id
        scd_config:
            valid_from_col: _valid_from
            valid_to_col: _valid_to
            current_flag_col: _is_current
            version_col: _version
        deterministic: true
        save_metadata: true
        dq_report:
            enabled: true
        csv_export:
            enabled: true
            delimiter: ","
            header: true
            encoding: "utf-8"
        flat_structure: true

maintenance:
    auto_vacuum: false
    vacuum_retention_days: 7

input_filter:
    enabled: false
    batch_size: 1000

# Replaces configs/filters/_defaults.yaml
filter_defaults:
    silver_filters:
        required_fields: [ ]
        columns: { }
        ranges: { }
        list_lengths: { }
        list_contains: { }
        exclude_if_present: [ ]
    gold_filters:
        required_fields: [ ]
        columns: { }
        ranges: { }
        list_lengths: { }
        list_contains: { }
        exclude_if_present: [ ]

# Shared contract defaults for future contract consolidation.
contract_defaults:
    rename_map:
        run_id: _run_id
        run_type: _run_type
        source_batch_id: _source_batch_id
        ingestion_ts: _ingestion_ts
        source: _source
    hash_include: [ ]
    hash_exclude:
        - _ingestion_ts
        - _run_id
        - _run_type
        - _dq_error
        - _dq_warn
