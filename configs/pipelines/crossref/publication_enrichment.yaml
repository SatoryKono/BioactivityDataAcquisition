# configs/pipelines/crossref/publication_enrichment.yaml
# Pipeline for enriching publication records with CrossRef metadata.
# Resolves DOIs from Bronze (PubMed/ChEMBL docs) to enrich with citations.
#
# Inherits defaults from ../_defaults.yaml

pipeline_name: crossref_publication_enrichment
provider: crossref
entity_type: work
version: "1.0.0"
description: "Enrich publication records with CrossRef metadata via DOI resolution"

primary_keys: ["doi"]
silver_table: "crossref_publication"

source_file: ../../sources/crossref.yaml

# Entity-specific gold filters
gold_filters:
  required_fields:
    - doi
    - title
  ranges:
    year:
      min: 1900
      max: 2100

# Entity-specific transform steps
transform:
  version: "1.0.0"
  steps:
    - normalize_doi
    - extract_metadata
    - strip_html_abstract
    - add_metadata
    - calculate_content_hash

# Entity-specific sink overrides
sink:
  bronze:
    path: "data/output/bronze"
  silver:
    path: "data/output/silver"
    primary_key: ["doi"]
    csv_export:
      path: "data/output/csv/silver"
  gold:
    path: "data/output/gold"
    csv_export:
      path: "data/output/csv/gold"

# Entity-specific input filter for batch DOI resolution
input_filter:
  enabled: true
  source_path: "data/input/dois.csv"
  column_name: "doi"
  filter_field: "doi"
  batch_size: 50
