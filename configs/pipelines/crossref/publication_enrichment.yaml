# configs/pipelines/crossref/publication_enrichment.yaml
# Pipeline for enriching publication records with CrossRef metadata.
# Resolves DOIs from Bronze (PubMed/ChEMBL docs) to enrich with citations.

pipeline_name: crossref_publication_enrichment
provider: crossref
entity_type: work
version: "1.0.0"
description: "Enrich publication records with CrossRef metadata via DOI resolution"

primary_keys: ["doi"]
silver_table: "crossref_publication"

# Reference to source configuration
source_file: ../../sources/crossref.yaml

# Gold filters for high-quality enriched publications
gold_filters:
    required_fields:
        - doi
        - title
    ranges:
        year:
            min: 1900
            max: 2100

# Transform steps
transform:
    version: "1.0.0"
    steps:
        - normalize_doi
        - extract_metadata
        - strip_html_abstract
        - add_metadata
        - calculate_content_hash

# Three-layer medallion storage
sink:
    bronze:
        path: "data/output/bronze"
        format: jsonl
        save_json: true
        deterministic: true

    silver:
        path: "data/output/silver"
        format: delta
        mode: merge
        on_schema_mismatch: evolve
        primary_key: ["doi"]
        classification: public
        forensic_retention: true
        deterministic: true
        csv_export:
            enabled: true
            path: "data/output/csv/silver"
            delimiter: ","
            header: true
            encoding: "utf-8"

    gold:
        enabled: true
        validation:
            strict: true  # REQ-DATA-009: Gold validation must be strict
        path: "data/output/gold"
        format: delta
        mode: overwrite
        deterministic: true
        csv_export:
            enabled: true
            path: "data/output/csv/gold"
            delimiter: ","
            header: true
            encoding: "utf-8"

# Data quality rules
dq_rules:
    soft_fail_threshold: 0.05  # Warning at 5% errors
    hard_fail_threshold: 0.20  # Fail batch at 20% errors

# Circuit breaker configuration
circuit_breaker:
    failure_threshold: 5
    recovery_timeout: 300

# Input filter configuration for batch DOI resolution
# Reads DOIs from Bronze layer documents
input_filter:
    enabled: true
    source_path: "data/input/dois.csv"  # CSV with DOIs to resolve
    column_name: "doi"
    filter_field: "doi"
    batch_size: 50  # DOIs per API request (max 100)
