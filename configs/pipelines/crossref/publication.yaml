# configs/pipelines/crossref/publication.yaml
# Pipeline for enriching publication records with CrossRef metadata.
# Resolves DOIs from Bronze (PubMed/ChEMBL docs) to enrich with citations.
#
# Inherits defaults from ../_base.yaml

pipeline_name: crossref_publication
provider: crossref
entity_type: work
version: "1.2.0"
description: "Enrich publication records with CrossRef metadata via DOI resolution"

primary_keys: ["doi"]
silver_table: "crossref_publication"
gold_table: "crossref_publication"

source_file: ../../sources/crossref.yaml

# -----------------------------------------------------------------------------
# Data Quality Rules (entity-specific overrides)
# -----------------------------------------------------------------------------
dq_rules:
  field_validations:
    - field: "doi"
      type: "pattern"
      pattern: "^10\\.\\d{4,}/.*$"
      nullable: false
      error_message: "DOI must start with 10. prefix"
    - field: "title"
      type: "pattern"
      pattern: "^.{1,2000}$"
      nullable: true
    - field: "year"
      type: "range"
      min: 1800
      max: 2100
      nullable: true
    - field: "type"
      type: "enum"
      allowed: ["journal-article", "book-chapter", "proceedings-article", "posted-content", "book", "report", "dataset", "standard"]
      nullable: true
    - field: "is_referenced_by_count"
      type: "range"
      min: 0
      nullable: true

  cross_field_validations:
    - name: "publication_identifiable"
      fields: ["doi", "title"]
      condition: "all_present"
      error_message: "Publication must have DOI and title"

# Entity-specific gold filters
gold_filters:
  required_fields:
    - doi
    - title
  ranges:
    year:
      min: 1900
      max: 2100

# Entity-specific sink overrides
sink:
  bronze:
    path: "data/output/bronze/crossref/"
  silver:
    path: "data/output/silver/crossref/"
    primary_key: ["doi"]
    partition_by: []
    sort_by:
      columns: ["doi"]
      ascending: true
    csv_export:
      path: "data/output/silver/crossref/"
  gold:
    path: "data/output/gold/crossref/"
    sort_by:
      columns: ["doi"]
      ascending: true
    csv_export:
      path: "data/output/gold/crossref/"

# Entity-specific input filter for batch DOI resolution
input_filter:
  enabled: true
  source_path: "data/input/dois.csv"
  column_name: "doi"
  filter_field: "doi"
  batch_size: 50  # Polite pool API - conservative batch size
  fallback_column: "title"  # Search by title if DOI not found (404)

