# configs/pipelines/_providers/uniprot.yaml
# =============================================================================
# UniProt Provider Reference Configuration
# =============================================================================
#
# AUTHORITATIVE SOURCE: configs/sources/uniprot.yaml
#
# This file documents UniProt-specific settings for reference.
# Entity configs should use source_file: ../../sources/uniprot.yaml
#
# API DOCUMENTATION: https://www.uniprot.org/help/api
# =============================================================================

provider: uniprot

# Rate Limiting
# Without API key: ~100 req/sec (shared pool)
# With API key: Higher limits available
rate_limit:
  requests_per_second: 10
  burst: 20

# HTTP Client Settings
client:
  base_url: https://rest.uniprot.org
  timeout_sec: 30.0
  max_retries: 3

# Batch Processing
batch_size: 200  # UniProt handles larger batches well

# Authentication (optional)
auth:
  api_key_env: BIOETL_UNIPROT_API_KEY  # Optional for higher rate limits

# Supported Entities
entities:
  - protein    # UniProt protein entries
  - idmapping  # ID mapping service (ChEMBL → UniProt)

# ID Mapping Configuration
idmapping:
  # Elevated DQ thresholds - many ChEMBL targets may not have UniProt mappings
  dq_rules:
    soft_fail_threshold: 0.30  # 30% not_found acceptable
    hard_fail_threshold: 0.80  # 80% triggers failure
  # Supported database mappings
  from_databases: [ChEMBL, PDB, RefSeq]
  to_databases: [UniProtKB, UniProtKB-Swiss-Prot]

# Notes
notes:
  - "Use reviewed: true filter to get only Swiss-Prot (curated) entries"
  - "ID mapping API has different endpoint (/idmapping)"
  - "Large ID mapping jobs may require polling for results"
