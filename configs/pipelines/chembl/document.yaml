# configs/pipelines/chembl/document.yaml
# Pipeline configuration for ChEMBL Document entity.
#
# Inherits defaults from ../_defaults.yaml

pipeline_name: chembl_document
provider: chembl
entity_type: document
version: "1.1.0"
description: "Extract scientific documents from ChEMBL API"

primary_keys: ["document_chembl_id"]
silver_table: "chembl_document"
gold_table: "chembl_document"

source_file: ../../sources/chembl.yaml

# Entity-specific gold filters
gold_filters:
  columns:
    doc_type: [PUBLICATION]
  ranges:
    year:
      min: 1950
      include_min: false
  required_fields:
    - title
    - pubmed_id
    - doi

# Entity-specific sink overrides
sink:
  bronze:
    path: "data/bronze/chembl/document"
  silver:
    path: "data/silver/chembl/document"
    primary_key: ["document_chembl_id"]
    partition_by: ["doc_type"]
    csv_export:
      path: "data/csv/silver/chembl/document"
  gold:
    path: "data/gold/chembl/document"
    csv_export:
      path: "data/csv/gold/chembl/document"

# Entity-specific input filter
input_filter:
  enabled: true
  source_path: "data/input/publication.csv"
  column_name: "document_chembl_id"
  filter_field: "document_chembl_id"
  batch_size: 20
