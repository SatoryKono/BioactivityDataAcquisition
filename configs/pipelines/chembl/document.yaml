# configs/pipelines/chembl/document.yaml
# Конфигурация пайплайна для сущности Document из ChEMBL.

pipeline_name: chembl_document
provider: chembl
entity_type: document
version: "1.0.0"
description: "Extract scientific documents from ChEMBL API"

primary_keys: ["document_chembl_id"]
silver_table: "chembl_document"

# Ссылка на файл с конфигурацией источника данных
source_file: ../../sources/chembl.yaml

# Gold filters: documents with title
gold_filters:
    columns:
        doc_type: [PUBLICATION]
    ranges:
        year:
            min: 1950
            include_min: false
    required_fields:
        - title
        - pubmed_id
        - doi

transform:
    version: "1.0.0"
    steps:
        - normalize_values
        - add_metadata
        - calculate_content_hash

sink:
    bronze:
        path: "data/output/bronze"
        format: jsonl
        save_json: true
        deterministic: true

    silver:
        path: "data/output/silver"
        format: delta
        mode: merge
        on_schema_mismatch: evolve  # Allow schema evolution for _index field
        primary_key: [ "document_chembl_id" ]
        partition_by: [ "doc_type" ]
        classification: public
        forensic_retention: true
        deterministic: true
        csv_export:
            enabled: true
            path: "data/output/csv/silver"
            delimiter: ","
            header: true
            encoding: "utf-8"

    gold:
        enabled: true
        validation:
            strict: true  # REQ-DATA-009: Gold validation must be strict
        path: "data/output/gold"
        format: delta
        mode: overwrite
        deterministic: true
        csv_export:
            enabled: true
            path: "data/output/csv/gold"
            delimiter: ","
            header: true
            encoding: "utf-8"

dq_rules:
    soft_fail_threshold: 0.05
    hard_fail_threshold: 0.20

circuit_breaker:
    failure_threshold: 5
    recovery_timeout: 300

# Input filter configuration (for CSV-based ID filtering)
# CLI options --input-csv, --filter-column, --filter-field override these
input_filter:
    enabled: true
    source_path: "data/input/publication.csv"  # Default CSV path
    column_name: "document_chembl_id"        # Column in CSV with IDs
    filter_field: "document_chembl_id"       # API field to filter by
    batch_size: 20                           # IDs per API request
