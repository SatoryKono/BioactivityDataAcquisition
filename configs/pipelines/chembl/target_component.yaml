# configs/pipelines/chembl/target_component.yaml
# Pipeline configuration for ChEMBL Target Component entity.
#
# Inherits defaults from ../_defaults.yaml

pipeline_name: chembl_target_component
provider: chembl
entity_type: target_component
version: "1.0.0"
description: "ChEMBL Target Components (protein sequences, etc.)"

primary_keys: ["component_id"]
silver_table: chembl_target_component
gold_table: chembl_target_component

source_file: ../../sources/chembl.yaml

# Entity-specific batch settings
batch_size: 1000
checkpoint_interval: 1000

# Entity-specific gold filters
gold_filters:
  required_fields: ["accession"]
  columns:
    component_type: ["PROTEIN"]

# Entity-specific sink overrides (custom paths for this entity)
sink:
  bronze:
    path: data/bronze/chembl/target_component
  silver:
    path: data/silver/chembl/target_component
    partition_by: ["organism"]
    csv_export:
      path: "data/output/csv/silver"
  gold:
    path: data/gold/chembl/target_component
    csv_export:
      path: "data/output/csv/gold"

# Entity-specific input filter
input_filter:
  enabled: true
  source_path: "data/input/target_component.csv"
  column_name: "component_id"
  filter_field: "component_id"
  batch_size: 100
