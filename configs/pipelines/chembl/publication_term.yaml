# configs/pipelines/chembl/publication_term.yaml
# ChEMBL Publication Term — derived entity from Publication records.
# DQ & Filters: loaded via hierarchy (ADR-027/028/029).
# Note: entity_type=publication_term maps to ChEMBL API /document endpoint (derived entity, ADR-024)

pipeline_name: chembl_publication_term
provider: chembl
entity_type: publication_term
schema_file: ../../schemas/chembl/publication_term.yaml
# Override: v2.1.0 schema redesign after ADR-024 naming migration
version: "2.1.0"
description: "Extract publication terms (MeSH, keywords) from ChEMBL Publication records"

# Override: full_scan required — API doesn't support stable incremental cursors
loading_strategy: full_scan_only

# Composite primary key (publication_id + term_type + term)
# entity_id is generated as SHA256 hash of composite key
business_primary_keys: ["entity_id"]

sink:
  silver:
    # Override: partition by term_type for efficient type-specific queries
    partition_by: ["term_type"]
  gold:
    # Override: terms recomputed each run, no SCD tracking needed
    mode: overwrite
