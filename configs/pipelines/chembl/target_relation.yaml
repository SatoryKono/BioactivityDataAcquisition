# configs/pipelines/chembl/target_relation.yaml
# Конфигурация пайплайна для сущности Target Relation из ChEMBL.
#
# Target relations form a directed graph describing relationships between
# biological targets (subtypes, variants, complexes).
# Load strategy: full (reference data, rarely changes).

pipeline_name: chembl_target_relation
provider: chembl
entity_type: target_relation
version: "1.0.0"
description: "Extract target relations from ChEMBL API"

# Composite primary key: (target_chembl_id, related_target_chembl_id, relationship)
primary_keys: ["target_chembl_id", "related_target_chembl_id", "relationship"]
silver_table: "chembl_target_relation"

# Ссылка на файл с конфигурацией источника данных
source_file: ../../sources/chembl.yaml

# Gold filters: all relations with complete composite key
gold_filters:
    required_fields:
        - target_chembl_id
        - related_target_chembl_id
        - relationship

transform:
    version: "1.0.0"
    steps:
        - normalize_values
        - add_metadata
        - calculate_content_hash

sink:
    bronze:
        path: "data/output/bronze"
        format: jsonl
        save_json: true
        deterministic: true

    silver:
        path: "data/output/silver"
        format: delta
        mode: merge
        on_schema_mismatch: evolve  # Allow schema evolution for _index field
        # Composite primary key for deduplication
        primary_key: ["target_chembl_id", "related_target_chembl_id", "relationship"]
        partition_by: []
        classification: public
        forensic_retention: true
        deterministic: true
        sort_by:
            columns: ["target_chembl_id", "related_target_chembl_id", "relationship"]
            ascending: true
        csv_export:
            enabled: true
            path: "data/output/csv/silver"
            delimiter: ","
            header: true
            encoding: "utf-8"

    gold:
        enabled: true
        validation:
            strict: true
        path: "data/output/gold"
        format: delta
        mode: overwrite
        deterministic: true
        sort_by:
            columns: ["target_chembl_id", "related_target_chembl_id", "relationship"]
            ascending: true
        csv_export:
            enabled: true
            path: "data/output/csv/gold"
            delimiter: ","
            header: true
            encoding: "utf-8"

dq_rules:
    soft_fail_threshold: 0.05
    hard_fail_threshold: 0.20

circuit_breaker:
    failure_threshold: 5
    recovery_timeout: 300

# Input filter configuration (for CSV-based ID filtering)
input_filter:
    enabled: true
    source_path: "data/input/target_relation.csv"
    column_name: "target_chembl_id"
    filter_field: "target_chembl_id"
    batch_size: 20
