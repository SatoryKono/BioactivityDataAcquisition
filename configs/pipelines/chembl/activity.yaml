# configs/pipelines/chembl/activity.yaml
# Конфигурация пайплайна для сущности Activity из ChEMBL.
# Соответствует схеме из RULES.md App D.

pipeline:
    name: chembl_activity
    provider: chembl
    entity: activity

source:
    type: api
    load_strategy: incremental # Инкрементальная загрузка по умолчанию
    watermark_field: molecule_chembl_id # Пример поля для watermark

transform:
    version: "1.0.0"
    steps:
        - normalize_values
        - add_metadata
        - calculate_content_hash

sink:
    bronze:
        path: "data/output/bronze"
        format: json

    silver:
        path: "data/output/silver"
        format: delta
        mode: merge
        primary_key: [ "activity_id" ]
        partition_by: [ "year", "month" ] # Пример партиционирования по дате извлечения
        classification: public
        forensic_retention: true

    gold:
        enabled: true
        validation:
            strict: true
        path: "data/output/gold"
        format: delta
        mode: overwrite

    csv_export:
        enabled: true
        path: "data/output/csv"

dq_rules:
    soft_fail_threshold: 0.05  # 5% (Warning)
    hard_fail_threshold: 0.20  # 20% (Fail Batch)

circuit_breaker:
    failure_threshold: 5
    recovery_timeout: 300 # 5 минут

rate_limit:
    requests_per_second: 5
    burst: 10
