# configs/pipelines/chembl/activity.yaml
# Pipeline configuration for ChEMBL Activity entity.
#
# Inherits defaults from ../_base.yaml:
# - dq_rules, circuit_breaker, sink structure, maintenance, input_filter

pipeline_name: chembl_activity
provider: chembl
entity_type: activity
version: "1.2.0"
description: "Extract biological activity records from ChEMBL API"

primary_keys: ["activity_id"]
silver_table: "chembl_activity"
gold_table: "chembl_activity"

# Reference to source configuration file
source_file: ../../sources/chembl.yaml

# -----------------------------------------------------------------------------
# Data Quality Configuration
# -----------------------------------------------------------------------------
# DQ config is loaded from hierarchical files:
#   1. configs/dq/_defaults.yaml (global defaults)
#   2. configs/dq/providers/chembl.yaml (provider-specific)
#   3. configs/dq/entities/chembl/activity.yaml (entity-specific)
#
# Reference to DQ config file (enables hierarchical loading)
dq_config_file: ../../dq/entities/chembl/activity.yaml

# -----------------------------------------------------------------------------
# Inline DQ Overrides (optional, applied on top of dq_config_file)
# -----------------------------------------------------------------------------
# Use dq_rules for temporary overrides or pipeline-specific adjustments
# that don't belong in the shared DQ config files.
dq_rules:
  # Thresholds (inherit from _base.yaml defaults: soft=0.05, hard=0.20)

  # Field-level validations
  field_validations:
    - field: "activity_id"
      type: "range"
      min: 1
      nullable: false
      error_message: "activity_id must be a positive integer"
    - field: "molecule_chembl_id"
      type: "pattern"
      pattern: "^CHEMBL\\d+$"
      nullable: false
      error_message: "molecule_chembl_id must match CHEMBL format"
    - field: "target_chembl_id"
      type: "pattern"
      pattern: "^CHEMBL\\d+$"
      nullable: true
      error_message: "target_chembl_id must match CHEMBL format"
    - field: "assay_chembl_id"
      type: "pattern"
      pattern: "^CHEMBL\\d+$"
      nullable: true
      error_message: "assay_chembl_id must match CHEMBL format"
    - field: "standard_value"
      type: "range"
      min: 0
      max: 1000000000
      nullable: true
      error_message: "standard_value must be non-negative"
    - field: "standard_type"
      type: "enum"
      allowed: ["IC50", "Ki", "Kd", "EC50", "AC50", "GI50", "ED50", "MIC", "CC50"]
      nullable: true
    - field: "standard_units"
      type: "enum"
      allowed: ["nM", "uM", "mM", "pM", "M", "ug.mL-1", "mg.kg-1"]
      nullable: true
    - field: "assay_type"
      type: "enum"
      allowed: ["B", "F", "A", "T", "P", "U"]
      nullable: true
    - field: "pchembl_value"
      type: "range"
      min: 0
      max: 15
      nullable: true
      error_message: "pchembl_value must be between 0 and 15"

  # Cross-field validations
  cross_field_validations:
    - name: "activity_completeness"
      fields: ["standard_value", "standard_units", "standard_type"]
      condition: "all_present"
      error_message: "Complete activity data requires value, units, and type"

  # Conditional validations
  conditional_validations:
    - name: "ic50_range_check"
      condition_field: "standard_type"
      condition_value: "IC50"
      condition_operator: "eq"
      then_validations:
        - field: "standard_value"
          type: "range"
          min: 0.001
          max: 100000
          nullable: false

# Entity-specific gold filters
gold_filters:
  columns:
    standard_type: [IC50, Ki]
    standard_units: [nM]
    standard_relation: ["="]
    assay_type: [B, F]
    potential_duplicate: ["0"]
  ranges:
    standard_value:
      min: 0
      include_min: false
  required_fields:
    - standard_type
    - standard_value
    - standard_units
    - target_chembl_id

# Entity-specific sink overrides (paths and primary_key)
sink:
  bronze:
    path: "data/output/bronze/chembl/activity"
    # DQ report configuration (optional, disabled by default)
    dq_report:
      enabled: false          # Set to true to generate Bronze DQ reports
      format: json            # Output format: json, yaml, or html
      checks:
        - record_count        # Count validation
        - file_integrity      # BLAKE2 checksums
        - schema_snapshot     # Schema inference
  silver:
    path: "data/output/silver/chembl/activity"
    primary_key: ["activity_id"]
    partition_by: []
    sort_by:
      columns: ["activity_id"]
      ascending: true
    csv_export:
      path: "data/output/silver/chembl/activity"
    # DQ report configuration (optional, disabled by default)
    dq_report:
      enabled: false          # Set to true to generate Silver DQ reports
      format: json            # Output format: json, yaml, or html
      checks:
        - record_count        # Count validation
        - null_rate           # Per-column null analysis
        - uniqueness          # Primary key uniqueness
        - type_conformance    # Type validation
        - value_distribution  # Distribution stats
        - schema_drift        # Schema evolution detection
        - deduplication_stats # Dedupe by hash/business key
  gold:
    path: "data/output/gold/chembl/activity"
    sort_by:
      columns: ["activity_id"]
      ascending: true
    csv_export:
      path: "data/output/gold/chembl/activity"
    # DQ report configuration (optional, disabled by default)
    dq_report:
      enabled: false          # Set to true to generate Gold DQ reports
      format: json            # Output format: json, yaml, or html
      checks:
        - record_count        # Count validation
        - completeness        # Required field fill rates
        - business_rules      # Business rule validation
        - referential_integrity # FK validation
        - statistical_profile # Baseline comparison
        - anomaly_detection   # Z-score anomalies

# Entity-specific input filter
input_filter:
  enabled: true
  source_path: "data/input/activity.csv"
  column_name: "activity_id"
  filter_field: "activity_id"
  batch_size: 20
