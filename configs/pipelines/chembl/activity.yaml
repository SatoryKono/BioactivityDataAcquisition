# configs/pipelines/chembl/activity.yaml
# ChEMBL Activity — inherits from _base.yaml.
# DQ & Filters: loaded via hierarchy (ADR-027/028/029).

pipeline_name: chembl_activity
provider: chembl
entity_type: activity
schema_file: "../../schemas/chembl/activity.yaml"
description: "Extract biological activity records from ChEMBL API"

business_primary_keys: [ "activity_id" ]
# Override: large dataset requires bigger batches for throughput
batch_size: 1000

# Pipeline-specific DQ overrides that DIFFER from configs/quality/entities/chembl/activity.yaml.
# Duplicate rules (standard_value range, activity_completeness, ic50_range_check)
# removed — they are identical to entity DQ config and handled by DQConfigLoader merge.
dq_overrides:
    field_validations:
        # Restrict: entity allows 12 standard_types; pipeline narrows to 9
        # (excludes Potency, Activity, Inhibition — only quantitative measurements)
        -   field: "standard_type"
            type: "enum"
            allowed: [ "IC50", "Ki", "Kd", "EC50", "AC50", "GI50", "ED50", "MIC", "CC50" ]
            nullable: true
        # Restrict: entity allows 8 units incl. "%"; pipeline excludes "%"
        # (only molar concentration units for standardized comparison)
        -   field: "standard_units"
            type: "enum"
            allowed: [ "nM", "uM", "mM", "pM", "M", "ug.mL-1", "mg.kg-1" ]
            nullable: true
