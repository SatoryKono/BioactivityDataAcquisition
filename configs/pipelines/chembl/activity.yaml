# configs/pipelines/chembl/activity.yaml
# Конфигурация пайплайна для сущности Activity из ChEMBL.

pipeline_name: chembl_activity
provider: chembl
entity_type: activity
version: "1.0.0"
description: "Extract biological activity records from ChEMBL API"

primary_keys: ["activity_id"]
silver_table: "chembl_activity"

# Ссылка на файл с конфигурацией источника данных
source_file: ../../sources/chembl.yaml

gold_filter_types:
    - IC50
    - Ki

transform:
    version: "1.0.0"
    steps:
        - normalize_values
        - add_metadata
        - calculate_content_lf  hash

sink:
    bronze:
        path: "data/output/bronze"
        format: jsonl
        save_json: true  # Also save uncompressed JSONL copy

    silver:
        path: "data/output/silver"
        format: delta
        mode: merge
        primary_key: [ "activity_id" ]
        partition_by: [ "year", "month" ]
        classification: public
        forensic_retention: true
        csv_export:
            enabled: true
            path: "data/output/csv/silver"
            delimiter: ","
            header: true
            encoding: "utf-8"

    gold:
        enabled: true
        validation:
            strict: true
        path: "data/output/gold"
        format: delta
        mode: overwrite
        csv_export:
            enabled: true
            path: "data/output/csv/gold"
            delimiter: ","
            header: true
            encoding: "utf-8"

dq_rules:
    soft_fail_threshold: 0.05
    hard_fail_threshold: 0.20

circuit_breaker:
    failure_threshold: 5
    recovery_timeout: 300

# Input filter configuration (for CSV-based ID filtering)
# CLI options --input-csv, --filter-column, --filter-field override these
input_filter:
    enabled: true
    source_path: "data/input/activity.csv"  # Default CSV path
    column_name: "activity_id"         # Column in CSV with IDs
    filter_field: "activity_id"        # API field to filter by
    batch_size: 20                           # IDs per API request
