# configs/pipelines/chembl/publication_similarity.yaml
# ChEMBL Publication Similarity — inherits from _base.yaml.
# DQ & Filters: loaded via hierarchy (ADR-027/028/029).
# Note: entity_type=publication_similarity maps to ChEMBL API /document_similarity endpoint (ADR-024)

pipeline_name: chembl_publication_similarity
provider: chembl
entity_type: publication_similarity
# Override: v2.1.0 schema redesign after ADR-024 naming migration
version: "2.1.0"
description: "Extract publication similarity data (Tanimoto coefficients) from ChEMBL API"
schema_file: "../../schemas/chembl/publication_similarity.yaml"

# Override: full_scan required — API doesn't support stable incremental cursors
loading_strategy: full_scan_only

business_primary_keys: ["sim_id"]

sink:
  gold:
    # Override: similarity scores recomputed each run, no SCD tracking needed
    mode: overwrite
