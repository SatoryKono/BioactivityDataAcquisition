# configs/pipelines/chembl/publication_similarity.yaml
# Pipeline configuration for ChEMBL Publication Similarity entity.
#
# Inherits defaults from ../_base.yaml
# Note: entity_type=document_similarity maps to ChEMBL API /document_similarity endpoint

pipeline_name: chembl_publication_similarity
provider: chembl
entity_type: document_similarity
version: "2.1.0"
description: "Extract publication similarity data (Tanimoto coefficients) from ChEMBL API"

primary_keys: ["sim_id"]
silver_table: "chembl_publication_similarity"
gold_table: "chembl_publication_similarity"

source_file: ../../sources/chembl.yaml

# -----------------------------------------------------------------------------
# Data Quality Rules (entity-specific overrides)
# -----------------------------------------------------------------------------
dq_rules:
  field_validations:
    - field: "sim_id"
      type: "range"
      min: 1
      nullable: false
    - field: "doc_1"
      type: "range"
      min: 1
      nullable: false
    - field: "doc_2"
      type: "range"
      min: 1
      nullable: false
    - field: "max_tani"
      type: "range"
      min: 0
      max: 1
      nullable: true
      error_message: "Tanimoto coefficient must be between 0 and 1"
    - field: "avg_tani"
      type: "range"
      min: 0
      max: 1
      nullable: true
      error_message: "Average Tanimoto must be between 0 and 1"

  cross_field_validations:
    - name: "similarity_pair"
      fields: ["doc_1", "doc_2"]
      condition: "all_present"
      error_message: "Both document IDs are required"

# Entity-specific gold filters
gold_filters:
  ranges:
    # Filter to significant similarities only
    max_tani:
      min: 0.5
      include_min: true
  required_fields:
    - sim_id
    - doc_1
    - doc_2

# Entity-specific sink overrides
sink:
  bronze:
    path: "data/output/bronze/chembl/document_similarity"
  silver:
    path: "data/output/silver/chembl/document_similarity"
    primary_key: ["sim_id"]
    partition_by: []  # No good partition key
    sort_by:
      columns: ["sim_id"]
      ascending: true
    csv_export:
      path: "data/output/silver/chembl/document_similarity"
  gold:
    path: "data/output/gold/chembl/document_similarity"
    sort_by:
      columns: ["sim_id"]
      ascending: true
    csv_export:
      path: "data/output/gold/chembl/document_similarity"

# No input filter needed - load full dataset
input_filter:
  enabled: false
