pipeline_name: chembl_assay
provider: chembl
entity_type: assay
version: "1.2.0"
description: "Extract bioassay definitions from ChEMBL API"

primary_keys: ["assay_id"]
silver_table: "chembl_assay"
gold_table: "chembl_assay"

# -----------------------------------------------------------------------------
# DQ Configuration (ADR-027)
# -----------------------------------------------------------------------------
# All DQ rules externalized to configs/quality/entities/chembl/assay.yaml.
# No inline overrides needed — entity config is authoritative.

# -----------------------------------------------------------------------------
# Sink Overrides (only non-convention values)
# -----------------------------------------------------------------------------
sink:
  silver:
    partition_by: ["assay_type"]
  gold:
    mode: scd2
    scd_config:
      valid_from: _valid_from
      valid_to: _valid_to
      is_current: _is_current
      version: _version
