# configs/pipelines/chembl/assay.yaml
# Pipeline configuration for ChEMBL Assay entity.
#
# Inherits defaults from ../_base.yaml

pipeline_name: chembl_assay
provider: chembl
entity_type: assay
version: "1.2.0"
description: "Extract bioassay definitions from ChEMBL API"

primary_keys: ["assay_chembl_id"]
silver_table: "chembl_assay"
gold_table: "chembl_assay"

source_file: ../../sources/chembl.yaml

# -----------------------------------------------------------------------------
# Data Quality Rules (entity-specific overrides)
# -----------------------------------------------------------------------------
dq_rules:
  field_validations:
    - field: "assay_chembl_id"
      type: "pattern"
      pattern: "^CHEMBL\\d+$"
      nullable: false
      error_message: "assay_chembl_id must match CHEMBL format"
    - field: "assay_type"
      type: "enum"
      allowed: ["B", "F", "A", "T", "P", "U"]
      nullable: false
      error_message: "assay_type must be one of B, F, A, T, P, U"
    - field: "confidence_score"
      type: "range"
      min: 0
      max: 9
      nullable: true
    - field: "target_chembl_id"
      type: "pattern"
      pattern: "^CHEMBL\\d+$"
      nullable: true
    - field: "document_chembl_id"
      type: "pattern"
      pattern: "^CHEMBL\\d+$"
      nullable: true
    - field: "relationship_type"
      type: "enum"
      allowed: ["D", "H", "M", "N", "S", "U"]
      nullable: true

  cross_field_validations:
    - name: "assay_identifiable"
      fields: ["assay_chembl_id", "description"]
      condition: "all_present"
      error_message: "Assay must have ID and description"

# Entity-specific gold filters
gold_filters:
  columns:
    assay_type: [B, F]  # Binding, Functional
    confidence_score: ["8", "9"]  # Minimum 8 (0-9 scale)
    relationship_type: [D]  # Direct interaction only
  required_fields:
    - assay_type
    - description

# Entity-specific sink overrides
sink:
  bronze:
    path: "data/output/bronze/chembl/assay"
  silver:
    path: "data/output/silver/chembl/assay"
    primary_key: ["assay_chembl_id"]
    partition_by: ["assay_type"]
    sort_by:
      columns: ["assay_chembl_id"]
      ascending: true
    csv_export:
      path: "data/output/silver/chembl/assay"
  gold:
    path: "data/output/gold/chembl/assay"
    sort_by:
      columns: ["assay_chembl_id"]
      ascending: true
    csv_export:
      path: "data/output/gold/chembl/assay"

# Entity-specific input filter
input_filter:
  enabled: true
  source_path: "data/input/assay.csv"
  column_name: "assay_chembl_id"
  filter_field: "assay_chembl_id"
  batch_size: 20
