# configs/pipelines/chembl/assay.yaml
# ChEMBL Assay — inherits from _base.yaml.
# DQ & Filters: loaded via hierarchy (ADR-027/028/029).

pipeline_name: chembl_assay
provider: chembl
entity_type: assay
description: "Extract bioassay definitions from ChEMBL API"

business_primary_keys: [ "assay_id" ]
# Override: large dataset requires bigger batches for throughput
batch_size: 1000

sink:
  silver:
    # Override: partition by assay_type for efficient type-specific queries
    partition_by: [ "assay_type" ]
