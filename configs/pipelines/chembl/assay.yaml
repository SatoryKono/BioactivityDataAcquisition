# configs/pipelines/chembl/assay.yaml
# Pipeline configuration for ChEMBL Assay entity.
#
# Inherits defaults from ../_base.yaml:
# - metadata (lineage, provenance, content_hash)
# - dq_config (thresholds, anomaly_detection, quarantine, metrics)
# - circuit_breaker, sink structure, maintenance, input_filter

pipeline_name: chembl_assay
provider: chembl
entity_type: assay
version: "2.0.0"
description: "Extract bioassay definitions from ChEMBL API"

primary_keys: ["assay_chembl_id"]
silver_table: "chembl_assay"
gold_table: "chembl_assay"

source_file: ../../sources/chembl.yaml

# -----------------------------------------------------------------------------
# Entity-Specific Metadata
# -----------------------------------------------------------------------------
metadata:
  schema:
    version: "1.0.0"
    contract_path: docs/contracts/gold/chembl_assay.json

# -----------------------------------------------------------------------------
# Entity-Specific DQ Configuration
# -----------------------------------------------------------------------------
dq_config:
  # Column-level validation rules
  column_checks:
    assay_chembl_id:
      nullable: false
      unique: true
      pattern: "^CHEMBL\\d+$"
    assay_type:
      nullable: false
      allowed_values: ["B", "F", "A", "T", "P", "U"]
    description:
      nullable: false
    confidence_score:
      nullable: true
      range:
        min: 0
        max: 9
    relationship_type:
      nullable: true
      allowed_values: ["D", "H", "M", "N", "U"]
    target_chembl_id:
      nullable: true
      pattern: "^CHEMBL\\d+$"
    assay_organism:
      nullable: true
    assay_strain:
      nullable: true
    assay_tissue:
      nullable: true
    assay_cell_type:
      nullable: true
    bao_format:
      nullable: true
      pattern: "^BAO_\\d+$"

# Entity-specific gold filters
gold_filters:
  columns:
    assay_type: [B, F]  # Binding, Functional
    confidence_score: ["8", "9"]  # Minimum 8 (0-9 scale)
    relationship_type: [D]  # Direct interaction only
  required_fields:
    - assay_type
    - description

# Entity-specific sink overrides
sink:
  bronze:
    path: "data/output/bronze/chembl/assay"
  silver:
    path: "data/output/silver/chembl/assay"
    primary_key: ["assay_chembl_id"]
    partition_by: ["assay_type"]
    sort_by:
      columns: ["assay_chembl_id"]
      ascending: true
    csv_export:
      path: "data/output/silver/chembl/assay"
  gold:
    path: "data/output/gold/chembl/assay"
    sort_by:
      columns: ["assay_chembl_id"]
      ascending: true
    csv_export:
      path: "data/output/gold/chembl/assay"

# Entity-specific input filter
input_filter:
  enabled: true
  source_path: "data/input/assay.csv"
  column_name: "assay_chembl_id"
  filter_field: "assay_chembl_id"
  batch_size: 20
