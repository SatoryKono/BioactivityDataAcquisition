# configs/pipelines/chembl/assay.yaml
# Конфигурация пайплайна для сущности Assay из ChEMBL.

pipeline_name: chembl_assay
provider: chembl
entity_type: assay
version: "1.0.0"
description: "Extract bioassay definitions from ChEMBL API"

primary_keys: ["assay_chembl_id"]
silver_table: "chembl_assay"

# Ссылка на файл с конфигурацией источника данных
source_file: ../../sources/chembl.yaml

# New configurable gold filters
gold_filters:
    columns:
        assay_type: [B, F]  # Binding, Functional
        confidence_score: ["8", "9"]  # Minimum 8 (0-9 scale)
        relationship_type: [D] # Direct interaction only
    required_fields:
        - assay_type
        - description

transform:
    version: "1.0.0"
    steps:
        - normalize_values
        - add_metadata
        - calculate_content_hash

sink:
    bronze:
        path: "data/output/bronze"
        format: jsonl
        save_json: true

    silver:
        path: "data/output/silver"
        format: delta
        mode: merge
        on_schema_mismatch: evolve  # Allow schema evolution for _index field
        primary_key: [ "assay_chembl_id" ]
        partition_by: [ "assay_type" ]
        classification: public
        forensic_retention: true
        csv_export:
            enabled: true
            path: "data/output/csv/silver"
            delimiter: ","
            header: true
            encoding: "utf-8"

    gold:
        enabled: true
        validation:
            strict: true  # REQ-DATA-009: Gold validation must be strict
        path: "data/output/gold"
        format: delta
        mode: overwrite
        csv_export:
            enabled: true
            path: "data/output/csv/gold"
            delimiter: ","
            header: true
            encoding: "utf-8"

dq_rules:
    soft_fail_threshold: 0.05
    hard_fail_threshold: 0.20

circuit_breaker:
    failure_threshold: 5
    recovery_timeout: 300

# Input filter configuration (for CSV-based ID filtering)
input_filter:
    enabled: true
    source_path: "data/input/assay.csv"
    column_name: "assay_chembl_id"
    filter_field: "assay_chembl_id"
    batch_size: 20
