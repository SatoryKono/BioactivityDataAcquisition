# Target Pipeline Configuration

id: target_chembl
provider: chembl
entity: target
primary_key: "${CHEMBL_TARGET_PRIMARY_KEY:-target_chembl_id}"
input_mode: id_only
input_path: data/input/target.csv
output_path: ./data/output/chembl/target
batch_size: 20
provider_config:
  provider: chembl
  base_url: https://www.ebi.ac.uk/chembl/api/data
  timeout_sec: 30.0
  max_retries: 3
  rate_limit_per_sec: 10.0
  max_url_length: 2000
  batch_size: 20
  page_size: 1000
  api_version: null

csv_options:
  delimiter: ","
  header: true

pipeline:
  name: target_chembl
  version: "1.0.0"
  owner: "Data Acquisition Team"
  description: "Extract target records from ChEMBL API"

fields:
  - name: target_chembl_id
    data_type: string
    is_nullable: false
    is_filterable: true
    description: ChEMBL ID таргета

  - name: pref_name
    data_type: string
    is_nullable: true
    is_filterable: true
    description: Название таргета

  - name: score
    data_type: number
    is_nullable: true
    is_filterable: false
    description: Score, используемый при поиске

  - name: organism
    data_type: string
    is_nullable: true
    is_filterable: true
    description: Организм

  - name: target_type
    data_type: string
    is_nullable: false
    is_filterable: true
    description: Тип таргета (SINGLE PROTEIN, PROTEIN FAMILY, ORGANISM и т.п.)

  - name: tax_id
    data_type: integer
    is_nullable: true
    is_filterable: true
    description: NCBI TaxID

  - name: species_group_flag
    data_type: boolean
    is_nullable: true
    is_filterable: false
    description: Флаг «группового» таргета по видам

  - name: target_components
    data_type: array
    is_nullable: true
    is_filterable: false
    description: Компоненты таргета (UniProt-последовательности и др.)

  - name: cross_references
    data_type: array
    is_nullable: true
    is_filterable: false
    description: Внешние кросс-референсы

hashing:
  business_key_fields:
    - target_chembl_id
# pagination задаётся провайдером и batch_size по умолчанию 20
