# configs/pipelines/chembl/target.yaml
# Конфигурация пайплайна для сущности Target из ChEMBL.

pipeline_name: chembl_target
provider: chembl
entity_type: target
version: "1.0.0"
description: "Extract biological targets from ChEMBL API"

primary_keys: ["target_chembl_id"]
silver_table: "chembl_target"

# Ссылка на файл с конфигурацией источника данных
source_file: ../../sources/chembl.yaml

# Gold filters: single proteins with name
gold_filters:
    columns:
        target_type: [SINGLE PROTEIN, PROTEIN COMPLEX]
    required_fields:
        - pref_name

transform:
    version: "1.0.0"
    steps:
        - normalize_values
        - add_metadata
        - calculate_content_hash

sink:
    bronze:
        path: "data/output/bronze"
        format: jsonl
        save_json: true

    silver:
        path: "data/output/silver"
        format: delta
        mode: merge
        primary_key: [ "target_chembl_id" ]
        partition_by: [ "target_type" ]
        classification: public
        forensic_retention: true
        csv_export:
            enabled: true
            path: "data/output/csv/silver"
            delimiter: ","
            header: true
            encoding: "utf-8"

    gold:
        enabled: true
        validation:
            strict: true
        path: "data/output/gold"
        format: delta
        mode: overwrite
        csv_export:
            enabled: true
            path: "data/output/csv/gold"
            delimiter: ","
            header: true
            encoding: "utf-8"

dq_rules:
    soft_fail_threshold: 0.05
    hard_fail_threshold: 0.20

circuit_breaker:
    failure_threshold: 5
    recovery_timeout: 300

# Input filter configuration (for CSV-based ID filtering)
# CLI options --input-csv, --filter-column, --filter-field override these
input_filter:
    enabled: true
    source_path: "data/input/target.csv"  # Default CSV path
    column_name: "target_chembl_id"        # Column in CSV with IDs
    filter_field: "target_chembl_id"       # API field to filter by
    batch_size: 20                         # IDs per API request
