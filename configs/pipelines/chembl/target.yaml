# configs/pipelines/chembl/target.yaml
# Конфигурация пайплайна для сущности Target из ChEMBL.

pipeline_name: chembl_target
provider: chembl
entity_type: target
version: "1.0.0"
description: "Extract biological targets from ChEMBL API"

primary_keys: ["target_chembl_id"]
silver_table: "chembl_target"

# Ссылка на файл с конфигурацией источника данных
source_file: ../../sources/chembl.yaml

# Gold filters: single proteins with name
gold_filters:
    columns:
        target_type: [SINGLE PROTEIN]
    list_lengths:
        component_accessions:
            min: 1
            max: 1
        component_ids:
            min: 1
    list_contains:
        component_types:
            values: [PROTEIN]
            mode: all
    required_fields:
        - pref_name
        - organism

transform:
    version: "1.0.0"
    steps:
        - normalize_values
        - add_metadata
        - calculate_content_hash

sink:
    bronze:
        path: "data/output/bronze"
        format: jsonl
        save_json: true
        deterministic: true

    silver:
        path: "data/output/silver"
        format: delta
        mode: merge
        on_schema_mismatch: evolve
        primary_key: [ "target_chembl_id" ]
        partition_by: [ "target_type" ]
        classification: public
        forensic_retention: true
        deterministic: true
        sort_by:
            columns: [ "target_chembl_id" ]
            ascending: true
        csv_export:
            enabled: true
            path: "data/output/csv/silver"
            delimiter: ","
            header: true
            encoding: "utf-8"

    gold:
        enabled: true
        path: "data/output/gold"
        format: delta
        mode: overwrite
        deterministic: true
        sort_by:
            columns: [ "target_chembl_id", "pref_name" ]
            ascending: true
        csv_export:
            enabled: true
            path: "data/output/csv/gold"
            delimiter: ","
            header: true
            encoding: "utf-8"

dq_rules:
    soft_fail_threshold: 0.05
    hard_fail_threshold: 0.20

circuit_breaker:
    failure_threshold: 5
    recovery_timeout: 300

# Input filter configuration (for CSV-based ID filtering)
input_filter:
    enabled: true
    source_path: "data/input/target.csv"
    column_name: "target_chembl_id"
    filter_field: "target_chembl_id"
    batch_size: 20
