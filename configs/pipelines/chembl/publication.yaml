# configs/pipelines/chembl/publication.yaml
# Pipeline configuration for ChEMBL Publication entity.
#
# Inherits defaults from ../_base.yaml
# Note: entity_type=document maps to ChEMBL API /document endpoint

pipeline_name: chembl_publication
provider: chembl
entity_type: document
version: "2.1.0"
description: "Extract scientific publications from ChEMBL API"

primary_keys: ["document_chembl_id"]
silver_table: "chembl_publication"
gold_table: "chembl_publication"

source_file: ../../sources/chembl.yaml

# -----------------------------------------------------------------------------
# Data Quality Rules (entity-specific overrides)
# -----------------------------------------------------------------------------
dq_rules:
  field_validations:
    - field: "document_chembl_id"
      type: "pattern"
      pattern: "^CHEMBL\\d+$"
      nullable: false
      error_message: "document_chembl_id must match CHEMBL format"
    - field: "doc_type"
      type: "enum"
      allowed: ["PUBLICATION", "BOOK", "DATASET", "PATENT"]
      nullable: true
    - field: "year"
      type: "range"
      min: 1800
      max: 2100
      nullable: true
    - field: "pubmed_id"
      type: "range"
      min: 1
      max: 100000000
      nullable: true
    - field: "doi"
      type: "pattern"
      pattern: "^10\\.\\d{4,}/.*$"
      nullable: true
      error_message: "DOI must start with 10. prefix"

  cross_field_validations:
    - name: "publication_identifiable"
      fields: ["pubmed_id", "doi", "title"]
      condition: "any_present"
      error_message: "Publication must have at least one identifier"

# Entity-specific gold filters
gold_filters:
  columns:
    doc_type: [PUBLICATION]
  ranges:
    year:
      min: 1950
      include_min: false
  required_fields:
    - title
    - pubmed_id
    - doi

# Entity-specific sink overrides
sink:
  bronze:
    path: "data/output/bronze/chembl/document"
  silver:
    path: "data/output/silver/chembl/document"
    primary_key: ["document_chembl_id"]
    partition_by: ["doc_type"]
    sort_by:
      columns: ["document_chembl_id"]
      ascending: true
    csv_export:
      path: "data/output/silver/chembl/document"
  gold:
    path: "data/output/gold/chembl/document"
    sort_by:
      columns: ["document_chembl_id"]
      ascending: true
    csv_export:
      path: "data/output/gold/chembl/document"

# Entity-specific input filter
input_filter:
  enabled: true
  source_path: "data/input/publication.csv"
  column_name: "document_chembl_id"
  filter_field: "document_chembl_id"
  batch_size: 20
