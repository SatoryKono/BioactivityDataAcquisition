# Publication Pipeline Configuration

id: publication_chembl
provider: chembl
entity: publication
primary_key: "${CHEMBL_PUBLICATION_PRIMARY_KEY:-document_chembl_id}"
input_mode: id_only
input_path: data/input/publication.csv
output_path: ./data/output/chembl/publication
batch_size: 10
provider_config:
  provider: chembl
  base_url: https://www.ebi.ac.uk/chembl/api/data
  client:
    timeout_sec: 30.0
    max_retries: 3
    rate_limit_per_sec: 10.0
  max_url_length: 2000
  batch_size: 10
  page_size: 1000
  api_version: null

csv_options:
  delimiter: ","
  header: true

pipeline:
  name: publication_chembl
  version: "1.0.0"
  owner: "Data Acquisition Team"
  description: "Extract publication records from ChEMBL API"

transform:
  serialization_mode: pipe

fields:
  - name: abstract
    data_type: string
    is_nullable: true
    is_filterable: true
    description: Аннотация документа

  - name: authors
    data_type: string
    is_nullable: true
    is_filterable: true
    description: Строка с авторами

  - name: contact
    data_type: string
    is_nullable: true
    is_filterable: false
    description: Контакт для deposited datasets

  - name: doc_type
    data_type: string
    is_nullable: false
    is_filterable: true
    description: Тип публикации (PUBLICATION, DATASET, PATENT и т.п.)

  - name: document_chembl_id
    data_type: string
    is_nullable: false
    is_filterable: true
    description: ChEMBL ID публикации

  - name: doi
    data_type: string
    is_nullable: true
    is_filterable: true
    description: DOI публикации

  - name: doi_chembl
    data_type: string
    is_nullable: true
    is_filterable: false
    description: Внутренний DOI ChEMBL для датасетов

  - name: first_page
    data_type: string
    is_nullable: true
    is_filterable: false
    description: Первая страница

  - name: issue
    data_type: string
    is_nullable: true
    is_filterable: false
    description: Номер выпуска

  - name: journal
    data_type: string
    is_nullable: true
    is_filterable: true
    description: Сокращённое название журнала

  - name: journal_full_title
    data_type: string
    is_nullable: true
    is_filterable: false
    description: Полное название журнала

  - name: last_page
    data_type: string
    is_nullable: true
    is_filterable: false
    description: Последняя страница

  - name: patent_id
    data_type: string
    is_nullable: true
    is_filterable: true
    description: Идентификатор патента

  - name: pubmed_id
    data_type: string
    is_nullable: true
    is_filterable: true
    description: PubMed ID

  - name: score
    data_type: number
    is_nullable: true
    is_filterable: false
    description: Score для поискового ранжирования

  - name: src_id
    data_type: integer
    is_nullable: true
    is_filterable: true
    description: ID источника (журнал, WDI, deposited и т.п.)

  - name: title
    data_type: string
    is_nullable: false
    is_filterable: true
    description: Заголовок статьи/публикации

  - name: volume
    data_type: string
    is_nullable: true
    is_filterable: false
    description: Том

  - name: year
    data_type: integer
    is_nullable: true
    is_filterable: true
    description: Год публикации

  - name: chembl_release
    data_type: string
    is_nullable: true
    is_filterable: false
    description: Идентификатор релиза ChEMBL, в котором публикация появилась

quality:
  hashing:
    business_key_fields:
      - document_chembl_id
  normalization:
    case_sensitive_fields:
      - doc_type
      - canonical_smiles
      - smiles
      - inchi
      - inchi_key
      - standard_inchi
      - standard_inchi_key
      - molecule_structures
      - helm_notation
      - variant_sequence
      - target_components
      - cross_references
      - standard_type
      - type
      - doc_type
      
    id_fields:
      - doi
      - doi_chembl
      - accession
      - uo_units
      - qudt_units
      - toid
      - bao_endpoint
      - bao_format
      - atc_classifications
      - ligand_efficiency
      - assay_type
# pagination задаётся провайдером и batch_size по умолчанию 10
