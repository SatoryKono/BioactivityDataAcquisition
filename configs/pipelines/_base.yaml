# configs/pipelines/_base.yaml
# =============================================================================
# Unified Base Schema for BioETL Pipeline Configurations
# =============================================================================
#
# This file defines the canonical schema for all pipeline configurations.
# All entity-specific configs MUST inherit these defaults unless explicitly
# overriding with documented justification.
#
# Version: 3.0.0
# Reference: RULES.md v5.10, Appendix D
# Last Updated: 2026-01-15
#
# Usage:
#   Entity configs specify only entity-specific fields:
#   - pipeline_name, provider, entity_type
#   - primary_keys, silver_table, gold_table
#   - gold_filters
#   - sink path overrides
#   - input_filter configuration
#   - column_checks (entity-specific DQ checks)
#
# Inheritance Chain:
#   _base.yaml (this file) -> <provider>/<entity>.yaml
#
# =============================================================================

# -----------------------------------------------------------------------------
# Schema Version
# -----------------------------------------------------------------------------
schema_version: "3.0.0"

# -----------------------------------------------------------------------------
# Pipeline Identification (MUST be overridden in entity config)
# -----------------------------------------------------------------------------
# pipeline_name: <provider>_<entity>  # MUST: Unique identifier
# provider: <provider>                 # MUST: chembl | pubchem | uniprot | ...
# entity_type: <entity>                # MUST: activity | assay | molecule | ...
# version: "1.0.0"                     # MUST: Semantic version of config

# -----------------------------------------------------------------------------
# Metadata Configuration (Lineage, Provenance, Content Hash, Schema)
# Reference: RULES.md §2.3, §2.4, §2.8.1, §7.1
# -----------------------------------------------------------------------------
metadata:
  # ---------------------------------------------------------------------------
  # Lineage Tracking (§2.3)
  # ---------------------------------------------------------------------------
  lineage:
    enabled: true
    log_table: sys.lineage_log
    track_bronze_paths: true
    track_transform_version: true

  # ---------------------------------------------------------------------------
  # Provenance Fields (§2.4)
  # MUST: These fields are required for backfill and audit
  # ---------------------------------------------------------------------------
  provenance:
    run_id_field: _run_id                 # MUST: UUID identifying the pipeline run
    run_type_field: _run_type             # MUST: incremental | backfill | rebuild
    batch_id_field: _source_batch_id      # MUST: FK to lineage_log
    ingestion_ts_field: _ingestion_ts     # Timestamp of record ingestion

  # ---------------------------------------------------------------------------
  # Content Hash Configuration (§2.8.1)
  # Used for deduplication and idempotent writes
  # ---------------------------------------------------------------------------
  content_hash:
    algorithm: sha256
    include_provider_prefix: true
    excluded_fields:
      - _ingestion_ts
      - _run_id
      - _run_type
      - _source_batch_id
      - _dq_score
      - _dq_flags
    normalization:
      float_precision: 10
      nan_to_null: true
      inf_to_null: true
      date_format: "YYYY-MM-DD"
      strip_strings: true

  # ---------------------------------------------------------------------------
  # Schema Versioning (§7.1)
  # ---------------------------------------------------------------------------
  schema:
    # Schema version follows semver (MUST be overridden in entity config)
    # version: "1.0.0"
    # contract_path: docs/contracts/gold/<entity>.json
    deprecation_period_days: 14
    evolution_strategy: backward_compatible

# -----------------------------------------------------------------------------
# Source Configuration
# -----------------------------------------------------------------------------
# NOTE: Source settings (type, load_strategy, rate_limit, circuit_breaker)
# are defined in configs/sources/<provider>.yaml for DRY compliance.
# Pipeline configs reference source via: source_file: ../../sources/<provider>.yaml

source:
  # Default source type (can be overridden for file-based pipelines)
  type: api

  # Load strategy
  # - full: Complete dataset refresh (default for most pipelines)
  # - incremental: Delta loads using watermark_field (future enhancement)
  load_strategy: full

  # Watermark field for incremental loads (SHOULD specify when using incremental)
  # watermark_field: updated_at

# -----------------------------------------------------------------------------
# Transformation Configuration
# -----------------------------------------------------------------------------
transform:
  # Version of transformation logic (MUST match config version)
  # version: "1.0.0"  # Inherited from root `version` field

  # Transformation steps (SHOULD document for complex pipelines)
  # These are implemented in code but documented here for clarity
  steps: []
  # Example steps:
  #   - normalize_units      # Standardize measurement units
  #   - validate_smiles      # Validate SMILES notation
  #   - deduplicate          # Remove duplicate records
  #   - enrich_metadata      # Add computed fields

# -----------------------------------------------------------------------------
# Data Quality Configuration
# Reference: RULES.md §3.1.2, §3.4, §3.4.1, §2.6
# -----------------------------------------------------------------------------
dq_config:
  # ---------------------------------------------------------------------------
  # Thresholds (§3.1.2)
  # ---------------------------------------------------------------------------
  thresholds:
    # Soft threshold - triggers WARNING but continues processing
    # MUST: Default 5% error rate before warning
    soft_fail_percent: 5.0

    # Hard threshold - triggers FAILURE and stops batch
    # MUST: Default 20% error rate before failure
    hard_fail_percent: 20.0

    # Scope of threshold evaluation
    scope:
      - record_error_rate           # % of invalid records in batch
      - entity_error_rate           # % of invalid unique entities

  # ---------------------------------------------------------------------------
  # Anomaly Detection (§3.4.1)
  # ---------------------------------------------------------------------------
  anomaly_detection:
    enabled: true
    baseline:
      type: moving_average
      window_days: 30
    alerts:
      # Null rate thresholds (multiplier of baseline)
      null_rate_warning_multiplier: 2.0
      null_rate_critical_multiplier: 5.0
      # Record count thresholds (% of baseline)
      record_count_warning_percent: 70    # Alert if <70% of baseline
      record_count_critical_percent: 50   # Critical if <50% of baseline
      # Freshness thresholds
      freshness_warning_hours: 24
      freshness_critical_hours: 72
    cold_start:
      # Initial period with no alerts
      silence_days: 7
      # Period with warnings only (days 8-30)
      warning_only_days: 30
      # Full alerting after this period
      full_alerting_after_days: 30

  # ---------------------------------------------------------------------------
  # Per-Column Checks
  # Entity-specific column checks SHOULD be defined in entity configs
  # ---------------------------------------------------------------------------
  column_checks: {}
  # Example structure:
  #   <column_name>:
  #     nullable: true/false
  #     unique: true/false
  #     pattern: "<regex>"
  #     range:
  #       min: <value>
  #       max: <value>
  #     allowed_values: [<value1>, <value2>]

  # ---------------------------------------------------------------------------
  # Quarantine Configuration (§2.6)
  # ---------------------------------------------------------------------------
  quarantine:
    enabled: true
    table: common.quarantine
    payload_max_bytes: 65536            # 64KB truncation for large records
    retention_days: 30
    error_codes:
      - SCHEMA_VIOLATION
      - NULL_REQUIRED_FIELD
      - PATTERN_MISMATCH
      - RANGE_VIOLATION
      - DUPLICATE_RECORD
      - TRANSFORM_ERROR

  # ---------------------------------------------------------------------------
  # DQ Metrics Export (§3.4)
  # ---------------------------------------------------------------------------
  metrics:
    export_format: prometheus
    labels:
      - pipeline
      - entity
      - provider
      - column
      - check_type
    metrics:
      - dq_validation_score           # Overall DQ score (0-1)
      - data_freshness_seconds        # Time since last update
      - quarantine_records_total      # Total quarantined records
      - dq_soft_threshold_exceeded    # Counter for soft threshold breaches
      - dq_check_duration_ms          # Histogram for check latency

# Legacy compatibility alias (DEPRECATED - use dq_config.thresholds)
dq_rules:
  soft_fail_threshold: 0.05
  hard_fail_threshold: 0.20

# -----------------------------------------------------------------------------
# Circuit Breaker Configuration
# -----------------------------------------------------------------------------
circuit_breaker:
  # Number of consecutive failures before circuit opens
  # MUST: Default 5 failures
  failure_threshold: 5

  # Seconds to wait before attempting recovery (Half-Open state)
  # MUST: Default 300 seconds (5 minutes)
  recovery_timeout: 300

  # Provider-specific overrides are defined in source configs

# -----------------------------------------------------------------------------
# Sink Configuration
# -----------------------------------------------------------------------------
sink:
  # ---------------------------------------------------------------------------
  # Bronze Layer - Raw Data
  # ---------------------------------------------------------------------------
  bronze:
    # Output format
    format: jsonl

    # Preserve original JSON structure
    save_json: true

    # MUST: No random elements in writes (ADR-014)
    deterministic: true

    # Path template (overridden per entity)
    # path: data/output/bronze

  # ---------------------------------------------------------------------------
  # Silver Layer - Cleansed Data
  # ---------------------------------------------------------------------------
  silver:
    # MUST: Use Delta Lake format (not parquet)
    format: delta

    # Write mode
    # - merge: Upsert based on primary_key (default)
    # - overwrite: Full table replacement
    mode: merge

    # Schema evolution strategy
    on_schema_mismatch: evolve

    # Data classification
    # - public: No access restrictions
    # - internal: Organization-internal only
    # - restricted: PII or sensitive data
    classification: public

    # Forensic data retention
    # false: 7-day default retention (default)
    # true: 30-day retention for critical tables (requires justification)
    forensic_retention: false  # true только для Critical tables (требует обоснования)

    # MUST: No random elements in writes (ADR-014)
    deterministic: true

    # CSV export configuration
    csv_export:
      enabled: true
      delimiter: ","
      header: true
      encoding: "utf-8"

    # Entity-specific (MUST be overridden):
    # path: data/output/silver
    # primary_key: [<entity_id>]
    # partition_by: [<partition_column>]  # SHOULD specify if applicable

  # ---------------------------------------------------------------------------
  # Gold Layer - Business-Ready Data
  # ---------------------------------------------------------------------------
  gold:
    # Enable Gold layer processing
    enabled: true

    # Strict validation for Gold layer (ADR-018)
    validation:
      strict: true

    # MUST: Use Delta Lake format
    format: delta

    # Write mode (overwrite is common for aggregated Gold tables)
    mode: overwrite

    # MUST: No random elements in writes (ADR-014)
    deterministic: true

    # CSV export configuration
    csv_export:
      enabled: true
      delimiter: ","
      header: true
      encoding: "utf-8"

    # Entity-specific (MUST be overridden):
    # path: data/output/gold

# -----------------------------------------------------------------------------
# Maintenance Configuration
# -----------------------------------------------------------------------------
maintenance:
  # Automatic VACUUM execution
  auto_vacuum: false

  # Retention period for VACUUM (days)
  vacuum_retention_days: 7

# -----------------------------------------------------------------------------
# Input Filter Configuration
# -----------------------------------------------------------------------------
input_filter:
  # Enable filtering by input CSV
  enabled: false

  # Default batch size for filtered processing
  batch_size: 100

  # Entity-specific (when enabled):
  # source_path: data/input/<entity>.csv
  # column_name: <id_column>
  # filter_field: <api_field>
  # fallback_column: <fallback_field>  # Optional: for DOI resolution

# -----------------------------------------------------------------------------
# Gold Filters Configuration
# -----------------------------------------------------------------------------
# Entity-specific gold filters are defined in each pipeline config.
# Common patterns:
#
# gold_filters:
#   columns:
#     <field>: [<allowed_values>]
#   ranges:
#     <field>:
#       min: <value>
#       max: <value>
#       include_min: true/false
#       include_max: true/false
#   required_fields:
#     - <field1>
#     - <field2>
#   list_lengths:
#     <list_field>:
#       min: <value>
#       max: <value>
#   list_contains:
#     <list_field>:
#       values: [<value>]
#       mode: any/all
