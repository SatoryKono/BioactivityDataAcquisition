# Base pipeline config format (defaults only).
# Full documentation: docs/03-guides/CONFIG-GUIDE.md

source:
  type: api
  load_strategy: full

transform:
  steps: []

dq_overrides:
  soft_fail_threshold: 0.05
  hard_fail_threshold: 0.20
  strict_validation: false
  field_validations: []
  cross_field_validations: []
  conditional_validations: []
  invalid_record_policy: "quarantine"
  report:
    enabled: true
    format: "json"
    include_sample_failures: true
    sample_size: 10

circuit_breaker:
  failure_threshold: 5
  recovery_timeout: 300

sink:
  bronze:
    format: jsonl
    save_json: true
    deterministic: true
    save_metadata: true
    dq_report:
      enabled: true
    metadata:
      lineage:
        source_system: "<provider>"
        source_version: "<version>"
        extraction_method: "api"
      owner: "data-team"
      steward: "<pipeline>-owner"
      description: "Raw <provider> <entity> data"
      tags: ["<provider>", "<entity>", "raw"]
      retention_days: 90
      sla_freshness_hours: 24
    flat_structure: true

  silver:
    format: delta
    mode: merge
    on_schema_mismatch: evolve
    deterministic: true
    save_metadata: true
    dq_report:
      enabled: true
    metadata:
      lineage:
        source_layer: "bronze"
        transformations: ["deduplication", "normalization", "dq_validation"]
      quality_expectations:
        completeness: 0.95
        accuracy: 0.99
      description: "Cleansed <provider> <entity> data"
      tags: ["<provider>", "<entity>", "silver", "validated"]
    csv_export:
      enabled: true
      delimiter: ","
      header: true
      encoding: "utf-8"
    partition_by: []
    sort_by:
      ascending: true
    flat_structure: true

  gold:
    enabled: true
    format: delta
    mode: append
    deterministic: true
    save_metadata: true
    dq_report:
      enabled: true
    metadata:
      lineage:
        source_layer: "silver"
        filters_applied: true
      business_domain: "drug-discovery"
      use_cases: ["ml-training", "reporting", "analytics"]
      description: "Business-ready <provider> <entity> data"
      tags: ["<provider>", "<entity>", "gold", "ml-ready"]
    csv_export:
      enabled: true
      delimiter: ","
      header: true
      encoding: "utf-8"
    sort_by:
      ascending: true
    flat_structure: true

maintenance:
  auto_vacuum: false
  vacuum_retention_days: 7

input_filter:
  enabled: false
  batch_size: 100
