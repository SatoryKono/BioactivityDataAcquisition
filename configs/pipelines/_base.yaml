# Base pipeline config format (defaults only).
# Full documentation: docs/03-guides/CONFIG-GUIDE.md

source: {}

transform:
  steps: []

dq_overrides:
  soft_fail_threshold: 0.05
  hard_fail_threshold: 0.20
  strict_validation: false
  field_validations: []
  cross_field_validations: []
  conditional_validations: []
  invalid_record_policy: "quarantine"
  report:
    enabled: true
    format: "json"
    include_sample_failures: true
    sample_size: 10

circuit_breaker:
  failure_threshold: 5
  recovery_timeout: 300

sink:
  bronze:
    format: jsonl
    save_json: true
    save_metadata: true
    dq_report:
      enabled: true
    flat_structure: true

  silver:
    format: delta
    mode: merge
    on_schema_mismatch: evolve
    save_metadata: true
    dq_report:
      enabled: true
    csv_export:
      enabled: true
      delimiter: ","
      header: true
      encoding: "utf-8"
    flat_structure: true

  gold:
    enabled: true
    format: delta
    mode: append
    deterministic: true
    save_metadata: true
    dq_report:
      enabled: true
    csv_export:
      enabled: true
      delimiter: ","
      header: true
      encoding: "utf-8"
    flat_structure: true

maintenance:
  auto_vacuum: false
  vacuum_retention_days: 7

input_filter:
  enabled: false
  batch_size: 100
