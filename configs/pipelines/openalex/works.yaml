# configs/pipelines/openalex/works.yaml
# Configuration for fetching OpenAlex works (publications).
#
# Supports incremental fetch via from_updated_date filter.
# Uses cursor-based pagination for stable results.

pipeline_name: openalex_works
provider: openalex
entity_type: works
version: "1.0.0"
description: "Fetch scholarly works from OpenAlex open index"

primary_keys: ["openalex_id"]
silver_table: "openalex_works"

# Reference to data source configuration
source_file: ../../sources/openalex.yaml

# Gold layer filters - retain high-quality publications
gold_filters:
    columns:
        type: [article, book, book-chapter, dissertation, preprint, review]
        oa_status: [gold, green, hybrid, bronze, closed]
    ranges:
        publication_year:
            min: 1800
            max: 2030
    required_fields:
        - openalex_id
        - display_name
        - type

transform:
    version: "1.0.0"
    class: "bioetl.application.pipelines.openalex.OpenAlexWorkTransformer"
    steps:
        - extract_openalex_id
        - flatten_primary_location
        - flatten_open_access
        - flatten_primary_topic
        - reconstruct_abstract
        - extract_authors
        - extract_institutions
        - normalize_doi
        - extract_keywords
        - calculate_content_hash

sink:
    bronze:
        path: "data/output/bronze"
        format: jsonl
        save_json: true
        compression: zstd

    silver:
        path: "data/output/silver"
        format: delta
        mode: merge
        on_schema_mismatch: evolve
        primary_key: ["openalex_id"]
        classification: public
        forensic_retention: true
        csv_export:
            enabled: true
            path: "data/output/csv/silver"
            delimiter: ","
            header: true
            encoding: "utf-8"

    gold:
        enabled: true
        validation:
            strict: false
        path: "data/output/gold"
        format: delta
        mode: overwrite
        csv_export:
            enabled: true
            path: "data/output/csv/gold"
            delimiter: ","
            header: true
            encoding: "utf-8"

# Data quality rules
dq_rules:
    soft_fail_threshold: 0.05
    hard_fail_threshold: 0.20

# Circuit breaker for API resilience
circuit_breaker:
    failure_threshold: 5
    recovery_timeout: 300

# Incremental fetch configuration
# OpenAlex supports from_updated_date filter for efficient incremental loads
incremental:
    enabled: true
    strategy: updated_date
    # Uses OpenAlex from_updated_date filter
    # Date format: YYYY-MM-DD
    # Checkpoint stores last_updated_date for resume
    checkpoint_field: last_updated_date
    filter_param: from_updated_date
    lookback_days: 1  # Overlap to catch late updates

# Fetch configuration
fetch:
    per_page: 200  # Max allowed by OpenAlex
    # Default limit: None (fetch all matching records)
    # Set limit in CLI for testing: --limit 100
