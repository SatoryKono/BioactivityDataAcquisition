# configs/pipelines/openalex/publication.yaml
# OpenAlex Publication — batch DOI resolution with title fallback.
# DQ & Filters: loaded via hierarchy (ADR-027/028/029).

pipeline_name: openalex_publication
provider: openalex
entity_type: publication
schema_file: ../../schemas/openalex/publication.yaml
description: "Batch DOI resolution via OpenAlex with title fallback"

# Override: full_scan required — API doesn't support stable incremental cursors
loading_strategy: full_scan_only

business_primary_keys: ["openalex_id"]

source:
  email: "${BIOETL_OPENALEX_EMAIL}"  # Required for polite pool
