# configs/pipelines/openalex/publication_enrichment.yaml
# Конфигурация пайплайна для обогащения публикаций из OpenAlex.

pipeline_name: openalex_publication_enrichment
provider: openalex
entity_type: works
version: "1.0.0"
description: "Enrich publication records with OpenAlex metadata (citations, authors, concepts)"

primary_keys: ["openalex_id"]
silver_table: "openalex_works"

# Ссылка на файл с конфигурацией источника данных
source_file: ../../sources/openalex.yaml

# Gold layer filters - retain high-quality publication metadata
gold_filters:
    columns:
        type: [article, book, book-chapter, dissertation, preprint, review]
    ranges:
        cited_by_count:
            min: 0
            include_min: true
    required_fields:
        - openalex_id
        - title

transform:
    version: "1.0.0"
    steps:
        - extract_openalex_id
        - reconstruct_abstract
        - extract_authors
        - extract_institutions
        - normalize_doi
        - calculate_content_hash

sink:
    bronze:
        path: "data/output/bronze"
        format: jsonl
        save_json: true

    silver:
        path: "data/output/silver"
        format: delta
        mode: merge
        on_schema_mismatch: evolve
        primary_key: ["openalex_id"]
        classification: public
        forensic_retention: true
        csv_export:
            enabled: true
            path: "data/output/csv/silver"
            delimiter: ","
            header: true
            encoding: "utf-8"

    gold:
        enabled: true
        validation:
            strict: false
        path: "data/output/gold"
        format: delta
        mode: overwrite
        csv_export:
            enabled: true
            path: "data/output/csv/gold"
            delimiter: ","
            header: true
            encoding: "utf-8"

dq_rules:
    soft_fail_threshold: 0.05
    hard_fail_threshold: 0.20

circuit_breaker:
    failure_threshold: 5
    recovery_timeout: 300

# Input filter configuration (for DOI-based filtering)
input_filter:
    enabled: true
    source_path: "data/input/dois.csv"
    column_name: "doi"
    filter_field: "doi"
    batch_size: 50
