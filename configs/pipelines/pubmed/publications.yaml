# configs/pipelines/pubmed/publications.yaml
# Pipeline configuration for PubMed Publication entity.
#
# Inherits defaults from ../_base.yaml

pipeline_name: pubmed_publications
provider: pubmed
entity_type: publication
version: "1.2.0"
description: "Extract publication metadata from PubMed via Entrez API"

primary_keys: ["pmid"]
silver_table: "pubmed_publication"
gold_table: "pubmed_publication"

source_file: ../../sources/pubmed.yaml

# Pipeline-specific source configuration
source:
  search_term: "bioinformatics[Title/Abstract] AND drug discovery[Title/Abstract]"
  email: "${BIOETL_NCBI_EMAIL}"
  api_key: "${BIOETL_NCBI_API_KEY}"

# -----------------------------------------------------------------------------
# Data Quality Rules (entity-specific overrides)
# -----------------------------------------------------------------------------
dq_rules:
  field_validations:
    - field: "pmid"
      type: "range"
      min: 1
      max: 100000000
      nullable: false
      error_message: "PMID must be a positive integer"
    - field: "title"
      type: "pattern"
      pattern: "^.{1,2000}$"
      nullable: true
    - field: "doi"
      type: "pattern"
      pattern: "^10\\.\\d{4,}/.*$"
      nullable: true
      error_message: "DOI must start with 10. prefix"
    - field: "pub_year"
      type: "range"
      min: 1800
      max: 2100
      nullable: true
    - field: "pub_type"
      type: "enum"
      allowed: ["Journal Article", "Review", "Letter", "Editorial", "Clinical Trial", "Meta-Analysis", "Case Reports", "Comparative Study", "Evaluation Study"]
      nullable: true
    - field: "pmc_id"
      type: "pattern"
      pattern: "^PMC\\d+$"
      nullable: true
      error_message: "PMC ID must start with PMC followed by digits"

  cross_field_validations:
    - name: "publication_identifiable"
      fields: ["pmid", "title"]
      condition: "all_present"
      error_message: "Publication must have PMID and title"
    - name: "has_identifier"
      fields: ["pmid", "doi", "pmc_id"]
      condition: "any_present"
      error_message: "At least one identifier required"

# Entity-specific gold filters
gold_filters:
  required_fields:
    - pmid
    - title
  columns: {}

# Entity-specific sink overrides
sink:
  bronze:
    path: "data/output/bronze/pubmed/publication"
  silver:
    path: "data/output/silver/pubmed/publication"
    primary_key: ["pmid"]
    partition_by: ["pub_year"]
    sort_by:
      columns: ["pmid"]
      ascending: true
    csv_export:
      path: "data/output/silver/pubmed/publication"
  gold:
    path: "data/output/gold/pubmed/publication"
    sort_by:
      columns: ["pmid"]
      ascending: true
    csv_export:
      path: "data/output/gold/pubmed/publication"

# Entity-specific input filter
# PubMed adapter implements FilterableDataSourcePort with PMID batch fetching
input_filter:
  enabled: true
  source_path: "data/input/pubmed.csv"
  column_name: "pubmed_id"
  filter_field: "pmid"
  batch_size: 100
