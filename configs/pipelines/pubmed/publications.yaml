# configs/pipelines/pubmed/publications.yaml
# Конфигурация пайплайна для сущности Publication из PubMed.

pipeline_name: pubmed_publications
provider: pubmed
entity_type: publication
version: "1.0.0"
description: "Extract publication metadata from PubMed via Entrez API"

primary_keys: ["pmid"]
silver_table: "pubmed_publications"
gold_table: "pubmed_publications"

# Ссылка на файл с конфигурацией источника данных
source_file: ../../sources/pubmed.yaml

# Pipeline-specific source configuration
source:
    # Search query for Entrez API
    search_term: "bioinformatics[Title/Abstract] AND drug discovery[Title/Abstract]"
    # Overrides/Injections
    email: "${BIOETL_NCBI_EMAIL}"
    api_key: "${BIOETL_NCBI_API_KEY}"

# Gold layer filters
gold_filters:
    required_fields:
        - pmid
        - title
        - pub_date
    columns:
        pub_type: ["Journal Article", "Review"]

transform:
    version: "1.0.0"
    steps:
        - parse_xml
        - extract_metadata
        - normalize_dates

sink:
    bronze:
        path: "data/bronze/pubmed/publication"
        format: jsonl
        save_json: true

    silver:
        path: "data/silver/pubmed/publication"
        format: delta
        mode: merge
        primary_key: ["pmid"]
        partition_by: ["pub_year"]
        classification: public
        forensic_retention: true
        csv_export:
            enabled: true
            path: "data/output/csv/silver"
            delimiter: ","
            header: true
            encoding: "utf-8"

    gold:
        enabled: true
        validation:
            strict: true
        path: "data/gold/pubmed/publication"
        format: delta
        mode: overwrite
        csv_export:
            enabled: true
            path: "data/output/csv/gold"
            delimiter: ","
            header: true
            encoding: "utf-8"

dq_rules:
    soft_fail_threshold: 0.05
    hard_fail_threshold: 0.20

circuit_breaker:
    failure_threshold: 5
    recovery_timeout: 300

# Input filter configuration (for CSV-based ID filtering)
# CLI options --input-csv, --filter-column, --filter-field override these
input_filter:
    enabled: true
    source_path: "data/input/publications.csv"
    column_name: "pmid"
    filter_field: "pmid"
    batch_size: 100
