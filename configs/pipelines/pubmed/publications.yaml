# configs/pipelines/pubmed/publications.yaml
# Pipeline configuration for PubMed Publication entity.
#
# Inherits defaults from ../_base.yaml

pipeline_name: pubmed_publications
provider: pubmed
entity_type: publication
version: "1.2.0"
description: "Extract publication metadata from PubMed via Entrez API"

primary_keys: ["pmid"]
silver_table: "pubmed_publication"
gold_table: "pubmed_publication"

source_file: ../../sources/pubmed.yaml

# Pipeline-specific source configuration
source:
  search_term: "bioinformatics[Title/Abstract] AND drug discovery[Title/Abstract]"
  email: "${BIOETL_NCBI_EMAIL}"
  api_key: "${BIOETL_NCBI_API_KEY}"

# -----------------------------------------------------------------------------
# Data Quality Configuration (ADR-027)
# -----------------------------------------------------------------------------
# DQ rules are loaded from hierarchical config files:
#   1. configs/dq/_defaults.yaml (global defaults)
#   2. configs/dq/providers/pubmed.yaml (provider-specific)
#   3. configs/dq/entities/pubmed/publication.yaml (entity-specific)
dq_config_file: ../../dq/entities/pubmed/publication.yaml

# -----------------------------------------------------------------------------
# Filter Configuration (ADR-028)
# -----------------------------------------------------------------------------
# Filter rules are loaded from hierarchical config files:
#   1. configs/filter/_defaults.yaml (global defaults)
#   2. configs/filter/providers/pubmed.yaml (provider-specific)
#   3. configs/filter/entities/pubmed/publications.yaml (entity-specific)
filter_config_file: ../../filter/entities/pubmed/publications.yaml

# Entity-specific gold filters
gold_filters:
  required_fields:
    - pmid
    - title
  columns: {}

# Entity-specific sink overrides
sink:
  bronze:
    path: "data/output/bronze/pubmed/publication"
  silver:
    path: "data/output/silver/pubmed/publication"
    primary_key: ["pmid"]
    partition_by: ["pub_year"]
    sort_by:
      columns: ["pmid"]
    csv_export:
      path: "data/output/silver/pubmed/publication"
  gold:
    path: "data/output/gold/pubmed/publication"
    sort_by:
      columns: ["pmid"]
    csv_export:
      path: "data/output/gold/pubmed/publication"

# Entity-specific input filter
# PubMed adapter implements FilterableDataSourcePort with PMID batch fetching
input_filter:
  enabled: true
  source_path: "data/input/pubmed.csv"
  column_name: "pubmed_id"
  filter_field: "pmid"
  batch_size: 100
  fallback_column: "title"  # Search by title if PMID not found or empty
