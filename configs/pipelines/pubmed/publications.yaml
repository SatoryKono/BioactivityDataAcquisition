# configs/pipelines/pubmed/publications.yaml
# Pipeline configuration for PubMed Publications.

pipeline_name: pubmed_publications
provider: pubmed
entity_type: publication
version: "1.0.0"
description: "Extract publication metadata from PubMed via Entrez API"

primary_keys: ["pmid"]
silver_table: "pubmed_publications"

# Reference to shared source configuration
source_file: ../../sources/pubmed.yaml

# Pipeline-specific source configuration
source:
  # Search query for Entrez API
  search_term: "bioinformatics[Title/Abstract] AND drug discovery[Title/Abstract]"
  # Overrides/Injections
  email: "${BIOETL_NCBI_EMAIL}"
  api_key: "${BIOETL_NCBI_API_KEY}"

transform:
    version: "1.0.0"
    steps:
        - parse_xml
        - extract_metadata
        - normalize_dates

sink:
    bronze:
        path: "data/output/bronze"
        format: jsonl
        save_json: true

    silver:
        path: "data/output/silver"
        format: delta
        mode: merge
        primary_key: ["pmid"]
        classification: public
        forensic_retention: false
        csv_export:
            enabled: true
            path: "data/output/csv/silver"
            delimiter: ","
            header: true
            encoding: "utf-8"

    gold:
        enabled: false # Disabled as per original config, but keeping structure valid
        validation:
            strict: true
        path: "data/output/gold"
        format: delta
        mode: overwrite

dq_rules:
    soft_fail_threshold: 0.05
    hard_fail_threshold: 0.20

circuit_breaker:
    failure_threshold: 5
    recovery_timeout: 300