# configs/pipelines/pubmed/publication.yaml
# PubMed Publication — inherits from _base.yaml.
# DQ & Filters: loaded via hierarchy (ADR-027/028/029).

pipeline_name: pubmed_publication
provider: pubmed
entity_type: publication
description: "Extract publication metadata from PubMed via Entrez API"

# Override: full_scan required — API doesn't support stable incremental cursors
loading_strategy: full_scan_only

business_primary_keys: ["pmid"]

source:
  email: "${BIOETL_PUBMED_EMAIL}"
  api_key: "${BIOETL_PUBMED_API_KEY}"
