# configs/pipelines/gtopdb/ligand.yaml
# Pipeline configuration for GtoPdb Ligand entity.
# See: https://www.guidetopharmacology.org/webServices.jsp

pipeline_name: gtopdb_ligand
provider: gtopdb
entity_type: ligand
version: "1.0.0"
description: "Extract ligands from GtoPdb API"

primary_keys: ["ligand_id"]
silver_table: "gtopdb_ligand"

# Reference to source configuration
source_file: ../../sources/gtopdb.yaml

# Gold filters: approved drugs with structural data
gold_filters:
    columns:
        approved: [true]
    required_fields:
        - name
        - smiles

transform:
    version: "1.0.0"
    steps:
        - normalize_values
        - add_metadata
        - calculate_content_hash

sink:
    bronze:
        path: "data/output/bronze"
        format: jsonl
        save_json: true
        deterministic: true

    silver:
        path: "data/output/silver"
        format: delta
        mode: merge
        on_schema_mismatch: evolve
        primary_key: ["ligand_id"]
        partition_by: ["ligand_type"]
        classification: public
        forensic_retention: true
        deterministic: true
        sort_by:
            columns: ["ligand_id"]
            ascending: true
        csv_export:
            enabled: true
            path: "data/output/csv/silver"
            delimiter: ","
            header: true
            encoding: "utf-8"

    gold:
        enabled: true
        validation:
            strict: false
        path: "data/output/gold"
        format: delta
        mode: overwrite
        deterministic: true
        sort_by:
            columns: ["ligand_id", "name"]
            ascending: true
        csv_export:
            enabled: true
            path: "data/output/csv/gold"
            delimiter: ","
            header: true
            encoding: "utf-8"

dq_rules:
    soft_fail_threshold: 0.05
    hard_fail_threshold: 0.20

circuit_breaker:
    failure_threshold: 5
    recovery_timeout: 300

# Input filter configuration (optional)
input_filter:
    enabled: false
    source_path: "data/input/gtopdb_ligand.csv"
    column_name: "ligand_id"
    filter_field: "ligandId"
    batch_size: 20
