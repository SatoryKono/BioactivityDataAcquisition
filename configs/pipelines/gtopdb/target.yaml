# configs/pipelines/gtopdb/target.yaml
# Pipeline configuration for GtoPdb Target entity.
# See: https://www.guidetopharmacology.org/webServices.jsp

pipeline_name: gtopdb_target
provider: gtopdb
entity_type: target
version: "1.0.0"
description: "Extract pharmacological targets from GtoPdb API"

primary_keys: ["target_id"]
silver_table: "gtopdb_target"

# Reference to source configuration
source_file: ../../sources/gtopdb.yaml

# Gold filters: only human targets with names
gold_filters:
    columns:
        species: ["Human"]
    required_fields:
        - name
        - target_type

transform:
    version: "1.0.0"
    steps:
        - normalize_values
        - add_metadata
        - calculate_content_hash

sink:
    bronze:
        path: "data/output/bronze"
        format: jsonl
        save_json: true
        deterministic: true

    silver:
        path: "data/output/silver"
        format: delta
        mode: merge
        on_schema_mismatch: evolve
        primary_key: ["target_id"]
        partition_by: ["target_type"]
        classification: public
        forensic_retention: true
        deterministic: true
        sort_by:
            columns: ["target_id"]
            ascending: true
        csv_export:
            enabled: true
            path: "data/output/csv/silver"
            delimiter: ","
            header: true
            encoding: "utf-8"

    gold:
        enabled: true
        validation:
            strict: false
        path: "data/output/gold"
        format: delta
        mode: overwrite
        deterministic: true
        sort_by:
            columns: ["target_id", "name"]
            ascending: true
        csv_export:
            enabled: true
            path: "data/output/csv/gold"
            delimiter: ","
            header: true
            encoding: "utf-8"

dq_rules:
    soft_fail_threshold: 0.05
    hard_fail_threshold: 0.20

circuit_breaker:
    failure_threshold: 5
    recovery_timeout: 300

# Input filter configuration (optional)
input_filter:
    enabled: false
    source_path: "data/input/gtopdb_target.csv"
    column_name: "target_id"
    filter_field: "targetId"
    batch_size: 20
