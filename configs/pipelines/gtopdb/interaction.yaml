# configs/pipelines/gtopdb/interaction.yaml
# Pipeline configuration for GtoPdb Interaction entity.
# See: https://www.guidetopharmacology.org/webServices.jsp

pipeline_name: gtopdb_interaction
provider: gtopdb
entity_type: interaction
version: "1.0.0"
description: "Extract target-ligand interactions from GtoPdb API"

primary_keys: ["interaction_id"]
silver_table: "gtopdb_interaction"

# Reference to source configuration
source_file: ../../sources/gtopdb.yaml

# Gold filters: human interactions with affinity data
gold_filters:
    columns:
        species: ["Human"]
    required_fields:
        - target_id
        - ligand_id
        - affinity_value

transform:
    version: "1.0.0"
    steps:
        - normalize_values
        - add_metadata
        - calculate_content_hash

sink:
    bronze:
        path: "data/output/bronze"
        format: jsonl
        save_json: true
        deterministic: true

    silver:
        path: "data/output/silver"
        format: delta
        mode: merge
        on_schema_mismatch: evolve
        primary_key: ["interaction_id"]
        partition_by: ["species"]
        classification: public
        forensic_retention: true
        deterministic: true
        sort_by:
            columns: ["interaction_id"]
            ascending: true
        csv_export:
            enabled: true
            path: "data/output/csv/silver"
            delimiter: ","
            header: true
            encoding: "utf-8"

    gold:
        enabled: true
        validation:
            strict: false
        path: "data/output/gold"
        format: delta
        mode: overwrite
        deterministic: true
        sort_by:
            columns: ["interaction_id", "target_id", "ligand_id"]
            ascending: true
        csv_export:
            enabled: true
            path: "data/output/csv/gold"
            delimiter: ","
            header: true
            encoding: "utf-8"

dq_rules:
    soft_fail_threshold: 0.05
    hard_fail_threshold: 0.20

circuit_breaker:
    failure_threshold: 5
    recovery_timeout: 300

# Input filter configuration (optional)
input_filter:
    enabled: false
    source_path: "data/input/gtopdb_interaction.csv"
    column_name: "interaction_id"
    filter_field: "interactionId"
    batch_size: 20
