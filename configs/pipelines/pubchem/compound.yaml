# configs/pipelines/pubchem/compound.yaml
# Pipeline configuration for PubChem Compound entity.
#
# Inherits defaults from ../_base.yaml:
# - metadata (lineage, provenance, content_hash)
# - dq_config (thresholds, anomaly_detection, quarantine, metrics)
# - circuit_breaker, sink structure, maintenance, input_filter

pipeline_name: pubchem_compound
provider: pubchem
entity_type: compound
version: "2.0.0"
description: "Pipeline for ingesting PubChem compounds"

primary_keys: ["cid"]
silver_table: "pubchem_compound"
gold_table: "pubchem_compound"

source_file: ../../sources/pubchem.yaml

# -----------------------------------------------------------------------------
# Entity-Specific Metadata
# -----------------------------------------------------------------------------
metadata:
  schema:
    version: "1.0.0"
    contract_path: docs/contracts/gold/pubchem_compound.json

# -----------------------------------------------------------------------------
# Entity-Specific DQ Configuration
# -----------------------------------------------------------------------------
dq_config:
  # Column-level validation rules
  column_checks:
    cid:
      nullable: false
      unique: true
      range:
        min: 1
    molecular_formula:
      nullable: false
    molecular_weight:
      nullable: true
      range:
        min: 0.0
    canonical_smiles:
      nullable: true
    isomeric_smiles:
      nullable: true
    inchi:
      nullable: true
      pattern: "^InChI=.*$"
    inchikey:
      nullable: true
      pattern: "^[A-Z]{14}-[A-Z]{10}-[A-Z]$"
    iupac_name:
      nullable: true
    xlogp:
      nullable: true
      range:
        min: -10.0
        max: 20.0
    exact_mass:
      nullable: true
      range:
        min: 0.0
    monoisotopic_mass:
      nullable: true
      range:
        min: 0.0
    tpsa:
      nullable: true
      range:
        min: 0.0
    complexity:
      nullable: true
      range:
        min: 0.0
    charge:
      nullable: true
    h_bond_donor_count:
      nullable: true
      range:
        min: 0
    h_bond_acceptor_count:
      nullable: true
      range:
        min: 0
    rotatable_bond_count:
      nullable: true
      range:
        min: 0
    heavy_atom_count:
      nullable: true
      range:
        min: 0
    isotope_atom_count:
      nullable: true
      range:
        min: 0
    atom_stereo_count:
      nullable: true
      range:
        min: 0
    defined_atom_stereo_count:
      nullable: true
      range:
        min: 0
    undefined_atom_stereo_count:
      nullable: true
      range:
        min: 0
    bond_stereo_count:
      nullable: true
      range:
        min: 0
    covalent_unit_count:
      nullable: true
      range:
        min: 0

# Entity-specific gold filters
gold_filters:
  required_fields:
    - cid
    - molecular_formula
  columns: {}

# Entity-specific sink overrides
sink:
  bronze:
    path: "data/output/bronze/pubchem/compound"
  silver:
    path: "data/output/silver/pubchem/compound"
    primary_key: ["cid"]
    partition_by: ["batch_date"]
    sort_by:
      columns: ["cid"]
      ascending: true
    csv_export:
      path: "data/output/silver/pubchem/compound"
  gold:
    path: "data/output/gold/pubchem/compound"
    sort_by:
      columns: ["cid"]
      ascending: true
    csv_export:
      path: "data/output/gold/pubchem/compound"

# Entity-specific input filter - SMILES-based filtering (primary mode)
input_filter:
  enabled: true
  source_path: "data/input/molecule.csv"
  column_name: "canonical_smiles"
  filter_field: "smiles"
  batch_size: 1  # SMILES search is per-compound due to PubChem API limitations
