pipeline_name: "pubchem_compound"
provider: "pubchem"
entity_type: "compound"
description: "Pipeline for ingesting PubChem compounds"
version: "1.0.0"

primary_keys: ["cid"]
silver_table: "pubchem_compound"

# Ссылка на общий конфиг источника
source_file: ../../sources/pubchem.yaml

source:
  # Переопределяем или дополняем параметры из source_file
  watermark_field: "cid"

sink:
  bronze:
    format: "jsonl"
    compression: "zstd"
  silver:
    table_name: "pubchem_compound"
    primary_keys: ["cid"]
    partition_by: ["batch_date"]
    format: "delta"
    mode: "merge"
    forensic_retention: "7d"
  gold:
    table_name: "dim_compound"
    primary_keys: ["cid"]

processing:
  batch_size: 1000
  deduplication: true

validation:
  strict_mode: false