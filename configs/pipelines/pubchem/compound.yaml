# configs/pipelines/pubchem/compound.yaml
# Pipeline configuration for PubChem Compound entity.
#
# Inherits defaults from ../_defaults.yaml

pipeline_name: pubchem_compound
provider: pubchem
entity_type: compound
version: "1.0.0"
description: "Pipeline for ingesting PubChem compounds"

primary_keys: ["cid"]
silver_table: "pubchem_compound"
gold_table: "pubchem_compound"

source_file: ../../sources/pubchem.yaml

# Entity-specific gold filters
gold_filters:
  required_fields:
    - cid
    - molecular_formula
  columns: {}

# Entity-specific transform steps (different from ChEMBL)
transform:
  version: "1.0.0"
  steps:
    - normalize_fields
    - generate_content_hash

# Entity-specific sink overrides (custom paths)
sink:
  bronze:
    path: "data/bronze/pubchem/compound"
  silver:
    path: "data/silver/pubchem/compound"
    primary_key: ["cid"]
    partition_by: ["batch_date"]
    csv_export:
      path: "data/output/csv/silver"
  gold:
    path: "data/gold/pubchem/compound"
    csv_export:
      path: "data/output/csv/gold"

# Entity-specific input filter - SMILES-based filtering (primary mode)
input_filter:
  enabled: true
  source_path: "data/input/molecule.csv"
  column_name: "canonical_smiles"
  filter_field: "smiles"
  batch_size: 1  # SMILES search is per-compound due to API limitations
