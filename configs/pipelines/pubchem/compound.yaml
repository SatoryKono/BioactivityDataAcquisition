# configs/pipelines/pubchem/compound.yaml
# Конфигурация пайплайна для сущности Compound из PubChem.

pipeline_name: pubchem_compound
provider: pubchem
entity_type: compound
version: "1.0.0"
description: "Pipeline for ingesting PubChem compounds"

primary_keys: ["cid"]
silver_table: "pubchem_compound"
gold_table: "pubchem_compound"

# Ссылка на файл с конфигурацией источника данных
source_file: ../../sources/pubchem.yaml

# Gold layer filters
gold_filters:
    required_fields:
        - cid
        - molecular_formula
    columns: {}

transform:
    version: "1.0.0"
    steps:
        - normalize_fields
        - generate_content_hash

sink:
    bronze:
        path: "data/bronze/pubchem/compound"
        format: jsonl
        save_json: true

    silver:
        path: "data/silver/pubchem/compound"
        format: delta
        mode: merge
        primary_key: ["cid"]
        partition_by: ["batch_date"]
        classification: public
        forensic_retention: true
        csv_export:
            enabled: true
            path: "data/output/csv/silver"
            delimiter: ","
            header: true
            encoding: "utf-8"

    gold:
        enabled: true
        validation:
            strict: true
        path: "data/gold/pubchem/compound"
        format: delta
        mode: overwrite
        csv_export:
            enabled: true
            path: "data/output/csv/gold"
            delimiter: ","
            header: true
            encoding: "utf-8"

dq_rules:
    soft_fail_threshold: 0.05
    hard_fail_threshold: 0.20

circuit_breaker:
    failure_threshold: 5
    recovery_timeout: 300

# Input filter configuration (for CSV-based ID filtering)
# CLI options --input-csv, --filter-column, --filter-field override these
input_filter:
    enabled: true
    source_path: "data/input/compounds.csv"
    column_name: "cid"
    filter_field: "cid"
    batch_size: 100
