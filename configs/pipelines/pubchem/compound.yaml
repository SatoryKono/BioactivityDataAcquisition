# configs/pipelines/pubchem/compound.yaml
# Pipeline configuration for PubChem Compounds.

pipeline_name: pubchem_compound
provider: pubchem
entity_type: compound
version: "1.0.0"
description: "Pipeline for ingesting PubChem compounds"

primary_keys: ["cid"]
silver_table: "pubchem_compound"

# Reference to shared source configuration
source_file: ../../sources/pubchem.yaml

transform:
    version: "1.0.0"
    steps:
        - normalize_fields
        - generate_content_hash

sink:
    bronze:
        path: "data/output/bronze"
        format: jsonl
        save_json: true

    silver:
        path: "data/output/silver"
        format: delta
        mode: merge
        primary_key: ["cid"]
        partition_by: ["batch_date"]
        classification: public
        forensic_retention: true
        csv_export:
            enabled: true
            path: "data/output/csv/silver"
            delimiter: ","
            header: true
            encoding: "utf-8"

    gold:
        enabled: true
        validation:
            strict: true
        path: "data/output/gold"
        format: delta
        mode: overwrite
        csv_export:
            enabled: true
            path: "data/output/csv/gold"
            delimiter: ","
            header: true
            encoding: "utf-8"

dq_rules:
    soft_fail_threshold: 0.05
    hard_fail_threshold: 0.20

circuit_breaker:
    failure_threshold: 5
    recovery_timeout: 300
