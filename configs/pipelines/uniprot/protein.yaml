# configs/pipelines/uniprot/protein.yaml
# Конфигурация пайплайна для сущности Protein из UniProt.

pipeline_name: uniprot_protein
provider: uniprot
entity_type: protein
version: "1.0.0"
description: "Pipeline for ingesting UniProt proteins"

primary_keys: ["accession"]
silver_table: "uniprot_protein"
gold_table: "uniprot_protein"

# Ссылка на файл с конфигурацией источника данных
source_file: ../../sources/uniprot.yaml

# Gold layer filters
gold_filters:
    required_fields:
        - accession
        - entry_name
        - organism
    columns:
        reviewed: ["true"]  # Swiss-Prot (reviewed) only

transform:
    version: "1.0.0"
    steps:
        - normalize_fields
        - extract_features
        - generate_content_hash

sink:
    bronze:
        path: "data/bronze/uniprot/protein"
        format: jsonl
        save_json: true
        deterministic: true

    silver:
        path: "data/silver/uniprot/protein"
        format: delta
        mode: merge
        primary_key: ["accession"]
        partition_by: ["organism"]
        classification: public
        forensic_retention: true
        deterministic: true
        csv_export:
            enabled: true
            path: "data/output/csv/silver"
            delimiter: ","
            header: true
            encoding: "utf-8"

    gold:
        enabled: true
        validation:
            strict: true
        path: "data/gold/uniprot/protein"
        format: delta
        mode: overwrite
        deterministic: true
        csv_export:
            enabled: true
            path: "data/output/csv/gold"
            delimiter: ","
            header: true
            encoding: "utf-8"

dq_rules:
    soft_fail_threshold: 0.05
    hard_fail_threshold: 0.20

circuit_breaker:
    failure_threshold: 5
    recovery_timeout: 300

# Input filter configuration (for CSV-based ID filtering)
# CLI options --input-csv, --filter-column, --filter-field override these
input_filter:
    enabled: false
    source_path: "data/input/protein.csv"
    column_name: "accession"
    filter_field: "accession"
    batch_size: 100
