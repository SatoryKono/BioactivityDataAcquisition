# configs/pipelines/uniprot/protein.yaml
# Pipeline configuration for UniProt Protein entity.
#
# Inherits defaults from ../_base.yaml

pipeline_name: uniprot_protein
provider: uniprot
entity_type: protein
version: "1.2.0"
description: "Pipeline for ingesting UniProt proteins"

primary_keys: ["accession"]
silver_table: "uniprot_protein"
gold_table: "uniprot_protein"

source_file: ../../sources/uniprot.yaml

# -----------------------------------------------------------------------------
# Data Quality Rules (entity-specific overrides)
# -----------------------------------------------------------------------------
dq_rules:
  field_validations:
    - field: "accession"
      type: "pattern"
      pattern: "^[A-Z0-9]{6,10}$"
      nullable: false
      error_message: "UniProt accession must be 6-10 alphanumeric chars"
    - field: "entry_name"
      type: "pattern"
      pattern: "^[A-Z0-9_]+$"
      nullable: true
    - field: "organism"
      type: "pattern"
      pattern: "^[A-Z][a-z]+ [a-z]+.*$"
      nullable: true
      error_message: "Organism should be in binomial nomenclature"
    - field: "taxonomy_id"
      type: "range"
      min: 1
      max: 10000000
      nullable: true
    - field: "sequence_length"
      type: "range"
      min: 1
      max: 100000
      nullable: true
    - field: "mass"
      type: "range"
      min: 100
      max: 10000000
      nullable: true

  cross_field_validations:
    - name: "protein_identifiable"
      fields: ["accession", "entry_name"]
      condition: "all_present"
      error_message: "Protein must have accession and entry name"

# Entity-specific gold filters
gold_filters:
  required_fields:
    - accession
    - entry_name
    - organism
  columns:
    reviewed: ["true"]  # Swiss-Prot (reviewed) only

# Entity-specific sink overrides
sink:
  bronze:
    path: "data/output/bronze/uniprot/protein"
  silver:
    path: "data/output/silver/uniprot/protein"
    primary_key: ["accession"]
    partition_by: ["organism"]
    sort_by:
      columns: ["accession"]
    csv_export:
      path: "data/output/silver/uniprot/protein"
  gold:
    path: "data/output/gold/uniprot/protein"
    sort_by:
      columns: ["accession"]
    csv_export:
      path: "data/output/gold/uniprot/protein"

# Entity-specific input filter
# UniProt adapter implements FilterableDataSourcePort with OR-query batching
input_filter:
  enabled: true
  source_path: "data/input/protein.csv"
  column_name: "uniprot_id"
  filter_field: "accession"
  batch_size: 100
