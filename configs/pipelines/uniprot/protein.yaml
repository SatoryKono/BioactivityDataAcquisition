# configs/pipelines/uniprot/protein.yaml
# Pipeline configuration for UniProt Proteins.

pipeline_name: uniprot_protein
provider: uniprot
entity_type: protein
version: "1.0.0"
description: "Pipeline for ingesting UniProt proteins"

primary_keys: ["accession"]
silver_table: "uniprot_protein"

# Reference to shared source configuration
source_file: ../../sources/uniprot.yaml

transform:
    version: "1.0.0"
    steps:
        - normalize_fields
        - extract_features
        - generate_content_hash

sink:
    bronze:
        path: "data/output/bronze"
        format: jsonl
        save_json: true

    silver:
        path: "data/output/silver"
        format: delta
        mode: merge
        primary_key: ["accession"]
        partition_by: ["batch_date"]
        classification: public
        forensic_retention: true
        csv_export:
            enabled: true
            path: "data/output/csv/silver"
            delimiter: ","
            header: true
            encoding: "utf-8"

    gold:
        enabled: true
        validation:
            strict: true
        path: "data/output/gold"
        format: delta
        mode: overwrite
        csv_export:
            enabled: true
            path: "data/output/csv/gold"
            delimiter: ","
            header: true
            encoding: "utf-8"

dq_rules:
    soft_fail_threshold: 0.05
    hard_fail_threshold: 0.20

circuit_breaker:
    failure_threshold: 5
    recovery_timeout: 300