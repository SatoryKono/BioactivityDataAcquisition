# configs/pipelines/_defaults.yaml
# =============================================================================
# BioETL Pipeline Configuration Defaults
# =============================================================================
#
# This file defines default settings for all pipelines following the
# Medallion Architecture (Bronze → Silver → Gold).
#
# CONFIGURATION HIERARCHY:
# 1. _defaults.yaml          - Global defaults (this file)
# 2. configs/sources/*.yaml  - Provider-specific settings (rate_limit, client)
# 3. <provider>/<entity>.yaml - Entity-specific settings (gold_filters, keys)
#
# INHERITANCE:
# Entity configs inherit from this file. Settings can be overridden at any level.
# Provider-specific settings (rate_limit, circuit_breaker for HTTP) are in
# configs/sources/<provider>.yaml and referenced via source_file.
#
# SCHEMA VERSION: 1.1.0 (aligned with RULES.md v5.10)
# LAST UPDATED: 2026-01-13
#
# REQUIRED FIELDS (MUST be defined in entity config):
#   - pipeline_name: str      # Unique identifier (e.g., "chembl_activity")
#   - provider: str           # Provider name (e.g., "chembl", "pubchem")
#   - entity_type: str        # Entity type (e.g., "activity", "compound")
#   - primary_keys: list[str] # Primary key columns for merge operations
#   - silver_table: str       # Silver layer table name
#   - source_file: str        # Reference to provider source config
#
# OPTIONAL FIELDS (inherit defaults):
#   - version: str            # Entity config version (default: "1.0.0")
#   - gold_table: str         # Gold layer table name (default: same as silver)
#   - gold_filters: dict      # Gold layer filtering rules
#   - dq_rules: dict          # Data quality thresholds (can override defaults)
#   - input_filter: dict      # Input CSV filtering configuration
#
# EXAMPLE ENTITY CONFIG:
#   pipeline_name: chembl_activity
#   provider: chembl
#   entity_type: activity
#   version: "1.1.0"
#   primary_keys: ["activity_id"]
#   silver_table: "chembl_activity"
#   gold_table: "chembl_activity"
#   source_file: ../../sources/chembl.yaml
#   gold_filters:
#     required_fields: [standard_type, standard_value]
#   sink:
#     silver:
#       primary_key: ["activity_id"]
#       partition_by: []
# =============================================================================

# Schema version for this defaults file
defaults_version: "1.1.0"

# =============================================================================
# Data Quality Rules (identical across all pipelines)
# =============================================================================
dq_rules:
  soft_fail_threshold: 0.05
  hard_fail_threshold: 0.20

# =============================================================================
# Circuit Breaker Settings (identical across all pipelines)
# =============================================================================
circuit_breaker:
  failure_threshold: 5
  recovery_timeout: 300

# =============================================================================
# Sink Configuration Defaults
# =============================================================================
sink:
  bronze:
    format: jsonl
    save_json: true
    deterministic: true

  silver:
    format: delta
    mode: merge
    on_schema_mismatch: evolve
    classification: public
    forensic_retention: true
    deterministic: true
    csv_export:
      enabled: true
      delimiter: ","
      header: true
      encoding: "utf-8"

  gold:
    enabled: true
    validation:
      strict: true
    format: delta
    mode: overwrite
    deterministic: true
    csv_export:
      enabled: true
      delimiter: ","
      header: true
      encoding: "utf-8"

# =============================================================================
# Maintenance Settings
# =============================================================================
maintenance:
  auto_vacuum: false
  vacuum_retention_days: 7

# =============================================================================
# Input Filter Defaults
# =============================================================================
input_filter:
  enabled: false
  batch_size: 100
