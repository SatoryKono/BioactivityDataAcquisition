# configs/pipelines/semanticscholar/publication.yaml
# Semantic Scholar Publication — batch DOI resolution with title fallback.
# DQ & Filters: loaded via hierarchy (ADR-027/028/029).

pipeline_name: semanticscholar_publication
provider: semanticscholar
entity_type: publication
schema_file: "../../schemas/semanticscholar/publication.yaml"
description: "Batch DOI resolution via Semantic Scholar with title fallback"

# Override: full_scan required — API doesn't support stable incremental cursors
loading_strategy: full_scan_only

business_primary_keys: ["paper_id"]
