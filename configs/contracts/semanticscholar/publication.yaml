# Semantic Scholar Publication Data Quality Contract
# Aligned with configs/base/contract_registry.yaml identity tuple.

contract_ref: "semanticscholar.publication"
contract_version: "1.0.0"
dq_policy_ref: "semanticscholar.dq.v1"
rule_bundle_version: "dq-rules.v1.0"
default_disposition_policy: "warn"
strictness_mode: "moderate"
soft_fail_threshold: 0.05
hard_fail_threshold: 0.20
strict_validation: false
invalid_record_policy: "quarantine"
disposition_overrides:
  "paper_id_required": "fail"
report:
  enabled: true
  format: "json"
  include_sample_failures: true
  sample_size: 10
