# ChEMBL Molecule Data Quality Contract
# Aligned with configs/base/contract_registry.yaml identity tuple.

contract_ref: "chembl.molecule"
contract_version: "1.0.0"
dq_policy_ref: "chembl.dq.v1"
rule_bundle_version: "dq-rules.v1.0"
default_disposition_policy: "warn"
strictness_mode: "moderate"
soft_fail_threshold: 0.05
hard_fail_threshold: 0.50
strict_dq_validation: false
invalid_record_policy: "quarantine"
disposition_overrides:
  "molecule_id_required": "fail"
  "molecule_type_allowed": "warn"
  "max_phase_range": "warn"
  "structure_type_allowed": "warn"
  "therapeutic_flag_boolean": "warn"
  "black_box_warning_boolean": "warn"
  "withdrawn_flag_boolean": "warn"
  "oral_boolean": "warn"
  "parenteral_boolean": "warn"
  "topical_boolean": "warn"
  "first_in_class_boolean": "warn"
  "prodrug_boolean": "warn"
  "natural_product_boolean": "warn"
report:
  enabled: true
  format: "json"
  include_sample_failures: true
  sample_size: 1000
