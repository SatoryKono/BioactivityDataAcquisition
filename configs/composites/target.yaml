composite:
  name: composite_target
  version: 1.3.0
  normalized_anchor_policy:
    uniprot_idmapping:
      join_boundary:
        source_anchor: target_id
        normalized_output_anchor: uniprot_accession
        required_status: found
        downstream_pipeline: uniprot_protein
        rationale: UniProt accession joins are chained through normalized idmapping
          output and filtered to mapping_status='found'.
    pubchem_compound:
      join_boundary:
        active_join_keys:
        - inchi_key
        - canonical_smiles
        retained_validation_anchors:
        - standardized_inchi_key
        - structure_parent_key
        activation_condition: seed pipelines emit matching normalized PubChem anchors
        rationale: PubChem normalized anchors are retained in composite output but
          not used as symmetric join keys until seed sources expose the same anchor
          family.
  field_aliases:
    hba_count:
      chembl: hba_count
      pubchem: h_bond_acceptor_count
    hbd_count:
      chembl: hbd_count
      pubchem: h_bond_donor_count
    logp:
      chembl: logp
      pubchem: xlogp
    polar_surface_area:
      chembl: polar_surface_area
      pubchem: tpsa
    standard_inchi:
      chembl: standard_inchi
      pubchem: inchi
  normalized_join_key_policy:
    publication_identity:
      primary_join_keys: []
      fallback_join_keys: []
      rationale: Non-publication composite; publication join policy not applicable.
  seed:
    pipeline: chembl_target
    output_keys:
    - target_id
    - primary_component_id
    - pref_name
    - target_type
    silver_table: silver/chembl/target
  dependencies:
  - pipeline: chembl_target_component
    join_keys:
    - primary_component_id
    filter_field: component_id
    required: false
    timeout_seconds: 600
    silver_table: silver/chembl/target_component
  - pipeline: chembl_protein_class
    join_keys:
    - protein_classification_id
    filter_field: protein_class_id
    key_source: chembl_target_component
    required: false
    timeout_seconds: 300
    silver_table: silver/chembl/protein_class
  - pipeline: chembl_target_protein_classification
    join_keys:
    - target_id
    required: false
    timeout_seconds: 300
    silver_table: silver/chembl/target_protein_classification
  - pipeline: uniprot_idmapping
    join_keys:
    - target_id
    required: false
    filter_condition: target_id IS NOT NULL
    timeout_seconds: 600
    silver_table: silver/uniprot/idmapping
  - pipeline: uniprot_protein
    join_keys:
    - uniprot_accession
    filter_field: accession
    key_source: uniprot_idmapping
    key_filter: mapping_status = 'found'
    required: false
    timeout_seconds: 900
    silver_table: silver/uniprot/protein
  enrichers: []
  merge:
    strategy: left_outer
    conflict_resolution: seed_priority
    preserve_all_sources: false
    field_mappings:
      chembl.cell_line.efo_id: cell_efo_id
      chembl.tissue.efo_id: tissue_efo_id
      chembl.tissue.pref_name: tissue_pref_name
      chembl.tissue.uberon_id: tissue_uberon_id
      chembl.tissue.bto_id: tissue_bto_id
      chembl.tissue.caloha_id: tissue_caloha_id
      chembl.target_component.description: component_description
    output:
      silver: data/output/silver/composite/target
      gold: data/output/gold/composite/target
    sort_by:
      silver:
      - entity_id
      - target_id
      gold:
      - entity_id
      - target_id
    field_priorities:
      target_id:
      - chembl
      primary_component_id:
      - chembl
      taxonomy_id:
      - chembl
      organism:
      - chembl
      abstract:
      - pubmed
      - openalex
      - chembl
      - semanticscholar
      affiliation_list:
