    column_groups:
    - name: system
      fields:
      - entity_id
      - content_hash
      - _source
      - _index
      - _lookup_method
      - _original_id
      pattern: ^_composite_|^_source_providers|^_enrichment_|^_lineage_|^_dq_
      provider_order:
      - chembl
      - uniprot
    - name: identifiers
      fields:
      - target_id
      - primary_component_id
      - uniprot_accession
      - mapping_status
      provider_order:
