version: "1.0.0"
reviewed_on: "2026-07-01"
owner: BioETL Team
scope: source_owned_assay_metadata_that_remains_non_canonical_until_owner_promotion

fields:
  - cluster_id: shared_assay_type
    field_name: assay_type
    owner: BioETL Team
    semantic_scope: explicit_source_owned_assay_contract
    business_owner_role: chembl_assay_metadata_enum_owner
    composite_role: inherited_assay_context_projection
    lineage_role: assay_context_anchor_from_seed_and_activity_join
    promotion_policy: require_canonical_assay_metadata_registry_before_exact
    authority_scope: >-
      configs/entities/chembl/activity.yaml + configs/entities/chembl/assay.yaml
      + configs/composites/activity.yaml + configs/composites/assay.yaml
    entity_gold_contracts:
      - docs/04-reference/contracts/gold/chembl_activity_v1.0.json
      - docs/04-reference/contracts/gold/chembl_assay_v1.0.json
    composite_gold_contracts:
      - docs/04-reference/contracts/gold/composite_activity_v1.0.json
      - docs/04-reference/contracts/gold/composite_assay_v1.0.json
    rationale: >
      assay_type originates on ChEMBL assay-bearing contracts and is inherited
      into composite assay/activity projections. Shared spelling does not make
      it a canonical cross-provider alias family.

  - cluster_id: shared_assay_description
    field_name: assay_description
    owner: BioETL Team
    semantic_scope: explicit_source_owned_assay_contract
    business_owner_role: chembl_activity_assay_context_text_owner
    composite_role: inherited_assay_context_projection
    lineage_role: activity_to_composite_assay_context_projection
    promotion_policy: require_canonical_assay_metadata_registry_before_exact
    authority_scope: >-
      configs/entities/chembl/activity.yaml + configs/composites/activity.yaml
    entity_gold_contracts:
      - docs/04-reference/contracts/gold/chembl_activity_v1.0.json
    composite_gold_contracts:
      - docs/04-reference/contracts/gold/composite_activity_v1.0.json
    rationale: >
      assay_description remains source-owned assay context text. Composite
      activity inherits it explicitly but does not own the semantic meaning.

  - cluster_id: shared_assay_category
    field_name: assay_category
    owner: BioETL Team
    semantic_scope: explicit_source_owned_assay_contract
    business_owner_role: chembl_assay_metadata_category_owner
    composite_role: inherited_assay_context_projection
    lineage_role: assay_to_composite_classification_projection
    promotion_policy: require_canonical_assay_metadata_registry_before_exact
    authority_scope: >-
      configs/entities/chembl/assay.yaml + configs/composites/assay.yaml
    entity_gold_contracts:
      - docs/04-reference/contracts/gold/chembl_assay_v1.0.json
    composite_gold_contracts:
      - docs/04-reference/contracts/gold/composite_assay_v1.0.json
    rationale: >
      assay_category is a source-owned ChEMBL assay classification field whose
      composite projection stays explicit but non-canonical.

  - cluster_id: shared_assay_organism
    field_name: assay_organism
    owner: BioETL Team
    semantic_scope: explicit_source_owned_assay_contract
    business_owner_role: chembl_assay_metadata_organism_owner
    composite_role: inherited_assay_context_projection
    lineage_role: assay_to_composite_biological_context_projection
    promotion_policy: require_canonical_assay_metadata_registry_before_exact
    authority_scope: >-
      configs/entities/chembl/assay.yaml + configs/composites/assay.yaml
    entity_gold_contracts:
      - docs/04-reference/contracts/gold/chembl_assay_v1.0.json
    composite_gold_contracts:
      - docs/04-reference/contracts/gold/composite_assay_v1.0.json
    rationale: >
      assay_organism remains an inherited biological-context projection until a
      future owner-promoted canonical assay metadata family exists.

  - cluster_id: shared_assay_tissue
    field_name: assay_tissue
    owner: BioETL Team
    semantic_scope: explicit_source_owned_assay_contract
    business_owner_role: chembl_assay_metadata_tissue_owner
    composite_role: inherited_assay_context_projection
    lineage_role: assay_to_composite_biological_context_projection
    promotion_policy: require_canonical_assay_metadata_registry_before_exact
    authority_scope: >-
      configs/entities/chembl/assay.yaml + configs/composites/assay.yaml
    entity_gold_contracts:
      - docs/04-reference/contracts/gold/chembl_assay_v1.0.json
    composite_gold_contracts:
      - docs/04-reference/contracts/gold/composite_assay_v1.0.json
    rationale: >
      assay_tissue remains source-owned assay biological context even when the
      composite assay contract publishes it explicitly.
