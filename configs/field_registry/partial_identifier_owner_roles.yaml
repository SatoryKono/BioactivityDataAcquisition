version: "1.0.0"
reviewed_on: "2026-07-01"
owner: BioETL Team
scope: reviewed_partial_identifier_clusters

clusters:
  - cluster_id: canonical_smiles_identifier
    canonical_field: canonical_smiles
    owner: BioETL Team
    business_owner_role: provider_owned_structure_identifier
    composite_role: composite_join_key_and_lineage_anchor
    lineage_role: inherited_molecule_context_for_activity
    promotion_policy: require_explicit_owner_split_before_exact
    authority_scope: >-
      configs/entities/chembl/molecule.yaml + configs/entities/pubchem/compound.yaml
      + configs/composites/molecule.yaml + configs/composites/activity.yaml
    rationale: >
      canonical_smiles stays PARTIAL because provider-owned structure identity,
      composite join-key semantics, and inherited activity context are related
      but not interchangeable roles.

  - cluster_id: chembl_target_identifier
    canonical_field: target_chembl_id
    owner: BioETL Team
    business_owner_role: provider_owned_target_identifier
    composite_role: chained_target_reference
    lineage_role: publication_and_component_reference_anchor
    promotion_policy: require_explicit_owner_split_before_exact
    authority_scope: >-
      configs/entities/chembl/target.yaml + configs/entities/chembl/target_component.yaml
      + configs/composites/target.yaml + configs/composites/activity.yaml
      + configs/composites/assay.yaml
    rationale: >
      target_chembl_id mixes provider target ownership with chained composite
      reference semantics and therefore remains PARTIAL.

  - cluster_id: inchi_key_identifier
    canonical_field: inchi_key
    owner: BioETL Team
    business_owner_role: provider_owned_structure_identifier
    composite_role: composite_primary_join_key
    lineage_role: structure_lineage_anchor
    promotion_policy: require_explicit_owner_split_before_exact
    authority_scope: >-
      configs/entities/chembl/molecule.yaml + configs/entities/pubchem/compound.yaml
      + configs/composites/molecule.yaml
    rationale: >
      InChIKey normalization aligns, but provider identity and composite join
      authority remain distinct semantic roles.

  - cluster_id: pmc_identifier
    canonical_field: pmc_id
    owner: BioETL Team
    business_owner_role: provider_owned_publication_identifier
    composite_role: optional_publication_reference
    lineage_role: publication_anchor_with_fallback_identity_policy
    promotion_policy: require_explicit_owner_split_before_exact
    authority_scope: >-
      configs/entities/pubmed/publication.yaml + configs/entities/chembl/publication.yaml
      + configs/entities/crossref/publication.yaml + configs/composites/publication.yaml
    rationale: >
      pmc_id is a reviewed publication identifier anchor, but it remains only
      one optional identifier family within multi-anchor publication identity.

  - cluster_id: uniprot_accession_identifier
    canonical_field: accession
    owner: BioETL Team
    business_owner_role: provider_owned_uniprot_primary_identifier
    composite_role: chained_component_reference
    lineage_role: component_evidence_anchor
    promotion_policy: require_explicit_owner_split_before_exact
    authority_scope: >-
      configs/entities/uniprot/protein.yaml + configs/entities/uniprot/idmapping.yaml
      + configs/entities/chembl/target_component.yaml + configs/composites/target.yaml
    rationale: >
      UniProt accession is primary identity in UniProt but only chained
      component/reference evidence in ChEMBL/composite target flows.
