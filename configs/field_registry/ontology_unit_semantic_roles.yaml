version: "1.0.0"
adr_refs:
  - ADR-018
  - ADR-026
  - ADR-039
  - ADR-045
non_canonical_role_rationale: >-
  Unit and ontology companion fields are role-bound contract fields, not
  cross-pipeline alias clusters. Raw unit text, standardized unit tokens,
  ontology identifiers, IRIs, mapping statuses, labels, and ontology versions
  must remain separately governed.

measurement_role_families:
  - family_id: chembl_activity_measurement_unit_roles
    path: configs/entities/chembl/activity.yaml
    field_roles:
      raw_unit_text: units
      standardized_unit_code: standard_units
      measurement_type: standard_type
      standardized_value: standard_value
    required_field_validations:
      units: pattern
      standard_units: enum
      standard_type: enum
    required_cross_field_validations:
      - name: value_requires_units
        condition: conditional_required
        trigger_field: standard_value
        required_field: standard_units
      - name: activity_completeness
        condition: all_present
        fields:
          - standard_value
          - standard_units
          - standard_type
    required_silver_fields:
      - units
      - standard_units
      - standard_type
      - standard_value
    required_gold_fields:
      - standard_units
      - standard_type
      - standard_value

ontology_role_families:
  - family_id: chembl_activity_bao_endpoint_roles
    path: configs/entities/chembl/activity.yaml
    ontology: BAO
    code_field: bao_endpoint
    iri_field: bao_endpoint_iri
    mapping_status_field: bao_endpoint_mapping_status
    ontology_version_field: bao_ontology_version
    companion_label_field: bao_label
    required_cross_field_validation: bao_endpoint_requires_mapping_status
    required_conditional_validation: mapped_bao_endpoint_requires_bundle

