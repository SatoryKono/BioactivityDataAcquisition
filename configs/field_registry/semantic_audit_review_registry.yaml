version: "1.2.0"
reviewed_on: "2026-05-22"
owner: BioETL Team
source_matrix: reports/semantic_pipeline_audit/semantic_pair_matrix_2026-05-22.csv

# Risk reviews are intentionally empty: the semantic pair matrix now reports
# CRITICAL=0, HIGH=0, MEDIUM=0 without reviewed risk caps.
risk_reviews: []

semantic_reviews:
  - id: partial_identity_policy_review
    issue: 4133
    owner: BioETL Team
    expires_on: "2026-11-15"
    semantic_statuses:
      - PARTIAL
    clusters:
      - canonical_smiles_identifier
      - chembl_target_identifier
      - inchi_key_identifier
      - pmc_identifier
      - uniprot_accession_identifier
    rationale: >
      PARTIAL identity clusters are intentionally not promoted to EXACT because
      they mix provider-owned identifiers, composite lineage projections, and
      join/reference anchors. Each listed cluster is valid only with explicit
      join/lineage semantics in the pair matrix and semantic anchor gates.

warning_reviews:
  - id: weak_same_name_inventory_review
    issue: 4133
    owner: BioETL Team
    expires_on: "2026-11-15"
    semantic_statuses:
      - WEAK
    rationale: >
      WEAK same-name clusters are inventory evidence only. They are reviewed
      as non-blocking because they do not assert cross-pipeline semantic
      identity until an owner promotes a cluster into a canonical exact/partial
      semantic field family.

  - id: generic_collision_inventory_review
    issue: 4133
    owner: BioETL Team
    expires_on: "2026-11-15"
    semantic_statuses:
      - CONFLICTING
    rationale: >
      Historical generic lexical collisions have been retired from the current
      semantic snapshot. owner-scoped naming and generic_field_ownership.yaml
      remain the governance source that prevents these fields from being
      reintroduced as canonical business identities.

partial_cluster_policies:
  - cluster_id: canonical_smiles_identifier
    canonical_field: canonical_smiles
    owner: BioETL Team
    business_owner_role: provider_owned_structure_identifier
    composite_role: composite_join_key_and_lineage_anchor
    lineage_role: inherited_molecule_context_for_activity
    promotion_policy: require_explicit_owner_split_before_exact
    rationale: >
      canonical_smiles is provider-owned structure text in ChEMBL molecule and
      PubChem compound, but the composite molecule pipeline also uses it as a
      join key and lineage anchor, while composite activity inherits it as
      molecule context. Shared normalization is not enough to collapse these
      roles into one EXACT ownership surface.

  - cluster_id: chembl_target_identifier
    canonical_field: target_chembl_id
    owner: BioETL Team
    business_owner_role: provider_owned_target_identifier
    composite_role: chained_target_reference
    lineage_role: publication_and_component_reference_anchor
    promotion_policy: require_explicit_owner_split_before_exact
    rationale: >
      target_chembl_id stays PARTIAL because it mixes target ownership,
      component chaining, and reference-anchor semantics across ChEMBL and
      composite target flows.

  - cluster_id: inchi_key_identifier
    canonical_field: inchi_key
    owner: BioETL Team
    business_owner_role: provider_owned_structure_identifier
    composite_role: composite_primary_join_key
    lineage_role: structure_lineage_anchor
    promotion_policy: require_explicit_owner_split_before_exact
    rationale: >
      InChIKey is normalized identically, but it remains both a provider
      structure identifier and the primary composite molecule join key.
      Promotion to EXACT requires explicit owner-role separation rather than
      inference from shared normalization alone.

  - cluster_id: pmc_identifier
    canonical_field: pmc_id
    owner: BioETL Team
    business_owner_role: provider_owned_publication_identifier
    composite_role: optional_publication_reference
    lineage_role: publication_anchor_with_fallback_identity_policy
    promotion_policy: require_explicit_owner_split_before_exact
    rationale: >
      pmc_id participates in publication identity, but only as one optional
      identifier beside DOI and PMID. The field remains PARTIAL because it is
      not the universal primary identity anchor across all publication sources.

  - cluster_id: uniprot_accession_identifier
    canonical_field: accession
    owner: BioETL Team
    business_owner_role: provider_owned_uniprot_primary_identifier
    composite_role: chained_component_reference
    lineage_role: component_evidence_anchor
    promotion_policy: require_explicit_owner_split_before_exact
    rationale: >
      UniProt accession is a true primary key in UniProt protein data but only
      a component/reference anchor in ChEMBL target component and composite
      chaining surfaces. It must stay PARTIAL until owner semantics are split
      explicitly.

weak_cluster_policy:
  weak_decision_min_rows: 6
  owner: BioETL Team
  tracked_cluster_ids:
    - shared_assay_type
    - shared_assay_description
    - shared_assay_category
    - shared_assay_organism
    - shared_assay_tissue
    - shared_bao_format
    - shared_bao_label
    - shared_text_value
    - shared_units
  role_governed_cluster_ids:
    - shared_bao_format
    - shared_bao_label
    - shared_text_value
    - shared_units
  explicit_contract_cluster_ids:
    - shared_assay_type
    - shared_assay_description
    - shared_assay_category
    - shared_assay_organism
    - shared_assay_tissue
  required_tracked_decision_metadata:
    - semantic_scope
    - business_owner_role
    - composite_role
    - lineage_role
    - promotion_policy
    - authority_scope

weak_cluster_decisions:
  - cluster_id: shared_pref_name
    field_name: pref_name
    decision: source_owned_same_name
    owner: BioETL Team
    rationale: >
      pref_name appears in multiple entity families with source-specific meaning
      and should not be promoted by name alone.

  - cluster_id: shared_author_keys
    field_name: author_keys
    decision: source_owned_same_name
    owner: BioETL Team
    rationale: >
      author_keys carries source-specific nested/derived semantics and should
      not be promoted into a canonical field family by name only.

  - cluster_id: shared_author_orcids
    field_name: author_orcids
    decision: source_owned_same_name
    owner: BioETL Team
    rationale: >
      author_orcids remains a source-scoped author metadata surface until the
      repository introduces canonical author identity governance.

  - cluster_id: shared_is_oa
    field_name: is_oa
    decision: source_owned_same_name
    owner: BioETL Team
    rationale: >
      is_oa shares lexical overlap across publication sources but still depends
      on source-specific open-access semantics and evidence shape.

  - cluster_id: shared_language
    field_name: language
    decision: source_owned_same_name
    owner: BioETL Team
    rationale: >
      language is semantically close across publication sources, but explicit
      owner policy is still required before canonical promotion.

  - cluster_id: shared_assay_type
    field_name: assay_type
    decision: source_owned_same_name
    owner: BioETL Team
    semantic_scope: explicit_source_owned_assay_contract
    business_owner_role: chembl_assay_metadata_enum_owner
    composite_role: inherited_assay_context_projection
    lineage_role: assay_context_anchor_from_seed_and_activity_join
    promotion_policy: require_canonical_assay_metadata_registry_before_exact
    authority_scope: >-
      configs/entities/chembl/activity.yaml + configs/entities/chembl/assay.yaml
      + configs/composites/activity.yaml + configs/composites/assay.yaml
    rationale: >
      assay_type is a reviewed assay metadata enum that originates on ChEMBL
      assay-bearing entity contracts and is only inherited into composite
      assay/activity projections. It remains source-owned until a dedicated
      assay metadata registry centralizes the business owner explicitly.

  - cluster_id: shared_assay_description
    field_name: assay_description
    decision: source_owned_same_name
    owner: BioETL Team
    semantic_scope: explicit_source_owned_assay_contract
    business_owner_role: chembl_activity_assay_context_text_owner
    composite_role: inherited_assay_context_projection
    lineage_role: activity_to_composite_assay_context_projection
    promotion_policy: require_canonical_assay_metadata_registry_before_exact
    authority_scope: >-
      configs/entities/chembl/activity.yaml + configs/composites/activity.yaml
    rationale: >
      assay_description is a source-owned assay-context text surface on ChEMBL
      activity and an inherited projection on composite activity. The same name
      does not yet prove one canonical business field family.

  - cluster_id: shared_assay_category
    field_name: assay_category
    decision: source_owned_same_name
    owner: BioETL Team
    semantic_scope: explicit_source_owned_assay_contract
    business_owner_role: chembl_assay_metadata_category_owner
    composite_role: inherited_assay_context_projection
    lineage_role: assay_to_composite_classification_projection
    promotion_policy: require_canonical_assay_metadata_registry_before_exact
    authority_scope: >-
      configs/entities/chembl/assay.yaml + configs/composites/assay.yaml
    rationale: >
      assay_category is a source-owned assay classification field on ChEMBL
      assay and an inherited composite projection. It stays WEAK by reviewed
      contract policy instead of being promoted from name overlap alone.

  - cluster_id: shared_assay_organism
    field_name: assay_organism
    decision: source_owned_same_name
    owner: BioETL Team
    semantic_scope: explicit_source_owned_assay_contract
    business_owner_role: chembl_assay_metadata_organism_owner
    composite_role: inherited_assay_context_projection
    lineage_role: assay_to_composite_biological_context_projection
    promotion_policy: require_canonical_assay_metadata_registry_before_exact
    authority_scope: >-
      configs/entities/chembl/assay.yaml + configs/composites/assay.yaml
    rationale: >
      assay_organism is a source-owned biological-context field on ChEMBL
      assay and a composite inherited projection. Canonical promotion requires
      an explicit assay metadata owner registry, not just shared spelling.

  - cluster_id: shared_assay_tissue
    field_name: assay_tissue
    decision: source_owned_same_name
    owner: BioETL Team
    semantic_scope: explicit_source_owned_assay_contract
    business_owner_role: chembl_assay_metadata_tissue_owner
    composite_role: inherited_assay_context_projection
    lineage_role: assay_to_composite_biological_context_projection
    promotion_policy: require_canonical_assay_metadata_registry_before_exact
    authority_scope: >-
      configs/entities/chembl/assay.yaml + configs/composites/assay.yaml
    rationale: >
      assay_tissue is a source-owned assay biological-context field and a
      composite inherited projection. It remains an explicit non-canonical
      contract field until assay metadata ownership is centralized.

  - cluster_id: shared_bao_format
    field_name: bao_format
    decision: source_owned_same_name
    owner: BioETL Team
    semantic_scope: role_governed_ontology_reference_identifier
    business_owner_role: bao_format_code_field_owner
    composite_role: inherited_ontology_reference_projection
    lineage_role: assay_ontology_bundle_projection
    promotion_policy: retain_role_split_until_canonical_ontology_alias_registry_exists
    authority_scope: >-
      configs/field_registry/ontology_unit_semantic_roles.yaml:
      chembl_activity_bao_format_roles, chembl_assay_bao_format_roles
    rationale: >
      bao_format is governed as a BAO code field inside explicit ontology-role
      bundles for ChEMBL activity and assay, while composite surfaces inherit
      the resolved value. It remains non-canonical because ontology code,
      label, IRI, mapping status, and version are separate contract roles.

  - cluster_id: shared_bao_label
    field_name: bao_label
    decision: source_owned_same_name
    owner: BioETL Team
    semantic_scope: role_governed_ontology_companion_label
    business_owner_role: bao_companion_label_owner
    composite_role: inherited_ontology_reference_projection
    lineage_role: assay_ontology_bundle_projection
    promotion_policy: retain_role_split_until_canonical_ontology_alias_registry_exists
    authority_scope: >-
      configs/field_registry/ontology_unit_semantic_roles.yaml:
      chembl_activity_bao_format_roles, chembl_assay_bao_format_roles
    rationale: >
      bao_label is the reviewed companion label for BAO format bundles rather
      than a canonical identifier field. It stays source-owned because ontology
      companion text must remain separate from code/IRI/version semantics.

  - cluster_id: shared_units
    field_name: units
    decision: source_owned_same_name
    owner: BioETL Team
    semantic_scope: role_governed_measurement_raw_unit_text
    business_owner_role: raw_measurement_unit_text_owner
    composite_role: inherited_measurement_context_projection
    lineage_role: original_measurement_unit_anchor
    promotion_policy: retain_role_split_until_measurement_contract_registry_exists
    authority_scope: >-
      configs/field_registry/ontology_unit_semantic_roles.yaml:
      chembl_activity_measurement_unit_roles
    rationale: >
      units is governed as raw measurement-unit text and must stay distinct
      from standardized unit codes, ontology IDs, IRIs, and mapping statuses.
      Composite activity only inherits the source value and does not create a
      canonical alias family.

  - cluster_id: shared_text_value
    field_name: text_value
    decision: source_owned_same_name
    owner: BioETL Team
    semantic_scope: role_governed_measurement_text_companion
    business_owner_role: measurement_text_companion_owner
    composite_role: inherited_measurement_context_projection
    lineage_role: original_measurement_text_anchor
    promotion_policy: retain_role_split_until_measurement_contract_registry_exists
    authority_scope: >-
      configs/entities/chembl/activity.yaml +
      configs/entities/chembl/assay_parameters.yaml +
      configs/composites/activity.yaml
    rationale: >
      text_value is the source textual companion for measurement payloads and
      must remain distinct from numeric standardized values and unit/ontology
      roles. Shared naming does not imply one canonical business identifier.

  - cluster_id: shared_issn
    field_name: issn
    decision: source_owned_same_name
    owner: BioETL Team
    rationale: >
      issn overlaps across publication sources, but the repository still treats
      raw ISSN surfaces as source-owned pending stronger canonical policy.

  - cluster_id: shared_oa_status
    field_name: oa_status
    decision: promotable_candidate
    owner: BioETL Team
    rationale: >
      oa_status already uses one reviewed open-access vocabulary surface across
      publication-family DQ and shared Python normalization, so it is tracked
      as a promotion candidate pending explicit canonical publication ownership.

  - cluster_id: shared_annotation_score
    field_name: annotation_score
    decision: source_owned_same_name
    owner: BioETL Team
    rationale: >
      annotation_score appears across target-style surfaces with source-specific
      meaning and therefore stays WEAK by policy.

  - cluster_id: shared_cross_references
    field_name: cross_references
    decision: source_owned_same_name
    owner: BioETL Team
    rationale: >
      cross_references is a nested/source-scoped metadata field whose meaning is
      not canonicalized across entity families.

  - cluster_id: shared_abstract
    field_name: abstract
    decision: promotable_candidate
    owner: BioETL Team
    rationale: >
      abstract is already normalized across publication providers but still
      lacks an explicit canonical publication-content ownership registry, so it
      remains a reviewed promotion candidate rather than an implicit exact field.

  - cluster_id: shared_authors
    field_name: authors
    decision: promotable_candidate
    owner: BioETL Team
    rationale: >
      authors appears across publication providers with converging semantics,
      but canonical author-content ownership and list-shape guarantees are not
      yet centralized strongly enough for automatic exact-field promotion.

  - cluster_id: shared_issue
    field_name: issue
    decision: promotable_candidate
    owner: BioETL Team
    rationale: >
      issue behaves like shared publication bibliographic metadata, but the
      repository still tracks it as a reviewed promotion candidate until an
      explicit canonical publication-metadata owner registry is introduced.

  - cluster_id: shared_publication_class
    field_name: publication_class
    decision: promotable_candidate
    owner: BioETL Team
    rationale: >
      publication_class is derived through the shared publication taxonomy and
      is a strong convergence candidate, but it remains reviewed debt until its
      owner contract is promoted from taxonomy evidence into canonical registry.

  - cluster_id: shared_publication_date
    field_name: publication_date
    decision: promotable_candidate
    owner: BioETL Team
    rationale: >
      publication_date is normalized consistently enough to be tracked as a
      promotion candidate, but canonical date ownership across provider and
      composite publication surfaces is not yet declared explicitly.

  - cluster_id: shared_publication_subclass
    field_name: publication_subclass
    decision: promotable_candidate
    owner: BioETL Team
    rationale: >
      publication_subclass is emitted from the shared publication-type
      classification taxonomy and therefore belongs in the reviewed promotion
      backlog until canonical owner semantics are published explicitly.

  - cluster_id: shared_publication_type_unified
    field_name: publication_type_unified
    decision: promotable_candidate
    owner: BioETL Team
    rationale: >
      publication_type_unified already reflects cross-provider normalization,
      but the registry still treats it as reviewed residual debt until the
      canonical publication taxonomy surface is promoted into exact governance.

  - cluster_id: shared_volume
    field_name: volume
    decision: promotable_candidate
    owner: BioETL Team
    rationale: >
      volume is shared bibliographic metadata with converging semantics across
      publication providers, but explicit owner policy is still required before
      it can leave the reviewed WEAK inventory family.

generic_collision_policies: []

composite_unknown_typing_reviews: []

promotion_requirements:
  PARTIAL:
    required_evidence:
      - business_owner_identity
      - composite_role
      - join_semantics
      - lineage_role
      - normalization_parity
      - dq_parity
      - gold_contract_compatibility
    allowed_outcomes:
      - remain_partial
      - promote_to_exact_after_owner_split
    enforcement_owner: BioETL Team

  WEAK:
    required_evidence:
      - canonical_owner
      - ontology_meaning
      - join_usage_proof
      - lineage_role
      - normalization_parity
      - dq_parity
      - gold_contract_compatibility
    allowed_outcomes:
      - remain_weak
      - promote_to_exact
      - split_cluster_family
    enforcement_owner: BioETL Team

  CONFLICTING:
    required_evidence:
      - explicit_owner_registry
      - non_aliasability_rationale
    allowed_outcomes:
      - remain_conflicting
      - split_cluster_family
    enforcement_owner: BioETL Team
