      - activity_properties
      - assay_description
      - assay_id
      - assay_type
      - assay_variant_accession
      - assay_variant_mutation
      - bao_endpoint
      - bao_format
      - bao_label
      - canonical_smiles
      - compound_key
      - compound_name
      - data_validity_comment
      - data_validity_description
      - ligand_efficiency_bei
      - ligand_efficiency_le
      - ligand_efficiency_lle
      - ligand_efficiency_sei
      - manual_curation_flag
      - molecule_id
      - molecule_pref_name
      - original_activity_id
      - parent_molecule_id
      - pchembl_value
      - potential_duplicate
      - publication_id
      - qudt_units
      - record_id
      - relation
      - src_compound_id
      - src_id
      - standard_flag
      - standard_relation
      - standard_text_value
      - standard_type
      - standard_units
      - standard_upper_value
      - standard_value
      - target_id
      - target_organism
      - target_pref_name
      - taxonomy_id
      - text_value
      - toid
      - type
      - units
      - uo_units
      - upper_value
