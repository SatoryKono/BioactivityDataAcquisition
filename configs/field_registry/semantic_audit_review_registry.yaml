promotion_requirements:
  PARTIAL:
    required_evidence:
      - business_owner_identity
      - composite_role
      - join_semantics
      - lineage_role
      - normalization_parity
      - dq_parity
      - gold_contract_compatibility
    allowed_outcomes:
      - remain_partial
      - promote_to_exact_after_owner_split
    enforcement_owner: BioETL Team

  WEAK:
    required_evidence:
      - canonical_owner
      - ontology_meaning
      - join_usage_proof
      - lineage_role
      - normalization_parity
      - dq_parity
      - gold_contract_compatibility
    allowed_outcomes:
      - remain_weak
      - promote_to_exact
      - split_cluster_family
    enforcement_owner: BioETL Team

  CONFLICTING:
    required_evidence:
      - explicit_owner_registry
      - non_aliasability_rationale
    allowed_outcomes:
      - remain_conflicting
      - split_cluster_family
    enforcement_owner: BioETL Team
