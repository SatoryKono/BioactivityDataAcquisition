# ChEMBL Database Enum Values
# Source: ChEMBL 35 (EBI)
# Last synced: 2026-02-16
#
# Canonical source of truth for all allowed enum values from ChEMBL DB.
# Used by: Pandera schemas (domain/schemas/constants.py),
#          filter configs (configs/filters/), DQ configs (configs/quality/).
#
# When ChEMBL releases a new version, update this file and bump `version`.

version: "chembl_35"

# =============================================================================
# Activity
# =============================================================================
activity:
    standard_relations:
        - "="
        - "<"
        - "<="
        - ">"
        - ">="
        - "~"

    standard_types:
        - IC50
        - EC50
        - Ki
        - Kd
        - AC50
        - GI50
        - Potency
        - Inhibition
        - "% Inhibition"
        - Activity
        - Ratio
        - ED50
        - ID50

    data_validity_comments:
        - Potential missing data
        - Potential author error
        - Manually validated
        - Potential transcription error
        - Outside typical range
        - Non standard unit for type
        - Author confirmed error

    standard_units:
        - nM
        - µM
        - mM
        - pM
        - M
        - "%"
        - ug.mL-1
        - mg.kg-1

# =============================================================================
# Assay
# =============================================================================
assay:
    types:
        - B
        - F
        - A
        - T
        - P
        - U

    test_types:
        - In vivo
        - In vitro
        - Ex vivo

    categories:
        - screening
        - confirmatory
        - panel
        - summary
        - other
        - Affinity biochemical assay
        - Affinity on-target cellular assay
        - Affinity phenotypic cellular assay
        - Alphascreen assay
        - Cell health data
        - GPCR beta-arrestin recruitment assay
        - HTRF assay
        - ITC assay
        - Incucyte cell viability
        - NanoBRET assay
        - PDSP assay
        - Selectivity assay
        - Thermal shift assay

    confidence_descriptions:
        - Likely active
        - Active
        - Inactive
        - Potentially active
        - Potentially inactive
        - Inconclusive
        - Not determined

    relationship_types:
        - D
        - H
        - M
        - "N"
        - S
        - U

    assay_groups:
        - FUNCTIONAL
        - BINDING

    subcellular_fractions:
        - Membrane
        - Nucleus
        - Cytoplasm
        - Mitochondria
        - Endoplasmic reticulum

    # Parameter-specific types (merged with activity.standard_types at load time)
    parameter_standard_types:
        - CONC
        - PH
        - TEMP
        - TIME
        - DOSE
        - VOLUME
        - WAVELENGTH
        - PERCENT
        - PRESSURE
        - HUMIDITY
        - CELL_COUNT
        - CELL_DENSITY
        - SERUM

# =============================================================================
# Molecule
# =============================================================================
molecule:
    types:
        - Small molecule
        - Inorganic small molecule
        - Polymeric small molecule
        - Antibody
        - Antibody drug conjugate
        - Protein
        - Oligonucleotide
        - Oligosaccharide
        - Cell
        - Enzyme
        - Unknown
        - Unclassified

    structure_types:
        - MOL
        - SEQ
        - BOTH
        - NONE

    ro3_pass_values:
        - Y
        - N

    # Uses float for 0.5; loaded as tuple[float, ...] in Python
    max_phase_values:
        - -1
        - 0
        - 0.5
        - 1
        - 2
        - 3
        - 4

# =============================================================================
# Target
# =============================================================================
target:
    types:
        - SINGLE PROTEIN
        - PROTEIN FAMILY
        - PROTEIN COMPLEX
        - PROTEIN COMPLEX GROUP
        - SELECTIVITY GROUP
        - CHIMERIC PROTEIN
        - CELL-LINE
        - TISSUE
        - ORGANISM
        - MACROMOLECULE
        - SMALL MOLECULE
        - LIPID
        - METAL
        - UNKNOWN

    component_relationships:
        - SINGLE PROTEIN
        - PROTEIN SUBUNIT
        - RNA
        - INTERACTING PROTEIN

    component_types:
        - PROTEIN
        - DNA
        - RNA

# =============================================================================
# Publication
# =============================================================================
# Unified publication types (kebab-case, cross-provider taxonomy).
# ChEMBL-native types (PUBLICATION, PATENT, DATASET, BOOK) are mapped
# to these canonical values by normalize_publication_type().
publication:
    native_doc_types:
        - PUBLICATION
        - PATENT
        - DATASET
        - BOOK

    types:
        - journal-article
        - patent
        - dataset
        - book
        - review
        - letter
        - editorial
        - clinical-trial
        - meta-analysis
        - case-reports
        - comparative-study
        - evaluation-study
        - preprint
        - book-chapter
        - proceedings-article
        - posted-content
        - report
        - standard
        - dissertation
        - other

publication_term:
    term_types:
        - MESH_HEADING
        - MESH_QUALIFIER
        - KEYWORD
        - CONCEPT
