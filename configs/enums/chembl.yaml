target:
    types:
        - SINGLE PROTEIN
        - PROTEIN FAMILY
        - PROTEIN COMPLEX
        - PROTEIN COMPLEX GROUP
        - SELECTIVITY GROUP
        - CHIMERIC PROTEIN
        - CELL-LINE
        - TISSUE
        - ORGANISM
        - MACROMOLECULE
        - SMALL MOLECULE
        - LIPID
        - METAL
        - UNKNOWN

    component_relationships:
        - SINGLE PROTEIN
        - PROTEIN SUBUNIT
        - RNA
        - INTERACTING PROTEIN

    component_types:
        - PROTEIN
        - DNA
        - RNA

    organism_classes:
        - acellular
        - unicellular
        - multicellular

# =============================================================================
# Publication
# =============================================================================
# Global cross-provider publication taxonomy (kebab-case).
#
# IMPORTANT: This is the GLOBAL enum registry for publication types across
# all providers (ChEMBL, Crossref, OpenAlex, PubMed, Semantic Scholar).
# Individual providers may define source-specific DQ/filter subsets for their
# own ingestion constraints, but those subsets MUST NOT redefine this global
# taxonomy. See provider-specific entity configs for source-specific policies.
#
# ChEMBL-native types (PUBLICATION, PATENT, DATASET, BOOK) are mapped to these
# canonical values by normalize_publication_type(). The global taxonomy includes
# all valid cross-provider publication types, not just those currently observed
# in ChEMBL fixtures.
publication:
    native_doc_types:
        - PUBLICATION
        - PATENT
        - DATASET
        - BOOK

    oa_status_values:
        - gold
        - green
        - hybrid
        - bronze
        - closed
        - diamond

    # ChEMBL-specific DQ subset (not global taxonomy)
    chembl_specific_types:
        - journal-article
        - book
        - dataset
        - patent

    types:
        - journal-article
        - patent
        - dataset
        - book
        - review
        - letter
        - editorial
        - clinical-trial
        - meta-analysis
        - case-reports
        - comparative-study
        - evaluation-study
        - preprint
        - book-chapter
        - proceedings-article
        - posted-content
        - report
        - standard
        - dissertation
        - other

publication_term:
    term_types:
        - MESH_HEADING
        - MESH_QUALIFIER
        - KEYWORD
