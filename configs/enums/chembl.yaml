# ChEMBL Database Enum Values
# Source: ChEMBL 35 (EBI)
# Last synced: 2026-02-16
#
# Canonical source of truth for all allowed enum values from ChEMBL DB.
# Used by: Pandera schemas (domain/schemas/constants.py),
#          filter configs (configs/filters/), DQ configs (configs/quality/).
#
# When ChEMBL releases a new version, update this file and bump `version`.

version: "chembl_35"

# =============================================================================
# Activity
# =============================================================================
activity:
    action_types:
        - AGONIST
        - ANTAGONIST
        - INHIBITOR
        - PARTIAL AGONIST

    standard_relations:
        - "="
        - "<"
        - "<="
        - ">"
        - ">="
        - "~"

    standard_types:
        - IC50
        - EC50
        - Ki
        - Kd
        - AC50
        - GI50
        - Potency
        - Inhibition
        - "% Inhibition"
        - Activity
        - Ratio
        - ED50
        - ID50

    data_validity_comments:
        - Potential missing data
        - Potential author error
        - Manually validated
        - Potential transcription error
        - Outside typical range
        - Non standard unit for type
        - Author confirmed error

    standard_units:
        - nM
        - µM
        - mM
        - pM
        - M
        - "%"
        - ug.mL-1
        - mg.kg-1

    mapping_statuses:
        - mapped
        - unmapped
        - missing

# =============================================================================
# Assay
# =============================================================================
assay:
    types:
        - B
        - F
        - A
        - T
        - P
        - U

    test_types:
        - In vivo
        - In vitro
        - Ex vivo

    categories:
        - screening
        - confirmatory
        - panel
        - summary
        - other
        - Affinity biochemical assay
        - Affinity on-target cellular assay
        - Affinity phenotypic cellular assay
        - Alphascreen assay
        - Cell health data
        - GPCR beta-arrestin recruitment assay
        - HTRF assay
        - ITC assay
        - Incucyte cell viability
        - NanoBRET assay
        - PDSP assay
        - Selectivity assay
        - Thermal shift assay

    confidence_descriptions:
        - Default value - Target unknown or has yet to be assigned
        - Direct protein complex subunits assigned
        - Direct single protein target assigned
        - Homologous single protein target assigned
        - Multiple direct protein targets may be assigned
        - Multiple homologous protein targets may be assigned
        - Target assigned is molecular non-protein target
        - Target assigned is non-molecular

    relationship_types:
        - D
        - H
        - M
        - "N"
        - S
        - U

    assay_groups:
        - FUNCTIONAL
        - BINDING

    subcellular_fractions:
        - Membrane
        - Nucleus
        - Cytoplasm
        - Mitochondria
        - Microsomes
        - Endoplasmic reticulum

    # Parameter-specific types (merged with activity.standard_types at load time)
    parameter_standard_types:
        - CONC
        - PH
        - TEMP
        - TIME
        - DOSE
        - VOLUME
        - WAVELENGTH
        - PERCENT
        - PRESSURE
        - HUMIDITY
        - CELL_COUNT
        - CELL_DENSITY
        - SERUM

# =============================================================================
# Molecule
# =============================================================================
molecule:
    types:
        - Small molecule
        - Inorganic small molecule
        - Polymeric small molecule
        - Antibody
        - Antibody drug conjugate
        - Protein
        - Oligonucleotide
        - Oligosaccharide
        - Cell
        - Enzyme
        - Unknown
        - Unclassified

    structure_types:
        - MOL
        - SEQ
        - BOTH
        - NONE

    ro3_pass_values:
        - Y
        - N

    # Uses float for 0.5; loaded as tuple[float, ...] in Python
    max_phase_values:
        - -1
        - 0
        - 0.5
        - 1
        - 2
        - 3
        - 4

    # Reviewed provider-code surfaces: numeric universes remain provider-owned
    # but must not stay as silent open numerics in profile/DQ/matrix artifacts.
    chirality_values:
        - -1
        - 0
        - 1
        - 2

    availability_type_values:
        - -2
        - -1
        - 0
        - 1
        - 2

    # DQ-only flag fields (not in ChEMBL DB, but governed in DQ configs)
    binary_flag_values:
        - 0
        - 1

    trinary_flag_values:
        - -1
        - 0
        - 1

# =============================================================================
# Target
