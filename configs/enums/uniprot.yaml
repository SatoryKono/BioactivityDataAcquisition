# UniProt controlled vocabulary values
# Source: UniProtKB schema contract
# Last synced: 2026-04-22
#
# Initial non-ChEMBL enum source for the provider-wide normalization registry.

version: "uniprot_kb"

protein:
    entry_types:
        - UniProtKB reviewed (Swiss-Prot)
        - UniProtKB unreviewed (TrEMBL)

    protein_flags:
        - Fragment
        - Precursor
        - Fragments

    protein_existence_levels:
        - Evidence at protein level
        - Evidence at transcript level
        - Inferred from homology
        - Predicted
        - Uncertain

idmapping:
    mapping_statuses:
        - found
        - not_found
        - error
        - multiple
