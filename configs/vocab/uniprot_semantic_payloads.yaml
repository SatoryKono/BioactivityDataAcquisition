version: 1.0.0
description: >
  Reviewed observed inventory for semantic-sensitive UniProt feature/comment
  payload vocabularies. This registry governs nested term families carried
  inside canonical JSON payloads such as features_json; it does not replace the
  raw/canonical sidecar contract for the payload envelope itself.
protein:
  structured_payload_fields:
  - features_json
  - alternative_products
  - biophysicochemical_properties
  - cofactors
  - reactions
  comment_projection_fields:
  - activity_regulation
  - alternative_products
  - biophysicochemical_properties
  - catalytic_activity
  - caution
  - cofactors
  - disease_involvement
  - function_comment
  - induction
  - pathway
  - pharmaceutical_use
  - similarity_comment
  - subcellular_location
  - subunit
  - tissue_specificity
  feature_projection_fields:
  - active_sites
  - binding_sites
  - domains
  - topology
  - transmembrane
  - intramembrane
  - signal_peptide
  - propeptide
  - glycosylation
  - lipidation
  - disulfide_bond
  - modified_residue
  - phosphorylation
  - acetylation
  - ubiquitination
  reference_payload_fields:
  - cellular_component
  - go_terms
  - interpro_xrefs
  - molecular_function
  - pdb_xrefs
  - pfam_xrefs
  - reactome_xrefs
  feature_types:
  - Active site
  - Binding site
  - Domain
  - Modified residue
  comment_types:
  - ALTERNATIVE PRODUCTS
  - CATALYTIC ACTIVITY
  - CAUTION
  - COFACTOR
  - DISEASE
  - FUNCTION
  - INDUCTION
  - PATHWAY
  - SIMILARITY
  - SUBCELLULAR LOCATION
  - SUBUNIT
  - TISSUE SPECIFICITY
  keyword_categories:
  - Biological process
  - Cellular component
  - Coding sequence diversity
  - Disease
  - Domain
  - Ligand
  - Molecular function
  - PTM
  - Technical term
