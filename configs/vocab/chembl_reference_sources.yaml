version: 1
description: Shared ChEMBL nested reference-source vocabularies embedded inside structured JSON fields.

nested_reference_vocabularies:
  target_component_xref_src_db:
    invalid_value_mode: preserve_unknown_json_member
    source_fields:
      - chembl_target.cross_references[].xref_src_db
      - chembl_target_component.target_component_xrefs[].xref_src_db
    values:
      - AlphaFoldDB
      - ChEBI
      - DrugBank
      - ExpressionAtlas
      - Gene3D
      - GoComponent
      - GoFunction
      - GoProcess
      - HGNC
      - IntAct
      - InterPro
      - OpenTargets
      - PANTHER
      - PDB
      - PDBe
      - Pfam
      - PharmGKB
      - Pharos
      - Reactome
      - SUPFAM
      - TreeFam
      - UniProt
