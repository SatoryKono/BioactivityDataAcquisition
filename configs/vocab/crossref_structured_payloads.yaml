version: 1.0.0
description: >
  Explicit governance for CrossRef publication structured payloads that remain
  canonical JSON in Silver/Gold. Unlike other publication providers, CrossRef
  author_details intentionally does not persist a raw sidecar because the
  source envelope contains unhashed personal data that is hashed before
  persistence.
crossref:
  publication:
    author_details:
      representation: canonical_json_string
      collection_semantics: ordered_sequence
      raw_sidecar_strategy: intentionally_not_persisted_after_pii_hash
      pii_mode: hashed_personal_fields_only
      rationale: >
        Raw CrossRef author payloads contain person names and affiliations.
        Silver/Gold only persist the hashed canonical JSON representation after
        transformer-side PII hashing.
    references:
      representation: canonical_json_string
      collection_semantics: ordered_sequence
      raw_sidecar_strategy: canonical_json_only
      rationale: >
        CrossRef references are preserved as deterministic canonical JSON
        evidence today without a separate raw sidecar because no semantic
        collapsing is applied beyond stable serialization.
