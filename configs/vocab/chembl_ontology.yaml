version: 1
description: Shared ChEMBL ontology/reference canonicalization registry for prefix, IRI-collapse, and code-label seams.

families:
  bao:
    canonical_prefix: BAO_
    iri_template: http://purl.obolibrary.org/obo/{id}
    ontology_version: 2.8.18a
    companion_fields:
      iri:
        - chembl_activity.bao_endpoint_iri
        - chembl_activity.bao_format_iri
        - chembl_assay.bao_format_iri
      mapping_status:
        - chembl_activity.bao_endpoint_mapping_status
        - chembl_activity.bao_format_mapping_status
        - chembl_assay.bao_format_mapping_status
      version:
        - chembl_activity.bao_ontology_version
        - chembl_assay.bao_ontology_version
    accepted_inputs:
      - prefixed_id
      - colon_form
      - obo_iri
    fields:
      - chembl_activity.bao_endpoint
      - chembl_activity.bao_format
      - chembl_assay.bao_format
    code_label_fields:
      - chembl_assay.bao_label
  uo:
    canonical_prefix: UO_
    iri_template: http://purl.obolibrary.org/obo/{id}
    ontology_version: 2026-01-16
    companion_fields:
      iri:
        - chembl_activity.uo_unit_iri
      mapping_status:
        - chembl_activity.uo_unit_mapping_status
      version:
        - chembl_activity.uo_ontology_version
    accepted_inputs:
      - prefixed_id
      - colon_form
    fields:
      - chembl_activity.uo_units
  qudt:
    canonical_prefix: https://qudt.org/vocab/unit/
    iri_template: https://qudt.org/vocab/unit/{id}
    ontology_version: 3.2.1
    companion_fields:
      iri:
        - chembl_activity.qudt_unit_iri
      mapping_status:
        - chembl_activity.qudt_unit_mapping_status
      version:
        - chembl_activity.qudt_ontology_version
    accepted_inputs:
      - qudt_iri
      - legacy_openphacts_unit_uri
      - canonical_standard_unit_token
    fields:
      - chembl_activity.qudt_units
  bto:
    canonical_prefix: BTO_
    iri_template: http://purl.obolibrary.org/obo/{id}
    ontology_version: 2026-01-16
    companion_fields:
      iri:
        - chembl_tissue.bto_iri
      mapping_status:
        - chembl_tissue.bto_mapping_status
      version:
        - chembl_tissue.bto_ontology_version
    accepted_inputs:
      - prefixed_id
      - colon_form
      - obo_iri
    fields:
      - chembl_tissue.bto_id
  caloha:
    canonical_prefix: TS-
    companion_governance: identifier_only_no_companion_bundle
    accepted_inputs:
      - ts_code
      - caloha_prefixed_code
    fields:
      - chembl_tissue.caloha_id
  efo:
    canonical_prefix: EFO_
    iri_template: http://purl.obolibrary.org/obo/{id}
    ontology_version: 2026-01-16
    companion_fields:
      iri:
        - chembl_cell_line.efo_iri
        - chembl_tissue.efo_iri
      mapping_status:
        - chembl_cell_line.efo_mapping_status
        - chembl_tissue.efo_mapping_status
      version:
        - chembl_cell_line.efo_ontology_version
        - chembl_tissue.efo_ontology_version
    accepted_inputs:
      - prefixed_id
      - colon_form
      - obo_iri
    fields:
      - chembl_cell_line.efo_id
      - chembl_tissue.efo_id
  clo:
    canonical_prefix: CLO_
    iri_template: http://purl.obolibrary.org/obo/{id}
    ontology_version: 2026-01-16
    companion_fields:
      iri:
        - chembl_cell_line.clo_iri
      mapping_status:
        - chembl_cell_line.clo_mapping_status
      version:
        - chembl_cell_line.clo_ontology_version
    accepted_inputs:
      - prefixed_id
      - colon_form
      - obo_iri
    fields:
      - chembl_cell_line.clo_id
  uberon:
    canonical_prefix: UBERON_
    iri_template: http://purl.obolibrary.org/obo/{id}
    ontology_version: 2026-01-16
    companion_fields:
      iri:
        - chembl_tissue.uberon_iri
      mapping_status:
        - chembl_tissue.uberon_mapping_status
      version:
        - chembl_tissue.uberon_ontology_version
    accepted_inputs:
      - prefixed_id
      - colon_form
      - obo_iri
    fields:
      - chembl_tissue.uberon_id
  cellosaurus:
    canonical_prefix: CVCL_
    companion_governance: identifier_only_no_companion_bundle
    accepted_inputs:
      - prefixed_id
      - colon_form
      - dash_form
    fields:
      - chembl_cell_line.cellosaurus_id
