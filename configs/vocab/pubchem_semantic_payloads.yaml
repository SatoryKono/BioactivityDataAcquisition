version: 1.0.0
description: >
  Reviewed semantic registry for PubChem compound normalization surfaces beyond
  the bounded chemical_standardization status enum. These values describe
  provider term families and property-URN axes that remain open-world
  vocabularies rather than strict enums in Silver/Gold.
compound:
  scalar_identifier_fields:
  - molecule_id
  - canonical_smiles
  - isomeric_smiles
  - inchi
  - inchi_key
  - standardized_canonical_smiles
  - standardized_isomeric_smiles
  - standardized_inchi
  - standardized_inchi_key
  - structure_parent_key
  iupac_name_variants:
  - Allowed
  - CAS-like Style
  - Markup
  - Preferred
  - Systematic
  - Traditional
  smiles_name_variants:
  - Absolute
  - Connectivity
  property_urn_axes:
  - datatype
  - label
  - name
  - implementation
  - software
  - source
  - release
