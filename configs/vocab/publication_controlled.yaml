version: 1.0.0
description: >
  Provider-facing raw publication controlled-vocabulary registries. These
  govern raw/provider type surfaces separately from the derived unified
  publication taxonomy in configs/enums/publication_type_classification.csv.
policy:
  preserve_unknown_provider_values: true
  normalization_target: raw_provider_type_or_sidecar
providers:
  crossref:
    publication_type:
      source: Crossref REST API /types surface plus project-observed values
      preserve_unknown: true
      values:
      - peer-review
      - journal-article
      - proceedings-article
      - posted-content
      - dataset
      - database
      - dissertation
      - report
      - report-component
      - component
      - book
      - book-chapter
      - book-section
      - book-part
      - book-track
      - book-set
      - book-series
      - edited-book
      - reference-book
      - monograph
      - reference-entry
      - standard
      - journal
      - journal-issue
      - journal-volume
      - proceedings
      - proceedings-series
      - report-series
      - grant
      - other
  openalex:
    publication_type:
      source: OpenAlex Works type surface plus project-observed values
      preserve_unknown: true
      values:
      - peer-review
      - article
      - preprint
      - dataset
      - database
      - dissertation
      - report
      - report-component
      - supplementary-materials
      - software
      - review
      - editorial
      - letter
      - erratum
      - retraction
      - book
      - book-chapter
      - book-section
      - reference-entry
      - standard
      - paratext
      - libguides
      - grant
      - other
    type_crossref:
      source: OpenAlex type_crossref sidecar; values follow Crossref publication_type
      preserve_unknown: true
      inherits: providers.crossref.publication_type
  pubmed:
    publication_types:
      source: NLM/PubMed publication type vocabulary observed registry
      preserve_unknown: true
      values:
      - Journal Article
      - Review
      - Clinical Trial
      - Meta-Analysis
      - Case Reports
      - Comparative Study
      - Editorial
      - Letter
      - Comment
      - Published Erratum
      - Retracted Publication
      - Dataset
      - Preprint
    publication_status:
      source: NLM/PubMed publication status lifecycle registry
      preserve_unknown: true
      values:
      - ppublish
      - epublish
      - aheadofprint
  semanticscholar:
    publication_types:
      source: Semantic Scholar publicationTypes array observed registry
      preserve_unknown: true
      values:
      - JournalArticle
      - Review
      - Conference
      - Book
      - BookChapter
      - Dataset
      - Editorial
      - Letter
      - MetaAnalysis
      - News
      - Study
      - ClinicalTrial
      - CaseReport
      - Preprint
