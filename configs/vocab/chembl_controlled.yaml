version: 1
description: Shared ChEMBL controlled-vocabulary registry for non-strict canonicalization families.

strict_boolean_families:
  bool_like:
    invalid_value_mode: coerce_common_boolean_lexemes
    fields:
      - chembl_molecule.therapeutic_flag
      - chembl_molecule.oral
      - chembl_molecule.parenteral
      - chembl_molecule.topical
      - chembl_molecule.withdrawn_flag
      - chembl_publication.is_oa
      - chembl_target.species_group_flag
      - chembl_target.downgraded

strict_flag_families:
  binary_flags:
    invalid_value_mode: coerce_common_flag_lexemes
    fields:
      - chembl_activity.standard_flag
      - chembl_activity.potential_duplicate
      - chembl_activity.manual_curation_flag
      - chembl_molecule.black_box_warning
      - chembl_molecule.dosed_ingredient
      - chembl_molecule.polymer_flag
      - chembl_protein_class.downgraded

controlled_vocabularies:
  units:
    canonicalizer: normalize_unit
    invalid_value_mode: preserve_unknown_lexeme
    qudt_iri_template: http://qudt.org/vocab/unit/{id}
    qudt_ontology_version: 3.2.1
    qudt_unit_identifiers:
      nM: NanoMOL-PER-L
      µM: MicroMOL-PER-L
      mM: MilliMOL-PER-L
      pM: PicoMOL-PER-L
      fM: FemtoMOL-PER-L
      M: MOL-PER-L
      '%': PERCENT
      ug.mL-1: MicroGM-PER-MilliL
      mg.kg-1: MilliGM-PER-KiloGM
    qudt_legacy_uri_mappings:
      http://www.openphacts.org/units/nanomolar: NanoMOL-PER-L
    companion_fields:
      iri:
        - chembl_activity.qudt_unit_iri
      mapping_status:
        - chembl_activity.qudt_unit_mapping_status
      version:
        - chembl_activity.qudt_ontology_version
    fields:
      - chembl_activity.units
      - chembl_activity.qudt_units
      - chembl_assay_parameters.units
      - chembl_assay_parameters.standard_units
  operators:
    canonicalizer: normalize_operator
    invalid_value_mode: preserve_unknown_lexeme
    fields:
      - chembl_activity.relation
      - chembl_assay_parameters.relation
  assay_parameter_types:
    canonicalizer: normalize_cross_pipeline_case(strategy=uppercase)
    invalid_value_mode: preserve_unknown_uppercase_lexeme
    fields:
      - chembl_assay_parameters.type
  target_component_types:
    canonicalizer: normalize_profile_json_string_list_vocabulary_strict
    invalid_value_mode: reject_unknown_json_array_element
    fields:
      - chembl_target.component_types
  target_component_relationships:
    canonicalizer: normalize_profile_json_string_list_vocabulary_strict
    invalid_value_mode: reject_unknown_json_array_element
    fields:
      - chembl_target.component_relationships
  subcellular_fractions:
    canonicalizer: normalize_profile_governed_vocabulary
    invalid_value_mode: preserve_unknown_lexeme
    fields:
      - chembl_assay.assay_subcellular_fraction
      - chembl_subcellular_fraction.subcellular_fraction
