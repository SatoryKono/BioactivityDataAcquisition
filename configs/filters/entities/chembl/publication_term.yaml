# configs/filters/entities/chembl/publication_term.yaml
# =============================================================================
# ChEMBL Publication Term Filter Configuration
# =============================================================================
# Entity-specific filter rules for document terms (MeSH, keywords).
# Reference: ADR-028 (Filter Rules Externalization)

version: "1.0.0"
provider: chembl
entity: publication_term

# -----------------------------------------------------------------------------
# Input Filter
# -----------------------------------------------------------------------------
# Filter by publication_id from publication CSV
input_filter:
  enabled: true
  source_path: "data/input/publication.csv"
  column_name: "publication_id"
  filter_field: "publication_id"
  batch_size: 20

# ---------------------------------------------------------------------------
# Extraction-Level Filtering (ADR-028 §3)
# ---------------------------------------------------------------------------
# Server-side query parameters appended to underlying ChEMBL Document API
# requests. Publication terms are a derived entity: PublicationTermDataSource
# fetches from /document endpoint via the wrapped ChemblAdapter, which
# applies these params to every API request.
#
# Mirrors publication.yaml extraction_params for consistency.
# Does NOT affect content_hash (ADR-014).
# Logged in SourceMetadata.query_string for audit/reproducibility.
extraction_params:
    # Publications only (exclude patents, books, etc.)
    doc_type: "PUBLICATION"

    # Year range lower bound (inclusive)
    year__gte: 1950

    # Year range upper bound (inclusive)
    year__lte: 2050

# -----------------------------------------------------------------------------
# Gold Filters
# -----------------------------------------------------------------------------
# Criteria for valid terms
gold_filters:
  # Column value filters
  columns:
    # Filter to main term types
    term_type: [MESH_HEADING, KEYWORD]

  # Required fields
  required_fields:
    - publication_id
    - term
    - term_type
