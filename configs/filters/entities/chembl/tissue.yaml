# configs/filters/entities/chembl/tissue.yaml
# ChEMBL Tissue Filter Configuration
# Reference: ADR-028 (Filter Rules Externalization)

version: "1.0.0"
provider: chembl
entity: tissue

# Input filter (disabled - reference table, no ID filtering)
input_filter:
    enabled: false

# No silver-level filters for reference tables
silver_filters:
    required_fields: []

# No gold-level filters for reference tables
gold_filters:
    required_fields: []
