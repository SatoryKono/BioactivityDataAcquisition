version: 1
policy_scope: semantic_compatibility_residue
schema_version: 1
retained_fields:
- field_name: deprecated_aliases
  owner: bioetl.domain.value_objects.publication
  rationale: Publication schema compatibility layer for legacy field names across providers (chembl, pubmed, crossref, openalex, semanticscholar). These aliases preserve backward compatibility with downstream consumers that may reference legacy field names.
  sunset_policy: No active sunset plan; aliases are retained for external API stability. Sunset requires coordinated migration with all downstream consumers.
  review_policy: Quarterly review; sunset considered only when all downstream consumers have migrated to canonical field names.
  review_date: '2026-09-30'
  status: retained
  external_breaking_change_required: true
  providers:
    - chembl
    - pubmed
    - crossref
    - openalex
    - semanticscholar
- field_name: nullable_compatibility_fields
  owner: bioetl.domain.value_objects.publication
  rationale: Publication schema compatibility layer for nullable fields across providers. These fields are intentionally nullable to accommodate varying data availability and quality across different data sources (chembl, pubmed, crossref, openalex, semanticscholar).
  sunset_policy: No active sunset plan; nullable compatibility is intrinsic to multi-provider data harmonization. Sunset would require provider-specific schema migration.
  review_policy: Quarterly review; sunset considered only when all providers normalize to non-null field availability.
  review_date: '2026-09-30'
  status: retained
  external_breaking_change_required: true
  providers:
    - chembl
      - publication_type_raw
      - publication_doi
      - publication_pmid
      - publication_pmc_id
      - oa_status
    - pubmed
    - crossref
    - openalex
    - semanticscholar
