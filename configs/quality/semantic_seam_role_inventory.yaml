schema_version: 1
policy_scope: semantic_seam_role_inventory
linked_issue: "#5566"
review_date: "2026-06-23"
owner: "@bioetl-architecture"
new_caller_policy: fail_fast_review_required
allowed_semantic_roles:
  - policy
  - runtime_builder
  - use_case
seams:
  - module: bioetl.application.core.batch_operation_errors
    path: src/bioetl/application/core/batch_operation_errors.py
    semantic_role: policy
    owner: "@bioetl-application-core"
    rationale: >-
      Centralized batch-operation error classification is a policy seam used by
      application-core orchestration helpers; new first-party callers must be
      reviewed because the module is already high fan-in.
    caller_guard:
      max_src_importer_count: 1
      allowed_src_importers:
        - src/bioetl/application/core/batch_runtime_failure_policy.py
  - module: bioetl.application.services.control_plane.replay.historical_certification_service
    path: src/bioetl/application/services/control_plane/replay/historical_certification_service.py
    semantic_role: use_case
    owner: "@bioetl-replay"
    rationale: >-
      Historical replay certification is an application use-case seam. CLI and
      bootstrap callers are allowed only through the reviewed certification flow
      so replay determinism remains inspectable.
    caller_guard:
      max_src_importer_count: 4
      allowed_src_importers:
        - src/bioetl/application/services/control_plane/replay/__init__.py
        - src/bioetl/application/services/control_plane/replay/historical_corpus_service.py
        - src/bioetl/composition/bootstrap/cli/run_manifest.py
        - src/bioetl/interfaces/cli/commands/_run_manifest_historical_support.py
  - module: bioetl.composition.runtime_builders.run_manifest_support
    path: src/bioetl/composition/runtime_builders/run_manifest_support.py
    semantic_role: runtime_builder
    owner: "@bioetl-composition"
    rationale: >-
      Run-manifest support belongs to composition runtime-builder wiring. New
      callers must be reviewed because the seam participates in manifest
      determinism, effective-config artifacts, and control-plane payloads.
    caller_guard:
      max_src_importer_count: 5
      allowed_src_importers:
        - src/bioetl/composition/bootstrap/runtime/_composite_control_plane_payloads.py
        - src/bioetl/composition/factories/pipeline/run_context_contract_identity.py
        - src/bioetl/composition/runtime_builders/_run_manifest_creation_support.py
        - src/bioetl/composition/runtime_builders/control_plane.py
        - src/bioetl/composition/runtime_builders/run_manifest_builder.py
