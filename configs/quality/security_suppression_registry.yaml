# Accepted bandit suppressions for src/ (AUD-012, #10537).
#
# Every `nosec B404/B405/B603/B604/B105/B110/B506` in src/ MUST have one
# entry here with a rationale and a review date. `line` is advisory (code
# may shift); the lock test matches entries by (path, rule) and requires a
# "see suppression registry" pointer on the suppression line.
# scripts/** suppressions are dev-tooling only and out of scope: the bandit
# product gate targets src/.
