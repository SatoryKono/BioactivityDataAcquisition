# Accepted bandit suppressions for src/ (AUD-012, #10537).
#
# Every `nosec B404/B405/B603/B604` in src/ MUST have one entry here with a
# rationale and a review date. `line` is advisory (code may shift); the lock
# test matches entries by (path, rule) and requires a
# "see suppression registry" pointer on the suppression line.
# scripts/** suppressions are dev-tooling only and out of scope: the bandit
# product gate targets src/.
version: 1
policy_scope: security_suppressions
linked_issue: "#10537"
owner: "@bioetl-architecture"
review_cadence: quarterly
default_review_date: "2026-12-31"
scope:
  roots:
    - src/
  rules:
    - B404
    - B405
    - B603
    - B604
