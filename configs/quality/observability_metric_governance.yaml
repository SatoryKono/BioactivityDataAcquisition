version: 1
policy_scope: observability_metric_governance
owner: "@bioetl-observability"
report_script: scripts/engineering/qa/report_observability_metric_inventory.py
inventory_allowlist: configs/quality/observability_metric_inventory_allowlist.yaml
derived_metric_declarations: configs/quality/observability_metric_declarations.yaml
governance_views:
  declared_metrics_field: declared_metrics
  emitted_metrics_field: emitted_metrics
  dashboarded_metrics_field: dashboarded_metrics
  alerted_metrics_field: alerted_metrics
  unused_declared_metrics_field: unused_declared_metrics
  emitted_without_declaration_field: emitted_without_declaration
  dashboarded_without_declaration_field: dashboarded_without_declaration
  alerted_without_declaration_field: alerted_without_declaration
  dashboarded_without_emission_field: dashboarded_without_emission
  alerted_without_emission_field: alerted_without_emission
  runtime_cardinality_review_required_field: runtime_cardinality_review_required
runtime_cardinality_review:
  heuristic: multi_emitter_static_proxy
  min_distinct_emitters: 3
  rationale: >
    Repo-static inventory cannot measure live label cardinality directly, so the
    governance layer uses multi-emitter metric families as a bounded review
    proxy that still surfaces likely operator-significant hotspots.
  exception_allowlist_field: runtime_cardinality_review_required
  exception_metadata_fields:
  - metric
  - owner
  - reason
  - review_date
  evidence_collection:
    mode: replayable_inventory_evidence_workflow
    artifact: reports/observability/runtime_cardinality_inventory.json
    command: python -m scripts.engineering.qa.report_observability_metric_inventory --check --json --write-evidence reports/observability/runtime_cardinality_inventory.json
    rationale: >
      Cardinality exceptions are reviewed through repo-local inventory plus a
      replayable evidence artifact that is generated during governance checks.
unused_signal_policy:
  rationale: >
    Registered metrics without runtime emission are treated as unused declared
    signals until an explicit allowlist or reactivation path says otherwise.
