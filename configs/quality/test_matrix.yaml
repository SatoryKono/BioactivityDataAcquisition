# Test Coverage Matrix — ADR-042
# Tracks required test types per provider and layer.
# CI uses this to validate minimum test coverage requirements.
#
# Levels: MUST (required), SHOULD (recommended), MAY (optional)
# Types: unit, integration, contract, property, e2e, smoke

version: "1.0.0"
adr_ref: ADR-042

# ── Canonical test-health lanes ─────────────────────────────

test_lanes:
  schema_version: 1
  source: configs/quality/test_matrix.yaml
  summary: >
    Canonical named pytest lanes for comparable local and CI test-health runs.
    Later test-health wrappers must emit these values as suite names instead of
    treating ad hoc pytest commands as comparable runs.
  execution_defaults:
    pythonpath: src
    direct_runner: scripts/engineering/dev/run_pytest.sh
    sharded_runner: scripts/engineering/dev/run_pytest_sharded.sh
    default_sharded_options:
      - --stream
      - --keep-coverage-files
      - --coverage-dir
      - .coverage-sharded
    default_pytest_passthrough:
      - -vv
      - --cov-report=html
    powershell_env_example: '$env:PYTHONPATH="src"'
    bash_env_example: PYTHONPATH=src
  lanes:
    smoke:
      suite_name: smoke
      description: "Minimal dependency and import smoke lane aligned with the CI smoke-check job."
      runner_backend: run_pytest
      runner: scripts/engineering/dev/run_pytest.sh
      paths:
        - tests/smoke/
      marker_expression: "not benchmark and not memory"
      pytest_args:
        - tests/smoke/
        - -m
        - not benchmark and not memory
      replay_mode: not_applicable
      coverage_gate: none
      expected_artifacts:
        junit_xml: true
        json_summary: true

    unit-fast:
      suite_name: unit-fast
      description: "Fast unit lane; excludes slow, benchmark, and Neo4j/MCP memory tests."
      runner_backend: run_pytest
      runner: scripts/engineering/dev/run_pytest.sh
      paths:
        - tests/unit/
      marker_expression: "not slow and not benchmark and not memory"
      pytest_args:
        - tests/unit/
        - -m
        - not slow and not benchmark and not memory
      replay_mode: not_applicable
      coverage_gate: none
      expected_artifacts:
        junit_xml: true
        json_summary: true

    integration-replay:
      suite_name: integration-replay
      description: "Integration lane in VCR/replay mode; live network access is not part of this lane."
      runner_backend: run_pytest
      runner: scripts/engineering/dev/run_pytest.sh
      paths:
        - tests/integration/
      marker_expression: "not slow and not benchmark and not memory"
      pytest_args:
        - tests/integration/
        - -m
        - not slow and not benchmark and not memory
        - --vcr-record=none
      environment:
        VCR_RECORD_MODE: none
      replay_mode: vcr_replay_only
      coverage_gate: none
      expected_artifacts:
        junit_xml: true
        json_summary: true

    security:
      suite_name: security
      description: "Dedicated security policy and secret-hygiene lane outside repo-wide coverage enforcement."
      runner_backend: run_pytest
      runner: scripts/engineering/dev/run_pytest.sh
      paths:
        - tests/security/
      marker_expression: "security and not benchmark and not memory"
      pytest_args:
        - tests/security/
        - -m
        - security and not benchmark and not memory
      replay_mode: not_applicable
      coverage_gate: none
      expected_artifacts:
        junit_xml: true
        json_summary: true

    contracts:
      suite_name: contracts
      description: "Schema, provider-contract, and snapshot drift tests."
      runner_backend: run_pytest
      runner: scripts/engineering/dev/run_pytest.sh
      paths:
        - tests/contract/
        - tests/unit/contracts/
      marker_expression: "not slow and not benchmark and not memory"
      pytest_args:
        - tests/contract/
        - tests/unit/contracts/
        - -m
        - not slow and not benchmark and not memory
      replay_mode: replay_or_no_api
      coverage_gate: none
      expected_artifacts:
        junit_xml: true
        json_summary: true

    architecture:
      suite_name: architecture
      description: "Layer boundary, contract, governance, and repository policy checks."
      runner_backend: run_pytest_sharded
      runner: scripts/engineering/dev/run_pytest_sharded.sh
      runner_options:
        - --shard
        - S7-crosscutting-architecture
        - --shard
        - S7-crosscutting-architecture-guardrails
      paths:
        - tests/architecture/
      marker_expression: "not slow and not benchmark and not memory"
      pytest_args:
        - tests/architecture/
        - -m
        - not slow and not benchmark and not memory
      replay_mode: not_applicable
      coverage_gate: none
      expected_artifacts:
        junit_xml: true
        json_summary: true

    e2e:
      suite_name: e2e
      description: "Slow end-to-end lane; kept separate from fast feedback and coverage verification."
      runner_backend: run_pytest
      runner: scripts/engineering/dev/run_pytest.sh
      paths:
        - tests/e2e/
      marker_expression: "e2e and not benchmark and not memory"
      pytest_args:
        - tests/e2e/
        - -m
        - e2e and not benchmark and not memory
      replay_mode: mixed
      coverage_gate: none
      expected_artifacts:
        junit_xml: true
        json_summary: true

    memory:
      suite_name: memory
      description: "Dedicated Neo4j project-memory and MCP lane; excluded from coverage verification."
      runner_backend: run_pytest
      runner: scripts/engineering/dev/run_pytest.sh
      paths:
        - tests/unit/scripts/ops/
      marker_expression: "memory and not benchmark"
      pytest_args:
        - tests/unit/scripts/ops/
        - -m
        - memory and not benchmark
      replay_mode: not_applicable
      coverage_gate: none
      expected_artifacts:
        junit_xml: true
        json_summary: true

    performance:
      suite_name: performance
      description: "Benchmark-backed hotspot and performance budget lane kept outside fast feedback and coverage verification."
      runner_backend: run_pytest
      runner: scripts/engineering/dev/run_pytest.sh
      paths:
        - tests/performance/
      marker_expression: "benchmark and performance"
      pytest_args:
        - tests/performance/
        - -m
        - benchmark and performance
        - -p
        - no:xdist
      replay_mode: not_applicable
      coverage_gate: none
      expected_artifacts:
        junit_xml: true
        json_summary: true

    coverage-verify:
      suite_name: coverage-verify
      description: "The only lane allowed to enforce the repo-wide coverage gate."
      runner_backend: run_pytest_sharded
      runner: scripts/engineering/dev/run_pytest_sharded.sh
      runner_options:
        - --stream
        - --keep-coverage-files
        - --coverage-dir
        - .coverage-sharded
      paths:
        - tests/
      marker_expression: "not e2e and not benchmark and not memory"
      pytest_args:
        - tests/
        - -m
        - not e2e and not benchmark and not memory
        - --cov=src/bioetl
        - --cov-report=term-missing
        - --cov-fail-under=85
      replay_mode: replay_or_no_api
      coverage_gate: repo-wide
      expected_artifacts:
        junit_xml: true
        json_summary: true

# ── Layer-level requirements ─────────────────────────────────

layers:
  domain:
    unit: MUST
    property: SHOULD
    description: "Pure logic, value objects, ports. No I/O."

  application:
    unit: MUST
    integration: SHOULD
    property: SHOULD  # transformers, normalization only
    description: "Pipelines, services, orchestration."

  infrastructure:
    unit: MUST
    integration: MUST  # VCR-backed
    contract: MUST
    description: "HTTP adapters, storage, observability."

  composition:
    unit: SHOULD
    integration: SHOULD
    e2e: MUST
    description: "DI wiring, factories, bootstrap."

  interfaces:
    unit: SHOULD
    e2e: MUST
    description: "CLI commands, entry points."

# ── Provider-level requirements ──────────────────────────────

providers:
  chembl:
    entities:
      [
        activity,
        assay,
        assay_parameters,
        cell_line,
        compound_record,
        publication,
        publication_similarity,
        publication_term,
        molecule,
        protein_class,
        subcellular_fraction,
        target,
        target_component,
        tissue,
      ]
    vcr_cassettes: MUST
    contract_tests: MUST
    golden_masters: SHOULD

  pubchem:
    entities: [compound]
    vcr_cassettes: MUST
    contract_tests: MUST
    golden_masters: SHOULD

  uniprot:
    entities: [protein, idmapping]
    vcr_cassettes: MUST
    contract_tests: MUST
    golden_masters: SHOULD

  pubmed:
    entities: [publication]
    vcr_cassettes: MUST
    contract_tests: MUST
    golden_masters: SHOULD

  crossref:
    entities: [publication]
    vcr_cassettes: MUST
    contract_tests: MUST
    golden_masters: MAY

  openalex:
    entities: [publication]
    vcr_cassettes: MUST
    contract_tests: MUST
    golden_masters: MAY

  semanticscholar:
    entities: [publication]
    vcr_cassettes: MUST
    contract_tests: SHOULD
    golden_masters: MAY

# ── Entity-level test ownership ──────────────────────────────

entity_test_ownership:
  chembl.activity:
    - tests/integration/pipelines/test_chembl_activity.py
  chembl.assay:
    - tests/e2e/test_chembl_assay_e2e.py
  chembl.assay_parameters:
    - tests/unit/application/pipelines/test_chembl_assay_parameters.py
  chembl.cell_line:
    - tests/integration/pipelines/test_chembl_cell_line.py
  chembl.compound_record:
    - tests/integration/pipelines/test_chembl_compound_record.py
  chembl.molecule:
    - tests/e2e/test_chembl_molecule_e2e.py
  chembl.protein_class:
    - tests/unit/application/pipelines/test_chembl_pipelines.py
  chembl.publication:
    - tests/e2e/test_chembl_publication_e2e.py
  chembl.publication_similarity:
    - tests/unit/application/pipelines/test_chembl_pipelines.py
  chembl.publication_term:
    - tests/e2e/test_chembl_publication_term_e2e.py
  chembl.subcellular_fraction:
    - tests/unit/application/pipelines/chembl/test_subcellular_fraction_transformer.py
  chembl.target:
    - tests/e2e/test_chembl_target_e2e.py
  chembl.target_component:
    - tests/integration/pipelines/test_chembl_target_component.py
  chembl.tissue:
    - tests/unit/application/pipelines/chembl/test_tissue_transformer.py
  crossref.publication:
    - tests/e2e/test_crossref_publication_e2e.py
  openalex.publication:
    - tests/e2e/test_openalex_publication_e2e.py
  pubchem.compound:
    - tests/e2e/test_pubchem_compound_e2e.py
  pubmed.publication:
    - tests/e2e/test_pubmed_publication_e2e.py
  semanticscholar.publication:
    - tests/e2e/test_semanticscholar_publication_e2e.py
  uniprot.idmapping:
    - tests/integration/adapters/test_uniprot_idmapping.py
  uniprot.protein:
    - tests/e2e/test_uniprot_protein_e2e.py

# ── Canonical regression suites for shared provider capabilities ─────────────

provider_regression_suites:
  metadata_request_capability:
    description: "Canonical provider suites for request-metadata snapshot, clear, and count paths."
    providers:
      chembl: tests/unit/infrastructure/adapters/chembl/test_request_metadata.py
      crossref: tests/unit/infrastructure/adapters/crossref/test_request_metadata.py
      openalex: tests/unit/infrastructure/adapters/openalex/test_request_metadata.py
      pubchem: tests/unit/infrastructure/adapters/pubchem/test_request_metadata.py
      pubmed: tests/unit/infrastructure/adapters/pubmed/test_request_metadata.py
      semanticscholar: tests/unit/infrastructure/adapters/semanticscholar/test_request_metadata.py
      uniprot: tests/unit/infrastructure/adapters/uniprot/test_request_metadata.py

  slow_health_probe_policy:
    description: "Canonical provider suites for shared slow-health degradation policy."
    providers:
      crossref: tests/unit/infrastructure/adapters/crossref/test_crossref_client.py
      openalex: tests/unit/infrastructure/adapters/openalex/test_adapter.py
      pubmed: tests/unit/infrastructure/adapters/pubmed/test_pubmed_client.py
      semanticscholar: tests/unit/infrastructure/adapters/semanticscholar/test_adapter.py

# ── Test boundaries (ADR-042 §Property-Based Testing) ───────

property_test_boundaries:
  allowed:
    - domain/aggregates
    - domain/entities
    - domain/policies
    - domain/value_objects
    - application/pipelines/*/transformer*
    - application/core/normalization*
    - domain/services/schema*
  forbidden:
    - infrastructure/storage  # Use fixtures instead
    - interfaces/cli  # Use e2e instead
  # Note: infrastructure/adapters/common is exempt — retry/fallback
  # policies are pure logic tested with property-based approaches.

# ── Mutation testing (ADR-042 §Mutation Gate) ────────────────

mutation_testing:
  enabled: true
  workflow_present: true
  ci_gate_mode: partial  # Domain enforced in dedicated workflow; application target staged
  tool: mutmut
  targets:
    domain:
      min_score: 70
      enforced: true
    application:
      min_score: 60
      enforced: false
  excluded:
    - infrastructure  # I/O-heavy, low mutation value
    - composition  # Wiring code, tested via e2e
    - interfaces  # CLI tested via e2e

# ── Fixture governance ───────────────────────────────────────

fixture_governance:
  governance_ledger_location: configs/quality/fixture_governance_ledger.yaml
  vcr_cassette_max_age_days: 90
  golden_master_location: tests/fixtures/golden/{provider}/
  current_silver_schema_snapshot_location: tests/contract/silver_schemas/snapshots/
  contract_snapshot_location: tests/fixtures/contracts/{provider}/v{version}.json
  cassette_metadata_catalog_location: reports/quality/vcr-metadata-catalog.json
  cassette_metadata_catalog_script: scripts/engineering/qa/report_vcr_metadata_catalog.py
  cassette_metadata_required: true
  cassette_staleness_requires_metadata: true
  canonical_vcr_location: tests/fixtures/vcr/{provider}/
  extensionless_allowlist: .github/vcr-noext-allowlist.txt
  root_vcr_policy_enforced: true
  cassette_metadata_backfill_workflow_present: false
  cassette_metadata_backfill_script: scripts/ops/migrations/active/backfill_vcr_metadata_sidecars.py
  cassette_metadata_inventory_contract:
    scope: managed_vcr_inventory
    metadata_catalog_location: reports/quality/vcr-metadata-catalog.json
    stale_age_checker: scripts/engineering/qa/vcr/check_vcr_metadata_age.py
    provider_expected_sidecar_counts:
      chembl: 58
      crossref: 24
      multi_provider: 1
      openalex: 25
      pubchem: 32
      pubmed: 24
      semanticscholar: 24
      uniprot: 15
  rollout:
    cassette_metadata: enforced
    cassette_staleness_age: enforced
    cassette_metadata_catalog: enforced
    cassette_metadata_backfill: enforced
    contract_snapshots: partial
    golden_masters: partial
    extensionless_filenames: enforced
  contract_snapshot_registry:
    scope: bounded_live_provider_baseline
    documentation: tests/fixtures/contracts/README.md
    helper_module: tests/contract/_provider_contract_drift.py
    replay_registry_module: tests/contract/_provider_contract_replay.py
    registry_test_module: tests/contract/test_provider_contract_snapshot_registry.py
    replay_test_module: tests/contract/test_provider_contract_drift_replay.py
    replay_report_command: python -m scripts.engineering.qa report-provider-contract-drift
    update_env_var: UPDATE_SNAPSHOTS
    providers:
      chembl:
        version: 1
        test_module: tests/contract/test_chembl_contract.py
        required_probes:
          - activity_endpoint_schema
          - molecule_endpoint_schema
          - target_endpoint_schema
      crossref:
        version: 1
        test_module: tests/contract/test_crossref_contract.py
        required_probes:
          - work_lookup_by_doi
          - works_query_endpoint
          - agency_lookup_for_doi
      openalex:
        version: 1
        test_module: tests/contract/test_openalex_contract.py
        required_probes:
          - works_filter_by_doi
          - works_search_endpoint
          - health_probe_shape
      pubchem:
        version: 1
        test_module: tests/contract/test_pubchem_contract.py
        required_probes:
          - compound_by_molecule_id
          - compound_property_endpoint
          - smiles_search
      pubmed:
        version: 1
        test_module: tests/contract/test_pubmed_contract.py
        required_probes:
          - esearch_endpoint
          - esummary_endpoint
          - einfo_database_list
      semanticscholar:
        version: 1
        test_module: tests/contract/test_semanticscholar_contract.py
        required_probes:
          - paper_search_endpoint
          - paper_batch_lookup_by_doi
      uniprot:
        version: 1
        test_module: tests/contract/test_uniprot_contract.py
        required_probes:
          - uniprotkb_search_endpoint
          - specific_protein_lookup
          - taxonomy_endpoint
  gold_snapshot_registry:
    scope: bounded_contract_and_dq_sensitive_gold_baseline
    documentation: docs/04-reference/contracts/gold-schemas.md
    registry_path: tests/fixtures/golden/gold/schema_registry.v1.json
    helper_module: tests/contract/_gold_schema_snapshot_registry.py
    registry_test_module: tests/contract/test_gold_schema_snapshot_registry.py
    dq_snapshot_test_module: tests/contract/test_gold_dq_golden_snapshots.py
    update_env_var: UPDATE_SNAPSHOTS
    tracked_snapshot_paths:
      - tests/fixtures/golden/gold/chembl_activity_dq_bundle_v1.json
      - tests/fixtures/golden/gold/composite_molecule_dq_bundle_v1.json
      - tests/fixtures/golden/gold/composite_publication_dq_bundle_v1.json
      - tests/fixtures/golden/gold/pubmed_publication_dq_bundle_v1.json

contract_testing:
  workflow_present: true
  replay_gate_workflow: .github/workflows/provider-contract-drift.yml
  live_api_gate_mode: scheduled
  replay_gate_mode: ci
  network_opt_in_required: true
  live_api_minimum_baseline:
    enforced_providers: [chembl, pubchem, uniprot, pubmed, crossref, openalex, semanticscholar]
    pilot_providers: []
    vcr_only_providers: []
  provider_live_api:
    chembl: enforced
    pubchem: enforced
    uniprot: enforced
    pubmed: enforced
    crossref: enforced
    openalex: enforced
    semanticscholar: enforced
