schema_version: docker-runtime-contract-v1
policy:
  adr: ADR-010
  status: optional_local_only_adjunct
  canonical_runtime: false
  owner: BioETL maintainers
  gate_command: >-
    python scripts/ops/runtime/docker/docker_runtime_preflight.py
    --contract configs/quality/docker_runtime_contracts.yaml
  runtime_guardrail: >-
    Docker helpers are optional local adjuncts and MUST NOT be required for the
    canonical Python/venv runtime, tests, storage, locking, or orchestration.

stability_slo:
  startup_cycles: 10
  soak_hours: 7.2
  unexpected_exits: 0
  restart_count_delta: 0
  oom_kills: 0
  unresolved_unhealthy: 0
  recovery_seconds_p99: 180
  recovery_trials: 10

diagnostics:
  F001:
    severity: error
    title: Bind mount obscures image-installed dependencies
  F002:
    severity: error
    title: Warp client starts without warp-svc
  F003:
    severity: error
    title: Compose project or service ownership drift
  F004:
    severity: error
    title: Container environment collides with an image-owned namespace

host_probe:
  owner: scripts/ops/runtime/docker/docker_runtime_probe.py
  transport: bounded_report_and_optional_pushgateway
  label_values:
    stack: contracted_stack_names_only
    project: contracted_project_names_only
    service: contracted_service_names_only
    cause: fixed_primary_cause_enum_only
  metric_labels:
    bioetl_docker_runtime_probe_success: [project, stack]
    bioetl_docker_runtime_daemon_available: [project, stack]
    bioetl_docker_runtime_restart_delta: [project, stack]
    bioetl_docker_runtime_oom_kills: [project, stack]
    bioetl_docker_runtime_disk_free_bytes: [project, stack]
    bioetl_docker_runtime_recovery_attempts: [project, stack]
    bioetl_docker_runtime_recovery_duration_seconds: [project, stack]
    bioetl_docker_runtime_primary_cause: [project, stack]
    bioetl_docker_runtime_resource_peak_ratio: [project, resource, service, stack]
    bioetl_docker_runtime_service_ready: [project, service, stack]
    bioetl_docker_runtime_service_restart_count: [project, service, stack]
    bioetl_docker_runtime_service_oom_killed: [project, service, stack]

hardening_targets:
  implementation_issue: 6293
  images:
    immutable_digest_required: true
    mutable_tags_forbidden: [latest, alpine]
  resources:
    memory_limit_required: true
    cpu_limit_required: true
    pids_limit_required: true
  logging:
    driver: json-file
    max_size: 10m
    max_files: 3
  readiness:
    real_service_probe_required: true
    running_state_is_not_ready: true

path_policy:
  preferred_repository_origin: linux_filesystem
  discouraged_origins:
    - /mnt/c
    - /mnt/d
    - /mnt/e
  mixed_origin_for_same_project_forbidden: true

stacks:
  main:
    compose_file: docker-compose.yml
    project_name: bioetl-main
    owner: local-main-helper
    required_services:
      - bioetl
    optional_services: []
    required_environment_names:
      - LOG_LEVEL
      - NEO4J_USERNAME
      - NEO4J_PASSWORD
    required_secret_environment_names:
      - NEO4J_PASSWORD
    readiness:
      bioetl: http://127.0.0.1:8000/health/ready
    restart_policy:
      bioetl: on-failure:3
    migration:
      legacy_project_name: bioactivitydataacquisition2
      volume_map: {}
  # OPTIONAL operator stack — not part of the default release bundle.
  # Loki, Promtail, Tempo, and Quarantine Explorer were removed from this surface.
  monitoring:
    compose_file: docker-compose.monitoring.yml
    project_name: bioetl-monitoring
    owner: observability-helper
    default_release_bundle: false
    required_services:
      - prometheus
      - pushgateway
      - grafana
      - renderer
    optional_services: []
    required_environment_names:
      - GF_SECURITY_ADMIN_PASSWORD
      - GF_RENDERING_RENDERER_TOKEN
    required_secret_environment_names:
      - GF_SECURITY_ADMIN_PASSWORD
      - GF_RENDERING_RENDERER_TOKEN
    readiness:
      prometheus: http://127.0.0.1:9090/-/healthy
      pushgateway: http://127.0.0.1:9091/-/healthy
      grafana: http://127.0.0.1:3000/api/health
    migration:
      legacy_project_name: bioactivitydataacquisition2
      volume_map:
        bioactivitydataacquisition2_prometheus-data: bioetl-monitoring_prometheus-data
        bioactivitydataacquisition2_grafana-data: bioetl-monitoring_grafana-data

  neo4j:
    compose_file: docker-compose.neo4j.yml
    project_name: bioetl-neo4j
    owner: neo4j-helper
    required_services:
      - neo4j
    optional_services: []
    required_environment_names:
      - NEO4J_USERNAME
      - NEO4J_PASSWORD
    required_secret_environment_names:
      - NEO4J_PASSWORD
    required_non_secret_environment_values:
      NEO4J_USERNAME: neo4j
    forbidden_container_environment_names:
      - NEO4J_USERNAME
      - NEO4J_PASSWORD
    readiness:
      neo4j: http://127.0.0.1:7474
    migration:
      legacy_project_name: bioactivitydataacquisition2
      requires_backup_restore_drill: true
      volume_map:
        bioactivitydataacquisition2_neo4j_data: bioetl-neo4j_neo4j_data
        bioactivitydataacquisition2_neo4j_logs: bioetl-neo4j_neo4j_logs
  neo4j-audit:
    compose_file: docker-compose.neo4j-audit.yml
    project_name: bioetl-neo4j-audit
    owner: neo4j-audit-helper
    required_services:
      - neo4j-audit
    optional_services: []
    required_environment_names:
      - NEO4J_AUDIT_USERNAME
      - NEO4J_AUDIT_PASSWORD
    required_secret_environment_names:
      - NEO4J_AUDIT_PASSWORD
    required_non_secret_environment_values:
      NEO4J_AUDIT_USERNAME: neo4j
    forbidden_container_environment_names:
      - NEO4J_USERNAME
      - NEO4J_PASSWORD
    readiness:
      neo4j-audit: http://127.0.0.1:7475
  redis:
    compose_file: scripts/ops/runtime/docker/compose/redis.yml
    project_name: bioetl-redis
    owner: optional-redis-diagnostics
    required_services: [redis, redis-exporter]
    optional_services: []
    required_environment_names: [REDIS_PASSWORD]
    required_secret_environment_names: [REDIS_PASSWORD]
    readiness:
      redis: redis-cli ping
  minio:
    compose_file: scripts/ops/runtime/docker/compose/minio.yml
    project_name: bioetl-minio
    owner: optional-minio-diagnostics
    required_services: [minio]
    optional_services: []
    required_environment_names: [MINIO_ROOT_USER, MINIO_ROOT_PASSWORD]
    required_secret_environment_names: [MINIO_ROOT_PASSWORD]
    readiness:
      minio: http://127.0.0.1:9000/minio/health/ready
  alertmanager:
    compose_file: scripts/ops/runtime/docker/compose/alertmanager.yml
    project_name: bioetl-alertmanager
    owner: optional-alertmanager-diagnostics
    required_services: [alertmanager]
    optional_services: []
    required_environment_names: []
    readiness:
      alertmanager: http://127.0.0.1:9093/-/healthy
  sonarqube:
    compose_file: scripts/ops/runtime/docker/compose/sonarqube.yml
    project_name: bioetl-sonarqube
    owner: optional-sonarqube-diagnostics
    required_services: [postgres-sonarqube, sonarqube]
    optional_services: []
    required_environment_names:
      - SONARQUBE_DB_PASSWORD
      - SONARQUBE_SYSTEM_PASSCODE
    required_secret_environment_names:
      - SONARQUBE_DB_PASSWORD
      - SONARQUBE_SYSTEM_PASSCODE
    readiness:
      sonarqube: http://127.0.0.1:9010/api/system/status

service_ownership:
  bioetl: main
  prometheus: monitoring
  pushgateway: monitoring
  grafana: monitoring
  renderer: monitoring
  neo4j: neo4j
  neo4j-audit: neo4j-audit
  redis: redis
  redis-exporter: redis
  minio: minio
  alertmanager: alertmanager
  postgres-sonarqube: sonarqube
  sonarqube: sonarqube

host_ports:
  3000: {stack: monitoring, service: grafana, bind: 127.0.0.1}
  7474: {stack: neo4j, service: neo4j, bind: 127.0.0.1}
  7475: {stack: neo4j-audit, service: neo4j-audit, bind: 127.0.0.1}
  7687: {stack: neo4j, service: neo4j, bind: 127.0.0.1}
  7688: {stack: neo4j-audit, service: neo4j-audit, bind: 127.0.0.1}
  8000: {stack: main, service: bioetl, bind: 127.0.0.1}
  6379: {stack: redis, service: redis, bind: 127.0.0.1}
  9000: {stack: minio, service: minio, bind: 127.0.0.1}
  9001: {stack: minio, service: minio, bind: 127.0.0.1}
  9010: {stack: sonarqube, service: sonarqube, bind: 127.0.0.1}
  9090: {stack: monitoring, service: prometheus, bind: 127.0.0.1}
  9091: {stack: monitoring, service: pushgateway, bind: 127.0.0.1}
  9093: {stack: alertmanager, service: alertmanager, bind: 127.0.0.1}
  9121: {stack: redis, service: redis-exporter, bind: 127.0.0.1}

retained_container_names:
  bioetl:
    stack: main
    reason: Main helper health checks and operator diagnostics address this name.
  bioetl-neo4j:
    stack: neo4j
    reason: Existing Neo4j recovery, MCP, and operator scripts address this name.
  bioetl-neo4j-audit:
    stack: neo4j-audit
    reason: Existing audit launchers and verification scripts address this name.
  bioetl-prometheus:
    stack: monitoring
    reason: Published endpoint verification addresses this name.
  bioetl-pushgateway:
    stack: monitoring
    reason: Published endpoint verification addresses this name.
  bioetl-grafana:
    stack: monitoring
    reason: Published endpoint verification addresses this name.

shared_networks:
  monitoring:
    name: bioetl-monitoring
    owner: scripts/ops/runtime/docker/runtime_manager.py
    consumers: [main, monitoring]
  runtime:
    name: bioetl-runtime
    owner: scripts/ops/runtime/docker/runtime_manager.py
    consumers: [main, neo4j]

capacity:
  minimum_free_disk_gib: 50
  minimum_free_disk_percent: 20
  minimum_free_memory_gib: 4
  minimum_cpus: 2
