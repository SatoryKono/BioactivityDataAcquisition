version: 1
policy_scope: deterministic_identity_generation
review_date: '2026-09-30'
compatibility_reduction_plan:
  linked_issue: '#4517'
  review_date: '2026-09-30'
  allowed_outcomes:
  - retain_occurrence_only_generator
  - keep_compatibility_alias_but_block_new_semantics
  - keep_hash_policy_split_until_backfill
  occurrence_identity_budget:
    max_allowed_call_sites: 18
    ratchet_policy: No new uuid4-based occurrence identity generators may be added
      without explicit policy review and test evidence.
  replay_hash_policy_budget:
    allowed_legacy_alias_fields:
    - config_hash
    allowed_hash_datetime_defaults:
    - v1_date
    - v2_datetime_utc
    ratchet_policy: Compatibility-only replay/hash aliases may stay only while they
      remain explicitly documented and outside semantic execution identity.
allowed_occurrence_identity_generators:
- path: src/bioetl/domain/aggregates/_batch_aggregate.py
  symbol: Batch.create
  generator: uuid4
  identity_field: BatchID
  semantic_classification: occurrence-only
  replay_semantics: excluded_from_execution_fingerprint
  rationale: Runtime batch occurrence identity; it must not enter semantic replay
    identity or dataset content hashes.
  issue: '#3407'
- path: src/bioetl/composition/factories/batch_id_generator.py
  symbol: UuidBatchIdGenerator.create
  generator: uuid4
  identity_field: BatchID
  semantic_classification: occurrence-only
  replay_semantics: excluded_from_execution_fingerprint
  rationale: Composition default occurrence ID generator; deterministic tests may
    replace this port-level implementation.
  issue: '#3407'
- path: src/bioetl/domain/aggregates/_quarantine_aggregate.py
  symbol: QuarantineEntry.create
  generator: uuid4
  identity_field: entry_id
  semantic_classification: occurrence-only
  replay_semantics: excluded_from_execution_fingerprint
  rationale: Quarantine entry ID is a correlation identifier; payload_hash remains
    the semantic content identity.
  issue: '#3407'
- path: src/bioetl/domain/aggregates/events.py
  symbol: DomainEvent.event_id
  generator: uuid4
  identity_field: event_id
  semantic_classification: occurrence-only
  replay_semantics: excluded_from_execution_fingerprint
  rationale: Domain event ID is an idempotency/correlation identifier; event payload
    semantics remain separate.
  issue: '#3407'
- path: src/bioetl/application/services/execution/pipeline_runner_service.py
  symbol: PipelineRunnerService.run
  generator: uuid4
  identity_field: RunID
  semantic_classification: occurrence-only
  replay_semantics: excluded_from_execution_fingerprint
  rationale: Pipeline runner service run_id is an execution occurrence identifier;
    replay and content semantics remain anchored by manifest fingerprints and
    input snapshot fingerprints.
  issue: '#4472'
- path: src/bioetl/application/services/control_plane/run_manifest_service.py
  symbol: RunManifestService._manifest_id_factory
  generator: uuid4
  identity_field: manifest_id
  semantic_classification: occurrence-only
  replay_semantics: excluded_from_execution_fingerprint
  rationale: Run manifest IDs identify persisted control-plane occurrences;
    execution_fingerprint and effective-config hashes carry semantic replay identity.
  issue: '#4472'
- path: src/bioetl/application/services/control_plane/run_ledger_service.py
  symbol: RunLedgerService._entry_id_factory
  generator: uuid4
  identity_field: ledger_entry_id
  semantic_classification: occurrence-only
  replay_semantics: excluded_from_execution_fingerprint
  rationale: Run ledger entry IDs are append-only event occurrence identifiers;
    ledger idempotency and semantic event payloads remain separate.
  issue: '#4472'
- path: src/bioetl/application/services/control_plane/workflow_manifest_service.py
  symbol: WorkflowManifestService._manifest_id_factory
  generator: uuid4
  identity_field: workflow_manifest_id
  semantic_classification: occurrence-only
  replay_semantics: excluded_from_execution_fingerprint
  rationale: Workflow manifest IDs identify persisted workflow occurrences while
    compute_execution_fingerprint carries the semantic workflow identity.
  issue: '#4472'
- path: src/bioetl/application/services/control_plane/workflow_ledger_service.py
  symbol: WorkflowLedgerService._entry_id_factory
  generator: uuid4
  identity_field: workflow_ledger_entry_id
  semantic_classification: occurrence-only
  replay_semantics: excluded_from_execution_fingerprint
  rationale: Workflow ledger entry IDs are append-only event occurrence identifiers
    and must not participate in semantic workflow replay identity.
  issue: '#4472'
- path: src/bioetl/application/services/control_plane/workflow_execution_service.py
  symbol: WorkflowExecutionService.run_id_factory
  generator: uuid4
  identity_field: workflow_run_id
  semantic_classification: occurrence-only
  replay_semantics: excluded_from_execution_fingerprint
  rationale: Workflow run IDs identify execution occurrences; workflow manifest
    fingerprints define replay semantics.
  issue: '#4472'
- path: src/bioetl/application/composite/runner_pkg/runner_runtime_helpers.py
  symbol: initialize_runner_runtime_state
  generator: uuid4
  identity_field: composite_run_id
  semantic_classification: occurrence-only
  replay_semantics: excluded_from_execution_fingerprint
  rationale: Composite runner IDs identify mutable runtime occurrences and are
    excluded from semantic composite dependency and replay identity.
  issue: '#4472'
- path: src/bioetl/composition/bootstrap/runtime/_runner_assembly_support.py
  symbol: resolve_effective_run_id
  generator: uuid4
  identity_field: composite_run_id
  semantic_classification: occurrence-only
  replay_semantics: excluded_from_execution_fingerprint
  rationale: Runtime assembly fallback IDs are occurrence-only defaults used when
    callers do not inject an explicit run identifier.
  issue: '#4472'
- path: src/bioetl/composition/bootstrap/runtime/pipeline_context_builder.py
  symbol: build_pipeline_context
  generator: uuid4
  identity_field: RunID
  semantic_classification: occurrence-only
  replay_semantics: excluded_from_execution_fingerprint
  rationale: CLI/runtime PipelineRunContext run_id is an occurrence identifier;
    exact replay uses explicit replay selectors and input snapshot fingerprints.
  issue: '#4472'
- path: src/bioetl/composition/bootstrap/runtime/runner.py
  symbol: bootstrap_pipeline_runner_service
  generator: uuid4
  identity_field: service_run_id
  semantic_classification: occurrence-only
  replay_semantics: excluded_from_execution_fingerprint
  rationale: Bootstrap service_run_id is used for observability correlation while
    execution identity remains in run manifests and fingerprints.
  issue: '#4472'
- path: src/bioetl/composition/bootstrap/runtime/logger_bootstrap.py
  symbol: bootstrap_logger
  generator: uuid4
  identity_field: log_correlation_run_id
  semantic_classification: occurrence-only
  replay_semantics: excluded_from_execution_fingerprint
  rationale: Logger fallback run IDs are correlation-only observability IDs and
    must not enter replay fingerprints.
  issue: '#4472'
- path: src/bioetl/composition/bootstrap/cli/storage.py
  symbol: _create_cli_preview_run_context
  generator: uuid4
  identity_field: cli_preview_run_id
  semantic_classification: occurrence-only
  replay_semantics: excluded_from_execution_fingerprint
  rationale: CLI preview storage contexts use occurrence-only IDs for local
    operator actions and not for semantic replay identity.
  issue: '#4472'
- path: src/bioetl/composition/observability_api.py
  symbol: push_metrics_to_gateway
  generator: uuid4
  identity_field: metrics_correlation_run_id
  semantic_classification: occurrence-only
  replay_semantics: excluded_from_execution_fingerprint
  rationale: Metrics gateway helper fallback IDs are observability correlation
    identifiers for push/delete operations, not semantic execution identity.
  issue: '#4472'
- path: src/bioetl/composition/observability_api.py
  symbol: delete_metrics_from_gateway
  generator: uuid4
  identity_field: metrics_cleanup_correlation_run_id
  semantic_classification: occurrence-only
  replay_semantics: excluded_from_execution_fingerprint
  rationale: Metrics gateway cleanup fallback IDs are observability correlation
    identifiers for delete operations, not semantic execution identity.
  issue: '#4467'
legacy_config_hash_policy:
  field: config_hash
  alias_of: resolved_config_hash
  semantic_classification: compatibility-only
  replay_identity_anchor: false
  primary_semantic_anchor: effective_config_hash
  canonical_replay_anchors:
  - execution_fingerprint
  - resolved_config_hash
  - effective_config_hash
  rationale: Legacy config_hash is retained for older manifest and sidecar
    consumers; new replay comparisons must use execution_fingerprint plus the
    explicit resolved/effective config hashes and must not promote config_hash to
    a primary semantic anchor.
  issue: '#4467'
  reviewed_outcome: keep_compatibility_alias_but_block_new_semantics
content_hash_datetime_policy:
  active_policy: v1_date
  migration_target: v2_datetime_utc
  reviewed_outcome: keep_hash_policy_split_until_backfill
  policies:
    v1_date:
      description: Historical content-hash compatibility contract.
      datetime_normalization: date_only_iso
      distinguishes_same_day_timestamps: false
      migration_status: active_compatibility_default
    v2_datetime_utc:
      description: Timestamp-sensitive business identity contract.
      datetime_normalization: utc_iso_microseconds
      distinguishes_same_day_timestamps: true
      migration_status: opt_in_until_hash_backfill_plan_exists
  invariants:
  - Existing content_hash values must not be silently rewritten.
  - Versioned hash policy must be recorded before changing defaults.
  - META_FIELDS and underscore-prefixed runtime fields remain excluded.
  timestamp_sensitive_entity_inventory:
  - provider: uniprot
    entity: protein
    fields:
    - entry_created
    - entry_modified
    - sequence_modified
    configured_policy: v2_datetime_utc
    status: migrated
    rationale: UniProt revision timestamps participate in business identity and
      must distinguish same-day changes when represented as datetime values.
  date_only_entity_inventory:
  - provider: chembl
    entity: publication
    fields:
    - creation_date
    configured_policy: v1_date
    status: documented_date_only
    rationale: ChEMBL publication creation_date is a source date, not a
      sub-day timestamp identity.
