version: 1
policy_scope: deterministic_identity_generation
review_date: '2026-09-30'
allowed_occurrence_identity_generators:
- path: src/bioetl/domain/aggregates/_batch_aggregate.py
  symbol: Batch.create
  generator: uuid4
  identity_field: BatchID
  semantic_classification: occurrence-only
  replay_semantics: excluded_from_execution_fingerprint
  rationale: Runtime batch occurrence identity; it must not enter semantic replay
    identity or dataset content hashes.
  issue: '#3407'
- path: src/bioetl/composition/factories/batch_id_generator.py
  symbol: UuidBatchIdGenerator.create
  generator: uuid4
  identity_field: BatchID
  semantic_classification: occurrence-only
  replay_semantics: excluded_from_execution_fingerprint
  rationale: Composition default occurrence ID generator; deterministic tests may
    replace this port-level implementation.
  issue: '#3407'
- path: src/bioetl/domain/aggregates/_quarantine_aggregate.py
  symbol: QuarantineEntry.create
  generator: uuid4
  identity_field: entry_id
  semantic_classification: occurrence-only
  replay_semantics: excluded_from_execution_fingerprint
  rationale: Quarantine entry ID is a correlation identifier; payload_hash remains
    the semantic content identity.
  issue: '#3407'
- path: src/bioetl/domain/aggregates/events.py
  symbol: DomainEvent.event_id
  generator: uuid4
  identity_field: event_id
  semantic_classification: occurrence-only
  replay_semantics: excluded_from_execution_fingerprint
  rationale: Domain event ID is an idempotency/correlation identifier; event payload
    semantics remain separate.
  issue: '#3407'
content_hash_datetime_policy:
  active_policy: v1_date
  migration_target: v2_datetime_utc
  policies:
    v1_date:
      description: Historical content-hash compatibility contract.
      datetime_normalization: date_only_iso
      distinguishes_same_day_timestamps: false
      migration_status: active_compatibility_default
    v2_datetime_utc:
      description: Timestamp-sensitive business identity contract.
      datetime_normalization: utc_iso_microseconds
      distinguishes_same_day_timestamps: true
      migration_status: opt_in_until_hash_backfill_plan_exists
  invariants:
  - Existing content_hash values must not be silently rewritten.
  - Versioned hash policy must be recorded before changing defaults.
  - META_FIELDS and underscore-prefixed runtime fields remain excluded.
  timestamp_sensitive_entity_inventory:
  - provider: uniprot
    entity: protein
    fields:
    - entry_created
    - entry_modified
    - sequence_modified
    configured_policy: v2_datetime_utc
    status: migrated
    rationale: UniProt revision timestamps participate in business identity and
      must distinguish same-day changes when represented as datetime values.
  date_only_entity_inventory:
  - provider: chembl
    entity: publication
    fields:
    - creation_date
    configured_policy: v1_date
    status: documented_date_only
    rationale: ChEMBL publication creation_date is a source date, not a
      sub-day timestamp identity.
