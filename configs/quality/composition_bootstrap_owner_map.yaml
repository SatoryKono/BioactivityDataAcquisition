schema_version: 1
policy_scope: composition_bootstrap_owner_map
linked_issue: "#5572"
reviewed_on: "2026-06-23"
review_by: "2026-09-30"
owner: "@bioetl-composition"
new_service_assembly_policy: fail_fast_single_owner_graph
rationale: >-
  CLI and runtime bootstrap modules may parse operator inputs and bind adapters,
  but shared service construction must route through one reviewed owner graph
  instead of duplicating constructors in command/runtime entrypoints.
owner_graphs:
  - graph_id: cli_admin_services
    graph_owner: "@bioetl-composition"
    owner_module: bioetl.composition.bootstrap.cli.service_builders
    owner_path: src/bioetl/composition/bootstrap/cli/service_builders.py
    allowed_entrypoints:
      - src/bioetl/composition/bootstrap/cli/checkpoint.py::bootstrap_quarantine_service
      - src/bioetl/composition/bootstrap/cli/health.py::bootstrap_health_server_quarantine_service
    required_builder_symbols:
      - build_cli_quarantine_service
      - build_cli_checkpoint_service
      - build_cli_observability_workflow_service
    collapsed_service_construction_paths:
      - from: src/bioetl/composition/bootstrap/cli/health.py::bootstrap_health_server_quarantine_service
        to: src/bioetl/composition/bootstrap/cli/service_builders.py::build_cli_quarantine_service
        status: collapsed_in_5572
        owner_test: tests/unit/composition/bootstrap/test_health_bootstrap.py::TestBootstrapHealthServerDependencies::test_quarantine_service_delegates_to_cli_service_builder
        rationale: >-
          Health-server quarantine bootstrap no longer constructs
          QuarantineService directly; it reuses the canonical CLI service graph
          with a null run-manifest service factory.
  - graph_id: runtime_pipeline_runner
    graph_owner: "@bioetl-composition"
    owner_module: bioetl.composition.runtime_builders.runner_builder_wiring
    owner_path: src/bioetl/composition/runtime_builders/runner_builder_wiring.py
    aggregate_wiring_symbol: RunnerBuilderWiring
    allowed_entrypoints:
      - src/bioetl/composition/bootstrap/runtime/pipeline.py::bootstrap_pipeline_runner
      - src/bioetl/composition/runtime_builders/runner_builder.py::build_pipeline_runner
    required_builder_symbols:
      - RunnerBuilderWiring
      - RunnerFactoryWiring
      - RunnerInputWiring
      - resolve_runner_builder_wiring
    collapsed_service_construction_paths: []
  - graph_id: composite_runner
    graph_owner: "@bioetl-composition"
    owner_module: bioetl.composition.bootstrap.runtime.runner_assembly
    owner_path: src/bioetl/composition/bootstrap/runtime/runner_assembly.py
    allowed_entrypoints:
      - src/bioetl/composition/bootstrap/runtime/composite.py::_build_runner_factories
      - src/bioetl/composition/bootstrap/runtime/runner_assembly.py::bootstrap_composite_runner
    required_builder_symbols:
      - bootstrap_composite_runner
      - create_composite_runner
      - create_composite_runner_service
    collapsed_service_construction_paths: []
guardrails:
  - id: cli_entrypoints_do_not_directly_construct_shared_services
    mode: fail_fast_review_required
    applies_to:
      - src/bioetl/composition/bootstrap/cli/health.py
      - src/bioetl/composition/bootstrap/cli/checkpoint.py
    canonical_owner: src/bioetl/composition/bootstrap/cli/service_builders.py
  - id: runtime_bootstrap_uses_typed_runner_wiring
    mode: fail_fast_review_required
    applies_to:
      - src/bioetl/composition/bootstrap/runtime/pipeline.py
    canonical_owner: src/bioetl/composition/runtime_builders/runner_builder_wiring.py
