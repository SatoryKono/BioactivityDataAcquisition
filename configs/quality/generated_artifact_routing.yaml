schema_version: 1
updated: "2026-05-20"
description: >
  Registry of maintained generators and their approved generated-artifact
  destinations. This is a governance surface for repository layout cleanup:
  generated working outputs route to reports/, curated generated docs route to
  docs/reports/, generated docs helper outputs stay under docs-local helper
  surfaces, and generated source stays in explicit generated packages.

allowed_output_roots:
  working_reports:
    - reports/
  curated_generated_docs:
    - docs/reports/generated/
    - docs/reports/dictionaries/
    - docs/02-architecture/generated/
  ignored_docs_exports:
    - docs/exports/
  local_generated_docs_helpers:
    - docs/site/
  generated_source:
    - src/bioetl/domain/schemas/generated/
    - src/bioetl/domain/mapping/generated/
  local_or_temp_memory:
    - src/memory/
    - /tmp/

forbidden_output_roots:
  - src/tools/reports/
  - output/
  - test-output/
  - logs/
  - node_modules/
  - MagicMock/
  - .python-user/
  - .coverage-sharded/
  - htmlcov/

routes:
  - id: file-merger-working-reports
    generator: src/tools/file_merger.py
    output_kind: working_report
    commit_policy: working_output
    outputs:
      - reports/merged_output.txt
      - reports/documentation_merged.md
      - reports/configs_merged.md
      - reports/project_structure.md
    notes: Generated merge snapshots belong in reports/, not src/tools/reports/.

  - id: docs-export-merged-markdown
    generator: src/tools/generate_docs_export.py
    output_kind: ignored_docs_export
    commit_policy: ignored_local_export
    outputs:
      - docs/exports/full-documentation-no-plans-reports-skills.merged.md
    notes: Generated export artifacts are non-normative and ignored by git.

  - id: chembl-field-matrix-generated-docs
    generator: scripts/docs/matrix/generate_field_matrix.py
    output_kind: curated_generated_docs
    commit_policy: tracked_curated_generated_doc
    outputs:
      - docs/reports/generated/chembl_activity_field_matrix/
    notes: Deterministic docs report generated from code and contract inputs.

  - id: pipeline-normalization-generated-docs
    generator: scripts/docs/matrix/generate_pipeline_normalization_matrix.py
    output_kind: curated_generated_docs
    commit_policy: tracked_curated_generated_doc
    outputs:
      - docs/reports/generated/pipeline_normalization_field_matrix/
    notes: Deterministic normalization matrix for pipeline governance.

  - id: matrix-dictionaries-curated-docs
    generator: scripts/docs/matrix/build_matrix_dicts.py
    output_kind: curated_generated_docs
    commit_policy: tracked_curated_generated_doc
    outputs:
      - docs/reports/dictionaries/
    notes: Generated dictionaries are curated docs report artifacts.

  - id: schema-generated-source
    generator: scripts/schema/generate_schema_artifacts.py
    output_kind: generated_source
    commit_policy: tracked_generated_source
    outputs:
      - src/bioetl/domain/schemas/generated/registry.py
    notes: Runtime generated source is restricted to explicit generated packages.

  - id: unified-schema-quality-report
    generator: scripts/schema/generate_unified_schema_map.py
    output_kind: working_report
    commit_policy: working_output
    outputs:
      - reports/quality/unified_schema_map.csv
    notes: Cross-layer schema inventory is a quality report artifact.

  - id: field-level-diagnostics-quality-report
    generator: scripts/schema/generate_field_level_diagnostics.py
    output_kind: working_report
    commit_policy: working_output
    outputs:
      - reports/quality/field_level_diagnostics.csv
    notes: Field diagnostics route to reports/quality rather than repository root.

  - id: vcr-metadata-quality-report
    generator: scripts/engineering/qa/report_vcr_metadata_catalog.py
    output_kind: working_report
    commit_policy: working_output
    outputs:
      - reports/quality/vcr-metadata-catalog.json
    notes: VCR metadata catalog is a quality report artifact.

  - id: dead-code-inventory-quality-baseline
    generator: scripts/engineering/qa/report_dead_code_inventory.py
    output_kind: working_report
    commit_policy: tracked_quality_baseline
    outputs:
      - reports/quality/dead-code-inventory.json
      - reports/quality/dead-code-inventory.md
    notes: Dead-code inventory is a tracked static-import governance baseline.

  - id: contract-registry-diagnostics-quality-report
    generator: scripts/engineering/ci/validate_contract_registry.py
    output_kind: working_report
    commit_policy: working_output
    outputs:
      - reports/quality/contract-registry-diagnostics.json
    notes: Contract registry diagnostics must not be emitted to repository root.

  - id: contract-identity-diagnostics-quality-report
    generator: scripts/engineering/ci/validate_contract_identity.py
    output_kind: working_report
    commit_policy: working_output
    outputs:
      - reports/quality/contract-identity-diagnostics.json
    notes: Contract identity diagnostics are uploaded from reports/quality in CI.

  - id: contract-schema-classifier-diagnostics-quality-report
    generator: scripts/engineering/ci/validate_schema_classifier_gate.py
    output_kind: working_report
    commit_policy: working_output
    outputs:
      - reports/quality/contract-schema-classifier-diagnostics.json
    notes: Schema classifier diagnostics are uploaded from reports/quality in CI.

  - id: contract-registry-dq-diagnostics-quality-report
    generator: scripts/engineering/ci/validate_registry_dq_refs.py
    output_kind: working_report
    commit_policy: working_output
    outputs:
      - reports/quality/contract-registry-dq-diagnostics.json
    notes: Registry-to-DQ diagnostics are uploaded from reports/quality in CI.

  - id: provider-contract-drift-quality-report
    generator: scripts/engineering/qa/report_provider_contract_drift.py
    output_kind: working_report
    commit_policy: working_output
    outputs:
      - reports/quality/provider-contract-drift-report.json
    notes: Provider contract drift replay diagnostics route to reports/quality.

  - id: hotspot-family-baseline-quality-report
    generator: scripts/engineering/qa/report_hotspot_family_baseline.py
    output_kind: working_report
    commit_policy: tracked_quality_baseline
    outputs:
      - reports/quality/hotspot-family-baseline.json
      - reports/quality/hotspot-family-baseline.md
    notes: Reviewed hotspot-family baseline artifacts stay under reports/quality.

  - id: duplication-baseline-quality-report
    generator: scripts/engineering/qa/report_duplication_baseline.py
    output_kind: working_report
    commit_policy: working_output
    outputs:
      - reports/quality/duplication-baseline.json
      - reports/quality/duplication-baseline.md
    notes: Duplicate-code baseline snapshots route to reports/quality.

  - id: weekly-quality-debt-report
    generator: scripts/engineering/ci/report_quality_debt_weekly.py
    output_kind: working_report
    commit_policy: working_output
    outputs:
      - reports/quality/debt-weekly.json
      - reports/quality/debt-weekly.md
    notes: Weekly debt snapshots are CI/report artifacts under reports/quality.

  - id: ci-quality-integral-gate-report
    generator: scripts/engineering/ci/quality_integral_gate.py
    output_kind: working_report
    commit_policy: working_output
    outputs:
      - reports/quality/ci-quality-metrics.json
    notes: Merge-gate quality metrics are emitted under reports/quality.

  - id: pretest-guardrails-quality-report
    generator: scripts/engineering/dev/pretest_guardrails.sh
    output_kind: working_report
    commit_policy: working_output
    outputs:
      - reports/quality/pretest_guardrails_*.json
    notes: Timestamped pretest guardrail snapshots are working diagnostics retained under TTL policy.

  - id: pytest-resilient-telemetry-report
    generator: scripts/engineering/ci/run_pytest_resilient.py
    output_kind: working_report
    commit_policy: working_output
    outputs:
      - reports/pytest/
      - reports/coverage/coverage.xml
    notes: Resilient pytest logs, JUnit XML, and summaries route to reports/pytest.

  - id: pytest-dev-html-coverage-report
    generator: scripts/engineering/dev/run_tests.py
    output_kind: working_report
    commit_policy: ignored_local_output
    outputs:
      - reports/coverage/htmlcov/
    notes: Developer HTML coverage reports route under reports/coverage, not root htmlcov/.

  - id: port-contracts-junit-report
    generator: .github/workflows/port-contracts.yml
    output_kind: test_report
    commit_policy: ignored_ci_output
    outputs:
      - reports/junit/port-contracts-results.xml
      - reports/junit/hypothesis-contracts-results.xml
    notes: Port contract JUnit XML artifacts are uploaded from reports/junit.

  - id: contract-tests-junit-report
    generator: .github/workflows/contract-tests.yml
    output_kind: test_report
    commit_policy: ignored_ci_output
    outputs:
      - reports/junit/contract-results.xml
    notes: Contract test JUnit XML artifacts are uploaded from reports/junit.

  - id: test-health-run-history
    generator: scripts/engineering/qa/test_health.py
    output_kind: test_report
    commit_policy: ignored_local_output
    outputs:
      - reports/quality/test-runs/
    notes: Test-health JUnit XML and JSON run summaries are runtime and CI artifacts.

  - id: architecture-debt-task-backlog-quality-report
    generator: scripts/engineering/qa/generate_architecture_debt_tasks.py
    output_kind: working_report
    commit_policy: ignored_local_output
    outputs:
      - reports/quality/tasks_architecture_metric_exemptions_YYYY-MM-DD-HH-MM.json
    notes: Architecture debt task backlog JSON is generated under reports/quality.

  - id: architecture-debt-execution-plan-quality-report
    generator: scripts/engineering/qa/reduce_architecture_debt.py
    output_kind: working_report
    commit_policy: ignored_local_output
    outputs:
      - reports/quality/architecture_debt_execution_plan_YYYY-MM-DD-HH-MM.json
    notes: Architecture debt execution plans route to reports/quality.

  - id: architecture-dependency-map-generated-docs
    generator: scripts/engineering/qa/generate_architecture_dependency_map.py
    output_kind: curated_generated_docs
    commit_policy: tracked_curated_generated_doc
    outputs:
      - docs/02-architecture/generated/module-dependency-map.md
      - docs/02-architecture/generated/module-dependency-map.json
    notes: Architecture dependency maps are deterministic generated docs.

  - id: grafana-dashboard-screenshot-report
    generator: scripts/ops/observability/grafana/rerender_grafana_screenshots.py
    output_kind: working_report
    commit_policy: working_output
    outputs:
      - reports/observability/grafana/screenshots/
    notes: Grafana render API screenshots are local working outputs under reports/.

  - id: observability-runtime-cardinality-evidence
    generator: scripts/engineering/qa/report_observability_metric_inventory.py
    output_kind: working_report
    commit_policy: tracked_quality_baseline
    outputs:
      - reports/observability/runtime_cardinality_inventory.json
    notes: Runtime cardinality inventory evidence is a tracked observability governance artifact under reports/observability.

  - id: runtime-structured-log-file
    generator: src/bioetl/infrastructure/observability/logging_config.py
    output_kind: runtime_log
    commit_policy: ignored_runtime_output
    outputs:
      - reports/logs/bioetl.log
    notes: Default local runtime log file avoids root logs/ and stays under reports/logs.

  - id: docker-trivy-sarif-security-report
    generator: .github/workflows/docker.yml
    output_kind: security_report
    commit_policy: ignored_ci_output
    outputs:
      - reports/security/trivy-results.sarif
    notes: Trivy SARIF is uploaded from reports/security rather than repository root.
