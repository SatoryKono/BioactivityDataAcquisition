schema_version: 1
updated: "2026-07-18"
description: >
  Registry of maintained generators and their approved generated-artifact
  destinations. This is a governance surface for repository layout cleanup:
  generated working outputs route to reports/, curated generated docs route to
  docs/reports/, generated docs helper outputs stay under docs-local helper
  surfaces, and generated source stays in explicit generated packages.

allowed_output_roots:
  working_reports:
    - reports/
  tracked_quality_baselines:
    - configs/quality/test_telemetry_baseline.yaml
    - docs/05-engineering/test-telemetry-baseline.md
  curated_generated_docs:
    - docs/reports/generated/
    - docs/reports/dictionaries/
    - docs/02-architecture/generated/
    - docs/02-architecture/diagrams/class-diagrams/90-pkg-
    - docs/02-architecture/diagrams/architecture/49-chembl-
    - docs/02-architecture/diagrams/architecture/50-chembl-
    - docs/02-architecture/diagrams/architecture/51a-chembl-
    - docs/02-architecture/diagrams/architecture/51b-chembl-
    - docs/02-architecture/diagrams/architecture/52a-chembl-
    - docs/02-architecture/diagrams/architecture/52b-chembl-
    - docs/02-architecture/diagrams/bundles/
    - docs/02-architecture/diagrams/descriptions/
    - docs/02-architecture/diagrams/architecture/png/
    - docs/02-architecture/diagrams/architecture/svg/
    - docs/02-architecture/diagrams/class-diagrams/png/
    - docs/02-architecture/diagrams/class-diagrams/svg/
    - docs/02-architecture/diagrams/foundation/png/
    - docs/02-architecture/diagrams/foundation/svg/
    - docs/02-architecture/diagrams/views/png/
    - docs/02-architecture/diagrams/views/svg/
    - docs/02-architecture/adr-registry.md
    - docs/02-architecture/adr-registry/
    - docs/02-architecture/07-compatibility-facade-snapshot.md
    - docs/02-architecture/policies/reproducibility-support-matrix.md
    - docs/03-guides/dashboards/panel-title-inventory.md
    - docs/03-guides/dashboards/navigation-contract.md
    - docs/03-guides/dashboards/archive/audit-protocols/dux7-live-residual-protocol.md
    - docs/03-guides/silver-schema-testing-guide.md
    - docs/04-reference/api/
    - docs/04-reference/config_comparison_matrix.csv
    - docs/04-reference/contracts/dq-contracts.md
    - docs/04-reference/passports/
    - docs/05-engineering/chembl_protein_classification_migration_closeout.md
    - docs/05-operations/runbooks/docker-compose-project-migration.md
    - docs/05-operations/runbooks/docker-stability.md
    - docs/filters/inventory-baseline.csv
    - docs/filters/inventory-baseline.json
    - docs/filters/inventory-baseline.md
    - docs/00-project/governance/root-local-clutter-cleanup.md
  generated_ai_mirrors:
    - docs/00-project/ai/agents/
    - docs/00-project/ai/skills/global/
  ignored_docs_exports:
    - docs/exports/
  local_generated_docs_helpers:
    - docs/site/
    - docs/00-project/ai/skills/_references/
    - docs/00-project/ai/memory/
    - docs/00-project/ai/prompts/
    - docs/00-project/ai/skills/local/
  generated_source:
    - src/bioetl/domain/schemas/generated/
    - src/bioetl/domain/mapping/generated/
  local_or_temp_memory:
    - src/memory/
    - /tmp/

forbidden_output_roots:
  - output/
  - test-output/
  - logs/
  - node_modules/
  - MagicMock/
  - .python-user/
  - .coverage-sharded/
  - htmlcov/
  - caddy/
  - silver/

routes:
  - id: file-merger-working-reports
    generator: scripts/engineering/common/file_merger.py
    output_kind: working_report
    commit_policy: working_output
    outputs:
      - reports/merged_output.txt
      - reports/documentation_merged.md
      - reports/configs_merged.md
      - reports/project_structure.md
    notes: Generated merge snapshots belong in reports/.

  - id: docs-export-merged-markdown
    generator: scripts/docs/build/generate_docs_export.py
    output_kind: ignored_docs_export
    commit_policy: ignored_local_export
    outputs:
      - docs/exports/full-documentation-no-plans-reports-skills.merged.md
    notes: Generated export artifacts are non-normative and ignored by git.

  - id: chembl-field-matrix-generated-docs
    generator: scripts/docs/matrix/generate_field_matrix.py
    output_kind: curated_generated_docs
    commit_policy: tracked_curated_generated_doc
    outputs:
      - docs/reports/generated/chembl_activity_field_matrix/
    notes: Deterministic docs report generated from code and contract inputs.

  - id: pipeline-normalization-generated-docs
    generator: scripts/docs/matrix/generate_pipeline_normalization_matrix.py
    output_kind: curated_generated_docs
    commit_policy: tracked_curated_generated_doc
    outputs:
      - docs/reports/generated/pipeline_normalization_field_matrix/
    notes: Deterministic normalization matrix for pipeline governance.

  - id: documentation-cleanup-inventory
    generator: scripts/docs/checks/documentation_cleanup_inventory.py
    output_kind: curated_generated_docs
    commit_policy: tracked_curated_generated_doc
    outputs:
      - docs/reports/generated/documentation-cleanup-inventory.json
      - docs/reports/generated/documentation-cleanup-inventory.md
    notes: Deterministic per-file documentation cleanup matrix for lifecycle,
      generated-artifact, duplicate, inbound-link, and recommended-action review.

  - id: docs-reports-generated-curated-misc
    generator: multiple governed docs and quality generators
    output_kind: curated_generated_docs
    commit_policy: tracked_or_local_curated_generated_doc
    outputs:
      - docs/reports/generated/
    notes:
      Fallback ownership route for generated documentation reports that live
      under the governed docs/reports generated namespace. More specific routes
      above this entry remain authoritative for known generators.

  - id: ai-runtime-governance-mirrors
    generator: scripts/ai/sync/governance.py and scripts/docs/checks/check_drift.py
    output_kind: curated_generated_docs
    commit_policy: tracked_mirror_surface
    outputs:
      - docs/00-project/ai/agents/orchestration/
      - docs/00-project/ai/agents/agents/
      - docs/00-project/ai/agents/policy/
      - docs/00-project/ai/agents/policy/AI_RUNTIME_MIRROR_OWNERSHIP.md
      - docs/00-project/ai/agents/policy/MCP_LOCAL_RUNTIME_CONFIG.md
      - docs/00-project/ai/agents/policy/SPECIALIST_PROFILE_TEMPLATE.md
    notes:
      AI runtime governance mirrors and deprecated alias pages are generated
      or drift-checked against runtime source surfaces; docs mirrors do not own
      runtime behavior.

  - id: ai-skill-reference-mirror
    generator: scripts/ai/codex/check_skills_mirror.sh
    output_kind: curated_generated_docs
    commit_policy: tracked_mirror_surface
    outputs:
      - docs/00-project/ai/skills/_references/
    notes: Skill reference bundle copies are intentional mirrors used by
      skills-consistency checks; exact duplicates with local skill references
      are expected and must be refreshed from runtime skill sources.

  - id: ai-skill-license-mirrors
    generator: scripts/ai/codex/check_skills_mirror.sh
    output_kind: curated_generated_docs
    commit_policy: tracked_mirror_surface
    outputs:
      - docs/00-project/ai/skills/global/.system/
      - docs/00-project/ai/skills/global/*/LICENSE
    notes: Third-party skill license mirrors are retained for attribution and
      should be refreshed through the skill mirror workflow, not edited as
      canonical BioETL docs.

  - id: matrix-dictionaries-curated-docs
    generator: scripts/docs/matrix/build_matrix_dicts.py
    output_kind: curated_generated_docs
    commit_policy: tracked_curated_generated_doc
    outputs:
      - docs/reports/dictionaries/
    notes: Generated dictionaries are curated docs report artifacts.

  - id: schema-generated-source
    generator: scripts/schema/generation/generate_schema_artifacts.py
    output_kind: generated_source
    commit_policy: tracked_generated_source
    outputs:
      - src/bioetl/domain/schemas/generated/registry.py
    notes: Runtime generated source is restricted to explicit generated packages.

  - id: compatibility-facade-snapshot-generated-doc
    generator: scripts/engineering/qa/generate_compatibility_facade_snapshot.py
