schema_version: 1
policy_scope: public_lazy_facades
linked_issue: '#6624'
reviewed_on: '2026-07-27'
review_by: '2026-10-27'
owner: '@bioetl-architecture'
new_surface_policy: fail_fast_unclassified_lazy_public_facade
row_count: 51
rationale: Lazy public facades are intentional only when the owning package declares
  the owner, allowed importer class, classification, and exit criteria. New __getattr__,
  _PUBLIC_EXPORTS, or _PUBLIC_SYMBOL_TARGETS surfaces under src/bioetl must be added
  here before merge.
allowed_classifications:
- external_public_api
- owner_package_root
- compatibility_debt
- internal_lazy_import_optimization
