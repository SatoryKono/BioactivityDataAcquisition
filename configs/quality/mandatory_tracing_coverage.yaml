version: 1
status: active
owner: observability
surfaces:
  adapter_request:
    description: HTTP adapter request lifecycle span.
    files:
      - path: src/bioetl/infrastructure/adapters/http/client_retry_observability.py
        required_terms:
          - start_request_span
          - tracer.get_tracer("bioetl.http")
          - start_as_current_span
          - http.{method.lower()}
          - http.method
          - http.url
          - bioetl.provider
          - bioetl.run_id
      - path: src/bioetl/infrastructure/adapters/http/client_retry_mixin.py
        required_terms:
          - start_request_span
          - finalize_request_observability
          - _request_with_retry
  retry:
    description: Retry decisions are recorded on the request span.
    files:
      - path: src/bioetl/infrastructure/adapters/http/_client_retry_flow.py
        required_terms:
          - handle_response_attempt
          - handle_request_exception
          - mark_span_error
          - log_retry
      - path: src/bioetl/infrastructure/adapters/http/client_retry_observability.py
        required_terms:
          - http.retries
          - error.type
          - retry_exhausted
          - circuit_breaker_open
  checkpoint:
    description: Runtime checkpoint saves and admin checkpoint workflows are traced.
    files:
      - path: src/bioetl/application/core/batch_checkpoint_recovery_service.py
        required_terms:
          - _CHECKPOINT_TRACER_NAME = "bioetl.checkpoint"
          - checkpoint_save
          - bioetl.checkpoint.operation
          - bioetl.checkpoint.scope
          - bioetl.checkpoint.records_processed
          - bioetl.checkpoint.status
      - path: src/bioetl/application/services/checkpoint/checkpoint_service.py
        required_terms:
          - TRACER_NAME = "bioetl.checkpoint_admin"
          - checkpoint.list
          - checkpoint.get
          - checkpoint.delete
          - bioetl.checkpoint_count
          - bioetl.checkpoint_found
          - bioetl.checkpoint_deleted
  quarantine:
    description: Quarantine admin workflows are traced; record explorers remain excluded.
    files:
      - path: src/bioetl/application/services/quality/_quarantine_service_async_mixin.py
        required_terms:
          - traced_async_operation
          - quarantine.inspect
          - quarantine.stats
          - bioetl.has_error_code_filter
          - bioetl.record_count
      - path: src/bioetl/application/services/quality/_quarantine_service_sync_support.py
        required_terms:
          - _run_traced_sync_operation
          - traced_operation
          - tracer_name=host.TRACER_NAME
      - path: src/bioetl/application/services/quality/_quarantine_service_replay_purge_sync.py
        required_terms:
          - quarantine.replay
          - quarantine.purge
      - path: src/bioetl/application/services/quality/_quarantine_service_status_sync.py
        required_terms:
          - quarantine.mark_reprocessed
          - quarantine.update_status
      - path: src/bioetl/application/services/quality/_quarantine_service_filtered_mixin.py
        forbidden_terms:
          - traced_async_operation
          - traced_operation
