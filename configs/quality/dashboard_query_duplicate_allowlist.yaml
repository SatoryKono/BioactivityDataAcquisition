version: 1
owner: "@bioetl-observability"
rationale: >
  Dashboard query reuse is allowed only when the repeated expression is an
  intentional shared operator view, not accidental copy/paste drift.
exact_duplicates:
  resolved_groups:
    - id: dq-volume-weighted-score-shared-card
      owner: "@bioetl-observability"
      linked_issue: "#6360"
      resolution: queries_now_have_distinct_time_semantics
      rationale: The current stat uses a fixed latest-sample lookback while the trend remains selected-range evidence, so the former exact duplicate no longer exists.
    - id: l0-status-shared-status-card
      owner: "@bioetl-observability"
      linked_issue: "#11269"
      resolution: overview_selected_run_removed_shared_copy
      rationale: Overview no longer ships Monitor Scope Health, so the shared priority expression is not an exact duplicate.
    - id: workflow-evidence-status-shared
      owner: "@bioetl-observability"
      linked_issue: "#11269"
      resolution: overview_selected_run_removed_shared_copy
      rationale: Overview no longer ships Review Current Workflow Evidence.
    - id: workflow-evidence-published-shared
      owner: "@bioetl-observability"
      linked_issue: "#11269"
      resolution: overview_selected_run_removed_shared_copy
      rationale: Overview no longer ships the shared publication clock.
  allowed_groups:
    - id: incident-scope-status-shared-priority
      owner: "@bioetl-observability"
      linked_issue: "#11269"
      normalized_expression: topk(1, bioetl_workflow_scope_priority_by_input{workflow=~"$workflow",pipeline=~"$pipeline",run_type=~"$run_type"})
      panel_refs:
        - "bioetl-incident-v1.json :: Monitor Pipeline Status"
        - "bioetl-incident-v1.json :: Monitor Scope Status"
      disposition: retain_shared_priority_signal
      rationale: >
        The first-window scope card and the collapsed fleet row card
        intentionally mirror the same workflow-scope priority signal in two
        operator contexts after the runtime fleet evidence moved to Incident.
    - id: incident-current-suspect-diagnostic-view
      owner: '@bioetl-observability'
      linked_issue: '#13168'
      normalized_expression: 'label_replace(label_replace(label_replace(label_replace(label_replace(label_replace(label_replace(bioetl_incident_ranked_evidence,"object","$1","object","(.*) / $"),"route_pipeline",".*","pipeline","unknown"),"owner","BioETL Team","reason","infrastructure_failed"),"next_step","Open pipeline-failure-critical.md","reason","infrastructure_failed"),"owner","See runbook","owner","^$"),"next_step","See runbook","next_step","^$"),"freshness","Not verified: no event timestamp","","")'
      panel_refs:
      - 'bioetl-incident-v1.json :: Inspect Ranked Suspects'
      - 'bioetl-incident-v1.json :: Inspect Global Suspects (Full)'
      disposition: retain_independent_current_clock_diagnostics
      rationale: The current summary and expanded diagnostic table retain the same complete suspect evidence and event-time uncertainty. Each CURRENT renderer owns its query clock; a Dashboard-datasource consumer in a collapsed Scenes row can suppress the donor or inherit a historical clock. The full view exposes diagnostic columns, while the summary remains visible. This exact expression and panel pair are bounded; no near-duplicate limit or other exemption changes.
near_duplicates:
  max_count: 5
  owner: "@bioetl-observability"
  linked_issue: "#6360"
  rationale: >
    Current cross-panel audited baseline is five reviewed near-duplicate
    families. Growth beyond five or a panel-set change requires review.
  reviewed_groups:
    - id: overview-l0-domain-status-input-variants
      disposition: retain_semantic_variants
      recording_rule_decision: rejected_distinct_input_selectors
      rationale: >
        Overview domain-status tables share the same L0 fail-closed shape after
        selector stripping, but each panel binds a different input domain.
      panel_refs:
        - "bioetl-overview-v2.json :: Review Control Plane Status"
        - "bioetl-overview-v2.json :: Review Data Quality Status"
        - "bioetl-overview-v2.json :: Review Data Validation Status"
        - "bioetl-overview-v2.json :: Review Runtime Status"
        - "bioetl-overview-v2.json :: Review Workflow Status"
    - id: processed-record-stage-range-variants
      disposition: retain_semantic_variants
      recording_rule_decision: rejected_distinct_stage_and_range_binding
      rationale: >
        Bronze, Gold, and Overview filtered-out selected-range counts share the
        same shaped range aggregation after label stripping, but intentionally
        keep distinct stage selectors and preserve missing telemetry as No data
        instead of synthesizing a healthy zero.
      panel_refs:
        - "bioetl-dq-v2.json :: Monitor Bronze Records"
        - "bioetl-dq-v2.json :: Monitor Gold Records"
        - "bioetl-overview-v2.json :: Track Silver Rejects"
    - id: silver-filter-reject-no-data-range-variants
      disposition: retain_shared_diagnostic_absence
      recording_rule_decision: rejected_cross_dashboard_range_binding
      rationale: DQ and Overview show the same selected-range filtered-out evidence and intentionally preserve missing telemetry as No data instead of synthesizing a healthy zero.
      panel_refs:
        - "bioetl-dq-v2.json :: Monitor Silver Filter Rejects"
        - "bioetl-overview-v2.json :: Track Silver Rejects"
    - id: provider-http-error-class-variants
      disposition: retain_semantic_variants
      recording_rule_decision: rejected_distinct_error_taxonomy
      rationale: Timeout/network and rate-limit regex classes are intentionally distinct operator diagnoses; merging them would erase cause semantics.
      panel_refs:
        - "bioetl-provider-health-v2.json :: Track Network & Timeout Errors"
        - "bioetl-provider-health-v2.json :: Track Rate-Limit Errors"
    - id: runtime-blocker-topk-depth-variants
      disposition: retain_presentation_variants
      recording_rule_decision: rejected_topk_is_consumer_specific
      rationale: Top-3 is the first-screen summary and top-20 is the explicit drilldown; recording either topk would make the other consumer semantically wrong. Both panels moved from bioetl-runtime to the incident workspace with the fleet evidence.
      panel_refs:
        - "bioetl-incident-v1.json :: Inspect Active Runtime Blocker Detail"
        - "bioetl-incident-v1.json :: Review Runtime Blockers"
