        canonical_path: null
        action_if_reintroduced: keep_untracked_as_local_property_test_cache_or_scope_to_a_documented_cache_surface
      - path: .import_linter_cache
        current_live_state: present_local_only_root_surface
        canonical_path: null
        action_if_reintroduced: keep_untracked_as_local_import_linter_cache_or_scope_to_a_documented_cache_surface
      - path: node_modules
        current_live_state: present_local_only_root_surface
        canonical_path: package-lock.json
        action_if_reintroduced: keep_untracked_as_local_dependency_tree_and rebuild from package manifests
      - path: .npm-cache
        current_live_state: present_local_only_root_surface
