      - git check-ignore -v .agent-work .agentbridge .agents .benchmarks .cache .codex_tmp .coverage-sharded-current-main .hypothesis .import_linter_cache node_modules .npm-cache .pytest_cache .ruff_cache test-output tmp .venv caddy '~'
      - rg -n "\\.agent-work/|\\.agentbridge/|\\.agents/|\\.benchmarks/|\\.cache/|\\.codex_tmp/|\\.coverage-sharded-current-main/|\\.hypothesis/|\\.import_linter_cache/|node_modules/|\\.npm-cache/|\\.pytest_cache/|\\.ruff_cache/|test-output/|tmp/|\\.venv/|caddy/|~/" .gitignore docs scripts .github tests configs README.md
    candidates:
      - path: .agent-work
        current_live_state: present_local_only_root_surface
        canonical_path: null
        action_if_reintroduced: keep_untracked_or_reclassify_through_explicit_structure_governance
      - path: .agentbridge
        current_live_state: absent_from_root_baseline
        canonical_path: null
        action_if_reintroduced: keep_untracked_or_reclassify_through_explicit_structure_governance
      - path: .agents
        current_live_state: present_local_only_root_surface
        canonical_path: null
        action_if_reintroduced: keep_untracked_or_reclassify_through_explicit_structure_governance
      - path: .benchmarks
        current_live_state: present_local_only_root_surface
        canonical_path: null
        action_if_reintroduced: keep_untracked_as_local_benchmark_workspace_or_reclassify_through_explicit_structure_governance
      - path: .cache
        current_live_state: present_local_only_root_surface
        canonical_path: null
        action_if_reintroduced: keep_untracked_or_scope_to_a_documented_cache_surface
      - path: .codex_tmp
        current_live_state: present_local_only_root_surface
        canonical_path: null
        action_if_reintroduced: keep_untracked_as_local_codex_scratch_or_reclassify_through_explicit_structure_governance
      - path: .coverage-sharded-current-main
