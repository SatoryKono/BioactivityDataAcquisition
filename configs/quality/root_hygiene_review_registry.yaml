      - rg -n "\\.mcp\\.json|scripts/ai/\\.mcp\\.json|MCP_LOCAL_RUNTIME_CONFIG|MEMORY_FILE_PATH" .github docs scripts tests configs README.md AGENTS.md
      - rg -n "/mnt/|[A-Za-z]:[\\\\/]" .mcp.json scripts/ai/.mcp.json
      - .venv/bin/python scripts/ai/codex/setup_mcp.py --root . --workspace-root . --skip-codex --skip-codex-config --skip-gemini-settings
