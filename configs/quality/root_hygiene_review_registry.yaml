        action_if_reintroduced: keep_untracked_or_scope_to_a_documented_cache_surface
      - path: .pytest_cache
        current_live_state: present_local_only_root_surface
        canonical_path: null
        action_if_reintroduced: keep_untracked_as_local_pytest_cache_or_scope_to_a_documented_cache_surface
      - path: .ruff_cache
        current_live_state: present_local_only_root_surface
        canonical_path: null
        action_if_reintroduced: keep_untracked_as_local_lint_cache_or_scope_to_a_documented_cache_surface
      - path: test-output
        current_live_state: present_local_only_root_surface
        canonical_path: reports
        action_if_reintroduced: keep_untracked_as_local_test_output_or route retained diagnostics into approved reports surfaces
      - path: tmp
        current_live_state: present_local_only_root_surface
        canonical_path: null
        action_if_reintroduced: keep_untracked_as_local_temp_workspace_or_rehome_retained_outputs_under_data_local_or_reports
      - path: "~"
        current_live_state: present_local_only_root_surface
        canonical_path: null
        action_if_reintroduced: keep_untracked_as_external_tool_mirror_or_remove_local_clutter
      - path: .venv
        current_live_state: present_local_only_root_surface
        canonical_path: pyproject.toml
        action_if_reintroduced: keep_untracked_as_primary_local_virtualenv_or rebuild from project metadata
      - path: caddy
        current_live_state: present_local_only_root_surface
        canonical_path: docker-compose.codex.yml
        action_if_reintroduced: keep_runtime_state_untracked_and_rebuild_from_the_documented_compose_stack

  - lane_id: local_vendor_tooling_roots
    classification: review_required
    scope: local vendor/editor tooling roots that must remain untracked unless explicitly promoted
    verification:
      - git ls-files .junie .qodo .sonarlint .windsurf
      - git check-ignore -v .junie .qodo .sonarlint .windsurf
      - rg -n "\\.junie/|\\.qodo/|\\.sonarlint/|\\.windsurf/" .gitignore docs scripts .github tests configs
    candidates:
      - path: .junie
        current_live_state: present_local_only_root_surface
        canonical_path: null
        action_if_reintroduced: keep_untracked_or_move_curated_shared_content_to_an_approved_root_surface
      - path: .qodo
        current_live_state: present_local_only_root_surface
        canonical_path: null
        action_if_reintroduced: keep_untracked_as_local_vendor_tooling_workspace_or reclassify_through_explicit_owner_review
      - path: .sonarlint
        current_live_state: present_local_only_root_surface
        canonical_path: null
        action_if_reintroduced: keep_untracked_or_reclassify_through_explicit_owner_review
      - path: .windsurf
