version: 1.0.0
status: active
owner: Engineering / Architecture
last_verified: "2026-07-02"

current_live_root_baseline:
  tracked_root_audit_status: pass
  strict_untracked_root_audit_status: pass
  verification_command: >-
    .venv/bin/python scripts/engineering/repo/audit_root_cleanliness.py
    --strict-untracked
  note: >-
    The current local repository root satisfies the published allowlist and
    approved-root policy. Local AI/editor/cache root directories may exist as
    untracked local-only surfaces; this registry tracks their live state so the
    review gate does not drift from the current workspace. Tracked root
    dispositions are reconciled by family in `.github/root-allowlist.txt`, and
    follow-up reduction work executes through RH-018/RH-019/RH-020/RH-021 plus
    the adjacent Codex/Docker owner issues.

review_lanes:
  - lane_id: root_env_security
    classification: security_review_required
    scope: tracked root env-like files
    owner: Engineering / Security
    retention_class: secret_bearing_local_env_surface
    retention_action: block_automated_delete_move_rename_overwrite_and_content_scan
    cleanup_policy: explicit_per_task_user_approval_required
    verification:
      - git ls-files .env .env.local new.env
      - git log -- .env .env.local new.env
      - git check-ignore -v .env .env.local new.env
      - rg -n "^\\.env$|^\\.env\\.local$|^new\\.env$|\\.env\\.local|new\\.env" .gitignore .dockerignore docs scripts .github
    candidates:
      - path: .env
        current_live_state: present_local_only_root_surface
        canonical_path: .env.example
        action_if_reintroduced: security_review_then_untrack_or_replace_with_example
      - path: .env.local
        current_live_state: absent_from_root_baseline
        canonical_path: .env.example
        action_if_reintroduced: security_review_then_untrack_or_replace_with_example
      - path: new.env
        current_live_state: present_local_only_root_surface
        canonical_path: .env.example
        action_if_reintroduced: security_review_then_untrack_or_replace_with_example

  - lane_id: root_helper_duplicates
    classification: review_required
    scope: duplicate root helpers with canonical owners under scripts/engineering/dev
    verification:
      - git ls-files
      - cmp -s <root-copy> <canonical-path>
      - rg -n "<root-helper-name>" .github docs scripts tests configs README.md Makefile pyproject.toml
    candidates:
      - path: legacy-root-helper-placeholder
        current_live_state: absent_from_root_baseline
        canonical_path: null
        action_if_reintroduced: require fresh canonical owner decision before any reintroduced root helper duplicate is retained

  - lane_id: root_transient_helpers_and_outputs
    classification: review_required
    scope: observed transient root helpers, raw test dumps, and reviewed root artifact routing
    verification:
      - git ls-files temp_analyze_conflicting.py temp_get_hash.py test_output.txt tests.txt logs artifacts
      - rg -n "temp_analyze_conflicting\\.py|temp_get_hash\\.py|test_output\\.txt|tests\\.txt|logs/|reports/logs/|artifacts/debug_exports/" .github docs scripts tests configs README.md Makefile pyproject.toml
      - .venv/bin/python scripts/engineering/repo/audit_root_cleanliness.py --strict-untracked
    candidates:
      - path: artifacts
        current_live_state: present_approved_root_surface
        canonical_path: artifacts/debug_exports
        action_if_reintroduced: keep_tracked_only_for_governed_debug_export_evidence_and_route_other_diagnostics_into_approved_reports_or_data_surfaces
      - path: temp_analyze_conflicting.py
        current_live_state: absent_from_root_baseline
        canonical_path: null
        action_if_reintroduced: delete transient root analysis helper or move it under scripts/ with an explicit maintained owner
      - path: temp_get_hash.py
        current_live_state: absent_from_root_baseline
        canonical_path: null
        action_if_reintroduced: delete transient root hash helper or move it under scripts/ with an explicit maintained owner
      - path: test_output.txt
        current_live_state: absent_from_root_baseline
        canonical_path: null
        action_if_reintroduced: remove raw root test output or route retained diagnostics into reports/pytest or another approved reports surface
      - path: tests.txt
        current_live_state: absent_from_root_baseline
        canonical_path: null
        action_if_reintroduced: remove raw root test inventory dump or move curated evidence into approved reports or archive surfaces instead of reintroducing a tracked root txt file
      - path: logs
        current_live_state: present_local_only_root_surface
        canonical_path: reports/logs
        action_if_reintroduced: remove root runtime log tree or route retained local logs into reports/logs instead of reintroducing a root logs/ surface

