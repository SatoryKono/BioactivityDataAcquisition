  required_bundles:
    - chembl_activity_dq_bundle
    - chembl_assay_dq_bundle
    - composite_molecule_dq_bundle
    - composite_publication_dq_bundle
    - pubchem_compound_dq_bundle
    - pubmed_publication_dq_bundle
tracing:
  runtime_emission_test: tests/integration/test_observability_emission_integration.py
  required_test_names:
    - test_pipeline_observer_emits_tracing_spans_through_recording_port
assertless_triage:
  categories:
    architecture_helper_guard:
      count: 30
      decision: retained
      rationale: "Architecture policy tests delegate assertions to shared guard helpers or pytest.fail paths."
      next_review: "2026-09-30"
    benchmark_or_performance:
      count: 5
      decision: retained
      rationale: "Performance/benchmark tests use measurement infrastructure as the assertion surface."
      next_review: "2026-09-30"
    helper_asserted:
      count: 6
      decision: retained
      rationale: "Verification is delegated to explicit check/validate/verify helper calls."
      next_review: "2026-09-30"
    intentional_no_exception_contract:
      count: 61
      decision: retained-with-rationale
      rationale: "No-op, close/aclose, smoke, or does-not-raise behavior is the contract under test."
      next_review: "2026-09-30"
    weak_no_value:
      count: 498
      decision: burn-down
      rationale: "Candidates require assertion strengthening, merge, or removal when the owning module is edited."
      next_review: "2026-09-30"
  policy:
    new_no_effect_tests: "must reduce refined_assertless_max or document an intentional contract category"
    highest_priority_paths:
      - tests/integration/
      - tests/e2e/
      - tests/unit/application/core/
      - tests/unit/infrastructure/control_plane/
duplicate_name_triage:
  total_duplicate_names: 891
  duplicate_occurrences: 2775
  top_generic_names:
    - name: test_default_values
      count: 45
      decision: rename-on-touch
      preferred_pattern: "test_<subject>_default_values"
    - name: test_immutability
      count: 43
      decision: rename-on-touch
      preferred_pattern: "test_<value_object>_is_immutable"
    - name: test_custom_values
      count: 23
      decision: rename-on-touch
      preferred_pattern: "test_<subject>_accepts_custom_values"
    - name: test_hash_consistency
      count: 22
      decision: rename-on-touch
      preferred_pattern: "test_<value_object>_hash_matches_equality_contract"
    - name: test_strips_whitespace
      count: 22
      decision: rename-on-touch
      preferred_pattern: "test_<parser>_strips_surrounding_whitespace"
  fixture_builder_policy:
    consolidate_when: "RunID, BatchID, PipelineRunContext, Bronze/Silver/Gold metadata, or checkpoint setup repeats across three or more tests in one module family."
    do_not_consolidate_when: "Inline setup is shorter and clearer than an indirection."
