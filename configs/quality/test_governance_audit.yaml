assertless_triage:
  categories:
    architecture_helper_guard:
      count: 14
      decision: retained
      rationale: Architecture policy tests delegate assertions to shared guard helpers
        or pytest.fail paths.
      next_review: '2026-09-30'
    benchmark_or_performance:
      count: 0
      decision: retained
      rationale: Performance/benchmark tests use measurement infrastructure as the
        assertion surface.
      next_review: '2026-09-30'
    helper_asserted:
      count: 0
      decision: retained
      rationale: Verification is delegated to explicit check/validate/verify helper
        calls.
      next_review: '2026-09-30'
    intentional_no_exception_contract:
      count: 479
      decision: retained-with-rationale
      rationale: No-op, close/aclose, smoke, or does-not-raise behavior is the contract
        under test.
      next_review: '2026-09-30'
    weak_no_value:
      count: 0
      decision: zero-actionable-debt
      rationale: Weak no-value candidates are not allowed as residual test debt; new
        candidates must be strengthened, removed, or explicitly reclassified as
        intentional no-exception contracts.
      next_review: '2026-09-30'
  policy:
    new_no_effect_tests: must reduce refined_assertless_max or document an intentional
      contract category
    highest_priority_paths:
    - tests/integration/
    - tests/e2e/
    - tests/unit/application/core/
    - tests/unit/infrastructure/control_plane/
