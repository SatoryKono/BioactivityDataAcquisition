mixed_scope_unit_path_policy:
  issue_ref: '#4665'
  decision: retained_logical_unit_ownership_with_curated_repo_backed_exceptions
  rationale: tests/unit path communicates layer ownership, not a universal ban on
    checked-in repo reads; retained repo-backed tests stay under tests/unit only when
    they validate one module family's deterministic local contract and are isolated
    to repo-backed-unit or contracts.
  docs_ref: docs/03-guides/testing.md#211-repo-backed-path-naming-and-reclassification
  review_date: '2026-09-30'
  retained_policy_refs:
  - repo_backed_unit_test_exceptions
  - file_backed_domain_contract_tests
  keep_under_tests_unit_when:
  - checked-in repository artifact itself is the contract under test
  - execution stays local-only and deterministic without network/VCR/service startup
  - file is explicitly listed in governance inventory and marked pytest.mark.repo_backed
    when routed to repo-backed-unit
  move_out_of_tests_unit_when:
  - test primarily exercises subprocess or CLI process orchestration rather than one
    module contract
  - test validates dashboard, workflow-tree, repo-layout, memory-backend, or broader
    integration behavior
  - test needs network, VCR, detached backend, or multi-component runtime semantics
  moved_examples:
  - old_path: tests/unit/memory/test_workflow_tooling.py
    new_path: tests/integration/memory/test_workflow_tooling.py
  - old_path: tests/unit/memory/test_timeline_ingest.py
    new_path: tests/integration/memory/test_timeline_ingest.py
  - old_path: tests/unit/scripts/test_validate_pipeline_configs.py
    new_path: tests/integration/config/test_validate_pipeline_configs.py
  - old_path: tests/unit/grafana/test_workflow_dashboard_json_valid.py
    new_path: tests/integration/grafana/test_workflow_dashboard_json_valid.py
  - old_path: tests/unit/grafana/test_silver_reject_explorer_copy.py
    new_path: tests/integration/grafana/test_silver_reject_explorer_copy.py
