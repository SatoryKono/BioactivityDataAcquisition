allowed:
  registered_without_runtime: []
  runtime_without_registry: []
  dead_metrics: []
  documented_without_registry: []
  runtime_label_contract_unresolved: []
  rules_without_registry: []
  runtime_cardinality_threshold_violations: []
  runtime_cardinality_review_required:
    - metric: bioetl_checkpoint_load_events_total
      owner: "@bioetl-observability"
      reason: "Checkpoint load outcomes are emitted by ordinary and composite checkpoint runtime paths."
      review_date: "2026-09-30"
      approved_max_series: 500
    - metric: bioetl_health_check_latency_seconds
      owner: "@bioetl-observability"
      reason: "Health-check latency has provider, observer, and HTTP monitor emitters by design."
      review_date: "2026-09-30"
      approved_max_series: 500
    - metric: bioetl_pipeline_runs_total
      owner: "@bioetl-observability"
      reason: "Pipeline run terminal events are emitted by execution, observer, and composite lifecycle paths."
      review_date: "2026-09-30"
      approved_max_series: 500
  declared_risky_label_review_required:
    - metric: bioetl_adapter_batch_size
      owner: "@bioetl-observability"
      reason: "Adapter endpoint metrics are explicitly reviewed because endpoint labels are allowed only on bounded adapter surfaces."
      review_date: "2026-09-30"
    - metric: bioetl_adapter_request_duration_seconds
      owner: "@bioetl-observability"
      reason: "Adapter endpoint latency metrics are explicitly reviewed because endpoint labels are allowed only on bounded adapter surfaces."
      review_date: "2026-09-30"
    - metric: bioetl_adapter_requests_total
      owner: "@bioetl-observability"
      reason: "Adapter endpoint request metrics are explicitly reviewed because endpoint labels are allowed only on bounded adapter surfaces."
      review_date: "2026-09-30"
    - metric: bioetl_gold_lifecycle_state_total
      owner: "@bioetl-observability"
      reason: "Gold table-scoped lifecycle metrics are retained only after explicit review of bounded table cardinality."
      review_date: "2026-09-30"
    - metric: bioetl_gold_validation_failures_total
      owner: "@bioetl-observability"
