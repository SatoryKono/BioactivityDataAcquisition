schema_version: "1.0"
policy:
  scope: "composite_gold_contracts"
  rationale: >
    Composite contract strict_dq_validation waivers are allowed only for
    time-bound exceptions. The active composite contracts now use strict
    DQ validation defaults, so no waiver is required.
  required_fields:
    - contract_ref
    - owner
    - rationale
    - approved_on
    - expires_on
    - linked_issue
    - enforcement_context
waivers: []
