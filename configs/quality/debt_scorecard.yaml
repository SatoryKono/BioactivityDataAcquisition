schema_version: 1
baseline:
  total_exemptions: 0
  by_registry:
    file_size_limits: 0
    function_complexity: 0
    function_length: 0
    class_size: 0
    class_method_count: 0
    god_object: 0
    domain_complexity: 0
historical_baseline:
  total_exemptions: 48
  by_registry:
    file_size_limits: 10
    function_complexity: 6
    function_length: 10
    class_size: 13
    class_method_count: 0
    god_object: 3
    domain_complexity: 6
  snapshot_date: '2025-12-31'
  source_report: reports/architecture/2025-Q4-final.json
governance:
  baseline_policy:
    enforceable_section: baseline
    historical_section: historical_baseline
    registry_sync_source: baseline
    rationale: Stabilizing architecture metrics through baseline ratcheting.
  coarse_budgets:
    ruff_error_count:
      max_count: 0
      owner: '@bioetl-architecture'
      linked_rf: RF-ARCH-009
      rationale: Ruff backlog for src/bioetl has been retired; CI now enforces zero
        source-level lint debt.
      ratchet_policy: ratchet only downward from zero
    mypy_error_count:
      max_count: 0
      owner: '@bioetl-architecture'
      linked_rf: RF-ARCH-015
      rationale: Strict typing is already stabilized repo-wide and stays zero-budget.
      ratchet_policy: ratchet only downward from zero
    architecture_skip_count:
      max_count: 0
      owner: '@bioetl-architecture'
      linked_rf: RF-ARCH-015
      rationale: Decorator-based architecture skip debt is retired; the suite must
        stay free of explicit skip/skipif markers.
      ratchet_policy: ratchet only downward from zero
  review_policy:
    new_exemption_requires:
    - value
    - owner
    - reason
    - classification
    - linked_rf
    - expires_on
    - removal_step
    reviewer_checks:
    - classification is technical_debt or intentional_exception
    - linked_rf points to active
    - placeholder exemptions require concrete technical follow-up
    - '2026-06-30'
  owner_diversification:
    starts_quarter: 2026-Q2
    min_distinct_owners: 2
  owner_registry_q2_subsystems:
    architecture:
      owner: '@bioetl-architecture'
    platform:
      owner: '@bioetl-platform'
    data_model:
      owner: '@bioetl-data-model'
  temporary_exemptions:
    window_policy: budget-only
    max_window_days: 30
  growth_section_gate_rollout:
    default_mode: block
    warn_until_by_section:
      registry:file_size_limits: '2026-06-30'
  burn_down_priorities:
    registries:
    - file_size_limits
    - class_size
    - god_object
  allow_grace_windows_only_for_rf: true
  review_cycle: 90
  quarterly_burndown_target: 2
  allowed_classifications:
  - technical_debt
  - intentional_exception
compatibility_debt_metrics:
  inventory_source: configs/quality/compatibility_facade_inventory.yaml
  sunset_source: configs/quality/compatibility_facade_inventory.yaml#transition_debt
  owner: '@bioetl-architecture'
  review_cadence: quarterly
  review_policy: Review transition and sunset compatibility debt whenever the facade
    inventory changes; permanent public entrypoints stay governed separately from
    transition-only compatibility residue.
  metrics:
    transition_compat_count:
      current_count: 0
      max_count: 0
      target_count: 0
      owner: '@bioetl-architecture'
      linked_issue: '4700'
      rationale: Stream C post-sunset shim removal cleared all control-plane manifest
        diagnostics transition_debt entries; callers use manifest.diagnostics.* owners.
        Sanctioned public entrypoints are tracked separately as stable public API.
      ratchet_policy: Fail on growth; ratchet current/max_count toward target_count
        zero as transition-only compatibility shims are removed.
    retained_public_entrypoint_burden:
      current_count: 13
      max_count: 13
      owner: '@bioetl-architecture'
      linked_issue: '4575'
      rationale: Retained public entrypoints are stable external API, but their size
        and first-party dependency burden are blocking governance debt when they grow
        without review.
      ratchet_policy: Fail on growth; ratchet max_count downward only after retained
        public entrypoints are removed or first-party callers are narrowed.
    sunset_compat_count:
      current_count: 0
      max_count: 0
      target_count: 0
      owner: '@bioetl-architecture'
      linked_issue: '4700'
      sunset_date: '2026-09-30'
      rationale: Control-plane run_manifest_diagnostics_* compatibility shims were
        removed in Stream C; transition_debt inventory is empty.
      ratchet_policy: May only decrease before the sunset; must reach zero after 2026-09-30.
    expired_compat_count:
      current_count: 0
      max_count: 0
      owner: '@bioetl-architecture'
      linked_issue: '3354'
      rationale: Expired compatibility items are not allowed to persist after their
        sunset date.
      ratchet_policy: Zero-budget fail-fast metric.
sanctioned_public_entrypoint_governance:
  inventory_source: configs/quality/compatibility_facade_inventory.yaml
  metrics:
    public_entrypoint_count:
      current_count: 13
      owner: '@bioetl-architecture'
      linked_issue: '4565'
      rationale: Permanent public entrypoints remain governed as sanctioned public
        API seams with explicit burn-down metadata, but they are not compatibility
        debt because they are not transition shims.
      review_cadence: quarterly
      review_policy: Review owner metadata, allowed call sites, target state, and
        completion gates whenever the compatibility inventory changes or quarterly
        lifecycle review runs.
    stable_public_api_count:
      current_count: 12
      owner: '@bioetl-architecture'
      linked_issue: '4565'
      rationale: Stable public entrypoints intentionally remain external patch/import
        seams and should stay explicitly bounded rather than being treated as hidden
        transition debt.
      review_cadence: quarterly
      review_policy: Keep the sanctioned public API set explicit and block reversion
        to internal-owner imports outside approved boundary coverage.
    narrow_first_party_callers_count:
      current_count: 1
      owner: '@bioetl-architecture'
      linked_issue: '4565'
      rationale: A small subset of sanctioned public entrypoints still needs first-party
        caller narrowing even though the public API itself remains stable.
      review_cadence: quarterly
      review_policy: Ratchet first-party callers toward reviewed facade exports and
        keep deeper owner modules hidden behind the sanctioned public seam.
bronze_fixture_replay_debt_metrics:
  gap_source: configs/base/bronze_fixture_gaps.yaml
  manifest_source: configs/base/bronze_fixture_manifest.yaml
  linked_issue: '3347'
  metrics:
    active_fixture_gap_count:
      current_count: 0
      max_count: 0
      owner: '@bioetl-data-platform'
      rationale: Open and in-progress Bronze replay evidence gaps must not persist
        silently in CI; every supported family needs tracked fixture evidence or an
        explicit de-scope decision.
      ratchet_policy: Zero-budget fail-fast metric for open/in_progress gaps.
    blocked_fixture_gap_count:
      current_count: 0
      max_count: 0
      owner: '@bioetl-data-platform'
      rationale: Blocked Bronze fixture gaps require an explicit governance budget
        change instead of remaining as side backlog.
      ratchet_policy: Zero-budget unless a reviewed exception updates the budget.
    decision_recorded_fixture_gap_count:
      current_count: 0
      max_count: 0
      owner: '@bioetl-data-platform'
      rationale: Decision-recorded fixture families are residual replay evidence debt
        and must not grow without a reviewed policy change.
      ratchet_policy: Ratchet downward as derived/specialized surfaces gain factual
        provider-backed tracked samples.
    tracked_bronze_fixture_count:
      current_count: 22
      owner: '@bioetl-data-platform'
      rationale: Tracked CI samples are the first-class evidence signal for determinism
        and replay coverage across supported Bronze families.
      ratchet_policy: May increase as supported families gain tracked fixture evidence;
        removals require a reviewed de-scope decision.
config_surface_ratchet:
  linked_issue: '#4818'
  owner: '@bioetl-config'
  mode: fail-fast
  review_history:
  - issue: '#4927'
    reviewed_on: '2026-06-01'
    owner: '@bioetl-config'
    outcome: held_flat_with_zero_actionable_drift
    rationale: Sanctioned partial variance remains 122 because residual keys are entity-specific
      extraction/filter policy or composite target-only protein classification mappings;
      copying them across unrelated configs would create false contract surface. Actionable
      inconsistent_parameter_count stays zero.
  - issue: '#4966'
    reviewed_on: '2026-06-01'
    owner: '@bioetl-config'
    outcome: dq_defaults_effective_matrix_partial_variance_burn_down
    rationale: Entity effective config rows now merge runtime DQ defaults from configs/base/quality.yaml
      before drift classification. This removed the quality_thresholds residual category,
      lowered sanctioned partial variance from 122 to 119, and kept actionable inconsistent_parameter_count
      at zero.
  - issue: '#4989'
    reviewed_on: '2026-06-02'
    owner: '@bioetl-config'
    outcome: target_projection_schema_replaced_explicit_partial_field_mapping_set
    rationale: Composite target now projects target protein classification aliases
      through a typed schema contract instead of 16 explicit target-only field_mappings
      keys. This lowered total sanctioned partial variance from 119 to 107, reduced
      composite_runtime sanctioned partial variance from 16 to 4, and kept actionable
      inconsistent_parameter_count at zero.
  - issue: '#4996'
    reviewed_on: '2026-06-02'
    owner: '@bioetl-config'
    outcome: sanctioned_partial_variance_normalized_to_zero
    rationale: Family-level governance now projects sanctioned keys through a reviewed
      placeholder-presence normalization, collapsing sanctioned missing-vs-empty variance
      without mutating live runtime configs. Actionable and raw partial drift counts
      are both zero across entity_effective and composite_runtime.
  artifact_policy:
    generator_command: python -m scripts.schema generate-config-matrix
    baseline_artifact: reports/quality/config-discrepancy-baseline.json
    report_artifact: docs/config-discrepancies-report.md
    matrix_artifact: docs/04-reference/config_comparison_matrix.csv
    expected_direction: downward
    ratchet_policy: Config-surface metrics must not grow without an explicit scorecard
      budget update; inconsistent-parameter count ratchets downward during Stream
      B burn-down. Entity rows use effective pipeline config merged from configs/base/pipeline.yaml
      and configs/base/quality.yaml.
  metrics:
    config_count:
      current_count: 27
      max_count: 27
      owner: '@bioetl-config'
      linked_issue: '#4818'
      rationale: Entity/composite config surface must stay bounded while contract
        drift is burned down.
      ratchet_policy: Non-growth fail-fast unless a reviewed pipeline addition updates
        the budget.
    unique_parameter_count:
      current_count: 507
      max_count: 507
      owner: '@bioetl-config'
      linked_issue: '#4818'
      rationale: Flattened parameter vocabulary must not expand silently across the
        unified config matrix.
      ratchet_policy: Non-growth fail-fast unless a reviewed schema expansion updates
        the budget.
    inconsistent_parameter_count:
      current_count: 0
      max_count: 0
      owner: '@bioetl-config'
      linked_issue: '#4818'
      rationale: Actionable config-surface drift after sanctioned entity-specific
        partial keys are excluded; family-scoped sum must remain zero post Stream
        B closeout.
      ratchet_policy: Non-growth fail-fast; increases require reviewed contract regression.
    sanctioned_partial_parameter_count:
      current_count: 0
      max_count: 0
      owner: '@bioetl-config'
      linked_issue: '#4818'
      rationale: Sanctioned partial variance has been normalized out of the governance
        projection; any reappearance is a reviewed regression.
      ratchet_policy: Zero-budget fail-fast; sanctioned placeholder normalization
        keeps intentional missing-vs-empty variance out of the residual surface.
    raw_inconsistent_parameter_count:
      current_count: 0
      max_count: 0
      owner: '@bioetl-config'
      linked_issue: '#4818'
      rationale: Raw family-scoped partial-key drift is fully retired after sanctioned
        family-presence normalization and target projection cleanup.
      ratchet_policy: Zero-budget fail-fast; any non-zero residual requires reviewed
        contract justification.
  families:
    entity_effective:
      linked_issue: '#4767'
      owner: '@bioetl-config'
      metrics:
        config_count:
          current_count: 22
          max_count: 22
          rationale: Effective entity pipeline surface after base defaults merge.
          ratchet_policy: Non-growth fail-fast for governed entity configs.
        unique_parameter_count:
          current_count: 304
          max_count: 304
          rationale: Effective flattened vocabulary for entity configs only.
          ratchet_policy: Non-growth fail-fast unless reviewed schema expansion updates
            budget.
        inconsistent_parameter_count:
          current_count: 0
          max_count: 0
          rationale: Entity actionable drift after sanctioned-prefix exclusion; Stream
            B closeout target is zero.
          ratchet_policy: Non-growth fail-fast; entity-specific filters remain in
            backlog as sanctioned partial keys only.
        sanctioned_partial_parameter_count:
          current_count: 0
          max_count: 0
          rationale: Effective entity-family governance surface now collapses sanctioned
            missing-vs-empty variance through reviewed placeholder presence.
          ratchet_policy: Zero-budget fail-fast for entity effective configs.
        raw_inconsistent_parameter_count:
          current_count: 0
          max_count: 0
          rationale: Raw entity-family partial-key drift is retired in the committed
            governance baseline.
          ratchet_policy: Zero-budget fail-fast for entity effective configs.
    composite_runtime:
      linked_issue: '#4768'
      owner: '@bioetl-config'
      metrics:
        config_count:
          current_count: 5
          max_count: 5
          rationale: Composite runtime configs under configs/composites/*.yaml.
          ratchet_policy: Non-growth fail-fast for composite runtime surface.
        unique_parameter_count:
          current_count: 203
          max_count: 203
          rationale: Flattened vocabulary for composite runtime configs only.
          ratchet_policy: Non-growth fail-fast unless composite schema expansion updates
            budget.
        inconsistent_parameter_count:
          current_count: 0
          max_count: 0
          rationale: Composite-family actionable drift; Stream B burn-down complete.
          ratchet_policy: Non-growth fail-fast for composite runtime surface.
        sanctioned_partial_parameter_count:
          current_count: 0
          max_count: 0
          rationale: Composite runtime residual sanctioned variance was retired by
            the target projection schema cleanup and family-presence normalization.
          ratchet_policy: Zero-budget fail-fast for composite runtime configs.
        raw_inconsistent_parameter_count:
          current_count: 0
          max_count: 0
          rationale: Raw composite partial-key drift is fully retired in the committed
            baseline.
          ratchet_policy: Zero-budget fail-fast for composite runtime configs.
