schema_version: 1
baseline:
  total_exemptions: 1
  by_registry:
    file_size_limits: 0
    function_complexity: 0
    function_length: 0
    class_size: 0
    class_method_count: 0
    god_object: 1
    domain_complexity: 0
historical_baseline:
  total_exemptions: 10
  by_registry:
    file_size_limits: 6
    function_complexity: 2
    function_length: 0
    class_size: 1
    class_method_count: 0
    god_object: 1
    domain_complexity: 0
  snapshot_date: '2025-12-31'
  source_report: 'reports/architecture/2025-Q4-final.json'
governance:
  baseline_policy:
    enforceable_section: baseline
    historical_section: historical_baseline
    registry_sync_source: baseline
    rationale: "Stabilizing architecture metrics through baseline ratcheting."
  coarse_budgets:
    ruff_error_count:
      max_count: 28
      owner: "@bioetl-architecture"
      linked_rf: "RF-ARCH-009"
      rationale: "Temporary hold while composite runtime hotspot cleanup is still active."
      ratchet_policy: "hold until RF-ARCH-009 removes current composite lint debt"
    mypy_error_count:
      max_count: 0
      owner: "@bioetl-architecture"
      linked_rf: "RF-ARCH-015"
      rationale: "Strict typing is already stabilized repo-wide and stays zero-budget."
      ratchet_policy: "ratchet only downward from zero"
    architecture_skip_count:
      max_count: 7
      owner: "@bioetl-architecture"
      linked_rf: "RF-ARCH-015"
      rationale: "Marker-skip budget remains explicit until historical skip debt is fully retired."
      ratchet_policy: "ratchet only after skip inventory shrinks"
  review_policy:
    new_exemption_requires:
      - value
      - owner
      - reason
      - classification
      - linked_rf
      - expires_on
      - removal_step
    reviewer_checks:
      - "classification is technical_debt or intentional_exception"
      - "linked_rf points to active"
      - "placeholder exemptions require concrete technical follow-up"
      - "2026-06-30"
  owner_diversification:
    starts_quarter: 2026-Q2
    min_distinct_owners: 3
  owner_registry_q2_subsystems:
    architecture:
      owner: "@bioetl-architecture"
    platform:
      owner: "@bioetl-platform"
    data_model:
      owner: "@bioetl-data-model"
  temporary_exemptions:
    window_policy: "budget-only"
    max_window_days: 30
  growth_section_gate_rollout:
    default_mode: block
    warn_until_by_section:
      "registry:file_size_limits": "2026-06-30"
  burn_down_priorities:
    registries:
      - file_size_limits
      - class_size
      - god_object
  allow_grace_windows_only_for_rf: true
  review_cycle: 90
  quarterly_burndown_target: 2
  allowed_classifications:
    - architectural_debt
    - interface_debt
    - domain_complexity
    - technical_debt
    - transitional_compat
    - legacy_artifact
    - intentional_exception
registry_groups:
  size_metrics:
    registries:
      - file_size_limits
      - function_length
      - class_size
  complexity_metrics:
    registries:
      - function_complexity
      - domain_complexity
  structural_debt:
    registries:
      - god_object
      - class_method_count
registries:
  file_size_limits:
    target_count: 10
    total_loc_budget: 20000
  class_size:
    target_count: 5
  function_complexity:
    max_cc_threshold: 15
  god_object:
    max_count: 2
hotspot_budgets:
  - name: "core_orchestration"
    rationale: "Critical orchestration logic hotspot."
    path_prefixes:
      - "src/bioetl/application/core/"
    registry_budgets:
      file_size_limits: 1
      class_size: 1
      god_object: 1
  - name: "composite_orchestration"
    rationale: "Composite runtime orchestration hotspot spanning join, checkpoint, and runner support seams."
    path_prefixes:
      - "src/bioetl/application/composite/"
    registry_budgets:
      file_size_limits: 1
      class_size: 1
      god_object: 1
quarterly_targets:
  - quarter: "2026-Q1"
    max_total_exemptions: 10
    min_integral_score: 70
    group_budgets:
      size_metrics: 1
      complexity_metrics: 0
      structural_debt: 1
    registry_budgets:
      file_size_limits: 1
      function_complexity: 0
      function_length: 0
      class_size: 1
      class_method_count: 0
      god_object: 1
      domain_complexity: 0
  - quarter: "2026-Q2"
    max_total_exemptions: 8
    min_integral_score: 72
    group_budgets:
      size_metrics: 0
      complexity_metrics: 0
      structural_debt: 0
    registry_budgets:
      file_size_limits: 0
      function_complexity: 0
      function_length: 0
      class_size: 0
      class_method_count: 0
      god_object: 0
      domain_complexity: 0
owner_decomposition_targets:
  - quarter: "2026-Q1"
    allocations:
      "@bioetl-architecture": 10
  - quarter: "2026-Q2"
    allocations:
      "@bioetl-architecture": 3
      "@bioetl-platform": 3
      "@bioetl-data-model": 2
expiry_decomposition_targets:
  - quarter: "2026-Q1"
    max_entries_expiring_in_quarter: 10
  - quarter: "2026-Q2"
    max_entries_expiring_in_quarter: 8
program_done_criteria:
  deadline_quarter: "2027-Q1"
  max_total_exemptions: 0
  min_integral_score: 100
  max_expired_entries: 0
