schema_version: 1
governance:
    baseline_date: '2026-03-07'
    description: Architecture debt scorecard governance for exemption registry.
    growth_gate_default_mode: block
    temporary_exemptions:
        window_policy: budget-only
        max_window_days: 45
    allow_grace_windows_only_for_rf: true
    owner_diversification:
        starts_quarter: 2026-Q2
        min_distinct_owners: 3
    owner_registry_q2_subsystems:
        architecture:
            owner: '@bioetl-architecture'
            scope:
                - application
                - interfaces
                - cross-cutting-architecture
        platform:
            owner: '@bioetl-platform'
            scope:
                - infrastructure
                - composition
                - runtime-observability
        data_model:
            owner: '@bioetl-data-model'
            scope:
                - domain-model
                - domain-schemas
                - domain-mapping
    review_policy:
        new_exemption_requires:
            - owner
            - expires_on
            - removal_step
        reviewer_checks:
            - owner maps to subsystem scope
            - removal_step references concrete follow-up action
            - placeholder exemptions require concrete technical follow-up (RF/issue link) and must be reviewed on 2026-06-30
            - owner diversification enforcement follows governance.owner_diversification.starts_quarter activation window
    burn_down_priorities:
        registries:
            - file_size_limits
            - class_size
            - god_object
    growth_section_gate_rollout:
        default_mode: block
        warn_until_by_section:
            registry:*: '2026-06-30'
            group:*: '2026-03-03'
baseline:
    total_exemptions: 25
    by_registry:
        file_size_limits: 6
        function_complexity: 2
        function_length: 0
        class_size: 14
        class_method_count: 0
        god_object: 1
        domain_complexity: 2
registry_groups:
    size_shape:
        registries:
            - file_size_limits
            - function_length
            - class_size
            - class_method_count
            - god_object
    complexity:
        registries:
            - function_complexity
            - domain_complexity
