schema_version: 1
baseline:
  total_exemptions: 4
  by_registry:
    file_size_limits: 3
    function_complexity: 0
    function_length: 0
    class_size: 0
    class_method_count: 0
    god_object: 0
    domain_complexity: 1
historical_baseline:
  total_exemptions: 44
  by_registry:
    file_size_limits: 6
    function_complexity: 6
    function_length: 10
    class_size: 13
    class_method_count: 0
    god_object: 3
    domain_complexity: 6
  snapshot_date: '2025-12-31'
  source_report: reports/architecture/2025-Q4-final.json
governance:
  baseline_policy:
    enforceable_section: baseline
    historical_section: historical_baseline
    registry_sync_source: baseline
    rationale: Stabilizing architecture metrics through baseline ratcheting.
  coarse_budgets:
    ruff_error_count:
      max_count: 0
      owner: '@bioetl-architecture'
      linked_rf: RF-ARCH-009
      rationale: Ruff backlog for src/bioetl has been retired; CI now enforces zero
        source-level lint debt.
      ratchet_policy: ratchet only downward from zero
    mypy_error_count:
      max_count: 0
      owner: '@bioetl-architecture'
      linked_rf: RF-ARCH-015
      rationale: Strict typing is already stabilized repo-wide and stays zero-budget.
      ratchet_policy: ratchet only downward from zero
    architecture_skip_count:
      max_count: 7
      owner: '@bioetl-architecture'
      linked_rf: RF-ARCH-015
      rationale: Marker-skip budget remains explicit until historical skip debt is
        fully retired.
      ratchet_policy: ratchet only after skip inventory shrinks
  review_policy:
    new_exemption_requires:
    - value
    - owner
    - reason
    - classification
    - linked_rf
    - expires_on
    - removal_step
    reviewer_checks:
    - classification is technical_debt or intentional_exception
    - linked_rf points to active
    - placeholder exemptions require concrete technical follow-up
    - '2026-06-30'
  owner_diversification:
    starts_quarter: 2026-Q2
    min_distinct_owners: 2
  owner_registry_q2_subsystems:
    architecture:
      owner: '@bioetl-architecture'
    platform:
      owner: '@bioetl-platform'
    data_model:
      owner: '@bioetl-data-model'
  temporary_exemptions:
    window_policy: budget-only
    max_window_days: 30
  growth_section_gate_rollout:
    default_mode: block
    warn_until_by_section:
      registry:file_size_limits: '2026-06-30'
  burn_down_priorities:
    registries:
    - file_size_limits
    - class_size
    - god_object
  allow_grace_windows_only_for_rf: true
  review_cycle: 90
  quarterly_burndown_target: 2
  allowed_classifications:
  - technical_debt
  - intentional_exception
compatibility_debt_metrics:
  inventory_source: configs/quality/compatibility_facade_inventory.yaml
  sunset_source: tests/architecture/test_compat_sunset.py
  metrics:
    retained_public_facade_count:
      current_count: 21
      max_count: 21
      owner: '@bioetl-architecture'
      linked_issue: '3354'
      rationale: Sanctioned public facades are retained compatibility obligations;
        they require ownership, tests, and lifecycle review even when not counted
        as transition debt.
      ratchet_policy: Ratchet downward only after a reviewed facade-removal or
        public-API consolidation PR updates the compatibility inventory.
      ratchet_schedule:
      - effective_on: '2026-04-30'
        max_count: 21
        milestone: freeze-baseline
      - effective_on: '2026-06-30'
        max_count: 15
        milestone: wave-1
      - effective_on: '2026-09-30'
        max_count: 10
        milestone: wave-2
      - effective_on: '2026-12-31'
        max_count: 0
        milestone: final-removal
    sunset_compat_count:
      current_count: 0
      owner: '@bioetl-architecture'
      linked_issue: '3354'
      sunset_date: '2026-06-30'
      rationale: Temporary compatibility shims were removed early in the 2026-04-29
        sunset wave; the active sunset inventory must stay empty unless a reviewed
        policy exception adds a new item.
      ratchet_policy: May only decrease before the sunset; must reach zero after
        2026-06-30.
    expired_compat_count:
      current_count: 0
      max_count: 0
      owner: '@bioetl-architecture'
      linked_issue: '3354'
      rationale: Expired compatibility items are not allowed to persist after their
        sunset date.
      ratchet_policy: Zero-budget fail-fast metric.
bronze_fixture_replay_debt_metrics:
  gap_source: configs/base/bronze_fixture_gaps.yaml
  manifest_source: configs/base/bronze_fixture_manifest.yaml
  linked_issue: '3347'
  metrics:
    active_fixture_gap_count:
      current_count: 0
      max_count: 0
      owner: '@bioetl-data-platform'
      rationale: Open and in-progress Bronze replay evidence gaps must not persist
        silently in CI; every supported family needs tracked fixture evidence or an
        explicit de-scope decision.
      ratchet_policy: Zero-budget fail-fast metric for open/in_progress gaps.
    blocked_fixture_gap_count:
      current_count: 0
      max_count: 0
      owner: '@bioetl-data-platform'
      rationale: Blocked Bronze fixture gaps require an explicit governance budget
        change instead of remaining as side backlog.
      ratchet_policy: Zero-budget unless a reviewed exception updates the budget.
    decision_recorded_fixture_gap_count:
      current_count: 0
      max_count: 0
      owner: '@bioetl-data-platform'
      rationale: Decision-recorded fixture families are residual replay evidence
        debt and must not grow without a reviewed policy change.
      ratchet_policy: Ratchet downward as derived/specialized surfaces gain factual
        provider-backed tracked samples.
    tracked_bronze_fixture_count:
      current_count: 21
      owner: '@bioetl-data-platform'
      rationale: Tracked CI samples are the first-class evidence signal for
        determinism and replay coverage across supported Bronze families.
      ratchet_policy: May increase as supported families gain tracked fixture
        evidence; removals require a reviewed de-scope decision.
registry_groups:
  size_metrics:
    registries:
    - file_size_limits
    - function_length
    - class_size
  complexity_metrics:
    registries:
    - function_complexity
    - domain_complexity
  structural_debt:
    registries:
    - god_object
    - class_method_count
registries:
  file_size_limits:
    target_count: 10
    total_loc_budget: 20000
  class_size:
    target_count: 5
  function_complexity:
    max_cc_threshold: 15
  god_object:
    max_count: 2
hotspot_budgets:
- name: core_orchestration
  rationale: Critical orchestration logic hotspot.
  path_prefixes:
  - src/bioetl/application/core/
  registry_budgets:
    file_size_limits: 1
    class_size: 3
    god_object: 1
- name: composite_orchestration
  rationale: Composite runtime orchestration hotspot spanning join, checkpoint, and
    runner support seams.
  path_prefixes:
  - src/bioetl/application/composite/
  registry_budgets:
    file_size_limits: 1
    class_size: 1
    god_object: 1
report_only_hotspot_families:
  snapshot_date: '2026-03-24'
  mode: report-only
  artifact_policy:
    duplication_command: make qa-hotspot-report
    baseline_artifact: reports/quality/hotspot-duplication-baseline.json
    history_artifact: reports/quality/hotspot-duplication-history.jsonl
    latest_reviewed_snapshot: '2026-03-24'
    confirming_clean_snapshots_required: 2
    expected_direction: downward
    ratchet_policy: Keep the hotspot layer report-only at the repo level; once a zero-duplication
      family has two confirming clean snapshots, activate bounded family-level duplication,
      file-growth, and fan-in ratchets from reviewed scorecard baselines.
  families:
  - name: application_core
    owner: '@bioetl-architecture'
    linked_rf: RF-023
    ratchet_stage: active
    ratchet_scope: duplication-only
    expected_action: Hold duplication at zero via an active family-level ratchet and
      cap both file-growth and fan-in at the reviewed baseline during core orchestration
      changes.
    path_prefixes:
    - src/bioetl/application/core/
    bounded_growth_budgets:
      files_ge_250_loc: 18
      max_internal_fan_in: 22
    metrics:
      duplication_clusters: 0
      files: 81
      total_loc: 12259
      files_ge_250_loc: 18
      helper_function_ratio: 0.46
      max_internal_fan_in: 22
      max_internal_fan_in_module: bioetl.application.core.base_transformer
    trend:
      status: down_vs_2026-03-23
      next_action: 2026-04-08 adds bounded files_ge_250_loc and max_internal_fan_in
        caps at the reviewed baseline for application/core while keeping the family
        duplication ratchet active.
  - name: composition_bootstrap_runtime
    owner: '@bioetl-platform'
    linked_rf: RF-023
    ratchet_stage: active
    ratchet_scope: duplication-only
    expected_action: Hold duplication at zero via an active family-level ratchet and
      cap both file-growth and fan-in at the reviewed baseline during runtime/bootstrap
      changes.
    path_prefixes:
    - src/bioetl/composition/bootstrap/runtime/
    bounded_growth_budgets:
      files_ge_250_loc: 6
      max_internal_fan_in: 7
    metrics:
      duplication_clusters: 0
      files: 27
      total_loc: 3163
      files_ge_250_loc: 6
      helper_function_ratio: 0.333
      max_internal_fan_in: 7
      max_internal_fan_in_module: bioetl.composition.bootstrap.runtime.composite_support_services_factory
    trend:
      status: down_vs_2026-03-23
      next_action: 2026-04-08 adds bounded files_ge_250_loc and max_internal_fan_in
        caps at the current reviewed baseline for composition/bootstrap/runtime.
  - name: composition_factories_pipeline
    owner: '@bioetl-platform'
    linked_rf: RF-023
    ratchet_stage: active
    ratchet_scope: duplication-only
    expected_action: Hold duplication at zero via an active family-level ratchet and
      cap both file-growth and fan-in at the reviewed baseline during pipeline-factory
      changes.
    path_prefixes:
    - src/bioetl/composition/factories/pipeline/
    bounded_growth_budgets:
      files_ge_250_loc: 4
      max_internal_fan_in: 6
    metrics:
      duplication_clusters: 0
      files: 22
      total_loc: 2589
      files_ge_250_loc: 4
      helper_function_ratio: 0.469
      max_internal_fan_in: 6
      max_internal_fan_in_module: bioetl.composition.factories.pipeline.registry
    trend:
      status: down_vs_2026-03-23
      next_action: 2026-04-08 adds bounded files_ge_250_loc and max_internal_fan_in
        caps at the current reviewed baseline for composition/factories/pipeline.
removable_complexity_family_ratchets:
  snapshot_date: '2026-04-13'
  update_policy: Only raise budgets after an intentional reviewed baseline refresh
    tied to a closed cleanup issue.
  families:
  - name: adapter_layer
    owner: '@bioetl-platform'
    linked_issue: '2910'
    path_prefixes:
    - src/bioetl/infrastructure/adapters/
    family_budgets:
      files_ge_250_loc: 21
      max_internal_fan_in: 31
    tracked_seams:
    - path: src/bioetl/infrastructure/adapters/http/_health_monitor_support.py
      max_lines: 40
      required_modules:
      - bioetl.infrastructure.adapters.http._health_monitor_observability
      - bioetl.infrastructure.adapters.http._health_monitor_transitions
  - name: composite_layer
    owner: '@bioetl-architecture'
    linked_issue: '2910'
    path_prefixes:
    - src/bioetl/application/composite/
    family_budgets:
      files_ge_250_loc: 21
      max_internal_fan_in: 25
    tracked_seams:
    - path: src/bioetl/application/composite/runner_pkg/runner_summary_helpers.py
      max_lines: 130
      required_symbols:
      - EnrichmentSummary
      - _summarize_enrichment_results
    - path: src/bioetl/application/composite/fsm_helper.py
      max_lines: 260
      required_symbols:
      - ResumePhaseInfo
      - _resolve_resume_phase
