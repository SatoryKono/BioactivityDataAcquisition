schema_version: 1
baseline:
  total_exemptions: 0
  by_registry:
    file_size_limits: 0
    function_complexity: 0
    function_length: 0
    class_size: 0
    class_method_count: 0
    god_object: 0
    domain_complexity: 0
historical_baseline:
  total_exemptions: 23
  by_registry:
    file_size_limits: 6
    function_complexity: 6
    function_length: 0
    class_size: 3
    class_method_count: 0
    god_object: 2
    domain_complexity: 6
  snapshot_date: '2025-12-31'
  source_report: 'reports/architecture/2025-Q4-final.json'
governance:
  baseline_policy:
    enforceable_section: baseline
    historical_section: historical_baseline
    registry_sync_source: baseline
    rationale: "Stabilizing architecture metrics through baseline ratcheting."
  coarse_budgets:
    ruff_error_count:
      max_count: 28
      owner: "@bioetl-architecture"
      linked_rf: "RF-ARCH-009"
      rationale: "Temporary hold while composite runtime hotspot cleanup is still active."
      ratchet_policy: "hold until RF-ARCH-009 removes current composite lint debt"
    mypy_error_count:
      max_count: 0
      owner: "@bioetl-architecture"
      linked_rf: "RF-ARCH-015"
      rationale: "Strict typing is already stabilized repo-wide and stays zero-budget."
      ratchet_policy: "ratchet only downward from zero"
    architecture_skip_count:
      max_count: 7
      owner: "@bioetl-architecture"
      linked_rf: "RF-ARCH-015"
      rationale: "Marker-skip budget remains explicit until historical skip debt is fully retired."
      ratchet_policy: "ratchet only after skip inventory shrinks"
  review_policy:
    new_exemption_requires:
      - value
      - owner
      - reason
      - classification
      - linked_rf
      - expires_on
      - removal_step
    reviewer_checks:
      - "classification is technical_debt or intentional_exception"
      - "linked_rf points to active"
      - "placeholder exemptions require concrete technical follow-up"
      - "2026-06-30"
  owner_diversification:
    starts_quarter: 2026-Q2
    min_distinct_owners: 3
  owner_registry_q2_subsystems:
    architecture:
      owner: "@bioetl-architecture"
    platform:
      owner: "@bioetl-platform"
    data_model:
      owner: "@bioetl-data-model"
  temporary_exemptions:
    window_policy: "budget-only"
    max_window_days: 30
  growth_section_gate_rollout:
    default_mode: block
    warn_until_by_section:
      "registry:file_size_limits": "2026-06-30"
  burn_down_priorities:
    registries:
      - file_size_limits
      - class_size
      - god_object
  allow_grace_windows_only_for_rf: true
  review_cycle: 90
  quarterly_burndown_target: 2
  allowed_classifications:
    - architectural_debt
    - interface_debt
    - domain_complexity
    - technical_debt
    - transitional_compat
    - legacy_artifact
    - intentional_exception
registry_groups:
  size_metrics:
    registries:
      - file_size_limits
      - function_length
      - class_size
  complexity_metrics:
    registries:
      - function_complexity
      - domain_complexity
  structural_debt:
    registries:
      - god_object
      - class_method_count
registries:
  file_size_limits:
    target_count: 10
    total_loc_budget: 20000
  class_size:
    target_count: 5
  function_complexity:
    max_cc_threshold: 15
  god_object:
    max_count: 2
hotspot_budgets:
  - name: "core_orchestration"
    rationale: "Critical orchestration logic hotspot."
    path_prefixes:
      - "src/bioetl/application/core/"
    registry_budgets:
      file_size_limits: 1
      class_size: 1
      god_object: 1
  - name: "composite_orchestration"
    rationale: "Composite runtime orchestration hotspot spanning join, checkpoint, and runner support seams."
    path_prefixes:
      - "src/bioetl/application/composite/"
    registry_budgets:
      file_size_limits: 1
      class_size: 1
      god_object: 1
report_only_hotspot_families:
  snapshot_date: '2026-03-24'
  mode: report-only
  artifact_policy:
    duplication_command: "make qa-hotspot-report"
    baseline_artifact: "reports/quality/hotspot-duplication-baseline.json"
    history_artifact: "reports/quality/hotspot-duplication-history.jsonl"
    latest_reviewed_snapshot: "2026-03-24"
    confirming_clean_snapshots_required: 2
    expected_direction: "downward"
    ratchet_policy: "Keep the hotspot layer report-only at the repo level; once a zero-duplication family has two confirming clean snapshots, activate only a bounded family-level duplication ratchet while file-growth and fan-in remain watch-only."
  families:
    - name: "application_core"
      owner: "@bioetl-architecture"
      linked_rf: "RF-023"
      ratchet_stage: "active"
      ratchet_scope: "duplication-only"
      expected_action: "Hold duplication at zero via an active family-level ratchet while keeping file-growth and fan-in in watch mode during core orchestration changes."
      path_prefixes:
        - "src/bioetl/application/core/"
      metrics:
        duplication_clusters: 0
        files: 81
        total_loc: 12259
        files_ge_250_loc: 18
        helper_function_ratio: 0.46
        max_internal_fan_in: 22
        max_internal_fan_in_module: "bioetl.application.core.base_transformer"
      trend:
        status: "down_vs_2026-03-23"
        next_action: "2026-03-24 now has two confirming clean snapshots for application/core; keep the bounded duplication-only family ratchet active while the remaining structural pressure stays in file-growth and fan-in."
    - name: "composition_bootstrap_runtime"
      owner: "@bioetl-platform"
      linked_rf: "RF-023"
      ratchet_stage: "active"
      ratchet_scope: "duplication-only"
      expected_action: "Hold duplication at zero via an active family-level ratchet while keeping file-growth and fan-in in watch mode during runtime/bootstrap changes."
      path_prefixes:
        - "src/bioetl/composition/bootstrap/runtime/"
      metrics:
        duplication_clusters: 0
        files: 27
        total_loc: 3163
        files_ge_250_loc: 3
        helper_function_ratio: 0.333
        max_internal_fan_in: 5
        max_internal_fan_in_module: "bioetl.composition.bootstrap.runtime.observability"
      trend:
        status: "down_vs_2026-03-23"
        next_action: "2026-03-24 now has two confirming clean snapshots for composition/bootstrap/runtime; keep the bounded duplication-only family ratchet active while file-growth and fan-in remain watch-only."
    - name: "composition_factories_pipeline"
      owner: "@bioetl-platform"
      linked_rf: "RF-023"
      ratchet_stage: "active"
      ratchet_scope: "duplication-only"
      expected_action: "Hold duplication at zero via an active family-level ratchet while keeping file-growth and fan-in in watch mode during pipeline-factory changes."
      path_prefixes:
        - "src/bioetl/composition/factories/pipeline/"
      metrics:
        duplication_clusters: 0
        files: 22
        total_loc: 2589
        files_ge_250_loc: 3
        helper_function_ratio: 0.469
        max_internal_fan_in: 6
        max_internal_fan_in_module: "bioetl.composition.factories.pipeline.registry"
      trend:
        status: "down_vs_2026-03-23"
        next_action: "2026-03-24 now has two confirming clean snapshots for composition/factories/pipeline; keep the bounded duplication-only family ratchet active while file-growth and fan-in remain watch-only."
