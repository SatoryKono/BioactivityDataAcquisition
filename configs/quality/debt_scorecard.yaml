schema_version: 1
baseline:
  total_exemptions: 0
  by_registry:
    file_size_limits: 0
    function_complexity: 0
    function_length: 0
    class_size: 0
    class_method_count: 0
    god_object: 0
    domain_complexity: 0
historical_baseline:
  total_exemptions: 48
  by_registry:
    file_size_limits: 10
    function_complexity: 6
    function_length: 10
    class_size: 13
    class_method_count: 0
    god_object: 3
    domain_complexity: 6
  snapshot_date: '2025-12-31'
  source_report: reports/architecture/2025-Q4-final.json
governance:
  baseline_policy:
    enforceable_section: baseline
    historical_section: historical_baseline
    registry_sync_source: baseline
    rationale: Stabilizing architecture metrics through baseline ratcheting.
  coarse_budgets:
    ruff_error_count:
      max_count: 0
      owner: '@bioetl-architecture'
      linked_rf: RF-ARCH-009
      rationale: Ruff backlog for src/bioetl has been retired; CI now enforces zero
        source-level lint debt.
      ratchet_policy: ratchet only downward from zero
    mypy_error_count:
      max_count: 0
      owner: '@bioetl-architecture'
      linked_rf: RF-ARCH-015
      rationale: Strict typing is already stabilized repo-wide and stays zero-budget.
      ratchet_policy: ratchet only downward from zero
    architecture_skip_count:
      max_count: 3
      owner: '@bioetl-architecture'
      linked_rf: RF-ARCH-015
      rationale: Marker-skip budget now matches the three explicit architecture
        skipif tests still present in the suite and stays fail-fast against any
        re-expansion.
      ratchet_policy: ratchet only after skip inventory shrinks
  review_policy:
    new_exemption_requires:
    - value
    - owner
    - reason
    - classification
    - linked_rf
    - expires_on
    - removal_step
    reviewer_checks:
    - classification is technical_debt or intentional_exception
    - linked_rf points to active
    - placeholder exemptions require concrete technical follow-up
    - '2026-06-30'
  owner_diversification:
    starts_quarter: 2026-Q2
    min_distinct_owners: 2
  owner_registry_q2_subsystems:
    architecture:
      owner: '@bioetl-architecture'
    platform:
      owner: '@bioetl-platform'
    data_model:
      owner: '@bioetl-data-model'
  temporary_exemptions:
    window_policy: budget-only
    max_window_days: 30
  growth_section_gate_rollout:
    default_mode: block
    warn_until_by_section:
      registry:file_size_limits: '2026-06-30'
  burn_down_priorities:
    registries:
    - file_size_limits
    - class_size
    - god_object
  allow_grace_windows_only_for_rf: true
  review_cycle: 90
  quarterly_burndown_target: 2
  allowed_classifications:
  - technical_debt
  - intentional_exception
compatibility_debt_metrics:
  inventory_source: configs/quality/compatibility_facade_inventory.yaml
  sunset_source: tests/architecture/test_compat_sunset.py
  metrics:
    transition_compat_count:
      current_count: 0
      max_count: 0
      owner: '@bioetl-architecture'
      linked_issue: '4029'
      rationale: Transition-only compatibility shims remain the true compatibility
        debt budget. Sanctioned public entrypoints are reviewed separately as stable
        public API and no longer count toward compatibility debt.
      ratchet_policy: Zero-budget fail-fast metric for curated transition-only compatibility
        residue.
    sunset_compat_count:
      current_count: 0
      owner: '@bioetl-architecture'
      linked_issue: '3354'
      sunset_date: '2026-06-30'
      rationale: Temporary compatibility shims were removed early in the 2026-04-29
        sunset wave; the active sunset inventory must stay empty unless a reviewed
        policy exception adds a new item.
      ratchet_policy: May only decrease before the sunset; must reach zero after
        2026-06-30.
    expired_compat_count:
      current_count: 0
      max_count: 0
      owner: '@bioetl-architecture'
      linked_issue: '3354'
      rationale: Expired compatibility items are not allowed to persist after their
        sunset date.
      ratchet_policy: Zero-budget fail-fast metric.
sanctioned_public_entrypoint_governance:
  inventory_source: configs/quality/compatibility_facade_inventory.yaml
  metrics:
    public_entrypoint_count:
      current_count: 14
      owner: '@bioetl-architecture'
      linked_issue: '4029'
      rationale: Permanent public entrypoints remain governed as sanctioned public
        API seams with explicit owner/review metadata, but they are not compatibility
        debt because they are not transition shims.
      review_cadence: quarterly
      review_policy: Review owner metadata, allowed call sites, and sanctioned public
        API justifications whenever the compatibility inventory changes or quarterly
        lifecycle review runs.
bronze_fixture_replay_debt_metrics:
  gap_source: configs/base/bronze_fixture_gaps.yaml
  manifest_source: configs/base/bronze_fixture_manifest.yaml
  linked_issue: '3347'
  metrics:
    active_fixture_gap_count:
      current_count: 0
      max_count: 0
      owner: '@bioetl-data-platform'
      rationale: Open and in-progress Bronze replay evidence gaps must not persist
        silently in CI; every supported family needs tracked fixture evidence or an
        explicit de-scope decision.
      ratchet_policy: Zero-budget fail-fast metric for open/in_progress gaps.
    blocked_fixture_gap_count:
      current_count: 0
      max_count: 0
      owner: '@bioetl-data-platform'
      rationale: Blocked Bronze fixture gaps require an explicit governance budget
        change instead of remaining as side backlog.
      ratchet_policy: Zero-budget unless a reviewed exception updates the budget.
    decision_recorded_fixture_gap_count:
      current_count: 0
      max_count: 0
      owner: '@bioetl-data-platform'
      rationale: Decision-recorded fixture families are residual replay evidence
        debt and must not grow without a reviewed policy change.
      ratchet_policy: Ratchet downward as derived/specialized surfaces gain factual
        provider-backed tracked samples.
    tracked_bronze_fixture_count:
      current_count: 21
      owner: '@bioetl-data-platform'
      rationale: Tracked CI samples are the first-class evidence signal for
        determinism and replay coverage across supported Bronze families.
      ratchet_policy: May increase as supported families gain tracked fixture
        evidence; removals require a reviewed de-scope decision.
registry_groups:
  size_metrics:
    registries:
    - file_size_limits
    - function_length
    - class_size
  complexity_metrics:
    registries:
    - function_complexity
    - domain_complexity
  structural_debt:
    registries:
    - god_object
    - class_method_count
registries:
  file_size_limits:
    target_count: 0
    total_loc_budget: 20000
  class_size:
    target_count: 0
  function_complexity:
    max_cc_threshold: 15
  god_object:
    max_count: 0
hotspot_budgets:
- name: core_orchestration
  rationale: Critical orchestration logic hotspot.
  path_prefixes:
  - src/bioetl/application/core/
  registry_budgets:
    file_size_limits: 1
    class_size: 3
    god_object: 1
- name: composite_orchestration
  rationale: Composite runtime orchestration hotspot spanning join, checkpoint, and
    runner support seams.
  path_prefixes:
  - src/bioetl/application/composite/
  registry_budgets:
    file_size_limits: 1
    class_size: 1
    god_object: 1
hotspot_family_ratchets:
  snapshot_date: '2026-05-21'
  mode: fail-fast
  artifact_policy:
    duplication_command: uv run python -m scripts.engineering.qa report-duplication-baseline --targets src/bioetl/application/core src/bioetl/composition/bootstrap/runtime src/bioetl/composition/factories/pipeline src/bioetl/application/services/control_plane src/bioetl/composition/runtime_builders --json-out reports/quality/hotspot-duplication-baseline.json --md-out reports/quality/hotspot-duplication-baseline.md --history-jsonl reports/quality/hotspot-duplication-history.jsonl
    baseline_artifact: reports/quality/hotspot-duplication-baseline.json
    history_artifact: reports/quality/hotspot-duplication-history.jsonl
    latest_reviewed_snapshot: '2026-05-21'
    confirming_clean_snapshots_required: 2
    expected_direction: downward
    ratchet_policy: Keep the hotspot layer report-only at the repo level; enforce
      family-level non-growth budgets for duplication, file-growth, and fan-in from
      the reviewed scorecard baselines, then promote a family to zero-duplication
      ratchet only after confirming clean snapshots.
  families:
  - name: application_core
    owner: '@bioetl-architecture'
    linked_rf: RF-023
    ratchet_stage: active
    ratchet_scope: duplication-non-growth-plus-bounded-growth
    expected_action: Hold duplication, file-growth, and fan-in at the reviewed baseline
      during core orchestration changes while paying down duplicate clusters toward
      a future zero-duplication ratchet.
    path_prefixes:
    - src/bioetl/application/core/
    bounded_growth_budgets:
      files_ge_250_loc: 14
      max_internal_fan_in: 15
    metrics:
      duplication_clusters: 8
      files: 166
      total_loc: 20788
      files_ge_250_loc: 14
      helper_function_ratio: 0.374
      max_internal_fan_in: 15
      max_internal_fan_in_module: bioetl.application.core.pipeline_services
    trend:
      status: refreshed_2026-05-20
      next_action: 2026-05-20 refreshes application/core from stale zero-duplication
        evidence to a current non-growth baseline of 8 duplicate clusters while
        keeping files_ge_250_loc and max_internal_fan_in pinned.
  - name: composition_bootstrap_runtime
    owner: '@bioetl-platform'
    linked_rf: RF-023
    ratchet_stage: active
    ratchet_scope: duplication-non-growth-plus-bounded-growth
    expected_action: Hold duplication, file-growth, and fan-in at the reviewed baseline
      during runtime/bootstrap changes while paying down duplicate clusters toward
      a future zero-duplication ratchet.
    path_prefixes:
    - src/bioetl/composition/bootstrap/runtime/
    bounded_growth_budgets:
      files_ge_250_loc: 6
      max_internal_fan_in: 7
    metrics:
      duplication_clusters: 8
      files: 41
      total_loc: 5598
      files_ge_250_loc: 5
      helper_function_ratio: 0.347
      max_internal_fan_in: 7
      max_internal_fan_in_module: bioetl.composition.bootstrap.runtime.composite_support_services_factory
    trend:
      status: refreshed_2026-05-20
      next_action: 2026-05-20 refreshes composition/bootstrap/runtime from stale
        zero-duplication evidence to a current non-growth baseline of 8 duplicate
        clusters while keeping bounded-growth budgets active.
  - name: composition_factories_pipeline
    owner: '@bioetl-platform'
    linked_rf: RF-023
    ratchet_stage: active
    ratchet_scope: duplication-non-growth-plus-bounded-growth
    expected_action: Hold duplication, file-growth, and fan-in at the reviewed baseline
      during pipeline-factory changes while paying down duplicate clusters toward
      a future zero-duplication ratchet.
    path_prefixes:
    - src/bioetl/composition/factories/pipeline/
    bounded_growth_budgets:
      files_ge_250_loc: 4
      max_internal_fan_in: 4
    metrics:
      duplication_clusters: 2
      files: 30
      total_loc: 4218
      files_ge_250_loc: 4
      helper_function_ratio: 0.431
      max_internal_fan_in: 4
      max_internal_fan_in_module: bioetl.composition.factories.pipeline.control_plane_artifacts
    trend:
      status: refreshed_2026-05-20
      next_action: 2026-05-20 refreshes the reviewed measured baseline for composition/factories/pipeline
        to 2 duplicate clusters after runner assembly helper consolidation; keep
        file-growth and max_internal_fan_in pinned at the reviewed ceiling.
  - name: application_services_control_plane
    owner: '@bioetl-platform'
    linked_rf: RF-023
    ratchet_stage: reviewed-baseline
    ratchet_scope: duplication-report-plus-bounded-growth
    expected_action: Hold file-growth and fan-in at the reviewed baseline during
      control-plane changes while duplication remains explicitly tracked from the
      reviewed baseline until the family reaches a clean zero-duplication snapshot.
    path_prefixes:
    - src/bioetl/application/services/control_plane/
    bounded_growth_budgets:
      files_ge_250_loc: 22
      max_internal_fan_in: 6
    metrics:
      duplication_clusters: 17
      files: 65
      total_loc: 12909
      files_ge_250_loc: 20
      helper_function_ratio: 0.495
      max_internal_fan_in: 6
      max_internal_fan_in_module: bioetl.application.services.control_plane._run_manifest_diagnostics_replay_helpers
    trend:
      status: reduced_2026-05-21
      next_action: 2026-05-21 reduces the reviewed family baseline for application/services/control_plane
        from 20 to 17 duplicate clusters after shared ledger identity, manifest-time,
        and checkpoint-anchor projection extraction; keep duplicate clusters,
        files_ge_250_loc, and max_internal_fan_in non-growing while paying down
        the remaining 17 duplicate clusters.
  - name: composition_runtime_builders
    owner: '@bioetl-platform'
    linked_rf: RF-023
    ratchet_stage: reviewed-baseline
    ratchet_scope: duplication-report-plus-bounded-growth
    expected_action: Hold file-growth and fan-in at the reviewed baseline during
      runtime-builder changes while duplication remains explicitly tracked from the
      reviewed baseline until the family reaches a clean zero-duplication snapshot.
    path_prefixes:
    - src/bioetl/composition/runtime_builders/
    bounded_growth_budgets:
      files_ge_250_loc: 7
      max_internal_fan_in: 11
    metrics:
      duplication_clusters: 13
      files: 37
      total_loc: 5736
      files_ge_250_loc: 7
      helper_function_ratio: 0.502
      max_internal_fan_in: 11
      max_internal_fan_in_module: bioetl.composition.runtime_builders.inputs_resolver
    trend:
      status: reviewed_baseline_2026-05-20
      next_action: 2026-05-20 refreshes the reviewed family baseline for composition/runtime_builders;
        keep duplicate clusters, files_ge_250_loc, and max_internal_fan_in non-growing
        while paying down 13 duplicate clusters toward future activation of the
        zero-duplication ratchet.
