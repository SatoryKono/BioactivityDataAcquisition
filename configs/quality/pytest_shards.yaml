schema_version: 1
source: configs/quality/pytest_shards.yaml
summary: >
  Canonical path-based pytest shard inventory for the local sharded runner.
  The runner must read shard membership and ignore/deselect rules from this
  inventory rather than hardcoding them inline.
aliases:
  S7-crosscutting-architecture:
    expands_to:
      - S7-crosscutting-architecture-a
      - S7-crosscutting-architecture-a2
      - S7-crosscutting-architecture-a3
      - S7-crosscutting-architecture-b
      - S7-crosscutting-architecture-c
      - S7-crosscutting-architecture-d
  S7-architecture-fast-boundary:
    expands_to:
      - S7-crosscutting-architecture-a
      - S7-crosscutting-architecture-a2
      - S7-crosscutting-architecture-a3
      - S7-crosscutting-architecture-b
      - S7-crosscutting-architecture-c
      - S7-crosscutting-architecture-d
  S7-architecture-slow-governance:
    expands_to:
      - S7-crosscutting-architecture-guardrails
shards:
  - name: S1-domain-core
    wave: 1
    paths:
      - tests/unit/domain/value_objects
      - tests/unit/domain/schemas
      - tests/unit/domain/entities
      - tests/unit/domain/composite
      - tests/unit/domain/filtering
      - tests/unit/domain/types
      - tests/unit/domain/ports
      - tests/unit/domain/aggregates
      - tests/unit/domain/validation
      - tests/unit/domain/mapping
      - tests/unit/domain/models
      - tests/unit/domain/exceptions
      - tests/unit/domain/transformations
      - tests/unit/domain/lineage
      - tests/unit/domain/hash_policy
    workers_override: 0
  - name: S1-domain-services
    wave: 1
    paths:
      - tests/unit/domain/behavior
      - tests/unit/domain/control_plane
      - tests/unit/domain/config
      - tests/unit/domain/configs
      - tests/unit/domain/registry
      - tests/unit/domain/test_*.py
    workers_override: 0
  - name: S2-comp-iface
    wave: 1
    paths:
      - tests/unit/composition
      - tests/unit/interfaces
    workers_override: 0
    extra_pytest_args:
      - --ignore=tests/unit/composition/runtime_builders/test_run_manifest_support.py
  - name: S7-crosscutting-architecture-a
    wave: 1
    paths:
      - tests/architecture
    workers_override: 0
    extra_pytest_args:
      - --timeout=300
      - --ignore-glob=tests/architecture/test_[c-z]*.py
      - --ignore=tests/architecture/test_antipatterns.py
      - --ignore=tests/architecture/test_any_budget.py
      - --ignore=tests/architecture/test_scripts_catalog_governance.py
      - --ignore=tests/architecture/test_architecture_dependency_docs_drift.py
      - --ignore=tests/architecture/test_check_doc_links_guardrails.py
      - --ignore=tests/architecture/test_compatibility_facade_inventory.py
      - --ignore=tests/architecture/test_compatibility_importer_census_governance.py
      - --ignore=tests/architecture/test_docs_version_sync.py
      - --ignore=tests/architecture/test_documentation_sync.py
      - --ignore=tests/architecture/test_code_metrics.py
      - --ignore=tests/architecture/test_diagram_regression_workflow.py
      - --ignore=tests/architecture/test_docs_governance_workflow.py
      - --ignore=tests/architecture/test_quality_debt_scorecard.py
      - --ignore=tests/architecture/test_quality_burndown_priorities.py
  - name: S7-crosscutting-architecture-a2
    wave: 1
    paths:
      - tests/architecture
    workers_override: 0
    extra_pytest_args:
      - --timeout=300
      - --ignore-glob=tests/architecture/test_[a-b]*.py
      - --ignore-glob=tests/architecture/test_[d-z]*.py
      - --ignore=tests/architecture/test_code_metrics.py
      - --ignore=tests/architecture/test_check_doc_links_guardrails.py
      - --ignore=tests/architecture/test_compatibility_facade_inventory.py
      - --ignore=tests/architecture/test_compatibility_importer_census_governance.py
  - name: S7-crosscutting-architecture-a3
    wave: 2
    paths:
      - tests/architecture
    workers_override: 0
    extra_pytest_args:
      - --timeout=300
      - --ignore-glob=tests/architecture/test_[a-c]*.py
      - --ignore-glob=tests/architecture/test_[g-z]*.py
      - --ignore=tests/architecture/test_diagram_regression_workflow.py
      - --ignore=tests/architecture/test_docs_governance_workflow.py
      - --ignore=tests/architecture/test_docs_version_sync.py
      - --ignore=tests/architecture/test_documentation_sync.py
  - name: S3-app-foundation
    wave: 2
    paths:
      - tests/unit/application/composite
      - tests/unit/application/core
    workers_override: 0
  - name: S4-app-services
    wave: 2
    paths:
      - tests/unit/application/services
      - tests/unit/application/pipelines
    workers_override: 0
  - name: S7-crosscutting-architecture-b
    wave: 2
    paths:
      - tests/architecture
    workers_override: 0
    extra_pytest_args:
      - --timeout=300
      - --ignore-glob=tests/architecture/test_[a-f]*.py
      - --ignore-glob=tests/architecture/test_[m-z]*.py
      - --ignore=tests/architecture/test_any_budget.py
      - --ignore=tests/architecture/test_scripts_catalog_governance.py
      - --ignore=tests/architecture/test_architecture_dependency_docs_drift.py
      - --ignore=tests/architecture/test_check_doc_links_guardrails.py
      - --ignore=tests/architecture/test_compatibility_facade_inventory.py
      - --ignore=tests/architecture/test_compatibility_importer_census_governance.py
      - --ignore=tests/architecture/test_docs_version_sync.py
      - --ignore=tests/architecture/test_documentation_sync.py
      - --ignore=tests/architecture/test_code_metrics.py
      - --ignore=tests/architecture/test_layer_dependencies.py
      - --ignore=tests/architecture/test_diagram_regression_workflow.py
      - --ignore=tests/architecture/test_docs_governance_workflow.py
      - --ignore=tests/architecture/test_lint_terminology_script.py
      - --ignore=tests/architecture/test_quality_debt_scorecard.py
      - --ignore=tests/architecture/test_quality_burndown_priorities.py
  - name: S5-infra-adapters
    wave: 3
    paths:
      - tests/unit/infrastructure/adapters
      - tests/unit/infrastructure/storage
      - tests/integration/adapters
      - tests/integration/interfaces
  - name: S6-crosscutting-unit
    wave: 3
    paths:
      - tests/unit/infrastructure/config
      - tests/unit/infrastructure/quality
      - tests/unit/infrastructure/observability
      - tests/unit/infrastructure/schemas
  - name: S7-crosscutting-architecture-c
    wave: 3
    paths:
      - tests/architecture
    workers_override: 0
    extra_pytest_args:
      - --timeout=300
      - --ignore-glob=tests/architecture/test_[a-l]*.py
      - --ignore-glob=tests/architecture/test_[s-z]*.py
      - --ignore=tests/architecture/test_any_budget.py
      - --ignore=tests/architecture/test_scripts_catalog_governance.py
      - --ignore=tests/architecture/test_architecture_dependency_docs_drift.py
      - --ignore=tests/architecture/test_check_doc_links_guardrails.py
      - --ignore=tests/architecture/test_compatibility_facade_inventory.py
      - --ignore=tests/architecture/test_docs_version_sync.py
      - --ignore=tests/architecture/test_documentation_sync.py
      - --ignore=tests/architecture/test_code_metrics.py
      - --ignore=tests/architecture/test_diagram_regression_workflow.py
      - --ignore=tests/architecture/test_docs_governance_workflow.py
      - --ignore=tests/architecture/test_quality_debt_scorecard.py
      - --ignore=tests/architecture/test_quality_burndown_priorities.py
      - --ignore=tests/architecture/test_regression_metrics.py
  - name: S7-crosscutting-architecture-guardrails
    wave: 2
    paths:
      - tests/architecture/test_antipatterns.py
      - tests/architecture/test_any_budget.py
      - tests/architecture/test_scripts_catalog_governance.py
      - tests/architecture/test_architecture_dependency_docs_drift.py
      - tests/architecture/test_check_doc_links_guardrails.py
      - tests/architecture/test_compatibility_facade_inventory.py
      - tests/architecture/test_compatibility_importer_census_governance.py
      - tests/architecture/test_docs_version_sync.py
      - tests/architecture/test_documentation_sync.py
      - tests/architecture/test_code_metrics.py
      - tests/architecture/test_layer_dependencies.py
      - tests/architecture/test_diagram_regression_workflow.py
      - tests/architecture/test_docs_governance_workflow.py
      - tests/architecture/test_lint_terminology_script.py
      - tests/architecture/test_quality_debt_scorecard.py
      - tests/architecture/test_quality_burndown_priorities.py
      - tests/architecture/test_regression_metrics.py
      - tests/architecture/test_scripts_deprecation_backlog.py
      - tests/architecture/test_scripts_inventory_manifest.py
      - tests/architecture/test_scripts_lifecycle_registry.py
      - tests/architecture/test_test_structural_debt.py
    workers_override: 2
    extra_pytest_args:
      - --timeout=300
  - name: S8-crosscutting-governance
    wave: 3
    paths:
      - tests/integration/pipelines
      - tests/integration/chembl
      - tests/contract
      - tests/smoke
    workers_override: 0
    extra_pytest_args:
      - --timeout=300
  - name: S7-crosscutting-architecture-d
    wave: 4
    paths:
      - tests/architecture
    workers_override: 0
    extra_pytest_args:
      - --timeout=300
      - --ignore-glob=tests/architecture/test_[a-r]*.py
      - --ignore=tests/architecture/test_any_budget.py
      - --ignore=tests/architecture/test_scripts_catalog_governance.py
      - --ignore=tests/architecture/test_architecture_dependency_docs_drift.py
      - --ignore=tests/architecture/test_check_doc_links_guardrails.py
      - --ignore=tests/architecture/test_compatibility_facade_inventory.py
      - --ignore=tests/architecture/test_docs_version_sync.py
      - --ignore=tests/architecture/test_documentation_sync.py
      - --ignore=tests/architecture/test_code_metrics.py
      - --ignore=tests/architecture/test_diagram_regression_workflow.py
      - --ignore=tests/architecture/test_docs_governance_workflow.py
      - --ignore=tests/architecture/test_quality_debt_scorecard.py
      - --ignore=tests/architecture/test_quality_burndown_priorities.py
      - --ignore=tests/architecture/test_scripts_deprecation_backlog.py
      - --ignore=tests/architecture/test_scripts_inventory_manifest.py
      - --ignore=tests/architecture/test_scripts_lifecycle_registry.py
      - --ignore=tests/architecture/test_test_structural_debt.py
