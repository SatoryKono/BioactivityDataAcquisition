version: 1
policy_scope: application_control_plane_root_facade
review_date: "2026-06-22"
target_module: bioetl.application.services.control_plane
new_src_import_policy: external_only_zero_first_party_growth
linked_issue: "#5510"
owner: bioetl.application.services.control_plane
rationale: >-
  The package root remains a compatibility-preserving lazy export facade for
  external callers and reviewed tests, but first-party source code must import
  responsibility-focused owner subpackages (`effective_config`, `manifest`,
  `ledger`, `replay`, `workflow`, `forensic`) directly. Any new `src/`
  importer of the package root is fail-fast debt growth.
