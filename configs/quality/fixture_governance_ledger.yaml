      path and CI-visible drift diagnostics.
    promotion_criteria: >-
      The matrix-declared snapshot registry covers multiple representative
      provider families beyond the initial publication pair, every adopted
      provider keeps documented update guidance and drift tests, and rollout no
      longer depends on the silver schema snapshot fallback alone.
  - field: golden_masters
