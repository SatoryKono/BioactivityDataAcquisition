      - scripts/data/check_vcr_filename_policy.py
    next_step: >-
      Burn down the remaining allowlisted extensionless cassette inventory until
      the filename policy can be enforced without an exception list.
    promotion_criteria: >-
      Extensionless cassette inventory reaches zero and the allowlist can be
      removed while keeping the root VCR policy guard intact.
