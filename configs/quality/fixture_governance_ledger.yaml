      - scripts/migrations/active/backfill_vcr_metadata_sidecars.py
      - tests/fixtures/vcr
      - .github/workflows/tests.yml
    next_step: >-
      Promote the sidecar backfill path from a seeded script plus partial
      inventory into an explicit managed migration workflow for the remaining
      cassette set.
    promotion_criteria: >-
      The repo has a canonical backfill path for the managed cassette inventory
      and rollout status no longer depends on a seeded subset of metadata files.
