schema_version: 1
policy:
  default_gate_mode: block
  owner_diversification_sync:
    source: configs/quality/debt_scorecard.yaml#governance.owner_diversification
    starts_quarter: 2026-Q2
    review_on: "2026-06-30"
  required_fields:
    - value
    - owner
    - reason
    - classification
    - linked_rf
    - expires_on
    - removal_step
registries:
  file_size_limits:
    src/bioetl/interfaces/http/_health_server_routing_support.py:
      value: 460
      owner: "@bioetl-platform"
      reason: "HTTP health-server routing helper is a retained interface seam pending endpoint-family extraction; current size is tracked by architecture tests."
      classification: "technical_debt"
      linked_rf: "RF-000"
      expires_on: "2026-09-30"
      removal_step: "Split endpoint routing helpers by health/control-plane family and remove this exemption."
    src/bioetl/application/services/_observability_workflow_support.py:
      value: 520
      owner: "@bioetl-architecture"
      reason: "Observability workflow support module provides diagnostic workflow helpers for audit, checkpoint, and run-manifest inspection. The size is justified by the breadth of diagnostic orchestration patterns and error handling across multiple observability surfaces."
      classification: "technical_debt"
      linked_rf: "RF-000"
      expires_on: "2026-09-30"
      removal_step: "Consider extracting specialized workflow helpers (e.g., audit-specific, checkpoint-specific) if the module grows beyond 520 lines."
  function_complexity: {}
  function_length: {}
  class_size: {}
  class_method_count: {}
  god_object: {}
  domain_complexity:
    src/bioetl/domain/config/memory.py::MemoryConfig:
      value: 6
      owner: "@bioetl-architecture"
      reason: "MemoryConfig uses Pydantic BaseModel for validation, leading to an apparent cyclomatic complexity of 6 in static analysis, though its core logic is simple and delegated to Pydantic's internal mechanisms."
      classification: "intentional_exception"
      linked_rf: "RF-000"
      expires_on: "2026-09-30"
      removal_step: "Re-evaluate when Pydantic BaseModel cyclomatic complexity is correctly measured or when a change in validation framework occurs."
