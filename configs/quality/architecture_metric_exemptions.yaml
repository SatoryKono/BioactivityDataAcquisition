      linked_rf: "RF-000"
      expires_on: "2026-09-30"
      removal_step: "Extract subcommand handlers into separate modules if the file grows beyond 440 lines."
  function_complexity: {}
  function_length: {}
  class_size:
    src/bioetl/application/services/lineage/metadata_coordinator.py::MetadataCoordinator:
      value: 310
      owner: "@bioetl-architecture"
      reason: "MetadataCoordinator orchestrates lineage metadata coordination across multiple data sources with complex validation and error handling. The size reflects the breadth of coordination patterns required for lineage tracking."
      classification: "technical_debt"
      linked_rf: "RF-000"
      expires_on: "2026-09-30"
      removal_step: "Extract coordination strategy handlers into separate classes if the class grows beyond 310 lines."
  class_method_count: {}
  god_object:
    src/bioetl/application/services/lineage/metadata_coordinator.py::MetadataCoordinator:
      value: 2
      owner: "@bioetl-architecture"
      reason: "MetadataCoordinator is a coordinator/facade pattern by design, centralizing metadata creation across Bronze, Silver, and Gold layers. It delegates to SilverMetadataService and GoldMetadataService for complex layer-specific logic while retaining Bronze metadata creation inline for simplicity. The low delegation count is intentional as the coordinator's primary role is orchestration rather than delegation."
      classification: "intentional_exception"
      linked_rf: "RF-000"
      expires_on: "2026-09-30"
      removal_step: "Re-evaluate if Bronze metadata complexity grows to warrant a dedicated BronzeMetadataService."
  domain_complexity:
    src/bioetl/domain/config/memory.py::MemoryConfig:
      value: 6
      owner: "@bioetl-architecture"
      reason: "MemoryConfig uses Pydantic BaseModel for validation, leading to an apparent cyclomatic complexity of 6 in static analysis, though its core logic is simple and delegated to Pydantic's internal mechanisms."
      classification: "intentional_exception"
      linked_rf: "RF-000"
      expires_on: "2026-09-30"
      removal_step: "Re-evaluate when Pydantic BaseModel cyclomatic complexity is correctly measured or when a change in validation framework occurs."
