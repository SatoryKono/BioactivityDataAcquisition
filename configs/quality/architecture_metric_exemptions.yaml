      value: 7
      owner: '@bioetl-platform'
      reason: _normalize_runtime_anchor_value uses multiple if-branches for field-specific
        normalization, leading to CC=7, but the logic is flat and highly readable.
      classification: intentional_exception
      linked_rf: RF-000
      expires_on: '2026-09-30'
      removal_step: Keep as is or refactor to mapping-based dispatch if CC needs to
        be reduced.
