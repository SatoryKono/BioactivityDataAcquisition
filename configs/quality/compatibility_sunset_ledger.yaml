version: 1
policy_scope: compatibility_behavior_sunset
source_of_truth:
  matrix_path: configs/quality/test_matrix.yaml
  evidence_path: reports/quality/test-governance-current.json
backlog_reference: docs/05-engineering/compatibility-test-files-reduction-plan.md
sunset_policy:
  linked_issue: "#5977"
  default_action: retain_until_replacement
  owner: "@bioetl-platform"
  required_evidence:
    - replacement_surface_exists
    - behavior_contract_preserved
    - migration_path_documented
  forbidden_basis:
    - filename_age_only
    - legacy_label_only
    - no_active_caller_audit
  canonical_checks:
    - tests/architecture/test_test_governance_audit.py
    - scripts/engineering/qa/report_test_governance_audit.py
entries:
  - test_pattern: "*compat*"
    sunset_criteria:
      - has_replacement_in_domain_tests
      - behavior_covered_by_contract_tests
      - no_unique_behavior
    status: inventory_phase
    owner: "@bioetl-platform"
    notes: Compatibility behavior tests must be cataloged before sunset decisions.
  - test_pattern: "*legacy*"
    sunset_criteria:
      - has_replacement_in_domain_tests
      - behavior_covered_by_contract_tests
      - no_unique_behavior
    status: inventory_phase
    owner: "@bioetl-platform"
    notes: Legacy behavior tests must be cataloged before sunset decisions.
  - test_pattern: "*deprecated*"
    sunset_criteria:
      - has_replacement_in_domain_tests
      - behavior_covered_by_contract_tests
      - no_unique_behavior
    status: inventory_phase
    owner: "@bioetl-platform"
    notes: Deprecated behavior tests must be cataloged before sunset decisions.
