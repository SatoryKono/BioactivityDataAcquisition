# VCR cassette size budget (T-TEST-005 / #6776).
# Prevents new multi-10MB chain cassettes from landing without review.
# Existing oversized cassettes are allowlisted until a re-record slim campaign.

schema_version: 1
owner: "@bioetl-platform"
linked_issues:
  - 6776
  - 6772
reviewed_on: "2026-07-28"

policy:
  max_new_cassette_bytes: 10485760 # 10 MiB
  scan_root: tests/fixtures/vcr
  # Cassettes above the budget must be listed here with owner + removal plan.
  allowlist_oversized:
    - path: tests/fixtures/vcr/chembl/test_all_chembl_pipelines_chain.yaml
      owner_tests:
        - tests/e2e/test_full_pipeline_chain_e2e.py
      removal_condition: Re-record minimal multi-entity chain envelope under 10 MiB
    - path: tests/fixtures/vcr/chembl/test_multiple_chembl_entities_parallel_safe.yaml
      owner_tests:
        - tests/e2e/test_advanced_scenarios_e2e.py
      removal_condition: Re-record parallel-safe scenario with truncated payloads
    - path: tests/fixtures/vcr/chembl/test_chembl_target_then_activity_chain.yaml
      owner_tests:
        - tests/e2e/test_full_pipeline_chain_e2e.py
      removal_condition: Re-record target→activity chain under 10 MiB
    - path: tests/fixtures/vcr/chembl/TestChemblTargetComponentPipeline.test_chembl_target_component_happy_path.yaml
      owner_tests:
        - tests/e2e/test_pipeline_matrix_e2e.py
      removal_condition: Re-record happy-path under 10 MiB
  default_lane_for_owners: e2e-nightly-full
  notes: >
    Default CI e2e-smoke must not grow new >10 MiB cassettes. Oversized allowlist
    entries remain for determinism until re-record. pytest --vcr-record=none stays required.

enforcement:
  architecture_test: tests/architecture/test_vcr_cassette_size_budget.py
