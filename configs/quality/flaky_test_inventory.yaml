evidence_scope: >-
  Curated flaky-test inventory bound to the current tracked static
  test-governance fingerprint. This inventory does not replace repeated-run
  CI telemetry or claim that static analysis can detect intermittent outcomes.

flaky_test_definition:
  - intermittent pass/fail outcome across repeated or sharded runs
  - order-dependent behavior
  - live-network leakage into deterministic lanes
  - timing-sensitive assertion without a bounded deterministic seam
  - nondeterministic ID, clock, random, VCR, fixture, or golden-data behavior

remediation_workflow:
  - stabilize with deterministic clock, ID, and fixture seams
  - quarantine only with owner, triage_status, cause, and removal condition
  - do not hide nondeterminism with retries or relaxed assertions

