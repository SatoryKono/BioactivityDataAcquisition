version: 1
scope: docs/04-reference/pipelines/**/*-xwalk.csv
owner_issue: 3211
marker_kinds:
  - MISSING_CODE
  - MISSING_DOC
  - MISSING_GOLD
  - MISSING_TRANSFORMER
classification_values:
  - must_fix
  - should_fix
  - deferred
rules:
  - path: docs/04-reference/pipelines/chembl/activity-xwalk.csv
    markers:
      MISSING_DOC:
        classification: should_fix
        owner_issue: 3218
        rationale: Transformer-only fields need documentation reconciliation.
        fields:
          - manual_curation_flag
          - original_activity_id
      MISSING_GOLD:
        classification: deferred
        owner_issue: 3211
        rationale: Gold is disabled for chembl_activity; keep explicit until the Gold scope is re-opened.
        fields:
          - manual_curation_flag
          - original_activity_id

  - path: docs/04-reference/pipelines/chembl/cell-line-xwalk.csv
    markers:
      MISSING_DOC:
        classification: should_fix
        owner_issue: 3218
        rationale: ChEMBL reference entity fields need documentation coverage.
        fields:
          - cell_type
          - clo_id
      MISSING_GOLD:
        classification: deferred
        owner_issue: 3211
        rationale: Gold projection scope for ChEMBL reference entities is not yet finalized.
        fields:
          - cell_type
          - clo_id

  - path: docs/04-reference/pipelines/chembl/tissue-xwalk.csv
    markers:
      MISSING_DOC:
        classification: should_fix
        owner_issue: 3218
