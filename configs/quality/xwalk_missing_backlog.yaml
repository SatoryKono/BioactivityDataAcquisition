          - pref_name
          - bto_id
          - caloha_id
          - efo_id
          - uberon_id

  - path: docs/04-reference/pipelines/crossref/publication-xwalk.csv
    markers:
      MISSING_DOC:
        classification: should_fix
        owner_issue: 3218
        rationale: Publication provider docs need to match the implemented enriched field surface.
        fields:
          - affiliation_list
          - alternative_id
          - author_details
          - author_keys
          - author_orcids
          - content_domain_crossmark_restriction
          - content_domain_domains
          - is_oa
          - issn_electronic
          - issn_list
          - issn_print
          - journal_name_short
          - page_first
          - page_last
          - published
          - published_online
          - published_print
          - references
      MISSING_TRANSFORMER:
        classification: should_fix
        owner_issue: 3217
        rationale: Contract drift gates should decide whether these Crossref fields are implemented or removed.
        fields:
          - content_domain_crossmark_restriction
          - content_domain_domains
          - issn_electronic
          - issn_list
          - issn_print
