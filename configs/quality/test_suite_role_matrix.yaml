# Provider scenario ownership: integration vs e2e (T-10 / #6607).
schema_version: 1
owner: "@bioetl-platform"
linked_issues:
  - 6607
reviewed_on: "2026-07-27"

roles:
  integration:
    purpose: >-
      Adapter + pipeline correctness under VCR, field/source contracts, and
      error paths without requiring full control-plane completeness smoke.
    paths:
      - tests/integration/pipelines/
      - tests/integration/adapters/
    required_stages: [fetch_or_transform, silver_optional]
  e2e:
    purpose: >-
      Full local control-plane cycle (manifest/ledger/checkpoint) plus Medallion
      stages for representative paths only.
    paths:
      - tests/e2e/
    required_stages: [bronze, silver, gold_when_enabled, control_plane]
  e2e_smoke:
    purpose: Bounded PR-blocking completeness subset.
    marker: e2e_smoke
    required_stages: [bronze, silver, control_plane]

provider_ownership:
  chembl_activity:
    integration: primary_happy_path
    e2e: full_cycle_with_gold
  chembl_assay:
    integration: primary_happy_path
    e2e: field_and_confidence_checks
  pubchem_compound:
    integration: primary_happy_path
    e2e: control_plane_completeness_smoke
  uniprot_protein:
    integration: primary_happy_path
    e2e: full_cycle_with_gold
  composite_publication:
    integration: resume_rebuild_gates
    e2e: matrix_or_advanced_only

demotions:
  - path: tests/e2e/test_chembl_molecule_e2e.py::test_chembl_molecule_structural_fields
    action: retained_but_strengthened_schema_assert
    reason: >-
      Not deleted; field checks now reuse schema helpers so they are not a
      weak duplicate of integration happy-path coverage.
