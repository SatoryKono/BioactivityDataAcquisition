policy_scope: duplication_complexity_exemptions
linked_issue: '#5815'
owner: '@bioetl-architecture'
workflow: .github/workflows/duplication-complexity.yml
rationale: 'Complexity exemptions are temporary reviewable debt. Every retained path
  or function exemption must carry an owner, expiry, and concrete removal step.

  Expiry dates are intentionally staggered per owner group (#10527) so the whole
  registry can never lapse on a single shared cliff date again.

  '
path_entries:
- path: tests/*
  scopes:
  - xenon
  owner: '@bioetl-test-platform'
  expiry: '2026-10-31'
  removal_step: Keep test-only code on the dedicated test-complexity lane.
  progress_note: '2026-09-18 stagger review (#10527): exemption still required, no
    removal completed; retained until 2026-10-31, re-confirm test-only lane scope at
    next review.'
  rationale: Production xenon budget tracks src-only maintainability, not test scaffolding.
- path: src/memory/
  scopes:
  - xenon
  - critical_check
  owner: '@bioetl-memory'
  expiry: '2026-11-15'
  removal_step: Continue memory graph decomposition before removing the exemption.
  progress_note: '2026-09-18 stagger review (#10527): decomposition still in progress,
    no removal completed; retained until 2026-11-15, report next milestone at review.'
  rationale: Memory maintenance flows carry orchestration branches unrelated to BioETL
    runtime paths.
- path: src/bioetl/infrastructure/adapters/input/
  scopes:
  - xenon
  - critical_check
  owner: '@bioetl-config'
  expiry: '2026-11-30'
  removal_step: Collapse CSV fallback parsing behind smaller normalization helpers.
  progress_note: '2026-09-18 stagger review (#10527): fallback parsing still
    compatibility-heavy, no removal completed; retained until 2026-11-30.'
  rationale: Input adapter fallback readers remain compatibility-heavy.
- path: src/bioetl/application/services/dq/
  scopes:
  - xenon
  - critical_check
  owner: '@bioetl-dq'
  expiry: '2026-11-30'
  removal_step: Extract validation rule bundles from monolithic analyzer methods.
  progress_note: '2026-09-18 stagger review (#10527): analyzers still aggregate policy
    checks, no removal completed; retained until 2026-11-30.'
  rationale: DQ analyzers still aggregate many policy checks in single routines.
- path: src/bioetl/application/composite/
  scopes:
  - xenon
  - critical_check
  owner: '@bioetl-composite'
  expiry: '2026-12-15'
  removal_step: Continue splitting merge/checkpoint collaborators out of orchestration
    services.
  progress_note: '2026-09-18 stagger review (#10527): orchestration split still
    ongoing, no removal completed; retained until 2026-12-15.'
  rationale: Composite orchestration still carries wide branching and dependency surfaces.
- path: src/bioetl/application/pipelines/
  scopes:
  - critical_check
  owner: '@bioetl-application'
  expiry: '2026-12-15'
  removal_step: Move extractor parsing branches into dedicated parsing helpers.
  progress_note: '2026-09-18 stagger review (#10527): extractor branches still above
    the strict CC guard, no removal completed; retained until 2026-12-15.'
  rationale: Pipeline-specific extractors still exceed the strict CC guard in isolated
    spots.
- path: src/bioetl/application/pipelines/*/extractors/*
  scopes:
  - xenon
  owner: '@bioetl-application'
  expiry: '2026-12-15'
  removal_step: Break extraction/parsing flows into bounded parsing policies.
  progress_note: '2026-09-18 stagger review (#10527): extractor modules still broader
    than baseline, no removal completed; retained until 2026-12-15.'
  rationale: Extractor modules remain broader than the global xenon baseline allows.
- path: src/bioetl/interfaces/cli/
  scopes:
  - xenon
  - critical_check
  owner: '@bioetl-cli'
  expiry: '2027-01-15'
  removal_step: Trim presentation branching from runtime-command helpers.
  progress_note: '2026-09-18 stagger review (#10527): presentation branching still
    present, no removal completed; retained until 2027-01-15.'
  rationale: CLI formatting and command presentation code still carry branching noise.
- path: src/bioetl/composition/runtime_builders/
  scopes:
  - xenon
  - critical_check
  owner: '@bioetl-composition'
  expiry: '2027-01-15'
  removal_step: Split runtime builder orchestration into smaller assembly helpers.
  progress_note: '2026-09-18 stagger review (#10527): runtime assembly still
    multi-source, no removal completed; retained until 2027-01-15.'
  rationale: Runtime assembly still contains multi-source extraction and policy wiring
    branches.
- path: src/bioetl/composition/factories/services/
  scopes:
  - xenon
  - critical_check
  owner: '@bioetl-composition'
  expiry: '2027-01-15'
  removal_step: Reduce factory branch counts through service-specific assemblers.
  progress_note: '2026-09-18 stagger review (#10527): factory wiring still above the
    generic ratchet, no removal completed; retained until 2027-01-15.'
  rationale: Service factory wiring still exceeds the generic xenon ratchet.
- path: src/bioetl/infrastructure/storage/silver/
  scopes:
  - xenon
  - critical_check
  owner: '@bioetl-storage'
  expiry: '2027-01-31'
  removal_step: Continue splitting metadata write coercion from IO orchestration.
  progress_note: '2026-09-18 stagger review (#10527): write paths still mix coercion
    and persistence, no removal completed; retained until 2027-01-31.'
  rationale: Silver storage write paths still mix coercion, validation, and persistence.
- path: src/bioetl/infrastructure/control_plane/
  scopes:
  - xenon
  - critical_check
  owner: '@bioetl-control-plane'
  expiry: '2027-01-31'
  removal_step: Extract ID/fragment resolution helpers from control-plane artifacts.
  progress_note: '2026-09-18 stagger review (#10527): artifact orchestration still
    broad, no removal completed; retained until 2027-01-31.'
  rationale: Control-plane artifact orchestration still contains broad branching.
- path: src/bioetl/infrastructure/quarantine/
  scopes:
  - xenon
  - critical_check
  owner: '@bioetl-quarantine'
  expiry: '2027-01-31'
  removal_step: Decompose row normalization and filtering branches.
  progress_note: '2026-09-18 stagger review (#10527): normalization helpers still above
    baseline, no removal completed; retained until 2027-01-31.'
  rationale: Quarantine normalization helpers still exceed the global baseline.
- path: src/bioetl/infrastructure/observability/
  scopes:
  - xenon
  - critical_check
  owner: '@bioetl-observability'
  expiry: '2027-02-15'
  removal_step: Extract label normalization and dispatch policies into smaller helpers.
  progress_note: '2026-09-18 stagger review (#10527): dispatch paths still
    branch-heavy, no removal completed; retained until 2027-02-15.'
  rationale: Observability dispatch paths remain branch-heavy and cardinality-sensitive.
- path: src/bioetl/infrastructure/quality/
  scopes:
  - xenon
  - critical_check
  owner: '@bioetl-architecture'
  expiry: '2027-02-15'
  removal_step: Continue decomposing registry validation helpers by policy family.
  progress_note: '2026-09-18 stagger review (#10527): validators still centralize
    review rules, no removal completed; retained until 2027-02-15.'
  rationale: Quality governance validators intentionally centralize many review rules
    today.
function_entries:
- name: fetch_filtered_with_fallback
  scopes:
  - critical_check
  max_complexity: 25
  owner: '@bioetl-platform'
  expiry: '2026-11-30'
  removal_step: Split DOI/title fallback and batch routing into helper strategies.
  progress_note: '2026-09-18 stagger review (#10527): fallback fetcher still needs the
    higher cap, no removal completed; retained until 2026-11-30.'
  rationale: Provider-specific fallback fetchers still need a temporary higher cap.
- name: _request_with_retry
  scopes:
  - critical_check
  max_complexity: 20
  owner: '@bioetl-platform'
  expiry: '2026-12-15'
  removal_step: Extract retry/circuit-breaker branches into retry policies.
  progress_note: '2026-09-18 stagger review (#10527): retry wrapper still a shared
    choke point, no removal completed; retained until 2026-12-15.'
  rationale: Retry wrappers remain shared infrastructure choke points.
- name: fetch_batch
  scopes:
  - critical_check
  max_complexity: 15
  owner: '@bioetl-platform'
  expiry: '2027-01-15'
  removal_step: Separate batch planning from fallback item execution.
  progress_note: '2026-09-18 stagger review (#10527): batch fetcher still mixes
    aggregation and fallback, no removal completed; retained until 2027-01-15.'
  rationale: Batch fetchers still mix aggregation and fallback execution.
- name: load_filter_with_fallback
  scopes:
  - critical_check
  max_complexity: 15
  owner: '@bioetl-config'
  expiry: '2027-01-31'
  removal_step: Isolate file parsing fallbacks behind dedicated readers.
  progress_note: '2026-09-18 stagger review (#10527): config fallback loading still
    compatibility-driven, no removal completed; retained until 2027-01-31.'
  rationale: Config fallback loading remains compatibility-driven.
