version: 1
policy_scope: ci_coverage_surface_mapping
workflow_path: .github/workflows/tests.yml
threshold_policy:
  hard_coverage_threshold: 85
  hard_branch_coverage_threshold: 85
  enforced_in_job: coverage-verify
  notes: >-
    Coverage enforcement is centralized in the dedicated coverage-verify job.
    Other jobs may contribute shard data or execution confidence without
    directly enforcing the threshold. The coverage-verify job enforces both the
    existing line coverage threshold and the branch coverage threshold.
confidence_accounting:
  first_class_confidence: true
  hard_threshold_gate: coverage-verify
  blocking_confidence_lanes:
    - contract-confidence
    - control-plane-e2e
    - memory-tests
  notes: >-
    Repo health is determined by both the hard coverage threshold and the
    blocking confidence lanes. Contract-confidence is both a blocking offline
    confidence lane and a coverage contributor; live control-plane e2e and
    dedicated memory confidence remain outside the coverage combine path.
confidence_lane_policy:
  notes: >-
    Contract, e2e, and memory confidence lanes are blocking pass/fail gates.
    Offline contract tests also emit a coverage shard, while live e2e and
    environment-sensitive memory tests do not participate in the hard 85
    percent aggregate coverage threshold.
  required_blocking_jobs:
    - contract-confidence
    - control-plane-e2e
    - memory-tests
coverage_aggregation:
  artifact_pattern: coverage-data-*
  required_upstream_jobs:
    - smoke-check
    - contract-confidence
    - repo-backed-unit
    - unit-scripts-tooling
    - unit-filesystem-contracts
    - unit-subprocess-backed
    - test-matrix
  required_blocking_lane_shards:
    - reports/coverage/.coverage.smoke
    - reports/coverage/.coverage.contract-confidence
    - reports/coverage/.coverage.repo-backed-unit
    - reports/coverage/.coverage.unit-scripts-tooling
    - reports/coverage/.coverage.unit-filesystem-contracts
    - reports/coverage/.coverage.unit-subprocess-backed
    - reports/coverage/.coverage.unit-domain
    - reports/coverage/.coverage.unit-application
    - reports/coverage/.coverage.unit-infrastructure
    - reports/coverage/.coverage.unit-other
    - reports/coverage/.coverage.integration
    - reports/coverage/.coverage.security
  excluded_execution_surfaces:
    - live-provider-contracts
    - control-plane-e2e
    - memory-tests
lanes:
  - job: smoke-check
    lane_type: coverage_shard
    emits_coverage_artifact: true
    coverage_artifact: coverage-data-smoke
    coverage_file: reports/coverage/.coverage.smoke
    participates_in_hard_threshold: true
    threshold_enforced_in_job: false
    execution_confidence_role: dependency_smoke
    notes: >-
      Smoke check provides minimal dependency/import confidence before heavier
      lanes start, excludes memory-marked smoke tests, and contributes its real
      execution coverage to the centralized hard gate.
  - job: control-plane-e2e
    lane_type: execution_only
    blocking_confidence_lane: true
    emits_coverage_artifact: false
    participates_in_hard_threshold: false
    threshold_enforced_in_job: false
    execution_confidence_role: e2e_control_plane
    blocking_assertions:
      command_contains:
        - tests/e2e/test_pubchem_compound_e2e.py::test_pubchem_compound_full_cycle
        - --junitxml=reports/e2e/control-plane-completeness.xml
      required_artifacts:
        - control-plane-completeness
        - reports/e2e/control-plane-completeness.xml
    notes: >-
      Control-plane completeness smoke is a blocking execution-confidence lane.
      It does not feed the combined hard coverage threshold, but failure blocks
      the workflow independently from the percentage gate.
  - job: contract-confidence
    lane_type: coverage_shard
    blocking_confidence_lane: true
    emits_coverage_artifact: true
    coverage_artifact: coverage-data-contract-confidence
    coverage_file: reports/coverage/.coverage.contract-confidence
    participates_in_hard_threshold: true
    threshold_enforced_in_job: false
    execution_confidence_role: offline_contract_confidence
    blocking_assertions:
      command_contains:
        - tests/contract/
        - tests/unit/contracts/
        - -m "no_api or not network"
        - --junitxml=reports/test-telemetry/junit-contract-confidence.xml
      required_artifacts:
        - test-telemetry-contract-confidence
        - reports/test-telemetry/junit-contract-confidence.xml
        - coverage-data-contract-confidence
        - reports/coverage/.coverage.contract-confidence
    notes: >-
      Offline contract assertions are a blocking confidence lane for schema,
      snapshot, and replay-contract drift. Live provider contracts remain in the
      scheduled contract workflow, while this real offline execution also
      contributes a coverage shard without adding network dependence to the
      coverage threshold path.
  - job: track-d-gates
    lane_type: execution_only
    emits_coverage_artifact: false
    participates_in_hard_threshold: false
    threshold_enforced_in_job: false
    execution_confidence_role: fixture_and_linkage_gate
    notes: >-
      Track D linkage and fixture gates are execution-focused and remain outside
      the hard coverage combine path.
  - job: memory-tests
    lane_type: execution_only
    blocking_confidence_lane: true
    emits_coverage_artifact: false
    participates_in_hard_threshold: false
    threshold_enforced_in_job: false
    execution_confidence_role: neo4j_memory_isolated_execution
    blocking_assertions:
      command_contains:
        - tests/smoke/test_neo4j_memory_mcp_smoke.py
        - -m "memory"
        - --junitxml=reports/test-telemetry/junit-memory.xml
      required_artifacts:
        - test-telemetry-memory
        - reports/test-telemetry/junit-memory.xml
    notes: >-
      Neo4j project-memory and MCP tests run in a dedicated blocking execution
      lane so the main coverage-enforced path excludes environment-sensitive
      memory tooling without losing regression visibility.
  - job: test-fast
    lane_type: execution_only
    emits_coverage_artifact: false
    participates_in_hard_threshold: false
    threshold_enforced_in_job: false
    execution_confidence_role: fast_parallel_feedback
    notes: >-
      Fast unit and architecture execution stays as quick feedback only; the
      authoritative hard coverage path no longer depends on this duplicate lane.
  - job: repo-backed-unit
    lane_type: coverage_shard
    emits_coverage_artifact: true
    coverage_artifact: coverage-data-repo-backed-unit
    coverage_file: reports/coverage/.coverage.repo-backed-unit
    participates_in_hard_threshold: true
    threshold_enforced_in_job: false
    execution_confidence_role: repository_contract_execution
    notes: >-
      Serial repository-file-backed unit tests remain a dedicated blocking job
      and contribute their real execution coverage to coverage-verify.
  - job: unit-scripts-tooling
    lane_type: coverage_shard
    emits_coverage_artifact: true
    coverage_artifact: coverage-data-unit-scripts-tooling
    coverage_file: reports/coverage/.coverage.unit-scripts-tooling
    participates_in_hard_threshold: true
    threshold_enforced_in_job: false
    execution_confidence_role: scripts_tooling_execution
    notes: >-
      Serial scripts/tooling tests remain isolated from the parallel unit matrix
      and contribute any product-code coverage reached by their real execution.
  - job: unit-filesystem-contracts
    lane_type: coverage_shard
    emits_coverage_artifact: true
    coverage_artifact: coverage-data-unit-filesystem-contracts
    coverage_file: reports/coverage/.coverage.unit-filesystem-contracts
    participates_in_hard_threshold: true
    threshold_enforced_in_job: false
    execution_confidence_role: filesystem_contract_execution
    notes: >-
      Serial filesystem-contract tests remain isolated from the parallel unit
      matrix and contribute their product-code coverage to coverage-verify.
  - job: unit-subprocess-backed
    lane_type: coverage_shard
    emits_coverage_artifact: true
    coverage_artifact: coverage-data-unit-subprocess-backed
    coverage_file: reports/coverage/.coverage.unit-subprocess-backed
    participates_in_hard_threshold: true
    threshold_enforced_in_job: false
    execution_confidence_role: subprocess_backed_execution
    notes: >-
      Serial subprocess-backed unit tests remain isolated from the parallel
      unit matrix and contribute their product-code coverage to coverage-verify.
  - job: test-matrix
    lane_type: coverage_shard
    emits_coverage_artifact: true
    coverage_artifact: coverage-data-${matrix.test-group.name}
    coverage_python_versions:
      - "3.13"
    coverage_files:
      - reports/coverage/.coverage.unit-domain
      - reports/coverage/.coverage.unit-application
      - reports/coverage/.coverage.unit-infrastructure
      - reports/coverage/.coverage.unit-other
      - reports/coverage/.coverage.integration
      - reports/coverage/.coverage.security
    participates_in_hard_threshold: true
    threshold_enforced_in_job: false
    execution_confidence_role: breadth_parallel_execution
    notes: >-
      The matrix broadens execution confidence across unit, integration, and
      security suites, but only Python 3.13 legs emit coverage shards for the
      combined threshold. Python 3.12 is not a Tests workflow matrix version.
  - job: coverage-verify
    lane_type: hard_threshold_gate
    emits_coverage_artifact: false
    downloads_coverage_artifacts: true
    participates_in_hard_threshold: true
    threshold_enforced_in_job: true
    execution_confidence_role: serial_plus_combined_threshold
    known_exclusions:
      - tests/e2e
      - tests/contract
    notes: >-
      Coverage verification combines shard artifacts, runs the canonical serial
      subset, and is the only lane that enforces the hard 85 percent line and
      branch coverage thresholds. It still runs after completed upstream test
      failures because those lanes upload their coverage shards on failure; the
      producer fails closed when any required shard is absent and builds the
      SHA-bound XML and inventory candidate before enforcing thresholds.
      Offline contract execution arrives through the contract-confidence shard;
      live e2e, live provider contracts, and dedicated memory tests stay outside
      the aggregate.
  - job: coverage-inventory-currentness
    lane_type: artifact_currentness_gate
    emits_coverage_artifact: false
    downloads_coverage_artifacts: true
    participates_in_hard_threshold: false
    threshold_enforced_in_job: false
    execution_confidence_role: committed_inventory_currentness
    notes: >-
      This required downstream gate compares the committed inventory with the
      candidate emitted by a successful SHA-bound coverage-verify producer. It
      may fail while that producer remains a trusted source for the one-time
      inventory refresh, avoiding a bootstrap deadlock without weakening the
      currentness check.
  - job: duration-telemetry
    lane_type: telemetry_only
    emits_coverage_artifact: false
    participates_in_hard_threshold: false
    threshold_enforced_in_job: false
    execution_confidence_role: slow_test_reporting
    notes: >-
      Duration telemetry consumes JUnit artifacts to build slow-test reports; it
      is informational and does not change hard coverage semantics.
