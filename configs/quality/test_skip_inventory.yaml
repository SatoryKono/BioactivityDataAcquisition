version: 1
policy_scope: test_skip_inventory
owner: "@bioetl-platform"
linked_issue: 5007
source_of_truth:
  integration_vcr_policy_path: configs/quality/integration_vcr_policy.yaml
  contract_root: tests/contract/
  integration_root: tests/integration/
  e2e_root: tests/e2e/
  # Unit and architecture suppressions are not in this census.
  # Unconditional @pytest.mark.skip is forbidden there by
  # tests/architecture/test_test_skip_inventory.py (#9130).
allowed_categories:
  - conditional_environment_guard
  - git_diff_scope_guard
  - live_endpoint_unavailability
  - live_network_opt_in_guard
  - optional_local_fixture_absence
  - replay_fixture_pointer_guard
  - snapshot_refresh_write_mode
  - temporary_known_failure
entries:
  - path: tests/contract/_gold_schema_snapshot_registry.py
    suite: contract
    category: snapshot_refresh_write_mode
    owner: "@bioetl-contracts"
    linked_issue: "#5562"
    lifecycle: permanent_policy
    reviewed_skip_calls: 1
    vcr_related: false
    review_date: "2026-06-02"
    rationale: Gold schema snapshot refresh runs in explicit update mode and should skip after writing the reviewed artifact.
  - path: tests/contract/_provider_contract_drift.py
    suite: contract
    category: snapshot_refresh_write_mode
    owner: "@bioetl-contracts"
    linked_issue: "#5562"
    lifecycle: permanent_policy
    reviewed_skip_calls: 1
    vcr_related: false
    review_date: "2026-06-02"
    rationale:
      Provider contract snapshot refresh runs in explicit update mode and should skip after rewriting the governed
      snapshot.
  - path: tests/contract/_provider_contract_replay.py
    suite: contract
    category: replay_fixture_pointer_guard
    owner: "@bioetl-contracts"
    linked_issue: "#5562"
    lifecycle: permanent_policy
    reviewed_skip_calls: 1
    vcr_related: true
    review_date: "2026-06-02"
    rationale:
      Replay contract tests must skip closed when the cassette remains a Git LFS pointer instead of hydrated replay
      evidence.
  - path: tests/contract/conftest.py
