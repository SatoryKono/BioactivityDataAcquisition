e2e_matrix_replay_deferred:
  owner: "@bioetl-platform"
  linked_issue: "#9729"
  review_date: "2026-08-27"
  rationale: >
    Sixteen pipelines stay out of PR e2e-smoke via MATRIX_REPLAY_DEFERRED_PIPELINES
    selection exclusion, not pytest.skip. Do not expand PR smoke to this set
    without a dedicated owner and cassette contract.
  pipelines:
    - chembl_cell_line
    - chembl_tissue
    - chembl_compound_record
    - chembl_assay_parameters
    - chembl_protein_class
    - chembl_publication_similarity
    - chembl_publication_term
    - chembl_subcellular_fraction
    - chembl_target_component
    - chembl_target_protein_classification
    - composite_activity
    - composite_assay
    - composite_molecule
    - composite_publication
    - composite_target
    - uniprot_idmapping
