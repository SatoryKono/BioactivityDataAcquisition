schema_version: 1
source: configs/quality/config_validation_surface.yaml
policy:
  purpose: classify every tracked config surface by owner, semantic family, and validation mechanism so config growth cannot bypass governance.
  coverage_scope:
    - configs/**/*.yaml
    - configs/**/*.json
    - configs/**/*.csv
    - configs/**/*.md
  excluded_paths: []
families:
  - family_id: schema_contracts
    path_prefixes:
      - configs/_schema/
    owner: "@bioetl-config"
    validation_mechanism: json_schema_self_describing
    validation_depth: schema_level
    enforcing_surfaces:
      - tests/architecture/test_config_validation_surface.py
  - family_id: base_runtime
    path_prefixes:
      - configs/base/
    owner: "@bioetl-platform"
    validation_mechanism: pydantic_and_registry_guards
    validation_depth: semantic
    enforcing_surfaces:
      - tests/architecture/test_config_golden_master.py
  - family_id: composite_runtime
    path_prefixes:
      - configs/composites/
    owner: "@bioetl-composite"
    validation_mechanism: composite_config_loader_and_pipeline_reference_checks
    validation_depth: cross_file
    enforcing_surfaces:
      - tests/architecture/test_config_validation_surface.py
  - family_id: provider_contracts
    path_prefixes:
      - configs/contracts/
    owner: "@bioetl-contracts"
    validation_mechanism: contract_registry_and_schema_tests
    validation_depth: cross_file
    enforcing_surfaces:
      - tests/architecture/test_config_validation_surface.py
  - family_id: entity_pipelines
    path_prefixes:
      - configs/entities/
    owner: "@bioetl-pipelines"
    validation_mechanism: pipeline_config_loader_and_contract_reference_checks
    validation_depth: cross_file
    enforcing_surfaces:
      - tests/architecture/test_config_validation_surface.py
  - family_id: field_registry_semantics
    path_prefixes:
      - configs/field_registry/
    owner: "@bioetl-domain"
    validation_mechanism: semantic_field_registry_loader_and_contract_tests
    validation_depth: cross_file
    enforcing_surfaces:
      - tests/architecture/test_config_validation_surface.py
      - tests/integration/config/test_semantic_field_unification_contract.py
      - tests/unit/infrastructure/config/test_semantic_field_registry_loader.py
      - tests/unit/domain/normalization/test_publication_structured_fields.py
      - tests/unit/scripts/test_generate_pipeline_normalization_field_matrix.py
  - family_id: enum_sources
    path_prefixes:
      - configs/enums/
    owner: "@bioetl-domain"
    validation_mechanism: enum_externalization_tests
    validation_depth: semantic
    enforcing_surfaces:
      - tests/unit/domain/schemas/test_constants_yaml.py
  - family_id: provider_runtime
    path_prefixes:
      - configs/providers/
    owner: "@bioetl-infrastructure"
    validation_mechanism: source_config_loader_and_entity_registry_cross_checks
    validation_depth: cross_file
    enforcing_surfaces:
      - tests/architecture/test_config_validation_surface.py
  - family_id: quality_governance
    path_prefixes:
      - configs/quality/
    owner: "@bioetl-architecture"
    validation_mechanism: architecture_quality_guardrails
    validation_depth: governance_gate
    enforcing_surfaces:
      - tests/architecture/
  - family_id: vocabulary_sources
    path_prefixes:
      - configs/vocab/
    owner: "@bioetl-domain"
    validation_mechanism: vocabulary_snapshot_tests
    validation_depth: snapshot
    depth_rationale: Snapshot-backed vocab inventories remain governed by deterministic extracted artifacts today; semantic drift is validated by downstream contract suites rather than this family alone.
    migration_path: Promote vocabulary_sources to semantic or cross_file once a canonical loader can validate provider inventories directly against their extracted source fixtures and field registries.
    enforcing_surfaces:
      - tests/architecture/test_config_validation_surface.py
  - family_id: workflow_runtime
    path_prefixes:
      - configs/workflows/
    owner: "@bioetl-platform"
    validation_mechanism: workflow_config_loader_and_pipeline_reference_checks
    validation_depth: cross_file
    enforcing_surfaces:
      - tests/architecture/test_config_validation_surface.py
  - family_id: config_readme
    path_prefixes:
      - configs/README.md
    owner: "@bioetl-docs"
    validation_mechanism: documentation_link_guardrails
    validation_depth: documentation
    enforcing_surfaces:
      - tests/architecture/test_config_validation_surface.py
  - family_id: naming_exceptions
    path_prefixes:
      - configs/naming_exceptions.yaml
    owner: "@bioetl-architecture"
    validation_mechanism: naming_package_consistency_gate
    validation_depth: governance_gate
    enforcing_surfaces:
      - tests/architecture/test_naming_package_consistency_gate.py
