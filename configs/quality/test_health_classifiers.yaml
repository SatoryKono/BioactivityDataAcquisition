schema_version: 1
description: >
  Ordered regex rules for lightweight test-health failure classification.
  Rules are intentionally conservative and informational; pytest exit codes
  and quality gates remain the merge-blocking source of truth.
default_error_classification: setup_error
default_failure_classification: assertion
default_unknown_classification: unknown
classifiers:
  - category: timeout
    pattern: "\\b(timeout|timed out|pytest-timeout)\\b"
  - category: vcr_error
    pattern: "\\b(vcr|cassette|record_mode|network replay)\\b"
  - category: snapshot_drift
    pattern: "\\b(snapshot|syrupy|artifact drift)\\b"
  - category: environment
    pattern: "\\b(docker|neo4j|env var|environment|permission denied)\\b"
  - category: collection
    pattern: "\\b(collection|collect|importerror|modulenotfounderror)\\b"
  - category: setup_error
    pattern: "\\b(fixture|setup|teardown|config)\\b"
  - category: assertion
    pattern: "\\b(assertionerror|assert)\\b"
