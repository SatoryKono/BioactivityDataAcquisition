version: 1
safe_first_wave_candidates: []
safe_first_wave_rationale: No currently active business-only Silver filter is composite-independent
  on main. Every confirmed business-only Silver rule is either on a composite seed
  or a direct composite dependency and therefore requires downstream widening analysis
  before movement to Gold. Blocked pipelines below must carry explicit shadow-analysis
  metric references and composite impact checks before any rule can advance to candidate_for_gold.
pipelines:
  chembl_activity:
    downstream_role: composite_seed
    downstream_pipelines: &id001
    - composite_activity
    business_only_migration:
      state: blocked_by_downstream_composite
      blocked_by: *id001
    shadow_analysis:
      candidate_business_rules:
        required_fields:
        - assay_type
        - journal
        - pchembl_value
        - potential_duplicate
        - publication_year
        - standard_relation
        - standard_type
        - standard_units
        columns:
        - assay_type
        - inorganic_flag
        - molecule_type
        - potential_duplicate
        - publication_type
        - relationship_type
        - src_id
        - standard_relation
        - standard_type
        - standard_units
        - structure_type
        - target_type
        ranges:
        - confidence_score
        - pchembl_value
        - publication_year
        - standard_value
        exclude_if_present:
        - data_validity_comment
      shadow_metrics:
        current_rejections:
          metric: bioetl_silver_filter_rejections_total
          labels:
          - pipeline
          - run_type
          - reason_code
          - rule_type
          - field
        structural_shadow_comparisons:
          metric: bioetl_structural_policy_shadow_comparisons_total
          labels:
          - provider
          - entity_type
          - comparison
      composite_impact_checks:
      - composite_pipeline: composite_activity
        check_type: join_cardinality
        keys:
        - molecule_id
        - assay_id
        - target_id
        - publication_id
      - composite_pipeline: composite_activity
        check_type: field_sparsity
        fields: &id002
        - assay_type
        - confidence_score
        - data_validity_comment
        - inorganic_flag
        - journal
        - molecule_type
        - pchembl_value
        - potential_duplicate
      - composite_pipeline: composite_activity
        check_type: gold_projection_delta
        fields: *id002
    filters:
      required_fields:
        structural:
        - activity_id
        - record_id
        - src_id
        - canonical_smiles
        - bao_endpoint
        - bao_format
        - bao_label
        - activity_relation
        - activity_value
        - units
        - standard_value
        - standard_flag
        - uo_units
        - _state
        join_safety:
        - molecule_id
        - assay_id
        - target_id
        - publication_id
        - target_organism
        - assay_description
        business_only:
        - standard_type
        - standard_units
        - pchembl_value
        - journal
        - publication_year
        - assay_type
        - potential_duplicate
        - standard_relation
      columns:
        business_only:
        - assay_type
        - inorganic_flag
        - molecule_type
        - potential_duplicate
        - publication_type
        - relationship_type
        - src_id
        - standard_relation
        - standard_type
        - standard_units
        - structure_type
        - target_type
      ranges:
        structural:
        - activity_id
        business_only:
        - confidence_score
        - pchembl_value
        - publication_year
        - standard_value
