schema_version: 1
description: 'Composition ownership map (architecture audit M5 #6515).'
rule: src/bioetl/composition/** MUST contain wiring only; no business transforms/policy
packages:
- package: __init__.py
  responsibility: private composition helpers
- package: _json_types.py
  responsibility: private composition helpers
- package: _pipeline_execution.py
  responsibility: private composition helpers
- package: _registration.py
  responsibility: private composition helpers
- package: _resource_management.py
  responsibility: private composition helpers
- package: _service_protocols.py
  responsibility: private composition helpers
- package: _service_types.py
  responsibility: private composition helpers
- package: _services.py
  responsibility: private composition helpers
- package: _workflow_services.py
  responsibility: private composition helpers
- package: bootstrap
  responsibility: DI factories and runtime bootstrap (no domain policy)
- package: bootstrap_contexts.py
  responsibility: wiring/DI only
- package: bootstrap_logger.py
  responsibility: wiring/DI only
- package: builders.py
  responsibility: wiring/DI only
- package: composite_catalog.py
  responsibility: wiring/DI only
- package: config_catalog.py
  responsibility: wiring/DI only
- package: control_plane_runtime.py
  responsibility: wiring/DI only
- package: control_plane_service_access.py
  responsibility: wiring/DI only
- package: entrypoints.py
  responsibility: wiring/DI only
- package: execution_api.py
  responsibility: wiring/DI only
- package: factories
  responsibility: DI factories and runtime bootstrap (no domain policy)
- package: health_api.py
  responsibility: wiring/DI only
- package: health_service_access.py
  responsibility: wiring/DI only
- package: lazy_exports.py
  responsibility: wiring/DI only
- package: maintenance_api.py
  responsibility: wiring/DI only
- package: observability.py
  responsibility: wiring/DI only
- package: observability_runtime.py
  responsibility: wiring/DI only
- package: observability_resolution.py
  responsibility: wiring/DI only
- package: occurrence_identity.py
  responsibility: wiring/DI only
- package: pipeline_runner_request.py
  responsibility: wiring/DI only
- package: providers
  responsibility: wiring/DI only
- package: registry_api.py
  responsibility: wiring/DI only
- package: resources_runtime.py
  responsibility: wiring/DI only
- package: runtime_builders
  responsibility: Run orchestration wiring and control-plane assembly
- package: services
  responsibility: wiring/DI only
- package: types.py
  responsibility: wiring/DI only
forbidden_patterns:
- class Transformer
- class Aggregate
- def transform_
- def validate_business_
