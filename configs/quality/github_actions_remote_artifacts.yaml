version: 1.0.0
status: active
owner: Engineering / Security
purpose: >
  Repository-controlled integrity pins for remote executables fetched by GitHub
  Actions. Workflows MUST verify sha256 before using an artifact. Mutable
  installer scripts (curl|sh) are forbidden.

forbidden_url_substrings:
  - cli.coderabbit.ai/install.sh
  - cli.coderabbit.ai/install.ps1

artifacts:
