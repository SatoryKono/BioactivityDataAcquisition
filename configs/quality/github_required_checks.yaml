# Canonical applicability catalog for the pull-request coordinator (#12009).
# deployment.provider records the runnable workflow provider in this repo.
# It is not a ruleset enforcement mode and not a stored status-check context.
# owner_workflow and coordinator_workflow retain legacy definitions until #11930.
# They are compatibility references, not extra GitHub Actions declarations.
# policy.github_ruleset_*_enforcement records only the ruleset enforcement field.
# This schema has no field for stored ruleset contexts. See
# docs/00-project/governance/05-github-policy.md section 3.
# enforcement_verified_date is a catalog stamp. The boolean beside it is false
# so that stamp is not evidence of live merge protection. prose_claims bind
# that contract to governance prose (#12047). This schema does not store a
# ruleset-context snapshot.
schema_version: 1
version: 3
aggregator: pr-gate-complete
coordinator_workflow: .github/workflows/pr-required.yml
deployment:
  provider: github_actions
  config_path: .github/workflows/pr-required.yml
  workflow: PR Gate Complete
  github_status_transport: check_run
  github_app_binding: github_actions
  # Target coordinator job name. Not the context string stored on a ruleset.
  required_context: pr-gate-complete
  root_hygiene_context: Fast governance
  legacy_owner_retirement_issue: 11930
policy:
  allow_skipped_as_success: false
  allow_cancelled_as_success: false
  require_sha_binding: true
  not_applicable_requires_reason: true
  # Ruleset enforcement field only. Does not record stored status contexts.
  github_ruleset_13643213_enforcement: disabled
  github_ruleset_15730586_enforcement: disabled
  catalog_check_status: enforced
  # Runnable catalog provider, not the context stored on a disabled ruleset.
  enforcement_provider: github_actions
  # Catalog stamp from 2026-10-09. Not evidence that merge is blocked.
  enforcement_verified_date: "2026-10-09"
  enforcement_verified_date_is_live_protection_evidence: false
  prose_claim_doc_paths:
    - .github/CONTRIBUTING.md
    - .github/SECURITY.md
    - .github/workflows/pr-required.yml
    - docs/00-project/governance/05-github-policy.md
    - docs/03-guides/github-local-workflow.md
    - docs/03-guides/github-quick-reference.md
    - docs/04-reference/github-actions-workflows.md
    - docs/05-operations/ci-cd-integration.md
    - docs/05-operations/ci-workflow-map.md
    - docs/05-operations/release-checklist.md
    - docs/05-operations/runbooks/github-settings-quarterly-review.md
  prose_claims:
    - id: deployment-provider
      required_substrings: ["policy-anchor:deployment-provider", "github_actions"]
    - id: ruleset-enforcement-mode
      required_substrings:
        ["policy-anchor:ruleset-enforcement-mode", "13643213", "15730586", "enforcement: disabled"]
    - id: stored-ruleset-contexts
      required_substrings:
        [
          "policy-anchor:stored-ruleset-contexts",
          "ci/circleci: pr-gate-complete",
          "not active CircleCI protection",
        ]
    - id: target-gha-context
      required_substrings:
        ["policy-anchor:target-gha-context", "pr-gate-complete", "not the context stored"]
    - id: enforcement-verified-date
      required_substrings:
        [
          "policy-anchor:enforcement-verified-date",
          "2026-10-09",
          "not proof of active merge protection",
        ]
    - id: merge-block
      required_substrings:
        [
          "policy-anchor:merge-block",
          "pr-gate-complete",
          "does not by itself block merge",
          "does not confirm live server rulesets",
        ]
  prose_forbidden_substrings:
    - "are **active** as of 2026-10-05"
    - "the active provider is `.circleci/config.yml`"
    - "MUST be `enforcement: active`"
    - "Active main rulesets"
    - "CI runs through `.circleci/config.yml`"
    # Current claims that a ruleset already requires this job. Disabled
    # enforcement makes both phrases false for the live main rulesets.
    - "GitHub-required merge wall"
    - "enforces exactly one required status context"
    - "GitHub required context is job"
    - "requires only the final"
  # "GitHub Actions are disabled" is a current-configuration claim.
  # "historical" allows that phrase on the same line, or in the first paragraph
  # under a heading that contains the word. One blank line after the heading is
  # the Markdown separator. A later paragraph or section does not inherit the
  # heading. keep-disabled, disabled_manually, and individual workflow allow the
  # phrase only on the same line.
  prose_scoped_forbidden_phrases:
    - phrase: "GitHub Actions are disabled"
      line_allow_if_contains_any:
        - "historical"
        - "keep-disabled"
        - "disabled_manually"
        - "individual workflow"
canonical_checks:
  - id: ruff
    owner_workflow: .github/workflows/import-linter.yml
    owner_jobs: [lint]
    selectors: [ruff check, ruff format --check]
    events: [coordinator_pull_request, default_branch_push, workflow_call, workflow_dispatch]
    artifacts: []
    status: blocking
    duplicate_policy: forbidden
  - id: mypy
    owner_workflow: .github/workflows/type-checking.yml
    owner_jobs: [type-check]
    selectors: [mypy --strict src/bioetl]
    events: [coordinator_pull_request, default_branch_push, workflow_call, workflow_dispatch]
    artifacts: [type-checking-reports-on-failure]
    status: blocking
    duplicate_policy: forbidden
  - id: dependency-lock
    owner_workflow: .github/workflows/tests.yml
    owner_jobs: [dependency-preflight]
    selectors: [uv lock --check]
    events: [coordinator_pull_request, default_branch_push, workflow_call, workflow_dispatch]
    artifacts: [dependency-preflight-on-failure]
    status: blocking
    duplicate_policy: forbidden
  - id: architecture
    owner_workflow: .github/workflows/import-linter.yml
    owner_jobs: [arch-tests]
    selectors: [pytest tests/architecture -m not-slow-not-benchmark-not-memory]
    events: [coordinator_pull_request, default_branch_push, workflow_call, workflow_dispatch]
    artifacts: [architecture-telemetry]
    status: blocking
    duplicate_policy: forbidden
  - id: integration
    owner_workflow: .github/workflows/tests.yml
    owner_jobs: [test-matrix]
    selectors: [integration test-matrix shard]
    events: [coordinator_pull_request, default_branch_push, workflow_call, workflow_dispatch]
    artifacts: [coverage-shards, test-telemetry]
    status: blocking
    duplicate_policy: forbidden
  - id: dq-consistency
    owner_workflow: .github/workflows/tests.yml
    owner_jobs: [dq-consistency-gate]
    selectors: [python -m scripts.engineering.qa validate-dq-consistency]
    events: [coordinator_pull_request, default_branch_push, workflow_call, workflow_dispatch]
    artifacts: []
    status: blocking
    duplicate_policy: forbidden
  - id: root-hygiene
    owner_workflow: .github/workflows/root-hygiene.yml
    owner_jobs: [root-hygiene]
    selectors: [python -m scripts.engineering.repo.check_root_hygiene]
    events: [coordinator_pull_request, default_branch_push, workflow_call, workflow_dispatch]
    artifacts: []
    status: blocking
    duplicate_policy: forbidden
  - id: compiled-artifacts
    owner_workflow: .github/workflows/compiled-artifacts-block.yml
    owner_jobs: [no-pyc-check]
    selectors: [tracked compiled Python artifact scan]
    events: [coordinator_pull_request, default_branch_push, workflow_call]
    artifacts: []
    status: blocking
    duplicate_policy: forbidden
  - id: security-scans
    owner_workflow: .github/workflows/security.yml
    owner_jobs: [detect-secrets, pip-audit, bandit, gitleaks, osv-scanner]
    selectors: [detect-secrets, pip-audit, bandit, gitleaks, osv-scanner]
    events: [coordinator_pull_request, default_branch_push, workflow_call]
    artifacts: [security-reports]
    status: blocking
    duplicate_policy: forbidden
  - id: canonical-manifest-hashes
    owner_workflow: .github/workflows/consolidation-gates.yml
    owner_jobs: [canonical-manifest-hashes]
    selectors: [sha256sum tests tree, sha256sum src tree]
    events: [workflow_dispatch]
    artifacts: [canonical-manifest-hashes]
    status: advisory_evidence
    duplicate_policy: forbidden

  - id: commit-governance
    owner_workflow: .github/workflows/commit-lint.yml
    owner_jobs: [commit-lint]
    selectors: [conventional commit lint]
    events: [coordinator_pull_request, workflow_call]
    artifacts: []
    status: blocking
    duplicate_policy: forbidden
  - id: docs-governance
    owner_workflow: .github/workflows/docs.yml
    owner_jobs: [docs-governance, validate-mkdocs, check-diagram-drift]
    selectors: [documentation governance, mkdocs validation, diagram drift]
    events: [coordinator_pull_request, default_branch_push, workflow_call]
    artifacts: [rendered-pipeline-dataflows, rendered-diagrams]
    status: blocking
    duplicate_policy: forbidden

gates:
  - id: lint-arch
    display_name: Lint and Architecture Gates
    owner_workflow: .github/workflows/import-linter.yml
    owner_jobs: [lint, c901-governance, arch-tests, checks-complete]
    legacy_context: checks-complete
    decision: path_scoped
    paths:
      include: [src/**, tests/**, scripts/**, pyproject.toml, uv.lock, .importlinter, configs/**, .github/workflows/import-linter.yml, .github/workflows/pr-required.yml]
    allowed_results: [success, not_applicable]
    not_applicable_allowed: true
    not_applicable_reason_required: true
    artifacts: []
    sha_binding: true
  - id: tests
    display_name: Tests and Coverage
    owner_workflow: .github/workflows/tests.yml
    owner_jobs: [smoke-check, governance-preflight, test-fast, test-matrix, coverage-verify]
    legacy_context: coverage-verify
    decision: path_scoped
    paths:
      include: [src/**, tests/**, scripts/**, pyproject.toml, uv.lock, configs/**, .coderabbit.yaml, Makefile, .github/workflows/tests.yml, .github/workflows/pr-required.yml]
    allowed_results: [success, not_applicable]
    not_applicable_allowed: true
    not_applicable_reason_required: true
    artifacts: [coverage-verify]
    sha_binding: true
  - id: type-checking
    display_name: Type Checking (Strict)
    owner_workflow: .github/workflows/type-checking.yml
    owner_jobs: [type-check]
    legacy_context: type-check
    decision: path_scoped
    paths:
      include: [src/**, pyproject.toml, .github/workflows/type-checking.yml, .github/workflows/pr-required.yml]
    allowed_results: [success, not_applicable]
    not_applicable_allowed: true
    not_applicable_reason_required: true
    artifacts: []
    sha_binding: true
  - id: security
    display_name: Security Scans
    owner_workflow: .github/workflows/security.yml
    owner_jobs: [detect-secrets, pip-audit, bandit, gitleaks, osv-scanner]
    legacy_context: detect-secrets
    decision: path_scoped
    paths:
      include: [src/**, pyproject.toml, uv.lock, .gitleaks.toml, .gitleaksignore, .github/**, Dockerfile*, docker-compose*.yml, .github/workflows/security.yml]
    allowed_results: [success, not_applicable]
    not_applicable_allowed: true
    not_applicable_reason_required: true
    artifacts: []
    sha_binding: true

  - id: docker
    display_name: Docker Build and Compose
    owner_workflow: .github/workflows/docker.yml
    owner_jobs: [docker-runtime-contracts, docker-lint, docker-compose-validate, docker-build, docker-complete]
    legacy_context: docker-build
    decision: path_scoped
    paths:
      include: [grafana/tooling/router-v7-bridge/**, grafana/plugins/**, Dockerfile.bioetl, pyproject.toml, uv.lock, src/**, configs/**, docker-compose*.yml, scripts/ops/runtime/docker/**, scripts/engineering/qa/docker_stability_campaign/**, scripts/engineering/qa/run_docker_stability_campaign.py, scripts/engineering/ci/pr_gate.py, configs/quality/docker_runtime_contracts.yaml, configs/quality/github_required_checks.yaml, tests/architecture/test_docker_runtime_contracts.py, tests/unit/repo_backed/scripts/ops/docker/**, tests/unit/repo_backed/scripts/engineering/qa/test_run_docker_stability_campaign.py, .dockerignore, .github/workflows/docker.yml, .github/workflows/pr-required.yml, .github/actions/setup-python-uv/**, .github/actions/install-trivy/**]
    allowed_results: [success, not_applicable]
    not_applicable_allowed: true
    not_applicable_reason_required: true
    artifacts: []
    sha_binding: true
  - id: duplication
    display_name: Duplication and Complexity
    owner_workflow: .github/workflows/duplication-complexity.yml
    owner_jobs: [duplication-complexity]
    legacy_context: duplication-complexity
    decision: path_scoped
    paths:
      include: [src/**, scripts/**, tests/**, .github/tooling/**, .github/workflows/duplication-complexity.yml]
    allowed_results: [success, not_applicable]
    not_applicable_allowed: true
    not_applicable_reason_required: true
    artifacts: []
    sha_binding: true
  - id: root-hygiene
    display_name: Root Hygiene
    owner_workflow: .github/workflows/root-hygiene.yml
    owner_jobs: [root-hygiene]
    legacy_context: root-hygiene
    decision: always_required
    paths: []
    allowed_results: [success]
    not_applicable_allowed: false
    artifacts: []
    sha_binding: true
  - id: generated-artifacts
    display_name: Schema and Generated Artifacts Governance
    owner_workflow: .github/workflows/schema-governance.yml
    owner_jobs: [generated-artifacts, contracts-export, schema-parity, schema-governance-status]
    legacy_context: schema-governance-status
    decision: path_scoped
    paths:
      include: [src/bioetl/domain/schemas/**, src/bioetl/domain/contracts/**, src/bioetl/domain/entities/**, src/bioetl/infrastructure/schemas/**, tests/contract/silver_schemas/**, scripts/schema/**, scripts/engineering/ci/pr_gate.py, configs/quality/github_required_checks.yaml, docs/03-guides/silver-schema-testing-guide.md, docs/03-data-model/json-field-typing-inventory.md, .github/workflows/schema-governance.yml, .github/workflows/pr-required.yml, configs/base/contract_registry.yaml, configs/contracts/**, configs/entities/**, reports/quality/contract-coverage-matrix.json, reports/quality/pipeline-config-contract-ownership-map.json, scripts/engineering/qa/report_contract_coverage_matrix.py, scripts/engineering/qa/report_pipeline_config_contract_ownership.py, scripts/engineering/ci/validate_contract_*.py, scripts/engineering/ci/validate_registry_dq_refs.py, scripts/engineering/ci/validate_schema_classifier_gate.py, tests/architecture/test_contract_coverage_matrix_*.py, tests/architecture/test_pipeline_config_contract_ownership_map_*.py, .github/workflows/contract-governance-*.yml]
    allowed_results: [success, not_applicable]
    not_applicable_allowed: true
    not_applicable_reason_required: true
    artifacts: []
    sha_binding: true
  - id: compiled-artifacts
    display_name: Compiled Artifacts Block
    owner_workflow: .github/workflows/compiled-artifacts-block.yml
    owner_jobs: [no-pyc-check]
    legacy_context: no-pyc-check
    decision: always_required
    paths: []
    allowed_results: [success]
    not_applicable_allowed: false
    artifacts: []
    sha_binding: true
  - id: commit-governance
    display_name: Commit Governance
    owner_workflow: .github/workflows/commit-lint.yml
    owner_jobs: [commit-lint]
    legacy_context: commit-lint
    decision: path_scoped
    paths:
      include: ["**"]
      exclude: [docs/**, "*.md", .ai/**, .github/workflows/**, LICENSE]
    unknown_path_anchor: false
    allowed_results: [success, not_applicable]
    not_applicable_allowed: true
    not_applicable_reason_required: true
    artifacts: []
    sha_binding: true
  - id: docs-governance
    display_name: Documentation Governance
    owner_workflow: .github/workflows/docs.yml
    owner_jobs: [docs-governance, validate-mkdocs, check-diagram-drift]
    legacy_context: docs-governance
    decision: path_scoped
    paths:
      include: [.gitignore, .gemini/config.yaml, AGENTS.md, README.md, CHANGELOG.md, LICENSE, .ai/**, .cursor/**, .windsurf/**, .codex/**, .junie/**, .devin/**, .github/copilot-instructions.md, .github/instructions/**, .github/workflows/**, .github/CONTRIBUTING.md, .github/SECURITY.md, .github/actions/setup-python-uv/**, grafana/**, reports/**, tests/**, grafana/README.md, docs/**, scripts/docs/**, scripts/diagrams/**, scripts/schema/**, scripts/engineering/ci/pr_gate.py, scripts/engineering/qa/check_xwalk_missing_backlog.py, configs/base/**, configs/entities/**, configs/providers/**, configs/composites/**, configs/workflows/**, configs/contracts/**, configs/quality/github_required_checks.yaml, configs/quality/xwalk_missing_backlog.yaml, src/bioetl/application/pipelines/chembl/activity_transformer.py, src/bioetl/composition/factories/pipeline/_registry_manifest_chembl.py, src/bioetl/domain/schemas/**, src/bioetl/infrastructure/schemas/**, src/bioetl/domain/contracts/gold/**, tests/architecture/test_ai_runtime_governance_links.py, tests/architecture/test_check_doc_links_guardrails.py, tests/unit/scripts/qa/test_check_xwalk_missing_backlog.py, tests/unit/repo_backed/scripts/diagrams/test_generate_pipeline_dataflows.py, mkdocs.yml, pyproject.toml, uv.lock]
    allowed_results: [success, not_applicable]
    not_applicable_allowed: true
    not_applicable_reason_required: true
    artifacts: [rendered-pipeline-dataflows, rendered-diagrams]
    sha_binding: true
