# configs/dq/entities/chembl/compound_record.yaml
# ChEMBL Compound Record-specific DQ rules
# Inherits from: _defaults.yaml → providers/chembl.yaml

version: "1.0.0"
provider: chembl
entity: compound_record

# Thresholds: inherit from provider

# =============================================================================
# Compound Record-Specific Field Validations
# =============================================================================
field_validations:
  - field: record_id
    type: range
    min: 1
    nullable: false
    error_message: "Record ID is required and must be positive"

  - field: molecule_id
    type: pattern
    pattern: '^CHEMBL\d+$'
    nullable: false
    error_message: "molecule_id must match CHEMBL format"

  - field: publication_id
    type: pattern
    pattern: '^CHEMBL\d+$'
    nullable: false
    error_message: "publication_id must match CHEMBL format"

  - field: src_id
    type: range
    min: 1
    nullable: true

# =============================================================================
# Cross-Field Validations
# =============================================================================
cross_field_validations:
  - name: record_linkage
    fields:
      - molecule_id
      - publication_id
    condition: all_present
    error_message: "Both molecule and document IDs are required"

# =============================================================================
# Conditional Validations
# =============================================================================
conditional_validations: []
