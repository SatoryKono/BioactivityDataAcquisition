# configs/quality/entities/chembl/target.yaml
# ChEMBL Target-specific DQ rules
# Inherits from: _defaults.yaml → providers/chembl.yaml

version: "1.1.0"
provider: chembl
entity: target

# Thresholds: inherit from provider

# =============================================================================
# Target-Specific Field Validations
# =============================================================================
field_validations:
  - field: target_id
    type: required
    nullable: false
    error_message: "Target ChEMBL ID is required"

  # Comprehensive target type enum (all known ChEMBL target types)
  - field: target_type
    type: enum
    allowed:
      - SINGLE PROTEIN
      - PROTEIN COMPLEX
      - PROTEIN FAMILY
      - SELECTIVITY GROUP
      - ORGANISM
      - TISSUE
      - CELL-LINE
      - SUBCELLULAR
      - UNKNOWN
      - CHIMERIC PROTEIN
      - PROTEIN-PROTEIN INTERACTION
      - NUCLEIC-ACID
      - METAL
      - LIPID
      - MACROMOLECULE
      - PHENOTYPE
      - ADMET
    nullable: true
    error_message: "Invalid target_type value"

  # Organism in binomial nomenclature
  - field: organism
    type: pattern
    pattern: "^[A-Z][a-z]+ [a-z]+.*$"
    nullable: true
    error_message: "organism should be in binomial nomenclature"

  # NCBI Taxonomy ID
  - field: tax_id
    type: range
    min: 1
    max: 10000000
    nullable: true

# =============================================================================
# Cross-Field Validations
# =============================================================================
cross_field_validations:
  # Target must have both ID and preferred name
  - name: target_identifiable
    fields:
      - target_id
      - pref_name
    condition: all_present
    error_message: "Target must have ID and preferred name"

# =============================================================================
# Conditional Validations
# =============================================================================
conditional_validations: []

# =============================================================================
# Key Nullability Policy for Silver writes
# =============================================================================
# Documented per pipeline: merge(primary) and partition key nullability.
key_nullability:
  - field: target_id
    key_type: merge
    nullable: false
  - field: target_type
    key_type: partition
    nullable: false
