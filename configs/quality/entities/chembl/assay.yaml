# configs/quality/entities/chembl/assay.yaml
# ChEMBL Assay-specific DQ rules
# Inherits from: _defaults.yaml → providers/chembl.yaml

version: "1.1.0"
provider: chembl
entity: assay

# Thresholds: inherit from provider

# =============================================================================
# Assay-Specific Field Validations
# =============================================================================
field_validations:
  - field: assay_id
    type: required
    nullable: false
    error_message: "Assay ID is required"

  - field: assay_type
    type: enum
    allowed:
      - B  # Binding
      - F  # Functional
      - A  # ADMET
      - T  # Toxicity
      - P  # Physicochemical
      - U  # Unclassified
    nullable: false
    error_message: "assay_type must be one of B, F, A, T, P, U"

  # Confidence score for target assignment (0-9 scale)
  - field: confidence_score
    type: range
    min: 0
    max: 9
    nullable: true

  # Relationship type between assay and target
  - field: relationship_type
    type: enum
    allowed:
      - D  # Direct
      - H  # Homologous
      - M  # Molecular
      - N  # Non-molecular
      - S  # Subcellular
      - U  # Unclassified
    nullable: true

# =============================================================================
# Cross-Field Validations
# =============================================================================
cross_field_validations:
  # Assay must have both ID and description for identifiability
  - name: assay_identifiable
    fields:
      - assay_id
      - description
    condition: all_present
    error_message: "Assay must have ID and description"

# =============================================================================
# Conditional Validations
# =============================================================================
conditional_validations: []

# =============================================================================
# Key Nullability Policy for Silver writes
# =============================================================================
# Documented per pipeline: merge(primary) and partition key nullability.
key_nullability:
  - field: assay_id
    key_type: merge
    nullable: false
  - field: assay_type
    key_type: partition
    nullable: false
