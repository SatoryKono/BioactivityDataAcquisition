# configs/quality/entities/chembl/cell_line.yaml
# ChEMBL Cell Line-specific DQ rules
# Inherits from: _defaults.yaml → providers/chembl.yaml

version: "1.0.0"
provider: chembl
entity: cell_line

# Thresholds: inherit from provider

# =============================================================================
# Cell Line-Specific Field Validations
# =============================================================================
field_validations:
  - field: cell_id
    type: pattern
    pattern: '^CHEMBL\d+$'
    nullable: false
    error_message: "cell_id must match CHEMBL format"

  - field: cell_name
    type: pattern
    pattern: '^.{1,200}$'
    nullable: false
    error_message: "cell_name is required and must not exceed 200 chars"

  - field: cellosaurus_id
    type: pattern
    pattern: '^CVCL_[A-Z0-9]+$'
    nullable: true
    error_message: "cellosaurus_id must match CVCL format"

  - field: cell_source_taxonomy_id
    type: range
    min: 1
    max: 10000000
    nullable: true

# =============================================================================
# Cross-Field Validations
# =============================================================================
cross_field_validations: []

# =============================================================================
# Conditional Validations
# =============================================================================
conditional_validations: []

# =============================================================================
# Key Nullability Policy for Silver writes
# =============================================================================
# Documented per pipeline: merge(primary) and partition key nullability.
key_nullability:
  - field: cell_id
    key_type: merge
    nullable: false
