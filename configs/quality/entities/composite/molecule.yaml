version: "1.0.0"
provider: composite
entity: molecule

dq_overrides:
  soft_fail_threshold: 0.10
  hard_fail_threshold: 0.50
  required_fields:
    - molecule_id
  field_validations:
    - field: molecule_id
      type: required
      nullable: false
      error_message: composite_molecule requires the seed molecule identifier
    - field: canonical_smiles
      type: custom
      validator: smiles_validator
      nullable: true
      error_message: canonical_smiles must remain chemically valid when present
    - field: inchi_key
      type: pattern
      pattern: '^[A-Z]{14}-[A-Z]{10}-[A-Z]$'
      nullable: true
      error_message: inchi_key must remain a canonical uppercase InChIKey
    - field: standardized_inchi_key
      type: pattern
      pattern: '^[A-Z]{14}-[A-Z]{10}-[A-Z]$'
      nullable: true
      error_message: standardized_inchi_key must remain a canonical uppercase InChIKey
    - field: structure_parent_key
      type: pattern
      pattern: '^[A-Z]{14}-[A-Z]{10}-[A-Z]$'
      nullable: true
      error_message: structure_parent_key must remain a canonical uppercase InChIKey
    - field: molecular_weight
      type: range
      min: 10
      max: 10000
      nullable: true
      error_message: molecular_weight must remain within the governed molecule range
    - field: max_phase
      type: enum
      allowed:
        - -1
        - 0
        - 0.5
        - 1
        - 2
        - 3
        - 4
      nullable: true
      error_message: max_phase must remain in the declared development-phase vocabulary
  cross_field_validations:
    - name: structure_present
      fields:
        - canonical_smiles
        - inchi_key
        - standardized_inchi_key
      condition: any_present
      error_message: composite_molecule must retain at least one canonical structure anchor
