version: "1.0.0"
provider: composite
entity: target

dq_overrides:
  soft_fail_threshold: 0.10
  hard_fail_threshold: 0.50
  required_fields:
    - target_id
    - pref_name
  field_validations:
    - field: target_id
      type: required
      nullable: false
      error_message: composite_target requires the seed target identifier
    - field: uniprot_accession
      type: pattern
      pattern: '^[A-Z0-9]{6,10}$'
      nullable: true
      error_message: uniprot_accession must remain a canonical UniProt accession when present
    - field: mapping_status
      type: enum
      allowed:
        - found
        - not_found
        - error
        - multiple
      nullable: true
      error_message: mapping_status must remain within the governed UniProt mapping status set
    - field: taxonomy_id
      type: range
      min: 1
      max: 10000000
      nullable: true
      error_message: taxonomy_id must remain a positive NCBI taxonomy identifier
    - field: organism
      type: custom
      validator: validate_target_organism_supported_name
      nullable: true
      error_message: organism must remain a supported target organism label when present
    - field: pref_name
      type: max_length
      max_length: 500
      nullable: false
      error_message: pref_name must remain a bounded canonical target label
  cross_field_validations:
    - name: target_identifiable
      fields:
        - target_id
        - pref_name
      condition: all_present
      error_message: composite_target must retain both target_id and pref_name
    - name: component_ids_require_component_types
      fields:
        - component_ids
        - component_types
      condition: conditional_required
      trigger_field: component_ids
      required_field: component_types
      error_message: component_types must be populated when component_ids are present
