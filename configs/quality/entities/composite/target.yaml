# configs/quality/entities/composite/target.yaml
# Composite Target-specific DQ rules
# Applied to merged output of composite target pipeline.

version: "1.0.0"
provider: composite
entity: target

# =============================================================================
# Composite Thresholds
# =============================================================================
thresholds:
  soft_fail_threshold: 0.10  # 10% errors = warning
  hard_fail_threshold: 0.30  # 30% errors = failure

# =============================================================================
# Required Fields in Gold Output
# =============================================================================
required_fields:
  - target_id
  - pref_name

# =============================================================================
# Field-Level Validation Rules
# =============================================================================
field_validations:
  target_id:
    type: string
    nullable: false
    pattern: "^CHEMBL\\d+$"
    description: "ChEMBL target ID (primary key)"

  uniprot_accession:
    type: string
    nullable: true
    pattern: "^[A-Z0-9]{6,10}$"
    description: "UniProt accession (null if not_found)"

  mapping_status:
    type: enum
    nullable: true
    allowed: ["found", "not_found", "error"]
    description: "UniProt ID mapping resolution status"

  target_type:
    type: string
    nullable: true
    description: "Target classification (SINGLE PROTEIN, ORGANISM, etc.)"

  taxonomy_id:
    type: integer
    nullable: true
    min_value: 1
    description: "NCBI Taxonomy ID"

  function_comment:
    type: string
    nullable: true
    description: "Functional description from UniProt FUNCTION comment"

  go_terms:
    type: string
    nullable: true
    description: "Gene Ontology terms (JSON-serialized list)"

  disease_involvement:
    type: string
    nullable: true
    description: "Disease associations from UniProt DISEASE comment"

  subcellular_location:
    type: string
    nullable: true
    description: "Subcellular localization from UniProt"

  annotation_score:
    type: integer
    nullable: true
    min_value: 1
    max_value: 5
    description: "UniProt annotation score (1-5)"
