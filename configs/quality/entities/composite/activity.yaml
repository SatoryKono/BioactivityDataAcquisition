version: "1.0.0"
provider: composite
entity: activity

dq_overrides:
  soft_fail_threshold: 0.10
  hard_fail_threshold: 0.30
  required_fields:
    - activity_id
    - molecule_id
    - publication_id
  field_validations:
    - field: activity_id
      type: required
      nullable: false
      error_message: composite_activity requires the seed activity identifier
    - field: molecule_id
      type: required
      nullable: false
      error_message: composite_activity requires the seed molecule join anchor
    - field: publication_id
      type: required
      nullable: false
      error_message: composite_activity requires the seed publication join anchor
    - field: target_id
      type: pattern
      pattern: '^CHEMBL\d+$'
      nullable: true
      error_message: target_id must preserve canonical ChEMBL identifier format
    - field: taxonomy_id
      type: range
      min: 1
      max: 10000000
      nullable: true
      error_message: taxonomy_id must be a positive NCBI taxonomy identifier
    - field: canonical_smiles
      type: custom
      validator: smiles_validator
      nullable: true
      error_message: canonical_smiles must remain chemically valid when present
    - field: standard_type
      type: enum
      allowed:
        - IC50
        - Ki
        - Kd
        - EC50
        - Potency
        - Activity
        - Ratio EC50
        - IC90
        - ED50
        - CC50
        - MIC
        - ID50
      nullable: true
      error_message: standard_type must remain in the governed activity vocabulary
    - field: standard_relation
      type: enum
      allowed:
        - '='
        - <
        - <=
        - '>'
        - '>='
        - '~'
      nullable: true
      error_message: standard_relation must remain in the governed comparator set
  cross_field_validations:
    - name: activity_join_anchor_complete
      fields:
        - activity_id
        - molecule_id
        - publication_id
      condition: all_present
      error_message: composite_activity must retain the seed activity and dependency join anchors
    - name: standard_value_requires_units
      fields:
        - standard_value
        - standard_units
      condition: conditional_required
      trigger_field: standard_value
      required_field: standard_units
      error_message: standard_units are required when standard_value is populated
