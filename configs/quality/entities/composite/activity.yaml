# configs/quality/entities/composite/activity.yaml
# Composite Activity-specific DQ rules
# Applied to merged output of composite activity pipeline.

version: "1.0.0"
provider: composite
entity: activity

# =============================================================================
# Composite Thresholds
# =============================================================================
thresholds:
  soft_fail_threshold: 0.10  # 10% errors = warning
  hard_fail_threshold: 0.30  # 30% errors = failure

# =============================================================================
# Required Fields in Gold Output
# =============================================================================
required_fields:
  - activity_id
  - molecule_id
  - assay_id

# =============================================================================
# Field-Level Validation Rules
# =============================================================================
field_validations:
  activity_id:
    type: string
    nullable: false
    description: "ChEMBL activity ID (primary key)"

  molecule_id:
    type: string
    nullable: false
    pattern: "^CHEMBL\\d+$"
    description: "ChEMBL molecule ID (FK)"

  assay_id:
    type: string
    nullable: false
    pattern: "^CHEMBL\\d+$"
    description: "ChEMBL assay ID (FK)"

  target_id:
    type: string
    nullable: true
    pattern: "^CHEMBL\\d+$"
    description: "ChEMBL target ID (FK, optional)"

  publication_id:
    type: string
    nullable: true
    pattern: "^CHEMBL\\d+$"
    description: "ChEMBL publication ID (FK, optional)"

  standard_value:
    type: float
    nullable: true
    min_value: 0
    description: "Standardized activity value (non-negative)"

  pchembl_value:
    type: float
    nullable: true
    min_value: 0
    max_value: 14
    description: "-log10 molar activity (0-14 range)"

  record_id:
    type: integer
    nullable: true
    min_value: 1
    description: "Compound record ID (from dependency)"
