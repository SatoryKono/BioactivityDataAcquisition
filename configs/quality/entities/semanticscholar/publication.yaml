# configs/quality/entities/semanticscholar/publication.yaml
# Semantic Scholar Publication-specific DQ rules
# Inherits from: _defaults.yaml → providers/semanticscholar.yaml

version: "1.0.0"
provider: semanticscholar
entity: publication

# Thresholds: inherit from provider (soft 0.15, hard 0.40)

# =============================================================================
# Publication-Specific Field Validations
# =============================================================================
field_validations:
  - field: paper_id
    type: pattern
    pattern: '^[a-f0-9]{40}$'
    nullable: false
    error_message: "paper_id is required and must be a 40-char hex string"

  - field: pmid
    type: range
    min: 1
    max: 10000000000
    nullable: true
    error_message: "PubMed ID must be a positive integer"

  - field: doi
    type: pattern
    pattern: '^10\.\d{4,}/\S+$'
    nullable: true
    error_message: "DOI must match format 10.XXXX/suffix (no whitespace)"

  - field: title
    type: max_length
    max_length: 2000
    nullable: true
    error_message: "Title must not exceed 2000 characters"

  - field: title
    type: not_null
    nullable: true
    severity: warn
    error_message: "Missing title — record will be filtered before Gold"

  - field: title
    type: pattern
    pattern: '\S'
    nullable: true
    severity: warn
    error_message: "Title should not be empty or whitespace-only"

  - field: publication_year
    type: range
    min: 1500
    max: 2100
    nullable: true
    error_message: "Publication year out of valid range"

  - field: publication_year
    type: range
    min: 1950
    nullable: true
    severity: warn
    error_message: "Publication year before 1950 — will be filtered at Gold stage"

  - field: publication_type
    type: pattern
    # After normalization: pipe-delimited canonical kebab-case values
    # e.g. "journal-article", "journal-article|review", "book-chapter|other"
    pattern: '^[a-z][a-z0-9-]+(\|[a-z][a-z0-9-]+)*$'
    nullable: true
    severity: warn
    error_message: "Unexpected publication_type format after normalization"

  - field: citations_received
    type: range
    min: 0
    nullable: true
    error_message: "Citation count must be non-negative"

  - field: citations_received
    type: range
    min: 0
    max: 10000000
    nullable: true
    severity: warn
    error_message: "Unusually high citation count"

  - field: citations_made
    type: range
    min: 0
    nullable: true
    error_message: "Reference count must be non-negative"

  - field: influential_citation_count
    type: range
    min: 0
    nullable: true
    error_message: "Influential citation count must be non-negative"

# =============================================================================
# Cross-Field Validations
# =============================================================================
cross_field_validations:
  - name: publication_identifiable
    fields:
      - paper_id
      - title
    condition: all_present
    error_message: "Publication must have paper_id and title"

# =============================================================================
# Conditional Validations
# =============================================================================
conditional_validations:
  - name: journal_article_requires_title
    condition_field: publication_type
    condition_value: journal-article
    condition_operator: eq
    then_validations:
      - field: title
        type: not_null
        nullable: false
        error_message: "Journal articles must have a title"

# =============================================================================
# Key Nullability Policy for Silver writes
# =============================================================================
# Documented per pipeline: merge(primary) and partition key nullability.
key_nullability:
  - field: paper_id
    key_type: merge
    nullable: false
