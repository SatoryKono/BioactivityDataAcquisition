measured_only_review_workflow:
  review_cadence: quarterly
  required_checks:
  - verify no first-party src imports remain
  - confirm measured-only docstring tracking stays aligned with the YAML allowlist
  - run targeted owner tests before deciding retain, promote, or remove
  - refresh the generated compatibility snapshot after lifecycle changes
  allowed_outcomes:
  - retain
  - promote
  - remove
  promotion_requires_curated_row: true
retained_public_entrypoint_burden_policy:
  linked_issue: '#4575'
  blocking_metric: retained_public_entrypoint_burden
  first_party_growth_policy: fail_fast_on_growth
  tracked_facades:
  - bioetl.composition.entrypoints
  - bioetl.composition.health_api
  - bioetl.infrastructure.config
  - bioetl.application.services.control_plane
  rationale: Retained public entrypoints are stable external API, but first-party imports through those facades remain architectural
    burden and must be visible as blocking governance debt when the reviewed surface grows.
