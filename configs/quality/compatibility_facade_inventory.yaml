first_safe_removal_wave:
  linked_issue: '#5485'
  review_date: '2026-06-19'
  rows:
  - path: src/bioetl/interfaces/cli/commands/maintenance.py
    owner: bioetl.interfaces.cli.commands
    previous_status: public-entrypoint
    surface_classification: confirmed-unused
    action: remove_from_retained_entrypoint_debt_inventory
    rationale: The top-level maintenance command no longer has first-party `src/`
      or test importers in the compatibility importer census, so it no longer needs
      retained-entrypoint debt tracking.
    migration_prerequisites:
    - Keep public CLI discovery wired through `bioetl.interfaces.cli.commands.maintenance`
      without reintroducing new first-party importer debt.
    - Keep ordinary runtime maintenance access narrowed to `src/bioetl/interfaces/cli/commands/domains/maintenance/service_access.py`.
    - Treat any future retirement of the public maintenance command itself as a
      separate external-breaking-change review, not part of this debt ratchet wave.
