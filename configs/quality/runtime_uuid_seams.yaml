# Runtime UUID generation seam inventory.
# New uuid4 call sites in application/composition must be classified here.
version: 1
policy:
  owner: architecture-governance
  replay_critical_rule: replay-critical identity must be explicit or deterministic; uuid4 is allowed only for operational correlation/default launch IDs.
  migration_policy: migrate replay-critical UUID generation to domain deterministic identity or an injected ID port before use in replay artifacts.
review_history:
  - issue: "#4926"
    reviewed_on: "2026-06-01"
    owner: architecture-governance
    outcome: held_flat_with_zero_replay_critical_seams
    rationale: Runtime UUID seam count remains 14 and replay-critical UUID seam count remains 0; exact replay paths must inject deterministic factories or explicit IDs before producing replay artifacts.
  - issue: "#4951"
    reviewed_on: "2026-06-01"
    owner: architecture-governance
    outcome: deterministic_factory_enforcement_confirmed
    rationale: Application and composition UUID seams remain classified, replay-critical random identity stays at zero, and exact replay requirements are documented per seam through explicit factory or run_id injection policy.
  - issue: "#4968"
    reviewed_on: "2026-06-01"
    owner: architecture-governance
    outcome: deterministic_factory_evidence_confirmed
    rationale: Runtime UUID seam count fell from 14 to 13 after the obsolete observability smoke seam was removed, replay-critical random identity remains zero, and retained application/composition seams have targeted deterministic factory or explicit run_id coverage in the referenced guard tests.
  - issue: "#4975"
    reviewed_on: "2026-06-02"
    owner: architecture-governance
    outcome: replay_identity_fail_closed_enforced
    rationale: Exact replay application and composition seams now fail closed without explicit run_id or injected run_id_factory, while residual uuid4 seams remain classified as operational-only defaults or injectable factories.
  - issue: "#4997"
    reviewed_on: "2026-06-02"
    owner: architecture-governance
    outcome: cli_preview_uuid4_retired
    rationale: CLI storage preview contexts now derive UUID-shaped occurrence IDs from explicit timestamp input via uuid5, reducing residual random-identity seams from 13 to 12 without widening replay semantics.
  - issue: "#5032"
    reviewed_on: "2026-06-02"
    owner: architecture-governance
    outcome: logger_fallback_uuid4_retired
    rationale: Logger fallback correlation IDs now use deterministic process-local uuid5 occurrence IDs, reducing residual random-identity seams from 12 to 11 without adding replay-critical identity.
