# Runtime UUID generation seam inventory.
# Production uuid4 call sites are forbidden across src/bioetl.
version: 1
policy:
  owner: architecture-governance
  scan_scope: src/bioetl
  production_uuid4_budget: 0
  replay_critical_rule: replay-critical identity must be explicit or deterministic; random UUID generation is forbidden.
  migration_policy: runtime occurrence IDs must use explicit IDs, injected deterministic factories, or UUIDv5 values derived from reviewed occurrence payloads.
review_history:
  - issue: "#5044"
    reviewed_on: "2026-06-02"
    owner: architecture-governance
    outcome: production_random_uuid_zero_budget_enforced
    rationale: Runtime UUID inventory now scans all production src/bioetl paths and no longer permits reviewed uuid4 seams.
  - issue: "#5045"
    reviewed_on: "2026-06-02"
    owner: architecture-governance
    outcome: application_control_plane_uuid4_defaults_removed
    rationale: Application control-plane services fail closed without injected manifest, ledger, workflow, or pipeline ID factories.
  - issue: "#5046"
    reviewed_on: "2026-06-02"
    owner: architecture-governance
    outcome: pipeline_and_composite_runtime_uuid4_fallbacks_removed
    rationale: Pipeline and composite runtime fallback IDs are now supplied by explicit composition occurrence factories or explicit run_id inputs.
  - issue: "#5047"
    reviewed_on: "2026-06-02"
    owner: architecture-governance
    outcome: residual_batch_and_infrastructure_uuid4_retired
    rationale: Batch ID generation and workflow foreign-key quarantine grouping no longer use uuid4.
  - issue: "#5048"
    reviewed_on: "2026-06-02"
    owner: architecture-governance
    outcome: production_random_uuid_zero_budget_ratchet_active
    rationale: Architecture guards now accept only zero production uuid4 call sites.
  - issue: "#4926"
    reviewed_on: "2026-06-01"
    owner: architecture-governance
    outcome: held_flat_with_zero_replay_critical_seams
    rationale: Runtime UUID seam count remains 14 and replay-critical UUID seam count remains 0; exact replay paths must inject deterministic factories or explicit IDs before producing replay artifacts.
  - issue: "#4951"
    reviewed_on: "2026-06-01"
    owner: architecture-governance
    outcome: deterministic_factory_enforcement_confirmed
    rationale: Application and composition UUID seams remain classified, replay-critical random identity stays at zero, and exact replay requirements are documented per seam through explicit factory or run_id injection policy.
  - issue: "#4968"
    reviewed_on: "2026-06-01"
    owner: architecture-governance
    outcome: deterministic_factory_evidence_confirmed
    rationale: Runtime UUID seam count fell from 14 to 13 after the obsolete observability smoke seam was removed, replay-critical random identity remains zero, and retained application/composition seams have targeted deterministic factory or explicit run_id coverage in the referenced guard tests.
  - issue: "#4975"
    reviewed_on: "2026-06-02"
    owner: architecture-governance
    outcome: replay_identity_fail_closed_enforced
    rationale: Exact replay application and composition seams now fail closed without explicit run_id or injected run_id_factory, while residual uuid4 seams remain classified as operational-only defaults or injectable factories.
  - issue: "#4997"
    reviewed_on: "2026-06-02"
    owner: architecture-governance
    outcome: cli_preview_uuid4_retired
    rationale: CLI storage preview contexts now derive UUID-shaped occurrence IDs from explicit timestamp input via uuid5, reducing residual random-identity seams from 13 to 12 without widening replay semantics.
  - issue: "#5032"
    reviewed_on: "2026-06-02"
    owner: architecture-governance
    outcome: logger_fallback_uuid4_retired
    rationale: Logger fallback correlation IDs now use deterministic process-local uuid5 occurrence IDs, reducing residual random-identity seams from 12 to 11 without adding replay-critical identity.
deterministic_factory_evidence:
  issue: "#4968"
  required_policy: retained UUID seams must either accept explicit IDs or expose injectable factories in tests used for exact replay coverage.
  guard_tests:
    - tests/unit/application/services/test_pipeline_runner_service.py
    - tests/unit/application/services/test_run_manifest_service.py
    - tests/unit/application/services/test_run_ledger_service.py
    - tests/unit/application/services/control_plane/test_workflow_execution_service.py
    - tests/unit/application/test_base_pipeline.py
    - tests/unit/composition/test_entrypoints.py
    - tests/unit/composition/bootstrap/runtime/test_runtime_basics.py
    - tests/unit/composition/bootstrap/runtime/test_pipeline_context_builder.py
    - tests/unit/composition/bootstrap/runtime/test_runner_assembly_bootstrap.py
    - tests/unit/composition/bootstrap/runtime/test_logger_bootstrap.py
    - tests/unit/composition/bootstrap/runtime/test_composite_bootstrap_builders.py
    - tests/unit/composition/factories/services/test_runtime_managers.py
seams: []
