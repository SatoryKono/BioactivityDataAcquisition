version: 1
policy_scope: adr_041_layer_aware_naming

suffix_boundary_rules:
  - rule_id: non_domain_port_protocols
    description: >
      Outside src/bioetl/domain/ports, protocol-like contracts must use *Protocol.
      *Port is reserved for domain boundary ports or explicit compatibility shims.
    suffixes:
      - Port
    include_path_prefixes:
      - src/bioetl/
    exclude_path_prefixes:
      - src/bioetl/domain/ports/
    allowed_symbol_exceptions:
      - symbol: EnumLoaderPort
        path: src/bioetl/domain/config/enum_loader.py
        issue: "#3396"
        reason: >
          Domain-adjacent enum loader contract still uses the legacy *Port name
          outside domain/ports and remains pending terminology cleanup.
      - symbol: DataSourceCreatorPort
        path: src/bioetl/composition/factories/__init__.py
        issue: "#3401"
        reason: >
          Deprecated public composition alias retained until the v2.0 sunset of
          DataSourceCreatorProtocol terminology migration.

  - rule_id: composition_infrastructure_service_suffix
    description: >
      Composition and infrastructure layers must not grow new *Service classes
      without explicit ADR-041 review. The current surfaces remain as tracked debt.
    suffixes:
      - Service
    include_path_prefixes:
      - src/bioetl/composition/
      - src/bioetl/infrastructure/
    allowed_symbol_exceptions:
      - symbol: RunnerFactoryBuilderService
        path: src/bioetl/composition/bootstrap/runtime/runner_factory_builder_service.py
        issue: "#3399"
        reason: Existing composition naming drift pending canonical rename.
      - symbol: CompositeFilterExtractionService
        path: src/bioetl/composition/bootstrap/runtime/composite_filter_extraction_service.py
        issue: "#3399"
        reason: Existing composition naming drift pending canonical rename.
      - symbol: FsAdrService
        path: src/bioetl/infrastructure/adr/fs_adr_service.py
        issue: "#3399"
        reason: Existing infrastructure naming drift pending canonical rename.
      - symbol: FallbackFetchOrchestratorService
        path: src/bioetl/infrastructure/adapters/common/fallback_fetch_service.py
        issue: "#3399"
        reason: Existing infrastructure naming drift pending canonical rename.
      - symbol: ErrorService
        path: src/bioetl/infrastructure/adapters/error_handling.py
        issue: "#3399"
        reason: Existing infrastructure naming drift pending canonical rename.
      - symbol: OpenAlexCursorFlowService
        path: src/bioetl/infrastructure/adapters/openalex/cursor_flow.py
        issue: "#3399"
        reason: Existing infrastructure naming drift pending canonical rename.
      - symbol: PubChemFetchFlowService
        path: src/bioetl/infrastructure/adapters/pubchem/fetch_flow.py
        issue: "#3399"
        reason: Existing infrastructure naming drift pending canonical rename.
      - symbol: DataQualityMonitorService
        path: src/bioetl/infrastructure/observability/anomaly/monitor.py
        issue: "#3399"
        reason: Existing infrastructure naming drift pending canonical rename.

  - rule_id: domain_service_suffix_conflict
    description: >
      Domain-layer *Service names are frozen to the current reviewed set while the
      canonical replacement vocabulary is decided.
    suffixes:
      - Service
    include_path_prefixes:
      - src/bioetl/domain/services/
    allowed_symbol_exceptions:
      - symbol: AuthorNormalizationService
        path: src/bioetl/domain/services/author_normalization_service.py
        issue: "#3400"
        reason: Existing domain service surface pending canonical rename decision.
      - symbol: CompositeValidationService
        path: src/bioetl/domain/services/composite_validation_layer.py
        issue: "#3400"
        reason: Existing domain service surface pending canonical rename decision.
      - symbol: DefaultDataNormalizationService
        path: src/bioetl/domain/services/data_normalization_service.py
        issue: "#3400"
        reason: Existing domain service surface pending canonical rename decision.
      - symbol: IdentityService
        path: src/bioetl/domain/services/identity_service.py
        issue: "#3400"
        reason: Existing domain service surface pending canonical rename decision.
      - symbol: MergedMetadataExplainabilityService
        path: src/bioetl/domain/services/merged_metadata_explainability.py
        issue: "#3400"
        reason: Existing domain service surface pending canonical rename decision.
      - symbol: NormalizationService
        path: src/bioetl/domain/services/normalization_service.py
        issue: "#3400"
        reason: Existing domain service surface pending canonical rename decision.
      - symbol: OrganismClassificationService
        path: src/bioetl/domain/services/organism_classification_service.py
        issue: "#3400"
        reason: Existing domain service surface pending canonical rename decision.
      - symbol: PhasedMigrationSupportService
        path: src/bioetl/domain/services/phased_migration_support.py
        issue: "#3400"
        reason: Existing domain service surface pending canonical rename decision.
      - symbol: PreflightGovernanceService
        path: src/bioetl/domain/services/preflight_governance.py
        issue: "#3400"
        reason: Existing domain service surface pending canonical rename decision.

family_freeze_rules:
  - rule_id: runtime_admin_checkpoint_quarantine_family
    description: >
      Checkpoint/quarantine runtime-admin naming remains frozen to the reviewed
      four-surface set while the runtime/admin split is canonicalized.
    include_path_prefixes:
      - src/bioetl/application/core/
      - src/bioetl/application/services/
      - src/bioetl/composition/
    match_regex: ^(Checkpoint(?:Manager)?Service|Quarantine(?:Manager)?Service)$
    allowed_symbols:
      - symbol: CheckpointManagerService
        path: src/bioetl/application/core/lifecycle/checkpoint_manager.py
        issue: "#3398"
        reason: Runtime checkpoint manager retained pending family consolidation.
      - symbol: QuarantineManagerService
        path: src/bioetl/application/core/quarantine_manager.py
        issue: "#3398"
        reason: Runtime quarantine manager retained pending family consolidation.
      - symbol: CheckpointService
        path: src/bioetl/application/services/checkpoint_service.py
        issue: "#3398"
        reason: Admin checkpoint service retained pending family consolidation.
      - symbol: QuarantineService
        path: src/bioetl/application/services/quarantine_service.py
        issue: "#3398"
        reason: Admin quarantine service retained pending family consolidation.

  - rule_id: column_ordering_family
    description: >
      Column ordering naming remains frozen while ambiguity collapses toward
      ColumnOrderService as the canonical surface.
    include_path_prefixes:
      - src/bioetl/application/composite/
    match_regex: ^Column(?:Priority)?Order(?:er|Service)$
    allowed_symbols:
      - symbol: ColumnOrderService
        path: src/bioetl/application/composite/column_service.py
        issue: "#3402"
        reason: Canonical unified column ordering surface.
      - symbol: ColumnOrderer
        path: src/bioetl/application/composite/column_orderer.py
        issue: "#3402"
        reason: Deprecated compatibility alias pending removal.
      - symbol: ColumnPriorityOrderer
        path: src/bioetl/application/composite/column_priority_orderer.py
        issue: "#3402"
        reason: Deprecated compatibility surface pending removal.
