version: 1
policy_scope: adr_041_layer_aware_naming

function_suffix_rules:
  - rule_id: composition_bootstrap_port_factories
    description: >
      Composition bootstrap may retain a narrow reviewed family of `*_port`
      factory functions whose job is to construct implementations of domain port
      contracts. This exception is limited to bootstrap factories and must not
      expand to new composition functions without explicit governance review.
    suffixes:
      - _port
    include_path_prefixes:
      - src/bioetl/composition/bootstrap/
    exclude_path_prefixes: []
    allowed_symbols:
      - symbol: bootstrap_checkpoint_port
        path: src/bioetl/composition/bootstrap/assembly/checkpoint.py
        issue: "#3442"
        owner: "@bioetl-architecture"
        expires_on: "2026-12-31"
        removal_step: Remove after bootstrap port factories are consolidated to canonical runtime builders.
        reason: >
          Reviewed bootstrap factory that constructs the checkpoint port
          implementation for CLI/runtime wiring.
      - symbol: bootstrap_composite_checkpoint_port
        path: src/bioetl/composition/bootstrap/assembly/checkpoint.py
        issue: "#3442"
        owner: "@bioetl-architecture"
        expires_on: "2026-12-31"
        removal_step: Remove after composite checkpoint wiring no longer requires compatibility factory seams.
        reason: >
          Reviewed bootstrap factory that constructs the composite checkpoint
          port for runtime resume and repair flows.
      - symbol: bootstrap_quarantine_port
        path: src/bioetl/composition/bootstrap/assembly/checkpoint.py
        issue: "#3442"
        owner: "@bioetl-architecture"
        expires_on: "2026-12-31"
        removal_step: Remove after quarantine port wiring is fully collapsed to canonical bootstrap composition APIs.
        reason: >
          Reviewed bootstrap factory that constructs the quarantine port
          implementation for CLI/runtime wiring.
      - symbol: bootstrap_dq_monitor_port
        path: src/bioetl/composition/bootstrap/runtime/dq_bootstrap.py
        issue: "#3442"
        owner: "@bioetl-observability"
        expires_on: "2026-12-31"
        removal_step: Remove when runtime observability bootstrap internals are merged and no longer need port-suffixed compatibility wrappers.
        reason: >
          Reviewed observability bootstrap implementation retained behind the
          runtime observability facade.
      - symbol: bootstrap_dq_monitor_port
        path: src/bioetl/composition/bootstrap/runtime/observability.py
        issue: "#3442"
        owner: "@bioetl-observability"
        expires_on: "2026-12-31"
        removal_step: Remove after public observability bootstrap surface is stabilized without *_port compatibility factories.
        reason: >
          Reviewed public runtime observability facade retained as the canonical
          bootstrap seam for DQ monitor port wiring.
      - symbol: bootstrap_logger_port
        path: src/bioetl/composition/bootstrap/runtime/logger_bootstrap.py
        issue: "#3442"
        owner: "@bioetl-observability"
        expires_on: "2026-12-31"
        removal_step: Remove when logger port bootstrap path is canonicalized and compatibility wrappers are deleted.
        reason: >
          Reviewed observability bootstrap implementation retained behind the
          runtime observability facade.
      - symbol: bootstrap_logger_port
        path: src/bioetl/composition/bootstrap/runtime/observability.py
        issue: "#3442"
        owner: "@bioetl-observability"
        expires_on: "2026-12-31"
        removal_step: Remove after observability facade no longer exposes logger *_port bootstrap seam.
        reason: >
          Reviewed public runtime observability facade retained as the canonical
          bootstrap seam for logger port wiring.
      - symbol: bootstrap_metrics_port
        path: src/bioetl/composition/bootstrap/runtime/metrics_bootstrap.py
        issue: "#3442"
        owner: "@bioetl-observability"
        expires_on: "2026-12-31"
        removal_step: Remove when metrics port bootstrap path is canonicalized and compatibility wrappers are deleted.
        reason: >
          Reviewed observability bootstrap implementation retained behind the
          runtime observability facade.
      - symbol: bootstrap_metrics_port
        path: src/bioetl/composition/bootstrap/runtime/observability.py
        issue: "#3442"
        owner: "@bioetl-observability"
        expires_on: "2026-12-31"
        removal_step: Remove after observability facade no longer exposes metrics *_port bootstrap seam.
        reason: >
          Reviewed public runtime observability facade retained as the canonical
          bootstrap seam for metrics port wiring.
      - symbol: bootstrap_tracer_port
        path: src/bioetl/composition/bootstrap/runtime/tracing_bootstrap.py
        issue: "#3442"
        owner: "@bioetl-observability"
        expires_on: "2026-12-31"
        removal_step: Remove when tracer port bootstrap path is canonicalized and compatibility wrappers are deleted.
        reason: >
          Reviewed observability bootstrap implementation retained behind the
          runtime observability facade.
      - symbol: bootstrap_tracer_port
        path: src/bioetl/composition/bootstrap/runtime/observability.py
        issue: "#3442"
        owner: "@bioetl-observability"
        expires_on: "2026-12-31"
        removal_step: Remove after observability facade no longer exposes tracer *_port bootstrap seam.
        reason: >
          Reviewed public runtime observability facade retained as the canonical
          bootstrap seam for tracer port wiring.

suffix_boundary_rules:
  - rule_id: non_domain_port_protocols
    description: >
      Outside src/bioetl/domain/ports, protocol-like contracts must use *Protocol.
      *Port is reserved for domain boundary ports or explicit compatibility shims.
    suffixes:
      - Port
    include_path_prefixes:
      - src/bioetl/
    exclude_path_prefixes:
      - src/bioetl/domain/ports/
    allowed_symbol_exceptions:

  - rule_id: non_infrastructure_adapter_aliases
    description: >
      Outside infrastructure, *Adapter names are allowed only as reviewed
      compatibility aliases. New composition/application/interface adapter
      aliases must not appear without explicit registry coverage.
    suffixes:
      - Adapter
    include_path_prefixes:
      - src/bioetl/
    exclude_path_prefixes:
      - src/bioetl/infrastructure/
    allowed_symbol_exceptions:

  - rule_id: composition_infrastructure_service_suffix
    description: >
      Composition and infrastructure layers must not expose new first-party
      *Service classes. The reviewed baseline is currently clean and must stay
      exception-free unless ADR-041 governance is updated deliberately.
    suffixes:
      - Service
    include_path_prefixes:
      - src/bioetl/composition/
      - src/bioetl/infrastructure/
    allowed_symbol_exceptions: []

  - rule_id: domain_service_suffix_conflict
    description: >
      Domain-layer pure behavior surfaces must not expose first-party *Service
      classes. The reviewed baseline is now clean and should remain exception-free.
    suffixes:
      - Service
    include_path_prefixes:
      - src/bioetl/domain/behavior/
    allowed_symbol_exceptions:

family_freeze_rules:
  - rule_id: runtime_admin_lock_family
    description: >
      Lock lifecycle naming is role-driven: runtime collaborators use
      *RuntimeService and operator/admin services use *Service. Legacy
      LockCoordinator names remain matched here only so they fail if
      reintroduced.
    include_path_prefixes:
      - src/bioetl/application/core/
      - src/bioetl/application/services/
      - src/bioetl/composition/
    match_regex: ^(?:LockRuntimeService|LockRuntimeServiceCreateContext|LockService|LockCoordinator|LockCoordinatorCreateContext)$
    allowed_symbols:
      - symbol: LockRuntimeService
        path: src/bioetl/application/core/lifecycle/lock_runtime_service.py
        issue: "#3552"
        owner: "@bioetl-platform"
        expires_on: "2026-12-31"
        removal_step: Remove family exception once lock runtime/admin naming freeze is retired by ADR-041 follow-up.
        reason: Canonical runtime lock lifecycle collaborator.
      - symbol: LockRuntimeServiceCreateContext
        path: src/bioetl/application/core/lifecycle/lock_runtime_service.py
        issue: "#3552"
        owner: "@bioetl-platform"
        expires_on: "2026-12-31"
        removal_step: Remove family exception once lock runtime/admin naming freeze is retired by ADR-041 follow-up.
        reason: Canonical runtime lock collaborator creation seam.
      - symbol: LockService
        path: src/bioetl/application/services/lock_service.py
        issue: "#3552"
        owner: "@bioetl-platform"
        expires_on: "2026-12-31"
        removal_step: Remove family exception once lock runtime/admin naming freeze is retired by ADR-041 follow-up.
        reason: Canonical operator/admin lock service.

  - rule_id: runtime_admin_checkpoint_quarantine_family
    description: >
      Checkpoint/quarantine runtime-admin naming is role-driven: runtime write
      collaborators use *RuntimeService and operator/admin services use
      *Service. Manager-style names are retired from first-party code.
    include_path_prefixes:
      - src/bioetl/application/core/
      - src/bioetl/application/services/
      - src/bioetl/composition/
    match_regex: ^(CheckpointRuntimeService|QuarantineRuntimeService|CheckpointService|QuarantineService)$
    allowed_symbols:
      - symbol: CheckpointRuntimeService
        path: src/bioetl/application/core/lifecycle/checkpoint_manager.py
        issue: "#3398"
        owner: "@bioetl-platform"
        expires_on: "2026-12-31"
        removal_step: Remove family exception once runtime/admin naming freeze is retired by ADR-041 follow-up.
        reason: Canonical runtime checkpoint collaborator.
      - symbol: QuarantineRuntimeService
        path: src/bioetl/application/core/quarantine_manager.py
        issue: "#3398"
        owner: "@bioetl-platform"
        expires_on: "2026-12-31"
        removal_step: Remove family exception once runtime/admin naming freeze is retired by ADR-041 follow-up.
        reason: Canonical runtime quarantine write-path collaborator.
      - symbol: CheckpointService
        path: src/bioetl/application/services/checkpoint_service.py
        issue: "#3398"
        owner: "@bioetl-platform"
        expires_on: "2026-12-31"
        removal_step: Remove family exception once runtime/admin naming freeze is retired by ADR-041 follow-up.
        reason: Canonical operator/admin checkpoint service.
      - symbol: QuarantineService
        path: src/bioetl/application/services/quarantine_service.py
        issue: "#3398"
        owner: "@bioetl-platform"
        expires_on: "2026-12-31"
        removal_step: Remove family exception once runtime/admin naming freeze is retired by ADR-041 follow-up.
        reason: Canonical operator/admin quarantine service.

  - rule_id: column_ordering_family
    description: >
      Column ordering naming remains frozen while ambiguity collapses toward
      ColumnOrderService as the canonical surface.
    include_path_prefixes:
      - src/bioetl/application/composite/
    match_regex: ^Column(?:Priority)?Order(?:er|Service)$
    allowed_symbols:
      - symbol: ColumnOrderService
        path: src/bioetl/application/composite/column_service.py
        issue: "#3402"
        owner: "@bioetl-architecture"
        expires_on: "2026-12-31"
        removal_step: Remove freeze exception once column-ordering family policy is retired with zero ambiguity aliases.
        reason: Canonical unified column ordering surface.

  - rule_id: composite_canonical_alias_family
    description: >
      Application composite naming is canonicalized to
      CompositeCheckpointService, CompositePipelineRunner, and
      CompositePreflightValidationService.
    include_path_prefixes:
      - src/bioetl/application/composite/
    match_regex: ^(?:CompositeCheckpointService|CompositePipelineRunner|CompositePreflightValidationService)$
    allowed_symbols:
      - symbol: CompositeCheckpointService
        path: src/bioetl/application/composite/checkpoint/service.py
        issue: "#3443"
        owner: "@bioetl-architecture"
        expires_on: "2026-12-31"
        removal_step: Remove freeze exception once composite canonical alias family rule is retired.
        reason: Canonical composite checkpoint facade.
      - symbol: CompositePipelineRunner
        path: src/bioetl/application/composite/runner_pkg/runner.py
        issue: "#3443"
        owner: "@bioetl-architecture"
        expires_on: "2026-12-31"
        removal_step: Remove freeze exception once composite canonical alias family rule is retired.
        reason: Canonical composite runner facade.
      - symbol: CompositePreflightValidationService
        path: src/bioetl/application/composite/preflight_validator.py
        issue: "#3443"
        owner: "@bioetl-architecture"
        expires_on: "2026-12-31"
        removal_step: Remove freeze exception once composite canonical alias family rule is retired.
        reason: Canonical composite preflight validation facade.

  - rule_id: provider_connector_adapter_module_family
    description: >
      Provider connector adapter classes must be canonically owned by
      `adapter.py` modules. Provider-level `client.py` modules are compatibility
      shims and must not become adapter owners.
    include_path_prefixes:
      - src/bioetl/infrastructure/adapters/pubmed/
      - src/bioetl/infrastructure/adapters/semanticscholar/
    match_regex: ^(?:PubMedAdapter|SemanticScholarAdapter)$
    allowed_symbols:
      - symbol: PubMedAdapter
        path: src/bioetl/infrastructure/adapters/pubmed/adapter.py
        issue: "#3553"
        owner: "@bioetl-architecture"
        expires_on: "2026-12-31"
        removal_step: Remove freeze exception once provider connector module naming ambiguity is retired.
        reason: Canonical PubMed provider adapter owner module.
      - symbol: SemanticScholarAdapter
        path: src/bioetl/infrastructure/adapters/semanticscholar/adapter.py
        issue: "#3553"
        owner: "@bioetl-architecture"
        expires_on: "2026-12-31"
        removal_step: Remove freeze exception once provider connector module naming ambiguity is retired.
        reason: Canonical Semantic Scholar provider adapter owner module.
