version: 1
policy_scope: adr_041_layer_aware_naming

suffix_boundary_rules:
  - rule_id: non_domain_port_protocols
    description: >
      Outside src/bioetl/domain/ports, protocol-like contracts must use *Protocol.
      *Port is reserved for domain boundary ports or explicit compatibility shims.
    suffixes:
      - Port
    include_path_prefixes:
      - src/bioetl/
    exclude_path_prefixes:
      - src/bioetl/domain/ports/
    allowed_symbol_exceptions:
      - symbol: DataSourceCreatorPort
        path: src/bioetl/composition/factories/__init__.py
        issue: "#3401"
        reason: >
          Deprecated public composition alias retained until the v2.0 sunset of
          DataSourceCreatorProtocol terminology migration.
      - symbol: DataSourceCreatorPort
        path: src/bioetl/composition/providers/_models.py
        issue: "#3401"
        reason: >
          Deprecated provider alias retained while first-party composition code
          converges on DataSourceCreatorProtocol.
      - symbol: DataSourceCreatorPort
        path: src/bioetl/composition/providers/__init__.py
        issue: "#3401"
        reason: >
          Deprecated provider package-root alias retained for reviewed
          compatibility imports only.
      - symbol: DataSourceCreatorPort
        path: src/bioetl/composition/providers/provider_registry.py
        issue: "#3401"
        reason: >
          Deprecated provider registry alias retained for reviewed compatibility
          imports only.
      - symbol: DataSourceCreatorPort
        path: src/bioetl/composition/factories/datasource/__init__.py
        issue: "#3401"
        reason: >
          Deprecated datasource package-root alias retained for reviewed
          compatibility imports only.
      - symbol: DataSourceCreatorPort
        path: src/bioetl/composition/factories/datasource/data_source_factory.py
        issue: "#3401"
        reason: >
          Deprecated datasource factory alias retained for reviewed
          compatibility imports only.

  - rule_id: non_infrastructure_adapter_aliases
    description: >
      Outside infrastructure, *Adapter names are allowed only as reviewed
      compatibility aliases. New composition/application/interface adapter
      aliases must not appear without explicit registry coverage.
    suffixes:
      - Adapter
    include_path_prefixes:
      - src/bioetl/
    exclude_path_prefixes:
      - src/bioetl/infrastructure/
    allowed_symbol_exceptions:
      - symbol: StorageAdapter
        path: src/bioetl/composition/types.py
        issue: "#3437"
        reason: >
          Deprecated composition alias retained while external callers migrate
          to StorageBundle.
      - symbol: StorageAdapter
        path: src/bioetl/composition/factories/storage/__init__.py
        issue: "#3437"
        reason: >
          Deprecated storage package-root alias retained while external callers
          migrate to StorageBundle.
      - symbol: StorageAdapter
        path: src/bioetl/composition/factories/storage/adapter.py
        issue: "#3437"
        reason: >
          Deprecated storage owner-module alias retained while external callers
          migrate to StorageBundle.
      - symbol: PolarsJoinAdapter
        path: src/bioetl/composition/factories/services/polars_join_adapter.py
        issue: "#3437"
        reason: >
          Deprecated composition alias retained while callers migrate to
          PolarsJoinBridge.

  - rule_id: composition_infrastructure_service_suffix
    description: >
      Composition and infrastructure layers must not expose new first-party
      *Service classes. The reviewed baseline is currently clean and must stay
      exception-free unless ADR-041 governance is updated deliberately.
    suffixes:
      - Service
    include_path_prefixes:
      - src/bioetl/composition/
      - src/bioetl/infrastructure/
    allowed_symbol_exceptions:
      - symbol: FallbackFetchOrchestratorService
        path: src/bioetl/infrastructure/adapters/common/fallback_fetch_service.py
        issue: "#3437"
        reason: >
          Deprecated infrastructure alias retained while callers migrate to
          FallbackFetchOrchestrator.

  - rule_id: domain_service_suffix_conflict
    description: >
      Domain-layer pure behavior surfaces must not expose first-party *Service
      classes. The reviewed baseline is now clean and should remain exception-free.
    suffixes:
      - Service
    include_path_prefixes:
      - src/bioetl/domain/services/
    allowed_symbol_exceptions:

family_freeze_rules:
  - rule_id: runtime_admin_checkpoint_quarantine_family
    description: >
      Checkpoint/quarantine runtime-admin naming is role-driven: runtime write
      collaborators use *RuntimeService and operator/admin services use
      *Service. Manager-style names are retired from first-party code.
    include_path_prefixes:
      - src/bioetl/application/core/
      - src/bioetl/application/services/
      - src/bioetl/composition/
    match_regex: ^(CheckpointRuntimeService|QuarantineRuntimeService|CheckpointService|QuarantineService)$
    allowed_symbols:
      - symbol: CheckpointRuntimeService
        path: src/bioetl/application/core/lifecycle/checkpoint_manager.py
        issue: "#3398"
        reason: Canonical runtime checkpoint collaborator.
      - symbol: QuarantineRuntimeService
        path: src/bioetl/application/core/quarantine_manager.py
        issue: "#3398"
        reason: Canonical runtime quarantine write-path collaborator.
      - symbol: CheckpointService
        path: src/bioetl/application/services/checkpoint_service.py
        issue: "#3398"
        reason: Canonical operator/admin checkpoint service.
      - symbol: QuarantineService
        path: src/bioetl/application/services/quarantine_service.py
        issue: "#3398"
        reason: Canonical operator/admin quarantine service.

  - rule_id: column_ordering_family
    description: >
      Column ordering naming remains frozen while ambiguity collapses toward
      ColumnOrderService as the canonical surface.
    include_path_prefixes:
      - src/bioetl/application/composite/
    match_regex: ^Column(?:Priority)?Order(?:er|Service)$
    allowed_symbols:
      - symbol: ColumnOrderService
        path: src/bioetl/application/composite/column_service.py
        issue: "#3402"
        reason: Canonical unified column ordering surface.
      - symbol: ColumnOrderer
        path: src/bioetl/application/composite/column_orderer.py
        issue: "#3402"
        reason: Deprecated compatibility alias pending removal.
      - symbol: ColumnPriorityOrderer
        path: src/bioetl/application/composite/column_priority_orderer.py
        issue: "#3402"
        reason: Deprecated compatibility surface pending removal.
