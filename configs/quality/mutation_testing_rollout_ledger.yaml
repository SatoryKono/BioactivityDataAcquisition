version: 1
policy_scope: mutation_testing_rollout
source_of_truth:
  matrix_path: configs/quality/test_matrix.yaml
  matrix_rollout_path: mutation_testing
backlog_reference: https://github.com/SatoryKono/BioactivityDataAcquisition/issues/3410
review_history:
- issue: '#4930'
  reviewed_on: '2026-06-01'
  owner: '@bioetl-application'
  outcome: held_flat_partial_application_gate
  rationale: Domain, application_control_plane, and one narrow application-service
    mutation gate remain enforced; broad application stays staged until a stable
    application-layer baseline and bounded shard runtime are captured.
- issue: '#4958'
  reviewed_on: '2026-06-01'
  owner: '@bioetl-application'
  outcome: promoted_export_manifest_application_slice
  rationale: Export-manifest behavior has focused unit coverage and a bounded
    mutation target, so it can move from the broad staged application backlog into
    enforced partial CI without weakening existing domain/control-plane gates.
- issue: '#4969'
  reviewed_on: '2026-06-01'
  owner: '@bioetl-application'
  outcome: promoted_workflow_runner_application_slice
  rationale: Workflow runner orchestration has focused unit coverage and a bounded
    application-service mutation target, so it can join the enforced partial
    application mutation matrix while the broad application target remains staged.
