# configs/sources/gtopdb.yaml
# Configuration for GtoPdb (Guide to Pharmacology) data source.
# API Documentation: https://www.guidetopharmacology.org/webServices.jsp

source:
    type: api
    load_strategy: full
    batch_size: 100
    provider_config:
        provider: gtopdb
        base_url: https://www.guidetopharmacology.org/services
        client:
            timeout_sec: 30.0
            max_retries: 3
        batch_size: 100
        # GtoPdb returns all records in one response (no pagination)
        page_size: null

    circuit_breaker:
        failure_threshold: 5
        recovery_timeout: 300

    # Conservative rate limit (not documented by GtoPdb)
    rate_limit:
        requests_per_second: 1
        burst: 5
