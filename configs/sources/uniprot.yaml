# configs/sources/uniprot.yaml
# Конфигурация источника данных UniProt REST API.

source:
    type: api
    load_strategy: incremental
    watermark_field: accession
    batch_size: 200 # UniProt handles slightly larger batches well
    provider_config:
        provider: uniprot
        base_url: https://rest.uniprot.org
        client:
            timeout_sec: 30.0
            max_retries: 3
        
    circuit_breaker:
        failure_threshold: 5
        recovery_timeout: 300

    rate_limit:
        requests_per_second: 10.0
        burst: 20
