column_groups:
  - name: system
    fields:
      - entity_id
      - content_hash
      - _run_id
      - _run_type
      - _source_batch_id
      - _source
      - _ingestion_ts
      - _index
      - _lookup_method
      - _original_id

  - name: identifiers
    fields:
      - paper_id
      - doi
      - pmid
      - corpus_id
      - dblp_id

  - name: title
    fields:
      - title

  - name: abstract
    fields:
      - abstract
      - tldr

  - name: authors
    fields:
      - author_s2_ids
      - author_orcids
      - author_h_indices

  - name: affiliations
    fields:
      - affiliation_list

  - name: journal
    fields:
      - journal

  - name: year
    fields:
      - publication_year

  - name: dates
    fields:
      - publication_date

  - name: pagination
    fields:
      - volume
      - issue
      - page_first
      - page_last
      - page_range

  - name: citations
    fields:
      - citations_received
      - citations_made
      - influential_citation_count
      - citation_contexts

  - name: subjects
    fields:
      - subject_fields
      - publication_types

  - name: open_access
    fields:
      - is_oa
      - oa_status
      - open_access_url

  - name: dq
    pattern: "^_dq_"

# Field aliases for backward compatibility
field_aliases:
  tldr: abstract
  affiliations: affiliation_list
  year: publication_year
  first_page: page_first
  last_page: page_last
  pages: page_range
  citation_count: citations_received
  reference_count: citations_made
  fields_of_study: subject_fields

# Layer-specific column filtering
silver:
  include_groups:
    - system
    - identifiers
    - title
    - abstract
    - authors
    - affiliations
    - journal
    - year
    - dates
    - pagination
    - citations
    - subjects
    - open_access
    - dq

gold:
  include_groups:
    - system
    - identifiers
    - title
    - abstract
    - authors
    - journal
    - year
    - citations
    - open_access
  exclude_fields:
    - _dq_*
    - _source_batch_id
    - _index
    - _lookup_method
    - _original_id
