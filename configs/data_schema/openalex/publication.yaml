column_groups:
  - name: system
    fields:
      - entity_id
      - content_hash
      - _run_id
      - _run_type
      - _source_batch_id
      - _source
      - _ingestion_ts
      - _index
      - _lookup_method
      - _original_id

  - name: identifiers
    fields:
      - openalex_id
      - doi
      - pmid
      - mag_id

  - name: title
    fields:
      - title

  - name: abstract
    fields:
      - abstract

  - name: authors
    fields:
      - authors
      - author_ids
      - author_orcids

  - name: affiliations
    fields:
      - affiliations

  - name: institutions
    fields:
      - institution_ids
      - institution_country_codes
      - ror_ids

  - name: journal
    fields:
      - journal
      - issn

  - name: year
    fields:
      - year

  - name: dates
    fields:
      - publication_date

  - name: pagination
    fields:
      - volume
      - issue
      - first_page
      - last_page

  - name: citations
    fields:
      - citation_count
      - referenced_works_count
      - fwci

  - name: open_access
    fields:
      - is_oa
      - oa_status

  - name: subjects
    fields:
      - topics
      - primary_topic
      - keywords
      - mesh_terms

  - name: publisher
    fields:
      - publisher

  - name: funding
    fields:
      - grants

  - name: doc_type
    fields:
      - type

  - name: quality
    fields:
      - is_retracted

  - name: language
    fields:
      - language

  - name: dq
    pattern: "^_dq_"

# Layer-specific column filtering
silver:
  include_groups:
    - system
    - identifiers
    - title
    - abstract
    - authors
    - affiliations
    - institutions
    - journal
    - year
    - dates
    - pagination
    - citations
    - open_access
    - subjects
    - publisher
    - funding
    - doc_type
    - quality
    - language
    - dq
  # Унификация с другими провайдерами (CrossRef, PubMed, SemanticScholar)
  # OpenAlex использует referenced_works_count, остальные — reference_count
  rename_fields:
    referenced_works_count: reference_count
    mesh: mesh_terms

gold:
  include_groups:
    - system
    - identifiers
    - title
    - abstract
    - authors
    - journal
    - year
    - citations
    - open_access
    - subjects
    - quality
  exclude_fields:
    - _dq_*
    - _source_batch_id
    - _index
    - _lookup_method
    - _original_id
  rename_fields:
    mesh: mesh_terms
  # Gold использует Silver output name (after rename)
  # Silver переименовал referenced_works_count → reference_count
