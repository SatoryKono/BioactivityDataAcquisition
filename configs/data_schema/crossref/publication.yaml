column_groups:
  - name: system
    fields:
      - entity_id
      - content_hash
      - _run_id
      - _run_type
      - _source_batch_id
      - _source
      - _ingestion_ts
      - _index
      - _lookup_method
      - _original_id

  - name: identifiers
    fields:
      - doi
      - alternative_id

  - name: title
    fields:
      - title

  - name: authors
    fields:
      - authors

  - name: journal
    fields:
      - journal
      - short_container_title

  - name: issn
    fields:
      - issn
      - issn_print
      - issn_electronic

  - name: year
    fields:
      - year

  - name: dates
    fields:
      - publication_date
      - published
      - published_online
      - published_print

  - name: pagination
    fields:
      - volume
      - issue
      - first_page
      - last_page

  - name: citations
    fields:
      - citation_count
      - reference_count

  - name: subjects
    fields:
      - subjects

  - name: language
    fields:
      - language

  - name: publisher
    fields:
      - publisher

  - name: doc_type
    fields:
      - type

  - name: content_domain
    fields:
      - content_domain_domains
      - content_domain_crossmark_restriction

  - name: license
    fields:
      - license_url

  - name: dq
    pattern: "^_dq_"

# Layer-specific column filtering
silver:
  include_groups:
    - system
    - identifiers
    - title
    - authors
    - journal
    - issn
    - year
    - dates
    - pagination
    - citations
    - subjects
    - language
    - publisher
    - doc_type
    - content_domain
    - license
    - dq

gold:
  include_groups:
    - system
    - identifiers
    - title
    - authors
    - journal
    - year
    - pagination
    - citations
    - publisher
    - doc_type
  exclude_fields:
    - _dq_*
    - _source_batch_id
    - _index
    - _lookup_method
    - _original_id
