column_groups:
  - name: system
    fields:
      - entity_id
      - content_hash
      - _run_id
      - _run_type
      - _source_batch_id
      - _source
      - _ingestion_ts
      - _index
      - _lookup_method
      - _original_id

  - name: identifiers
    fields:
      - document_chembl_id
      - doi
      - pmid

  - name: title
    fields:
      - title

  - name: abstract
    fields:
      - abstract

  - name: authors
    fields:
      - authors

  - name: journal
    fields:
      - journal

  - name: year
    fields:
      - year

  - name: pagination
    fields:
      - volume
      - issue
      - first_page
      - last_page

  - name: doc_type
    fields:
      - doc_type

  - name: provider_ids
    fields:
      - src_id
      - chembl_release
      - creation_date

  - name: dq
    pattern: "^_dq_"

# Layer-specific column filtering
silver:
  include_groups:
    - system
    - identifiers
    - title
    - abstract
    - authors
    - journal
    - year
    - pagination
    - doc_type
    - provider_ids
    - dq

gold:
  include_groups:
    - system
    - identifiers
    - title
    - abstract
    - authors
    - journal
    - year
    - pagination
    - doc_type
  exclude_fields:
    - _dq_*
    - _source_batch_id
    - _index
    - _lookup_method
    - _original_id
