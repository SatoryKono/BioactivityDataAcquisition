# configs/data_schema/chembl/tissue.yaml
# Column group definitions for ChEMBL Tissue entity

version: "1.0.0"
entity: tissue

# Column groups must be a list of {name, fields} objects
column_groups:
  - name: identifiers
    fields:
      - tissue_chembl_id
  - name: core_metadata
    fields:
      - pref_name
  - name: ontology_references
    fields:
      - bto_id
      - caloha_id
      - efo_id
      - uberon_id

# All business fields for Gold layer
gold_columns:
  - tissue_chembl_id
  - pref_name
  - bto_id
  - caloha_id
  - efo_id
  - uberon_id
