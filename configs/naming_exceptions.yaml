# Root-level files that may use non-standard naming
root_file_exceptions:
    - Makefile            # Standard build file
    - Dockerfile          # Standard container file
    - pyproject.toml      # Standard Python project config

# Classes without standard suffixes (domain entities, enums, value objects)
# These are exempt from the suffix requirement in RULES.md §2.1
class_suffix_exceptions:
    # Domain Entities (business objects)
    domain_entities:
        - Activity
        - Assay
        - Target
        - TargetComponent
        - Molecule
        # Canonical names (v2.0 - ADR-024)
        - ChemblPublication  # Replaces Document (no alias - direct migration)
        - PubchemMolecule    # Replaces Compound (no alias - direct migration)
        - UniprotTarget      # Replaces Protein (no alias - direct migration)
        # NOTE: Deprecated aliases (Document, Compound, Protein) have no active
        # domain export shim. Per ADR-024 update (2026-01-21), the codebase was
        # migrated directly to canonical names without backward compatibility shims.
        # Other publication entities
        - Publication

    # Enums (inherently self-describing)
    enums:
        - Layer
        - WriteMode
        - SilverWriteMode
        - GoldWriteMode
        - ClearPolicy
        - RunType
        - HealthStatus
        - DriftLevel
        - CircuitBreakerState
        - DataClassification
        - ErrorType
        - DQStatus
        - LifecyclePhase
        - AuditOperation
        - AuditLayer
        - AnomalyType
        - AnomalySeverity

    # TypedDict classes (suffix 'Dict' is implicit)
    typed_dicts:
        - BronzeRecord
        - SilverRecord
        - RawDate
        - NormalizedDate
        - RawAuthor
        - RawIdentifiers
        - NormalizedIdentifiers
        - RawClassification
        - NormalizedClassification
        # And all *Dict classes

    # Value objects and simple results
    value_objects:
        - Anomaly
        - ClearDecision
        - ClearResult
        - CleanupPreview
        - CleanupResult
        - LayerInfo
        - TransformResult
        - TransformedRecord
        - BatchResult
        - DQResult
        - VacuumResult
        - ValidationResult
        - HealthReport
        - PreflightReport
        - ComponentHealthResult
        - FilterLoadResult
        - MemoryStats
        - ProviderHealthState
        - ShutdownSignal
        - AuditEntry
        - LockContext
        - PipelineEvent
        - RetryPolicy
        - LineageRecord
        - BatchLineage

    # Context and configuration objects
    contexts:
        - InputFilterContext
        - VacuumConfig
        - PipelineContext
        - PipelineRunContext
        - StorageContext
        - ObservabilityBundle
        - RunnerServices
        - PipelineServices
        - PipelineDefinition
        - ProviderConfig
        - HttpConfig
        - RunOptions
        - VacuumOptions
        - ArchiveOptions
        - RecordProcessorConfig
        - MemoryConfig

    # Base classes (prefix 'Base' is sufficient)
    base_classes:
        - BaseEntity
        - BasePipeline
        - BaseTransformer
        - BaseHttpAdapter
        - BaseSyncAdapter
        - BaseFieldExtractor
        - BaseChemblTransformer
        - BaseServicesFactory
        - RequiredEntityFields

    # Policy classes
    policies:
        - MedallionPolicy
        - WriteModePolicy

    # Filter classes
    filters:
        - GoldRangeFilter
        - GoldColumnFilter
        - GoldListLengthFilter
        - GoldListContainsFilter
        - GoldFilterConfig
        - InputFilterConfig
        - FilteredDataSource

# Function prefix exceptions
# Functions that don't require standard prefixes (get_, fetch_, create_, etc.)
function_prefix_exceptions:
    # CLI entry points
    - main
    - cli
    - run

    # Event handlers (naming is descriptive)
    - vacuum_command
    - archive_command
    - quarantine
    - checkpoint
    - maintenance

    # Magic/dunder methods are exempt
    # - __init__, __call__, etc.

