      - base_name: topics
        columns:
          - openalex.publication.topics

  # ===== CITATIONS_AND_REFERENCE =====
  - id: citations_and_reference
    display_name: "Citations & Reference"
    include_in_gold: true
    fields:
      - base_name: citation_subset
        columns:
          - pubmed.publication.citation_subset

      - base_name: chemical_count
        columns:
          - pubmed.publication.chemical_count

      - base_name: citation_count
        columns:
          - crossref.publication.citation_count
          - openalex.publication.citation_count
          - pubmed.publication.citation_count
          - semanticscholar.publication.citation_count

      - base_name: reference_count
        columns:
