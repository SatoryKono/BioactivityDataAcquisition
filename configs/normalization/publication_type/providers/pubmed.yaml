# configs/normalization/publication_type/providers/pubmed.yaml
# ─────────────────────────────────────────────────────────────────────
# PubMed → Canonical publication type mapping.
#
# Source: <PublicationTypeList> XML elements (MeSH Category V)
# A record can have MULTIPLE publication types simultaneously.
# Strategy: map each type independently; resolver picks highest-priority.
#
# Priority order (when multiple types present):
#   1. Most specific study design (CLINICAL_TRIAL > OBSERVATIONAL_STUDY > JOURNAL_ARTICLE)
#   2. EXP wins over REV (if both Journal Article + Review, treat as REV=REVIEW)
#
# Docs: https://www.nlm.nih.gov/mesh/pubtypes.html (MeSH 2025)
# ─────────────────────────────────────────────────────────────────────
version: "1.0.0"
provider: pubmed
source_field: publication_types   # JSON array from <PublicationTypeList>
vocabulary: ../vocabulary.yaml

# PubMed types are Title Case with spaces
case_sensitive: true
default: OTHER

# Priority: lower number = higher priority in multi-type resolution
# When a PubMed record has multiple types, pick the one with lowest priority number
priority_order:
  - CLINICAL_TRIAL          # 1 — most specific study design
  - OBSERVATIONAL_STUDY     # 2
  - COMPARATIVE_STUDY       # 3
  - VALIDATION_STUDY        # 4
  - MULTICENTER_STUDY       # 5
  - CASE_REPORT             # 6
  - DATASET                 # 7
  - PATENT                  # 8
  - DISSERTATION            # 9
  - TECHNICAL_REPORT        # 10
  - SYSTEMATIC_REVIEW       # 11 — most specific review type
  - META_ANALYSIS           # 12
  - REVIEW                  # 13
  - GUIDELINE               # 14
  - JOURNAL_ARTICLE         # 15 — generic, lowest priority
  - PREPRINT                # 16
  - EDITORIAL               # 17
  - LETTER                  # 18
  - NEWS                    # 19
  - ERRATUM                 # 20
  - RETRACTION              # 21
  - OTHER                   # 22

mapping:
  # --- EXP: Primary Research ----------------------------------------
  "Journal Article":                            JOURNAL_ARTICLE
  "Preprint":                                   PREPRINT
  "Dataset":                                    DATASET
  "Database":                                   DATASET
  "Academic Dissertation":                      DISSERTATION
  "Technical Report":                           TECHNICAL_REPORT
  "Patent":                                     PATENT
  "Electronic Supplementary Materials":         JOURNAL_ARTICLE
  "Statistics":                                 JOURNAL_ARTICLE
  "Annual Report":                              TECHNICAL_REPORT

  # --- EXP: Clinical Trials (all designs → CLINICAL_TRIAL) ----------
  "Clinical Trial":                             CLINICAL_TRIAL
  "Clinical Trial Protocol":                    CLINICAL_TRIAL
  "Clinical Trial, Phase I":                    CLINICAL_TRIAL
  "Clinical Trial, Phase II":                   CLINICAL_TRIAL
  "Clinical Trial, Phase III":                  CLINICAL_TRIAL
  "Clinical Trial, Phase IV":                   CLINICAL_TRIAL
  "Clinical Trial, Veterinary":                 CLINICAL_TRIAL
  "Adaptive Clinical Trial":                    CLINICAL_TRIAL
  "Pragmatic Clinical Trial":                   CLINICAL_TRIAL
  "Equivalence Trial":                          CLINICAL_TRIAL
  "Randomized Controlled Trial":                CLINICAL_TRIAL
  "Randomized Controlled Trial, Veterinary":    CLINICAL_TRIAL
  "Controlled Clinical Trial":                  CLINICAL_TRIAL

  # --- EXP: Observational & Other Study Designs --------------------
  "Clinical Study":                             OBSERVATIONAL_STUDY
  "Clinical Conference":                        CONFERENCE_PAPER
  "Observational Study":                        OBSERVATIONAL_STUDY
  "Observational Study, Veterinary":            OBSERVATIONAL_STUDY
  "Comparative Study":                          COMPARATIVE_STUDY
  "Validation Study":                           VALIDATION_STUDY
  "Evaluation Study":                           VALIDATION_STUDY
  "Multicenter Study":                          MULTICENTER_STUDY
  "Twin Study":                                 OBSERVATIONAL_STUDY
  "Case Reports":                               CASE_REPORT
  "Congress":                                   CONFERENCE_PAPER

  # --- REV: Reviews & Syntheses ------------------------------------
  "Review":                                     REVIEW
  "Systematic Review":                          SYSTEMATIC_REVIEW
  "Scoping Review":                             SYSTEMATIC_REVIEW
  "Meta-Analysis":                              META_ANALYSIS
  "Network Meta-Analysis":                      META_ANALYSIS
  "Scientific Integrity Review":                REVIEW

  # --- REV: Editorial & Commentary ---------------------------------
  "Editorial":                                  EDITORIAL
  "Letter":                                     LETTER
