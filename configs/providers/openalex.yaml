version: 1.0.0
provider: openalex
source:
    provider_config:
        provider: openalex
        base_url: https://api.openalex.org
        auth_type: api_key
        api_key_env: BIOETL_OPENALEX_API_KEY
        mailto: ${BIOETL_OPENALEX_EMAIL}
        client:
            timeout_sec: 30.0
            max_retries: 3
        pagination:
            page_size: 200
            id_batch_size: 50
            strategy: cursor
        fallback:
            enabled: true
            supported_filter_field: doi
            unsupported_filter_event: unsupported_filter_field_for_fallback
            unsupported_filter_message: OpenAlex fallback only supports 'doi' filtering,
                skipping
            skip_on_unsupported_filter_field: true
            primary_lookup_method: doi
            trim_primary_ids_to_limit: false
            fallback_operation: fetch_filtered_with_fallback
    circuit_breaker:
        failure_threshold: 5
        recovery_timeout: 300
    rate_limit:
        requests_per_second: 10
        burst: 20
        credit_model:
            enabled: true
            budget_source: provider_account
        rate_limit_headers:
            - X-RateLimit-Limit
            - X-RateLimit-Remaining
            - X-RateLimit-Credits-Used
            - X-RateLimit-Reset
    health_check:
        endpoint: /works
        params:
            per-page: 1
        timeout: 5
    retry:
        use_retry_after: true
entities:
    - publication
entity_notes:
    publication:
        description: Scholarly works metadata via DOI resolution
        input_mode: CSV file with DOIs
        fallback: Title search when DOI not found
        batch_size: 50
quality:
    version: 1.0.0
    provider: openalex
    thresholds:
        soft_fail: 0.08
        hard_fail: 0.25
    provider_field_validations:
        -   field: openalex_id
            type: pattern
            pattern: ^W\d+$
            nullable: true
            error_message: Invalid OpenAlex ID format (must start with W followed by digits)
        -   field: doi
            type: pattern
            pattern: ^10\.\d{4,}/\S+$
            nullable: true
            error_message: Invalid DOI format (must match 10.XXXX/suffix, no whitespace)
        -   field: publication_year
            type: range
            min: 1500
            max: 2100
            nullable: true
            error_message: Publication year out of valid range
filters:
    version: 1.0.0
    provider: openalex
    input_filter:
        batch_size: 50
