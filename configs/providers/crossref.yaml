version: 1.0.0
provider: crossref
source:
    provider_config:
        provider: crossref
        base_url: https://api.crossref.org
        auth_type: email
        # Documentation-only polite-pool contact. Runtime operators set the
        # real technical contact through BIOETL_DEFAULT_EMAIL.
        mailto: "your-email@example.com"
        client:
            timeout_sec: 30.0
            max_retries: 3
        pagination:
            page_size: 50
            id_batch_size: 50
            strategy: cursor
        fallback:
            enabled: true
            supported_filter_field: doi
            unsupported_filter_event: unsupported_filter_field_for_fallback
            unsupported_filter_message: CrossRef fallback only supports 'doi' filtering,
                proceeding with DOI semantics
            skip_on_unsupported_filter_field: false
            primary_lookup_method: doi
            trim_primary_ids_to_limit: true
            fallback_operation: fetch_filtered_with_fallback
    circuit_breaker:
        failure_threshold: 5
        recovery_timeout: 300
    rate_limit:
        requests_per_second: 50
        burst: 100
        polite_pool: true
    health_check:
        endpoint: /works
        params:
            rows: 1
        timeout: 5
    retry:
        use_retry_after: true
entities:
    - publication
entity_notes:
    publication:
        description: Publication metadata via DOI resolution
        input_mode: CSV file with DOIs
        fallback: Title search when DOI not found (404)
        batch_size: 50
quality:
    version: 1.0.0
    provider: crossref
    thresholds:
        soft_fail: 0.1
        hard_fail: 0.50
    provider_field_validations:
        -   field: doi
            type: pattern
            pattern: ^10\.\d{4,}/\S+$
            nullable: true
            error_message: Invalid DOI format (must match 10.XXXX/suffix, no whitespace)
        -   field: publication_year
            type: range
            min: 1500
            max: 2100
            nullable: true
            error_message: Publication year out of valid range
filters:
    version: 1.0.0
    provider: crossref
    input_filter:
        batch_size: 50
