content_hash:
  include: []
  exclude: []

column_groups:
  - name: system
    fields:
      - entity_id
      - content_hash
      - _run_id
      - _run_type
      - _source_batch_id
      - _source
      - _ingestion_ts
      - _index
      - _lookup_method
      - _original_id

  - name: identifiers
    fields:
      - publication_doi
      - alternative_id

  - name: title
    fields:
      - title

  - name: authors
    fields:
      - authors
      - author_keys

  - name: journal
    fields:
      - journal
      - journal_name_short

  - name: issn
    fields:
      - issn
      - issn_list
      - issn_print
      - issn_electronic

  - name: year
    fields:
      - publication_year

  - name: dates
    fields:
      - publication_date
      - published
      - published_online
      - published_print

  - name: pagination
    fields:
      - volume
      - issue
      - page_first
      - page_last

  - name: citations
    fields:
      - citations_received
      - citations_made

  - name: subjects
    fields:
      - subject_keywords

  - name: language
    fields:
      - language

  - name: publisher
    fields:
      - publisher

  - name: doc_type
    fields:
      - publication_type
      - publication_type_unified
      - publication_subclass
      - publication_class

  - name: content_domain
    fields:
      - content_domain_domains
      - content_domain_crossmark_restriction

  - name: license
    fields:
      - license_url

  - name: dq
    pattern: "^_dq_"

# Field aliases for backward compatibility
field_aliases:
  short_container_title: journal_name_short
  year: publication_year
  first_page: page_first
  last_page: page_last
  citation_count: citations_received
  reference_count: citations_made
  subjects: subject_keywords
  source_type: publication_type
  doi: publication_doi
  # author_orcids: now native field name (was: author_orcid_list)

# Layer-specific column filtering
silver:
  include_groups:
    - system
    - identifiers
    - title
    - authors
    - journal
    - issn
    - year
    - dates
    - pagination
    - citations
    - subjects
    - language
    - publisher
    - doc_type
    - content_domain
    - license
    - dq

gold:
  include_groups:
    - system
    - identifiers
    - title
    - authors
    - journal
    - year
    - pagination
    - citations
    - publisher
    - doc_type
  exclude_fields:
    - _dq_*
    - _source_batch_id
    - _index
    - _lookup_method
    - _original_id
