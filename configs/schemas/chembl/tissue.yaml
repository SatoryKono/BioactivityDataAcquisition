content_hash:
  include: []
  exclude: []

# configs/schemas/chembl/tissue.yaml
# Column group definitions for ChEMBL Tissue entity

version: "1.0.0"
entity: tissue

column_groups:
  - name: system
    fields:
      - entity_id
      - content_hash
      - _run_id
      - _run_type
      - _source
      - _ingestion_ts
  - name: identifiers
    fields:
      - tissue_id
  - name: business
    fields:
      - pref_name
      - bto_id
      - caloha_id
      - efo_id
      - uberon_id

silver:
  include_groups:
    - system
    - identifiers
    - business

gold:
  include_groups:
    - system
    - identifiers
    - business
