content_hash:
  include: []
  exclude: []

column_groups:
  - name: system
    fields:
      - entity_id
      - content_hash
      - _run_id
      - _run_type
      - _source_batch_id
      - _source
      - _ingestion_ts
      - _index
      - _lookup_method
      - _original_id

  - name: identifiers
    fields:
      - publication_id
      - publication_doi
      - publication_pmid
      - publication_pmc_id

  - name: title
    fields:
      - title

  - name: abstract
    fields:
      - abstract

  - name: authors
    fields:
      - authors
      - author_keys

  - name: journal
    fields:
      - journal

  - name: year
    fields:
      - publication_year

  - name: pagination
    fields:
      - volume
      - issue
      - page_first
      - page_last

  - name: doc_type
    fields:
      - publication_type

  - name: provider_ids
    fields:
      - src_id
      - chembl_release
      - creation_date

  - name: dq
    pattern: "^_dq_"

# Field aliases for backward compatibility
field_aliases:
  year: publication_year
  first_page: page_first
  last_page: page_last
  doc_type: publication_type
  document_chembl_id: publication_id
  doi: publication_doi
  pmid: publication_pmid
  pmc_id: publication_pmc_id

# Layer-specific column filtering
silver:
  include_groups:
    - system
    - identifiers
    - title
    - abstract
    - authors
    - journal
    - year
    - pagination
    - doc_type
    - provider_ids
    - dq

gold:
  include_groups:
    - system
    - identifiers
    - title
    - abstract
    - authors
    - journal
    - year
    - pagination
    - doc_type
  exclude_fields:
    - _dq_*
    - _source_batch_id
    - _index
    - _lookup_method
    - _original_id
