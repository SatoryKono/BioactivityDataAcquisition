column_groups:
  - name: system
    fields:
      - entity_id
      - content_hash
      - _run_id
      - _run_type
      - _source_batch_id
      - _ingestion_ts
      - _index

  - name: business
    fields:
      - cell_id
      - cell_name
      - cell_description
      - cell_source_tissue
      - cell_source_organism
      - cell_source_taxonomy_id
      - cell_type
      - cellosaurus_id
      - clo_id
      - cl_lincs_id
      - efo_id

  - name: dq
    pattern: "^_dq_"

silver:
  include_groups:
    - system
    - business
    - dq
  exclude_fields: []
  alias_policy: preserve

gold:
  include_groups:
    - system
    - business
  exclude_fields:
    - _dq_*
    - _source_batch_id
    - _index
  alias_policy: canonical
