column_groups:
  - name: system
    fields:
      - entity_id
      - content_hash
      - _run_id
      - _run_type
      - _source_batch_id
      - _ingestion_ts
      - _index

  - name: business
    fields:
      - sim_id
      - doc_1
      - doc_2
      - pubmed_id1
      - pubmed_id2
      - tid_tani
      - mol_tani
      - avg_tani
      - max_tani

  - name: dq
    pattern: "^_dq_"

silver:
  include_groups:
    - system
    - business
    - dq
  exclude_fields: []
  alias_policy: preserve

gold:
  include_groups:
    - system
    - business
  exclude_fields:
    - _dq_*
    - _source_batch_id
    - _index
  alias_policy: canonical
