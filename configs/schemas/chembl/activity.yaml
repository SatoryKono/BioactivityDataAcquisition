column_groups:
  - name: system
    fields:
      - entity_id
      - content_hash
      - _run_id
      - _run_type
      - _source_batch_id
      - _ingestion_ts
      - _index

  - name: business
    fields:
      - activity_id
      - assay_id
      - molecule_id
      - target_id
      - publication_id
      - standard_relation
      - standard_value
      - standard_units
      - standard_type
      - standard_flag
      - pchembl_value
      - data_validity_comment
      - activity_comment
      - potential_duplicate
      - bao_endpoint
      - uo_units
      - qudt_units
      - src_id
      - record_id
      - type
      - relation
      - value
      - units
      - text_value
      - standard_text_value
      - upper_value
      - standard_upper_value
      - toid
      - manual_curation_flag
      - original_activity_id
      - data_validity_description
      - ligand_efficiency_bei
      - ligand_efficiency_le
      - ligand_efficiency_lle
      - ligand_efficiency_sei
      - action_type
      - action_type_description
      - action_type_parent_type
      - activity_properties
      - canonical_smiles
      - molecule_pref_name
      - parent_molecule_id
      - target_pref_name
      - target_organism
      - target_taxonomy_id
      - assay_type
      - assay_description
      - assay_variant_accession
      - assay_variant_mutation
      - bao_format
      - bao_label
      - journal
      - publication_doi
      - publication_pmid
      - publication_pmc_id
      - publication_year

  - name: dq
    pattern: "^_dq_"

silver:
  include_groups:
    - system
    - business
    - dq
  exclude_fields: []
  alias_policy: preserve

gold:
  include_groups:
    - system
    - business
  exclude_fields:
    - _dq_*
    - _source_batch_id
    - _index
  alias_policy: canonical
