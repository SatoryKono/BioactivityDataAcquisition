content_hash:
  include: []
  exclude: []


column_groups:
  - name: system
    fields:
      - entity_id
      - content_hash
      - _run_id
      - _run_type
      - _source_batch_id
      - _ingestion_ts
      - _index

  - name: business
    fields:
      - molecule_id
      - pref_name
      - max_phase
      - structure_type
      - molecule_type
      - first_approval
      - therapeutic_flag
      - oral
      - parenteral
      - topical
      - black_box_warning
      - natural_product
      - first_in_class
      - prodrug
      - inorganic_flag
      - polymer_flag
      - withdrawn_flag
      - chirality
      - dosed_ingredient
      - availability_type
      - usan_year
      - usan_stem
      - usan_substem
      - usan_stem_definition
      - helm_notation
      - molecule_species
      - hierarchy_parent_chembl_id
      - hierarchy_active_chembl_id
      - hierarchy_child_chembl_id
      - logp
      - logp_method
      - mw_freebase
      - molecular_weight
      - hba_count
      - hbd_count
      - polar_surface_area
      - rotatable_bond_count
      - ro5_violation_count
      - heavy_atom_count
      - aromatic_ring_count
      - qed_score
      - molecular_formula
      - ro3_pass
      - canonical_smiles
      - standard_inchi
      - inchi_key
      - molecule_hierarchy
      - molecule_properties
      - molecule_structures
      - molecule_synonyms
      - cross_references
      - atc_classifications

  - name: dq
    pattern: "^_dq_"

silver:
  include_groups:
    - system
    - business
    - dq
  exclude_fields: []
  alias_policy: preserve

gold:
  include_groups:
    - system
    - business
  exclude_fields:
    - _dq_*
    - _source_batch_id
    - _index
  alias_policy: canonical
