column_groups:
  - name: system
    fields:
      - entity_id
      - content_hash
      - _run_id
      - _run_type
      - _source_batch_id
      - _ingestion_ts
      - _index

  - name: business
    fields:
      - component_id
      - accession
      - component_type
      - description
      - organism
      - taxonomy_id
      - target_component_synonyms
      - target_component_xrefs
      - protein_classifications
      - protein_classification_id
      - protein_classification_ids

  - name: dq
    pattern: "^_dq_"

silver:
  include_groups:
    - system
    - business
    - dq
  exclude_fields: []
  alias_policy: preserve

gold:
  include_groups:
    - system
    - business
  exclude_fields:
    - _dq_*
    - _source_batch_id
    - _index
  alias_policy: canonical
