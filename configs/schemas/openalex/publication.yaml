column_groups:
  - name: system
    fields:
      - entity_id
      - content_hash
      - _run_id
      - _run_type
      - _source_batch_id
      - _source
      - _ingestion_ts
      - _index
      - _lookup_method
      - _original_id

  - name: identifiers
    fields:
      - openalex_id
      - publication_doi
      - publication_pmid
      - mag_id

  - name: title
    fields:
      - title

  - name: abstract
    fields:
      - abstract

  - name: authors
    fields:
      - authors
      - author_openalex_ids
      - author_orcids

  - name: affiliations
    fields:
      - affiliation_list

  - name: institutions
    fields:
      - institution_ids
      - institution_country_codes
      - ror_ids

  - name: journal
    fields:
      - journal
      - issn

  - name: year
    fields:
      - publication_year

  - name: dates
    fields:
      - publication_date

  - name: pagination
    fields:
      - volume
      - issue
      - page_first
      - page_last

  - name: citations
    fields:
      - citations_received
      - citations_made
      - fwci

  - name: open_access
    fields:
      - is_oa
      - oa_status

  - name: subjects
    fields:
      - subject_topics
      - primary_topic
      - subject_keywords
      - subject_mesh

  - name: publisher
    fields:
      - publisher

  - name: funding
    fields:
      - grants

  - name: doc_type
    fields:
      - publication_type
      - publication_type_unified
      - publication_subclass
      - publication_class

  - name: quality
    fields:
      - is_retracted

  - name: language
    fields:
      - language

  - name: dq
    pattern: "^_dq_"

# Field aliases for backward compatibility
field_aliases:
  affiliations: affiliation_list
  year: publication_year
  first_page: page_first
  last_page: page_last
  citation_count: citations_received
  reference_count: citations_made
  topics: subject_topics
  keywords: subject_keywords
  mesh_terms: subject_mesh
  source_type: publication_type
  doi: publication_doi
  pmid: publication_pmid

# Layer-specific column filtering
silver:
  include_groups:
    - system
    - identifiers
    - title
    - abstract
    - authors
    - affiliations
    - institutions
    - journal
    - year
    - dates
    - pagination
    - citations
    - open_access
    - subjects
    - publisher
    - funding
    - doc_type
    - quality
    - language
    - dq

gold:
  include_groups:
    - system
    - identifiers
    - title
    - abstract
    - authors
    - journal
    - year
    - citations
    - open_access
    - subjects
    - quality
  exclude_fields:
    - _dq_*
    - _source_batch_id
    - _index
    - _lookup_method
    - _original_id
