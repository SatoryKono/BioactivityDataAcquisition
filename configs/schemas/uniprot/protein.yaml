column_groups:
  - name: system
    fields:
      - entity_id
      - content_hash
      - _run_id
      - _run_type
      - _source_batch_id
      - _ingestion_ts
      - _index

  - name: business
    fields:
      - accession
      - entry_name
      - entry_type
      - secondary_accessions
      - protein_name
      - protein_short_names
      - protein_alternative_names
      - protein_ec_numbers
      - flag
      - gene_primary
      - gene_synonyms
      - gene_orf_names
      - organism_scientific
      - organism_common
      - taxonomy_id
      - lineage
      - sequence
      - sequence_length
      - sequence_mass
      - sequence_checksum
      - sequence_modified
      - entry_version
      - entry_created
      - entry_modified
      - reviewed
      - protein_existence
      - annotation_score
      - function_comment
      - catalytic_activity
      - activity_regulation
      - subunit
      - pathway
      - subcellular_location
      - tissue_specificity
      - alternative_products
      - disease_involvement
      - pharmaceutical_use
      - similarity_comment
      - caution
      - cofactors
      - biophysicochemical_properties
      - induction
      - go_terms
      - drugbank_ids
      - chembl_ids
      - guidetopharmacology_ids
      - pdb_xrefs
      - interpro_xrefs
      - pfam_xrefs
      - reactome_xrefs
      - superkingdom
      - phylum
      - genus
      - molecular_function
      - cellular_component
      - features_json
      - domains
      - binding_sites
      - active_sites
      - keywords
      - topology
      - transmembrane
      - intramembrane
      - signal_peptide
      - propeptide
      - glycosylation
      - lipidation
      - disulfide_bond
      - modified_residue
      - phosphorylation
      - acetylation
      - ubiquitination
      - isoform_names
      - isoform_ids
      - isoform_synonyms
      - reactions
      - reaction_ec_numbers
      - cross_reference_count
      - feature_count
      - keyword_count
      - publication_count
      - isoform_count

  - name: dq
    pattern: "^_dq_"

silver:
  include_groups:
    - system
    - business
    - dq
  exclude_fields: []
  alias_policy: preserve

gold:
  include_groups:
    - system
    - business
  exclude_fields:
    - _dq_*
    - _source_batch_id
    - _index
  alias_policy: canonical
