column_groups:
  - name: system
    fields:
      - entity_id
      - content_hash
      - _run_id
      - _run_type
      - _source_batch_id
      - _ingestion_ts
      - _index

  - name: business
    fields:
      - target_id
      - uniprot_accession
      - mapping_status
      - uniprot_entry_name
      - organism_scientific
      - organism_common
      - taxonomy_id
      - protein_name
      - gene_primary
      - sequence_length
      - sequence_mass
      - reviewed
      - annotation_score
      - all_mappings

  - name: dq
    pattern: "^_dq_"

silver:
  include_groups:
    - system
    - business
    - dq
  exclude_fields: []
  alias_policy: preserve

gold:
  include_groups:
    - system
    - business
  exclude_fields:
    - _dq_*
    - _source_batch_id
    - _index
  alias_policy: canonical
