content_hash:
  include: []
  exclude: []


column_groups:
  - name: system
    fields:
      - entity_id
      - content_hash
      - _run_id
      - _run_type
      - _source_batch_id
      - _ingestion_ts
      - _index

  - name: business
    fields:
      - molecule_id
      - canonical_smiles
      - isomeric_smiles
      - inchi
      - inchi_key
      - molecular_formula
      - iupac_name
      - molecular_weight
      - exact_mass
      - monoisotopic_mass
      - xlogp
      - tpsa
      - complexity
      - charge
      - heavy_atom_count
      - h_bond_donor_count
      - h_bond_acceptor_count
      - rotatable_bond_count
      - atom_stereo_count
      - defined_atom_stereo_count
      - undefined_atom_stereo_count
      - bond_stereo_count
      - defined_bond_stereo_count
      - undefined_bond_stereo_count
      - isotope_atom_count
      - covalent_unit_count
      - volume_3d
      - conformer_count_3d
      - feature_acceptor_count_3d
      - feature_donor_count_3d
      - feature_anion_count_3d
      - feature_cation_count_3d
      - feature_ring_count_3d
      - feature_hydrophobe_count_3d
      - effective_rotor_count_3d
      - conformer_rmsd_3d
      - x_steric_quadrupole_3d
      - y_steric_quadrupole_3d
      - z_steric_quadrupole_3d
      - feature_count_3d

  - name: dq
    pattern: "^_dq_"

silver:
  include_groups:
    - system
    - business
    - dq
  exclude_fields: []
  alias_policy: preserve

gold:
  include_groups:
    - system
    - business
  exclude_fields:
    - _dq_*
    - _source_batch_id
    - _index
  alias_policy: canonical
