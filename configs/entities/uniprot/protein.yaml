version: 1.0.0
provider: uniprot
entity: protein
pipeline:
  pipeline_name: uniprot_protein
  provider: uniprot
  entity_type: protein
  description: Pipeline for ingesting UniProt proteins
  field_policy: {}
  business_primary_keys:
  - accession

  sink:
    silver:
      partition_by:
      - organism_scientific
    gold:
      mode: scd2
      idempotency_contract: scd2
      scd_config:
        valid_from_col: _valid_from
        valid_to_col: _valid_to
        current_flag_col: _is_current
        version_col: _version
  batch_size: 1000
  checkpoint_interval: 1000
  source:
    api:
      base_url: https://rest.uniprot.org
      from_db: ChEMBL
      to_db: UniProtKB

schema:
  field_aliases:
    reference_count: citations_made
    affiliations: affiliation_list
    citation_count: citations_received
    keywords: subject_keywords
    mesh_terms: subject_mesh
    pages: page_range
    source_type: publication_type
    fields_of_study: subject_fields
    journal_abbrev: journal_name_short
    journal_title: journal_name
    short_container_title: journal_name_short
    structured_affiliations: affiliation_structured
    subjects: subject_keywords
    topics: subject_topics
  content_hash:
    include: []
    exclude: []
  column_groups:
  - name: system
    fields:
    - entity_id
    - content_hash
    - _run_id
    - _run_type
    - _source_batch_id
    - _ingestion_ts
    - _index
  - name: business
    fields:
    - accession
    - entry_name
    - entry_type
    - secondary_accessions
    - protein_name
    - protein_short_names
    - protein_alternative_names
    - protein_ec_numbers
    - flag
    - gene_primary
    - gene_synonyms
    - gene_orf_names
    - organism_scientific
    - organism_common
    - taxonomy_id
    - lineage
    - sequence
    - sequence_length
    - sequence_mass
    - sequence_checksum
    - sequence_modified
    - entry_version
    - entry_created
    - entry_modified
    - reviewed
    - protein_existence
    - annotation_score
    - function_comment
    - catalytic_activity
    - activity_regulation
    - subunit
    - pathway
    - subcellular_location
    - tissue_specificity
    - alternative_products
    - alternative_products_raw_json
    - alternative_products_canonical_json
    - disease_involvement
    - pharmaceutical_use
    - similarity_comment
    - caution
    - cofactors
    - cofactors_raw_json
    - cofactors_canonical_json
    - biophysicochemical_properties
    - biophysicochemical_properties_raw_json
    - biophysicochemical_properties_canonical_json
    - induction
    - go_terms
    - drugbank_ids
    - chembl_ids
    - guidetopharmacology_ids
    - pdb_xrefs
    - interpro_xrefs
    - pfam_xrefs
    - reactome_xrefs
    - superkingdom
    - phylum
    - genus
    - molecular_function
    - cellular_component
    - features_canonical_json
    - features_json
    - features_raw_json
    - domains
    - binding_sites
    - active_sites
    - keywords
    - topology
    - transmembrane
    - intramembrane
    - signal_peptide
    - propeptide
    - glycosylation
    - lipidation
    - disulfide_bond
    - modified_residue
    - phosphorylation
    - acetylation
    - ubiquitination
    - isoform_names
    - isoform_ids
    - isoform_synonyms
    - reactions
    - reactions_raw_json
    - reactions_canonical_json
    - reaction_ec_numbers
    - cross_reference_count
    - feature_count
    - keyword_count
    - publication_count
    - isoform_count
  - name: dq
    pattern: ^_dq_
  silver:
    include_groups:
    - system
    - business
    - dq
    exclude_fields: []
    alias_policy: preserve
  gold:
    include_groups:
    - system
    - business
    exclude_fields:
    - _dq_*
    - _source_batch_id
    - _index
    alias_policy: canonical
quality:
  metadata:
    assay_parameter_type_policy:
      scope: raw_plus_canonical_controlled_vocabulary
      description: RAW-PLUS-CANONICAL ChEMBL assay-parameter typing policy. The pipeline preserves the provider-native 
        type lexeme in type_raw for reviewability while parameter_type stores the canonical controlled-vocabulary value 
        used by Silver/Gold semantics and DQ governance.
      field_semantics:
        type_raw: Preserve the raw/provider-native assay-parameter type token as trimmed text for review and drift 
          analysis.
        type: Published reviewed Silver alias for the canonical normalized assay-parameter type surface used by 
          downstream Silver/Gold consumers and governance reporting.
        parameter_type: Store the canonical assay-parameter type vocabulary value used for normalized Silver/Gold 
          behavior; unknown provider lexemes are preserved as reviewed uppercase canonical candidates rather than 
          rejected at profile time.
        standard_type: Store the canonical strict standard_type surface governed by the shared ChEMBL assay-parameter 
          universe and DQ policy.
    publication_type_policy:
      scope: source_specific
      description: SOURCE-SPECIFIC ChEMBL publication typing policy. This pipeline accepts only the reviewed 
        ChEMBL-native subset and maps it into the broader global publication taxonomy defined in 
        configs/enums/chembl.yaml without redefining that global cross-provider taxonomy.
      field_semantics:
        publication_type_raw: Preserve the raw/native ChEMBL publication type token for traceability and 
          provider-specific review.
        publication_type: Store the canonical publication type mapped into the global taxonomy for normalized 
          Silver/Gold behavior.
    # Source-specific DQ policy:
    # - publication_type uses a ChEMBL-only allowed subset and does not redefine
    #   the global taxonomy in configs/enums/chembl.yaml.
    # - publication_type_raw preserves the provider-native token for traceability.
    # - publication_type stores the canonical mapped type used by this pipeline.
    subcellular_fraction_policy:
      scope: raw_plus_canonical_derived_vocabulary
      description: RAW-PLUS-CANONICAL ChEMBL subcellular-fraction policy. The pipeline preserves the source lexeme in 
        subcellular_fraction_raw while subcellular_fraction stores the normalized derived vocabulary used by Silver/Gold
        contracts. Unknown source lexemes remain reviewable rather than being fail-closed into a strict enum.
      field_semantics:
        subcellular_fraction_raw: Preserve the raw/source ChEMBL subcellular-fraction label as trimmed text for 
          traceability and synonym review.
        subcellular_fraction: Store the canonical normalized subcellular-fraction label used for downstream Silver/Gold 
          semantics; unknown reviewed labels are preserved after canonical text normalization instead of being 
          discarded.
  version: 1.0.0
  provider: uniprot
  entity: protein
  entity_field_validations:
  - field: accession
    type: pattern
    pattern: ^[A-Z0-9]{6,10}$
    nullable: false
    error_message: UniProt accession must be 6-10 alphanumeric chars
  - field: entry_name
    type: pattern
    pattern: ^[A-Z0-9_]+$
    nullable: true
    error_message: Entry name must be alphanumeric with underscores
  - field: entry_type
    type: enum
    allowed:
    - UniProtKB reviewed (Swiss-Prot)
    - UniProtKB unreviewed (TrEMBL)
    nullable: true
    error_message: Invalid UniProt entry_type value
  - field: flag
    type: enum
    allowed:
    - Fragment
    - Precursor
    - Fragments
    nullable: true
    error_message: Invalid UniProt flag value
  - field: organism_scientific
    type: pattern
    pattern: ^[A-Z][a-z]+ [a-z]+.*$
    nullable: true
    error_message: Organism should be in binomial nomenclature
  - field: taxonomy_id
    type: range
    min: 1
    max: 10000000
    nullable: true
    error_message: Taxonomy ID must be positive
  - field: sequence_length
    type: range
    min: 1
    max: 100000
    nullable: true
    error_message: Sequence length must be between 1 and 100,000
  - field: sequence_mass
    type: range
    min: 100
    max: 10000000
    nullable: true
    error_message: Molecular mass must be between 100 and 10,000,000 Da
  - field: annotation_score
    type: range
    min: 1
    max: 5
    nullable: true
    error_message: Annotation score must be between 1 and 5
  - field: protein_existence
    type: enum
    allowed:
    - Evidence at protein level
    - Evidence at transcript level
    - Inferred from homology
    - Predicted
    - Uncertain
    nullable: true
    error_message: Invalid UniProt protein_existence value
  - field: go_terms
    type: pattern
    pattern: '^\[(("GO:\d{7}"|\{[^\]]*"id":"GO:\d{7}"[^\]]*\})(,("GO:\d{7}"|\{[^\]]*"id":"GO:\d{7}"[^\]]*\}))*)?\]$'
    nullable: true
    error_message: go_terms must be a canonical JSON array of GO references
  - field: pdb_xrefs
    type: pattern
    pattern: '^\[(("[A-Z0-9]{4}"|\{[^\]]*"id":"[A-Z0-9]{4}"[^\]]*\})(,("[A-Z0-9]{4}"|\{[^\]]*"id":"[A-Z0-9]{4}"[^\]]*\}))*)?\]$'
    nullable: true
    error_message: pdb_xrefs must be a canonical JSON array of PDB references
  - field: secondary_accessions
    type: pattern
    pattern: '^\[("[A-Z0-9]{6,10}"(,"[A-Z0-9]{6,10}")*)?\]$'
    nullable: true
    severity: warn
    error_message: secondary_accessions must be a canonical JSON string array of UniProt accessions
  - field: chembl_ids
    type: pattern
    pattern: '^\[("CHEMBL\d+"(,"CHEMBL\d+")*)?\]$'
    nullable: true
    severity: warn
    error_message: chembl_ids must be a canonical JSON string array of ChEMBL identifiers
  - field: drugbank_ids
    type: pattern
    pattern: '^\[("DB\d{5}"(,"DB\d{5}")*)?\]$'
    nullable: true
    severity: warn
    error_message: drugbank_ids must be a canonical JSON string array of DrugBank identifiers
  - field: interpro_xrefs
    type: pattern
    pattern: '^\[(("IPR\d{6}"|\{[^\]]*"id":"IPR\d{6}"[^\]]*\})(,("IPR\d{6}"|\{[^\]]*"id":"IPR\d{6}"[^\]]*\}))*)?\]$'
    nullable: true
    severity: warn
    error_message: interpro_xrefs must be a canonical JSON array of InterPro references
  - field: pfam_xrefs
    type: pattern
    pattern: '^\[(("PF\d{5}"|\{[^\]]*"id":"PF\d{5}"[^\]]*\})(,("PF\d{5}"|\{[^\]]*"id":"PF\d{5}"[^\]]*\}))*)?\]$'
    nullable: true
    severity: warn
    error_message: pfam_xrefs must be a canonical JSON array of Pfam references
  - field: reactome_xrefs
    type: pattern
    pattern: '^\[(("R-[A-Z]+-\d+"|\{[^\]]*"id":"R-[A-Z]+-\d+"[^\]]*\})(,("R-[A-Z]+-\d+"|\{[^\]]*"id":"R-[A-Z]+-\d+"[^\]]*\}))*)?\]$'
    nullable: true
    severity: warn
    error_message: reactome_xrefs must be a canonical JSON array of Reactome references
  - field: molecular_function
    type: pattern
    pattern: ^\[.*\]$
    nullable: true
    error_message: molecular_function must be JSON array
  - field: cellular_component
    type: pattern
    pattern: ^\[.*\]$
    nullable: true
    error_message: cellular_component must be JSON array
  - field: isoform_ids
    type: pattern
    pattern: ^\[.*\]$
    nullable: true
    error_message: isoform_ids must be JSON array
  - field: isoform_names
    type: pattern
    pattern: ^\[.*\]$
    nullable: true
    error_message: isoform_names must be JSON array
  - field: isoform_synonyms
    type: pattern
    pattern: ^\[.*\]$
    nullable: true
    error_message: isoform_synonyms must be JSON array
  - field: reactions
    type: pattern
    pattern: ^\[.*\]$
    nullable: true
    error_message: reactions must be JSON array
  - field: reaction_ec_numbers
    type: pattern
    pattern: ^\[.*\]$
    nullable: true
    error_message: reaction_ec_numbers must be JSON array
  - field: reviewed
    type: enum
    allowed_values:
    - true
    - false
    nullable: true
    error_message: reviewed must be an explicit boolean when present
  entity_cross_field_validations:
  - name: protein_identifiable
    fields:
    - accession
    - entry_name
    condition: all_present
    error_message: Protein must have accession and entry name
  entity_conditional_validations: []
  key_nullability:
  - field: accession
    key_type: merge
    nullable: false
  - field: organism_scientific
    key_type: partition
    nullable: false
filters:
  version: 1.0.0
  provider: uniprot
  entity: protein
  input_filter:
    enabled: true
    source_path: data/input/protein.csv
    column_name: uniprot_id
    filter_field: accession
    batch_size: 100
    checkpoint_interval: 1000
    fallback_column: title
  extraction_params: {}
  silver_filters:
    exclude_if_present: []
    required_fields:
    - accession
    - organism_scientific
  gold_filters:
    list_contains: {}
    list_lengths: {}
    ranges:
      publication_year:
        min: 1950
        max: 2050
    columns:
      reviewed:
      - true
    required_fields:
    - accession
    - entry_name
    - organism_scientific
    exclude_if_present: []
  metadata:
    publication_filter_policy:
      scope: source_specific
      description: SOURCE-SPECIFIC ChEMBL publication filter policy. Silver and Gold filters intentionally constrain 
        this pipeline to the reviewed ChEMBL publication subset and do not redefine the global publication taxonomy.
    # Source-specific filter policy:
    # - Silver and Gold are intentionally scoped to journal-article for the
    #   current ChEMBL publication pipeline.
    # - This is pipeline scope, not global publication type truth.
contracts:
  primary_key:
  - accession
  merge_keys:
  - accession
  hash_include: []
  hash_exclude: []
  hash_datetime_policy: v2_datetime_utc
hash_policy:
  provider: uniprot
  entity: protein
  contract:
    version: 1.0.0
    migration_note: Explicit config-level hash contract aligned with normalization profile uniprot.protein.
  hash_policy:
    algorithm: sha256
    canonicalization: provider + canonical_json_dumps(normalized_record)
    include_fields:
    - accession
    - acetylation
    - active_sites
    - activity_regulation
    - alternative_products
    - alternative_products_canonical_json
    - annotation_score
    - binding_sites
    - biophysicochemical_properties
    - biophysicochemical_properties_canonical_json
    - catalytic_activity
    - caution
    - cellular_component
    - chembl_ids
    - cofactors
    - cofactors_canonical_json
    - cross_reference_count
    - disease_involvement
    - disulfide_bond
    - domains
    - drugbank_ids
    - entry_created
    - entry_modified
    - entry_name
    - entry_type
    - entry_version
    - feature_count
    - features_canonical_json
    - features_json
    - flag
    - function_comment
    - gene_orf_names
    - gene_primary
    - gene_synonyms
    - genus
    - glycosylation
    - go_terms
    - guidetopharmacology_ids
    - induction
    - interpro_xrefs
    - intramembrane
    - isoform_count
    - isoform_ids
    - isoform_names
    - isoform_synonyms
    - keyword_count
    - keywords
    - lineage
    - lipidation
    - modified_residue
    - molecular_function
    - organism_common
    - organism_scientific
    - pathway
    - pdb_xrefs
    - pfam_xrefs
    - pharmaceutical_use
    - phosphorylation
    - phylum
    - propeptide
    - protein_alternative_names
    - protein_ec_numbers
    - protein_existence
    - protein_name
    - protein_short_names
    - publication_count
    - reaction_ec_numbers
    - reactions
    - reactions_canonical_json
    - reactome_xrefs
    - reviewed
    - secondary_accessions
    - sequence
    - sequence_checksum
    - sequence_length
    - sequence_mass
    - sequence_modified
    - signal_peptide
    - similarity_comment
    - subcellular_location
    - subunit
    - superkingdom
    - taxonomy_id
    - tissue_specificity
    - topology
    - transmembrane
    - ubiquitination
    exclude_fields:
    - _dq_error
    - _dq_warn
    - _index
    - _ingestion_ts
    - _lookup_method
    - _original_id
    - _run_id
    - _run_type
    - _source
    - _source_batch_id
    - alternative_products_raw_json
    - biophysicochemical_properties_raw_json
    - cofactors_raw_json
    - features_raw_json
    - reactions_raw_json
    exclude_patterns:
    - ^_dq_
    normalization:
      trim_strings: true
      round_floats:
        enabled: true
        precision: 10
      dates:
        enabled: true
        format: YYYY-MM-DD
      null_handling:
        nan_to_null: true
        inf_to_null: true
