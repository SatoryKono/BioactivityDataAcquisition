version: 1.0.0
provider: uniprot
entity: idmapping
pipeline:
  pipeline_name: uniprot_idmapping
  provider: uniprot
  entity_type: idmapping
  version: 1.1.0
  description: Maps ChEMBL target IDs to UniProt accessions via UniProt ID Mapping
    API
  business_primary_keys:
  - target_id
  source:
    api:
      base_url: https://rest.uniprot.org
      from_db: ChEMBL
      to_db: UniProtKB

  sink:
    gold:
      mode: scd2
      idempotency_contract: scd2
      scd_config:
        valid_from_col: _valid_from
        valid_to_col: _valid_to
        current_flag_col: _is_current
        version_col: _version
schema:
  content_hash:
    include: []
    exclude: []
  column_groups:
  - name: system
    fields:
    - entity_id
    - content_hash
    - _run_id
    - _run_type
    - _source_batch_id
    - _ingestion_ts
    - _index
  - name: business
    fields:
    - target_id
    - uniprot_accession
    - mapping_status
    - uniprot_entry_name
    - organism_scientific
    - organism_common
    - taxonomy_id
    - protein_name
    - gene_primary
    - sequence_length
    - sequence_mass
    - reviewed
    - annotation_score
    - all_mappings
  - name: dq
    pattern: ^_dq_
  silver:
    include_groups:
    - system
    - business
    - dq
    exclude_fields: []
    alias_policy: preserve
  gold:
    include_groups:
    - system
    - business
    exclude_fields:
    - _dq_*
    - _source_batch_id
    - _index
    alias_policy: canonical
quality:
  version: 1.0.0
  provider: uniprot
  entity: idmapping
  thresholds:
    soft_fail: 0.3
    hard_fail: 0.8
  entity_field_validations:
  - field: target_id
    type: pattern
    pattern: ^CHEMBL\d+$
    nullable: false
    error_message: target_id must match CHEMBL format
  - field: mapping_status
    type: enum
    allowed:
    - found
    - not_found
    - error
    - multiple
    nullable: false
    error_message: mapping_status is required and must be valid
  - field: uniprot_accession
    type: pattern
    pattern: ^[A-Z0-9]{6,10}$
    nullable: true
    error_message: UniProt accession must be 6-10 alphanumeric chars
  - field: all_mappings
    type: pattern
    pattern: '^\[("[A-Za-z0-9:/._-]+"(,"[A-Za-z0-9:/._-]+")*)?\]$'
    nullable: true
    severity: warn
    error_message: all_mappings must be a canonical JSON string array of normalized provider identifiers
  - field: taxonomy_id
    type: range
    min: 1
    max: 10000000
    nullable: true
    error_message: taxonomy_id must be a positive NCBI taxonomy identifier
  - field: reviewed
    type: enum
    allowed_values:
    - true
    - false
    nullable: true
    error_message: reviewed must be an explicit boolean when present
  entity_cross_field_validations: []
  entity_conditional_validations:
  - name: found_has_accession
    condition_field: mapping_status
    condition_value: found
    condition_operator: eq
    then_validations:
    - field: uniprot_accession
      type: pattern
      pattern: ^[A-Z0-9]{6,10}$
      nullable: false
      error_message: Found mappings must have UniProt accession
  key_nullability:
  - field: target_id
    key_type: merge
    nullable: false
filters:
  version: 1.0.0
  provider: uniprot
  entity: idmapping
  input_filter:
    enabled: false
    source_path: data/input/target.csv
    column_name: target_chembl_id
    filter_field: target_id
    batch_size: 100
  silver_filters:
    required_fields:
    - target_id
    - mapping_status
  gold_filters:
    required_fields:
    - target_id
    - mapping_status
contracts:
  primary_key:
  - target_id
  merge_keys:
  - target_id
  hash_include: []
