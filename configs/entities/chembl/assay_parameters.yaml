version: 1.0.0
provider: chembl
entity: assay_parameters
pipeline:
  pipeline_name: chembl_assay_parameters
  provider: chembl
  entity_type: assay_parameters
  description: Extract experimental assay parameters from ChEMBL API
  business_primary_keys:
  - assay_param_id

  sink:
    silver:
      partition_by:
      - type
    gold:
      mode: scd2
      scd_config:
        valid_from_col: _valid_from
        valid_to_col: _valid_to
        current_flag_col: _is_current
        version_col: _version
schema:
  content_hash:
    include: []
    exclude: []
  column_groups:
  - name: system
    fields:
    - entity_id
    - content_hash
    - _run_id
    - _run_type
    - _source_batch_id
    - _ingestion_ts
    - _index
  - name: business
    fields:
    - assay_param_id
    - assay_id
    - type_raw
    - type
    - relation
    - value
    - units
    - text_value
    - comments
    - standard_type
    - standard_relation
    - standard_value
    - standard_units
    - standard_text_value
  - name: dq
    pattern: ^_dq_
  silver:
    include_groups:
    - system
    - business
    - dq
    exclude_fields: []
    alias_policy: preserve
  gold:
    include_groups:
    - system
    - business
    exclude_fields:
    - _dq_*
    - _source_batch_id
    - _index
    alias_policy: canonical
quality:
  version: 1.0.0
  provider: chembl
  entity: assay_parameters
  metadata:
    assay_parameter_type_policy:
      scope: raw_plus_canonical_controlled_vocabulary
      description: RAW-PLUS-CANONICAL ChEMBL assay-parameter typing policy. The pipeline preserves the provider-native type lexeme in type_raw for reviewability while type stores the canonical controlled-vocabulary value used by Silver/Gold semantics and DQ governance.
      field_semantics:
        type_raw: Preserve the raw/provider-native assay-parameter type token as trimmed text for review and drift analysis.
        type: Store the canonical assay-parameter type vocabulary value used for normalized Silver/Gold behavior; unknown provider lexemes are preserved as reviewed uppercase canonical candidates rather than rejected at profile time.
        standard_type: Store the canonical strict standard_type surface governed by the shared ChEMBL assay-parameter universe and DQ policy.
  entity_field_validations:
  - field: assay_param_id
    type: range
    min: 1
    nullable: false
    error_message: Assay parameter ID is required and must be positive
  - field: assay_id
    type: pattern
    pattern: ^CHEMBL\d+$
    nullable: false
    error_message: assay_id must match CHEMBL format
  - field: type
    type: enum
    allowed:
    - IC50
    - EC50
    - Ki
    - Kd
    - AC50
    - GI50
    - Potency
    - Inhibition
    - '% Inhibition'
    - Activity
    - Ratio
    - ED50
    - ID50
    - CONC
    - PH
    - TEMP
    - TIME
    - DOSE
    - VOLUME
    - WAVELENGTH
    - PERCENT
    - PRESSURE
    - HUMIDITY
    - CELL_COUNT
    - CELL_DENSITY
    - SERUM
    nullable: false
    error_message: Invalid assay parameter type value
  - field: type_raw
    type: pattern
    pattern: ^.{1,100}$
    nullable: true
    error_message: Raw parameter type must not exceed 100 chars
  - field: standard_type
    type: enum
    allowed:
    - IC50
    - EC50
    - Ki
    - Kd
    - AC50
    - GI50
    - Potency
    - Inhibition
    - '% Inhibition'
    - Activity
    - Ratio
    - ED50
    - ID50
    - CONC
    - PH
    - TEMP
    - TIME
    - DOSE
    - VOLUME
    - WAVELENGTH
    - PERCENT
    - PRESSURE
    - HUMIDITY
    - CELL_COUNT
    - CELL_DENSITY
    - SERUM
    nullable: true
    error_message: Invalid assay parameter standard_type value
  - field: standard_relation
    type: enum
    allowed:
    - '='
    - <
    - <=
    - '>'
    - '>='
    - '~'
    nullable: true
    error_message: Invalid assay parameter standard_relation value
  - field: standard_units
    type: enum
    allowed:
    - nM
    - µM
    - mM
    - pM
    - M
    - '%'
    - ug.mL-1
    - mg.kg-1
    nullable: true
    error_message: Invalid assay parameter standard_units value
  - field: units
    type: pattern
    pattern: '^(?:[A-Za-zµ%][A-Za-z0-9µ%._-]*|[A-Za-z][A-Za-z0-9]*_[0-9]{7})$'
    nullable: true
    error_message: Assay parameter units must be a canonical unit token when present
  entity_cross_field_validations:
  - name: param_linkage
    fields:
    - assay_param_id
    - assay_id
    condition: all_present
    error_message: Both param ID and assay ID are required
  entity_conditional_validations: []
  key_nullability:
  - field: assay_param_id
    key_type: merge
    nullable: false
  - field: type
    key_type: partition
    nullable: false
filters:
  version: 1.0.0
  provider: chembl
  entity: assay_parameters
  input_filter:
    enabled: true
    source_path: data/input/assay_parameters.csv
    column_name: assay_param_id
    filter_field: assay_param_id
    batch_size: 1000
  silver_filters:
    required_fields:
    - assay_id
    - assay_param_id
    - type
  gold_filters:
    required_fields:
    - assay_id
    - type
contracts:
  primary_key:
  - assay_param_id
  merge_keys:
  - assay_param_id
  hash_include: []
