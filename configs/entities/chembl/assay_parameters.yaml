version: 1.0.0
provider: chembl
entity: assay_parameters
pipeline:
  pipeline_name: chembl_assay_parameters
  provider: chembl
  entity_type: assay_parameters
  description: Extract experimental assay parameters from ChEMBL API
  business_primary_keys:
  - assay_param_id
  sink:
    silver:
      partition_by:
      - type
schema:
  content_hash:
    include: []
    exclude: []
  column_groups:
  - name: system
    fields:
    - entity_id
    - content_hash
    - _run_id
    - _run_type
    - _source_batch_id
    - _ingestion_ts
    - _index
  - name: business
    fields:
    - assay_param_id
    - assay_id
    - type
    - relation
    - value
    - units
    - text_value
    - comments
    - standard_type
    - standard_relation
    - standard_value
    - standard_units
    - standard_text_value
  - name: dq
    pattern: ^_dq_
  silver:
    include_groups:
    - system
    - business
    - dq
    exclude_fields: []
    alias_policy: preserve
  gold:
    include_groups:
    - system
    - business
    exclude_fields:
    - _dq_*
    - _source_batch_id
    - _index
    alias_policy: canonical
quality:
  version: 1.0.0
  provider: chembl
  entity: assay_parameters
  field_validations:
  - field: assay_param_id
    type: range
    min: 1
    nullable: false
    error_message: Assay parameter ID is required and must be positive
  - field: assay_id
    type: pattern
    pattern: ^CHEMBL\d+$
    nullable: false
    error_message: assay_id must match CHEMBL format
  - field: type
    type: pattern
    pattern: ^.{1,100}$
    nullable: false
    error_message: Parameter type is required
  cross_field_validations:
  - name: param_linkage
    fields:
    - assay_param_id
    - assay_id
    condition: all_present
    error_message: Both param ID and assay ID are required
  conditional_validations: []
  key_nullability:
  - field: assay_param_id
    key_type: merge
    nullable: false
  - field: type
    key_type: partition
    nullable: false
filters:
  version: 1.0.0
  provider: chembl
  entity: assay_parameters
  input_filter:
    enabled: true
    source_path: data/input/assay_parameters.csv
    column_name: assay_param_id
    filter_field: assay_param_id
    batch_size: 1000
  gold_filters:
    required_fields:
    - assay_id
    - type
contracts:
  primary_key:
  - assay_param_id
  merge_keys:
  - assay_param_id
  rename_map:
    run_id: _run_id
    run_type: _run_type
    source_batch_id: _source_batch_id
    ingestion_ts: _ingestion_ts
    source: _source
  hash_include: []
  hash_exclude:
  - _ingestion_ts
  - _run_id
  - _run_type
  - _dq_error
  - _dq_warn
