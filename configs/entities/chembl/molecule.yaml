version: 1.0.0
provider: chembl
entity: molecule
pipeline:
    pipeline_name: chembl_molecule
    provider: chembl
    entity_type: molecule
    description: Extract molecules/compounds from ChEMBL API
    business_primary_keys:
        - molecule_id
    field_policy:
        therapeutic_flag:
            boolean_true_values:
                - 'true'
                - therapeutic
            boolean_false_values:
                - 'false'
                - non_therapeutic
    sink:
        silver:
            partition_by:
                - molecule_type
        gold:
            mode: scd2
            scd_config:
                valid_from_col: _valid_from
                valid_to_col: _valid_to
                current_flag_col: _is_current
                version_col: _version
schema:
    content_hash:
        include: []
        exclude: []
    column_groups:
        -   name: system
            fields:
                - entity_id
                - content_hash
                - _run_id
                - _run_type
                - _source_batch_id
                - _ingestion_ts
                - _index
        -   name: business
            fields:
                - molecule_id
                - pref_name
                - max_phase
                - structure_type
                - molecule_type
                - first_approval
                - therapeutic_flag
                - oral
                - parenteral
                - topical
                - black_box_warning
                - natural_product
                - first_in_class
                - prodrug
                - inorganic_flag
                - polymer_flag
                - withdrawn_flag
                - chirality
                - dosed_ingredient
                - availability_type
                - usan_year
                - usan_stem
                - usan_substem
                - usan_stem_definition
                - helm_notation
                - molecule_species
                - hierarchy_parent_chembl_id
                - hierarchy_active_chembl_id
                - hierarchy_child_chembl_id
                - logp
                - logp_method
                - mw_freebase
                - molecular_weight
                - hba_count
                - hbd_count
                - polar_surface_area
                - rotatable_bond_count
                - ro5_violation_count
                - heavy_atom_count
                - aromatic_ring_count
                - qed_score
                - molecular_formula
                - ro3_pass
                - canonical_smiles
                - standard_inchi
                - inchi_key
                - molecule_hierarchy
                - molecule_properties
                - molecule_structures
                - molecule_synonyms
                - cross_references
                - atc_classifications
        -   name: dq
            pattern: ^_dq_
    silver:
        include_groups:
            - system
            - business
            - dq
        exclude_fields: []
        alias_policy: preserve
    gold:
        include_groups:
            - system
            - business
        exclude_fields:
            - _dq_*
            - _source_batch_id
            - _index
        alias_policy: canonical
quality:
    version: 1.1.0
    provider: chembl
    entity: molecule
    entity_field_validations:
        -   field: molecule_id
            type: required
            nullable: false
            error_message: Molecule ChEMBL ID is required
        -   field: property_full_mwt
            type: range
            min: 100
            max: 1000
            nullable: true
            error_message: Molecular weight must be between 10 and 10000 Da
        -   field: property_alogp
            type: range
            min: -10
            max: 20
            nullable: true
            error_message: ALogP value out of expected range
        -   field: molecule_type
            type: enum
            allowed:
                - Small molecule
                - Inorganic small molecule
                - Polymeric small molecule
                - Protein
                - Antibody
                - Antibody drug conjugate
                - Oligosaccharide
                - Oligonucleotide
                - Cell
                - Enzyme
                - Unknown
                - Unclassified
            nullable: true
        -   field: structure_type
            type: enum
            allowed:
                - MOL
                - SEQ
                - NONE
                - BOTH
            nullable: true
        -   field: canonical_smiles
            type: custom
            validator: smiles_validator
            nullable: true
        -   field: property_hba
            type: range
            min: 0
            max: 50
            nullable: true
        -   field: property_hbd
            type: range
            min: 0
            max: 30
            nullable: true
        -   field: property_psa
            type: range
            min: 0
            max: 1000
            nullable: true
    entity_cross_field_validations:
        -   name: structure_completeness
            fields:
                - canonical_smiles
                - standard_inchi
                - inchi_key
            condition: any_present
            error_message: At least one structure identifier required
    entity_conditional_validations: []
    key_nullability:
        -   field: molecule_id
            key_type: merge
            nullable: false
        -   field: molecule_type
            key_type: partition
            nullable: false
filters:
    version: 1.0.0
    provider: chembl
    entity: molecule
    input_filter:
        enabled: false
        source_path: data/input/molecule.csv
        column_name: molecule_chembl_id
        filter_field: molecule_id
        batch_size: 20
    extraction_params:
        molecule_type: Small molecule
        structure_type: MOL
        inorganic_flag: 0
    silver_filters:
        columns:
            molecule_type:
                - Small molecule
            structure_type:
                - MOL
            inorganic_flag:
                - '0'
        required_fields:
            - molecule_id
            - molecule_type
    gold_filters:
        columns:
            molecule_type:
                - Small molecule
            structure_type:
                - MOL
            inorganic_flag:
                - '0'
        required_fields:
            - molecule_id
contracts:
    primary_key:
        - molecule_id
    merge_keys:
        - molecule_id
    hash_include: []
