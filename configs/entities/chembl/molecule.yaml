  - availability_type
  - usan_year
  - usan_stem
  - usan_substem
  - usan_stem_definition
  - helm_notation
  - molecule_species
  - hierarchy_parent_chembl_id
  - hierarchy_active_chembl_id
  - hierarchy_child_chembl_id
  - logp
  - logp_method
  - mw_freebase
  - molecular_weight
  - hba_count
  - hbd_count
  - polar_surface_area
  - rotatable_bond_count
  - ro5_violation_count
  - heavy_atom_count
  - aromatic_ring_count
  - qed_score
  - molecular_formula
  - ro3_pass
  - canonical_smiles
  - standard_inchi
  - inchi_key
