version: 1.0.0
provider: chembl
entity: publication_term
pipeline:
  pipeline_name: chembl_publication_term
  provider: chembl
  entity_type: publication_term
  version: 2.1.0
  description: Extract publication terms (MeSH, keywords) from ChEMBL Publication records
  loading_strategy: full_scan_only
  field_policy:
    therapeutic_flag:
      boolean_true_values:
      - 'true'
      - therapeutic
      boolean_false_values:
      - 'false'
      - non_therapeutic

  business_primary_keys:
  - publication_id
  - term_type
  - term

  sink:
    silver:
      partition_by:
      - term_type
    gold:
      mode: overwrite
      idempotency_contract: overwrite_rebuild
  batch_size: 1000
  checkpoint_interval: 1000
  source:
    api_key: ${BIOETL_OPENALEX_API_KEY}
    email: ${BIOETL_OPENALEX_EMAIL}
    api:
      base_url: https://rest.uniprot.org
      from_db: ChEMBL
      to_db: UniProtKB

  page_size_override: 1000
schema:
  field_aliases:
    reference_count: citations_made
    affiliations: affiliation_list
    citation_count: citations_received
    keywords: subject_keywords
    mesh_terms: subject_mesh
    pages: page_range
    source_type: publication_type
    fields_of_study: subject_fields
    journal_abbrev: journal_name_short
    journal_title: journal_name
    short_container_title: journal_name_short
    structured_affiliations: affiliation_structured
    subjects: subject_keywords
    topics: subject_topics
  content_hash:
    include: []
    exclude: []
  column_groups:
  - name: system
    fields:
    - entity_id
    - content_hash
    - _run_id
    - _run_type
    - _source_batch_id
    - _ingestion_ts
    - _index
  - name: business
    fields:
    - publication_id
    - term
    - term_type
    - mesh_id
    - qualifier
  - name: dq
    pattern: ^_dq_
  silver:
    include_groups:
    - system
    - business
    - dq
    exclude_fields: []
    alias_policy: preserve
  gold:
    include_groups:
    - system
    - business
    exclude_fields:
    - _dq_*
    - _source_batch_id
    - _index
    alias_policy: canonical
quality:
  metadata:
    assay_parameter_type_policy:
      scope: raw_plus_canonical_controlled_vocabulary
      description: RAW-PLUS-CANONICAL ChEMBL assay-parameter typing policy. The pipeline preserves the provider-native type lexeme in type_raw for reviewability while parameter_type stores the canonical controlled-vocabulary value used by Silver/Gold semantics and DQ governance.
      field_semantics:
        type_raw: Preserve the raw/provider-native assay-parameter type token as trimmed text for review and drift analysis.
        type: Published reviewed Silver alias for the canonical normalized assay-parameter type surface used by downstream Silver/Gold consumers and governance reporting.
        parameter_type: Store the canonical assay-parameter type vocabulary value used for normalized Silver/Gold behavior; unknown provider lexemes are preserved as reviewed uppercase canonical candidates rather than rejected at profile time.
        standard_type: Store the canonical strict standard_type surface governed by the shared ChEMBL assay-parameter universe and DQ policy.
    publication_type_policy:
      scope: source_specific
      description: SOURCE-SPECIFIC ChEMBL publication typing policy. This pipeline accepts only the reviewed ChEMBL-native subset and maps it into the broader global publication taxonomy defined in configs/enums/chembl.yaml without redefining that global cross-provider taxonomy.
      field_semantics:
        publication_type_raw: Preserve the raw/native ChEMBL publication type token for traceability and provider-specific review.
        publication_type: Store the canonical publication type mapped into the global taxonomy for normalized Silver/Gold behavior.
    # Source-specific DQ policy:
    # - publication_type uses a ChEMBL-only allowed subset and does not redefine
    #   the global taxonomy in configs/enums/chembl.yaml.
    # - publication_type_raw preserves the provider-native token for traceability.
    # - publication_type stores the canonical mapped type used by this pipeline.
    subcellular_fraction_policy:
      scope: raw_plus_canonical_derived_vocabulary
      description: RAW-PLUS-CANONICAL ChEMBL subcellular-fraction policy. The pipeline preserves the source lexeme in subcellular_fraction_raw while subcellular_fraction stores the normalized derived vocabulary used by Silver/Gold contracts. Unknown source lexemes remain reviewable rather than being fail-closed into a strict enum.
      field_semantics:
        subcellular_fraction_raw: Preserve the raw/source ChEMBL subcellular-fraction label as trimmed text for traceability and synonym review.
        subcellular_fraction: Store the canonical normalized subcellular-fraction label used for downstream Silver/Gold semantics; unknown reviewed labels are preserved after canonical text normalization instead of being discarded.
  version: 1.0.0
  provider: chembl
  entity: publication_term
  entity_field_validations:
  - field: entity_id
    type: pattern
    pattern: ^[a-f0-9]{16}$
    nullable: false
    error_message: entity_id must be a 16-char SHA256 hash prefix
  - field: publication_id
    type: pattern
    pattern: ^CHEMBL\d+$
    nullable: false
    error_message: publication_id must match CHEMBL format
  - field: term_type
    type: enum
    allowed:
    - MESH_HEADING
    - MESH_QUALIFIER
    - KEYWORD
    nullable: false
    error_message: term_type is required and must be valid
  - field: term
    type: pattern
    pattern: ^.{1,500}$
    nullable: false
    error_message: term is required and must not exceed 500 chars
  entity_cross_field_validations:
  - name: term_completeness
    fields:
    - publication_id
    - term
    - term_type
    condition: all_present
    error_message: All term fields are required
  entity_conditional_validations: []
  key_nullability:
  - field: publication_id
    key_type: merge
    nullable: false
  - field: term_type
    key_type: merge
    nullable: false
  - field: term
    key_type: merge
    nullable: false
  thresholds:
    soft_fail: 0.3
    hard_fail: 0.8
filters:
  version: 1.0.0
  provider: chembl
  entity: publication_term
  input_filter:
    enabled: true
    source_path: data/input/publication.csv
    column_name: publication_id
    filter_field: publication_id
    batch_size: 20
    checkpoint_interval: 1000
    fallback_column: title
  extraction_params:
    doc_type: PUBLICATION
    year__gte: 1950
    year__lte: 2050
    assay_type__in: B,F
    confidence_score__gte: 8
    data_validity_comment__isnull: true
    inorganic_flag: 0
    molecule_type: Small molecule
    organism__isnull: false
    pchembl_value__isnull: false
    potential_duplicate: 0
    relationship_type: D
    src_id: 1
    standard_flag: 1
    standard_relation: '='
    standard_type__in: IC50,Ki
    standard_units: nM
    structure_type: MOL
    target_chembl_id__isnull: false
    target_tax_id__isnull: false
    target_type: SINGLE PROTEIN
    tax_id__isnull: false
  silver_filters:
    ranges:
      publication_year:
        min: 1950
        max: 2050
      activity_id:
        min: 1
        max: 10000000000
      confidence_score:
        min: 8
        max: 9
      pchembl_value:
        min: 3
        max: 10
      standard_value:
        min: 0
        include_min: false
    columns:
      assay_type:
      - B
      - F
      inorganic_flag:
      - 0
      molecule_type:
      - Small molecule
      potential_duplicate:
      - 0
      publication_type:
      - journal-article
      relationship_type:
      - D
      src_id:
      - '1'
      standard_relation:
      - '='
      standard_type:
      - IC50
      - Ki
      standard_units:
      - nM
      structure_type:
      - MOL
      target_type:
      - SINGLE PROTEIN
    exclude_if_present: []
    required_fields:
    - publication_id
    - term
    - term_type
  gold_filters:
    list_contains:
      component_types:
        values:
        - PROTEIN
        mode: all
    list_lengths:
      component_accessions:
        min: 1
        max: 1
      component_ids:
        min: 1
    ranges:
      publication_year:
        min: 1950
        max: 2050
      max_tani:
        min: 0.5
        include_min: true
      standard_value:
        min: 0
        include_min: false
    columns:
      term_type:
      - MESH_HEADING
      - MESH_QUALIFIER
      - KEYWORD
      assay_type:
      - B
      - F
      assay_strain:
        operator: is_empty
      assay_test_type:
        operator: not_in
        values:
        - In vivo
        - Ex vivo
      bao_format:
        operator: not_in
        values:
        - BAO_0000218
      component_type:
      - PROTEIN
      confidence_score:
      - 8
      - 9
      downgraded:
      - '0'
      inorganic_flag:
      - 0
      molecule_type:
      - Small molecule
      potential_duplicate:
      - 0
      publication_type:
      - journal-article
      relationship_type:
      - D
      reviewed:
      - true
      standard_relation:
      - '='
      standard_type:
      - IC50
      - Ki
      standard_units:
      - nM
      structure_type:
      - MOL
      target_type:
      - SINGLE PROTEIN
    required_fields:
    - publication_id
    - term
    - term_type
    exclude_if_present: []
  metadata:
    publication_filter_policy:
      scope: source_specific
      description: SOURCE-SPECIFIC ChEMBL publication filter policy. Silver and Gold filters intentionally constrain this pipeline to the reviewed ChEMBL publication subset and do not redefine the global publication taxonomy.
    # Source-specific filter policy:
    # - Silver and Gold are intentionally scoped to journal-article for the
    #   current ChEMBL publication pipeline.
    # - This is pipeline scope, not global publication type truth.
contracts:
  primary_key:
  - publication_id
  - term_type
  - term
  merge_keys:
  - publication_id
  - term_type
  - term
  hash_include: []
  hash_exclude: []
  hash_datetime_policy: v1_date
hash_policy:
  provider: chembl
  entity: publication_term
  contract:
    version: 1.0.0
    migration_note: 'Explicit config-level hash contract for the normalized ChEMBL publication_term Silver surface.'
  hash_policy:
    algorithm: sha256
    canonicalization: provider + canonical_json_dumps(normalized_record)
    include_fields:
    - publication_id
    - term
    - term_type
    - mesh_id
    - qualifier
    exclude_fields:
    - _ingestion_ts
    - _run_id
    - _run_type
    - _dq_warn
    - _dq_error
    - _source_batch_id
    - _index
    exclude_patterns:
    - ^_dq_
    normalization:
      trim_strings: true
      round_floats:
        enabled: true
        precision: 10
      dates:
        enabled: true
        format: YYYY-MM-DD
      null_handling:
        nan_to_null: true
        inf_to_null: true
