version: 1.0.0
provider: chembl
entity: activity
pipeline:
    pipeline_name: chembl_activity
    provider: chembl
    entity_type: activity
    description: Extract biological activity records from ChEMBL API
    business_primary_keys:
        - activity_id
    batch_size: 1000
    sink:
        silver:
            mode: append
        gold:
            enabled: false
schema:
    content_hash:
        include: []
        exclude: []
    column_groups:
        -   name: system
            fields:
                - entity_id
                - content_hash
                - _run_id
                - _run_type
                - _source_batch_id
                - _ingestion_ts
                - _index
                - _state
        -   name: business
            fields:
                - activity_id
                - assay_id
                - molecule_id
                - target_id
                - publication_id
                - standard_relation
                - standard_value
                - standard_units
                - standard_type
                - standard_flag
                - pchembl_value
                - data_validity_comment
                - activity_comment
                - potential_duplicate
                - bao_endpoint
                - uo_units
                - qudt_units
                - src_id
                - record_id
                - type
                - relation
                - value
                - units
                - text_value
                - standard_text_value
                - upper_value
                - standard_upper_value
                - toid
                - manual_curation_flag
                - original_activity_id
                - data_validity_description
                - ligand_efficiency_bei
                - ligand_efficiency_le
                - ligand_efficiency_lle
                - ligand_efficiency_sei
                - action_type
                - action_type_description
                - action_type_parent_type
                - activity_properties
                - canonical_smiles
                - molecule_pref_name
                - parent_molecule_id
                - target_pref_name
                - target_organism
                - target_taxonomy_id
                - assay_type
                - assay_description
                - assay_variant_accession
                - assay_variant_mutation
                - bao_format
                - bao_label
                - journal
                - publication_doi
                - publication_pmid
                - publication_pmc_id
                - publication_year
        -   name: dq
            pattern: ^_dq_
    silver:
        include_groups:
            - system
            - business
            - dq
        exclude_fields: []
        alias_policy: preserve
    gold:
        include_groups:
            - system
            - business
        exclude_fields:
            - _dq_*
            - _source_batch_id
            - _index
        alias_policy: canonical
quality:
    version: 1.1.0
    provider: chembl
    entity: activity
    entity_field_validations:
        -   field: activity_id
            type: required
            nullable: false
            error_message: Activity ID is required
        -   field: standard_value
            type: range
            min: 0
            max: 1000000000
            nullable: true
            error_message: standard_value must be non-negative and below 1B
        -   field: standard_flag
            type: range
            min: 0
            max: 1
            nullable: false
            error_message: standard_flag must be 0 or 1
        -   field: potential_duplicate
            type: range
            min: 0
            max: 1
            nullable: false
            error_message: potential_duplicate must be 0 or 1
        -   field: manual_curation_flag
            type: range
            min: 0
            max: 1
            nullable: true
            error_message: manual_curation_flag must be 0 or 1 when present
        -   field: pchembl_value
            type: range
            min: 0
            max: 15
            nullable: true
            error_message: pChEMBL value must be between 0 and 15
        -   field: standard_type
            type: enum
            allowed:
                - IC50
                - EC50
                - Ki
                - Kd
                - AC50
                - GI50
                - Potency
                - Inhibition
                - '% Inhibition'
                - Activity
                - Ratio
                - ED50
                - ID50
            nullable: true
            error_message: Invalid standard_type value
        -   field: standard_relation
            type: enum
            allowed:
                - '='
                - <
                - <=
                - '>'
                - '>='
                - '~'
            nullable: false
            error_message: Invalid standard_relation value
        -   field: assay_type
            type: enum
            allowed:
                - B
                - F
                - A
                - T
                - P
                - U
            nullable: false
            error_message: Invalid assay_type value
        -   field: data_validity_comment
            type: enum
            allowed:
                - Potential missing data
                - Potential author error
                - Manually validated
                - Potential transcription error
                - Outside typical range
                - Non standard unit for type
                - Author confirmed error
            nullable: true
            error_message: Invalid data_validity_comment value
        -   field: standard_units
            type: enum
            allowed:
                - nM
                - uM
                - mM
                - pM
                - M
                - '%'
                - ug.mL-1
                - mg.kg-1
            nullable: true
            error_message: Invalid standard_units value
    entity_cross_field_validations:
        -   name: value_requires_units
            fields:
                - standard_value
                - standard_units
            condition: conditional_required
            trigger_field: standard_value
            required_field: standard_units
            error_message: standard_units required when standard_value is present
        -   name: activity_completeness
            fields:
                - standard_value
                - standard_units
                - standard_type
            condition: all_present
            error_message: Complete activity data requires value, units, and type
    entity_conditional_validations:
        -   name: binding_requires_target
            condition_field: assay_type
            condition_value: B
            condition_operator: eq
            then_validations:
                -   field: target_id
                    type: required
                    nullable: false
                    error_message: Binding assays must have a target
        -   name: ic50_range_check
            condition_field: standard_type
            condition_value: IC50
            condition_operator: eq
            then_validations:
                -   field: standard_value
                    type: range
                    min: 0.001
                    max: 100000
                    nullable: false
    key_nullability:
        -   field: activity_id
            key_type: merge
            nullable: false
filters:
    version: 1.0.0
    provider: chembl
    entity: activity
    input_filter:
        enabled: false
        source_path: data/input/activity.csv
        column_name: activity_id
        filter_field: activity_id
    extraction_params:
        standard_type__in: IC50,Ki
        standard_units: nM
        standard_relation: '='
        assay_type__in: B,F
        potential_duplicate: 0
        data_validity_comment__isnull: true
        pchembl_value__isnull: false
        standard_flag: 1
        target_tax_id__isnull: false
    silver_filters:
        columns:
            standard_type:
                - IC50
                - Ki
            standard_relation:
                - '='
            standard_units:
                - nM
            assay_type:
                - B
                - F
            potential_duplicate:
                - '0'
        ranges:
            activity_id:
                min: 1
                max: 10000000000
            standard_value:
                min: 0
                include_min: false
            pchembl_value:
                min: 3
                max: 10
            publication_year:
                min: 1950
                max: 2050
        required_fields:
            # Final Silver policy: unit-less activity records are quarantined
            # instead of relaxing canonical chemistry/unit fields to nullable.
            - activity_id
            - molecule_id
            - assay_id
            - target_id
            - publication_id
            - record_id
            - src_id
            - canonical_smiles
            - target_organism
            - target_taxonomy_id
            - assay_description
            - bao_endpoint
            - bao_format
            - bao_label
            - relation
            - value
            - units
            - standard_value
            - standard_units
            - standard_flag
            - pchembl_value
            - uo_units
            - journal
            - publication_year
            - _state
            - assay_type
            - potential_duplicate
            - standard_relation
        exclude_if_present:
            - data_validity_comment
    gold_filters:
        columns:
            standard_type:
                - IC50
                - Ki
            standard_units:
                - nM
            standard_relation:
                - '='
            assay_type:
                - B
                - F
            potential_duplicate:
                - '0'
        ranges:
            standard_value:
                min: 0
                include_min: false
        required_fields:
            - standard_type
            - standard_value
            - standard_units
            - target_id
contracts:
    primary_key:
        - activity_id
    merge_keys:
        - activity_id
    hash_include: []
hash_policy:
    provider: chembl
    entity: activity
    contract:
        version: 1.0.0
        migration_note: 'Documentation-aligned: Align config with runtime normalized business schema.'
    hash_policy:
        algorithm: sha256
        canonicalization: provider + canonical_json_dumps(normalized_record)
        include_fields:
            - activity_id
            - assay_id
            - molecule_id
            - standard_type
            - standard_relation
            - standard_value
            - standard_units
            - pchembl_value
            - publication_id
            - publication_year
        exclude_fields:
            - _ingestion_ts
            - _run_id
            - _run_type
            - _dq_warn
            - _dq_error
            - _source_batch_id
            - _index
        exclude_patterns:
            - ^_dq_
        normalization:
            trim_strings: true
            round_floats:
                enabled: true
                precision: 10
            dates:
                enabled: true
                format: YYYY-MM-DD
            null_handling:
                nan_to_null: true
                inf_to_null: true
