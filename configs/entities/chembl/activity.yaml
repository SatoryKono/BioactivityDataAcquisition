version: 1.0.0
provider: chembl
entity: activity
pipeline:
  pipeline_name: chembl_activity
  provider: chembl
  entity_type: activity
  description: Extract biological activity records from ChEMBL API
  field_policy: {}
  business_primary_keys:
  - activity_id
  batch_size: 1000
  checkpoint_interval: 1000

  sink:
    silver:
      mode: merge
      idempotency_contract: merge_upsert
      partition_by: []
    gold:
      enabled: true
schema:
  field_aliases:
    reference_count: citations_made
    affiliations: affiliation_list
    citation_count: citations_received
    keywords: subject_keywords
    mesh_terms: subject_mesh
    pages: page_range
    source_type: publication_type
    fields_of_study: subject_fields
    journal_abbrev: journal_name_short
    journal_title: journal_name
    short_container_title: journal_name_short
    structured_affiliations: affiliation_structured
    subjects: subject_keywords
    topics: subject_topics
  content_hash:
    include: []
    exclude: []
  column_groups:
  - name: system
    fields:
    - entity_id
    - content_hash
    - _run_id
    - _run_type
    - _source_batch_id
    - _ingestion_ts
    - _index
    - _state
  - name: business
    fields:
    - activity_id
    - assay_id
    - molecule_id
    - target_id
    - publication_id
    - standard_relation
    - standard_value
    - standard_units
    - standard_type
    - standard_flag
    - pchembl_value
    - data_validity_comment
    - activity_comment
    - potential_duplicate
    - bao_endpoint
    - bao_endpoint_iri
    - bao_endpoint_mapping_status
    - uo_units
    - uo_unit_iri
    - uo_unit_mapping_status
    - uo_ontology_version
    - qudt_units
    - qudt_unit_iri
    - qudt_unit_mapping_status
    - qudt_ontology_version
    - src_id
    - record_id
    - activity_type
    - activity_relation
    - activity_value
    - units
    - text_value
    - standard_text_value
    - upper_value
    - standard_upper_value
    - toid
    - manual_curation_flag
    - original_activity_id
    - data_validity_description
    - ligand_efficiency_bei
    - ligand_efficiency_le
    - ligand_efficiency_lle
    - ligand_efficiency_sei
    - action_type
    - action_type_description
    - action_type_parent_type
    - activity_properties
    - canonical_smiles
    - molecule_pref_name
    - parent_molecule_id
    - target_pref_name
    - target_organism
    - target_taxonomy_id
    - assay_type
    - assay_description
    - assay_variant_accession
    - assay_variant_mutation
    - bao_format
    - bao_format_iri
    - bao_format_mapping_status
    - bao_label
    - bao_ontology_version
    - journal
    - publication_doi
    - publication_pmid
    - publication_pmc_id
    - publication_year
  - name: dq
    pattern: ^_dq_
  silver:
    include_groups:
    - system
    - business
    - dq
    exclude_fields: []
    alias_policy: preserve
  gold:
    include_groups:
    - system
    - business
    exclude_fields:
    - _dq_*
    - _source_batch_id
    - _index
    alias_policy: canonical
quality:
  metadata:
    assay_parameter_type_policy:
      scope: raw_plus_canonical_controlled_vocabulary
      description: RAW-PLUS-CANONICAL ChEMBL assay-parameter typing policy. The pipeline preserves the provider-native type lexeme in type_raw for reviewability while parameter_type stores the canonical controlled-vocabulary value used by Silver/Gold semantics and DQ governance.
      field_semantics:
        type_raw: Preserve the raw/provider-native assay-parameter type token as trimmed text for review and drift analysis.
        type: Published reviewed Silver alias for the canonical normalized assay-parameter type surface used by downstream Silver/Gold consumers and governance reporting.
        parameter_type: Store the canonical assay-parameter type vocabulary value used for normalized Silver/Gold behavior; unknown provider lexemes are preserved as reviewed uppercase canonical candidates rather than rejected at profile time.
        standard_type: Store the canonical strict standard_type surface governed by the shared ChEMBL assay-parameter universe and DQ policy.
    publication_type_policy:
      scope: source_specific
      description: SOURCE-SPECIFIC ChEMBL publication typing policy. This pipeline accepts only the reviewed ChEMBL-native subset and maps it into the broader global publication taxonomy defined in configs/enums/chembl.yaml without redefining that global cross-provider taxonomy.
      field_semantics:
        publication_type_raw: Preserve the raw/native ChEMBL publication type token for traceability and provider-specific review.
        publication_type: Store the canonical publication type mapped into the global taxonomy for normalized Silver/Gold behavior.
    # Source-specific DQ policy:


    # - publication_type uses a ChEMBL-only allowed subset and does not redefine


    #   the global taxonomy in configs/enums/chembl.yaml.


    # - publication_type_raw preserves the provider-native token for traceability.


    # - publication_type stores the canonical mapped type used by this pipeline.


    subcellular_fraction_policy:
      scope: raw_plus_canonical_derived_vocabulary
      description: RAW-PLUS-CANONICAL ChEMBL subcellular-fraction policy. The pipeline preserves the source lexeme in subcellular_fraction_raw while subcellular_fraction stores the normalized derived vocabulary used by Silver/Gold contracts. Unknown source lexemes remain reviewable rather than being fail-closed into a strict enum.
      field_semantics:
        subcellular_fraction_raw: Preserve the raw/source ChEMBL subcellular-fraction label as trimmed text for traceability and synonym review.
        subcellular_fraction: Store the canonical normalized subcellular-fraction label used for downstream Silver/Gold semantics; unknown reviewed labels are preserved after canonical text normalization instead of being discarded.
  version: 1.1.0
  provider: chembl
  entity: activity
  entity_field_validations:
  - field: activity_id
    type: required
    nullable: false
    error_message: Activity ID is required
  - field: canonical_smiles
    type: custom
    validator: smiles_validator
    nullable: true
    error_message: canonical_smiles must be a valid canonical SMILES value when present
  - field: standard_value
    type: range
    min: 0
    max: 1000000000
    nullable: true
    error_message: standard_value must be non-negative and below 1B
  - field: standard_flag
    type: range
    min: 0
    max: 1
    nullable: false
    error_message: standard_flag must be 0 or 1
  - field: potential_duplicate
    type: range
    min: 0
    max: 1
    nullable: false
    error_message: potential_duplicate must be 0 or 1
  - field: manual_curation_flag
    type: range
    min: 0
    max: 1
    nullable: true
    error_message: manual_curation_flag must be 0 or 1 when present
  - field: pchembl_value
    type: range
    min: 0
    max: 15
    nullable: true
    error_message: pChEMBL value must be between 0 and 15
  - field: standard_type
    type: enum
    allowed:
    - IC50
    - EC50
    - Ki
    - Kd
    - AC50
    - GI50
    - Potency
    - Inhibition
    - '% Inhibition'
    - Activity
    - Ratio
    - ED50
    - ID50
    nullable: true
    error_message: Invalid standard_type value
  - field: standard_relation
    type: enum
    allowed:
    - '='
    - <
    - <=
    - '>'
    - '>='
    - '~'
    nullable: false
    error_message: Invalid standard_relation value
  - field: assay_type
    type: enum
    allowed:
    - B
    - F
    - A
    - T
    - P
    - U
    nullable: false
    error_message: Invalid assay_type value
  - field: data_validity_comment
    type: enum
    allowed:
    - Potential missing data
    - Potential author error
    - Manually validated
    - Potential transcription error
    - Outside typical range
    - Non standard unit for type
    - Author confirmed error
    nullable: true
    error_message: Invalid data_validity_comment value
  - field: standard_units
    type: enum
    allowed:
    - nM
    - µM
    - mM
    - pM
    - M
    - '%'
    - ug.mL-1
    - mg.kg-1
    nullable: true
    error_message: Invalid standard_units value
  - field: units
    type: pattern
    pattern: '^(?:[A-Za-zµ%][A-Za-z0-9µ%._-]*|[A-Za-z][A-Za-z0-9]*_[0-9]{7})$'
    nullable: true
    error_message: units must be a canonical unit token when present
  - field: qudt_units
    type: pattern
    pattern: '^(?:https?://[^\s]+|[A-Za-zµ%][A-Za-z0-9µ%._/-]*|[A-Za-z][A-Za-z0-9]*_[0-9]{7})$'
    nullable: true
    error_message: qudt_units must be a raw QUDT URI or canonical unit token when present
  - field: uo_units
    type: pattern
    pattern: '^(?:UO_[0-9]{7}|[A-Za-zµ%][A-Za-z0-9µ%._-]*)$'
    nullable: true
    error_message: uo_units must be a canonical ontology/unit token when present
  - field: bao_endpoint_iri
    type: pattern
    pattern: '^https?://[^\s]+$'
    nullable: true
    error_message: bao_endpoint_iri must be an HTTP(S) IRI when present
  - field: bao_format_iri
    type: pattern
    pattern: '^https?://[^\s]+$'
    nullable: true
    error_message: bao_format_iri must be an HTTP(S) IRI when present
  - field: uo_unit_iri
    type: pattern
    pattern: '^https?://[^\s]+$'
    nullable: true
    error_message: uo_unit_iri must be an HTTP(S) IRI when present
  - field: qudt_unit_iri
    type: pattern
    pattern: '^https?://[^\s]+$'
    nullable: true
    error_message: qudt_unit_iri must be an HTTP(S) IRI when present
  - field: bao_endpoint_mapping_status
    type: enum
    allowed:
    - mapped
    - unmapped
    - missing
    nullable: true
    error_message: Invalid BAO endpoint mapping status
  - field: bao_format_mapping_status
    type: enum
    allowed:
    - mapped
    - unmapped
    - missing
    nullable: true
    error_message: Invalid BAO format mapping status
  - field: uo_unit_mapping_status
    type: enum
    allowed:
    - mapped
    - unmapped
    - missing
    nullable: true
    error_message: Invalid UO unit mapping status
  - field: qudt_unit_mapping_status
    type: enum
    allowed:
    - mapped
    - unmapped
    - missing
    nullable: true
    error_message: Invalid QUDT unit mapping status
  entity_cross_field_validations:
  - name: value_requires_units
    fields:
    - standard_value
    - standard_units
    condition: conditional_required
    trigger_field: standard_value
    required_field: standard_units
    error_message: standard_units required when standard_value is present
  - name: activity_completeness
    fields:
    - standard_value
    - standard_units
    - standard_type
    condition: all_present
    error_message: Complete activity data requires value, units, and type
  - name: bao_endpoint_requires_mapping_status
    fields:
    - bao_endpoint
    - bao_endpoint_mapping_status
    condition: conditional_required
    trigger_field: bao_endpoint
    required_field: bao_endpoint_mapping_status
    error_message: BAO endpoint mappings must publish a companion mapping status
  - name: bao_format_requires_mapping_status
    fields:
    - bao_format
    - bao_format_mapping_status
    condition: conditional_required
    trigger_field: bao_format
    required_field: bao_format_mapping_status
    error_message: BAO format mappings must publish a companion mapping status
  - name: uo_unit_requires_mapping_status
    fields:
    - uo_units
    - uo_unit_mapping_status
    condition: conditional_required
    trigger_field: uo_units
    required_field: uo_unit_mapping_status
    error_message: UO unit mappings must publish a companion mapping status
  - name: qudt_unit_requires_mapping_status
    fields:
    - qudt_units
    - qudt_unit_mapping_status
    condition: conditional_required
    trigger_field: qudt_units
    required_field: qudt_unit_mapping_status
    error_message: QUDT unit mappings must publish a companion mapping status
  entity_conditional_validations:
  - name: mapped_bao_endpoint_requires_bundle
    condition_field: bao_endpoint_mapping_status
    condition_value: mapped
    condition_operator: eq
    then_validations:
    - field: bao_endpoint_iri
      type: required
      nullable: false
      error_message: Mapped BAO endpoint identifiers must publish a canonical IRI
    - field: bao_ontology_version
      type: required
      nullable: false
      error_message: Mapped BAO endpoint identifiers must publish an ontology version
  - name: mapped_bao_format_requires_bundle
    condition_field: bao_format_mapping_status
    condition_value: mapped
    condition_operator: eq
    then_validations:
    - field: bao_format_iri
      type: required
      nullable: false
      error_message: Mapped BAO format identifiers must publish a canonical IRI
    - field: bao_ontology_version
      type: required
      nullable: false
      error_message: Mapped BAO format identifiers must publish an ontology version
  - name: mapped_uo_unit_requires_bundle
    condition_field: uo_unit_mapping_status
    condition_value: mapped
    condition_operator: eq
    then_validations:
    - field: uo_unit_iri
      type: required
      nullable: false
      error_message: Mapped UO unit identifiers must publish a canonical IRI
    - field: uo_ontology_version
      type: required
      nullable: false
      error_message: Mapped UO unit identifiers must publish an ontology version
  - name: mapped_qudt_unit_requires_bundle
    condition_field: qudt_unit_mapping_status
    condition_value: mapped
    condition_operator: eq
    then_validations:
    - field: qudt_unit_iri
      type: required
      nullable: false
      error_message: Mapped QUDT unit identifiers must publish a canonical IRI
    - field: qudt_ontology_version
      type: required
      nullable: false
      error_message: Mapped QUDT unit identifiers must publish an ontology version
  - name: binding_requires_target
    condition_field: assay_type
    condition_value: B
    condition_operator: eq
    then_validations:
    - field: target_id
      type: required
      nullable: false
      error_message: Binding assays must have a target
  - name: ic50_range_check
    condition_field: standard_type
    condition_value: IC50
    condition_operator: eq
    then_validations:
    - field: standard_value
      type: range
      min: 0.001
      max: 100000
      nullable: false
  key_nullability:
  - field: activity_id
    key_type: merge
    nullable: false
  thresholds:
    soft_fail: 0.3
    hard_fail: 0.8
filters:
  version: 1.0.0
  provider: chembl
  entity: activity
  input_filter:
    enabled: false
    source_path: data/input/activity.csv
    column_name: activity_id
    filter_field: activity_id
    batch_size: 1000
    checkpoint_interval: 1000
    fallback_column: title
  extraction_params:
    standard_type__in: IC50,Ki
    standard_units: nM
    standard_relation: '='
    assay_type__in: B,F
    potential_duplicate: 0
    data_validity_comment__isnull: true
    pchembl_value__isnull: false
    standard_flag: 1
    target_tax_id__isnull: false
    doc_type: PUBLICATION
    year__gte: 1950
    year__lte: 2050
    confidence_score__gte: 8
    inorganic_flag: 0
    molecule_type: Small molecule
    organism__isnull: false
    relationship_type: D
    src_id: 1
    structure_type: MOL
    target_chembl_id__isnull: false
    target_type: SINGLE PROTEIN
    tax_id__isnull: false
  silver_filters:
    columns:
      standard_type:
      - IC50
      - Ki
      standard_relation:
      - '='
      standard_units:
      - nM
      assay_type:
      - B
      - F
      potential_duplicate:
      - 0
      inorganic_flag:
      - 0
      molecule_type:
      - Small molecule
      publication_type:
      - journal-article
      relationship_type:
      - D
      src_id:
      - '1'
      structure_type:
      - MOL
      target_type:
      - SINGLE PROTEIN
    ranges:
      activity_id:
        min: 1
        max: 10000000000
      standard_value:
        min: 0
        include_min: false
      pchembl_value:
        min: 3
        max: 10
      publication_year:
        min: 1950
        max: 2050
      confidence_score:
        min: 8
        max: 9
    required_fields:
            # Final Silver policy: unit-less activity records are quarantined


            # instead of relaxing canonical chemistry/unit fields to nullable.


            # target_taxonomy_id removed from required_fields because validate_taxonomy_id


            # returns None for invalid values, causing high error rates


    - activity_id
    - molecule_id
    - assay_id
    - target_id
    - publication_id
    - record_id
    - src_id
    - canonical_smiles
    - target_organism
    - assay_description
    - bao_endpoint
    - bao_format
    - bao_label
    - activity_relation
    - activity_value
    - units
    - standard_value
    - standard_units
    - standard_type
    - standard_flag
    - pchembl_value
    - uo_units
    - journal
    - publication_year
    - _state
    - assay_type
    - potential_duplicate
    - standard_relation
    exclude_if_present:
    - data_validity_comment
  gold_filters:
    columns:
      standard_type:
      - IC50
      - Ki
      standard_units:
      - nM
      standard_relation:
      - '='
      assay_type:
      - B
      - F
      potential_duplicate:
      - 0
      assay_strain:
        operator: is_empty
      assay_test_type:
        operator: not_in
        values:
        - In vivo
        - Ex vivo
      bao_format:
        operator: not_in
        values:
        - BAO_0000218
      component_type:
      - PROTEIN
      confidence_score:
      - 8
      - 9
      downgraded:
      - '0'
      inorganic_flag:
      - 0
      molecule_type:
      - Small molecule
      publication_type:
      - journal-article
      relationship_type:
      - D
      reviewed:
      - true
      structure_type:
      - MOL
      target_type:
      - SINGLE PROTEIN
      term_type:
      - MESH_HEADING
      - MESH_QUALIFIER
      - KEYWORD
    ranges:
      standard_value:
        min: 0
        include_min: false
      publication_year:
        min: 1950
        max: 2050
      max_tani:
        min: 0.5
        include_min: true
    exclude_if_present: []
    required_fields:
    - standard_type
    - standard_value
    - standard_units
    - target_id
    list_contains:
      component_types:
        values:
        - PROTEIN
        mode: all
    list_lengths:
      component_accessions:
        min: 1
        max: 1
      component_ids:
        min: 1
  metadata:
    publication_filter_policy:
      scope: source_specific
      description: SOURCE-SPECIFIC ChEMBL publication filter policy. Silver and Gold filters intentionally constrain this pipeline to the reviewed ChEMBL publication subset and do not redefine the global publication taxonomy.
    # Source-specific filter policy:


    # - Silver and Gold are intentionally scoped to journal-article for the


    #   current ChEMBL publication pipeline.


    # - This is pipeline scope, not global publication type truth.


contracts:
  primary_key:
  - activity_id
  merge_keys:
  - activity_id
  hash_include: []
  hash_exclude: []
  hash_datetime_policy: v1_date
hash_policy:
  provider: chembl
  entity: activity
  contract:
    version: 1.0.0
    migration_note: 'Documentation-aligned: Align config with runtime normalized business schema.'
  hash_policy:
    algorithm: sha256
    canonicalization: provider + canonical_json_dumps(normalized_record)
    include_fields:
    - activity_id
    - assay_id
    - molecule_id
    - standard_type
    - standard_relation
    - standard_value
    - standard_units
    - pchembl_value
    - publication_id
    - publication_year
    exclude_fields:
    - _ingestion_ts
    - _run_id
    - _run_type
    - _dq_warn
    - _dq_error
    - _source_batch_id
    - _index
    exclude_patterns:
    - ^_dq_
    normalization:
      trim_strings: true
      round_floats:
        enabled: true
        precision: 10
      dates:
        enabled: true
        format: YYYY-MM-DD
      null_handling:
        nan_to_null: true
        inf_to_null: true
