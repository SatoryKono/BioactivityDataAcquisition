version: 1.0.0
provider: chembl
entity: cell_line
pipeline:
  pipeline_name: chembl_cell_line
  provider: chembl
  entity_type: cell_line
  description: Extract cell lines from ChEMBL API
  business_primary_keys:
  - cell_id
  sink:
    gold:
      mode: scd2
      scd_config:
        valid_from_col: _valid_from
        valid_to_col: _valid_to
        current_flag_col: _is_current
        version_col: _version
schema:
  content_hash:
    include: []
    exclude: []
  column_groups:
  - name: system
    fields:
    - entity_id
    - content_hash
    - _run_id
    - _run_type
    - _source_batch_id
    - _ingestion_ts
    - _index
  - name: business
    fields:
    - cell_id
    - cell_name
    - cell_description
    - cell_source_tissue
    - cell_source_organism
    - cell_source_taxonomy_id
    - cell_type
    - cellosaurus_id
    - clo_id
    - cl_lincs_id
    - efo_id
  - name: dq
    pattern: ^_dq_
  silver:
    include_groups:
    - system
    - business
    - dq
    exclude_fields: []
    alias_policy: preserve
  gold:
    include_groups:
    - system
    - business
    exclude_fields:
    - _dq_*
    - _source_batch_id
    - _index
    alias_policy: canonical
quality:
  version: 1.0.0
  provider: chembl
  entity: cell_line
  entity_field_validations:
  - field: cell_id
    type: pattern
    pattern: ^CHEMBL\d+$
    nullable: false
    error_message: cell_id must match CHEMBL format
  - field: cell_name
    type: pattern
    pattern: ^.{1,200}$
    nullable: false
    error_message: cell_name is required and must not exceed 200 chars
  - field: cellosaurus_id
    type: pattern
    pattern: ^CVCL_[A-Z0-9]+$
    nullable: true
    error_message: cellosaurus_id must match CVCL format
  - field: clo_id
    type: pattern
    pattern: ^CLO:\d{7}$
    nullable: true
    error_message: clo_id must match CLO format (CLO:0000000)
  - field: efo_id
    type: pattern
    pattern: ^EFO:\d{7}$
    nullable: true
    error_message: efo_id must match EFO format (EFO:0000000)
  - field: cell_source_taxonomy_id
    type: range
    min: 1
    max: 10000000
    nullable: true
  entity_cross_field_validations: []
  entity_conditional_validations: []
  key_nullability:
  - field: cell_id
    key_type: merge
    nullable: false
filters:
  version: 1.0.0
  provider: chembl
  entity: cell_line
  input_filter:
    enabled: true
    source_path: data/input/cell.csv
    column_name: cell_chembl_id
    filter_field: cell_chembl_id
    batch_size: 20
  silver_filters:
    required_fields:
    - cell_id
    - cell_name
  gold_filters:
    required_fields:
    - cell_name
contracts:
  primary_key:
  - cell_id
  merge_keys:
  - cell_id
  hash_include: []
