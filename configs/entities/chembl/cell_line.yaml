version: 1.0.0
provider: chembl
entity: cell_line
pipeline:
  pipeline_name: chembl_cell_line
  provider: chembl
  entity_type: cell_line
  description: Extract cell lines from ChEMBL API
  business_primary_keys:
  - cell_id

sink:
  gold:
    mode: scd2
    scd_config:
      valid_from_col: _valid_from
      valid_to_col: _valid_to
      current_flag_col: _is_current
      version_col: _version
schema:
  content_hash:
    include: []
    exclude: []
  column_groups:
  - name: system
    fields:
    - entity_id
    - content_hash
    - _run_id
    - _run_type
    - _source_batch_id
    - _ingestion_ts
    - _index
  - name: business
    fields:
    - cell_id
    - cell_name
    - cell_description
    - cell_source_tissue
    - cell_source_organism
    - cell_source_taxonomy_id
    - cell_type
    - cellosaurus_id
    - clo_id
    - clo_iri
    - clo_mapping_status
    - clo_ontology_version
    - cl_lincs_id
    - efo_id
    - efo_iri
    - efo_mapping_status
    - efo_ontology_version
  - name: dq
    pattern: ^_dq_
  silver:
    include_groups:
    - system
    - business
    - dq
    exclude_fields: []
    alias_policy: preserve
  gold:
    include_groups:
    - system
    - business
    exclude_fields:
    - _dq_*
    - _source_batch_id
    - _index
    alias_policy: canonical
quality:
  version: 1.0.0
  provider: chembl
  entity: cell_line
  entity_field_validations:
  - field: cell_id
    type: pattern
    pattern: ^CHEMBL\d+$
    nullable: false
    error_message: cell_id must match CHEMBL format
  - field: cell_name
    type: pattern
    pattern: ^.{1,200}$
    nullable: false
    error_message: cell_name is required and must not exceed 200 chars
  - field: cellosaurus_id
    type: pattern
    pattern: ^CVCL_[A-Z0-9]+$
    nullable: true
    error_message: cellosaurus_id must match CVCL format
  - field: clo_id
    type: pattern
    pattern: ^CLO[_:]\d+$
    nullable: true
    error_message: clo_id must match CLO format (CLO_0000000 or CLO:0000000)
  - field: clo_iri
    type: pattern
    pattern: '^https?://[^\s]+$'
    nullable: true
    error_message: clo_iri must be an HTTP(S) IRI when present
  - field: clo_mapping_status
    type: enum
    allowed:
    - mapped
    - unmapped
    - missing
    nullable: true
    error_message: Invalid CLO mapping status
  - field: efo_id
    type: pattern
    pattern: ^EFO[_:]\d+$
    nullable: true
    error_message: efo_id must match EFO format (EFO_0000000 or EFO:0000000)
  - field: efo_iri
    type: pattern
    pattern: '^https?://[^\s]+$'
    nullable: true
    error_message: efo_iri must be an HTTP(S) IRI when present
  - field: efo_mapping_status
    type: enum
    allowed:
    - mapped
    - unmapped
    - missing
    nullable: true
    error_message: Invalid EFO mapping status
  - field: cell_source_taxonomy_id
    type: range
    min: 1
    max: 10000000
    nullable: true
  entity_cross_field_validations:
  - name: clo_id_requires_mapping_status
    fields:
    - clo_id
    - clo_mapping_status
    condition: conditional_required
    trigger_field: clo_id
    required_field: clo_mapping_status
    error_message: CLO mappings must publish a companion mapping status
  - name: efo_id_requires_mapping_status
    fields:
    - efo_id
    - efo_mapping_status
    condition: conditional_required
    trigger_field: efo_id
    required_field: efo_mapping_status
    error_message: EFO mappings must publish a companion mapping status
  entity_conditional_validations:
  - name: mapped_clo_id_requires_bundle
    condition_field: clo_mapping_status
    condition_value: mapped
    condition_operator: eq
    then_validations:
    - field: clo_iri
      type: required
      nullable: false
      error_message: Mapped CLO identifiers must publish a canonical IRI
    - field: clo_ontology_version
      type: required
      nullable: false
      error_message: Mapped CLO identifiers must publish an ontology version
  - name: mapped_efo_id_requires_bundle
    condition_field: efo_mapping_status
    condition_value: mapped
    condition_operator: eq
    then_validations:
    - field: efo_iri
      type: required
      nullable: false
      error_message: Mapped EFO identifiers must publish a canonical IRI
    - field: efo_ontology_version
      type: required
      nullable: false
      error_message: Mapped EFO identifiers must publish an ontology version
  key_nullability:
  - field: cell_id
    key_type: merge
    nullable: false
filters:
  version: 1.0.0
  provider: chembl
  entity: cell_line
  input_filter:
    enabled: true
    source_path: data/input/cell.csv
    column_name: cell_chembl_id
    filter_field: cell_chembl_id
    batch_size: 20
  silver_filters:
    required_fields:
    - cell_id
    - cell_name
  gold_filters:
    required_fields:
    - cell_name
contracts:
  primary_key:
  - cell_id
  merge_keys:
  - cell_id
  hash_include: []
