version: 1.0.0
provider: chembl
entity: target_component
pipeline:
  pipeline_name: chembl_target_component
  provider: chembl
  entity_type: target_component
  description: ChEMBL Target Components (protein sequences, etc.)
  field_policy: {}
  business_primary_keys:
  - component_id

  sink:
    silver:
      partition_by:
      - organism
    gold:
      mode: scd2
      idempotency_contract: scd2
      scd_config:
        valid_from_col: _valid_from
        valid_to_col: _valid_to
        current_flag_col: _is_current
        version_col: _version
  batch_size: 1000
  checkpoint_interval: 1000
schema:
  content_hash:
    include: []
    exclude: []
  column_groups:
  - name: system
    fields:
    - entity_id
    - content_hash
    - _run_id
    - _run_type
    - _source_batch_id
    - _ingestion_ts
    - _index
  - name: business
    fields:
    - component_id
    - accession
    - component_type
    - component_description
    - organism
    - taxonomy_id
    - target_component_synonyms
    - target_component_xrefs
    - protein_classifications
    - protein_classification_id
    - protein_classification_ids
  - name: dq
    pattern: ^_dq_
  silver:
    include_groups:
    - system
    - business
    - dq
    exclude_fields: []
  gold:
    include_groups:
    - system
    - business
    exclude_fields:
    - _dq_*
    - _source_batch_id
    - _index
quality:
  version: 1.0.0
  provider: chembl
  entity: target_component
  entity_field_validations:
  - field: component_id
    type: range
    min: 1
    nullable: false
    error_message: Component ID is required and must be positive
  - field: component_type
    type: enum
    allowed:
    - PROTEIN
    - DNA
    - RNA
    nullable: true
  - field: accession
    type: pattern
    pattern: ^[A-Z0-9]{6,10}$
    nullable: true
    error_message: accession should be UniProt format (6-10 alphanumeric chars)
  - field: taxonomy_id
    type: range
    min: 1
    max: 10000000
    nullable: true
    error_message: Taxonomy ID must be between 1 and 10,000,000
  - field: target_component_xrefs
    type: custom
    validator: validate_target_component_xref_src_db_json_vocab
    nullable: true
    error_message: target_component_xrefs must be canonical JSON with governed xref_src_db source namespaces when 
      present
  entity_cross_field_validations:
  - name: component_identifiable
    fields:
    - component_id
    - accession
    condition: any_present
    error_message: Component must have ID or accession
  entity_conditional_validations: []
  key_nullability:
  - field: component_id
    key_type: merge
    nullable: false
  - field: organism
    key_type: partition
    nullable: false
filters:
  version: 1.0.0
  provider: chembl
  entity: target_component
  input_filter:
    enabled: true
    source_path: data/input/target_component.csv
    column_name: component_id
    filter_field: component_id
    batch_size: 100
    checkpoint_interval: 1000
    fallback_column: title
  extraction_params: {}
  silver_filters:
    exclude_if_present: []
    required_fields:
    - component_id
    - organism
  gold_filters:
    list_contains:
      component_types:
        values:
        - PROTEIN
        mode: all
    list_lengths:
      component_accessions:
        min: 1
        max: 1
      component_ids:
        min: 1
    ranges:
      publication_year:
        min: 1950
        max: 2050
    columns:
      component_type:
      - PROTEIN
    required_fields:
    - accession
    exclude_if_present: []
contracts:
  primary_key:
  - component_id
  merge_keys:
  - component_id
  hash_include: []
  hash_exclude: []
  hash_datetime_policy: v2_datetime_utc
  contract_ref: chembl.target_component
  active_version: 1.0.0
  rollout:
    mode: single
    read_order:
    - 1.0.0
    write_versions:
    - 1.0.0
    affects_hash: false
hash_policy:
  provider: chembl
  entity: target_component
  contract:
    version: 1.0.0
    migration_note: 'Explicit config-level hash contract for the normalized ChEMBL target-component Silver surface.'
  hash_policy:
    algorithm: sha256
    canonicalization: provider + canonical_json_dumps(normalized_record)
    include_fields:
    - component_id
    - accession
    - component_type
    - component_description
    - organism
    - taxonomy_id
    - target_component_synonyms
    - target_component_xrefs
    - protein_classifications
    - protein_classification_id
    - protein_classification_ids
    exclude_fields:
    - _ingestion_ts
    - _run_id
    - _run_type
    - _dq_warn
    - _dq_error
    - _source_batch_id
    - _index
    exclude_patterns:
    - ^_dq_
    normalization:
      trim_strings: true
      round_floats:
        enabled: true
        precision: 10
      dates:
        enabled: true
        format: YYYY-MM-DD
      null_handling:
        nan_to_null: true
        inf_to_null: true
