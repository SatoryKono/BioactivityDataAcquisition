version: 1.0.0
provider: chembl
entity: subcellular_fraction
pipeline:
  pipeline_name: chembl_subcellular_fraction
  provider: chembl
  entity_type: subcellular_fraction
  version: 1.0.0
  description: Extract unique subcellular fractions from ChEMBL Assay records
  loading_strategy: full_scan_only
  business_primary_keys:
  - subcellular_fraction

  sink:
    gold:
      mode: scd2
      scd_config:
        valid_from_col: _valid_from
        valid_to_col: _valid_to
        current_flag_col: _is_current
        version_col: _version
schema:
  content_hash:
    include: []
    exclude: []
  column_groups:
  - name: system
    fields:
    - entity_id
    - content_hash
    - _run_id
    - _run_type
    - _source_batch_id
    - _ingestion_ts
    - _index
  - name: business
    fields:
    - subcellular_fraction_raw
    - subcellular_fraction
    - assay_count
    - example_assay_id
  - name: dq
    pattern: ^_dq_
  silver:
    include_groups:
    - system
    - business
    - dq
    exclude_fields: []
    alias_policy: preserve
  gold:
    include_groups:
    - system
    - business
    exclude_fields:
    - _dq_*
    - _source_batch_id
    - _index
    alias_policy: canonical
quality:
  version: 1.0.0
  provider: chembl
  entity: subcellular_fraction
  metadata:
    subcellular_fraction_policy:
      scope: raw_plus_canonical_derived_vocabulary
      description: RAW-PLUS-CANONICAL ChEMBL subcellular-fraction policy. The pipeline preserves the source lexeme in subcellular_fraction_raw while subcellular_fraction stores the normalized derived vocabulary used by Silver/Gold contracts. Unknown source lexemes remain reviewable rather than being fail-closed into a strict enum.
      field_semantics:
        subcellular_fraction_raw: Preserve the raw/source ChEMBL subcellular-fraction label as trimmed text for traceability and synonym review.
        subcellular_fraction: Store the canonical normalized subcellular-fraction label used for downstream Silver/Gold semantics; unknown reviewed labels are preserved after canonical text normalization instead of being discarded.
  entity_field_validations:
  - field: entity_id
    type: pattern
    pattern: ^[a-f0-9]{16}$
    nullable: false
    error_message: entity_id must be a 16-char SHA256 hash prefix
  - field: subcellular_fraction
    type: pattern
    pattern: ^.{1,200}$
    nullable: false
    error_message: subcellular_fraction is required and must not exceed 200 chars
  - field: subcellular_fraction_raw
    type: pattern
    pattern: ^.{1,200}$
    nullable: true
    error_message: subcellular_fraction_raw must not exceed 200 chars
  - field: assay_count
    type: range
    min: 0
    nullable: true
    error_message: assay_count must be non-negative
  - field: example_assay_id
    type: pattern
    pattern: ^CHEMBL\d+$
    nullable: true
    error_message: example_assay_id must match CHEMBL format if present
  entity_cross_field_validations: []
  entity_conditional_validations: []
  key_nullability:
  - field: subcellular_fraction
    key_type: merge
    nullable: false
filters:
  version: 1.0.0
  provider: chembl
  entity: subcellular_fraction
  input_filter:
    enabled: false
  silver_filters:
    required_fields:
    - subcellular_fraction
  gold_filters:
    required_fields:
    - subcellular_fraction
    columns: {}
contracts:
  primary_key:
  - subcellular_fraction
  merge_keys:
  - subcellular_fraction
  hash_include: []
