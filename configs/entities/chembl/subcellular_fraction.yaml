version: 1.0.0
provider: chembl
entity: subcellular_fraction
pipeline:
  pipeline_name: chembl_subcellular_fraction
  provider: chembl
  entity_type: subcellular_fraction
  version: 1.0.0
  description: Extract unique subcellular fractions from ChEMBL Assay records
  loading_strategy: full_scan_only
  field_policy: {}
  business_primary_keys:
  - subcellular_fraction

  batch_size: 1000
  checkpoint_interval: 1000
schema:
  content_hash:
    include: []
    exclude: []
  column_groups:
  - name: system
    fields:
    - entity_id
    - content_hash
    - _run_id
    - _run_type
    - _source_batch_id
    - _ingestion_ts
    - _index
  - name: business
    fields:
    - subcellular_fraction_raw
    - subcellular_fraction
    - assay_count
    - example_assay_id
  - name: dq
    pattern: ^_dq_
  silver:
    include_groups:
    - system
    - business
    - dq
    exclude_fields: []
  gold:
    include_groups:
    - system
    - business
    exclude_fields:
    - _dq_*
    - _source_batch_id
    - _index
quality:
  version: 1.0.0
  provider: chembl
  entity: subcellular_fraction
  entity_field_validations:
  - field: entity_id
    type: pattern
    pattern: ^[a-f0-9]{16}$
    nullable: false
    error_message: entity_id must be a 16-char SHA256 hash prefix
  - field: subcellular_fraction
    type: pattern
    pattern: ^.{1,200}$
    nullable: false
    error_message: subcellular_fraction is required and must not exceed 200 chars
  - field: subcellular_fraction_raw
    type: pattern
    pattern: ^.{1,200}$
    nullable: true
    error_message: subcellular_fraction_raw must not exceed 200 chars
  - field: assay_count
    type: range
    min: 0
    nullable: true
    error_message: assay_count must be non-negative
  - field: example_assay_id
    type: pattern
    pattern: ^CHEMBL\d+$
    nullable: true
    error_message: example_assay_id must match CHEMBL format if present
  entity_cross_field_validations: []
  entity_conditional_validations: []
  key_nullability:
  - field: subcellular_fraction
    key_type: merge
    nullable: false
filters:
  version: 1.0.0
  provider: chembl
  entity: subcellular_fraction
  input_filter:
    enabled: false
    source_path: data/input/subcellular_fraction.csv
    column_name: subcellular_fraction
    filter_field: subcellular_fraction
    batch_size: 1000
    checkpoint_interval: 1000
    fallback_column: title
  extraction_params: {}
  silver_filters:
    exclude_if_present: []
    required_fields:
    - subcellular_fraction
  gold_filters:
    list_contains: {}
    list_lengths: {}
    ranges:
      publication_year:
        min: 1950
        max: 2050
    required_fields:
    - subcellular_fraction
    columns: {}
    exclude_if_present: []
contracts:
  primary_key:
  - subcellular_fraction
  merge_keys:
  - subcellular_fraction
  hash_include: []
  hash_exclude: []
  hash_datetime_policy: v2_datetime_utc
  contract_ref: chembl.subcellular_fraction
  active_version: 1.0.0
  rollout:
    mode: single
    read_order:
    - 1.0.0
    write_versions:
    - 1.0.0
    affects_hash: false
hash_policy:
  provider: chembl
  entity: subcellular_fraction
  contract:
    version: 1.0.0
    migration_note: 'Explicit config-level hash contract for the normalized ChEMBL subcellular_fraction Silver surface.'
  hash_policy:
    algorithm: sha256
    canonicalization: provider + canonical_json_dumps(normalized_record)
    include_fields:
    - subcellular_fraction_raw
    - subcellular_fraction
    - assay_count
    - example_assay_id
    exclude_fields:
    - _ingestion_ts
    - _run_id
    - _run_type
    - _dq_warn
    - _dq_error
    - _source_batch_id
    - _index
    exclude_patterns:
    - ^_dq_
    normalization:
      trim_strings: true
      round_floats:
        enabled: true
        precision: 10
      dates:
        enabled: true
        format: YYYY-MM-DD
      null_handling:
        nan_to_null: true
        inf_to_null: true
