version: 1.0.0
provider: chembl
entity: publication_similarity
pipeline:
  pipeline_name: chembl_publication_similarity
  provider: chembl
  entity_type: publication_similarity
  version: 2.1.0
  description: Extract publication similarity data (Tanimoto coefficients) from ChEMBL
    API
  loading_strategy: full_scan_only
  business_primary_keys:
  - sim_id

  sink:
    gold:
      mode: overwrite
      idempotency_contract: overwrite_rebuild
schema:
  content_hash:
    include: []
    exclude: []
  column_groups:
  - name: system
    fields:
    - entity_id
    - content_hash
    - _run_id
    - _run_type
    - _source_batch_id
    - _ingestion_ts
    - _index
  - name: business
    fields:
    - sim_id
    - doc_1
    - doc_2
    - pubmed_id1
    - pubmed_id2
    - tid_tani
    - mol_tani
    - avg_tani
    - max_tani
  - name: dq
    pattern: ^_dq_
  silver:
    include_groups:
    - system
    - business
    - dq
    exclude_fields: []
    alias_policy: preserve
  gold:
    include_groups:
    - system
    - business
    exclude_fields:
    - _dq_*
    - _source_batch_id
    - _index
    alias_policy: canonical
quality:
  version: 1.0.0
  provider: chembl
  entity: publication_similarity
  entity_field_validations:
  - field: sim_id
    type: range
    min: 1
    nullable: false
    error_message: Similarity ID is required and must be positive
  - field: doc_1
    type: range
    min: 1
    nullable: false
    error_message: First document ID is required
  - field: doc_2
    type: range
    min: 1
    nullable: false
    error_message: Second document ID is required
  - field: max_tani
    type: range
    min: 0
    max: 1
    nullable: true
    error_message: Tanimoto coefficient must be between 0 and 1
  - field: avg_tani
    type: range
    min: 0
    max: 1
    nullable: true
    error_message: Average Tanimoto must be between 0 and 1
  entity_cross_field_validations:
  - name: similarity_pair
    fields:
    - doc_1
    - doc_2
    condition: all_present
    error_message: Both document IDs are required
  entity_conditional_validations: []
  key_nullability:
  - field: sim_id
    key_type: merge
    nullable: false
filters:
  version: 1.0.0
  provider: chembl
  entity: publication_similarity
  input_filter:
    enabled: false
  silver_filters:
    required_fields:
    - sim_id
    - doc_1
    - doc_2
  gold_filters:
    ranges:
      max_tani:
        min: 0.5
        include_min: true
    required_fields:
    - sim_id
    - doc_1
    - doc_2
contracts:
  primary_key:
  - sim_id
  merge_keys:
  - sim_id
  hash_include: []
