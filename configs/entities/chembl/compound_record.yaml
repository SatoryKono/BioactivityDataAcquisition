version: 1.0.0
provider: chembl
entity: compound_record
pipeline:
  pipeline_name: chembl_compound_record
  provider: chembl
  entity_type: compound_record
  description: Extract compound records from ChEMBL API
  field_policy: {}
  business_primary_keys:
  - record_id

  sink:
    silver:
      partition_by: []
    gold:
      enabled: true
      mode: scd2
      idempotency_contract: scd2
      scd_config:
        valid_from_col: _valid_from
        valid_to_col: _valid_to
        current_flag_col: _is_current
        version_col: _version
  batch_size: 1000
  checkpoint_interval: 1000
schema:
  content_hash:
    include: []
    exclude: []
  column_groups:
  - name: system
    fields:
    - entity_id
    - content_hash
    - _run_id
    - _run_type
    - _source_batch_id
    - _ingestion_ts
    - _index
  - name: business
    fields:
    - record_id
    - molecule_id
    - publication_id
    - src_id
    - compound_key
    - compound_name
    - src_compound_id
  - name: dq
    pattern: ^_dq_
  silver:
    include_groups:
    - system
    - business
    - dq
    exclude_fields: []
  gold:
    include_groups:
    - system
    - business
    exclude_fields:
    - _dq_*
    - _source_batch_id
    - _index
quality:
  version: 1.0.0
  provider: chembl
  entity: compound_record
  entity_field_validations:
  - field: record_id
    type: range
    min: 1
    nullable: false
    error_message: Record ID is required and must be positive
  - field: molecule_id
    type: pattern
    pattern: ^CHEMBL\d+$
    nullable: false
    error_message: molecule_id must match CHEMBL format
  - field: publication_id
    type: pattern
    pattern: ^CHEMBL\d+$
    nullable: false
    error_message: publication_id must match CHEMBL format
  - field: src_id
    type: range
    min: 1
    nullable: true
  entity_cross_field_validations:
  - name: record_linkage
    fields:
    - molecule_id
    - publication_id
    condition: all_present
    error_message: Both molecule and document IDs are required
  entity_conditional_validations: []
  key_nullability:
  - field: record_id
    key_type: merge
    nullable: false
filters:
  version: 1.0.0
  provider: chembl
  entity: compound_record
  input_filter:
    enabled: true
    source_path: data/input/molecule.csv
    column_name: molecule_chembl_id
    filter_field: molecule_id
    batch_size: 1
    checkpoint_interval: 1000
    fallback_column: title
  extraction_params: {}
  silver_filters:
    exclude_if_present: []
    required_fields:
    - molecule_id
    - publication_id
    - record_id
  gold_filters:
    columns: {}
    exclude_if_present: []
    required_fields:
    - molecule_id
    - publication_id
    list_contains: {}
    list_lengths: {}
    ranges: {}
contracts:
  primary_key:
  - record_id
  merge_keys:
  - record_id
  hash_include: []
  hash_exclude: []
  hash_datetime_policy: v2_datetime_utc
  contract_ref: chembl.compound_record
  active_version: 1.0.0
  rollout:
    mode: single
    read_order:
    - 1.0.0
    write_versions:
    - 1.0.0
    affects_hash: false
hash_policy:
  provider: chembl
  entity: compound_record
  contract:
    version: 1.0.0
    migration_note: 'Explicit config-level hash contract for the normalized ChEMBL compound_record Silver surface.'
  hash_policy:
    algorithm: sha256
    canonicalization: provider + canonical_json_dumps(normalized_record)
    include_fields:
    - record_id
    - molecule_id
    - publication_id
    - src_id
    - compound_key
    - compound_name
    - src_compound_id
    exclude_fields:
    - _ingestion_ts
    - _run_id
    - _run_type
    - _dq_warn
    - _dq_error
    - _source_batch_id
    - _index
    exclude_patterns:
    - ^_dq_
    normalization:
      trim_strings: true
      round_floats:
        enabled: true
        precision: 10
      dates:
        enabled: true
        format: YYYY-MM-DD
      null_handling:
        nan_to_null: true
        inf_to_null: true
