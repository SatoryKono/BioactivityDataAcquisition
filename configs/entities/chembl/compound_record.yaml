version: 1.0.0
provider: chembl
entity: compound_record
pipeline:
  pipeline_name: chembl_compound_record
  provider: chembl
  entity_type: compound_record
  description: Extract compound records from ChEMBL API
  business_primary_keys:
  - record_id

  sink:
    gold:
      mode: scd2
      idempotency_contract: scd2
      scd_config:
        valid_from_col: _valid_from
        valid_to_col: _valid_to
        current_flag_col: _is_current
        version_col: _version
schema:
  content_hash:
    include: []
    exclude: []
  column_groups:
  - name: system
    fields:
    - entity_id
    - content_hash
    - _run_id
    - _run_type
    - _source_batch_id
    - _ingestion_ts
    - _index
  - name: business
    fields:
    - record_id
    - molecule_id
    - publication_id
    - src_id
    - compound_key
    - compound_name
    - src_compound_id
  - name: dq
    pattern: ^_dq_
  silver:
    include_groups:
    - system
    - business
    - dq
    exclude_fields: []
    alias_policy: preserve
  gold:
    include_groups:
    - system
    - business
    exclude_fields:
    - _dq_*
    - _source_batch_id
    - _index
    alias_policy: canonical
quality:
  version: 1.0.0
  provider: chembl
  entity: compound_record
  entity_field_validations:
  - field: record_id
    type: range
    min: 1
    nullable: false
    error_message: Record ID is required and must be positive
  - field: molecule_id
    type: pattern
    pattern: ^CHEMBL\d+$
    nullable: false
    error_message: molecule_id must match CHEMBL format
  - field: publication_id
    type: pattern
    pattern: ^CHEMBL\d+$
    nullable: false
    error_message: publication_id must match CHEMBL format
  - field: src_id
    type: range
    min: 1
    nullable: true
  entity_cross_field_validations:
  - name: record_linkage
    fields:
    - molecule_id
    - publication_id
    condition: all_present
    error_message: Both molecule and document IDs are required
  entity_conditional_validations: []
  key_nullability:
  - field: record_id
    key_type: merge
    nullable: false
filters:
  version: 1.0.0
  provider: chembl
  entity: compound_record
  input_filter:
    enabled: true
    source_path: data/input/molecule.csv
    column_name: molecule_chembl_id
    filter_field: molecule_id
    batch_size: 1
  silver_filters:
    required_fields:
    - molecule_id
    - publication_id
    - record_id
  gold_filters:
    required_fields:
    - molecule_id
    - publication_id
contracts:
  primary_key:
  - record_id
  merge_keys:
  - record_id
  hash_include: []
