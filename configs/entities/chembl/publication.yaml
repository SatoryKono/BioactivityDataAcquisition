version: 1.0.0
provider: chembl
entity: publication
pipeline:
    pipeline_name: chembl_publication
    provider: chembl
    entity_type: publication
    version: 2.1.0
    description: Extract scientific publications from ChEMBL API
    page_size_override: 1000
    batch_size: 1000
    loading_strategy: full_scan_only
    business_primary_keys:
        - publication_id

    sink:
        gold:
            enabled: true
            mode: scd2
            idempotency_contract: scd2
            scd_config:
                valid_from_col: _valid_from
                valid_to_col: _valid_to
                current_flag_col: _is_current
                version_col: _version
schema:
    column_groups:
        -   name: system
            fields:
                - entity_id
                - content_hash
                - _run_id
                - _run_type
                - _source_batch_id
                - _source
                - _ingestion_ts
                - _index
                - _lookup_method
                - _original_id
        -   name: identifiers
            fields:
                - publication_id
                - doi
                - pmid
                - pmc_id
                - publication_doi
                - publication_pmid
                - publication_pmc_id
        -   name: title
            fields:
                - title
        -   name: abstract
            fields:
                - abstract
        -   name: authors
            fields:
                - authors
        -   name: journal
            fields:
                - journal
        -   name: year
            fields:
                - publication_year
        -   name: pagination
            fields:
                - volume
                - issue
                - page_first
                - page_last
        -   name: doc_type
            fields:
                - publication_type_raw
                - publication_type
                - publication_type_unified
                - publication_subclass
                - publication_class
                - oa_status
        -   name: citations
            fields:
                - citations_received
                - citations_made
        -   name: provider_ids
            fields:
                - src_id
                - chembl_release
                - creation_date
        -   name: dq
            pattern: ^_dq_
    silver:
        include_groups:
            - system
            - identifiers
            - title
            - abstract
            - authors
            - journal
            - year
            - pagination
            - doc_type
            - citations
            - provider_ids
            - dq
        exclude_fields:
            - pmc_id
            - publication_type_unified
            - publication_subclass
            - publication_class
            - oa_status
            - citations_received
            - citations_made
            - affiliation_list
            - author_orcids
            - is_oa
            - issn_list
            - language
            - publication_date
    gold:
        include_groups:
            - system
            - identifiers
            - title
            - abstract
            - authors
            - journal
            - year
            - pagination
            - doc_type
            - citations
        exclude_fields:
            - _dq_*
            - _source_batch_id
            - _index
            - _lookup_method
            - _original_id
            - pmc_id
            - publication_type_unified
            - publication_subclass
            - publication_class
            - oa_status
            - citations_received
            - citations_made
            - affiliation_list
            - author_orcids
            - is_oa
            - issn_list
            - language
            - publication_date
quality:
    version: 1.0.0
    provider: chembl
    entity: publication
    metadata:
        publication_type_policy:
            scope: source_specific
            description: SOURCE-SPECIFIC ChEMBL publication typing policy. This pipeline accepts only the reviewed ChEMBL-native subset and maps it into the broader global publication taxonomy defined in configs/enums/chembl.yaml without redefining that global cross-provider taxonomy.
            field_semantics:
                publication_type_raw: Preserve the raw/native ChEMBL publication type token for traceability and provider-specific review.
                publication_type: Store the canonical publication type mapped into the global taxonomy for normalized Silver/Gold behavior.
    # Source-specific DQ policy:
    # - publication_type uses a ChEMBL-only allowed subset and does not redefine
    #   the global taxonomy in configs/enums/chembl.yaml.
    # - publication_type_raw preserves the provider-native token for traceability.
    # - publication_type stores the canonical mapped type used by this pipeline.
    entity_field_validations:
        -   field: publication_id
            type: pattern
            pattern: ^CHEMBL\d+$
            nullable: false
            error_message: publication_id must match CHEMBL format
        -   field: doi
            type: pattern
            pattern: ^10\.\d{4,}/\S+$
            nullable: true
            error_message: doi must match the canonical DOI format when present
        -   field: pmid
            type: pattern
            pattern: ^[1-9]\d{0,9}$
            nullable: true
            error_message: pmid must be a canonical positive numeric string when present
        -   field: pmc_id
            type: pattern
            pattern: ^PMC\d+$
            nullable: true
            error_message: pmc_id must match PMC identifier format when present
        -   field: publication_type
            type: enum
            allowed:
                - journal-article
                - book
                - dataset
                - patent
            nullable: false
            # Source-specific constraint: ChEMBL source only produces these 4 types
            # This is NOT the global publication type taxonomy
        -   field: publication_year
            type: range
            min: 1500
            max: 2100
            nullable: true
            error_message: Publication year must be between 1500 and 2100
        -   field: publication_year
            type: range
            min: 1950
            nullable: true
            severity: warn
            error_message: "Publication year before 1950 \u2014 will be filtered at Gold stage"
        -   field: publication_pmid
            type: pattern
            pattern: ^[1-9]\d{0,9}$
            nullable: true
            error_message: publication_pmid must be a canonical positive numeric string
        -   field: publication_doi
            type: pattern
            pattern: ^10\.\d{4,}/\S+$
            nullable: true
            error_message: DOI must match format 10.XXXX/suffix (no whitespace)
        -   field: publication_pmc_id
            type: pattern
            pattern: ^PMC\d+$
            nullable: true
            error_message: publication_pmc_id must match PMC identifier format
        -   field: publication_type_raw
            type: pattern
            pattern: ^[A-Z_ -]{1,64}$
            nullable: true
            error_message: publication_type_raw must be a provider-native type token when present
        -   field: oa_status
            type: enum
            allowed:
                - gold
                - green
                - hybrid
                - bronze
                - closed
            nullable: true
            error_message: oa_status must be one of the reviewed open-access status values when present
        -   field: title
            type: max_length
            max_length: 2000
            nullable: false
            error_message: Title must not exceed 2000 characters
        -   field: title
            type: not_null
            nullable: false
            error_message: Missing title is not allowed for Silver publication records
        -   field: title
            type: pattern
            pattern: \S
            nullable: false
            error_message: Title must not be empty or whitespace-only
        -   field: citations_received
            type: range
            min: 0
            nullable: true
            error_message: Citation count must be non-negative
        -   field: citations_received
            type: range
            min: 0
            max: 10000000
            nullable: true
            severity: warn
            error_message: Unusually high citation count
        -   field: citations_made
            type: range
            min: 0
            nullable: true
            error_message: Reference count must be non-negative
    entity_cross_field_validations:
        -   name: publication_identifiable
            fields:
                - publication_id
                - title
            condition: all_present
            severity: error
            error_message: Publication must have publication_id and title
        -   name: has_cross_reference
            fields:
                - publication_pmid
                - publication_doi
                - publication_pmc_id
                - pmid
                - doi
                - pmc_id
            condition: any_present
            severity: warn
            error_message: Publication should have at least one external identifier
                (PMID, DOI, or PMC ID)
    entity_conditional_validations:
        -   name: publication_requires_title
            condition_field: publication_type
            condition_value: journal-article
            condition_operator: eq
            then_validations:
                -   field: title
                    type: not_null
                    nullable: false
                    error_message: Publications of type journal-article must have a title
    key_nullability:
        -   field: publication_id
            key_type: merge
            nullable: false
filters:
    version: 1.0.0
    provider: chembl
    entity: publication
    metadata:
        publication_filter_policy:
            scope: source_specific
            description: SOURCE-SPECIFIC ChEMBL publication filter policy. Silver and Gold filters intentionally constrain this pipeline to the reviewed ChEMBL publication subset and do not redefine the global publication taxonomy.
    # Source-specific filter policy:
    # - Silver and Gold are intentionally scoped to journal-article for the
    #   current ChEMBL publication pipeline.
    # - This is pipeline scope, not global publication type truth.
    input_filter:
        enabled: false
        source_path: data/input/publication.csv
        column_name: publication_id
        filter_field: publication_id
        batch_size: 16
    extraction_params:
        doc_type: PUBLICATION
        year__gte: 1950
        year__lte: 2050
    silver_filters:
        # Source-specific filter: ChEMBL publication pipeline currently scoped
        # to journal-article only. This is NOT a global publication type constraint.
        columns:
            publication_type:
                - journal-article
        ranges:
            publication_year:
                min: 1950
                max: 2050
        required_fields:
            - publication_id
            - publication_type
            - title
    gold_filters:
        # Source-specific filter: ChEMBL Gold dataset restricted to journal-article
        # for canonical publication scope. This is NOT a global publication type constraint.
        columns:
            publication_type:
                - journal-article
        ranges:
            publication_year:
                min: 1950
                max: 2050
        required_fields:
            - publication_id
            - publication_type
            - title
contracts:
    primary_key:
        - publication_id
    merge_keys:
        - publication_id
    hash_include: []
    hash_datetime_policy: v1_date
hash_policy:
    provider: chembl
    entity: publication
    contract:
        version: 1.0.0
        migration_note: 'Explicit config-level hash contract for the normalized ChEMBL publication Silver surface, including raw-vs-canonical publication typing.'
    hash_policy:
        algorithm: sha256
        canonicalization: provider + canonical_json_dumps(normalized_record)
        include_fields:
            - publication_id
            - publication_doi
            - publication_pmid
            - publication_pmc_id
            - title
            - abstract
            - authors
            - journal
            - publication_year
            - volume
            - issue
            - page_first
            - page_last
            - publication_type_raw
            - publication_type
            - publication_type_unified
            - publication_subclass
            - publication_class
            - oa_status
            - citations_received
            - citations_made
            - src_id
            - chembl_release
            - creation_date
        exclude_fields:
            - _ingestion_ts
            - _run_id
            - _run_type
            - _dq_warn
            - _dq_error
            - _source_batch_id
            - _index
            - _lookup_method
            - _original_id
            - _source
        exclude_patterns:
            - ^_dq_
        normalization:
            trim_strings: true
            round_floats:
                enabled: true
                precision: 10
            dates:
                enabled: true
                format: YYYY-MM-DD
            null_handling:
                nan_to_null: true
                inf_to_null: true
