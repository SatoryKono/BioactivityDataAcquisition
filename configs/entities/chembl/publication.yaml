version: 1.0.0
provider: chembl
entity: publication
pipeline:
  pipeline_name: chembl_publication
  provider: chembl
  entity_type: publication
  version: 2.1.0
  description: Extract scientific publications from ChEMBL API
  page_size_override: 1000
  batch_size: 1000
  checkpoint_interval: 1000
  loading_strategy: full_scan_only
  field_policy: {}
  business_primary_keys:
  - publication_id

  sink:
    silver:
      partition_by: []
    gold:
      enabled: true
      mode: scd2
      idempotency_contract: scd2
      scd_config:
        valid_from_col: _valid_from
        valid_to_col: _valid_to
        current_flag_col: _is_current
        version_col: _version
schema:
  content_hash:
    include: []
    exclude: []
  column_groups:
  - name: system
    fields:
    - entity_id
    - content_hash
    - _run_id
    - _run_type
    - _source_batch_id
    - _source
    - _ingestion_ts
    - _index
    - _lookup_method
    - _original_id
  - name: identifiers
    fields:
    - publication_id
    - doi
    - pmid
    - pmc_id
    - publication_doi
    - publication_pmid
    - publication_pmc_id
  - name: title
    fields:
    - title
  - name: abstract
    fields:
    - abstract
  - name: authors
    fields:
    - authors
  - name: journal
    fields:
    - journal
  - name: year
    fields:
    - publication_year
  - name: pagination
    fields:
    - volume
    - issue
    - page_first
    - page_last
  - name: doc_type
    fields:
    - publication_type_raw
    - publication_type
    - publication_type_unified
    - publication_subclass
    - publication_class
  - name: open_access
    fields:
    - is_oa
    - oa_status
  - name: provider_ids
    fields:
    - src_id
    - chembl_release
    - creation_date
  - name: dq
    pattern: ^_dq_
  silver:
    include_groups:
    - system
    - identifiers
    - title
    - abstract
    - authors
    - journal
    - year
    - pagination
    - doc_type
    - open_access
    - provider_ids
    - dq
    exclude_fields:
    - affiliation_list
    - author_orcids
    - is_oa
    - issn_list
    - language
    - publication_date
  gold:
    include_groups:
    - system
    - identifiers
    - title
    - abstract
    - authors
    - journal
    - year
    - pagination
    - doc_type
    exclude_fields:
    - _dq_*
    - _source_batch_id
    - _index
    - _lookup_method
    - _original_id
    - pmc_id
    - publication_type_unified
    - publication_subclass
    - publication_class
    - oa_status
    - affiliation_list
    - author_orcids
    - is_oa
    - issn_list
    - language
    - publication_date
quality:
  version: 1.0.0
  provider: chembl
  entity: publication
  entity_field_validations:
  - field: publication_id
    type: pattern
    pattern: ^CHEMBL\d+$
    nullable: false
    error_message: publication_id must match CHEMBL format
  - field: doi
    type: pattern
    pattern: ^10\.\d{4,}/\S+$
    nullable: true
    error_message: doi must match the canonical DOI format when present
  - field: pmid
    type: pattern
    pattern: ^[1-9]\d{0,9}$
    nullable: true
    error_message: pmid must be a canonical positive numeric string when present
  - field: pmc_id
    type: pattern
    pattern: ^PMC\d+$
    nullable: true
    error_message: pmc_id must match PMC identifier format when present
  - field: publication_type
    type: enum
    allowed:
    - journal-article
    - book
    - dataset
    - patent
    nullable: false
  - field: oa_status
    type: enum
    allowed:
    - gold
    - green
    - hybrid
    - bronze
    - closed
    - diamond
    nullable: true
  - field: publication_year
    type: range
    min: 1500
    max: 2100
    nullable: true
    error_message: Publication year must be between 1500 and 2100
  - field: publication_year
    type: range
    min: 1950
    nullable: true
    severity: warn
    error_message: "Publication year before 1950 — will be filtered at Gold stage"
  - field: publication_pmid
    type: pattern
    pattern: ^[1-9]\d{0,9}$
    nullable: true
    error_message: publication_pmid must be a canonical positive numeric string
  - field: publication_doi
    type: pattern
    pattern: ^10\.\d{4,}/\S+$
    nullable: true
    error_message: DOI must match format 10.XXXX/suffix (no whitespace)
  - field: publication_pmc_id
    type: pattern
    pattern: ^PMC\d+$
    nullable: true
    error_message: publication_pmc_id must match PMC identifier format
  - field: publication_type_raw
    type: pattern
    pattern: ^[A-Z_ -]{1,64}$
    nullable: true
    error_message: publication_type_raw must be a provider-native type token when present
  - field: title
    type: max_length
    max_length: 2000
    nullable: false
    error_message: Title must not exceed 2000 characters
  - field: title
    type: not_null
    nullable: false
    error_message: Missing title is not allowed for Silver publication records
  - field: title
    type: pattern
    pattern: \S
    nullable: false
    error_message: Title must not be empty or whitespace-only
  - field: citations_received
    type: range
    min: 0
    nullable: true
    error_message: Citation count must be non-negative
  - field: citations_received
    type: range
    min: 0
    max: 10000000
    nullable: true
    severity: warn
    error_message: Unusually high citation count
  - field: citations_made
    type: range
    min: 0
    nullable: true
    error_message: Reference count must be non-negative
  entity_cross_field_validations:
  - name: publication_identifiable
    fields:
    - publication_id
    - title
    condition: all_present
    severity: error
    error_message: Publication must have publication_id and title
  - name: has_cross_reference
    fields:
    - publication_pmid
    - publication_doi
    - publication_pmc_id
    - pmid
    - doi
    - pmc_id
    condition: any_present
    severity: warn
    error_message: Publication should have at least one external identifier (PMID, DOI, or PMC ID)
  - name: doi_alias_equality
    fields:
    - doi
    - publication_doi
    condition: custom
    validator: validate_alias_equality
    severity: error
    error_message: doi and publication_doi must be equal when both present
  - name: pmid_alias_equality
    fields:
    - pmid
    - publication_pmid
    condition: custom
    validator: validate_alias_equality
    severity: error
    error_message: pmid and publication_pmid must be equal when both present
  - name: pmc_id_alias_equality
    fields:
    - pmc_id
    - publication_pmc_id
    condition: custom
    validator: validate_alias_equality
    severity: error
    error_message: pmc_id and publication_pmc_id must be equal when both present
  entity_conditional_validations:
  - name: publication_requires_title
    condition_field: publication_type
    condition_value: journal-article
    condition_operator: eq
    then_validations:
    - field: title
      type: not_null
      nullable: false
      error_message: Publications of type journal-article must have a title
  key_nullability:
  - field: publication_id
    key_type: merge
    nullable: false
filters:
  version: 1.0.0
  provider: chembl
  entity: publication
  extraction_params:
    doc_type: PUBLICATION
    year__gte: 1950
    year__lte: 2050
  source_profile:
    profile_id: chembl.publication.curated
    version: 1.0.0
    status: baseline
    extraction_params_sha256: d9dec3600fd2f00e1c7b639e53ca8e8a80c6f8af6eb6a7ab957399196dba3975
    description: Baseline curated ChEMBL publication extraction profile; keeps VCR-backed E2E requests bounded to publication documents.
  silver_filters:
    exclude_if_present: []
    required_fields:
    - publication_id
    - publication_type
    - title
  gold_filters:
    list_contains: {}
    list_lengths: {}
    ranges:
      publication_year:
        min: 1950
        max: 2050
    columns: {}
    exclude_if_present: []
    required_fields:
    - publication_id
contracts:
  primary_key:
  - publication_id
  merge_keys:
  - publication_id
  hash_include: []
  hash_exclude: []
  hash_datetime_policy: v2_datetime_utc
  contract_ref: chembl.publication
  active_version: 1.0.0
  rollout:
    mode: single
    read_order:
    - 1.0.0
    write_versions:
    - 1.0.0
    affects_hash: false
hash_policy:
  provider: chembl
  entity: publication
  contract:
    version: 1.0.0
    migration_note: 'Explicit config-level hash contract for the normalized ChEMBL publication Silver surface, including raw-vs-canonical
      publication typing.'
  hash_policy:
    algorithm: sha256
    canonicalization: provider + canonical_json_dumps(normalized_record)
    include_fields:
    - publication_id
    - publication_doi
    - publication_pmid
    - publication_pmc_id
    - title
    - abstract
    - authors
    - journal
    - publication_year
    - volume
    - issue
    - page_first
    - page_last
    - publication_type_raw
    - publication_type
    - publication_type_unified
    - publication_subclass
    - publication_class
    - src_id
    - chembl_release
    - creation_date
    exclude_fields:
    - _ingestion_ts
    - _run_id
    - _run_type
    - _dq_warn
    - _dq_error
    - _source_batch_id
    - _index
    - _lookup_method
    - _original_id
    - _source
    exclude_patterns:
    - ^_dq_
    normalization:
      trim_strings: true
      round_floats:
        enabled: true
        precision: 10
      dates:
        enabled: true
        format: YYYY-MM-DD
      null_handling:
        nan_to_null: true
        inf_to_null: true
