version: 1.0.0
provider: chembl
entity: tissue
pipeline:
  pipeline_name: chembl_tissue
  provider: chembl
  entity_type: tissue
  version: 1.0.0
  description: Extract tissues from ChEMBL API
  field_policy: {}
  business_primary_keys:
  - tissue_id

  sink:
    silver:
      partition_by: []
    gold:
      mode: scd2
      idempotency_contract: scd2
      scd_config:
        valid_from_col: _valid_from
        valid_to_col: _valid_to
        current_flag_col: _is_current
        version_col: _version
  batch_size: 1000
  checkpoint_interval: 1000
schema:
  field_aliases:
    reference_count: citations_made
    affiliations: affiliation_list
    citation_count: citations_received
    keywords: subject_keywords
    mesh_terms: subject_mesh
    pages: page_range
    source_type: publication_type
    fields_of_study: subject_fields
    journal_abbrev: journal_name_short
    journal_title: journal_name
    short_container_title: journal_name_short
    structured_affiliations: affiliation_structured
    subjects: subject_keywords
    topics: subject_topics
  content_hash:
    include: []
    exclude: []
  column_groups:
  - name: system
    fields:
    - entity_id
    - content_hash
    - _run_id
    - _run_type
    - _source
    - _ingestion_ts
  - name: identifiers
    fields:
    - tissue_id
  - name: business
    fields:
    - pref_name
    - bto_id
    - bto_iri
    - bto_mapping_status
    - bto_ontology_version
    - caloha_id
    - efo_id
    - efo_iri
    - efo_mapping_status
    - efo_ontology_version
    - uberon_id
    - uberon_iri
    - uberon_mapping_status
    - uberon_ontology_version
  silver:
    include_groups:
    - system
    - identifiers
    - business
    exclude_fields: []
    alias_policy: preserve
  gold:
    include_groups:
    - system
    - identifiers
    - business
    exclude_fields:
    - _dq_*
    - _source_batch_id
    - _index
    alias_policy: canonical
quality:
  metadata:
    assay_parameter_type_policy:
      scope: raw_plus_canonical_controlled_vocabulary
      description: RAW-PLUS-CANONICAL ChEMBL assay-parameter typing policy. The pipeline preserves the provider-native 
        type lexeme in type_raw for reviewability while parameter_type stores the canonical controlled-vocabulary value 
        used by Silver/Gold semantics and DQ governance.
      field_semantics:
        type_raw: Preserve the raw/provider-native assay-parameter type token as trimmed text for review and drift 
          analysis.
        type: Published reviewed Silver alias for the canonical normalized assay-parameter type surface used by 
          downstream Silver/Gold consumers and governance reporting.
        parameter_type: Store the canonical assay-parameter type vocabulary value used for normalized Silver/Gold 
          behavior; unknown provider lexemes are preserved as reviewed uppercase canonical candidates rather than 
          rejected at profile time.
        standard_type: Store the canonical strict standard_type surface governed by the shared ChEMBL assay-parameter 
          universe and DQ policy.
    publication_type_policy:
      scope: source_specific
      description: SOURCE-SPECIFIC ChEMBL publication typing policy. This pipeline accepts only the reviewed 
        ChEMBL-native subset and maps it into the broader global publication taxonomy defined in 
        configs/enums/chembl.yaml without redefining that global cross-provider taxonomy.
      field_semantics:
        publication_type_raw: Preserve the raw/native ChEMBL publication type token for traceability and 
          provider-specific review.
        publication_type: Store the canonical publication type mapped into the global taxonomy for normalized 
          Silver/Gold behavior.
    # Source-specific DQ policy:



    # - publication_type uses a ChEMBL-only allowed subset and does not redefine



    #   the global taxonomy in configs/enums/chembl.yaml.



    # - publication_type_raw preserves the provider-native token for traceability.



    # - publication_type stores the canonical mapped type used by this pipeline.



    subcellular_fraction_policy:
      scope: raw_plus_canonical_derived_vocabulary
      description: RAW-PLUS-CANONICAL ChEMBL subcellular-fraction policy. The pipeline preserves the source lexeme in 
        subcellular_fraction_raw while subcellular_fraction stores the normalized derived vocabulary used by Silver/Gold
        contracts. Unknown source lexemes remain reviewable rather than being fail-closed into a strict enum.
      field_semantics:
        subcellular_fraction_raw: Preserve the raw/source ChEMBL subcellular-fraction label as trimmed text for 
          traceability and synonym review.
        subcellular_fraction: Store the canonical normalized subcellular-fraction label used for downstream Silver/Gold 
          semantics; unknown reviewed labels are preserved after canonical text normalization instead of being 
          discarded.
  version: 1.0.0
  provider: chembl
  entity: tissue
  entity_field_validations:
  - field: tissue_id
    type: pattern
    pattern: ^CHEMBL\d+$
    nullable: false
    error_message: tissue_id must match CHEMBL format
  - field: pref_name
    type: pattern
    pattern: ^.{1,200}$
    nullable: false
    error_message: pref_name is required and must not exceed 200 chars
  - field: bto_id
    type: pattern
    pattern: ^BTO_\d+$
    nullable: true
    error_message: bto_id must match canonical BTO format (BTO_0000000)
  - field: bto_iri
    type: pattern
    pattern: '^https?://[^\s]+$'
    nullable: true
    error_message: bto_iri must be an HTTP(S) IRI when present
  - field: bto_mapping_status
    type: enum
    allowed:
    - mapped
    - unmapped
    - missing
    nullable: true
    error_message: Invalid BTO mapping status
  - field: caloha_id
    type: pattern
    pattern: ^TS-\d{4}$
    nullable: true
    error_message: caloha_id must match CALIPHO format (TS-0000)
  - field: efo_id
    type: pattern
    pattern: ^EFO_\d+$
    nullable: true
    error_message: efo_id must match canonical EFO format (EFO_0000000)
  - field: efo_iri
    type: pattern
    pattern: '^https?://[^\s]+$'
    nullable: true
    error_message: efo_iri must be an HTTP(S) IRI when present
  - field: efo_mapping_status
    type: enum
    allowed:
    - mapped
    - unmapped
    - missing
    nullable: true
    error_message: Invalid EFO mapping status
  - field: uberon_id
    type: pattern
    pattern: ^UBERON_\d+$
    nullable: true
    error_message: uberon_id must match canonical UBERON format (UBERON_0000000)
  - field: uberon_iri
    type: pattern
    pattern: '^https?://[^\s]+$'
    nullable: true
    error_message: uberon_iri must be an HTTP(S) IRI when present
  - field: uberon_mapping_status
    type: enum
    allowed:
    - mapped
    - unmapped
    - missing
    nullable: true
    error_message: Invalid UBERON mapping status
  entity_cross_field_validations:
  - name: bto_id_requires_mapping_status
    fields:
    - bto_id
    - bto_mapping_status
    condition: conditional_required
    trigger_field: bto_id
    required_field: bto_mapping_status
    error_message: BTO mappings must publish a companion mapping status
  - name: efo_id_requires_mapping_status
    fields:
    - efo_id
    - efo_mapping_status
    condition: conditional_required
    trigger_field: efo_id
    required_field: efo_mapping_status
    error_message: EFO mappings must publish a companion mapping status
  - name: uberon_id_requires_mapping_status
    fields:
    - uberon_id
    - uberon_mapping_status
    condition: conditional_required
    trigger_field: uberon_id
    required_field: uberon_mapping_status
    error_message: UBERON mappings must publish a companion mapping status
  entity_conditional_validations:
  - name: mapped_bto_id_requires_bundle
    condition_field: bto_mapping_status
    condition_value: mapped
    condition_operator: eq
    then_validations:
    - field: bto_iri
      type: required
      nullable: false
      error_message: Mapped BTO identifiers must publish a canonical IRI
    - field: bto_ontology_version
      type: required
      nullable: false
      error_message: Mapped BTO identifiers must publish an ontology version
  - name: mapped_efo_id_requires_bundle
    condition_field: efo_mapping_status
    condition_value: mapped
    condition_operator: eq
    then_validations:
    - field: efo_iri
      type: required
      nullable: false
      error_message: Mapped EFO identifiers must publish a canonical IRI
    - field: efo_ontology_version
      type: required
      nullable: false
      error_message: Mapped EFO identifiers must publish an ontology version
  - name: mapped_uberon_id_requires_bundle
    condition_field: uberon_mapping_status
    condition_value: mapped
    condition_operator: eq
    then_validations:
    - field: uberon_iri
      type: required
      nullable: false
      error_message: Mapped UBERON identifiers must publish a canonical IRI
    - field: uberon_ontology_version
      type: required
      nullable: false
      error_message: Mapped UBERON identifiers must publish an ontology version
  key_nullability:
  - field: tissue_id
    key_type: merge
    nullable: false
filters:
  version: 1.0.0
  provider: chembl
  entity: tissue
  input_filter:
    enabled: false
    source_path: data/input/tissue.csv
    column_name: tissue_chembl_id
    filter_field: tissue_id
    batch_size: 1000
    checkpoint_interval: 1000
    fallback_column: title
  extraction_params: {}
  silver_filters:
    ranges:
      publication_year:
        min: 1950
        max: 2050
    columns: {}
    exclude_if_present: []
    required_fields:
    - tissue_id
    - pref_name
  gold_filters:
    list_contains: {}
    list_lengths: {}
    ranges:
      publication_year:
        min: 1950
        max: 2050
    required_fields:
    - tissue_id
    columns: {}
    exclude_if_present: []
  metadata:
    publication_filter_policy:
      scope: source_specific
      description: SOURCE-SPECIFIC ChEMBL publication filter policy. Silver and Gold filters intentionally constrain 
        this pipeline to the reviewed ChEMBL publication subset and do not redefine the global publication taxonomy.
    # Source-specific filter policy:



    # - Silver and Gold are intentionally scoped to journal-article for the



    #   current ChEMBL publication pipeline.



    # - This is pipeline scope, not global publication type truth.



contracts:
  primary_key:
  - tissue_id
  merge_keys:
  - tissue_id
  hash_include: []
  hash_exclude: []
  hash_datetime_policy: v1_date
hash_policy:
  provider: chembl
  entity: tissue
  contract:
    version: 1.0.0
    migration_note: 'Explicit config-level hash contract for the normalized ChEMBL tissue Silver surface.'
  hash_policy:
    algorithm: sha256
    canonicalization: provider + canonical_json_dumps(normalized_record)
    include_fields:
    - tissue_id
    - pref_name
    - bto_id
    - bto_iri
    - bto_mapping_status
    - bto_ontology_version
    - caloha_id
    - efo_id
    - efo_iri
    - efo_mapping_status
    - efo_ontology_version
    - uberon_id
    - uberon_iri
    - uberon_mapping_status
    - uberon_ontology_version
    exclude_fields:
    - _ingestion_ts
    - _run_id
    - _run_type
    - _dq_warn
    - _dq_error
    - _source_batch_id
    - _index
    exclude_patterns:
    - ^_dq_
    normalization:
      trim_strings: true
      round_floats:
        enabled: true
        precision: 10
      dates:
        enabled: true
        format: YYYY-MM-DD
      null_handling:
        nan_to_null: true
        inf_to_null: true
