version: 1.0.0
provider: chembl
entity: tissue
pipeline:
  pipeline_name: chembl_tissue
  provider: chembl
  entity_type: tissue
  version: 1.0.0
  description: Extract tissues from ChEMBL API
  field_policy: {}
  business_primary_keys:
  - tissue_id

  batch_size: 1000
  checkpoint_interval: 1000
schema:
  content_hash:
    include: []
    exclude: []
  column_groups:
  - name: system
    fields:
    - entity_id
    - content_hash
    - _run_id
    - _run_type
    - _source
    - _ingestion_ts
  - name: identifiers
    fields:
    - tissue_id
  - name: business
    fields:
    - pref_name
    - bto_id
    - bto_iri
    - bto_mapping_status
    - bto_ontology_version
    - caloha_id
    - efo_id
    - efo_iri
    - efo_mapping_status
    - efo_ontology_version
    - uberon_id
    - uberon_iri
    - uberon_mapping_status
    - uberon_ontology_version
  silver:
    include_groups:
    - system
    - identifiers
    - business
    exclude_fields: []
  gold:
    include_groups:
    - system
    - identifiers
    - business
    exclude_fields:
    - _dq_*
    - _source_batch_id
    - _index
quality:
  version: 1.0.0
  provider: chembl
  entity: tissue
  entity_field_validations:
  - field: tissue_id
    type: pattern
    pattern: ^CHEMBL\d+$
    nullable: false
    error_message: tissue_id must match CHEMBL format
  - field: pref_name
    type: pattern
    pattern: ^.{1,200}$
    nullable: false
    error_message: pref_name is required and must not exceed 200 chars
  - field: bto_id
    type: pattern
    pattern: ^BTO_\d+$
    nullable: true
    error_message: bto_id must match canonical BTO format (BTO_0000000)
  - field: bto_iri
    type: pattern
    pattern: '^https?://[^\s]+$'
    nullable: true
    error_message: bto_iri must be an HTTP(S) IRI when present
  - field: bto_mapping_status
    type: enum
    allowed:
    - mapped
    - unmapped
    - missing
    nullable: true
    error_message: Invalid BTO mapping status
  - field: caloha_id
    type: pattern
    pattern: ^TS-\d{4}$
    nullable: true
    error_message: caloha_id must match CALIPHO format (TS-0000)
  - field: efo_id
    type: pattern
    pattern: ^EFO_\d+$
    nullable: true
    error_message: efo_id must match canonical EFO format (EFO_0000000)
  - field: efo_iri
    type: pattern
    pattern: '^https?://[^\s]+$'
    nullable: true
    error_message: efo_iri must be an HTTP(S) IRI when present
  - field: efo_mapping_status
    type: enum
    allowed:
    - mapped
    - unmapped
    - missing
    nullable: true
    error_message: Invalid EFO mapping status
  - field: uberon_id
    type: pattern
    pattern: ^UBERON_\d+$
    nullable: true
    error_message: uberon_id must match canonical UBERON format (UBERON_0000000)
  - field: uberon_iri
    type: pattern
    pattern: '^https?://[^\s]+$'
    nullable: true
    error_message: uberon_iri must be an HTTP(S) IRI when present
  - field: uberon_mapping_status
    type: enum
    allowed:
    - mapped
    - unmapped
    - missing
    nullable: true
    error_message: Invalid UBERON mapping status
  entity_cross_field_validations:
  - name: bto_id_requires_mapping_status
    fields:
    - bto_id
    - bto_mapping_status
    condition: conditional_required
    trigger_field: bto_id
    required_field: bto_mapping_status
    error_message: BTO mappings must publish a companion mapping status
  - name: efo_id_requires_mapping_status
    fields:
    - efo_id
    - efo_mapping_status
    condition: conditional_required
    trigger_field: efo_id
    required_field: efo_mapping_status
    error_message: EFO mappings must publish a companion mapping status
  - name: uberon_id_requires_mapping_status
    fields:
    - uberon_id
    - uberon_mapping_status
    condition: conditional_required
    trigger_field: uberon_id
    required_field: uberon_mapping_status
    error_message: UBERON mappings must publish a companion mapping status
  entity_conditional_validations:
  - name: mapped_bto_id_requires_bundle
    condition_field: bto_mapping_status
    condition_value: mapped
    condition_operator: eq
    then_validations:
    - field: bto_iri
      type: required
      nullable: false
      error_message: Mapped BTO identifiers must publish a canonical IRI
    - field: bto_ontology_version
      type: required
      nullable: false
      error_message: Mapped BTO identifiers must publish an ontology version
  - name: mapped_efo_id_requires_bundle
    condition_field: efo_mapping_status
    condition_value: mapped
    condition_operator: eq
    then_validations:
    - field: efo_iri
      type: required
      nullable: false
      error_message: Mapped EFO identifiers must publish a canonical IRI
    - field: efo_ontology_version
      type: required
      nullable: false
      error_message: Mapped EFO identifiers must publish an ontology version
  - name: mapped_uberon_id_requires_bundle
    condition_field: uberon_mapping_status
    condition_value: mapped
    condition_operator: eq
    then_validations:
    - field: uberon_iri
      type: required
      nullable: false
      error_message: Mapped UBERON identifiers must publish a canonical IRI
    - field: uberon_ontology_version
      type: required
      nullable: false
      error_message: Mapped UBERON identifiers must publish an ontology version
  key_nullability:
  - field: tissue_id
    key_type: merge
    nullable: false
filters:
  version: 1.0.0
  provider: chembl
  entity: tissue
  input_filter:
    enabled: false
    source_path: data/input/tissue.csv
    column_name: tissue_chembl_id
    filter_field: tissue_id
    batch_size: 1000
    checkpoint_interval: 1000
    fallback_column: title
  extraction_params: {}
  silver_filters:
    exclude_if_present: []
    required_fields:
    - tissue_id
    - pref_name
  gold_filters:
    list_contains: {}
    list_lengths: {}
    ranges: {}
    required_fields:
    - tissue_id
    columns: {}
    exclude_if_present: []
contracts:
  primary_key:
  - tissue_id
  merge_keys:
  - tissue_id
  hash_include: []
  hash_exclude: []
  hash_datetime_policy: v2_datetime_utc
  contract_ref: chembl.tissue
  active_version: 1.0.0
  rollout:
    mode: single
    read_order:
    - 1.0.0
    write_versions:
    - 1.0.0
    affects_hash: false
hash_policy:
  provider: chembl
  entity: tissue
  contract:
    version: 1.0.0
    migration_note: 'Explicit config-level hash contract for the normalized ChEMBL tissue Silver surface.'
  hash_policy:
    algorithm: sha256
    canonicalization: provider + canonical_json_dumps(normalized_record)
    include_fields:
    - tissue_id
    - pref_name
    - bto_id
    - bto_iri
    - bto_mapping_status
    - bto_ontology_version
    - caloha_id
    - efo_id
    - efo_iri
    - efo_mapping_status
    - efo_ontology_version
    - uberon_id
    - uberon_iri
    - uberon_mapping_status
    - uberon_ontology_version
    exclude_fields:
    - _ingestion_ts
    - _run_id
    - _run_type
    - _dq_warn
    - _dq_error
    - _source_batch_id
    - _index
    exclude_patterns:
    - ^_dq_
    normalization:
      trim_strings: true
      round_floats:
        enabled: true
        precision: 10
      dates:
        enabled: true
        format: YYYY-MM-DD
      null_handling:
        nan_to_null: true
        inf_to_null: true
