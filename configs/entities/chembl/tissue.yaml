version: 1.0.0
provider: chembl
entity: tissue
pipeline:
  pipeline_name: chembl_tissue
  provider: chembl
  entity_type: tissue
  version: 1.0.0
  description: Extract tissues from ChEMBL API
  business_primary_keys:
  - tissue_id
  sink:
    gold:
      mode: scd2
      scd_config:
        valid_from_col: _valid_from
        valid_to_col: _valid_to
        current_flag_col: _is_current
        version_col: _version
schema:
  content_hash:
    include: []
    exclude: []
  column_groups:
  - name: system
    fields:
    - entity_id
    - content_hash
    - _run_id
    - _run_type
    - _source
    - _ingestion_ts
  - name: identifiers
    fields:
    - tissue_id
  - name: business
    fields:
    - pref_name
    - bto_id
    - caloha_id
    - efo_id
    - uberon_id
  silver:
    include_groups:
    - system
    - identifiers
    - business
  gold:
    include_groups:
    - system
    - identifiers
    - business
quality:
  version: 1.0.0
  provider: chembl
  entity: tissue
  entity_field_validations:
  - field: tissue_id
    type: pattern
    pattern: ^CHEMBL\d+$
    nullable: false
    error_message: tissue_id must match CHEMBL format
  - field: pref_name
    type: pattern
    pattern: ^.{1,200}$
    nullable: false
    error_message: pref_name is required and must not exceed 200 chars
  - field: bto_id
    type: pattern
    pattern: ^BTO:\d{7}$
    nullable: true
    error_message: bto_id must match BTO format (BTO:0000000)
  - field: caloha_id
    type: pattern
    pattern: ^TS-\d{4}$
    nullable: true
    error_message: caloha_id must match CALIPHO format (TS-0000)
  - field: efo_id
    type: pattern
    pattern: ^EFO:\d{7}$
    nullable: true
    error_message: efo_id must match EFO format (EFO:0000000)
  - field: uberon_id
    type: pattern
    pattern: ^UBERON:\d{7}$
    nullable: true
    error_message: uberon_id must match UBERON format (UBERON:0000000)
  entity_cross_field_validations: []
  entity_conditional_validations: []
  key_nullability:
  - field: tissue_id
    key_type: merge
    nullable: false
filters:
  version: 1.0.0
  provider: chembl
  entity: tissue
  input_filter:
    enabled: false
  silver_filters:
    required_fields: []
  gold_filters:
    required_fields:
    - tissue_id
contracts:
  primary_key:
  - tissue_id
  merge_keys:
  - tissue_id
  hash_include: []
