version: 1.0.0
provider: chembl
entity: target
pipeline:
    pipeline_name: chembl_target
    provider: chembl
    entity_type: target
    description: Extract biological targets from ChEMBL API
    business_primary_keys:
        - target_id
    batch_size: 1000

    sink:
        silver:
            partition_by:
                - target_type
        gold:
            mode: scd2
            scd_config:
                valid_from_col: _valid_from
                valid_to_col: _valid_to
                current_flag_col: _is_current
                version_col: _version
schema:
  content_hash:
    include: []
    exclude: []
  column_groups:
  - name: system
    fields:
    - entity_id
    - content_hash
    - _run_id
    - _run_type
    - _source_batch_id
    - _ingestion_ts
    - _index
  - name: business
    fields:
    - target_id
    - target_type
    - pref_name
    - taxonomy_id
    - organism
    - organism_class
    - species_group_flag
    - description
    - downgraded
    - target_components
    - cross_references
    - pipeline_stages
    - target_component_synonyms
    - component_accessions
    - component_descriptions
    - primary_component_id
    - component_ids
    - component_types
    - component_relationships
  - name: dq
    pattern: ^_dq_
  silver:
    include_groups:
    - system
    - business
    - dq
    exclude_fields: []
    alias_policy: preserve
  gold:
    include_groups:
    - system
    - business
    exclude_fields:
    - _dq_*
    - _source_batch_id
    - _index
    alias_policy: canonical
quality:
    version: 1.1.0
    provider: chembl
    entity: target
    entity_field_validations:
        -   field: target_id
            type: required
            nullable: false
            error_message: Target ChEMBL ID is required
        -   field: target_type
            type: enum
            allowed:
                - SINGLE PROTEIN
                - PROTEIN FAMILY
                - PROTEIN COMPLEX
                - PROTEIN COMPLEX GROUP
                - SELECTIVITY GROUP
                - CHIMERIC PROTEIN
                - CELL-LINE
                - TISSUE
                - ORGANISM
                - MACROMOLECULE
                - SMALL MOLECULE
                - LIPID
                - METAL
                - UNKNOWN
            nullable: true
            error_message: Invalid target_type value
        -   field: organism
            type: pattern
            pattern: ^[A-Z][a-z]+ [a-z]+.*$
            nullable: true
            error_message: organism should be in binomial nomenclature
        -   field: taxonomy_id
            type: range
            min: 1
            max: 10000000
            nullable: true
    entity_cross_field_validations:
        -   name: target_identifiable
            fields:
                - target_id
                - pref_name
            condition: all_present
            error_message: Target must have ID and preferred name
    entity_conditional_validations: []
    key_nullability:
        -   field: target_id
            key_type: merge
            nullable: false
        -   field: target_type
            key_type: partition
            nullable: false
filters:
    version: 1.0.0
    provider: chembl
    entity: target
    input_filter:
        enabled: false
        source_path: data/input/target.csv
        column_name: target_chembl_id
        filter_field: target_id
        batch_size: 20
    extraction_params:
        target_type: SINGLE PROTEIN
        organism__isnull: false
        tax_id__isnull: false
    silver_filters:
        columns:
            target_type:
                - SINGLE PROTEIN
        required_fields:
            - target_id
            - pref_name
            - organism
            - target_type
    gold_filters:
        columns:
            target_type:
                - SINGLE PROTEIN
        list_lengths:
            component_accessions:
                min: 1
                max: 1
            component_ids:
                min: 1
        list_contains:
            component_types:
                values:
                    - PROTEIN
                mode: all
        required_fields:
            - pref_name
            - organism
contracts:
    primary_key:
        - target_id
    merge_keys:
        - target_id
    hash_include: []
hash_policy:
    provider: chembl
    entity: target
    contract:
        version: 1.0.0
        migration_note: 'Explicit config-level hash contract for the normalized ChEMBL target Silver surface.'
    hash_policy:
        algorithm: sha256
        canonicalization: provider + canonical_json_dumps(normalized_record)
        include_fields:
            - target_id
            - target_type
            - pref_name
            - taxonomy_id
            - organism
            - organism_class
            - species_group_flag
            - description
            - downgraded
            - target_components
            - cross_references
            - pipeline_stages
            - target_component_synonyms
            - component_accessions
            - component_descriptions
            - primary_component_id
            - component_ids
            - component_types
            - component_relationships
        exclude_fields:
            - _ingestion_ts
            - _run_id
            - _run_type
            - _dq_warn
            - _dq_error
            - _source_batch_id
            - _index
        exclude_patterns:
            - ^_dq_
        normalization:
            trim_strings: true
            round_floats:
                enabled: true
                precision: 10
            dates:
                enabled: true
                format: YYYY-MM-DD
            null_handling:
                nan_to_null: true
                inf_to_null: true
