version: 1.0.0
provider: chembl
entity: target
pipeline:
  pipeline_name: chembl_target
  provider: chembl
  entity_type: target
  description: Extract biological targets from ChEMBL API
  field_policy: {}
  business_primary_keys:
  - target_id
  batch_size: 1000
  checkpoint_interval: 1000

  sink:
    silver:
      partition_by:
      - target_type
    gold:
      enabled: true
      mode: scd2
      idempotency_contract: scd2
      scd_config:
        valid_from_col: _valid_from
        valid_to_col: _valid_to
        current_flag_col: _is_current
        version_col: _version
schema:
  content_hash:
    include: []
    exclude: []
  column_groups:
  - name: system
    fields:
    - entity_id
    - content_hash
    - _run_id
    - _run_type
    - _source_batch_id
    - _ingestion_ts
    - _index
  - name: business
    fields:
    - target_id
    - target_type
    - pref_name
    - taxonomy_id
    - organism
    - organism_class
    - species_group_flag
    - target_description
    - target_protein_synonyms
    - target_gene_synonyms
    - target_ec_numbers
    - target_xref_pdb_ids
    - target_xref_go_component
    - target_xref_go_function
    - target_xref_go_process
    - target_xref_hgnc_ids
    - target_xref_reactome_ids
    - target_xref_uniprot_ids
    - primary_component_id
    - component_accessions
    - component_descriptions
    - component_ids
    - component_types
    - component_relationships
    - target_components
    - cross_references
    - target_component_synonyms
  - name: dq
    pattern: ^_dq_
  silver:
    include_groups:
    - system
    - business
    - dq
    exclude_fields: []
  gold:
    include_groups:
    - system
    - business
    exclude_fields:
    - _dq_*
    - _source_batch_id
    - _index
quality:
  metadata:
    assay_parameter_type_policy:
      scope: raw_plus_canonical_controlled_vocabulary
      description: RAW-PLUS-CANONICAL ChEMBL assay-parameter typing policy. The pipeline preserves the provider-native 
        type lexeme in type_raw for reviewability while parameter_type stores the canonical controlled-vocabulary value 
        used by Silver/Gold semantics and DQ governance.
      field_semantics:
        type_raw: Preserve the raw/provider-native assay-parameter type token as trimmed text for review and drift 
          analysis.
        type: Published reviewed Silver alias for the canonical normalized assay-parameter type surface used by 
          downstream Silver/Gold consumers and governance reporting.
        parameter_type: Store the canonical assay-parameter type vocabulary value used for normalized Silver/Gold 
          behavior; unknown provider lexemes are preserved as reviewed uppercase canonical candidates rather than 
          rejected at profile time.
        standard_type: Store the canonical strict standard_type surface governed by the shared ChEMBL assay-parameter 
          universe and DQ policy.
    publication_type_policy:
      scope: source_specific
      description: SOURCE-SPECIFIC ChEMBL publication typing policy. This pipeline accepts only the reviewed 
        ChEMBL-native subset and maps it into the broader global publication taxonomy defined in 
        configs/enums/chembl.yaml without redefining that global cross-provider taxonomy.
      field_semantics:
        publication_type_raw: Preserve the raw/native ChEMBL publication type token for traceability and 
          provider-specific review.
        publication_type: Store the canonical publication type mapped into the global taxonomy for normalized 
          Silver/Gold behavior.
    # Source-specific DQ policy:




    # - publication_type uses a ChEMBL-only allowed subset and does not redefine




    #   the global taxonomy in configs/enums/chembl.yaml.




    # - publication_type_raw preserves the provider-native token for traceability.




    # - publication_type stores the canonical mapped type used by this pipeline.




    subcellular_fraction_policy:
      scope: raw_plus_canonical_derived_vocabulary
      description: RAW-PLUS-CANONICAL ChEMBL subcellular-fraction policy. The pipeline preserves the source lexeme in 
        subcellular_fraction_raw while subcellular_fraction stores the normalized derived vocabulary used by Silver/Gold
        contracts. Unknown source lexemes remain reviewable rather than being fail-closed into a strict enum.
      field_semantics:
        subcellular_fraction_raw: Preserve the raw/source ChEMBL subcellular-fraction label as trimmed text for 
          traceability and synonym review.
        subcellular_fraction: Store the canonical normalized subcellular-fraction label used for downstream Silver/Gold 
          semantics; unknown reviewed labels are preserved after canonical text normalization instead of being 
          discarded.
  version: 1.1.0
  provider: chembl
  entity: target
  entity_field_validations:
  - field: target_id
    type: required
    nullable: false
    error_message: Target ChEMBL ID is required
  - field: target_type
    type: enum
    allowed:
    - SINGLE PROTEIN
    - PROTEIN FAMILY
    - PROTEIN COMPLEX
    - PROTEIN COMPLEX GROUP
    - SELECTIVITY GROUP
    - CHIMERIC PROTEIN
    - CELL-LINE
    - TISSUE
    - ORGANISM
    - MACROMOLECULE
    - SMALL MOLECULE
    - LIPID
    - METAL
    - UNKNOWN
    nullable: true
    error_message: Invalid target_type value
  - field: organism
    type: custom
    validator: validate_target_organism_supported_name
    nullable: true
    error_message: organism must remain a supported ChEMBL target organism label when present
  - field: taxonomy_id
    type: range
    min: 1
    max: 10000000
    nullable: true
  - field: organism_class
    type: enum
    allowed:
    - acellular
    - unicellular
    - multicellular
    nullable: true
    error_message: organism_class must match the reviewed cellularity taxonomy when present
  - field: component_types
    type: custom
    validator: validate_target_component_types_json_vocab
    nullable: true
    error_message: component_types must be a canonical JSON array of allowed target component types when present
  - field: component_relationships
    type: custom
    validator: validate_target_component_relationships_json_vocab
    nullable: true
    error_message: component_relationships must be a canonical JSON array of allowed target component relationships when
      present
  - field: cross_references
    type: custom
    validator: validate_target_xref_src_db_json_vocab
    nullable: true
    error_message: cross_references must be canonical JSON with governed xref_src_db source namespaces when present
  - field: target_xref_pdb_ids
    type: not_null
    nullable: false
    error_message: target_xref_pdb_ids must emit a normalized pipe string or unknown sentinel
  - field: target_xref_go_component
    type: not_null
    nullable: false
    error_message: target_xref_go_component must emit a normalized pipe string or unknown sentinel
  - field: target_xref_go_function
    type: not_null
    nullable: false
    error_message: target_xref_go_function must emit a normalized pipe string or unknown sentinel
  - field: target_xref_go_process
    type: not_null
    nullable: false
    error_message: target_xref_go_process must emit a normalized pipe string or unknown sentinel
  - field: target_xref_hgnc_ids
    type: not_null
    nullable: false
    error_message: target_xref_hgnc_ids must emit a normalized pipe string or unknown sentinel
  - field: target_xref_reactome_ids
    type: not_null
    nullable: false
    error_message: target_xref_reactome_ids must emit a normalized pipe string or unknown sentinel
  - field: target_xref_uniprot_ids
    type: not_null
    nullable: false
    error_message: target_xref_uniprot_ids must emit a normalized pipe string or unknown sentinel
  - field: target_protein_synonyms
    type: not_null
    nullable: false
    error_message: target_protein_synonyms must emit a normalized pipe string or unknown sentinel
  - field: target_gene_synonyms
    type: not_null
    nullable: false
    error_message: target_gene_synonyms must emit a normalized pipe string or unknown sentinel
  - field: target_ec_numbers
    type: not_null
    nullable: false
    error_message: target_ec_numbers must emit a normalized pipe string or unknown sentinel
  entity_cross_field_validations:
  - name: target_identifiable
    fields:
    - target_id
    - pref_name
    condition: all_present
    error_message: Target must have ID and preferred name
  - name: component_ids_require_component_types
    fields:
    - component_ids
    - component_types
    condition: conditional_required
    trigger_field: component_ids
    required_field: component_types
    error_message: component_types must be populated when component_ids are present
  - name: component_ids_require_component_relationships
    fields:
    - component_ids
    - component_relationships
    condition: conditional_required
    trigger_field: component_ids
    required_field: component_relationships
    error_message: component_relationships must be populated when component_ids are present
  entity_conditional_validations: []
  key_nullability:
  - field: target_id
    key_type: merge
    nullable: false
  - field: target_type
    key_type: partition
    nullable: false
filters:
  version: 1.0.0
  provider: chembl
  entity: target
  input_filter:
    enabled: false
    source_path: data/input/target.csv
    column_name: target_chembl_id
    filter_field: target_id
    batch_size: 20
    checkpoint_interval: 1000
    fallback_column: title
  extraction_params:
    target_type: SINGLE PROTEIN
    organism__isnull: false
    tax_id__isnull: false
  source_profile:
    profile_id: chembl.target.curated
    version: 1.0.0
    status: baseline
    extraction_params_sha256: 6b7895f5aefb0891981a15b9a2eca407ef801bbd90c9360efccd68f9e1f0e097
    description: Baseline curated ChEMBL target extraction profile; no widening in ADR-050 cleanup.
  silver_filters:
    required_fields:
    - target_id
    - pref_name
    - organism
    - target_type
    - target_protein_synonyms
    - target_gene_synonyms
    - target_ec_numbers
    - target_xref_pdb_ids
    - target_xref_go_component
    - target_xref_go_function
    - target_xref_go_process
    - target_xref_hgnc_ids
    - target_xref_reactome_ids
    - target_xref_uniprot_ids
    exclude_if_present: []
  gold_filters:
    ranges: {}
    columns:
      target_type:
      - SINGLE PROTEIN
    list_lengths:
      component_accessions:
        min: 1
        max: 1
      component_ids:
        min: 1
    list_contains:
      component_types:
        values:
        - PROTEIN
        mode: all
    exclude_if_present: []
    required_fields:
    - pref_name
    - organism
  metadata:
    target_filter_policy:
      scope: source_specific
      description: SOURCE-SPECIFIC ChEMBL target filter policy. Silver and Gold filters intentionally constrain this
        pipeline to reviewed single-protein target records and do not apply publication-specific fields.




    # - This is pipeline scope, not global publication type truth.




contracts:
  primary_key:
  - target_id
  merge_keys:
  - target_id
  hash_include: []
  hash_exclude: []
  hash_datetime_policy: v2_datetime_utc
hash_policy:
  provider: chembl
  entity: target
  contract:
    version: 2.1.0
    migration_note: 'Standalone ChEMBL target hash excludes protein-classification summary fields; target_protein_classification/composite_target own that surface.'
  hash_policy:
    algorithm: sha256
    canonicalization: provider + canonical_json_dumps(normalized_record)
    include_fields:
    - target_id
    - target_type
    - pref_name
    - taxonomy_id
    - organism
    - organism_class
    - species_group_flag
    - target_description
    - target_protein_synonyms
    - target_gene_synonyms
    - target_ec_numbers
    - target_xref_pdb_ids
    - target_xref_go_component
    - target_xref_go_function
    - target_xref_go_process
    - target_xref_hgnc_ids
    - target_xref_reactome_ids
    - target_xref_uniprot_ids
    - primary_component_id
    - component_accessions
    - component_descriptions
    - component_ids
    - component_types
    - component_relationships
    - target_components
    - cross_references
    - target_component_synonyms
    exclude_fields:
    - _ingestion_ts
    - _run_id
    - _run_type
    - _dq_warn
    - _dq_error
    - _source_batch_id
    - _index
    exclude_patterns:
    - ^_dq_
    normalization:
      trim_strings: true
      round_floats:
        enabled: true
        precision: 10
      dates:
        enabled: true
        format: YYYY-MM-DD
      null_handling:
        nan_to_null: true
        inf_to_null: true
