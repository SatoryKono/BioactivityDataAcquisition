version: 1.0.0
provider: semanticscholar
entity: publication
pipeline:
  pipeline_name: semanticscholar_publication
  provider: semanticscholar
  entity_type: publication
  description: Batch DOI resolution via Semantic Scholar with title fallback
  loading_strategy: full_scan_only
  business_primary_keys:
  - paper_id
  sink:
    gold:
      mode: scd2
      scd_config:
        valid_from_col: _valid_from
        valid_to_col: _valid_to
        current_flag_col: _is_current
        version_col: _version
schema:
  column_groups:
  - name: system
    fields:
    - entity_id
    - content_hash
    - _run_id
    - _run_type
    - _source_batch_id
    - _source
    - _ingestion_ts
    - _index
    - _lookup_method
    - _original_id
  - name: identifiers
    fields:
    - paper_id
    - doi
    - pmid
    - corpus_id
    - dblp_id
  - name: title
    fields:
    - title
  - name: abstract
    fields:
    - abstract
    - tldr
  - name: authors
    fields:
    - author_s2_ids
    - author_orcids
    - author_h_indices
    - author_h_indices_raw_json
    - author_h_indices_canonical_json
  - name: affiliations
    fields:
    - affiliation_list
  - name: journal
    fields:
    - journal
  - name: year
    fields:
    - publication_year
  - name: dates
    fields:
    - publication_date
  - name: pagination
    fields:
    - volume
    - issue
    - page_first
    - page_last
    - page_range
  - name: citations
    fields:
    - citations_received
    - citations_made
    - influential_citation_count
    - citation_contexts
    - citation_contexts_raw_json
    - citation_contexts_canonical_json
  - name: subjects
    fields:
    - subject_fields
    - subject_fields_raw_json
    - subject_fields_canonical_json
    - publication_types
    - publication_types_raw_json
    - publication_types_canonical_json
  - name: doc_type
    fields:
    - publication_type
    - publication_type_unified
    - publication_subclass
    - publication_class
  - name: open_access
    fields:
    - is_oa
    - oa_status
    - open_access_url
  - name: dq
    pattern: ^_dq_
  field_aliases:
    affiliations: affiliation_list
    pages: page_range
    citation_count: citations_received
    reference_count: citations_made
    fields_of_study: subject_fields
  silver:
    include_groups:
    - system
    - identifiers
    - title
    - abstract
    - authors
    - affiliations
    - journal
    - year
    - dates
    - pagination
    - citations
    - subjects
    - doc_type
    - open_access
    - dq
  gold:
    include_groups:
    - system
    - identifiers
    - title
    - abstract
    - authors
    - journal
    - year
    - doc_type
    - citations
    - open_access
    - subjects
    exclude_fields:
    - _dq_*
    - _source_batch_id
    - _index
    - _lookup_method
    - _original_id
quality:
  version: 1.0.0
  provider: semanticscholar
  entity: publication
  entity_field_validations:
  - field: paper_id
    type: pattern
    pattern: ^[a-f0-9]{40}$
    nullable: false
    error_message: paper_id is required and must be a 40-char hex string
  - field: pmid
    type: range
    min: 1
    max: 10000000000
    nullable: true
    error_message: PubMed ID must be a positive integer
  - field: doi
    type: pattern
    pattern: ^10\.\d{4,}/\S+$
    nullable: true
    error_message: DOI must match format 10.XXXX/suffix (no whitespace)
  - field: title
    type: max_length
    max_length: 2000
    nullable: true
    error_message: Title must not exceed 2000 characters
  - field: title
    type: not_null
    nullable: true
    severity: warn
    error_message: "Missing title \u2014 record will be filtered before Gold"
  - field: title
    type: pattern
    pattern: \S
    nullable: true
    severity: warn
    error_message: Title should not be empty or whitespace-only
  - field: publication_year
    type: range
    min: 1950
    nullable: true
    severity: warn
    error_message: "Publication year before 1950 \u2014 will be filtered at Gold stage"
  - field: publication_type
    type: pattern
    pattern: ^[A-Za-z][A-Za-z0-9]*(\|[A-Za-z][A-Za-z0-9]*)*$
    nullable: true
    severity: warn
    error_message: Unexpected raw publication_type format
  - field: citations_received
    type: range
    min: 0
    max: 10000000
    nullable: true
    severity: warn
    error_message: Unusually high citation count
  - field: citations_made
    type: range
    min: 0
    nullable: true
    error_message: Reference count must be non-negative
  - field: influential_citation_count
    type: range
    min: 0
    nullable: true
    error_message: Influential citation count must be non-negative
  entity_cross_field_validations:
  - name: publication_identifiable
    fields:
    - paper_id
    - title
    condition: all_present
    error_message: Publication must have paper_id and title
  entity_conditional_validations:
  - name: journal_article_requires_title
    condition_field: publication_type_unified
    condition_value: Journal Article
    condition_operator: eq
    then_validations:
    - field: title
      type: not_null
      nullable: false
      error_message: Journal articles must have a title
  key_nullability:
  - field: paper_id
    key_type: merge
    nullable: false
filters:
  version: 1.0.0
  provider: semanticscholar
  entity: publication
  input_filter:
    enabled: true
    source_path: data/input/dois.csv
    column_name: doi
    filter_field: doi
    batch_size: 100
    fallback_column: title
  silver_filters:
    required_fields:
    - paper_id
    - title
  gold_filters:
    ranges:
      publication_year:
        min: 1950
        max: 2050
    required_fields:
    - paper_id
    - title
contracts:
  primary_key:
  - paper_id
  merge_keys:
  - paper_id
  hash_include: []
