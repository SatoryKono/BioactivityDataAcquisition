version: 1.0.0
provider: semanticscholar
entity: publication
pipeline:
  pipeline_name: semanticscholar_publication
  provider: semanticscholar
  entity_type: publication
  description: Batch DOI resolution via Semantic Scholar with title fallback
  loading_strategy: full_scan_only
  field_policy: {}
  business_primary_keys:
  - paper_id

  sink:
    silver:
      partition_by: []
    gold:
      mode: scd2
      idempotency_contract: scd2
      scd_config:
        valid_from_col: _valid_from
        valid_to_col: _valid_to
        current_flag_col: _is_current
        version_col: _version
  batch_size: 1000
  checkpoint_interval: 1000
schema:
  content_hash:
    include: []
    exclude: []
  column_groups:
  - name: system
    fields:
    - entity_id
    - content_hash
    - _run_id
    - _run_type
    - _source_batch_id
    - _source
    - _ingestion_ts
    - _index
    - _lookup_method
    - _original_id
  - name: identifiers
    fields:
    - paper_id
    - doi
    - pmid
    - corpus_id
    - dblp_id
  - name: title
    fields:
    - title
  - name: abstract
    fields:
    - abstract
    - tldr
  - name: authors
    fields:
    - author_s2_ids
    - author_orcids
    - author_h_indices
    - author_h_indices_canonical_json
    - author_h_indices_raw_json
  - name: affiliations
    fields:
    - affiliation_list
  - name: journal
    fields:
    - journal
    - issn
    - issn_list
  - name: year
    fields:
    - publication_year
  - name: dates
    fields:
    - publication_date
  - name: pagination
    fields:
    - volume
    - issue
    - page_first
    - page_last
    - page_range
  - name: citations
    fields:
    - citations_received
    - citations_made
    - influential_citation_count
    - citation_contexts
    - citation_contexts_canonical_json
    - citation_contexts_raw_json
  - name: subjects
    fields:
    - subject_fields
    - subject_fields_canonical_json
    - subject_fields_raw_json
    - publication_types
    - publication_types_canonical_json
    - publication_types_raw_json
  - name: doc_type
    fields:
    - publication_type
    - publication_type_unified
    - publication_subclass
    - publication_class
  - name: open_access
    fields:
    - is_oa
    - oa_status
    - open_access_url
  - name: dq
    pattern: ^_dq_
  silver:
    include_groups:
    - system
    - identifiers
    - title
    - abstract
    - authors
    - affiliations
    - journal
    - year
    - dates
    - pagination
    - citations
    - subjects
    - doc_type
    - open_access
    - dq
    exclude_fields: []
  gold:
    include_groups:
    - system
    - identifiers
    - title
    - abstract
    - authors
    - journal
    - year
    - doc_type
    - citations
    - open_access
    - subjects
    exclude_fields:
    - _dq_*
    - _source_batch_id
    - _index
    - _lookup_method
    - _original_id
quality:
  metadata:
    assay_parameter_type_policy:
      scope: raw_plus_canonical_controlled_vocabulary
      description: RAW-PLUS-CANONICAL ChEMBL assay-parameter typing policy. The pipeline preserves the provider-native 
        type lexeme in type_raw for reviewability while parameter_type stores the canonical controlled-vocabulary value 
        used by Silver/Gold semantics and DQ governance.
      field_semantics:
        type_raw: Preserve the raw/provider-native assay-parameter type token as trimmed text for review and drift 
          analysis.
        type: Published reviewed Silver alias for the canonical normalized assay-parameter type surface used by 
          downstream Silver/Gold consumers and governance reporting.
        parameter_type: Store the canonical assay-parameter type vocabulary value used for normalized Silver/Gold 
          behavior; unknown provider lexemes are preserved as reviewed uppercase canonical candidates rather than 
          rejected at profile time.
        standard_type: Store the canonical strict standard_type surface governed by the shared ChEMBL assay-parameter 
          universe and DQ policy.
    publication_type_policy:
      scope: source_specific
      description: SOURCE-SPECIFIC ChEMBL publication typing policy. This pipeline accepts only the reviewed 
        ChEMBL-native subset and maps it into the broader global publication taxonomy defined in 
        configs/enums/chembl.yaml without redefining that global cross-provider taxonomy.
      field_semantics:
        publication_type_raw: Preserve the raw/native ChEMBL publication type token for traceability and 
          provider-specific review.
        publication_type: Store the canonical publication type mapped into the global taxonomy for normalized 
          Silver/Gold behavior.
    # Source-specific DQ policy:
    # - publication_type uses a ChEMBL-only allowed subset and does not redefine
    #   the global taxonomy in configs/enums/chembl.yaml.
    # - publication_type_raw preserves the provider-native token for traceability.
    # - publication_type stores the canonical mapped type used by this pipeline.
    subcellular_fraction_policy:
      scope: raw_plus_canonical_derived_vocabulary
      description: RAW-PLUS-CANONICAL ChEMBL subcellular-fraction policy. The pipeline preserves the source lexeme in 
        subcellular_fraction_raw while subcellular_fraction stores the normalized derived vocabulary used by Silver/Gold
        contracts. Unknown source lexemes remain reviewable rather than being fail-closed into a strict enum.
      field_semantics:
        subcellular_fraction_raw: Preserve the raw/source ChEMBL subcellular-fraction label as trimmed text for 
          traceability and synonym review.
        subcellular_fraction: Store the canonical normalized subcellular-fraction label used for downstream Silver/Gold 
          semantics; unknown reviewed labels are preserved after canonical text normalization instead of being 
          discarded.
  version: 1.0.0
  provider: semanticscholar
  entity: publication
  entity_field_validations:
  - field: paper_id
    type: pattern
    pattern: ^[a-f0-9]{40}$
    nullable: false
    error_message: paper_id is required and must be a 40-char hex string
  - field: pmid
    type: pattern
    pattern: ^[1-9]\d{0,9}$
    nullable: true
    error_message: PubMed ID must be a canonical positive numeric string
  - field: doi
    type: pattern
    pattern: ^10\.\d{4,}/\S+$
    nullable: true
    error_message: DOI must match format 10.XXXX/suffix (no whitespace)
  - field: pmc_id
    type: pattern
    pattern: ^PMC\d+$
    nullable: true
    error_message: PMC identifier must match PMC format when present
  - field: title
    type: max_length
    max_length: 2000
    nullable: false
    error_message: Title must not exceed 2000 characters
  - field: title
    type: not_null
    nullable: false
    error_message: Missing title is not allowed for Semantic Scholar publication Gold records
  - field: title
    type: pattern
    pattern: \S
    nullable: false
    error_message: Title must not be empty or whitespace-only
  - field: publication_year
    type: range
    min: 1950
    nullable: true
    severity: warn
    error_message: "Publication year before 1950 — will be filtered at Gold stage"
  - field: publication_type
    type: pattern
    pattern: ^[A-Za-z][A-Za-z0-9]*(\|[A-Za-z][A-Za-z0-9]*)*$
    nullable: true
    severity: warn
    error_message: Unexpected raw publication_type format
  - field: publication_type_unified
    type: custom
    validator: validate_publication_type_unified_taxonomy
    nullable: true
    error_message: publication_type_unified must match the shared publication taxonomy
  - field: publication_subclass
    type: custom
    validator: validate_publication_subclass_taxonomy
    nullable: true
    error_message: publication_subclass must match the shared publication taxonomy
  - field: publication_class
    type: custom
    validator: validate_publication_class_taxonomy
    nullable: true
    error_message: publication_class must match the shared publication taxonomy
  - field: oa_status
    type: enum
    allowed_values:
    - gold
    - green
    - hybrid
    - bronze
    - closed
    nullable: true
    error_message: oa_status must match the shared publication open-access registry
  - field: author_s2_ids
    type: pattern
    pattern: '^\[("[0-9a-f]{40}"(,"[0-9a-f]{40}")*)?\]$'
    nullable: true
    severity: warn
    error_message: author_s2_ids must be a canonical JSON string array of Semantic Scholar author IDs
  - field: author_orcids
    type: pattern
    pattern: '^\[("\d{4}-\d{4}-\d{4}-[0-9X]"(,"\d{4}-\d{4}-\d{4}-[0-9X]")*)?\]$'
    nullable: true
    severity: warn
    error_message: author_orcids must be a canonical JSON string array of ORCID identifiers
  - field: issn_list
    type: pattern
    pattern: '^\[("[0-9Xx-]+"(,"[0-9Xx-]+")*)?\]$'
    nullable: true
    severity: warn
    error_message: issn_list must be a canonical JSON string array of ISSN values
  - field: citations_received
    type: range
    min: 0
    max: 10000000
    nullable: true
    severity: warn
    error_message: Unusually high citation count
  - field: citations_made
    type: range
    min: 0
    nullable: true
    error_message: Reference count must be non-negative
  - field: influential_citation_count
    type: range
    min: 0
    nullable: true
    error_message: Influential citation count must be non-negative
  entity_cross_field_validations:
  - name: publication_identifiable
    fields:
    - paper_id
    - title
    condition: all_present
    error_message: Publication must have paper_id and title
  entity_conditional_validations:
  - name: journal_article_requires_title
    condition_field: publication_type_unified
    condition_value: Journal Article
    condition_operator: eq
    then_validations:
    - field: title
      type: not_null
      nullable: false
      error_message: Journal articles must have a title
  key_nullability:
  - field: paper_id
    key_type: merge
    nullable: false
filters:
  version: 1.0.0
  provider: semanticscholar
  entity: publication
  input_filter:
    enabled: true
    source_path: data/input/dois.csv
    column_name: doi
    filter_field: doi
    batch_size: 100
    fallback_column: title
    checkpoint_interval: 1000
  extraction_params: {}
  silver_filters:
    exclude_if_present: []
    required_fields:
    - paper_id
    - title
  gold_filters:
    list_contains: {}
    list_lengths: {}
    ranges:
      publication_year:
        min: 1950
        max: 2050
    required_fields:
    - paper_id
    - title
    columns: {}
    exclude_if_present: []
  metadata:
    publication_filter_policy:
      scope: source_specific
      description: SOURCE-SPECIFIC ChEMBL publication filter policy. Silver and Gold filters intentionally constrain 
        this pipeline to the reviewed ChEMBL publication subset and do not redefine the global publication taxonomy.
    # Source-specific filter policy:
    # - Silver and Gold are intentionally scoped to journal-article for the
    #   current ChEMBL publication pipeline.
    # - This is pipeline scope, not global publication type truth.
contracts:
  primary_key:
  - paper_id
  merge_keys:
  - paper_id
  hash_include: []
  hash_exclude: []
  hash_datetime_policy: v2_datetime_utc
hash_policy:
  provider: semanticscholar
  entity: publication
  contract:
    version: 1.0.0
    migration_note: Explicit config-level hash contract aligned with normalization profile semanticscholar.publication.
  hash_policy:
    algorithm: sha256
    canonicalization: provider + canonical_json_dumps(normalized_record)
    include_fields:
    - abstract
    - affiliation_list
    - author_h_indices
    - author_h_indices_canonical_json
    - author_h_indices_raw_json
    - author_keys
    - author_orcids
    - author_s2_ids
    - authors
    - citation_contexts
    - citation_contexts_canonical_json
    - citation_contexts_raw_json
    - citations_made
    - citations_received
    - corpus_id
    - dblp_id
    - doi
    - influential_citation_count
    - is_oa
    - issn
    - issn_list
    - issue
    - journal
    - language
    - oa_status
    - open_access_url
    - page_first
    - page_last
    - page_range
    - paper_id
    - pmc_id
    - pmid
    - publication_class
    - publication_date
    - publication_doi
    - publication_pmc_id
    - publication_pmid
    - publication_subclass
    - publication_type
    - publication_type_unified
    - publication_types
    - publication_types_canonical_json
    - publication_year
    - subject_fields
    - subject_fields_canonical_json
    - title
    - tldr
    - volume
    exclude_fields:
    - _dq_error
    - _dq_warn
    - _index
    - _ingestion_ts
    - _lookup_method
    - _original_id
    - _run_id
    - _run_type
    - _source
    - _source_batch_id
    - publication_types_raw_json
    - subject_fields_raw_json
    exclude_patterns:
    - ^_dq_
    normalization:
      trim_strings: true
      round_floats:
        enabled: true
        precision: 10
      dates:
        enabled: true
        format: YYYY-MM-DD
      null_handling:
        nan_to_null: true
        inf_to_null: true
