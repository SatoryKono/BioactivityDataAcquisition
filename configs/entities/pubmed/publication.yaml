version: 1.0.0
provider: pubmed
entity: publication
pipeline:
  pipeline_name: pubmed_publication
  provider: pubmed
  entity_type: publication
  description: Extract publication metadata from PubMed via Entrez API
  loading_strategy: full_scan_only
  field_policy: {}
  business_primary_keys:
  - pmid
  sink:
    bronze:
      save_json: true
      save_metadata: true
    silver:
      partition_by: []
    gold:
      mode: scd2
      idempotency_contract: scd2
      scd_config:
        valid_from_col: _valid_from
        valid_to_col: _valid_to
        current_flag_col: _is_current
        version_col: _version
  batch_size: 1000
  checkpoint_interval: 1000
schema:
  content_hash:
    include: []
    exclude: []
  column_groups:
  - name: system
    fields:
    - entity_id
    - content_hash
    - _run_id
    - _run_type
    - _source_batch_id
    - _source
    - _ingestion_ts
    - _index
    - _lookup_method
    - _original_id
  - name: identifiers
    fields:
    - pmid
    - pmc_id
    - doi
    - nlm_unique_id
  - name: title
    fields:
    - title
  - name: abstract
    fields:
    - abstract
    - abstract_structured
  - name: authors
    fields:
    - authors
    - author_count
    - authors_with_affiliations
    - authors_with_affiliations_canonical_json
    - authors_with_affiliations_raw_json
  - name: affiliations
    fields:
    - affiliation_list
    - affiliation_structured
    - affiliation_structured_canonical_json
    - affiliation_structured_raw_json
  - name: journal
    fields:
    - journal
    - journal_name
    - journal_name_short
    - journal_iso_abbrev
    - issn
    - issn_list
    - journal_issn_type
  - name: year
    fields:
    - publication_year
  - name: dates
    fields:
    - publication_date
    - pub_date
    - pub_day
    - pub_month
    - date_completed
    - date_revised
  - name: pagination
    fields:
    - volume
    - issue
    - page_first
    - page_last
    - page_range
    - medline_pgn
  - name: citations
    fields:
    - citations_made
    - citation_subset
  - name: subjects
    fields:
    - subject_mesh
    - mesh_heading_count
    - subject_keywords
    - keyword_count
    - publication_types
  - name: funding
    fields:
    - grant_count
  - name: chemicals
    fields:
    - chemical_count
  - name: doc_type
    fields:
    - publication_type
    - publication_type_unified
    - publication_subclass
    - publication_class
  - name: language
    fields:
    - language
  - name: misc
    fields:
    - country
    - publication_status
  - name: dq
    pattern: ^_dq_
  field_aliases:
    affiliations: affiliation_list
    structured_affiliations: affiliation_structured
    journal_title: journal_name
    journal_abbrev: journal_name_short
    pages: page_range
    reference_count: citations_made
    mesh_terms: subject_mesh
    keywords: subject_keywords
    citation_count: citations_received
    source_type: publication_type
    fields_of_study: subject_fields
    short_container_title: journal_name_short
    subjects: subject_keywords
    topics: subject_topics
  silver:
    include_groups:
    - system
    - identifiers
    - title
    - abstract
    - authors
    - affiliations
    - journal
    - year
    - dates
    - pagination
    - citations
    - subjects
    - funding
    - chemicals
    - doc_type
    - language
    - misc
    - dq
    exclude_fields: []
    alias_policy: preserve
  gold:
    include_groups:
    - system
    - identifiers
    - title
    - abstract
    - authors
    - affiliations
    - journal
    - year
    - subjects
    exclude_fields:
    - _dq_*
    - _source_batch_id
    - _index
    - _lookup_method
    - _original_id
    alias_policy: canonical
quality:
  metadata:
    assay_parameter_type_policy:
      scope: raw_plus_canonical_controlled_vocabulary
      description: RAW-PLUS-CANONICAL ChEMBL assay-parameter typing policy. The pipeline preserves the provider-native 
        type lexeme in type_raw for reviewability while parameter_type stores the canonical controlled-vocabulary value 
        used by Silver/Gold semantics and DQ governance.
      field_semantics:
        type_raw: Preserve the raw/provider-native assay-parameter type token as trimmed text for review and drift 
          analysis.
        type: Published reviewed Silver alias for the canonical normalized assay-parameter type surface used by 
          downstream Silver/Gold consumers and governance reporting.
        parameter_type: Store the canonical assay-parameter type vocabulary value used for normalized Silver/Gold 
          behavior; unknown provider lexemes are preserved as reviewed uppercase canonical candidates rather than 
          rejected at profile time.
        standard_type: Store the canonical strict standard_type surface governed by the shared ChEMBL assay-parameter 
          universe and DQ policy.
    publication_type_policy:
      scope: source_specific
      description: SOURCE-SPECIFIC ChEMBL publication typing policy. This pipeline accepts only the reviewed 
        ChEMBL-native subset and maps it into the broader global publication taxonomy defined in 
        configs/enums/chembl.yaml without redefining that global cross-provider taxonomy.
      field_semantics:
        publication_type_raw: Preserve the raw/native ChEMBL publication type token for traceability and 
          provider-specific review.
        publication_type: Store the canonical publication type mapped into the global taxonomy for normalized 
          Silver/Gold behavior.
    # Source-specific DQ policy:
    # - publication_type uses a ChEMBL-only allowed subset and does not redefine
    #   the global taxonomy in configs/enums/chembl.yaml.
    # - publication_type_raw preserves the provider-native token for traceability.
    # - publication_type stores the canonical mapped type used by this pipeline.
    subcellular_fraction_policy:
      scope: raw_plus_canonical_derived_vocabulary
      description: RAW-PLUS-CANONICAL ChEMBL subcellular-fraction policy. The pipeline preserves the source lexeme in 
        subcellular_fraction_raw while subcellular_fraction stores the normalized derived vocabulary used by Silver/Gold
        contracts. Unknown source lexemes remain reviewable rather than being fail-closed into a strict enum.
      field_semantics:
        subcellular_fraction_raw: Preserve the raw/source ChEMBL subcellular-fraction label as trimmed text for 
          traceability and synonym review.
        subcellular_fraction: Store the canonical normalized subcellular-fraction label used for downstream Silver/Gold 
          semantics; unknown reviewed labels are preserved after canonical text normalization instead of being 
          discarded.
  version: 1.0.0
  provider: pubmed
  entity: publication
  entity_field_validations:
  - field: pmid
    type: pattern
    pattern: ^[1-9]\d{0,9}$
    nullable: false
    error_message: PMID is required and must be a canonical positive numeric string
  - field: title
    type: max_length
    max_length: 2000
    nullable: false
    error_message: Title must not exceed 2000 characters
  - field: title
    type: not_null
    nullable: false
    error_message: Missing title is not allowed for PubMed publication Gold records
  - field: title
    type: pattern
    pattern: \S
    nullable: false
    error_message: Title must not be empty or whitespace-only
  - field: doi
    type: pattern
    pattern: ^10\.\d{4,}/\S+$
    nullable: true
    error_message: DOI must match format 10.XXXX/suffix (no whitespace)
  - field: pmc_id
    type: pattern
    pattern: ^PMC\d+$
    nullable: true
    error_message: PMC identifier must match PMC format when present
  - field: publication_year
    type: range
    min: 1950
    nullable: true
    severity: warn
    error_message: "Publication year before 1950 — will be filtered at Gold stage"
  - field: publication_type
    type: pattern
    pattern: \S
    nullable: true
  - field: publication_type_unified
    type: custom
    validator: validate_publication_type_unified_taxonomy
    nullable: true
    error_message: publication_type_unified must match the shared publication taxonomy
  - field: publication_subclass
    type: custom
    validator: validate_publication_subclass_taxonomy
    nullable: true
    error_message: publication_subclass must match the shared publication taxonomy
  - field: publication_class
    type: custom
    validator: validate_publication_class_taxonomy
    nullable: true
    error_message: publication_class must match the shared publication taxonomy
  - field: author_orcids
    type: pattern
    pattern: '^\[("\d{4}-\d{4}-\d{4}-[0-9X]"(,"\d{4}-\d{4}-\d{4}-[0-9X]")*)?\]$'
    nullable: true
    severity: warn
    error_message: author_orcids must be a canonical JSON string array of ORCID identifiers
  - field: issn_list
    type: pattern
    pattern: '^\[("[0-9Xx-]+"(,"[0-9Xx-]+")*)?\]$'
    nullable: true
    severity: warn
    error_message: issn_list must be a canonical JSON string array of ISSN values
  - field: publication_status
    type: enum
    allowed_values:
    - ppublish
    - epublish
    - aheadofprint
    nullable: true
    error_message: publication_status must match the governed PubMed lifecycle vocabulary
  - field: citations_received
    type: range
    min: 0
    nullable: true
    error_message: Citation count must be non-negative
  - field: citations_received
    type: range
    min: 0
    max: 10000000
    nullable: true
    severity: warn
    error_message: Unusually high citation count
  - field: citations_made
    type: range
    min: 0
    nullable: true
    error_message: Reference count must be non-negative
  entity_cross_field_validations:
  - name: publication_identifiable
    fields:
    - pmid
    - title
    condition: all_present
    error_message: Publication must have PMID and title
  - name: has_identifier
    fields:
    - pmid
    - doi
    - pmc_id
    condition: any_present
    error_message: At least one identifier required
  entity_conditional_validations: []
  key_nullability:
  - field: pmid
    key_type: merge
    nullable: false
filters:
  version: 1.0.0
  provider: pubmed
  entity: publication
  input_filter:
    enabled: true
    source_path: data/input/pubmed.csv
    column_name: pubmed_id
    filter_field: pmid
    batch_size: 100
    fallback_column: title
    checkpoint_interval: 1000
  extraction_params: {}
  silver_filters:
    ranges:
      publication_year:
        min: 1950
        max: 2050
    columns: {}
    exclude_if_present: []
    required_fields:
    - pmid
    - title
  gold_filters:
    list_contains: {}
    list_lengths: {}
    ranges: {}
    required_fields:
    - pmid
    - title
    columns: {}
    exclude_if_present: []
  metadata:
    publication_filter_policy:
      scope: source_specific
      description: SOURCE-SPECIFIC ChEMBL publication filter policy. Silver and Gold filters intentionally constrain 
        this pipeline to the reviewed ChEMBL publication subset and do not redefine the global publication taxonomy.
    # Source-specific filter policy:
    # - Silver and Gold are intentionally scoped to journal-article for the
    #   current ChEMBL publication pipeline.
    # - This is pipeline scope, not global publication type truth.
contracts:
  primary_key:
  - pmid
  merge_keys:
  - pmid
  hash_include: []
  hash_exclude: []
  hash_datetime_policy: v1_date
