version: 1.0.0
provider: pubmed
entity: publication
pipeline:
  pipeline_name: pubmed_publication
  provider: pubmed
  entity_type: publication
  description: Extract publication metadata from PubMed via Entrez API
  loading_strategy: full_scan_only
  business_primary_keys:
  - pmid
  source:
    email: ${BIOETL_PUBMED_EMAIL}
    api_key: ${BIOETL_PUBMED_API_KEY}

  sink:
    gold:
      mode: scd2
      scd_config:
        valid_from_col: _valid_from
        valid_to_col: _valid_to
        current_flag_col: _is_current
        version_col: _version
schema:
  column_groups:
  - name: system
    fields:
    - entity_id
    - content_hash
    - _run_id
    - _run_type
    - _source_batch_id
    - _source
    - _ingestion_ts
    - _index
    - _lookup_method
    - _original_id
  - name: identifiers
    fields:
    - pmid
    - pmc_id
    - doi
    - nlm_unique_id
  - name: title
    fields:
    - title
  - name: abstract
    fields:
    - abstract
    - abstract_structured
  - name: authors
    fields:
    - authors
    - author_count
    - authors_with_affiliations
    - authors_with_affiliations_canonical_json
    - authors_with_affiliations_raw_json
  - name: affiliations
    fields:
    - affiliation_list
    - affiliation_structured
    - affiliation_structured_canonical_json
    - affiliation_structured_raw_json
  - name: journal
    fields:
    - journal
    - journal_name
    - journal_name_short
    - journal_iso_abbrev
    - issn
    - issn_list
    - journal_issn_type
  - name: year
    fields:
    - publication_year
  - name: dates
    fields:
    - publication_date
    - pub_date
    - pub_day
    - pub_month
    - date_completed
    - date_revised
  - name: pagination
    fields:
    - volume
    - issue
    - page_first
    - page_last
    - page_range
    - medline_pgn
  - name: citations
    fields:
    - citations_made
    - citation_subset
  - name: subjects
    fields:
    - subject_mesh
    - mesh_heading_count
    - subject_keywords
    - keyword_count
    - publication_types
  - name: funding
    fields:
    - grant_count
  - name: chemicals
    fields:
    - chemical_count
  - name: doc_type
    fields:
    - publication_type
    - publication_type_unified
    - publication_subclass
    - publication_class
  - name: language
    fields:
    - language
  - name: misc
    fields:
    - country
    - publication_status
  - name: dq
    pattern: ^_dq_
  field_aliases:
    affiliations: affiliation_list
    structured_affiliations: affiliation_structured
    journal_title: journal_name
    journal_abbrev: journal_name_short
    pages: page_range
    reference_count: citations_made
    mesh_terms: subject_mesh
    keywords: subject_keywords
  silver:
    include_groups:
    - system
    - identifiers
    - title
    - abstract
    - authors
    - affiliations
    - journal
    - year
    - dates
    - pagination
    - citations
    - subjects
    - funding
    - chemicals
    - doc_type
    - language
    - misc
    - dq
  gold:
    include_groups:
    - system
    - identifiers
    - title
    - abstract
    - authors
    - affiliations
    - journal
    - year
    - subjects
    exclude_fields:
    - _dq_*
    - _source_batch_id
    - _index
    - _lookup_method
    - _original_id
quality:
  version: 1.0.0
  provider: pubmed
  entity: publication
  entity_field_validations:
  - field: pmid
    type: pattern
    pattern: ^[1-9]\d{0,9}$
    nullable: false
    error_message: PMID is required and must be a canonical positive numeric string
  - field: title
    type: max_length
    max_length: 2000
    nullable: true
    error_message: Title must not exceed 2000 characters
  - field: title
    type: not_null
    nullable: true
    severity: warn
    error_message: "Missing title \u2014 record will be filtered before Gold"
  - field: title
    type: pattern
    pattern: \S
    nullable: true
    severity: warn
    error_message: Title should not be empty or whitespace-only
  - field: doi
    type: pattern
    pattern: ^10\.\d{4,}/\S+$
    nullable: true
    error_message: DOI must match format 10.XXXX/suffix (no whitespace)
  - field: publication_year
    type: range
    min: 1950
    nullable: true
    severity: warn
    error_message: "Publication year before 1950 \u2014 will be filtered at Gold stage"
  - field: publication_type
    type: pattern
    pattern: \S
    nullable: true
  - field: publication_status
    type: enum
    allowed_values:
    - ppublish
    - epublish
    - aheadofprint
    nullable: true
    error_message: publication_status must match the governed PubMed lifecycle vocabulary
  - field: citations_received
    type: range
    min: 0
    nullable: true
    error_message: Citation count must be non-negative
  - field: citations_received
    type: range
    min: 0
    max: 10000000
    nullable: true
    severity: warn
    error_message: Unusually high citation count
  - field: citations_made
    type: range
    min: 0
    nullable: true
    error_message: Reference count must be non-negative
  entity_cross_field_validations:
  - name: publication_identifiable
    fields:
    - pmid
    - title
    condition: all_present
    error_message: Publication must have PMID and title
  - name: has_identifier
    fields:
    - pmid
    - doi
    - pmc_id
    condition: any_present
    error_message: At least one identifier required
  entity_conditional_validations: []
  key_nullability:
  - field: pmid
    key_type: merge
    nullable: false
filters:
  version: 1.0.0
  provider: pubmed
  entity: publication
  input_filter:
    enabled: true
    source_path: data/input/pubmed.csv
    column_name: pubmed_id
    filter_field: pmid
    batch_size: 100
    fallback_column: title
  silver_filters:
    required_fields:
    - pmid
    - title
  gold_filters:
    ranges:
      publication_year:
        min: 1950
        max: 2050
    required_fields:
    - pmid
    - title
    columns: {}
contracts:
  primary_key:
  - pmid
  merge_keys:
  - pmid
  hash_include: []
