# Composite Target Entity Configuration
# Generated: 2026-04-24
# Status: active

version: 1.0.0
provider: composite
entity: target

# Compatibility shim for generic unified-config validators.
# Active composite runtime uses configs/composites/*.yaml instead.
pipeline:
  provider: composite
  entity_type: target
  pipeline_name: composite_target
  business_primary_keys:
    - composite_target_id

schema:
  compatibility_mode: legacy_composite_entity_stub
  column_groups:
    - name: system
      fields:
        - entity_id
        - content_hash
        - _run_id
        - _run_type
        - _source_batch_id
        - _source
        - _ingestion_ts
        - _index
        - _lookup_method
        - _original_id
    - name: business
      fields:
        - composite_target_id
        - source_priority
  silver:
    include_groups:
      - system
      - business
  gold:
    include_groups:
      - system
      - business

filters:
  compatibility_mode: legacy_composite_entity_stub

contracts:
  compatibility_mode: legacy_composite_entity_stub

# Composite target entity configuration
# This config defines how target data from multiple sources are combined

status: active

# Source entities that contribute to this composite
source_entities:
  - provider: chembl
    entity: target
  - provider: uniprot
    entity: protein

# Composite-specific fields
composite_fields:
  - name: composite_target_id
    type: string
    description: Unique identifier for the composite target
    primary_key: true
  - name: source_priority
    type: list
    description: Priority order of source providers
    default: [chembl, uniprot]

# Quality control settings
quality:
  validation_level: strict
  required_fields:
    - composite_target_id
    - target_name
    - organism

# Loading strategy
loading:
  strategy: incremental
  batch_size: 200

# Field mapping and resolution rules
field_resolution:
  target_name:
    strategy: priority
    sources: [chembl, uniprot]

  organism:
    strategy: priority
    sources: [chembl, uniprot]

  target_type:
    strategy: priority
    sources: [chembl, uniprot]

# DQ rules for composite entity
dq_rules:
  - field: composite_target_id
    rule: not_null
    severity: critical

  - field: target_name
    rule: not_null
    severity: high

  - field: organism
    rule: not_null
    severity: medium
