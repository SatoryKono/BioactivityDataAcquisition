# Composite Target Entity Configuration
# Generated: 2026-04-24
# Status: active

version: 1.0.0
provider: composite
entity: target

# Composite target entity configuration
# This config defines how target data from multiple sources are combined

status: active

# Source entities that contribute to this composite
source_entities:
  - provider: chembl
    entity: target
  - provider: uniprot
    entity: protein

# Composite-specific fields
composite_fields:
  - name: composite_target_id
    type: string
    description: Unique identifier for the composite target
    primary_key: true
  - name: source_priority
    type: list
    description: Priority order of source providers
    default: [chembl, uniprot]

# Quality control settings
quality:
  validation_level: strict
  required_fields:
    - composite_target_id
    - target_name
    - organism
  
# Loading strategy
loading:
  strategy: incremental
  batch_size: 200
  
# Field mapping and resolution rules
field_resolution:
  target_name:
    strategy: priority
    sources: [chembl, uniprot]
    
  organism:
    strategy: priority
    sources: [chembl, uniprot]
    
  target_type:
    strategy: priority
    sources: [chembl, uniprot]

# DQ rules for composite entity
dq_rules:
  - field: composite_target_id
    rule: not_null
    severity: critical
  
  - field: target_name
    rule: not_null
    severity: high
    
  - field: organism
    rule: not_null
    severity: medium