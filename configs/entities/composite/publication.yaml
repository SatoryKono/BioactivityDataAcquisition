# Composite Publication Entity Configuration
# Generated: 2026-04-24
# Status: active

version: 1.0.0
provider: composite
entity: publication

# Compatibility shim for generic unified-config validators.
# Active composite runtime uses configs/composites/*.yaml instead.
pipeline:
  provider: composite
  entity_type: publication
  pipeline_name: composite_publication
  loading_strategy: full_scan_only
  business_primary_keys:
    - composite_id
  sink:
    gold:
      mode: scd2
      scd_config:
        valid_from_col: _valid_from
        valid_to_col: _valid_to
        current_flag_col: _is_current
        version_col: _version

schema:
  compatibility_mode: legacy_composite_entity_stub
  column_groups:
    - name: system
      fields:
        - entity_id
        - content_hash
        - _run_id
        - _run_type
        - _source_batch_id
        - _source
        - _ingestion_ts
        - _index
        - _lookup_method
        - _original_id
    - name: business
      fields:
        - composite_id
        - source_priority
  silver:
    include_groups:
      - system
      - business
  gold:
    include_groups:
      - system
      - business

filters:
  compatibility_mode: legacy_composite_entity_stub

contracts:
  compatibility_mode: legacy_composite_entity_stub

# Composite publication entity configuration
# This config defines how publications from multiple sources are combined

status: active

# Source entities that contribute to this composite
source_entities:
  - provider: chembl
    entity: publication
  - provider: pubmed
    entity: publication
  - provider: openalex
    entity: publication
  - provider: semanticscholar
    entity: publication

# Composite-specific fields
composite_fields:
  - name: composite_id
    type: string
    description: Unique identifier for the composite publication
    primary_key: true
  - name: source_priority
    type: list
    description: Priority order of source providers
    default: [pubmed, chembl, openalex, semanticscholar]

# Quality control settings
quality:
  validation_level: strict
  required_fields:
    - composite_id
    - title
    - publication_date
  
# Loading strategy
loading:
  strategy: full_scan_only
  batch_size: 1000
  
# Field mapping and resolution rules
field_resolution:
  title:
    strategy: priority
    sources: [pubmed, chembl, openalex, semanticscholar]
  
  abstract:
    strategy: priority
    sources: [pubmed, openalex, chembl]
    
  publication_date:
    strategy: earliest
    
  authors:
    strategy: merge_unique

# DQ rules for composite entity
dq_rules:
  - field: composite_id
    rule: not_null
    severity: critical
  
  - field: title
    rule: not_null
    severity: high
    
  - field: publication_date
    rule: valid_date
    severity: medium
