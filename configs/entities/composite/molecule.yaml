# Composite Molecule Entity Configuration
# Generated: 2026-04-24
# Status: active

version: 1.0.0
provider: composite
entity: molecule

# Compatibility shim for generic unified-config validators.
# Active composite runtime uses configs/composites/*.yaml instead.
pipeline:
  provider: composite
  entity_type: molecule
  pipeline_name: composite_molecule
  business_primary_keys:
    - composite_molecule_id

schema:
  compatibility_mode: legacy_composite_entity_stub
  column_groups:
    - name: system
      fields:
        - entity_id
        - content_hash
        - _run_id
        - _run_type
        - _source_batch_id
        - _source
        - _ingestion_ts
        - _index
        - _lookup_method
        - _original_id
    - name: business
      fields:
        - composite_molecule_id
        - source_priority
  silver:
    include_groups:
      - system
      - business
  gold:
    include_groups:
      - system
      - business

filters:
  compatibility_mode: legacy_composite_entity_stub

contracts:
  compatibility_mode: legacy_composite_entity_stub

# Composite molecule entity configuration
# This config defines how molecule data from multiple sources are combined

status: active

# Source entities that contribute to this composite
source_entities:
  - provider: chembl
    entity: molecule
  - provider: pubchem
    entity: compound

# Composite-specific fields
composite_fields:
  - name: composite_molecule_id
    type: string
    description: Unique identifier for the composite molecule
    primary_key: true
  - name: source_priority
    type: list
    description: Priority order of source providers
    default: [chembl, pubchem]

# Quality control settings
quality:
  validation_level: strict
  required_fields:
    - composite_molecule_id
    - smiles
    - molecular_weight

# Loading strategy
loading:
  strategy: incremental
  batch_size: 500

# Field mapping and resolution rules
field_resolution:
  smiles:
    strategy: priority
    sources: [chembl, pubchem]

  molecular_weight:
    strategy: average

  iupac_name:
    strategy: priority
    sources: [chembl, pubchem]

# DQ rules for composite entity
dq_rules:
  - field: composite_molecule_id
    rule: not_null
    severity: critical

  - field: smiles
    rule: valid_smiles
    severity: critical

  - field: molecular_weight
    rule: range
    min: 10
    max: 5000
    severity: high
