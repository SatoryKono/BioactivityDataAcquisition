# Composite Assay Entity Configuration
# Generated: 2026-04-24
# Status: active

version: 1.0.0
provider: composite
entity: assay

# Compatibility shim for generic unified-config validators.
# Active composite runtime uses configs/composites/*.yaml instead.
pipeline:
  provider: composite
  entity_type: assay
  pipeline_name: composite_assay

schema:
  compatibility_mode: legacy_composite_entity_stub
  column_groups:
    - name: system
      fields:
        - entity_id
        - content_hash
        - _run_id
        - _run_type
        - _source_batch_id
        - _source
        - _ingestion_ts
        - _index
        - _lookup_method
        - _original_id
    - name: business
      fields:
        - composite_assay_id
        - source_priority
  silver:
    include_groups:
      - system
      - business
  gold:
    include_groups:
      - system
      - business

filters:
  compatibility_mode: legacy_composite_entity_stub

contracts:
  compatibility_mode: legacy_composite_entity_stub

# Composite assay entity configuration
# This config defines how assay data from multiple sources are combined

status: active

# Source entities that contribute to this composite
source_entities:
  - provider: chembl
    entity: assay

# Composite-specific fields
composite_fields:
  - name: composite_assay_id
    type: string
    description: Unique identifier for the composite assay
    primary_key: true
  - name: source_priority
    type: list
    description: Priority order of source providers
    default: [chembl]

# Quality control settings
quality:
  validation_level: strict
  required_fields:
    - composite_assay_id
    - assay_name
    - assay_type
    - target_id
  
# Loading strategy
loading:
  strategy: incremental
  batch_size: 500
  
# Field mapping and resolution rules
field_resolution:
  assay_name:
    strategy: priority
    sources: [chembl]
    
  assay_type:
    strategy: priority
    sources: [chembl]
    
  assay_description:
    strategy: priority
    sources: [chembl]

# DQ rules for composite entity
dq_rules:
  - field: composite_assay_id
    rule: not_null
    severity: critical
  
  - field: assay_name
    rule: not_null
    severity: high
    
  - field: assay_type
    rule: not_null
    severity: medium
    
  - field: target_id
    rule: not_null
    severity: high
