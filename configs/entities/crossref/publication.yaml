version: 1.0.0
provider: crossref
entity: publication
pipeline:
  pipeline_name: crossref_publication
  provider: crossref
  entity_type: publication
  description: Enrich publication records with CrossRef metadata via DOI resolution
  loading_strategy: full_scan_only
  business_primary_keys:
  - doi
  sink:
    gold:
      mode: scd2
      scd_config:
        valid_from_col: _valid_from
        valid_to_col: _valid_to
        current_flag_col: _is_current
        version_col: _version
schema:
  column_groups:
  - name: system
    fields:
    - entity_id
    - content_hash
    - _run_id
    - _run_type
    - _source_batch_id
    - _source
    - _ingestion_ts
    - _index
    - _lookup_method
    - _original_id
  - name: identifiers
    fields:
    - publication_doi
    - alternative_id
  - name: title
    fields:
    - title
  - name: authors
    fields:
    - authors
  - name: journal
    fields:
    - journal
    - journal_name_short
  - name: issn
    fields:
    - issn
    - issn_list
    - issn_print
    - issn_electronic
  - name: year
    fields:
    - publication_year
  - name: dates
    fields:
    - publication_date
    - published
    - published_online
    - published_print
  - name: pagination
    fields:
    - volume
    - issue
    - page_first
    - page_last
  - name: citations
    fields:
    - citations_received
    - citations_made
  - name: subjects
    fields:
    - subject_keywords
  - name: language
    fields:
    - language
  - name: publisher
    fields:
    - publisher
  - name: doc_type
    fields:
    - publication_type
    - publication_type_unified
    - publication_subclass
    - publication_class
  - name: content_domain
    fields:
    - content_domain_domains
    - content_domain_crossmark_restriction
  - name: license
    fields:
    - license_url
  - name: dq
    pattern: ^_dq_
  field_aliases:
    short_container_title: journal_name_short
    citation_count: citations_received
    reference_count: citations_made
    subjects: subject_keywords
    source_type: publication_type
  silver:
    include_groups:
    - system
    - identifiers
    - title
    - authors
    - journal
    - issn
    - year
    - dates
    - pagination
    - citations
    - subjects
    - language
    - publisher
    - doc_type
    - content_domain
    - license
    - dq
  gold:
    include_groups:
    - system
    - identifiers
    - title
    - authors
    - journal
    - year
    - pagination
    - citations
    - publisher
    - doc_type
    exclude_fields:
    - _dq_*
    - _source_batch_id
    - _index
    - _lookup_method
    - _original_id
quality:
  version: 1.0.0
  provider: crossref
  entity: publication
  entity_field_validations:
  - field: doi
    type: pattern
    pattern: ^10\.\d{4,}/\S+$
    nullable: false
    error_message: DOI is required and must match format 10.XXXX/suffix (no whitespace)
  - field: title
    type: max_length
    max_length: 2000
    nullable: true
    error_message: Title must not exceed 2000 characters
  - field: title
    type: not_null
    nullable: true
    severity: warn
    error_message: "Missing title \u2014 record will be filtered before Gold"
  - field: title
    type: pattern
    pattern: \S
    nullable: true
    severity: warn
    error_message: Title should not be empty or whitespace-only
  - field: publication_year
    type: range
    min: 1950
    nullable: true
    severity: warn
    error_message: "Publication year before 1950 \u2014 will be filtered at Gold stage"
  - field: publication_type
    type: enum
    allowed:
    - peer-review
    - journal-article
    - proceedings-article
    - posted-content
    - dataset
    - database
    - dissertation
    - report
    - report-component
    - component
    - book
    - book-chapter
    - book-section
    - book-part
    - book-track
    - book-set
    - book-series
    - edited-book
    - reference-book
    - monograph
    - reference-entry
    - standard
    - journal
    - journal-issue
    - journal-volume
    - proceedings
    - proceedings-series
    - report-series
    - grant
    - other
    nullable: true
  - field: citations_received
    type: range
    min: 0
    nullable: true
    error_message: Citation count must be non-negative
  - field: citations_received
    type: range
    min: 0
    max: 10000000
    nullable: true
    severity: warn
    error_message: Unusually high citation count
  - field: citations_made
    type: range
    min: 0
    nullable: true
    error_message: Reference count must be non-negative
  entity_cross_field_validations:
  - name: publication_identifiable
    fields:
    - doi
    - title
    condition: all_present
    error_message: Publication must have DOI and title
  entity_conditional_validations:
  - name: article_requires_title
    condition_field: publication_type
    condition_value:
    - journal-article
    - proceedings-article
    condition_operator: in
    then_validations:
    - field: title
      type: not_null
      nullable: false
      error_message: Journal and proceedings articles must have a title
  key_nullability:
  - field: doi
    key_type: merge
    nullable: false
filters:
  version: 1.0.0
  provider: crossref
  entity: publication
  input_filter:
    enabled: true
    source_path: data/input/dois.csv
    column_name: doi
    filter_field: doi
    batch_size: 50
    fallback_column: title
  silver_filters:
    required_fields:
    - doi
    - title
  gold_filters:
    ranges:
      publication_year:
        min: 1950
        max: 2050
    required_fields:
    - doi
    - title
contracts:
  primary_key:
  - doi
  merge_keys:
  - doi
  hash_include: []
