version: 1.0.0
provider: pubchem
entity: compound
pipeline:
  pipeline_name: pubchem_compound
  provider: pubchem
  entity_type: compound
  description: Pipeline for ingesting PubChem compounds
  field_policy: {}
  business_primary_keys:
  - molecule_id

  sink:
    silver:
      partition_by: []
    gold:
      mode: scd2
      idempotency_contract: scd2
      scd_config:
        valid_from_col: _valid_from
        valid_to_col: _valid_to
        current_flag_col: _is_current
        version_col: _version
  batch_size: 1000
  checkpoint_interval: 1000
schema:
  content_hash:
    include: []
    exclude: []
  column_groups:
  - name: system
    fields:
    - entity_id
    - content_hash
    - _run_id
    - _run_type
    - _source_batch_id
    - _ingestion_ts
    - _index
  - name: business
    fields:
    - molecule_id
    - canonical_smiles
    - isomeric_smiles
    - inchi
    - inchi_key
    - standardized_canonical_smiles
    - standardized_isomeric_smiles
    - standardized_inchi
    - standardized_inchi_key
    - structure_parent_key
    - chemical_standardization_status
    - chemical_standardization_warnings
    - chemical_standardization_policy_version
    - molecular_formula
    - iupac_name
    - molecular_weight
    - exact_mass
    - monoisotopic_mass
    - xlogp
    - tpsa
    - complexity
    - charge
    - heavy_atom_count
    - h_bond_donor_count
    - h_bond_acceptor_count
    - rotatable_bond_count
    - atom_stereo_count
    - defined_atom_stereo_count
    - undefined_atom_stereo_count
    - bond_stereo_count
    - defined_bond_stereo_count
    - undefined_bond_stereo_count
    - isotope_atom_count
    - covalent_unit_count
    - volume_3d
    - conformer_count_3d
    - feature_acceptor_count_3d
    - feature_donor_count_3d
    - feature_anion_count_3d
    - feature_cation_count_3d
    - feature_ring_count_3d
    - feature_hydrophobe_count_3d
    - effective_rotor_count_3d
    - conformer_rmsd_3d
    - x_steric_quadrupole_3d
    - y_steric_quadrupole_3d
    - z_steric_quadrupole_3d
    - feature_count_3d
  - name: dq
    pattern: ^_dq_
  silver:
    include_groups:
    - system
    - business
    - dq
    exclude_fields: []
  gold:
    include_groups:
    - system
    - business
    exclude_fields:
    - _dq_*
    - _source_batch_id
    - _index
quality:
  metadata:
    assay_parameter_type_policy:
      scope: raw_plus_canonical_controlled_vocabulary
      description: RAW-PLUS-CANONICAL ChEMBL assay-parameter typing policy. The pipeline preserves the provider-native 
        type lexeme in type_raw for reviewability while parameter_type stores the canonical controlled-vocabulary value 
        used by Silver/Gold semantics and DQ governance.
      field_semantics:
        type_raw: Preserve the raw/provider-native assay-parameter type token as trimmed text for review and drift 
          analysis.
        type: Published reviewed Silver alias for the canonical normalized assay-parameter type surface used by 
          downstream Silver/Gold consumers and governance reporting.
        parameter_type: Store the canonical assay-parameter type vocabulary value used for normalized Silver/Gold 
          behavior; unknown provider lexemes are preserved as reviewed uppercase canonical candidates rather than 
          rejected at profile time.
        standard_type: Store the canonical strict standard_type surface governed by the shared ChEMBL assay-parameter 
          universe and DQ policy.
    publication_type_policy:
      scope: source_specific
      description: SOURCE-SPECIFIC ChEMBL publication typing policy. This pipeline accepts only the reviewed 
        ChEMBL-native subset and maps it into the broader global publication taxonomy defined in 
        configs/enums/chembl.yaml without redefining that global cross-provider taxonomy.
      field_semantics:
        publication_type_raw: Preserve the raw/native ChEMBL publication type token for traceability and 
          provider-specific review.
        publication_type: Store the canonical publication type mapped into the global taxonomy for normalized 
          Silver/Gold behavior.
    # Source-specific DQ policy:
    # - publication_type uses a ChEMBL-only allowed subset and does not redefine
    #   the global taxonomy in configs/enums/chembl.yaml.
    # - publication_type_raw preserves the provider-native token for traceability.
    # - publication_type stores the canonical mapped type used by this pipeline.
    subcellular_fraction_policy:
      scope: raw_plus_canonical_derived_vocabulary
      description: RAW-PLUS-CANONICAL ChEMBL subcellular-fraction policy. The pipeline preserves the source lexeme in 
        subcellular_fraction_raw while subcellular_fraction stores the normalized derived vocabulary used by Silver/Gold
        contracts. Unknown source lexemes remain reviewable rather than being fail-closed into a strict enum.
      field_semantics:
        subcellular_fraction_raw: Preserve the raw/source ChEMBL subcellular-fraction label as trimmed text for 
          traceability and synonym review.
        subcellular_fraction: Store the canonical normalized subcellular-fraction label used for downstream Silver/Gold 
          semantics; unknown reviewed labels are preserved after canonical text normalization instead of being 
          discarded.
  version: 1.1.0
  provider: pubchem
  entity: compound
  entity_field_validations:
  - field: molecule_id
    type: pattern
    pattern: ^[1-9]\d*$
    nullable: false
    error_message: CID must be a canonical positive integer string
  - field: molecular_formula
    type: pattern
    pattern: ^[A-Z][A-Za-z0-9]*$
    nullable: true
    error_message: Molecular formula must start with uppercase letter
  - field: molecular_weight
    type: range
    min: 10
    max: 10000
    nullable: true
    error_message: Molecular weight must be between 10 and 10000 Da
  - field: canonical_smiles
    type: custom
    validator: smiles_validator
    nullable: true
  - field: inchi_key
    type: pattern
    pattern: ^[A-Z]{14}-[A-Z]{10}-[A-Z]$
    nullable: true
    error_message: inchi_key must be a canonical uppercase InChIKey when present
  - field: standardized_inchi_key
    type: pattern
    pattern: ^[A-Z]{14}-[A-Z]{10}-[A-Z]$
    nullable: true
    error_message: standardized_inchi_key must be a canonical uppercase InChIKey when present
  - field: isomeric_smiles
    type: custom
    validator: smiles_validator
    nullable: true
  - field: chemical_standardization_status
    type: enum
    allowed_values:
    - standardized
    - partial
    - invalid
    - missing_structure
    nullable: true
    error_message: Chemical standardization status must use a bounded policy value
  - field: chemical_standardization_policy_version
    type: enum
    allowed_values:
    - pubchem-basic-v1
    nullable: true
    error_message: Chemical standardization policy version must be recognized
  - field: xlogp
    type: range
    min: -20
    max: 30
    nullable: true
  - field: tpsa
    type: range
    min: 0
    max: 1000
    nullable: true
  - field: h_bond_donor_count
    type: range
    min: 0
    max: 50
    nullable: true
  - field: h_bond_acceptor_count
    type: range
    min: 0
    max: 50
    nullable: true
  entity_cross_field_validations:
  - name: structure_present
    fields:
    - canonical_smiles
    - inchi
    - inchi_key
    condition: any_present
    error_message: At least one structure identifier required
  entity_conditional_validations: []
  key_nullability:
  - field: molecule_id
    key_type: merge
    nullable: false
filters:
  version: 1.0.0
  provider: pubchem
  entity: compound
  input_filter:
    enabled: true
    source_path: data/input/molecule.csv
    column_name: canonical_smiles
    filter_field: smiles
    batch_size: 1
    checkpoint_interval: 1000
    fallback_column: title
  extraction_params: {}
  silver_filters:
    exclude_if_present: []
    required_fields:
    - molecule_id
  gold_filters:
    list_contains: {}
    list_lengths: {}
    ranges:
      publication_year:
        min: 1950
        max: 2050
    required_fields:
    - molecule_id
    - molecular_formula
    columns: {}
    exclude_if_present: []
  metadata:
    publication_filter_policy:
      scope: source_specific
      description: SOURCE-SPECIFIC ChEMBL publication filter policy. Silver and Gold filters intentionally constrain 
        this pipeline to the reviewed ChEMBL publication subset and do not redefine the global publication taxonomy.
    # Source-specific filter policy:
    # - Silver and Gold are intentionally scoped to journal-article for the
    #   current ChEMBL publication pipeline.
    # - This is pipeline scope, not global publication type truth.
contracts:
  primary_key:
  - molecule_id
  merge_keys:
  - molecule_id
  hash_include:
  - atom_stereo_count
  - bond_stereo_count
  - canonical_smiles
  - charge
  - chemical_standardization_policy_version
  - chemical_standardization_status
  - chemical_standardization_warnings
  - complexity
  - conformer_count_3d
  - conformer_rmsd_3d
  - covalent_unit_count
  - defined_atom_stereo_count
  - defined_bond_stereo_count
  - effective_rotor_count_3d
  - exact_mass
  - feature_acceptor_count_3d
  - feature_anion_count_3d
  - feature_cation_count_3d
  - feature_count_3d
  - feature_donor_count_3d
  - feature_hydrophobe_count_3d
  - feature_ring_count_3d
  - h_bond_acceptor_count
  - h_bond_donor_count
  - heavy_atom_count
  - inchi
  - inchi_key
  - isomeric_smiles
  - isotope_atom_count
  - iupac_name
  - molecular_formula
  - molecular_weight
  - molecule_id
  - monoisotopic_mass
  - rotatable_bond_count
  - standardized_canonical_smiles
  - standardized_inchi
  - standardized_inchi_key
  - standardized_isomeric_smiles
  - structure_parent_key
  - tpsa
  - undefined_atom_stereo_count
  - undefined_bond_stereo_count
  - volume_3d
  - x_steric_quadrupole_3d
  - xlogp
  - y_steric_quadrupole_3d
  - z_steric_quadrupole_3d
  hash_exclude:
  - _dq_error
  - _dq_warn
  - _index
  - _ingestion_ts
  - _lookup_method
  - _original_id
  - _run_id
  - _run_type
  - _source
  - _source_batch_id
  hash_datetime_policy: v2_datetime_utc
  contract_ref: pubchem.compound
  active_version: 1.0.0
  rollout:
    mode: single
    read_order:
    - 1.0.0
    write_versions:
    - 1.0.0
    affects_hash: false
hash_policy:
  provider: pubchem
  entity: compound
  contract:
    version: 1.0.0
    migration_note: Explicit config-level hash contract aligned with normalization profile pubchem.compound.
  hash_policy:
    algorithm: sha256
    canonicalization: provider + canonical_json_dumps(normalized_record)
    include_fields:
    - atom_stereo_count
    - bond_stereo_count
    - canonical_smiles
    - charge
    - chemical_standardization_policy_version
    - chemical_standardization_status
    - chemical_standardization_warnings
    - complexity
    - conformer_count_3d
    - conformer_rmsd_3d
    - covalent_unit_count
    - defined_atom_stereo_count
    - defined_bond_stereo_count
    - effective_rotor_count_3d
    - exact_mass
    - feature_acceptor_count_3d
    - feature_anion_count_3d
    - feature_cation_count_3d
    - feature_count_3d
    - feature_donor_count_3d
    - feature_hydrophobe_count_3d
    - feature_ring_count_3d
    - h_bond_acceptor_count
    - h_bond_donor_count
    - heavy_atom_count
    - inchi
    - inchi_key
    - isomeric_smiles
    - isotope_atom_count
    - iupac_name
    - molecular_formula
    - molecular_weight
    - molecule_id
    - monoisotopic_mass
    - rotatable_bond_count
    - standardized_canonical_smiles
    - standardized_inchi
    - standardized_inchi_key
    - standardized_isomeric_smiles
    - structure_parent_key
    - tpsa
    - undefined_atom_stereo_count
    - undefined_bond_stereo_count
    - volume_3d
    - x_steric_quadrupole_3d
    - xlogp
    - y_steric_quadrupole_3d
    - z_steric_quadrupole_3d
    exclude_fields:
    - _dq_error
    - _dq_warn
    - _index
    - _ingestion_ts
    - _lookup_method
    - _original_id
    - _run_id
    - _run_type
    - _source
    - _source_batch_id
    exclude_patterns:
    - ^_dq_
    normalization:
      trim_strings: true
      round_floats:
        enabled: true
        precision: 10
      dates:
        enabled: true
        format: YYYY-MM-DD
      null_handling:
        nan_to_null: true
        inf_to_null: true
