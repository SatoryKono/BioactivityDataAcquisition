version: 1.0.0
provider: pubchem
entity: compound
pipeline:
  pipeline_name: pubchem_compound
  provider: pubchem
  entity_type: compound
  description: Pipeline for ingesting PubChem compounds
  field_policy:
    therapeutic_flag:
      boolean_true_values:
      - 'true'
      - therapeutic
      boolean_false_values:
      - 'false'
      - non_therapeutic

  business_primary_keys:
  - molecule_id

  sink:
    silver:
      partition_by: []
    gold:
      mode: scd2
      idempotency_contract: scd2
      scd_config:
        valid_from_col: _valid_from
        valid_to_col: _valid_to
        current_flag_col: _is_current
        version_col: _version
  batch_size: 1000
  checkpoint_interval: 1000
  source:
    api_key: ${BIOETL_OPENALEX_API_KEY}
    email: ${BIOETL_OPENALEX_EMAIL}
    api:
      base_url: https://rest.uniprot.org
      from_db: ChEMBL
      to_db: UniProtKB

  page_size_override: 1000
schema:
  field_aliases:
    reference_count: citations_made
    affiliations: affiliation_list
    citation_count: citations_received
    keywords: subject_keywords
    mesh_terms: subject_mesh
    pages: page_range
    source_type: publication_type
    fields_of_study: subject_fields
    journal_abbrev: journal_name_short
    journal_title: journal_name
    short_container_title: journal_name_short
    structured_affiliations: affiliation_structured
    subjects: subject_keywords
    topics: subject_topics
  content_hash:
    include: []
    exclude: []
  column_groups:
  - name: system
    fields:
    - entity_id
    - content_hash
    - _run_id
    - _run_type
    - _source_batch_id
    - _ingestion_ts
    - _index
  - name: business
    fields:
    - molecule_id
    - canonical_smiles
    - isomeric_smiles
    - inchi
    - inchi_key
    - standardized_canonical_smiles
    - standardized_isomeric_smiles
    - standardized_inchi
    - standardized_inchi_key
    - structure_parent_key
    - chemical_standardization_status
    - chemical_standardization_warnings
    - chemical_standardization_policy_version
    - molecular_formula
    - iupac_name
    - molecular_weight
    - exact_mass
    - monoisotopic_mass
    - xlogp
    - tpsa
    - complexity
    - charge
    - heavy_atom_count
    - h_bond_donor_count
    - h_bond_acceptor_count
    - rotatable_bond_count
    - atom_stereo_count
    - defined_atom_stereo_count
    - undefined_atom_stereo_count
    - bond_stereo_count
    - defined_bond_stereo_count
    - undefined_bond_stereo_count
    - isotope_atom_count
    - covalent_unit_count
    - volume_3d
    - conformer_count_3d
    - feature_acceptor_count_3d
    - feature_donor_count_3d
    - feature_anion_count_3d
    - feature_cation_count_3d
    - feature_ring_count_3d
    - feature_hydrophobe_count_3d
    - effective_rotor_count_3d
    - conformer_rmsd_3d
    - x_steric_quadrupole_3d
    - y_steric_quadrupole_3d
    - z_steric_quadrupole_3d
    - feature_count_3d
  - name: dq
    pattern: ^_dq_
  silver:
    include_groups:
    - system
    - business
    - dq
    exclude_fields: []
    alias_policy: preserve
  gold:
    include_groups:
    - system
    - business
    exclude_fields:
    - _dq_*
    - _source_batch_id
    - _index
    alias_policy: canonical
quality:
  metadata:
    assay_parameter_type_policy:
      scope: raw_plus_canonical_controlled_vocabulary
      description: RAW-PLUS-CANONICAL ChEMBL assay-parameter typing policy. The pipeline preserves the provider-native type lexeme in type_raw for reviewability while parameter_type stores the canonical controlled-vocabulary value used by Silver/Gold semantics and DQ governance.
      field_semantics:
        type_raw: Preserve the raw/provider-native assay-parameter type token as trimmed text for review and drift analysis.
        type: Published reviewed Silver alias for the canonical normalized assay-parameter type surface used by downstream Silver/Gold consumers and governance reporting.
        parameter_type: Store the canonical assay-parameter type vocabulary value used for normalized Silver/Gold behavior; unknown provider lexemes are preserved as reviewed uppercase canonical candidates rather than rejected at profile time.
        standard_type: Store the canonical strict standard_type surface governed by the shared ChEMBL assay-parameter universe and DQ policy.
    publication_type_policy:
      scope: source_specific
      description: SOURCE-SPECIFIC ChEMBL publication typing policy. This pipeline accepts only the reviewed ChEMBL-native subset and maps it into the broader global publication taxonomy defined in configs/enums/chembl.yaml without redefining that global cross-provider taxonomy.
      field_semantics:
        publication_type_raw: Preserve the raw/native ChEMBL publication type token for traceability and provider-specific review.
        publication_type: Store the canonical publication type mapped into the global taxonomy for normalized Silver/Gold behavior.
    # Source-specific DQ policy:
    # - publication_type uses a ChEMBL-only allowed subset and does not redefine
    #   the global taxonomy in configs/enums/chembl.yaml.
    # - publication_type_raw preserves the provider-native token for traceability.
    # - publication_type stores the canonical mapped type used by this pipeline.
    subcellular_fraction_policy:
      scope: raw_plus_canonical_derived_vocabulary
      description: RAW-PLUS-CANONICAL ChEMBL subcellular-fraction policy. The pipeline preserves the source lexeme in subcellular_fraction_raw while subcellular_fraction stores the normalized derived vocabulary used by Silver/Gold contracts. Unknown source lexemes remain reviewable rather than being fail-closed into a strict enum.
      field_semantics:
        subcellular_fraction_raw: Preserve the raw/source ChEMBL subcellular-fraction label as trimmed text for traceability and synonym review.
        subcellular_fraction: Store the canonical normalized subcellular-fraction label used for downstream Silver/Gold semantics; unknown reviewed labels are preserved after canonical text normalization instead of being discarded.
  version: 1.1.0
  provider: pubchem
  entity: compound
  entity_field_validations:
  - field: molecule_id
    type: pattern
    pattern: ^[1-9]\d*$
    nullable: false
    error_message: CID must be a canonical positive integer string
  - field: molecular_formula
    type: pattern
    pattern: ^[A-Z][A-Za-z0-9]*$
    nullable: true
    error_message: Molecular formula must start with uppercase letter
  - field: molecular_weight
    type: range
    min: 10
    max: 10000
    nullable: true
    error_message: Molecular weight must be between 10 and 10000 Da
  - field: canonical_smiles
    type: custom
    validator: smiles_validator
    nullable: true
  - field: inchi_key
    type: pattern
    pattern: ^[A-Z]{14}-[A-Z]{10}-[A-Z]$
    nullable: true
    error_message: inchi_key must be a canonical uppercase InChIKey when present
  - field: standardized_inchi_key
    type: pattern
    pattern: ^[A-Z]{14}-[A-Z]{10}-[A-Z]$
    nullable: true
    error_message: standardized_inchi_key must be a canonical uppercase InChIKey when present
  - field: isomeric_smiles
    type: custom
    validator: smiles_validator
    nullable: true
  - field: chemical_standardization_status
    type: enum
    allowed_values:
    - standardized
    - partial
    - invalid
    - missing_structure
    nullable: true
    error_message: Chemical standardization status must use a bounded policy value
  - field: chemical_standardization_policy_version
    type: enum
    allowed_values:
    - pubchem-basic-v1
    nullable: true
    error_message: Chemical standardization policy version must be recognized
  - field: xlogp
    type: range
    min: -20
    max: 30
    nullable: true
  - field: tpsa
    type: range
    min: 0
    max: 1000
    nullable: true
  - field: h_bond_donor_count
    type: range
    min: 0
    max: 50
    nullable: true
  - field: h_bond_acceptor_count
    type: range
    min: 0
    max: 50
    nullable: true
  entity_cross_field_validations:
  - name: structure_present
    fields:
    - canonical_smiles
    - inchi
    - inchi_key
    condition: any_present
    error_message: At least one structure identifier required
  entity_conditional_validations: []
  key_nullability:
  - field: molecule_id
    key_type: merge
    nullable: false
  thresholds:
    soft_fail: 0.3
    hard_fail: 0.8
filters:
  version: 1.0.0
  provider: pubchem
  entity: compound
  input_filter:
    enabled: true
    source_path: data/input/molecule.csv
    column_name: canonical_smiles
    filter_field: smiles
    batch_size: 1
    checkpoint_interval: 1000
    fallback_column: title
  extraction_params:
    assay_type__in: B,F
    doc_type: PUBLICATION
    year__gte: 1950
    year__lte: 2050
    confidence_score__gte: 8
    data_validity_comment__isnull: true
    inorganic_flag: 0
    molecule_type: Small molecule
    organism__isnull: false
    pchembl_value__isnull: false
    potential_duplicate: 0
    relationship_type: D
    src_id: 1
    standard_flag: 1
    standard_relation: '='
    standard_type__in: IC50,Ki
    standard_units: nM
    structure_type: MOL
    target_chembl_id__isnull: false
    target_tax_id__isnull: false
    target_type: SINGLE PROTEIN
    tax_id__isnull: false
  silver_filters:
    ranges:
      publication_year:
        min: 1950
        max: 2050
      activity_id:
        min: 1
        max: 10000000000
      confidence_score:
        min: 8
        max: 9
      pchembl_value:
        min: 3
        max: 10
      standard_value:
        min: 0
        include_min: false
    columns:
      assay_type:
      - B
      - F
      inorganic_flag:
      - 0
      molecule_type:
      - Small molecule
      potential_duplicate:
      - 0
      publication_type:
      - journal-article
      relationship_type:
      - D
      src_id:
      - '1'
      standard_relation:
      - '='
      standard_type:
      - IC50
      - Ki
      standard_units:
      - nM
      structure_type:
      - MOL
      target_type:
      - SINGLE PROTEIN
    exclude_if_present: []
    required_fields:
    - molecule_id
  gold_filters:
    list_contains:
      component_types:
        values:
        - PROTEIN
        mode: all
    list_lengths:
      component_accessions:
        min: 1
        max: 1
      component_ids:
        min: 1
    ranges:
      publication_year:
        min: 1950
        max: 2050
      max_tani:
        min: 0.5
        include_min: true
      standard_value:
        min: 0
        include_min: false
    required_fields:
    - molecule_id
    - molecular_formula
    columns:
      assay_type:
      - B
      - F
      assay_strain:
        operator: is_empty
      assay_test_type:
        operator: not_in
        values:
        - In vivo
        - Ex vivo
      bao_format:
        operator: not_in
        values:
        - BAO_0000218
      component_type:
      - PROTEIN
      confidence_score:
      - 8
      - 9
      downgraded:
      - '0'
      inorganic_flag:
      - 0
      molecule_type:
      - Small molecule
      potential_duplicate:
      - 0
      publication_type:
      - journal-article
      relationship_type:
      - D
      reviewed:
      - true
      standard_relation:
      - '='
      standard_type:
      - IC50
      - Ki
      standard_units:
      - nM
      structure_type:
      - MOL
      target_type:
      - SINGLE PROTEIN
      term_type:
      - MESH_HEADING
      - MESH_QUALIFIER
      - KEYWORD
    exclude_if_present: []
  metadata:
    publication_filter_policy:
      scope: source_specific
      description: SOURCE-SPECIFIC ChEMBL publication filter policy. Silver and Gold filters intentionally constrain this pipeline to the reviewed ChEMBL publication subset and do not redefine the global publication taxonomy.
    # Source-specific filter policy:
    # - Silver and Gold are intentionally scoped to journal-article for the
    #   current ChEMBL publication pipeline.
    # - This is pipeline scope, not global publication type truth.
contracts:
  primary_key:
  - molecule_id
  merge_keys:
  - molecule_id
  hash_include: []
  hash_exclude: []
  hash_datetime_policy: v1_date
