version: 1.0.0
provider: openalex
entity: publication
pipeline:
  pipeline_name: openalex_publication
  provider: openalex
  entity_type: publication
  description: Batch DOI resolution via OpenAlex with title fallback
  loading_strategy: full_scan_only
  business_primary_keys:
  - openalex_id
  source:
    api_key: ${BIOETL_OPENALEX_API_KEY}
    email: ${BIOETL_OPENALEX_EMAIL}

  sink:
    gold:
      mode: scd2
      idempotency_contract: scd2
      scd_config:
        valid_from_col: _valid_from
        valid_to_col: _valid_to
        current_flag_col: _is_current
        version_col: _version
schema:
  column_groups:
  - name: system
    fields:
    - entity_id
    - content_hash
    - _run_id
    - _run_type
    - _source_batch_id
    - _source
    - _ingestion_ts
    - _index
    - _lookup_method
    - _original_id
  - name: identifiers
    fields:
    - openalex_id
    - doi
    - pmid
    - mag_id
  - name: title
    fields:
    - title
  - name: abstract
    fields:
    - abstract
  - name: authors
    fields:
    - authors
    - author_openalex_ids
    - author_orcids
  - name: affiliations
    fields:
    - affiliation_list
  - name: institutions
    fields:
    - institution_ids
    - institution_country_codes
    - ror_ids
  - name: journal
    fields:
    - journal
    - issn
    - issn_list
  - name: year
    fields:
    - publication_year
  - name: dates
    fields:
    - publication_date
  - name: pagination
    fields:
    - volume
    - issue
    - page_first
    - page_last
  - name: citations
    fields:
    - citations_received
    - citations_made
    - fwci
  - name: open_access
    fields:
    - is_oa
    - oa_status
  - name: subjects
    fields:
    - subject_topics
    - primary_topic
    - primary_topic_canonical_json
    - primary_topic_raw_json
    - subject_keywords
    - subject_mesh
  - name: publisher
    fields:
    - publisher
  - name: funding
    fields:
    - grants
    - grants_canonical_json
    - grants_raw_json
  - name: doc_type
    fields:
    - publication_type
    - type_crossref
    - publication_type_unified
    - publication_subclass
    - publication_class
  - name: quality
    fields:
    - is_retracted
  - name: language
    fields:
    - language
  - name: dq
    pattern: ^_dq_
  field_aliases:
    affiliations: affiliation_list
    citation_count: citations_received
    reference_count: citations_made
    topics: subject_topics
    keywords: subject_keywords
    mesh_terms: subject_mesh
    source_type: publication_type
  silver:
    include_groups:
    - system
    - identifiers
    - title
    - abstract
    - authors
    - affiliations
    - institutions
    - journal
    - year
    - dates
    - pagination
    - citations
    - open_access
    - subjects
    - publisher
    - funding
    - doc_type
    - quality
    - language
    - dq
  gold:
    include_groups:
    - system
    - identifiers
    - title
    - abstract
    - authors
    - journal
    - year
    - citations
    - open_access
    - subjects
    - doc_type
    - quality
    - funding
    exclude_fields:
    - _dq_*
    - _source_batch_id
    - _index
    - _lookup_method
    - _original_id
quality:
  version: 1.0.0
  provider: openalex
  entity: publication
  entity_field_validations:
  - field: openalex_id
    type: pattern
    pattern: ^W\d+$
    nullable: false
    error_message: OpenAlex ID is required and must start with W followed by digits
  - field: pmid
    type: pattern
    pattern: ^[1-9]\d{0,9}$
    nullable: true
    error_message: PubMed ID must be a canonical positive numeric string
  - field: doi
    type: pattern
    pattern: ^10\.\d{4,}/\S+$
    nullable: true
    error_message: DOI must match format 10.XXXX/suffix (no whitespace)
  - field: pmc_id
    type: pattern
    pattern: ^PMC\d+$
    nullable: true
    error_message: PMC identifier must match PMC format when present
  - field: title
    type: max_length
    max_length: 2000
    nullable: false
    error_message: Title must not exceed 2000 characters
  - field: title
    type: not_null
    nullable: false
    error_message: Missing title is not allowed for OpenAlex publication Gold records
  - field: title
    type: pattern
    pattern: \S
    nullable: false
    error_message: Title must not be empty or whitespace-only
  - field: publication_year
    type: range
    min: 1950
    nullable: true
    severity: warn
    error_message: "Publication year before 1950 \u2014 will be filtered at Gold stage"
  - field: publication_type
    type: pattern
    pattern: ^\S(?:.*\S)?$
    nullable: true
    error_message: Raw OpenAlex publication_type must be non-empty when present
  - field: citations_received
    type: range
    min: 0
    nullable: true
    error_message: Citation count must be non-negative
  - field: citations_received
    type: range
    min: 0
    max: 10000000
    nullable: true
    severity: warn
    error_message: Unusually high citation count
  - field: fwci
    type: range
    min: 0
    nullable: true
    error_message: FWCI must be non-negative
  - field: citations_made
    type: range
    min: 0
    nullable: true
    error_message: Reference count must be non-negative
  entity_cross_field_validations:
  - name: publication_identifiable
    fields:
    - openalex_id
    - title
    condition: all_present
    error_message: Publication must have OpenAlex ID and title
  entity_conditional_validations:
  - name: article_requires_title
    condition_field: publication_type_unified
    condition_value:
    - Journal Article
    - Review
    condition_operator: in
    then_validations:
    - field: title
      type: not_null
      nullable: false
      error_message: Articles and reviews must have a title
  key_nullability:
  - field: openalex_id
    key_type: merge
    nullable: false
filters:
  version: 1.0.0
  provider: openalex
  entity: publication
  input_filter:
    enabled: true
    source_path: data/input/dois.csv
    column_name: doi
    filter_field: doi
    batch_size: 50
    fallback_column: title
  silver_filters:
    required_fields:
    - openalex_id
    - title
  gold_filters:
    ranges:
      publication_year:
        min: 1950
        max: 2050
    required_fields:
    - openalex_id
    - title
contracts:
  primary_key:
  - openalex_id
  merge_keys:
  - openalex_id
  hash_include: []
