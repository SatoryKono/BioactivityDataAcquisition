version: 1.0.0
provider: openalex
entity: publication
pipeline:
  pipeline_name: openalex_publication
  provider: openalex
  entity_type: publication
  description: Batch DOI resolution via OpenAlex with title fallback
  loading_strategy: full_scan_only
  field_policy: {}
  business_primary_keys:
  - openalex_id
  sink:
    silver:
      partition_by: []
    gold:
      mode: scd2
      idempotency_contract: scd2
      scd_config:
        valid_from_col: _valid_from
        valid_to_col: _valid_to
        current_flag_col: _is_current
        version_col: _version
  batch_size: 1000
  checkpoint_interval: 1000
schema:
  content_hash:
    include: []
    exclude: []
  column_groups:
  - name: system
    fields:
    - entity_id
    - content_hash
    - _run_id
    - _run_type
    - _source_batch_id
    - _source
    - _ingestion_ts
    - _index
    - _lookup_method
    - _original_id
  - name: identifiers
    fields:
    - openalex_id
    - doi
    - pmid
    - mag_id
  - name: title
    fields:
    - title
  - name: abstract
    fields:
    - abstract
  - name: authors
    fields:
    - authors
    - author_openalex_ids
    - author_orcids
  - name: affiliations
    fields:
    - affiliation_list
  - name: institutions
    fields:
    - institution_ids
    - institution_country_codes
    - ror_ids
  - name: journal
    fields:
    - journal
    - issn
    - issn_list
  - name: year
    fields:
    - publication_year
  - name: dates
    fields:
    - publication_date
  - name: pagination
    fields:
    - volume
    - issue
    - page_first
    - page_last
  - name: citations
    fields:
    - citations_received
    - citations_made
    - fwci
  - name: open_access
    fields:
    - is_oa
    - oa_status
  - name: subjects
    fields:
    - subject_topics
    - primary_topic
    - primary_topic_canonical_json
    - primary_topic_raw_json
    - subject_keywords
    - subject_mesh
  - name: publisher
    fields:
    - publisher
  - name: funding
    fields:
    - grants
    - grants_canonical_json
    - grants_raw_json
  - name: doc_type
    fields:
    - publication_type
    - type_crossref
    - publication_type_unified
    - publication_subclass
    - publication_class
  - name: quality
    fields:
    - is_retracted
  - name: language
    fields:
    - language
  - name: dq
    pattern: ^_dq_
  silver:
    include_groups:
    - system
    - identifiers
    - title
    - abstract
    - authors
    - affiliations
    - institutions
    - journal
    - year
    - dates
    - pagination
    - citations
    - open_access
    - subjects
    - publisher
    - funding
    - doc_type
    - quality
    - language
    - dq
    exclude_fields: []
  gold:
    include_groups:
    - system
    - identifiers
    - title
    - abstract
    - authors
    - journal
    - year
    - citations
    - open_access
    - subjects
    - doc_type
    - quality
    - funding
    exclude_fields:
    - _dq_*
    - _source_batch_id
    - _index
    - _lookup_method
    - _original_id
quality:
  metadata:
    assay_parameter_type_policy:
      scope: raw_plus_canonical_controlled_vocabulary
      description: RAW-PLUS-CANONICAL ChEMBL assay-parameter typing policy. The pipeline preserves the provider-native 
        type lexeme in type_raw for reviewability while parameter_type stores the canonical controlled-vocabulary value 
        used by Silver/Gold semantics and DQ governance.
      field_semantics:
        type_raw: Preserve the raw/provider-native assay-parameter type token as trimmed text for review and drift 
          analysis.
        type: Published reviewed Silver alias for the canonical normalized assay-parameter type surface used by 
          downstream Silver/Gold consumers and governance reporting.
        parameter_type: Store the canonical assay-parameter type vocabulary value used for normalized Silver/Gold 
          behavior; unknown provider lexemes are preserved as reviewed uppercase canonical candidates rather than 
          rejected at profile time.
        standard_type: Store the canonical strict standard_type surface governed by the shared ChEMBL assay-parameter 
          universe and DQ policy.
    publication_type_policy:
      scope: source_specific
      description: SOURCE-SPECIFIC ChEMBL publication typing policy. This pipeline accepts only the reviewed 
        ChEMBL-native subset and maps it into the broader global publication taxonomy defined in 
        configs/enums/chembl.yaml without redefining that global cross-provider taxonomy.
      field_semantics:
        publication_type_raw: Preserve the raw/native ChEMBL publication type token for traceability and 
          provider-specific review.
        publication_type: Store the canonical publication type mapped into the global taxonomy for normalized 
          Silver/Gold behavior.
    # Source-specific DQ policy:
    # - publication_type uses a ChEMBL-only allowed subset and does not redefine
    #   the global taxonomy in configs/enums/chembl.yaml.
    # - publication_type_raw preserves the provider-native token for traceability.
    # - publication_type stores the canonical mapped type used by this pipeline.
    subcellular_fraction_policy:
      scope: raw_plus_canonical_derived_vocabulary
      description: RAW-PLUS-CANONICAL ChEMBL subcellular-fraction policy. The pipeline preserves the source lexeme in 
        subcellular_fraction_raw while subcellular_fraction stores the normalized derived vocabulary used by Silver/Gold
        contracts. Unknown source lexemes remain reviewable rather than being fail-closed into a strict enum.
      field_semantics:
        subcellular_fraction_raw: Preserve the raw/source ChEMBL subcellular-fraction label as trimmed text for 
          traceability and synonym review.
        subcellular_fraction: Store the canonical normalized subcellular-fraction label used for downstream Silver/Gold 
          semantics; unknown reviewed labels are preserved after canonical text normalization instead of being 
          discarded.
  version: 1.0.0
  provider: openalex
  entity: publication
  entity_field_validations:
  - field: openalex_id
    type: pattern
    pattern: ^W\d+$
    nullable: false
    error_message: OpenAlex ID is required and must start with W followed by digits
  - field: pmid
    type: pattern
    pattern: ^[1-9]\d{0,9}$
    nullable: true
    error_message: PubMed ID must be a canonical positive numeric string
  - field: doi
    type: pattern
    pattern: ^10\.\d{4,}/\S+$
    nullable: true
    error_message: DOI must match format 10.XXXX/suffix (no whitespace)
  - field: pmc_id
    type: pattern
    pattern: ^PMC\d+$
    nullable: true
    error_message: PMC identifier must match PMC format when present
  - field: title
    type: max_length
    max_length: 2000
    nullable: false
    error_message: Title must not exceed 2000 characters
  - field: title
    type: not_null
    nullable: false
    error_message: Missing title is not allowed for OpenAlex publication Gold records
  - field: title
    type: pattern
    pattern: \S
    nullable: false
    error_message: Title must not be empty or whitespace-only
  - field: publication_year
    type: range
    min: 1950
    nullable: true
    severity: warn
    error_message: "Publication year before 1950 — will be filtered at Gold stage"
  - field: publication_type
    type: pattern
    pattern: ^\S(?:.*\S)?$
    nullable: true
    error_message: Raw OpenAlex publication_type must be non-empty when present
  - field: publication_type_unified
    type: custom
    validator: validate_publication_type_unified_taxonomy
    nullable: true
    error_message: publication_type_unified must match the shared publication taxonomy
  - field: publication_subclass
    type: custom
    validator: validate_publication_subclass_taxonomy
    nullable: true
    error_message: publication_subclass must match the shared publication taxonomy
  - field: publication_class
    type: custom
    validator: validate_publication_class_taxonomy
    nullable: true
    error_message: publication_class must match the shared publication taxonomy
  - field: oa_status
    type: enum
    allowed_values:
    - gold
    - green
    - hybrid
    - bronze
    - closed
    nullable: true
    error_message: oa_status must match the shared publication open-access registry
  - field: author_openalex_ids
    type: pattern
    pattern: '^\[("A\d+"(,"A\d+")*)?\]$'
    nullable: true
    severity: warn
    error_message: author_openalex_ids must be a canonical JSON string array of OpenAlex author IDs
  - field: author_orcids
    type: pattern
    pattern: '^\[("\d{4}-\d{4}-\d{4}-[0-9X]"(,"\d{4}-\d{4}-\d{4}-[0-9X]")*)?\]$'
    nullable: true
    severity: warn
    error_message: author_orcids must be a canonical JSON string array of ORCID identifiers
  - field: institution_ids
    type: pattern
    pattern: '^\[("I\d+"(,"I\d+")*)?\]$'
    nullable: true
    severity: warn
    error_message: institution_ids must be a canonical JSON string array of OpenAlex institution IDs
  - field: ror_ids
    type: pattern
    pattern: '^\[("https://ror\.org/[a-z0-9]+"(,"https://ror\.org/[a-z0-9]+")*)?\]$'
    nullable: true
    severity: warn
    error_message: ror_ids must be a canonical JSON string array of canonical ROR URLs
  - field: issn_list
    type: pattern
    pattern: '^\[("[0-9Xx-]+"(,"[0-9Xx-]+")*)?\]$'
    nullable: true
    severity: warn
    error_message: issn_list must be a canonical JSON string array of ISSN values
  - field: citations_received
    type: range
    min: 0
    nullable: true
    error_message: Citation count must be non-negative
  - field: citations_received
    type: range
    min: 0
    max: 10000000
    nullable: true
    severity: warn
    error_message: Unusually high citation count
  - field: fwci
    type: range
    min: 0
    nullable: true
    error_message: FWCI must be non-negative
  - field: citations_made
    type: range
    min: 0
    nullable: true
    error_message: Reference count must be non-negative
  entity_cross_field_validations:
  - name: publication_identifiable
    fields:
    - openalex_id
    - title
    condition: all_present
    error_message: Publication must have OpenAlex ID and title
  entity_conditional_validations:
  - name: article_requires_title
    condition_field: publication_type_unified
    condition_value:
    - Journal Article
    - Review
    condition_operator: in
    then_validations:
    - field: title
      type: not_null
      nullable: false
      error_message: Articles and reviews must have a title
  key_nullability:
  - field: openalex_id
    key_type: merge
    nullable: false
filters:
  version: 1.0.0
  provider: openalex
  entity: publication
  input_filter:
    enabled: true
    source_path: data/input/dois.csv
    column_name: doi
    filter_field: doi
    batch_size: 50
    fallback_column: title
    checkpoint_interval: 1000
  extraction_params: {}
  silver_filters:
    exclude_if_present: []
    required_fields:
    - openalex_id
    - title
  gold_filters:
    list_contains: {}
    list_lengths: {}
    ranges:
      publication_year:
        min: 1950
        max: 2050
    required_fields:
    - openalex_id
    - title
    columns: {}
    exclude_if_present: []
  metadata:
    publication_filter_policy:
      scope: source_specific
      description: SOURCE-SPECIFIC ChEMBL publication filter policy. Silver and Gold filters intentionally constrain 
        this pipeline to the reviewed ChEMBL publication subset and do not redefine the global publication taxonomy.
    # Source-specific filter policy:
    # - Silver and Gold are intentionally scoped to journal-article for the
    #   current ChEMBL publication pipeline.
    # - This is pipeline scope, not global publication type truth.
contracts:
  primary_key:
  - openalex_id
  merge_keys:
  - openalex_id
  hash_include:
  - abstract
  - affiliation_list
  - author_keys
  - author_openalex_ids
  - author_orcids
  - authors
  - citations_made
  - citations_received
  - doi
  - fwci
  - grants
  - grants_canonical_json
  - institution_country_codes
  - institution_ids
  - is_oa
  - is_retracted
  - issn
  - issn_list
  - issue
  - journal
  - language
  - mag_id
  - oa_status
  - openalex_id
  - page_first
  - page_last
  - pmc_id
  - pmid
  - primary_topic
  - primary_topic_canonical_json
  - primary_topic_raw_json
  - publication_class
  - publication_date
  - publication_doi
  - publication_pmc_id
  - publication_pmid
  - publication_subclass
  - publication_type
  - publication_type_unified
  - publication_year
  - publisher
  - ror_ids
  - subject_keywords
  - subject_mesh
  - subject_topics
  - title
  - type_crossref
  - volume
  hash_exclude:
  - _dq_error
  - _dq_warn
  - _index
  - _ingestion_ts
  - _lookup_method
  - _original_id
  - _run_id
  - _run_type
  - _source
  - _source_batch_id
  - grants_raw_json
  hash_datetime_policy: v2_datetime_utc
  contract_ref: openalex.publication
  active_version: 1.0.0
  rollout:
    mode: single
    read_order:
    - 1.0.0
    write_versions:
    - 1.0.0
    affects_hash: false
hash_policy:
  provider: openalex
  entity: publication
  contract:
    version: 1.0.0
    migration_note: Explicit config-level hash contract aligned with normalization profile openalex.publication.
  hash_policy:
    algorithm: sha256
    canonicalization: provider + canonical_json_dumps(normalized_record)
    include_fields:
    - abstract
    - affiliation_list
    - author_keys
    - author_openalex_ids
    - author_orcids
    - authors
    - citations_made
    - citations_received
    - doi
    - fwci
    - grants
    - grants_canonical_json
    - institution_country_codes
    - institution_ids
    - is_oa
    - is_retracted
    - issn
    - issn_list
    - issue
    - journal
    - language
    - mag_id
    - oa_status
    - openalex_id
    - page_first
    - page_last
    - pmc_id
    - pmid
    - primary_topic
    - primary_topic_canonical_json
    - primary_topic_raw_json
    - publication_class
    - publication_date
    - publication_doi
    - publication_pmc_id
    - publication_pmid
    - publication_subclass
    - publication_type
    - publication_type_unified
    - publication_year
    - publisher
    - ror_ids
    - subject_keywords
    - subject_mesh
    - subject_topics
    - title
    - type_crossref
    - volume
    exclude_fields:
    - _dq_error
    - _dq_warn
    - _index
    - _ingestion_ts
    - _lookup_method
    - _original_id
    - _run_id
    - _run_type
    - _source
    - _source_batch_id
    - grants_raw_json
    exclude_patterns:
    - ^_dq_
    normalization:
      trim_strings: true
      round_floats:
        enabled: true
        precision: 10
      dates:
        enabled: true
        format: YYYY-MM-DD
      null_handling:
        nan_to_null: true
        inf_to_null: true
