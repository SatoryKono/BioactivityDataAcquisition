services:
  postgres-sonarqube:
    image: postgres:15-alpine
    container_name: bioetl-postgres-sonarqube
    environment:
      POSTGRES_DB: sonarqube
      POSTGRES_USER: ${SONARQUBE_DB_USER:-sonarqube}
      POSTGRES_PASSWORD: ${SONARQUBE_DB_PASSWORD:-sonarqube_secure}
      POSTGRES_INITDB_ARGS: "-c max_connections=200"
    volumes:
      - postgres-sonarqube-data:/var/lib/postgresql/data
    networks:
      - monitoring
    restart: unless-stopped

  sonarqube:
    image: sonarqube:10-community
    container_name: bioetl-sonarqube
    depends_on:
      - postgres-sonarqube
    ports:
      - "9010:9000"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://postgres-sonarqube:5432/sonarqube
      SONAR_JDBC_USERNAME: ${SONARQUBE_DB_USER:-sonarqube}
      SONAR_JDBC_PASSWORD: ${SONARQUBE_DB_PASSWORD:-sonarqube_secure}
      SONAR_WEB_JAVASKOPTS: "-Xmx2048m -Xms1024m"
      SONAR_CE_JAVASKOPTS: "-Xmx2048m -Xms512m"
      SONAR_WEB_SYSTEMPASSCODE: ${SONARQUBE_SYSTEM_PASSWORD:-sonarqube_system}
      # Enable security headers
      SONAR_WEB_SECURITYREALM_CLASS: sonar.security.realm.DefaultRealm
      # Default admin credentials (change after first login)
      SONAR_FORCEAUTHENTICATION: "true"
    volumes:
      - sonarqube-data:/opt/sonarqube/data
      - sonarqube-logs:/opt/sonarqube/logs
      - sonarqube-extensions:/opt/sonarqube/extensions
      - sonarqube-temp:/opt/sonarqube/temp
    ulimits:
      memlock: -1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/api/system/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - monitoring
    restart: unless-stopped

volumes:
  postgres-sonarqube-data:
  sonarqube-data:
  sonarqube-logs:
  sonarqube-extensions:
  sonarqube-temp:

networks:
  monitoring:
    external: true
    name: bioetl-monitoring
