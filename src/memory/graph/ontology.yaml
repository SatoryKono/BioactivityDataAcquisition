version: 1
managed_by: memory.graph.sync
canonical_mapping_path: src/memory/graph/mappings.yaml
legacy_mapping_path: configs/quality/neo4j_memory_mapping.yaml
summary: >
  Canonical high-signal ontology surface for the deterministic BioETL Neo4j
  graph. This file is governance-oriented metadata for graph ownership and does
  not replace the executable snapshot logic in memory.graph.sync.
node_families:
  topology:
    - project
    - repo_zone
    - directory_surface
    - file_surface
    - package_family
    - module_surface
    - class_surface
    - function_surface
    - method_surface
  docs_and_governance:
    - doc_source_surface
    - doc_artifact
    - doc_claim_surface
    - decision
    - risk
    - policy_surface
  pipelines_and_contracts:
    - pipeline_surface
    - provider_surface
    - contract_surface
    - entity_config_surface
    - schema_field_surface
  operations_and_runtime:
    - storage_surface
    - runtime_evidence_surface
    - runtime_state_surface
    - run_instance_surface
    - control_plane_artifact_surface
    - alert_surface
    - dashboard_surface
  workflow_and_cli:
    - workflow_surface
    - workflow_job_surface
    - workflow_call_surface
    - workflow_output_surface
    - cli_command_surface
    - cli_option_surface
  analysis:
    - retirement_candidate
    - complexity_candidate
    - duplication_cluster
relation_families:
  ownership_and_topology:
    - CONTAINS
    - DECLARES
    - BACKED_BY
    - DESCRIBED_IN
    - GOVERNS
  engineering_links:
    - DEPENDS_ON
    - TESTED_BY
    - VALIDATED_BY
    - OBSERVED_BY
    - RUNS_VIA
  runtime_and_lineage:
    - EMITS
    - MATERIALIZES
    - SUPPORTS
  analysis_and_debt:
    - CANDIDATE_FOR_REMOVAL
    - HAS_COMPLEXITY_SIGNAL
    - CANDIDATE_FOR_SIMPLIFICATION
    - JUSTIFIED_BY_RUNTIME
    - BLOCKED_BY_VARIANCE
invariants:
  - docs_drift_edges_present
  - workflow_job_parent_links_present
  - runtime_evidence_support_links_present
  - control_plane_artifact_links_present
  - run_instance_artifact_links_present
  - runtime_state_links_present
  - schema_field_links_present
