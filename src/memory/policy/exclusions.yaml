version: 1
default_exclusions:
  - pattern: "docs/99-archive/**"
    reason: "Archived docs are not default retrieval sources."
  - pattern: "site/**"
    reason: "Rendered site output is generated and duplicates docs/."
  - pattern: "node_modules/**"
    reason: "Third-party vendored content is outside project memory scope."
  - pattern: ".pytest_cache/**"
    reason: "Transient test cache is not durable project memory."
  - pattern: "**/__pycache__/**"
    reason: "Python bytecode cache is generated runtime state."
  - pattern: "**/*.pyc"
    reason: "Python bytecode cache is generated runtime state."
rag_exclusions:
  - pattern: "docs/reports/generated/**"
    reason: "Generated reports are low-priority derived context."
  - pattern: "data/**"
    reason: "Runtime data artifacts are not indexed as default RAG context."
  - pattern: "src/memory/rag/manifests/**"
    reason: "RAG manifests are rebuild-only generated artifacts."
  - pattern: "src/memory/graph/exports/**"
    reason: "Graph exports are rebuild-only generated artifacts."
  - pattern: "src/memory/timeline/events/**"
    reason: "Timeline event projections are rebuild-only generated artifacts."
  - pattern: "src/memory/episodic/**"
    reason: "Episodic memory is short-lived and should not feed durable retrieval by default."
  - pattern: "src/memory/curated/archive/**"
    reason: "Archived curated notes are historical, not active retrieval context."
graph_exclusions:
  - pattern: "site/**"
    reason: "Static site output duplicates published docs."
  - pattern: "output/**"
    reason: "Ad hoc generated output is not modeled by default."
