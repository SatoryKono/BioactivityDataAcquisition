version: 1
storage_modes:
  - versioned
  - rebuild_only
  - ephemeral
artifact_classes:
  policy:
    storage_mode: versioned
    commit_to_git: true
    default_paths: ["src/memory/policy"]
    notes: "Canonical governance policy for the memory subsystem."
  catalog:
    storage_mode: versioned
    commit_to_git: true
    default_paths: ["src/memory/catalog"]
    notes: "Canonical structured reference data for source selection and placement rules."
  schema:
    storage_mode: versioned
    commit_to_git: true
    default_paths: ["src/memory/schemas"]
    notes: "Canonical contracts for memory artifacts."
  rag_manifest:
    storage_mode: rebuild_only
    commit_to_git: false
    default_paths: ["src/memory/rag/manifests"]
    notes: "Deterministic retrieval manifests should be rebuilt in CI or locally."
  graph_export:
    storage_mode: rebuild_only
    commit_to_git: false
    default_paths: ["src/memory/graph/exports"]
    notes: "Graph snapshots are derived from canonical repo sources and graph mappings."
  timeline_event:
    storage_mode: rebuild_only
    commit_to_git: false
    default_paths: ["src/memory/timeline/events"]
    notes: "Timeline projections are derived from control-plane, workflow, and runbook sources."
  curated_note:
    storage_mode: versioned
    commit_to_git: true
    default_paths:
      - "src/memory/curated/decisions"
      - "src/memory/curated/incidents"
      - "src/memory/curated/lessons"
      - "src/memory/curated/domain_knowledge"
    notes: "Promoted durable memory should remain reviewable in git."
  episodic_note:
    storage_mode: ephemeral
    commit_to_git: true
    default_paths:
      - "src/memory/episodic/sessions"
      - "src/memory/episodic/summaries"
    notes: "Short-lived task context may be committed temporarily but is subject to pruning."
