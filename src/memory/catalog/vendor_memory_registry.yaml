schema_version: 1
verification_policy:
  documented_policy_is_not_runtime_verification: true
  runtime_verified_requires: [dated_test_evidence, deletion_test, isolation_test]
  secret_values_permitted: false
vendors:
  - vendor: github-copilot
    surface: copilot-chat
    policy_status: DOCUMENTED
    runtime_status: BLOCKED_EXTERNAL
    retention: "GitHub documents up to 100 recent conversations and 28-day message retention."
    deletion: documented
    compaction: NOT_PROVEN
    cross_session_recall: documented
    export: NOT_PROVEN
    evidence:
      - https://docs.github.com/en/copilot/how-tos/copilot-on-github/chat-with-copilot/chat-in-github
    blocker: account-backed deletion and isolation tests are not repository-controlled
