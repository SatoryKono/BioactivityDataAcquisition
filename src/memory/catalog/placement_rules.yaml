version: 1
rules:
  - artifact_class: policy
    target_dir: "src/memory/policy"
    allowed_extensions: [".yaml"]
  - artifact_class: catalog
    target_dir: "src/memory/catalog"
    allowed_extensions: [".yaml"]
  - artifact_class: schema
    target_dir: "src/memory/schemas"
    allowed_extensions: [".json"]
  - artifact_class: rag_manifest
    target_dir: "src/memory/rag/manifests"
    allowed_extensions: [".json", ".jsonl"]
  - artifact_class: graph_export
    target_dir: "src/memory/graph/exports"
    allowed_extensions: [".json", ".graphml"]
  - artifact_class: timeline_event
    target_dir: "src/memory/timeline/events"
    allowed_extensions: [".jsonl"]
  - artifact_class: curated_note
    target_dir: "src/memory/curated"
    allowed_extensions: [".md", ".yaml"]
  - artifact_class: episodic_note
    target_dir: "src/memory/episodic"
    allowed_extensions: [".md", ".yaml"]
