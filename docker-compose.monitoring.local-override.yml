# Local-only CPU/memory override for hosts with <=4 CPUs.
# Not part of the shipped monitoring contract; do not commit as normative.

services:
  prometheus:
    cpus: 2.0
    mem_limit: 2g
    pids_limit: 512
  pushgateway:
    cpus: 0.5
    mem_limit: 256m
    pids_limit: 256
  grafana:
    cpus: 1.5
    mem_limit: 1g
    pids_limit: 512
  renderer:
    cpus: 1.0
    mem_limit: 1g
    pids_limit: 256
