sonar.sourceEncoding=UTF-8
sonar.python.version=3.11

# Canonical Sonar scope for this repository. The supported analysis entrypoint is
# the repo workflow in `.github/workflows/sonarcloud.yml`; SonarCloud Automatic
# Analysis must stay disabled in the project UI so cloud analysis respects this
# file instead of broad default heuristics.
# Curated production scope: do not auto-scan tests, scripts, docs, assets, and
# other repo support trees.
sonar.sources=src/bioetl
sonar.inclusions=src/bioetl/**/*.py

# Temporary debt quarantine for files that currently carry open Sonar findings.
# This is explicit scope control, not code remediation.
