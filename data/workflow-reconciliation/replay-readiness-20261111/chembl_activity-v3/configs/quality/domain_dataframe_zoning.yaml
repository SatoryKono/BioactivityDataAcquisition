# S17 / #9630 — shrink-only ratchet for pandera/pandas/pydantic imports in domain.
schema_version: 1
owner: "@bioetl-architecture"
linked_issue: "9630"
max_framework_imports: 128
allowed_libraries:
  - pandera
  - pandas
  - pydantic
pandera_allowed_path_prefixes:
  - src/bioetl/domain/schemas/
  - src/bioetl/domain/contracts/gold/
pandas_forbidden_path_prefixes:
  - src/bioetl/domain/aggregates/
  - src/bioetl/domain/services/

exact_serialization_exceptions:
  orjson:
    runtime_modules:
      - src/bioetl/domain/serialization/__init__.py
      - src/bioetl/domain/normalization/json.py
      - src/bioetl/domain/behavior/dq_serializer.py
      - src/bioetl/domain/behavior/_dq_serializer_yaml.py
      - src/bioetl/domain/behavior/_dq_serializer_html/_renderers.py
  pyarrow:
    type_checking_modules:
      - src/bioetl/domain/serialization/__init__.py
      - src/bioetl/domain/serialization_arrow.py
      - src/bioetl/domain/types/identifiers.py
    lazy_functions:
      src/bioetl/domain/serialization_arrow.py:
        - flatten_arrow_table
