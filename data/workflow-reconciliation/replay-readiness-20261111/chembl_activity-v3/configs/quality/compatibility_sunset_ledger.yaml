    sunset_criteria:
      - has_replacement_in_domain_tests
      - behavior_covered_by_contract_tests
      - no_unique_behavior
    status: closed_no_remaining_filename_matches
    owner: "@bioetl-platform"
    notes:
      "Filename-pattern sunset inventory closed: zero remaining governed compatibility/legacy/deprecated
      test files under the test-governance scanner. Reopen only if new matching test_*.py paths reappear."
    reviewed_on: "2026-07-23"
    next_review_by: "2026-10-21"
    evidence:
      reports/quality/test-governance-current.json (compatibility_test_files=0); no tests/**/test_*.py
      paths match the governance compatibility filename regex; helper tests/helpers/compat_shim_guards.py
      is a guard utility, not a sunset-target compatibility behavior suite.
