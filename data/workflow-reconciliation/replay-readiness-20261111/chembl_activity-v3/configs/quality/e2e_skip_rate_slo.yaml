# E2E skip-rate SLO (T-08 / #6604).
# Skips must be observed, not healed with retries or assertion weakening.

schema_version: 1
owner: "@bioetl-platform"
linked_issues:
  - 6604
  - 9729
reviewed_on: "2026-08-27"

policy:
  forbid_retries_to_heal_flakes: true
  forbid_assertion_weakening: true
  authority: configs/quality/flaky_test_inventory.yaml

skip_categories:
  - transient_upstream
  - vcr_lfs_pointer
  - fixture_missing
  - live_network_opt_in
  - strict_persistence_snapshot_gap

slo:
  # PR e2e-matrix-health.yml matrix-smoke-blocking run3 is the 3-sample gate.
  # Budget stays 15.0%; do not raise it and do not add pytest reruns (#9729).
  mode: blocking
  max_skip_rate_percent: 15.0
  min_executed_tests_for_evaluation: 5
  evaluation_lanes:
    - e2e
    - e2e-smoke
    - e2e-nightly-full

telemetry:
  artifact_name: e2e-skip-rate-telemetry
  reason_field: e2e_skip_reason
  required_fields:
    - suite
    - nodeid
    - category
    - reason_code

enforcement:
  architecture_test: tests/architecture/test_e2e_skip_rate_slo_policy.py
  promotion_path: >-
    PR job e2e-matrix-health.yml matrix-smoke-blocking already enforces skip-rate
    on run3 at max_skip_rate 0.15. Config mode is blocking; max_skip_rate_percent
    remains 15.0.
