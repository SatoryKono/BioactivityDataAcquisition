version: 1.0.0
status: active
owner: Engineering / Security
purpose: >
  Repository-controlled integrity pins for remote executables fetched by GitHub
  Actions. Workflows MUST verify sha256 before using an artifact. Mutable
  installer scripts (curl|sh) are forbidden.

forbidden_url_substrings:
  - cli.coderabbit.ai/install.sh
  - cli.coderabbit.ai/install.ps1

artifacts:
  - id: coderabbit-cli-linux-x64
    version: "0.7.5"
    url: https://cli.coderabbit.ai/releases/0.7.5/coderabbit-linux-x64.zip
    sha256: 0b47cb4de75188c0184f290d8d6818a793a9528e8f79cf660c6a65f225b045c1
    notes: >
      Official CodeRabbit CLI linux-x64 zip. Digest taken from
      https://cli.coderabbit.ai/releases/0.7.5/SHA256SUMS and independently
      hashed. Bump version+digest together; do not follow /releases/latest.
  - id: trivy-cli-linux-64bit
    version: "0.70.0"
    url: https://github.com/aquasecurity/trivy/releases/download/v0.70.0/trivy_0.70.0_Linux-64bit.tar.gz
    sha256: 8b4376d5d6befe5c24d503f10ff136d9e0c49f9127a4279fd110b727929a5aa9
    notes: >
      Official Trivy Linux-64bit tarball. Digest taken from
      https://github.com/aquasecurity/trivy/releases/download/v0.70.0/trivy_0.70.0_checksums.txt
      and independently hashed. Used by .github/actions/install-trivy because
      aquasecurity/setup-trivy is not on the org Actions allowlist.
