services:
  # MCP Servers for Codex integration under WSL2
  # Optimized for stable startup: pinned versions, volume caching, disabled audit
  
  mcp-memory:
    build:
      context: .
      dockerfile: Dockerfile.mcp-memory
    image: bioetl-mcp-memory:latest
    container_name: bioetl-mcp-memory
    restart: unless-stopped
    stdin_open: true
    tty: true
    volumes:
      - ./docs/00-project/ai/memory:/app/memory
    environment:
      MEMORY_FILE_PATH: /app/memory/mcp-memory.json
    networks:
      - warp-network
    healthcheck:
      test: ["CMD", "pgrep", "-f", "node"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  mcp-filesystem:
    build:
      context: .
      dockerfile: Dockerfile.mcp-filesystem
    image: bioetl-mcp-filesystem:latest
    container_name: bioetl-mcp-filesystem
    restart: unless-stopped
    stdin_open: true
    tty: true
    volumes:
      - ./:/app
    networks:
      - warp-network
    healthcheck:
      test: ["CMD", "pgrep", "-f", "node"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  mcp-github:
    build:
      context: .
      dockerfile: Dockerfile.mcp-github
    image: bioetl-mcp-github:latest
    container_name: bioetl-mcp-github
    restart: unless-stopped
    stdin_open: true
    tty: true
    environment:
      GITHUB_PERSONAL_ACCESS_TOKEN: ${GITHUB_PERSONAL_ACCESS_TOKEN:-}
    networks:
      - warp-network
    healthcheck:
      test: ["CMD", "pgrep", "-f", "node"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  mcp-fetch:
    build:
      context: .
      dockerfile: Dockerfile.mcp-fetch
    image: bioetl-mcp-fetch:latest
    container_name: bioetl-mcp-fetch
    restart: unless-stopped
    stdin_open: true
    tty: true
    volumes:
      - mcp-fetch-cache:/home/mcpuser/.cache
    networks:
      - warp-network
    healthcheck:
      test: ["CMD", "pgrep", "-f", "mcp-server-fetch"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  mcp-codex-config:
    image: caddy:alpine
    container_name: bioetl-codex-config
    restart: unless-stopped
    ports:
      - "9100:9100"
    volumes:
      - ./:/data
      - ./.codex:/data/.codex
    networks:
      - warp-network
    depends_on:
      mcp-memory:
        condition: service_started
      mcp-filesystem:
        condition: service_started
      mcp-github:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9100/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  warp-network:
    external: true
    name: warp-network

volumes:
  mcp-fetch-cache:
