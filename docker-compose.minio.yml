services:
  minio:
    image: minio/minio:latest
    container_name: bioetl-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin_secure}
      MINIO_REGION_NAME: us-east-1
    command: minio server /minio-data --console-address ":9001"
    volumes:
      - minio-data:/minio-data
    networks:
      - monitoring
    restart: unless-stopped

volumes:
  minio-data:

networks:
  monitoring:
    external: true
    name: bioetl-monitoring
