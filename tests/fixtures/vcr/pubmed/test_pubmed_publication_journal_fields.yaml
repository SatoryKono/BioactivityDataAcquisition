      string: "<?xml version=\"1.0\" ?>\n<!DOCTYPE PubmedArticleSet PUBLIC \"-//NLM//DTD
        PubMedArticle, 1st January 2025//EN\" \"https://dtd.nlm.nih.gov/ncbi/pubmed/out/pubmed_250101.dtd\">\n<PubmedArticleSet>\n<PubmedArticle><MedlineCitation
        Status=\"Publisher\" Owner=\"NLM\"><PMID Version=\"1\">42832827</PMID><DateRevised><Year>2026</Year><Month>10</Month><Day>05</Day></DateRevised><Article
        PubModel=\"Print-Electronic\"><Journal><ISSN IssnType=\"Electronic\">1873-5126</ISSN><JournalIssue
        CitedMedium=\"Internet\"><Volume>153</Volume><PubDate><Year>2026</Year><Month>Oct</Month><Day>01</Day></PubDate></JournalIssue><Title>Parkinsonism
        &amp; related disorders</Title><ISOAbbreviation>Parkinsonism Relat Disord</ISOAbbreviation></Journal><ArticleTitle>Disentangling
        amantadine response variability in levodopa related dyskinesias: Role of clinical
        and genetic factors.</ArticleTitle><Pagination><StartPage>109000</StartPage><MedlinePgn>109000</MedlinePgn></Pagination><ELocationID
        EIdType=\"doi\" ValidYN=\"Y\">10.1016/j.parkreldis.2026.109000</ELocationID><ELocationID
        EIdType=\"pii\" ValidYN=\"Y\">S1353-8020(26)00827-8</ELocationID><Abstract><AbstractText
        Label=\"BACKGROUND\" NlmCategory=\"BACKGROUND\">Amantadine is the most commonly
        used pharmacologic treatment for levodopa-related dyskinesias (LRD), yet its
        efficacy and tolerability vary substantially, challenging clinical decision-making.</AbstractText><AbstractText
        Label=\"OBJECTIVE\" NlmCategory=\"OBJECTIVE\">To explore clinical, demographic,
        and genetic factors associated with variability in amantadine treatment outcomes.</AbstractText><AbstractText
        Label=\"METHODS\" NlmCategory=\"METHODS\">Cross-sectional study of Parkinson's
        disease (PD) patients treated with amantadine for LRD. Participants were classified
        as responders or non-responders; with non-responders further subdivided according
        to the presence of intolerable side effects. Clinical and demographic data
        were collected and participants underwent genotyping. Polygenic risk scores
        for PD risk (PD-PRS) and genetic variants associated with levodopa or amantadine
        metabolism and LRD susceptibility were assessed.</AbstractText><AbstractText
        Label=\"RESULTS\" NlmCategory=\"RESULTS\">A total of 146 participants were
        included (male 57%, mean age 66.9 years); 94 provided biological samples and
        86 passed quality control. Responders had a longer interval from PD diagnosis
        to amantadine initiation (median 5.5 vs. 3 years, p&#x202f;=&#x202f;0.005)
        and higher levodopa equivalent daily dose (LEDD) (1057.6&#x202f;mg&#x202f;&#xb1;&#x202f;431.5
        vs. 831.1&#x202f;mg&#x202f;&#xb1;&#x202f;504.7, p&#x202f;=&#x202f;0.006).
        Among non-responders, LEDD was lower in those experiencing side effects (725.2&#x202f;mg&#x202f;&#xb1;&#x202f;397.5
        vs. 1013.5&#x202f;mg&#x202f;&#xb1;&#x202f;613.6, p&#x202f;=&#x202f;0.015).
        The DRD1 rs4532-C allele was nominally associated with favorable response,
        whereas ANKK1, DRD2, and COMT variants were nominally associated with side
        effects. PD-PRS showed no association with response.</AbstractText><AbstractText
        Label=\"CONCLUSIONS\" NlmCategory=\"CONCLUSIONS\">Clinical and genetic factors
        may influence amantadine response. Earlier amantadine initiation and lower
        LEDD were associated with a poorer response to amantadine. Genetic markers
        in the dopaminergic pathways may facilitate a personalized treatment approach
        in PD.</AbstractText><CopyrightInformation>Copyright &#xa9; 2026 The Authors.
        Published by Elsevier Ltd.. All rights reserved.</CopyrightInformation></Abstract><AuthorList
