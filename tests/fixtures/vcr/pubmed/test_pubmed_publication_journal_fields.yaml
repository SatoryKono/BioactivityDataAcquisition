        genetics</Title><ISOAbbreviation>Psychiatr Genet</ISOAbbreviation></Journal><ArticleTitle>The
        role of PRKRA mutation in antipsychotic-induced extrapyramidal symptoms: a
        case report and implications for precision psychiatry.</ArticleTitle><ELocationID
        EIdType=\"doi\" ValidYN=\"Y\">10.1097/YPG.0000000000000430</ELocationID><Abstract><AbstractText>Antipsychotic-induced
        extrapyramidal symptoms (EPS) significantly impact patient adherence and treatment
        outcomes in schizophrenia. While genetic susceptibility to EPS has been recognized,
        rare mutations influencing dopamine regulation remain underexplored. We report
        a case of a 43-year-old woman with atypical psychosis who developed severe
        EPS following olanzapine treatment, despite its lower propensity. Genetic
        testing revealed a heterozygous duplication in the PRKRA gene, a key regulator
        of stress response pathways and movement control. This finding underscores
        the role of individualized pharmacogenomics in optimizing care. Additionally,
        allopurinol augmentation in this case suggests a novel therapeutic approach
        for neuroleptic sensitivity, leveraging its antioxidative and neuroprotective
        properties.</AbstractText><CopyrightInformation>Copyright &#xa9; 2026 Wolters
        Kluwer Health, LLC. All rights reserved.</CopyrightInformation></Abstract><AuthorList
