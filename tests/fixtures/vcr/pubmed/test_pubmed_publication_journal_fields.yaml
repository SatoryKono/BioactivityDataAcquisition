        therapy for essential hypertension: a multi-center randomized controlled open-label
        trial.</ArticleTitle><Pagination><StartPage>1842597</StartPage><MedlinePgn>1842597</MedlinePgn></Pagination><ELocationID
        EIdType=\"pii\" ValidYN=\"Y\">1842597</ELocationID><ELocationID EIdType=\"doi\"
        ValidYN=\"Y\">10.3389/fcvm.2026.1842597</ELocationID><Abstract><AbstractText
        Label=\"BACKGROUND\" NlmCategory=\"UNASSIGNED\">The advent of pharmacogenomics-guided
        antihypertensive therapy represents a paradigm shift in hypertension management.
        This study aimed to investigate the prevalence of relevant genetic variants
        among hypertensive patients in Hunan Province, China, and evaluate the efficacy
        of genotype-directed vs. clinically guided therapy.</AbstractText><AbstractText
        Label=\"METHODS\" NlmCategory=\"UNASSIGNED\">A total of 2,702 patients with
        essential hypertension from 14 hospitals were enrolled and evenly randomized
        to either a control group receiving standard care or an experimental group
        receiving pharmacogenomics-tailored medication. Genetic variants in seven
        gene loci (<i>ADRB1</i>, <i>CYP2D6</i>, <i>CYP3A5</i>, <i>CACNA1C</i>, <i>CYP2C9</i>,
        <i>ACE</i>, <i>ADD1</i>) associated with five major drug classes were analyzed.
        Blood pressure and biochemical parameters were assessed at baseline and 4
        weeks post-intervention.</AbstractText><AbstractText Label=\"RESULTS\" NlmCategory=\"UNASSIGNED\">The
        frequencies of the risk allele frequencies for <i>ACE</i>, <i>CYP2C9</i>,
        <i>ADRB1</i>, <i>CYP2D6</i>, <i>CYP3A5</i>, <i>CACNA1C</i>, and <i>ADD1</i>
        were 34.3%, 4.8%, 74.8%, 57.3%, 69.8%, 11.9%, and 46.3%, respectively. After
        4 weeks, blood pressure significantly decreased in both groups (all <i>P</i>&#x2009;&lt;&#x2009;0.001),
        with a more pronounced reduction observed in the experimental group (from
        155.45/92.12&#x2005;mmHg to 129.03/76.96&#x2005;mmHg) compared to the control
        group (from 156.52/91.75&#x2005;mmHg to 143.74/82.73&#x2005;mmHg). The genotype-guided
        group also achieved a significantly higher blood pressure control rate.</AbstractText><AbstractText
        Label=\"CONCLUSION\" NlmCategory=\"UNASSIGNED\">These findings highlight the
        critical role of genetic profiling in antihypertensive drug selection. Personalized
        treatment based on pharmacogenomics offers a more effective strategy for hypertension
        management. In the studied Hunan population, angiotensin II receptor blockers
        and beta-blockers emerged as particularly efficacious options under genotype
        guidance.</AbstractText><CopyrightInformation>&#xa9; 2026 Wu, Liu, Chen, Xu,
