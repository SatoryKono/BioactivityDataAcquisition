        CitedMedium=\"Internet\"><Volume>38</Volume><Issue>10</Issue><PubDate><Year>2026</Year><Month>Oct</Month><Day>01</Day></PubDate></JournalIssue><Title>Journal
        of the American Association of Nurse Practitioners</Title><ISOAbbreviation>J
        Am Assoc Nurse Pract</ISOAbbreviation></Journal><ArticleTitle>Genomics in
        psychiatric Nurse Practitioner practice: Moving from emerging trend to essential
        competency.</ArticleTitle><Pagination><StartPage>746</StartPage><EndPage>750</EndPage><MedlinePgn>746-750</MedlinePgn></Pagination><ELocationID
        EIdType=\"doi\" ValidYN=\"Y\">10.1097/JXX.0000000000001327</ELocationID><Abstract><AbstractText>Genomics
        is increasingly influencing psychiatric practice as evidence links genetic
        variation with neurodevelopmental disorders, treatment response, and complex
        psychiatric presentations. Psychiatric nurse practitioners are well positioned
        to incorporate genomics into patient assessment and management; however, familiarity
        with testing options and clinical indications remains limited. This column
        reviews key genomic considerations for psychiatric practice, including pharmacogenomics,
        chromosomal microarray analysis, and exome or genome sequencing. Clinical
        \"red flags,\" such as developmental delay, dysmorphic features, early-onset
        psychosis, epilepsy, and strong family patterns of neuropsychiatric disease,
        can guide decisions on when to refer for further genetic evaluation. Integrating
        genomics enhances diagnostic clarity, supports precision prescribing, and
        informs risk assessment, ultimately improving patient outcomes. Strengthening
        nurse practitioner genomic literacy is essential to advancing person-centered
        mental health care and ensuring that emerging genomic tools are applied responsibly,
        ethically, and effectively in practice.</AbstractText><CopyrightInformation>Copyright
        &#xa9; 2026 American Association of Nurse Practitioners.</CopyrightInformation></Abstract><AuthorList
