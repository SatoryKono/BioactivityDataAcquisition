        <PubmedArticleSet>

        <PubmedArticle><MedlineCitation Status="Publisher" Owner="NLM"><PMID Version="1">41413662</PMID><DateRevised><Year>2025</Year><Month>12</Month><Day>18</Day></DateRevised><Article
        PubModel="Print-Electronic"><Journal><ISSN IssnType="Electronic">1546-1726</ISSN><JournalIssue
        CitedMedium="Internet"><PubDate><Year>2025</Year><Month>Dec</Month><Day>18</Day></PubDate></JournalIssue><Title>Nature
        neuroscience</Title><ISOAbbreviation>Nat Neurosci</ISOAbbreviation></Journal><ArticleTitle>CRISPRi
        screening in cultured human astrocytes uncovers distal enhancers controlling
        genes dysregulated in Alzheimer''s disease.</ArticleTitle><ELocationID EIdType="doi"
        ValidYN="Y">10.1038/s41593-025-02154-3</ELocationID><Abstract><AbstractText>Genetic
        variants associated with complex traits often lie in distal enhancers. While
        candidate enhancers have been mapped genome wide, their functional state and
        gene targets in specific cell types remain unclear. Here we present AstroREG,
        a resource of enhancer-gene interactions in human primary astrocytes, generated
        by combining CRISPR inhibition (CRISPRi), single-cell RNA-seq and machine
        learning. By functionally testing nearly 1,000 PsychENCODE enhancers, we identified
        more than 150 regulatory interactions, revealing enhancers that control key
        astrocyte functions and genes implicated in Alzheimer''s disease. The CRISPRi
        screen also provided valuable ground-truth data from a primary cell type for
        training and benchmarking prediction models of enhancer activity. We thus
        developed EGrf, a random forest (RF) model trained on these data, and applied
        it genome wide to predict regulatory interactions with high specificity. Together,
        our data provide a comprehensive functional map of enhancer-mediated regulation
        in a key glial cell type, shedding light on brain function and disease.</AbstractText><CopyrightInformation>&#xa9;
        2025. The Author(s).</CopyrightInformation></Abstract><AuthorList CompleteYN="Y"><Author
