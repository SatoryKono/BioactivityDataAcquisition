        of medicinal chemistry</Title><ISOAbbreviation>J Med Chem</ISOAbbreviation></Journal><ArticleTitle>Pyrrolobenzimidazoles
        linked to heterocycles and peptides. Design of DNA base pair specific phosphate
        hydrolyzing agents and novel cytotoxic agents.</ArticleTitle><Pagination><StartPage>90</StartPage><EndPage>100</EndPage><MedlinePgn>90-100</MedlinePgn></Pagination><Abstract><AbstractText>Work
        in this laboratory has been involved with the design of aziridinyl quinone-based
        cancer drugs (PBIs) capable of both recognizing the DNA major groove and cleaving
        the phosphate backbone upon reduction to the hydroquinone. The hydroquinone
        species recognizes the major groove of DNA at single base pairs by Hoogsteen-type
        hydrogen bonding. The present study extends recognition beyond a single base
        pair by adding amino acid residues to the 3-amino center of the PBI system.
        Thus, extension with proline or proline-glycine results in phosphate cleavage
        at 5''-AA-3'' with insignificant N(7) guanine alkylation. Molecular models
        were used to validate the observed sequence specificity. This report also
        describes the design of PBIs not capable of DNA alkylation. Removal of major
        groove interactions by methylation or the presence of steric bulk prevented
        DNA alkylation reactions upon reductive activation. From these studies it
        was concluded that DNA alkyation was not necessary for PBI cytostatic and
        cytotoxic activity. For example, linkage of two phenylalanines to the PBI
        results in highly selective cytostatic and cytotoxic activity against melanoma,
        although this compound is a weak DNA alkylator.</AbstractText></Abstract><AuthorList
