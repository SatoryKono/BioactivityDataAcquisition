        derivatives: a new class of orally bioavailable nitric oxide synthase inhibitor.</ArticleTitle><Pagination><StartPage>313</StartPage><EndPage>316</EndPage><MedlinePgn>313-6</MedlinePgn></Pagination><Abstract><AbstractText>In
        our search for a novel class of inducible nitric oxide synthase (iNOS) inhibitors,
        1,3-oxazolidin-2-imine was found to weakly inhibit iNOS. Further modifications
        of this compound resulted in a remarkable increase in both the in vivo and
        in vitro inhibitory activity and selectivity for iNOS.</AbstractText></Abstract><AuthorList
