        Lett</ISOAbbreviation></Journal><ArticleTitle>Design and synthesis of novel
        cyanoguanidine ATP-sensitive potassium channel openers for the treatment of
        overactive bladder.</ArticleTitle><Pagination><StartPage>397</StartPage><EndPage>400</EndPage><MedlinePgn>397-400</MedlinePgn></Pagination><Abstract><AbstractText>Thiourea
        derivatives were identified as glyburide-reversible potassium channel openers
        through high-throughput screening. Based on these findings, a number of novel
        cyanoguanidines were designed and synthesized, which hyperpolarized human
        bladder K(ATP) channels. These agents are potent full agonists in relaxing
        electrically-stimulated pig bladder strips. The synthesis, SAR and biological
        properties of these agents are discussed.</AbstractText></Abstract><AuthorList
