        of medicinal chemistry</Title><ISOAbbreviation>J Med Chem</ISOAbbreviation></Journal><ArticleTitle>Discovery
        of small-molecule inhibitors of the ATPase activity of human papillomavirus
        E1 helicase.</ArticleTitle><Pagination><StartPage>18</StartPage><EndPage>21</EndPage><MedlinePgn>18-21</MedlinePgn></Pagination><Abstract><AbstractText>The
        Boehringer Ingelheim compound collection was screened for inhibitors of the
        ATPase activity of human papillomavirus E1 helicase to develop antiviral agents
        that inhibit human papillomavirus (HPV) DNA replication. This screen led to
        the discovery of (biphenyl-4-sulfonyl)acetic acid 1, which inhibits the ATPase
        activity of HPV type 6 E1 helicase with a low micromolar IC(50) value. A hit-to-lead
        exercise rapidly converted 1 into a low nanomolar lead series.</AbstractText></Abstract><AuthorList
