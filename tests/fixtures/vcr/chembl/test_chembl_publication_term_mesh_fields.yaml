        &amp; medicinal chemistry letters</Title><ISOAbbreviation>Bioorg Med Chem
        Lett</ISOAbbreviation></Journal><ArticleTitle>Synthesis of a novel nitroimidazole-spermidine
        derivative as a tumor-targeted hypoxia-selective cytotoxin.</ArticleTitle><Pagination><StartPage>1519</StartPage><EndPage>1522</EndPage><MedlinePgn>1519-22</MedlinePgn></Pagination><Abstract><AbstractText>A
        four-step synthesis of (R,S)-N(4)-[3-(2-nitro-1-imidazolyl)-2-hydroxypropyl]-spermidine
        trihydrochloride (4) is described and the utilization of the polyamine active
        transport system for the uptake of this compound in cells is demonstrated.
        Thus, V79 cells pretreated with an inhibitor of spermidine biosynthesis, alpha-difluoromethylornithine
        (DFMO), are ca. 2-fold more sensitive to 4 under hypoxic conditions, compared
        to untreated cells. Similarly, radiosensitization of hypoxic V79 cells by
        4 is improved in DFMO-pretreated cells.</AbstractText></Abstract><AuthorList
