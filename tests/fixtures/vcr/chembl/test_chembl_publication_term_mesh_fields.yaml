        Status="MEDLINE" Owner="NLM" IndexingMethod="Manual"><PMID Version="1">14695838</PMID><DateCompleted><Year>2004</Year><Month>02</Month><Day>24</Day></DateCompleted><DateRevised><Year>2003</Year><Month>12</Month><Day>29</Day></DateRevised><Article
        PubModel="Print"><Journal><ISSN IssnType="Print">0022-2623</ISSN><JournalIssue
        CitedMedium="Print"><Volume>47</Volume><Issue>1</Issue><PubDate><Year>2004</Year><Month>Jan</Month><Day>01</Day></PubDate></JournalIssue><Title>Journal
        of medicinal chemistry</Title><ISOAbbreviation>J Med Chem</ISOAbbreviation></Journal><ArticleTitle>Folate-synthesizing
        enzyme system as target for development of inhibitors and inhibitor combinations
        against Candida albicans-synthesis and biological activity of new 2,4-diaminopyrimidines
        and 4''-substituted 4-aminodiphenyl sulfones.</ArticleTitle><Pagination><StartPage>240</StartPage><EndPage>253</EndPage><MedlinePgn>240-53</MedlinePgn></Pagination><Abstract><AbstractText>The
        paper describes the design, synthesis, and testing of inhibitors of folate-synthesizing
        enzymes and of whole cell cultures of Candida albicans. The target enzymes
        used were dihydropteroic acid synthase (SYN) and dihydrofolate reductase (DHFR).
        Several series of new 2,4-diaminopyrimidines were synthesized and tested as
        inhibitors of DHFR and compared with their activity against DHFR derived from
        mycobacteria and Escherichia coli. To test for selectivity, also rat DHFR
        was used. A series of substituted 4-aminodiphenyl sulfones was tested for
        inhibitory activity against SYN and the I(50) values compared to those obtained
        previously against Plasmodium berghei- and E. coli-derived SYN. Surprisingly,
        QSAR equations show very similar structural dependencies. To find an explanation
        for the large difference in the I(50) values observed for enzyme inhibition
        (SYN, DHFR) and for inhibition of cell cultures of Candida, mutant strains
        with overexpressed efflux pumps and strains in which such pumps are deleted
        were included in the study and the MICs compared. Efflux pumps were responsible
        for the low activity of some of the tested derivatives, others showed no increase
        in activity after pumps were knocked out. In this case it may be speculated
        that these derivatives are not able to enter the cells.</AbstractText></Abstract><AuthorList
