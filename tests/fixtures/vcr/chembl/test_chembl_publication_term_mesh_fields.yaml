        of medicinal chemistry</Title><ISOAbbreviation>J Med Chem</ISOAbbreviation></Journal><ArticleTitle>Chemical
        basis for the biological activity of imexon and related cyanoaziridines.</ArticleTitle><Pagination><StartPage>218</StartPage><EndPage>223</EndPage><MedlinePgn>218-23</MedlinePgn></Pagination><Abstract><AbstractText>Chemical
        aspects of mode of action of imexon and related cyanoaziridines were studied.
        These compounds do not alkylate DNA nor react with the epsilon-amino groups
        of l-lysine, despite the presence of an aziridine ring. They do react readily
        with biologically important sulfhydryl compounds to give products derived
        from either aziridine ring opening, interaction with the cyano group of cyanoaziridines,
        or opening of the iminopyrrolidone ring of imexon. The products from reactions
        of imexon and related cyanoaziridines with thiols are not as potent as their
        parent compounds against tumor cells. These results are consistent with biological
        studies that show that the mechanism of cytotoxicity involves thiol depletion
        followed by oxidative stress leading to apoptosis.</AbstractText></Abstract><AuthorList
