        Chem Lett\", \"journal_full_title\": \"Bioorganic & medicinal chemistry letters.\",
        \"last_page\": \"395\", \"patent_id\": null, \"pubmed_id\": 14698166, \"src_id\":
        1, \"title\": \"Synthesis and antibacterial activity of 7-(substituted)aminomethyl
        quinolones.\", \"volume\": \"14\", \"year\": 2004}, {\"abstract\": \"Thiourea
        derivatives were identified as glyburide-reversible potassium channel openers
        through high-throughput screening. Based on these findings, a number of novel
        cyanoguanidines were designed and synthesized, which hyperpolarized human
        bladder K(ATP) channels. These agents are potent full agonists in relaxing
        electrically-stimulated pig bladder strips. The synthesis, SAR and biological
        properties of these agents are discussed.\", \"authors\": \"Perez-Medrano
        A, Buckner SA, Coghlan MJ, Gregg RJ, Gopalakrishnan M, Kort ME, Lynch JK,
        Scott VE, Sullivan JP, Whiteaker KL, Carroll WA.\", \"chembl_release\": {\"chembl_release\":
        \"CHEMBL_1\", \"creation_date\": \"2009-09-03\"}, \"contact\": null, \"doc_type\":
        \"PUBLICATION\", \"document_chembl_id\": \"CHEMBL1148468\", \"doi\": \"10.1016/j.bmcl.2003.10.063\",
        \"doi_chembl\": null, \"first_page\": \"397\", \"issue\": \"2\", \"journal\":
        \"Bioorg Med Chem Lett\", \"journal_full_title\": \"Bioorganic & medicinal
        chemistry letters.\", \"last_page\": \"400\", \"patent_id\": null, \"pubmed_id\":
        14698167, \"src_id\": 1, \"title\": \"Design and synthesis of novel cyanoguanidine
        ATP-sensitive potassium channel openers for the treatment of overactive bladder.\",
        \"volume\": \"14\", \"year\": 2004}, {\"abstract\": \"A series of chrysin
        derivatives were prepared and evaluated for their inhibitory activities of
        cyclooxygenase-2 catalyzed prostaglandin production. Chrysin derivatives were
        prepared from 2-hydroxyacetophenone, 2,4-dihydroxyacetophenone and 2,6-dihydroxyacetophenone
        in 2 to 4 steps, respectively. Methxoylated chrysin derivatives were converted
        to the corresponding hydroxylated chrysin derivatives by the reaction with
        BBr(3) in good yields. The inhibitory activity of the chrysin derivatives
        against prostaglandin production from lipopolysaccharide-treated RAW 264.7
        cells was measured. We found that chrysin derivatives with 3',4'-dichloro
        substituents (5e, 6e and 7e) exhibited good inhibitory activity of prostaglandin
        production.\", \"authors\": \"Dao TT, Chi YS, Kim J, Kim HP, Kim S, Park H.\",
        \"chembl_release\": {\"chembl_release\": \"CHEMBL_1\", \"creation_date\":
        \"2009-09-03\"}, \"contact\": null, \"doc_type\": \"PUBLICATION\", \"document_chembl_id\":
        \"CHEMBL1139449\", \"doi\": \"10.1016/j.bmcl.2003.12.087\", \"doi_chembl\":
        null, \"first_page\": \"1165\", \"issue\": \"5\", \"journal\": \"Bioorg Med
        Chem Lett\", \"journal_full_title\": \"Bioorganic & medicinal chemistry letters.\",
        \"last_page\": \"1167\", \"patent_id\": null, \"pubmed_id\": 14980657, \"src_id\":
        1, \"title\": \"Synthesis and inhibitory activity against COX-2 catalyzed
        prostaglandin production of chrysin derivatives.\", \"volume\": \"14\", \"year\":
        2004}, {\"abstract\": \"A four-step synthesis of (R,S)-N(4)-[3-(2-nitro-1-imidazolyl)-2-hydroxypropyl]-spermidine
        trihydrochloride (4) is described and the utilization of the polyamine active
        transport system for the uptake of this compound in cells is demonstrated.
        Thus, V79 cells pretreated with an inhibitor of spermidine biosynthesis, alpha-difluoromethylornithine
        (DFMO), are ca. 2-fold more sensitive to 4 under hypoxic conditions, compared
        to untreated cells. Similarly, radiosensitization of hypoxic V79 cells by
        4 is improved in DFMO-pretreated cells.\", \"authors\": \"Papadopoulou MV,
        Rosenzweig HS, Bloomer WD.\", \"chembl_release\": {\"chembl_release\": \"CHEMBL_1\",
        \"creation_date\": \"2009-09-03\"}, \"contact\": null, \"doc_type\": \"PUBLICATION\",
