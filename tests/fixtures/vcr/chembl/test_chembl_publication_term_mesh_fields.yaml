        of medicinal chemistry</Title><ISOAbbreviation>J Med Chem</ISOAbbreviation></Journal><ArticleTitle>Three-dimensional
        quantitative structure-activity relationship modeling of cocaine binding by
        a novel human monoclonal antibody.</ArticleTitle><Pagination><StartPage>133</StartPage><EndPage>142</EndPage><MedlinePgn>133-42</MedlinePgn></Pagination><Abstract><AbstractText>Human
        monoclonal antibodies (mAbs) designed for immunotherapy have a high potential
        for avoiding the complications that may result from human immune system responses
        to the introduction of nonhuman mAbs into patients. This study presents a
        characterization of cocaine/antibody interactions that determine the binding
        properties of the novel human sequence mAb 2E2 using three-dimensional quantitative
        structure-activity relationship (3D-QSAR) methodology. We have experimentally
        determined the binding affinities of mAb 2E2 for cocaine and 38 cocaine analogues.
        The K(d) of mAb 2E2 for cocaine was 4 nM, indicating a high affinity. Also,
        mAb 2E2 displayed good cocaine specificity, as reflected in its 10-, 1500-,
        and 25000-fold lower binding affinities for the three physiologically relevant
        cocaine metabolites benzoylecgonine, ecgonine methyl ester, and ecgonine,
        respectively. 3D-QSAR models of cocaine binding were developed by comparative
        molecular similarity index analysis (CoMSIA). A model of high statistical
        quality was generated showing that cocaine binds to mAb 2E2 in a sterically
        restricted binding site that leaves the methyl group attached to the ring
        nitrogen of cocaine solvent-exposed. The methyl ester group of cocaine appears
        to engage in attractive van der Waals interactions with mAb 2E2, whereas the
        phenyl group contributes to the binding primarily via hydrophobic interactions.
        The model further indicated that an increase in partial positive charge near
        the nitrogen proton and methyl ester carbonyl group enhances binding affinity
        and that the ester oxygen likely forms an intermolecular hydrogen bond with
        mAb 2E2. Overall, the cocaine binding properties of mAb 2E2 support its clinical
        potential for development as a treatment of cocaine overdose and addiction.</AbstractText></Abstract><AuthorList
