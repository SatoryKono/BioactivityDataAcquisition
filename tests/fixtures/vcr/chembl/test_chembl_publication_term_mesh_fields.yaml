        small library of 19 compounds was designed based on unique structural features
        of PTP1b. Utilizing electrospray ionization mass spectrometry (ESI-MS) to
        provide binding information about complexes of enzyme and small molecule ligands,
        two classes of lead compounds were discovered.</AbstractText></Abstract><AuthorList
