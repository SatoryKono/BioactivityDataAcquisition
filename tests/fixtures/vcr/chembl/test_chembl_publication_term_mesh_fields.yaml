        \"Bioorganic & medicinal chemistry letters.\", \"last_page\": \"316\", \"patent_id\":
        null, \"pubmed_id\": 14698148, \"src_id\": 1, \"title\": \"4,5-Disubstituted-1,3-oxazolidin-2-imine
        derivatives: a new class of orally bioavailable nitric oxide synthase inhibitor.\",
        \"volume\": \"14\", \"year\": 2004}, {\"abstract\": \"A small library of 19
        compounds was designed based on unique structural features of PTP1b. Utilizing
        electrospray ionization mass spectrometry (ESI-MS) to provide binding information
        about complexes of enzyme and small molecule ligands, two classes of lead
        compounds were discovered.\", \"authors\": \"Ockey DA, Gadek TR.\", \"chembl_release\":
        {\"chembl_release\": \"CHEMBL_1\", \"creation_date\": \"2009-09-03\"}, \"contact\":
        null, \"doc_type\": \"PUBLICATION\", \"document_chembl_id\": \"CHEMBL1139447\",
        \"doi\": \"10.1016/j.bmcl.2003.10.058\", \"doi_chembl\": null, \"first_page\":
        \"389\", \"issue\": \"2\", \"journal\": \"Bioorg Med Chem Lett\", \"journal_full_title\":
        \"Bioorganic & medicinal chemistry letters.\", \"last_page\": \"391\", \"patent_id\":
        null, \"pubmed_id\": 14698165, \"src_id\": 1, \"title\": \"Discovery of novel
        PTP1b inhibitors.\", \"volume\": \"14\", \"year\": 2004}, {\"abstract\": \"A
        series of 7-(substituted)aminomethyl quinolones was synthesized and evaluated
        for antibacterial activity. Derivatives with (monoalkyl)aminomethyl substituent
        at C-7 displayed high in vitro activities comparable to Lomefloxacin against
        gram-negative organisms, whereas those bearing a [(substituted)phenyl]aminomethyl
        side chain at C-7 demonstrated good activities against gram-positive organisms
        as potent as Lomefloxacin and Vancomycin.\", \"authors\": \"Zhang Z, Zhou
        W, Yu A.\", \"chembl_release\": {\"chembl_release\": \"CHEMBL_1\", \"creation_date\":
        \"2009-09-03\"}, \"contact\": null, \"doc_type\": \"PUBLICATION\", \"document_chembl_id\":
