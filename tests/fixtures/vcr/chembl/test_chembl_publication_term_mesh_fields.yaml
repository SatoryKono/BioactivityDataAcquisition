        of medicinal chemistry</Title><ISOAbbreviation>J Med Chem</ISOAbbreviation></Journal><ArticleTitle>Chemical
        function based pharmacophore generation of endothelin-A selective receptor
        antagonists.</ArticleTitle><Pagination><StartPage>2750</StartPage><EndPage>2760</EndPage><MedlinePgn>2750-60</MedlinePgn></Pagination><Abstract><AbstractText>Both
        quantitative and qualitative chemical function based pharmacophore models
        of endothelin-A (ET(A)) selective receptor antagonists were generated by using
        the two algorithms HypoGen and HipHop, respectively, which are implemented
        in the Catalyst molecular modeling software. The input for HypoGen is a training
        set of 18 ET(A) antagonists exhibiting IC(50) values ranging between 0.19
        nM and 67 microM. The best output hypothesis consists of five features: two
        hydrophobic (HY), one ring aromatic (RA), one hydrogen bond acceptor (HBA),
        and one negative ionizable (NI) function. The highest scoring Hip Hop model
        consists of six features: three hydrophobic (HY), one ring aromatic (RA),
        one hydrogen bond acceptor (HBA), and one negative ionizable (NI). It is the
        result of an input of three highly active, selective, and structurally diverse
        ET(A) antagonists. The predictive power of the quantitative model could be
        approved by using a test set of 30 compounds, whose activity values spread
        over 6 orders of magnitude. The two pharmacophores were tested according to
        their ability to extract known endothelin antagonists from the 3D molecular
        structure database of Derwent''s World Drug Index. Thereby the main part of
        selective ET(A) antagonistic entries was detected by the two hypotheses. Furthermore,
        the pharmacophores were used to screen the Maybridge database. Six compounds
        were chosen from the output hit lists for in vitro testing of their ability
        to displace endothelin-1 from its receptor. Two of these are new potential
        lead compounds because they are structurally novel and exhibit satisfactory
        activity in the binding assay.</AbstractText></Abstract><AuthorList CompleteYN="Y"><Author
