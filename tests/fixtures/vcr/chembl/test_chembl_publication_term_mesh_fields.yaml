        of okadaic acid upon complexation with potassium ion.</ArticleTitle><Pagination><StartPage>10</StartPage><EndPage>13</EndPage><MedlinePgn>10-3</MedlinePgn></Pagination><Abstract><AbstractText>Okadaic
        acid (OA) is a toxin responsible for diarrhetic shellfish poisoning and is
        an extremely useful tool for studying processes that are regulated by phosphorylation,
        although the exact mechanism of action is still undetermined. We report on
        a study that proved the existence of OA in an unusual dimeric form when complexed
        with potassium ion. The proposed structure of this dimer is based on spectroscopic
        and conformational studies.</AbstractText></Abstract><AuthorList CompleteYN="Y"><Author
