        CitedMedium="Print"><Volume>14</Volume><Issue>5</Issue><PubDate><Year>2004</Year><Month>Mar</Month><Day>08</Day></PubDate></JournalIssue><Title>Bioorganic
        &amp; medicinal chemistry letters</Title><ISOAbbreviation>Bioorg Med Chem
        Lett</ISOAbbreviation></Journal><ArticleTitle>Synthesis and inhibitory activity
        against COX-2 catalyzed prostaglandin production of chrysin derivatives.</ArticleTitle><Pagination><StartPage>1165</StartPage><EndPage>1167</EndPage><MedlinePgn>1165-7</MedlinePgn></Pagination><Abstract><AbstractText>A
        series of chrysin derivatives were prepared and evaluated for their inhibitory
        activities of cyclooxygenase-2 catalyzed prostaglandin production. Chrysin
        derivatives were prepared from 2-hydroxyacetophenone, 2,4-dihydroxyacetophenone
        and 2,6-dihydroxyacetophenone in 2 to 4 steps, respectively. Methxoylated
        chrysin derivatives were converted to the corresponding hydroxylated chrysin
        derivatives by the reaction with BBr(3) in good yields. The inhibitory activity
        of the chrysin derivatives against prostaglandin production from lipopolysaccharide-treated
        RAW 264.7 cells was measured. We found that chrysin derivatives with 3'',4''-dichloro
        substituents (5e, 6e and 7e) exhibited good inhibitory activity of prostaglandin
        production.</AbstractText></Abstract><AuthorList CompleteYN="Y"><Author ValidYN="Y"><LastName>Dao</LastName><ForeName>Tran
