        ATP-sensitive potassium channel openers for the treatment of overactive bladder.\",
        \"volume\": \"14\", \"year\": 2004}, {\"abstract\": \"A series of chrysin
        derivatives were prepared and evaluated for their inhibitory activities of
        cyclooxygenase-2 catalyzed prostaglandin production. Chrysin derivatives were
        prepared from 2-hydroxyacetophenone, 2,4-dihydroxyacetophenone and 2,6-dihydroxyacetophenone
        in 2 to 4 steps, respectively. Methxoylated chrysin derivatives were converted
        to the corresponding hydroxylated chrysin derivatives by the reaction with
        BBr(3) in good yields. The inhibitory activity of the chrysin derivatives
        against prostaglandin production from lipopolysaccharide-treated RAW 264.7
        cells was measured. We found that chrysin derivatives with 3',4'-dichloro
        substituents (5e, 6e and 7e) exhibited good inhibitory activity of prostaglandin
        production.\", \"authors\": \"Dao TT, Chi YS, Kim J, Kim HP, Kim S, Park H.\",
