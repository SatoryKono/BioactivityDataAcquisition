        1, \"title\": \"Antitumor agents. Part 230: C4'-esters of GL-331 as cytotoxic
        agents and DNA topoisomerase II inhibitors.\", \"volume\": \"14\", \"year\":
        2004}, {\"abstract\": \"A number of substituted piperazinyl oxazolidinone
