        "CHEMBL_1", "creation_date": "2009-09-03"}, "contact": null, "doc_type": "PUBLICATION",
        "document_chembl_id": "CHEMBL1124342", "doi": "10.1021/jm00121a002", "doi_chembl":
        null, "first_page": "8", "issue": "1", "journal": "J Med Chem", "journal_full_title":
        "Journal of medicinal chemistry.", "last_page": "11", "patent_id": null, "pubmed_id":
        2909748, "src_id": 1, "title": "N6-bicycloalkyladenosines with unusually high
