        chemistry.", "last_page": "1720", "patent_id": null, "pubmed_id": 3934383,
        "src_id": 1, "title": "Synthesis, absolute configuration, and conformation
        of the aldose reductase inhibitor sorbinil.", "volume": "28", "year": 1985},
        {"abstract": "In exploring further the structural features that influence
        the relative efficacy of analogues of aminoglutethimide [1, 3-(4-aminophenyl)-3-ethylpiperidine-2,6-dione]
