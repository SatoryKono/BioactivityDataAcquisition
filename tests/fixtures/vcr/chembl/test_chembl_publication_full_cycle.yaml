        greatest potency in vivo, and compounds 72, 73, and 75 caused almost complete
        inhibition of thromboxane production for 6 h after oral administration of
        0.5 mg/kg to conscious dogs. In the case of 73 and 75, thromboxane production
        was still inhibited by 80% after 24 h.", "authors": "Cross PE, Dickinson RP,
        Parry MJ, Randall MJ.", "chembl_release": {"chembl_release": "CHEMBL_1", "creation_date":
        "2009-09-03"}, "contact": null, "doc_type": "PUBLICATION", "document_chembl_id":
