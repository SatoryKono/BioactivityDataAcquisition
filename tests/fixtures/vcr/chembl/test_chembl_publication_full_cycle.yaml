  response:
    body:
      string: "{\"documents\": [{\"abstract\": \"A series of 1-piperazino-3-phenylindans
        was synthesized and tested for neuroleptic and thymoleptic activity. Neuroleptic
        activity was found only in trans racemates and was associated with one of
        the enantiomers only. The potent and long-acting neuroleptic compound trans-4-[3-(4-fluorophenyl)-6-(trifluoromethyl)indan-1-yl]-1-piperazineethanol
        (Lu 18-012, tefludazine) was developed by systematic variation of structural
        components. Thymoleptic activity was optimized, especially with respect to
        dopamine-uptake inhibition. No geometrical stereoselectivity was found with
        regard to dopamine-uptake inhibition, but a high enantioselectivity could
        be demonstrated for both cis and trans racemates. The most potent compounds
        were 1-piperazino-3-(3,4-dichlorophenyl)indans with IC50 values of about 2nM
        for inhibition of dopamine uptake.\", \"authors\": \"B\xF8ges\xF8 KP.\", \"chembl_release\":
        {\"chembl_release\": \"CHEMBL_1\", \"creation_date\": \"2009-09-03\"}, \"contact\":
        null, \"doc_type\": \"PUBLICATION\", \"document_chembl_id\": \"CHEMBL1122477\",
        \"doi\": \"10.1021/jm00361a002\", \"doi_chembl\": null, \"first_page\": \"935\",
        \"issue\": \"7\", \"journal\": \"J Med Chem\", \"journal_full_title\": \"Journal
        of medicinal chemistry.\", \"last_page\": \"947\", \"patent_id\": null, \"pubmed_id\":
        6134833, \"src_id\": 1, \"title\": \"Neuroleptic activity and dopamine-uptake
        inhibition in 1-piperazino-3-phenylindans.\", \"volume\": \"26\", \"year\":
        1983}, {\"abstract\": \"The need for drugs that lack the obtrusive and limiting
        side effects of the tricyclic antidepressants has prompted the search for
        agents with greatly enhanced selectivity for specific mechanisms believed
        to be essential for antidepressant efficacy. The potential role of derangements
        of 5-HT pathways in the etiology of depression has long been suspected and
        has given impetus to the development of newer compounds that accentuate inhibition
        of serotonin reuptake. This paper presents structure-activity relationships
        for a series of cis-1-amino-4-(substituted-aryl)tetralins, which are surprisingly
        potent and selective inhibitors of serotonin uptake in in vitro models. These
        compounds are pharmacologically distinct from corresponding members of the
        trans series, which also potently block uptake of dopamine and norepinephrine.
        The activity in both cis and trans series is stereospecific, being restricted
        to the cis-(1S,4S) and the trans-(1R,4S) enantiomers.\", \"authors\": \"Welch
        WM, Kraska AR, Sarges R, Koe BK.\", \"chembl_release\": {\"chembl_release\":
        \"CHEMBL_1\", \"creation_date\": \"2009-09-03\"}, \"contact\": null, \"doc_type\":
        \"PUBLICATION\", \"document_chembl_id\": \"CHEMBL1122801\", \"doi\": \"10.1021/jm00377a021\",
        \"doi_chembl\": null, \"first_page\": \"1508\", \"issue\": \"11\", \"journal\":
        \"J Med Chem\", \"journal_full_title\": \"Journal of medicinal chemistry.\",
        \"last_page\": \"1515\", \"patent_id\": null, \"pubmed_id\": 6492080, \"src_id\":
        1, \"title\": \"Nontricyclic antidepressant agents derived from cis- and trans-1-amino-4-aryltetralins.\",
        \"volume\": \"27\", \"year\": 1984}, {\"abstract\": \"A consideration of the
        detailed structural information available from X-ray crystallographic and
        NMR studies on complexes of dihydrofolate reductase with inhibitors has led
        to the design of trimethoprim analogues with improved binding properties.
        Computer graphic techniques have been used to predict which substituent groups
        were required at the 3'-O position of brodimoprim (2,4-diamino-5-(3,5-dimethoxy-4-bromobenzyl)pyrimidine)
        to make additional interactions with the enzyme. NMR spectroscopy provided
        a convenient method of assessing if the analogues were binding in the predicted
        manner. On the basis of this approach, the C4,C6-dicarboxylic acid analogue
        IX was designed to interact with Arg-57 and His-28 in the enzyme, and this
        analogue was found to bind 3 orders of magnitude more tightly than the parent
        brodimoprim.\", \"authors\": \"Birdsall B, Feeney J, Pascual C, Roberts GC,
        Kompis I, Then RL, M\xFCller K, Kroehn A.\", \"chembl_release\": {\"chembl_release\":
        \"CHEMBL_1\", \"creation_date\": \"2009-09-03\"}, \"contact\": null, \"doc_type\":
        \"PUBLICATION\", \"document_chembl_id\": \"CHEMBL1122542\", \"doi\": \"10.1021/jm00378a025\",
        \"doi_chembl\": null, \"first_page\": \"1672\", \"issue\": \"12\", \"journal\":
        \"J Med Chem\", \"journal_full_title\": \"Journal of medicinal chemistry.\",
        \"last_page\": \"1676\", \"patent_id\": null, \"pubmed_id\": 6438320, \"src_id\":
        1, \"title\": \"A 1H NMR study of the interactions and conformations of rationally
        designed brodimoprim analogues in complexes with Lactobacillus casei dihydrofolate
        reductase.\", \"volume\": \"27\", \"year\": 1984}, {\"abstract\": \"\", \"authors\":
        \"Sestanj K, Bellini F, Fung S, Abraham N, Treasurywala A, Humber L, Simard-Duquesne
        N, Dvornik D.\", \"chembl_release\": {\"chembl_release\": \"CHEMBL_1\", \"creation_date\":
        \"2009-09-03\"}, \"contact\": null, \"doc_type\": \"PUBLICATION\", \"document_chembl_id\":
        \"CHEMBL1122576\", \"doi\": \"10.1021/jm00369a003\", \"doi_chembl\": null,
        \"first_page\": \"255\", \"issue\": \"3\", \"journal\": \"J Med Chem\", \"journal_full_title\":
        \"Journal of medicinal chemistry.\", \"last_page\": \"256\", \"patent_id\":
        null, \"pubmed_id\": 6422042, \"src_id\": 1, \"title\": \"N-[5-(trifluoromethyl)-6-methoxy-1-naphthalenyl]thioxomethyl]-
        N-methylglycine (Tolrestat), a potent, orally active aldose reductase inhibitor.\",
        \"volume\": \"27\", \"year\": 1984}, {\"abstract\": \"Amastatin [(2S,3R)-3-amino-2-hydroxy-5-methylhexanoyl-L-valyl-L-valyl-L-
        aspartic acid] and bestatin [(2S,3R)-3-amino-2-hydroxy-4-phenylbutanoyl-L-leucine]
        are slow-binding, competitive inhibitors of aminopeptidase M (AP-M) with net
        inhibition constants (Ki) of 1.9 X 10(-8) and 4.1 X 10(-6) M, respectively.
        The effect of inhibitor structure on net Ki and on slow-binding inhibition
        was evaluated for analogues of both inhibitors on AP-M and leucine aminopeptidase
        (LAP). The (2S)-hydroxyl group contributes to the stabilization of a collision
        complex [EI], which is formed rapidly. In contrast, increasing the peptide
        chain length of the inhibitor produces more potent inhibitors as a consequence
        of a slower binding process. A statine analogue of amastatin [(3S,4S)-Sta-Val-Val-Asp]
        stimulated rather than inhibited LAP. AP-M binds tri- and tetrapeptide inhibitors
        more strongly than dipeptide inhibitors, whereas LAP binds dipeptide inhibitors
        more strongly. The difference in binding can be used to distinguish cytosolic
        from membrane-bound aminopeptidases.\", \"authors\": \"Rich DH, Moon BJ, Harbeson
        S.\", \"chembl_release\": {\"chembl_release\": \"CHEMBL_1\", \"creation_date\":
        \"2009-09-03\"}, \"contact\": null, \"doc_type\": \"PUBLICATION\", \"document_chembl_id\":
        \"CHEMBL1122806\", \"doi\": \"10.1021/jm00370a001\", \"doi_chembl\": null,
        \"first_page\": \"417\", \"issue\": \"4\", \"journal\": \"J Med Chem\", \"journal_full_title\":
        \"Journal of medicinal chemistry.\", \"last_page\": \"423\", \"patent_id\":
        null, \"pubmed_id\": 6142952, \"src_id\": 1, \"title\": \"Inhibition of aminopeptidases
        by amastatin and bestatin derivatives. Effect of inhibitor structure on slow-binding
        processes.\", \"volume\": \"27\", \"year\": 1984}, {\"abstract\": \"n-Octyl,
        n-dodecyl, and n-hexadecyl alpha- and gamma-esters of methotrexate (MTX) were
        compared with the previously described alpha- and gamma-n-butyl esters and
        with MTX as inhibitors of dihydrofolate reductase (DHFR) and human leukemic
        lymphoblasts (CEM cells) in culture. The overall order of activity in both
        test systems was MTX greater than MTX gamma-esters greater than MTX alpha-esters.
        In the DHFR assay the activity of the alpha-esters followed the order C4 greater
        than C8 congruent to C12 greater than C16, whereas for the gamma-esters this
        order was C4 congruent to C8 greater than C12 greater than C16. On the other
        hand, the order of cytotoxic activity in culture in both series was C16 greater
        than C12 greater than C8 greater than C4. Increasing the alkyl chain length
        in the ester moiety therefore decreases DHFR affinity but increases cytotoxicity.
        The most potent member of the compounds tested was the gamma-n-hexadecyl ester,
        whose IC50 against CEM cells was 0.11 microM as compared with 0.025 microM
        for MTX. In a comparison of the effect of treatment with the gamma-n-hexadecyl
        ester (10(-5) M, 1 h) on DNA synthesis in CEM and CEM/MTX cells, the latter
        of which are 120-fold resistant to MTX by virtue of a transport defect, the
        ester produced only 4-fold less inhibition in the resistant line than in the
        parental line. These results suggest possible use of this compound or related
        derivatives in the treatment of MTX-resistant tumors with impaired transport.\",
        \"authors\": \"Rosowsky A, Forsch RA, Yu CS, Lazarus H, Beardsley GP.\", \"chembl_release\":
        {\"chembl_release\": \"CHEMBL_1\", \"creation_date\": \"2009-09-03\"}, \"contact\":
        null, \"doc_type\": \"PUBLICATION\", \"document_chembl_id\": \"CHEMBL1122648\",
