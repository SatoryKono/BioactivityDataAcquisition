        "journal": "J Med Chem", "journal_full_title": "Journal of medicinal chemistry.",
        "last_page": "185", "patent_id": null, "pubmed_id": 2447278, "src_id": 1,
        "title": "Synthesis and biological evaluation of poly-gamma-glutamyl metabolites
        of 10-deazaaminopterin and 10-ethyl-10-deazaaminopterin.", "volume": "31",
        "year": 1988}, {"abstract": "The synthesis of a series of orally active, phosphinyloxyacyl
        proline inhibitors of angiotensin converting enzyme (ACE) is described. The
        in vitro and in vivo ACE inhibitory activities are reported for each compound.
        The structure-activity relationship for this series of compounds in relation
        to the carboxyalkyl dipeptide ACE inhibitors as well as other types of hydroxyphosphinyl-containing
        ACE inhibitors (e.g., the corresponding nitrogen and carbon isosteres) is
        discussed. Within an isosteric series of phosphorus-containing inhibitors
        based on the lysylproline terminal dipeptide sequence, only the phosphonates
