      string: '{"documents": [{"abstract": "A series of renin inhibitors have been
        prepared and evaluated for their susceptibility to cleavage by the serine
        protease chymotrypsin. The compounds were designed by consideration of the
        structural requirements in the active-site region of renin and chymotrypsin.
        By systematic alteration of the P3 phenylalanine residue, compounds with varying
        degrees of renin inhibitory potency and chymotrypsin susceptibility were obtained.
        Selected analogues from this group were examined in vivo for both their hypotensive
        effects and metabolic patterns.", "authors": "Plattner JJ, Marcotte PA, Kleinert
        HD, Stein HH, Greer J, Bolis G, Fung AK, Bopp BA, Luly JR, Sham HL.", "chembl_release":
        {"chembl_release": "CHEMBL_1", "creation_date": "2009-09-03"}, "contact":
        null, "doc_type": "PUBLICATION", "document_chembl_id": "CHEMBL1124308", "doi":
        "10.1021/jm00120a006", "doi_chembl": null, "first_page": "2277", "issue":
        "12", "journal": "J Med Chem", "journal_full_title": "Journal of medicinal
        chemistry.", "last_page": "2288", "patent_id": null, "pubmed_id": 3143010,
        "src_id": 1, "title": "Renin inhibitors. Dipeptide analogues of angiotensinogen
        utilizing a structurally modified phenylalanine residue to impart proteolytic
        stability.", "volume": "31", "year": 1988}, {"abstract": "A representative
        series of N-substituted derivatives of the morphine-based trans-4a-aryldecahydroisoquinoline
        were synthesized and evaluated for opioid analgesic activities. Compounds
        with potent analgesic activity and high affinities for the mu and kappa opioid
        receptors were discovered. The effect of varying the N-substituent in the
        trans-4a-aryldecahydroisoquinoline paralleled, to a certain extent, previous
        findings with other morphine part structures. Replacement of the N-methyl
        with a phenethyl group significantly increased analgesic potency. The N-cyclopropylmethyl
        analogue was found in rodents to have mixed agonist-antagonist properties;
        however, its antagonist activity was far weaker than those reported for the
        N-(cyclopropylmethyl)morphinan and -benzomorphan derivatives. Resolution of
        the stereoisomers and determination of their absolute configuration by X-ray
        crystallography showed that the opioid receptor effects were predominantly
        found with the 4aR,8aR isomer, the same relative absolute configuration of
        morphine. Unexpectedly, the 4aR,8aR N-cyclopropylmethyl analogue (compound
        30), which in rodents had mixed agonist-antagonist properties similar to those
        of pentazocine, was found in rhesus monkeys to behave as a full morphine-like
        agonist.", "authors": "Zimmerman DM, Cantrell BE, Swartzendruber JK, Jones
        ND, Mendelsohn LG, Leander JD, Nickander RC.", "chembl_release": {"chembl_release":
        "CHEMBL_1", "creation_date": "2009-09-03"}, "contact": null, "doc_type": "PUBLICATION",
        "document_chembl_id": "CHEMBL1124288", "doi": "10.1021/jm00398a011", "doi_chembl":
        null, "first_page": "555", "issue": "3", "journal": "J Med Chem", "journal_full_title":
        "Journal of medicinal chemistry.", "last_page": "560", "patent_id": null,
        "pubmed_id": 2831363, "src_id": 1, "title": "Synthesis and analgesic properties
        of N-substituted trans-4a-aryldecahydroisoquinolines.", "volume": "31", "year":
        1988}, {"abstract": "A series of 4-(diarylhydroxymethyl)-1-[3-(aryloxy)propyl]piperidines
        was synthesized and evaluated for antiallergy activity. Several analogues
        had potent activity in the passive foot anaphylaxis (PFA) assay, an IgE-mediated
        model useful in the detection of compounds possessing antiallergic activity.
        In particular 1-[4-[3-[4-[bis(4-fluorophenyl)hydroxymethyl]-1-piperidinyl]
        propoxy]-3-methoxyphenyl]ethanone (1, AHR-5333) was more potent than oxatomide
        and terfenadine in this assay.", "authors": "Walsh DA, Franzyshen SK, Yanni
        JM.", "chembl_release": {"chembl_release": "CHEMBL_1", "creation_date": "2009-09-03"},
        "contact": null, "doc_type": "PUBLICATION", "document_chembl_id": "CHEMBL1124311",
        "doi": "10.1021/jm00121a022", "doi_chembl": null, "first_page": "105", "issue":
        "1", "journal": "J Med Chem", "journal_full_title": "Journal of medicinal
        chemistry.", "last_page": "118", "patent_id": null, "pubmed_id": 2562852,
        "src_id": 1, "title": "Synthesis and antiallergy activity of 4-(diarylhydroxymethyl)-1-[3-(aryloxy)propyl]piperidines
        and structurally related compounds.", "volume": "32", "year": 1989}, {"abstract":
        "", "authors": "Bock MG, DiPardo RM, Evans BE, Rittle KE, Whitter WL, Veber
        DE, Anderson PS, Freidinger RM.", "chembl_release": {"chembl_release": "CHEMBL_1",
        "creation_date": "2009-09-03"}, "contact": null, "doc_type": "PUBLICATION",
        "document_chembl_id": "CHEMBL1124313", "doi": "10.1021/jm00121a004", "doi_chembl":
        null, "first_page": "13", "issue": "1", "journal": "J Med Chem", "journal_full_title":
        "Journal of medicinal chemistry.", "last_page": "16", "patent_id": null, "pubmed_id":
        2909725, "src_id": 1, "title": "Benzodiazepine gastrin and brain cholecystokinin
        receptor ligands: L-365,260.", "volume": "32", "year": 1989}, {"abstract":
        "A series of thiol androgens were synthesized and investigated to characterize
        structural features important for the inhibition of aromatase. Analogues of
        androstenedione with thiol groups in either the 2 alpha-, 10 beta-, or 19-positions
        caused time-dependent inhibition of human placental aromatase. When their
        KI and kcat values were compared with those of 4-hydroxyandrost-4-ene-3,17-dione
        (4-OHa) and 10 beta-propargylestr-4-ene-3,17-dione (PED), the thiol androgen
        10 beta-mercaptoestr-4-ene-3,17-dione (10 beta-SHnorA) proved to be the most
        potent suicide substrate. However, 19-mercaptoandrost-4-ene-3,17-dione (19-SHA)
        was the best all-around inhibitor. All compounds except 19-SHA exhibited normal
        type I P-450 difference spectra with partially purified/solubilized, human
        placental aromatase. The Ks values for the series of compounds compared qualitatively
        to the KI values determined from the time and concentration-dependent inhibition
        experiments. 19-SHA induced split Soret peaks at 380 and 474 nm, which suggested
        binding of the 19-thiolate directly to the ferric iron of aromatase. This
        binding could be displaced by aminoglutethimide but not by androstenedione.
        The inhibitory activity of 19-SHA may be explained by two independent mechanisms:
        (1) suicide inactivation of aromatase in the ferrous state; and (2) a direct
        \"hyper-type II\" binding to the remaining portion of the cytochrome in the
        ferric state. A free thiol group was necessary for the suicide inhibitory
        activity of 19-SHA; time-dependent inactivation of aromatase by 19-(acetylthio)androst-4-ene-3,17-dione
        (19-SAcA) and 19-xanthogenylandrost-4-ene-3,17-dione (19-XanA) could be prevented
        if the microsomes were preincubated with a carboxyesterase inhibitor. Aromatase
        previously inactivated by either thiol androgens,4-OHA, or PED could not be
        reactivated after incubation with the disulfide reducing agent dithiothreitol,
        which suggests that a disulfide bond may not be involved in aromatase inactivation
        by these inhibitors.", "authors": "Bednarski PJ, Nelson SD.", "chembl_release":
        {"chembl_release": "CHEMBL_1", "creation_date": "2009-09-03"}, "contact":
        null, "doc_type": "PUBLICATION", "document_chembl_id": "CHEMBL1124325", "doi":
