        \"issue\": \"5\", \"journal\": \"J Med Chem\", \"journal_full_title\": \"Journal
        of medicinal chemistry.\", \"last_page\": \"609\", \"patent_id\": null, \"pubmed_id\":
        6585550, \"src_id\": 1, \"title\": \"Methotrexate analogues. 21. Divergent
        influence of alkyl chain length on the dihydrofolate reductase affinity and
        cytotoxicity of methotrexate monoesters.\", \"volume\": \"27\", \"year\":
        1984}, {\"abstract\": \"Syntheses of the potent angiotensin converting enzyme
        inhibitor 1-(carboxymethyl)-3-(mercaptomethyl)-2,3,4,5-tetrahydro-1H-1- benzazep
        in -2-one (4a) and the corresponding eight-membered ring analogue (4b) are
        described. The influence of ring size on the inhibitory potencies of these
        substances is discussed.\", \"authors\": \"Watthey JW, Gavin T, Desai M.\",
        \"chembl_release\": {\"chembl_release\": \"CHEMBL_1\", \"creation_date\":
        \"2009-09-03\"}, \"contact\": null, \"doc_type\": \"PUBLICATION\", \"document_chembl_id\":
        \"CHEMBL1122740\", \"doi\": \"10.1021/jm00372a022\", \"doi_chembl\": null,
        \"first_page\": \"816\", \"issue\": \"6\", \"journal\": \"J Med Chem\", \"journal_full_title\":
        \"Journal of medicinal chemistry.\", \"last_page\": \"818\", \"patent_id\":
        null, \"pubmed_id\": 6330355, \"src_id\": 1, \"title\": \"Bicyclic lactam
        inhibitors of angiotensin converting enzyme.\", \"volume\": \"27\", \"year\":
        1984}, {\"abstract\": \"\", \"authors\": \"Maryanoff BE, McComsey DF, Castanzo
        MJ, Setler PE, Gardocki JF, Shank RP, Schneider CR.\", \"chembl_release\":
        {\"chembl_release\": \"CHEMBL_1\", \"creation_date\": \"2009-09-03\"}, \"contact\":
        null, \"doc_type\": \"PUBLICATION\", \"document_chembl_id\": \"CHEMBL1122707\",
        \"doi\": \"10.1021/jm00374a001\", \"doi_chembl\": null, \"first_page\": \"943\",
        \"issue\": \"8\", \"journal\": \"J Med Chem\", \"journal_full_title\": \"Journal
        of medicinal chemistry.\", \"last_page\": \"946\", \"patent_id\": null, \"pubmed_id\":
        6747993, \"src_id\": 1, \"title\": \"Pyrroloisoquinoline antidepressants.
        Potent, enantioselective inhibition of tetrabenazine-induced ptosis and neuronal
        uptake of norepinephrine, dopamine, and serotonin.\", \"volume\": \"27\",
        \"year\": 1984}, {\"abstract\": \"Syntheses of the potent angiotensin converting
        enzyme inhibitor (3S)-1-(carboxymethyl)-3-[[(1S)-1-carboxy-3-phenylpropyl]amino]-
        2,3,4,5-tetrahydro-1H-[1]benzazepin-2-one (4b; CGS 14831) and the related
        monoester prodrug (17a; CGS 14824A) are described together with preparative
        details for six- and eight-membered ring analogues. Inhibitory potencies and
        in vivo biological activity of the compounds are discussed. The data indicate
        that 17a has a biological profile comparable to that of enalapril.\", \"authors\":
        \"Watthey JW, Stanton JL, Desai M, Babiarz JE, Finn BM.\", \"chembl_release\":
        {\"chembl_release\": \"CHEMBL_1\", \"creation_date\": \"2009-09-03\"}, \"contact\":
        null, \"doc_type\": \"PUBLICATION\", \"document_chembl_id\": \"CHEMBL1122824\",
        \"doi\": \"10.1021/jm00148a023\", \"doi_chembl\": null, \"first_page\": \"1511\",
        \"issue\": \"10\", \"journal\": \"J Med Chem\", \"journal_full_title\": \"Journal
        of medicinal chemistry.\", \"last_page\": \"1516\", \"patent_id\": null, \"pubmed_id\":
        2995669, \"src_id\": 1, \"title\": \"Synthesis and biological properties of
        (carboxyalkyl)amino-substituted bicyclic lactam inhibitors of angiotensin
        converting enzyme.\", \"volume\": \"28\", \"year\": 1985}, {\"abstract\":
        \"Analogues of the renin octapeptide substrate were synthesized in which replacement
        of the scissile dipeptide with (3S,4S)-4-amino-3-hydroxy-6-methylheptanoic
        acid (statine, Sta) transformed the substrate sequence into potent, transition-state
        analogue, competitive inhibitors of renin. Synthesis and incorporation of
        the cyclohexylalanyl analogue of Sta, (3S,4S)-4-amino-5-cyclohexyl-3-hydroxypentanoic
        acid (ACHPA), gave the most potent inhibitors of renin yet reported, including
        N-isovaleryl-L-histidyl-L-prolyl-L-phenylalanyl-L-histidyl-ACHPA-L -leucyl-L-
        phenylalanyl amide [Iva-His-Pro-Phe-His-ACHPA-Leu-Phe-NH2,3], with renin inhibitions
        of Ki = 1.6 X 10(-10) M (human kidney renin), IC50 = 1.7 X 10(-10)M (human
        plasma renin), IC50 = 1.9 X 10(-9)M (dog plasma renin), and IC50 = 2.1 X 10(-8)
        M (rat plasma renin). This inhibitor 3, containing ACHPA, was 55-76 times
        more potent vs. human renin than the comparable Sta-containing inhibitor 1
        and 17 times more potent vs. dog renin than 1. Inhibitor 3 lowered blood pressure
        in sodium-deficient dogs, with in vivo potency 19 times that shown by 1, in
        close agreement with the relative in vitro potencies. Structure-activity results
        are presented that show the minimal N-terminus for these inhibitors. An ACHPA-containing
        pentapeptide, N-[(ethyloxy)carbonyl]-L-phenylalanyl-L- histidyl-ACHPA-L-leucyl-L-phenylalanyl
        amide [Etoc-Phe-His-ACHPA-Leu-Phe-NH2,8], retained subnanomolar inhibitory
        potency. Molecular modelling studies are described that suggested the design
        of ACHPA.\", \"authors\": \"Boger J, Payne LS, Perlow DS, Lohr NS, Poe M,
