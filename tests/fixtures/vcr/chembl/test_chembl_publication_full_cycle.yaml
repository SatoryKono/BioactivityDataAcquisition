  response:
    body:
      string: '{"documents": [{"abstract": "A series of 2-aryldopamine analogues were
        synthesized and evaluated for their effects on D1 and D2 dopamine receptors.
        The 2-phenyldopamine and 6-phenylbenzazepine analogues exhibited weak binding
        to both D1 and D2 receptors. The 9-(aminomethyl)fluorenes also exhibited weak
        D2 binding; however, 2,5,6-trihydroxy-9H-fluorene-9-methanamine (4b) exhibited
        D1 binding comparable to apomorphine. The binding activity has been correlated
        with the calculated torsion angle of the biphenyl portion of these molecules.
        Good D1 dopamine binding occurs when the aromatic rings approach coplanarity;
        poor binding occurs when the aromatic rings are orthogonal.", "authors": "Ladd
        DL, Weinstock J, Wise M, Gessner GW, Sawyer JL, Flaim KE.", "chembl_release":
        {"chembl_release": "CHEMBL_1", "creation_date": "2009-09-03"}, "contact":
        null, "doc_type": "PUBLICATION", "document_chembl_id": "CHEMBL1123459", "doi":
        "10.1021/jm00160a018", "doi_chembl": null, "first_page": "1904", "issue":
        "10", "journal": "J Med Chem", "journal_full_title": "Journal of medicinal
        chemistry.", "last_page": "1912", "patent_id": null, "pubmed_id": 3761310,
        "src_id": 1, "title": "Synthesis and dopaminergic binding of 2-aryldopamine
        analogues: phenethylamines, 3-benzazepines, and 9-(aminomethyl)fluorenes.",
        "volume": "29", "year": 1986}, {"abstract": "The interaction of Lactobacillus
        casei thymidylate synthase (TS) with 10-propargyl-5,8-dideazafolate (NPQ)
        in the presence of 2''-deoxyuridylate (dUMP) has been investigated. After
        formation of a rapidly reversible dUMP-NPQ-enzyme complex, a slow isomerization
        occurs to provide a ternary complex that can be isolated on nitrocellulose
        membranes or by gel filtration. Unusual features of the isolable complex are
        the slow rate by which it is formed (t1/2 = 0.88 h) and the slow rate at which
        it dissociates (t1/2 = 26.5 h). The ternary complexes contain 2 mol of dUMP
        and 2 mol of NPQ bound per mol of dimeric enzyme. Ultraviolet difference spectra
        of the dUMP-NPQ-TS complex shows a high wavelength maximum that has been attributed
        to perturbations of the enzyme and/or ligand chromophores that occur upon
        binding. Data are presented that suggest that the formation of the isolable
        ternary complex involves nucleophilic attack by a catalytic thiol group of
        the enzyme to the 6-position of dUMP. Evidence for this is as follows: first,
        there is a decrease in the absorbance of the pyrimidine chromophore at 265
        nm that occurs at the same rate as the formation of the isolable complex;
        second, using [6-3H]dUMP there is a large, inverse alpha-secondary kinetic
        isotope effect (kappa H/kappa T = 0.83) upon formation of the complex that
        is in accord with sp2 to sp3 rehybridization of the 6-carbon of the heterocycle.
        Treatment of the complex with sodium dodecyl sulfate (NaDodSO4) results in
        the dissociation of both ligands in an unmodified form, which is consistent
        with proposed structure of the complex. Isolable ternary complexes are also
        formed when the enzyme is incubated with 5-fluoro-2''-deoxyuridylate (FdUMP)
        and NPQ. Interestingly, the dissociation of FdUMP from these complexes is
        biphasic, with one-half of the bound nucleotide dissociating at an exceedingly
        slow rate (t1/2 congruent to 100 h). The findings are discussed with relationship
        to the possible use of NPQ as an anticancer agent.", "authors": "Pogolotti
        AL, Danenberg PV, Santi DV.", "chembl_release": {"chembl_release": "CHEMBL_1",
        "creation_date": "2009-09-03"}, "contact": null, "doc_type": "PUBLICATION",
        "document_chembl_id": "CHEMBL1123426", "doi": "10.1021/jm00154a009", "doi_chembl":
        null, "first_page": "478", "issue": "4", "journal": "J Med Chem", "journal_full_title":
        "Journal of medicinal chemistry.", "last_page": "482", "patent_id": null,
        "pubmed_id": 3754285, "src_id": 1, "title": "Kinetics and mechanism of interaction
        of 10-propargyl-5,8-dideazafolate with thymidylate synthase.", "volume": "29",
        "year": 1986}, {"abstract": "Synthesis and evaluation of the antitumor drugs
        10-methyl- and 10-ethyl-10-deazaminopterin (15a,b) were previously reported
        for the diastereomeric mixtures, lacking resolution at the C-10 position.
        In order to assess biological properties of the individual diastereomers,
        the C-10 isomers of 4-amino-4-deoxy-10-methyl- and 10-ethyl-10-deazapteroic
        acids (13a,b) were prepared by total synthesis. Coupling with L-glutamate
        afforded the appropriate diastereomers of the title compounds. Biochemical,
        transport, and cell growth inhibitory properties in L1210 cells and folate-dependent
        bacteria were measured. Differences were generally less than 2-fold between
        diastereomeric pairs, but a factor of 3 was noted for d,L-15b vs. l,L-15b
        in inhibition of DHFR from L1210 cells and in cytotoxicity toward L1210 cells.
        An in vivo comparison of the isomers of 15b with racemic compound against
        L1210 in mice did not show a significant efficacy difference (ILS) among the
        compounds. However, d,L-15b showed an acute toxicity about 2.5 times that
        of l,L-15b.", "authors": "DeGraw JI, Christie PH, Tagawa H, Kisliuk RL, Gaumont
        Y, Schmid FA, Sirotnak FM.", "chembl_release": {"chembl_release": "CHEMBL_1",
        "creation_date": "2009-09-03"}, "contact": null, "doc_type": "PUBLICATION",
        "document_chembl_id": "CHEMBL1123545", "doi": "10.1021/jm00156a026", "doi_chembl":
        null, "first_page": "1056", "issue": "6", "journal": "J Med Chem", "journal_full_title":
        "Journal of medicinal chemistry.", "last_page": "1061", "patent_id": null,
        "pubmed_id": 3712374, "src_id": 1, "title": "Synthesis and biological activity
        of resolved C-10 diastereomers of 10-methyl- and 10-ethyl-10-deazaminopterin.",
        "volume": "29", "year": 1986}, {"abstract": "The synthesis and biological
        evaluation of 3-alkyl-substituted 3-(4-aminophenyl)piperidine-2,6-diones as
        inhibitors of estrogen biosynthesis are described [H (1), methyl (2), ethyl
        (3), n-propyl (4), isopropyl (5), n-butyl (6), isobutyl (7), sec-butyl (8),
        n-pentyl (9), isopentyl (10), 2-methylbutyl (11), sec-pentyl (12), n-hexyl
        (13), n-heptyl (14)]. In vitro compounds 4-14 showed a stronger inhibition
        of human placental aromatase compared to aminoglutethimide (AG, compound 3),
        which recently has become used for the treatment of hormone-dependent breast
        cancer. The most active derivative, compound 10, showed a 93-fold stronger
        inhibition than AG. With the exception of 5, 7, and 8, all other compounds
        exhibited similar or decreased inhibition of bovine adrenal desmolase compared
        to AG. Compounds 4 and 6-12 showed a stronger inhibition of the plasma estradiol
        concentration of pregnant mare serum gonadotropin (PMSG) primed Sprague-Dawley
        (SD) rats compared to the parent compound. Compounds 4, 6-8, 10, and 12 inhibited
        the testosterone-stimulated tumor growth of ovariectomized 9,10-dimethyl-1,2-benzanthracene
        (DMBA) tumor-bearing SD rats more strongly than AG. Being stronger and more
        selective inhibitors of the estrogen biosynthesis than AG, some of the newly
        developed derivatives of AG might be better candidates for the treatment of
        the hormone-dependent human breast cancer.", "authors": "Hartmann RW, Batzl
        C.", "chembl_release": {"chembl_release": "CHEMBL_1", "creation_date": "2009-09-03"},
        "contact": null, "doc_type": "PUBLICATION", "document_chembl_id": "CHEMBL1123329",
