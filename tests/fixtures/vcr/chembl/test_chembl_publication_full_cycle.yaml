        1989}, {"abstract": "The synthesis of two new series of dicarboxylic acid
        dipeptides and two sulfhydryl-containing inhibitors are described. The in
        vitro enkephalinase inhibition data and some in vivo analgesic data are presented
        for these compounds. For the dibenzylglutaric acid series structure-activity
        relationships and in vivo analgesic activity are discussed. The reverse amides,
        i.e., 4-amino-2,4-dibenzylbutyric acid derivatives, are also discussed. Two
        sulfhydryl-containing inhibitors showed good in vivo potency in the mouse
        jump-latency hot-plate test after peripheral administration at moderate low
        doses.", "authors": "Ksander GM, Diefenbacher CG, Yuan AM, Clark F, Sakane
        Y, Ghai RD.", "chembl_release": {"chembl_release": "CHEMBL_1", "creation_date":
        "2009-09-03"}, "contact": null, "doc_type": "PUBLICATION", "document_chembl_id":
        "CHEMBL1124374", "doi": "10.1021/jm00132a005", "doi_chembl": null, "first_page":
        "2519", "issue": "12", "journal": "J Med Chem", "journal_full_title": "Journal
        of medicinal chemistry.", "last_page": "2526", "patent_id": null, "pubmed_id":
        2585440, "src_id": 1, "title": "Enkephalinase inhibitors. 1. 2,4-Dibenzylglutaric
        acid derivatives.", "volume": "32", "year": 1989}, {"abstract": "Analogues
        of androsta-1,4-diene-3,17-dione (3a) in which the D ring is modified were
        prepared and tested as suicide inactivators and competitive inhibitors of
        human placental aromatase. As long as the five-membered ring is intact, modifications
        of the D ring such as reduction or removal of the carbonyl group or conversion
        to a gamma-butyrolactone cause a less than 6-fold decrease in affinity for
        and rate of inactivation of aromatase, compared to 3a. Thus, an oxygen atom
        at C-17 is not required for binding of these inhibitors to aromatase, suggesting
        that hydrogen bonding to the D-ring oxygen does not play a major role in binding.
        Opening the D ring converts the cyclopentane ring to an alkyl chain and causes
        a greater than 300-fold decrease in affinity; this can be partially reversed
        by shortening the chain length. These results are consistent with a model
        in which the free chain of the opened D ring adopts conformations that sterically
        interfere with binding of the inhibitor to the enzyme. These findings may
        have practical applications in drug design, by allowing the preparation of
        17-deoxo analogues that have high affinity for aromatase but that are not
        subject to reduction of the 17-carbonyl group, which is a major mode of metabolism
        of 3a.", "authors": "Sherwin PF, McMullan PC, Covey DF.", "chembl_release":
        {"chembl_release": "CHEMBL_1", "creation_date": "2009-09-03"}, "contact":
        null, "doc_type": "PUBLICATION", "document_chembl_id": "CHEMBL1124424", "doi":
