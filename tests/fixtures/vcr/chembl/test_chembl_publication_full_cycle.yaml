        acid: prototypes of a novel class of leukotriene antagonists.", "volume":
        "28", "year": 1985}, {"abstract": "A series of functionalized congeners of
        1,3-dialkylxanthines has been prepared as adenosine receptor antagonists.
        On the basis of the high potency of 8-(p-hydroxyphenyl)-1,3-dialkylxanthines,
        the parent compounds were 8-[4-[(carboxymethyl)oxy]phenyl] derivatives of
