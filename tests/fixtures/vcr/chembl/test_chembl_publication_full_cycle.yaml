        "src_id": 1, "title": "Synthesis and activity profiles of new dermorphin-(1-4)
        peptide analogues.", "volume": "30", "year": 1987}, {"abstract": "3-Ethyl-3-(4-pyridyl)piperidine-2,6-dione
        (1) is a strong competitive inhibitor of human placental aromatase (Ki = 1.1
        microM; testosterone as substrate) that, unlike the structurally related aromatase
        inhibitor aminoglutethimide (2), is not also an inhibitor of the cholesterol
        side-chain cleavage enzyme desmolase. An improved synthesis of 1 is described,
        which was readily adapted to the preparation of homologues in a series of
        3-alkyl-3-(4-pyridyl)-piperidine-2,6-diones (6-13). Alkylation of 1 afforded
        a second series, comprising 1-alkyl-3-ethyl-3-(4-pyridyl)-piperidine-2,6-diones
        (14-23). Inhibitory activity toward aromatase was maximal in both series for
        the octyl derivatives. Respective Ki values for the competitive inhibition
        exerted by the 3-octyl (12) and the 1-octyl (21) analogues with testosterone
        as substrate were 0.09 and 0.12 microM. The compounds 1, 2, 12, and 21 differed
        in their relative potencies as inhibitors of the aromatization of testosterone
        and androstenedione. Respective Ki values were as follows: for 1, 1.1 and
        14 microM (ratio 12.7); for 2, 0.6 and 1.8 microM (3); for 12, 0.09 and 0.20
        microM (2.2); and for 21, 0.12 and 0.48 microM (4).", "authors": "Leung CS,
