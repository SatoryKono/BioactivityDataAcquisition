  response:
    body:
      string: "{\"documents\": [{\"abstract\": \"The interaction of dihydrofolate
        reductase (DHFR) from Escherichia coli with drugs such as methotrexate (MTX)
        and 2,4-diamino-6,7-dimethylpteridine (DAM) has been studied by means of site-directed
        mutagenesis, fluorescence spectroscopy, and steady-state as well as transient
        kinetics. A strictly conserved residue at the dihydrofolate binding site of
        DHFR, phenylalanine-31, has been replaced with tyrosine or valine to ascertain
        the importance for binding of this hydrophobic amino acid, which interacts
        with both the pteridine ring and the p-aminobenzoyl moiety. The first mutation
        (Phe-31----Tyr) has a minimal effect on the binding of the classical inhibitor,
        DAM. On the other hand, the second mutation (Phe-31----Val) has increased
        the dissociation constant of DAM from the DHFR.NADPH.DAM ternary complex over
        150-fold (greater than 3 kcal/mol). The dissociation constant of DAM from
        the (Val31-DHFR).DAM binary complex was too large to be measured fluorometrically.
        More importantly, these mutations have decreased the overall tight binding
        of MTX, from 100- to 140-fold (corresponding to a loss of binding energy of
        2.2-2.4 kcal/mol) for the Tyr-31 and Val-31 mutants, respectively. These results
        indicate that hydrophobic interactions between MTX and DHFR are at least as
        important as formation of the MTX.DHFR salt bridge in the tight binding of
        MTX.\", \"authors\": \"Taira K, Benkovic SJ.\", \"chembl_release\": {\"chembl_release\":
        \"CHEMBL_1\", \"creation_date\": \"2009-09-03\"}, \"contact\": null, \"doc_type\":
        \"PUBLICATION\", \"document_chembl_id\": \"CHEMBL1124276\", \"doi\": \"10.1021/jm00396a019\",
        \"doi_chembl\": null, \"first_page\": \"129\", \"issue\": \"1\", \"journal\":
        \"J Med Chem\", \"journal_full_title\": \"Journal of medicinal chemistry.\",
        \"last_page\": \"137\", \"patent_id\": null, \"pubmed_id\": 3275776, \"src_id\":
        1, \"title\": \"Evaluation of the importance of hydrophobic interactions in
        drug binding to dihydrofolate reductase.\", \"volume\": \"31\", \"year\":
        1988}, {\"abstract\": \"Sorbitol formation from glucose, catalyzed by the
        enzyme aldose reductase, is believed to play a role in the development of
        certain chronic complications of diabetes mellitus. Spiro hydantoins derived
        from five- and six-membered ketones fused to an aromatic ring or ring system
        inhibit aldose reductase isolated from calf lens. In vivo these compounds
        are potent inhibitors of sorbitol formation in sciatic nerves of streptozotocinized
        rats. Optimum in vivo activity is reached in spiro hydantoins derived from
        6-halogenated 2,3-dihydro-4H-1-benzopyran-4-ones (4-chromanones). In 2,4-dihydro-6-fluorospiro[4H-1-benzopyran-4,4'-imidazolidine]-2',5
        '-dione, the activity resides exclusively in the 4S isomer, compound 115 (CP-45,634,
        USAN: sorbinil). This compound is currently being used to test, in humans,
        the value of aldose reductase inhibitors in the therapy of diabetic complications.\",
        \"authors\": \"Sarges R, Schnur RC, Belletire JL, Peterson MJ.\", \"chembl_release\":
        {\"chembl_release\": \"CHEMBL_1\", \"creation_date\": \"2009-09-03\"}, \"contact\":
        null, \"doc_type\": \"PUBLICATION\", \"document_chembl_id\": \"CHEMBL1124229\",
        \"doi\": \"10.1021/jm00396a037\", \"doi_chembl\": null, \"first_page\": \"230\",
        \"issue\": \"1\", \"journal\": \"J Med Chem\", \"journal_full_title\": \"Journal
        of medicinal chemistry.\", \"last_page\": \"243\", \"patent_id\": null, \"pubmed_id\":
        3121857, \"src_id\": 1, \"title\": \"Spiro hydantoin aldose reductase inhibitors.\",
        \"volume\": \"31\", \"year\": 1988}, {\"abstract\": \"The previous rules proposed
        for selective recognition of mu and delta opioid receptors by modified enkephalins
        were investigated through an extensive structure-activity study. Thus, modifications
        of the sequence of TRIMU 4 (Tyr-D-Ala-Gly-NHCH(CH3)CH2CH(CH3)2, a peptide
        that exhibits mu selectivity close to that of DAGO (Try-D-Ala-Gly-N(Me)Phe-Gly.ol),
        were performed for two positions, 2 and 4, critical for mu recognition. The
        drastic loss of potency following introduction of L-Ala or Aib in position
        2 emphasizes the importance of the stereochemistry and the steric size of
        the X2 amino acid for optimal mu binding. The enhancement of the intrinsic
        flexibility of the C-terminal alkyl chain of TRIMU 4 through removal of a
        methyl group leads to TRIMU 5 (Tyr-D-Ala-Gly-NHCH2CH2CH(CH3)2), a peptide
        with a mu selectivity similar to that of DAGO. In contrast, introduction of
        an O-tert-butyl Ser2 residue increases affinity for delta receptors. In the
        hexapeptide series derived from DSLET (Tyr-D-Ser-Gly-Phe-Leu-Thr), a D-Thr2
        moiety was shown to be very efficient in improving delta recognition and delta
        selectivity appeared also to be modulated by the nature of the sixth residue.
        The potencies of the 24 peptides studied to inhibit the electrically evoked
        contractions of the GPI or MVD are relatively well correlated with their affinities
        for brain mu or delta receptors labeled with [3H]DAGO or [3H]DSLET, respectively.
        Moreover, the analgesic potency (hot plate test) of the peptides is related
        to their affinity for rat brain mu receptors. The wide range of receptor affinities
        exhibited by the compounds reported here could be useful to study the physiological
        role of mu and delta receptors.\", \"authors\": \"Gacel G, Zajac JM, Delay-Goyet
        P, Daug\xE9 V, Roques BP.\", \"chembl_release\": {\"chembl_release\": \"CHEMBL_1\",
        \"creation_date\": \"2009-09-03\"}, \"contact\": null, \"doc_type\": \"PUBLICATION\",
        \"document_chembl_id\": \"CHEMBL1124245\", \"doi\": \"10.1021/jm00397a019\",
        \"doi_chembl\": null, \"first_page\": \"374\", \"issue\": \"2\", \"journal\":
        \"J Med Chem\", \"journal_full_title\": \"Journal of medicinal chemistry.\",
        \"last_page\": \"383\", \"patent_id\": null, \"pubmed_id\": 2828622, \"src_id\":
        1, \"title\": \"Investigation of the structural parameters involved in the
        mu and delta opioid receptor discrimination of linear enkephalin-related peptides.\",
        \"volume\": \"31\", \"year\": 1988}, {\"abstract\": \"Two new inhibitors,
        4 and 5, of the aspartic proteinase porcine pepsin were synthesized. These
        compounds, which span the P4-P'3 binding subsites of the enzyme, were derived
        by replacing the Nph-Phe dipeptidyl unit of a good pepsin substrate, H2N-Phe-Gly-His-Nph-Phe-Ala-Phe-OMe
        (3), with statine [(3S,4S)-4-amino-3-hydroxy-6-methylheptanoic acid, Sta].
        Hexapeptide 5, H2N-Phe-Gly-Val-(S,S)-Sta-Ala-Phe-OMe, is an extremely potent
        inhibitor of pepsin with a Ki value less than 1 nM. This result is consistent
        with the proposal that statine functions as a bioisosteric replacement for
        a substrate dipeptidyl unit. Compound 4, which contains His at P2, is 2 orders
        of magnitude less active than the valine analogue 5 (Ki = 150 nM). The factor
        for the decrease in binding to pepsin effected by replacement of Val by His
        at P2 parallels the ratio of protonated vs unprotonated imidazole group in
        peptide 4 at pH 4, according to the Henderson-Hasselbach equation. This result
        suggests that a positively charged side chain at P2 is undesirable for maximum
        pepsin inhibition. Kinetic constants for several known inhibitors of pepsin
        and renin are presented that demonstrate that the effect of His incorporation
        at P2 on pepsin inhibition depends upon the peptide sequence and that the
        effect is considerably different for renin inhibitors. We further suggest
        that the high selectivity of potent renin inhibitors known to be only weak
        pepsin and cathepsin D inhibitors is due in part to the extent of histidine
        protonation at P2 arising from pH differences in the inhibition kinetics assay
        of renin (neutral conditions) compared to other aspartic proteinases (acid
        pH 2-4).\", \"authors\": \"Maibaum J, Rich DH.\", \"chembl_release\": {\"chembl_release\":
        \"CHEMBL_1\", \"creation_date\": \"2009-09-03\"}, \"contact\": null, \"doc_type\":
        \"PUBLICATION\", \"document_chembl_id\": \"CHEMBL1124219\", \"doi\": \"10.1021/jm00398a022\",
        \"doi_chembl\": null, \"first_page\": \"625\", \"issue\": \"3\", \"journal\":
        \"J Med Chem\", \"journal_full_title\": \"Journal of medicinal chemistry.\",
        \"last_page\": \"629\", \"patent_id\": null, \"pubmed_id\": 3126296, \"src_id\":
        1, \"title\": \"Inhibition of porcine pepsin by two substrate analogues containing
        statine. The effect of histidine at the P2 subsite on the inhibition of aspartic
        proteinases.\", \"volume\": \"31\", \"year\": 1988}, {\"abstract\": \"This
        paper describes the synthesis, structure-activity relationships (SAR) of mu
        and kappa opioid binding affinities, and analgesic properties of a series
        of novel highly selective kappa opioid N-[(2-aminocyclohexyl)aryl]acetamide
        and N-[(2-aminocyclohexyl)aryloxy] acetamide derivatives. Ten compounds, 14,
        15, 31-37, and 39 (Tables I and II), show a marked kappa selectivity of greater
        than 100:1 over mu binding, with high affinity for the kappa opioid receptor
        (approximately 10(-8) - 10(-9) M). Compound 39, (S,S-trans)-N-methyl-N-[2-(1-pyrrolidinyl)cyclohexyl]-4-benzo[b]
        furanacetamide hydrobromide, has the highest mu/kappa selectivity, 780:1 (kappa
        Ki = 4.2 nM), reported to date. Four of these compounds, 14, 15, and their
        S,S-trans enantiomers, 37 and 39, respectively, produce effective analgesia
        by oral administration, as assayed by a rat-paw pressure test (RPP) (MPE50
        = 24, 26, 8.3, and 12 mg/kg, respectively). The R,R-trans isomer, 38, was
        inactive in binding and RPP. The analgesic effect was reversed by administration
        of naloxone, confirming these effects are opioid in character. Optimal activity
        is produced when the basic nitrogen atom is in a pyrrolidine ring, the aryl
        group is a 10-pi-electron-rich aromatic system, such as 4-benzo[b]thiophene,
        4-benzo[b]furan, or 4-chlorophenoxy, and overall lipophilicity lies within
        the range log P = 3.5-5.0.\", \"authors\": \"Clark CR, Halfpenny PR, Hill
        RG, Horwell DC, Hughes J, Jarvis TC, Rees DC, Schofield D.\", \"chembl_release\":
        {\"chembl_release\": \"CHEMBL_1\", \"creation_date\": \"2009-09-03\"}, \"contact\":
        null, \"doc_type\": \"PUBLICATION\", \"document_chembl_id\": \"CHEMBL1124221\",
        \"doi\": \"10.1021/jm00399a025\", \"doi_chembl\": null, \"first_page\": \"831\",
        \"issue\": \"4\", \"journal\": \"J Med Chem\", \"journal_full_title\": \"Journal
        of medicinal chemistry.\", \"last_page\": \"836\", \"patent_id\": null, \"pubmed_id\":
        2832603, \"src_id\": 1, \"title\": \"Highly selective kappa opioid analgesics.
        Synthesis and structure-activity relationships of novel N-[(2-aminocyclohexyl)aryl]acetamide
        and N-[(2-aminocyclohexyl)aryloxy]acetamide derivatives.\", \"volume\": \"31\",
        \"year\": 1988}, {\"abstract\": \"All of the optical isomers of the muscarinic
        antagonists 3-(1-azabicyclo[2.2.2]octyl) alpha-hydroxy-alpha,alpha-diphenylacetate
        (3-quinuclidinyl benzilate, QNB, 1) 3-(1-azabicyclo[2.2.2]octyl) xanthene-9-carboxylate
        (3-quinuclidinyl xanthene-9-carboxylate, QNX, 2), and 3-(1-azabicyclo[2.2.2]ocytl)
        alpha-hydroxy-alpha-phenylpropionate (3-quinuclidinyl atrolactate, QNA, 3)
        were prepared and studied in binding and functional assays. In all instances
        the esters of (R)-1-azabicyclo[2.2.2]octan-3-ol (3-quinuclidinol) had greater
        affinity for the M1 and M2 subpopulations of muscarinic acetylcholine receptors
        (M-AChRs) than did their S counterparts. The enantiomers of QNB (1), QNX (2),
        and QNA (3) in which the alcoholic portion of the muscarinic antagonists had
        the S absolute stereochemistry were more selective for the M1-AChRs. This
        selectivity was modulated by the nature and, in the case of QNA, the chirality
        of the acid portion. The most potent isomer in the series was (R)-QNB. In
        the QNA series the diastereoisomer with the absolute R configuration of the
        alcohol (a) and the R configuration of the acid (b) was the most potent in
        both binding and functional assays whereas (Sa,Rb)-QNA was the most selective
        for the M1 subtype of M-AChRs. In fact, the latter diastereomer was as potent
        and selective as pirenzepine for M1-AChRs.\", \"authors\": \"Rzeszotarski
        WJ, McPherson DW, Ferkany JW, Kinnier WJ, Noronha-Blob L, Kirkien-Rzeszotarski
        A.\", \"chembl_release\": {\"chembl_release\": \"CHEMBL_1\", \"creation_date\":
        \"2009-09-03\"}, \"contact\": null, \"doc_type\": \"PUBLICATION\", \"document_chembl_id\":
        \"CHEMBL1124162\", \"doi\": \"10.1021/jm00402a035\", \"doi_chembl\": null,
        \"first_page\": \"1463\", \"issue\": \"7\", \"journal\": \"J Med Chem\", \"journal_full_title\":
        \"Journal of medicinal chemistry.\", \"last_page\": \"1466\", \"patent_id\":
        null, \"pubmed_id\": 3385735, \"src_id\": 1, \"title\": \"Affinity and selectivity
        of the optical isomers of 3-quinuclidinyl benzilate and related muscarinic
        antagonists.\", \"volume\": \"31\", \"year\": 1988}, {\"abstract\": \"Brown
        oxidation of cis-bicyclo[3.1.0]hexan-3-ol afforded bicyclo[3.1.0]hexan-3-one
        in 98% yield. Treatment of this ketone with either phenyllithium or phenylamagnesium
        bromide in ether at room temperature followed by solvolysis of the resulting
        alcohol in a mixture of trifluoroacetic acid, sodium azide, and chloroform
        gave a mixture of cis- and trans-3-azido-3-phenylbicyclo[3.1.0]hexanes. LAH
        reduction of this crude mixture of azides afforded a 1:3.5 mixture of cis-
        and trans-3-phenyl-3-bicyclo[3.1.0]hexylamine, respectively, in 51% overall
        yield from the alcohol. Separation of the mixture of amines by column chromatography
        followed by cyclization of each by heating at 60 degrees C in DMF solution
        with 1 equiv of 1,5-dibromopentane furnished the two conformationally restrained
        analogues of phencyclidine (PCP), cis- and trans-3-phenyl-3-piperidinylbicyclo[3.1.0]hexane
        (1 and 2, respectively), in high yield. Configurations were assigned on the
        basis of an X-ray crystallographic analysis of the cis isomer (1). Bond lengths
        and angles are similar to those found in PCP and its derivatives. Binding
        to PCP receptors and sigma sites as well as behavioral effects of 1 and 2
        in rats was determined relative to PCP. In displacement of specifically bound
        [3H]TCP (1-[1-(2-thienyl)cyclohexyl]piperidine) from PCP receptors, 1 and
        2 were nearly equipotent and about one-seventh as potent as PCP. These compounds
        were about one-fifth as potent as PCP in displacing [3H]-(+)-SKF 10,047 from
        its binding site. Calculation of the ED50 values of 1 and 2 for stereotyped
        behavior and ataxia indicated that they were about equipotent, and 2-3-fold
        less active than PCP.\", \"authors\": \"de Costa BR, George C, Burke TR, Rafferty
        MF, Contreras PC, Mick SJ, Jacobson AE, Rice KC.\", \"chembl_release\": {\"chembl_release\":
        \"CHEMBL_1\", \"creation_date\": \"2009-09-03\"}, \"contact\": null, \"doc_type\":
        \"PUBLICATION\", \"document_chembl_id\": \"CHEMBL1124177\", \"doi\": \"10.1021/jm00403a014\",
        \"doi_chembl\": null, \"first_page\": \"1571\", \"issue\": \"8\", \"journal\":
        \"J Med Chem\", \"journal_full_title\": \"Journal of medicinal chemistry.\",
        \"last_page\": \"1575\", \"patent_id\": null, \"pubmed_id\": 3397994, \"src_id\":
        1, \"title\": \"Synthesis, configuration, and evaluation of two conformationally
        restrained analogues of phencyclidine.\", \"volume\": \"31\", \"year\": 1988},
        {\"abstract\": \"The cis and trans enantiomers of the 1-(1-methylcyclohexyl)piperidines
        were prepared from either 3(R)- or 3(S)-methylcyclohexanone through the Bruylents
        reaction or a modified azide route, respectively. Separation of the intermediate
        amines 5 and 6 was achieved through chromatography or selective crystallization
        of a fumarate salt. The cis isomer 2b had about one-third of the affinity
        of phencyclidine for the PCP receptor. The other isomers were less potent.
        There was a 40-fold difference between the binding affinity of the cis enantiomers
        2a and 2b and a fourfold difference between the affinities of the trans enantiomers
        1a and 1b. None of the compounds antagonized the stereotypy induced by phencyclidine
        in the rotorod assay in mice, after intraperitoneal introduction.\", \"authors\":
        \"Thurkauf A, Hillery P, Mattson MV, Jacobson AE, Rice KC.\", \"chembl_release\":
        {\"chembl_release\": \"CHEMBL_1\", \"creation_date\": \"2009-09-03\"}, \"contact\":
        null, \"doc_type\": \"PUBLICATION\", \"document_chembl_id\": \"CHEMBL1124274\",
        \"doi\": \"10.1021/jm00403a023\", \"doi_chembl\": null, \"first_page\": \"1625\",
        \"issue\": \"8\", \"journal\": \"J Med Chem\", \"journal_full_title\": \"Journal
        of medicinal chemistry.\", \"last_page\": \"1628\", \"patent_id\": null, \"pubmed_id\":
        2840502, \"src_id\": 1, \"title\": \"Synthesis, pharmacological action, and
        receptor binding affinity of the enantiomeric 1-(1-phenyl-3-methylcyclohexyl)piperidines.\",
        \"volume\": \"31\", \"year\": 1988}, {\"abstract\": \"Peptide retro-inverso
        modification was applied to the complete hydroxamate inhibitors of the three
        zinc metallopeptidases (neutral endopeptidase 24-11 (NEP, EC 3.4.24.11), aminopeptidase
        N (APN, EC 3.4.11.2), and a dipeptidylaminopeptidase (DAP) involved in the
        in vitro enkephalin degradation by brain tissues. Compounds corresponding
        to the general formula RN(OH)CO(CH2)nCH(CH2Ph)NHCOCH(R')COOH (n = 0, 1) were
        synthesized. In the first series of inhibitors (n = 0), the \\\"retro-inverso\\\"
        modification induced a large decrease in inhibitory potency for NEP as compared
        to that of the parent compounds. In contrast, the presence of a methylene
        group between the hydroxamate and CH alpha in the second series (n = 1) led
        to derivatives with inhibitory potencies in the nanomolar range, similar to
        their analogues with a natural amide bond. On the other hand, the retro-inverso
        modification led to a slight improvement in the inhibition of DAP and APN,
        in the first series of inhibitors, while the inverse result occurred in the
        second series. Thus, compounds containing an alpha-amino acid moiety in P'1
        position behave as weak inhibitors of the three enzymes, with IC50 values
        in the micromolar range, and compounds bearing a beta-amino acid moiety in
        the same position are more specific than the parent compounds for NEP inhibition.\",
        \"authors\": \"Hernandez JF, Soleilhac JM, Roques BP, Fourni\xE9-Zaluski MC.\",
        \"chembl_release\": {\"chembl_release\": \"CHEMBL_1\", \"creation_date\":
        \"2009-09-03\"}, \"contact\": null, \"doc_type\": \"PUBLICATION\", \"document_chembl_id\":
        \"CHEMBL1124208\", \"doi\": \"10.1021/jm00117a025\", \"doi_chembl\": null,
        \"first_page\": \"1825\", \"issue\": \"9\", \"journal\": \"J Med Chem\", \"journal_full_title\":
        \"Journal of medicinal chemistry.\", \"last_page\": \"1831\", \"patent_id\":
        null, \"pubmed_id\": 2900898, \"src_id\": 1, \"title\": \"Retro-inverso concept
        applied to the complete inhibitors of enkephalin-degrading enzymes.\", \"volume\":
        \"31\", \"year\": 1988}, {\"abstract\": \"A series of renin inhibitors containing
        the dipeptide transition state mimics (2S,4S,5S)-5-amino-4-hydroxy-2-isopropyl-7-methyloctanoic
        acid (Leu (OH)/Val) and (2S,4S,5S)-5-amino-4-hydroxy-2-isopropyl-6-cyclohexylhexanoic
        acid (CHa /(OH)/Val) was prepared. A structure-activity study with Boc-Phe-His-Leu
        (OH)/Val-Ile-His-NH2 (8a) as starting material led to N-[(2S)-2-[(tert-butylsulfonyl)methyl]-3-phenylpropionyl]-His-Cha
        (OH)/ Val- NHC4H9-n (8i) which has the length of a tetrapeptide and contains
        only one natural amino acid. Compound 8i had an IC50 of 2 x 10(-9) M against
        human renin and showed high enzyme specificity; IC50 values against the related
        aspartic proteinases pepsin and cathepsin D were (8 x 10(-6) and 3 x 10(-6)
        M, respectively). In salt-depleted marmosets, 8i inhibited plasma renin activity
        PRA and lowered blood pressure for up to 2 h after oral administration of
        a dose of 10 mg/kg.\", \"authors\": \"B\xFChlmayer P, Caselli A, Fuhrer W,
        G\xF6schke R, Rasetti V, R\xFCeger H, Stanton JL, Criscione L, Wood JM.\",
        \"chembl_release\": {\"chembl_release\": \"CHEMBL_1\", \"creation_date\":
        \"2009-09-03\"}, \"contact\": null, \"doc_type\": \"PUBLICATION\", \"document_chembl_id\":
        \"CHEMBL1124210\", \"doi\": \"10.1021/jm00117a027\", \"doi_chembl\": null,
        \"first_page\": \"1839\", \"issue\": \"9\", \"journal\": \"J Med Chem\", \"journal_full_title\":
        \"Journal of medicinal chemistry.\", \"last_page\": \"1846\", \"patent_id\":
        null, \"pubmed_id\": 3137345, \"src_id\": 1, \"title\": \"Synthesis and biological
        activity of some transition-state inhibitors of human renin.\", \"volume\":
        \"31\", \"year\": 1988}], \"page_meta\": {\"limit\": 100, \"next\": null,
        \"offset\": 0, \"previous\": null, \"total_count\": 10}}"
