        "pubmed_id": 3968684, "src_id": 1, "title": "Analogues of aminoglutethimide:
        selective inhibition of aromatase.", "volume": "28", "year": 1985}, {"abstract":
        "Bivalent ligands containing the oxymorphamine or naltrexamine pharmacophores
        connected to spacers of varying length were synthesized and evaluated for
        their selectivity at mu, kappa, and delta opioid receptors. The oxymorphamine
        bivalent ligands (1-8) behaved as mu agonists on the electrically stimulated
        guinea pig ileum longitudinal muscle preparation (GPI). The spacer that conferred
        peak agonist activity in these series contains a total of four glycyl units
        (n = 2). Binding studies with guinea pig brain membranes showed a qualitatively
        similar profile at mu receptors as a function of spacer length. Also, delta
        receptor selectivity increased as the spacer was lengthened. The naltrexamine
        bivalent ligands (9-13) effectively antagonized the mu receptor agonist morphine
        in the GPI at the same optimal spacer length (n = 2) as in the agonist series.
