        in which the aminophenyl substituent is replaced by pyridyl or substituted
        pyridyl. The 4-pyridyl analogue 5 [3-ethyl-3-(4-pyridyl)-piperidine-2,6-dione]
        is a strong competitive inhibitor of aromatase (Ki = 1.1 microM; value for
        1, 0.60 microM), which exhibits a type II difference spectrum (Ks = 0.28 microM;
        value for 1, 0.13 microM) but is noninhibitory toward desmolase. The 2- and
        3-pyridyl analogues (3 and 4) inhibit neither enzyme system. 1-Amino-3-ethyl-3-phenylpiperidine-2,6-dione
        (2) is a strong and selective inhibitor of desmolase but the 4-pyridyl analogue
        10 [1-amino-3-ethyl-3-(4-pyridyl)-piperidine-2,6-dione] is a weak inhibitor
        of desmolase and aromatase. Analogues of 5 having a less basic aromatic substituent,
        namely, the N-oxide 11 and the 2,3,5,6-tetrafluoro derivative 13, were also
        prepared. The latter is a weak inhibitor of aromatase and the former inhibits
        neither enzyme system.", "authors": "Foster AB, Jarman M, Leung CS, Rowlands
        MG, Taylor GN, Plevey RG, Sampson P.", "chembl_release": {"chembl_release":
        "CHEMBL_1", "creation_date": "2009-09-03"}, "contact": null, "doc_type": "PUBLICATION",
        "document_chembl_id": "CHEMBL1123108", "doi": "10.1021/jm00380a009", "doi_chembl":
