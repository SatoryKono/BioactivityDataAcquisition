        "pubmed_id": 2409281, "src_id": 1, "title": "10-Ketonaltrexone and 10-ketooxymorphone.",
        "volume": "28", "year": 1985}, {"abstract": "A set of 56 8-phenylxanthines,
        previously tested for adenosine antagonism (adenosine A1 receptor affinity),
