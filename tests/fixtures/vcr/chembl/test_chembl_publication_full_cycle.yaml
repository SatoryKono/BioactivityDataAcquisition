        "src_id": 1, "title": "Aromatase inhibitors. Synthesis and evaluation of mammary
        tumor inhibiting activity of 3-alkylated 3-(4-aminophenyl)piperidine-2,6-diones.",
        "volume": "29", "year": 1986}, {"abstract": "The preparation of a series of
        2-(1H-imidazol-1-ylmethyl)-substituted carboxylic acids of benzo[b]furan,
        benzo-[b]thiophene, indole, and naphthalene is described. All compounds showed
        a similar level of activity as TxA2 synthetase inhibitors in vitro, having
