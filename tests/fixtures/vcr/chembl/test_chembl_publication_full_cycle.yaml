        the same rank-order affinities at delta receptors as the opioid activities
        in the GPI and in mice. However, mu binding exhibited no relationship with
        activity. These results are consistent with the simultaneous occupation of
        mu and delta by a single bivalent ligand 1, but they are also in harmony with
