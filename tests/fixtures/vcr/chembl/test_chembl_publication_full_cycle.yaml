        "journal": "J Med Chem", "journal_full_title": "Journal of medicinal chemistry.",
        "last_page": "880", "patent_id": null, "pubmed_id": 7108907, "src_id": 1,
        "title": "10-Propargylaminopterin and alkyl homologues of methotrexate as
        inhibitors of folate metabolism.", "volume": "25", "year": 1982}, {"abstract":
        "A fluorinated derivative of the benzomorphan opiate agonist phenazocine,
        (+/-)-5,9 alpha-dimethyl-2-[2-(4-fluorophenyl)ethyl]-2''-hydroxy-6, 7-benzomorphan
        (fluorophen), was prepared by N-acylation of (+/-)-5,9 alpha-dimethyl-2''-hydroxybenzomorphan
        with (p-fluorophenyl)acetyl chloride, followed by diborane reduction of the
        resulting amide. Fluorination produces only a twofold opiate receptor affinity
        loss when measured either by bioassay or receptor binding (selectivity mu
        congruent to delta greater than kappa). Labeled with 18F, fluorophen should
        be sufficiently potent to be useful as an in vivo probe for visualizing opiate
        receptors by positron emission transaxial tomography (PETT).", "authors":
        "Rice KC, Konicki PE, Quirion R, Burke TR, Pert CB.", "chembl_release": {"chembl_release":
        "CHEMBL_1", "creation_date": "2009-09-03"}, "contact": null, "doc_type": "PUBLICATION",
        "document_chembl_id": "CHEMBL1122397", "doi": "10.1021/jm00365a017", "doi_chembl":
        null, "first_page": "1643", "issue": "11", "journal": "J Med Chem", "journal_full_title":
        "Journal of medicinal chemistry.", "last_page": "1645", "patent_id": null,
        "pubmed_id": 6313921, "src_id": 1, "title": "Synthesis and pharmacological
        characterization of (+/-)-5,9 alpha-dimethyl-2-[2-(4-fluorophenyl)ethyl]-2''-hydroxy-6,7-benzomorphan
        (fluorophen), a ligand suitable for visualization of opiate receptors in vivo.",
        "volume": "26", "year": 1983}, {"abstract": "Two series of compounds related
        to cimetidine and tiotidine were synthesized as part of a study to evaluate
        the importance of conformational parameters in binding at histamine H2 receptors.
        The flexible methylthioethyl connecting chain was replaced by a conformationally
        restricting phenylene unit. These compounds were evaluated for antagonism
        of the dimaprit-stimulated chronotropic response in the guinea pig atrium
        and inhibition of histamine stimulated secretion of gastric acid in the dog.
        In both series, biological activity is markedly dependent on the m-phenylene
        regioisomers. Histamine H2-receptor activity is retained in both series; however,
        in the tiotidine series, gastric antisecretory activity is significantly improved.
        Regardless of the end group, N-cyanoguanidine 1,1-diamino-2-nitroethene or
        3,4-diamino-1,2,5-thiadiazole 1-oxide, each 3 3-(2-guanidino-4-thiazolyl)phenyl
        analogue was ca. 8 and 90 times more potent intravenously than tiotidine and
        cimetidine, respectively. The electronic influences of the phenylene unit
        on biological activity were also evaluated. It was concluded that the geometric
        constraints imposed by the m-phenylene connecting element were more important
        than electronic factors in binding events at the histamine H2 receptor.",
        "authors": "Hoffman JM, Pietruszkiewicz AM, Habecker CN, Phillips BT, Bolhofer
        WA, Cragoe EJ, Torchiana ML, Lumma WC, Baldwin JJ.", "chembl_release": {"chembl_release":
        "CHEMBL_1", "creation_date": "2009-09-03"}, "contact": null, "doc_type": "PUBLICATION",
        "document_chembl_id": "CHEMBL1122439", "doi": "10.1021/jm00356a005", "doi_chembl":
        null, "first_page": "140", "issue": "2", "journal": "J Med Chem", "journal_full_title":
        "Journal of medicinal chemistry.", "last_page": "144", "patent_id": null,
        "pubmed_id": 6131129, "src_id": 1, "title": "Conformational requirements for
        histamine H2-receptor inhibitors: a structure-activity study of phenylene
        analogues related to cimetidine and tiotidine.", "volume": "26", "year": 1983},
        {"abstract": "A close analogue of the antileukemic agent 5,8-dideaza-N10 propargylfolic
        acid (2) was synthesized by replacing the propargyl moiety of 2 with a cyanomethyl
        group. This compound, N10-(cyanomethyl)-5,8-dideazafolic acid (3), was evaluated
        for its antifolate and antitumor activities in several biological test systems.
        Alkylation of diethyl N-(4-aminobenzoyl)-L-glutamate with bromoacetonitrile
        gave diethyl N-[4-[(cyanomethyl)amino]benzoyl]-L-glutamate (7). Reaction of
        7 with 2 amino-6-(bromomethyl)-4-hydroxyquinazoline (9) in dimethylacetamide
        gave the corresponding diethyl ester 11, which was hydrolyzed to the target
        compound 3. The known antileukemic agent 2 was also synthesized for comparative
        studies by employing a modified procedure, which resulted in a better yield
        of this product. Both compounds 2 and 3 were evaluated for their antifolate
        activities by using two folate-requiring microorganisms, Streptococcus faecium
        and Lactobacillus casei. They were further evaluated as inhibitors of thymidylate
        synthase and dihydrofolate reductase derived from the above organisms, as
        well as for their antitumor activity by using selected tumor cells in culture.
        Compound 2 was found to be as equally potent as methotrexate (MTX) against
        S. faecium, and it was an excellent inhibitor of L. casei thymidylate synthase.
        The cyanomethyl analogue 3 was less active than 2 in all the test systems,
        except the inhibition of dihydrofolate reductase.", "authors": "Nair MG, Salter
        DC, Kisliuk RL, Gaumont Y, North G, Sirotnak FM.", "chembl_release": {"chembl_release":
        "CHEMBL_1", "creation_date": "2009-09-03"}, "contact": null, "doc_type": "PUBLICATION",
        "document_chembl_id": "CHEMBL1122470", "doi": "10.1021/jm00358a030", "doi_chembl":
        null, "first_page": "605", "issue": "4", "journal": "J Med Chem", "journal_full_title":
        "Journal of medicinal chemistry.", "last_page": "607", "patent_id": null,
        "pubmed_id": 6403710, "src_id": 1, "title": "Folate analogues. 21. Synthesis
        and antifolate and antitumor activities of N10-(cyanomethyl)-5,8-dideazafolic
        acid.", "volume": "26", "year": 1983}, {"abstract": "The synthesis of two
        thiophene-containing analogues of mianserin, i.e., 1,2,3,4,10,13b-hexahydro-2-methylpiperazino[1,2-a]thieno[2,
        3-c][1]benzazepine (2), and the corresponding [3,2-c] isomer (12) is described.
        The key step in the synthesis is the nucleophilic aromatic substitution reaction
        of the N-lithio derivative of 1-methyl-3-(2-thienyl)piperazine (4) with the
        oxazoline derivative of o-anisic acid (7) to give the N-phenylpiperazine 8.
        This substance was converted via ethyl ester 10 to 1-[2-(hydroxymethyl)phenyl]-4-methyl-2-(2-thienyl)piperazine
        (3), which was cyclized with polyphosphate ester to a 5:1 mixture of 2 and
        12. The antidepressant potential of 2 maleate (CGS 11049A) and 12 fumarate
        (CGS 15413A) were compared with that of mianserin hydrochloride in a variety
        of biochemical and pharmacological test systems. The three substances exhibited
        generally similar profiles. However, the results suggest that 2 and 12 bind
        more strongly to central presynaptic alpha-receptors than does mianserin.",
        "authors": "Watthey JW, Gavin T, Desai M, Finn BM, Rodebaugh RK, Patt SL.",
        "chembl_release": {"chembl_release": "CHEMBL_1", "creation_date": "2009-09-03"},
        "contact": null, "doc_type": "PUBLICATION", "document_chembl_id": "CHEMBL1122264",
        "doi": "10.1021/jm00362a006", "doi_chembl": null, "first_page": "1116", "issue":
        "8", "journal": "J Med Chem", "journal_full_title": "Journal of medicinal
        chemistry.", "last_page": "1122", "patent_id": null, "pubmed_id": 6192241,
        "src_id": 1, "title": "Synthesis and biological properties of thiophene ring
        analogues of mianserin.", "volume": "26", "year": 1983}, {"abstract": "The
        synthesis of N-(3-mercaptopropionyl)-N-arylglycines (14a-x),- N-arylalanines
        (15a,b),-N-cycloalkylglycines (16a-k), and -1,2,3,4-tetrahydroisoquinoline-3-carboxylic
        acids (17a-d), -1,2,3,4-tetrahydroquinoline-2-carboxylic acids (18a-f), and
        -indoline-2-carboxylic acids (19a-k) is described. In vitro inhibition of
        angiotensin converting enzyme (ACE) is reported for each compound, and the
        structure--activity relationship for each series is discussed. The in vivo
        inhibition of ACE and antihypertensive effects of representative compounds
        from each series are discussed. The most potent compound, 19d, had an in vitro
        ACE IC50 of 2.6 X 10(-9) M and lowered blood pressure in spontaneous hypertensive
        rats 85 mm at a dose of 10 mg/kg po.", "authors": "Stanton JL, Gruenfeld N,
        Babiarz JE, Ackerman MH, Friedmann RC, Yuan AM, Macchia W.", "chembl_release":
