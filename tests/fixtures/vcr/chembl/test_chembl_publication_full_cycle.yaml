        receptor antagonist than theophylline, while 8-phenylcaffeine is only 2-3-fold
        more potent than caffeine. A p-hydroxyaryl substituent enhances the potency
        of 8-phenyltheophylline as an adenosine antagonist. p-Carboxy- and p-sulfoaryl
        substituents reduce potency of 8-phenyltheophylline, yielding water-soluble
        adenosine antagonists, which are some 2-5-fold more potent than theophylline
        at adenosine receptors. None of the 8-(substituted phenyl)theophyllines are
        particularly selective as antagonists toward A1- and A2-adenosine receptors.
        1,3-Dipropyl-8-phenylxanthine represents a potent and somewhat selective A1-receptor
