        a series of carboxy-substituted trimethoprim analogues.", "volume": "28",
        "year": 1985}, {"abstract": "A series of 8-(substituted phenyl) derivatives
        of theophylline and other 1,3-dialkylxanthines were evaluated for potency
        and selectivity as antagonists at A1- and A2-adenosine receptors in brain
        tissue. Theophylline has a similar potency (Ki = 14 microM) at both A1 and
