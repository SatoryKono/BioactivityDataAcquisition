        inhibitor 2,3-dihydro-6-fluorospiro[4H-1-benzopyran-4,4''-imidazolidine]-2'',5
        ''-dione was resolved into its enantiomers. Sorbinil, the S isomer, was found
        to be a better inhibitor of the enzyme in vitro and in vivo than the corresponding
        R isomer. X-ray data on sorbinil, which were used to determine its absolute
        configuration, are presented. NMR studies of sorbinil in solution indicate
        the existence of two conformers with a low energy barrier for interconversion.",
        "authors": "Sarges R, Bordner J, Dominy BW, Peterson MJ, Whipple EB.", "chembl_release":
        {"chembl_release": "CHEMBL_1", "creation_date": "2009-09-03"}, "contact":
