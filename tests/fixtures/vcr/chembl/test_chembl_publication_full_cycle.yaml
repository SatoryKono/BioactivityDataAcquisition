      string: '{"documents": [{"abstract": "A variety of N-substituted (mercaptoalkanoyl)-
        and [(acylthio)alkanoyl]glycine derivatives was synthesized and their ability
        in inhibiting the activity of angiotensin-converting enzyme (ACE) was examined
        in vitro and in vivo. The acylthio derivatives prepared are assumed to act
        as prodrugs since they are much less active than the corresponding free SH
        compounds in vitro and can be expected to act in vivo only after conversion
        to the free sulfhydryl compounds. A number of these compounds are potent ACE
        inhibitors that lowered blood pressure in Na-deficient, conscious spontaneously
        hypertensive rats (SHR), a high renin model. One of the most active members
        of the series was (S)-N-cyclopentyl-N-[3-[(2,2-dimethyl-1-oxopropyl)thio]-2-methyl-1
        -oxopropyl]glycine (REV 3659-(S), pivopril). Structure-activity relationships
