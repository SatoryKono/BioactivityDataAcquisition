        of medicinal chemistry.", "last_page": "1650", "patent_id": null, "pubmed_id":
        3091830, "src_id": 1, "title": "Selective thromboxane synthetase inhibitors.
        4. 2-(1H-imidazol-1-ylmethyl) carboxylic acids of benzo[b]furan, benzo[b]thiophene,
        indole, and naphthalene.", "volume": "29", "year": 1986}, {"abstract": "The
        synthesis of the 5,10-methylene analogue of 5,6,7,8-tetrahydro-8,10-dideazaminopterin,
        a potential dual inhibitor of dihydrofolate reductase (DHFR) and thymidylate
        synthase (TS) enzymes, is described. The dimethyl ester of 10-carboxy-4-amino-4-deoxy-8,10-dideazapteroic
        acid was converted to the tetrahydro derivative by hydrogenation. Thermally
        induced cyclization of the 10-carbomethoxy and the 5-NH groups afforded the
        5,10-carbonyl analogue. Reduction of the lactam with borane readily yielded
        the key 5,10-methylene-4-amino-4-deoxy-8,10-dideazatetrahydropteroic acid
        methyl ester. Saponification of the benzoate ester and coupling with L-glutamate
        concluded the synthesis. The title compound was a modest inhibitor of growth
        in folate-dependent bacteria. Streptococcus faecium and Lactobacillus casei,
        but inhibition of DHFR or TS derived from L. casei was poor. The compound
        was also a weak inhibitor of DHFR derived from L1210 murine leukemia and was
        a weak inhibitor of L1210 growth in culture.", "authors": "DeGraw JI, Colwell
        WT, Kisliuk RL, Gaumont Y, Sirotnak FM.", "chembl_release": {"chembl_release":
        "CHEMBL_1", "creation_date": "2009-09-03"}, "contact": null, "doc_type": "PUBLICATION",
        "document_chembl_id": "CHEMBL1123445", "doi": "10.1021/jm00159a039", "doi_chembl":
        null, "first_page": "1786", "issue": "9", "journal": "J Med Chem", "journal_full_title":
        "Journal of medicinal chemistry.", "last_page": "1789", "patent_id": null,
        "pubmed_id": 3091834, "src_id": 1, "title": "Synthesis and antifolate properties
        of 5,10-methylenetetrahydro-8,10-dideazaminopterin.", "volume": "29", "year":
        1986}, {"abstract": "A series of dipeptide analogues of angiotensinogen have
        been prepared and evaluated for their ability to inhibit the aspartic proteinase
        renin. The compounds were derived from the renin substrate by replacing the
        scissile amide bond with a transition-state mimic and by incorporating bioisosteric
        replacements for the Val-10 amide bond. Analogue 21a exhibited an IC50 of
        7.6 nM against purified human renin, showed high specificity for this enzyme,
        and produced a hypotensive response in anesthetized, salt-depleted cynomolgus
        monkeys.", "authors": "Bolis G, Fung AK, Greer J, Kleinert HD, Marcotte PA,
        Perun TJ, Plattner JJ, Stein HH.", "chembl_release": {"chembl_release": "CHEMBL_1",
        "creation_date": "2009-09-03"}, "contact": null, "doc_type": "PUBLICATION",
        "document_chembl_id": "CHEMBL1123605", "doi": "10.1021/jm00393a008", "doi_chembl":
        null, "first_page": "1729", "issue": "10", "journal": "J Med Chem", "journal_full_title":
        "Journal of medicinal chemistry.", "last_page": "1737", "patent_id": null,
        "pubmed_id": 3309313, "src_id": 1, "title": "Renin inhibitors. Dipeptide analogues
        of angiotensinogen incorporating transition-state, nonpeptidic replacements
        at the scissile bond.", "volume": "30", "year": 1987}, {"abstract": "alpha-[6-[[(S)-1-(Ethoxycarbonyl)-3-phenylpropyl]amino]-5-oxoperhydro
        -1,4-thiazepin-4-yl]acetic acids (monoester monoacids) and their dicarboxylic
        acids having the hydrophobic substituents at the 2- or 3-position of the thiazepinone
        ring were prepared and assayed for angiotensin-converting enzyme (ACE) inhibitory
        activity. The dicarboxylic acids having the pseudoequatorial amino groups
        at the 6-position and the pseudoequatorial hydrophobic substituents at the
        2- or 3-position of the chair conformation of the thiazepinone ring had potent
        in vitro inhibitory activity. The monoester monoacids having the hydrophobic
        substituents at the 2-position suppressed pressor response to angiotensin
        I for a longer duration than those having the substituents at the 3-position
        when administered orally. The structure-activity relationship was studied
        by conformational energy calculations of the thiazepinone ring.", "authors":
        "Yanagisawa H, Ishihara S, Ando A, Kanazaki T, Miyamoto S, Koike H, Iijima
