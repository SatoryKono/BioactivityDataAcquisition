        adenosine receptors of rat brain and fat cells and at A2 adenosine receptors
        of rat pheochromocytoma PC12 cells and human platelets are compared. An 8-phenyl
        substituent has little effect on the activity of caffeine or 1,3-dipropyl-7-methylxanthine
        at adenosine receptors, while markedly increasing activity of theophylline,
        1,3-dipropylxanthine, 1-isoamyl-3-isobutylxanthine, 1-methylxanthine, and
        3-propylxanthine. 8-Phenyl-1-propylxanthine is potent (Ki = 20-70 nM) at all
        receptors. A p-carboxy or p-sulfo substituent, which is introduced on the
        8-phenyl ring to increase water solubility, in most cases decreases the activity
        and selectivity for the A1 receptor. Among the 8-p-sulfo analogues, only 8-(p-sulfophenyl)theophylline
        and 1,3-dipropyl-8-(p-sulfophenyl)xanthine are selective for the A1 receptors.
        8-p-Sulfophenyl derivatives of caffeine, 1,3-dipropyl-7-methylxanthine, and
        3-propylxanthine are somewhat selective for the A2 receptors. 8-Cycloalkyl
        substituents (cyclopentyl, cyclohexyl) markedly increase activity of caffeine
        and 1,3-dipropyl-7-methylxanthine at the A2 receptor. 8-Cyclohexylcaffeine
        is potent (Ki = 190 nM) and very selective for the human platelet A2 receptors,
        but is not as selective for the rat PC12 cell A2 receptor. Such A2 selectivity
        is in contrast to the marked A1 selectivity of 8-cycloalkyltheophyllines and
        8-cycloalkyl-1,3-dipropulxanthines. The apparent selectivity of certain xanthines
