  response:
    body:
      string: "{\"documents\": [{\"abstract\": \"Two isomeric iodinated analogues
        of the peripheral benzodiazepine binding site (PBS) ligand Ro5-4864 have been
        synthesized and labeled in high specific activity with iodine-125. Competitive
        binding assays conducted with the unlabeled analogues indicate high affinity
        for PBS. Tissue biodistribution studies in rats with these 125I-labeled ligands
        indicate high uptake of radioactivity in the adrenals, heart, and kidney--tissues
        known to have high concentrations of PBS. Preadministration of the potent
        PBS antagonist PK 11195 blocked in vivo uptake in adrenal tissue by over 75%,
        but to a lesser degree in other normal tissues. In vivo binding autoradiography
        in brain conducted in C6 glioma bearing rats showed dense, PBS-mediated accumulation
        of radioactivity in the tumor. Ligand 6 labeled with 123I may have potential
        for scintigraphic localization of intracranial glioma.\", \"authors\": \"Van
        Dort ME, Ciliax BJ, Gildersleeve DL, Sherman PS, Rosenspire KC, Young AB,
        Junck L, Wieland DM.\", \"chembl_release\": {\"chembl_release\": \"CHEMBL_1\",
        \"creation_date\": \"2009-09-03\"}, \"contact\": null, \"doc_type\": \"PUBLICATION\",
        \"document_chembl_id\": \"CHEMBL1123998\", \"doi\": \"10.1021/jm00119a005\",
        \"doi_chembl\": null, \"first_page\": \"2081\", \"issue\": \"11\", \"journal\":
        \"J Med Chem\", \"journal_full_title\": \"Journal of medicinal chemistry.\",
        \"last_page\": \"2086\", \"patent_id\": null, \"pubmed_id\": 2846836, \"src_id\":
        1, \"title\": \"Radioiodinated benzodiazepines: agents for mapping glial tumors.\",
        \"volume\": \"31\", \"year\": 1988}, {\"abstract\": \"The title compounds
        were prepared in extensions of a general synthetic approach used earlier to
        prepare 5-alkyl-5-deaza analogues of classical antifolates. Wittig condensation
        of 2,4-diaminopyrido[2,3-d]pyrimidine-6-carboxaldehyde (2a) and its 5-methyl
        analogue 2b with [4-(methoxycarbonyl)benzylidene] triphenylphosphorane gave
        9,10-ethenyl precursors 3a and 3b. Hydrogenation (DMF, ambient, 5% Pd/C) of
        the 9,10-ethenyl group of 3b followed by ester hydrolysis led to 4-[2-(2,4-diamino-5-methylpyrido[2,3-d]pyrimidin-6-yl)ethyl]ben
        zoi c acid (5), which was converted to 5-methyl-5,10-dideazaaminopterin (6)
        via coupling with dimethyl L-glutamate (mixed-anhydride method using i-BuOCOCl)
        followed by ester hydrolysis. Standard hydrolytic deamination of 6 gave 5-methyl-5,10-dideazafolic
        acid (7). Intermediates 3a and 3b were converted through concomitant deamination
        and ester hydrolysis to 8a and 8b. Peptide coupling of 8a,b (using (EtO)2POCN)
        with diesters of L-glutamic acid gave intermediate esters 9a and 9b. Hydrogenation
        of both the 9,10 double bond and the pyrido ring of 9a and 9b (MeOH-0.1 N
        HCl, 3.5 atm, Pt) was followed by ester hydrolysis to give 5,10-dideaza-5,6,7,8-tetrahydrofolic
        acid (11a) and the 5-methyl analogue 11b. Biological evaluation of 6, 7, 11a,
        and 11b for inhibition of dihydrofolate reductase (DHFR) isolated from L1210
        cells and for growth inhibition and transport characteristics toward L1210
        cells revealed 6 to be less potent than methotrexate in the inhibition of
        DHFR and cell growth. Compounds 6, 11a, and 11b were transported into cells
        more efficiently than methotrexate. Growth inhibition IC50 values for 11a
        and 11b were 57 and 490 nM, respectively; the value for 11a is in good agreement
        with that previously reported (20-50 nM). In tests against other folate-utilizing
        enzymes, 11a and 11b were found to be inhibitors of glycinamide ribonucleotide
        formyltransferase (GAR formyltransferase) from one bacterial (Lactobacillus
        casei) and two mammalian (Manca and L1210) sources with 11a being decidedly
        more inhibitory than 11b. Neither 11a nor 11b inhibited aminoimidazolecarboxamide
        ribonucleotide formyltransferase. These results support reported evidence
        that 11a owes its observed antitumor activity to interference with the purine
        de novo pathway with the site of action being GAR formyltransferase.\", \"authors\":
        \"Piper JR, McCaleb GS, Montgomery JA, Kisliuk RL, Gaumont Y, Thorndike J,
        Sirotnak FM.\", \"chembl_release\": {\"chembl_release\": \"CHEMBL_1\", \"creation_date\":
        \"2009-09-03\"}, \"contact\": null, \"doc_type\": \"PUBLICATION\", \"document_chembl_id\":
        \"CHEMBL1124008\", \"doi\": \"10.1021/jm00119a018\", \"doi_chembl\": null,
        \"first_page\": \"2164\", \"issue\": \"11\", \"journal\": \"J Med Chem\",
        \"journal_full_title\": \"Journal of medicinal chemistry.\", \"last_page\":
        \"2169\", \"patent_id\": null, \"pubmed_id\": 3184124, \"src_id\": 1, \"title\":
        \"Synthesis and antifolate activity of 5-methyl-5,10-dideaza analogues of
        aminopterin and folic acid and an alternative synthesis of 5,10-dideazatetrahydrofolic
        acid, a potent inhibitor of glycinamide ribonucleotide formyltransferase.\",
        \"volume\": \"31\", \"year\": 1988}, {\"abstract\": \"(-)-N1-Benzylnorphysostigmine
        (4), prepared from synthetic (-)-O-methyl-N1-noreseroline (1) by N-benzylation,
        ether cleavage, and reaction of (-)-N1-benzylnoreseroline (3) with methyl
        isocyanate, was the intermediate used to prepare the title compounds. Catalytic
        debenzylation of 4 afforded (-)-N1-norphysostigmine (5), and (-)-eseramine
        (6) was obtained by reaction of 5 with methyl isocyanate. Reductive N-methylation
        of 5 gave (-)-physostigmine (9) while reaction of 5 with allyl bromide and
        phenethyl bromide afforded carbamates 7 and 8, respectively. Data on the in
        vitro potencies (IC50) and activities of certain of these compounds (4-8)
        as inhibitors of electric eel acetyl cholinesterase are reported. (-)-N1-Norphysostigmine
        (5) was found to be similarly potent against AChE as (-)-physostigmine (9).\",
        \"authors\": \"Yu QS, Atack JR, Rapoport SI, Brossi A.\", \"chembl_release\":
        {\"chembl_release\": \"CHEMBL_1\", \"creation_date\": \"2009-09-03\"}, \"contact\":
        null, \"doc_type\": \"PUBLICATION\", \"document_chembl_id\": \"CHEMBL1124019\",
        \"doi\": \"10.1021/jm00120a008\", \"doi_chembl\": null, \"first_page\": \"2297\",
        \"issue\": \"12\", \"journal\": \"J Med Chem\", \"journal_full_title\": \"Journal
        of medicinal chemistry.\", \"last_page\": \"2300\", \"patent_id\": null, \"pubmed_id\":
        3193422, \"src_id\": 1, \"title\": \"Synthesis and anticholinesterase activity
        of (-)-N1-norphysostigmine, (-)-eseramine, and other N(1)-substituted analogues
        of (-)-physostigmine.\", \"volume\": \"31\", \"year\": 1988}, {\"abstract\":
        \"alpha-[(3S)-3-[[(S)-1-(Ethoxycarbonyl)-3-phenylpropyl]amino]-2-oxo-6 or
        7-phenylperhydroazepin-1-yl]acetic acids (monoester monoacids) and their dicarboxylic
        acids were synthesized, and their angiotensin-converting enzyme (ACE) inhibitory
        activities were evaluated. The dicarboxylic acids having phenyl substituents
        at the 6R, 6S, and 7S positions on the azepinone ring showed potent inhibition
        in vitro. The corresponding monoester monoacids, when administered orally,
        suppressed the pressor response to angiotensin I administered intravenously.
        The monoester monoacids having the phenyl substituent at the 6-position showed
        a longer duration of action than one having the substituent at the 7-position.
        The structure-activity relationship was studied on the basis of the conformational
        energy calculation.\", \"authors\": \"Yanagisawa H, Ishihara S, Ando A, Kanazaki
        T, Miyamoto S, Koike H, Iijima Y, Oizumi K, Matsushita Y, Hata T.\", \"chembl_release\":
        {\"chembl_release\": \"CHEMBL_1\", \"creation_date\": \"2009-09-03\"}, \"contact\":
        null, \"doc_type\": \"PUBLICATION\", \"document_chembl_id\": \"CHEMBL1124039\",
        \"doi\": \"10.1021/jm00397a027\", \"doi_chembl\": null, \"first_page\": \"422\",
        \"issue\": \"2\", \"journal\": \"J Med Chem\", \"journal_full_title\": \"Journal
        of medicinal chemistry.\", \"last_page\": \"428\", \"patent_id\": null, \"pubmed_id\":
        3339612, \"src_id\": 1, \"title\": \"Angiotensin-converting enzyme inhibitors.
        2. Perhydroazepin-2-one derivatives.\", \"volume\": \"31\", \"year\": 1988},
        {\"abstract\": \"A series of 8-phenylxanthine derivatives has been synthesized
        with oxyacetic acid on the para phenyl position to increase aqueous solubility
        and minimize nonspecific binding and iodinatable groups on the 1- or 3-position
        of the xanthine ring. The structure-activity relationship for binding of these
        compounds to A1 adenosine receptors of bovine and rat brain and A2 receptors
        of human platelets was examined. The addition of arylamine or photosensitive
        aryl azide groups to the 3-position of xanthine had little effect on A1 binding
        affinity with or without iodination, whereas substitutions at the 1-position
        caused greatly reduced A1 binding affinity. The addition of an aminobenzyl
        group to the 3-position of the xanthine had little effect on A2 binding affinity,
        but 3-aminophenethyl substitution decreased A2 binding affinity. Two acidic
        3-(arylamino)-8-phenylxanthine derivatives were labeled with 125I and evaluated
        as A1 receptor radioligands. The new radioligands bound to A1 receptors with
        KD values of 1-1.25 nM. Specific binding represented over 80% of total binding.
        High concentrations of NaCl or other salts increased the binding affinity
        of acidic but not neutral antagonists, suggesting that interactions between
        ionized xanthines and receptors may be affected significantly by changes in
        ionic strength. On the basis of binding studies with these antagonists and
        isotope dilution with the agonist [125I]N6-(4-amino-3-iodobenzyl)adenosine,
        multiple agonist affinity states of A1 receptors have been identified.\",
        \"authors\": \"Linden J, Patel A, Earl CQ, Craig RH, Daluge SM.\", \"chembl_release\":
        {\"chembl_release\": \"CHEMBL_1\", \"creation_date\": \"2009-09-03\"}, \"contact\":
        null, \"doc_type\": \"PUBLICATION\", \"document_chembl_id\": \"CHEMBL1124076\",
        \"doi\": \"10.1021/jm00399a010\", \"doi_chembl\": null, \"first_page\": \"745\",
        \"issue\": \"4\", \"journal\": \"J Med Chem\", \"journal_full_title\": \"Journal
        of medicinal chemistry.\", \"last_page\": \"751\", \"patent_id\": null, \"pubmed_id\":
        3351850, \"src_id\": 1, \"title\": \"125I-labeled 8-phenylxanthine derivatives:
        antagonist radioligands for adenosine A1 receptors.\", \"volume\": \"31\",
        \"year\": 1988}, {\"abstract\": \"We have derivatized a series of 125I-labeled
        8-phenylxanthines with photoactive aryl azide groups on the 1- or 3-position
        of the xanthine ring. A 3-azidophenethyl derivative was found to be optimal
        for use as an antagonist photoaffinity label for adenosine A1 receptors. Following
        photoactivation, radioactivity was covalently and specifically incorporated
        into a 34,000-dalton and, to a lesser extent, into a 24,000-dalton polypeptide
        of rat brain membranes. Photoincorporation into both polypeptides was competitively
        inhibited by adenosine analogues with a potency order typical of adenosine
        A1 receptors, but the 24,000-dalton polypeptide bound both agonists and antagonists
        with lower affinity than the 34,000-dalton polypeptide. Specific photolabeling
        of receptors in brain membranes of rat, guinea pig, dog, and cow did not show
        any variation in the 34,000-dalton adenosine receptor binding subunit. The
        adenosine agonist photoaffinity label [125I]N6-(4-azido-3-iodobenzyl)adenosine
        also specifically photolabeled the 34,000-dalton polypeptide, but photoincorporation
        of the agonist was less efficient than the antagonist and, unlike the antagonist,
        was greatly reduced by guanosine 5'-(beta,gamma-imidotriphosphate). The results
        indicate that the antagonist photoaffinity label may be more useful than agonists
        particularly for labeling uncoupled receptors.\", \"authors\": \"Earl CQ,
        Patel A, Craig RH, Daluge SM, Linden J.\", \"chembl_release\": {\"chembl_release\":
        \"CHEMBL_1\", \"creation_date\": \"2009-09-03\"}, \"contact\": null, \"doc_type\":
        \"PUBLICATION\", \"document_chembl_id\": \"CHEMBL1124077\", \"doi\": \"10.1021/jm00399a011\",
        \"doi_chembl\": null, \"first_page\": \"752\", \"issue\": \"4\", \"journal\":
        \"J Med Chem\", \"journal_full_title\": \"Journal of medicinal chemistry.\",
        \"last_page\": \"756\", \"patent_id\": null, \"pubmed_id\": 3351851, \"src_id\":
        1, \"title\": \"Photoaffinity labeling adenosine A1 receptors with an antagonist
        125I-labeled aryl azide derivative of 8-phenylxanthine.\", \"volume\": \"31\",
        \"year\": 1988}, {\"abstract\": \"The synthesis of a series of N-(mercaptoacyl)-4-substituted-(S)-prolines
        (2 and 3) is described. These compounds were evaluated in vitro for inhibition
        of angiotensin-converting enzyme (ACE), and selected compounds were evaluated
        in vivo for ACE inhibition. The most potent compounds in vitro are 108, 109,
        111, 114, and 116, having relative potencies of 1.0, 1.0, 1.3, 1.1, and 2.6
        as compared to the potency of captopril. The most potent compounds in vivo
        intravenously are 108, 111, 114, 116, 117, and 97.\", \"authors\": \"Smith
        EM, Swiss GF, Neustadt BR, Gold EH, Sommer JA, Brown AD, Chiu PJ, Moran R,
        Sybertz EJ, Baum T.\", \"chembl_release\": {\"chembl_release\": \"CHEMBL_1\",
        \"creation_date\": \"2009-09-03\"}, \"contact\": null, \"doc_type\": \"PUBLICATION\",
        \"document_chembl_id\": \"CHEMBL1124094\", \"doi\": \"10.1021/jm00399a033\",
        \"doi_chembl\": null, \"first_page\": \"875\", \"issue\": \"4\", \"journal\":
        \"J Med Chem\", \"journal_full_title\": \"Journal of medicinal chemistry.\",
        \"last_page\": \"885\", \"patent_id\": null, \"pubmed_id\": 2832605, \"src_id\":
        1, \"title\": \"Synthesis and pharmacological activity of angiotensin converting
        enzyme inhibitors: N-(mercaptoacyl)-4-substituted-(S)-prolines.\", \"volume\":
        \"31\", \"year\": 1988}, {\"abstract\": \"In exploring the structural features
        responsible for the inhibitory activity of aminoglutethimide [3-(4-aminophenyl)-3-ethylpiperidine-2,6-dione]
        (1) toward the cholesterol side chain cleavage (CSCC) enzyme from bovine adrenals
        and the human placental aromatase enzyme, analogues have been synthesized
        in which the piperidine-2,6-dione ring is replaced by substituted or unsubstituted
        azabicyclo[3.1.0]hexane-2,4-dione rings. The unsubstituted analogue 1-(4-aminophenyl)-3-azabicyclo[3.1.0]hexane-2,4-dione
        (9a) is a slightly more potent inhibitor of aromatase than 1 (Ki = 1.2 microM,
        cf. 1.8 microM for 1) but is noninhibitory toward the CSCC enzyme. The substituted
        analogues 1-(4-aminophenyl)-3-butyl-3-azabicyclo[3.1.0]hexane-2,4-dione (9e)
        and 1-(4-aminophenyl)-3-pentyl-3-azabicyclo[3.1.0]hexane-2,4-dione (9f) are
        approximately 100 times more potent than 1 (Ki values of 1, 9e, and 9f are
        1.8, 0.015, and 0.02 microM, respectively) in inhibiting aromatase, with no
        significant activity toward the CSCC enzyme. Type II difference spectra were
        exhibited by 1, 9a, and 9f in their interaction with the aromatase enzyme
        (respective Ks values of 1, 9a, and 9f are 0.13, 0.08, and 0.01 microM). Modification
        of the para amino function by alkylation, its relocation, replacement by H,
        or replacement by a methyl, aldehyde, or secondary alcohol group produced
        analogues that were inactive toward both enzyme systems.\", \"authors\": \"Rowlands
        MG, Bunnett MA, Foster AB, Jarman M, Stanek J, Schweizer E.\", \"chembl_release\":
        {\"chembl_release\": \"CHEMBL_1\", \"creation_date\": \"2009-09-03\"}, \"contact\":
        null, \"doc_type\": \"PUBLICATION\", \"document_chembl_id\": \"CHEMBL1124116\",
        \"doi\": \"10.1021/jm00400a014\", \"doi_chembl\": null, \"first_page\": \"971\",
        \"issue\": \"5\", \"journal\": \"J Med Chem\", \"journal_full_title\": \"Journal
        of medicinal chemistry.\", \"last_page\": \"976\", \"patent_id\": null, \"pubmed_id\":
        3361583, \"src_id\": 1, \"title\": \"Analogues of aminoglutethimide based
        on 1-phenyl-3-azabicyclo[3.1.0]hexane-2,4-dione: selective inhibition of aromatase
        activity.\", \"volume\": \"31\", \"year\": 1988}, {\"abstract\": \"In a search
        for more selective A1 adenosine receptor agonists, N6-[(R)-(-)-1-methyl-2-phenethyl]-1-deazaadenosine
        (1-deaza-R-PIA, 3a), N6-cyclopentyl-1-deazaadenosine (1-deazaCPA, 3b), N6-cyclohexyl-1-deazaadenosine
        (1-deazaCHA, 3c), and the corresponding 2-chloro derivatives 2a-c were synthesized
        from 5,7-dichloro-3-beta-D-ribofuranosyl-3H-imidazo[4,5-b]pyridine. On the
        other hand, N-ethyl-1'-deoxy-1'-(1-deaza-6-amino-9H-purin-9-yl)-beta-D-ribofuranu
        ronamide (1-deazaNECA, 10) was prepared from 7-nitro-3-beta-D-ribofuranosyl-3H-imidazo[4,5-b]pyridine,
        in an attempt to find a more selective A2 agonist. The activity of all deaza
        analogues at adenosine receptors has been determined in adenylate cyclase
        and in radioligand binding studies. 1-DeazaNECA proved to be a nonselective
        agonist at both subtypes of the adenosine receptor. It is about 10-fold less
        active than NECA but clearly more active than the parent compound 1-deazaadenosine
        as an inhibitor of platelet aggregation and as a stimulator of cyclic AMP
        accumulation. The N6-substituted 1-deazaadenosines largely retain the A1 agonist
        activity of their parent compounds, but lose some of their A2 agonist activity.
        This results in A1-selective compounds, of which N6-cyclopentyl-2-chloro-1-deazaadenosine
        (1-deaza-2-Cl-CPA, 2b) was identified as the most selective agonist at A1
        adenosine receptors so far known. The activity of all 1-deaza analogues confirms
        that the presence of the nitrogen atom at position 1 of the purine ring is
        not critical for A1 receptor mediated adenosine actions.\", \"authors\": \"Cristalli
        G, Franchetti P, Grifantini M, Vittori S, Klotz KN, Lohse MJ.\", \"chembl_release\":
        {\"chembl_release\": \"CHEMBL_1\", \"creation_date\": \"2009-09-03\"}, \"contact\":
        null, \"doc_type\": \"PUBLICATION\", \"document_chembl_id\": \"CHEMBL1124132\",
        \"doi\": \"10.1021/jm00401a018\", \"doi_chembl\": null, \"first_page\": \"1179\",
        \"issue\": \"6\", \"journal\": \"J Med Chem\", \"journal_full_title\": \"Journal
        of medicinal chemistry.\", \"last_page\": \"1183\", \"patent_id\": null, \"pubmed_id\":
        3373486, \"src_id\": 1, \"title\": \"Adenosine receptor agonists: synthesis
        and biological evaluation of 1-deaza analogues of adenosine derivatives.\",
        \"volume\": \"31\", \"year\": 1988}, {\"abstract\": \"A number of S-methylsulfonium
        analogues of the conformationally restricted muscarinic agonists of the 3-alk-oxy-4,5,6,7-tetrahydroisoxazolo[4,5-c]pyridine
        (O-alkyl-THPO) type have been synthesized. The effects on muscarinic receptors
        of these 3-alkoxy-5-methyl-6,7-dihydro-4H-thiopyrano[3,4-d]isoxazol-5 -ium
        (O-alkyl-S-methyl-DHTO) analogues (7a-d) were assessed in receptor-binding
        experiments with tritiated oxotremorine M, pirenzepine, and quinuclidinyl
        benzilate as ligands and were supported by studies on the isolated guinea
        pig ileum. The degree of muscarinic agonist activity of the compounds (M-agonist
        index) and their selectivity for M-1 or M-2 muscarinic receptor subtypes (M-2/M-1
        index) were estimated on the basis of receptor-binding studies. The in vitro
        pharmacological profiles of the compounds were compared with those of arecoline
        and its sulfonium and 3-methoxyisoxazole isosteres, sulfoarecoline and O,5-dimethyl-THPO,
        respectively. While O-methyl-DHTO (5a) and N-methyl-DHTO (6a) were inactive,
        all of the sulfonium analogues 7a-d were muscarinic agonists with the exception
        of O-ethyl-S-methyl-DHTO (7b), which showed a muscarinic antagonist profile.\",
        \"authors\": \"Sauerberg P, Falch E, Meier E, Lemb\xF8l HL, Krogsgaard-Larsen
        P.\", \"chembl_release\": {\"chembl_release\": \"CHEMBL_1\", \"creation_date\":
        \"2009-09-03\"}, \"contact\": null, \"doc_type\": \"PUBLICATION\", \"document_chembl_id\":
        \"CHEMBL1124147\", \"doi\": \"10.1021/jm00402a010\", \"doi_chembl\": null,
        \"first_page\": \"1312\", \"issue\": \"7\", \"journal\": \"J Med Chem\", \"journal_full_title\":
        \"Journal of medicinal chemistry.\", \"last_page\": \"1316\", \"patent_id\":
        null, \"pubmed_id\": 3385727, \"src_id\": 1, \"title\": \"Heterocyclic muscarinic
        agonists. Synthesis and biological activity of some bicyclic sulfonium arecoline
        bioisosteres.\", \"volume\": \"31\", \"year\": 1988}], \"page_meta\": {\"limit\":
        100, \"next\": null, \"offset\": 0, \"previous\": null, \"total_count\": 10}}"
