        "journal": "J Med Chem", "journal_full_title": "Journal of medicinal chemistry.",
        "last_page": "658", "patent_id": null, "pubmed_id": 2918514, "src_id": 1,
        "title": "Effects of steroid D-ring modification on suicide inactivation and
        competitive inhibition of aromatase by analogues of androsta-1,4-diene-3,17-dione.",
        "volume": "32", "year": 1989}, {"abstract": "A series of 2-substituted octahydrobenzo[f]quinolines
        has been synthesized and assayed for dopamine agonist activity. Only the compounds
        corresponding to the beta-rotameric conformation of dopamine showed biphasic
        activity in competition binding studies with the radioligand [3H]spiroperidol.
        These findings suggest that the congeners possessing the beta-rotamer conformation
