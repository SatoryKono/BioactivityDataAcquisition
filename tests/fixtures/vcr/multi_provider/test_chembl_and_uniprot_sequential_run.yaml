  response:
    body:
      string: '{"page_meta": {"limit": 20, "next": null, "offset": 0, "previous":
        null, "total_count": 1}, "protein_classifications": [{"class_level": 4, "definition":
        "A sequence-related subfamily of ATP-BINDING CASSETTE TRANSPORTERS that actively
        transport organic substrates. Although considered organic anion transporters,
        a subset of proteins in this family have also been shown to convey drug resistance
        to neutral organic drugs. Their cellular function may have clinical significance
        for CHEMOTHERAPY in that they transport a variety of ANTINEOPLASTIC AGENTS.
        Overexpression of proteins in this class by NEOPLASMS is considered a possible
        mechanism in the development of multidrug resistance (DRUG RESISTANCE, MULTIPLE).
        Although similar in function to P-GLYCOPROTEINS, the proteins in this class
        share little sequence homology to the p-glycoprotein family of proteins. [MESH:D027425]",
        "parent_id": 1104, "pref_name": "ABCC subfamily", "protein_class_desc": "transporter  ntpase  atp
        binding cassette  mrp", "protein_class_id": 1133, "replaced_by": null, "short_name":
