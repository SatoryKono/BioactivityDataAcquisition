        the source to verify the license and copyright information for your use."},
        "fieldsOfStudy": ["Business", "Medicine"], "tldr": {"model": "tldr@v2.0.0",
        "text": "The main threats COVID-19 poses to food security are outlined and
        critical responses that policy-makers should consider to prevent this global
        health crisis from becoming a global food crisis are suggested."}, "publicationTypes":
        ["JournalArticle"], "publicationDate": "2020-07-30", "journal": {"name": "Science",
        "pages": "500 - 502", "volume": "369"}, "authors": [{"authorId": "2595976",
        "externalIds": {}, "hIndex": 29}, {"authorId": "66553495", "externalIds":
        {}, "hIndex": 38}, {"authorId": "2118815", "externalIds": {"DBLP": ["Jo Swinnen",
        "Johan Swinnen"]}, "hIndex": 69}, {"authorId": "71757890", "externalIds":
        {}, "hIndex": 26}], "abstract": "Economic fallout and food supply chain disruptions
        require attention from policy-makers As the COVID-19 pandemic progresses,
        trade-offs have emerged between the need to contain the virus and to avoid
        disastrous economic and food security crises that hurt the world''s poor and
        hungry most. Although no major food shortages have emerged as yet, agricultural
        and food markets are facing disruptions because of labor shortages created
        by restrictions on movements of people and shifts in food demand resulting
        from closures of restaurants and schools as well as from income losses. Export
        restrictions imposed by some countries have disrupted trade flows for staple
        foods such as wheat and rice. The pandemic is affecting all four pillars of
        food security (1): availability (is the supply of food adequate?), access
        (can people obtain the food they need?), utilization (do people have enough
        intake of nutrients?), and stability (can people access food at all times?).
        COVID-19 is most directly and severely impacting access to food, even though
        impacts are also felt through disruptions to availability; shifts in consumer
        demand toward cheaper, less nutritious foods; and food price instability.
        We outline the main threats COVID-19 poses to food security and suggest critical
        responses that policy-makers should consider to prevent this global health
        crisis from becoming a global food crisis."}, {"paperId": "c92465d07e93e35f6efcb23c79254f55bab8fddf",
