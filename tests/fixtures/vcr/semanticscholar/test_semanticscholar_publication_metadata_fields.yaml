  response:
    body:
      string: '[{"paperId": "024a2c03be8e468e7c4fdf9bda36cdc0eaae85fb", "externalIds": {"MAG": "3035965352", "PubMedCentral": "7759461", "DBLP": "journals/corr/abs-2006-10256", "ArXiv": "2006.10256", "DOI": "10.1038/s41586-020-2649-2", "CorpusId": 219792763, "PubMed": "32939066"}, "title": "Array programming with NumPy", "venue": "Nature", "year": 2020, "referenceCount": 90, "citationCount": 22810, "isOpenAccess": true, "openAccessPdf": {"url": "https://www.nature.com/articles/s41586-020-2649-2.pdf", "status": "HYBRID", "license": "CCBY", "disclaimer": "Notice: Paper or abstract available at https://arxiv.org/abs/2006.10256, which is subject to the license by the author or copyright owner provided with this content. Please go to the source to verify the license and copyright information for your use."}, "fieldsOfStudy": ["Computer Science", "Mathematics", "Medicine"], "tldr": {"model": "tldr@v2.0.0", "text": "How a few fundamental array concepts lead to a simple and powerful programming paradigm for organizing, exploring and analysing scientific data is reviewed and its evolution into a flexible interoperability layer between increasingly specialized computational libraries is discussed."}, "publicationTypes": ["Review", "JournalArticle"], "publicationDate": "2020-06-18", "journal": {"name": "Nature", "pages": "357 - 362", "volume": "585"}, "authors": [{"authorId": "2065073027", "externalIds": {}, "hIndex": 4}, {"authorId": "2061249", "externalIds": {"DBLP": ["K. Jarrod Millman"]}, "hIndex": 8}, {"authorId": "39888153", "externalIds": {"DBLP": ["St\u00e9fan van der Walt"]}, "hIndex": 2}, {"authorId": "3912995", "externalIds": {}, "hIndex": 12}, {"authorId": "2053486178", "externalIds": {}, "hIndex": 7}, {"authorId": "3084321", "externalIds": {"DBLP": ["David Cournapeau"]}, "hIndex": 7}, {"authorId": "34422202", "externalIds": {"DBLP": ["Eric Wieser"], "ORCID": "0000-0003-0412-4978"}, "hIndex": 9}, {"authorId": "2110004284", "externalIds": {}, "hIndex": 4}, {"authorId": "2069160663", "externalIds": {}, "hIndex": 2}, {"authorId": "2116828326", "externalIds": {}, "hIndex": 3}, {"authorId": "2066375342", "externalIds": {}, "hIndex": 4}, {"authorId": "1395072875", "externalIds": {}, "hIndex": 3}, {"authorId": "7018631", "externalIds": {"DBLP": ["Stephan Hoyer"]}, "hIndex": 28}, {"authorId": "40801125", "externalIds": {}, "hIndex": 3}, {"authorId": "144082394", "externalIds": {"DBLP": ["M. Brett", "Matthew Brett"]}, "hIndex": 32}, {"authorId": "3029849", "externalIds": {"DBLP": ["Allan Haldane"]}, "hIndex": 14}, {"authorId": "2248252521", "externalIds": {}, "hIndex": 1}, {"authorId": "2037317966", "externalIds": {"DBLP": ["Mark Wiebe"]}, "hIndex": 6}, {"authorId": "143825690", "externalIds": {"DBLP": ["Pearu Peterson"]}, "hIndex": 8}, {"authorId": "1752588457", "externalIds": {}, "hIndex": 1}, {"authorId": "46183258", "externalIds": {}, "hIndex": 17}, {"authorId": "144896751", "externalIds": {}, "hIndex": 5}, {"authorId": "2214143", "externalIds": {"DBLP": ["Warren Weckesser"]}, "hIndex": 13}, {"authorId": "153697803", "externalIds": {"DBLP": ["Hameer Abbasi"]}, "hIndex": 4}, {"authorId": "102782888", "externalIds": {}, "hIndex": 8}, {"authorId": "35525979", "externalIds": {"DBLP": ["Travis E. Oliphant"]}, "hIndex": 16}], "abstract": "Array programming provides a powerful, compact and expressive syntax for accessing, manipulating and operating on data in vectors, matrices and higher-dimensional arrays. NumPy is the primary array programming library for the Python language. It has an essential role in research analysis pipelines in fields as diverse as physics, chemistry, astronomy, geoscience, biology, psychology, materials science, engineering, finance and economics. For example, in astronomy, NumPy was an important part of the software stack used in the discovery of gravitational waves1 and in the first imaging of a black hole2. Here we review how a few fundamental array concepts lead to a simple and powerful programming paradigm for organizing, exploring and analysing scientific data. NumPy is the foundation upon which the scientific
        Python ecosystem is constructed. It is so pervasive that several projects, targeting audiences with specialized needs, have developed their own NumPy-like interfaces and array objects. Owing to its central position in the ecosystem, NumPy increasingly acts as an interoperability layer between such array computation libraries and, together with its application programming interface (API), provides a flexible framework to support the next decade of scientific and industrial analysis. NumPy is the primary array programming library for Python; here its fundamental concepts are reviewed and its evolution into a flexible interoperability layer between increasingly specialized computational libraries is discussed."}, {"paperId": "48dd812d8cbfd0d9c8da87b7094461f7c441e7d4", "externalIds": {"MAG": "3046728009", "DOI": "10.1126/science.abc4765", "CorpusId": 220871974, "PubMed": "32732407"}, "title": "COVID-19 risks to global food security", "venue": "Science", "year": 2020, "referenceCount": 4, "citationCount": 973, "isOpenAccess": true, "openAccessPdf": {"url": "http://cdm15738.contentdm.oclc.org/cdm/ref/collection/p15738coll5/id/7358", "status": "GREEN", "license": "other-oa", "disclaimer": "Notice: Paper or abstract available at https://api.unpaywall.org/v2/10.1126/science.abc4765?email=<INSERT_YOUR_EMAIL> or https://doi.org/10.1126/science.abc4765, which is subject to the license by the author or copyright owner provided with this content. Please go to the source to verify the license and copyright information for your use."}, "fieldsOfStudy": ["Business", "Medicine"], "tldr": {"model": "tldr@v2.0.0", "text": "The main threats COVID-19 poses to food security are outlined and critical responses that policy-makers should consider to prevent this global health crisis from becoming a global food crisis are suggested."}, "publicationTypes": ["JournalArticle"], "publicationDate": "2020-07-30", "journal": {"name": "Science", "pages": "500 - 502", "volume": "369"}, "authors": [{"authorId": "2595976", "externalIds": {}, "hIndex": 30}, {"authorId": "66553495", "externalIds": {}, "hIndex": 39}, {"authorId": "2118815", "externalIds": {"DBLP": ["Jo Swinnen"]}, "hIndex": 68}, {"authorId": "71757890", "externalIds": {}, "hIndex": 27}], "abstract": "Economic fallout and food supply chain disruptions require attention from policy-makers As the COVID-19 pandemic progresses, trade-offs have emerged between the need to contain the virus and to avoid disastrous economic and food security crises that hurt the world''s poor and hungry most. Although no major food shortages have emerged as yet, agricultural and food markets are facing disruptions because of labor shortages created by restrictions on movements of people and shifts in food demand resulting from closures of restaurants and schools as well as from income losses. Export restrictions imposed by some countries have disrupted trade flows for staple foods such as wheat and rice. The pandemic is affecting all four pillars of food security (1): availability (is the supply of food adequate?), access (can people obtain the food they need?), utilization (do people have enough intake of nutrients?), and stability (can people access food at all times?). COVID-19 is most directly and severely impacting access to food, even though impacts are also felt through disruptions to availability; shifts in consumer demand toward cheaper, less nutritious foods; and food price instability. We outline the main threats COVID-19 poses to food security and suggest critical responses that policy-makers should consider to prevent this global health crisis from becoming a global food crisis."}, {"paperId": "c7f43abd19812c5f3a83775c0720d7f6c895ae4b", "externalIds": {"MAG": "3039901154", "PubMedCentral": "7332439", "DOI": "10.1016/j.cell.2020.06.043", "CorpusId": 220304292, "PubMed": "32697968"}, "title": "Tracking Changes in SARS-CoV-2 Spike: Evidence that D614G Increases Infectivity of the COVID-19 Virus", "venue": "Cell", "year": 2020, "referenceCount": 98, "citationCount": 3787, "isOpenAccess": true, "openAccessPdf":
        {"url": "http://www.cell.com/article/S0092867420308205/pdf", "status": "HYBRID", "license": "CCBYNCND", "disclaimer": "Notice: Paper or abstract available at https://pmc.ncbi.nlm.nih.gov/articles/PMC7332439, which is subject to the license by the author or copyright owner provided with this content. Please go to the source to verify the license and copyright information for your use."}, "fieldsOfStudy": ["Medicine"], "tldr": {"model": "tldr@v2.0.0", "text": "A SARS-CoV-2 variant carrying the Spike protein amino acid change D614G has become the most prevalent form in the global pandemic, and it is found that the G614 variant grows to a higher titer as pseudotyped virions."}, "publicationTypes": ["JournalArticle"], "publicationDate": "2020-07-03", "journal": {"name": "Cell", "pages": "812 - 827.e19", "volume": "182"}, "authors": [{"authorId": "2055813744", "externalIds": {}, "hIndex": 24}, {"authorId": "144913072", "externalIds": {"DBLP": ["Will Fischer 0001", "William Fischer 0001"]}, "hIndex": 27}, {"authorId": "2325154343", "externalIds": {"DBLP": ["S. Gnanakaran"]}, "hIndex": 27}, {"authorId": "2044670114", "externalIds": {}, "hIndex": 16}, {"authorId": "1685467", "externalIds": {"DBLP": ["James Theiler"]}, "hIndex": 53}, {"authorId": "3396908", "externalIds": {"DBLP": ["Werner Abfalterer"]}, "hIndex": 8}, {"authorId": "47874805", "externalIds": {}, "hIndex": 20}, {"authorId": "40290407", "externalIds": {}, "hIndex": 35}, {"authorId": "152233221", "externalIds": {}, "hIndex": 8}, {"authorId": "40277250", "externalIds": {}, "hIndex": 37}, {"authorId": "40294944", "externalIds": {}, "hIndex": 30}, {"authorId": "2071072", "externalIds": {}, "hIndex": 16}, {"authorId": "144549261", "externalIds": {}, "hIndex": 17}, {"authorId": "12820195", "externalIds": {}, "hIndex": 18}, {"authorId": "144186843", "externalIds": {}, "hIndex": 4}, {"authorId": "2444403", "externalIds": {}, "hIndex": 41}, {"authorId": "29981260", "externalIds": {}, "hIndex": 19}, {"authorId": "144521401", "externalIds": {}, "hIndex": 17}, {"authorId": "145946252", "externalIds": {"DBLP": ["Haili Tang"]}, "hIndex": 21}, {"authorId": "1441102420", "externalIds": {}, "hIndex": 9}, {"authorId": "144670841", "externalIds": {}, "hIndex": 80}, {"authorId": "4625245", "externalIds": {}, "hIndex": 50}, {"authorId": "5761029", "externalIds": {}, "hIndex": 64}, {"authorId": "144524278", "externalIds": {"DBLP": ["David C. Montefiori"]}, "hIndex": 138}, {"authorId": "6942192", "externalIds": {}, "hIndex": 19}, {"authorId": "2109432835", "externalIds": {}, "hIndex": 11}, {"authorId": "3513490", "externalIds": {}, "hIndex": 11}, {"authorId": "13393873", "externalIds": {}, "hIndex": 15}, {"authorId": "1796276676", "externalIds": {}, "hIndex": 6}, {"authorId": "145266843", "externalIds": {}, "hIndex": 7}, {"authorId": "50321202", "externalIds": {}, "hIndex": 16}, {"authorId": "1796282960", "externalIds": {}, "hIndex": 16}, {"authorId": "152300083", "externalIds": {}, "hIndex": 8}, {"authorId": "1380361587", "externalIds": {}, "hIndex": 11}, {"authorId": "1397890811", "externalIds": {}, "hIndex": 70}, {"authorId": "34563900", "externalIds": {}, "hIndex": 16}, {"authorId": "39084346", "externalIds": {}, "hIndex": 4}, {"authorId": "2145350855", "externalIds": {}, "hIndex": 7}, {"authorId": "6802904", "externalIds": {}, "hIndex": 17}], "abstract": "Summary A SARS-CoV-2 variant carrying the Spike protein amino acid change D614G has become the most prevalent form in the global pandemic. Dynamic tracking of variant frequencies revealed a recurrent pattern of G614 increase at multiple geographic levels: national, regional, and municipal. The shift occurred even in local epidemics where the original D614 form was well established prior to introduction of the G614 variant. The consistency of this pattern was highly statistically significant, suggesting that the G614 variant may have a fitness advantage. We found that the G614 variant grows to a higher titer as pseudotyped virions. In infected individuals, G614 is associated with lower RT-PCR cycle thresholds, suggestive of higher
        upper respiratory tract viral loads, but not with increased disease severity. These findings illuminate changes important for a mechanistic understanding of the virus and support continuing surveillance of Spike mutations to aid with development of immunological interventions."}]

