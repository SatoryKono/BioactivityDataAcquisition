id: activity_chembl_test
provider: chembl
entity: activity
primary_key: activity_id
input_mode: csv
input_path: tests/fixtures/input/chembl_activity_small.csv
output_path: ./data/output/chembl/activity_test
batch_size: 5
provider_config:
  provider: chembl
  base_url: https://www.ebi.ac.uk/chembl/api/data
  client:
    timeout_sec: 30.0
    max_retries: 3
    rate_limit_per_sec: 10.0
  max_url_length: 2000
  batch_size: 5
  page_size: 1000
  api_version: null

runtime:
  storage:
    output_path: ./data/output
  csv_options:
    delimiter: ","
    header: true

quality:
  determinism:
    stable_sort: true
  hashing:
    business_key_fields:
      - activity_id
  normalization:
    case_sensitive_fields:
      - doc_type
      - canonical_smiles
      - smiles
      - inchi
      - inchi_key
      - standard_inchi
      - standard_inchi_key
      - molecule_structures
      - helm_notation
      - variant_sequence
      - target_components
      - cross_references
      - standard_type
      - standard_units
      - type
      - assay_type
    id_fields:
      - doi
      - doi_chembl
      - accession
      - uo_units
      - qudt_units
      - toid
      - bao_endpoint
      - bao_format
      - atc_classifications
      - ligand_efficiency

pipeline:
  name: activity_chembl
  version: "1.0.0"
