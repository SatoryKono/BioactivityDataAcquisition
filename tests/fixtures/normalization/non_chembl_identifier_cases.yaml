publication_identifier_arrays:
  author_orcids:
    input: '["https://orcid.org/0000-0002-1825-0097","0000000218250097"]'
    expected: '["0000-0002-1825-0097"]'
  author_orcids_drops_invalid:
    input: '["not-an-orcid","0000-0002-1825-0097","0000000218250097"]'
    expected: '["0000-0002-1825-0097"]'
  issn_list:
    input: '["2049-3630","ISSN:1234567X"]'
    expected: '["1234-567X","2049-3630"]'
  openalex_author_ids:
    input: '["https://openalex.org/A2","a10"]'
    expected: '["A10","A2"]'
  semanticscholar_author_ids:
    input: '["ABCDEFABCDEFABCDEFABCDEFABCDEFABCDEFABCD","abcdefabcdefabcdefabcdefabcdefabcdefabcd"]'
    expected: '["abcdefabcdefabcdefabcdefabcdefabcdefabcd"]'
uniprot_identifier_arrays:
  all_mappings:
    input: '["p00742","P00742","q9y6k9"]'
    expected: '["P00742","Q9Y6K9"]'
  all_mappings_drops_noise:
    input: '["p00742","n/a","CHEMBL203","   "]'
    expected: '["CHEMBL203","P00742"]'
  chembl_ids:
    input: '["chembl25","CHEMBL1"]'
    expected: '["CHEMBL1","CHEMBL25"]'
  drugbank_ids:
    input: '["db00001","DB00002"]'
    expected: '["DB00001","DB00002"]'
publication_raw_type_policy:
  crossref_publication_type_unknown:
    profile: crossref.publication
    field: publication_type
    input: " future-provider-type "
    expected: future-provider-type
    policy: preserve_unknown_provider_value
  openalex_publication_type_unknown:
    profile: openalex.publication
    field: publication_type
    input: " future-openalex-type "
    expected: future-openalex-type
    policy: preserve_unknown_provider_value
  openalex_type_crossref_known:
    profile: openalex.publication
    field: type_crossref
    input: " journal-article "
    expected: journal-article
    policy: raw_sidecar_preserved
  openalex_type_crossref_unknown:
    profile: openalex.publication
    field: type_crossref
    input: " future-crossref-type "
    expected: future-crossref-type
    policy: preserve_unknown_provider_value
  pubmed_publication_type_unknown:
    profile: pubmed.publication
    field: publication_type
    input: " Future PubMed Type "
    expected: Future PubMed Type
    policy: preserve_unknown_provider_value
  semanticscholar_publication_type_unknown:
    profile: semanticscholar.publication
    field: publication_type
    input: " FutureSemanticScholarType "
    expected: FutureSemanticScholarType
    policy: preserve_unknown_provider_value
  semanticscholar_publication_type_mixed_case_known:
    profile: semanticscholar.publication
    field: publication_type
    input: " journalarticle "
    expected: JournalArticle
    policy: known_provider_value_canonicalized_without_closing_the_universe
publication_oa_status_policy:
  openalex_known_status:
    profile: openalex.publication
    field: oa_status
    input: " GOLD "
    expected: gold
    policy: governed_registry
  semanticscholar_unknown_status:
    profile: semanticscholar.publication
    field: oa_status
    input: unknown
    expected: null
    policy: fail_closed_unknown
publication_structured_field_policy:
  semanticscholar_publication_types:
    profile: semanticscholar.publication
    field: publication_types
    input: '["JournalArticle","Review"]'
    expected: '["JournalArticle","Review"]'
    collection_semantics: unordered_set
    representation: canonical_json_string
    raw_sidecar_field: publication_type
composite_publication_join_keys:
  doi_primary:
    composite: composite_publication
    key: doi
    raw_values:
      - " https://doi.org/10.1000/ABC "
      - "DOI:10.1000/abc"
      - "10.1000/AbC"
    expected: "10.1000/abc"
  pmid_primary:
    composite: composite_publication
    key: pmid
    raw_values:
      - " PMID:0012345 "
      - "https://pubmed.ncbi.nlm.nih.gov/12345/"
      - 12345
    expected: "12345"
  title_fallback:
    composite: composite_publication
    key: title
    raw_values:
      - "  Mixed Case Title  "
      - "Mixed Case Title"
      - "Mixed\t Case\nTitle"
      - " <b>Mixed</b>&nbsp;Case Title "
    expected: "Mixed Case Title"
composite_molecule_join_keys:
  inchi_key_primary:
    composite: composite_molecule
    key: inchi_key
    raw_values:
      - " bsynrymutxbxsq-uhfffaoysa-n "
      - "BSYNRYMUTXBXSQ-UHFFFAOYSA-N"
    expected: "BSYNRYMUTXBXSQ-UHFFFAOYSA-N"
  canonical_smiles_fallback:
    composite: composite_molecule
    key: canonical_smiles
    raw_values:
      - " C[C@H](O)C "
      - "C[C@H](O)C"
    expected: "C[C@H](O)C"
  pubchem_anchor_boundary:
    composite: composite_molecule
    active_join_keys:
      - inchi_key
      - canonical_smiles
    retained_validation_anchors:
      - standardized_inchi_key
      - structure_parent_key
composite_target_join_keys:
  target_id_seed:
    composite: composite_target
    key: target_id
    raw_values:
      - " chembl203 "
      - "CHEMBL0203"
    expected: "CHEMBL203"
  uniprot_accession_chain:
    composite: composite_target
    key: uniprot_accession
    raw_values:
      - " p12345 "
      - "P12345"
    expected: "P12345"
  uniprot_mapping_gate:
    composite: composite_target
    source_anchor: target_id
    normalized_output_anchor: uniprot_accession
    required_status: found
