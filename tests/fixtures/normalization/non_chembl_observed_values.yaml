      - entity_id
      - doi
      - pmid
      - title
  composite_molecule:
    source_pipelines:
      - chembl_molecule
      - pubchem_compound
    required_fields:
      - molecule_id
      - inchi_key
      - canonical_smiles
  composite_target:
    source_pipelines:
      - chembl_target
      - uniprot_protein
      - uniprot_idmapping
    required_fields:
      - target_id
      - uniprot_accession
      - taxonomy_id
