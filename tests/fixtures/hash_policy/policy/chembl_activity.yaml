provider: chembl
entity: activity
contract:
  version: 1.0.0
  migration_note: "Initial hash policy baseline for chembl/activity."

hash_policy:
  algorithm: sha256
  canonicalization: provider + canonical_json_dumps(normalized_record)

  include_fields:
    - activity_chembl_id
    - assay_chembl_id
    - molecule_chembl_id
    - standard_type
    - standard_relation
    - standard_value
    - standard_units
    - pchembl_value
    - confidence_score
    - document_chembl_id
    - year

  exclude_fields:
    - _ingestion_ts
    - _run_id
    - _run_type
    - _dq_warn
    - _dq_error
    - _source_batch_id
    - _index

  exclude_patterns:
    - "^_dq_"

  normalization:
    trim_strings: true
    round_floats:
      enabled: true
      precision: 10
    dates:
      enabled: true
      format: YYYY-MM-DD
    null_handling:
      nan_to_null: true
      inf_to_null: true
