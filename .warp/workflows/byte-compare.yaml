name: bioetl byte compare
command: >
  mkdir -p .artifacts/byte-compare &&
  rm -rf .artifacts/byte-compare/run-a .artifacts/byte-compare/run-b &&
  mkdir -p .artifacts/byte-compare/run-a .artifacts/byte-compare/run-b .artifacts/byte-compare/reports &&
  uv run pytest tests/integration/composite_resume -q --basetemp .artifacts/byte-compare/run-a/composite_resume >/tmp/repro-byte-run-a.log &&
  uv run pytest tests/integration/composite_resume -q --basetemp .artifacts/byte-compare/run-b/composite_resume >/tmp/repro-byte-run-b.log &&
  find .artifacts/byte-compare/run-a -type f | sort | xargs sha256sum > .artifacts/byte-compare/reports/run-a.sha256 &&
  find .artifacts/byte-compare/run-b -type f | sort | xargs sha256sum > .artifacts/byte-compare/reports/run-b.sha256 &&
  diff -u .artifacts/byte-compare/reports/run-a.sha256 .artifacts/byte-compare/reports/run-b.sha256 > .artifacts/byte-compare/reports/diff.txt ||
  (cp .artifacts/byte-compare/reports/diff.txt .artifacts/byte-compare/reports/byte-compare-diff.txt; exit 1)
tags:
  - bioetl
  - consolidation
  - governance
description: Сравнение контрольных артефактов между двумя запусками для фиксации байтового дрейфа.
shells:
  - bash
