services:
  warp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cloudflare-warp
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    volumes:
      - warp-data:/var/lib/cloudflare-warp
      - /dev/net/tun:/dev/net/tun
    devices:
      - /dev/net/tun
    networks:
      - warp-network
    environment:
      RUST_LOG: warn

  neo4j:
    image: neo4j:${NEO4J_VERSION:-5.15-community}
    container_name: bioetl-neo4j
    restart: unless-stopped
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - neo4j-data:/var/lib/neo4j/data
      - neo4j-logs:/var/lib/neo4j/logs
      - neo4j-import:/var/lib/neo4j/import
    environment:
      # Memory Configuration
      NEO4J_server_memory_heap_initial__size: ${NEO4J_HEAP_INITIAL:-512m}
      NEO4J_server_memory_heap_max__size: ${NEO4J_HEAP_MAX:-2g}
      NEO4J_server_memory_pagecache_size: ${NEO4J_PAGECACHE:-1g}
      NEO4J_dbms_memory_transaction_max__size: ${NEO4J_TX_MAX_SIZE:-2g}
      
      # Authentication
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/bioetl_secure_password}
      
      # Server Configuration
      NEO4J_dbms_default__database: ${NEO4J_DEFAULT_DB:-neo4j}
      NEO4J_server_bolt_listen__address: 0.0.0.0:7687
      NEO4J_server_http_listen__address: 0.0.0.0:7474
      
      # Performance Tuning
      NEO4J_dbms_memory_transaction_global__max__size: ${NEO4J_GLOBAL_TX_MAX:-20g}
      NEO4J_server_jvm_additional: ${NEO4J_JVM_OPTS:--XX:+UseG1GC -XX:G1HeapRegionSize=16m}
      
      # Additional Settings
      NEO4J_ACCEPT_LICENSE_AGREEMENT: "yes"
    networks:
      - warp-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:7474/browser/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  pushgateway:
    image: prom/pushgateway:${PUSHGATEWAY_VERSION:-latest}
    container_name: bioetl-pushgateway
    restart: unless-stopped
    ports:
      - "${PUSHGATEWAY_PORT:-9091}:9091"
    volumes:
      - pushgateway-data:/var/lib/pushgateway
    command:
      - "--persistence.file=/var/lib/pushgateway/metrics"
      - "--persistence.interval=15m"
    networks:
      - warp-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9091/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  grafana:
    image: grafana/grafana:${GRAFANA_VERSION:-latest}
    container_name: bioetl-grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - grafana-provisioning:/etc/grafana/provisioning
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-changeme}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3000}
      GF_SESSION_COOKIE_SECURE: ${GRAFANA_COOKIE_SECURE:-false}
      GF_SESSION_COOKIE_HTTPONLY: "true"
      GF_SECURITY_COOKIE_SAMESITE: "Lax"
    networks:
      - warp-network
    depends_on:
      pushgateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  warp-network:
    driver: bridge

volumes:
  warp-data:
  neo4j-data:
  neo4j-logs:
  neo4j-import:
  pushgateway-data:
  grafana-data:
  grafana-provisioning:
