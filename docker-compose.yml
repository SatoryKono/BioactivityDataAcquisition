version: '3.8'

services:
  warp:
    build: .
    container_name: cloudflare-warp
    privileged: true
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    volumes:
      - warp_data:/var/run/warp
      - /etc/resolv.conf:/etc/resolv.conf:ro
    networks:
      - warp_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "warp-cli", "status"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  warp_data:

networks:
  warp_network:
    driver: bridge
