services:
  bioetl:
    build:
      context: .
      dockerfile: Dockerfile.bioetl
    container_name: bioetl-app
    restart: unless-stopped
    depends_on:
      neo4j:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./configs:/app/configs
      - ./data:/app/data
      - ./logs:/app/logs
    ports:
      - "8000:8000"
      - "8081:8081"
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: ${NEO4J_AUTH_USERNAME:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_AUTH_PASSWORD:-bioetl_secure_password}
      PYTHONUNBUFFERED: "1"
      PYTHONPYCACHEPREFIX: /tmp/bioetl-pycache
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      BIOETL_LOG_FILE: /app/logs/bioetl.log
      BIOETL_METRICS_PORT: "8000"
      BIOETL_METRICS_ADDR: 0.0.0.0
      BIOETL_OBSERVABILITY__METRICS_ENABLED: "true"
      BIOETL_OBSERVABILITY__METRICS_SERVER_ENABLED: "true"
      BIOETL_OBSERVABILITY__DQ_MONITOR_ENABLED: "true"
    command: ["quarantine", "serve", "--host", "0.0.0.0", "--port", "8081"]
    networks:
      - warp-network
      - monitoring
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import sys, urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health/ready', timeout=5).read(); sys.exit(0)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  warp:
    build:
      context: .
      dockerfile: scripts/ops/runtime/docker/images/warp/Dockerfile
    container_name: cloudflare-warp
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    volumes:
      - warp-data:/var/lib/cloudflare-warp
      - /dev/net/tun:/dev/net/tun
    devices:
      - /dev/net/tun
    networks:
      - warp-network
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    ports:
      - "9999:8080"

volumes:
  warp-data:

networks:
  warp-network:
    external: false
  monitoring:
    external: true
    name: bioetl-monitoring
