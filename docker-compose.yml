name: bioetl-main

services:
  bioetl:
    build:
      context: .
      dockerfile: Dockerfile.bioetl
    container_name: bioetl
    # Override Dockerfile ENTRYPOINT so one container can run both:
    # - health/metrics server on :8000 (Prometheus job `bioetl` scrapes bioetl:8000)
    # - quarantine explorer backend on :8081 (Grafana Infinity + job quarantine-explorer)
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        bioetl health server --host 0.0.0.0 --port 8000 &
        exec bioetl quarantine serve --host 0.0.0.0 --port 8081
    ports:
      - "127.0.0.1:8081:8081"
      # Port 8000 is intentionally not published to the host: Prometheus scrapes
      # bioetl:8000 over the monitoring compose network. Host-side metrics runs
      # use host.docker.internal:8000 as an explicit override, not the default.
    volumes:
      # Writable local artifacts for quarantine explorer and pipeline runs.
      # Without these, quarantine serve panics on data/output/quarantine and
      # pipelines fail creating reports/ under the non-root bioetl user.
      - ./data:/app/data
      - ./reports:/app/reports
      - ./logs:/app/logs
      - ./configs:/app/configs:ro
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - NEO4J_USERNAME=${NEO4J_USERNAME:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:?Set NEO4J_PASSWORD}
      - BIOETL_PROMETHEUS_URL=http://prometheus:9090
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3);
          urllib.request.urlopen('http://127.0.0.1:8081/health/ready', timeout=3)
      interval: 15s
      timeout: 8s
      retries: 5
      start_period: 40s
    networks:
      monitoring:
        aliases:
          - quarantine-explorer
      runtime: {}
    restart: "on-failure:3"
    mem_limit: 1536m
    mem_reservation: 768m
    cpus: 2.0
    pids_limit: 512
    init: true
    stop_grace_period: 30s
    logging:
      driver: local
      options:
        max-size: "20m"
        max-file: "5"

networks:
  monitoring:
    external: true
    name: bioetl-monitoring
  runtime:
    external: true
    name: bioetl-runtime
