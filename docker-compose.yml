name: bioetl-main

services:
  bioetl:
    build:
      context: .
      dockerfile: Dockerfile.bioetl
    container_name: bioetl
    # Health/metrics only. Quarantine Explorer HTTP UI was removed from the
    # default Docker surface (see docs/DOCKER_QUICKSTART.md).
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        exec bioetl health server --host 0.0.0.0 --port 8000
    ports:
      # Published for host readiness probes and optional host-side scrapes.
      - "127.0.0.1:8000:8000"
    volumes:
      - type: bind
        source: ${BIOETL_DASHBOARD_DATA_ROOT:-./data}
        target: /app/data
        read_only: true
      - type: bind
        source: ${BIOETL_DASHBOARD_REPORT_ROOT:-./reports}
        target: /app/reports
        read_only: true
      - ./logs:/app/logs
      - ./configs:/app/configs:ro
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - NEO4J_USERNAME=${NEO4J_USERNAME:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:?Set NEO4J_PASSWORD}
      - BIOETL_PROMETHEUS_URL=http://prometheus:9090
      - BIOETL_RUNTIME_SOURCE_ID=ea4ea8cfbdad8ca16fa9d50a1ad087aa4c4f5a3554c5b409544469685f0f2e9b
      - BIOETL_REPORT_ROOT=${BIOETL_REPORT_ROOT:-/app/reports/run-reports}
      - BIOETL_ENFORCE_REPORT_ROOT_MARKER=${BIOETL_ENFORCE_REPORT_ROOT_MARKER:-1}
    labels:
      io.bioetl.dashboard-source-id: ${BIOETL_RUNTIME_SOURCE_ID:-unmanaged}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)
      interval: 15s
      timeout: 8s
      retries: 5
      start_period: 40s
    networks:
      # Optional join so an opt-in monitoring stack can scrape bioetl:8000.
      monitoring: {}
      runtime: {}
    # Prefer process restart over OOM-kill of the whole Desktop backend.
    restart: "unless-stopped"
    # Health server only — keep under ~0.75G so main+neo4j fit in a 6G WSL cap
    # next to IDE on 32G hosts. Never thrash compose --build under low free RAM.
    mem_limit: 768m
    mem_reservation: 384m
    cpus: 1.0
    pids_limit: 384
    init: true
    stop_grace_period: 30s
    logging:
      driver: local
      options:
        max-size: "20m"
        max-file: "5"

networks:
  monitoring:
    external: true
    name: bioetl-monitoring
  runtime:
    external: true
    name: bioetl-runtime
