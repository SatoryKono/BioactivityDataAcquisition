services:
  neo4j:
    image: neo4j:5.15-community
    container_name: bioetl-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/bioetl_secure_password
      NEO4J_ACCEPT_LICENSE_AGREEMENT: "yes"
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 2g
      NEO4J_server_memory_pagecache_size: 1g
      NEO4J_server_jvm_additional: "-XX:+UseG1GC -XX:G1HeapRegionSize=16m"
    volumes:
      - neo4j_data:/var/lib/neo4j/data
      - neo4j_logs:/var/lib/neo4j/logs
    networks:
      - warp-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "cypher-shell -u neo4j -p bioetl_secure_password 'RETURN 1' || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  bioetl:
    build:
      context: .
      dockerfile: Dockerfile.bioetl
    container_name: bioetl-app
    restart: unless-stopped
    depends_on:
      neo4j:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./configs:/app/configs
      - ./data:/app/data
      - ./logs:/app/logs
    ports:
      - "8000:8000"
      - "8081:8081"
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: ${NEO4J_AUTH_USERNAME:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_AUTH_PASSWORD:-bioetl_secure_password}
      PYTHONUNBUFFERED: "1"
      PYTHONPYCACHEPREFIX: /tmp/bioetl-pycache
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      BIOETL_LOG_FILE: /app/logs/bioetl.log
      BIOETL_METRICS_PORT: "8000"
      BIOETL_METRICS_ADDR: 0.0.0.0
      BIOETL_OBSERVABILITY__METRICS_ENABLED: "true"
      BIOETL_OBSERVABILITY__METRICS_SERVER_ENABLED: "true"
      BIOETL_OBSERVABILITY__DQ_MONITOR_ENABLED: "true"
    command: ["quarantine", "serve", "--host", "0.0.0.0", "--port", "8081"]
    networks:
      - warp-network
      - monitoring
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import sys, urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health/ready', timeout=5).read(); sys.exit(0)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  warp:
    build:
      context: .
      dockerfile: scripts/ops/runtime/docker/images/warp/Dockerfile
    container_name: cloudflare-warp
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    volumes:
      - warp-data:/var/lib/cloudflare-warp
      - /dev/net/tun:/dev/net/tun
    devices:
      - /dev/net/tun
    networks:
      - warp-network
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    ports:
      - "9999:8080"

volumes:
  neo4j_data:
  neo4j_logs:
  warp-data:

networks:
  warp-network:
    external: false
  monitoring:
    external: true
    name: bioetl-monitoring
