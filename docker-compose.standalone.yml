# docker-compose.standalone.yml - All services in one file (alternative to full stack)
# Use: docker compose -f docker-compose.standalone.yml up -d

version: '3.9'

services:
  # Neo4j Graph Database
  neo4j:
    image: neo4j:5.18-enterprise
    container_name: neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_AUTH_PASSWORD:-bioetl_secure_password}
      NEO4J_ACCEPT_LICENSE_AGREEMENT: "yes"
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*,gds.*"
    ports:
      - "7474:7474"   # HTTP
      - "7687:7687"   # Bolt
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    networks:
      - bioetl-network
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "${NEO4J_AUTH_PASSWORD:-bioetl_secure_password}", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Redis Cache/Queue
  redis:
    image: redis:7.2-alpine
    container_name: redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-bioetl_redis_password}
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - bioetl-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-bioetl_redis_password}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO S3-compatible Storage
  minio:
    image: minio/minio:latest
    container_name: minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Console
    volumes:
      - minio-data:/data
    networks:
      - bioetl-network
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # BioETL Application
  bioetl:
    build:
      context: .
      dockerfile: Dockerfile.bioetl
    container_name: bioetl-app
    restart: unless-stopped
    depends_on:
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./configs:/app/configs
      - ./data:/app/data
      - ./logs:/app/logs
    ports:
      - "8000:8000"   # Metrics
      - "8081:8081"   # Application
    environment:
      # Neo4j
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: ${NEO4J_AUTH_USERNAME:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_AUTH_PASSWORD:-bioetl_secure_password}
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-bioetl_redis_password}
      # MinIO
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      # Application
      PYTHONUNBUFFERED: "1"
      PYTHONPYCACHEPREFIX: /tmp/bioetl-pycache
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      BIOETL_LOG_FILE: /app/logs/bioetl.log
      BIOETL_METRICS_PORT: "8000"
      BIOETL_METRICS_ADDR: 0.0.0.0
      BIOETL_OBSERVABILITY__METRICS_ENABLED: "true"
      BIOETL_OBSERVABILITY__METRICS_SERVER_ENABLED: "true"
      BIOETL_OBSERVABILITY__DQ_MONITOR_ENABLED: "true"
    command: ["quarantine", "serve", "--host", "0.0.0.0", "--port", "8081"]
    networks:
      - bioetl-network
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health/ready', timeout=5).read(); sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Cloudflare Warp Tunnel
  warp:
    build:
      context: .
      dockerfile: Dockerfile.warp
    container_name: cloudflare-warp
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    volumes:
      - warp-data:/var/lib/cloudflare-warp
      - /dev/net/tun:/dev/net/tun
    devices:
      - /dev/net/tun
    networks:
      - bioetl-network
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    ports:
      - "9999:8080"

  # Prometheus Metrics
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./configs/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - bioetl-network
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    depends_on:
      - bioetl

  # Grafana Dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin123}
      GF_INSTALL_PLUGINS: ${GF_INSTALL_PLUGINS:-yesoreyeram-infinity-datasource}
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - bioetl-network
    depends_on:
      - prometheus

volumes:
  neo4j-data:
  neo4j-logs:
  redis-data:
  minio-data:
  warp-data:
  prometheus-data:
  grafana-data:

networks:
  bioetl-network:
    driver: bridge
