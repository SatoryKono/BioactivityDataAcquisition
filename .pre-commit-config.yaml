# Pre-commit hooks for BioETL
# Install: pip install pre-commit && pre-commit install --hook-type pre-commit --hook-type pre-push --hook-type commit-msg
# Run manually: pre-commit run --all-files

minimum_pre_commit_version: "4.5.1"

default_language_version:
  python: python3.12

default_install_hook_types:
  - pre-commit
  - pre-push
  - commit-msg

repos:
  # Ruff - Fast Python linter and formatter
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.17
    hooks:
      # Run the linter
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        files: ^(src|tests)/.*\.py$
        stages: [pre-commit]
      # Run the formatter
      - id: ruff-format
        files: ^(src|tests)/.*\.py$
        stages: [pre-commit]

  # Security checks
  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: [-c, pyproject.toml, -r, src/bioetl]
        additional_dependencies: ["bandit[toml]==1.9.4"]
        pass_filenames: false
        stages: [pre-push]

  # Secret scanning in pre-push. CI keeps the canonical detect-secrets baseline
  # check via tests/architecture/test_antipatterns.py::test_no_hardcoded_secrets.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
        args: ['--config', '.gitleaks.toml', '--no-banner']
        pass_filenames: false
        stages: [pre-push]

  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        stages: [pre-commit]
      - id: end-of-file-fixer
        stages: [pre-commit]
      - id: check-yaml
        stages: [pre-commit]
        exclude: >
          (?x)(^|.*/)(
            mkdocs\.yml|
            docs/plugins/link_checker/mkdocs_example\.yml|
            docs/05-operations/deployment/k8s-deployment\.yaml|
            docs/05-operations/deployment/k8s-monitoring\.yaml|
            docs/05-operations/deployment/k8s-networking\.yaml|
            docs/.*\.ya?ml
          )$
      - id: check-json
        stages: [pre-commit]
      - id: check-toml
        stages: [pre-commit]
      - id: check-added-large-files
        args: [--maxkb=1000]
        stages: [pre-commit]
      - id: check-case-conflict
        stages: [pre-commit]
      - id: check-merge-conflict
        stages: [pre-commit]
      - id: debug-statements
        stages: [pre-commit]
        exclude: >
          (?x)(
            (^|.*/)(check_cfg|debug_chembl_pub2?|debug_.*)\.py|
            .*/src/bioetl/infrastructure/quality/external_api\.py
          )$
      - id: mixed-line-ending
        args: [--fix=lf]
        stages: [pre-commit]

  # Markdown linting
  - repo: https://github.com/executablebooks/mdformat
    rev: 1.0.0
    hooks:
      - id: mdformat
        stages: [manual]
        additional_dependencies:
          - mdformat-gfm==0.4.1
          - mdformat-black==0.1.1
        exclude: >
          (?x)(^|.*/)(
            CHANGELOG\.md|
            \.codex/.*\.md|
            \.gemini/.*\.md|
            docs/00-project/ai/(agents|skills)/.*\.md|
            docs/02-architecture/decisions/.*\.md|
            docs/03-guides/.*\.md|
            docs/05-architecture/.*\.md|
            docs/05-operations/runbooks/.*\.md|
            grafana/README\.md
          )$

  # Local hooks
  - repo: local
    hooks:
      - id: pip-audit
        name: Check for known vulnerabilities in dependencies
        entry: python scripts/engineering/dev/run_project_python.py -m pip_audit --cache-dir .cache/pip-audit --skip-editable --strict
        language: python
        pass_filenames: false
        stages: [manual]
        verbose: true

      - id: mypy-strict
        name: Run strict mypy gate on src/bioetl
        entry: python scripts/engineering/dev/run_project_python.py -m mypy --config-file pyproject.toml --strict --no-incremental src/bioetl
        language: python
        pass_filenames: false
        stages: [pre-push]

      - id: architecture-smoke
        name: Fast architecture smoke checks
        entry: >
          python scripts/engineering/dev/run_project_python.py -m pytest
          tests/architecture/test_future_annotations_policy.py
          tests/architecture/test_naming_conventions.py
          tests/architecture/test_no_structlog_in_application_interfaces.py
          tests/architecture/test_no_datetime_now_in_infrastructure.py
          tests/architecture/test_no_datetime_now_in_domain.py
          tests/architecture/test_replay_critical_time_seams.py
          tests/architecture/test_no_random_in_writers.py
          tests/architecture/test_forbidden_imports.py
          tests/architecture/test_domain_purity.py::TestDomainPurity::test_no_direct_io_in_domain
          tests/architecture/test_domain_normalization_guardrails.py::test_domain_normalization_modules_have_no_disallowed_runtime_imports
          tests/architecture/test_domain_normalization_guardrails.py::test_domain_normalization_modules_do_not_call_open
          -q --tb=short
        language: python
        pass_filenames: false
        stages: [pre-push]

      - id: architecture-full
        name: Canonical full architecture gate
        entry: >
          python scripts/engineering/dev/run_project_python.py -m pytest
          tests/architecture/ -m "not slow and not benchmark and not memory"
          -q --tb=short
        language: python
        pass_filenames: false
        stages: [manual]

      - id: smoke-lane
        name: BioETL smoke lane
        entry: >
          python scripts/engineering/dev/run_project_python.py -m
          scripts.engineering.qa run-tests --suite smoke --skip-preflight --
          --no-cov
        language: python
        pass_filenames: false
        stages: [manual]

      - id: forbid-cache-files
        name: Block common cache and temporary files
        entry: ^.*$
        language: pygrep
        files: >
          (?x)^(
            .*__pycache__/.*|
            .*\.pyc$|
            .*\.pyo$|
            .*\.pytest_cache/.*|
            .*\.mypy_cache/.*|
            .*\.ruff_cache/.*|
            .*\.python-user/.*|
            .*\.codex_tmp/.*
          )$
        exclude: ^(\.codex/|\.gemini/|\.agent-work/)
        stages: [pre-commit]

      - id: forbid-env-files
        name: Block secret-bearing .env files
        entry: (?s)\A
        language: pygrep
        files: (?x)(^|.*/)(\.env($|\..*)|.*\.env)$
        exclude: (?x)(^|.*/)(\.env\.example|\.env\..*\.example)$
        stages: [pre-commit]

      - id: commit-message-conventional
        name: Check Conventional Commit header
        entry: >
          \A(?:Merge[^\r\n]*|Revert[^\r\n]*|(?=[^\r\n]{1,100}(?:\r?\n|\Z))(?:feat|fix|refactor|docs|test|chore|perf|ci|build|style|revert)(?:\([a-z0-9._/-]+\))?!?: [^\r\n]+)(?:\r?\n|\Z)
        language: pygrep
        args: [--multiline, --negate]
        pass_filenames: true
        stages: [commit-msg]

      - id: validate-pipeline-configs
        name: Validate unified pipeline YAML configs
        entry: python scripts/engineering/dev/run_project_python.py -m scripts.schema validate-configs
        language: python
        files: ^configs/(entities|composites|_schema)/.*\.(yaml|json)$
        pass_filenames: false
        stages: [pre-commit]

      - id: audit-root-cleanliness
        name: Audit repository root layout allowlist
        entry: python scripts/engineering/dev/run_project_python.py -m scripts.engineering.repo check-cleanliness
        language: python
        pass_filenames: false
        stages: [pre-commit]

      - id: lint-config-paths
        name: Check for legacy dq/filter config path references
        entry: python scripts/engineering/dev/run_project_python.py -m scripts.schema check-config-paths
        language: python
        pass_filenames: false
        files: ^(configs/|src/|docs/)
        exclude: ^src/bioetl/infrastructure/config/config_ci_contract\.py$
        types_or: [yaml, json, python, markdown]
        stages: [pre-commit]

      - id: check-config-invariants
        name: Validate config CI invariants (naming, schemas, auth, keys)
        entry: python scripts/engineering/dev/run_project_python.py -m scripts.schema check-invariants
        language: python
        pass_filenames: false
        files: ^configs/
        exclude: ^configs/entities/composite/
        types: [yaml]
        stages: [pre-commit]

      - id: lint-diagrams
        name: Lint architecture diagrams (.mmd/.mermaid)
        entry: python scripts/engineering/dev/run_project_python.py -m scripts.diagrams lint
        language: python
        files: ^docs/02-architecture/(mmd-diagrams/.*\.mmd|diagrams/mermaid/.*\.mermaid)$
        stages: [pre-commit]

      - id: prune-orphan-diagram-nodes
        name: Check for orphan nodes in Mermaid diagrams (GRAPH-001)
        entry: python scripts/engineering/dev/run_project_python.py -m scripts.diagrams fix-orphans --check
        language: python
        files: ^docs/02-architecture/(mmd-diagrams/.*\.mmd|diagrams/mermaid/.*\.mermaid)$
        pass_filenames: false
        stages: [pre-commit]

      # CI-like local pre-commit checks
      - id: repo-identity-check
        name: Check repository identity synchronization
        entry: python scripts/engineering/dev/run_project_python.py -m scripts.docs sync-repo-identity --check
        language: python
        pass_filenames: false
        stages: [manual]

      - id: inventory-check
        name: Validate scripts inventory and lifecycle registry
        entry: >
          python scripts/engineering/dev/run_project_python.py -m scripts.engineering.repo
          check-inventory --check
          --manifest configs/quality/scripts_inventory_manifest.json
          --check-lifecycle
          --forbid-evaluate-active
          --lifecycle-registry configs/quality/scripts_lifecycle_registry.json
        language: python
        pass_filenames: false
        stages: [manual]

      - id: catalog-check
        name: Validate scripts catalog governance
        entry: >
          python scripts/engineering/dev/run_project_python.py -m scripts.engineering.repo
          check-catalog --catalog scripts/engineering/repo/catalog.yaml
        language: python
        pass_filenames: false
        stages: [manual]

      - id: docs-check-links
        name: Check documentation links
        entry: >
          python scripts/engineering/dev/run_project_python.py -m scripts.docs
          check-links --links --specs --configs
        language: python
        pass_filenames: false
        stages: [manual]

      - id: docs-check-drift
        name: Check documentation drift
        entry: >
          python scripts/engineering/dev/run_project_python.py -m scripts.docs
          check-drift --ports --classes
        language: python
        pass_filenames: false
        stages: [manual]

      - id: docs-check-docstrings
        name: Check docstring inventory
        entry: >
          python scripts/engineering/dev/run_project_python.py -m scripts.docs
          check-docstrings --summary
        language: python
        pass_filenames: false
        stages: [manual]

      - id: check-root-vcr-cassettes
        name: Block VCR cassette anti-patterns
        entry: >
          python scripts/engineering/dev/run_project_python.py -m scripts.engineering.qa.vcr
          check-placement
        language: python
        pass_filenames: false
        stages: [manual]

      - id: check-vcr-filename-policy
        name: Enforce VCR filename policy
        entry: >
          python scripts/engineering/dev/run_project_python.py -m scripts.engineering.qa.vcr
          check-naming
        language: python
        pass_filenames: false
        stages: [manual]

      - id: check-architecture-dependency-map-drift
        name: Check architecture dependency-map docs drift
        entry: >
          python scripts/engineering/dev/run_project_python.py
          scripts/engineering/qa/generate_architecture_dependency_map.py --check
        language: python
        pass_filenames: false
        files: ^(src/bioetl/.*\.py|docs/02-architecture/generated/module-dependency-map\.(md|json)|scripts/engineering/qa/generate_architecture_dependency_map\.py)$
        stages: [manual]

      - id: ruff-scripts-advisory
        name: Ruff advisory scan for scripts backlog
        entry: python scripts/engineering/dev/run_project_python.py -m ruff check scripts --exit-zero
        language: python
        pass_filenames: false
        stages: [manual]
