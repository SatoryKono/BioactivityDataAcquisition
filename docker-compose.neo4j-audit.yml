name: bioetl-neo4j-audit

services:
  neo4j-audit:
    image: neo4j:5.13-community@sha256:6c6003e890c75c9136df06b9061afbbf9a70673711d2d9abc5937ca7f01abb16
    container_name: bioetl-neo4j-audit
    ports:
      - "127.0.0.1:7475:7474"
      - "127.0.0.1:7688:7687"
    environment:
      NEO4J_USERNAME: ${NEO4J_AUDIT_USERNAME:?NEO4J_AUDIT_USERNAME is required}
      NEO4J_PASSWORD: ${NEO4J_AUDIT_PASSWORD:?NEO4J_AUDIT_PASSWORD is required}
      NEO4J_AUTH: ${NEO4J_AUDIT_USERNAME:?NEO4J_AUDIT_USERNAME is required}/${NEO4J_AUDIT_PASSWORD:?NEO4J_AUDIT_PASSWORD is required}
      NEO4J_ACCEPT_LICENSE_AGREEMENT: "yes"
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1024m
      NEO4J_server_memory_pagecache_size: 256m
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:7474"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
    restart: no
    mem_limit: 2g
    mem_reservation: 1g
    cpus: 1.0
    pids_limit: 256
    init: true
    stop_grace_period: 60s
    logging: {driver: local, options: {max-size: "20m", max-file: "5"}}
