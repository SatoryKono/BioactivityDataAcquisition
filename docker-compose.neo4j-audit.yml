services:
  neo4j-audit:
    image: neo4j:5.13-community
    container_name: bioetl-neo4j-audit
    ports:
      - "7475:7474"  # HTTP: different from MCP instance (7474)
      - "7688:7687"  # Bolt: different from MCP instance (7687)
    environment:
      NEO4J_AUTH: neo4j/audit_secure_password
      NEO4J_ACCEPT_LICENSE_AGREEMENT: "yes"
      # Keep audit above the MCP instance without forcing Docker Desktop into
      # an immediate OOM kill during password initialization.
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 768m
      NEO4J_server_memory_pagecache_size: 128m
    # Ephemeral data (no volumes) - audit runs are temporary
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:7474"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
    restart: no
    mem_limit: 2g
    cpus: "2.0"
