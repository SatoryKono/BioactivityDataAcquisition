# mkdocs.yml
site_name: BioETL Project
site_url: https://SatoryKono.github.io/BioactivityDataAcquisition2/
repo_url: https://github.com/SatoryKono/BioactivityDataAcquisition2
repo_name: SatoryKono/BioactivityDataAcquisition2
edit_uri: "edit/main/docs/"

theme:
    name: material
    palette:
        # Palette toggle for light vs dark mode
        -   scheme: default
            toggle:
                icon: material/brightness-7
                name: Switch to dark mode
        -   scheme: slate
            toggle:
                icon: material/brightness-4
                name: Switch to light mode
    features:
        - navigation.tabs
        - navigation.sections
        - navigation.top
        - search.suggest
        - search.highlight
        - content.code.copy
        - content.code.annotate

plugins:
    - search
    -   mkdocstrings:
            enabled: true
            handlers:
                python:
                    paths: ["src"]  # Path to source code
                    options:
                        docstring_style: google
                        show_root_heading: yes
                        show_source: true
                        allow_inspection: true

markdown_extensions:
    -   pymdownx.highlight:
            anchor_linenums: true
    - pymdownx.inlinehilite
    - pymdownx.snippets
    -   pymdownx.superfences:
            custom_fences:
                -   name: mermaid
                    class: mermaid
                    format: !!python/name:pymdownx.superfences.fence_code_format
    - admonition
    -   toc:
            permalink: true
            slugify: !!python/object/apply:pymdownx.slugs.slugify
                kwds:
                    case: lower

# Mermaid init (theme sync + adaptive layout).
extra_javascript:
    - 'assets/javascripts/mermaid-init.js'

# Responsive diagram styles
extra_css:
    - 'assets/stylesheets/mermaid-responsive.css'

