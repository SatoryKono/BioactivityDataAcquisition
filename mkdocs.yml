# mkdocs.yml
site_name: BioETL Project
site_url: https://SatoryKono.github.io/BioactivityDataAcquisition/
repo_url: https://github.com/SatoryKono/BioactivityDataAcquisition
repo_name: SatoryKono/BioactivityDataAcquisition
edit_uri: "edit/main/docs/"

theme:
    name: material
    palette:
        # Palette toggle for light vs dark mode
        -   scheme: default
            toggle:
                icon: material/brightness-7
                name: Switch to dark mode
        -   scheme: slate
            toggle:
                icon: material/brightness-4
                name: Switch to light mode
    features:
        - navigation.tabs
        - navigation.sections
        - navigation.top
        - search.suggest
        - search.highlight
        - content.code.copy
        - content.code.annotate

plugins:
    - search
    -   mkdocstrings:
            handlers:
                python:
                    options:
                        docstring_style: google
                        show_root_heading: yes
                        show_source: true

markdown_extensions:
    -   pymdownx.highlight:
            anchor_linenums: true
    - pymdownx.inlinehilite
    - pymdownx.snippets
    -   pymdownx.superfences:
            custom_fences:
                -   name: mermaid
                    class: mermaid
                    format: !!python/name:pymdownx.superfences.fence_code_format
    - admonition
    -   toc:
            permalink: true

# Add local vendored mermaid assets to ensure offline builds use the local files
extra_javascript:
    - 'assets/javascripts/mermaid.min.js'
    - 'assets/javascripts/mermaid-init.js'
    - 'assets/javascripts/mermaid-loader.js'

extra_css:
    - 'assets/stylesheets/mermaid.css'

