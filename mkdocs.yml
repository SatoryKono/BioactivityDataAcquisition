# Rendered SVG/PNG diagram images may be generated locally or in CI
# (render-diagrams job). Downgrade broken-link severity so `mkdocs build --strict`
# does not abort on temporarily missing image targets. Real doc-link integrity is
# enforced by `python -m scripts.docs check-links` (runs in the same CI job
# before the build step).
validation:
  links:
    not_found: info

theme:
  name: material
  palette:
    # Palette toggle for light vs dark mode
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

plugins:
  - search
  - mkdocstrings:
      enabled: true
      handlers:
        python:
          paths: ["src"] # Path to source code
          options:
            docstring_style: google
            show_root_heading: yes
            show_source: true
            allow_inspection: true

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
  - admonition
  - toc:
      permalink: true

# Mermaid init (theme sync + adaptive layout).
extra_javascript:
  - "assets/javascripts/mermaid-init.js"

# Responsive diagram styles
extra_css:
  - "assets/stylesheets/mermaid-responsive.css"

