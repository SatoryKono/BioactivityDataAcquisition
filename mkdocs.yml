# mkdocs.yml
site_name: BioETL Project
site_url: https://SatoryKono.github.io/BioactivityDataAcquisition/
repo_url: https://github.com/SatoryKono/BioactivityDataAcquisition
repo_name: SatoryKono/BioactivityDataAcquisition
edit_uri: "edit/main/docs/"

theme:
  name: material
  palette:
    # Palette toggle for light vs dark mode
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

plugins:
  - search
  - mermaid2
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_root_heading: yes
            show_source: true

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - admonition
  - toc:
      permalink: true

# Navigation structure
nav:
  - Home: index.md
  - Governance:
    - Project Rules: 01-governance/rules.md
  - Architecture:
    - System Context: 02-architecture/system-context.md
    - Data Flow: 02-architecture/data-flow.md
    - Decisions:
      - ADR-001: Delta Lake: 02-architecture/decisions/ADR-001-delta-lake-vs-parquet.md
      - ADR-002: Medallion: 02-architecture/decisions/ADR-002-medallion-architecture.md
      - ADR-003: Redis Locking: 02-architecture/decisions/ADR-003-redis-for-distributed-locking.md
      - ADR-004: Pydantic: 02-architecture/decisions/ADR-004-pydantic-vs-dataclasses.md
  - Guides:
    - Getting Started: 03-guides/getting-started.md
    - Running Pipelines: 03-guides/running-pipelines.md
    - Troubleshooting: 03-guides/troubleshooting.md
  - Reference:
    - CLI: 04-reference/cli.md
    - API:
      - Overview: 04-reference/api/index.md
      - Domain: 04-reference/api/domain.md
      - Application: 04-reference/api/application.md
      - Infrastructure: 04-reference/api/infrastructure.md
    - Pipelines:
      - ChEMBL Activity: 04-reference/pipelines/chembl_activity.md
  - Operations:
    - Overview: 05-operations/runbooks/index.md
    - Incident Response: 05-operations/runbooks/incident-response.md
    - Data Recovery: 05-operations/runbooks/data-recovery.md
    - Scaling: 05-operations/runbooks/scaling.md
