groups:
  - name: bioetl_runtime_dashboard_recording
    rules:
      - record: bioetl_runtime_alert_condition_pipeline_preflight_failed_15m
        expr: (max by (pipeline) (max_over_time(bioetl_pipeline_health_check_passed{component="data_source"}[15m])) == bool 0) or ((sum by (pipeline) (increase(bioetl_pipeline_runs_total[15m])) > bool 0) unless on (pipeline) max by (pipeline) (max_over_time(bioetl_pipeline_health_check_passed{component="data_source"}[15m])))

      - record: bioetl_runtime_alert_condition_pipeline_infrastructure_failed_15m
        expr: (max by (pipeline) (max_over_time(bioetl_infrastructure_validated[15m])) < bool 1) or ((sum by (pipeline) (increase(bioetl_pipeline_runs_total[15m])) > bool 0) unless on (pipeline) max by (pipeline) (max_over_time(bioetl_infrastructure_validated[15m])))

      - record: bioetl_runtime_alert_condition_pipeline_runs_failed_15m
        expr: sum by (pipeline, run_type) (increase(bioetl_pipeline_runs_total{status="failed"}[15m])) > bool 0

      - record: bioetl_runtime_alert_condition_runtime_error_rate_high_30m
        expr: ((sum by (pipeline) (increase(bioetl_errors_total[30m])) / clamp_min(sum by (pipeline) (increase(bioetl_records_processed_total{stage="bronze"}[30m])), 1)) > bool 0.05) and (sum by (pipeline) (increase(bioetl_records_processed_total{stage="bronze"}[30m])) >= bool 20)

      - record: bioetl_runtime_alert_condition_record_flow_invariant_violated_15m
        expr: sum by (pipeline, run_type, invariant) (increase(bioetl_record_flow_invariants_total{status="violated"}[15m])) > bool 0

      - record: bioetl_runtime_alert_condition_ingestion_throughput_degraded_15m
        expr: (max by (pipeline, run_type) (max_over_time(bioetl_stage_backlog_records{stage="ingestion"}[15m])) > bool 0) and on (pipeline, run_type) (max by (pipeline, run_type) (max_over_time(bioetl_stage_lag_seconds{stage="ingestion"}[15m])) >= bool 300)

      - record: bioetl_runtime_alert_condition_stage_backlog_active_15m
        expr: max by (pipeline, run_type, stage) (max_over_time(bioetl_stage_backlog_records[15m])) > bool 0

      - record: bioetl_runtime_alert_condition_stage_lag_high_15m
        expr: max by (pipeline, run_type, stage) (max_over_time(bioetl_stage_lag_seconds[15m])) >= bool 300

      - record: bioetl_overview_pipeline_universe
        expr: count by (pipeline) (bioetl_pipeline_stage_expected) > bool 0

      - record: bioetl_runtime_pipeline_run_type_universe
        expr: >-
          (count by (pipeline, run_type) (bioetl_pipeline_runs_total) > bool 0)
          or
          (count by (pipeline, run_type) (bioetl_records_processed_total) > bool 0)

      - record: bioetl_overview_pipeline_run_type_universe
        expr: bioetl_runtime_pipeline_run_type_universe

      - record: bioetl_runtime_alert_condition_gold_write_missing_15m
        expr: >-
          (
            (max by (pipeline, run_type) (max_over_time(bioetl_stage_backlog_records{stage="output"}[15m])) > bool 0)
            and on (pipeline) (bioetl_pipeline_stage_expected{stage="gold"} == bool 1)
          )
          or on (pipeline, run_type) (bioetl_overview_pipeline_run_type_universe * 0)

      - record: bioetl_runtime_alert_condition_no_terminal_run_30m
        expr: >-
          (
            (sum by (pipeline, run_type) (increase(bioetl_records_processed_total{stage="bronze"}[30m])) > bool 0)
            unless on (pipeline, run_type)
            (sum by (pipeline, run_type) (increase(bioetl_pipeline_runs_total{status=~"success|completed|failed"}[30m])) > bool 0)
          )
          or on (pipeline, run_type) (bioetl_overview_pipeline_run_type_universe * 0)

      - record: bioetl_runtime_alert_condition_dq_soft_threshold_15m
        expr: sum by (pipeline) (increase(bioetl_dq_soft_threshold_exceeded[15m])) > bool 0

      - record: bioetl_runtime_alert_condition_dq_hard_fail_15m
        expr: sum by (pipeline) (increase(bioetl_dq_validation_failures_total{severity="hard_fail"}[15m])) > bool 0

      - record: bioetl_runtime_alert_condition_dq_critical_anomaly_30m
        expr: sum by (pipeline) (increase(bioetl_dq_anomaly_detected{severity="critical"}[30m])) > bool 0

      - record: bioetl_runtime_alert_condition_silver_validation_failures_30m
        expr: max by (pipeline) (max_over_time(bioetl_silver_validation_failures_total[30m])) > bool 0

      - record: bioetl_runtime_alert_condition_manifest_write_failed_15m
        expr: sum by (pipeline, run_type) (increase(bioetl_control_plane_manifest_writes_total{status="failed"}[15m])) > bool 0

      - record: bioetl_runtime_alert_condition_ledger_append_failed_15m
        expr: sum by (pipeline) (increase(bioetl_control_plane_ledger_appends_total{status="failed"}[15m])) > bool 0

      - record: bioetl_runtime_alert_condition_checkpoint_incompatible_30m
        expr: sum by (pipeline) (increase(bioetl_checkpoint_compatibility_events_total{disposition=~".*_incompatible"}[30m])) > bool 0

      - record: bioetl_runtime_alert_condition_replay_lag_high_15m
        expr: max by (pipeline, run_type, replay_capability, status) (max_over_time(bioetl_replay_lag_seconds[15m])) >= bool 300

      - record: bioetl_runtime_alert_condition_replay_drift_detected_30m
        expr: sum by (pipeline, run_type, replay_capability, drift_type, status) (increase(bioetl_replay_drift_events_total[30m])) > bool 0

      - record: bioetl_runtime_alert_condition_lineage_refs_missing_15m
        expr: sum by (pipeline) (increase(bioetl_lineage_refs_missing_total[15m])) > bool 0

      - record: bioetl_l0_status
        expr: >-
          max by (pipeline, run_type) (bioetl_l0_input_status_selected == 2)
          or (
            max by (pipeline, run_type) (bioetl_l0_input_status_selected == 1)
            unless on (pipeline, run_type)
            max by (pipeline, run_type) (bioetl_l0_input_status_selected == 2)
          )
          or (
            max by (pipeline, run_type) (bioetl_l0_input_status_selected == 3)
            unless on (pipeline, run_type) (
              max by (pipeline, run_type) (bioetl_l0_input_status_selected == 2)
              or max by (pipeline, run_type) (bioetl_l0_input_status_selected == 1)
            )
          )
          or (
            max by (pipeline, run_type) (bioetl_l0_input_status_selected == 0)
            unless on (pipeline, run_type) (
              max by (pipeline, run_type) (bioetl_l0_input_status_selected == 2)
              or max by (pipeline, run_type) (bioetl_l0_input_status_selected == 1)
              or max by (pipeline, run_type) (bioetl_l0_input_status_selected == 3)
            )
          )

      - record: bioetl_l0_next_action
        expr: bioetl_l0_status
      - record: bioetl_l0_input_status
        labels:
          input: runtime
        expr: >-
          (max by (pipeline, run_type) (
            bioetl_runtime_alert_condition_pipeline_runs_failed_15m
            or bioetl_runtime_alert_condition_stage_backlog_active_15m
            or bioetl_runtime_alert_condition_stage_lag_high_15m
            or bioetl_runtime_alert_condition_gold_write_missing_15m
          ) * 2)
          or (
            ((sum by (pipeline, run_type) (increase(bioetl_pipeline_runs_total[15m])) > bool 0) * 0)
            unless on (pipeline, run_type)
            max by (pipeline, run_type) (
              bioetl_runtime_alert_condition_pipeline_runs_failed_15m
              or bioetl_runtime_alert_condition_stage_backlog_active_15m
              or bioetl_runtime_alert_condition_stage_lag_high_15m
              or bioetl_runtime_alert_condition_gold_write_missing_15m
            )
          )
      - record: bioetl_l0_input_status
        labels:
          input: dq
        expr: >-
          bioetl_overview_pipeline_run_type_universe
          * on (pipeline) group_left() bioetl_dq_current_status
      - record: bioetl_l0_input_status
        labels:
          input: control_plane
        expr: >-
          ((
            bioetl_overview_pipeline_run_type_universe
            * on (pipeline) group_left()
            (max by (pipeline) (
              bioetl_runtime_alert_condition_manifest_write_failed_15m
              or bioetl_runtime_alert_condition_ledger_append_failed_15m
              or bioetl_runtime_alert_condition_checkpoint_incompatible_30m
              or bioetl_runtime_alert_condition_lineage_refs_missing_15m
            ) > bool 0)
          ) * 2)
          +
          ((
            bioetl_overview_pipeline_run_type_universe
            * on (pipeline) group_left()
            (
              (max by (pipeline) (
                bioetl_runtime_alert_condition_manifest_write_failed_15m
                or bioetl_runtime_alert_condition_ledger_append_failed_15m
                or bioetl_runtime_alert_condition_checkpoint_incompatible_30m
                or bioetl_runtime_alert_condition_lineage_refs_missing_15m
              ) == bool 0)
              * (sum by (pipeline) (increase(bioetl_pipeline_runs_total[15m])) > bool 0)
            )
          ) * 0)
      - record: bioetl_l0_input_status
        labels:
          input: provider
        expr: (bioetl_runtime_alert_condition_provider_failure_rate_high_15m > bool 0) * 2 + ((bioetl_runtime_alert_condition_provider_failure_rate_high_15m == bool 0) * (bioetl_provider_health_check_total_15m > bool 0)) * 0
      - record: bioetl_l0_input_status
        labels:
          input: workflow
        expr: >-
          max by (pipeline, run_type) (bioetl_workflow_current_status)
          or label_replace(
            (
              bioetl_overview_pipeline_run_type_universe
              unless on (pipeline, run_type) max by (pipeline, run_type) (bioetl_workflow_current_status)
            ) * 3,
            "input",
            "workflow",
            "",
            ""
          )
      - record: bioetl_l0_input_status
        labels:
          input: gold
        expr: (bioetl_runtime_alert_condition_gold_write_missing_15m > bool 0) * 2 + ((bioetl_runtime_alert_condition_gold_write_missing_15m == bool 0) * (sum by (pipeline, run_type) (increase(bioetl_records_processed_total{stage="gold"}[15m])) > bool 0)) * 0
      - record: bioetl_l0_input_status_selected
        labels:
          input: runtime
        expr: >-
          bioetl_l0_input_status{input="runtime"}
          or label_replace(
            (
              bioetl_overview_pipeline_run_type_universe
              unless on (pipeline, run_type) bioetl_l0_input_status{input="runtime"}
            ) * 3,
            "input",
            "runtime",
            "",
            ""
          )
      - record: bioetl_l0_input_status_selected
        labels:
          input: dq
        expr: >-
          bioetl_l0_input_status{input="dq"}
          or label_replace(
            (
              bioetl_overview_pipeline_run_type_universe
              unless on (pipeline, run_type) bioetl_l0_input_status{input="dq"}
            ) * 3,
            "input",
            "dq",
            "",
            ""
          )
      - record: bioetl_l0_input_status_selected
        labels:
          input: control_plane
        expr: >-
          bioetl_l0_input_status{input="control_plane"}
          or label_replace(
            (
              bioetl_overview_pipeline_run_type_universe
              unless on (pipeline, run_type) bioetl_l0_input_status{input="control_plane"}
            ) * 3,
            "input",
            "control_plane",
            "",
            ""
          )
      - record: bioetl_l0_input_status_selected
        labels:
          input: provider
        expr: >-
          label_replace(
            bioetl_overview_pipeline_run_type_universe
            * scalar(max(bioetl_l0_input_status{input="provider"}) or vector(3)),
            "input",
            "provider",
            "",
            ""
          )
      - record: bioetl_l0_input_status_selected
        labels:
          input: workflow
        expr: >-
          bioetl_l0_input_status{input="workflow"}
          or label_replace(
            (
              bioetl_overview_pipeline_run_type_universe
              unless on (pipeline, run_type) bioetl_l0_input_status{input="workflow"}
            ) * 3,
            "input",
            "workflow",
            "",
            ""
          )
      - record: bioetl_l0_input_status_selected
        labels:
          input: gold
        expr: >-
          bioetl_l0_input_status{input="gold"}
          or label_replace(
            (
              bioetl_overview_pipeline_run_type_universe
              unless on (pipeline, run_type) bioetl_l0_input_status{input="gold"}
            ) * 3,
            "input",
            "gold",
            "",
            ""
          )
      - record: bioetl_l0_next_action_route
        labels:
          action_target: runtime
          action_reason: runtime_blockers_active
          action_dashboard_uid: bioetl-runtime
        expr: (bioetl_l0_input_status_selected{input="runtime"} >= bool 2) * 50
      - record: bioetl_l0_next_action_route
        labels:
          action_target: control_plane
          action_reason: control_plane_guardrail_active
          action_dashboard_uid: bioetl-control-plane-v1
        expr: (bioetl_l0_input_status_selected{input="control_plane"} >= bool 2) * 40
      - record: bioetl_l0_next_action_route
        labels:
          action_target: runtime
          action_reason: gold_lifecycle_blocking
          action_dashboard_uid: bioetl-runtime
        expr: (bioetl_l0_input_status_selected{input="gold"} >= bool 2) * 35
      - record: bioetl_l0_next_action_route
        labels:
          action_target: dq
          action_reason: dq_threshold_or_validation_signal
          action_dashboard_uid: bioetl-dq-v2
        expr: (bioetl_l0_input_status_selected{input="dq"} >= bool 1) * 30
      - record: bioetl_l0_next_action_route
        labels:
          action_target: provider
          action_reason: provider_global_degradation
          action_dashboard_uid: bioetl-provider-health-v2
        expr: >-
          (bioetl_overview_pipeline_run_type_universe
          * scalar((max(bioetl_l0_input_status_selected{input="provider"} >= bool 2)) or vector(0))) * 20
      - record: bioetl_l0_next_action_route
        labels:
          action_target: workflow
          action_reason: workflow_scope_requires_review
          action_dashboard_uid: bioetl-workflow-overview
        expr: (bioetl_l0_input_status_selected{input="workflow"} >= bool 1) * 10
      - record: bioetl_l0_next_action_route
        labels:
          action_target: monitor
          action_reason: no_recent_activity_or_unknown_state
          action_dashboard_uid: bioetl-overview-v2
        expr: bioetl_overview_pipeline_run_type_universe * 5
      - record: bioetl_l1_runtime_blocker_status
        expr: bioetl_l0_input_status_selected{input="runtime"}
      - record: bioetl_l1_dq_status
        expr: bioetl_l0_input_status_selected{input="dq"}
      - record: bioetl_l1_gold_lifecycle_status
        labels:
          lifecycle_state: runtime_failed_owner
        expr: (bioetl_l0_input_status_selected{input="runtime"} == bool 2) * 2
      - record: bioetl_l1_gold_lifecycle_status
        labels:
          lifecycle_state: gold_missing_after_success
        expr: (bioetl_runtime_alert_condition_gold_write_missing_15m > bool 0) * 2
      - record: bioetl_l1_gold_lifecycle_status
        labels:
          lifecycle_state: pending_no_recent_gold
        expr: |
          (
            (
              (
                sum by (pipeline, run_type) (increase(bioetl_pipeline_runs_total[15m])) > bool 0
              )
              unless on (pipeline, run_type)
              (sum by (pipeline, run_type) (increase(bioetl_records_processed_total{stage="gold"}[15m])) > bool 0)
          )
          unless on (pipeline, run_type)
          (bioetl_runtime_alert_condition_gold_write_missing_15m > bool 0)
          )
          unless on (pipeline, run_type)
          (bioetl_l0_input_status_selected{input="runtime"} == bool 2)
          * on (pipeline) group_left() max by (pipeline) (bioetl_pipeline_stage_expected{stage="gold"} == bool 1) * 1
      - record: bioetl_l1_gold_lifecycle_status
        labels:
          lifecycle_state: disabled
        expr: >-
          (bioetl_overview_pipeline_run_type_universe * 0)
          and on (pipeline) (bioetl_pipeline_stage_expected{stage="gold"} == bool 0)
      - record: bioetl_l1_gold_lifecycle_status
        labels:
          lifecycle_state: healthy_recent_gold
        expr: >-
          ((sum by (pipeline, run_type) (increase(bioetl_records_processed_total{stage="gold"}[15m])) > bool 0)
          unless on (pipeline, run_type) (bioetl_runtime_alert_condition_gold_write_missing_15m > bool 0))
          unless on (pipeline, run_type) (bioetl_l0_input_status_selected{input="runtime"} == bool 2) * 0
      - record: bioetl_l1_control_plane_current_status
        expr: bioetl_l0_input_status_selected{input="control_plane"}
      - record: bioetl_l1_provider_global_status
        expr: max by (provider) (bioetl_l0_input_status{input="provider"})
      - record: bioetl_l1_workflow_selected_status
        expr: bioetl_l0_input_status_selected{input="workflow"}
      - record: bioetl_l1_workflow_global_status
        expr: max by (pipeline, run_type) (bioetl_l0_input_status_selected{input="workflow"})

      - record: bioetl_runtime_current_activity_15m
        expr: sum by (pipeline, run_type) (increase(bioetl_pipeline_runs_total[15m])) > bool 0

      - record: bioetl_runtime_current_failure_signals_15m
        expr: >-
          (
            max by (pipeline, run_type) (bioetl_runtime_alert_condition_pipeline_runs_failed_15m or bioetl_runtime_alert_condition_stage_backlog_active_15m or bioetl_runtime_alert_condition_stage_lag_high_15m or bioetl_runtime_alert_condition_gold_write_missing_15m)
            or
            (bioetl_runtime_pipeline_run_type_universe
            * on (pipeline) group_left() max by (pipeline) (bioetl_runtime_alert_condition_pipeline_preflight_failed_15m or bioetl_runtime_alert_condition_pipeline_infrastructure_failed_15m))
          ) > 0

      - record: bioetl_runtime_current_degraded_signals_15m
        expr: max by (pipeline, run_type) (bioetl_runtime_alert_condition_no_terminal_run_30m or bioetl_runtime_alert_condition_ingestion_throughput_degraded_15m or bioetl_runtime_alert_condition_record_flow_invariant_violated_15m) > 0

      - record: bioetl_runtime_current_status
        expr: (bioetl_runtime_current_failure_signals_15m * 2) or (bioetl_runtime_current_degraded_signals_15m unless on (pipeline, run_type) bioetl_runtime_current_failure_signals_15m) or (((bioetl_runtime_current_activity_15m * 0) unless on (pipeline, run_type) bioetl_runtime_current_failure_signals_15m) unless on (pipeline, run_type) bioetl_runtime_current_degraded_signals_15m)

      - record: bioetl_runtime_current_blocker_reason
        labels:
          reason: preflight_failed
          severity: failing
          action_target: runtime
        expr: bioetl_runtime_pipeline_run_type_universe * on (pipeline) group_left() bioetl_runtime_alert_condition_pipeline_preflight_failed_15m
      - record: bioetl_runtime_current_blocker_reason
        labels:
          reason: infrastructure_failed
          severity: failing
          action_target: control_plane
        expr: bioetl_runtime_pipeline_run_type_universe * on (pipeline) group_left() bioetl_runtime_alert_condition_pipeline_infrastructure_failed_15m
      - record: bioetl_runtime_current_blocker_reason
        labels:
          reason: failed_run
          severity: failing
          action_target: runtime
        expr: bioetl_runtime_alert_condition_pipeline_runs_failed_15m
      - record: bioetl_runtime_current_blocker_reason
        labels:
          reason: stage_backlog
          severity: failing
          action_target: runtime
        expr: bioetl_runtime_alert_condition_stage_backlog_active_15m
      - record: bioetl_runtime_current_blocker_reason
        labels:
          reason: stage_lag
          severity: failing
          action_target: runtime
        expr: bioetl_runtime_alert_condition_stage_lag_high_15m
      - record: bioetl_runtime_current_blocker_reason
        labels:
          reason: gold_write_missing
          severity: failing
          action_target: data_quality
        expr: bioetl_runtime_alert_condition_gold_write_missing_15m
      - record: bioetl_runtime_current_blocker_reason
        labels:
          reason: no_terminal_run
          severity: degraded
          action_target: workflow
        expr: bioetl_runtime_alert_condition_no_terminal_run_30m
      - record: bioetl_runtime_current_blocker_reason
        labels:
          reason: ingestion_throughput_degraded
          severity: degraded
          action_target: runtime
        expr: bioetl_runtime_alert_condition_ingestion_throughput_degraded_15m
      - record: bioetl_runtime_current_blocker_reason
        labels:
          reason: record_flow_invariant
          severity: degraded
          action_target: runtime
        expr: bioetl_runtime_alert_condition_record_flow_invariant_violated_15m

      - record: bioetl_provider_current_status
        expr: ((max by (provider) (bioetl_provider_health_status == bool 0) * 2) + max by (provider) (bioetl_provider_health_status == bool 1) + (max by (provider) (bioetl_provider_health_status == bool 2) * 0)) or ((bioetl_provider_health_check_provider_universe_15m * 0) / (bioetl_provider_health_check_provider_universe_15m * 0))

      - record: bioetl_provider_current_cause
        labels:
          cause: health_status_unhealthy
          severity: failing
        expr: max by (provider) (bioetl_provider_health_status == bool 0)
      - record: bioetl_provider_current_cause
        labels:
          cause: health_status_degraded
          severity: degraded
        expr: max by (provider) (bioetl_provider_health_status == bool 1)
      - record: bioetl_provider_current_cause
        labels:
          cause: failure_rate_high
          severity: failing
        expr: bioetl_runtime_alert_condition_provider_failure_rate_high_15m
      - record: bioetl_provider_current_cause
        labels:
          cause: retries_exhausted
          severity: failing
        expr: max by (provider) (bioetl_runtime_alert_condition_provider_retries_exhausted_1h)
      - record: bioetl_provider_current_cause
        labels:
          cause: adapter_latency_high
          severity: degraded
        expr: bioetl_runtime_alert_condition_provider_adapter_latency_high_30m
      - record: bioetl_provider_current_cause
        labels:
          cause: http_error_rate_high
          severity: degraded
        expr: bioetl_runtime_alert_condition_provider_http_error_rate_high_15m
      - record: bioetl_provider_current_cause
        labels:
          cause: rate_limiter_wait_high
          severity: degraded
        expr: bioetl_runtime_alert_condition_provider_rate_limiter_wait_high_30m
      - record: bioetl_provider_current_cause
        labels:
          cause: rate_limiter_tokens_depleted
          severity: degraded
        expr: bioetl_runtime_alert_condition_provider_rate_limiter_tokens_depleted_15m

      - record: bioetl_dq_current_activity_15m
        expr: >-
          (
            (sum by (pipeline) (increase(bioetl_records_processed_total{stage="bronze"}[15m])) > bool 0)
            +
            (max by (pipeline) (max_over_time(bioetl_records_processed_total{stage="bronze"}[15m])) > bool 0)
          ) > bool 0

      - record: bioetl_dq_current_failure_signals_15m
        expr: >-
          (
            (bioetl_runtime_alert_condition_dq_hard_fail_15m or on (pipeline) (bioetl_overview_pipeline_universe * 0))
            +
            (bioetl_runtime_alert_condition_dq_critical_anomaly_30m or on (pipeline) (bioetl_overview_pipeline_universe * 0))
            +
            (bioetl_runtime_alert_condition_silver_validation_failures_30m or on (pipeline) (bioetl_overview_pipeline_universe * 0))
          ) > bool 0

      - record: bioetl_dq_monitor_disabled_current
        expr: max by (pipeline) (bioetl_dq_monitor_enabled == bool 0) > 0

      - record: bioetl_dq_current_degraded_signals_15m
        expr: >-
          (
            (bioetl_runtime_alert_condition_dq_soft_threshold_15m or on (pipeline) (bioetl_overview_pipeline_universe * 0))
            +
            ((max by (pipeline) (max_over_time(bioetl_dq_records_quarantined_total[15m])) > bool 0) or on (pipeline) (bioetl_overview_pipeline_universe * 0))
            +
            ((max by (pipeline) (max_over_time(bioetl_silver_filter_rejections_total[15m])) > bool 0) or on (pipeline) (bioetl_overview_pipeline_universe * 0))
            +
            (bioetl_dq_monitor_disabled_current or on (pipeline) (bioetl_overview_pipeline_universe * 0))
          ) > bool 0

      - record: bioetl_dq_current_reason
        labels:
          reason: hard_validation_failure
          severity: crit
          action_target: data_quality
        expr: bioetl_runtime_alert_condition_dq_hard_fail_15m
      - record: bioetl_dq_current_reason
        labels:
          reason: critical_anomaly
          severity: crit
          action_target: data_quality
        expr: bioetl_runtime_alert_condition_dq_critical_anomaly_30m
      - record: bioetl_dq_current_reason
        labels:
          reason: silver_validation_failure
          severity: crit
          action_target: data_quality
        expr: bioetl_runtime_alert_condition_silver_validation_failures_30m
      - record: bioetl_dq_current_reason
        labels:
          reason: soft_threshold
          severity: warn
          action_target: data_quality
        expr: bioetl_runtime_alert_condition_dq_soft_threshold_15m
      - record: bioetl_dq_current_reason
        labels:
          reason: dq_monitor_disabled
          severity: warn
          action_target: data_quality
        expr: bioetl_dq_monitor_disabled_current
      - record: bioetl_dq_current_reason
        labels:
          reason: quarantined_records
          severity: warn
          action_target: silver_reject_explorer
        expr: max by (pipeline) (max_over_time(bioetl_dq_records_quarantined_total[15m])) > bool 0
      - record: bioetl_dq_current_reason
        labels:
          reason: silver_filter_rejects
          severity: warn
          action_target: silver_reject_explorer
        expr: max by (pipeline) (max_over_time(bioetl_silver_filter_rejections_total[15m])) > bool 0

      - record: bioetl_dq_current_status
        expr: >-
          (max by (pipeline) (bioetl_dq_current_reason{severity="crit"} > 0) * 2)
          or (
            (max by (pipeline) (bioetl_dq_current_reason{severity="warn"} > 0))
            unless on (pipeline) (max by (pipeline) (bioetl_dq_current_reason{severity="crit"} > 0))
          )
          or (
            ((bioetl_dq_current_activity_15m * 0)
            unless on (pipeline) (max by (pipeline) (bioetl_dq_current_reason{severity="crit"} > 0)))
            unless on (pipeline) (max by (pipeline) (bioetl_dq_current_reason{severity="warn"} > 0))
          )

      - record: bioetl_provider_health_check_provider_universe_15m
        expr: (sum by (provider) (increase(bioetl_health_check_success_total[15m]))) or (sum by (provider) (increase(bioetl_health_check_degraded_total[15m]))) or (sum by (provider) (increase(bioetl_health_check_failures_total[15m])))

      - record: bioetl_provider_health_check_success_15m
        expr: (sum by (provider) (increase(bioetl_health_check_success_total[15m]))) or (bioetl_provider_health_check_provider_universe_15m * 0)

      - record: bioetl_provider_health_check_degraded_15m
        expr: (sum by (provider) (increase(bioetl_health_check_degraded_total[15m]))) or (bioetl_provider_health_check_provider_universe_15m * 0)

      - record: bioetl_provider_health_check_failures_15m
        expr: (sum by (provider) (increase(bioetl_health_check_failures_total[15m]))) or (bioetl_provider_health_check_provider_universe_15m * 0)

      - record: bioetl_provider_health_check_total_15m
        expr: bioetl_provider_health_check_success_15m + bioetl_provider_health_check_degraded_15m + bioetl_provider_health_check_failures_15m

      - record: bioetl_runtime_alert_condition_provider_failure_rate_high_15m
        expr: (bioetl_provider_health_check_failures_15m / clamp_min(bioetl_provider_health_check_total_15m, 1)) > bool 0.2

      - record: bioetl_runtime_alert_condition_provider_retries_exhausted_1h
        expr: sum by (provider, operation) (increase(bioetl_data_source_retry_exhausted_total[1h])) > bool 0

      - record: bioetl_runtime_alert_condition_provider_adapter_latency_high_30m
        expr: histogram_quantile(0.95, sum by (le, provider) (increase(bioetl_adapter_request_duration_seconds_bucket[30m]))) > bool 5

      - record: bioetl_runtime_alert_condition_provider_http_error_rate_high_15m
        expr: (sum by (provider) (increase(bioetl_http_request_errors_total[15m])) / clamp_min(sum by (provider) (increase(bioetl_http_request_duration_seconds_count[15m])), 1)) > bool 0.1

      - record: bioetl_runtime_alert_condition_provider_rate_limiter_wait_high_30m
        expr: histogram_quantile(0.95, sum by (le, provider) (increase(bioetl_rate_limiter_wait_seconds_bucket[30m]))) > bool 1

      - record: bioetl_runtime_alert_condition_provider_rate_limiter_tokens_depleted_15m
        expr: min by (provider) (min_over_time(bioetl_rate_limiter_tokens_available[15m])) < bool 1

      - record: bioetl_silver_filter_rejects_stage_total_15m
        expr: sum by (pipeline, run_type) (increase(bioetl_records_processed_total{stage="filtered_out"}[15m]))

      - record: bioetl_silver_filter_rejections_breakdown_total_15m
        expr: sum by (pipeline, run_type) (increase(bioetl_silver_filter_rejections_total[15m]))

      - record: bioetl_silver_filter_reject_total_mismatch_15m
        expr: sum by (pipeline, run_type) (abs((bioetl_silver_filter_rejects_stage_total_15m or (bioetl_silver_filter_rejections_breakdown_total_15m * 0)) - (bioetl_silver_filter_rejections_breakdown_total_15m or (bioetl_silver_filter_rejects_stage_total_15m * 0))) > bool 0)

  - name: bioetl_monitoring_stack_observability
    rules:
      - alert: BioETLMetricsEndpointUnavailable
        expr: up{job="bioetl"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "BioETL metrics endpoint is unavailable"
          description: "Prometheus could not scrape the BioETL /metrics endpoint for instance={{ $labels.instance }}."
          runbook: "docs/05-operations/runbooks/observability-checklist.md"

      - alert: BioETLMetricsEndpointScrapeMissing
        expr: absent_over_time(up{job="bioetl"}[10m])
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "BioETL metrics endpoint has stopped emitting scrape samples"
          description: "No up{job=\"bioetl\"} samples were observed for 10m; monitoring blind spots may be silent."
          runbook: "docs/05-operations/runbooks/observability-checklist.md"

      - alert: BioETLPrometheusUnavailable
        expr: up{job="prometheus"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Prometheus is unavailable"
          description: "Prometheus self-scrape failed for instance={{ $labels.instance }}."
          runbook: "docs/05-operations/runbooks/observability-checklist.md"

      - alert: BioETLGrafanaUnavailable
        expr: up{job="grafana"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Grafana is unavailable"
          description: "Grafana metrics endpoint is unavailable for instance={{ $labels.instance }}."
          runbook: "docs/05-operations/runbooks/observability-checklist.md"

      - alert: BioETLPushgatewayUnavailable
        expr: up{job="pushgateway"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Pushgateway is unavailable"
          description: "Pushgateway is not reachable for instance={{ $labels.instance }}."
          runbook: "docs/05-operations/runbooks/observability-checklist.md"

  - name: bioetl_pipeline_runtime_observability
    rules:
      - alert: BioETLPipelinePreflightDataSourceFailed
        expr: (max by (pipeline) (max_over_time(bioetl_pipeline_health_check_passed{component="data_source"}[15m])) == 0) or ((sum by (pipeline) (increase(bioetl_pipeline_runs_total[15m])) > 0) unless on (pipeline) max by (pipeline) (max_over_time(bioetl_pipeline_health_check_passed{component="data_source"}[15m])))
        for: 2m
        labels:
          severity: critical
          component: data_source
        annotations:
          summary: "Pipeline preflight data-source check failed"
          description: "No successful pipeline_health_check_passed=1 for component=data_source was observed for pipeline={{ $labels.pipeline }} in the last 15m."
          runbook: "docs/05-operations/runbooks/pipeline-failure-critical.md"

      - alert: BioETLPipelineInfrastructureValidationFailed
        expr: (max by (pipeline) (max_over_time(bioetl_infrastructure_validated[15m])) < 1) or ((sum by (pipeline) (increase(bioetl_pipeline_runs_total[15m])) > 0) unless on (pipeline) max by (pipeline) (max_over_time(bioetl_infrastructure_validated[15m])))
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Pipeline infrastructure validation failed"
          description: "No successful infrastructure_validated=1 was observed for pipeline={{ $labels.pipeline }} in the last 15m."
          runbook: "docs/05-operations/runbooks/pipeline-failure-critical.md"

      - alert: BioETLPipelineRunFailed
        expr: sum by (pipeline, run_type) (increase(bioetl_pipeline_runs_total{status="failed"}[15m])) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Pipeline run failed"
          description: "At least one pipeline run failed for pipeline={{ $labels.pipeline }} run_type={{ $labels.run_type }} in the last 15m."
          runbook: "docs/05-operations/runbooks/pipeline-failure-critical.md"

      - alert: BioETLNoRecordsProcessed
        expr: ((sum by (pipeline, run_type) (increase(bioetl_pipeline_runs_total[30m])) > 0) unless on (pipeline, run_type) (sum by (pipeline, run_type) (increase(bioetl_records_processed_total[30m])) > 0))
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Pipeline runs completed without processing records"
          description: "At least one pipeline run was observed for pipeline={{ $labels.pipeline }} run_type={{ $labels.run_type }} over the last 30m, but bioetl_records_processed_total did not increase."
          runbook: "docs/05-operations/runbooks/pipeline-failure-critical.md"

      - alert: BioETLRuntimeErrorRateHigh
        expr: ((sum by (pipeline) (increase(bioetl_errors_total[30m])) / clamp_min(sum by (pipeline) (increase(bioetl_records_processed_total{stage="bronze"}[30m])), 1)) > 0.05) and (sum by (pipeline) (increase(bioetl_records_processed_total{stage="bronze"}[30m])) >= 20)
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Pipeline runtime error ratio is elevated"
          description: "Pipeline runtime error ratio exceeded 5% for pipeline={{ $labels.pipeline }} over the last 30m, with at least 20 bronze records observed."
          runbook: "docs/05-operations/runbooks/observability-checklist.md"

      - alert: BioETLRecordFlowInvariantViolated
        expr: sum by (pipeline, run_type, invariant) (increase(bioetl_record_flow_invariants_total{status="violated"}[15m])) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Record-flow invariant violated"
          description: "bioetl_record_flow_invariants_total recorded violated status for invariant={{ $labels.invariant }} pipeline={{ $labels.pipeline }} run_type={{ $labels.run_type }} in the last 15m."
          runbook: "docs/05-operations/runbooks/observability-checklist.md"

      - alert: BioETLIngestionThroughputDegraded
        expr: (max by (pipeline, run_type) (max_over_time(bioetl_stage_backlog_records{stage="ingestion"}[15m])) > 0) and on (pipeline, run_type) (max by (pipeline, run_type) (max_over_time(bioetl_stage_lag_seconds{stage="ingestion"}[15m])) >= 300)
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Ingestion throughput is degraded"
          description: "Ingestion backlog remained active and stage lag exceeded 300s for pipeline={{ $labels.pipeline }} run_type={{ $labels.run_type }}."
          runbook: "docs/05-operations/runbooks/observability-checklist.md"

      - alert: BioETLStageBacklogActive
        expr: max by (pipeline, run_type, stage) (max_over_time(bioetl_stage_backlog_records[15m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Stage backlog remains active"
          description: "bioetl_stage_backlog_records stayed above zero for pipeline={{ $labels.pipeline }} run_type={{ $labels.run_type }} stage={{ $labels.stage }} within the last 15m."
          runbook: "docs/05-operations/runbooks/observability-checklist.md"

      - alert: BioETLStageLagHigh
        expr: max by (pipeline, run_type, stage) (max_over_time(bioetl_stage_lag_seconds[15m])) >= 300
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Stage lag is elevated"
          description: "bioetl_stage_lag_seconds exceeded 300s for pipeline={{ $labels.pipeline }} run_type={{ $labels.run_type }} stage={{ $labels.stage }} within the last 15m."
          runbook: "docs/05-operations/runbooks/observability-checklist.md"

      - alert: BioETLMemoryPressureActive
        expr: max by (pipeline) (max_over_time(bioetl_memory_pressure_state[15m])) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Adaptive memory pressure is active"
          description: "bioetl_memory_pressure_state stayed active for pipeline={{ $labels.pipeline }} within the last 15m."
          runbook: "docs/05-operations/runbooks/observability-checklist.md"

  - name: bioetl_control_plane_traceability_observability
    rules:
      - alert: BioETLControlPlaneManifestWriteFailed
        expr: sum by (pipeline, run_type) (increase(bioetl_control_plane_manifest_writes_total{status="failed"}[15m])) > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Run manifest persistence failures detected"
          description: "bioetl_control_plane_manifest_writes_total increased with status=failed for pipeline={{ $labels.pipeline }} run_type={{ $labels.run_type }} in the last 15m."
          runbook: "docs/05-operations/runbooks/run-manifest-inspection.md"

      - alert: BioETLRunLedgerAppendFailed
        expr: sum by (pipeline, event_type) (increase(bioetl_control_plane_ledger_appends_total{status="failed"}[15m])) > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Run ledger append failures detected"
          description: "bioetl_control_plane_ledger_appends_total increased with status=failed for pipeline={{ $labels.pipeline }} event_type={{ $labels.event_type }} in the last 15m."
          runbook: "docs/05-operations/runbooks/run-manifest-inspection.md"

      - alert: BioETLCheckpointCompatibilityBlocked
        expr: sum by (pipeline) (increase(bioetl_checkpoint_compatibility_events_total{disposition=~".*_incompatible"}[30m])) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Checkpoint compatibility blocked or degraded resume"
          description: "bioetl_checkpoint_compatibility_events_total recorded incompatible resume decisions for pipeline={{ $labels.pipeline }} in the last 30m."
          runbook: "docs/05-operations/runbooks/checkpoint-debugging.md"

      - alert: BioETLCheckpointLoadFailed
        expr: sum by (pipeline) (increase(bioetl_checkpoint_load_events_total{status="failed"}[15m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Checkpoint load failures detected"
          description: "bioetl_checkpoint_load_events_total increased with status=failed for pipeline={{ $labels.pipeline }} in the last 15m."
          runbook: "docs/05-operations/runbooks/checkpoint-debugging.md"

      - alert: BioETLCheckpointSaveFailed
        expr: sum by (pipeline, operation) (increase(bioetl_checkpoint_save_events_total{status="failed"}[15m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Checkpoint save failures detected"
          description: "bioetl_checkpoint_save_events_total increased with status=failed for pipeline={{ $labels.pipeline }} operation={{ $labels.operation }} in the last 15m."
          runbook: "docs/05-operations/runbooks/checkpoint-debugging.md"

      - alert: BioETLCheckpointOperatorFailed
        expr: sum by (operation) (increase(bioetl_checkpoint_operator_operations_total{status="failed"}[15m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Checkpoint operator action failures detected"
          description: "bioetl_checkpoint_operator_operations_total increased with status=failed for operation={{ $labels.operation }} in the last 15m."
          runbook: "docs/05-operations/runbooks/checkpoint-debugging.md"

      - alert: BioETLCheckpointSaveLatencyHigh
        expr: histogram_quantile(0.95, sum by (le, pipeline, operation) (increase(bioetl_checkpoint_save_duration_seconds_bucket[30m]))) > 1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Checkpoint save latency is elevated"
          description: "Checkpoint save p95 exceeded 1s for pipeline={{ $labels.pipeline }} operation={{ $labels.operation }} over the last 30m."
          runbook: "docs/05-operations/runbooks/checkpoint-debugging.md"

      - alert: BioETLCheckpointOperatorLatencyHigh
        expr: histogram_quantile(0.95, sum by (le, operation) (increase(bioetl_checkpoint_operator_duration_seconds_bucket[30m]))) > 1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Checkpoint operator latency is elevated"
          description: "Checkpoint operator p95 exceeded 1s for operation={{ $labels.operation }} over the last 30m."
          runbook: "docs/05-operations/runbooks/checkpoint-debugging.md"

      - alert: BioETLReplayNotReconstructable
        expr: sum by (pipeline, replay_capability, strict_requirement) (increase(bioetl_replay_reconstructability_events_total{status="not_reconstructable"}[30m])) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Replay request cannot be reconstructed safely"
          description: "bioetl_replay_reconstructability_events_total recorded not_reconstructable for pipeline={{ $labels.pipeline }} replay_capability={{ $labels.replay_capability }} strict_requirement={{ $labels.strict_requirement }} in the last 30m."
          runbook: "docs/05-operations/runbooks/checkpoint-debugging.md"

      - alert: BioETLReplayLagHigh
        expr: (bioetl_runtime_alert_condition_replay_lag_high_15m > 0) and on (pipeline, run_type, replay_capability, status) (bioetl_replay_lag_seconds >= 300)
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Replay lag is elevated"
          description: "bioetl_replay_lag_seconds exceeded 300s for pipeline={{ $labels.pipeline }} run_type={{ $labels.run_type }} replay_capability={{ $labels.replay_capability }} status={{ $labels.status }}."
          runbook: "docs/05-operations/runbooks/checkpoint-debugging.md"

      - alert: BioETLReplayDriftDetected
        expr: (bioetl_runtime_alert_condition_replay_drift_detected_30m > 0) and on (pipeline, run_type, replay_capability, drift_type, status) (increase(bioetl_replay_drift_events_total[30m]) > 0)
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Replay drift was detected"
          description: "bioetl_replay_drift_events_total increased for pipeline={{ $labels.pipeline }} run_type={{ $labels.run_type }} replay_capability={{ $labels.replay_capability }} drift_type={{ $labels.drift_type }}."
          runbook: "docs/05-operations/runbooks/checkpoint-debugging.md"

      - alert: BioETLLineageFragmentPersistenceFailed
        expr: sum by (pipeline, layer) (increase(bioetl_lineage_fragments_emitted_total{status="failed"}[15m])) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Lineage fragment persistence failures detected"
          description: "bioetl_lineage_fragments_emitted_total increased with status=failed for pipeline={{ $labels.pipeline }} layer={{ $labels.layer }} in the last 15m."
          runbook: "docs/05-operations/runbooks/traceability-signal-ownership.md"

      - alert: BioETLLineageRefsMissing
        expr: sum by (pipeline, layer, ref_type) (increase(bioetl_lineage_refs_missing_total[15m])) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Missing upstream lineage references detected"
          description: "bioetl_lineage_refs_missing_total increased for pipeline={{ $labels.pipeline }} layer={{ $labels.layer }} ref_type={{ $labels.ref_type }} in the last 15m."
          runbook: "docs/05-operations/runbooks/traceability-signal-ownership.md"

      - alert: BioETLControlPlaneManifestWriteFailureRateHigh
        expr: (sum by (pipeline, run_type) (increase(bioetl_control_plane_manifest_writes_total{status="failed"}[30m])) / clamp_min(sum by (pipeline, run_type) (increase(bioetl_control_plane_manifest_writes_total[30m])), 1)) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Manifest write failure ratio is elevated"
          description: "Manifest write failure ratio exceeded 10% for pipeline={{ $labels.pipeline }} run_type={{ $labels.run_type }} in the last 30m."
          runbook: "docs/05-operations/runbooks/run-manifest-inspection.md"

      - alert: BioETLRunLedgerAppendFailureRateHigh
        expr: (sum by (pipeline, event_type) (increase(bioetl_control_plane_ledger_appends_total{status="failed"}[30m])) / clamp_min(sum by (pipeline, event_type) (increase(bioetl_control_plane_ledger_appends_total[30m])), 1)) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Run-ledger append failure ratio is elevated"
          description: "Run-ledger append failure ratio exceeded 10% for pipeline={{ $labels.pipeline }} event_type={{ $labels.event_type }} in the last 30m."
          runbook: "docs/05-operations/runbooks/run-manifest-inspection.md"

      - alert: BioETLControlPlaneReadFailureRate
        expr: (sum by (store, operation) (increase(bioetl_control_plane_reads_total{status="failed"}[30m])) / clamp_min(sum by (store, operation) (increase(bioetl_control_plane_reads_total[30m])), 1)) > 0.05
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Control-plane read failure rate is elevated"
          description: "Control-plane read failure rate exceeded 5% for store={{ $labels.store }} operation={{ $labels.operation }} in the last 30m."
          runbook: "docs/05-operations/runbooks/observability-checklist.md"

  - name: bioetl_dq_observability
    rules:
      - alert: BioETLDQSoftThresholdExceeded
        expr: sum by (pipeline) (increase(bioetl_dq_soft_threshold_exceeded[15m])) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "DQ soft threshold exceeded"
          description: "bioetl_dq_soft_threshold_exceeded increased for pipeline={{ $labels.pipeline }} in the last 15m."
          runbook: "docs/05-operations/runbooks/dq-failure-investigation.md"

      - alert: BioETLDQQuarantineRateHigh
        expr: (((sum by (pipeline, run_type) (increase(bioetl_dq_records_quarantined_total[30m])) / clamp_min(sum by (pipeline, run_type) (increase(bioetl_records_processed_total{stage="bronze"}[30m])), 1)) > 0.05) and ((sum by (pipeline, run_type) (increase(bioetl_dq_records_quarantined_total[30m])) / clamp_min(sum by (pipeline, run_type) (increase(bioetl_records_processed_total{stage="bronze"}[30m])), 1)) <= 0.2)) and (sum by (pipeline, run_type) (increase(bioetl_records_processed_total{stage="bronze"}[30m])) >= 20)
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "DQ quarantine rate is elevated"
          description: "Quarantine rate stayed between 5% and 20% for pipeline={{ $labels.pipeline }} run_type={{ $labels.run_type }} over the last 30m, with at least 20 bronze records observed."
          runbook: "docs/05-operations/runbooks/dq-failure-investigation.md"

      - alert: BioETLDQQuarantineRateCritical
        expr: ((sum by (pipeline, run_type) (increase(bioetl_dq_records_quarantined_total[15m])) / clamp_min(sum by (pipeline, run_type) (increase(bioetl_records_processed_total{stage="bronze"}[15m])), 1)) > 0.2) and (sum by (pipeline, run_type) (increase(bioetl_records_processed_total{stage="bronze"}[15m])) >= 20)
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "DQ quarantine rate reached hard-fail territory"
          description: "Quarantine rate exceeded 20% for pipeline={{ $labels.pipeline }} run_type={{ $labels.run_type }} over the last 15m, with at least 20 bronze records observed."
          runbook: "docs/05-operations/runbooks/dq-failure-investigation.md"

      - alert: BioETLDQValidationFailuresCritical
        expr: sum by (pipeline, stage) (increase(bioetl_dq_validation_failures_total{severity="hard_fail"}[15m])) > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Critical DQ validation failures detected"
          description: "bioetl_dq_validation_failures_total increased with severity=hard_fail for pipeline={{ $labels.pipeline }} stage={{ $labels.stage }} in the last 15m."
          runbook: "docs/05-operations/runbooks/dq-failure-investigation.md"

      - alert: BioETLGoldValidationFailuresCritical
        expr: sum by (pipeline) (increase(bioetl_dq_validation_failures_total{stage="gold", severity="hard_fail"}[15m])) > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Gold-stage strict validation failures detected"
          description: "bioetl_dq_validation_failures_total increased with stage=gold severity=hard_fail for pipeline={{ $labels.pipeline }} in the last 15m."
          runbook: "docs/05-operations/runbooks/dq-failure-investigation.md"

      - alert: BioETLDQCriticalAnomaliesDetected
        expr: sum by (pipeline, metric, anomaly_type) (increase(bioetl_dq_anomaly_detected{severity="critical"}[30m])) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Critical DQ anomalies detected"
          description: "bioetl_dq_anomaly_detected increased with severity=critical for pipeline={{ $labels.pipeline }} metric={{ $labels.metric }} anomaly_type={{ $labels.anomaly_type }} in the last 30m."
          runbook: "docs/05-operations/runbooks/dq-failure-investigation.md"

      - alert: BioETLSilverValidationFailuresDetected
        expr: sum by (pipeline, table) (increase(bioetl_silver_validation_failures_total[30m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Silver schema validation failures detected"
          description: "bioetl_silver_validation_failures_total increased for pipeline={{ $labels.pipeline }} table={{ $labels.table }} in the last 30m."
          runbook: "docs/05-operations/runbooks/dq-failure-investigation.md"

      - alert: BioETLSilverFilterRejectAccountingMismatch
        expr: bioetl_silver_filter_reject_total_mismatch_15m > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Silver filter reject accounting mismatch detected"
          description: "Filtered-out stage totals and bounded Silver rejection breakdown totals diverged for pipeline={{ $labels.pipeline }} run_type={{ $labels.run_type }} in the last 15m."
          runbook: "docs/05-operations/runbooks/dq-failure-investigation.md"

      - alert: BioETLDataFreshnessLagHigh
        expr: (clamp_min(time() - max by (pipeline, entity) (bioetl_data_freshness_seconds), 0) > 86400) and (clamp_min(time() - max by (pipeline, entity) (bioetl_data_freshness_seconds), 0) <= 259200)
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Data freshness lag is elevated"
          description: "time() - bioetl_data_freshness_seconds stayed between 24h and 72h for pipeline={{ $labels.pipeline }} entity={{ $labels.entity }}."
          runbook: "docs/05-operations/runbooks/dq-failure-investigation.md"

      - alert: BioETLDataFreshnessLagCritical
        expr: clamp_min(time() - max by (pipeline, entity) (bioetl_data_freshness_seconds), 0) > 259200
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "Data freshness lag is critical"
          description: "time() - bioetl_data_freshness_seconds exceeded 72h for pipeline={{ $labels.pipeline }} entity={{ $labels.entity }}."
          runbook: "docs/05-operations/runbooks/dq-failure-investigation.md"

  - name: bioetl_provider_health_observability
    rules:
      - alert: BioETLProviderHealthCheckFailuresDetected
        expr: sum by (provider) (increase(bioetl_health_check_failures_total[10m])) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Provider health-check failures detected"
          description: "bioetl_health_check_failures_total increased for provider={{ $labels.provider }} in the last 10m."
          runbook: "docs/05-operations/runbooks/incident-response.md"

      - alert: BioETLProviderFailureRateHigh
        expr: (bioetl_provider_health_check_failures_15m / clamp_min(bioetl_provider_health_check_total_15m, 1)) > 0.2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Provider health-check failure ratio is elevated"
          description: "Health-check failure ratio exceeded 20% for provider={{ $labels.provider }} in the last 15m."
          runbook: "docs/05-operations/runbooks/incident-response.md"

      - alert: BioETLProviderRetriesExhausted
        expr: ((sum by (provider, operation) (increase(bioetl_data_source_retry_exhausted_total[1h])) > 0) and (sum by (provider, operation) (increase(bioetl_data_source_retry_exhausted_total[1h])) < 3))
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Provider retries exhausted"
          description: "bioetl_data_source_retry_exhausted_total increased 1-2 times for provider={{ $labels.provider }} operation={{ $labels.operation }} in the last 1h."
          runbook: "docs/05-operations/runbooks/incident-response.md"

      - alert: BioETLProviderRetriesExhaustedPersistent
        expr: sum by (provider, operation) (increase(bioetl_data_source_retry_exhausted_total[1h])) >= 3
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Provider retries are repeatedly exhausted"
          description: "bioetl_data_source_retry_exhausted_total increased at least 3 times for provider={{ $labels.provider }} operation={{ $labels.operation }} in the last 1h."
          runbook: "docs/05-operations/runbooks/incident-response.md"

      - alert: BioETLCircuitBreakerStuckOpen
        expr: max by (adapter) (max_over_time(bioetl_circuit_breaker_state[15m])) >= 2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Circuit breaker remained open"
          description: "bioetl_circuit_breaker_state stayed open for adapter={{ $labels.adapter }} within the last 15m."
          runbook: "docs/05-operations/runbooks/incident-response.md"

      - alert: BioETLProviderAdapterLatencyHigh
        expr: histogram_quantile(0.95, sum by (le, provider) (increase(bioetl_adapter_request_duration_seconds_bucket[30m]))) > 5
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Provider adapter latency is elevated"
          description: "Adapter request p95 exceeded 5s for provider={{ $labels.provider }} over the last 30m."
          runbook: "docs/05-operations/runbooks/incident-response.md"

      - alert: BioETLProviderHttpErrorRateHigh
        expr: (sum by (provider) (increase(bioetl_http_request_errors_total[15m])) / clamp_min(sum by (provider) (increase(bioetl_http_request_duration_seconds_count[15m])), 1)) > 0.1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Provider HTTP error rate is elevated"
          description: "HTTP error ratio exceeded 10% for provider={{ $labels.provider }} in the last 15m."
          runbook: "docs/05-operations/runbooks/incident-response.md"

      - alert: BioETLProviderRateLimiterWaitHigh
        expr: histogram_quantile(0.95, sum by (le, provider) (increase(bioetl_rate_limiter_wait_seconds_bucket[30m]))) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Provider rate-limiter wait is elevated"
          description: "Rate-limiter wait p95 exceeded 1s for provider={{ $labels.provider }} over the last 30m."
          runbook: "docs/05-operations/runbooks/incident-response.md"

      - alert: BioETLProviderRateLimiterTokensDepleted
        expr: min by (provider) (min_over_time(bioetl_rate_limiter_tokens_available[15m])) < 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Provider rate-limiter tokens were depleted"
          description: "Rate-limiter tokens dropped below 1 for provider={{ $labels.provider }} within the last 15m."
          runbook: "docs/05-operations/runbooks/incident-response.md"
