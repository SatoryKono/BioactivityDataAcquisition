groups:
  - name: bioetl_control_plane_current_status
    interval: 15s
    rules:
      - record: bioetl_control_plane_run_type_universe
        expr: count by (pipeline, run_type) (bioetl_control_plane_manifest_writes_total) > bool 0

      - record: bioetl_replay_safety_blockers_15m
        expr: |
          round(
            (
              (sum by (pipeline, run_type) (increase(bioetl_control_plane_manifest_writes_total{status="failed"}[15m]))
                or 0 * bioetl_control_plane_run_type_universe)
              +
              (
                bioetl_control_plane_run_type_universe
                * on (pipeline) group_left()
                (
                  (
                    sum by (pipeline) (increase(bioetl_control_plane_ledger_appends_total{status="failed"}[15m]))
                    +
                    sum by (pipeline) (increase(bioetl_checkpoint_compatibility_events_total{disposition=~".*_incompatible"}[15m]))
                    +
                    sum by (pipeline) (increase(bioetl_replay_reconstructability_events_total{status="not_reconstructable"}[15m]))
                    +
                    sum by (pipeline) (increase(bioetl_lineage_refs_missing_total[15m]))
                  )
                  or 0 * max by (pipeline) (bioetl_control_plane_run_type_universe)
                )
              )
              +
              (sum by (pipeline, run_type) (increase(bioetl_replay_drift_events_total[15m]))
                or 0 * bioetl_control_plane_run_type_universe)
            )
          )

      - record: bioetl_manifest_ledger_failures_15m
        expr: |
          round(
            (
              (sum by (pipeline, run_type) (increase(bioetl_control_plane_manifest_writes_total{status="failed"}[15m]))
                or 0 * bioetl_control_plane_run_type_universe)
              +
              (
                bioetl_control_plane_run_type_universe
                * on (pipeline) group_left()
                (
                  sum by (pipeline) (increase(bioetl_control_plane_ledger_appends_total{status="failed"}[15m]))
                  or 0 * max by (pipeline) (bioetl_control_plane_run_type_universe)
                )
              )
            )
          )

      - record: bioetl_control_plane_telemetry_missing_5m
        expr: |
          clamp_max(
            (
              (
                bioetl_control_plane_run_type_universe
                unless on (pipeline, run_type)
                sum by (pipeline, run_type) (count_over_time(bioetl_control_plane_manifest_writes_total[5m]))
              )
              or 0 * bioetl_control_plane_run_type_universe
            )
            +
            (
              (
                bioetl_control_plane_run_type_universe
                unless on (pipeline, run_type)
                (
                  bioetl_control_plane_run_type_universe
                  * on (pipeline) group_left()
                  (
                    (sum by (pipeline) (count_over_time(bioetl_control_plane_ledger_appends_total[5m])) > bool 0)
                    or 0 * max by (pipeline) (bioetl_control_plane_run_type_universe)
                  )
                )
              )
              or 0 * bioetl_control_plane_run_type_universe
            ),
            2
          )

      - record: bioetl_checkpoint_age_seconds
        expr: clamp_min(time() - max by (pipeline) (bioetl_checkpoint_saved_at_seconds), 0)

      - record: bioetl_terminal_events_15m
        expr: sum by (pipeline) (increase(bioetl_control_plane_terminal_events_total[15m]))
