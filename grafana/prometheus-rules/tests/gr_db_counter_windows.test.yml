      unless on(pipeline) sum by (pipeline) (increase(bioetl_dq_validation_failures_total{pipeline=~".*",
      severity="hard_fail"}[2m]))) or count(sum by (pipeline) (increase(bioetl_dq_validation_failures_total{pipeline=~".*",
      severity="hard_fail"}[2m])) unless on(pipeline) sum by (pipeline) (increase(bioetl_dq_soft_threshold_exceeded_total{pipeline=~".*"}[2m]))))
    eval_time: 0m
    exp_samples: []
