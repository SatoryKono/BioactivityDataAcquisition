rule_files: []
evaluation_interval: 1m
tests:
- name: threshold-events-reset-and-measured-zero
  interval: 1m
  input_series:
  - series: bioetl_dq_soft_threshold_exceeded_total{pipeline="example"}
    values: 0 2 0 3 3
  - series: bioetl_dq_validation_failures_total{pipeline="example",severity="hard_fail"}
    values: 0 1 0 2 2
  promql_expr_test:
  - expr: round(sum(sum by (pipeline) (increase(bioetl_dq_soft_threshold_exceeded_total{pipeline=~".*"}[5m])))
      + sum(sum by (pipeline) (increase(bioetl_dq_validation_failures_total{pipeline=~".*", severity="hard_fail"}[5m]))))
      unless (count(sum by (pipeline) (increase(bioetl_dq_soft_threshold_exceeded_total{pipeline=~".*"}[5m]))
      unless on(pipeline) sum by (pipeline) (increase(bioetl_dq_validation_failures_total{pipeline=~".*",
      severity="hard_fail"}[5m]))) or count(sum by (pipeline) (increase(bioetl_dq_validation_failures_total{pipeline=~".*",
      severity="hard_fail"}[5m])) unless on(pipeline) sum by (pipeline) (increase(bioetl_dq_soft_threshold_exceeded_total{pipeline=~".*"}[5m]))))
    eval_time: 4m
    exp_samples:
    - labels: '{}'
      value: 8
  - expr: round(sum(sum by (pipeline) (increase(bioetl_dq_soft_threshold_exceeded_total{pipeline=~".*"}[2m])))
      + sum(sum by (pipeline) (increase(bioetl_dq_validation_failures_total{pipeline=~".*", severity="hard_fail"}[2m]))))
      unless (count(sum by (pipeline) (increase(bioetl_dq_soft_threshold_exceeded_total{pipeline=~".*"}[2m]))
      unless on(pipeline) sum by (pipeline) (increase(bioetl_dq_validation_failures_total{pipeline=~".*",
      severity="hard_fail"}[2m]))) or count(sum by (pipeline) (increase(bioetl_dq_validation_failures_total{pipeline=~".*",
      severity="hard_fail"}[2m])) unless on(pipeline) sum by (pipeline) (increase(bioetl_dq_soft_threshold_exceeded_total{pipeline=~".*"}[2m]))))
    eval_time: 4m
    exp_samples:
    - labels: '{}'
      value: 0
