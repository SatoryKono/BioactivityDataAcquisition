rule_files:
- ../bioetl_observability.yml
evaluation_interval: 1m
tests:
- name: missing-coverage-controls-selected-verdict
  interval: 1m
  input_series:
  - series: bioetl_runtime_current_status_trusted{pipeline="audit",run_type="backfill"}
    values: 3+0x3
  - series: bioetl_overview_pipeline_run_type_universe{pipeline="audit",run_type="backfill"}
    values: 1+0x3
  - series: bioetl_l0_input_status{pipeline="audit",run_type="backfill",input="control_plane"}
    values: 0+0x3
  - series: bioetl_control_plane_telemetry_missing_5m{pipeline="audit",run_type="backfill"}
    values: 2+0x3
  promql_expr_test:
  - expr: bioetl_l0_input_status_selected{pipeline="audit",input="runtime"}
    eval_time: 1m
    exp_samples:
    - labels: '{__name__="bioetl_l0_input_status_selected",pipeline="audit",run_type="backfill",input="runtime"}'
      value: 3
  - expr: bioetl_l0_input_status_selected{pipeline="audit",input="control_plane"}
    eval_time: 1m
    exp_samples:
    - labels: '{__name__="bioetl_l0_input_status_selected",pipeline="audit",run_type="backfill",input="control_plane"}'
      value: 3
- name: covered-coverage-controls-selected-verdict
  interval: 1m
  input_series:
  - series: bioetl_runtime_current_status_trusted{pipeline="audit",run_type="backfill"}
    values: 0+0x3
  - series: bioetl_overview_pipeline_run_type_universe{pipeline="audit",run_type="backfill"}
    values: 1+0x3
  - series: bioetl_l0_input_status{pipeline="audit",run_type="backfill",input="control_plane"}
    values: 0+0x3
  - series: bioetl_control_plane_telemetry_missing_5m{pipeline="audit",run_type="backfill"}
    values: 0+0x3
  promql_expr_test:
  - expr: bioetl_l0_input_status_selected{pipeline="audit",input="runtime"}
    eval_time: 1m
    exp_samples:
    - labels: '{__name__="bioetl_l0_input_status_selected",pipeline="audit",run_type="backfill",input="runtime"}'
      value: 0
  - expr: bioetl_l0_input_status_selected{pipeline="audit",input="control_plane"}
    eval_time: 1m
    exp_samples:
    - labels: '{__name__="bioetl_l0_input_status_selected",pipeline="audit",run_type="backfill",input="control_plane"}'
      value: 0
- name: critical-coverage-controls-selected-verdict
  interval: 1m
  input_series:
  - series: bioetl_runtime_current_status_trusted{pipeline="audit",run_type="backfill"}
    values: 2+0x3
  - series: bioetl_overview_pipeline_run_type_universe{pipeline="audit",run_type="backfill"}
    values: 1+0x3
  - series: bioetl_l0_input_status{pipeline="audit",run_type="backfill",input="control_plane"}
    values: 2+0x3
  - series: bioetl_control_plane_telemetry_missing_5m{pipeline="audit",run_type="backfill"}
    values: 2+0x3
  promql_expr_test:
  - expr: bioetl_l0_input_status_selected{pipeline="audit",input="runtime"}
    eval_time: 1m
    exp_samples:
    - labels: '{__name__="bioetl_l0_input_status_selected",pipeline="audit",run_type="backfill",input="runtime"}'
      value: 2
  - expr: bioetl_l0_input_status_selected{pipeline="audit",input="control_plane"}
    eval_time: 1m
    exp_samples:
    - labels: '{__name__="bioetl_l0_input_status_selected",pipeline="audit",run_type="backfill",input="control_plane"}'
      value: 2
- name: alert-instances-remain-distinct
  interval: 1m
  input_series:
  - series: ALERTS{alertname="Example",alertstate="firing",severity="critical",instance="one",job="bioetl"}
    values: 1+0x3
  - series: ALERTS{alertname="Example",alertstate="firing",severity="critical",instance="two",job="bioetl"}
    values: 1+0x3
  promql_expr_test:
  - expr: count(bioetl_incident_alert_priority{alertname="Example"})
    eval_time: 1m
    exp_samples:
    - labels: '{}'
      value: 2
- name: provider-gap-link-preserves-literal-all
  interval: 1m
  promql_expr_test:
  - expr: count(bioetl_incident_ranked_evidence{provider="unknown",action_scope="var-provider=$__all&viewPanel=9104"})
    eval_time: 1m
    exp_samples:
    - labels: '{}'
      value: 1
