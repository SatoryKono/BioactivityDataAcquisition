rule_files: []
evaluation_interval: 1m
tests:
- name: healthy-observed-fleet
  interval: 1m
  input_series:
  - series: bioetl_provider_current_status{provider="chembl"}
    values: 0+0x3
  - series: bioetl_provider_health_status{provider="chembl"}
    values: 1+0x3
  promql_expr_test:
  - expr: count(((label_replace((topk(4, max by (provider) (bioetl_provider_current_status)
      >= 1)), "provider_target", "$1", "provider", "(.*)")) or label_replace(label_replace(((((count(max
      by (provider) (bioetl_provider_current_status)) > 0) * 0 + 1) * absent(max by
      (provider) (bioetl_provider_current_status) != 0) * absent(max by (provider)
      (bioetl_provider_current_status) unless on(provider) max by (provider) (bioetl_provider_health_status)))
      * 0 - 1), "provider", "VALID EMPTY - fleet observed, no non-OK providers", "",
      ""), "provider_target", "$$__all", "", "")) == -1)
    eval_time: 1m
    exp_samples:
    - labels: '{}'
      value: 1
  - expr: (label_replace((topk(4, max by (provider) (bioetl_provider_current_status)
      >= 1)), "provider_target", "$1", "provider", "(.*)")) or label_replace(label_replace(((((count(max
      by (provider) (bioetl_provider_current_status)) > 0) * 0 + 1) * absent(max by
      (provider) (bioetl_provider_current_status) != 0) * absent(max by (provider)
      (bioetl_provider_current_status) unless on(provider) max by (provider) (bioetl_provider_health_status)))
      * 0 - 1), "provider", "VALID EMPTY - fleet observed, no non-OK providers", "",
      ""), "provider_target", "$$__all", "", "")
    eval_time: 1m
    exp_samples:
    - labels: '{provider="VALID EMPTY - fleet observed, no non-OK providers",provider_target="$__all"}'
      value: -1
