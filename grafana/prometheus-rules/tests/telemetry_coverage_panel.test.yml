rule_files: []
evaluation_interval: 1m
tests:
- name: empty
  interval: 1m
  input_series: []
  promql_expr_test:
  - expr: max((bioetl_control_plane_run_type_universe{pipeline=~"uniprot_protein",run_type=~"incremental"}
      unless on(pipeline,run_type) sum by(pipeline,run_type) (count_over_time(bioetl_control_plane_manifest_writes_total[5m])))
      or (bioetl_control_plane_run_type_universe{pipeline=~"uniprot_protein",run_type=~"incremental"}
      * 0))
    eval_time: 10m
    exp_samples: []
  - expr: max((bioetl_control_plane_run_type_universe{pipeline=~"uniprot_protein",run_type=~"incremental"}
      unless on(pipeline) sum by(pipeline) (count_over_time(bioetl_control_plane_ledger_appends_total[5m])))
      or (bioetl_control_plane_run_type_universe{pipeline=~"uniprot_protein",run_type=~"incremental"}
      * 0))
    eval_time: 10m
    exp_samples: []
  - expr: max((bioetl_control_plane_run_type_universe{pipeline=~"uniprot_protein",run_type=~"incremental"}
      unless on(pipeline,run_type) (count by(pipeline,run_type) (group by(pipeline,run_type,risk_type)
      (count_over_time(bioetl_replay_duplicate_overwrite_risk_total{risk_type=~"duplicate|overwrite"}[5m])))
      == 2)) or (bioetl_control_plane_run_type_universe{pipeline=~"uniprot_protein",run_type=~"incremental"}
      * 0))
    eval_time: 10m
    exp_samples: []
  - expr: max((bioetl_control_plane_run_type_universe{pipeline=~"uniprot_protein",run_type=~"incremental"}
      unless on(pipeline,run_type) (count by(pipeline,run_type) (group by(pipeline,run_type,integrity_type)
      (count_over_time(bioetl_manifest_ledger_integrity_ratio{integrity_type=~"consistent|inconsistent"}[5m])))
      == 2)) or (bioetl_control_plane_run_type_universe{pipeline=~"uniprot_protein",run_type=~"incremental"}
      * 0))
    eval_time: 10m
    exp_samples: []
  - expr: max((bioetl_control_plane_run_type_universe{pipeline=~"uniprot_protein",run_type=~"incremental"}
      unless on(pipeline,run_type) (push_time_seconds{job="bioetl",pipeline!="",run_type!=""}
      > 0 and push_time_seconds{job="bioetl",pipeline!="",run_type!=""} <= time()))
      or (bioetl_control_plane_run_type_universe{pipeline=~"uniprot_protein",run_type=~"incremental"}
      * 0))
    eval_time: 10m
    exp_samples: []
