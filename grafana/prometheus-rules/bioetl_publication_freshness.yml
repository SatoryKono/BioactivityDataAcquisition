groups:
  - name: bioetl_publication_freshness
    interval: 30s
    rules:
      # CURRENT verdicts use the existing 15m operational horizon. Scraping a
      # retained gateway group is not a new observation. Missing/future times
      # cannot grant freshness. Direct exporters are outside this gateway gate.
      - record: bioetl_scope_publication_status
        expr: >-
          (count by (pipeline, run_type) (bioetl_pipeline_runs_total{job="bioetl"}) > bool 0)
          * 3
          unless on (pipeline, run_type)
          (push_time_seconds{job="bioetl",pipeline!="",run_type!=""} > 0
            and push_time_seconds{job="bioetl",pipeline!="",run_type!=""} <= time()
            and time() - push_time_seconds{job="bioetl",pipeline!="",run_type!=""} <= 900)
      - record: bioetl_workflow_publication_scope_status
        expr: >-
          group by (workflow, pipeline, run_type) (bioetl_workflow_pipeline_expected)
          * on (workflow) group_left()
          max by (workflow) (
            (group by (job, workflow) (bioetl_workflow_current_status{job=~"bioetl_workflow_.+"}) * 3)
            unless on (job)
            (push_time_seconds{job=~"bioetl_workflow_.+",pipeline="",run_type=""} > 0
              and push_time_seconds{job=~"bioetl_workflow_.+",pipeline="",run_type=""} <= time()
              and time() - push_time_seconds{job=~"bioetl_workflow_.+",pipeline="",run_type=""} <= 900)
          )
