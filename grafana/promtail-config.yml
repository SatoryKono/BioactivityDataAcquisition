clients:
  - url: http://bioetl-loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: bioetl
    static_configs:
      - targets:
          - localhost
        labels:
          job: bioetl
          __path__: /workspace-logs/*.log
  - job_name: bioetl-reports
    static_configs:
      - targets:
          - localhost
        labels:
          job: bioetl-reports
          __path__: /workspace-report-logs/*.log
  - job_name: bioetl-audit
    static_configs:
      - targets:
          - localhost
        labels:
          job: bioetl-audit
          __path__: /audit-logs/*.log
