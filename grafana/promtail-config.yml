server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: bioetl-file-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: bioetl
          source: file
          __path__: /workspace-logs/*.log
      - targets:
          - localhost
        labels:
          job: bioetl
          source: file
          __path__: /workspace-logs/*.jsonl
      - targets:
          - localhost
        labels:
          job: bioetl
          source: file
          __path__: /workspace-report-logs/*.log
      - targets:
          - localhost
        labels:
          job: bioetl
          source: file
          __path__: /workspace-report-logs/*.jsonl
