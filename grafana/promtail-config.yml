server:
  http_listen_port: 9080
  log_level: info

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: workspace-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: bioetl-workspace
          __path__: /workspace-logs/*.log

  - job_name: workspace-report-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: bioetl-report
          __path__: /workspace-report-logs/*.log
