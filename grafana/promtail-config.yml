clients:
  - url: http://loki:3100/loki/api/v1/push
    backoff_config:
      min_period: 500ms
      max_period: 5s
      max_retries: 20
    timeout: 10s

scrape_configs:
  - job_name: bioetl
    static_configs:
      - targets:
          - localhost
        labels:
          job: bioetl
          __path__: /workspace-logs/*.log
  - job_name: bioetl-runtime-reports
    static_configs:
      - targets:
          - localhost
        labels:
          job: bioetl
          __path__: /workspace-report-logs/*.log
  - job_name: bioetl-audit
    static_configs:
      - targets:
          - localhost
        labels:
          job: bioetl-audit
          __path__: /audit-logs/*.log
