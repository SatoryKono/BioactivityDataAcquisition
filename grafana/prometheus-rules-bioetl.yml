groups:
  - name: bioetl-rules
    interval: 30s
    rules:
      # Data Quality Alerts
      - alert: DataQualityScoreLow
        expr: bioetl_data_quality_score < 0.85
        for: 5m
        labels:
          severity: warning
          service: bioetl
        annotations:
          summary: "Data Quality Score Low"
          description: "Data quality score is {{ $value | humanizePercentage }} (threshold: 85%)"

      - alert: FailedValidations
        expr: rate(bioetl_validation_failures_total[5m]) > 0.1
        for: 5m
        labels:
          severity: critical
          service: bioetl
        annotations:
          summary: "High validation failure rate"
          description: "Validation failures: {{ $value | humanize }} per second"

      # System Health Alerts
      - alert: BioETLHealthCheckFailed
        expr: up{job="bioetl"} == 0
        for: 2m
        labels:
          severity: critical
          service: bioetl
        annotations:
          summary: "BioETL service is down"
          description: "BioETL health check failed for more than 2 minutes"

      - alert: Neo4jDown
        expr: up{job="neo4j"} == 0
        for: 2m
        labels:
          severity: critical
          service: neo4j
        annotations:
          summary: "Neo4j database is down"
          description: "Neo4j service is unreachable"

      - alert: RedisDown
        expr: up{job="redis"} == 0
        for: 1m
        labels:
          severity: critical
          service: redis
        annotations:
          summary: "Redis cache is down"
          description: "Redis service is unreachable"

      # Performance Alerts
      - alert: HighMemoryUsage
        expr: container_memory_usage_bytes{name="bioetl-app"} / container_spec_memory_limit_bytes > 0.85
        for: 5m
        labels:
          severity: warning
          service: bioetl
        annotations:
          summary: "High memory usage detected"
          description: "BioETL container memory usage: {{ $value | humanizePercentage }}"

      - alert: HighCPUUsage
        expr: rate(container_cpu_usage_seconds_total{name="bioetl-app"}[5m]) > 0.8
        for: 5m
        labels:
          severity: warning
          service: bioetl
        annotations:
          summary: "High CPU usage detected"
          description: "BioETL container CPU usage: {{ $value | humanizePercentage }}"

      - alert: DiskSpaceRunningOut
        expr: node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes < 0.1
        for: 5m
        labels:
          severity: warning
          service: system
        annotations:
          summary: "Disk space running out"
          description: "Available disk space: {{ $value | humanizePercentage }}"

      # ETL Pipeline Alerts
      - alert: ETLPipelineSlowdown
        expr: rate(bioetl_pipeline_duration_seconds[5m]) > 2
        for: 10m
        labels:
          severity: warning
          service: bioetl
        annotations:
          summary: "ETL pipeline processing time is high"
          description: "Average pipeline duration: {{ $value | humanizeDuration }}"

      - alert: GraphNodeCreationFailure
        expr: rate(bioetl_graph_node_creation_errors_total[5m]) > 0
        for: 5m
        labels:
          severity: critical
          service: bioetl
        annotations:
          summary: "Graph node creation errors detected"
          description: "Error rate: {{ $value | humanize }} errors per second"

      # Database Alerts
      - alert: Neo4jHighConnections
        expr: neo4j_connections_active > 80
        for: 5m
        labels:
          severity: warning
          service: neo4j
        annotations:
          summary: "Neo4j has high number of active connections"
          description: "Active connections: {{ $value }}"

      - alert: Neo4jMemoryPressure
        expr: neo4j_memory_heap_used_bytes / neo4j_memory_heap_max_bytes > 0.9
        for: 5m
        labels:
          severity: critical
          service: neo4j
        annotations:
          summary: "Neo4j experiencing memory pressure"
          description: "Heap usage: {{ $value | humanizePercentage }}"

      # Cache Alerts
      - alert: RedisMemoryUsage
        expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.85
        for: 5m
        labels:
          severity: warning
          service: redis
        annotations:
          summary: "Redis memory usage high"
          description: "Redis memory: {{ $value | humanizePercentage }}"

      - alert: RedisEvictions
        expr: rate(redis_evicted_keys_total[5m]) > 0
        for: 5m
        labels:
          severity: warning
          service: redis
        annotations:
          summary: "Redis is evicting keys"
          description: "Key eviction rate: {{ $value | humanize }} keys per second"
