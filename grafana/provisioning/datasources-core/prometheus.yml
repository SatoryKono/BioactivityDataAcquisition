apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    url: http://prometheus:9090
    access: proxy
    isDefault: true
    editable: true
    jsonData:
      timeInterval: 15s

  - name: Pushgateway
    type: prometheus
    uid: pushgateway
    url: http://pushgateway:9091
    access: proxy
    isDefault: false
    editable: true
