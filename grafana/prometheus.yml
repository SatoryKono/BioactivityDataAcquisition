global:
  scrape_interval: 15s
  # 30s default evaluation: large BioETL recording monogroup + alerts.
  # Groups may override (control-plane / dashboard already set interval: 30s).
  # 15s doubled peak RSS and same-timestamp ingest WARNs under rule load.
  evaluation_interval: 30s
  external_labels:
    cluster: bioetl
    environment: dev

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files:
  - "/etc/prometheus/rules/*.yml"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "pushgateway"
    honor_labels: true
    static_configs:
      - targets: ["pushgateway:9091"]

  # BioETL health-server scrape (process liveness + in-process registry).
  # Host-side override example (not default): host.docker.internal:8000
  # Topology (AUD-OBS-20260727 / #6731):
  # - job=bioetl → health :8000/metrics is liveness + process registry.
  # - Batch terminal counters publish best-effort to Pushgateway after CLI runs.
  # - up{job="bioetl"}=1 alone does NOT prove data-plane population.
  - job_name: "bioetl"
    scrape_interval: 30s
    static_configs:
      - targets: ["bioetl:8000"]

  - job_name: "grafana"
    static_configs:
      - targets: ["grafana:3000"]

  - job_name: "grafana-image-renderer"
    metrics_path: /metrics
    static_configs:
      - targets: ["renderer:8081"]

  # Optional infrastructure scrapes (redis/minio/docker/alertmanager) are NOT
  # enabled on the default Desktop monitoring profile — they produce permanent
  # red targets when those stacks are absent. Add a profile-specific compose
  # overlay if those jobs are required.
