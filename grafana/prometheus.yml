# Prometheus configuration for BioETL local monitoring.
#
# Usage:
#   prometheus.exe --config.file=grafana/prometheus.yml
#
# BioETL exposes metrics at http://localhost:8000/metrics
# (configurable via BIOETL_METRICS_PORT environment variable).

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'bioetl'
    static_configs:
      - targets: ['host.docker.internal:8000']
    metrics_path: /metrics

  # Quarantine Explorer (bioetl quarantine serve). Compose service DNS is the
  # default monitoring-stack path; host-gateway may still be used by local
  # overrides when the backend is started outside compose.
  - job_name: 'quarantine-explorer'
    metrics_path: /health/live
    static_configs:
      - targets: ['quarantine-explorer:8081']

  - job_name: 'prometheus'
    static_configs:
      - targets: ['prometheus:9090']
    metrics_path: /metrics

  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000']
    metrics_path: /metrics

  - job_name: 'grafana-image-renderer'
    static_configs:
      - targets: ['renderer:8081']
    metrics_path: /metrics

  - job_name: 'pushgateway'
    honor_labels: true
    static_configs:
      - targets: ['pushgateway:9091']

  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
    metrics_path: /metrics

  - job_name: 'minio-cluster'
    static_configs:
      - targets: ['minio:9000']
    metrics_path: /minio/v2/metrics/cluster

  - job_name: 'minio-node'
    static_configs:
      - targets: ['minio:9000']
    metrics_path: /minio/v2/metrics/node

  - job_name: 'alertmanager'
    static_configs:
      - targets: ['alertmanager:9093']
    metrics_path: /metrics
