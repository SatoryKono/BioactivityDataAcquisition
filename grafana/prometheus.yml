# Prometheus configuration for BioETL local monitoring.
#
# Usage:
#   prometheus.exe --config.file=grafana/prometheus.yml
#
# BioETL exposes metrics at http://localhost:8000/metrics
# (configurable via BIOETL_METRICS_PORT environment variable).

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'bioetl'
    static_configs:
      # host.docker.internal works on macOS/Windows Docker Desktop.
      # On Linux, use --add-host=host.docker.internal:host-gateway in docker run,
      # or set BIOETL_METRICS_HOST env var below.
      - targets: ['${BIOETL_METRICS_HOST:-host.docker.internal}:8000']
    metrics_path: /metrics

  - job_name: 'pushgateway'
    honor_labels: true
    static_configs:
      - targets: ['pushgateway:9091']
