global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: bioetl
    environment: dev

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files:
  - "/etc/prometheus/rules/*.yml"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "pushgateway"
    honor_labels: true
    static_configs:
      - targets: ["pushgateway:9091"]

  # Canonical local-only BioETL metrics scrape (monitoring compose network).
  # Host-side override example (not default): host.docker.internal:8000
  # NOTE: host curl of 127.0.0.1:8000/metrics is a health-server stub comment
  # only when the process-local scrape registry is not attached; Prometheus
  # scrapes the full exposition at bioetl:8000 inside Docker (see metrics docs).
  - job_name: "bioetl"
    scrape_interval: 30s
    static_configs:
      - targets: ["bioetl:8000"]

  - job_name: "grafana"
    static_configs:
      - targets: ["grafana:3000"]

  - job_name: "grafana-image-renderer"
    metrics_path: /metrics
    static_configs:
      - targets: ["renderer:8081"]

  # Optional infrastructure scrapes (redis/minio/docker/alertmanager) are NOT
  # enabled on the default Desktop monitoring profile — they produce permanent
  # red targets when those stacks are absent. Add a profile-specific compose
  # overlay if those jobs are required.
