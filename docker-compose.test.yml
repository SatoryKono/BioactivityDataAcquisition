# Docker Compose file for integration tests.
# Contains only the minimal services required for testing (minio, redis).
# This avoids issues with directory sharing for services like Grafana.

services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    # healthcheck removed for CI/test compatibility (some images lack the shell/tools used by the original check)

  redis:
    image: redis:7-alpine
    ports:
      - "16379:6379"
    # healthcheck removed for CI/test compatibility (redis healthcheck can be flaky in some environments)

volumes:
  minio_data:
  redis_data:
