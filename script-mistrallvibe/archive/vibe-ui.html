<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mistral Vibe - Chat Interface</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 90%;
            max-width: 900px;
            height: 90vh;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid rgba(0,0,0,0.1);
        }

        .header h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            display: flex;
            gap: 10px;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            justify-content: flex-end;
        }

        .message-content {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.5;
            word-wrap: break-word;
        }

        .message.assistant .message-content {
            background: #f0f0f0;
            color: #333;
        }

        .message.user .message-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .message.system .message-content {
            background: #fff3cd;
            color: #856404;
            text-align: center;
            font-size: 13px;
            align-self: center;
        }

        .input-area {
            border-top: 1px solid #e0e0e0;
            padding: 15px;
            display: flex;
            gap: 10px;
            background: #fafafa;
        }

        .input-wrapper {
            flex: 1;
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 12px 15px;
            font-size: 14px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: #667eea;
        }

        input:disabled {
            background: #f5f5f5;
            color: #999;
        }

        button {
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: opacity 0.2s;
        }

        button:hover:not(:disabled) {
            opacity: 0.9;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 12px 16px;
            border-radius: 8px;
            margin: 10px 0;
        }

        .model-selector {
            display: flex;
            gap: 10px;
            padding: 10px 15px;
            background: #f9f9f9;
            border-bottom: 1px solid #e0e0e0;
        }

        .model-selector label {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 13px;
            cursor: pointer;
        }

        .model-selector input[type="radio"] {
            cursor: pointer;
        }

        .status {
            font-size: 12px;
            color: #666;
            padding: 10px 15px;
            background: #f9f9f9;
            border-bottom: 1px solid #e0e0e0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎯 Mistral Vibe Chat</h1>
            <p>Powered by Mistral AI</p>
        </div>

        <div class="status" id="status">
            Connecting...
        </div>

        <div class="model-selector">
            <label>
                <input type="radio" name="model" value="mistral-small-latest" checked>
                Mistral Small
            </label>
            <label>
                <input type="radio" name="model" value="mistral-medium-latest">
                Mistral Medium
            </label>
            <label>
                <input type="radio" name="model" value="mistral-large-latest">
                Mistral Large
            </label>
        </div>

        <div class="chat-container" id="chatContainer"></div>

        <div class="input-area">
            <div class="input-wrapper">
                <input 
                    type="text" 
                    id="messageInput" 
                    placeholder="Type your message..." 
                    autocomplete="off"
                >
                <button id="sendBtn" onclick="sendMessage()">Send</button>
            </div>
            <button id="clearBtn" onclick="clearChat()" title="Clear chat">Clear</button>
        </div>
    </div>

    <script>
        const API_URL = '/api/chat';
        const chatContainer = document.getElementById('chatContainer');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const statusEl = document.getElementById('status');
        const modelRadios = document.querySelectorAll('input[name="model"]');

        let currentModel = 'mistral-small-latest';
        let isLoading = false;
        let conversationHistory = [];

        // Model selection
        modelRadios.forEach(radio => {
            radio.addEventListener('change', (e) => {
                currentModel = e.target.value;
                clearChat();
            });
        });

        // Update status
        async function updateStatus() {
            try {
                const response = await fetch('/api/status');
                if (response.ok) {
                    statusEl.textContent = '✓ Connected to Mistral API';
                    statusEl.style.color = '#28a745';
                } else {
                    statusEl.textContent = '✗ API connection failed';
                    statusEl.style.color = '#dc3545';
                }
            } catch (e) {
                statusEl.textContent = '✗ Server error: ' + e.message;
                statusEl.style.color = '#dc3545';
            }
        }

        // Send message
        async function sendMessage() {
            const message = messageInput.value.trim();
            if (!message || isLoading) return;

            // Add user message
            addMessage(message, 'user');
            messageInput.value = '';
            messageInput.disabled = true;
            sendBtn.disabled = true;
            isLoading = true;

            try {
                conversationHistory.push({
                    role: 'user',
                    content: message
                });

                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: currentModel,
                        messages: conversationHistory,
                        temperature: 0.7,
                        max_tokens: 1024
                    })
                });

                if (!response.ok) {
                    throw new Error(`API error: ${response.status}`);
                }

                const data = await response.json();
                const assistantMessage = data.choices[0].message.content;
                
                conversationHistory.push({
                    role: 'assistant',
                    content: assistantMessage
                });

                addMessage(assistantMessage, 'assistant');
            } catch (error) {
                addMessage(`Error: ${error.message}`, 'system');
            } finally {
                isLoading = false;
                messageInput.disabled = false;
                sendBtn.disabled = false;
                messageInput.focus();
            }
        }

        // Add message to chat
        function addMessage(content, role) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}`;
            
            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            contentDiv.textContent = content;
            
            messageDiv.appendChild(contentDiv);
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // Clear chat
        function clearChat() {
            chatContainer.innerHTML = '';
            conversationHistory = [];
            addMessage(`Chat cleared. Using model: ${currentModel}`, 'system');
        }

        // Enter key to send
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        // Initialize
        window.addEventListener('load', () => {
            updateStatus();
            addMessage('Welcome to Mistral Vibe! Select a model and start chatting.', 'system');
            messageInput.focus();
        });
    </script>
</body>
</html>
