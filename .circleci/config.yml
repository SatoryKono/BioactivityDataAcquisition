              --summary-out reports/docs-kpi/summary.md \
              --fail-on-breach
      - store_artifacts:
          path: reports/docs-kpi
          destination: docs-kpi

  # Mirrors pr-required.yml `classify-changes`: runs the repo's own classifier
  # against the canonical catalog. On main/master pushes all gates are required
  # (fail-closed); on branches the matrix is computed from merge-base...HEAD.
  classify:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    steps:
      - checkout
      - setup-python-uv
      - run:
          name: Classify changes (decision matrix)
          command: |
            export PATH="$HOME/.local/bin:$PATH"
            HEAD_SHA="$CIRCLE_SHA1"
            if [ -n "${CIRCLE_PULL_REQUEST:-${CIRCLE_PULL_REQUESTS:-}}" ]; then
              pattern='^(feat|fix|refactor|docs|test|chore|ci)/[a-z0-9]+([.-][a-z0-9]+)*$'
              master_pattern='^master[0-9-]+$'
              automation='^(dependabot|renovate|devin|bolt|copilot|codex)/.+'
              if [[ ! "$CIRCLE_BRANCH" =~ $pattern && ! "$CIRCLE_BRANCH" =~ $master_pattern && ! "$CIRCLE_BRANCH" =~ $automation ]]; then
                echo "Non-compliant PR head branch name: $CIRCLE_BRANCH" >&2
                exit 1
              fi
            fi
            if [ "$CIRCLE_BRANCH" = "main" ] || [ "$CIRCLE_BRANCH" = "master" ]; then
              echo "Default-branch push: all gates required (fail-closed)."
              uv run --frozen --no-build python - "$HEAD_SHA" \<<'EOF' > /tmp/pr-gate-decisions.json
            import json, sys
            from pathlib import Path
            from scripts.engineering.ci.pr_gate import load_catalog
            head = sys.argv[1]
            catalog = load_catalog(Path("configs/quality/github_required_checks.yaml"))
            gates = [gate["id"] for gate in catalog["gates"]]
            print(json.dumps({"schema_version": 1, "config_version": catalog["version"], "head_sha": head,
                              "decisions": {g: {"decision": "required", "reason": "default_branch_push"} for g in gates},
                              "changed_files": [], "unclassified_files": []}, indent=2))
            EOF
            else
              git fetch --no-tags origin main:refs/remotes/origin/main
              BASE_SHA="$(git merge-base origin/main "$HEAD_SHA")"
              echo "Classifying $BASE_SHA...$HEAD_SHA"
              uv run --frozen --no-build python -m scripts.engineering.ci pr-gate classify \
                --catalog configs/quality/github_required_checks.yaml \
                --event-name pull_request \
                --base-sha "$BASE_SHA" \
                --head-sha "$HEAD_SHA" \
                --artifact /tmp/pr-gate-decisions.json
            fi
            cp /tmp/pr-gate-decisions.json ./pr-gate-decisions.json
            python3 -c "
            import json
            d = json.load(open('/tmp/pr-gate-decisions.json'))
            for k, v in d['decisions'].items(): print(f'{k} = {v[\"decision\"]} ({v[\"reason\"]})')"
      - persist_to_workspace:
          root: /tmp
          paths:
            - pr-gate-decisions.json
      - store_artifacts:
          path: pr-gate-decisions.json

  # --- Gate: lint-arch (always_required) -------------------------------------
  # Mirrors import-linter.yml `lint` (ruff staged profiles + format + isort).
  lint-ruff:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    steps:
      - checkout
      - setup-python-uv
      - run:
          name: "ruff check (Makefile gate: src tests scripts)"
          command: |
            export PATH="$HOME/.local/bin:$PATH"
            uv run --frozen ruff check src tests scripts

  lint-arch:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    steps:
      - checkout
      - setup-python-uv
      - run:
          name: ruff staged profiles + format + isort
          command: |
            export PATH="$HOME/.local/bin:$PATH"
            uv run --frozen --no-build ruff check src/bioetl/domain --output-format=github
            uv run --frozen --no-build ruff check src/bioetl/application --output-format=github
            uv run --frozen --no-build ruff check src/bioetl/infrastructure --output-format=github
            uv run --frozen --no-build ruff format --check src tests
            uv run --frozen --no-build ruff check --select I src tests --output-format=github

  # Mirrors import-linter.yml `arch-tests` (canonical selector from catalog).
  arch-tests:
    docker:
    - image: cimg/python:3.12
    resource_class: medium
    steps:
    - checkout
    - halt-unless-pr-gate-paths:
        label: architecture tests
        pathspecs: "src/bioetl tests/architecture :(glob)configs/**/*.yaml"
    - setup-python-uv
    - run:
        name: architecture tests
        command: |
          set -euo pipefail
          mkdir -p reports/quality/proof-or-stop/shared
          export PATH="$PWD/.venv/bin:$HOME/.local/bin:$PATH"
          if python -m scripts.engineering.qa proof-or-stop ci enabled; then
            python -m scripts.engineering.qa proof-or-stop ci produce --check architecture
          else
            export PATH="$HOME/.local/bin:$PATH"
            mkdir -p reports/test-telemetry
            HYPOTHESIS_PROFILE=fast \
            uv run --frozen --no-build pytest tests/architecture \
              -m "not slow and not benchmark and not memory" \
              -q --tb=short --no-cov \
              --junitxml=reports/test-telemetry/junit-arch.xml
          fi
          mkdir -p reports/quality/proof-or-stop/shared/architecture
    - store_test_results:
        path: reports/test-telemetry
    - persist_to_workspace:
        root: .
        paths:
        - reports/quality/proof-or-stop/shared/architecture
    - store_test_results:
        path: reports/quality/proof-or-stop/shared/architecture
    - store_artifacts:
        path: reports/quality/proof-or-stop/shared/architecture
    environment:
      PYTHONPATH: src
      PROOF_CI_LANE: << pipeline.parameters.ci-lane >>
      BIOETL_AI_MEMORY_MODE: 'off'
      BIOETL_SKIP_PREFLIGHT: '1'
      BIOETL_SKIP_SETUP_PLUGINS: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'

  mypy:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    steps:
      - checkout
      - setup-python-uv
      - run:
          name: mypy strict gate (src/bioetl + src/memory)
          no_output_timeout: 35m
          command: |
            export PATH="$HOME/.local/bin:$PATH"
            mkdir -p reports
            rm -rf .mypy_cache
            set +e
            timeout --signal=TERM --kill-after=30s 30m \
              uv run --frozen --no-build mypy --config-file pyproject.toml --strict --no-incremental src/bioetl src/memory \
              2>&1 | tee reports/mypy_strict.log
            status=${PIPESTATUS[0]}
            set -e
            if [ "$status" -eq 124 ]; then echo "mypy strict gate timed out after 30 minutes"; exit 1; fi
            exit "$status"
      - store_artifacts:
          path: reports/mypy_strict.log

  # --- Gate: tests (always_required) ------------------------------------------
  dependency-lock:
    docker:
      - image: cimg/python:3.12-node
    resource_class: small
    steps:
      - checkout
      - setup-python-uv
      - run:
          name: uv lock --check (no drift)
          command: |
            export PATH="$HOME/.local/bin:$PATH"
            uv lock --check
      - run:
          name: Validate every tracked npm manifest against its lockfile
          command: |
            set -euo pipefail
            mkdir -p reports/dependency-review
            git ls-files -z -- package-lock.json '**/package-lock.json' > /tmp/npm-lockfiles
            test -s /tmp/npm-lockfiles
            while IFS= read -r -d '' lockfile; do
              directory="$(dirname "$lockfile")"
              test -f "$directory/package.json"
              npm ci --prefix "$directory" --dry-run --ignore-scripts --no-audit --no-fund
              printf '%s\n' "$lockfile" >> reports/dependency-review/validated-lockfiles.txt
            done < /tmp/npm-lockfiles
      - store_artifacts:
          path: reports/dependency-review

  # Mirrors tests.yml `test-fast` (4 unit groups, fast markers, no xdist).
  # NOTE: CircleCI matrix is a cartesian product, so name+path are packed into
  # one parameter and split in the step.
  test-fast:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    parameters:
      test-group:
        type: string
        default: "unit-domain|tests/unit/domain/"
    steps:
      - checkout
      - setup-python-uv
      - run:
          name: pytest fast lane (<< parameters.test-group >>)
          command: |
            export PATH="$HOME/.local/bin:$PATH"
            GROUP="<< parameters.test-group >>"
            NAME="${GROUP%%|*}"; PATHS="${GROUP#*|}"
            mkdir -p reports/test-telemetry
            HYPOTHESIS_PROFILE=fast \
            uv run --frozen --no-build pytest $PATHS \
              -m "not fs_contract and not repo_backed and not subprocess_backed and not slow and not benchmark and not memory" \
              -p no:xdist \
              -q --tb=short \
              --junitxml="reports/test-telemetry/junit-fast.${NAME}.xml"
      - store_test_results:
          path: reports/test-telemetry

  # Unit groups stay on test-fast. This lane keeps integration and security.
  test-integration:
    docker:
      - image: cimg/python:3.13
    resource_class: small
    environment:
      # Bound auto-detected workers to the runner CPU quota.
      PYTEST_XDIST_AUTO_NUM_WORKERS: "2"
      OPENBLAS_NUM_THREADS: "1"
      POLARS_MAX_THREADS: "2"
    parameters:
      test-group:
        type: string
        default: "integration|tests/integration/|-p no:xdist"
    steps:
      - checkout
      - setup-python-uv:
          python-version: "3.13"
      - run:
          name: pytest matrix lane (<< parameters.test-group >>)
          command: |
            export PATH="$HOME/.local/bin:$PATH"
            GROUP="<< parameters.test-group >>"
            NAME="${GROUP%%|*}"; REST="${GROUP#*|}"
            PATHS="${REST%%|*}"; XDIST="${REST#*|}"
            mkdir -p reports/test-telemetry
            uv run --frozen --no-build pytest $PATHS \
              -m "not serial and not memory and not fs_contract and not subprocess_backed" \
              $XDIST \
              -q --tb=short \
              --junitxml="reports/test-telemetry/junit.${NAME}.xml"
      - store_test_results:
          path: reports/test-telemetry

  # Mirrors tests.yml `dq-consistency-gate`.
  dq-consistency:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    steps:
      - checkout
      - setup-python-uv
      - run:
          name: DQ consistency validation
          command: |
            export PATH="$HOME/.local/bin:$PATH"
            uv run --frozen --no-build python -m scripts.engineering.qa validate-dq-consistency
      - run:
          name: Validate pipeline configurations (ChEMBL baseline parity)
          command: |
            export PATH="$HOME/.local/bin:$PATH"
            uv run --frozen --no-build python -m scripts.schema validate-configs

  # --- Gate: root-hygiene (always_required) ------------------------------------
  # Mirrors root-hygiene.yml `root-hygiene` (essential checks).
  root-hygiene:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    steps:
      - checkout
      - setup-python-uv
      - run:
          name: root allowlist + governance checks
          command: |
            export PATH="$HOME/.local/bin:$PATH"
            uv run --frozen --no-build python -m scripts.engineering.repo check-cleanliness --strict-untracked --check-local-forbidden-outputs
            uv run --frozen --no-build python -m scripts.engineering.repo check-cleanup-governance
            uv run --frozen --no-build python -m scripts.engineering.repo check-root-governance-docs
            uv run --frozen --no-build python -m scripts.engineering.repo check-root-review-registry
            uv run --frozen --no-build python -m scripts.engineering.diagnostics audit-structure --path .
            uv run --frozen --no-build python scripts/engineering/repo/check_no_partial_tree.py --base origin/main --tip HEAD
      - run:
          name: Export cleanup classification evidence
          command: |
            mkdir -p reports/quality && uv run --frozen --no-build python scripts/ops/support/repo/cleanup_repository.py --dry-run --detail-limit 0 --report-json reports/quality/root-hygiene-cleanup-classification.json --report-root-review-json reports/quality/root-hygiene-review-evidence.json --report-reports-workspace-json reports/quality/reports-workspace-review.json
      - run:
          name: Run root hygiene unit tests
          command: |
            uv run --frozen --no-build pytest tests/unit/scripts/repo/test_audit_root_cleanliness.py tests/unit/scripts/repo/test_check_cleanup_governance.py tests/unit/scripts/repo/test_check_root_governance_docs.py tests/unit/scripts/repo/test_audit_structure.py tests/unit/scripts/repo/test_check_root_hygiene_review_registry.py tests/unit/scripts/repo/test_cleanup_repository.py tests/unit/scripts/repo/test_cleanup_root_local_clutter.py tests/architecture/test_root_hygiene_workflow.py tests/architecture/test_root_hygiene_review_registry.py tests/architecture/test_env_example_reference_policy.py -q
      - store_artifacts:
          path: reports/quality/root-hygiene-cleanup-classification.json
      - store_artifacts:
          path: reports/quality/root-hygiene-review-evidence.json
      - store_artifacts:
          path: reports/quality/reports-workspace-review.json

  # --- Gate: compiled-artifacts (always_required) -------------------------------
  # Mirrors compiled-artifacts-block.yml `no-pyc-check`.
  compiled-artifacts:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    steps:
      - checkout
      - setup-python-uv
      - run:
          name: no tracked compiled artifacts
          command: |
            export PATH="$HOME/.local/bin:$PATH"
            set -e
            if git ls-files | grep -E '\.pyc$|__pycache__/' ; then
              echo "ERROR: tracked compiled Python artifacts found"; exit 1
            fi
            echo "No tracked .pyc / __pycache__ entries."
            uv run --frozen --no-build python -m scripts.engineering.repo check-cleanliness

  # --- Gate: security (always_required) -----------------------------------------
  # Mirrors security.yml (detect-secrets, pip-audit, bandit, gitleaks, osv-scanner).
  security-scans:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    steps:
      - checkout
      - halt-unless-pr-gate-paths:
          label: security scans
          pathspecs: "src pyproject.toml uv.lock .github :(glob)Dockerfile* :(glob)docker-compose*.yml .gitleaks.toml .secrets.baseline"
      - setup-python-uv
      - run:
          name: detect-secrets (no hardcoded secrets)
          command: |
            export PATH="$HOME/.local/bin:$PATH"
            uv run --frozen --no-build pytest tests/architecture/test_antipatterns.py::test_no_hardcoded_secrets -q
      - run:
          name: pip-audit (strict)
          command: |
            export PATH="$HOME/.local/bin:$PATH"
            export UV_CACHE_DIR=/tmp/.uv-cache
            uv export --frozen --no-hashes --no-emit-project --all-extras > /tmp/pip-audit-requirements.txt
            uv run --frozen --no-build pip-audit --strict \
              -r /tmp/pip-audit-requirements.txt --cache-dir /tmp/.pip-audit-cache
      - run:
          name: bandit (src/bioetl)
          command: |
            export PATH="$HOME/.local/bin:$PATH"
            uv run --frozen --no-build bandit -c pyproject.toml -r src/bioetl
      - run:
          name: gitleaks (binary v8.30.1)
          command: |
            curl -fsSL --proto '=https' --tlsv1.2 \
              https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
              -o /tmp/gitleaks.tar.gz
            printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' /tmp/gitleaks.tar.gz | sha256sum -c -
            mkdir -p "$HOME/.local/bin" && tar -xzf /tmp/gitleaks.tar.gz -C "$HOME/.local/bin" gitleaks
            "$HOME/.local/bin/gitleaks" detect --config .gitleaks.toml --no-git -v --redact=100
      - run:
          name: osv-scanner (binary v2.6.0, lockfiles)
          command: |
            set -euo pipefail
            curl -fsSL --proto '=https' --tlsv1.2 \
              https://github.com/google/osv-scanner/releases/download/v2.6.0/osv-scanner_linux_amd64 \
              -o "$HOME/.local/bin/osv-scanner"
            printf '%s  %s\n' ca69b3d3cd08f889a49dc0a383122f71cc528b83803671df5fd874d97485b108 "$HOME/.local/bin/osv-scanner" | sha256sum --check -
            chmod 0755 "$HOME/.local/bin/osv-scanner"
            scan_exit=0
            "$HOME/.local/bin/osv-scanner" \
              --lockfile=uv.lock \
              --lockfile=package-lock.json \
              --lockfile=.github/actions/setup-mermaid/package-lock.json \
              --lockfile=.github/tooling/jscpd/package-lock.json \
              --lockfile=scripts/ai/gemini/npm-tooling/package-lock.json \
              --lockfile=grafana/plugins/bioetl-scenes-app/package-lock.json \
              --lockfile=grafana/plugins/bioetl-selectorshell-panel/package-lock.json \
              --lockfile=grafana/tooling/router-v7-bridge/package-lock.json \
              --format=json --output-file=osv-results.json || scan_exit=$?
            # Only a completed scan can reach the severity policy.
            case "$scan_exit" in
              0|1) ;;
              *) echo "OSV scan failed or found no packages (exit=$scan_exit)" >&2; exit "$scan_exit" ;;
            esac
            export PATH="$HOME/.local/bin:$PATH"
            uv run --frozen --no-build python -m scripts.engineering.repo.check_github_actions_runtime_policy --osv-json osv-results.json
      - store_artifacts:
          path: osv-results.json

  docs-diagrams:
    parameters:
      mode:
        type: enum
        enum:
        - syntax
        - targeted
        - drift
    docker:
    - image: cimg/node:20.19.0-browsers@sha256:35b064b2efd3583e568aa1c5eee04f2ba3bc377da9a51c977fb7296a5d5f2964
    resource_class: medium
    environment:
      RUNNER_TEMP: /tmp/diagram-tools
      MERMAID_VERSION: 10.6.1
      INSTALL_LIBRSVG: 'true'
      ACTION_DIR: /home/circleci/project/.github/actions/setup-mermaid
      GITHUB_ENV: /tmp/diagram-ci/setup-env
      GITHUB_PATH: /tmp/diagram-ci/setup-path
      REQUIRE_SVGO: '1'
    steps:
    - checkout
    - run:
        name: Classify diagram validation and rendering scope
        command: |
          set -euo pipefail
          mkdir -p /tmp/diagram-ci "$RUNNER_TEMP"
          if [ "$(git rev-parse --is-shallow-repository)" = true ]; then git fetch --unshallow --filter=blob:none --no-tags; fi
          git fetch --no-tags origin main
          export EVENT_NAME=push BASE_REF=main
          base=HEAD~1
          if [ -n "${CIRCLE_PULL_REQUEST:-${CIRCLE_PULL_REQUESTS:-}}" ]; then
            export EVENT_NAME=pull_request
            python3 - \<<'PY'
          import json, os, re, urllib.request
          from pathlib import Path
          url = os.environ.get('CIRCLE_PULL_REQUEST') or os.environ['CIRCLE_PULL_REQUESTS'].split(',')[0]
          match = re.fullmatch(r'https://github.com/SatoryKono/BioactivityDataAcquisition/pull/([0-9]+)', url)
          assert match, 'Unexpected PR URL'
          with urllib.request.urlopen('https://api.github.com/repos/SatoryKono/BioactivityDataAcquisition/pulls/' + match[1], timeout=30) as response:
              pr = json.load(response)
          assert pr['head']['sha'] == os.environ['CIRCLE_SHA1'], 'Stale PR head'
          assert pr['base']['ref'] in {'main', 'develop'}, 'Unsupported base branch'
          Path('/tmp/diagram-ci/base-ref').write_text(pr['base']['ref'])
          PY
            BASE_REF="$(cat /tmp/diagram-ci/base-ref)"
            git fetch --no-tags origin "$BASE_REF"
            base="origin/$BASE_REF"
          fi
          printf 'export EVENT_NAME=%q\nexport BASE_REF=%q\n' "$EVENT_NAME" "$BASE_REF" >> "$BASH_ENV"
          git diff --name-only "$base"...HEAD -- '*.mmd' '*.mermaid' ':(glob)docs/**/*.md' 'scripts/diagrams/**' 'tests/architecture/test_diagram*.py' '.github/actions/setup-mermaid/**' 'docs/02-architecture/diagrams/theme/**' 'docs/02-architecture/diagrams/tooling/**' 'docs/02-architecture/diagrams/manifests/**' '.circleci/config.yml' > /tmp/diagram-ci/changed.txt
          git diff --name-only "$base"...HEAD -- '*.mmd' '*.mermaid' 'scripts/diagrams/**' '.github/actions/setup-mermaid/**' 'docs/02-architecture/diagrams/theme/**' 'docs/02-architecture/diagrams/tooling/**' 'docs/02-architecture/diagrams/manifests/**' '.circleci/config.yml' > /tmp/diagram-ci/render-sources.txt
          printf '%s\n' "$CIRCLE_SHA1" > /tmp/diagram-ci/source-sha.txt
          case '<< parameters.mode >>' in
            syntax) test -s /tmp/diagram-ci/changed.txt || circleci-agent step halt ;;
            targeted) test -s /tmp/diagram-ci/render-sources.txt || circleci-agent step halt ;;
            drift) if [ "$EVENT_NAME" != pull_request ] || [ ! -s /tmp/diagram-ci/render-sources.txt ]; then circleci-agent step halt; fi ;;
          esac
    - setup-python-uv:
        extras: dev
    - run:
        name: Install canonical lockfile-pinned Mermaid renderer
        no_output_timeout: 16m
        command: |
          set -euo pipefail
          cat > /tmp/diagram-ci/run.sh \<<'DIAGRAM_CI'
          set -euo pipefail
          node -e 'if (process.versions.node.split(".")[0] !== "20") process.exit(1)'
          set -euo pipefail
          # Lockfile-backed install from the action's package-lock.json (Sonar S8543).
          # Default mermaid-version is 10.6.1 and must match package.json/package-lock.json.
          TOOL_DIR="${RUNNER_TEMP}/mermaid-cli"
          mkdir -p "${TOOL_DIR}"
          cp "${ACTION_DIR}/package.json" "${ACTION_DIR}/package-lock.json" "${TOOL_DIR}/"
          # Vendored extract-zip (CVE-2026-56876) is a file: override; copy it
          # next to package.json so npm ci in RUNNER_TEMP can resolve it.
          mkdir -p "${TOOL_DIR}/vendor"
          cp -R "${ACTION_DIR}/vendor/." "${TOOL_DIR}/vendor/"
          cd "${TOOL_DIR}"
          if [ "${MERMAID_VERSION}" != "10.6.1" ]; then
            echo "setup-mermaid currently pins @mermaid-js/mermaid-cli@10.6.1 via package-lock.json" >&2
            echo "requested mermaid-version=${MERMAID_VERSION}; refusing unlocked install" >&2
            exit 1
          fi
          # Install from action-local package.json + package-lock.json (S8543).
          # Exact versions are pinned in package.json; lockfile records resolved URLs.
          # Full tree refresh: cd .github/actions/setup-mermaid && npm install --ignore-scripts
          npm ci --ignore-scripts --no-fund --no-audit
          # `--ignore-scripts` deliberately suppresses lifecycle hooks. Run the
          # pinned CLI's own Puppeteer installer explicitly, then fail closed if
          # its exact browser revision is unavailable.
          node node_modules/puppeteer/install.js
          PUPPETEER_EXECUTABLE="$(
            node -e 'process.stdout.write(require("puppeteer").executablePath())'
          )"
          test -x "${PUPPETEER_EXECUTABLE}"
          # Export so validate_mermaid_syntax.sh resolve_chrome_headless_shell and
          # prepare_puppeteer_cfg can inject executablePath + --no-sandbox args.
          echo "PUPPETEER_EXECUTABLE_PATH=${PUPPETEER_EXECUTABLE}" >> "$GITHUB_ENV"
          if [ "$INSTALL_LIBRSVG" = "true" ]; then
            # svgo is already present via the locked package.json dependencies.
            sudo apt-get update -qq && sudo apt-get install -y -qq librsvg2-bin
          fi
          echo "${TOOL_DIR}/node_modules/.bin" >> "$GITHUB_PATH"

          cat > /tmp/puppeteer-config.json \<< 'EOF'
          {
            "args": ["--no-sandbox", "--disable-setuid-sandbox", "--disable-dev-shm-usage", "--disable-gpu"]
          }
          EOF

          PUPPETEER_EXECUTABLE_PATH="$(cd "$RUNNER_TEMP/mermaid-cli" && node -e 'process.stdout.write(require("puppeteer").executablePath())')"
          printf 'export PUPPETEER_EXECUTABLE_PATH=%q\n' "$PUPPETEER_EXECUTABLE_PATH" >> "$BASH_ENV"
          printf 'export PATH=%q:$PATH\n' "$RUNNER_TEMP/mermaid-cli/node_modules/.bin" >> "$BASH_ENV"

          DIAGRAM_CI
          timeout --signal=TERM --kill-after=30s 15m bash /tmp/diagram-ci/run.sh
    - when:
        condition:
          equal:
          - syntax
          - << parameters.mode >>
        steps:
        - run:
            name: Canonical diagram syntax validation
            no_output_timeout: 26m
            command: |
              set -euo pipefail
              cat > /tmp/diagram-ci/run.sh \<<'DIAGRAM_CI'
              set -euo pipefail
              bash scripts/diagrams/validate_mermaid_syntax.sh \
                --include-embedded \
                --puppeteer /tmp/puppeteer-config.json

              set -euo pipefail
              # Source-only PRs lint existing changed destinations. Tooling changes
              # own the full diagram corpus because they can affect every source.
              lint_targets=(docs/02-architecture/diagrams)
              if [[ "${EVENT_NAME}" == "pull_request" ]]; then
                if [[ "${BASE_REF}" != "main" && "${BASE_REF}" != "develop" ]]; then
                  echo "unsupported pull-request base ref" >&2
                  exit 1
                fi
                git fetch --no-tags origin "${BASE_REF}"
                if git diff --quiet "origin/${BASE_REF}"...HEAD -- \
                  scripts/diagrams .github/actions/setup-mermaid; then
                  changed_targets="${RUNNER_TEMP}/changed-diagram-targets.txt"
                  git diff --diff-filter=ACMRTUXB --name-only \
                    "origin/${BASE_REF}"...HEAD -- '*.mmd' '*.mermaid' \
                    > "${changed_targets}"
                  mapfile -t lint_targets < "${changed_targets}"
                  if (( ${#lint_targets[@]} == 0 )); then
                    mkdir -p "${RUNNER_TEMP}/empty-diagram-lint-scope"
                    lint_targets=("${RUNNER_TEMP}/empty-diagram-lint-scope")
                  fi
                else
                  diff_status=$?
                  if [[ "${diff_status}" -gt 1 ]]; then
                    exit "${diff_status}"
                  fi
                fi
                printf 'PR diagram lint targets:\n'
                printf '  %s\n' "${lint_targets[@]}"
              fi

              set +e
              python3 scripts/diagrams/lint/lint_diagrams.py "${lint_targets[@]}" --json > /tmp/diagram-lint.json
              lint_status=$?
              set -e
              python3 scripts/diagrams/lint/summarize_diagram_lint.py /tmp/diagram-lint.json
              if [ "$lint_status" -ne 0 ]; then
                echo "::error::Diagram lint failed for the owned PR scope."
                exit "$lint_status"
              fi

              DIAGRAM_CI
              timeout --signal=TERM --kill-after=30s 25m bash /tmp/diagram-ci/run.sh
    - when:
        condition:
          equal:
          - targeted
          - << parameters.mode >>
        steps:
        - run:
            name: Canonical diagram targeted validation
            no_output_timeout: 21m
            command: |
              set -euo pipefail
              cat > /tmp/diagram-ci/run.sh \<<'DIAGRAM_CI'
              set -euo pipefail
              bash docs/02-architecture/diagrams/tooling/render.sh \
                --dir docs/02-architecture/diagrams/architecture \
                --filter '*chembl-pipeline-activity*' \
                --puppeteer /tmp/puppeteer-config.json

              python3 scripts/diagrams/check/check_diagram_artifacts.py \
                --manifest docs/02-architecture/diagrams/manifests/chembl-pipeline-activity-dataflow.txt \
                --require-png
              python3 scripts/diagrams/check/check_svg_text_visibility.py \
                --manifest docs/02-architecture/diagrams/manifests/chembl-pipeline-activity-dataflow.txt

              mkdir -p /tmp/diagram-ci/rendered
              cp docs/02-architecture/diagrams/architecture/svg/*chembl-pipeline-activity*.svg /tmp/diagram-ci/rendered/
              cp docs/02-architecture/diagrams/architecture/png/*chembl-pipeline-activity*.png /tmp/diagram-ci/rendered/

              DIAGRAM_CI
              timeout --signal=TERM --kill-after=30s 20m bash /tmp/diagram-ci/run.sh
    - when:
        condition:
          equal:
          - drift
          - << parameters.mode >>
        steps:
        - run:
            name: Canonical diagram drift validation
            no_output_timeout: 31m
            command: |
              set -euo pipefail
              cat > /tmp/diagram-ci/run.sh \<<'DIAGRAM_CI'
              set -euo pipefail
              echo "Checking if diagram sources changed without updating rendered outputs..."
              if [[ "${BASE_REF}" != "main" && "${BASE_REF}" != "develop" ]]; then
                echo "unsupported pull-request base ref" >&2
                exit 1
              fi
              base_ref="origin/${BASE_REF}"
              if [[ "$(git rev-parse --is-shallow-repository)" == "true" ]]; then
                git fetch --no-tags --unshallow origin \
                  "${BASE_REF}:refs/remotes/origin/${BASE_REF}" "$(git rev-parse HEAD)"
              fi
              git fetch --no-tags origin "${BASE_REF}:refs/remotes/origin/${BASE_REF}"
              git merge-base "${base_ref}" HEAD >/dev/null

              changed_diagrams=$(
                git diff --diff-filter=ACMRTUXB --name-only "${base_ref}"...HEAD -- \
                  ':(glob)docs/02-architecture/diagrams/architecture/*.mmd' \
                  ':(glob)docs/02-architecture/diagrams/foundation/*.mmd' \
                  ':(glob)docs/02-architecture/diagrams/class-diagrams/*.mmd' \
                  ':(glob)docs/02-architecture/diagrams/views/*.mermaid' \
                  ':(glob)docs/02-architecture/diagrams/providers/**/*.mmd' \
                  ':(glob)docs/02-architecture/diagrams/sequence/*.mmd' \
                  ':(glob)docs/02-architecture/diagrams/state-machines/*.mmd'
              )
              if [ -z "$changed_diagrams" ]; then
                echo "No diagram source files changed — skipping drift check."
                exit 0
              fi

              echo "Changed diagram sources:"
              echo "$changed_diagrams"

              changed_rendered=$(
                git diff --diff-filter=ACMRTUXB --name-only "${base_ref}"...HEAD -- \
                  ':(glob)docs/**/svg/*.svg' \
                  ':(glob)docs/**/png/*.png'
              )

              missing=""
              while IFS= read -r source_path; do
                [ -z "$source_path" ] && continue
                source_dir="${source_path%/*}"
                source_file="${source_path##*/}"
                stem="${source_file%.*}"
                expected_svg="${source_dir}/svg/${stem}.svg"
                if ! grep -Fxq "$expected_svg" <\<< "$changed_rendered"; then
                  missing="${missing}${expected_svg}\n"
                fi
              done <\<< "$changed_diagrams"

              if [ -n "$missing" ]; then
                echo "::error::Diagram sources changed without corresponding rendered SVG outputs."
                printf "%b" "$missing"
                echo "Run 'bash docs/02-architecture/diagrams/tooling/render.sh --svg-only --dir <changed-source-dir> --filter <stem>' and commit sibling svg/ outputs."
                exit 1
              fi

              echo "Re-rendering changed sources and comparing sibling SVG bytes..."
              while IFS= read -r source_path; do
                [ -z "$source_path" ] && continue
                source_dir="${source_path%/*}"
                source_file="${source_path##*/}"
                stem="${source_file%.*}"
                expected_svg="${source_dir}/svg/${stem}.svg"
                bash docs/02-architecture/diagrams/tooling/render.sh \
                  --svg-only \
                  --puppeteer /tmp/puppeteer-config.json \
                  --dir "${source_dir}" \
                  --filter "${stem}"
                if ! git diff --exit-code -- "${expected_svg}"; then
                  echo "::error::Rendered SVG bytes do not match the committed sibling ${expected_svg}."
                  exit 1
                fi
              done <\<< "$changed_diagrams"
              echo "Rendered SVG bytes match the committed siblings."

              DIAGRAM_CI
              timeout --signal=TERM --kill-after=30s 30m bash /tmp/diagram-ci/run.sh
    - store_artifacts:
        path: /tmp/diagram-ci
        destination: diagram-ci
    - store_artifacts:
        path: /tmp/diagram-lint.json
        destination: diagram-lint.json

  actions-audit:
    parameters:
      online:
        type: boolean
        default: false
    docker:
      - image: cimg/python:3.12
    resource_class: small
    steps:
      - checkout
      - run:
          name: Audit retained Actions with pinned zizmor 1.29.0
          no_output_timeout: 11m
          command: |
            cat > /tmp/actions-audit.sh \<<'BIOETL_ACTIONS_AUDIT'
            set -euo pipefail
            mkdir -p reports/actions-audit "$HOME/.local/bin"
            curl --fail --location --retry 3 --proto '=https' --tlsv1.2 \
              https://github.com/zizmorcore/zizmor/releases/download/v1.29.0/zizmor-x86_64-unknown-linux-gnu.tar.gz \
              --output /tmp/zizmor.tar.gz
            printf '%s  %s\n' dd96df044a6e8538d5f423790f453bdd03d49e5b2bcc38214acc41a2f1297839 /tmp/zizmor.tar.gz | sha256sum --check -
            tar -xzf /tmp/zizmor.tar.gz -C "$HOME/.local/bin" zizmor
            if << parameters.online >>; then
              [[ "$CIRCLE_BRANCH" == main ]]
              test -n "${GITHUB_TOKEN:-}"
              unset GH_TOKEN ZIZMOR_OFFLINE ZIZMOR_NO_ONLINE_AUDITS
            else
              export ZIZMOR_OFFLINE=true
            fi
            printf '%s\n' "$CIRCLE_SHA1" > reports/actions-audit/source-sha.txt
            set +e
            "$HOME/.local/bin/zizmor" \
              --min-severity high --min-confidence high --config .github/zizmor.yml \
              --format json .github/workflows .github/actions > reports/actions-audit/findings.json
            json_status=$?
            "$HOME/.local/bin/zizmor" \
              --min-severity high --min-confidence high --config .github/zizmor.yml \
              --format sarif .github/workflows .github/actions > reports/actions-audit/findings.sarif
            sarif_status=$?
            set -e
            if [ "$json_status" -ne 0 ]; then exit "$json_status"; fi
            exit "$sarif_status"
            BIOETL_ACTIONS_AUDIT
            timeout --signal=TERM --kill-after=30s 9m bash /tmp/actions-audit.sh
      - store_artifacts:
          path: reports/actions-audit

  # --- Gate: duplication (always_required) ---------------------------------------
  # Mirrors duplication-complexity.yml (radon + jscpd).
  duplication:
    docker:
      - image: cimg/python:3.12-node
    # Preserve the complete src/tests scan within the runner memory quota.
    resource_class: medium
    environment:
      NODE_OPTIONS: --max-old-space-size=3072
    steps:
      - checkout
      - halt-unless-pr-gate-paths:
          label: duplication
          pathspecs: "src scripts tests .github/tooling .github/workflows/duplication-complexity.yml .jscpd.json configs/quality/duplication_complexity_exemptions.yaml"
      - setup-python-uv
      - run:
          name: radon complexity (CC <= 10; domain <= 5)
          command: |
            export PATH="$HOME/.local/bin:$PATH"
            mkdir -p reports
            uv run --frozen --no-build radon cc src tests -a -s > reports/radon_cc.txt
            uv run --frozen --no-build python -m scripts.engineering.qa check-duplication-complexity-exemptions
      - run:
          name: jscpd duplication detection
          command: |
            set -euo pipefail
            export NODE_OPTIONS="--max-old-space-size=3072"
            mkdir -p reports/jscpd
            npm ci --ignore-scripts --no-fund --no-audit --prefix "$PWD/.github/tooling/jscpd"
            node .github/tooling/braces-backport/test.cjs .github/tooling/jscpd
            "$PWD/.github/tooling/jscpd/node_modules/.bin/jscpd" \
              "$PWD/src" "$PWD/tests" \
              --config "$PWD/.jscpd.json" \
              --threshold 10 --format python \
              --output "$PWD/reports/jscpd"

  semantic-governance:
    docker:
      - image: cimg/python:3.13
    resource_class: small
    steps:
      - checkout
      - setup-python-uv:
          extras: dev tracing
      - run:
          name: Semantic audit gates and regression tests
          command: |
            set -euo pipefail
            export PATH="$HOME/.local/bin:$PATH"
            timeout 10m bash -euo pipefail -c '
              uv run --frozen --no-build python -m scripts.engineering.qa report-semantic-pipeline-audit --check
              uv run --frozen --no-build python -m scripts.engineering.qa check-semantic-pair-budget --check --json
              uv run --frozen --no-build python -m scripts.engineering.qa check-semantic-registry-drift --check --json
              uv run --frozen --no-build python -m scripts.engineering.qa check-semantic-governance-policy --check --json
              uv run --frozen --no-build python -m scripts.engineering.qa check-semantic-anchor-parity --check --json
              uv run --frozen --no-build python -m scripts.engineering.qa check-generic-field-ownership --check --json
              uv run --frozen --no-build python -m scripts.engineering.qa check-ontology-unit-semantics --check --json
              uv run --frozen --no-build pytest -p no:benchmark --noconftest \
                tests/integration/config/test_semantic_field_unification_contract.py \
                tests/integration/config/test_semantic_governance_policy.py \
                tests/integration/config/test_semantic_pair_matrix_budget.py \
                tests/integration/config/test_semantic_anchor_parity.py \
                -q --tb=short --junitxml=reports/quality/semantic-governance/junit.xml
            '
      - store_test_results:
          path: reports/quality/semantic-governance
      - store_artifacts:
          path: reports/semantic_pipeline_audit
          destination: semantic-pipeline-audit

  # --- Gate: generated-artifacts (path_scoped) ------------------------------------
  # Mirrors schema-governance.yml (generated schema artifacts + parity).
  schema-governance:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    environment:
      CONTRACT_BASE_REVISION: << pipeline.git.base_revision >>
    steps:
      - checkout
      - setup-python-uv
      - check-gate:
          gate: generated-artifacts
      - run:
          name: schema artifacts + parity
          command: |
            export PATH="$HOME/.local/bin:$PATH"
            uv run --frozen --no-build python -m scripts.schema generate-artifacts --check
            uv run --frozen --no-build python -m scripts.schema verify-schema-parity --mode blocking
            git fetch --no-tags origin main:refs/remotes/origin/main
            if [ "$CIRCLE_BRANCH" = main ]; then
              BASE="$CONTRACT_BASE_REVISION"
              if ! [[ "$BASE" =~ ^[0-9a-f]{40}$ ]]; then
                BASE="$(git rev-parse HEAD~1)"
              fi
            else
              BASE="$(git merge-base origin/main "$CIRCLE_SHA1")"
            fi
            STATUS=0
            check_contract() { "$@" || STATUS=1; }
            check_contract uv run --frozen --no-build python scripts/engineering/ci/validate_contract_identity.py
            check_contract uv run --frozen --no-build python scripts/engineering/ci/validate_contract_registry.py
            check_contract uv run --frozen --no-build python -m scripts.engineering.qa report-pipeline-config-contract-ownership-map --check
            check_contract uv run --frozen --no-build python -m scripts.engineering.qa report-contract-coverage-matrix --check
            check_contract uv run --frozen --no-build python -m scripts.engineering.ci.validate_schema_classifier_gate --base-sha "$BASE" --head-sha "$CIRCLE_SHA1"
            check_contract uv run --frozen --no-build python scripts/engineering/ci/validate_registry_dq_refs.py
            exit "$STATUS"
      - store_artifacts:
          path: reports/quality/contract-identity-diagnostics.json
      - store_artifacts:
          path: reports/quality/contract-registry-diagnostics.json
      - store_artifacts:
          path: reports/quality/contract-schema-classifier-diagnostics.json
      - store_artifacts:
          path: reports/quality/contract-registry-dq-diagnostics.json
      - store_artifacts:
          path: reports/quality/contract-coverage-matrix.json
      - store_artifacts:
          path: reports/quality/pipeline-config-contract-ownership-map.json

  # --- Gate: commit-governance (path_scoped) ---------------------------------------
  # Mirrors commit-lint.yml (conventional commits on the PR range).
  commit-lint:
    docker:
      - image: cimg/python:3.12-node
    resource_class: small
    steps:
      - checkout
      - check-gate:
          gate: commit-governance
      - run:
          name: commitlint on PR range
          command: |
            git fetch --no-tags origin main:refs/remotes/origin/main
            BASE="$(git merge-base origin/main HEAD)"
            # The root lockfile is covered by the existing OSV security gate.
            npm ci --ignore-scripts --no-audit --no-fund
            node node_modules/@commitlint/cli/cli.js \
              --config commitlint.config.mjs \
              --from "$BASE" --to HEAD --verbose

  # --- Gate: docs-governance (path_scoped) ------------------------------------------
  # Mirrors docs.yml (docs-governance + validate-mkdocs essentials).
  docs-governance:
    docker:
    - image: cimg/python:3.12
    resource_class: small
    steps:
    - checkout
    - setup-python-uv:
        extras: dev tracing docs
    - check-gate:
        gate: docs-governance
    - run:
        name: docs governance checks
        command: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          uv run --frozen --no-build python -m scripts.diagrams generate-dataflows --pipeline chembl_activity --check
          uv run --frozen --no-build python -m scripts.docs passports check
          test -f docs/assets/javascripts/mermaid-init.js
          test -f docs/assets/stylesheets/mermaid-responsive.css
          uv run --frozen --no-build python -m scripts.engineering.qa check-xwalk-missing-backlog
          uv run --frozen --no-build python -m scripts.engineering.qa report-dashboard-inventory --check --json
          uv run --frozen --no-build python -m scripts.engineering.repo check-versions
          uv run --frozen --no-build python -m scripts.engineering.qa proof-or-stop ci produce --check docs-links
          uv run --frozen --no-build python -m scripts.engineering.qa proof-or-stop ci produce --check docs-runtime
          uv run --frozen --no-build python scripts/diagrams/render/generate_description_indexes.py --check
    - persist_to_workspace:
        root: .
        paths:
        - reports/quality/proof-or-stop/shared/docs-links
    - persist_to_workspace:
        root: .
        paths:
        - reports/quality/proof-or-stop/shared/docs-runtime
    - store_artifacts:
        path: reports/quality/proof-or-stop/shared/docs-links
    - store_artifacts:
        path: reports/quality/proof-or-stop/shared/docs-runtime
    environment:
      PYTHONPATH: src
      PROOF_CI_LANE: << pipeline.parameters.ci-lane >>
      BIOETL_AI_MEMORY_MODE: 'off'
      BIOETL_SKIP_PREFLIGHT: '1'
      BIOETL_SKIP_SETUP_PLUGINS: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'

  docker-build:
    docker:
      - image: cimg/python:3.12-node
    resource_class: small
    steps:
      - checkout
      - halt-unless-pr-gate-paths:
          label: docker build
          pathspecs: "Dockerfile.bioetl docker-compose.yml docker-compose.monitoring.yml .dockerignore .github/workflows/docker.yml"
      - check-gate:
          gate: docker
      - setup_remote_docker:
          version: default
      - run:
          name: Install Docker CLI (not bundled in cimg/python)
          command: |
            if ! command -v docker >/dev/null 2>&1; then
              curl -fsSL --proto '=https' --tlsv1.2 \
                https://download.docker.com/linux/static/stable/x86_64/docker-27.3.1.tgz \
                -o /tmp/docker.tgz
              tar -xzf /tmp/docker.tgz -C /tmp
              (sudo mv /tmp/docker/docker /usr/local/bin/ 2>/dev/null || mv /tmp/docker/docker "$HOME/.local/bin/")
              echo 'export PATH="/usr/local/bin:$HOME/.local/bin:$PATH"' >> "$BASH_ENV"
            fi
            docker version
      - run:
          name: Install Docker Compose plugin v5.6.0
          command: |
            mkdir -p "$HOME/.docker/cli-plugins"
            curl -fsSL --proto '=https' --tlsv1.2 \
              https://github.com/docker/compose/releases/download/v5.6.0/docker-compose-linux-x86_64 \
              -o "$HOME/.docker/cli-plugins/docker-compose"
            chmod 0755 "$HOME/.docker/cli-plugins/docker-compose"
            docker compose version
      - run:
          name: hadolint (Dockerfile.bioetl)
          command: |
            curl -fsSL --proto '=https' --tlsv1.2 \
              https://github.com/hadolint/hadolint/releases/download/v2.15.1/hadolint-Linux-x86_64 \
              -o "$HOME/.local/bin/hadolint"
            chmod 0755 "$HOME/.local/bin/hadolint"
            "$HOME/.local/bin/hadolint" Dockerfile.bioetl
      - run:
          name: docker compose config validation
          environment:
            # Interpolation only: these values never reach build/publish steps.
            COMPOSE_DISABLE_ENV_FILE: "1"
            NEO4J_PASSWORD: ci-compose-validation-placeholder
            GF_SECURITY_ADMIN_PASSWORD: ci-compose-validation-placeholder
            GF_RENDERING_RENDERER_TOKEN: ci-compose-validation-placeholder
          command: |
            docker compose config --quiet
            docker compose -f docker-compose.monitoring.yml config --quiet
      - run:
          name: docker build (Dockerfile.bioetl)
          command: docker build -f Dockerfile.bioetl -t bioetl:ci .
      - run:
          name: Rebuild and verify Router host plugin bundles
          command: |
            set -euo pipefail
            for plugin in bioetl-scenes-app bioetl-selectorshell-panel; do
              (
                cd "grafana/plugins/$plugin"
                npm ci --ignore-scripts
                npm run typecheck
                npm run lint
                NODE_ENV=test npm run test:ci -- --maxWorkers=2
                npm run build
              )
            done
            python - \<<'PY'
            import hashlib
            import json
            import os
            from pathlib import Path

            root = Path.cwd()
            manifest = json.loads((root / "grafana/tooling/router-v7-bridge/host-image.json").read_text())
            artifacts = {}
            for plugin in ("bioetl-scenes-app", "bioetl-selectorshell-panel"):
                dist = root / "grafana/plugins" / plugin / "dist"
                for filename in ("module.js", "plugin.json"):
                    bundle = dist / filename
                    assert bundle.is_file(), f"Missing built artifact: {bundle}"
                    relative = bundle.relative_to(root).as_posix()
                    actual = hashlib.sha256(bundle.read_bytes()).hexdigest()
                    assert actual == manifest["artifact_sha256"][relative], f"Artifact mismatch: {relative}"
                artifacts[plugin] = {
                    file.relative_to(dist).as_posix(): hashlib.sha256(file.read_bytes()).hexdigest()
                    for file in sorted(dist.rglob("*")) if file.is_file()
                }
            receipt = {"status": "PASS", "source_commit": os.environ["CIRCLE_SHA1"], "built_files": artifacts}
            destination = root / "reports/qa/router-v7-plugin-bundles.json"
            destination.parent.mkdir(parents=True, exist_ok=True)
            destination.write_text(json.dumps(receipt, indent=2) + "\n")
            PY
      - store_artifacts:
          path: reports/qa/router-v7-plugin-bundles.json
          destination: router-v7-plugin-bundles.json
      - run:
          name: Verify managed Router host preserves the complete pinned filesystem
          command: |
            PYTHONPATH=. python tests/unit/scripts/ops/test_router_managed_image.py
            PARENT=$(python -c "import json; print(json.load(open('grafana/tooling/router-v7-bridge/managed-image.json'))['parent_image'])")
            docker pull "$PARENT"
            docker build --platform linux/amd64 -f grafana/tooling/router-v7-bridge/Dockerfile.managed -t bioetl-router-host:managed-ci .
            DECLARED=$(python -c "import json; print(json.load(open('grafana/tooling/router-v7-bridge/managed-image.json'))['image'])")
            docker pull "$DECLARED"
            BUILT=$(docker image inspect bioetl-router-host:managed-ci --format '{{.Id}}')
            python -m scripts.ops verify-router-managed-image "$BUILT"
      - store_artifacts:
          path: reports/qa/router-v7-managed-image-parity.json
          destination: router-v7-managed-image-parity.json

  # --- Aggregator (mirrors pr-gate-complete; stable name for future rulesets) -------
  pr-gate-complete:
    docker:
      - image: cimg/base:stable
    resource_class: small
    steps:
      - run:
          name: PR gate complete
          command: echo "All required CircleCI gates passed."

  composite-closeout:
    docker:
      - image: cimg/python:3.12
    resource_class: medium
    steps:
      - checkout
      - setup-python-uv:
          extras: "dev tracing docs"
      - run:
          name: "Scoped evidence for issues 11904 and 11905"
          command: |
            export PATH="$HOME/.local/bin:$PATH"
            export PYTHONPATH="$PWD/src:$PWD"
            export BIOETL_AI_RUNTIME=circleci BIOETL_AI_AGENT=composite-closeout BIOETL_AI_MEMORY_MODE=read-only
            export PYTEST_DISABLE_PLUGIN_AUTOLOAD=1
            uv run --frozen --no-build python - \<<'PY'
            import datetime, json, os, pathlib, subprocess, sys, time
            root = pathlib.Path.cwd()
            run_id = "issues-11904-11905-ci-" + os.environ["CIRCLE_BUILD_NUM"]
            folder = root / "reports/quality/proof-or-stop" / run_id
            folder.mkdir(parents=True, exist_ok=False)
            prefix = [sys.executable, "-m", "scripts.engineering.qa", "proof-or-stop"]
            common = ["--task-id", "issues-11904-11905", "--claim", "done", "--run-id", run_id]
            identity = ["--trust-tier", "ci", "--ci-run-id", os.environ["CIRCLE_BUILD_URL"]]
            subprocess.run(prefix + ["plan"] + common + ["--ci-run-id", os.environ["CIRCLE_BUILD_URL"]], check=True)
            paths = ['tests/unit/interfaces/http/test_composite_child_artifact.py', 'tests/integration/adapters/test_http_retry_semantics.py', 'tests/integration/infrastructure/storage/test_composite_checkpoint_writer.py', 'tests/integration/test_health_replay_production_bootstrap.py', 'tests/unit/application/services/lineage/test_composite_source_identity.py', 'tests/integration/test_composite_report.py', 'tests/unit/application/services/test_metadata_lineage_node_builders.py', 'tests/unit/composition/bootstrap/runtime/test_composite_bootstrap_builders.py', 'tests/unit/composition/bootstrap/runtime/test_composite_gold_dependencies.py', 'tests/unit/composition/bootstrap/runtime/test_runtime_basics.py', 'tests/unit/composition/bootstrap/test_health_replay_object_wiring.py', 'tests/unit/composition/factories/datasource/test_http_client_factory.py', 'tests/unit/domain/composite/test_composite_result.py', 'tests/unit/infrastructure/adapters/http/test_client_retry_mixin.py', 'tests/unit/infrastructure/adapters/http/test_request_timing.py', 'tests/unit/infrastructure/adapters/semanticscholar/test_batch_request_mixin.py', 'tests/unit/infrastructure/adapters/semanticscholar/test_fallback.py', 'tests/unit/infrastructure/storage/support/test_checkpoint_writer.py', 'tests/unit/infrastructure/storage/test_lineage_persistence.py', 'tests/unit/interfaces/cli/commands/test_composite_warning_result.py', 'tests/unit/interfaces/cli/commands/test_run_composite.py', 'tests/unit/interfaces/http/test_selected_run_status.py', 'tests/unit/interfaces/http/test_selected_run_unfinished_evidence.py', 'tests/unit/infrastructure/adapters/http/test_provider_scope.py', 'tests/unit/infrastructure/storage/test_composite_replay_inputs.py', 'tests/integration/composite/test_assay_snapshot_merge_replay.py', 'tests/unit/infrastructure/storage/test_composite_replay_bundle.py', 'tests/unit/interfaces/cli/test_cli_root_help_uniqueness.py', 'tests/unit/interfaces/cli/test_cli_main_module.py', 'tests/unit/application/composite/test_merger_metrics_mixin.py', 'tests/unit/application/composite/test_dependency_coordinator.py', 'tests/unit/application/composite/test_dependency_progress_tracker.py', 'tests/unit/application/composite/test_composite_activity.py', 'tests/unit/scripts/qa/test_report_debt_governance_gates.py', 'tests/unit/scripts/qa/test_report_architecture_debt_remote_main_baseline.py']
            checks = [
                ("tests", "test_health", [sys.executable, "-m", "pytest", "-o", "addopts=", "-p", "pytest_asyncio.plugin", "-p", "pytest_timeout", "-p", "respx.plugin", "-p", "pytest_cov.plugin", "-p", "_hypothesis_pytestplugin", *paths, "--no-cov", "-q", "--tb=short", "--junitxml=" + str(folder / "tests.xml")]),
                ("governance", "pretest_guardrails", ["bash", "scripts/engineering/dev/pretest_guardrails.sh", "--mode", "check", "--scope", "governance"]),
                ("docs_runtime", "docs_runtime_checks", [sys.executable, "-m", "scripts.docs", "verify"]),
                ("debt", "debt_governance_gates", [sys.executable, "-m", "scripts.engineering.qa", "report-debt-governance-gates", "--check"]),
            ]
            receipts = []
            for kind, producer, command in checks:
                started = datetime.datetime.now(datetime.UTC).isoformat()
                clock = time.monotonic()
                log = folder / (kind + ".log")
                with log.open("w") as stream:
                    result = subprocess.run(command, stdout=stream, stderr=subprocess.STDOUT)
                normalized = " ".join(["python", *command[1:]]) if command[0] == sys.executable else " ".join(command)
                output = folder / "receipts" / (kind + ".json")
                subprocess.run(prefix + ["receipt"] + common + identity + ["--receipt-id", kind, "--producer", producer, "--evidence-kind", kind, "--command", normalized, "--started-at", started, "--duration-ms", str(int((time.monotonic()-clock)*1000)), "--exit-code", str(result.returncode), "--status", "pass" if result.returncode == 0 else "fail", "--output-artifact", str(log), "--output", str(output)], check=True)
                receipts += ["--receipt", str(output)]
                print(kind, result.returncode, flush=True)
            subprocess.run(prefix + ["assemble"] + common + identity + ["--actor", "circleci", "--runtime", "circleci"] + receipts, check=True)
            result = subprocess.run(prefix + ["verify", "--bundle", str(folder / "bundle.json"), "--output", str(folder / "verification.json")])
            sys.exit(result.returncode)
            PY
      - store_test_results:
          path: reports/quality/proof-or-stop
      - store_artifacts:
          path: reports/quality/proof-or-stop
          destination: composite-closeout

  proof-coverage:
    docker:
    - image: cimg/python:3.12
    resource_class: medium
    environment:
      PYTHONPATH: src
      PROOF_CI_LANE: << pipeline.parameters.ci-lane >>
      BIOETL_AI_MEMORY_MODE: 'off'
      BIOETL_SKIP_PREFLIGHT: '1'
      BIOETL_SKIP_SETUP_PLUGINS: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
    - checkout
    - setup-python-uv:
        extras: dev tracing docs
    - attach_workspace:
        at: /home/circleci/.bioetl-proof-workspace
    - run:
        name: Receive isolated proof evidence
        command: |
          export PATH="$PWD/.venv/bin:$HOME/.local/bin:$PATH"
          python -m scripts.engineering.qa proof-or-stop ci receive
    - run:
        name: Capture coverage evidence
        no_output_timeout: 30m
        command: |-
          export PATH="$PWD/.venv/bin:$HOME/.local/bin:$PATH"
          python -m scripts.engineering.qa proof-or-stop ci produce --check coverage
    - persist_to_workspace:
