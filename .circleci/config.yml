# CircleCI config v2 â€” PR gates port (phase 2, 03.10.2026)
# Repo: SatoryKono/BioactivityDataAcquisition
# Mirrors .github/workflows/pr-required.yml: the `classify` job runs the repo's own
# decision-matrix classifier (scripts/engineering/ci pr-gate classify); each gate job
# reads the matrix from the workspace and halts early when not_applicable.
# Gate ownership and applicability come from the canonical catalog (docker,
# generated-artifacts, commit-governance, docs-governance).
# CodeQL is excluded from required checks (#11929); optional analysis is separate.
# Remaining migration decisions: dependency-review, labeler, stale.
# Deploy: replace .circleci/config.yml at repo root, commit, push.
version: 2.1

parameters:
  ci-lane:
    type: enum
    enum: [pr-gate, docs-kpi, memory-retention, port-contracts, skills-consistency, github-settings-review, performance, replay-parity, memory-freshness, mutation, consolidation, branch-hygiene, architecture-docs, provider-contract-drift, semantic-governance, e2e-replay, coverage-closeout, docker-baseline, docker-publish, architecture-metrics, scorecard, scorecard-publish]
    default: pr-gate
  include-hypothesis:
    type: boolean
    default: true

  run-heavy:
    type: boolean
    default: false

commands:
  # Port of .github/actions/setup-python-uv (uv 0.11.26, uv cache, uv sync).
  setup-python-uv:
    description: "Install uv, restore cache, sync deps (port of GH composite action)"
    parameters:
      python-version:
        type: string
        default: "3.12"
      extras:
        type: string
        default: "dev tracing"
    steps:
      - run:
          name: Install uv 0.11.26
          command: |
            set -euo pipefail
            test "$(uname -m)" = x86_64
            archive="$(mktemp)"
            extracted="$(mktemp -d)"
            trap 'rm -f "$archive"; rm -rf "$extracted"' EXIT
            curl --fail --location --retry 3 \
              https://github.com/astral-sh/uv/releases/download/0.11.26/uv-x86_64-unknown-linux-gnu.tar.gz \
              --output "$archive"
            printf '%s  %s\n' 6426a73c3837e6e2483ee344cbc00f36394d179afcba6183cb77437e67db4af0 "$archive" | sha256sum --check -
            tar -xzf "$archive" -C "$extracted"
            mkdir -p "$HOME/.local/bin"
            install -m 0755 "$extracted/uv-x86_64-unknown-linux-gnu/uv" "$HOME/.local/bin/uv"
            install -m 0755 "$extracted/uv-x86_64-unknown-linux-gnu/uvx" "$HOME/.local/bin/uvx"
            echo 'export PATH="$HOME/.local/bin:$PATH"' >> "$BASH_ENV"
            echo 'export UV_PYTHON="<< parameters.python-version >>"' >> "$BASH_ENV"
            "$HOME/.local/bin/uv" --version
      - restore_cache:
          name: Restore uv cache
          keys:
            - uv-v1-{{ checksum "uv.lock" }}-py<< parameters.python-version >>
      - run:
          name: Sync dependencies
          command: |
            export PATH="$HOME/.local/bin:$PATH"
            export UV_CACHE_DIR="$HOME/.cache/uv"
            CMD="uv sync --frozen"
            for extra in << parameters.extras >>; do CMD="$CMD --extra $extra"; done
            echo "Running: $CMD"
            $CMD
            # Keep the exact extras/environment produced by the successful frozen sync.
            export UV_NO_SYNC=1
            echo 'export UV_NO_SYNC=1' >> "$BASH_ENV"
            uv run --frozen --no-build python -c 'import os, sys; actual = ".".join(map(str, sys.version_info[:2])); expected = os.environ["UV_PYTHON"]; assert actual == expected, f"Python mismatch: {actual} != {expected}"; print(f"Python {actual} matches requested runtime")'
      - save_cache:
          name: Save uv cache
          key: uv-v1-{{ checksum "uv.lock" }}-py<< parameters.python-version >>
          paths:
            - ~/.cache/uv

  # Reads the decision matrix produced by `classify`; ends the job as success
  # without running the gate when the catalog says not_applicable.
  check-gate:
    description: "Halt job early when the gate decision is not_applicable"
    parameters:
      gate:
        type: string
    steps:
      - attach_workspace:
          at: /tmp/cci-ws
      - run:
          name: Check gate decision (<< parameters.gate >>)
          command: |
            DECISION=$(python3 -c "import json; print(json.load(open('/tmp/cci-ws/pr-gate-decisions.json'))['decisions']['<< parameters.gate >>']['decision'])")
            echo "gate << parameters.gate >> decision: $DECISION"
            if [ "$DECISION" != "required" ]; then
              echo "Gate not applicable for this change set â€” skipping."
              circleci-agent step halt
            fi

jobs:
  scorecard-analysis:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    steps:
      - checkout
      - run:
          name: Pinned OpenSSF Scorecard informational analysis
          no_output_timeout: 16m
          command: |
            set -euo pipefail
            set +x
            test "$CIRCLE_BRANCH" = main
            test "$(git rev-parse HEAD)" = "$CIRCLE_SHA1"
            : "${GITHUB_TOKEN:?Missing read-only GitHub credential}"
            export GITHUB_AUTH_TOKEN="$GITHUB_TOKEN"
            timeout --signal=TERM --kill-after=30s 15m bash -euo pipefail -c '
              mkdir -p /tmp/bioetl-scorecard/tools /tmp/bioetl-scorecard/reports
              curl --fail --location --retry 3 https://github.com/ossf/scorecard/releases/download/v5.5.0/scorecard_5.5.0_linux_amd64.tar.gz -o /tmp/bioetl-scorecard/scorecard.tar.gz
              echo "83b90a05c1540ef1390db1cd5711e5fd04be9c1d8537fb84d39d02092d6a8dff  /tmp/bioetl-scorecard/scorecard.tar.gz" | sha256sum --check -
              tar -xzf /tmp/bioetl-scorecard/scorecard.tar.gz -C /tmp/bioetl-scorecard/tools scorecard
              curl --fail --location --retry 3 https://raw.githubusercontent.com/ossf/scorecard-action/2d1146689b8cda280b9bc96326124645441f03bc/policies/template.yml -o /tmp/bioetl-scorecard/reports/policy.yml
              echo "6e75dcc0df989d333492c0e1f6e484fc5b4d26ab768333ddcd0e3788539689b0  /tmp/bioetl-scorecard/reports/policy.yml" | sha256sum --check -
              /tmp/bioetl-scorecard/tools/scorecard --repo=github.com/SatoryKono/BioactivityDataAcquisition --format=json --show-details --output=/tmp/bioetl-scorecard/reports/results.json
              ENABLE_SARIF=true /tmp/bioetl-scorecard/tools/scorecard --repo=github.com/SatoryKono/BioactivityDataAcquisition --format=sarif --show-details --policy=/tmp/bioetl-scorecard/reports/policy.yml --output=/tmp/bioetl-scorecard/reports/results.raw.sarif
            '
            python3 - \<<'PY'
            import json, os
            from pathlib import Path
            path = Path('/tmp/bioetl-scorecard/reports/results.json')
            result = json.loads(path.read_text(encoding='utf-8'))
            assert result['repo']['commit'] == os.environ['CIRCLE_SHA1'], 'Default branch changed during analysis'
            assert result['repo']['name'] == 'github.com/SatoryKono/BioactivityDataAcquisition'
            assert result['scorecard']['version'] == 'v5.5.0'
            expected = {'Binary-Artifacts', 'Branch-Protection', 'CI-Tests', 'CII-Best-Practices', 'Code-Review', 'Contributors', 'Dangerous-Workflow', 'Dependency-Update-Tool', 'Fuzzing', 'License', 'Maintained', 'Packaging', 'Pinned-Dependencies', 'SAST', 'Security-Policy', 'Signed-Releases', 'Token-Permissions', 'Vulnerabilities'}
            checks = result['checks']
            assert len(checks) == len(expected) and {row['name'] for row in checks} == expected
            assert all(isinstance(row['score'], int) and -1 <= row['score'] <= 10 and isinstance(row['reason'], str) for row in checks)
            import urllib.request
            request = urllib.request.Request('https://api.github.com/repos/SatoryKono/BioactivityDataAcquisition/git/ref/heads/main', headers={'Authorization': 'Bearer ' + os.environ['GITHUB_TOKEN'], 'Accept': 'application/vnd.github+json'})
            with urllib.request.urlopen(request, timeout=30) as response:
                assert json.load(response)['object']['sha'] == os.environ['CIRCLE_SHA1'], 'Main changed during SARIF analysis'
            sarif = json.loads(path.with_name('results.raw.sarif').read_text(encoding='utf-8'))
            assert sarif['version'] == '2.1.0' and sarif['runs']
            from urllib.parse import quote
            for run in sarif['runs']:
                # Upstream project-wide findings use a placeholder containing spaces.
                # Preserve its value as a valid URI reference for GitHub's strict parser.
                for finding in run.get('results', []):
                    for location in finding.get('locations', []):
                        artifact = location.get('physicalLocation', {}).get('artifactLocation', {})
                        if 'uri' in artifact:
                            artifact['uri'] = quote(artifact['uri'], safe="/:#?&=%@[]!$'()*+,;~-._")
                assert run['tool']['driver']['name'] == 'Scorecard'
                assert run['tool']['driver']['semanticVersion'] == 'v5.5.0'
                run['versionControlProvenance'] = [{'repositoryUri': 'https://github.com/SatoryKono/BioactivityDataAcquisition', 'revisionId': os.environ['CIRCLE_SHA1'], 'branch': 'main'}]
            path.with_name('results.sarif').write_text(json.dumps(sarif, sort_keys=True) + '\n', encoding='utf-8')
            # Scores and unsupported checks stay visible; the legacy lane is informational.
            identity = {'source_sha': os.environ['CIRCLE_SHA1'], 'workflow_id': os.environ['CIRCLE_WORKFLOW_ID'], 'job_number': os.environ['CIRCLE_BUILD_NUM'], 'check_count': len(checks), 'sarif_uploaded': False, 'public_results_published': False}
            import hashlib
            identity['sha256'] = {name: hashlib.sha256(path.with_name(name).read_bytes()).hexdigest() for name in ('results.json', 'results.sarif')}
            path.with_name('identity.json').write_text(json.dumps(identity, sort_keys=True) + '\n', encoding='utf-8')
            PY
      - persist_to_workspace:
          root: /tmp/bioetl-scorecard
          paths:
            - reports
      - store_artifacts:
          path: /tmp/bioetl-scorecard/reports
          destination: scorecard-analysis

  scorecard-publish:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    steps:
      - checkout
      - attach_workspace:
          at: /tmp/bioetl-scorecard
      - run:
          name: Upload approved source-bound Scorecard SARIF
          no_output_timeout: 11m
          command: |
            set -euo pipefail
            set +x
            timeout --signal=TERM --kill-after=30s 10m python3 scripts/engineering/ci/publish_scorecard_sarif.py \
              --directory /tmp/bioetl-scorecard/reports \
              --output /tmp/bioetl-scorecard/publication/receipt.json
      - store_artifacts:
          path: /tmp/bioetl-scorecard/publication
          destination: scorecard-publication

  architecture-fast-baseline:
    docker:
      - image: cimg/python:3.12
    resource_class: medium
    environment:
      HYPOTHESIS_PROFILE: ci
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - checkout
      - setup-python-uv
      - run:
          name: Restore history for ancestor gates
          command: |
            if [ "$(git rev-parse --is-shallow-repository)" = true ]; then git fetch --unshallow --filter=blob:none --no-tags; fi
            git fetch --no-prune origin main
      - run:
          name: Canonical architecture fast baseline
          no_output_timeout: 11m
          command: timeout --signal=TERM --kill-after=30s 10m make qa-arch-fast
      - store_artifacts:
          path: reports/quality/test-runs
          destination: architecture-fast-baseline
      - store_test_results:
          path: reports/quality/test-runs/junit
  architecture-heavy-nightly:
    docker:
      - image: cimg/python:3.12
    resource_class: large
    environment:
      HYPOTHESIS_PROFILE: ci
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - checkout
      - setup-python-uv:
          extras: dev tracing performance
      - run:
          name: Restore source and LFS history
          command: |
            if [ "$(git rev-parse --is-shallow-repository)" = true ]; then git fetch --unshallow --filter=blob:none --no-tags; fi
            git fetch --no-prune origin main
            git lfs pull
      - run:
          name: Architecture complexity and heavy coverage
          no_output_timeout: 26m
          command: |
            timeout --signal=TERM --kill-after=30s 25m bash -euo pipefail -c '
              mkdir -p /tmp/architecture-metrics
              uv run --frozen --no-build radon cc src/bioetl --min C --show-closures | tee /tmp/architecture-metrics/radon.txt
              uv run --frozen --no-build pytest tests/ -m "not e2e and not benchmark and not serial" \
                --ignore=tests/e2e --ignore=tests/contract \
                -n auto --dist loadscope --max-worker-restart=0 \
                --cov=src/bioetl --cov-report=term-missing \
                --cov-report=xml:/tmp/architecture-metrics/coverage.xml \
                --junitxml=/tmp/architecture-metrics/junit.xml --cov-fail-under=85
            '
      - store_test_results:
          path: /tmp/architecture-metrics
      - store_artifacts:
          path: /tmp/architecture-metrics
          destination: architecture-metrics
  windows-atomic-write-stress-nightly:
    machine:
      image: windows-server-2022-gui:2026.05.1
      shell: powershell.exe -ExecutionPolicy Bypass
    resource_class: windows.medium
    environment:
      HYPOTHESIS_PROFILE: ci
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
      UV_PYTHON: '3.12'
      PYTHONUTF8: '1'
    steps:
      - checkout
      - run:
          name: Pinned uv and locked Windows environment
          command: |
            $ErrorActionPreference = 'Stop'
            $archive = Join-Path $env:TEMP 'bioetl-uv-0.11.26.zip'
            $toolDir = Join-Path $env:TEMP 'bioetl-uv-0.11.26'
            Invoke-WebRequest -Uri 'https://github.com/astral-sh/uv/releases/download/0.11.26/uv-x86_64-pc-windows-msvc.zip' -OutFile $archive
            if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne '4e1278ede866be6c0bf32d2f466cc6de7a9fb399ecf20c9ce2d186e52424be47') { throw 'uv checksum mismatch' }
            Expand-Archive -LiteralPath $archive -DestinationPath $toolDir -Force
            & (Join-Path $toolDir 'uv.exe') sync --frozen --extra dev --extra tracing
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & .venv/Scripts/python.exe -c "import sys; assert sys.version_info[:2] == (3, 12)"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run:
          name: Windows atomic lock stress with terminal evidence
          no_output_timeout: 16m
          command: |
            $ErrorActionPreference = 'Stop'
            New-Item -ItemType Directory -Path reports/quality/windows-atomic-stress -Force | Out-Null
            $process = Start-Process -FilePath .venv/Scripts/python.exe -ArgumentList @('-m', 'pytest', 'tests/integration/infrastructure/storage/test_atomic.py', '-k', 'windows_lock_stress', '-m', '"slow and serial"', '-q', '--tb=short', '--junitxml=reports/quality/windows-atomic-stress/junit.xml') -PassThru -WindowStyle Hidden -RedirectStandardOutput reports/quality/windows-atomic-stress/stdout.log -RedirectStandardError reports/quality/windows-atomic-stress/stderr.log
            if (-not $process.WaitForExit(900000)) { Stop-Process -Id $process.Id; throw 'Windows stress exceeded 15-minute limit' }
            $process.Refresh()
            Get-Content reports/quality/windows-atomic-stress/stdout.log
            Get-Content reports/quality/windows-atomic-stress/stderr.log
            if ($process.ExitCode -ne 0) { exit $process.ExitCode }
            [xml]$junit = Get-Content -LiteralPath reports/quality/windows-atomic-stress/junit.xml -Raw
            $cases = @($junit.SelectNodes('//testcase'))
            if ($cases.Count -ne 2 -or $junit.SelectNodes('//failure|//error|//skipped').Count -ne 0) { throw 'Windows stress requires both real tests to pass without skips' }
      - store_test_results:
          path: reports/quality/windows-atomic-stress
      - store_artifacts:
          path: reports/quality/windows-atomic-stress
          destination: windows-atomic-stress
  docker-security-baseline:
    docker:
      - image: cimg/python:3.13
    resource_class: medium
    steps:
      - checkout
      - setup-python-uv:
          python-version: '3.13'
          extras: dev
      - setup_remote_docker:
          version: default
      - run:
          name: Install Docker CLI and image archive tooling
          command: |
            mkdir -p "$HOME/.local/bin"
            curl -fsSL --proto '=https' --tlsv1.2 https://download.docker.com/linux/static/stable/x86_64/docker-27.3.1.tgz -o /tmp/docker-baseline-cli.tgz
            # SHA256 recorded from the official HTTPS archive on 2026-10-05.
            # This is a content pin, not an independently signed vendor checksum.
            echo "9b4f6fe406e50f9085ee474c451e2bb5adb119a03591f467922d3b4e2ddf31d3  /tmp/docker-baseline-cli.tgz" | sha256sum --check -
            tar -xzf /tmp/docker-baseline-cli.tgz -C /tmp
            install /tmp/docker/docker "$HOME/.local/bin/docker"
            echo 'export PATH="$HOME/.local/bin:$PATH"' >> "$BASH_ENV"
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y zstd
      - run:
          name: Build and verify canonical Docker security baseline
          no_output_timeout: 50m
          command: |
            timeout --signal=TERM --kill-after=30s 45m bash -euo pipefail \<<'BASELINE'
            set -euo pipefail
            : "${CIRCLE_SHA1:?Missing exact source SHA}"
            : "${CIRCLE_BRANCH:?Missing source branch}"
            : "${CIRCLE_BUILD_NUM:?Missing job identity}"
            : "${GITHUB_TOKEN:?Read-only GitHub security-alert access required}"
            test "$CIRCLE_BRANCH" = main
            repo_root="$(git rev-parse --show-toplevel)"
            test "$(git rev-parse HEAD)" = "$CIRCLE_SHA1"
            export PYTHONPATH="${repo_root}/src:${repo_root}"
            # Use the lockfile environment even after moving into the artifact directory.
            export PATH="${repo_root}/.venv/bin:$PATH"
            python3 -c "import yaml; from scripts.engineering.qa.docker_stability_campaign import trivy_baseline"
            export IMAGE_REF="bioetl:${CIRCLE_SHA1}"
            workdir="${DOCKER_BASELINE_WORKDIR:-/tmp/bioetl-docker-baseline}"
            mkdir "$workdir"
            cd "$workdir"
            mkdir -p reports/security
            install_dir="$workdir/tools"
            mkdir -p "$install_dir"
            curl -fsSL --proto '=https' --tlsv1.2 https://github.com/aquasecurity/trivy/releases/download/v0.70.0/trivy_0.70.0_Linux-64bit.tar.gz -o "$install_dir/trivy.tar.gz"
            echo "8b4376d5d6befe5c24d503f10ff136d9e0c49f9127a4279fd110b727929a5aa9  $install_dir/trivy.tar.gz" | sha256sum -c -
            tar -xzf "$install_dir/trivy.tar.gz" -C "$install_dir" trivy
            export PATH="$install_dir:$PATH"
            docker build --file "$repo_root/Dockerfile.bioetl" --tag "$IMAGE_REF" "$repo_root"
            export BUILD_IMAGE_ID="$(docker image inspect "$IMAGE_REF" --format '{{.Id}}')"
            export BUILD_METADATA='{}'
            export BUILD_DIGEST=''

            # Capture Docker build action metadata
            python3 - \<<'PY'
            import json
            import os
            from pathlib import Path

            metadata_raw = os.environ.get("BUILD_METADATA") or "{}"
            try:
                metadata = json.loads(metadata_raw)
            except json.JSONDecodeError as exc:
                raise SystemExit(f"invalid build metadata JSON: {exc}") from exc

            payload = {
                "schema_version": "docker-build-metadata-v1",
                "producer": "circleci",
                "source_sha": os.environ["CIRCLE_SHA1"],
                "run_id": os.environ.get("CIRCLE_BUILD_NUM", ""),
                "run_attempt": os.environ.get("CIRCLE_WORKFLOW_ID", ""),
                "image_ref": os.environ["IMAGE_REF"],
                "image_id": os.environ.get("BUILD_IMAGE_ID", ""),
                "digest": os.environ.get("BUILD_DIGEST", ""),
                "metadata": metadata,
                "cache": {
                    "from": "none",
                    "to_policy": "no shared cache export",
                },
            }
            if not payload["image_id"]:
                raise SystemExit("docker build action did not emit imageid")
            Path("reports/security/docker-build-metadata.json").write_text(
                json.dumps(payload, indent=2, sort_keys=True) + "\n",
                encoding="utf-8",
            )
            PY

            # Capture image and runtime provenance
            set -euo pipefail
            {
              echo "source_sha=${CIRCLE_SHA1}"
              echo "wolfi_base_image=chainguard/wolfi-base@sha256:19f7a7b40a11c435311e3784bd134c6b6f19677462440da48f96d5c84eefd669"
              echo "runtime_python=python-3.13=3.13.16_git20261002-r2"
              echo "runtime_zlib=zlib=1.3.2.1_rc20260917-r0"
              echo "builder_uv=uv=0.11.26-r0"
              echo "setuptools_build_constraint=setuptools==83.0.0"
              docker image inspect "${IMAGE_REF}" --format 'image_id={{.Id}} repo_digests={{json .RepoDigests}}'
              docker run --rm --entrypoint python "${IMAGE_REF}" --version
              docker run --rm --entrypoint python "${IMAGE_REF}" -c 'import grp, importlib.util, os, pwd, shutil, stat, sys, tempfile, zlib; assert sys.version_info[:3] == (3, 13, 16); assert zlib.ZLIB_RUNTIME_VERSION == "1.3.2.1-motley"; assert (os.getuid(), os.getgid()) == (999, 999); assert pwd.getpwuid(999).pw_name == "bioetl"; assert pwd.getpwuid(999).pw_shell == "/sbin/nologin"; assert grp.getgrgid(999).gr_name == "bioetl"; assert importlib.util.find_spec("pip") is None; assert stat.S_IMODE(os.stat("/tmp").st_mode) == 0o700; assert (os.stat("/tmp").st_uid, os.stat("/tmp").st_gid) == (999, 999); assert (os.stat("/app/configs").st_uid, os.stat("/app/configs").st_gid) == (0, 0); assert not os.access("/app/configs", os.W_OK); forbidden_paths = ("/bin/sh", "/bin/ash", "/bin/bash", "/bin/busybox", "/usr/bin/sh", "/usr/bin/ash", "/usr/bin/bash", "/usr/bin/busybox", "/sbin/apk", "/usr/bin/apk"); assert not any(os.path.lexists(path) for path in forbidden_paths); assert all(shutil.which(name) is None for name in ("sh", "ash", "bash", "busybox", "apk", "pip", "pip3", "pip3.13")); handle = tempfile.NamedTemporaryFile(dir="/tmp", delete=True); handle.close(); marker = "/app/logs/.runtime-security-probe"; open(marker, "wb").close(); os.unlink(marker); print("python=3.13.16 uid=999 gid=999 identity=bioetl shell=absent apk=absent pip=absent tmp=00700 tmp_owner=999:999 configs=root-readonly logs=writable")'
            } > reports/security/bioetl-image-provenance.txt 2>&1
            docker image inspect "${IMAGE_REF}" --format '{{.Id}}' \
              > reports/security/bioetl-image-id.txt
            docker run --rm --entrypoint python "${IMAGE_REF}" -c 'from importlib.metadata import distributions; print("\n".join(sorted("{}=={}".format(d.metadata["Name"], d.version) for d in distributions())))' \
              > reports/security/bioetl-pip-freeze.txt

            # Prove default image health contract
            set -euo pipefail
            container_id="$(docker run --detach --rm "${IMAGE_REF}")"
            cleanup() {
              docker rm --force "${container_id}" >/dev/null 2>&1 || true
            }
            trap cleanup EXIT
            health_status="starting"
            for _ in $(seq 1 60); do
              health_status="$(docker inspect "${container_id}" --format '{{.State.Health.Status}}')"
              if [ "${health_status}" = "healthy" ]; then
                break
              fi
              if [ "$(docker inspect "${container_id}" --format '{{.State.Running}}')" != "true" ]; then
                docker logs "${container_id}"
                exit 1
              fi
              sleep 2
            done
            test "${health_status}" = "healthy"
            docker exec "${container_id}" python -c 'import urllib.request; response = urllib.request.urlopen("http://127.0.0.1:8000/health/live", timeout=3); assert response.status == 200; response.read(); print("health_live=ok docker_health=healthy")'
            cleanup
            trap - EXIT

            # Run full Trivy JSON evidence scan
            set -euo pipefail
            trivy image \
              --format json \
              --output reports/security/trivy-results.json \
              --severity CRITICAL,HIGH,MEDIUM,UNKNOWN \
              --exit-code 0 \
              "${IMAGE_REF}"
            test -s reports/security/trivy-results.json

            # Convert canonical Trivy JSON evidence
            set -euo pipefail
            trivy convert --format sarif --output reports/security/trivy-results.sarif reports/security/trivy-results.json
            test -s reports/security/trivy-results.sarif

            # SPDX SBOM is generated from the exact local image already scanned above.
            trivy image --format spdx-json --output reports/security/bioetl.spdx.json "$IMAGE_REF"
            trivy version --format json > reports/security/trivy-version.json
            python3 - \<<'ALERTS'
            import json, os, urllib.request
            from pathlib import Path
            pages = []
            page = 1
            while True:
                url = "https://api.github.com/repos/SatoryKono/BioactivityDataAcquisition/code-scanning/alerts?state=open&tool_name=Trivy&per_page=100&page=" + str(page)
                request = urllib.request.Request(url, headers={"Authorization": "Bearer " + os.environ["GITHUB_TOKEN"], "Accept": "application/vnd.github+json"})
                with urllib.request.urlopen(request, timeout=30) as response:
                    alerts = json.load(response)
                if not isinstance(alerts, list):
                    raise RuntimeError("GitHub alert response must be a list")
                pages.append(alerts)
                if len(alerts) < 100:
                    break
                page += 1
            Path("reports/security/github-trivy-alerts.json").write_text(json.dumps(pages, sort_keys=True) + "\n", encoding="utf-8")
            ALERTS

            # Export deterministic Trivy baseline CSV
            python3 -c "from pathlib import Path; from scripts.engineering.qa.docker_stability_campaign.trivy_baseline import export_trivy_baseline_csv; count = export_trivy_baseline_csv(trivy_json=Path('reports/security/trivy-results.json').resolve(), github_alerts_json=Path('reports/security/github-trivy-alerts.json').resolve(), output=Path('reports/security/trivy-alerts.csv').resolve()); print(f'rows={count}')"

            # Run Trivy on pinned Wolfi runtime base image
            set -euo pipefail
            trivy image \
              --format json \
              --output reports/security/trivy-base-results.json \
              --severity CRITICAL,HIGH,MEDIUM,UNKNOWN \
              --exit-code 0 \
              "chainguard/wolfi-base@sha256:19f7a7b40a11c435311e3784bd134c6b6f19677462440da48f96d5c84eefd669"
            test -s reports/security/trivy-base-results.json

            # Generate Trivy fixability audit
            python3 -m scripts.engineering.qa.docker_stability_campaign.trivy_baseline \
              --trivy-json "$PWD/reports/security/trivy-results.json" \
              --output "$PWD/reports/security/trivy-fixability-audit.json"

            # Validate complete security baseline
            set -euo pipefail
            required=(
              reports/security/bioetl-image-id.txt
              reports/security/bioetl-image-provenance.txt
              reports/security/bioetl-pip-freeze.txt
              reports/security/bioetl.spdx.json
              reports/security/docker-build-metadata.json
              reports/security/github-trivy-alerts.json
              reports/security/trivy-alerts.csv
              reports/security/trivy-base-results.json
              reports/security/trivy-fixability-audit.json
              reports/security/trivy-results.json
              reports/security/trivy-results.sarif
              reports/security/trivy-version.json
            )
            for evidence in "${required[@]}"; do
              test -s "${evidence}"
            done
            (cd reports/security; sha256sum "${required[@]#reports/security/}") > reports/security/baseline.sha256

            # Enforce canonical Trivy Critical High Medium zero policy
            python3 -m scripts.engineering.qa.docker_stability_campaign.trivy_baseline \
              --trivy-json "$PWD/reports/security/trivy-results.json" \
              --output "$PWD/reports/security/trivy-fixability-audit.json" \
              --fail-on-blocking

            # Export exact scanned image for publication
            docker save "${IMAGE_REF}" | zstd -T0 -10 -o reports/security/bioetl-scanned-image.tar.zst
            (cd reports/security; sha256sum bioetl-scanned-image.tar.zst) > reports/security/scanned-image.sha256
            BASELINE
      - store_artifacts:
          path: /tmp/bioetl-docker-baseline/reports/security
          destination: docker-security-baseline
      - persist_to_workspace:
          root: /tmp/bioetl-docker-baseline
          paths:
            - reports/security

  docker-publish:
    docker:
      - image: cimg/python:3.13
    resource_class: medium
    environment:
      CIRCLE_ORGANIZATION_ID: 116af377-246c-4269-b48e-63c2a8b9dd0e
      CIRCLE_PROJECT_ID: 9f037fd7-4fd9-41af-9916-33ca1e56cf7b
      PIPELINE_DEFINITION_ID: a2ed9130-99bb-5001-9dc8-b4d1b6fae071
      SCANNED_IMAGE_DIRECTORY: /tmp/bioetl-publication/reports/security
    steps:
      - checkout
