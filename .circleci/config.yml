          command: |
            timeout --signal=TERM --kill-after=30s 40m bash -euo pipefail \<<'REPLAY'
            [[ "$CIRCLE_BRANCH" == main ]]
            if git grep -q 'git-lfs.github.com/spec/v1' -- tests/fixtures/vcr; then
              echo 'LFS pointer cassette blocks full E2E replay' >&2
              exit 1
            fi
            mkdir -p reports/e2e
            uv run --frozen --no-build pytest tests/e2e \
              -m "e2e and not e2e_smoke and not benchmark and not memory" \
              --record-mode=none -p no:xdist -q --tb=short \
              --junitxml=reports/e2e/e2e-nightly-full.xml
            [[ -s reports/e2e/e2e-nightly-full.xml ]]
