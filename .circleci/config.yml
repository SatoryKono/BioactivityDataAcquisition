  rf023-proof-closeout:
    parameters:
      task-id:
        type: string
        default: architecture-coverage-11854-11899
    docker:
    - image: cimg/python:3.12-node
    resource_class: large
    steps:
    - checkout
    - setup-python-uv:
        extras: dev tracing docs tests tests_full export
    - run:
        name: Verify complete source history and current main base
        command: "export PATH=\"$PWD/.venv/bin:$HOME/.local/bin:$PATH\"\ngit fetch --no-tags origin main:refs/remotes/origin/main\n\
          if [ \"$(git rev-parse --is-shallow-repository)\" = true ]; then\n  git fetch --unshallow origin\nfi\npython\
          \ scripts/engineering/repo/check_no_partial_tree.py --base origin/main --tip HEAD\n"
    - run:
        name: Prepare the locked headless browser test runtime
        no_output_timeout: 20m
        command: |
          export PATH="$PWD/.venv/bin:$HOME/.local/bin:$PATH"
          command -v node && node --version
          command -v npm && npm --version
          export PLAYWRIGHT_BROWSERS_PATH=/tmp/rf023-playwright
          sudo apt-get update -qq
          bash scripts/ops/observability/grafana/setup_grafana_screenshot_runtime.sh --attempt-system-install
          python -c 'import json; from pathlib import Path; locked=json.loads(Path("package-lock.json").read_text())["packages"]["node_modules/playwright"]["version"]; actual=json.loads(Path("node_modules/playwright/package.json").read_text())["version"]; assert actual == locked, (actual, locked)'
          echo 'export PLAYWRIGHT_BROWSERS_PATH=/tmp/rf023-playwright' >> "$BASH_ENV"
    - run:
        name: Source-bound full coverage and Proof-or-Stop acceptance
        no_output_timeout: 30m
        command: |
          export PATH="$PWD/.venv/bin:$HOME/.local/bin:$PATH"
          export PYTHONPATH="$PWD/src" PYTHONUTF8=1
          export BIOETL_AI_MEMORY_MODE=off BIOETL_SKIP_PREFLIGHT=1 BIOETL_SKIP_SETUP_PLUGINS=1
          export OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 NUMEXPR_NUM_THREADS=1
          # Preserve resolved PATH; isolate child shell probes from CircleCI BASH_ENV.
          unset BASH_ENV PYTEST_ADDOPTS
          python - \<<'CLOSEOUT_PY'
          """Candidate embedded runner; execute only in a genuine CircleCI checkout."""
          from datetime import UTC, datetime
          from pathlib import Path
          import json
          import hashlib
          import os
          import subprocess
          import time
          import tempfile
          from xml.etree import ElementTree

          root = Path.cwd().resolve()
          head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          assert os.environ.get("CIRCLECI") == "true", "A local execution cannot emit CI receipts"
          assert os.environ.get("CIRCLE_SHA1") == head
          assert os.environ.get("CIRCLE_PROJECT_USERNAME") == "SatoryKono"
          assert os.environ.get("CIRCLE_PROJECT_REPONAME") == "BioactivityDataAcquisition"
          ci_id = os.environ["CIRCLE_BUILD_URL"]
          assert ci_id.startswith("https://") and os.environ["CIRCLE_WORKFLOW_ID"]
          run_id = "circleci-closeout-" + os.environ["CIRCLE_BUILD_NUM"] + "-" + head[:12]
          out = root / "reports/quality/proof-or-stop" / run_id
          out.mkdir(parents=True, exist_ok=False)
          secret_values = sorted({value for key, value in os.environ.items()
                                  if len(value) >= 8 and any(part in key.upper() for part in
                                  ("TOKEN", "PASSWORD", "SECRET", "API_KEY", "ACCESS_KEY"))}, key=len, reverse=True)

          def sanitize(path):
              original = path.read_text(encoding="utf-8", errors="replace")
              clean = original
              for value in secret_values:
                  clean = clean.replace(value, "[REDACTED_CI_SECRET]")
              if clean != original:
                  path.write_text(clean, encoding="utf-8")

          def execute(name, command):
              log = out / (name + ".log")
              started = datetime.now(UTC).isoformat()
              clock = time.monotonic()
              print("[closeout] start " + name, flush=True)
              with log.open("w", encoding="utf-8") as stream:
                  result = subprocess.Popen(command, stdout=stream, stderr=subprocess.STDOUT)
                  while True:
                      try:
                          result.wait(timeout=60)
                          break
                      except subprocess.TimeoutExpired:
                          print(f"[closeout] {name} running {int(time.monotonic() - clock)}s", flush=True)
              duration = round((time.monotonic() - clock) * 1000)
              sanitize(log)
              assert subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip() == head
              record = dict(command=command, cwd=str(root), started_at=started,
                            duration_ms=duration, exit_code=result.returncode,
                            head_before=head, head_after=head, log=str(log))
              (out / (name + ".record.json")).write_text(json.dumps(record, indent=2) + "\n", encoding="utf-8")
              print(f"[closeout] {name} exit={result.returncode}", flush=True)
              return record

          prefix = ["python", "-m", "scripts.engineering.qa", "proof-or-stop"]
          common = ["--run-id", run_id, "--task-id", "<< parameters.task-id >>",
                    "--claim", "ready_to_merge", "--ci-run-id", ci_id]
          assert execute("plan", prefix + ["plan", *common, "--output", str(out / "plan.json")])["exit_code"] == 0
          (out / "ci-identity.json").write_text(json.dumps({
              key: os.environ[key] for key in ("CIRCLE_SHA1", "CIRCLE_BUILD_URL", "CIRCLE_BUILD_NUM",
                                             "CIRCLE_WORKFLOW_ID", "CIRCLE_PROJECT_USERNAME",
                                             "CIRCLE_PROJECT_REPONAME", "CIRCLE_BRANCH")
          }, indent=2) + "\n", encoding="utf-8")
          coverage = out / "coverage"
          coverage_record = execute("coverage-17", ["python", "-m", "scripts.engineering.qa.run_local_coverage_verify",
                                                   "--scratch-dir", str(coverage)])
          for path in coverage.rglob("*"):
              if path.is_file() and path.suffix in {".log", ".xml", ".json"}:
                  sanitize(path)
          assert coverage_record["exit_code"] == 0, "Incomplete coverage cannot qualify closeout"
          manifest = json.loads((coverage / "manifest.json").read_text(encoding="utf-8"))
          assert manifest["complete"] is True and manifest["head"] == head
          assert len(manifest["required_shards"]) == len(manifest["shards"]) == 17
          assert {row["name"] for row in manifest["shards"]} == set(manifest["required_shards"])
          assert all(row["exit_code"] == 0 and row["junit_file"] and row["coverage_sha256"]
                     for row in manifest["shards"])
          assert hashlib.sha256((coverage / "coverage.xml").read_bytes()).hexdigest() == manifest["coverage_xml_sha256"]
          full_suite_tmp = Path(tempfile.mkdtemp(prefix=run_id + "-full-suite-"))
          checks = [
              ("full-suite", "test_health", ["python", "-m", "scripts.engineering.dev", "run-tests", "all",
                                              "--junitxml=" + str(out / "full-suite.xml"),
                                              "-p", "no:cacheprovider", "--basetemp=" + str(full_suite_tmp),
                                              "--vcr-record=none"]),
              ("tests", "test_health", ["python", "-m", "pytest", "tests/architecture", "-q", "--no-cov",
                                        "--junitxml=" + str(out / "architecture.xml")]),
              ("governance", "pretest_guardrails", ["bash", "scripts/engineering/dev/pretest_guardrails.sh",
                                                    "--mode", "check", "--scope", "governance", "--skip-cleanup",
                                                    "--report-json", str(out / "governance.json")]),
              ("docs_runtime", "docs_runtime_checks", ["python", "-m", "scripts.docs", "verify"]),
              ("debt", "debt_governance_gates", ["python", "-m", "scripts.engineering.qa",
                                                 "report-debt-governance-gates", "--check"]),
              ("quality", "quality_integral_gate", ["python", "-m", "scripts.engineering.ci.quality_integral_gate",
                                                    "--coverage-xml", str(coverage / "coverage.xml"),
                                                    "--output", str(out / "quality.json")]),
          ]
          receipts = []
          for kind, producer, command in checks:
              record = execute(kind, command)
              output_artifact = record["log"]
              if kind == "full-suite":
                  junit = out / "full-suite.xml"
                  if junit.is_file():
                      sanitize(junit)
                      record["junit"] = str(junit)
                      record["junit_sha256"] = hashlib.sha256(junit.read_bytes()).hexdigest()
                  if record["exit_code"] == 0:
                      cases = list(ElementTree.parse(junit).getroot().iter("testcase"))
                      assert cases and all(case.find("failure") is None and case.find("error") is None for case in cases), "Full-suite JUnit is incomplete or failed"
                  record["log_sha256"] = hashlib.sha256(Path(record["log"]).read_bytes()).hexdigest()
                  output_artifact = str(out / (kind + ".record.json"))
                  Path(output_artifact).write_text(json.dumps(record, indent=2) + "\n", encoding="utf-8")
              evidence_kind = "tests" if kind == "full-suite" else kind
              receipt = out / "receipts" / (kind + ".json")
              arguments = ["receipt", *common, "--receipt-id", kind, "--producer", producer,
                           "--evidence-kind", evidence_kind, "--command", " ".join(command),
                           "--cwd", str(root), "--started-at", record["started_at"],
                           "--duration-ms", str(record["duration_ms"]), "--exit-code", str(record["exit_code"]),
                           "--status", "pass" if record["exit_code"] == 0 else "fail",
                           "--output-artifact", output_artifact, "--trust-tier", "ci", "--output", str(receipt)]
              arguments.extend("--argv=" + arg for arg in command)
              assert execute("receipt-" + kind, prefix + arguments)["exit_code"] == 0
              receipts.extend(["--receipt", str(receipt)])
          assert execute("assemble", prefix + ["assemble", *common, "--actor", "circleci",
                                               "--runtime", "ci", "--trust-tier", "ci", *receipts,
                                               "--output", str(out / "bundle.json")])["exit_code"] == 0
          verification = execute("verify", prefix + ["verify", "--bundle", str(out / "bundle.json"),
                                                     "--output", str(out / "verification.json")])
          raise SystemExit(verification["exit_code"] or coverage_record["exit_code"])
          CLOSEOUT_PY

    - run:
        name: Export telemetry candidate from the complete producer
        when: always
        command: |
          set -euo pipefail
          export PATH="$PWD/.venv/bin:$HOME/.local/bin:$PATH"
          export PYTHONPATH="$PWD/src" PYTHONUTF8=1
          ROOT="reports/quality/proof-or-stop/circleci-closeout-${CIRCLE_BUILD_NUM}-${CIRCLE_SHA1:0:12}"
          # Canonical validation rejects failed, partial, stale or substituted evidence.
          python -m scripts.engineering.ci.update_test_telemetry_baseline --local-manifest "$ROOT/coverage/manifest.json"
          mkdir -p "$ROOT/telemetry/configs/quality" "$ROOT/telemetry/docs/05-engineering" "$ROOT/telemetry/reports"
          cp configs/quality/test_telemetry_baseline.yaml "$ROOT/telemetry/configs/quality/"
          cp docs/05-engineering/test-telemetry-baseline.md "$ROOT/telemetry/docs/05-engineering/"
          cp -R reports/test-telemetry "$ROOT/telemetry/reports/"
    - run:
        name: Publish bounded sanitized execution evidence
        when: always
        command: "python - \\<<'ARTIFACT_PY'\nfrom pathlib import Path\nimport os\nimport shutil\nfrom xml.etree import\
          \ ElementTree as ET\n\nroot = Path(\"reports/quality/proof-or-stop\")\nname = \"circleci-closeout-\" + os.environ[\"\
          CIRCLE_BUILD_NUM\"] + \"-\" + os.environ[\"CIRCLE_SHA1\"][:12]\nsource = root / name\ndestination = root\
          \ / \"circleci-artifacts\"\nsecrets = sorted({value for key, value in os.environ.items() if len(value) >=\
          \ 8 and\n                  any(part in key.upper() for part in (\"TOKEN\", \"PASSWORD\", \"SECRET\", \"\
          API_KEY\", \"ACCESS_KEY\"))}, key=len, reverse=True)\nfor path in source.rglob(\"*\"):\n    relative = path.relative_to(source)\n\
          \    if path.is_symlink() or not path.is_file() or path.suffix not in {\".json\", \".xml\", \".log\"}:\n\
          \        continue\n    if any(part in {\"pycache\", \"hypothesis\", \"shards\", \"combined\"} for part in\
          \ relative.parts):\n        continue\n    text = path.read_text(encoding=\"utf-8\", errors=\"replace\")\n\
          \    for value in secrets:\n        text = text.replace(value, \"[REDACTED_CI_SECRET]\")\n    target = destination\
          \ / \"evidence\" / name / relative\n    target.parent.mkdir(parents=True, exist_ok=True)\n    target.write_text(text,\
          \ encoding=\"utf-8\")\n    junit_root = None\n    if path.suffix == \".xml\":\n        try:\n          \
          \  junit_root = ET.fromstring(text).tag\n        except ET.ParseError:\n            print(\"Retained incomplete\
          \ XML as diagnostics:\", relative)\n    if junit_root in {\"testsuites\", \"testsuite\"}:\n        junit\
          \ = destination / \"junit\" / relative\n        junit.parent.mkdir(parents=True, exist_ok=True)\n      \
          \  shutil.copyfile(target, junit)\nprint(\"Published actual JSON/XML/log evidence; raw coverage SQLite and\
          \ caches remain on the CI host\")\nARTIFACT_PY\n"
    - run:
        name: Collect validated telemetry proposal
        when: always
        command: |
          ROOT="reports/quality/proof-or-stop/circleci-closeout-${CIRCLE_BUILD_NUM}-${CIRCLE_SHA1:0:12}"
          if [ -d "$ROOT/telemetry" ]; then
            cp -R "$ROOT/telemetry" reports/quality/proof-or-stop/telemetry-candidate
          fi
    - store_artifacts:
        path: reports/quality/proof-or-stop/telemetry-candidate
        destination: telemetry-candidate
