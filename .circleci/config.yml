  mutation-testing:
    parameters:
      target:
        type: string
      source-path:
        type: string
      tests-dir:
        type: string
      threshold:
        type: string
      executor-size:
        type: enum
        enum: [medium, large]
        default: medium
      max-children:
        type: integer
        default: 1
    docker:
    - image: cimg/python:3.13
    resource_class: << parameters.executor-size >>
    environment:
      OPENBLAS_NUM_THREADS: '1'
      POLARS_MAX_THREADS: '2'
    steps:
    - checkout
    - setup-python-uv:
        python-version: '3.13'
        extras: dev
    - run:
        name: Configure mutation target
        command: |
          export WORKSPACE_ROOT="$PWD"
          export PYTHONPATH="$PWD/src:$PWD${PYTHONPATH:+:$PYTHONPATH}"
          uv run --frozen --no-build python - \<<'PY'
          import os
          from pathlib import Path

          import tomlkit

          path = Path("pyproject.toml")
          document = tomlkit.parse(path.read_text(encoding="utf-8"))
          config = document["tool"]["mutmut"]
          # mutmut 3.x reads paths_to_mutate (source_paths is ignored).
          config["paths_to_mutate"] = [os.environ["MUTMUT_SOURCE_PATH"]]
          if "source_paths" in config:
              del config["source_paths"]
          # Subset mutation still needs the full package + tooling imports.
          config["also_copy"] = [
              "src/bioetl",
              "scripts",
              "configs",
          ]
          config["pytest_add_cli_args_test_selection"] = [
              os.environ["MUTMUT_TESTS_DIR"]
          ]
          path.write_text(tomlkit.dumps(document), encoding="utf-8")
          PY
        environment:
          MUTMUT_SOURCE_PATH: << parameters.source-path >>
          MUTMUT_TESTS_DIR: << parameters.tests-dir >>
    - run:
        name: Run mutation testing
        command: |-
          timeout --signal=TERM --kill-after=30s 60m bash -euo pipefail -c 'export WORKSPACE_ROOT="$PWD"
          export PYTHONPATH="$PWD/src:$PWD${PYTHONPATH:+:$PYTHONPATH}"
          set -euo pipefail
          echo "Running mutation testing for << parameters.target >>..."
          # mutmut is a dev dependency; invoke via uv so PATH/venv entrypoints resolve
          # under the frozen CI environment (bare `mutmut` is not on runner PATH).
          export PYTHONPATH="${WORKSPACE_ROOT}/src:${WORKSPACE_ROOT}${PYTHONPATH:+:$PYTHONPATH}"
          uv run --frozen --no-build python -c "import bioetl.domain, scripts; print('"'"'mutation import preflight ok'"'"')"
          # Bound fork concurrency explicitly; host CPU count is not the executor quota.
          uv run --frozen --no-build mutmut run --max-children << parameters.max-children >>
          '
        no_output_timeout: 65m
    - run:
        name: Generate mutation report
        when: always
        command: |
          export WORKSPACE_ROOT="$PWD"
          export PYTHONPATH="$PWD/src:$PWD${PYTHONPATH:+:$PYTHONPATH}"
          mkdir -p "reports/<< parameters.target >>"
          uv run --frozen --no-build mutmut results > "reports/<< parameters.target >>/mutmut_results.txt"
          uv run --frozen --no-build mutmut export-cicd-stats
          if [ -f mutants/mutmut-cicd-stats.json ]; then
            cp mutants/mutmut-cicd-stats.json \
              "reports/<< parameters.target >>/mutmut-cicd-stats.json"
          else
            echo "Mutation stats missing after run; treating as setup/runtime failure." >&2
            exit 1
          fi
          # mutmut 3.x no longer ships a stable `html` CLI command on all installs.
          # Prefer HTML when available; never fail the report step on its absence.
          if uv run --frozen --no-build mutmut --help 2>/dev/null | grep -Eq '(^|[[:space:]])html([[:space:]]|$)'; then
            uv run --frozen --no-build mutmut html || true
          fi
          if [ -d "html" ]; then
            mv html "reports/<< parameters.target >>/mutmut_html"
          fi
    - run:
        name: Check mutation score threshold
        command: |
          export WORKSPACE_ROOT="$PWD"
          export PYTHONPATH="$PWD/src:$PWD${PYTHONPATH:+:$PYTHONPATH}"
          python - \<<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          target = os.environ["MUTATION_TARGET"]
          stats_path = Path("reports") / target / "mutmut-cicd-stats.json"
          if not stats_path.is_file():
              print(
                  f"mutmut CI/CD stats are missing for {target}; "
                  "treating this as a broken gate."
              )
              sys.exit(1)

          stats = json.loads(stats_path.read_text(encoding="utf-8"))
          try:
              killed = int(stats["killed"])
              survived = int(stats["survived"])
              timeout = int(stats["timeout"])
          except (KeyError, TypeError, ValueError) as exc:
              print(
                  f"Invalid mutmut CI/CD stats for {target}; "
                  f"treating this as a broken gate: {exc}"
              )
              print(json.dumps(stats, sort_keys=True))
              sys.exit(1)

          total = killed + survived + timeout
          if total <= 0 or min(killed, survived, timeout) < 0:
              print("Mutation workflow produced zero mutants; treating this as a broken gate.")
              sys.exit(1)

          score = (killed + timeout) / total * 100
          print(f"Mutation Score: {score:.1f}%")
          print(f"  Killed: {killed}")
          print(f"  Survived: {survived}")
          print(f"  Timeout: {timeout}")
          print(f"  Total: {total}")

          threshold = float(os.environ["MUTATION_SCORE_THRESHOLD"])
          if score < threshold:
              print(f"\n⚠️  Mutation score {score:.1f}% is below threshold {threshold}%")
              print("Consider improving test coverage for the surviving mutants")
              sys.exit(1)
          else:
              print(f"\n✅ Mutation score {score:.1f}% meets threshold {threshold}%")
          PY
        environment:
          MUTATION_TARGET: << parameters.target >>
          MUTATION_SCORE_THRESHOLD: << parameters.threshold >>
    - store_artifacts:
        path: reports/<< parameters.target >>
        destination: mutation/<< parameters.target >>
  replay-parity:
    docker:
      - image: cimg/python:3.13
    resource_class: small
    environment:
      BIOETL_TEST_MODE: "true"
      BIOETL_PIPELINE__HEALTH_CHECK_MODE: probe
      OPENBLAS_NUM_THREADS: "1"
      POLARS_MAX_THREADS: "2"
    steps:
      - checkout
      - setup-python-uv:
          python-version: "3.13"
      - run:
          name: Sync replay dependencies
          command: uv sync --frozen --all-extras --dev
      - run:
          name: Verify replay matrix including independent determinism recheck
          no_output_timeout: 65m
          command: |
            timeout --signal=TERM --kill-after=30s 60m bash -euo pipefail -c 'export PATH="$HOME/.local/bin:$PATH"
            mkdir -p reports/nightly-replay
            mkdir -p .artifacts/nightly-replay/{determinism,idempotency,composite_resume}
            uv run --frozen --no-build pytest tests/integration/determinism -q \
              -p scripts.engineering.ci.replay_parity_inputs \
              --junitxml=reports/nightly-replay/determinism.xml \
              --basetemp .artifacts/nightly-replay/determinism/work
            cp -a .artifacts/nightly-replay/determinism/work .artifacts/nightly-replay/determinism/run1
            uv run --frozen --no-build pytest tests/integration/idempotency -q \
              --junitxml=reports/nightly-replay/idempotency.xml \
              --basetemp .artifacts/nightly-replay/idempotency/run1
            uv run --frozen --no-build pytest tests/integration/composite_resume -q \
              --junitxml=reports/nightly-replay/composite_resume.xml \
              --basetemp .artifacts/nightly-replay/composite_resume/run1
            uv run --frozen --no-build pytest tests/integration/determinism -q \
              -p scripts.engineering.ci.replay_parity_inputs \
              --junitxml=reports/nightly-replay/determinism-recheck.xml \
              --basetemp .artifacts/nightly-replay/determinism/work
            cp -a .artifacts/nightly-replay/determinism/work .artifacts/nightly-replay/determinism/run2
            '
      - run:
          name: Compare nonempty replay checksum inventories
          command: |
            WORKSPACE_ROOT="$PWD"
            find .artifacts/nightly-replay/determinism/run1 -type f -print -quit | grep -q .
            find .artifacts/nightly-replay/determinism/run2 -type f -print -quit | grep -q .
            mkdir -p reports/nightly-replay/checksums
            find .artifacts/nightly-replay/determinism -type f | sort | xargs sha256sum > reports/nightly-replay/checksums/determinism.sha256
            find .artifacts/nightly-replay/idempotency -type f | sort | xargs sha256sum > reports/nightly-replay/checksums/idempotency.sha256
            find .artifacts/nightly-replay/composite_resume -type f | sort | xargs sha256sum > reports/nightly-replay/checksums/composite_resume.sha256
            (
              cd .artifacts/nightly-replay/determinism/run1
              find . -type f -print0 | sort -z | xargs -0 sha256sum
            ) > "$WORKSPACE_ROOT/reports/nightly-replay/checksums/determinism-run1.sha256"
            (
              cd .artifacts/nightly-replay/determinism/run2
              find . -type f -print0 | sort -z | xargs -0 sha256sum
            ) > "$WORKSPACE_ROOT/reports/nightly-replay/checksums/determinism-run2.sha256"
            diff -u reports/nightly-replay/checksums/determinism-run1.sha256 reports/nightly-replay/checksums/determinism-run2.sha256 > reports/nightly-replay/checksums/determinism-replay-diff.txt
      - store_test_results:
          path: reports/nightly-replay
      - store_artifacts:
          path: reports/nightly-replay

  memory-freshness:
    docker:
      - image: cimg/python:3.13
    resource_class: small
    steps:
      - checkout
      - setup-python-uv:
          python-version: "3.13"
      - run:
          name: Check repository memory freshness without notification writes
          command: |
            mkdir -p reports/memory
            uv run --frozen --no-build python -m memory.tooling.check_freshness --json > reports/memory/freshness.json
      - run:
