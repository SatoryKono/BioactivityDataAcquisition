# CircleCI config v2 â€” PR gates port (phase 2, 03.10.2026)
# Repo: SatoryKono/BioactivityDataAcquisition
# Mirrors .github/workflows/pr-required.yml: the `classify` job runs the repo's own
# decision-matrix classifier (scripts/engineering/ci pr-gate classify); each gate job
# reads the matrix from the workspace and halts early when not_applicable.
# Gate ownership and applicability come from the canonical catalog (docker,
# generated-artifacts, commit-governance, docs-governance).
# CodeQL is excluded from required checks (#11929); optional analysis is separate.
# Remaining migration decisions: dependency-review, labeler, stale.
# Deploy: replace .circleci/config.yml at repo root, commit, push.
version: 2.1

parameters:
  ci-lane:
    type: enum
    enum: [pr-gate, docs-kpi, memory-retention, port-contracts, skills-consistency, github-settings-review, performance, replay-parity, memory-freshness, mutation, consolidation, branch-hygiene, architecture-docs, provider-contract-drift, semantic-governance, e2e-replay, coverage-closeout, docker-baseline, docker-publish, architecture-metrics, scorecard, scorecard-publish, release-validation, router-bridge]
    default: pr-gate
  include-hypothesis:
    type: boolean
    default: true

  run-heavy:
    type: boolean
    default: false
  run-live:
    type: boolean
    default: false
  approve-runtime-sync:
    type: boolean
    default: false

commands:
  # Port of .github/actions/setup-python-uv (uv 0.11.26, uv cache, uv sync).
  setup-python-uv:
    description: "Install uv, restore cache, sync deps (port of GH composite action)"
    parameters:
      python-version:
        type: string
        default: "3.12"
      extras:
        type: string
        default: "dev tracing"
    steps:
      - run:
          name: Install uv 0.11.26
          command: |
            set -euo pipefail
            test "$(uname -m)" = x86_64
            archive="$(mktemp)"
            extracted="$(mktemp -d)"
            trap 'rm -f "$archive"; rm -rf "$extracted"' EXIT
            curl --fail --location --retry 3 \
              https://github.com/astral-sh/uv/releases/download/0.11.26/uv-x86_64-unknown-linux-gnu.tar.gz \
              --output "$archive"
            printf '%s  %s\n' 6426a73c3837e6e2483ee344cbc00f36394d179afcba6183cb77437e67db4af0 "$archive" | sha256sum --check -
            tar -xzf "$archive" -C "$extracted"
            mkdir -p "$HOME/.local/bin"
            install -m 0755 "$extracted/uv-x86_64-unknown-linux-gnu/uv" "$HOME/.local/bin/uv"
            install -m 0755 "$extracted/uv-x86_64-unknown-linux-gnu/uvx" "$HOME/.local/bin/uvx"
            echo 'export PATH="$HOME/.local/bin:$PATH"' >> "$BASH_ENV"
            echo 'export UV_PYTHON="<< parameters.python-version >>"' >> "$BASH_ENV"
            "$HOME/.local/bin/uv" --version
      - restore_cache:
          name: Restore uv cache
          keys:
            - uv-v1-{{ checksum "uv.lock" }}-py<< parameters.python-version >>
      - run:
          name: Sync dependencies
          command: |
            export PATH="$HOME/.local/bin:$PATH"
            export UV_CACHE_DIR="$HOME/.cache/uv"
            CMD="uv sync --frozen"
            for extra in << parameters.extras >>; do CMD="$CMD --extra $extra"; done
            echo "Running: $CMD"
            $CMD
            # Keep the exact extras/environment produced by the successful frozen sync.
            export UV_NO_SYNC=1
            echo 'export UV_NO_SYNC=1' >> "$BASH_ENV"
            uv run --frozen --no-build python -c 'import os, sys; actual = ".".join(map(str, sys.version_info[:2])); expected = os.environ["UV_PYTHON"]; assert actual == expected, f"Python mismatch: {actual} != {expected}"; print(f"Python {actual} matches requested runtime")'
      - save_cache:
          name: Save uv cache
          key: uv-v1-{{ checksum "uv.lock" }}-py<< parameters.python-version >>
          paths:
            - ~/.cache/uv

  # Reads the decision matrix produced by `classify`; ends the job as success
  # without running the gate when the catalog says not_applicable.
  check-gate:
    description: "Halt job early when the gate decision is not_applicable"
    parameters:
      gate:
        type: string
    steps:
      - attach_workspace:
          at: /tmp/cci-ws
      - run:
          name: Check gate decision (<< parameters.gate >>)
          command: |
            export PATH="$PWD/.venv/bin:$HOME/.local/bin:$PATH"
            if [ "<< parameters.gate >>" = "docs-governance" ] && PYTHONPATH=src python -m scripts.engineering.qa proof-or-stop ci enabled; then
              exit 0
            fi
            DECISION=$(python3 -c "import json; print(json.load(open('/tmp/cci-ws/pr-gate-decisions.json'))['decisions']['<< parameters.gate >>']['decision'])")
            echo "gate << parameters.gate >> decision: $DECISION"
            if [ "$DECISION" != "required" ]; then
              echo "Gate not applicable for this change set â€” skipping."
              circleci-agent step halt
            fi

  check-router-event:
    parameters:
      event-mode:
        type: boolean
        default: false
    steps:
    - run:
        name: Apply Router event paths or enforce manual main boundary
        command: |
          set -euo pipefail
          if ! << parameters.event-mode >>; then
            [[ "$CIRCLE_BRANCH" == main ]]
            exit 0
          fi
          if [ "$(git rev-parse --is-shallow-repository)" = true ]; then git fetch --unshallow --filter=blob:none --no-tags; fi
          base=HEAD~1
          if [ -n "${CIRCLE_PULL_REQUEST:-${CIRCLE_PULL_REQUESTS:-}}" ]; then
            python3 - \<<'PY'
          import json, os, re, urllib.request
          from pathlib import Path
          url = os.environ.get('CIRCLE_PULL_REQUEST') or os.environ['CIRCLE_PULL_REQUESTS'].split(',')[0]
          match = re.fullmatch(r'https://github.com/SatoryKono/BioactivityDataAcquisition/pull/([0-9]+)', url)
          assert match, 'Unexpected PR URL'
          with urllib.request.urlopen('https://api.github.com/repos/SatoryKono/BioactivityDataAcquisition/pulls/' + match[1], timeout=30) as response:
              pr = json.load(response)
          assert pr['head']['sha'] == os.environ['CIRCLE_SHA1'], 'Stale PR head'
          assert pr['base']['ref'] in {'main', 'develop'}, 'Unsupported base branch'
          Path('/tmp/router-ci-base').write_text(pr['base']['ref'])
          PY
            base_ref="$(cat /tmp/router-ci-base)"
            git fetch --no-tags origin "$base_ref"
            base="origin/$base_ref"
          elif [ "$CIRCLE_BRANCH" != main ]; then
            circleci-agent step halt
            exit 0
          fi
          mkdir -p reports/qa/router-v7-circleci
          git diff --name-only "$base"...HEAD -- 'grafana/tooling/router-v7-bridge/**' 'grafana/plugins/bioetl-scenes-app/**' 'grafana/plugins/bioetl-selectorshell-panel/**' '.github/workflows/router-v7-bridge.yml' '.circleci/config.yml' 'scripts/ops/observability/grafana/router_rootfs.py' 'scripts/ops/observability/grafana/router_managed_image.py' 'scripts/ops/__main__.py' 'tests/unit/scripts/ops/test_router_rootfs.py' 'tests/unit/scripts/ops/test_router_managed_image.py' > reports/qa/router-v7-circleci/event-changes.txt
          printf '%s\n' "$CIRCLE_SHA1" > reports/qa/router-v7-circleci/source-sha.txt
          if [ ! -s reports/qa/router-v7-circleci/event-changes.txt ]; then circleci-agent step halt; fi

  # pr-gate only. A dedicated ci-lane keeps the full body for a manual run.
  halt-unless-pr-gate-paths:
    description: "On ci-lane=pr-gate, halt when the diff misses these paths"
    parameters:
      label:
        type: string
      pathspecs:
        type: string
    steps:
    - run:
        name: Halt unless << parameters.label >> paths changed
        environment:
          BIOETL_HALT_PATHSPECS: << parameters.pathspecs >>
        command: |
          set -euo pipefail
          if [ "<< pipeline.parameters.ci-lane >>" != "pr-gate" ]; then
            echo "ci-lane=<< pipeline.parameters.ci-lane >> keeps the full body"
            exit 0
          fi
          if [ "$(git rev-parse --is-shallow-repository)" = true ]; then git fetch --unshallow --filter=blob:none --no-tags; fi
          base=HEAD~1
          if [ -n "${CIRCLE_PULL_REQUEST:-${CIRCLE_PULL_REQUESTS:-}}" ]; then
            python3 - \<<'PY'
          import json, os, re, urllib.request
          from pathlib import Path
          url = os.environ.get('CIRCLE_PULL_REQUEST') or os.environ['CIRCLE_PULL_REQUESTS'].split(',')[0]
          match = re.fullmatch(r'https://github.com/SatoryKono/BioactivityDataAcquisition/pull/([0-9]+)', url)
          assert match, 'Unexpected PR URL'
          with urllib.request.urlopen('https://api.github.com/repos/SatoryKono/BioactivityDataAcquisition/pulls/' + match[1], timeout=30) as response:
              pr = json.load(response)
          assert pr['head']['sha'] == os.environ['CIRCLE_SHA1'], 'Stale PR head'
          assert pr['base']['ref'] in {'main', 'develop'}, 'Unsupported base branch'
          Path('/tmp/cci-path-halt-base').write_text(pr['base']['ref'])
          PY
            base_ref="$(cat /tmp/cci-path-halt-base)"
            git fetch --no-tags origin "$base_ref"
            base="origin/$base_ref"
          fi
          mkdir -p /tmp/cci-path-halt
          printf "%s\n" "$BIOETL_HALT_PATHSPECS" | tr " " "\n" > /tmp/cci-path-halt/args
          mapfile -t pathspec_args < /tmp/cci-path-halt/args
          if [ "${#pathspec_args[@]}" -eq 0 ]; then
            echo "halt pathspecs are empty" >&2
            exit 1
          fi
          git diff --name-only "$base"...HEAD -- "${pathspec_args[@]}" > /tmp/cci-path-halt/changed.txt
          if [ ! -s /tmp/cci-path-halt/changed.txt ]; then
            echo "No << parameters.label >> paths in $base...HEAD; skipping the long body."
            circleci-agent step halt
          fi
          echo "Matching << parameters.label >> paths:"
          cat /tmp/cci-path-halt/changed.txt

jobs:
  router-bridge-tests:
    docker:
    - image: cimg/node:24.21.0@sha256:2944a8d6bea9d71395f670ee689ca63a02b34a846ad9a5d617d21eefe57a9209
    resource_class: medium
    steps:
    - checkout
    - check-router-event:
        event-mode: << parameters.event-mode >>
    - run:
        name: Verify Router bridge behavior, types, build and dependency audit
        no_output_timeout: 11m
        command: |
          set -euo pipefail
          mkdir -p reports/qa/router-v7-circleci
          cat > /tmp/bridge-tests.sh \<<'BIOETL_ROUTER_SCRIPT'
          set -euo pipefail
          export BIOETL_WORKSPACE="$PWD"
          [[ "$(node -p 'process.versions.node.split(".")[0]')" == 24 ]]
          python3 --version
          (
          cd "$BIOETL_WORKSPACE/grafana/tooling/router-v7-bridge"
          npm ci --ignore-scripts
          )
          (
          cd "$BIOETL_WORKSPACE/grafana/tooling/router-v7-bridge"
          node verify-packed-bridge.mjs
          )
          (
          cd "$BIOETL_WORKSPACE/grafana/tooling/router-v7-bridge"
          npm test
          )
          (
          cd "$BIOETL_WORKSPACE/grafana/tooling/router-v7-bridge"
          node --test runtime-probe/module.test.mjs
          )
          (
          cd "$BIOETL_WORKSPACE/grafana/tooling/router-v7-bridge"
          node --test verify-host-image.test.mjs
          )
          (
          cd "$BIOETL_WORKSPACE/grafana/tooling/router-v7-bridge"
          PYTHONPATH=../../.. /usr/bin/python3 ../../../tests/unit/scripts/ops/test_router_rootfs.py
          PYTHONPATH=../../.. /usr/bin/python3 ../../../tests/unit/scripts/ops/test_router_managed_image.py
          )
          (
          cd "$BIOETL_WORKSPACE/grafana/tooling/router-v7-bridge"
          npm run typecheck
          )
          (
          cd "$BIOETL_WORKSPACE/grafana/tooling/router-v7-bridge"
          npm run build
          )
          (
          cd "$BIOETL_WORKSPACE/grafana/tooling/router-v7-bridge"
          npm audit --audit-level=moderate
          )
          BIOETL_ROUTER_SCRIPT
          timeout --signal=TERM --kill-after=30s 10m bash /tmp/bridge-tests.sh 2>&1 | tee reports/qa/router-v7-circleci/bridge-tests.log
    - store_artifacts:
        path: reports/qa/router-v7-circleci
        destination: router-v7-bridge
    parameters:
      event-mode:
        type: boolean
        default: false
  router-plugin-tests:
    parameters:
      plugin:
        type: enum
        enum:
        - bioetl-scenes-app
        - bioetl-selectorshell-panel
      event-mode:
        type: boolean
        default: false
    docker:
    - image: cimg/node:24.21.0@sha256:2944a8d6bea9d71395f670ee689ca63a02b34a846ad9a5d617d21eefe57a9209
    resource_class: medium
    environment:
      BIOETL_PLUGIN: << parameters.plugin >>
    steps:
    - checkout
    - check-router-event:
        event-mode: << parameters.event-mode >>
    - run:
        name: Verify plugin and transfer SHA-256 checked build
        no_output_timeout: 16m
        command: |
          set -euo pipefail
          mkdir -p reports/qa/router-v7-circleci
          cat > /tmp/plugin-tests.sh \<<'BIOETL_ROUTER_SCRIPT'
          set -euo pipefail
          export BIOETL_WORKSPACE="$PWD"
          [[ "$(node -p 'process.versions.node.split(".")[0]')" == 24 ]]
          python3 --version
          (
          cd "$BIOETL_WORKSPACE/grafana/plugins/$BIOETL_PLUGIN"
          npm ci --ignore-scripts
          )
          (
          cd "$BIOETL_WORKSPACE/grafana/plugins/$BIOETL_PLUGIN"
          npm audit --audit-level=moderate
          )
          (
          cd "$BIOETL_WORKSPACE/grafana/plugins/$BIOETL_PLUGIN"
          npm run typecheck
          )
          (
          cd "$BIOETL_WORKSPACE/grafana/plugins/$BIOETL_PLUGIN"
          npm run lint
          )
          (
          cd "$BIOETL_WORKSPACE/grafana/plugins/$BIOETL_PLUGIN"
          npm run test:ci
          )
          (
          cd "$BIOETL_WORKSPACE/grafana/plugins/$BIOETL_PLUGIN"
          npm run build
          )
          (
          cd "$BIOETL_WORKSPACE/grafana/plugins/$BIOETL_PLUGIN"
          python3 - \<<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["BIOETL_WORKSPACE"])
          plugin = os.environ["BIOETL_PLUGIN"]
          assert plugin in ("bioetl-scenes-app", "bioetl-selectorshell-panel"), plugin
          manifest = json.loads((root / "grafana/tooling/router-v7-bridge/host-image.json").read_text())
          for filename in ("module.js", "plugin.json"):
              relative = f"grafana/plugins/{plugin}/dist/{filename}"
              bundle = root / relative
              assert bundle.is_file(), f"Missing built artifact: {relative}"
              expected = manifest["artifact_sha256"][relative]
              actual = hashlib.sha256(bundle.read_bytes()).hexdigest()
              assert actual == expected, f"Artifact SHA-256 mismatch: {relative}: {actual} != {expected}"
              print(f"Verified {relative}: {actual}")
          metadata = json.loads((root / f"grafana/plugins/{plugin}/dist/plugin.json").read_text())
          assert metadata["info"]["updated"] == manifest["plugin_release_date"]
          PY
          )
          mkdir -p "/tmp/router-v7-ws/router-v7-image-context/$BIOETL_PLUGIN"
          cp -a "grafana/plugins/$BIOETL_PLUGIN/dist/." "/tmp/router-v7-ws/router-v7-image-context/$BIOETL_PLUGIN/"
          BIOETL_ROUTER_SCRIPT
          timeout --signal=TERM --kill-after=30s 15m bash /tmp/plugin-tests.sh 2>&1 | tee reports/qa/router-v7-circleci/plugin-tests.log
    - persist_to_workspace:
        root: /tmp/router-v7-ws
        paths:
        - router-v7-image-context/<< parameters.plugin >>
    - store_artifacts:
        path: reports/qa/router-v7-circleci
        destination: router-v7-<< parameters.plugin >>
    - store_artifacts:
        path: grafana/plugins/<< parameters.plugin >>/dist
        destination: host-plugin-<< parameters.plugin >>
  router-host-build:
    docker:
    - image: cimg/node:24.21.0@sha256:2944a8d6bea9d71395f670ee689ca63a02b34a846ad9a5d617d21eefe57a9209
    resource_class: large
    environment:
      NODE_OPTIONS: --max-old-space-size=4096
      GOMAXPROCS: '2'
      NODE_ENV: production
      NO_SOURCEMAP: '0'
    steps:
    - checkout
    - check-router-event:
        event-mode: << parameters.event-mode >>
    - attach_workspace:
        at: /tmp/router-v7-ws
    - setup_remote_docker:
        version: default
    - run:
        name: Build pinned Grafana candidate and verify image parity
        no_output_timeout: 46m
        command: |
          set -euo pipefail
          mkdir -p reports/qa/router-v7-circleci
          cat > /tmp/host-build.sh \<<'BIOETL_ROUTER_SCRIPT'
          set -euo pipefail
          export BIOETL_WORKSPACE="$PWD"
          [[ "$(node -p 'process.versions.node.split(".")[0]')" == 24 ]]
          python3 --version
          mkdir -p reports/qa/router-v7-grafana-host reports/qa/router-v7-image-context
          cp -a /tmp/router-v7-ws/router-v7-image-context/. reports/qa/router-v7-image-context/
          git -C reports/qa/router-v7-grafana-host init
          git -C reports/qa/router-v7-grafana-host remote add origin https://github.com/grafana/grafana.git
          git -C reports/qa/router-v7-grafana-host -c core.autocrlf=false fetch --depth=1 origin 6193dc03311b631b9727b560d24369e683dc396e
          git -C reports/qa/router-v7-grafana-host -c core.autocrlf=false checkout --detach FETCH_HEAD
          [[ "$(git -C reports/qa/router-v7-grafana-host rev-parse HEAD)" == 6193dc03311b631b9727b560d24369e683dc396e ]]
          (
          cd "$BIOETL_WORKSPACE/reports/qa/router-v7-grafana-host"
          git -c core.autocrlf=false apply --check "$BIOETL_WORKSPACE/grafana/tooling/router-v7-bridge/grafana-v13.2.3.patch"
          git -c core.autocrlf=false apply "$BIOETL_WORKSPACE/grafana/tooling/router-v7-bridge/grafana-v13.2.3.patch"
          git -c core.autocrlf=false apply --check "$BIOETL_WORKSPACE/grafana/tooling/router-v7-bridge/grafana-canvas-query-error.patch"
          git -c core.autocrlf=false apply "$BIOETL_WORKSPACE/grafana/tooling/router-v7-bridge/grafana-canvas-query-error.patch"
          git -c core.autocrlf=false apply --check "$BIOETL_WORKSPACE/grafana/tooling/router-v7-bridge/grafana-router-jest-esm.patch"
          git -c core.autocrlf=false apply "$BIOETL_WORKSPACE/grafana/tooling/router-v7-bridge/grafana-router-jest-esm.patch"
          cmp packages/bioetl-router-v7-bridge/index.mjs "$BIOETL_WORKSPACE/grafana/tooling/router-v7-bridge/index.mjs"
          cmp packages/bioetl-router-v7-bridge/index.d.ts "$BIOETL_WORKSPACE/grafana/tooling/router-v7-bridge/index.d.ts"
          )
          (
          cd "$BIOETL_WORKSPACE/reports/qa/router-v7-grafana-host"
          grep -F "'react-dom/client': () => import('react-dom/client')" public/app/features/plugins/loader/sharedDependencies.ts
          )
          (
          cd "$BIOETL_WORKSPACE/reports/qa/router-v7-grafana-host"
          node .yarn/releases/yarn-4.17.1.cjs install --immutable --mode=skip-build
          )
          (
          cd "$BIOETL_WORKSPACE/reports/qa/router-v7-grafana-host"
          export NODE_ENV=test
          node node_modules/jest/bin/jest.js public/app/plugins/panel/canvas/CanvasPanel.integration.test.tsx --runInBand --watch=false --testNamePattern="query error"
          )
          (
          cd "$BIOETL_WORKSPACE/reports/qa/router-v7-grafana-host"
          cat > scripts/webpack/webpack.router-security.mjs \<<'EOF'
          import original from './webpack.prod.ts';
          export default (env = {}) => {
            const configs = original(env);
            configs.parallelism = 1;
            for (const config of configs) {
              config.parallelism = 2;
              for (const plugin of config.optimization?.minimizer ?? []) {
                if (plugin.constructor.name === 'CssMinimizerPlugin') plugin.options.parallel = 1;
              }
            }
            return configs;
          };
          EOF
          node node_modules/webpack-cli/bin/cli.js --config scripts/webpack/webpack.router-security.mjs
          )
          (
          cd "$BIOETL_WORKSPACE/."
          cp -a reports/qa/router-v7-grafana-host/public/build reports/qa/router-v7-image-context/host-build
          docker buildx build --platform linux/amd64 --load --provenance=false \
            --metadata-file reports/qa/router-v7-image-build.json \
            -f grafana/tooling/router-v7-bridge/Dockerfile.host \
            -t bioetl-router-host:acceptance reports/qa/router-v7-image-context
          )
          (
          cd "$BIOETL_WORKSPACE/."
          image=$(node -p "require('./grafana/tooling/router-v7-bridge/host-image.json').image")
          base_image=$(node -p "require('./grafana/tooling/router-v7-bridge/host-image.json').base_image")
          # BuildKit cache does not register the base reference in the Docker image store.
          docker pull --platform linux/amd64 "$base_image"
          docker pull --platform linux/amd64 "$image"
          node grafana/tooling/router-v7-bridge/verify-host-image.mjs \
            bioetl-router-host:acceptance
          )
          BIOETL_ROUTER_SCRIPT
          timeout --signal=TERM --kill-after=30s 45m bash /tmp/host-build.sh 2>&1 | tee reports/qa/router-v7-circleci/host-build.log
    - store_artifacts:
        path: reports/qa/router-v7-circleci
        destination: router-v7-host-logs
    - store_artifacts:
        path: reports/qa/router-v7-image-build.json
        destination: router-v7-image-build.json
    - store_artifacts:
        path: reports/qa/router-v7-image-parity.json
        destination: router-v7-image-parity.json
    parameters:
      event-mode:
        type: boolean
        default: false
  release-dist-build:
    docker:
      - image: cimg/python:3.13
    resource_class: small
    steps:
      - checkout
      - setup-python-uv:
          python-version: "3.13"
          extras: dev
      - run:
          name: Verify release source and passport history
          command: |
            set -euo pipefail
            test "$CIRCLE_BRANCH" = main
            test "$(git rev-parse HEAD)" = "$CIRCLE_SHA1"
            if test "$(git rev-parse --is-shallow-repository)" = true; then
              git fetch --unshallow --no-tags origin
            fi
            uv run --frozen --no-build python -m scripts.engineering.repo check-versions
            uv run --frozen --no-build python -m scripts.docs passports check --require-clean-source
      - run:
          name: Build and verify wheel and source distribution
          no_output_timeout: 11m
          command: |
            set -euo pipefail
            timeout --signal=TERM --kill-after=30s 10m bash -euo pipefail -c '
              uv run --frozen --no-build python -m build --outdir /tmp/bioetl-release/dist
              uv run --frozen --no-build twine check /tmp/bioetl-release/dist/*
            '
            python3 - \<<'PY'
            import hashlib, json, os
            from pathlib import Path
            root = Path('/tmp/bioetl-release')
            files = sorted((root / 'dist').iterdir())
            assert len(files) == 2 and len(list((root / 'dist').glob('*.whl'))) == len(list((root / 'dist').glob('*.tar.gz'))) == 1
            identity = {'source_sha': os.environ['CIRCLE_SHA1'], 'workflow_id': os.environ['CIRCLE_WORKFLOW_ID'], 'job_number': os.environ['CIRCLE_BUILD_NUM'], 'published': False, 'sha256': {p.name: hashlib.sha256(p.read_bytes()).hexdigest() for p in files}}
            (root / 'identity.json').write_text(json.dumps(identity, sort_keys=True) + '\n', encoding='utf-8')
            PY
      - run:
          name: Generate source-bound distribution SPDX inventory
          no_output_timeout: 11m
          environment:
            SYFT_CHECK_FOR_APP_UPDATE: "false"
          command: |
            set -euo pipefail
            curl -fsSL --proto '=https' --tlsv1.2 \
              https://github.com/anchore/syft/releases/download/v1.54.0/syft_1.54.0_linux_amd64.tar.gz \
              -o /tmp/syft.tar.gz
            printf '%s  %s\n' '54a87372498168b2d033e876fd41fa4e8035b872699e525a57046e1f2f09c860' /tmp/syft.tar.gz | sha256sum -c -
            tar -xzf /tmp/syft.tar.gz -C "$HOME/.local/bin" syft
            python3 - \<<'PY'
            import hashlib, json, tarfile, zipfile
            from pathlib import Path
            root = Path('/tmp/bioetl-release')
            identity = json.loads((root / 'identity.json').read_text())
            for name, digest in identity['sha256'].items():
                archive = root / 'dist' / name
                assert archive.is_file() and not archive.is_symlink()
                assert hashlib.sha256(archive.read_bytes()).hexdigest() == digest
                target = Path('/tmp/bioetl-dist-sbom-input') / name
                target.mkdir(parents=True, exist_ok=False)
                if name.endswith('.whl'):
                    with zipfile.ZipFile(archive) as stream:
                        for member in stream.infolist():
                            assert (target / member.filename).resolve().is_relative_to(target.resolve())
                            assert (member.external_attr >> 16) & 0o170000 != 0o120000
                        stream.extractall(target)
                else:
                    with tarfile.open(archive) as stream:
                        stream.extractall(target, filter='data')
            PY
            timeout --signal=TERM --kill-after=30s 10m "$HOME/.local/bin/syft" scan -vv \
              dir:/tmp/bioetl-dist-sbom-input --source-name bioetl \
              -o spdx-json=/tmp/bioetl-release/bioetl-dist.spdx.json \
              2>&1 | tee /tmp/bioetl-release/syft.log
            python3 - \<<'PY'
            import hashlib, json
            from pathlib import Path
            root = Path('/tmp/bioetl-release')
            path = root / 'bioetl-dist.spdx.json'
            sbom = json.loads(path.read_text())
            version = next((root / 'dist').glob('*.whl')).name.split('-')[1]
            assert sbom['spdxVersion'] == 'SPDX-2.3'
            assert any(p['name'] == 'bioetl' and p.get('versionInfo') == version for p in sbom['packages'])
            assert sbom.get('files'), 'Empty distribution catalog is not acceptance'
            identity = json.loads((root / 'identity.json').read_text())
            identity['sbom_sha256'] = hashlib.sha256(path.read_bytes()).hexdigest()
            identity['sbom_tool'] = 'syft 1.54.0'
            (root / 'identity.json').write_text(json.dumps(identity, sort_keys=True) + '\n', encoding='utf-8')
            PY
      - persist_to_workspace:
          root: /tmp/bioetl-release
          paths:
            - dist
            - identity.json
            - bioetl-dist.spdx.json
      - store_artifacts:
          path: /tmp/bioetl-release
          destination: release-build

  release-install:
    docker:
      - image: cimg/python:3.13
    resource_class: small
    steps:
      - checkout
      - setup-python-uv:
          python-version: "3.13"
          extras: dev
      - attach_workspace:
          at: /tmp/bioetl-release
      - run:
          name: Install exact wheel into isolated locked runtime
          no_output_timeout: 16m
          command: |
            set -euo pipefail
            timeout --signal=TERM --kill-after=30s 15m bash -euo pipefail \<<'INSTALL'
            python3 - \<<'PY'
            import hashlib, json, os
            from pathlib import Path
            root = Path('/tmp/bioetl-release')
            identity = json.loads((root / 'identity.json').read_text())
            assert identity['source_sha'] == os.environ['CIRCLE_SHA1'] and identity['workflow_id'] == os.environ['CIRCLE_WORKFLOW_ID']
            assert hashlib.sha256((root / 'bioetl-dist.spdx.json').read_bytes()).hexdigest() == identity['sbom_sha256']
            files = sorted((root / 'dist').iterdir())
            assert len(files) == 2 and {p.name for p in files} == set(identity['sha256'])
            assert all(p.is_file() and not p.is_symlink() and hashlib.sha256(p.read_bytes()).hexdigest() == identity['sha256'][p.name] for p in files)
            wheels = list((root / 'dist').glob('*.whl'))
            assert len(wheels) == 1
            name, version, *_ = wheels[0].name.split('-')
            assert name == 'bioetl'
            requirement = f"{name}=={version} --hash=sha256:{identity['sha256'][wheels[0].name]}\n"
            (root / 'wheel-requirements.txt').write_text(requirement, encoding='utf-8')
            PY
            uv venv --python 3.13 /tmp/bioetl-release-installed
            uv export --frozen --no-dev --no-emit-project --format requirements-txt --output-file /tmp/bioetl-release/runtime-requirements.txt
            uv pip install --python /tmp/bioetl-release-installed/bin/python --require-hashes --only-binary=:all: -r /tmp/bioetl-release/runtime-requirements.txt
            uv pip install --python /tmp/bioetl-release-installed/bin/python --require-hashes --only-binary=:all: --no-deps --no-index --find-links=/tmp/bioetl-release/dist -r /tmp/bioetl-release/wheel-requirements.txt
            unset PYTHONPATH
            cd /tmp
            /tmp/bioetl-release-installed/bin/python -I -c 'import bioetl, sys; from pathlib import Path; assert Path(bioetl.__file__).resolve().is_relative_to(Path(sys.prefix).resolve()); print(bioetl.__file__)'
            /tmp/bioetl-release-installed/bin/bioetl --help
            /tmp/bioetl-release-installed/bin/bioetl --version
            INSTALL
      - store_artifacts:
          path: /tmp/bioetl-release
          destination: release-install

  release-tests:
    docker:
      - image: cimg/python:3.13
    resource_class: medium
    steps:
      - checkout
      - setup-python-uv:
          python-version: "3.13"
