        - arch-tests
        - proof-docs
        - proof-governance
        - proof-debt
        - proof-quality
    - proof-coverage-shard:
        matrix:
          alias: proof-coverage-shards
          parameters:
            group:
            - '0'
            - '1'
            - '2'
            - '3'

  main-coverage-closeout:
    when:
