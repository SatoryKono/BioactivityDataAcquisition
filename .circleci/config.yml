            - provider-contract-drift
            - memory-freshness
            - skills-consistency
            - e2e-matrix-replay
            - lint-ruff
            - lint-arch
            - arch-tests
            - mypy
            - dependency-lock
            - test-fast
            - test-integration
            - dq-consistency
            - root-hygiene
            - compiled-artifacts
            - security-scans
            - actions-audit
            - docs-diagram-syntax
            - docs-diagram-targeted
            - docs-diagram-drift
            - duplication
            - schema-governance
            - semantic-governance
            - commit-lint
            - docs-governance
            - docker-build
      - proof-coverage:
          filters: &id001
            branches:
              only:
