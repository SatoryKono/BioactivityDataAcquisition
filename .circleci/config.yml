              uv run --frozen --no-build pytest tests/smoke/ -m "not memory" -q --tb=line --junitxml=reports/release-tests/smoke.xml
              uv run --frozen --no-build pytest tests/architecture/test_github_actions_runtime_policy.py tests/architecture/test_docker_runtime_contracts.py -q --tb=line --junitxml=reports/release-tests/supply-chain.xml
