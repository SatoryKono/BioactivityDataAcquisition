# CircleCI config v2 â€” PR gates port (phase 2, 03.10.2026)
# Repo: SatoryKono/BioactivityDataAcquisition
# Mirrors .github/workflows/pr-required.yml: the `classify` job runs the repo's own
# decision-matrix classifier (scripts/engineering/ci pr-gate classify); each gate job
# reads the matrix from the workspace and halts early when not_applicable.
# Gate ownership and applicability come from the canonical catalog (docker,
# generated-artifacts, commit-governance, docs-governance).
# CodeQL is excluded from required checks (#11929); optional analysis is separate.
# Remaining migration decisions: dependency-review, labeler, stale.
# Deploy: replace .circleci/config.yml at repo root, commit, push.
version: 2.1

parameters:
  ci-lane:
    type: enum
    enum: [pr-gate, docs-kpi, memory-retention, port-contracts, skills-consistency, github-settings-review, performance, replay-parity, memory-freshness, mutation]
    default: pr-gate
  include-hypothesis:
    type: boolean
    default: true

commands:
  # Port of .github/actions/setup-python-uv (uv 0.11.26, uv cache, uv sync).
  setup-python-uv:
    description: "Install uv, restore cache, sync deps (port of GH composite action)"
    parameters:
      python-version:
        type: string
        default: "3.12"
      extras:
        type: string
        default: "dev tracing"
    steps:
      - run:
          name: Install uv 0.11.26
          command: |
            curl -LsSf https://astral.sh/uv/install.sh | sh
            echo 'export PATH="$HOME/.local/bin:$PATH"' >> "$BASH_ENV"
            "$HOME/.local/bin/uv" --version
      - restore_cache:
          name: Restore uv cache
          keys:
            - uv-v1-{{ checksum "uv.lock" }}-py<< parameters.python-version >>
      - run:
          name: Sync dependencies
          command: |
            export PATH="$HOME/.local/bin:$PATH"
            export UV_CACHE_DIR="$HOME/.cache/uv"
            CMD="uv sync --frozen"
            for extra in << parameters.extras >>; do CMD="$CMD --extra $extra"; done
            echo "Running: $CMD"
            $CMD
      - save_cache:
          name: Save uv cache
          key: uv-v1-{{ checksum "uv.lock" }}-py<< parameters.python-version >>
          paths:
            - ~/.cache/uv

  # Reads the decision matrix produced by `classify`; ends the job as success
  # without running the gate when the catalog says not_applicable.
  check-gate:
    description: "Halt job early when the gate decision is not_applicable"
    parameters:
      gate:
        type: string
    steps:
      - attach_workspace:
          at: /tmp/cci-ws
      - run:
          name: Check gate decision (<< parameters.gate >>)
          command: |
            DECISION=$(python3 -c "import json; print(json.load(open('/tmp/cci-ws/pr-gate-decisions.json'))['decisions']['<< parameters.gate >>']['decision'])")
            echo "gate << parameters.gate >> decision: $DECISION"
            if [ "$DECISION" != "required" ]; then
              echo "Gate not applicable for this change set â€” skipping."
              circleci-agent step halt
            fi

jobs:
  mutation-testing:
    parameters:
      target:
        type: string
      source-path:
        type: string
      tests-dir:
        type: string
      threshold:
        type: string
    docker:
    - image: cimg/python:3.13
    resource_class: medium
    environment:
      OPENBLAS_NUM_THREADS: '1'
      POLARS_MAX_THREADS: '2'
    steps:
    - checkout
    - setup-python-uv:
        python-version: '3.13'
        extras: dev
    - run:
        name: Configure mutation target
        command: |
          export WORKSPACE_ROOT="$PWD"
          export PYTHONPATH="$PWD/src:$PWD${PYTHONPATH:+:$PYTHONPATH}"
          uv run --frozen --no-build python - <<'PY'
          import os
          from pathlib import Path

          import tomlkit

          path = Path("pyproject.toml")
          document = tomlkit.parse(path.read_text(encoding="utf-8"))
          config = document["tool"]["mutmut"]
          # mutmut 3.x reads paths_to_mutate (source_paths is ignored).
          config["paths_to_mutate"] = [os.environ["MUTMUT_SOURCE_PATH"]]
          if "source_paths" in config:
              del config["source_paths"]
          # Subset mutation still needs the full package + tooling imports.
          config["also_copy"] = [
              "src/bioetl",
              "scripts",
              "configs",
          ]
          config["pytest_add_cli_args_test_selection"] = [
              os.environ["MUTMUT_TESTS_DIR"]
          ]
          path.write_text(tomlkit.dumps(document), encoding="utf-8")
          PY
        environment:
          MUTMUT_SOURCE_PATH: << parameters.source-path >>
          MUTMUT_TESTS_DIR: << parameters.tests-dir >>
    - run:
        name: Run mutation testing
        command: |-
          timeout --signal=TERM --kill-after=30s 60m bash -euo pipefail -c 'export WORKSPACE_ROOT="$PWD"
          export PYTHONPATH="$PWD/src:$PWD${PYTHONPATH:+:$PYTHONPATH}"
          set -euo pipefail
          echo "Running mutation testing for << parameters.target >>..."
          # mutmut is a dev dependency; invoke via uv so PATH/venv entrypoints resolve
          # under the frozen CI environment (bare `mutmut` is not on runner PATH).
          export PYTHONPATH="${WORKSPACE_ROOT}/src:${WORKSPACE_ROOT}${PYTHONPATH:+:$PYTHONPATH}"
          uv run --frozen --no-build python -c "import bioetl.domain, scripts; print('"'"'mutation import preflight ok'"'"')"
          uv run --frozen --no-build mutmut run
          '
        no_output_timeout: 65m
    - run:
        name: Generate mutation report
        command: |
          export WORKSPACE_ROOT="$PWD"
          export PYTHONPATH="$PWD/src:$PWD${PYTHONPATH:+:$PYTHONPATH}"
          mkdir -p "reports/<< parameters.target >>"
          uv run --frozen --no-build mutmut results > "reports/<< parameters.target >>/mutmut_results.txt"
          uv run --frozen --no-build mutmut export-cicd-stats
          if [ -f mutants/mutmut-cicd-stats.json ]; then
            cp mutants/mutmut-cicd-stats.json \
              "reports/<< parameters.target >>/mutmut-cicd-stats.json"
          else
            echo "Mutation stats missing after run; treating as setup/runtime failure." >&2
            exit 1
          fi
          # mutmut 3.x no longer ships a stable `html` CLI command on all installs.
          # Prefer HTML when available; never fail the report step on its absence.
          if uv run --frozen --no-build mutmut --help 2>/dev/null | grep -Eq '(^|[[:space:]])html([[:space:]]|$)'; then
            uv run --frozen --no-build mutmut html || true
          fi
          if [ -d "html" ]; then
            mv html "reports/<< parameters.target >>/mutmut_html"
          fi
    - run:
        name: Check mutation score threshold
        command: |
          export WORKSPACE_ROOT="$PWD"
          export PYTHONPATH="$PWD/src:$PWD${PYTHONPATH:+:$PYTHONPATH}"
          python - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          target = os.environ["MUTATION_TARGET"]
          stats_path = Path("reports") / target / "mutmut-cicd-stats.json"
          if not stats_path.is_file():
              print(
                  f"mutmut CI/CD stats are missing for {target}; "
                  "treating this as a broken gate."
              )
              sys.exit(1)

          stats = json.loads(stats_path.read_text(encoding="utf-8"))
          try:
              killed = int(stats["killed"])
              survived = int(stats["survived"])
              timeout = int(stats["timeout"])
          except (KeyError, TypeError, ValueError) as exc:
              print(
                  f"Invalid mutmut CI/CD stats for {target}; "
                  f"treating this as a broken gate: {exc}"
              )
              print(json.dumps(stats, sort_keys=True))
              sys.exit(1)

          total = killed + survived + timeout
          if total <= 0 or min(killed, survived, timeout) < 0:
              print("Mutation workflow produced zero mutants; treating this as a broken gate.")
              sys.exit(1)

          score = (killed + timeout) / total * 100
          print(f"Mutation Score: {score:.1f}%")
          print(f"  Killed: {killed}")
          print(f"  Survived: {survived}")
          print(f"  Timeout: {timeout}")
          print(f"  Total: {total}")

          threshold = float(os.environ["MUTATION_SCORE_THRESHOLD"])
          if score < threshold:
              print(f"\n⚠️  Mutation score {score:.1f}% is below threshold {threshold}%")
              print("Consider improving test coverage for the surviving mutants")
              sys.exit(1)
          else:
              print(f"\n✅ Mutation score {score:.1f}% meets threshold {threshold}%")
          PY
        environment:
          MUTATION_TARGET: << parameters.target >>
          MUTATION_SCORE_THRESHOLD: << parameters.threshold >>
    - store_artifacts:
        path: reports
        destination: mutation
  replay-parity:
    docker:
      - image: cimg/python:3.13
    resource_class: small
    environment:
      BIOETL_TEST_MODE: "true"
      BIOETL_PIPELINE__HEALTH_CHECK_MODE: probe
      OPENBLAS_NUM_THREADS: "1"
      POLARS_MAX_THREADS: "2"
    steps:
      - checkout
      - setup-python-uv:
          python-version: "3.13"
      - run:
          name: Sync replay dependencies
          command: uv sync --frozen --all-extras --dev
      - run:
          name: Verify replay matrix including independent determinism recheck
          no_output_timeout: 65m
          command: |
            timeout --signal=TERM --kill-after=30s 60m bash -euo pipefail -c 'export PATH="$HOME/.local/bin:$PATH"
            mkdir -p reports/nightly-replay
            uv run --frozen --no-build pytest tests/integration/determinism -q \
              --junitxml=reports/nightly-replay/determinism.xml \
              --basetemp .artifacts/nightly-replay/determinism/run1
            uv run --frozen --no-build pytest tests/integration/idempotency -q \
              --junitxml=reports/nightly-replay/idempotency.xml \
              --basetemp .artifacts/nightly-replay/idempotency/run1
            uv run --frozen --no-build pytest tests/integration/composite_resume -q \
              --junitxml=reports/nightly-replay/composite_resume.xml \
              --basetemp .artifacts/nightly-replay/composite_resume/run1
            uv run --frozen --no-build pytest tests/integration/determinism -q \
              --junitxml=reports/nightly-replay/determinism-recheck.xml \
              --basetemp .artifacts/nightly-replay/determinism/run2
            '
      - run:
          name: Compare nonempty replay checksum inventories
          command: |
            WORKSPACE_ROOT="$PWD"
            find .artifacts/nightly-replay/determinism/run1 -type f -print -quit | grep -q .
            find .artifacts/nightly-replay/determinism/run2 -type f -print -quit | grep -q .
            mkdir -p reports/nightly-replay/checksums
            find .artifacts/nightly-replay/determinism -type f | sort | xargs sha256sum > reports/nightly-replay/checksums/determinism.sha256
            find .artifacts/nightly-replay/idempotency -type f | sort | xargs sha256sum > reports/nightly-replay/checksums/idempotency.sha256
            find .artifacts/nightly-replay/composite_resume -type f | sort | xargs sha256sum > reports/nightly-replay/checksums/composite_resume.sha256
            (
              cd .artifacts/nightly-replay/determinism/run1
              find . -type f -print0 | sort -z | xargs -0 sha256sum
            ) > "$WORKSPACE_ROOT/reports/nightly-replay/checksums/determinism-run1.sha256"
            (
              cd .artifacts/nightly-replay/determinism/run2
              find . -type f -print0 | sort -z | xargs -0 sha256sum
            ) > "$WORKSPACE_ROOT/reports/nightly-replay/checksums/determinism-run2.sha256"
            diff -u reports/nightly-replay/checksums/determinism-run1.sha256 reports/nightly-replay/checksums/determinism-run2.sha256 > reports/nightly-replay/checksums/determinism-replay-diff.txt
      - store_test_results:
          path: reports/nightly-replay
      - store_artifacts:
          path: reports/nightly-replay

  memory-freshness:
    docker:
      - image: cimg/python:3.13
    resource_class: small
    steps:
      - checkout
      - setup-python-uv:
          python-version: "3.13"
      - run:
          name: Check repository memory freshness without notification writes
          command: |
            mkdir -p reports/memory
            uv run --frozen --no-build python -m memory.tooling.check_freshness --json > reports/memory/freshness.json
      - run:
          name: Verify freshness contracts
          command: uv run --frozen --no-build pytest tests/unit/memory/test_check_freshness.py -q -p no:xdist
      - store_artifacts:
          path: reports/memory

  performance:
    docker:
      - image: cimg/python:3.13
    resource_class: small
    environment:
      OPENBLAS_NUM_THREADS: "1"
      POLARS_MAX_THREADS: "2"
    steps:
      - checkout
      - setup-python-uv:
          python-version: "3.13"
          extras: "dev tracing performance"
      - run:
          name: Run performance benchmarks with existing budgets
          no_output_timeout: 35m
          command: |
            mkdir -p reports/performance
            timeout --signal=TERM --kill-after=30s 30m \
              uv run --frozen --no-build pytest tests/performance/ tests/benchmarks/ \
              -m "benchmark or performance" -p no:xdist -v --tb=short \
              --perf-obs-out reports/performance/hotspot-observations.jsonl \
              --junitxml=reports/performance/hotspot-budgets.xml
      - run:
          name: Build performance degradation evidence
          when: always
          command: |
            test -s reports/performance/hotspot-observations.jsonl
            uv run --frozen --no-build python -m scripts.engineering.qa report-hotspots \
              --observations reports/performance/hotspot-observations.jsonl \
              --budgets tests/performance/hotspot_budgets.json --window-size 5 \
              --json-out reports/performance/hotspot-degradation.json \
              --markdown-out reports/performance/hotspot-degradation.md
      - run:
          name: Reject missing or failing performance evidence
          when: always
          command: |
            uv run --frozen --no-build python -c 'import json,sys; d=json.load(open("reports/performance/hotspot-degradation.json")); s=d["summary"]; sys.exit(0 if s["total"] > 0 and s["failed"] == 0 else 1)'
      - store_test_results:
          path: reports/performance
      - store_artifacts:
          path: reports/performance

  memory-retention:
    docker:
      - image: cimg/python:3.13
    resource_class: small
    environment:
      PYTHONPATH: src
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - checkout
      - setup-python-uv:
          python-version: "3.13"
      - run:
          name: Check episodic retention policy without pruning
          command: |
            mkdir -p reports/memory
            uv run --frozen --no-build python -m memory.tooling.prune --check --json > reports/memory/retention.json
      - store_artifacts:
          path: reports/memory

  port-contracts:
    docker:
      - image: cimg/python:3.13
    resource_class: small
    environment:
      HYPOTHESIS_PROFILE: ci
    steps:
      - checkout
      - setup-python-uv:
          python-version: "3.13"
          extras: "tests"
      - run:
          name: Verify port adapter and registry contracts
          command: |
            mkdir -p reports/junit
            uv run --frozen --no-build pytest \
              tests/architecture/test_port_contracts.py \
              tests/architecture/test_adapter_contracts.py \
              tests/architecture/test_registry_contracts.py \
              -p no:xdist --junitxml=reports/junit/port-contracts.xml
      - when:
          condition: << pipeline.parameters.include-hypothesis >>
          steps:
            - run:
                name: Verify hypothesis contracts
                command: |
                  uv run --frozen --no-build pytest tests/architecture/test_port_contracts_hypothesis.py \
                    -m hypothesis -p no:xdist --junitxml=reports/junit/hypothesis-contracts.xml
      - store_test_results:
          path: reports/junit
      - store_artifacts:
          path: reports/junit

  skills-consistency:
    docker:
      - image: cimg/python:3.13
    resource_class: small
    steps:
      - checkout
      - setup-python-uv:
          python-version: "3.13"
      - run:
          name: Verify runtime mirrors without synchronizing
          command: |
            bash scripts/ai/junie/check_junie_mirror.sh --check
            bash scripts/ops/support/skills/check_skills_mirror.sh --check
            bash scripts/ops/support/skills/check_ai_skills_layout.sh

  github-settings-review:
    docker:
      - image: cimg/python:3.13
    resource_class: small
    steps:
      - checkout
      - setup-python-uv:
          python-version: "3.13"
      - run:
          name: Collect read-only GitHub settings evidence
          command: |
            mkdir -p reports/github-settings
            uv run --frozen --no-build python -m scripts.engineering.repo github-settings-review \
              --json-out reports/github-settings/review.json \
              --markdown-out reports/github-settings/review.md
      - store_artifacts:
          path: reports/github-settings

  # Prepared manual/scheduled lane; external schedule registration is separate.
  docs-kpi:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    steps:
      - checkout
      - setup-python-uv:
          extras: "docs"
      - run:
          name: Check docs runtime mirrors and freshness
          command: uv run --frozen --no-build python -m scripts.docs check-drift --runtime-mirrors --freshness
      - run:
          name: Generate docs KPI report
          command: |
            mkdir -p reports/docs-kpi
            uv run --frozen --no-build python -m scripts.docs check-kpi \
              --kpi-target-not-in-nav 120 \
              --hard-limit-not-in-nav 135 \
              --max-orphans 0 \
              --target-deadline 2026-12-31 \
              --json-out reports/docs-kpi/docs-kpi-weekly.json \
              --markdown-out reports/docs-kpi/docs-kpi-weekly.md \
              --summary-out reports/docs-kpi/summary.md \
              --fail-on-breach
      - store_artifacts:
          path: reports/docs-kpi
          destination: docs-kpi

  # Mirrors pr-required.yml `classify-changes`: runs the repo's own classifier
  # against the canonical catalog. On main/master pushes all gates are required
  # (fail-closed); on branches the matrix is computed from merge-base...HEAD.
  classify:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    steps:
      - checkout
      - setup-python-uv
      - run:
          name: Classify changes (decision matrix)
          command: |
            export PATH="$HOME/.local/bin:$PATH"
            HEAD_SHA="$CIRCLE_SHA1"
            if [ "$CIRCLE_BRANCH" = "main" ] || [ "$CIRCLE_BRANCH" = "master" ]; then
              echo "Default-branch push: all gates required (fail-closed)."
              uv run --frozen --no-build python - "$HEAD_SHA" \<<'EOF' > /tmp/pr-gate-decisions.json
            import json, sys
            from pathlib import Path
            from scripts.engineering.ci.pr_gate import load_catalog
            head = sys.argv[1]
            catalog = load_catalog(Path("configs/quality/github_required_checks.yaml"))
            gates = [gate["id"] for gate in catalog["gates"]]
            print(json.dumps({"schema_version": 1, "config_version": catalog["version"], "head_sha": head,
                              "decisions": {g: {"decision": "required", "reason": "default_branch_push"} for g in gates},
                              "changed_files": [], "unclassified_files": []}, indent=2))
            EOF
            else
              git fetch --no-tags origin main:refs/remotes/origin/main
              BASE_SHA="$(git merge-base origin/main "$HEAD_SHA")"
              echo "Classifying $BASE_SHA...$HEAD_SHA"
              uv run --frozen --no-build python -m scripts.engineering.ci pr-gate classify \
                --catalog configs/quality/github_required_checks.yaml \
                --event-name pull_request \
                --base-sha "$BASE_SHA" \
                --head-sha "$HEAD_SHA" \
                --artifact /tmp/pr-gate-decisions.json
            fi
            cp /tmp/pr-gate-decisions.json ./pr-gate-decisions.json
            python3 -c "
            import json
            d = json.load(open('/tmp/pr-gate-decisions.json'))
            for k, v in d['decisions'].items(): print(f'{k} = {v[\"decision\"]} ({v[\"reason\"]})')"
      - persist_to_workspace:
          root: /tmp
          paths:
            - pr-gate-decisions.json
      - store_artifacts:
          path: pr-gate-decisions.json

  # --- Gate: lint-arch (always_required) -------------------------------------
  # Mirrors import-linter.yml `lint` (ruff staged profiles + format + isort).
  lint-ruff:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    steps:
      - checkout
      - setup-python-uv
      - run:
          name: "ruff check (Makefile gate: src tests scripts)"
          command: |
            export PATH="$HOME/.local/bin:$PATH"
            uv run --frozen ruff check src tests scripts

  lint-arch:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    steps:
      - checkout
      - setup-python-uv
      - run:
          name: ruff staged profiles + format + isort
          command: |
            export PATH="$HOME/.local/bin:$PATH"
            uv run --frozen --no-build ruff check src/bioetl/domain --output-format=github
            uv run --frozen --no-build ruff check src/bioetl/application --output-format=github
            uv run --frozen --no-build ruff check src/bioetl/infrastructure --output-format=github
            uv run --frozen --no-build ruff format --check src tests
            uv run --frozen --no-build ruff check --select I src tests --output-format=github

  # Mirrors import-linter.yml `arch-tests` (canonical selector from catalog).
  arch-tests:
    docker:
      - image: cimg/python:3.12
    resource_class: medium
    steps:
      - checkout
      - setup-python-uv
      - run:
          name: architecture tests
          command: |
            export PATH="$HOME/.local/bin:$PATH"
            mkdir -p reports/test-telemetry
            HYPOTHESIS_PROFILE=fast \
            uv run --frozen --no-build pytest tests/architecture \
              -m "not slow and not benchmark and not memory" \
              -q --tb=short --no-cov \
              --junitxml=reports/test-telemetry/junit-arch.xml
      - store_test_results:
          path: reports/test-telemetry

  # --- Gate: type-checking (always_required) ----------------------------------
  # Mirrors type-checking.yml `type-check` (mypy --strict, 30m budget).
  mypy:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    steps:
      - checkout
      - setup-python-uv
      - run:
          name: mypy strict gate (src/bioetl + src/memory)
          no_output_timeout: 35m
          command: |
            export PATH="$HOME/.local/bin:$PATH"
            mkdir -p reports
            rm -rf .mypy_cache
            set +e
            timeout --signal=TERM --kill-after=30s 30m \
              uv run --frozen --no-build mypy --config-file pyproject.toml --strict --no-incremental src/bioetl src/memory \
              2>&1 | tee reports/mypy_strict.log
            status=${PIPESTATUS[0]}
            set -e
            if [ "$status" -eq 124 ]; then echo "mypy strict gate timed out after 30 minutes"; exit 1; fi
            exit "$status"
      - store_artifacts:
          path: reports/mypy_strict.log

  # --- Gate: tests (always_required) ------------------------------------------
  dependency-lock:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    steps:
      - checkout
      - setup-python-uv
      - run:
          name: uv lock --check (no drift)
          command: |
            export PATH="$HOME/.local/bin:$PATH"
            uv lock --check

  # Mirrors tests.yml `test-fast` (4 unit groups, fast markers, no xdist).
  # NOTE: CircleCI matrix is a cartesian product, so name+path are packed into
  # one parameter and split in the step.
  test-fast:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    parameters:
      test-group:
        type: string
        default: "unit-domain|tests/unit/domain/"
    steps:
      - checkout
      - setup-python-uv
      - run:
          name: pytest fast lane (<< parameters.test-group >>)
          command: |
            export PATH="$HOME/.local/bin:$PATH"
            GROUP="<< parameters.test-group >>"
            NAME="${GROUP%%|*}"; PATHS="${GROUP#*|}"
            mkdir -p reports/test-telemetry
            HYPOTHESIS_PROFILE=fast \
            uv run --frozen --no-build pytest $PATHS \
              -m "not fs_contract and not repo_backed and not subprocess_backed and not slow and not benchmark and not memory" \
              -p no:xdist \
              -q --tb=short \
              --junitxml="reports/test-telemetry/junit-fast.${NAME}.xml"
      - store_test_results:
          path: reports/test-telemetry

  # Mirrors tests.yml `test-matrix` (6 groups; unit groups with xdist, integration serial).
  test-integration:
    environment:
      PYTEST_XDIST_AUTO_NUM_WORKERS: "2"
    docker:
      - image: cimg/python:3.13
    resource_class: small
    environment:
      # Bound auto-detected workers to the runner CPU quota.
      PYTEST_XDIST_AUTO_NUM_WORKERS: "2"
      OPENBLAS_NUM_THREADS: "1"
      POLARS_MAX_THREADS: "2"
    parameters:
      test-group:
        type: string
        default: "integration|tests/integration/|-p no:xdist"
    steps:
      - checkout
      - setup-python-uv:
          python-version: "3.13"
      - run:
          name: pytest matrix lane (<< parameters.test-group >>)
          command: |
            export PATH="$HOME/.local/bin:$PATH"
            GROUP="<< parameters.test-group >>"
            NAME="${GROUP%%|*}"; REST="${GROUP#*|}"
            PATHS="${REST%%|*}"; XDIST="${REST#*|}"
            mkdir -p reports/test-telemetry
            uv run --frozen --no-build pytest $PATHS \
              -m "not serial and not memory and not fs_contract and not subprocess_backed" \
              $XDIST \
              -q --tb=short \
              --junitxml="reports/test-telemetry/junit.${NAME}.xml"
      - store_test_results:
          path: reports/test-telemetry

  # Mirrors tests.yml `dq-consistency-gate`.
  dq-consistency:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    steps:
      - checkout
      - setup-python-uv
      - run:
          name: DQ consistency validation
          command: |
            export PATH="$HOME/.local/bin:$PATH"
            uv run --frozen --no-build python -m scripts.engineering.qa validate-dq-consistency

  # --- Gate: root-hygiene (always_required) ------------------------------------
  # Mirrors root-hygiene.yml `root-hygiene` (essential checks).
  root-hygiene:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    steps:
      - checkout
      - setup-python-uv
      - run:
          name: root allowlist + governance checks
          command: |
            export PATH="$HOME/.local/bin:$PATH"
            uv run --frozen --no-build python -m scripts.engineering.repo check-cleanliness --strict-untracked --check-local-forbidden-outputs
            uv run --frozen --no-build python -m scripts.engineering.repo check-cleanup-governance
            uv run --frozen --no-build python -m scripts.engineering.repo check-root-governance-docs
            uv run --frozen --no-build python -m scripts.engineering.repo check-root-review-registry
            uv run --frozen --no-build python scripts/engineering/repo/check_no_partial_tree.py --base origin/main --tip HEAD

  # --- Gate: compiled-artifacts (always_required) -------------------------------
  # Mirrors compiled-artifacts-block.yml `no-pyc-check`.
  compiled-artifacts:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    steps:
      - checkout
      - setup-python-uv
      - run:
          name: no tracked compiled artifacts
          command: |
            export PATH="$HOME/.local/bin:$PATH"
            set -e
            if git ls-files | grep -E '\.pyc$|__pycache__/' ; then
              echo "ERROR: tracked compiled Python artifacts found"; exit 1
            fi
            echo "No tracked .pyc / __pycache__ entries."
            uv run --frozen --no-build python -m scripts.engineering.repo check-cleanliness

  # --- Gate: security (always_required) -----------------------------------------
  # Mirrors security.yml (detect-secrets, pip-audit, bandit, gitleaks, osv-scanner).
  security-scans:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    steps:
      - checkout
      - setup-python-uv
      - run:
          name: detect-secrets (no hardcoded secrets)
          command: |
            export PATH="$HOME/.local/bin:$PATH"
            uv run --frozen --no-build pytest tests/architecture/test_antipatterns.py::test_no_hardcoded_secrets -q
      - run:
          name: pip-audit (strict)
          command: |
            export PATH="$HOME/.local/bin:$PATH"
            export UV_CACHE_DIR=/tmp/.uv-cache
            uv export --frozen --no-hashes --no-emit-project --all-extras > /tmp/pip-audit-requirements.txt
            uv run --frozen --no-build pip-audit --strict \
              -r /tmp/pip-audit-requirements.txt --cache-dir /tmp/.pip-audit-cache
      - run:
          name: bandit (src/bioetl)
          command: |
            export PATH="$HOME/.local/bin:$PATH"
            uv run --frozen --no-build bandit -c pyproject.toml -r src/bioetl
      - run:
          name: gitleaks (binary v8.30.1)
          command: |
            curl -fsSL --proto '=https' --tlsv1.2 \
              https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
              -o /tmp/gitleaks.tar.gz
            mkdir -p "$HOME/.local/bin" && tar -xzf /tmp/gitleaks.tar.gz -C "$HOME/.local/bin" gitleaks
            "$HOME/.local/bin/gitleaks" detect --config .gitleaks.toml --no-git -v
      - run:
          name: osv-scanner (binary v2.6.0, lockfiles)
          command: |
            curl -fsSL --proto '=https' --tlsv1.2 \
              https://github.com/google/osv-scanner/releases/download/v2.6.0/osv-scanner_linux_amd64 \
              -o "$HOME/.local/bin/osv-scanner"
            chmod 0755 "$HOME/.local/bin/osv-scanner"
            "$HOME/.local/bin/osv-scanner" \
              --lockfile=uv.lock \
              --lockfile=package-lock.json \
              --lockfile=.github/actions/setup-mermaid/package-lock.json \
              --lockfile=.github/tooling/jscpd/package-lock.json \
              --lockfile=scripts/ai/gemini/npm-tooling/package-lock.json \
              --lockfile=grafana/plugins/bioetl-scenes-app/package-lock.json \
              --lockfile=grafana/plugins/bioetl-selectorshell-panel/package-lock.json \
              --lockfile=grafana/tooling/router-v7-bridge/package-lock.json \
              --format=json --output-file=osv-results.json || true
            export PATH="$HOME/.local/bin:$PATH"
            uv run --frozen --no-build python -m scripts.engineering.repo.check_github_actions_runtime_policy --osv-json osv-results.json
      - store_artifacts:
          path: osv-results.json

  # --- Gate: duplication (always_required) ---------------------------------------
  # Mirrors duplication-complexity.yml (radon + jscpd).
  duplication:
    docker:
      - image: cimg/python:3.12-node
    # Preserve the complete src/tests scan within the runner memory quota.
    resource_class: medium
    environment:
      NODE_OPTIONS: --max-old-space-size=3072
    steps:
      - checkout
      - setup-python-uv
      - run:
          name: radon complexity (CC <= 10; domain <= 5)
          command: |
            export PATH="$HOME/.local/bin:$PATH"
            mkdir -p reports
            uv run --frozen --no-build radon cc src tests -a -s > reports/radon_cc.txt
            uv run --frozen --no-build python -m scripts.engineering.qa check-duplication-complexity-exemptions
      - run:
          name: jscpd duplication detection
          command: |
            set -euo pipefail
            export NODE_OPTIONS="--max-old-space-size=3072"
            mkdir -p reports/jscpd
            npm ci --ignore-scripts --no-fund --no-audit --prefix "$PWD/.github/tooling/jscpd"
            "$PWD/.github/tooling/jscpd/node_modules/.bin/jscpd" \
              "$PWD/src" "$PWD/tests" \
              --config "$PWD/.jscpd.json" \
              --threshold 10 --format python \
              --output "$PWD/reports/jscpd"

  # --- Gate: generated-artifacts (path_scoped) ------------------------------------
  # Mirrors schema-governance.yml (generated schema artifacts + parity).
  schema-governance:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    steps:
      - checkout
      - setup-python-uv
      - check-gate:
          gate: generated-artifacts
      - run:
          name: schema artifacts + parity
          command: |
            export PATH="$HOME/.local/bin:$PATH"
            uv run --frozen --no-build python -m scripts.schema generate-artifacts --check
            uv run --frozen --no-build python -m scripts.schema verify-schema-parity --mode blocking

  # --- Gate: commit-governance (path_scoped) ---------------------------------------
  # Mirrors commit-lint.yml (conventional commits on the PR range).
  commit-lint:
    docker:
      - image: cimg/python:3.12-node
    resource_class: small
    steps:
      - checkout
      - check-gate:
          gate: commit-governance
      - run:
          name: commitlint on PR range
          command: |
            git fetch --no-tags origin main:refs/remotes/origin/main
            BASE="$(git merge-base origin/main HEAD)"
            npx --yes @commitlint/cli --config commitlint.config.mjs \
              --from "$BASE" --to HEAD --verbose

  # --- Gate: docs-governance (path_scoped) ------------------------------------------
  # Mirrors docs.yml (docs-governance + validate-mkdocs essentials).
  docs-governance:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    steps:
      - checkout
      - setup-python-uv
      - check-gate:
          gate: docs-governance
      - run:
          name: docs governance checks
          command: |
            export PATH="$HOME/.local/bin:$PATH"
            uv run --frozen --no-build python -m scripts.diagrams generate-dataflows --pipeline chembl_activity --check
            uv run --frozen --no-build python -m scripts.docs passports check
            uv run --frozen --no-build python -m scripts.engineering.qa check-xwalk-missing-backlog
            uv run --frozen --no-build python -m scripts.engineering.qa report-dashboard-inventory --check --json
            uv run --frozen --no-build python -m scripts.engineering.repo check-versions
            uv run --frozen --no-build python -m scripts.docs check-links --report-json reports/docs-link-check-report.json
            uv run --frozen --no-build python -m scripts.docs verify --skip-links
            uv run --frozen --no-build python scripts/diagrams/render/generate_description_indexes.py --check

  # --- Gate: docker (path_scoped) ----------------------------------------------------
  # Mirrors docker.yml validation part only (lint + compose + build). No push, no
  # Trivy baseline here â€” image security baseline stays a phase-3 item.
  docker-build:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    steps:
      - checkout
      - check-gate:
          gate: docker
      - setup_remote_docker:
          version: default
      - run:
          name: Install Docker CLI (not bundled in cimg/python)
          command: |
            if ! command -v docker >/dev/null 2>&1; then
              curl -fsSL --proto '=https' --tlsv1.2 \
                https://download.docker.com/linux/static/stable/x86_64/docker-27.3.1.tgz \
                -o /tmp/docker.tgz
              tar -xzf /tmp/docker.tgz -C /tmp
              (sudo mv /tmp/docker/docker /usr/local/bin/ 2>/dev/null || mv /tmp/docker/docker "$HOME/.local/bin/")
              echo 'export PATH="/usr/local/bin:$HOME/.local/bin:$PATH"' >> "$BASH_ENV"
            fi
            docker version
      - run:
          name: Install Docker Compose plugin v5.6.0
          command: |
            mkdir -p "$HOME/.docker/cli-plugins"
            curl -fsSL --proto '=https' --tlsv1.2 \
              https://github.com/docker/compose/releases/download/v5.6.0/docker-compose-linux-x86_64 \
              -o "$HOME/.docker/cli-plugins/docker-compose"
            chmod 0755 "$HOME/.docker/cli-plugins/docker-compose"
            docker compose version
      - run:
          name: hadolint (Dockerfile.bioetl)
          command: |
            curl -fsSL --proto '=https' --tlsv1.2 \
              https://github.com/hadolint/hadolint/releases/download/v2.15.1/hadolint-Linux-x86_64 \
              -o "$HOME/.local/bin/hadolint"
            chmod 0755 "$HOME/.local/bin/hadolint"
            "$HOME/.local/bin/hadolint" Dockerfile.bioetl
      - run:
          name: docker compose config validation
          environment:
            # Interpolation only: these values never reach build/publish steps.
            COMPOSE_DISABLE_ENV_FILE: "1"
            NEO4J_PASSWORD: ci-compose-validation-placeholder
            GF_SECURITY_ADMIN_PASSWORD: ci-compose-validation-placeholder
            GF_RENDERING_RENDERER_TOKEN: ci-compose-validation-placeholder
          command: |
            docker compose config --quiet
            docker compose -f docker-compose.monitoring.yml config --quiet
      - run:
          name: docker build (Dockerfile.bioetl)
          command: docker build -f Dockerfile.bioetl -t bioetl:ci .

  # --- Aggregator (mirrors pr-gate-complete; stable name for future rulesets) -------
  pr-gate-complete:
    docker:
      - image: cimg/base:stable
    resource_class: small
    steps:
      - run:
          name: PR gate complete
          command: echo "All required CircleCI gates passed."

  composite-closeout:
    docker:
      - image: cimg/python:3.12
    resource_class: medium
    steps:
      - checkout
      - setup-python-uv:
          extras: "dev tracing docs"
      - run:
          name: "Scoped evidence for issues 11904 and 11905"
          command: |
            export PATH="$HOME/.local/bin:$PATH"
            export PYTHONPATH="$PWD/src:$PWD"
            export BIOETL_AI_RUNTIME=circleci BIOETL_AI_AGENT=composite-closeout BIOETL_AI_MEMORY_MODE=read-only
            export PYTEST_DISABLE_PLUGIN_AUTOLOAD=1
            uv run --frozen --no-build python - \<<'PY'
            import datetime, json, os, pathlib, subprocess, sys, time
            root = pathlib.Path.cwd()
            run_id = "issues-11904-11905-ci-" + os.environ["CIRCLE_BUILD_NUM"]
            folder = root / "reports/quality/proof-or-stop" / run_id
            folder.mkdir(parents=True, exist_ok=False)
            prefix = [sys.executable, "-m", "scripts.engineering.qa", "proof-or-stop"]
            common = ["--task-id", "issues-11904-11905", "--claim", "done", "--run-id", run_id]
            identity = ["--trust-tier", "ci", "--ci-run-id", os.environ["CIRCLE_BUILD_URL"]]
            subprocess.run(prefix + ["plan"] + common + ["--ci-run-id", os.environ["CIRCLE_BUILD_URL"]], check=True)
            paths = ['tests/unit/interfaces/http/test_composite_child_artifact.py', 'tests/integration/adapters/test_http_retry_semantics.py', 'tests/integration/infrastructure/storage/test_composite_checkpoint_writer.py', 'tests/integration/test_health_replay_production_bootstrap.py', 'tests/unit/application/services/lineage/test_composite_source_identity.py', 'tests/integration/test_composite_report.py', 'tests/unit/application/services/test_metadata_lineage_node_builders.py', 'tests/unit/composition/bootstrap/runtime/test_composite_bootstrap_builders.py', 'tests/unit/composition/bootstrap/runtime/test_composite_gold_dependencies.py', 'tests/unit/composition/bootstrap/runtime/test_runtime_basics.py', 'tests/unit/composition/bootstrap/test_health_replay_object_wiring.py', 'tests/unit/composition/factories/datasource/test_http_client_factory.py', 'tests/unit/domain/composite/test_composite_result.py', 'tests/unit/infrastructure/adapters/http/test_client_retry_mixin.py', 'tests/unit/infrastructure/adapters/http/test_request_timing.py', 'tests/unit/infrastructure/adapters/semanticscholar/test_batch_request_mixin.py', 'tests/unit/infrastructure/adapters/semanticscholar/test_fallback.py', 'tests/unit/infrastructure/storage/support/test_checkpoint_writer.py', 'tests/unit/infrastructure/storage/test_lineage_persistence.py', 'tests/unit/interfaces/cli/commands/test_composite_warning_result.py', 'tests/unit/interfaces/cli/commands/test_run_composite.py', 'tests/unit/interfaces/http/test_selected_run_status.py', 'tests/unit/interfaces/http/test_selected_run_unfinished_evidence.py', 'tests/unit/infrastructure/adapters/http/test_provider_scope.py', 'tests/unit/infrastructure/storage/test_composite_replay_inputs.py', 'tests/integration/composite/test_assay_snapshot_merge_replay.py', 'tests/unit/infrastructure/storage/test_composite_replay_bundle.py', 'tests/unit/interfaces/cli/test_cli_root_help_uniqueness.py', 'tests/unit/interfaces/cli/test_cli_main_module.py', 'tests/unit/application/composite/test_merger_metrics_mixin.py', 'tests/unit/application/composite/test_dependency_coordinator.py', 'tests/unit/application/composite/test_dependency_progress_tracker.py', 'tests/unit/application/composite/test_composite_activity.py', 'tests/unit/scripts/qa/test_report_debt_governance_gates.py', 'tests/unit/scripts/qa/test_report_architecture_debt_remote_main_baseline.py']
            checks = [
                ("tests", "test_health", [sys.executable, "-m", "pytest", "-o", "addopts=", "-p", "pytest_asyncio.plugin", "-p", "pytest_timeout", "-p", "respx.plugin", "-p", "pytest_cov.plugin", "-p", "_hypothesis_pytestplugin", *paths, "--no-cov", "-q", "--tb=short", "--junitxml=" + str(folder / "tests.xml")]),
                ("governance", "pretest_guardrails", ["bash", "scripts/engineering/dev/pretest_guardrails.sh", "--mode", "check", "--scope", "governance"]),
                ("docs_runtime", "docs_runtime_checks", [sys.executable, "-m", "scripts.docs", "verify"]),
                ("debt", "debt_governance_gates", [sys.executable, "-m", "scripts.engineering.qa", "report-debt-governance-gates", "--check"]),
            ]
            receipts = []
            for kind, producer, command in checks:
                started = datetime.datetime.now(datetime.UTC).isoformat()
                clock = time.monotonic()
                log = folder / (kind + ".log")
                with log.open("w") as stream:
                    result = subprocess.run(command, stdout=stream, stderr=subprocess.STDOUT)
                normalized = " ".join(["python", *command[1:]]) if command[0] == sys.executable else " ".join(command)
                output = folder / "receipts" / (kind + ".json")
                subprocess.run(prefix + ["receipt"] + common + identity + ["--receipt-id", kind, "--producer", producer, "--evidence-kind", kind, "--command", normalized, "--started-at", started, "--duration-ms", str(int((time.monotonic()-clock)*1000)), "--exit-code", str(result.returncode), "--status", "pass" if result.returncode == 0 else "fail", "--output-artifact", str(log), "--output", str(output)], check=True)
                receipts += ["--receipt", str(output)]
                print(kind, result.returncode, flush=True)
            subprocess.run(prefix + ["assemble"] + common + identity + ["--actor", "circleci", "--runtime", "circleci"] + receipts, check=True)
            result = subprocess.run(prefix + ["verify", "--bundle", str(folder / "bundle.json"), "--output", str(folder / "verification.json")])
            sys.exit(result.returncode)
            PY
      - store_test_results:
          path: reports/quality/proof-or-stop
      - store_artifacts:
          path: reports/quality/proof-or-stop
          destination: composite-closeout

workflows:
  version: 2
  pr-gate:
    when:
      equal: [pr-gate, << pipeline.parameters.ci-lane >>]
    jobs:
      - composite-closeout:
          filters:
            branches:
              only: /codex\/issues-11904-11905-closeout/
      - classify
      - lint-ruff:
          requires: [classify]
      - lint-arch:
          requires: [classify]
      - arch-tests:
          requires: [classify]
      - mypy:
          requires: [classify]
      - dependency-lock:
          requires: [classify]
      - test-fast:
          requires: [classify]
          matrix:
            parameters:
              test-group:
                - "unit-domain|tests/unit/domain/"
                - "unit-application|tests/unit/application/"
                - "unit-infrastructure|tests/unit/infrastructure/"
                - "unit-other|tests/unit/ --ignore=tests/unit/domain/ --ignore=tests/unit/application/ --ignore=tests/unit/infrastructure/ --ignore=tests/unit/scripts/ --ignore=tests/unit/repo_backed/"
      - test-integration:
          requires: [classify]
          matrix:
            parameters:
              test-group:
                - "unit-domain|tests/unit/domain/|-n auto --dist loadscope"
                - "unit-application|tests/unit/application/|-n auto --dist loadscope"
                - "unit-infrastructure|tests/unit/infrastructure/|-n auto --dist loadscope"
                - "unit-other|tests/unit/ --ignore=tests/unit/domain/ --ignore=tests/unit/application/ --ignore=tests/unit/infrastructure/ --ignore=tests/unit/scripts/ --ignore=tests/unit/repo_backed/|-n auto --dist loadscope"
                - "integration|tests/integration/|-p no:xdist"
                - "security|tests/security/|-n auto --dist loadscope"
      - dq-consistency:
          requires: [classify]
      - root-hygiene:
          requires: [classify]
      - compiled-artifacts:
          requires: [classify]
      - security-scans:
          requires: [classify]
      - duplication:
          requires: [classify]
      - schema-governance:
          requires: [classify]
      - commit-lint:
          requires: [classify]
      - docs-governance:
          requires: [classify]
      - docker-build:
          requires: [classify]
      - pr-gate-complete:
          requires:
            - lint-ruff
            - lint-arch
            - arch-tests
            - mypy
            - dependency-lock
            - test-fast
            - test-integration
            - dq-consistency
            - root-hygiene
            - compiled-artifacts
            - security-scans
            - duplication
            - schema-governance
            - commit-lint
            - docs-governance
            - docker-build
  docs-kpi:
    when:
      and:
        - equal: [docs-kpi, << pipeline.parameters.ci-lane >>]
        - equal: [main, << pipeline.git.branch >>]
    jobs:
      - docs-kpi
  memory-retention:
    when:
      and:
        - equal: [memory-retention, << pipeline.parameters.ci-lane >>]
        - equal: [main, << pipeline.git.branch >>]
    jobs:
      - memory-retention
  port-contracts:
    when:
      and:
        - equal: [port-contracts, << pipeline.parameters.ci-lane >>]
        - equal: [main, << pipeline.git.branch >>]
    jobs:
      - port-contracts
  skills-consistency:
    when:
      and:
        - equal: [skills-consistency, << pipeline.parameters.ci-lane >>]
        - equal: [main, << pipeline.git.branch >>]
    jobs:
      - skills-consistency
  github-settings-review:
    when:
      and:
        - equal: [github-settings-review, << pipeline.parameters.ci-lane >>]
        - equal: [main, << pipeline.git.branch >>]
    jobs:
      - github-settings-review:
          context: bioetl-github-read-only
  performance:
    when:
      and:
        - equal: [performance, << pipeline.parameters.ci-lane >>]
        - equal: [main, << pipeline.git.branch >>]
    jobs:
      - performance
  replay-parity:
    when:
      and:
        - equal: [replay-parity, << pipeline.parameters.ci-lane >>]
        - equal: [main, << pipeline.git.branch >>]
    jobs:
      - replay-parity
  memory-freshness:
    when:
      and:
        - equal: [memory-freshness, << pipeline.parameters.ci-lane >>]
        - equal: [main, << pipeline.git.branch >>]
    jobs:
      - memory-freshness

  mutation:
    when:
      and:
      - equal:
        - mutation
        - << pipeline.parameters.ci-lane >>
      - equal:
        - main
        - << pipeline.git.branch >>
      - equal:
        - schedule
        - << pipeline.trigger.type >>
    jobs:
    - mutation-testing:
        name: mutation-domain
        target: domain
        source-path: src/bioetl/domain/
        tests-dir: tests/unit/domain/
        threshold: '70.0'
    - mutation-testing:
        name: mutation-application-control-plane
        target: application-control-plane
        source-path: src/bioetl/application/services/control_plane/
        tests-dir: tests/unit/application/services/control_plane/
        threshold: '60.0'
    - mutation-testing:
        name: mutation-application-export-manifests
        target: application-export-manifests
        source-path: src/bioetl/application/services/export_lineage/export_manifests.py
        tests-dir: tests/unit/application/services/
        threshold: '60.0'
    - mutation-testing:
        name: mutation-application-workflow-runner
        target: application-workflow-runner
        source-path: src/bioetl/application/services/workflow/workflow_runner_support.py
        tests-dir: tests/unit/repo_backed/application/services/test_workflow_runner_service.py
        threshold: '60.0'
