          - proof-coverage
          - arch-tests
          filters: *id001
      - proof-closeout:
          requires:
          - arch-tests
          - docs-governance
          - proof-governance
          - proof-debt
          - proof-quality
          filters: *id001
      - proof-coverage-shard:
          matrix:
            alias: proof-coverage-shards
            parameters:
              group:
