workflows:
  retained-actions-online:
    when:
      and:
        - equal: [pr-gate, << pipeline.parameters.ci-lane >>]
        - equal: [main, << pipeline.git.branch >>]
    jobs:
      - actions-audit:
          name: actions-audit-online
          online: true
          context: bioetl-github-read-only
          filters:
            branches:
              only: main

  # Image parity stays on workflow router-bridge (ci-lane=router-bridge).
  # pr-gate does not start the large router-host-build executor.
  router-bridge-events:
    when:
      equal:
      - pr-gate
      - << pipeline.parameters.ci-lane >>
    jobs:
    - router-bridge-tests:
        event-mode: true
    - router-plugin-tests:
        event-mode: true
        matrix:
          parameters:
            plugin:
            - bioetl-scenes-app
            - bioetl-selectorshell-panel

  router-bridge:
    when:
      and:
      - equal:
        - router-bridge
        - << pipeline.parameters.ci-lane >>
      - equal:
        - main
        - << pipeline.git.branch >>
      - not:
          equal: [scheduled_pipeline, << pipeline.trigger_source >>]
    jobs:
    - router-bridge-tests
    - router-plugin-tests:
        matrix:
          parameters:
            plugin:
            - bioetl-scenes-app
            - bioetl-selectorshell-panel
    - router-host-build:
        requires:
        - router-plugin-tests
  version: 2
  docker-baseline:
    when:
      and:
        - equal: [docker-baseline, << pipeline.parameters.ci-lane >>]
        - equal: [main, << pipeline.git.branch >>]
        - not:
            equal: [scheduled_pipeline, << pipeline.trigger_source >>]
    jobs:
      - docker-security-baseline:
          context: bioetl-github-read-only
  docker-publish:
    when:
      and:
        - equal: [docker-publish, << pipeline.parameters.ci-lane >>]
        - equal: [main, << pipeline.git.branch >>]
        - not:
            equal: [scheduled_pipeline, << pipeline.trigger_source >>]
    jobs:
      - docker-security-baseline:
          context: bioetl-github-read-only
      - docker-publish-approval:
          type: approval
          requires:
            - docker-security-baseline
      - docker-publish:
          context: bioetl-ghcr-publish
          serial-group: 9f037fd7-4fd9-41af-9916-33ca1e56cf7b/docker-publication
          requires:
            - docker-publish-approval
  # Temporary #11931 measurement: remove after branch baseline adoption.
  # https://github.com/SatoryKono/BioactivityDataAcquisition/issues/11931
  migration-coverage-closeout:
    when:
