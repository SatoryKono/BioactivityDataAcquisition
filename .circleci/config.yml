version: 2.1
jobs:
  forbidden-context-probe:
    docker:
      - image: cimg/base:2026.10
    resource_class: small
    steps:
      - run:
          name: Context isolation failed if this step executes
          command: |
            echo "CONTEXT_BOUNDARY_BROKEN: unexpected execution on an untrusted branch"
            exit 91
workflows:
  context-boundary-negative:
    jobs:
      - forbidden-context-probe:
          name: deny-ghcr-context
          context: bioetl-ghcr-publish
      - forbidden-context-probe:
          name: deny-sarif-context
          context: bioetl-security-events-write
      - forbidden-context-probe:
          name: deny-read-only-context
          context: bioetl-github-read-only
