  release-validation-complete:
    docker:
      - image: cimg/python:3.13
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/bioetl-release
      - run:
          name: Record verified release preflight without a publication claim
          command: |
            python3 - \<<'PY'
            import json, os, urllib.request
            from pathlib import Path
            root = Path('/tmp/bioetl-release')
            identity = json.loads((root / 'identity.json').read_text())
            assert os.environ['CIRCLE_BRANCH'] == 'main'
            assert identity['source_sha'] == os.environ['CIRCLE_SHA1'] and identity['workflow_id'] == os.environ['CIRCLE_WORKFLOW_ID']
            with urllib.request.urlopen('https://circleci.com/api/v2/workflow/' + identity['workflow_id'] + '/job', timeout=30) as response:
                payload = json.load(response)
            assert not payload.get('next_page_token'), 'Unexpected workflow pagination'
            jobs = payload['items']
            required = {'release-dist-build', 'release-install', 'release-tests', 'security-scans'}
            accepted = [job for job in jobs if job['name'] in required]
            assert len(accepted) == len(required) and {job['name'] for job in accepted} == required
            assert all(job['status'] == 'success' for job in accepted)
            assert str(next(job for job in accepted if job['name'] == 'release-dist-build')['job_number']) == str(identity['job_number'])
            receipt = {'source_sha': identity['source_sha'], 'workflow_id': identity['workflow_id'], 'distribution_validation': 'passed', 'published': False, 'publication_ready': False, 'sbom_sha256': identity['sbom_sha256'], 'pending': ['signed provenance', 'protected TestPyPI/PyPI promotion', 'release assets'], 'jobs': {job['name']: job['job_number'] for job in accepted}}
            (root / 'validation.json').write_text(json.dumps(receipt, sort_keys=True) + '\n', encoding='utf-8')
            PY
      - store_artifacts:
          path: /tmp/bioetl-release/validation.json
          destination: release-validation

  scorecard-analysis:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    steps:
      - checkout
      - run:
          name: Pinned OpenSSF Scorecard informational analysis
          no_output_timeout: 16m
          command: |
            set -euo pipefail
            set +x
            test "$CIRCLE_BRANCH" = main
            test "$(git rev-parse HEAD)" = "$CIRCLE_SHA1"
            : "${GITHUB_TOKEN:?Missing read-only GitHub credential}"
            export GITHUB_AUTH_TOKEN="$GITHUB_TOKEN"
            timeout --signal=TERM --kill-after=30s 15m bash -euo pipefail -c '
              umask 077
              mkdir -p /home/circleci/bioetl-scorecard/tools /home/circleci/bioetl-scorecard/reports
              curl --fail --location --retry 3 https://github.com/ossf/scorecard/releases/download/v5.5.0/scorecard_5.5.0_linux_amd64.tar.gz -o /home/circleci/bioetl-scorecard/scorecard.tar.gz
              echo "83b90a05c1540ef1390db1cd5711e5fd04be9c1d8537fb84d39d02092d6a8dff  /home/circleci/bioetl-scorecard/scorecard.tar.gz" | sha256sum --check -
              tar -xzf /home/circleci/bioetl-scorecard/scorecard.tar.gz -C /home/circleci/bioetl-scorecard/tools scorecard
              curl --fail --location --retry 3 https://raw.githubusercontent.com/ossf/scorecard-action/2d1146689b8cda280b9bc96326124645441f03bc/policies/template.yml -o /home/circleci/bioetl-scorecard/reports/policy.yml
              echo "6e75dcc0df989d333492c0e1f6e484fc5b4d26ab768333ddcd0e3788539689b0  /home/circleci/bioetl-scorecard/reports/policy.yml" | sha256sum --check -
              /home/circleci/bioetl-scorecard/tools/scorecard --repo=github.com/SatoryKono/BioactivityDataAcquisition --format=json --show-details --output=/home/circleci/bioetl-scorecard/reports/results.json
              ENABLE_SARIF=true /home/circleci/bioetl-scorecard/tools/scorecard --repo=github.com/SatoryKono/BioactivityDataAcquisition --format=sarif --show-details --policy=/home/circleci/bioetl-scorecard/reports/policy.yml --output=/home/circleci/bioetl-scorecard/reports/results.raw.sarif
            '
            python3 - \<<'PY'
            import json, os
            from pathlib import Path
            path = Path('/home/circleci/bioetl-scorecard/reports/results.json')
            result = json.loads(path.read_text(encoding='utf-8'))
            assert result['repo']['commit'] == os.environ['CIRCLE_SHA1'], 'Default branch changed during analysis'
            assert result['repo']['name'] == 'github.com/SatoryKono/BioactivityDataAcquisition'
            assert result['scorecard']['version'] == 'v5.5.0'
            expected = {'Binary-Artifacts', 'Branch-Protection', 'CI-Tests', 'CII-Best-Practices', 'Code-Review', 'Contributors', 'Dangerous-Workflow', 'Dependency-Update-Tool', 'Fuzzing', 'License', 'Maintained', 'Packaging', 'Pinned-Dependencies', 'SAST', 'Security-Policy', 'Signed-Releases', 'Token-Permissions', 'Vulnerabilities'}
            checks = result['checks']
            assert len(checks) == len(expected) and {row['name'] for row in checks} == expected
            assert all(isinstance(row['score'], int) and -1 <= row['score'] <= 10 and isinstance(row['reason'], str) for row in checks)
            import urllib.request
            request = urllib.request.Request('https://api.github.com/repos/SatoryKono/BioactivityDataAcquisition/git/ref/heads/main', headers={'Authorization': 'Bearer ' + os.environ['GITHUB_TOKEN'], 'Accept': 'application/vnd.github+json'})
            with urllib.request.urlopen(request, timeout=30) as response:
                assert json.load(response)['object']['sha'] == os.environ['CIRCLE_SHA1'], 'Main changed during SARIF analysis'
            sarif = json.loads(path.with_name('results.raw.sarif').read_text(encoding='utf-8'))
            assert sarif['version'] == '2.1.0' and sarif['runs']
            from urllib.parse import quote
            for run in sarif['runs']:
                # Upstream project-wide findings use a placeholder containing spaces.
                # Preserve its value as a valid URI reference for GitHub's strict parser.
                for finding in run.get('results', []):
                    for location in finding.get('locations', []):
                        artifact = location.get('physicalLocation', {}).get('artifactLocation', {})
                        if 'uri' in artifact:
                            artifact['uri'] = quote(artifact['uri'], safe="/:#?&=%@[]!$'()*+,;~-._")
                assert run['tool']['driver']['name'] == 'Scorecard'
                assert run['tool']['driver']['semanticVersion'] == 'v5.5.0'
                run['tool']['driver']['semanticVersion'] = '5.5.0'
                run['versionControlProvenance'] = [{'repositoryUri': 'https://github.com/SatoryKono/BioactivityDataAcquisition', 'revisionId': os.environ['CIRCLE_SHA1'], 'branch': 'main'}]
            path.with_name('results.sarif').write_text(json.dumps(sarif, sort_keys=True) + '\n', encoding='utf-8')
            # Scores and unsupported checks stay visible; the legacy lane is informational.
            identity = {'source_sha': os.environ['CIRCLE_SHA1'], 'workflow_id': os.environ['CIRCLE_WORKFLOW_ID'], 'job_number': os.environ['CIRCLE_BUILD_NUM'], 'check_count': len(checks), 'sarif_uploaded': False, 'public_results_published': False}
            import hashlib
            identity['sha256'] = {name: hashlib.sha256(path.with_name(name).read_bytes()).hexdigest() for name in ('results.json', 'results.sarif')}
            path.with_name('identity.json').write_text(json.dumps(identity, sort_keys=True) + '\n', encoding='utf-8')
            PY
      - persist_to_workspace:
          root: /home/circleci/bioetl-scorecard
          paths:
            - reports
      - store_artifacts:
          path: /home/circleci/bioetl-scorecard/reports
          destination: scorecard-analysis

