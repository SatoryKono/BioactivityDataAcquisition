        - not:
            equal: [scheduled_pipeline, << pipeline.trigger_source >>]
    jobs:
      - branch-hygiene:
          context: bioetl-github-read-only
  pr-gate:
    when:
      equal: [pr-gate, << pipeline.parameters.ci-lane >>]
    jobs:
      - composite-closeout:
          filters:
            branches:
              only: /codex\/issues-11904-11905-closeout/
      - classify
      - lint-ruff:
          requires: [classify]
      - lint-arch:
          requires: [classify]
      - arch-tests:
          requires: [classify]
      - mypy:
          requires: [classify]
      - dependency-lock:
          requires: [classify]
      - test-fast:
          requires: [classify]
          matrix:
            parameters:
              test-group:
                - "unit-domain|tests/unit/domain/"
                - "unit-application|tests/unit/application/"
                - "unit-infrastructure|tests/unit/infrastructure/"
                - "unit-other|tests/unit/ --ignore=tests/unit/domain/ --ignore=tests/unit/application/ --ignore=tests/unit/infrastructure/ --ignore=tests/unit/scripts/ --ignore=tests/unit/repo_backed/"
      - test-integration:
          requires: [classify]
          matrix:
            parameters:
              test-group:
                - "integration|tests/integration/|-p no:xdist"
                - "security|tests/security/|-n auto --dist loadscope"
      - dq-consistency:
          requires: [classify]
      - root-hygiene:
          requires: [classify]
      - compiled-artifacts:
          requires: [classify]
      - security-scans:
          requires: [classify]
      - actions-audit:
          requires: [classify]
      - docs-diagrams:
          name: docs-diagram-syntax
          mode: syntax
          requires: [classify]
      - docs-diagrams:
          name: docs-diagram-targeted
          mode: targeted
          requires: [classify]
      - docs-diagrams:
          name: docs-diagram-drift
          mode: drift
          requires: [classify]
      - duplication:
          requires: [classify]
      - schema-governance:
          requires: [classify]
      - semantic-governance:
          requires: [classify]
      - commit-lint:
          requires: [classify]
      - docs-governance:
          requires: [classify]
      - docker-build:
          requires: [classify]
      # Retain the legacy PR/push checks without credentials or nightly heavy jobs.
      - port-contracts:
          requires: [classify]
      - provider-contract-drift:
          requires: [classify]
      - memory-freshness:
          requires: [classify]
      - skills-consistency:
          requires: [classify]
      - e2e-matrix-replay:
