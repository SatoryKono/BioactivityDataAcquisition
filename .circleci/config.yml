# CircleCI config v2 â€” PR gates port (phase 2, 03.10.2026)
# Repo: SatoryKono/BioactivityDataAcquisition
# Mirrors .github/workflows/pr-required.yml: the `classify` job runs the repo's own
# decision-matrix classifier (scripts/engineering/ci pr-gate classify); each gate job
# reads the matrix from the workspace and halts early when not_applicable.
# 8 gates are always_required in the catalog; 4 are path_scoped (docker,
# generated-artifacts, commit-governance, docs-governance).
# NOT ported (GitHub-native): codeql, dependency-review, labeler, stale.
# Deploy: replace .circleci/config.yml at repo root, commit, push.
version: 2.1

commands:
  # Port of .github/actions/setup-python-uv (uv 0.11.26, uv cache, uv sync).
  setup-python-uv:
    description: "Install uv, restore cache, sync deps (port of GH composite action)"
    parameters:
      python-version:
        type: string
        default: "3.12"
      extras:
        type: string
        default: "dev tracing"
    steps:
      - run:
          name: Install uv 0.11.26
          command: |
            curl -LsSf https://astral.sh/uv/install.sh | sh
            echo 'export PATH="$HOME/.local/bin:$PATH"' >> "$BASH_ENV"
            "$HOME/.local/bin/uv" --version
      - restore_cache:
          name: Restore uv cache
          keys:
            - uv-v1-{{ checksum "uv.lock" }}-py<< parameters.python-version >>
      - run:
          name: Sync dependencies
          command: |
            export PATH="$HOME/.local/bin:$PATH"
            export UV_CACHE_DIR="$HOME/.cache/uv"
            CMD="uv sync --frozen"
            for extra in << parameters.extras >>; do CMD="$CMD --extra $extra"; done
            echo "Running: $CMD"
            $CMD
      - save_cache:
          name: Save uv cache
          key: uv-v1-{{ checksum "uv.lock" }}-py<< parameters.python-version >>
          paths:
            - ~/.cache/uv

  # Reads the decision matrix produced by `classify`; ends the job as success
  # without running the gate when the catalog says not_applicable.
  check-gate:
    description: "Halt job early when the gate decision is not_applicable"
    parameters:
      gate:
        type: string
    steps:
      - attach_workspace:
          at: /tmp/cci-ws
      - run:
          name: Check gate decision (<< parameters.gate >>)
          command: |
            DECISION=$(python3 -c "import json; print(json.load(open('/tmp/cci-ws/pr-gate-decisions.json'))['decisions']['<< parameters.gate >>']['decision'])")
            echo "gate << parameters.gate >> decision: $DECISION"
            if [ "$DECISION" != "required" ]; then
              echo "Gate not applicable for this change set â€” skipping."
              circleci-agent step halt
            fi

jobs:
  # Mirrors pr-required.yml `classify-changes`: runs the repo's own classifier
  # against the canonical catalog. On main/master pushes all gates are required
  # (fail-closed); on branches the matrix is computed from merge-base...HEAD.
  classify:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    steps:
      - checkout
      - setup-python-uv
      - run:
          name: Classify changes (decision matrix)
          command: |
            export PATH="$HOME/.local/bin:$PATH"
            HEAD_SHA="$CIRCLE_SHA1"
            if [ "$CIRCLE_BRANCH" = "main" ] || [ "$CIRCLE_BRANCH" = "master" ]; then
              echo "Default-branch push: all gates required (fail-closed)."
              python3 - "$HEAD_SHA" \<<'EOF' > /tmp/pr-gate-decisions.json
            import json, sys
            head = sys.argv[1]
            gates = ["lint-arch","tests","type-checking","security","codeql","docker",
                     "duplication","root-hygiene","generated-artifacts","compiled-artifacts",
                     "commit-governance","docs-governance"]
            print(json.dumps({"schema_version": 1, "config_version": 2, "head_sha": head,
                              "decisions": {g: {"decision": "required", "reason": "default_branch_push"} for g in gates},
                              "changed_files": [], "unclassified_files": []}, indent=2))
            EOF
            else
              git fetch --no-tags origin main:refs/remotes/origin/main
              BASE_SHA="$(git merge-base origin/main "$HEAD_SHA")"
              echo "Classifying $BASE_SHA...$HEAD_SHA"
              uv run --frozen --no-build python -m scripts.engineering.ci pr-gate classify \
                --catalog configs/quality/github_required_checks.yaml \
                --event-name pull_request \
                --base-sha "$BASE_SHA" \
                --head-sha "$HEAD_SHA" \
                --artifact /tmp/pr-gate-decisions.json
            fi
            cp /tmp/pr-gate-decisions.json ./pr-gate-decisions.json
            python3 -c "
            import json
            d = json.load(open('/tmp/pr-gate-decisions.json'))
            for k, v in d['decisions'].items(): print(f'{k} = {v[\"decision\"]} ({v[\"reason\"]})')"
      - persist_to_workspace:
          root: /tmp
          paths:
            - pr-gate-decisions.json
      - store_artifacts:
          path: pr-gate-decisions.json

  # --- Gate: lint-arch (always_required) -------------------------------------
  # Mirrors import-linter.yml `lint` (ruff staged profiles + format + isort).
  lint-ruff:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    steps:
      - checkout
      - setup-python-uv
      - run:
          name: "ruff check (Makefile gate: src tests scripts)"
          command: |
            export PATH="$HOME/.local/bin:$PATH"
            uv run --frozen ruff check src tests scripts

  lint-arch:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    steps:
      - checkout
      - setup-python-uv
      - run:
          name: ruff staged profiles + format + isort
          command: |
            export PATH="$HOME/.local/bin:$PATH"
            uv run --frozen --no-build ruff check src/bioetl/domain --output-format=github
            uv run --frozen --no-build ruff check src/bioetl/application --output-format=github
            uv run --frozen --no-build ruff check src/bioetl/infrastructure --output-format=github
            uv run --frozen --no-build ruff format --check src tests
            uv run --frozen --no-build ruff check --select I src tests --output-format=github

  # Mirrors import-linter.yml `arch-tests` (canonical selector from catalog).
  arch-tests:
    docker:
      - image: cimg/python:3.12
    resource_class: medium
    steps:
      - checkout
      - setup-python-uv
      - run:
          name: architecture tests
          command: |
            export PATH="$HOME/.local/bin:$PATH"
            mkdir -p reports/test-telemetry
            HYPOTHESIS_PROFILE=fast \
            uv run --frozen --no-build pytest tests/architecture \
              -m "not slow and not benchmark and not memory" \
              -q --tb=short --no-cov \
              --junitxml=reports/test-telemetry/junit-arch.xml
      - store_test_results:
          path: reports/test-telemetry

  # --- Gate: type-checking (always_required) ----------------------------------
  # Mirrors type-checking.yml `type-check` (mypy --strict, 30m budget).
  mypy:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    steps:
      - checkout
      - setup-python-uv
      - run:
          name: mypy strict gate (src/bioetl + src/memory)
          no_output_timeout: 35m
          command: |
            export PATH="$HOME/.local/bin:$PATH"
            mkdir -p reports
            rm -rf .mypy_cache
            set +e
            timeout --signal=TERM --kill-after=30s 30m \
              uv run --frozen --no-build mypy --config-file pyproject.toml --strict --no-incremental src/bioetl src/memory \
              2>&1 | tee reports/mypy_strict.log
            status=${PIPESTATUS[0]}
            set -e
            if [ "$status" -eq 124 ]; then echo "mypy strict gate timed out after 30 minutes"; exit 1; fi
            exit "$status"
      - store_artifacts:
          path: reports/mypy_strict.log

  # --- Gate: tests (always_required) ------------------------------------------
  dependency-lock:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    steps:
      - checkout
      - setup-python-uv
      - run:
          name: uv lock --check (no drift)
          command: |
            export PATH="$HOME/.local/bin:$PATH"
            uv lock --check

  # Mirrors tests.yml `test-fast` (4 unit groups, fast markers, no xdist).
  # NOTE: CircleCI matrix is a cartesian product, so name+path are packed into
  # one parameter and split in the step.
  test-fast:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    parameters:
      test-group:
        type: string
        default: "unit-domain|tests/unit/domain/"
    steps:
      - checkout
      - setup-python-uv
      - run:
          name: pytest fast lane (<< parameters.test-group >>)
          command: |
            export PATH="$HOME/.local/bin:$PATH"
            GROUP="<< parameters.test-group >>"
            NAME="${GROUP%%|*}"; PATHS="${GROUP#*|}"
            mkdir -p reports/test-telemetry
            HYPOTHESIS_PROFILE=fast \
            uv run --frozen --no-build pytest $PATHS \
              -m "not fs_contract and not repo_backed and not subprocess_backed and not slow and not benchmark and not memory" \
              -p no:xdist \
              -q --tb=short \
              --junitxml="reports/test-telemetry/junit-fast.${NAME}.xml"
      - store_test_results:
          path: reports/test-telemetry

  # Mirrors tests.yml `test-matrix` (6 groups; unit groups with xdist, integration serial).
  test-integration:
    environment:
      PYTEST_XDIST_AUTO_NUM_WORKERS: "2"
    docker:
      - image: cimg/python:3.13
    resource_class: small
    parameters:
      test-group:
        type: string
        default: "integration|tests/integration/|-p no:xdist"
    steps:
      - checkout
      - setup-python-uv:
          python-version: "3.13"
      - run:
          name: pytest matrix lane (<< parameters.test-group >>)
          command: |
            export PATH="$HOME/.local/bin:$PATH"
            GROUP="<< parameters.test-group >>"
            NAME="${GROUP%%|*}"; REST="${GROUP#*|}"
            PATHS="${REST%%|*}"; XDIST="${REST#*|}"
            mkdir -p reports/test-telemetry
            uv run --frozen --no-build pytest $PATHS \
              -m "not serial and not memory and not fs_contract and not subprocess_backed" \
              $XDIST \
              -q --tb=short \
              --junitxml="reports/test-telemetry/junit.${NAME}.xml"
      - store_test_results:
          path: reports/test-telemetry

  # Mirrors tests.yml `dq-consistency-gate`.
  dq-consistency:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    steps:
      - checkout
      - setup-python-uv
      - run:
          name: DQ consistency validation
          command: |
            export PATH="$HOME/.local/bin:$PATH"
            uv run --frozen --no-build python -m scripts.engineering.qa validate-dq-consistency

  # --- Gate: root-hygiene (always_required) ------------------------------------
  # Mirrors root-hygiene.yml `root-hygiene` (essential checks).
  root-hygiene:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    steps:
      - checkout
      - setup-python-uv
      - run:
          name: root allowlist + governance checks
          command: |
            export PATH="$HOME/.local/bin:$PATH"
            uv run --frozen --no-build python -m scripts.engineering.repo check-cleanliness --strict-untracked --check-local-forbidden-outputs
            uv run --frozen --no-build python -m scripts.engineering.repo check-cleanup-governance
            uv run --frozen --no-build python -m scripts.engineering.repo check-root-governance-docs
            uv run --frozen --no-build python -m scripts.engineering.repo check-root-review-registry

  # --- Gate: compiled-artifacts (always_required) -------------------------------
  # Mirrors compiled-artifacts-block.yml `no-pyc-check`.
  compiled-artifacts:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    steps:
      - checkout
      - setup-python-uv
      - run:
          name: no tracked compiled artifacts
          command: |
            export PATH="$HOME/.local/bin:$PATH"
            set -e
            if git ls-files | grep -E '\.pyc$|__pycache__/' ; then
              echo "ERROR: tracked compiled Python artifacts found"; exit 1
            fi
            echo "No tracked .pyc / __pycache__ entries."
            uv run --frozen --no-build python -m scripts.engineering.repo check-cleanliness

  # --- Gate: security (always_required) -----------------------------------------
  # Mirrors security.yml (detect-secrets, pip-audit, bandit, gitleaks, osv-scanner).
  security-scans:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    steps:
      - checkout
      - setup-python-uv
      - run:
          name: detect-secrets (no hardcoded secrets)
          command: |
            export PATH="$HOME/.local/bin:$PATH"
            uv run --frozen --no-build pytest tests/architecture/test_antipatterns.py::test_no_hardcoded_secrets -q
      - run:
          name: pip-audit (strict)
          command: |
            export PATH="$HOME/.local/bin:$PATH"
            export UV_CACHE_DIR=/tmp/.uv-cache
            uv export --frozen --no-hashes --no-emit-project --all-extras > /tmp/pip-audit-requirements.txt
            uv run --frozen --no-build pip-audit --strict \
              -r /tmp/pip-audit-requirements.txt --cache-dir /tmp/.pip-audit-cache
      - run:
          name: bandit (src/bioetl)
          command: |
            export PATH="$HOME/.local/bin:$PATH"
            uv run --frozen --no-build bandit -c pyproject.toml -r src/bioetl
      - run:
          name: gitleaks (binary v8.30.1)
          command: |
            curl -fsSL --proto '=https' --tlsv1.2 \
              https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
              -o /tmp/gitleaks.tar.gz
            mkdir -p "$HOME/.local/bin" && tar -xzf /tmp/gitleaks.tar.gz -C "$HOME/.local/bin" gitleaks
            "$HOME/.local/bin/gitleaks" detect --config .gitleaks.toml --no-git -v
      - run:
          name: osv-scanner (binary v2.6.0, lockfiles)
          command: |
            curl -fsSL --proto '=https' --tlsv1.2 \
              https://github.com/google/osv-scanner/releases/download/v2.6.0/osv-scanner_linux_amd64 \
              -o "$HOME/.local/bin/osv-scanner"
            chmod 0755 "$HOME/.local/bin/osv-scanner"
            "$HOME/.local/bin/osv-scanner" \
              --lockfile=uv.lock \
              --lockfile=package-lock.json \
              --lockfile=.github/actions/setup-mermaid/package-lock.json \
              --lockfile=.github/tooling/jscpd/package-lock.json \
              --lockfile=scripts/ai/gemini/npm-tooling/package-lock.json \
              --lockfile=grafana/plugins/bioetl-scenes-app/package-lock.json \
              --lockfile=grafana/plugins/bioetl-selectorshell-panel/package-lock.json \
              --lockfile=grafana/tooling/router-v7-bridge/package-lock.json \
              --format=json --output-file=osv-results.json || true
            export PATH="$HOME/.local/bin:$PATH"
            uv run --frozen --no-build python -m scripts.engineering.repo.check_github_actions_runtime_policy --osv-json osv-results.json
      - store_artifacts:
          path: osv-results.json

  # --- Gate: duplication (always_required) ---------------------------------------
  # Mirrors duplication-complexity.yml (radon + jscpd).
  duplication:
    docker:
      - image: cimg/python:3.12-node
    resource_class: medium
    steps:
      - checkout
      - setup-python-uv
      - run:
          name: radon complexity (CC <= 10; domain <= 5)
          command: |
            export PATH="$HOME/.local/bin:$PATH"
            mkdir -p reports
            uv run --frozen --no-build radon cc src tests -a -s > reports/radon_cc.txt
            uv run --frozen --no-build python -m scripts.engineering.qa check-duplication-complexity-exemptions
      - run:
          name: jscpd duplication detection
          command: |
            set -euo pipefail
            export NODE_OPTIONS="--max-old-space-size=3072"
            mkdir -p reports/jscpd
            npm ci --ignore-scripts --no-fund --no-audit --prefix "$PWD/.github/tooling/jscpd"
            "$PWD/.github/tooling/jscpd/node_modules/.bin/jscpd" \
              "$PWD/src" "$PWD/tests" \
              --config "$PWD/.jscpd.json" \
              --threshold 10 --format python \
              --output "$PWD/reports/jscpd"

  # --- Gate: generated-artifacts (path_scoped) ------------------------------------
  # Mirrors schema-governance.yml (generated schema artifacts + parity).
  schema-governance:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    steps:
      - checkout
      - setup-python-uv
      - check-gate:
          gate: generated-artifacts
      - run:
          name: schema artifacts + parity
          command: |
            export PATH="$HOME/.local/bin:$PATH"
            uv run --frozen --no-build python -m scripts.schema generate-artifacts --check
            uv run --frozen --no-build python -m scripts.schema verify-schema-parity --mode blocking

  # --- Gate: commit-governance (path_scoped) ---------------------------------------
  # Mirrors commit-lint.yml (conventional commits on the PR range).
  commit-lint:
    docker:
      - image: cimg/python:3.12-node
    resource_class: small
    steps:
      - checkout
      - check-gate:
          gate: commit-governance
      - run:
          name: commitlint on PR range
          command: |
            git fetch --no-tags origin main:refs/remotes/origin/main
            BASE="$(git merge-base origin/main HEAD)"
            npx --yes @commitlint/cli --config commitlint.config.mjs \
              --from "$BASE" --to HEAD --verbose

  # --- Gate: docs-governance (path_scoped) ------------------------------------------
  # Mirrors docs.yml (docs-governance + validate-mkdocs essentials).
  docs-governance:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    steps:
      - checkout
      - setup-python-uv:
          extras: dev tracing docs
      - check-gate:
          gate: docs-governance
      - run:
          name: docs governance checks
          command: |
            export PATH="$HOME/.local/bin:$PATH"
            uv run --frozen --no-build python -m scripts.diagrams generate-dataflows --pipeline chembl_activity --check
            uv run --frozen --no-build python -m scripts.docs passports check
            uv run --frozen --no-build python -m scripts.engineering.qa check-xwalk-missing-backlog
            uv run --frozen --no-build python -m scripts.engineering.qa report-dashboard-inventory --check --json
            uv run --frozen --no-build python -m scripts.engineering.repo check-versions
            uv run --frozen --no-build python -m scripts.docs check-links --report-json reports/docs-link-check-report.json
            uv run --frozen --no-build python -m scripts.docs verify --skip-links
            uv run --frozen --no-build python scripts/diagrams/render/generate_description_indexes.py --check

  # --- Gate: docker (path_scoped) ----------------------------------------------------
  # Mirrors docker.yml validation part only (lint + compose + build). No push, no
  # Trivy baseline here â€” image security baseline stays a phase-3 item.
  docker-build:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    steps:
      - checkout
      - check-gate:
          gate: docker
      - setup_remote_docker:
          version: default
      - run:
          name: Install Docker CLI (not bundled in cimg/python)
          command: |
            if ! command -v docker >/dev/null 2>&1; then
              curl -fsSL --proto '=https' --tlsv1.2 \
                https://download.docker.com/linux/static/stable/x86_64/docker-27.3.1.tgz \
                -o /tmp/docker.tgz
              tar -xzf /tmp/docker.tgz -C /tmp
              (sudo mv /tmp/docker/docker /usr/local/bin/ 2>/dev/null || mv /tmp/docker/docker "$HOME/.local/bin/")
              echo 'export PATH="/usr/local/bin:$HOME/.local/bin:$PATH"' >> "$BASH_ENV"
            fi
            docker version
      - run:
          name: Install Docker Compose plugin v5.6.0
          command: |
            mkdir -p "$HOME/.docker/cli-plugins"
            curl -fsSL --proto '=https' --tlsv1.2 \
              https://github.com/docker/compose/releases/download/v5.6.0/docker-compose-linux-x86_64 \
              -o "$HOME/.docker/cli-plugins/docker-compose"
            chmod 0755 "$HOME/.docker/cli-plugins/docker-compose"
            docker compose version
      - run:
          name: hadolint (Dockerfile.bioetl)
          command: |
            curl -fsSL --proto '=https' --tlsv1.2 \
              https://github.com/hadolint/hadolint/releases/download/v2.15.1/hadolint-Linux-x86_64 \
              -o "$HOME/.local/bin/hadolint"
            chmod 0755 "$HOME/.local/bin/hadolint"
            "$HOME/.local/bin/hadolint" Dockerfile.bioetl
      - run:
          name: docker compose config validation
          environment:
            # Interpolation only; these values never start a runtime.
            NEO4J_PASSWORD: ci-compose-validation-placeholder
            GF_SECURITY_ADMIN_PASSWORD: ci-compose-validation-placeholder
            GF_RENDERING_RENDERER_TOKEN: ci-compose-validation-placeholder
          command: |
            docker compose config > /dev/null
            docker compose -f docker-compose.monitoring.yml config > /dev/null
      - run:
          name: docker build (Dockerfile.bioetl)
          command: docker build -f Dockerfile.bioetl -t bioetl:ci .

  # --- Aggregator (mirrors pr-gate-complete; stable name for future rulesets) -------
  pr-gate-complete:
    docker:
      - image: cimg/base:stable
    resource_class: small
    steps:
      - run:
          name: PR gate complete
          command: echo "All required CircleCI gates passed."

  composite-closeout:
    docker:
      - image: cimg/python:3.12
    resource_class: medium
    steps:
      - checkout
      - setup-python-uv:
          extras: "dev tracing docs"
      - run:
          name: "Scoped evidence for issues 11904 and 11905"
          command: |
            export PATH="$HOME/.local/bin:$PATH"
            export PYTHONPATH="$PWD/src:$PWD"
            export BIOETL_AI_RUNTIME=circleci BIOETL_AI_AGENT=composite-closeout BIOETL_AI_MEMORY_MODE=read-only
            export PYTEST_DISABLE_PLUGIN_AUTOLOAD=1
            uv run --frozen --no-build python - \<<'PY'
            import datetime, json, os, pathlib, subprocess, sys, time
            root = pathlib.Path.cwd()
            run_id = "issues-11904-11905-ci-" + os.environ["CIRCLE_BUILD_NUM"]
            folder = root / "reports/quality/proof-or-stop" / run_id
            folder.mkdir(parents=True, exist_ok=False)
            prefix = [sys.executable, "-m", "scripts.engineering.qa", "proof-or-stop"]
            common = ["--task-id", "issues-11904-11905", "--claim", "done", "--run-id", run_id]
            identity = ["--trust-tier", "ci", "--ci-run-id", os.environ["CIRCLE_BUILD_URL"]]
            subprocess.run(prefix + ["plan"] + common + ["--ci-run-id", os.environ["CIRCLE_BUILD_URL"]], check=True)
            paths = ['tests/unit/interfaces/http/test_composite_child_artifact.py', 'tests/integration/adapters/test_http_retry_semantics.py', 'tests/integration/infrastructure/storage/test_composite_checkpoint_writer.py', 'tests/integration/test_health_replay_production_bootstrap.py', 'tests/unit/application/services/lineage/test_composite_source_identity.py', 'tests/integration/test_composite_report.py', 'tests/unit/application/services/test_metadata_lineage_node_builders.py', 'tests/unit/composition/bootstrap/runtime/test_composite_bootstrap_builders.py', 'tests/unit/composition/bootstrap/runtime/test_composite_gold_dependencies.py', 'tests/unit/composition/bootstrap/runtime/test_runtime_basics.py', 'tests/unit/composition/bootstrap/test_health_replay_object_wiring.py', 'tests/unit/composition/factories/datasource/test_http_client_factory.py', 'tests/unit/domain/composite/test_composite_result.py', 'tests/unit/infrastructure/adapters/http/test_client_retry_mixin.py', 'tests/unit/infrastructure/adapters/http/test_request_timing.py', 'tests/unit/infrastructure/adapters/semanticscholar/test_batch_request_mixin.py', 'tests/unit/infrastructure/adapters/semanticscholar/test_fallback.py', 'tests/unit/infrastructure/storage/support/test_checkpoint_writer.py', 'tests/unit/infrastructure/storage/test_lineage_persistence.py', 'tests/unit/interfaces/cli/commands/test_composite_warning_result.py', 'tests/unit/interfaces/cli/commands/test_run_composite.py', 'tests/unit/interfaces/http/test_selected_run_status.py', 'tests/unit/interfaces/http/test_selected_run_unfinished_evidence.py', 'tests/unit/infrastructure/adapters/http/test_provider_scope.py', 'tests/unit/infrastructure/storage/test_composite_replay_inputs.py', 'tests/integration/composite/test_assay_snapshot_merge_replay.py', 'tests/unit/infrastructure/storage/test_composite_replay_bundle.py', 'tests/unit/interfaces/cli/test_cli_root_help_uniqueness.py', 'tests/unit/interfaces/cli/test_cli_main_module.py', 'tests/unit/application/composite/test_merger_metrics_mixin.py', 'tests/unit/application/composite/test_dependency_coordinator.py', 'tests/unit/application/composite/test_dependency_progress_tracker.py', 'tests/unit/application/composite/test_composite_activity.py', 'tests/unit/scripts/qa/test_report_debt_governance_gates.py', 'tests/unit/scripts/qa/test_report_architecture_debt_remote_main_baseline.py']
            checks = [
                ("tests", "test_health", [sys.executable, "-m", "pytest", "-o", "addopts=", "-p", "pytest_asyncio.plugin", "-p", "pytest_timeout", "-p", "respx.plugin", "-p", "pytest_cov.plugin", "-p", "_hypothesis_pytestplugin", *paths, "--no-cov", "-q", "--tb=short", "--junitxml=" + str(folder / "tests.xml")]),
                ("governance", "pretest_guardrails", ["bash", "scripts/engineering/dev/pretest_guardrails.sh", "--mode", "check", "--scope", "governance"]),
                ("docs_runtime", "docs_runtime_checks", [sys.executable, "-m", "scripts.docs", "verify"]),
                ("debt", "debt_governance_gates", [sys.executable, "-m", "scripts.engineering.qa", "report-debt-governance-gates", "--check"]),
            ]
            receipts = []
            for kind, producer, command in checks:
                started = datetime.datetime.now(datetime.UTC).isoformat()
                clock = time.monotonic()
                log = folder / (kind + ".log")
                with log.open("w") as stream:
                    result = subprocess.run(command, stdout=stream, stderr=subprocess.STDOUT)
                normalized = " ".join(["python", *command[1:]]) if command[0] == sys.executable else " ".join(command)
                output = folder / "receipts" / (kind + ".json")
                subprocess.run(prefix + ["receipt"] + common + identity + ["--receipt-id", kind, "--producer", producer, "--evidence-kind", kind, "--command", normalized, "--started-at", started, "--duration-ms", str(int((time.monotonic()-clock)*1000)), "--exit-code", str(result.returncode), "--status", "pass" if result.returncode == 0 else "fail", "--output-artifact", str(log), "--output", str(output)], check=True)
                receipts += ["--receipt", str(output)]
                print(kind, result.returncode, flush=True)
            subprocess.run(prefix + ["assemble"] + common + identity + ["--actor", "circleci", "--runtime", "circleci"] + receipts, check=True)
            result = subprocess.run(prefix + ["verify", "--bundle", str(folder / "bundle.json"), "--output", str(folder / "verification.json")])
            sys.exit(result.returncode)
            PY
      - store_test_results:
          path: reports/quality/proof-or-stop
      - store_artifacts:
          path: reports/quality/proof-or-stop
          destination: composite-closeout

  proof-closeout:
    docker:
    - image: cimg/python:3.12
    resource_class: medium
    steps:
    - checkout
    - setup-python-uv:
        extras: dev tracing docs
    - run:
        name: Verify complete source history and current main base
        command: "export PATH=\"$PWD/.venv/bin:$HOME/.local/bin:$PATH\"\ngit fetch --no-tags origin main:refs/remotes/origin/main\n\
          if [ \"$(git rev-parse --is-shallow-repository)\" = true ]; then\n  git fetch --unshallow origin\nfi\npython\
          \ scripts/engineering/repo/check_no_partial_tree.py --base origin/main --tip HEAD\n"
    - run:
        name: Source-bound full coverage and Proof-or-Stop acceptance
        no_output_timeout: 30m
        command: "export PATH=\"$PWD/.venv/bin:$HOME/.local/bin:$PATH\"\nexport PYTHONPATH=\"$PWD/src\" PYTHONUTF8=1\n\
          export BIOETL_AI_MEMORY_MODE=off BIOETL_SKIP_PREFLIGHT=1 BIOETL_SKIP_SETUP_PLUGINS=1\nexport OPENBLAS_NUM_THREADS=1\
          \ OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 NUMEXPR_NUM_THREADS=1\n# Preserve resolved PATH; isolate child shell probes from CircleCI BASH_ENV.\nunset BASH_ENV\npython - \\<<'CLOSEOUT_PY'\n\"\"\"Candidate\
          \ embedded runner; execute only in a genuine CircleCI checkout.\"\"\"\nfrom datetime import UTC, datetime\n\
          from pathlib import Path\nimport json\nimport hashlib\nimport os\nimport subprocess\nimport time\n\nroot\
          \ = Path.cwd().resolve()\nhead = subprocess.check_output([\"git\", \"rev-parse\", \"HEAD\"], text=True).strip()\n\
          assert os.environ.get(\"CIRCLECI\") == \"true\", \"A local execution cannot emit CI receipts\"\nassert os.environ.get(\"\
          CIRCLE_SHA1\") == head\nassert os.environ.get(\"CIRCLE_PROJECT_USERNAME\") == \"SatoryKono\"\nassert os.environ.get(\"\
          CIRCLE_PROJECT_REPONAME\") == \"BioactivityDataAcquisition\"\nci_id = os.environ[\"CIRCLE_BUILD_URL\"]\n\
          assert ci_id.startswith(\"https://\") and os.environ[\"CIRCLE_WORKFLOW_ID\"]\nrun_id = \"circleci-closeout-\"\
          \ + os.environ[\"CIRCLE_BUILD_NUM\"] + \"-\" + head[:12]\nout = root / \"reports/quality/proof-or-stop\"\
          \ / run_id\nout.mkdir(parents=True, exist_ok=False)\nsecret_values = sorted({value for key, value in os.environ.items()\n\
          \                        if len(value) >= 8 and any(part in key.upper() for part in\n                  \
          \      (\"TOKEN\", \"PASSWORD\", \"SECRET\", \"API_KEY\", \"ACCESS_KEY\"))}, key=len, reverse=True)\n\n\
          def sanitize(path):\n    original = path.read_text(encoding=\"utf-8\", errors=\"replace\")\n    clean =\
          \ original\n    for value in secret_values:\n        clean = clean.replace(value, \"[REDACTED_CI_SECRET]\"\
          )\n    if clean != original:\n        path.write_text(clean, encoding=\"utf-8\")\n\ndef execute(name, command):\n\
          \    log = out / (name + \".log\")\n    started = datetime.now(UTC).isoformat()\n    clock = time.monotonic()\n\
          \    print(\"[closeout] start \" + name, flush=True)\n    with log.open(\"w\", encoding=\"utf-8\") as stream:\n\
          \        result = subprocess.run(command, stdout=stream, stderr=subprocess.STDOUT, check=False)\n    duration\
          \ = round((time.monotonic() - clock) * 1000)\n    sanitize(log)\n    assert subprocess.check_output([\"\
          git\", \"rev-parse\", \"HEAD\"], text=True).strip() == head\n    record = dict(command=command, cwd=str(root),\
          \ started_at=started,\n                  duration_ms=duration, exit_code=result.returncode,\n          \
          \        head_before=head, head_after=head, log=str(log))\n    (out / (name + \".record.json\")).write_text(json.dumps(record,\
          \ indent=2) + \"\\n\", encoding=\"utf-8\")\n    print(f\"[closeout] {name} exit={result.returncode}\", flush=True)\n\
          \    return record\n\nprefix = [\"python\", \"-m\", \"scripts.engineering.qa\", \"proof-or-stop\"]\ncommon\
          \ = [\"--run-id\", run_id, \"--task-id\", \"architecture-coverage-11854-11899\",\n          \"--claim\"\
          , \"ready_to_merge\", \"--ci-run-id\", ci_id]\nassert execute(\"plan\", prefix + [\"plan\", *common, \"\
          --output\", str(out / \"plan.json\")])[\"exit_code\"] == 0\n(out / \"ci-identity.json\").write_text(json.dumps({\n\
          \    key: os.environ[key] for key in (\"CIRCLE_SHA1\", \"CIRCLE_BUILD_URL\", \"CIRCLE_BUILD_NUM\",\n   \
          \                                \"CIRCLE_WORKFLOW_ID\", \"CIRCLE_PROJECT_USERNAME\",\n                \
          \                   \"CIRCLE_PROJECT_REPONAME\", \"CIRCLE_BRANCH\")\n}, indent=2) + \"\\n\", encoding=\"\
          utf-8\")\ncoverage = out / \"coverage\"\ncoverage_record = execute(\"coverage-17\", [\"python\", \"-m\"\
          , \"scripts.engineering.qa.run_local_coverage_verify\",\n                                         \"--scratch-dir\"\
          , str(coverage)])\nfor path in coverage.rglob(\"*\"):\n    if path.is_file() and path.suffix in {\".log\"\
          , \".xml\", \".json\"}:\n        sanitize(path)\nassert coverage_record[\"exit_code\"] == 0, \"Incomplete\
          \ coverage cannot qualify closeout\"\nmanifest = json.loads((coverage / \"manifest.json\").read_text(encoding=\"\
          utf-8\"))\nassert manifest[\"complete\"] is True and manifest[\"head\"] == head\nassert len(manifest[\"\
          required_shards\"]) == len(manifest[\"shards\"]) == 17\nassert {row[\"name\"] for row in manifest[\"shards\"\
          ]} == set(manifest[\"required_shards\"])\nassert all(row[\"exit_code\"] == 0 and row[\"junit_file\"] and\
          \ row[\"coverage_sha256\"]\n           for row in manifest[\"shards\"])\nassert hashlib.sha256((coverage\
          \ / \"coverage.xml\").read_bytes()).hexdigest() == manifest[\"coverage_xml_sha256\"]\nchecks = [\n    (\"\
          tests\", \"test_health\", [\"python\", \"-m\", \"pytest\", \"tests/architecture\", \"-q\", \"--no-cov\"\
          ,\n                              \"--junitxml=\" + str(out / \"architecture.xml\")]),\n    (\"governance\"\
          , \"pretest_guardrails\", [\"bash\", \"scripts/engineering/dev/pretest_guardrails.sh\",\n              \
          \                            \"--mode\", \"check\", \"--scope\", \"governance\", \"--skip-cleanup\",\n \
          \                                         \"--report-json\", str(out / \"governance.json\")]),\n    (\"\
          docs_runtime\", \"docs_runtime_checks\", [\"python\", \"-m\", \"scripts.docs\", \"verify\"]),\n    (\"debt\"\
          , \"debt_governance_gates\", [\"python\", \"-m\", \"scripts.engineering.qa\",\n                        \
          \               \"report-debt-governance-gates\", \"--check\"]),\n    (\"quality\", \"quality_integral_gate\"\
          , [\"python\", \"-m\", \"scripts.engineering.ci.quality_integral_gate\",\n                             \
          \             \"--coverage-xml\", str(coverage / \"coverage.xml\"),\n                                  \
          \        \"--output\", str(out / \"quality.json\")]),\n]\nreceipts = []\nfor kind, producer, command in\
          \ checks:\n    record = execute(kind, command)\n    receipt = out / \"receipts\" / (kind + \".json\")\n\
          \    arguments = [\"receipt\", *common, \"--receipt-id\", kind, \"--producer\", producer,\n            \
          \     \"--evidence-kind\", kind, \"--command\", \" \".join(command),\n                 \"--cwd\", str(root),\
          \ \"--started-at\", record[\"started_at\"],\n                 \"--duration-ms\", str(record[\"duration_ms\"\
          ]), \"--exit-code\", str(record[\"exit_code\"]),\n                 \"--status\", \"pass\" if record[\"exit_code\"\
          ] == 0 else \"fail\",\n                 \"--output-artifact\", record[\"log\"], \"--trust-tier\", \"ci\"\
          , \"--output\", str(receipt)]\n    arguments.extend(\"--argv=\" + arg for arg in command)\n    assert execute(\"\
          receipt-\" + kind, prefix + arguments)[\"exit_code\"] == 0\n    receipts.extend([\"--receipt\", str(receipt)])\n\
          assert execute(\"assemble\", prefix + [\"assemble\", *common, \"--actor\", \"circleci\",\n             \
          \                        \"--runtime\", \"ci\", \"--trust-tier\", \"ci\", *receipts,\n                 \
          \                    \"--output\", str(out / \"bundle.json\")])[\"exit_code\"] == 0\nverification = execute(\"\
          verify\", prefix + [\"verify\", \"--bundle\", str(out / \"bundle.json\"),\n                            \
          \               \"--output\", str(out / \"verification.json\")])\nraise SystemExit(verification[\"exit_code\"\
          ] or coverage_record[\"exit_code\"])\nCLOSEOUT_PY\n"
    - run:
        name: Publish bounded sanitized execution evidence
        when: always
        command: "python - \\<<'ARTIFACT_PY'\nfrom pathlib import Path\nimport os\nimport shutil\nfrom xml.etree import\
          \ ElementTree as ET\n\nroot = Path(\"reports/quality/proof-or-stop\")\nname = \"circleci-closeout-\" + os.environ[\"\
          CIRCLE_BUILD_NUM\"] + \"-\" + os.environ[\"CIRCLE_SHA1\"][:12]\nsource = root / name\ndestination = root\
          \ / \"circleci-artifacts\"\nsecrets = sorted({value for key, value in os.environ.items() if len(value) >=\
          \ 8 and\n                  any(part in key.upper() for part in (\"TOKEN\", \"PASSWORD\", \"SECRET\", \"\
          API_KEY\", \"ACCESS_KEY\"))}, key=len, reverse=True)\nfor path in source.rglob(\"*\"):\n    relative = path.relative_to(source)\n\
          \    if path.is_symlink() or not path.is_file() or path.suffix not in {\".json\", \".xml\", \".log\"}:\n\
          \        continue\n    if any(part in {\"pycache\", \"hypothesis\", \"shards\", \"combined\"} for part in\
          \ relative.parts):\n        continue\n    text = path.read_text(encoding=\"utf-8\", errors=\"replace\")\n\
          \    for value in secrets:\n        text = text.replace(value, \"[REDACTED_CI_SECRET]\")\n    target = destination\
          \ / \"evidence\" / name / relative\n    target.parent.mkdir(parents=True, exist_ok=True)\n    target.write_text(text,\
          \ encoding=\"utf-8\")\n    junit_root = None\n    if path.suffix == \".xml\":\n        try:\n          \
          \  junit_root = ET.fromstring(text).tag\n        except ET.ParseError:\n            print(\"Retained incomplete\
          \ XML as diagnostics:\", relative)\n    if junit_root in {\"testsuites\", \"testsuite\"}:\n        junit\
          \ = destination / \"junit\" / relative\n        junit.parent.mkdir(parents=True, exist_ok=True)\n      \
          \  shutil.copyfile(target, junit)\nprint(\"Published actual JSON/XML/log evidence; raw coverage SQLite and\
          \ caches remain on the CI host\")\nARTIFACT_PY\n"
    - store_test_results:
        path: reports/quality/proof-or-stop/circleci-artifacts/junit
    - store_artifacts:
        path: reports/quality/proof-or-stop/circleci-artifacts/evidence
        destination: proof-or-stop

workflows:
  version: 2
  pr-gate:
    jobs:
      - composite-closeout:
          filters:
            branches:
              only: /codex\/issues-11904-11905-closeout/
      - classify
      - lint-ruff:
          requires: [classify]
      - lint-arch:
          requires: [classify]
      - arch-tests:
          requires: [classify]
      - mypy:
          requires: [classify]
      - dependency-lock:
          requires: [classify]
      - test-fast:
          requires: [classify]
          matrix:
            parameters:
              test-group:
                - "unit-domain|tests/unit/domain/"
                - "unit-application|tests/unit/application/"
                - "unit-infrastructure|tests/unit/infrastructure/"
                - "unit-other|tests/unit/ --ignore=tests/unit/domain/ --ignore=tests/unit/application/ --ignore=tests/unit/infrastructure/ --ignore=tests/unit/scripts/ --ignore=tests/unit/repo_backed/"
      - test-integration:
          requires: [classify]
          matrix:
            parameters:
              test-group:
                - "unit-domain|tests/unit/domain/|-n auto --dist loadscope"
                - "unit-application|tests/unit/application/|-n auto --dist loadscope"
                - "unit-infrastructure|tests/unit/infrastructure/|-n auto --dist loadscope"
                - "unit-other|tests/unit/ --ignore=tests/unit/domain/ --ignore=tests/unit/application/ --ignore=tests/unit/infrastructure/ --ignore=tests/unit/scripts/ --ignore=tests/unit/repo_backed/|-n auto --dist loadscope"
                - "integration|tests/integration/|-p no:xdist"
                - "security|tests/security/|-n auto --dist loadscope"
      - dq-consistency:
          requires: [classify]
      - root-hygiene:
          requires: [classify]
      - compiled-artifacts:
          requires: [classify]
      - security-scans:
          requires: [classify]
      - duplication:
          requires: [classify]
      - schema-governance:
          requires: [classify]
      - commit-lint:
          requires: [classify]
      - docs-governance:
          requires: [classify]
      - docker-build:
          requires: [classify]
      - pr-gate-complete:
          requires:
            - lint-ruff
            - lint-arch
            - arch-tests
            - mypy
            - dependency-lock
            - test-fast
            - test-integration
            - dq-consistency
            - root-hygiene
            - compiled-artifacts
            - security-scans
            - duplication
            - schema-governance
            - commit-lint
            - docs-governance
            - docker-build

  architecture-coverage-closeout:
    jobs:
      - proof-closeout:
          filters:
            branches:
              only: codex/architecture-coverage-final-20261004
