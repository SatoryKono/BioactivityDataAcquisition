  e2e-matrix-live:
    docker:
      - image: cimg/python:3.13
    resource_class: medium
    environment:
      BIOETL_TEST_MODE: "false"
      BIOETL_PIPELINE__HEALTH_CHECK_MODE: strict
      VCR_RECORD_MODE: new_episodes
    steps:
      - checkout
      - setup-python-uv:
          python-version: "3.13"
      - run:
          name: Run explicitly selected strict live provider matrix
          no_output_timeout: 31m
          command: |
            timeout --signal=TERM --kill-after=30s 30m bash -euo pipefail \<<'LIVE'
            [[ "$CIRCLE_BRANCH" == main ]]
            [[ "$BIOETL_TEST_MODE" == false ]]
            [[ "$BIOETL_PIPELINE__HEALTH_CHECK_MODE" == strict ]]
            mkdir -p reports/e2e
            set +e
            uv run --frozen --no-build pytest tests/e2e/test_pipeline_matrix_e2e.py \
              -k test_pipeline_matrix_smoke -m "e2e_smoke and not benchmark and not memory" \
              --vcr-record=new_episodes -q --tb=short \
              --junitxml=reports/e2e/matrix-smoke-live.xml
            result=$?
            set -e
            printf '%s\n' "$result" > reports/e2e/pytest_exit_code_live.txt
            [[ "$result" == 0 ]]
            EXPECTED_TOTAL="$(uv run --frozen --no-build python -c 'from tests.e2e.test_pipeline_matrix_e2e import ACTIVE_PIPELINE_CASES; print(len(ACTIVE_PIPELINE_CASES))')"
            MAX_SKIPS="$(uv run --frozen --no-build python -c "print(int(${EXPECTED_TOTAL} * 0.15))")"
            uv run --frozen --no-build python scripts/engineering/ci/check_e2e_matrix_skip_rate.py \
              --junit reports/e2e/matrix-smoke-live.xml --expected-total "$EXPECTED_TOTAL" \
              --max-skips "$MAX_SKIPS" --max-skip-rate 0.15 \
              --markdown-out reports/e2e/matrix-smoke-live-summary.md
            LIVE
      - store_test_results:
          path: reports/e2e
      - store_artifacts:
          path: reports/e2e
          destination: e2e-live

  e2e-matrix-replay:
    docker:
      - image: cimg/python:3.13
    resource_class: medium
    environment:
      BIOETL_TEST_MODE: "true"
      BIOETL_PIPELINE__HEALTH_CHECK_MODE: probe
      VCR_RECORD_MODE: none
    steps:
      - checkout
      - halt-unless-pr-gate-paths:
          label: e2e replay matrix
          pathspecs: tests/e2e tests/fixtures/vcr scripts/engineering/ci/check_e2e_matrix_skip_rate.py scripts/engineering/ci/check_e2e_rerun_stability.py configs/entities .circleci/config.yml
      - setup-python-uv:
          python-version: "3.13"
      - run:
          name: Enforce three-run E2E replay and skip-rate contracts
          command: |
            set -euo pipefail
            timeout 25m bash -eo pipefail \<<'E2E_REPLAY'
            mkdir -p reports/e2e
            for run in 1 2 3; do
              set +e
              VCR_RECORD_MODE=none uv run --frozen --no-build pytest \
                tests/e2e/test_pipeline_matrix_e2e.py \
                -k "test_pipeline_matrix_smoke" \
                --record-mode=none \
                -q --tb=short \
                --junitxml="reports/e2e/matrix-smoke-run${run}.xml"
              echo $? > "reports/e2e/pytest_exit_code_run${run}.txt"
              set -e
            done

            mkdir -p reports/e2e
            VCR_RECORD_MODE=none uv run --frozen --no-build pytest \
              tests/e2e/test_chembl_activity_e2e.py \
              -m "e2e_smoke and not benchmark and not memory" \
              --record-mode=none \
              -q --tb=short \
              --junitxml=reports/e2e/chembl_activity_smoke.xml

            # Expected total must match the active smoke matrix (not raw
            # configs/entities/*.yaml count), which includes deferred exclusions.
            EXPECTED_TOTAL="$(
              uv run --frozen --no-build python -c \
                "from tests.e2e.test_pipeline_matrix_e2e import ACTIVE_PIPELINE_CASES; print(len(ACTIVE_PIPELINE_CASES))"
            )"
            MAX_SKIPS="$(
              uv run --frozen --no-build python -c \
                "print(int(${EXPECTED_TOTAL} * 0.15))"
            )"
            uv run --frozen --no-build python scripts/engineering/ci/check_e2e_matrix_skip_rate.py \
              --junit reports/e2e/matrix-smoke-run3.xml \
              --expected-total "${EXPECTED_TOTAL}" \
              --max-skips "${MAX_SKIPS}" \
              --max-skip-rate 0.15 \
              --markdown-out reports/e2e/matrix-smoke-summary.md

            uv run --frozen --no-build python scripts/engineering/ci/check_e2e_rerun_stability.py \
              --junit-glob "reports/e2e/matrix-smoke-run*.xml" \
              --required-runs 3 \
              --max-recurrent-infra-flaky 0 \
              --max-recurrent-code-regression 0 \
              --markdown-out reports/e2e/matrix-rerun-stability.md

            fail=0
            for run in 1 2 3; do
              rc="$(cat "reports/e2e/pytest_exit_code_run${run}.txt")"
              if [ "$rc" != "0" ]; then
                echo "pytest matrix smoke run ${run} exited ${rc}"
                fail=1
              fi
            done
            if [ "$fail" != "0" ]; then
              exit 1
            fi
            E2E_REPLAY
      - store_test_results:
          path: reports/e2e
      - store_artifacts:
          path: reports/e2e
          destination: e2e-matrix-replay

  github-settings-review:
    docker:
      - image: cimg/python:3.13
    resource_class: small
    steps:
      - checkout
      - setup-python-uv:
          python-version: "3.13"
      - run:
          name: Install checksum-pinned GitHub CLI 2.102.0
          command: |
            set -euo pipefail
            test "$(uname -m)" = x86_64
            ARCHIVE="$(mktemp)"
            DESTINATION="$(mktemp -d)"
            trap 'rm -f "$ARCHIVE"; rm -rf "$DESTINATION"' EXIT
            curl --fail --location --retry 3 \
              https://github.com/cli/cli/releases/download/v2.102.0/gh_2.102.0_linux_amd64.tar.gz \
              --output "$ARCHIVE"
            printf '%s  %s\n' bb766f710eef8ede859c18578c72c327597cd4c8a85b06001b1f3843c6019386 "$ARCHIVE" | sha256sum --check -
            tar -xzf "$ARCHIVE" -C "$DESTINATION"
            mkdir -p "$HOME/.local/bin"
            install -m 0755 "$DESTINATION/gh_2.102.0_linux_amd64/bin/gh" "$HOME/.local/bin/gh"
            "$HOME/.local/bin/gh" --version
      - run:
          name: Collect read-only GitHub settings evidence
          command: |
            mkdir -p reports/github-settings
            uv run --frozen --no-build python -m scripts.engineering.repo github-settings-review \
              --json-out reports/github-settings/review.json \
              --markdown-out reports/github-settings/review.md
      - store_artifacts:
          path: reports/github-settings

  # Prepared manual/scheduled lane; external schedule registration is separate.
  docs-kpi:
    docker:
